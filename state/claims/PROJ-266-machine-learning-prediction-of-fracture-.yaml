  canonical: average grain size approaches 3-4 pixels causes CNN to struggle with
    grain boundary characteristics
  claim_id: c_d5430f81
  context: Our analysis indicates that when the average grain size approaches 3-4
    pixels, the CNN struggles to distinguish grain boundary characteristics, leading
    to a degradation in prediction accuracy. This 'resolution limit' suggests that
    for real-world applications, the imaging technique (e.g., EBSD, SEM) must be selected
    such that the smallest critical microstructural feature is resolved by at least
    10 pixels.
