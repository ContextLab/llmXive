      quote: "Tetrahedral coordination is a major structural motif in silicon chemistry\
        \ just as it is for carbon chemistry. However, the 3p subshell is rather more\
        \ diffuse than the 2p subshell and does not hybridise so well with the 3s\
        \ subshell. As a result, the chemistry of silicon and its heavier congeners\
        \ shows significant differences from that of carbon, and thus octahedral coordination\
        \ is also significant. For example, the electronegativity of silicon (1.90)\
        \ is much less than that of carbon (2.55), because the valence electrons of\
        \ silicon are further from the nucleus than those of carbon and hence experience\
        \ smaller electrostatic forces of attraction from the nucleus. The poor overlap\
        \ of 3p orbitals also results in a much lower tendency toward catenation (formation\
        \ of Si\u2013Si bonds) for silicon than for carbon, due to the concomitant\
        \ weakening of the Si\u2013Si bond compared to the C\u2013C bond: the average\
        \ Si\u2013Si bond energy is approximately 226 kJ/mol, compared to a value\
        \ of 356 kJ/mol for the C\u2013C bond. This results in multiply bonded silicon\
        \ compounds generally being much less stable than their carbon counterparts,\
        \ an example of the double bond rule. On the other hand, the presence of radial\
        \ nodes in the 3p orbitals of silicon suggests the possibility of hypervalence,\
        \ as seen in five and six-coordinate derivatives of silicon such as SiX\u2212\
        5 and SiF2\u22126. Lastly, because of the increasing energy gap between the\
        \ valence s and p orbitals as the group is descended, the divalent state grows\
        \ in importance from carbon to lead, so that a few unstable divalent compounds\
        \ are known for silicon; this lowering of the main oxidation state, in tandem\
        \ with increasing atomic radii, results in an increase of metallic character\
        \ down the group. Silicon already shows some incipient metallic behavior,\
        \ particularly in the behavior of its oxide compounds and its reaction with\
        \ acids as well as bases (though this takes some effort), and is hence often\
        \ referred to as a metalloid rather than a nonmetal. Germanium shows more,\
        \ and tin is generally considered a metal."
