  canonical: Data loss calculation formula
  claim_id: c_ed7d204a
  context: 'Implement `code/main.py`: Orchestration logic. **Constraint**: Must read
    `data/raw/species_list.txt` (from T009) to calculate ''Total Target''. **Pre-condition**:
    Must verify `data/raw/species_list.txt` exists before proceeding; if missing,
    raise `FileNotFoundError`. Must distinguish between ''total data loss'' (>20%
    species missing BOTH sequence AND metabolite data -> HALT) and ''partial exclusion''
    (species missing KEGG only -> EXCLUDE from matrix, RETAIN in tree, LOG warning).
