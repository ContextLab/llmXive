[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investigating-the-relationship-between-m"
version = "0.1.0"
description = "Investigating the Relationship Between Molecular Topology and Reaction Selectivity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdkit",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "pyyaml",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.venv
    | venv
    | __pycache__
    | build
    | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (black handles this)
    "B008", # do not perform function calls in argument defaults (common in data classes)
]
extend-exclude = [
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]

[tool.ruff.isort]
known-first-party = ["code", "contracts", "tests"]
force-sort-within-sections = true
