$schema: "http://json-schema.org/draft-07/schema#"
title: "FEMNIST Dataset Schema"
description: "Schema for the raw FEMNIST parquet dataset used in the study."
type: "object"
properties:
  image:
    type: "array"
    items:
      type: "integer"
      minimum: 0
      maximum: 255
    description: "Flattened pixel values of a fixed resolution and intensity range."
  label:
    type: "integer"
    minimum: 0
    maximum: 61
    description: "Class label (representing digits and letters)."
  client_id:
    type: "string"
    description: "Original LEAF client identifier (kept for provenance)."
required:
  - image
  - label
  - client_id
additionalProperties: false