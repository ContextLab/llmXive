# Pre-commit configuration for PROJ-044
# Hooks: black (formatting), ruff (linting), pre-commit-hooks (safety checks)
#
# Usage:
#   1. Install pre-commit: pip install pre-commit
#   2. Install hooks: pre-commit install
#   3. Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        description: Trims trailing whitespace on all lines.
      - id: end-of-file-fixer
        name: Fix End of Files
        description: Ensures files end with a newline.
      - id: check-yaml
        name: Check YAML
        description: Validates YAML files.
      - id: check-json
        name: Check JSON
        description: Validates JSON files.
      - id: check-added-large-files
        name: Check for Large Files
        description: Prevents committing large files.
        args: ['--maxkb=1024']
      - id: check-merge-conflict
        name: Check for Merge Conflicts
        description: Detects merge conflict strings.

  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        name: Black Formatter
        description: Enforces consistent code formatting.
        language_version: python3.10

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        name: Ruff Linter
        description: Fast Python linter.
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Ruff Formatter
        description: Fast Python formatter (alternative to black, optional).
        # Uncomment if you prefer ruff-format over black, otherwise keep black only:
        # args: [--diff]