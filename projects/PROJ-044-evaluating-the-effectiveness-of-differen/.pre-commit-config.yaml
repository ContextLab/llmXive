# Pre-commit configuration for llmXive project
# Enforces black formatting, ruff linting, and standard hooks
# Run `pre-commit install` to set up git hooks
# Run `pre-commit run --all-files` to check all files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        description: Trims trailing whitespace.
      - id: end-of-file-fixer
        description: Ensures files end with a single newline.
      - id: check-yaml
        description: Validates YAML syntax.
      - id: check-json
        description: Validates JSON syntax.
      - id: check-added-large-files
        args: ['--maxkb=1024']
        description: Prevents large files from being committed.
      - id: check-case-conflict
        description: Checks for files that would conflict on case-insensitive filesystems.

  # Black: The uncompromising code formatter
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.10
        description: Formats Python code to 88 characters per line.

  # Ruff: An extremely fast Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: ['--fix']
        description: Lints Python code and attempts to fix issues automatically.
      - id: ruff-format
        description: Formats Python code (alternative to black, but we use black here for consistency).
        # Note: We primarily use Black for formatting, but Ruff can catch import sorting issues
        # If using ruff-format, ensure it aligns with black settings or disable black hook