$schema: "http://json-schema.org/draft-07/schema#"
title: "Learner Record Schema"
description: "Schema for the processed learner records used in the OULAD analysis. Note: response_timestamp is a proxy for student engagement, not instructor feedback."
type: "object"
properties:
  student_id:
    type: "string"
    description: "Unique identifier for the learner."
  course_id:
    type: "string"
    description: "Unique identifier for the course."
  final_grade:
    type: "number"
    description: "Final grade achieved by the learner."
  is_complete:
    type: "boolean"
    description: "Whether the learner completed the course."
  submission_timestamp:
    type: "string"
    format: "date-time"
    description: "Timestamp of the assessment submission (UTC)."
  response_timestamp:
    type: "string"
    format: "date-time"
    description: "Timestamp of the next student event (proxy for feedback) (UTC). May be null if no next event exists."
  proxy_source:
    type: "string"
    description: "Source of the proxy timestamp (e.g., 'next_forum', 'next_assessment')."
  feedback_interval:
    type: "number"
    description: "Time delta between submission and response in hours."
  feedback_group:
    type: "string"
    enum:
      - "Immediate"
      - "Delayed"
      - "Variable"
    description: "Binned category based on median feedback interval."
  num_past_attempts:
    type: "integer"
    description: "Number of past attempts."
  total_forum_posts:
    type: "integer"
    description: "Total forum posts (engagement control)."
  total_clicks:
    type: "integer"
    description: "Total clicks (engagement control)."
required:
  - student_id
  - course_id
  - final_grade
  - is_complete
  - submission_timestamp
  - feedback_interval
  - feedback_group
  - proxy_source
additionalProperties: false
