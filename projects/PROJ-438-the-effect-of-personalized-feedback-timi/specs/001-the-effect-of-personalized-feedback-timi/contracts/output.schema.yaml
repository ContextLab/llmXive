$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Results Schema"
description: "Schema for the final metrics and sensitivity analysis results."
type: "object"
properties:
  model_type:
    type: "string"
    description: "Type of statistical model used (e.g., Cluster-Robust OLS)."
  comparison_groups:
    type: "array"
    items:
      type: "string"
    description: "List of groups compared (e.g., Immediate vs Delayed)."
  results:
    type: "array"
    items:
      type: "object"
      properties:
        comparison:
          type: "string"
          description: "Name of the pairwise comparison (e.g., Immediate-Delayed)."
        p_value:
          type: "number"
          description: "P-value from the statistical test."
        effect_size:
          type: "number"
          description: "Cohen's d effect size."
        significant:
          type: "boolean"
          description: "Whether the result is significant at p < 0.05."
      required:
        - comparison
        - p_value
        - effect_size
        - significant
  sensitivity_analysis:
    type: "object"
    properties:
      stability_proportion:
        type: "number"
        description: "Proportion of sweeps where p < 0.05."
      flip_rate:
        type: "number"
        description: "Proportion of sweeps where the conclusion changes."
      boundary_sweeps_count:
        type: "integer"
        description: "Total number of boundary sweeps performed."
    required:
      - stability_proportion
      - flip_rate
      - boundary_sweeps_count
required:
  - model_type
  - comparison_groups
  - results
  - sensitivity_analysis
additionalProperties: false
