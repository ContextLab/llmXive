# Dataset Schema Definition for OULAD Feedback Timing Analysis
# Generated by T009a to support T009 schema validation
# This file defines the expected structure for input and output artifacts

version: "1.0"
description: "Schema for OULAD dataset validation and processed learner records"

input:
  students:
    required_columns:
      - code_module
      - code_presentation
      - id_student
      - gender
      - region
      - highest_education
      - imd_band
      - age_band
      - disability
    types:
      code_module: object
      code_presentation: object
      id_student: int64
      gender: object
      region: object
      highest_education: object
      imd_band: object
      age_band: object
      disability: object
    critical_columns:
      - code_module
      - code_presentation
      - id_student
    nullable:
      - gender
      - region
      - highest_education
      - imd_band
      - age_band
      - disability

  courses:
    required_columns:
      - code_module
      - code_presentation
      - version
      - module_presentation_length
    types:
      code_module: object
      code_presentation: object
      version: int64
      module_presentation_length: int64
    critical_columns:
      - code_module
      - code_presentation

  assessments:
    required_columns:
      - code_module
      - code_presentation
      - id_assessment
      - bdata
      - weight
      - time_to_result
    types:
      code_module: object
      code_presentation: object
      id_assessment: int64
      bdata: object
      weight: float64
      time_to_result: float64
    critical_columns:
      - code_module
      - code_presentation
      - id_assessment

  vle:
    required_columns:
      - code_module
      - code_presentation
      - date
      - id_site
      - sum_click
    types:
      code_module: object
      code_presentation: object
      date: int64
      id_site: int64
      sum_click: int64
    critical_columns:
      - code_module
      - code_presentation
      - date
      - id_site

  student_assessment:
    required_columns:
      - id_student
      - id_assessment
      - score
      - date
    types:
      id_student: int64
      id_assessment: int64
      score: int64
      date: int64
    critical_columns:
      - id_student
      - id_assessment
      - score

  student_forum:
    required_columns:
      - id_student
      - date
      - num_posts
    types:
      id_student: int64
      date: int64
      num_posts: int64
    critical_columns:
      - id_student
      - date

output:
  learners_raw:
    description: "Preprocessed learner records with feedback timestamps and grades"
    required_columns:
      - id_student
      - code_module
      - code_presentation
      - feedback_interval_hours
      - final_grade
      - is_complete
      - has_forum_interaction
      - has_submission
      - has_response
    types:
      id_student: int64
      code_module: object
      code_presentation: object
      feedback_interval_hours: float64
      final_grade: float64
      is_complete: bool
      has_forum_interaction: bool
      has_submission: bool
      has_response: bool
    critical_columns:
      - id_student
      - code_module
      - code_presentation
      - feedback_interval_hours
      - final_grade
      - is_complete
    categorical_values:
      is_complete: [true, false]
      has_forum_interaction: [true, false]
      has_submission: [true, false]
      has_response: [true, false]
    value_ranges:
      feedback_interval_hours:
        min: 0.0
        max: 720.0  # 30 days max
      final_grade:
        min: 0.0
        max: 100.0

  learners_binned:
    description: "Learners with calculated median intervals and timing groups"
    required_columns:
      - id_student
      - code_module
      - code_presentation
      - median_interval
      - feedback_group
      - final_grade
      - is_complete
    types:
      id_student: int64
      code_module: object
      code_presentation: object
      median_interval: float64
      feedback_group: object
      final_grade: float64
      is_complete: bool
    critical_columns:
      - id_student
      - code_module
      - code_presentation
      - median_interval
      - feedback_group
    categorical_values:
      feedback_group:
        - "Immediate"
        - "Delayed"
        - "Variable"
    value_ranges:
      median_interval:
        min: 0.0
        max: 720.0
      final_grade:
        min: 0.0
        max: 100.0

validation_rules:
  min_learners_per_course: 50
  max_null_ratio_critical: 0.0
  required_feedback_interval_min: 0.0
  required_feedback_interval_max: 720.0
  required_grade_min: 0.0
  required_grade_max: 100.0
  valid_groups:
    - "Immediate"
    - "Delayed"
    - "Variable"
  immediate_threshold_hours: 2.0
  delayed_max_hours: 48.0
