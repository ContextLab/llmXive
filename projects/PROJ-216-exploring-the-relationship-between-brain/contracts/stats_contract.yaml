name: stats_contract
version: "1.0.0"
description: Contract for statistical correlation analysis and Bonferroni correction.

input:
  type: object
  properties:
    graph_metrics_path:
      type: string
      description: Path to the aggregated graph metrics CSV.
    behavioral_scores_path:
      type: string
      description: Path to the behavioral scores (Fluid Intelligence) JSON/CSV.
    correction_method:
      type: string
      description: Multiple comparison correction method.
      enum:
        - bonferroni
      const: bonferroni
  required:
    - graph_metrics_path
    - behavioral_scores_path
    - correction_method

output:
  type: object
  properties:
    correlation_results_path:
      type: string
      description: Path to the correlation results CSV.
    schema:
      type: object
      properties:
        metric_name:
          type: string
        score_type:
          type: string
        correlation:
          type: number
        p_value:
          type: number
        p_adj_bonferroni:
          type: number
        cohens_d:
          type: number
        ci_lower:
          type: number
        ci_upper:
          type: number
      required:
        - metric_name
        - score_type
        - correlation
        - p_value
        - p_adj_bonferroni
        - cohens_d
        - ci_lower
        - ci_upper
    scatter_plot_path:
      type: string
      description: Path to the generated scatter plot PNG.
    summary_report_path:
      type: string
      description: Path to the generated summary PDF.
  required:
    - correlation_results_path
    - schema
    - scatter_plot_path
    - summary_report_path

validation_rules:
  - Must apply Bonferroni correction (FR-005 amended).
  - Must calculate Cohen's d and 95% confidence intervals.
  - Must halt if no valid Fluid Intelligence scores are found (TRACER: FR-005 Pivot to Bonferroni).
  - Must reference specs/amendment-001-fluid-intelligence-n10.md for FR-005 compliance.