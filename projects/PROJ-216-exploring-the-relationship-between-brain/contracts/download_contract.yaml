name: download_contract
version: "1.0.0"
description: Contract for OpenNeuro data download and validation (ds000224 primary, ds000230 fallback).

input:
  type: object
  properties:
    dataset_id:
      type: string
      description: OpenNeuro dataset identifier (e.g., ds000224).
      enum:
        - ds000224
        - ds000230
    output_dir:
      type: string
      description: Directory path where BIDS data will be downloaded.
    n_subjects:
      type: integer
      description: Maximum number of subjects to process (N=10 per amendment).
      minimum: 1
      maximum: 10
      default: 10
  required:
    - dataset_id
    - output_dir
    - n_subjects

output:
  type: object
  properties:
    valid_subjects_path:
      type: string
      description: Path to the generated valid_subjects.json file.
    schema:
      type: object
      properties:
        subjects:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Subject ID (e.g., sub-001).
              score:
                type: number
                description: Fluid Intelligence score.
              age:
                type: integer
                description: Subject age.
              gender:
                type: string
                description: Subject gender.
            required:
              - id
              - score
              - age
              - gender
        count:
          type: integer
          description: Total number of valid subjects.
      required:
        - subjects
        - count
  required:
    - valid_subjects_path
    - schema

validation_rules:
  - Must validate presence of Fluid Intelligence scores in sidecar JSONs.
  - Must exclude subjects missing age or gender metadata.
  - Must enforce N=10 sample limit.
  - Must halt with error if no valid subjects found.
  - Must reference specs/amendment-001-fluid-intelligence-n10.md for FR-001 compliance.
