# Download Contract: OpenNeuro Data Ingestion
# Defines the input and output schemas for the data download phase (T015).
# Enforces FR-001 (Fluid Intelligence Pivot) and N=10 limit.

name: download_contract
version: 1.0.0
description: Validates input parameters for OpenNeuro download and defines the schema for the resulting valid subjects list.

input:
  type: object
  required:
    - dataset_id
    - output_dir
    - n_subjects
  properties:
    dataset_id:
      type: string
      description: "OpenNeuro dataset identifier (e.g., 'ds000224' or 'ds000230')."
      enum:
        - ds000224
        - ds000230
    output_dir:
      type: string
      description: "Directory path where BIDS data will be downloaded."
    n_subjects:
      type: integer
      description: "Maximum number of subjects to process (N=10 baseline per amendment)."
      minimum: 1
      maximum: 10

output:
  type: object
  description: "Schema for data/processed/valid_subjects.json generated by fetch_openneuro_data()."
  properties:
    subjects:
      type: array
      description: "List of valid subjects with Fluid Intelligence scores."
      items:
        type: object
        required:
          - id
          - score
          - age
          - gender
        properties:
          id:
            type: string
            description: "Subject identifier (e.g., 'sub-001')."
          score:
            type: number
            description: "Fluid Intelligence score (normalized)."
          age:
            type: integer
            description: "Subject age in years."
          gender:
            type: string
            description: "Subject gender (M/F)."
    count:
      type: integer
      description: "Total number of valid subjects found."
      minimum: 0

validation_rules:
  - "If no subjects with 'fluid_intelligence_score' are found, the process MUST halt."
  - "Subjects missing age or gender metadata are excluded."
  - "Output count must be >= 1 to proceed to preprocessing."
