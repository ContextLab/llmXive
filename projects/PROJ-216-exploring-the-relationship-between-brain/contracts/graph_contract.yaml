name: graph_contract
version: "1.0.0"
description: Contract for functional connectivity matrix generation and graph metric computation.

input:
  type: object
  properties:
    preprocessed_nifti_path:
      type: string
      description: Path to the preprocessed NIfTI file.
    atlas_path:
      type: string
      description: Path to the Schaefer atlas label map (200-ROI).
    roi_count:
      type: integer
      description: Number of ROIs (fixed at 200 per FR-003).
      const: 200
  required:
    - preprocessed_nifti_path
    - atlas_path
    - roi_count

output:
  type: object
  properties:
    correlation_matrix_path:
      type: string
      description: Path to the symmetric correlation matrix (NIfTI or numpy file).
    graph_metrics:
      type: object
      properties:
        global_efficiency:
          type: number
        clustering_coefficient:
          type: number
        modularity:
          type: number
      required:
        - global_efficiency
        - clustering_coefficient
        - modularity
    validation_log_path:
      type: string
      description: Path to the validation log for numerical anomalies.
  required:
    - correlation_matrix_path
    - graph_metrics
    - validation_log_path

validation_rules:
  - Correlation matrix must be symmetric.
  - Modularity calculation must use Louvain algorithm with resolution sweep fallback.
  - Global efficiency and clustering coefficient must be within valid ranges [0, 1].
  - Atlas must contain exactly 200 ROI labels.
