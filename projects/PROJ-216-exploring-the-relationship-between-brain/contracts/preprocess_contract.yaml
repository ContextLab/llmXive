name: preprocess_contract
version: "1.0.0"
description: Contract for fMRI preprocessing pipeline (motion correction, normalization, bandpass filtering).

input:
  type: object
  properties:
    subject_path:
      type: string
      description: Path to the BIDS subject directory or raw NIfTI file.
    output_dir:
      type: string
      description: Directory where preprocessed data will be saved.
    tools:
      type: array
      items:
        type: string
        enum:
          - fsl_motion_correct
          - fsl_regfilt
          - fslmaths
      description: List of tools to use for preprocessing steps.
  required:
    - subject_path
    - output_dir
    - tools

output:
  type: object
  properties:
    preprocessed_nifti_path:
      type: string
      description: Path to the preprocessed NIfTI file (sub-{id}_preproc.nii.gz).
    motion_metrics:
      type: object
      properties:
        translation_mm:
          type: number
          description: Maximum translation in mm.
        rotation_mm:
          type: number
          description: Maximum rotation in mm.
      required:
        - translation_mm
        - rotation_mm
    log_path:
      type: string
      description: Path to the preprocessing log file.
  required:
    - preprocessed_nifti_path
    - motion_metrics
    - log_path

validation_rules:
  - FSL >= 6.0 and AFNI >= 21.0 must be available (verified via T014a).
  - Output NIfTI must have non-zero variance.
  - Motion metrics must be extracted from FSL mcflirt logs.
  - Exclusion logic must trigger if translation > 3mm or rotation > 2mm.
