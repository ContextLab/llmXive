# Standalone black configuration for CLI usage
# Mirrors pyproject.toml settings for standalone CLI execution

line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

exclude = '''
/(
    \.git
    | \.venv
    | venv
    | \.mypy_cache
    | \.pytest_cache
    | __pycache__
    | data
    | reports
    | build
    | dist
)/
'''
