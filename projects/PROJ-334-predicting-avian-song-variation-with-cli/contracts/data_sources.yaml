# Data Source Contracts for Project PROJ-334
# Defines external data sources, URLs, versions, and expected formats.
# These contracts ensure reproducibility and traceability of data ingestion.

sources:
  xeno_canto:
    name: "Xeno-Canto Bird Record Metadata"
    description: "Global database of bird sounds with species ID and location metadata."
    version: "v1.0.0"
    url: "https://xeno-canto.org/api/2/recordings.json?query=*"
    fetch_script: "code/fetch_xeno_canto.py"
    output_file: "data/raw/xeno_canto_raw.csv"
    schema_ref: "contracts/song_record.schema.yaml"
    fields:
      - name: "species_id"
        type: "string"
        description: "Xeno-Canto species code (e.g., Turdus_merula)"
      - name: "lat"
        type: "float"
        description: "Latitude in WGS84 (EPSG:4326)"
      - name: "lon"
        type: "float"
        description: "Longitude in WGS84 (EPSG:4326)"
      - name: "song_metric_1"
        type: "float"
        description: "Primary song metric (e.g., duration or frequency)"
      - name: "song_metric_2"
        type: "float"
        description: "Secondary song metric"
    rate_limit:
      requests_per_minute: 60
      delay_seconds: 1.0
    retry_policy:
      max_retries: 3
      backoff_seconds: 5

  worldclim:
    name: "WorldClim v2.1 Climate Data"
    description: "High-resolution global climate data (temperature, precipitation, elevation)."
    version: "2.1"
    base_url: "https://biogeo.ucdavis.edu/data/worldclim/v2.1"
    fetch_script: "code/fetch_worldclim.py"
    output_file: "data/raw/worldclim_raw.csv"
    schema_ref: "contracts/climate_snapshot.schema.yaml"
    resolution: "30s" # ~1km
    variables:
      - name: "bio1"
        description: "Annual Mean Temperature"
        units: "degrees Celsius * 10"
        url_suffix: "wc2.1_30s_tavg.zip"
      - name: "bio12"
        description: "Annual Precipitation"
        units: "mm * 10"
        url_suffix: "wc2.1_30s_prec.zip"
      - name: "elev"
        description: "Elevation"
        units: "meters"
        url_suffix: "wc2.1_30s_elev.zip"
    fields:
      - name: "lat"
        type: "float"
        description: "Latitude in WGS84 (EPSG:4326)"
      - name: "lon"
        type: "float"
        description: "Longitude in WGS84 (EPSG:4326)"
      - name: "temperature"
        type: "float"
        description: "Annual mean temperature (°C)"
      - name: "precipitation"
        type: "float"
        description: "Annual precipitation (mm)"
      - name: "elevation"
        type: "float"
        description: "Elevation (m)"
    fetch_strategy: "chunked_download"
    expected_crs: "EPSG:4326"

verification:
  checksum_algorithm: "SHA256"
  checksum_file: "data/checksums.txt"
  state_file: "state/projects/PROJ-334-predicting-avian-song-variation-with-cli.yaml"
  fail_on_missing: true
  fail_on_checksum_mismatch: true

metadata:
  created_at: "2023-10-27"
  updated_at: "2023-10-27"
  maintained_by: "llmXive Pipeline"
  license: "CC-BY-4.0" # Xeno-Canto
  citation: "WorldClim v2.1 (Fick & Hijmans, 2017)"