$schema: "http://json-schema.org/draft-07/schema#"
title: "ClimateSnapshot Schema"
description: "Schema for climate variables extracted from WorldClim v2.1 at specific coordinates."
type: object
required:
  - lat
  - lon
  - temperature
  - precipitation
  - elevation
properties:
  lat:
    type: number
    description: "Latitude of the sampling point in decimal degrees (WGS84)."
    minimum: -90
    maximum: 90
  lon:
    type: number
    description: "Longitude of the sampling point in decimal degrees (WGS84)."
    minimum: -180
    maximum: 180
  temperature:
    type: number
    description: "Mean annual temperature (°C) from WorldClim."
  precipitation:
    type: number
    description: "Mean annual precipitation (mm) from WorldClim."
  elevation:
    type: number
    description: "Elevation (m) from WorldClim."
additionalProperties: true
