$schema: http://json-schema.org/draft-07/schema#
title: ClimateSnapshot
description: Schema for climate variables at a specific location from WorldClim.
type: object
required:
  - lat
  - lon
  - temperature
  - precipitation
  - elevation
properties:
  lat:
    type: number
    description: Latitude in decimal degrees (WGS84).
    minimum: -90
    maximum: 90
  lon:
    type: number
    description: Longitude in decimal degrees (WGS84).
    minimum: -180
    maximum: 180
  temperature:
    type: number
    description: Mean annual temperature (°C).
  precipitation:
    type: number
    description: Annual precipitation (mm).
  elevation:
    type: number
    description: Elevation above sea level (meters).
additionalProperties: true
