$schema: "http://json-schema.org/draft-07/schema#"
title: "ClimateSnapshot"
description: "Schema for climate variables extracted at specific locations."
type: object
properties:
  lat:
    type: number
    description: "Latitude of the sampling point in decimal degrees (WGS84)."
    minimum: -90
    maximum: 90
  lon:
    type: number
    description: "Longitude of the sampling point in decimal degrees (WGS84)."
    minimum: -180
    maximum: 180
  temperature:
    type: number
    description: "Mean annual temperature (°C)."
  precipitation:
    type: number
    description: "Mean annual precipitation (mm)."
  elevation:
    type: number
    description: "Elevation above sea level (meters)."
additionalProperties: true
