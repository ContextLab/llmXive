$schema: http://json-schema.org/draft-07/schema#
title: ClimateSnapshot
description: >
  Schema for climate and geographic variables at a specific location.
  Derived from WorldClim v2.1 and elevation data.
type: object
required:
  - latitude
  - longitude
  - temperature_mean_annual
  - precipitation_annual
  - elevation_m
properties:
  latitude:
    type: number
    minimum: -90
    maximum: 90
    description: Latitude in WGS84 (decimal degrees)
  longitude:
    type: number
    minimum: -180
    maximum: 180
    description: Longitude in WGS84 (decimal degrees)
  temperature_mean_annual:
    type: number
    description: Mean annual temperature in degrees Celsius
  temperature_max_warmest:
    type: number
    description: Max temperature of warmest month (°C)
  temperature_min_coldest:
    type: number
    description: Min temperature of coldest month (°C)
  precipitation_annual:
    type: number
    description: Total annual precipitation in mm
  precipitation_driest:
    type: number
    description: Precipitation of driest month (mm)
  precipitation_wettest:
    type: number
    description: Precipitation of wettest month (mm)
  elevation_m:
    type: number
    minimum: -500
    description: Elevation in meters above sea level
  seasonality_temp:
    type: number
    description: Temperature seasonality (standard deviation * 100)
  seasonality_precip:
    type: number
    description: Precipitation seasonality (coefficient of variation)
  source_version:
    type: string
    description: Version of WorldClim data used (e.g., v2.1)
  resolution_arcsec:
    type: number
    description: Spatial resolution in arc-seconds
additionalProperties: true
