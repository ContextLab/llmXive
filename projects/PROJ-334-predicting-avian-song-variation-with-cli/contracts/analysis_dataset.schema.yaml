$schema: "http://json-schema.org/draft-07/schema#"
title: "AnalysisDataset Schema"
description: "Schema for the merged analysis dataset containing song metrics and environmental predictors."
type: object
required:
  - species_id
  - lat
  - lon
  - song_metric_1
  - song_metric_2
  - temperature
  - precipitation
  - elevation
properties:
  species_id:
    type: string
    description: "Unique identifier for the bird species."
  lat:
    type: number
    description: "Latitude of the recording location in decimal degrees (WGS84)."
    minimum: -90
    maximum: 90
  lon:
    type: number
    description: "Longitude of the recording location in decimal degrees (WGS84)."
    minimum: -180
    maximum: 180
  song_metric_1:
    type: number
    description: "Primary acoustic metric."
  song_metric_2:
    type: number
    description: "Secondary acoustic metric."
  temperature:
    type: number
    description: "Mean annual temperature (°C)."
  precipitation:
    type: number
    description: "Mean annual precipitation (mm)."
  elevation:
    type: number
    description: "Elevation (m)."
additionalProperties: true