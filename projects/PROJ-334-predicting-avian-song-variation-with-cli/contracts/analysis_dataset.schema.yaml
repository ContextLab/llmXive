$schema: http://json-schema.org/draft-07/schema#
title: AnalysisDataset
description: >
  Unified dataset merging SongRecord and ClimateSnapshot.
  Used for exploratory analysis and modeling.
type: object
required:
  - recording_id
  - species_id
  - species_name
  - latitude
  - longitude
  - temperature_mean_annual
  - precipitation_annual
  - elevation_m
properties:
  # Song Record Fields
  recording_id:
    type: string
    description: Unique identifier for the recording
  species_id:
    type: string
    description: Xeno-Canto species code
  species_name:
    type: string
    description: Scientific name
  latitude:
    type: number
    minimum: -90
    maximum: 90
    description: Latitude (WGS84)
  longitude:
    type: number
    minimum: -180
    maximum: 180
    description: Longitude (WGS84)
  file_url:
    type: string
    description: Audio file URL
  date_recorded:
    type: string
    format: date
    description: Recording date
  duration_sec:
    type: number
    description: Recording duration
  quality_score:
    type: string
    description: Quality rating
  country:
    type: string
    description: Country
  continent:
    type: string
    description: Continent

  # Derived Song Metrics (Placeholder for computed fields from audio processing)
  # Note: These fields are expected to be populated by downstream audio analysis
  # or placeholder values for schema validation if audio processing is skipped.
  song_frequency_median:
    type: number
    description: Median frequency of the song (Hz)
  song_frequency_max:
    type: number
    description: Maximum frequency of the song (Hz)
  song_duration_sec:
    type: number
    description: Duration of the song element (sec)
  song_complexity_index:
    type: number
    description: A calculated complexity metric

  # Climate Snapshot Fields
  temperature_mean_annual:
    type: number
    description: Mean annual temperature (°C)
  temperature_max_warmest:
    type: number
    description: Max temp of warmest month (°C)
  temperature_min_coldest:
    type: number
    description: Min temp of coldest month (°C)
  precipitation_annual:
    type: number
    description: Annual precipitation (mm)
  precipitation_driest:
    type: number
    description: Precipitation of driest month (mm)
  precipitation_wettest:
    type: number
    description: Precipitation of wettest month (mm)
  elevation_m:
    type: number
    description: Elevation (m)
  seasonality_temp:
    type: number
    description: Temperature seasonality
  seasonality_precip:
    type: number
    description: Precipitation seasonality

  # Join Metadata
  join_distance_km:
    type: number
    description: Distance to nearest climate grid point (km)
  species_range_match:
    type: boolean
    description: Whether species range matched the coordinate
  data_source_climate:
    type: string
    description: Source of climate data (e.g., WorldClim v2.1)
additionalProperties: true