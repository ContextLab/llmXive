$schema: http://json-schema.org/draft-07/schema#
title: AnalysisDataset
description: Unified schema merging SongRecord and ClimateSnapshot for analysis.
type: object
required:
  - species_id
  - lat
  - lon
  - song_metric_1
  - song_metric_2
  - temperature
  - precipitation
  - elevation
properties:
  species_id:
    type: string
    description: Unique identifier for the bird species.
  lat:
    type: number
    description: Latitude in decimal degrees (WGS84).
    minimum: -90
    maximum: 90
  lon:
    type: number
    description: Longitude in decimal degrees (WGS84).
    minimum: -180
    maximum: 180
  song_metric_1:
    type: number
    description: Primary song metric.
  song_metric_2:
    type: number
    description: Secondary song metric.
  temperature:
    type: number
    description: Mean annual temperature (°C).
  precipitation:
    type: number
    description: Annual precipitation (mm).
  elevation:
    type: number
    description: Elevation above sea level (meters).
additionalProperties: true