$schema: http://json-schema.org/draft-07/schema#
title: SongRecord
description: Schema for avian song recording metadata from Xeno-Canto.
type: object
required:
  - species_id
  - lat
  - lon
  - song_metric_1
  - song_metric_2
properties:
  species_id:
    type: string
    description: Unique identifier for the bird species (e.g., XC species code or taxon ID).
  lat:
    type: number
    description: Latitude in decimal degrees (WGS84).
    minimum: -90
    maximum: 90
  lon:
    type: number
    description: Longitude in decimal degrees (WGS84).
    minimum: -180
    maximum: 180
  song_metric_1:
    type: number
    description: Primary song metric (e.g., frequency peak, duration, or entropy).
  song_metric_2:
    type: number
    description: Secondary song metric (e.g., amplitude, trill rate, or complexity score).
additionalProperties: true
