$schema: http://json-schema.org/draft-07/schema#
title: SongRecord
description: >
  Schema for avian song metadata records fetched from Xeno-Canto.
  Contains acoustic features and geographic coordinates.
type: object
required:
  - recording_id
  - species_id
  - species_name
  - latitude
  - longitude
  - file_url
  - date_recorded
properties:
  recording_id:
    type: string
    description: Unique identifier for the recording (e.g., XC12345)
  species_id:
    type: string
    description: Xeno-Canto species code (e.g., XC234)
  species_name:
    type: string
    description: Scientific name of the species
  latitude:
    type: number
    minimum: -90
    maximum: 90
    description: Latitude in WGS84 (decimal degrees)
  longitude:
    type: number
    minimum: -180
    maximum: 180
    description: Longitude in WGS84 (decimal degrees)
  file_url:
    type: string
    format: uri
    description: Direct URL to the audio file
  date_recorded:
    type: string
    format: date
    description: Date of recording (YYYY-MM-DD)
  duration_sec:
    type: number
    minimum: 0
    description: Duration of the recording in seconds
  file_format:
    type: string
    description: Audio file format (e.g., wav, mp3)
  quality_score:
    type: string
    description: Xeno-Canto quality rating (A, B, C, etc.)
  country:
    type: string
    description: Country of recording
  continent:
    type: string
    description: Continent of recording
  additional_fields:
    type: object
    description: Any additional metadata fields not explicitly defined
    additionalProperties: true
additionalProperties: true
