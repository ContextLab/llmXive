$schema: http://json-schema.org/draft-07/schema#
title: Song Record Schema
description: Schema for validating Xeno-Canto avian acoustic metadata records.
type: object
required:
  - record_id
  - species_id
  - species_name
  - lat
  - lon
  - file_url
properties:
  record_id:
    type: string
    description: Unique identifier for the recording (e.g., XC12345).
    minLength: 1
  species_id:
    type: string
    description: Species identifier (e.,g., Xeno-Canto species ID or Wikidata QID).
    minLength: 1
  species_name:
    type: string
    description: Scientific name of the species (e.,g., Turdus merula).
    minLength: 1
  lat:
    type: number
    description: Latitude in decimal degrees (WGS84).
    minimum: -90
    maximum: 90
  lon:
    type: number
    description: Longitude in decimal degrees (WGS84).
    minimum: -180
    maximum: 180
  file_url:
    type: string
    description: Direct URL to the audio file.
    format: uri
  species_common_name:
    type: string
    description: Common name of the species (optional).
  recording_date:
    type: string
    description: Date of recording in ISO 8601 format (YYYY-MM-DD).
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  country:
    type: string
    description: Country where the recording was made.
  latitude_error:
    type: number
    description: Estimated error margin for latitude.
    minimum: 0
  longitude_error:
    type: number
    description: Estimated error margin for longitude.
    minimum: 0
  quality:
    type: string
    description: Quality rating of the recording (e.g., A, B, C, D).
    enum:
      - A
      - B
      - C
      - D
      - E
additionalProperties: false
