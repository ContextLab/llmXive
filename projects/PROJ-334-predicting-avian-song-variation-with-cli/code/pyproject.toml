[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avian-song-variation"
version = "0.1.0"
description = "Predicting avian song variation with climatic and geographic factors"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "statsmodels",
    "scipy",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "requests",
    "rasterio",
    "geopandas",
    "pyproj",
    "pytest",
    "black",
    "ruff",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
# Inherit settings from .ruff.toml for consistency, but define defaults here too
target-version = "py39"
line-length = 88
src = ["code", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"