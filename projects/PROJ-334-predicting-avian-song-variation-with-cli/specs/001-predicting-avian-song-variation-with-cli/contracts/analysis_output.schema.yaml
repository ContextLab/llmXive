$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Summary Schema"
description: >-
  Schema defining the expected columns, types, and constraints for the
  `model_summary.csv` artifact generated by the associational modeling pipeline.
type: object
properties:
  columns:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          description: "Column name in the CSV (includes '(Associational Analysis)' suffix)."
        type:
          type: string
          enum: [float, int, string, boolean]
          description: "Expected data type."
        description:
          type: string
          description: "Human‑readable description of the column."
        required:
          type: boolean
          default: true
      required: [name, type, description]
required: [columns]
additionalProperties: false
# Column definitions
columns:
  - name: "Species (Associational Analysis)"
    type: string
    description: "Unique identifier or name of the bird species analyzed."
    required: true
  - name: "Model_Type (Associational Analysis)"
    type: string
    description: "Type of model fitted (e.g., 'OLS Climate‑Only', 'OLS Full')."
    required: true
  - name: "Outcome (Associational Analysis)"
    type: string
    description: "Which song metric the **...**"
    required: true
  - name: "R_Squared (Associational Analysis)"
    type: float
    description: "Coefficient of determination (R²) for the **...**"
    required: true
  - name: "Adj_R_Squared (Associational Analysis)"
    type: float
    description: "Adjusted R² accounting for **...**"
    required: true
  - name: "P_Value_Global (Associational Analysis)"
    type: float
    description: "Global model significance (F‑test p‑value."
    description: "Global  ..."
    required: **???**