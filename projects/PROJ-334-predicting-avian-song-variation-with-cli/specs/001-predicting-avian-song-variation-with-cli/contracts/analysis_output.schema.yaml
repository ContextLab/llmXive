$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Summary Schema"
description: >-
  Schema defining the expected columns, types, and constraints for the
  `model_summary.csv` artifact generated by the associational modeling pipeline.
type: object
properties:
  columns:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          description: "Column name in the CSV (includes '(Associational Analysis)' suffix)."
        type:
          type: string
          enum: [float, int, string, boolean]
          description: "Expected data type."
        description:
          type: string
          description: "Human‑readable description of the column."
        required:
          type: boolean
          default: true
      required: [name, type, description]
required: [columns]
additionalProperties: false
# Column definitions
columns:
  - name: "Species (Associational Analysis)"
    type: string
    description: "Unique identifier or name of the bird species analyzed."
    required: true
  - name: "Model_Type (Associational Analysis)"
    type: string
    description: "Type of model fitted (e.g., 'OLS Climate‑Only', 'OLS Full')."
    required: true
  - name: "Outcome (Associational Analysis)"
    type: string
    description: "Which song metric the model predicts ('song_metric_1' or 'song_metric_2')."
    required: true
  - name: "R_Squared (Associational Analysis)"
    type: float
    description: "Coefficient of determination (R²) for the fitted model."
    required: true
  - name: "Adj_R_Squared (Associational Analysis)"
    type: float
    description: "Adjusted R² accounting for number of predictors."
    required: true
  - name: "P_Value_Global (Associational Analysis)"
    type: float
    description: "Global model significance (F‑test p‑value)."
    required: true
  - name: "Predictor_Count (Associational Analysis)"
    type: int
    description: "Number of predictors retained after significance filtering."
    required: true
  - name: "Convergence_Status (Associational Analysis)"
    type: boolean
    description: "True if the optimizer converged without error."
    required: true
  - name: "Sensitivity_Threshold (Associational Analysis)"
    type: float
    description: "P‑value threshold used in the sensitivity sweep (0.01, 0.05, or 0.10)."
    required: true
