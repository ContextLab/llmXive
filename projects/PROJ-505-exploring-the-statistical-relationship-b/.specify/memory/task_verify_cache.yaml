  r: "The alignment script exists, but the unit test fails because `_load_ace_composition`\
    \ (and the WIND loader) look for \u201C*.cdf\u201D files, while the test creates\
    \ \u201C*.csv\u201D placeholders; consequently no data are loaded, `AlignmentError`\
    \ is raised, and neither `data/processed/aligned_hourly.parquet` nor `data/artifacts/alignment_report.json`\
    \ is produced. The required output files are missing and the verification test\
    \ does not pass."
