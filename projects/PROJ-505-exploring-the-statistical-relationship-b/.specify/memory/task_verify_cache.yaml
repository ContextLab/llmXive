T003:
  c: false
  h: 9fba56efc4fef226af9c9aa98f7db2075b64d845ebec02de46853841740ea4ac
  r: The `code/ingestion/download_real.py` script exists and contains the required
    logic, and the integration tests verify checksum calculation and error handling.
    However, the required raw data directories (`data/raw/ace_swics/`, `data/raw/wind_sms/`,
    `data/raw/omni/`) and the `data/raw/checksums.yaml` file are missing, so the script
    has not actually fetched and stored the real CDF files as mandated. The task is
    therefore incomplete until the raw CDF files are downloaded and preserved and
    the checksum manifest is generated.
  sig: a00fa100b5853d00e693bcc19ebfa7f0d875441686a8ea302fba76cadaef169d
T004:
  c: false
  h: 3d2a7f1560468873dbcdff36d755b64c3e5775cbd5035ce19836501aa79b19dd
  r: The `align.py` implementation cannot pass the provided `tests/unit/test_align.py`
    because `_load_omni_bulk` looks for OMNI variables named `V`, `N`, `By`, `Bz`,
    `Dst`, `Kp`, etc., while the synthetic CSV created in the test uses names like
    `velocity_km_s`, `density_cm3`, `imf_by_nT`, `imf_bz_nT`, `dst_index`, `kp_index`.
    This mismatch causes `_load_omni_bulk` to raise an `AlignmentError`, so the script
    never produces `aligned_hourly.parquet` or `alignment_report.json`. The required
    variable naming (or a mapping layer) must be added for the test (and real data)
    to succeed.
  sig: 345fdfb5a086be06480e1d4934d9e3c55c7876c7e301c20d6441be8c92284d44
