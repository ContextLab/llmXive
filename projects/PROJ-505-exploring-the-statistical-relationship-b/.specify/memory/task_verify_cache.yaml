  r: The `code/utils/io.py` file implements `_get_parquet_engine` with a try/except
    import of `pyarrow` and fallback to `fastparquet`, and raises an informative ImportError
    if neither is available. It provides the required `save_parquet`, `load_parquet`,
    and `sha256_checksum` functions, and the accompanying `tests/unit/test_io.py`
    validates their behavior without needing `pyarrow`.
  sig: 29b28285a51cbe72cbe12af4e1043feebcd93b2e9458181c343cdffc906845ee
