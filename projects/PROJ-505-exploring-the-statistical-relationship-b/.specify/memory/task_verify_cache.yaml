  r: The `requirements.txt` correctly pins all packages to the `package==major.minor.*`
    pattern and the `quickstart.md` documents the pipeline command, but there is no
    provided evidence (e.g., pip install log or CI run output) showing that `pip install
    -r requirements.txt` actually succeeds. Adding such installation verification
    logs will satisfy the task fully.
