T001:
  c: false
  h: c4efde8e661c475a022b41bf5479d9b57dafb31ef4d8131258d900f4026fce0f
  r: "The `requirements.txt` file correctly pins packages to the `package==major.minor.*`\
    \ pattern, but the execution log shows that `pip install -r requirements.txt`\
    \ exited with code\u202F1, meaning the installation failed. The task also demands\
    \ a successful install on a clean runner (and a CI regex check), which is not\
    \ demonstrated. The implementer must ensure the requirements can be installed\
    \ without error and provide evidence of the passing CI regex validation."
  sig: 62bd46e1a449e0fb011f2d654903f59d9558942ac792a6468c56328b4e6fc071
T002:
  c: true
  h: 82c1962c4411e0326e131bec76b93747c53aace2091e28a5e7f911d85a2593e2
  r: "Checked `code/utils/io.py` \u2013 it implements `_get_parquet_engine()` that\
    \ tries `pyarrow` first, falls back to `fastparquet`, and raises a clear `ImportError`\
    \ if neither is available, and provides the required `save_parquet` and `load_parquet`\
    \ functions. The accompanying `tests/unit/test_io.py` correctly exercises these\
    \ functions without importing `pyarrow`."
  sig: 7ced9b40e44a2678edeb11fbd525765d8cf269689cf1bf168016ace17433493b
T003:
  c: false
  h: 3d3914c6c39fca5acf98a2bb382d8833e273b00b806184497ee556a6be0dd351
  r: "The repository contains the `code/ingestion/download_real.py` script and its\
    \ test suite, but the required output artifacts\u2014`data/raw/ace_swics/`, `data/raw/wind_sms/`,\
    \ `data/raw/omni/` directories with the downloaded CDF files and the generated\
    \ `data/raw/checksums.yaml`\u2014are all missing. Without these raw data files\
    \ and checksum manifest, the ingestion task is not truly fulfilled."
  sig: c716cb3f42450e58c4f843fe3bcc3f932052bde58da21864f5ea8e396f2337ef
T004:
  c: false
  h: e69945d9cffc7497d4313802f561ec4546270bfc9fc61e9220f9daa67f778d33
  r: "The repository lacks the required output artifacts `data/processed/aligned_hourly.parquet`\
    \ and `data/artifacts/alignment_report.json`; they are marked MISSING. Consequently\
    \ the task\u2019s core deliverables are not present despite the implementation\
    \ and unit test existing. Generating these files at the specified locations (and\
    \ ensuring they meet the schema and gap\u2011flagging requirements) is needed\
    \ to complete the task."
  sig: c17be1aeae12eb37cf4734aa51e233ac59da3824aaee8f2a8c4df7b7c8aa4584
