  h: 82c1962c4411e0326e131bec76b93747c53aace2091e28a5e7f911d85a2593e2
  r: "The refactored `code/utils/io.py` correctly implements a fallback to `fastparquet`\
    \ and provides `load_parquet` and `save_parquet`, but there is no evidence that\
    \ the required test (`pytest tests/unit/test_io.py`) actually runs and passes\
    \ on a system without `pyarrow`. Execution logs or a test report confirming the\
    \ fallback works (and that a parquet file is written, read back identically, and\
    \ its SHA\u2011256 checksum matches) are missing. Provide the test run output\
    \ or CI log demonstrating the passing test in the specified environment."
