T004:
  reason: The `align.py` implementation cannot pass the provided `tests/unit/test_align.py`
    because `_load_omni_bulk` looks for OMNI variables named `V`, `N`, `By`, `Bz`,
    `Dst`, `Kp`, etc., while the synthetic CSV created in the test uses names like
    `velocity_km_s`, `density_cm3`, `imf_by_nT`, `imf_bz_nT`, `dst_index`, `kp_index`.
    This mismatch causes `_load_omni_bulk` to raise an `AlignmentError`, so the script
    never produces `aligned_hourly.parquet` or `alignment_report.json`. The required
    variable naming (or a mapping layer) must be added for the test (and real data)
    to succeed.
