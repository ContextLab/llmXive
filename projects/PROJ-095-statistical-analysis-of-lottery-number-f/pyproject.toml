[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    "data",
    "figures",
    "results",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by black; long lines allowed where needed
]

[tool.ruff.lint.isort]
known-first-party = [
    "analysis",
    "constants",
    "data_utils",
    "exceptions",
    "generate_checksums",
    "generate_legacy_metrics",
    "ingestion",
    "metrics",
    "validation",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | __pycache__
  | venv
  | \.venv
  | data
  | figures
  | results
)/
'''
