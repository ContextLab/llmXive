# Ruff configuration for llmXive lottery analysis project
target-version = "py39"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in data loading)
]

[lint.isort]
known-first-party = ["code", "tests"]
force-single-line = false
lines-between-types = 0

[lint.per-file-ignores]
"tests/*" = ["S101", "S105"] # Allow asserts and hardcoded strings in tests
