$schema: http://json-schema.org/draft-07/schema#
title: "Correlation Result Schema"
description: "Schema for statistical correlation results between topology and thermal conductivity."
type: object
properties:
  metric_name:
    type: string
    description: "Name of the topological metric (e.g., 'mean_coordination', 'bottleneck_density')."
  system_size_group:
    type: string
    description: "System size group (e.g., 'N=1000', 'N=2000', 'N=4000')."
  spearman_r:
    type: number
    description: "Spearman correlation coefficient."
  pearson_r:
    type: number
    description: "Pearson correlation coefficient."
  p_value_raw:
    type: number
    minimum: 0
    maximum: 1
    description: "Raw p-value from significance test."
  p_value_corrected:
    type: number
    minimum: 0
    maximum: 1
    description: "P-value after multiple-comparison correction (Bonferroni/FDR)."
  ci_lower:
    type: number
    description: "Lower bound of 95% confidence interval."
  ci_upper:
    type: number
    description: "Upper bound of 95% confidence interval."
  bootstrap_iterations:
    type: integer
    minimum: 1
    description: "Number of bootstrap iterations performed."
  statistical_power:
    type: number
    minimum: 0
    maximum: 1
    description: "Calculated statistical power for the observed effect size."
  low_power_warning:
    type: boolean
    description: "Flag if statistical power < 0.8."
required:
  - metric_name
  - system_size_group
  - spearman_r
  - p_value_corrected
  - ci_lower
  - ci_upper
  - bootstrap_iterations
  - statistical_power
  - low_power_warning