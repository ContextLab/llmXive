[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-amorphous-heat"
version = "0.1.0"
description = "Investigating the Influence of Network Structure on Heat Conduction in Amorphous Solids"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "ase>=3.22.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "networkx>=3.1.0",
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "pytest-randomly>=3.12.0",
    "ruff>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "pytest-randomly>=3.12.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["src*", "tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--randomly-seed=42",
    "--randomly-dont-reset-seed",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:outputs/reports/coverage_html",
    "--cov-fail-under=70",
    "-v",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["code/src"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
fail_under = 70

[tool.ruff]
select = ["E", "F", "I", "W"]
ignore = []
line-length = 88
target-version = "py311"
preview = true

[tool.black]
line-length = 88
target-version = ["py311"]
include = "\\.pyi?$"