line-length = 88
target-version = "py311"

[lint]
# Ignore specific rules that conflict with project style or are irrelevant
ignore = [
  "E501",  # Line too long (handled by formatter like Black)
  "E731",  # Do not assign a `lambda` expression, use a `def`
  "W605",  # Invalid escape sequence (common in regex patterns)
]

# Select specific rule sets to enforce
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "C",  # flake8-comprehensions
  "B",  # flake8-bugbear
]