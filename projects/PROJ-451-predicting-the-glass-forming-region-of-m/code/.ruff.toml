# Ruff configuration file
# This file is a duplicate of settings in pyproject.toml for IDE compatibility
# but can be used for project-specific overrides if needed.

target-version = "py311"
line-length = 88

select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "data",
    "notebooks",
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
