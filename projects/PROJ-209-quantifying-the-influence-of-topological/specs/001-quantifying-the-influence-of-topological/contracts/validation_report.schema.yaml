$schema: http://json-schema.org/draft-07/schema#
title: Validation Report Schema
description: Schema for the final validation report
type: object
properties:
  status:
    type: string
    enum: ["EXTERNAL_DATA_AVAILABLE", "NO_EXTERNAL_DATA", "SYNTHETIC_ONLY"]
    description: "Status of external validation"
  method:
    type: string
    enum: ["external_validation", "internal_only", "pipeline_validation"]
    description: "Method used for validation"
  external_dataset:
    type: string
    description: "Name of external dataset used, or 'N/A'"
  internal_validation_metrics:
    type: object
    properties:
      holdout_r2:
        type: number
      holdout_mape:
        type: number
      goodness_of_fit:
        type: number
        description: "R² against known analytical formula (for synthetic data)"
    required:
      - holdout_r2
      - holdout_mape
      - goodness_of_fit
  timestamp:
    type: string
    format: date-time
  data_source:
    type: string
    enum: ["real", "synthetic"]
    description: "Source of the primary data used"
  scope_limitation:
    type: string
    description: "Statement on the limitation of the study (e.g., 'valid only for surrogate model')."
required:
  - status
  - method
  - internal_validation_metrics
  - timestamp
  - data_source
  - scope_limitation
additionalProperties: false