$schema: "http://json-schema.org/draft-07/schema#"
title: "DefectEntry"
description: "Schema for a single record in the defect dataset (real or synthetic)."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the defect entry."
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
  material:
    type: "string"
    description: "Material type."
    enum:
      - "graphene"
      - "MoS2"
  defect_type:
    type: "string"
    description: "Type of topological defect."
    enum:
      - "dislocation"
      - "grain_boundary"
      - "vacancy"
      - "substitution"
  defect_density:
    type: "number"
    description: "Fraction of atoms affected by the defect."
    minimum: 0
    maximum: 0.1
  tilt_angle:
    type: "number"
    description: "Grain boundary tilt angle in degrees."
    minimum: 0
    maximum: 180
  conductivity:
    type: "number"
    description: "Electronic conductivity in S/m."
    exclusiveMinimum: 0
  youngs_modulus:
    type: "number"
    description: "Young's modulus in GPa."
    exclusiveMinimum: 0
  fracture_energy:
    type: "number"
    description: "Fracture energy in J/m²."
    exclusiveMinimum: 0
  source:
    type: "string"
    description: "Origin of the data."
    enum:
      - "api"
      - "synthetic"
      - "cache"
  is_valid:
    type: "boolean"
    description: "Flag indicating if the entry passed validation."
  exclusion_flag:
    type: ["string", "null"]
    description: "Flag for missing data, e.g., '[MISSING: requires exclusion]'."
required:
  - id
  - material
  - defect_type
  - defect_density
  - conductivity
  - youngs_modulus
  - fracture_energy
  - source
  - is_valid
additionalProperties: false