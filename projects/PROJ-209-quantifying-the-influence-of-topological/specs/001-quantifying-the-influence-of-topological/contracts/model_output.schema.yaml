$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelOutput Schema"
description: "Schema for the Random Forest model results and statistical tests."
type: "object"
properties:
  model_id:
    type: "string"
    description: "Unique identifier for the model run."
  target_property:
    type: "string"
    enum: ["delta_conductivity", "delta_youngs", "delta_fracture"]
    description: "The normalized property being modeled."
  r_squared:
    type: "number"
    description: "R² score on the test set."
  mape:
    type: "number"
    minimum: 0
    description: "Mean Absolute Percentage Error."
  cv_std:
    type: "number"
    minimum: 0
    description: "Standard deviation of R² across 5 CV folds."
  feature_importance:
    type: "object"
    description: "Map of feature names to importance scores."
    additionalProperties:
      type: "number"
      minimum: 0
  p_values:
    type: "object"
    description: "Map of feature names to raw p-values from permutation."
    additionalProperties:
      type: "number"
      minimum: 0
      maximum: 1
  fdr_adjusted:
    type: "object"
    description: "Map of feature names to Benjamini-Hochberg adjusted p-values."
    additionalProperties:
      type: "number"
      minimum: 0
      maximum: 1
  collinearity_flags:
    type: "array"
    description: "List of features with VIF > 5."
    items:
      type: "string"
required:
  - "model_id"
  - "target_property"
  - "r_squared"
  - "mape"
  - "cv_std"
  - "feature_importance"
  - "p_values"
  - "fdr_adjusted"
additionalProperties: false