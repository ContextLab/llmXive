$schema: "http://json-schema.org/draft-07/schema#"
title: "DefectEntry Schema"
description: "Schema for the raw defect dataset entries (real or synthetic)."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the entry."
  material:
    type: "string"
    enum: ["graphene", "MoS2"]
    description: "Material type."
  defect_type:
    type: "string"
    description: "Type of topological defect."
  defect_density:
    type: "number"
    minimum: 0.0
    maximum: 0.1
    description: "Fraction of atoms affected by the defect."
  conductivity:
    type: "number"
    exclusiveMinimum: 0
    description: "Electronic conductivity in S/m."
  youngs_modulus:
    type: "number"
    exclusiveMinimum: 0
    description: "Young's modulus in GPa."
  fracture_energy:
    type: "number"
    exclusiveMinimum: 0
    description: "Fracture energy in J/m²."
  synthesis_method:
    type: ["string", "null"]
    description: "Method used to synthesize the defect."
  grain_size:
    type: ["number", "null"]
    description: "Grain size in nm."
  source:
    type: "string"
    enum: ["MP_API", "Synthetic", "2022_CSV"]
    description: "Origin of the data entry."
required:
  - "id"
  - "material"
  - "defect_type"
  - "defect_density"
  - "conductivity"
  - "youngs_modulus"
  - "fracture_energy"
  - "source"
additionalProperties: false
