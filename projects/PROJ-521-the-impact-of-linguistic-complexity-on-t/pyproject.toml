# Pyproject configuration for Black formatting (and optionally other tools)
# This file lives at the project root: projects/PROJ-521-the-impact-of-linguistic-complexity-on-t/

[tool.black]
# Target version of Python code
target-version = ["py311"]

# Line length to match Ruff configuration
line-length = 88

# Include all Python files
include = '\.pyi?$'

# Exclude common directories and files that should not be formatted
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# Optional: Enable experimental string normalizer (if desired)
# experimental-string-processing = true

# Optional: Enable preview mode for future Black features
# preview = true

# Note: Ruff configuration is provided in .ruff.toml; Black does not need additional settings here.