T003:
  c: false
  h: 694f4bf6c0be62d0fede119411e75ac1c90038d77fb6665207d6723c890fc2ea
  r: "The three required files (`structured_harness.py`, `chat_interface.py`, `session.py`)\
    \ exist and contain FastAPI stubs, but there is no evidence that a FastAPI server\
    \ was started and that the `/init_session` and `/edit` endpoints actually return\
    \ the expected JSON and 200\u202FOK responses. The provided curl command fails\
    \ with a connection error, and no execution logs or test results are supplied\
    \ to demonstrate the randomised, counterbalanced order behavior. Running the server\
    \ and showing successful curl responses is needed to satisfy the task."
  sig: 0964a7884081b65ac998762d77fe96c6df574648e379c8ae3445dde6118c9e31
T004:
  c: true
  h: 0168d522fe7a2b7fc95e1a27d76c20bf774c1a09a4e3c4fe8ba94684875128f4
  r: "Checked `src/logger/interaction_logger.py` (implements millisecond\u2011precision\
    \ logging to `data/logs/interactions.jsonl`) and the non\u2011empty `data/logs/interactions.jsonl`\
    \ file (contains integer `timestamp_ms` and correctly incremented `iteration`\
    \ per edit). The passing pytest confirms correct behavior."
  sig: a4bb182fd28cca20cdc698eb3cb1d98a82eced4944963387b2bb2a6261905927
T005:
  c: false
  h: 8efccb4c62f3a6f7710f7e8ac05d775e20102b264fe76ec24eb3e689a81340bf
  r: "The `vector_match.py` utility writes a `SemanticValidation` record with `semantic_pass`\
    \ hard\u2011coded to `False`, and `semantic_similarity.py` writes a record with\
    \ `vector_match` hard\u2011coded to `False`. Consequently no single record can\
    \ ever have both fields `true` as required for a trial to be counted successful,\
    \ and the unit tests do not verify the combined\u2011field behavior. The utilities\
    \ need to produce a record where both booleans reflect the actual outcomes of\
    \ the two checks."
  sig: 6f0009e1d81651180f428e03bce32293d9360d7ffda370ed51aa13b27007b4c7
T007:
  c: false
  h: 1c32ee50d11235a7121ee072c0fc2091ee0e0583b15b818457afd7491ea4e403
  r: "The `src/simulation/simulate_participants.py` script exists and generates logs,\
    \ and `data/logs/interactions.jsonl` is present, but the file contains far fewer\
    \ than the required\u202F\u2248\u202F7\u202F500 JSON\u2011lines (\u2248\u202F\
    6\u202F500 based on its 1.3\u202FMiB size) and also includes entries written by\
    \ `src/logger/interaction_logger.py` that do not match the `contracts/interaction_log.schema.yaml`\
    \ fields. Consequently the log does not satisfy the \u201Ceach line conforms to\
    \ the schema\u201D and minimum\u2011line\u2011count requirements."
  sig: 952ae224bb980415c77adf19fe3d1a62e4e8e9df00b04142bcc3dfe660de6c0c
T008:
  c: false
  h: 3e57423adb552c8792da738e63c9ac64a178fef75647cad2e965f209f0a2a5d7
  r: "The provided `src/validation/run_combined_validation.py` is only a thin wrapper\
    \ that re\u2011exports `run_validation.main`; the real logic lives in `run_validation.py`.\
    \ That script merely compares each ground\u2011truth file and image to itself,\
    \ always succeeds, never processes actual trial predictions, and does not log\
    \ trials that fail either check. Consequently it does not truly \u201Cinvoke both\
    \ `vector_match` and `semantic_similarity` on each completed trial\u201D nor record\
    \ unsuccessful trials as required. The implementation must be revised to validate\
    \ real trial outputs, write a `SemanticValidation` line on"
  sig: d86ece8dc936c591185a0399ce999a4f44b98d81ec506a31283412088c80733a
T009:
  c: false
  h: 8806865de297cbc5bfcab1cd27ce010378dbf1962fde616c71ba1af7e156eba3
  r: "The `src/analysis/retention_check.py` script exists and implements a threshold\
    \ check, but the unit test fails because the script requires a `--log-dir` argument\
    \ and aborts with an argparse error before performing the retention logic. Consequently\
    \ the test never reaches the non\u2011zero exit and \u201CRetention threshold\
    \ not met\u201D message, so the verification step is not satisfied. The script\
    \ needs a default log\u2011directory (or the test must supply the argument) and\
    \ must ensure the expected warning message is produced under the test conditions."
  sig: 1c644b2acfe5046f8f8f4c47a7eb2d2e1ed1ef544101c99c74583ee419d593b1
T010:
  c: true
  h: 857522bfb9c2f7a4df9d1ca53bc8d465d1f074b39f4ae3bb96cb45018f4f3954
  r: "Checked `src/analysis/wilcoxon_analysis.py`: it loads validation records, filters\
    \ for `vector_match`\u202F&&\u202F`semantic_pass`, aggregates per participant,\
    \ computes paired differences for both metrics, performs Wilcoxon signed\u2011\
    rank tests, applies Bonferroni correction, calculates effect\u2011size\u202Fr,\
    \ bootstraps 95\u202F% CI, and writes JSON\u2011lines matching the `AnalysisResult`\
    \ schema. All required computations and output format are present."
  sig: e6526a7993a04234f7d7cf278d04702188d3b81178b55eb147e2972e0c4c1654
