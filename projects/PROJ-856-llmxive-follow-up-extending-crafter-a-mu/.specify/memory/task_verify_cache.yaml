T005:
  c: false
  h: 8efccb4c62f3a6f7710f7e8ac05d775e20102b264fe76ec24eb3e689a81340bf
  r: "The `vector_match.py` utility writes a `SemanticValidation` record with `semantic_pass`\
    \ hard\u2011coded to `False`, and `semantic_similarity.py` writes a record with\
    \ `vector_match` hard\u2011coded to `False`. Consequently no single record can\
    \ ever have both fields `true` as required for a trial to be counted successful,\
    \ and the unit tests do not verify the combined\u2011field behavior. The utilities\
    \ need to produce a record where both booleans reflect the actual outcomes of\
    \ the two checks."
  sig: 6f0009e1d81651180f428e03bce32293d9360d7ffda370ed51aa13b27007b4c7
