T000:
  c: false
  h: ddad960559121d42e8a87bcf69e21f0483c64490bb794d5816890739deccf8c9
  r: "The repository contains the required files and the checksums script was run\
    \ successfully, but there is no evidence that `pip install -r requirements.txt`\
    \ completed without error nor that the seed verification command (`python -c \"\
    import src.utils.seeds; assert src.utils.seeds.SEED==42\"`) was executed and passed.\
    \ These execution artifacts are needed to satisfy the task\u2019s verification\
    \ criteria."
  sig: 8347cdccefa429f1a7b9e3231fa0d809bf92f838be18eb82a128a586a32e5323
T001:
  c: true
  h: 2308b169dc57442b24a0040e3c703c603bad068f756e29364f25879a6943869f
  r: "Checked `src/run_pipeline.py` \u2013 it defines an argparse entry point with\
    \ automatic `--help` and a `--version` flag that prints the semantic version \u201C\
    0.1.0\u201D.  \nChecked `quickstart.md` \u2013 present and documents usage, including\
    \ the version and help commands."
  sig: 9bdebcfaa06ef237f4b27dad3b3d28a802570caab8e2e2a9c40b97c3d72599cf
T002:
  c: false
  h: 8b1c03e62e320807029389f837c5c08cf8dc2afe801246a2e90a4996babcdf63
  r: "The provided `src/curators/curate_failed_figures.py` exists and runs, but it\
    \ downloads CIFAR\u201110 rather than the required CrafterBench dataset, so it\
    \ does not fetch a verified subset of 50 failed figures from CrafterBench. The\
    \ script therefore does not satisfy the core requirement of the task. The next\
    \ implementer must replace the synthetic CIFAR\u201110 source with a download\
    \ of the actual CrafterBench data and ensure exactly 50 curated failed figures\
    \ are produced, preserving the same error\u2011handling behavior."
  sig: 33ac5a55d8e60b29682fd56c01477d0bf56b2e4ca30641d0d33ac94c44efc1fa
T003:
  c: false
  h: ef7ec01784c0cd334a1312ad0f555b8e3e94994aa7d57c444dc1f9096914e2a1
  r: "The three source files exist and implement the required endpoints, but the provided\
    \ test suite fails to run because the `fastapi` package is not installed (`ModuleNotFoundError:\
    \ No module named 'fastapi'`). Without this dependency the verification command\
    \ `pytest -q tests/interfaces/test_interfaces.py` cannot pass, so the task\u2019\
    s acceptance criteria are not met. Install FastAPI (and its test client) or add\
    \ it to the project\u2019s dependency list."
  sig: 82e94049600df6cc93b84372cc82593134f1b867a3148646f6cdfd06a407ec8f
T004:
  c: false
  h: e098b8001a02088b1a2821e321dabdd3b502df98b85ebad9b8e47056176c14aa
  r: "Checked `src/logger/interaction_logger.py` (contains the required fields and\
    \ abort logic) and `tests/logger/test_interaction_logger.py` (the test suite fails\
    \ to import `fastapi`, so no tests run, and it never verifies that a NASA\u2011\
    TLX score is logged). The missing FastAPI dependency and lack of a test for the\
    \ `subjective_load` field mean the required logging behavior is not demonstrated\
    \ or validated. Fix by adding FastAPI (and any other test dependencies) and extending\
    \ the tests to assert that a logged record includes `subjective_load` and passes\
    \ schema validation."
  sig: 9f25be916e1591eca8288e1c770a8dabf45c0db7c892dbfbc9831fc1664bc315
T005:
  c: false
  h: 1914eda6046b034730c1758f1261388c8e7249bdc0745ef7c8f4bc965458f7de
  r: "The `src/validation/run_validation.py` script sets `overall_success = vector_match\
    \ or semantic_pass`, violating the requirement that primary success be based **solely**\
    \ on exact vector match, and the unit test (which expects `overall_success=False`\
    \ when only semantic_pass is true) fails. Additionally, the test fails because\
    \ `semantic_score` can exceed 1.0 due to floating\u2011point rounding, breaking\
    \ the `0.99\u202F\u2264\u202Fscore\u202F\u2264\u202F1.0` assertion. Finally, the\
    \ required `semantic_validation.schema.yaml` file is missing. Fix the overall_success\
    \ logic, clamp or round similarity scores to \u2264\u202F1.0, and add the missin"
  sig: 691f59facb82fa28e56dc36c828bd8d6ea1424349b8d1ba85490093b1a1dbcd9
T006:
  c: false
  h: e97afce8226712330fefc863c3742ed15b802d0ae699fa91d4f9b1828f964b46
  r: "Checked `src/simulation/power_analysis.py` and `src/simulation/simulate_participants.py`\
    \ plus the generated `data/logs/interactions.jsonl`. The power\u2011analysis module\
    \ still requires the `--effect-size` argument (so `python -m src.simulation.power_analysis`\
    \ fails) and defaults \u03B1 to 0.05 instead of the required 0.025. The participant\
    \ simulator uses nondeterministic `uuid.uuid4()` for log IDs, violating the \u201C\
    deterministic\u201D requirement, and no evidence is provided that the resulting\
    \ JSON\u2011Lines pass the `interaction_log` schema test. These gaps must be fixed\
    \ for the task to be complete."
  sig: ba4637fd305c3c63128adcf55813e76fc53110b7fb84af0c4d7a2fbffa45ec6a
T007:
  c: false
  h: 962c7ade310616267ec380545dd09efd39d95d6c8dfa9824061d163e79553878
  r: "Checked `src/analysis/validation_by_session.py` and its test `tests/analysis/test_validation_aggregation.py`.\
    \ The script aggregates records and writes the required fields, and the test passes,\
    \ but the implementation never records the final effective\u202FN per participant\
    \ as required by the task specification. This missing output means the task is\
    \ not fully satisfied."
  sig: c28daaa722c658d564d0d2967f0cb2bde85ff5da21b732ca1a746608fff124e4
