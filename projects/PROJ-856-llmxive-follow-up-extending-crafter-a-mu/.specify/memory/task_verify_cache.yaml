T009:
  c: false
  h: 8806865de297cbc5bfcab1cd27ce010378dbf1962fde616c71ba1af7e156eba3
  r: "The `src/analysis/retention_check.py` script exists and implements a threshold\
    \ check, but the unit test fails because the script requires a `--log-dir` argument\
    \ and aborts with an argparse error before performing the retention logic. Consequently\
    \ the test never reaches the non\u2011zero exit and \u201CRetention threshold\
    \ not met\u201D message, so the verification step is not satisfied. The script\
    \ needs a default log\u2011directory (or the test must supply the argument) and\
    \ must ensure the expected warning message is produced under the test conditions."
  sig: 1c644b2acfe5046f8f8f4c47a7eb2d2e1ed1ef544101c99c74583ee419d593b1
