$schema: "http://json-schema.org/draft-07/schema#"
title: "InteractionLog"
type: "object"
required:
  - log_id
  - session_id
  - task_id
  - timestamp_ms
  - iteration
  - mode
  - payload
  - response_image_path
properties:
  log_id:
    type: "string"
    description: "Unique identifier for the log entry."
  session_id:
    type: "string"
    description: "Identifier of the participant session."
  task_id:
    type: "string"
    description: "Identifier of the figure task."
  timestamp_ms:
    type: "integer"
    description: "Epoch time in milliseconds when the edit was submitted."
  iteration:
    type: "integer"
    minimum: 1
    description: "1‑based count of the edit attempt within the task."
  mode:
    type: "string"
    enum: ["structured", "chat"]
    description: "Interface mode used for this edit."
  payload:
    type: "string"
    description: "The raw edit command (typed code) or natural‑language utterance."
  response_image_path:
    type: "string"
    description: "Filesystem path to the figure generated after this edit."
