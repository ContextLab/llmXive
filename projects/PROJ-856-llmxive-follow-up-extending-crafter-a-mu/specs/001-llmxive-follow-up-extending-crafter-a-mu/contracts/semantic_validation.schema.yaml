$schema: "http://json-schema.org/draft-07/schema#"
title: "SemanticValidation"
description: "Schema for records capturing both exact vector match and CLIP‑based semantic similarity for a completed figure task."
type: object
required:
  - validation_id
  - task_id
  - vector_match
  - semantic_score
  - semantic_pass
  - overall_success
properties:
  validation_id:
    type: string
    description: "Unique identifier for the validation record."
  task_id:
    type: string
    description: "Identifier of the figure task being validated."
  vector_match:
    type: boolean
    description: "True if the final layout vector exactly matches the ground‑truth vector."
  semantic_score:
    type: number
    minimum: 0
    maximum: 1
    description: "Cosine similarity between the generated figure image and the ground‑truth image as computed by CLIP ViT‑B/32."
  semantic_pass:
    type: boolean
    description: "True if `semantic_score` ≥ 0.95."
  overall_success:
    type: boolean
    description: "Primary success flag; defined as the `vector_match` result only (semantic similarity does not affect primary inclusion)."