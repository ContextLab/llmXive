$schema: "http://json-schema.org/draft-07/schema#"
title: SemanticValidation
type: object
properties:
  validation_id:
    type: string
    format: uuid
  task_id:
    type: string
  vector_match:
    type: boolean
  semantic_score:
    type: number
  semantic_pass:
    type: boolean
  overall_success:
    type: boolean
required:
  - validation_id
  - task_id
  - vector_match
  - semantic_score
  - semantic_pass
  - overall_success
additionalProperties: false