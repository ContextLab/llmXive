# Semantic Validation Schema
# Conforms to the records produced by src/validation/run_validation.py
# Each line in the JSONL file must match this schema.
$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  validation_id:
    type: string
    format: uuid
    description: Unique identifier for the validation record.
  task_id:
    type: string
    description: Identifier of the figure/task (e.g., "0", "1", ...)
  vector_match:
    type: boolean
    description: Primary success flag – true only when predicted vector exactly matches ground‑truth.
  semantic_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: Cosine similarity between ground‑truth and predicted images (clamped to [0,1]).
  semantic_pass:
    type: boolean
    description: Secondary success flag – true when semantic_score ≥ 0.95.
  overall_success:
    type: boolean
    description: Primary inclusion flag – identical to vector_match (semantic_pass does not affect it).
required:
  - validation_id
  - task_id
  - vector_match
  - semantic_score
  - semantic_pass
  - overall_success
additionalProperties: false