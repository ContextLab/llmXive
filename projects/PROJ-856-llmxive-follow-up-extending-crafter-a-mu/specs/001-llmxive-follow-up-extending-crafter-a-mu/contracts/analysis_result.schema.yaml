{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "title": "AnalysisResult",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "metric",
    "mean_difference",
    "median_difference",
    "wilcoxon_statistic",
    "p_value_corrected",
    "effect_size_r",
    "ci_95_lower",
    "ci_95_upper",
    "n_participants"
  ],
  "properties": {
    "metric": {
      "type": "string",
      "enum": ["time_to_success_ms", "iteration_count"]
    },
    "mean_difference": {
      "type": "number"
    },
    "median_difference": {
      "type": "number"
    },
    "wilcoxon_statistic": {
      "type": "number"
    },
    "p_value_corrected": {
      "type": "number",
      "minimum": 0.0,
      "maximum": 1.0
    },
    "effect_size_r": {
      "type": "number"
    },
    "ci_95_lower": {
      "type": "number"
    },
    "ci_95_upper": {
      "type": "number"
    },
    "n_participants": {
      "type": "integer",
      "minimum": 1
    }
  }
}