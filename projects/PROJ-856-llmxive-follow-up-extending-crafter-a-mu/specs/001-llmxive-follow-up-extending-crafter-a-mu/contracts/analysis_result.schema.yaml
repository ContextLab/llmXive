$schema: "http://json-schema.org/draft-07/schema#"
title: "AnalysisResult"
description: "Schema for the JSON‑Lines records produced by the Wilcoxon analysis script."
type: object
required:
  - result_id
  - metric
  - structured_median
  - chat_median
  - wilcoxon_statistic
  - p_value_corrected
  - effect_size_r
  - ci_95_lower
  - ci_95_upper
  - n_participants
properties:
  result_id:
    type: string
    description: "Unique identifier for this analysis result."
  metric:
    type: string
    enum:
      - time_to_success_ms
      - iteration_count
      - subjective_load
    description: "The metric that was analysed."
  structured_median:
    type: number
    description: "Median value for the structured harness."
  chat_median:
    type: number
    description: "Median value for the chat interface."
  wilcoxon_statistic:
    type: number
    description: "Wilcoxon signed‑rank test statistic (W)."
  p_value_corrected:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Bonferroni‑adjusted two‑sided p‑value."
  effect_size_r:
    type: number
    description: "Rank‑siserial correlation effect size."
  ci_95_lower:
    type: number
    description: "Lower bound of the 95 % bootstrap confidence interval for the median difference."
  ci_95_upper:
    type: number
    description: "Upper bound of the 95 % bootstrap confidence interval for the median difference."
  n_participants:
    type: integer
    minimum: 1
    description: "Number of participant pairs included in the test."