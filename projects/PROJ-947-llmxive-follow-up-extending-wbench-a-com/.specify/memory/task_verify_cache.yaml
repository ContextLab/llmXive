    \ and `JsonFormatter` from `code.utils.logging` \u2014 symbols that module does\
    \ not define (it only defines `JsonLogFormatter` and logger-first wrappers), so\
    \ the import chain raises `ImportError`. Additionally, `config.py` calls `log_error(msg)`/`log_info(msg)`\
    \ with a single string argument, while the logging wrappers require a logger as\
    \ the first"
