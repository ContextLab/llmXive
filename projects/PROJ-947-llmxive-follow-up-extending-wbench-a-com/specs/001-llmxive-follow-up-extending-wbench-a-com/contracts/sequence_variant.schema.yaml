$schema: http://json-schema.org/draft-07/schema#
title: SequenceVariant
description: Schema for generated sequence variants with complexity metrics.
type: object
properties:
  case_id:
    type: string
    description: "Unique identifier for the base WBench case."
  variant_type:
    type: string
    enum:
      - low
      - medium
      - high
    description: "Entropy variant type (primary predictor)."
  commands_json:
    type: string
    description: "JSON string containing the list of command tokens."
  entropy_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Normalized Shannon entropy of command tokens (manipulation check)."
  semantic_similarity:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Cosine similarity of intent vector vs original (must be > 0.85)."
  dependency_depth:
    type: integer
    minimum: 1
    description: "Longest path in the causal dependency graph (from original text, used as covariate)."
  complexity_score:
    type: number
    description: "Composite complexity score (primarily Entropy Level for analysis)."
required:
  - case_id
  - variant_type
  - commands_json
  - entropy_score
  - semantic_similarity
  - dependency_depth
  - complexity_score
additionalProperties: false
