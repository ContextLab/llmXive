$schema: http://json-schema.org/draft-07/schema#
title: InferenceResult
description: Schema for world model inference results (or proxy metrics).
type: object
properties:
  result_id:
    type: string
    description: "Unique identifier for the inference result."
  variant_id:
    type: string
    description: "Foreign key to SequenceVariant."
  model_name:
    type: string
    description: "Name of the world model used (or 'proxy' if proxy metric used)."
  video_path:
    type: string
    nullable: true
    description: "Relative path to the generated MP4 file (null if proxy used)."
  physics_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Physics compliance score after baseline subtraction (or proxy metric)."
  consistency_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Temporal consistency score (or proxy metric)."
  status:
    type: string
    enum:
      - success
      - failed
      - timeout
      - proxy_used
    description: "Status of the inference run."
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of the run."
required:
  - result_id
  - variant_id
  - model_name
  - status
  - timestamp
additionalProperties: false
