[metadata]
name = llmxive-bcc-yield-strength
version = 0.1.0

[options]
python_requires = >=3.11
install_requires =
    numpy>=1.24.0,<2.0.0
    pandas>=2.0.0,<3.0.0
    scikit-learn>=1.3.0,<2.0.0
    scipy>=1.11.0,<2.0.0
    periodictable>=1.7.0,<2.0.0
    skbio>=0.5.9,<1.0.0
    requests>=2.31.0,<3.0.0
    openpyxl>=3.1.0,<4.0.0
    pyyaml>=6.0.0,<7.0.0

[options.packages.find]
where = .
include = code*, tests*

[flake8]
max-line-length = 88
extend-ignore = E203
