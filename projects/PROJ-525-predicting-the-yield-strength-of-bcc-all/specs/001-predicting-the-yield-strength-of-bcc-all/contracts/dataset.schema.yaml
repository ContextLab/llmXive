$schema: "http://json-schema.org/draft-07/schema#"
title: "AlloyRecord"
description: "Schema for a single alloy record in the filtered dataset."
type: object
required:
  - system_id
  - elemental_composition
  - yield_strength
  - yield_definition
  - crystal_structure
properties:
  system_id:
    type: string
    description: "Unique identifier for the alloy entry."
  elemental_composition:
    type: object
    additionalProperties:
      type: number
      minimum: 0
      maximum: 1
    description: "Dictionary of element symbols to atomic fractions."
  yield_strength:
    type: number
    description: "Yield strength in MPa."
    minimum: 0
  yield_definition:
    type: string
 description: "Definition of yield strength (e.g., '[deferred] offset')."
  crystal_structure:
    type: string
    enum:
      - "BCC"
    description: "Crystal structure. Must be BCC for this dataset."
  source_reference:
    type: string
    description: "DOI or URL of the source data."