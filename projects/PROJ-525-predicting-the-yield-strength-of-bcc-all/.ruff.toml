[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "C90", "D", "PT", "SIM", "T20", "RUF"]
ignore = ["E402", "E501", "E722", "F401", "F811", "W503", "W504", "B018", "SIM102", "SIM103"]
exclude = ["data/", "tests/", "reports/", "state/", "figures/", "*.pyi"]
target-version = "py311"

[lint.per-per-file-ignores]
"__init__.py" = ["F401"]

[lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[lint.flake8-unused-arguments]
ignore-variadics = true
ignore-classes = true

[lint.isort]
force-grid-wrap = true
lines-between-imports = 2

[lint.py.flake8-comprehensions]
extend-blanks = true

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[lint.mccabe]
max-complexity = 10

[lint.pycodestyle]
max-line-length = 100

[lint.py.flake8-implicit-str-concat]
allow-multiline = true

[lint.py.flake8-pyi]
# Specific rules for .pyi files if any

