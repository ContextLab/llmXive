# Ruff configuration for PROJ-525
# Enforces PEP 8, removes unused imports, and ensures type hints are present where possible

# Target Python 3.11 as per T002
target-version = "py311"

# Line length matches Black default
line-length = 88

# Exclude generated or heavy directories
exclude = [
    ".git",
    "__pycache__",
    ".eggs",
    "*.egg-info",
    "data",
    "build",
    "dist",
    "venv",
    ".venv",
]

[lint]
# Enable all relevant rules
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort (sorting imports)
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade (modernize syntax)
    "N",  # pep8-naming
    "RUF",# Ruff-specific rules
]

# Ignore specific rules that are too noisy for this project
ignore = [
    "E501", # Line too long (handled by Black)
    "C901", # Complex structure (too strict for initial research scripts)
    "B905", # zip without strict=True (Python 3.10+ specific, can be noisy)
]

[lint.isort]
known-first-party = ["code", "utils"]
force-to-top = ["code", "utils"]

[lint.per-file-ignores]
# Allow specific deviations in test files
"tests/*" = ["S101"] # Assert statements are fine in tests
