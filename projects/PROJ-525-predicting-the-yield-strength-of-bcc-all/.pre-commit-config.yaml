repos:
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/astral/ruff
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        language_version: python3.11

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v0.3.6
    hooks:
      - id: trailing-whitespace
        language_version: python3.11
      - id: end-of-file
        language_version: python3.11
