[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-bcc-yield-strength"
version = "0.1.0"
description = "Predicting the Yield Strength of BCC Alloys"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "periodictable>=1.7.0",
    "skbio>=0.5.9",
    "scipy>=1.11.0",
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | reports
    | state
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "data",
    "reports",
    "state",
    "figures",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "E402", # module level import not at top of file
    "E722", # do not use bare 'except'
    "F401", # unused imports (handled by isort)
    "W503", # line break before binary operator
    "W504", # line break after binary operator
    "B018", # useless expression
    "SIM102", # use a single if statement
    "SIM103", # return the condition directly
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"code/utils/*.py" = ["SIM102"]
"tests/*.py" = ["F401", "N802", "N806"]

[tool.ruff.lint.isort]
lines-between-types = 1
force-single-line = false
force-sort-within-sections = false
known-first-party = ["code", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["code"]
omit = ["tests/*", "data/*", "reports/*", "state/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
