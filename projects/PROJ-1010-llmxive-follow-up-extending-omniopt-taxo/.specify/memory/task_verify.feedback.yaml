T015:
  reason: "The `spectral_extractor.py` allocates a full `(steps, total_params)` NumPy\
    \ array (`gradient_accumulator = np.zeros((steps, total_params))`) which for typical\
    \ models (e.g., ResNet\u201118 \u2248\u202F11\u202FM parameters) would require\
    \ >\u202F8\u202FGB of RAM, violating the <\u202F7\u202FGB limit. Moreover, the\
    \ code calls `check_memory_usage(MEMORY_LIMIT_GB * 1e9)`, but `check_memory_usage`\
    \ is defined without parameters, so the memory\u2011limit enforcement never runs.\
    \ These issues mean the implementation does not provide the required memory\u2011\
    efficient gradient accumulation and covariance computation."
