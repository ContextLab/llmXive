$schema: "http://json-schema.org/draft-07/schema#"
title: "CorrelationResults"
description: "Schema for the output of the Spearman correlation analysis."
type: "array"
items:
  type: "object"
  properties:
    feature_name:
      type: "string"
      description: "Name of the feature tested (e.g., condition_number, spectral_entropy)."
      enum:
        - "condition_number"
        - "spectral_entropy"
    spearman_rho:
      type: "number"
      description: "Spearman correlation coefficient."
      minimum: -1
      maximum: 1
    p_value:
      type: "number"
      description: "Exact p-value from Spearman test."
      minimum: 0
      maximum: 1
    bonferroni_p_value:
      type: "number"
      description: "Bonferroni-corrected p-value."
      minimum: 0
      maximum: 1
    n_samples:
      type: "integer"
      description: "Number of samples used."
      minimum: 1
    significance:
      type: "boolean"
      description: "True if bonferroni_p_value < 0.05."
  required:
    - feature_name
    - spearman_rho
    - p_value
    - bonferroni_p_value
    - n_samples
    - significance
  additionalProperties: false
