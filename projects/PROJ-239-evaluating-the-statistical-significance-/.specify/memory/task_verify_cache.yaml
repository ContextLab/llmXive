T003:
  c: false
  h: 1a5d28504bc6acc51186234cfc8506b7683e4877347cec15543b8bfa0c2fa470
  r: "The repository contains `code/data_generator.py` that implements log\u2011normal\
    \ cluster sizes, a random\u2011intercept model, ICC\u202F=\u202F0 handling, and\
    \ cluster\u2011level treatment assignment. However, the supplied unit test `tests/unit/test_data_generator.py`\
    \ does **not** compute or verify the empirical ICC against the requested value,\
    \ nor is there any other test or evidence that the ICC tolerance requirement (\xB1\
    0.02) is satisfied. A test (or execution evidence) checking the ICC is required\
    \ to meet the task\u2019s verification criterion."
  sig: c4563b716aeb4877e5365a71b01971cd7b4ab60d9c1c061c8e910002642069a9
T004:
  c: false
  h: f3da40ccce1b7d983be18c29c46fc1b6817538d5b17ae97f0718048e95e7cac4
  r: "The `code/estimators.py` file exists and the naive t\u2011test and block\u2011\
    permutation functions meet the test expectations, but `run_cluster_robust_ttest`\
    \ does **not** use the CR2 estimator from `statsmodels.stats.api` as required\u2014\
    it only fits an OLS model with `cov_type='cluster'`. The task explicitly demanded\
    \ the CR2 estimator, so the implementation is incomplete."
