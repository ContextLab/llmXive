# llmXive Environment Configuration
# This file manages environment variables for HuggingFace token and dataset paths

# HuggingFace Configuration
huggingface:
  # Your HuggingFace API token for accessing gated datasets
  # Can also be set via the HF_TOKEN environment variable
  token: ""

# Dataset Paths
# Configure local paths for datasets. If a path is not specified, the default
# will be used (data/<dataset_name>). Paths can be absolute or relative to project root.
datasets:
  ultrafeedback: "data/ultrafeedback"
  dolly: "data/dolly"

# Execution Settings
execution:
  # Maximum runtime in seconds (5.5 hours = 19800 seconds)
  max_runtime_seconds: 19800
  
  # Random seed for reproducibility
  random_seed: 42

# Logging Configuration
logging:
  level: "INFO"
  output_dir: "results"
