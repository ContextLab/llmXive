$schema: "http://json-schema.org/draft-07/schema#"
title: "Filtered Dataset Schema"
description: "Schema for the filtered BigBench dataset containing prompts with at least three rationales per prompt."
type: object
properties:
  prompt_id:
    type: string
    description: "Unique identifier for the prompt."
  prompt_text:
    type: string
    description: "The prompt text."
  rationales:
    type: array
    items:
      type: string
    description: "List of rationales; must contain at least three entries."
  rationale_count:
    type: integer
    minimum: 3
    description: "Number of rationales (must be ≥ 3)."
  source:
    type: string
    description: "Dataset origin (e.g., bigbench_hard, bigbench_ethics, bigbench_causal)."
required:
  - prompt_id
  - prompt_text
  - rationales
  - rationale_count
  - source
additionalProperties: false