$schema: "http://json-schema.org/draft-07/schema#"
title: "Teacher Logits Schema"
description: "Schema for the averaged logits of unselected rationales (teacher distribution)."
type: object
properties:
  prompt_id:
    type: string
    description: "Reference to the original prompt."
  teacher_logits:
    type: array
    items:
      type: number
    description: "Averaged pre‑softmax logits vector (length equals model vocab size)."
  logits_source:
    type: string
    description: "Identifier of the dataset shard used to compute these logits."
required:
  - prompt_id
  - teacher_logits
  - logits_source
additionalProperties: false
