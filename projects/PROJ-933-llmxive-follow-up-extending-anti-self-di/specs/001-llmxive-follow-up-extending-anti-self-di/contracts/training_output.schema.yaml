$schema: http://json-schema.org/draft-07/schema#
title: Training Output Schema
description: Schema for the training trajectory logs.
type: object
properties:
  step:
    type: integer
    minimum: 1
    description: Training step number.
  prompt_id:
    type: string
    description: Reference to the prompt.
  condition:
    type: string
    enum:
      - AntiSD
      - StandardSD
    description: Training condition.
  loss:
    type: number
    description: Current loss value.
  js_divergence:
    type: number
    description: Jensen-Shannon divergence.
  gradient_dot_product:
    type: number
    description: Dot product of gradients.
  generated_trajectory:
    type: string
    description: Generated text.
  deliberation_count:
    type: integer
    minimum: 0
    description: Count of deliberation tokens.
  deliberation_tokens:
    type: array
    items:
      type: string
    description: List of specific tokens found.
required:
  - step
  - prompt_id
  - condition
  - loss
  - js_divergence
  - gradient_dot_product
  - generated_trajectory
  - deliberation_count
