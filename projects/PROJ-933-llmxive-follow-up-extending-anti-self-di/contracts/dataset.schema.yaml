# Dataset Schema for llmXive Anti-Self-Distillation Research
# Defines the structure of the preprocessed dataset used in training
$schema: http://json-schema.org/draft-07/schema#
title: llmXive Dataset Schema
type: object
required:
  - prompts
  - metadata
properties:
  prompts:
    type: array
    description: List of prompt objects, each containing context and rationale splits
    items:
      type: object
      required:
        - prompt_id
        - prompt_text
        - privileged_context
        - target_rationales
        - rationale_count
      properties:
        prompt_id:
          type: string
          description: Unique identifier for the prompt (hash of text)
          pattern: "^[a-f0-9]{32}$"
        prompt_text:
          type: string
          description: The original user prompt
          minLength: 1
        privileged_context:
          type: object
          description: The single selected rationale used as privileged context (c)
          required:
            - rationale_id
            - text
            - tokens
          properties:
            rationale_id:
              type: string
              description: Unique ID for the privileged rationale
            text:
              type: string
              description: The full text of the privileged rationale
            tokens:
              type: integer
              description: Token count of the privileged rationale
              minimum: 0
        target_rationales:
          type: array
          description: List of remaining rationales to be used for teacher distribution
          items:
            type: object
            required:
              - rationale_id
              - text
              - tokens
              - quality_score
            properties:
              rationale_id:
                type: string
              text:
                type: string
              tokens:
                type: integer
                minimum: 0
              quality_score:
                type: number
                description: Human or proxy quality score (0.0 to 1.0)
                minimum: 0.0
                maximum: 1.0
        rationale_count:
          type: integer
          description: Total number of distinct annotated reasoning traces
          minimum: 4
        source_dataset:
          type: string
          enum:
            - ultrafeedback
            - dolly
          description: Origin dataset for this prompt
        split_type:
          type: string
          enum:
            - train
            - validation
            - test
          description: Data split assignment
  metadata:
    type: object
    required:
      - total_prompts
      - avg_tokens_per_prompt
      - avg_rationales_per_prompt
      - datasets_used
      - processing_timestamp
    properties:
      total_prompts:
        type: integer
        minimum: 0
      avg_tokens_per_prompt:
        type: number
        minimum: 0
      avg_rationales_per_prompt:
        type: number
        minimum: 4
      datasets_used:
        type: array
        items:
          type: string
      processing_timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the dataset was processed
      filter_criteria:
        type: object
        properties:
          min_rationales:
            type: integer
            const: 4
          max_tokens:
            type: integer
additionalProperties: false
