[settings]
profile = black
line_length = 100
known_first_party = config, data, models, analysis
known_third_party = datasets, pandas, numpy, torch, yaml, pytest
skip = .git,.mypy_cache,.ruff_cache,__pycache__,.venv,venv,build,dist,node_modules
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
