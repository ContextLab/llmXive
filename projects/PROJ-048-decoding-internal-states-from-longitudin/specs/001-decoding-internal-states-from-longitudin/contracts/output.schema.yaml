$schema: "http://json-schema.org/draft-07/schema#"
title: "Output Schema"
description: "Schema for pipeline output artifacts produced by each stage."
type: object
required:
  - stage
  - timestamp
  - artifact_path
  - checksum
properties:
  stage:
    type: string
    description: Name of the pipeline stage that generated the output (e.g., "download", "preprocess", "nmf", "stats").
  timestamp:
    type: string
    format: date-time
    description: ISO‑8601 timestamp when the artifact was written.
  artifact_path:
    type: string
    description: Relative path to the output file.
  checksum:
    type: string
    description: SHA256 checksum of the artifact for integrity verification.
  metadata:
    type: object
    description: Optional free‑form metadata associated with the output.
    additionalProperties: true
