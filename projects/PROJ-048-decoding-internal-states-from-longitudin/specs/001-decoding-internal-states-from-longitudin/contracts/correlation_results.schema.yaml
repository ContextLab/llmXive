$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Results Schema"
description: "Schema for Spearman correlation results between NMF component weights and behavioral metrics, including permutation‑test statistics and FDR‑corrected significance."
type: object
required:
  - component_id
  - behavior_metric
  - spearman_r
  - spearman_p
  - permutation_p
  - fdr_corrected_p
  - significant
properties:
  component_id:
    type: integer
    description: Identifier of the NMF component (0‑based).
  behavior_metric:
    type: string
    description: Name of the behavioral metric (e.g., "running_speed").
  spearman_r:
    type: number
    description: Spearman correlation coefficient.
  spearman_p:
    type: number
    description: Two‑tailed p‑value from the analytical Spearman test.
  permutation_p:
    type: number
    description: Empirical p‑value from the 1000‑iteration permutation test.
  fdr_corrected_p:
    type: number
    description: Benjamini‑Hochberg FDR‑adjusted p‑value.
  significant:
    type: boolean
    description: True if the FDR‑corrected p‑value < 0.05.
  additional_info:
    type: object
    description: Optional extra fields (e.g., confidence intervals).
    additionalProperties: true