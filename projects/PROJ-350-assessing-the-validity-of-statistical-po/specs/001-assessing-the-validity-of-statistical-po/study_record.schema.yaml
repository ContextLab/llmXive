$schema: http://json-schema.org/draft-07/schema#
title: Study Record Schema
description: Schema for extracted study records from OSF pre-registrations.
type: array
items:
  type: object
  required:
    - study_id
    - title
  properties:
    study_id:
      type: string
      description: OSF study identifier
    title:
      type: string
      description: Title of the study
    planned_power:
      type: number
      minimum: 0
      maximum: 1
      nullable: true
    target_n:
      type: integer
      minimum: 1
      nullable: true
    effect_size_assumption:
      type: number
      nullable: true
    field:
      type: string
      nullable: true
    missing_planned_data:
      type: boolean
    source_citation:
      type: string
  additionalProperties: true
