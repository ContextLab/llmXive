[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-power-validity"
version = "0.1.0"
description = "Assessing the Validity of Statistical Power in Publicly Available Pre-Registered Studies"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "pytest>=7.4.0",
    "jsonschema>=4.19.0",
    "pyyaml>=6.0.1",
    "statsmodels>=0.14.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.black]
line-length = 88
target-version = ['py39']
