# Ruff configuration for llmXive PROJ-059
# Enforces strict linting rules for automated bias detection pipeline

line-length = 100
target-version = "py311"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "RUF" # Ruff-specific rules
]
ignore = [
    "E501", # line-too-long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in CLI)
]

[lint.per-file-ignores]
"tests/*" = ["S101"] # Allow asserts in tests

[lint.isort]
known-first-party = ["bias_pipeline", "cli"]
force-sort-within-sections = true
