$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Results Schema"
description: "Schema for data/derived/correlation_results.csv containing statistical correlation outputs."
type: "object"
properties:
  test_id:
    type: "string"
    description: "Unique identifier for the hypothesis test."
  predictor:
    type: "string"
    description: "Name of the predictor variable (e.g., 'mean_bias_score')."
  outcome:
    type: "string"
    description: "Name of the outcome variable (e.g., 'demographic_parity_diff')."
  spearman_rho:
    type: "number"
    description: "Spearman rank correlation coefficient."
  p_value_raw:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Raw p-value from the correlation test."
  p_value_bonferroni:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Bonferroni-corrected p-value."
  n_samples:
    type: "integer"
    minimum: 2
    description: "Number of repositories used in the correlation."
  significance_flag:
    type: "string"
    enum:
      - "High Risk"
      - "Low Risk"
    description: "Flag indicating if the result is statistically significant."
required:
  - test_id
  - predictor
  - outcome
  - spearman_rho
  - p_value_raw
  - p_value_bonferroni
  - n_samples
  - significance_flag
additionalProperties: false
