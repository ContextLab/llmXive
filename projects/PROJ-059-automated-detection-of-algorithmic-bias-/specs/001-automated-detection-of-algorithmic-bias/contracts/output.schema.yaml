$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Result Schema"
description: "Schema for the final correlation results (correlation_results.csv)"
type: "object"
properties:
  metric_pair:
    type: "string"
    description: "Name of the metric pair tested (e.g. 'text_score vs dp')"
  spearman_rho:
    type: "number"
    description: "Spearman correlation coefficient"
  p_value_raw:
    type: "number"
    description: "Raw p-value from hypothesis test"
  p_value_bonferroni:
    type: "number"
    description: "Bonferroni-corrected p-value"
  alpha:
    type: "number"
    description: "Significance threshold used"
  significance:
    type: "boolean"
    description: "Whether result is significant at given alpha"
required:
  - "metric_pair"
  - "spearman_rho"
  - "p_value_raw"
  - "p_value_bonferroni"
  - "alpha"
  - "significance"
