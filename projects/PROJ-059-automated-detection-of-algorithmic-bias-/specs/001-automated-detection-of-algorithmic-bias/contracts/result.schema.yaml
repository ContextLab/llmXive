$schema: http://json-schema.org/draft-07/schema#
title: Correlation Result
description: Final statistical output of the correlation analysis.
type: object
properties:
  metric_type:
    type: string
    enum: ["demographic_parity", "equalized_odds"]
    description: "Type of fairness metric analyzed"
  spearman_rho:
    type: number
    description: "Spearman rank correlation coefficient"
  p_value_raw:
    type: number
    description: "Raw p-value before correction"
  p_value_bonferroni:
    type: number
    description: "P-value after Bonferroni correction"
  significant:
    type: boolean
    description: "True if p_value_bonferroni < alpha_threshold"
  alpha_threshold:
    type: number
    description: "The alpha level used for significance testing"
required:
  - metric_type
  - spearman_rho
  - p_value_bonferroni
  - significant
  - alpha_threshold
additionalProperties: false
