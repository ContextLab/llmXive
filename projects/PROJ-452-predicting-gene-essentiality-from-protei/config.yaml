# Project Configuration for Gene Essentiality Prediction
# Generated by T004: Load organism IDs and thresholds from YAML

# Organism IDs (NCBI Taxonomy IDs)
# Human (9606), S. cerevisiae (559292), E. coli (83333), Mouse (10090), D. melanogaster (7227)
organisms:
  - '9606'
  - '559292'
  - '83333'
  - '10090'
  - '7227'

# STRING confidence thresholds to evaluate
confidence_thresholds:
  - 500
  - 700
  - 900

# Permutation count for null model (T019c_static)
permutation_count: 10000

# Execution time limit in hours (T041c)
execution_time_limit_hours: 6

# Random seed for reproducibility (T072)
random_seed: 42

# Path configuration
paths:
  data_raw: data/raw
  data_processed: data/processed
  data_phylogeny: data/phylogeny
  results: results
  state: state
  figures: figures
  cache: data/cache
