$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Result"
description: "Schema for aggregated correlation statistics"
type: object
properties:
  organism_id:
    type: string
    description: "Source organism ID"
  metric_type:
    type: string
    enum:
      - degree
      - betweenness
      - eigenvector
    description: "Type of centrality metric analyzed"
  threshold:
    type: integer
    minimum: 0
    maximum: 1000
    description: "STRING confidence score threshold used"
  spearman_rho:
    type: number
    description: "Spearman correlation coefficient"
  p_value:
    type: number
    minimum: 0
    maximum: 1
    description: "Two-tailed p-value"
  sample_size:
    type: integer
    minimum: 1
    description: "Number of genes analyzed"
  significant:
    type: boolean
    description: "Whether p < 0.05 (uncorrected)"
  adjusted_p_value:
    type: number
    description: "Benjamini-Hochberg adjusted p-value"
required:
  - organism_id
  - metric_type
  - threshold
  - spearman_rho
  - p_value
  - sample_size
  - significant
additionalProperties: false
