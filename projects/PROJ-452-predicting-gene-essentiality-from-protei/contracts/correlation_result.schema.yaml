$schema: http://json-schema.org/draft-07/schema#
title: Correlation Result Schema
description: >
  Schema for the output of the cross-species correlation analysis (User Story 1).
  Contains Spearman correlation coefficients, p-values, and metadata for each organism
  and centrality metric.
type: object
required:
  - organism
  - network_stats
  - centrality_results
  - analysis_metadata
additionalProperties: false
properties:
  organism:
    type: object
    required:
      - name
      - tax_id
      - source
    properties:
      name:
        type: string
        description: Scientific name of the organism (e.g., "Saccharomyces cerevisiae")
      tax_id:
        type: integer
        description: NCBI Taxonomy ID
      source:
        type: string
        description: Data source identifier (e.g., "STRING", "DEG")

  network_stats:
    type: object
    required:
      - nodes
      - edges
      - density
      - connected_components
    properties:
      nodes:
        type: integer
        minimum: 0
      edges:
        type: integer
        minimum: 0
      density:
        type: number
        minimum: 0.0
        maximum: 1.0
      connected_components:
        type: integer
        minimum: 1
      largest_component_size:
        type: integer
        minimum: 0

  centrality_results:
    type: object
    required:
      - degree
      - betweenness
      - eigenvector
    additionalProperties: false
    properties:
      degree:
        type: object
        required:
          - spearman_rho
          - p_value
          - sample_size
        properties:
          spearman_rho:
            type: number
            description: Spearman rank correlation coefficient
          p_value:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: Two-tailed p-value for the correlation
          sample_size:
            type: integer
            minimum: 0
            description: Number of genes with both centrality and essentiality data
          empirical_p_value:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: Empirical p-value from label permutation (if computed)
          null_distribution_summary:
            type: object
            properties:
              mean:
                type: number
              std:
                type: number
              min:
                type: number
              max:
                type: number

      betweenness:
        type: object
        required:
          - spearman_rho
          - p_value
          - sample_size
        properties:
          spearman_rho:
            type: number
          p_value:
            type: number
            minimum: 0.0
            maximum: 1.0
          sample_size:
            type: integer
            minimum: 0
          empirical_p_value:
            type: number
            minimum: 0.0
            maximum: 1.0
          null_distribution_summary:
            type: object
            properties:
              mean:
                type: number
              std:
                type: number
              min:
                type: number
              max:
                type: number

      eigenvector:
        type: object
        required:
          - spearman_rho
          - p_value
          - sample_size
        properties:
          spearman_rho:
            type: number
          p_value:
            type: number
            minimum: 0.0
            maximum: 1.0
          sample_size:
            type: integer
            minimum: 0
          empirical_p_value:
            type: number
            minimum: 0.0
            maximum: 1.0
          null_distribution_summary:
            type: object
            properties:
              mean:
                type: number
              std:
                type: number
              min:
                type: number
              max:
                type: number

  analysis_metadata:
    type: object
    required:
      - confidence_threshold
      - timestamp
      - software_versions
    properties:
      confidence_threshold:
        type: integer
        minimum: 0
        maximum: 1000
        description: STRING confidence score threshold used
      mapping_coverage_percent:
        type: number
        minimum: 0.0
        maximum: 100.0
        description: Percentage of genes successfully mapped between datasets
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of analysis execution
      software_versions:
        type: object
        required:
          - python
          - networkx
          - scipy
        properties:
          python:
            type: string
          networkx:
            type: string
          scipy:
            type: string
      warnings:
        type: array
        items:
          type: string
        description: List of warnings generated during analysis
