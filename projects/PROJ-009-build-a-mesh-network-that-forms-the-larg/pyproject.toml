[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-network-supercomputer"
version = "0.1.0"
description = "Mesh Network Supercomputer Using Pooled Idle Computing Resources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.3.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "pygam>=0.9.0",
    "statsmodels>=0.14.0",
    "pytest>=7.4.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "simpy>=4.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black/ruff format)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # Allow assert in tests

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]