T001:
  reason: "The project lacks the required `config/sweep_config.yaml` that should mirror\
    \ the global `random_seed`. Additionally, `code/orchestrator/contract_validator.py`\
    \ expects a bare schema name (e.g., `\"physical-node\"`), but the contract tests\
    \ pass the full filename (`\"physical-node.schema.yaml\"`), causing schema\u2011\
    file lookup failures and test errors. These missing/incorrect artifacts prevent\
    \ the task\u2019s verification steps from succeeding."
