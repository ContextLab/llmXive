T002:
  reason: "The provided `node_manager.py` fails the unit tests (two discovery cases\
    \ raise errors) and the test suite does not cover the required instrumentation\
    \ (tool\u2011presence checks, CPU profiling, radio metrics, thermal read\u2011\
    outs). No `data/raw/physical_node_<ip>.json` files are generated, and the schema\
    \ validation in `collect_and_write_metadata` points to a non\u2011existent schema\
    \ path (`specs/.../contracts`) so it would raise a `FileNotFoundError` even if\
    \ called. The task therefore does not meet the specification."
  task: 84a1cd9c624be555f7aba06b6ba0e64588518351f80f5e5995a05855f0fc2d2e
T003:
  reason: "Checked `code/orchestrator/scheduler.py` (exists and passes all unit tests)\
    \ and `code/tests/unit/test_scheduler.py` (all 12 tests pass). However `data/raw/dropout_events.json`\
    \ is missing, and the scheduler does not implement several required features:\
    \ it never detects or logs sleep\u2011mode drop\u2011outs, it never invokes the\
    \ `check_network_saturation` method, it lacks logic to flag a task as a straggler\
    \ using the \u201C2\xD7 median\u201D timeout, and it does not record separate\
    \ handshake vs. compute timestamps per task. Consequently the task\u2019s full\
    \ specification is not satisfied."
