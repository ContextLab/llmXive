T002:
  c: false
  h: 1985475bd5d63380fce58425abf34f991426e9641f2b4f4df8015a4314e5068a
  r: "The repository lacks the required `contracts/physical-node.schema.yaml` (it\
    \ is marked MISSING), so schema validation cannot be performed. No `data/raw/physical_node_<ip>.json`\
    \ files are present, indicating `collect_and_write_metadata` was never exercised,\
    \ and the supplied unit tests only cover node discovery/factory\u2014not tool\u2011\
    presence checks, CPU profiling, radio metrics, or thermal read\u2011outs as required.\
    \ The task therefore remains incomplete."
  sig: 28bd2c8fdd681308b30d16ea5ef9e35821a3184c3887747e6c0722309eca5d8d
T003:
  c: false
  h: c7bb31daaef28781353afcdddab8cf4f5b3092495b2e9dece209580e5713142a
  r: "`data/raw/dropout_events.json` is MISSING \u2014 the task requires it to be\
    \ created by a mock run in the test suite, but no test in `test_scheduler.py`\
    \ writes it (no test calls `dump_events`, and the dropout paths for sleep mode\
    \ and network saturation are not exercised at all, contrary to the artifact spec).\
    \ Additionally, requirement (e) \u2014 recording coordination-overhead timestamps\
    \ (handshake vs. compute) per task \u2014 is not implemented anywhere in `scheduler.py`,\
    \ and there is no execution evidence that the tests or CLI run actually pass."
  sig: 5872376fd082e77463559876ac897edd9f90205e4ea483b0a1754ae42ab47209
T004:
  c: false
  h: caeb029f92032cbdb3ae8de37a7a06e1dcc650c20c457036aa20cc86706c7528
  r: "The required output artifacts `data/raw/run_001.csv`, `data/raw/task_chunks/run_001.jsonl`,\
    \ and `data/raw/validation_status.json` are all MISSING \u2014 the CLI was never\
    \ successfully executed, so there is no evidence it exits 0 or produces real measured\
    \ rows. Additionally, the CLI implements a `run` sub-command, not the required\
    \ `run-single`, and its \"packet_count\" is just the iteration count (not a real\
    \ per-node packet measurement), so even the code does not match the task's requirements."
  sig: cff1b2a2f35ba23e09fd00502f016df26d6b97dc8f42e5fdd7dd1ee1230ae39a
T014:
  c: false
  h: af7b35582ea3c2e05ff425eb452e808fee0baf66c6e82bc7293747926f427af3
  r: "The required fixture logs `data/raw/sample_tcpdump.log`, `data/raw/sample_mpstat.log`,\
    \ and `data/raw/sample_iwconfig.log` are all MISSING (as are the sensors/ping\
    \ fixtures the tests reference), so `pytest code/tests/unit/test_instrumentor.py`\
    \ cannot pass \u2014 every parser test reads one of these files and would raise\
    \ FileNotFoundError. The implementer must create the real-format sample logs (tcpdump\
    \ \"123 packets captured\", mpstat, iwconfig with Signal level=-40 dBm / SNR=50,\
    \ sensors +42.0\xB0C, ping with avg 0.030 ms) and provide evidence of a passing\
    \ pytest run."
  sig: 2f32ceefe126c3aa8c1b83946169056f945c783e308fe16e862ccfac5d9699d5
T015:
  c: false
  h: 18bffd29cce775df218e0688041c6e8a7f474540a47eeb3816b26fc1ffbc2576
  r: The required artifacts `data/raw/network_calibration.json`, `data/raw/cpu_calibration.json`,
    and `code/tests/unit/test_calibration.py` are all MISSING from disk, so there
    is no evidence of real measured calibration factors or a present test. Additionally,
    `calibration.py` runs `iperf3 -c 127.0.0.1` without starting an iperf3 server,
    so the network calibration as written would fail rather than measure, and the
    historical test log references a file that no longer exists.
  sig: af4d6406855845ae5f4b3ecb7097ca94be0db2441171a660c83dd04e8bc024f9
