T001:
  c: false
  h: 84fea063140305b31682cd89eb442590dc4d7e4a7ed204fff625752a8ae731b3
  r: "The project lacks the required `config/sweep_config.yaml` that should mirror\
    \ the global `random_seed`. Additionally, `code/orchestrator/contract_validator.py`\
    \ expects a bare schema name (e.g., `\"physical-node\"`), but the contract tests\
    \ pass the full filename (`\"physical-node.schema.yaml\"`), causing schema\u2011\
    file lookup failures and test errors. These missing/incorrect artifacts prevent\
    \ the task\u2019s verification steps from succeeding."
  sig: ca7a13efbb6c02871b6906244be308010605e48dd29cfc99a3ec120e9b0a8b67
T002:
  c: false
  h: 0e35972d9371910c18eccaa5c325fc01c69858b4b7244aafca4f4f3440452f43
  r: "The provided `node_manager.py` fails the unit tests (two discovery cases raise\
    \ errors) and the test suite does not cover the required instrumentation (tool\u2011\
    presence checks, CPU profiling, radio metrics, thermal read\u2011outs). No `data/raw/physical_node_<ip>.json`\
    \ files are generated, and the schema validation in `collect_and_write_metadata`\
    \ points to a non\u2011existent schema path (`specs/.../contracts`) so it would\
    \ raise a `FileNotFoundError` even if called. The task therefore does not meet\
    \ the specification."
  sig: a7c1545ebefbaac26f4207eb2db78dc3b70f689fbeee53018df31a7face82c92
T003:
  c: false
  h: f1289b88c3442cb5c09054dc8779f16d605cb42f537f30a7aa3fe74d519bec0f
  r: "Checked `code/orchestrator/scheduler.py` (exists and passes all unit tests)\
    \ and `code/tests/unit/test_scheduler.py` (all 12 tests pass). However `data/raw/dropout_events.json`\
    \ is missing, and the scheduler does not implement several required features:\
    \ it never detects or logs sleep\u2011mode drop\u2011outs, it never invokes the\
    \ `check_network_saturation` method, it lacks logic to flag a task as a straggler\
    \ using the \u201C2\xD7 median\u201D timeout, and it does not record separate\
    \ handshake vs. compute timestamps per task. Consequently the task\u2019s full\
    \ specification is not satisfied."
  sig: 5634b092c39dbffc8ab4b498e19e280624c7a0b0c2ec6cbdbb626775266d0e97
T014:
  c: true
  h: ae17b4547a67029d0c5483001446154ec7b4116851a9ee1ae41db569ec11304c
  r: "Checked `code/orchestrator/instrumentor.py` for the required wrappers, parsers\
    \ and loss\u2011rate helper, and verified that `code/tests/unit/test_instrumentor.py`\
    \ runs via pytest with all six tests passing against the provided sample logs.\
    \ All specified functionalities are present and behave as required."
  sig: 985159a72e9a92ca44cf1e1189a83290cbd8d1af14df1acbdbd196a729d8a55d
T016:
  c: false
  h: dbe220537d41631d792758f081b43ed957ea75738e89d73af361bf15c87e5850
  r: The schema file and the `TaskChunkStore` implementation with its tests are present,
    but the required output file `data/raw/task_chunks/run_001.jsonl` (and any JSONL
    files under `data/raw/task_chunks/`) is missing, and there is no evidence of a
    step that validates the generated JSONL file against the schema after a run. These
