# Ruff configuration for llmXive mesh network project
[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in dataclasses)
]
extend-per-file-ignores = { "tests/*" = ["S101"] } # Allow assert in tests

[lint.isort]
known-first-party = ["orchestrator", "analysis", "simulation", "data"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
