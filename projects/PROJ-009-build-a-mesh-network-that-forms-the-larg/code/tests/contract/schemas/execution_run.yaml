$schema: "http://json-schema.org/draft-07/schema#"
title: ExecutionRun
description: Schema for a single execution run of the mesh network benchmark.
type: object
required:
  - run_id
  - timestamp
  - node_count
  - granularity
  - network_conditions
  - metrics
  - status
properties:
  run_id:
    type: string
    description: Unique identifier for the execution run.
    pattern: "^run_[0-9a-f]{8}$"
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the run started.
  node_count:
    type: integer
    minimum: 1
    description: Number of nodes involved in this run.
  granularity:
    type: string
    enum:
      - fine
      - medium
      - coarse
    description: Task chunk granularity setting.
  network_conditions:
    type: object
    required:
      - injected_latency_ms
      - packet_loss_rate
    properties:
      injected_latency_ms:
        type: number
        minimum: 0
        description: Latency injected in milliseconds.
      packet_loss_rate:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Packet loss rate as a fraction (0.0 to 1.0).
  metrics:
    type: object
    required:
      - wall_clock_time_seconds
      - throughput_ops_sec
      - cpu_utilization_pct
      - coordination_overhead_pct
    properties:
      wall_clock_time_seconds:
        type: number
        minimum: 0
        description: Total wall-clock time for the run in seconds.
      throughput_ops_sec:
        type: number
        minimum: 0
        description: Total operations per second achieved.
      cpu_utilization_pct:
        type: number
        minimum: 0.0
        maximum: 100.0
        description: Average CPU utilization across nodes.
      coordination_overhead_pct:
        type: number
        minimum: 0.0
        maximum: 100.0
        description: Percentage of time spent on coordination.
      heterogeneity_score:
        type: number
        minimum: 0
        description: Calculated heterogeneity score (optional).
  status:
    type: string
    enum:
      - success
      - excluded_network_saturation
      - excluded_oom
      - failed
    description: Final status of the run.
  errors:
    type: array
    items:
      type: string
    description: List of error messages if status is failed.
  metadata:
    type: object
    description: Additional metadata (key-value pairs).
additionalProperties: false
