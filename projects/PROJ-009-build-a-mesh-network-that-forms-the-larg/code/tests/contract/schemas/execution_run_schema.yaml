$schema: http://json-schema.org/draft-07/schema#
title: ExecutionRun
description: Represents a single execution run of the mesh network benchmark.
type: object
required:
  - node_count
  - granularity
  - throughput
  - overhead_ratio
properties:
  run_id:
    type: string
    description: Unique identifier for the run.
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the run.
  node_count:
    type: integer
    minimum: 1
    description: Number of nodes involved in the run.
  granularity:
    type: string
    enum:
      - fine
      - medium
      - coarse
    description: Task chunk granularity level.
  throughput:
    type: number
    minimum: 0
    description: Measured throughput in ops/sec.
  overhead_ratio:
    type: number
    minimum: 0
    description: Ratio of coordination overhead to compute time.
  latency_ms:
    type: number
    minimum: 0
    description: Injected network latency in milliseconds.
  packet_loss_rate:
    type: number
    minimum: 0
    maximum: 1
    description: Observed packet loss rate (0.0 to 1.0).
  cpu_utilization_pct:
    type: number
    minimum: 0
    maximum: 100
    description: Average CPU utilization percentage.
additionalProperties: false
