$schema: "http://json-schema.org/draft-07/schema#"
title: RegressionModel
description: Schema for the statistical regression model output (MLR or GAM).
type: object
required:
  - model_id
  - model_type
  - formula
  - r_squared
  - adjusted_r_squared
  - coefficients
  - p_values
  - interaction_terms
  - fit_timestamp
properties:
  model_id:
    type: string
    description: Unique identifier for the model instance.
    pattern: "^model_[0-9a-f]{8}$"
  model_type:
    type: string
    enum:
      - MLR
      - GAM
    description: Type of model fitted.
  formula:
    type: string
    description: The statistical formula used (e.g., 'throughput ~ ...').
  r_squared:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: R-squared value of the model.
  adjusted_r_squared:
    type: number
    description: Adjusted R-squared value.
  coefficients:
    type: object
    description: Map of feature names to their coefficient values.
    additionalProperties:
      type: number
  p_values:
    type: object
    description: Map of feature names to their p-values.
    additionalProperties:
      type: number
      minimum: 0.0
      maximum: 1.0
  interaction_terms:
    type: array
    description: List of interaction terms included in the model.
    items:
      type: string
    minItems: 1
  fit_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the model was fitted.
  aic:
    type: number
    description: Akaike Information Criterion (optional).
  bic:
    type: number
    description: Bayesian Information Criterion (optional).
  residuals:
    type: object
    description: Summary of residuals (optional).
    properties:
      mean:
        type: number
      std:
        type: number
      min:
        type: number
      max:
        type: number
additionalProperties: false
