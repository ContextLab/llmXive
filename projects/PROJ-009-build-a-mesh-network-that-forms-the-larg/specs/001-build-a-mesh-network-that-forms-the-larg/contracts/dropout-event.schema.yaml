$schema: "http://json-schema.org/draft-07/schema#"
title: "DropoutEvent Schema"
description: "Schema for node dropout/re‑assignment events logged during execution"
type: object
properties:
  node_id:
    type: string
    description: "IP address of the node that dropped out"
  timestamp:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp of the dropout detection"
  reason:
    type: string
    enum: ["heartbeat_loss", "oom", "sleep_mode", "network_saturation"]
    description: "Categorical reason for dropout"
  reassigned_task_id:
    type: string
    description: "Identifier of the task that was re‑assigned after dropout"
required:
  - node_id
  - timestamp
  - reason
additionalProperties: false
