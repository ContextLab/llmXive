$schema: "http://json-schema.org/draft-07/schema#"
title: "Processed Molecular Fluorescence Dataset"
type: object
required:
  - smiles
  - fqy_raw
  - fqy_norm
  - scaffold_id
  - split
properties:
  smiles:
    type: string
    description: "Canonical SMILES string parsed by RDKit."
  fqy_raw:
    type:
      - "number"
      - "null"
    description: "Experimental fluorescence quantum yield as reported."
  fqy_norm:
    type:
      - "number"
      - "null"
    description: "Clipped target value in (ε, 1-ε)."
  scaffold_id:
    type: string
    description: "Murcko scaffold identifier."
  split:
    type: string
    enum:
      - train
      - validation
      - test
    description: "Dataset split assignment."
  metadata:
    type: object
    description: "Optional experimental metadata."
    properties:
      solvent:
        type:
          - "string"
          - "null"
      temperature:
        type:
          - "number"
          - "null"
      measurement_method:
        type:
          - "string"
          - "null"
    additionalProperties: false
additionalProperties: false