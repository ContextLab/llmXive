[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-sparse-attention"
version = "0.1.0"
description = "Automated science pipeline for extending MiniMax Sparse Attention"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "torch",
    "datasets",
    "scipy",
    "pandas",
    "numpy",
    "pytest",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
