# Ruff configuration for llmXive project
# Enforces strict linting rules compatible with the project's coding standards

target-version = "py311"
line-length = 100

[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG"]
ignore = [
  "E501",  # Line too long (handled by black)
  "B008",  # Do not perform function call in argument defaults (common in dataclasses)
  "ARG001", # Unused function argument (often needed for abstract method signatures)
  "ARG002", # Unused method argument (often needed for abstract method signatures)
]

[lint.per-file-ignores]
# Allow imports in __init__.py without reordering
"__init__.py" = ["F401", "F403"]
# Allow unused variables in test files
"tests/**/*.py" = ["ARG", "B018"]

[lint.isort]
known-first-party = ["analysis", "data", "eval", "heuristics", "models", "utils"]
force-single-line = true
lines-after-imports = 2
