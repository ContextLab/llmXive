$schema: "http://json-schema.org/draft-07/schema#"
title: "Statistics Output Schema"
description: "Schema for final statistical results stored in data/final/stats.json"
type: "object"
properties:
  simple_stats:
    type: "object"
    description: "Results from Point-Biserial and t-test (Descriptive)."
    properties:
      point_biserial:
        type: "object"
        properties:
          correlation:
            type: "number"
            description: "Point-Biserial correlation coefficient."
          p_value:
            type: "number"
            description: "P-value for the correlation."
        required:
          - correlation
          - p_value
      paired_t_test:
        type: "object"
        properties:
          t_statistic:
            type: "number"
          p_value:
            type: "number"
        required:
          - t_statistic
          - p_value
      correlation_sensitivity:
        type: "object"
        description: "Sensitivity analysis of correlation (SC-005)."
        properties:
          original_correlation:
            type: "number"
          filtered_correlation:
            type: "number"
          excluded_count:
            type: "integer"
        required:
          - original_correlation
          - filtered_correlation
          - excluded_count
    required:
      - point_biserial
      - paired_t_test
      - correlation_sensitivity
  lme_analysis:
    type: "object"
    description: "Linear Mixed Effects model results (Primary Test)."
    properties:
      fixed_effect_model_type:
        type: "number"
        description: "Coefficient for Model Type fixed effect."
      fixed_effect_domain:
        type: "number"
        description: "Coefficient for Domain fixed effect."
      interaction_effect:
        type: "number"
        description: "Coefficient for Model_Type * Domain interaction."
      interaction_p_value:
        type: "number"
        description: "P-value for the interaction effect."
      random_effect_variance:
        type: "number"
        description: "Variance of the random intercept (Prompt_ID)."
      method:
        type: "string"
        description: "Method used (e.g., LME, REML)."
    required:
      - fixed_effect_model_type
      - fixed_effect_domain
      - interaction_effect
      - interaction_p_value
      - random_effect_variance
      - method
  dimension_independence:
    type: "object"
    description: "Check for halo effect between Consistency and Novelty/Feasibility."
    properties:
      consistency_novelty_corr:
        type: "number"
        description: "Correlation between Consistency and Novelty."
      consistency_feasibility_corr:
        type: "number"
        description: "Correlation between Consistency and Feasibility."
      is_valid:
        type: "boolean"
        description: "True if correlations < 0.8."
    required:
      - consistency_novelty_corr
      - consistency_feasibility_corr
      - is_valid
  power_analysis:
    type: "object"
    properties:
      n:
        type: "integer"
        description: "Sample size used"
      effect_size:
        type: "number"
        description: "Cohen's d used for calculation"
      power:
        type: "number"
        description: "Calculated power"
    required:
      - n
      - effect_size
      - power
  proxy_validation:
    type: "object"
    properties:
      correlation:
        type: "number"
        description: "Correlation between proxy and human scores."
      is_valid:
        type: "boolean"
        description: "True if correlation > 0.6."
      fallback_used:
        type: "boolean"
        description: "True if a fallback proxy or human-only mode was used."
    required:
      - correlation
      - is_valid
      - fallback_used
required:
  - simple_stats
  - lme_analysis
  - dimension_independence
  - power_analysis
  - proxy_validation
additionalProperties: false