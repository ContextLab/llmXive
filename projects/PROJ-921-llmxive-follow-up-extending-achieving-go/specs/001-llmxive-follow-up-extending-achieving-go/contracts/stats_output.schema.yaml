$schema: "http://json-schema.org/draft-07/schema#"
title: "Statistics Output Schema"
description: "Schema for final statistical results stored in data/processed/stats.json"
type: "object"
properties:
  lme_analysis:
    type: "object"
    properties:
      fixed_effect_model_type:
        type: "number"
        description: "Coefficient for Model Type fixed effect."
      fixed_effect_domain:
        type: "number"
        description: "Coefficient for Domain fixed effect."
      interaction_effect:
        type: "number"
        description: "Coefficient for Model_Type * Domain interaction."
      interaction_p_value:
        type: "number"
        description: "P-value for the interaction effect."
      random_effect_variance:
        type: "number"
        description: "Variance of the random intercept (Prompt_ID)."
      method:
        type: "string"
        description: "Method used (e.g., LME, REML)."
    required:
      - fixed_effect_model_type
      - fixed_effect_domain
      - interaction_effect
      - interaction_p_value
      - random_effect_variance
      - method
  dimension_independence:
    type: "object"
    properties:
      consistency_novelty_corr:
        type: "number"
        description: "Correlation between Consistency and Novelty."
      consistency_feasibility_corr:
        type: "number"
        description: "Correlation between Consistency and Feasibility."
      is_valid:
        type: "boolean"
        description: "True if correlations < 0.8."
    required:
      - consistency_novelty_corr
      - consistency_feasibility_corr
      - is_valid
  power_analysis:
    type: "object"
    properties:
      n:
        type: "integer"
        description: "Sample size used"
      effect_size:
        type: "number"
        description: "Cohen's d used for calculation"
      power:
        type: "number"
        description: "Calculated power"
    required:
      - n
      - effect_size
      - power
required:
  - lme_analysis
  - dimension_independence
  - power_analysis
additionalProperties: false