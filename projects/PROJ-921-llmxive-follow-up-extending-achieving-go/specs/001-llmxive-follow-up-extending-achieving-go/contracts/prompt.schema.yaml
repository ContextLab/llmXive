$schema: "http://json-schema.org/draft-07/schema#"
title: "Prompt"
description: "Schema for a single prompt entry in the unified dataset."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the prompt."
  source:
    type: "string"
    description: "Source dataset name (e.g., 'MMLU', 'OpenSci')."
  text:
    type: "string"
    description: "The full text of the prompt."
  type:
    type: "string"
    enum:
      - "deterministic"
      - "ill-structured"
    description: "Classification of the prompt type."
  domain:
    type: "string"
    enum:
      - "deterministic"
      - "ill-structured"
    description: "Domain label for LME analysis (mapped from type)."
  ground_truth:
    type: "string"
    description: "The correct answer (for deterministic prompts)."
required:
  - id
  - source
  - text
  - type
  - domain
additionalProperties: false