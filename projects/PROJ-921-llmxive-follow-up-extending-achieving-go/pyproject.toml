[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-achieving-go"
version = "0.1.0"
description = "Automated science pipeline extending 'Achieving Gold-Medal-Level Olympiad Reasoning via Simple and Unified S'"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "llmXive Research Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "transformers>=4.40",
    "torch>=2.0",
    "datasets>=2.19",
    "scipy",
    "statsmodels",
    "pandas",
    "pyyaml",
    "huggingface_hub",
    "pytest",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "mypy",
    "pre-commit",
]

[project.scripts]
run-inference = "code.inference.runner:main"
download-data = "code.data.download:main"
run-analysis = "code.analysis.report:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["code*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88