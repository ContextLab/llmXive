# Environment Configuration for Carbon Footprint Measurement
# This file contains regional CO2 conversion factors and power model constants.
# Generated as part of T006: Setup environment configuration.
# Depends on T004 (download_data.py) to exist (validation of data availability).

# Regional CO2 Conversion Factors (kg CO2 per kWh)
# Sources: Electricity Maps (2023), IEA (2024), and regional grid reports.
# Default region: US (average)
co2_factors:
  regions:
    US: 0.385  # US Average (EPA eGRID 2022)
    EU: 0.245  # EU-27 Average (IEA 2023)
    CN: 0.570  # China (IEA 2023)
    IN: 0.708  # India (CEA 2023)
    BR: 0.068  # Brazil (ONS 2023 - High renewable mix)
    DE: 0.365  # Germany (Umweltbundesamt 2023)
    CA: 0.120  # Canada (National average 2022)
    JP: 0.462  # Japan (METI 2023)
    AU: 0.680  # Australia (NEM 2023)
    UK: 0.215  # UK (BEIS 2023)
  default_region: "US"

# Power Model Constants for Human Baseline Estimation
# Based on literature: "Nosek et al., 2002" and "IEEE TSE 2020 average coding time"
# Reference: Typical laptop power consumption models
human_baseline:
  # Power draw in Watts for a standard development laptop
  # Range: Low (idle/light coding), Medium (average coding), High (intensive compilation)
  power_watts:
    low: 15    # Idle/light usage
    medium: 30 # Average coding session
    high: 60   # Heavy compilation/IDE usage
  # Default power model to use for baseline calculation
  default_power_model: "medium"
  # Power model for sensitivity analysis
  sensitivity_models:
    - name: "low"
      watts: 15
    - name: "medium"
      watts: 30
    - name: "high"
      watts: 60

# CodeCarbon Configuration
# Default settings for emissions tracking
codecarbon:
  # Default region if not specified in environment
  default_region: "US"
  # Measure on CPU only (as per project constraints)
  measure_cpu: true
  measure_gpu: false
  # Log level for CodeCarbon
  log_level: "INFO"
  # Output file for raw CodeCarbon logs (optional)
  output_file: "data/outputs/codecarbon_raw_logs.json"

# Project Paths (for reference, actual paths are handled by code)
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  outputs: "data/outputs"
  config: "code/config.yaml"

# Metadata
metadata:
  version: "1.0.0"
  created_by: "T006: Setup environment configuration"
  dependencies:
    - "T004: download_data.py (must exist)"
  notes: |
    This configuration file is used by:
    - calculate_emissions.py (for human baseline power models and CO2 factors)
    - run_inference.py (for CodeCarbon region configuration)
    - statistical_analysis.py (for sensitivity analysis power models)
    - generate_report.py (for reporting configuration)