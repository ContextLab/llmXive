# Project Configuration for Carbon Footprint Analysis
# Generated for T006: Environment configuration for regional CO2 conversion factors and power model constants

# Regional CO2 Conversion Factors (kg CO2eq per kWh)
# Source: ElectricityMap (2024) or similar regional grid intensity data
# These factors are used to convert energy consumption (kWh) to carbon emissions (kg CO2eq)
regional_co2_factors:
  # Default fallback if region is unknown
  default: 0.475
  # Major regions (approximate 2024 values)
  US: 0.417
  EU: 0.296
  CN: 0.581
  IN: 0.708
  JP: 0.462
  UK: 0.212
  CA: 0.120
  AU: 0.619
  DE: 0.366
  FR: 0.054

# Power Model Constants
# Used for estimating human developer carbon footprint based on device power draw
power_models:
  # Laptop power consumption models (Watts)
  laptop:
    low: 15.0      # Energy efficient laptop, idle/light work
    medium: 35.0   # Standard laptop under typical development load
    high: 65.0     # High-performance laptop under heavy load
    default: 35.0  # Default for human baseline calculations

  # Desktop power consumption models (Watts)
  desktop:
    low: 50.0
    medium: 150.0
    high: 350.0
    default: 150.0

  # Server power consumption models (Watts) - for reference
  server:
    low: 200.0
    medium: 500.0
    high: 1000.0
    default: 500.0

# Human Baseline Configuration
human_baseline:
  # Default power model to use for human developer calculations
  default_power_model: "laptop"
  # Default usage of the power model (low/medium/high)
  default_usage_level: "medium"
  # Time unit conversion (hours to minutes)
  time_unit: "minutes"

# CodeCarbon Configuration
codecarbon:
  # Default tracking mode
  default_mode: "cpu"
  # Log level for CodeCarbon
  log_level: "INFO"
  # Whether to save emissions data to a file
  save_to_file: true
  # Output directory for CodeCarbon logs (relative to project root)
  output_dir: "data/outputs/codecarbon_logs"

# Model Configuration
models:
  # Default model for inference
  default_model: "gpt2-medium"
  # Available models
  available:
    - "gpt2-medium"
    - "distilgpt2"
  # Device for inference (CPU only as per constraints)
  inference_device: "cpu"

# Data Paths
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  output_data: "data/outputs"
  figures: "figures"
  config: "code/config.yaml"

# Statistical Analysis Configuration
statistical_analysis:
  # Significance level for hypothesis testing
  alpha: 0.05
  # Confidence level for confidence intervals
  confidence_level: 0.95
  # Test to use when normality assumption fails
  fallback_test: "wilcoxon"

# Sensitivity Analysis Configuration
sensitivity_analysis:
  # Power models to test for human baseline sensitivity
  test_power_models:
    - "low"
    - "medium"
    - "high"
  # Stability threshold (conclusions must match across all models)
  stability_threshold: 1.0