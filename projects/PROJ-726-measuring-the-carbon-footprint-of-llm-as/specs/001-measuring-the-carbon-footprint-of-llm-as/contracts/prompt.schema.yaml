$schema: "http://json-schema.org/draft-07/schema#"
title: "Prompt Schema"
description: "Schema for a single prompt from CodeXGLUE."
type: "object"
properties:
  prompt_id:
    type: "string"
    description: "Unique identifier for the prompt."
  text:
    type: "string"
    description: "The code generation prompt text."
  source:
    type: "string"
    description: "Source dataset name (e.g., 'code_x_glue_ct_code_to_text')."
required:
  - "prompt_id"
  - "text"
  - "source"
additionalProperties: false
