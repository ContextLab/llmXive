[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-carbon-footprint"
version = "0.1.0"
description = "Measuring the carbon footprint of LLM-assisted code generation"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.30.0",
    "codecarbon>=2.0.0",
    "datasets>=2.0.0",
    "scikit-learn>=1.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.13.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]
include = ["code/", "tests/"]
exclude = ["data/"]

[tool.ruff]
# Enable ppep8 (E1-E5, W) and pyflake (F) rules
select = ["E", "F", "W", "I", "N"]
ignore = [
    "E501",  # line too long (handled by black)
    "E722",  # bare except (sometimes needed for robustness)
    "F401",  # unused imports (sometimes needed for type checking)
]
line-length = 88
target-version = "py310"
src = ["code", "tests"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.mccabe]
max-complexity = 15

[tool.ruff.pyflake]
built-ins = ["__all__"]

[tool.ruff.isort]
known-first-party = ["code", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
addopts = "-v --tb=short"
