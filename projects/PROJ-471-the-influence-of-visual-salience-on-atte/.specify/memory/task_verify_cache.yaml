  h: 03e2a2eec525168361594bc88784f7286b71ec0266f80b2bcbc159d269e9d3eb
  r: "The script `code/ingestion/verify_data.py` correctly checks the dataset, creates\
    \ a non\u2011empty `checksums.json`, and validates hashes, but when a requirement\
    \ is unmet it raises `RuntimeError` messages that differ from the exact required\
    \ string\u202F`\"DATA_MISSING_001: ds003123 incomplete\"` (e.g., it uses \u201C\
    \u2026 not found\u201D or adds extra detail). The task specification demands that\
    \ exact message, so the implementation does not fully meet the requirement."
  sig: c1d4084395748c4568d513e338ef9bb8a02c770ebb4b2e71437d9a984bf1a8a4
