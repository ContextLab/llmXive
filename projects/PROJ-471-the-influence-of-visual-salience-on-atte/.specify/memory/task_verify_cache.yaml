T001:
  c: false
  h: e125b8b7631a9d8fee08c08b50690932f24bcd8e8cef3989449ee869749e9a6f
  r: The `code/bootstrap.py` script parses `sys.argv` directly, causing a `SystemExit`
    when the test suite runs (pytest injects its own arguments). Consequently `tests/test_bootstrap.py`
    fails, so the required directories, `requirements.txt`, and `quickstart.md` are
    never created under the temporary root. The script must ignore or strip external
    arguments (e.g., use `parse_known_args()` or `parser.parse_args([])`) to let the
    test pass.
  sig: af657f5311b5ca3d1176b80990d72cecf2592968767f8c20b9358cfcfdb57667
T002:
