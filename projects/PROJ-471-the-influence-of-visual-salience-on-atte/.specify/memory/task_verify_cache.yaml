  h: b36b999daacf247aad02bfd54ca1807d7c9d660f7034d199a0218f463576f066
  r: "The actual dataset at `data/raw/ds003123/` contains only `stimuli/` \u2014 no\
    \ `sub-*` participant directories \u2014 so the real dataset is incomplete and\
    \ the script would raise DATA_MISSING_001 on it. Additionally, `data/raw/checksums.json`\
    \ is MISSING, meaning no integrity checksums were ever recorded for the real data;\
    \ the passing tests only exercised a dummy dataset that was torn down afterward.\
    \ The implementer must place the full ds003123 dataset (including participant\
    \ eye-tracking data) and run the verification to produce the real checksum manifest."
