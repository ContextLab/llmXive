  r: "The `code/bootstrap.py` script fails its own test (`test_bootstrap_creates_structure`)\
    \ because it cannot monkey\u2011patch `paths.root`, causing an error and preventing\
    \ verification that the directory layout and pinned `requirements.txt` are created.\
    \ Moreover, the repository contains a top\u2011level `requirements.txt` that does\
    \ not match the pinned list written by the script (the script writes a different\
    \ file under `code/requirements.txt`). Consequently, the required project layout,\
    \ the correct requirements file, and a proven runnable entry point are not demonstrably\
    \ provided."
  sig: 1fc1d2f3e36ae6554a7bd967f4c1af1933108d489c5462ad9af60f7117522df7
