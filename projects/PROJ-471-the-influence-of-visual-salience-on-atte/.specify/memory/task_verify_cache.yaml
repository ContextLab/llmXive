T002:
  c: true
  h: 34987c3fcc1344c64711e22dc39ba62fcc8771af753a62a659b9bd3c06dd6d50
  r: "Checked `code/ingestion/verify_data.py` \u2013 it verifies the dataset directory,\
    \ requires a participant folder, hashes all files under `stimuli/` and participant\
    \ folders, and writes a non\u2011empty `data/raw/checksums.json` with the required\
    \ `{ \"files\": { \u2026 } }` structure, raising `RuntimeError(\"DATA_MISSING_001:\
    \ ds003123 \u2026\")` on any failure. The accompanying `tests/test_verify_data.py`\
    \ validates these behaviours. No required files are missing or empty."
  sig: 3e23e28abe80360c49ae5d4155fa2b0a5f4ca95619ff7381b9f796e5313dd1a5
T004:
  c: false
  h: b8d022ba12956b262fac4f5d69e1fcc420c71fd4e2dc5b97e76529c71386585b
  r: "The `segment_roi.py` script implements lazy imports and the copy\u2011or\u2011\
    run logic, but its detection metadata JSON entries lack the required `detector_used`\
    \ field (e.g., `\"detector_used\": \"detectron2\"` for weapon masks). Consequently\
    \ the `tests/test_roi_segmentation.py` check for this field will fail. Add the\
    \ `detector_used` information to each metadata record (and ensure low\u2011confidence\
    \ cases are logged accordingly)."
  sig: 0564655f399e41192fed2d5ff148e60f953a9c952feeda2ee1116007392220ce
T005:
  c: false
  h: 89f0e1859e6172d3c6133e454dafab942d58f438c6e318774a03eec0534e6afb
  r: "The `parse_fixations.py` script creates the required CSV and passes the provided\
    \ test, but it does **not** implement robust row\u2011level CSV handling nor does\
    \ it log warnings for individual trials with malformed or missing gaze data as\
    \ the task specification demands. It only logs file\u2011level errors, so the\
    \ requirement to skip malformed rows with warnings and record per\u2011trial exclusions\
    \ is unmet."
  sig: f36d15a19a8f876f7bc8d90ee9130296b959a10cb8ae4e61beb50bff1772035c
T006:
  c: false
  h: e4b9463ab9ec4bde77ba60745514162cdc680e055bc20dc5bdba69300dd35ac6
  r: "The repository contains a full implementation of `code/analysis/feature_gen.py`,\
    \ but the required output file `data/interim/low_level_features.json` is missing,\
    \ and the verification test `tests/test_feature_computation.py` is also absent.\
    \ Without the JSON results and the test suite, the task\u2019s acceptance criteria\
    \ cannot be satisfied. The next implementer should run the script to generate\
    \ the JSON (or include a pre\u2011computed version) and add the missing test file\
    \ that checks the entries, value ranges, and JSON parsability."
  sig: 2a077180e09ac49f81ed329ffc6a68b6a6054df54f68c3fc214e15ccf88656ee
