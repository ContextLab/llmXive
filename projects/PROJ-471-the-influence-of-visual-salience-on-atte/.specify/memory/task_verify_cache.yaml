  h: f6d632338f62cf345b0042756bef37cbefe68e55947d3865eb36121d17e39957
  r: "The `tests/test_verify_data.py` suite fails the `test_verify_missing_dir` case\
    \ because the script raises `RuntimeError(\"DATA_MISSING_001: ds003123 incomplete\"\
    )` but does not include the required substring \u201Cds003123 not found\u201D\
    \ in its error output. This mismatch means the implementation does not meet the\
    \ specified verification behavior."
