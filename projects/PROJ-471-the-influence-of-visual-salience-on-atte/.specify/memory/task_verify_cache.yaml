  h: cdf4ecfc415938618b991bfc4c3e60e7565afb878087425c34a55251a8d38cf2
  r: The `segment_roi.py` script imports `detectron2` at module load time, causing
    an import error (ModuleNotFoundError) and preventing the test suite from being
    collected or run. Consequently no masks, metadata, or CSV files are generated,
    and the required verification tests cannot pass. The missing `detectron2` dependency
    must be installed or the script must handle its absence gracefully for the task
    to be considered complete.
