T001:
  c: true
  h: b05bc8c63b6ea4f40a01f6d8cc527a55a05bce97f658fb6429f81ba02c3568a8
  r: "The `code/bootstrap.py` script defines a `--root` argument, patches `llmxive_toolkit.paths.root`,\
    \ creates the required directory tree, writes the pinned `requirements.txt`, and\
    \ generates `quickstart.md` with the correct command. The provided `tests/test_bootstrap.py`\
    \ imports this module, monkey\u2011patches the paths to a temporary directory,\
    \ runs `bootstrap.main()`, and verifies that all directories, `requirements.txt`,\
    \ and `quicklist.md` exist and contain the expected contents. All checks align\
    \ with the task specifications, so the implementation satisfies T001."
  sig: 9325f186fc5611678c36419de0fe49887653ca46ef3351a2a5587c21b66b407f
T002:
