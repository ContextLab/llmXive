  r: "The `code/bootstrap.py` script still calls `parser.parse_args()`, causing a\
    \ `SystemExit` when pytest injects its own command\u2011line arguments (see the\
    \ test failure log). Because of this the unit test `tests/test_bootstrap.py` aborts\
    \ before any directories, `requirements.txt`, or `quickstart.md` are created,\
    \ so the required behavior is not verified. The script must be changed to use\
    \ `parse_known_args()` (or otherwise ignore unknown arguments) so that it returns\
    \ 0 and the test can pass."
  sig: 3af516ef301d468be6f1272539e111ace85e5ee56148af38cc5c1be2c03f8292
T002:
