  r: "The dataset `data/raw/ds003123/` is MISSING and `data/raw/checksums.json` contains\
    \ an empty manifest (`{\"files\": []}`), so no real checksums were ever recorded.\
    \ Worse, `verify_data.py` ends with `shutil.rmtree(dataset_dir)`, deleting the\
    \ dataset after a successful verification \u2014 a destructive bug that explains\
    \ why the directory is gone and makes the script unusable for its stated purpose.\
    \ There is also no execution evidence (no test run output) that the success or\
    \ DATA_MISSING_001 paths actually passed."
