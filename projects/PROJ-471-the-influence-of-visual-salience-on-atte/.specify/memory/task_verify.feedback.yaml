T005:
  reason: "The `parse_fixations.py` script creates the required CSV and passes the\
    \ provided test, but it does **not** implement robust row\u2011level CSV handling\
    \ nor does it log warnings for individual trials with malformed or missing gaze\
    \ data as the task specification demands. It only logs file\u2011level errors,\
    \ so the requirement to skip malformed rows with warnings and record per\u2011\
    trial exclusions is unmet."
