# Ruff configuration for llmXive project
# Extends pyproject.toml if needed, or standalone usage
extend = "pyproject.toml"

[lint]
# Additional rules specific to this project if needed
select = ["ALL"]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "ANN",  # flake8-annotations (optional for now)
    "S",    # flake8-bandit (security - optional for research code)
    "T201", # print found
]

[lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[lint.pydocstyle]
convention = "google"
