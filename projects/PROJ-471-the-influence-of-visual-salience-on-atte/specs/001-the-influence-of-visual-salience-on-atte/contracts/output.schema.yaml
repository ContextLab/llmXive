$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Results Schema"
description: "Schema for the final statistical output"
type: "object"
properties:
  model_id:
    type: "string"
    description: "Identifier for the model run"
  fixed_effect_estimate:
    type: "number"
    description: "Fixed effect estimate for salience"
  p_value:
    type: "number"
    minimum: 0
    maximum: 1
    description: "P-value for the fixed effect"
  p_value_fdr_corrected:
    type: "number"
    minimum: 0
    maximum: 1
    description: "FDR-corrected p-value"
  confidence_interval:
    type: "array"
    items:
      type: "number"
    minItems: 2
    maxItems: 2
    description: "95% Confidence Interval [lower, upper]"
  sensitivity_analysis:
    type: "object"
    properties:
      model_a_estimate:
        type: "number"
        description: "Estimate from Model A (intercepts only)"
      model_b_estimate:
        type: "number"
        description: "Estimate from Model B (intercepts + slopes)"
      stability_metric:
        type: "number"
        description: "Change in effect size"
    required:
      - model_a_estimate
      - model_b_estimate
      - stability_metric
  disclaimer:
    type: "string"
    description: "Disclaimer block"
    const: "correlational only"
  power_status:
    type: "string"
    enum:
      - "valid"
      - "invalid"
    description: "Power analysis status"
required:
  - model_id
  - fixed_effect_estimate
  - p_value
  - p_value_fdr_corrected
  - confidence_interval
  - sensitivity_analysis
  - disclaimer
  - power_status
