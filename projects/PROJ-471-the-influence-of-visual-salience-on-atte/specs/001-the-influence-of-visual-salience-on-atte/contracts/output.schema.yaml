$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Results Schema"
description: "Schema for the final statistical output results.json"
type: "object"
properties:
  model_id:
    type: "string"
    description: "Identifier for the model run"
  fixed_effect_estimate:
    type: "number"
    description: "Fixed effect estimate for the salience predictor"
  p_value:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Raw p-value for the salience fixed effect"
  p_value_fdr_corrected:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Benjamini-Hochberg FDR-corrected p-value"
  confidence_interval:
    type: "array"
    items:
      type: "number"
    minItems: 2
    maxItems: 2
    description: "95 percent confidence interval as [lower, upper]"
  sensitivity_analysis:
    type: "object"
    properties:
      model_a_estimate:
        type: "number"
        description: "Salience coefficient from Model A (random intercepts only)"
      model_b_estimate:
        type: "number"
        description: "Salience coefficient from Model B (random intercepts and slopes)"
      stability_metric:
        type: "number"
        description: "Absolute change in the salience coefficient between Model A and Model B"
    required:
      - "model_a_estimate"
      - "model_b_estimate"
      - "stability_metric"
  collinearity_report:
    type: "object"
    properties:
      pre_orthogonalization_vif:
        type: "object"
        description: "Mapping of predictor name to VIF before orthogonalization"
      post_orthogonalization_vif:
        type: "object"
        description: "Mapping of predictor name to VIF after orthogonalization (empty if not applied)"
    required:
      - "pre_orthogonalization_vif"
      - "post_orthogonalization_vif"
  power_status:
    type: "string"
    enum:
      - "valid"
      - "invalid"
    description: "Result of the simulation-based power check (invalid if power < 0.8)"
  power_estimate:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Estimated statistical power from the simulation"
  disclaimer:
    type: "string"
    const: "correlational only"
    description: "Mandatory disclaimer for p-value-bearing artifacts"
required:
  - "model_id"
  - "fixed_effect_estimate"
  - "p_value"
  - "p_value_fdr_corrected"
  - "confidence_interval"
  - "sensitivity_analysis"
  - "collinearity_report"
  - "power_status"
  - "power_estimate"
  - "disclaimer"
