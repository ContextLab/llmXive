$schema: "http://json-schema.org/draft-07/schema#"
title: "Aligned Dataset Schema"
description: "Schema for the merged salience and eye-tracking data"
type: "object"
properties:
  trial_id:
    type: "string"
    description: "Unique identifier for the trial"
  participant_id:
    type: "string"
    description: "Participant identifier"
  stimulus_id:
    type: "string"
    description: "Stimulus image identifier"
  roi_type:
    type: "string"
    enum:
      - "face"
      - "weapon"
      - "background"
    description: "Region of Interest type"
  dwell_time_ms:
    type: "number"
    description: "Dwell time (ms)"
  first_fixation_prob:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Probability of first fixation"
  fixation_latency_ms:
    type: "number"
    description: "Fixation latency (ms)"
  salience_score:
    type: "number"
    description: "Mean salience within ROI"
  luminance:
    type: "number"
    description: "Average luminance (diagnostic)"
  contrast:
    type: "number"
    description: "Average contrast (diagnostic)"
  edge_density:
    type: "number"
    description: "Edge density (diagnostic)"
  moral_valence:
    description: "Moral valence score or binary moral/neutral classification"
    oneOf:
      - type: "number"
      - type: "string"
        enum:
          - "moral"
          - "neutral"
  scene_complexity:
    type: "integer"
    minimum: 0
    description: "Number of detected objects in scene"
  excluded:
    type: "boolean"
    description: "Whether the trial was excluded from analysis"
required:
  - trial_id
  - participant_id
  - stimulus_id
  - roi_type
  - dwell_time_ms
  - first_fixation_prob
  - fixation_latency_ms
  - salience_score
  - luminance
  - contrast
  - edge_density
  - moral_valence
  - scene_complexity
  - excluded