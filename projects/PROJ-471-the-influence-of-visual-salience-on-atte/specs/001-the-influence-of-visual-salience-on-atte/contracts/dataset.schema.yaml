$schema: "http://json-schema.org/draft-07/schema#"
title: "Aligned Dataset Schema"
description: "Schema for the merged salience and eye-tracking data"
type: "object"
properties:
  trial_id:
    type: "string"
    description: "Unique identifier for the trial"
  participant_id:
    type: "string"
    description: "Participant identifier"
  stimulus_id:
    type: "string"
    description: "Stimulus image identifier"
  roi_type:
    type: "string"
    enum:
      - "face"
      - "weapon"
      - "background"
    description: "Region of Interest type"
  dwell_time_ms:
    type: "number"
    description: "Dwell time in milliseconds"
  first_fixation_prob:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Probability of first fixation"
  salience_score:
    type: "number"
    description: "Mean salience score in the ROI"
  luminance:
    type: "number"
    description: "Average luminance (diagnostic only)"
  contrast:
    type: "number"
    description: "Average contrast (diagnostic only)"
  excluded:
    type: "boolean"
    description: "Whether the trial was excluded from analysis"
required:
  - trial_id
  - participant_id
  - stimulus_id
  - roi_type
  - dwell_time_ms
  - first_fixation_prob
  - salience_score
  - excluded
