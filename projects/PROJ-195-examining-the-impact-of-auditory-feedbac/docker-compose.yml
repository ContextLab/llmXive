version: '3.8'

services:
  fmriprep:
    # T008b: Specified stable image tag for determinism
    image: nipreps/fmriprep:23.1.3
    container_name: fmriprep_container
    # No entrypoint command here; the image is pulled to be used by
    # code/preprocess.py (T009) which constructs the docker run command
    # dynamically based on subject paths.
    # This file serves as the reference configuration and verification
    # that the correct image tag is defined.
    volumes:
      - ./data/raw:/data:ro
      - ./data/derivatives:/output
      - ./code:/code
    environment:
      - PYTHONUNBUFFERED=1
    # Resource limits to ensure efficient utilization on free-tier
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
