# Statistical Analysis Configuration
# Project: PROJ-195-examining-the-impact-of-auditory-feedback-motor-learning
# Task: T004 - Define GLM parameters, FDR threshold, and ROI definitions

# General Linear Model (GLM) Parameters
glm:
  # First-level model specification
  first_level:
    # High-pass filter cutoff in seconds
    high_pass_cutoff: 128.0
    # Temporal derivative inclusion
    add_temporal_derivatives: true
    # Drift model: cosine basis functions
    drift_model: "cosine"
    # AR(1) noise model for temporal autocorrelation
    noise_model: "ar1"
    # Standardize regressors
    standardize: false

  # Contrast definitions for first-level analysis
  contrasts:
    # Perturbed vs Normal: Union of delayed and pitch-shifted conditions
    perturbed_vs_normal:
      name: "Perturbed > Normal"
      contrast_vector: [0, 1, 1, -1]  # [intercept, delayed, pitch_shifted, normal]
      description: "Combined auditory perturbation effect (delayed + pitch-shifted) vs normal feedback"

    # Delayed vs Normal
    delayed_vs_normal:
      name: "Delayed > Normal"
      contrast_vector: [0, 1, 0, -1]
      description: "Delayed auditory feedback effect vs normal feedback"

    # Pitch-shifted vs Normal
    pitch_shifted_vs_normal:
      name: "Pitch-shifted > Normal"
      contrast_vector: [0, 0, 1, -1]
      description: "Pitch-shifted auditory feedback effect vs normal feedback"

# Multiple Comparison Correction
correction:
  # False Discovery Rate (FDR) threshold
  fdr:
    enabled: true
    q_threshold: 0.05
    method: "fdr_bh"  # Benjamini-Hochberg procedure
    description: "Voxel-wise FDR correction at q < 0.05"

  # Cluster-forming threshold (uncorrected)
  cluster_forming:
    voxel_p_threshold: 0.001
    description: "Initial voxel-wise threshold for cluster formation (uncorrected)"

  # Minimum cluster size (in voxels)
  min_cluster_size_voxels: 10
  description: "Minimum cluster extent to be considered significant"

# Group-level analysis parameters
group_analysis:
  # Statistical test type
  test_type: "one_sample_t_test"
  description: "One-sample t-test against zero for group-level inference"
  null_hypothesis: 0.0
  alternative: "two-sided"

  # Effect size calculation
  effect_size:
    calculate_cohens_d: true
    calculate_confidence_interval: true
    ci_level: 0.95

# Region of Interest (ROI) Definitions
rois:
  # Primary ROI: Auditory Cortex
  auditory_cortex:
    name: "Auditory Cortex"
    source: "Harvard-Oxford Cortical Structural Atlas"
    mask_file: "roi_masks/auditory_cortex.nii.gz"
    label_index: "Auditory"
    description: "Mask extracted from Harvard-Oxford atlas for auditory cortex activation analysis"
    coordinates:
      # Approximate MNI coordinates for Heschl's gyrus (primary auditory cortex)
      x: [-46, 46]
      y: [-18, -18]
      z: [8, 12]

  # Secondary ROIs (for exploratory analysis)
  motor_cortex:
    name: "Motor Cortex"
    source: "Harvard-Oxford Cortical Structural Atlas"
    mask_file: "roi_masks/motor_cortex.nii.gz"
    label_index: "Precentral Gyrus"
    description: "Primary motor cortex for motor sequence learning activation"

  cerebellum:
    name: "Cerebellum"
    source: "Automated Anatomical Labeling (AAL) Atlas"
    mask_file: "roi_masks/cerebellum.nii.gz"
    label_index: "Cerebellum"
    description: "Cerebellar regions involved in motor timing and learning"

# Output specifications
output:
  # Directory for statistical maps
  stat_maps_dir: "data/processed/stat_maps"
  # Directory for cluster metadata
  cluster_metadata_dir: "data/processed/clusters"
  # Directory for ROI extraction results
  roi_results_dir: "data/processed/roi_analysis"
  # File format for statistical maps
  output_format: "nifti"
  # Compression level for NIfTI files (0-9)
  nifti_compression: 4

# Logging and reproducibility
logging:
  level: "INFO"
  log_file: "data/processed/statistical_analysis.log"
  # Include full command-line history for reproducibility
  record_parameters: true
  # Random seed for any stochastic operations
  random_seed: 42

# Quality control thresholds
qc:
  # Minimum number of subjects required for group analysis
  min_subjects: 5
  # Maximum proportion of missing data allowed per subject
  max_missing_data_proportion: 0.1
  # Flag subjects with extreme parameter estimates
  extreme_value_threshold: 5.0  # Standard deviations from mean