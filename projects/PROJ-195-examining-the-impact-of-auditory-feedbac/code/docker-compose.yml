version: '3.8'

services:
  fmriprep:
    image: ${FMRIREP_TAG:-nipreps/fmriprep:23.1.3}
    container_name: fmriprep_container
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data/raw:/data:ro
      - ./data/derivatives:/out
      - ./code/docker_config.env:.env
    command:
      - --output-spaces
      - MNI152NLin2009cAsym
      - --fs-no-reconall
      - --slidedir
      - --motion-correction
      - --normalize
    deploy:
      resources:
        limits:
          memory: 16G
    stdin_open: true
    tty: true
    network_mode: host
    restart: "no"
