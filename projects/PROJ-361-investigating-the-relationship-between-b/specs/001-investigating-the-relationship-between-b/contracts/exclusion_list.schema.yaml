$schema: "http://json-schema.org/draft-07/schema#"
title: "Exclusion List Schema"
description: "Schema for the exclusion list (data/processed/excluded_subjects.csv)"
type: "object"
properties:
  subject_id:
    type: "string"
    description: "Unique subject identifier"
  reason:
    type: "string"
    description: "Reason for exclusion (e.g., 'FD > 0.5mm', 'Missing data')"
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of exclusion"
required:
  - subject_id
  - reason
  - timestamp
additionalProperties: false