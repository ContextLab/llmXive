  r: "The `train_regressor.py` script runs and writes `metrics.json`, but the metrics\
    \ show a baseline MSE of\u202F0.0 and a validation MSE >\u202F0, so `meets_sc006`\
    \ is false \u2013 the regressor does **not** beat the temperature\u2011only baseline\
    \ as required. Additionally, the promised verification test `code/tests/test_train_regressor_metrics.py`\
    \ is missing."
  sig: 27642b84baae5d21d156afed562882fd6d233f3ab8449166b1eb8618486d6539
T007:
  c: false
  h: 17d29c3dd21fa159a37917b2f76e6a983775c1d2b4cebd51cc1a15cd9fdc9d33
  r: "The required output artifacts `data/processed/task_complexity.csv`, `data/processed/correlation.txt`,\
    \ and `complexity.schema.yaml` do not exist on disk \u2014 only the script was\
    \ written, with no evidence it was ever run. Additionally, the script's fallback\
