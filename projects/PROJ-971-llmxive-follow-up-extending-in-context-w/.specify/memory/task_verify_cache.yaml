    \ assertion (US-1 Acceptance Scenario 2) are unverified. The implementer must\
    \ execute the pipeline on the raw clips and produce the validated CSV."
  sig: 4cf064f8e9608f3677dd82a89d38b8b63f218336e415a34564d10c1b804ff62f
T004:
  c: false
