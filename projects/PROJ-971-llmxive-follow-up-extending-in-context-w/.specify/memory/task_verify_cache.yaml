  h: fbc3cfeab5c99b96b60b5d39e276554df16477c4934195570b7c343042f60efe
  r: "The quickstart.md exists and documents a single command, and `data/descriptors_subset.csv`\
    \ exists with 50 rows of the required columns, but the task's verification explicitly\
    \ requires `data/processed/descriptors.csv` to exist \u2014 and the collector\
    \ reports that file as MISSING. The execution log also shows the run only wrote\
    \ `data/descriptors_subset.csv`, never the `data/processed/descriptors.csv` output\
    \ the quickstart promises, so the documented command does not produce the documented\
    \ artifacts. Fix `scripts/run_minimal.sh` (or the pipeline) to also write `data/processed/descriptors.csv`\
    \ and re-"
  sig: 0898f9fa759a8b63198c5b0329e7e28ad946b19a5087213d3bd09cbd6df0e824
T002:
  c: true
  h: 618d83be86e1f996bf29cf42d678a231ba8655a8acb50d834f57ea7b950a45e4
  r: The script `code/src/pipeline/generate_clips.py` exists and deterministically
    generates CartPole interaction clips with the required `states`, `actions`, and
    `observations` arrays; `data/raw/` contains exactly 50 non-empty `clip_*.npz`
    files, and the sampled file contents confirm all three arrays are present. The
    execution log shows the generation ran successfully (exit 0) and produced 50 clips.
