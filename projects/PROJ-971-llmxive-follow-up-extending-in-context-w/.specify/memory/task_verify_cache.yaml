T001:
  c: false
  h: 33928f0bc9de88bd9c069829d6a779791d28dd9f423c458d43d7d74325880b51
  r: 'The task''s own verification criterion requires `data/processed/descriptors.csv`
    to exist, but the collector reports it as MISSING; only the legacy shortcut `data/descriptors_subset.csv`
    (50 rows, correct columns) is present. Additionally, the quickstart''s single
    command depends on `scripts/quickstart.sh` and `scripts/run_minimal.sh`, neither
    of which appears in the evidence, so there is no proof the documented command
    runs without error. Fix: create the scripts (or correct the documented command)
    and produce `data/processed/descriptors.csv` alongside the subset copy.'
  sig: dd976a82198b693a983de134f98ac46723c865a86356b2926d90c0dcdf2423a8
T002:
  c: false
  h: f6c214e5d6a5d0e397b0d59c7c2fa51556b2843ac684814c767a0722fe50fd18
  r: "The required artifacts `data/raw/clip_*.npz` do not exist \u2014 the collector\
    \ confirms `data/raw/` is empty (0 entries) and the pattern matches no files,\
    \ so the verification criterion \"50 files each containing `states`, `actions`,\
    \ `observations`\" fails. The script `generate_clips.py` exists and looks functional,\
    \ but there is no evidence it was ever run; downstream CSVs referencing clip IDs\
    \ do not substitute for the actual clip files. The implementer must execute the\
    \ script to produce the 50 `.npz` clips in `data/raw/`."
  sig: 1aabc615ae3f99dd475e6b174bb458d8ede46b7a197c1ea13dd80b4b1ec842c7
