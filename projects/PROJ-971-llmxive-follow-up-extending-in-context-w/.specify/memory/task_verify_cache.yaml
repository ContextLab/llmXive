  r: "The task requires that `run_end_to_end.py --subset 50` actually runs and prints\
    \ a 50-row summary table, but the evidence contains only source files \u2014 no\
    \ execution log, no generated `data/processed/descriptors.csv` or `data/descriptors_subset.csv`,\
    \ and no captured stdout showing the 50-row table with the three descriptor columns.\
    \ Additionally, there are two conflicting copies of `generate_clips.py` and `extract_descriptors.py`\
    \ (`code/src/...` and `src/...`), and the `code/src` version of `extract_descriptors.py`\
    \ depends on a schema file (`specs/.../contracts/descriptor.schema.yaml`) and\
    \ a varia"
  sig: e2caf2d94a8cb3daf1e65b0ba21822af75e35d8b02d49e3d0ece42535169909a
T005:
  c: false
  h: 95e9fb38239f9a81cd5a314591aaa33d7eade3dc5a086bc22cc958d6fa8d8282
  r: "The produced `data/processed/labels.csv` is 1 byte (empty) \u2014 the run log\
    \ shows it completed in 0.5s with no clips processed, so no labels were actually\
    \ generated. Additionally, the required `label.schema.yaml` and `src/pipeline/config.yaml`\
    \ (fixed seeds) do not exist, and the \"policy evaluation\" is a synthetic MSE\
    \ heuristic on precomputed latents, not N=5 robosuite episodes with success from\
    \ environment termination flags, nor is there any clip-to-configuration-ID mapping."
  sig: 27e11654c8f03f8179571f0acb52e7abb09e11ed17ad2b493f6cdd039c7e745f
T006:
  c: false
