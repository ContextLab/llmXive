type: object
properties:
  clip_id:
    type: string
    description: "The identifier of the interaction clip (e.g., clip_000)."
  tau:
    type: number
    enum: [0.5, 1.0, 1.5, 2.0]
    description: "The optimal sampling temperature."
  k:
    type: integer
    enum: [16, 32, 64]
    description: "The optimal context window length."
  success_rate:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "The success rate achieved by the (tau, k) pair."
required:
  - clip_id
  - tau
  - k
  - success_rate
