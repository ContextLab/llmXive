$schema: "http://json-schema.org/draft-07/schema#"
title: "ICWM Hyperparameter Label"
type: object
required:
  - clip_id
  - tau
  - k
  - success_rate
properties:
  clip_id:
    type: string
    description: "The identifier of the interaction clip."
    pattern: "^clip_\\d+$"
  tau:
    type: number
    description: "The optimal sampling temperature."
  k:
    type: integer
    description: "The optimal context window length."
  success_rate:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "The fractional success rate over N episodes."
additionalProperties: false
