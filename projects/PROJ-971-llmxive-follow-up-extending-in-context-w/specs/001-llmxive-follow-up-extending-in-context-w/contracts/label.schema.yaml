$schema: "http://json-schema.org/draft-07/schema#"
title: "ICWM Hyper‑parameter Labels"
description: |
  CSV file generated by ``src/pipeline/grid_search_labels.py``.
  Each row corresponds to a training clip and records the
  hyper‑parameter pair (τ, k) that achieved the highest
  success rate during grid‑search, together with that success
  rate.
type: object
required:
  - clip_id
  - tau
  - k
  - success_rate
properties:
  clip_id:
    type: string
    pattern: "^clip_\\d{3}$"
  tau:
    type: number
    enum: [0.5, 1.0, 1.5, 2.0]
  k:
    type: integer
    enum: [16, 32, 64]
  success_rate:
    type: number
    minimum: 0.0
    maximum: 1.0
additionalProperties: false
