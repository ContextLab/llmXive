# JSON Schema for descriptor CSV records
# This schema validates each row of `data/processed/descriptors.csv`
# and the legacy `data/descriptors_subset.csv`.
# All fields are required and must be non‑null.
type: object
properties:
  clip_id:
    type: string
  variance:
    type: number
  autocorr_lag1:
    type: number
  spectral_density:
    type: number
required:
  - clip_id
  - variance
  - autocorr_lag1
  - spectral_density
additionalProperties: false
