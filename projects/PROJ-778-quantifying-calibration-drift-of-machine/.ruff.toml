# Ruff configuration for llmXive calibration drift project
# Enforces strict linting rules compatible with the project's coding standards

target-version = "py311"
line-length = 88

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG",# flake8-unused-arguments
    "SIM",# flake8-simplify
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in data pipelines)
]

[lint.isort]
known-first-party = ["utils"]
force-sort-within-sections = true
combine-as-imports = true

[lint.per-file-ignores]
"code/0*_*.py" = ["ARG"] # Allow unused arguments in entry points if needed for CLI
"tests/*" = ["ARG", "B018"] # Allow unused args in tests and expressions
