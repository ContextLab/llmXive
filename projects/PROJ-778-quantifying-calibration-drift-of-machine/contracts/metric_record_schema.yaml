# Metric Record Schema
# Defines the JSON structure for calibration and covariate shift metrics per year

schema_name: metric_record_schema
version: "1.0"
description: "Schema for recording calibration and covariate shift metrics over time."

fields:
  - name: year
    type: int
    description: "Year of the data snapshot"
  - name: model_type
    type: str
    description: "Type of model (e.g., LogisticRegression, RandomForest)"
  - name: ece_5
    type: float
    description: "Expected Calibration Error with 5 bins"
  - name: ece_10
    type: float
    description: "Expected Calibration Error with 10 bins"
  - name: ece_20
    type: float
    description: "Expected Calibration Error with 20 bins"
  - name: brier
    type: float
    description: "Brier Score"
  - name: pca_shift
    type: float
    description: "PCA-based covariate shift metric"
  - name: key_feature_shift
    type: float
    description: "Key feature mean shift metric"
  - name: rho_5
    type: float
    description: "Spearman correlation between shift and ECE (5 bins)"
  - name: rho_10
    type: float
    description: "Spearman correlation between shift and ECE (10 bins)"
  - name: rho_20
    type: float
    description: "Spearman correlation between shift and ECE (20 bins)"
  - name: rho_diff_5_10
    type: float
    description: "Absolute difference between rho_5 and rho_10"
  - name: rho_diff_10_20
    type: float
    description: "Absolute difference between rho_10 and rho_20"
  - name: max_rho_diff
    type: float
    description: "Maximum difference across rho values (robustness check)"
  - name: p_value_wls
    type: float
    description: "P-value from Weighted Least Squares regression of ECE vs Year"
  - name: change_point_year
    type: int
    description: "Year identified as a change point by BIC-based detection"
