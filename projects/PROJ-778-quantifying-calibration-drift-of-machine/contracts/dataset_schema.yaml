# Dataset Schema for Adult/CPS Datasets
# Defines expected columns and types for calibration drift analysis

schema_name: adult_cps_schema
version: "1.0"
description: "Schema for UCI Adult and IPUMS CPS datasets used in calibration drift analysis."

columns:
  - name: age
    type: int
    description: "Age of the individual"
  - name: workclass
    type: str
    description: "Type of employment"
  - name: education
    type: str
    description: "Level of education"
  - name: occupation
    type: str
    description: "Job occupation"
  - name: relationship
    type: str
    description: "Relationship status"
  - name: race
    type: str
    description: "Race"
  - name: sex
    type: str
    description: "Gender"
  - name: capital-gain
    type: float
    description: "Capital gains"
  - name: capital-loss
    type: float
    description: "Capital losses"
  - name: hours-per-week
    type: int
    description: "Hours worked per week"
  - name: native-country
    type: str
    description: "Country of origin"
  - name: income
    type: str
    description: "Target variable: Income bracket (>50K or <=50K)"

target_column: income
feature_columns:
  - age
  - workclass
  - education
  - occupation
  - relationship
  - race
  - sex
  - capital-gain
  - capital-loss
  - hours-per-week
  - native-country
