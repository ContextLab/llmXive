[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", ".venv", "data", "figures", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501",  # line length handled by formatter
  "E402",  # module-level imports after sys.path manipulation in numbered scripts
]

[tool.ruff.lint.per-file-ignores]
"code/0*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "venv|.venv|data|figures|docs"

[tool.ruff.lint.isort]
known-first-party = ["utils"]
