$schema: "http://json-schema.org/draft-07/schema#"
title: "Experiment Run Result Schema"
type: object
required:
  - run_id
  - condition
  - seed
  - accuracy
  - peak_ram_gb
  - wall_time_sec
  - loss_log_path
properties:
  run_id:
    type: string
    description: "Unique identifier for the run (e.g., 'frozen_opd_seed42')."
  condition:
    type: string
    enum: [full_opd, frozen_opd, frozen_sft, random_sft, full_sft]
  seed:
    type: integer
    minimum: 0
  accuracy:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Test accuracy on the held‑out GSM8K generalization subset."
  peak_ram_gb:
    type: number
    minimum: 0.0
    maximum: 7.0
    description: "Maximum VmRSS observed during the run (GB)."
  wall_time_sec:
    type: number
    minimum: 0.0
    maximum: 21600
    description: "Total wall‑clock time (seconds)."
  loss_log_path:
    type: string
    description: "Path to JSON‑lines file containing per‑epoch loss information."
  power_estimate:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Achieved statistical power for the associated hypothesis test."
  tost_p_lower:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "One‑sided p‑value for the lower equivalence bound (if applicable)."
  tost_p_upper:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "One‑sided p‑value for the upper equivalence bound (if applicable)."
  t_test_p:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Two‑sample paired t‑test p‑value (if applicable)."