$schema: "http://json-schema.org/draft-07/schema#"
title: "Experiment State Schema"
type: object
required:
  - version
  - generated_at
  - runs
  - aggregated
properties:
  version:
    type: string
    description: "Semantic version of the experiment schema."
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  generated_at:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp when state.yaml was written."
  runs:
    type: array
    description: "List of individual experiment runs."
    items:
      $ref: "experiment_results.schema.yaml"
  aggregated:
    type: object
    description: "Aggregated metrics per condition."
    additionalProperties:
      type: object
      required:
        - condition
        - mean_accuracy
        - std_accuracy
        - power_estimate
        - equivalence_result
        - t_test_result
      properties:
        condition:
          type: string
          enum: [full_opd, frozen_opd, frozen_sft, random_sft, full_sft]
        mean_accuracy:
          type: number
          minimum: 0.0
          maximum: 1.0
        std_accuracy:
          type: number
          minimum: 0.0
        power_estimate:
          type: number
          minimum: 0.0
          maximum: 1.0
        equivalence_result:
          type: string
          enum: [equivalent, inconclusive, not_equivalent]
        t_test_result:
          type: string
          enum: [significant, non-significant, inconclusive]