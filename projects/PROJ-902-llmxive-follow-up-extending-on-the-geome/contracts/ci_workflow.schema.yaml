$schema: "http://json-schema.org/draft-07/schema#"
title: GitHub Actions CI workflow schema
type: object
required:
  - jobs
properties:
  jobs:
    type: object
    required:
      - experiment
    properties:
      experiment:
        type: object
        required:
          - strategy
          - timeout-minutes
          - steps
        properties:
          timeout-minutes:
            type: integer
            const: 360
          strategy:
            type: object
            required:
              - matrix
            properties:
              matrix:
                type: object
                required:
                  - include
                properties:
                  include:
                    type: array
                    items:
                      type: object
                      required:
                        - condition
                        - seeds
                      properties:
                        condition:
                          type: string
                        seeds:
                          type: array
                          items:
                            type: integer
          steps:
            type: array
            minItems: 1
            items:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
