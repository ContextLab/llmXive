[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-long-horizon"
version = "0.1.0"
description = "Reward Fidelity vs. Error Recovery Density Analysis"
requires-python = ">=3.11"
dependencies = [
    "datasets==2.14.0",
    "llama-cpp-python==0.2.0",
    "scikit-learn==1.3.0",
    "scipy==1.11.0",
    "pandas==2.0.0",
    "pyyaml==6.0.1",
    "pytest==7.4.0",
    "statsmodels==0.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*", "tests*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | __pycache__
  | data
  | results
  | artifacts
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "data",
    "results",
    "artifacts",
    "build",
]

[tool.ruff.per-file-ignores]
"code/__init__.py" = ["F401"]
"tests/*" = ["S101"] # assert allowed in tests

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"