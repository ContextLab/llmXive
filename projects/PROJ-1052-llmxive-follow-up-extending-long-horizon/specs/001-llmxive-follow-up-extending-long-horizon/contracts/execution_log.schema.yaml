$schema: http://json-schema.org/draft-07/schema#
title: Execution Log Schema
description: |
  Schema for execution logs generated by the agent runner.
  Captures task execution details, success status, and recovery segment identification.
type: object
required:
  - task_id
  - success
  - trajectory
  - reward_fidelity_level
  - timestamp
properties:
  task_id:
    type: string
    description: Unique identifier for the benchmark task
    pattern: "^task_[a-zA-Z0-9_]+$"
  success:
    type: boolean
    description: Whether the agent successfully completed the task
  trajectory:
    type: array
    description: Sequence of steps taken by the agent
    items:
      type: object
      required:
        - step_id
        - observation
        - action
        - reward
      properties:
        step_id:
          type: integer
          minimum: 0
        observation:
          type: string
        action:
          type: string
        reward:
          type: number
          description: Reward value for this step
        is_recovery_critical:
          type: boolean
          description: Flag indicating if this step is part of a recovery-critical segment
        segment_id:
          type: string
          description: Identifier for the segment this step belongs to
  reward_fidelity_level:
    type: string
    enum:
      - dense
      - binary
      - 3-bin
      - random-pruning
    description: The fidelity level of rewards used during execution
  recovery_segment_id:
    type:
      - string
      - "null"
    description: |
      Identifier for the recovery-critical segment, if identified.
      Null if no recovery segment was detected or applicable.
  token_count:
    type: integer
    minimum: 0
    description: Total tokens consumed during execution
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of execution
  error_type:
    type:
      - string
      - "null"
    description: |
      Type of error encountered, if any.
      Values: 'none', 'state_mismatch', 'timeout', 'other'
  pruned_segments:
    type: array
    description: List of segment IDs that were pruned during execution
    items:
      type: string
additionalProperties: false
