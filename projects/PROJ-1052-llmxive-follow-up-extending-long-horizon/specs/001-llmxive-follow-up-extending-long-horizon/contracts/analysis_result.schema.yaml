$schema: http://json-schema.org/draft-07/schema#
title: Analysis Result Schema
description: >
  Schema for the output of the statistical analysis phase (US3).
  Contains inflection points, regression coefficients, and significance metrics.
type: object
required:
  - analysis_timestamp
  - inflection_point
  - logistic_coefficients
  - p_values
  - correction_method
  - power_analysis
  - inflection_point_ci
properties:
  analysis_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the analysis run.
  dataset_version:
    type: string
    description: Version or hash of the input data used (e.g., AgentBench commit).
  inflection_point:
    type: number
    description: >
      The identified fidelity threshold where recovery capability degrades
      non-linearly. Normalized to [0, 1] or specific bin index.
  inflection_point_ci:
    type: object
    required:
      - lower
      - upper
      - confidence_level
    properties:
      lower:
        type: number
      upper:
        type: number
      confidence_level:
        type: number
        minimum: 0
        maximum: 1
        description: Confidence level (e.g., 0.95).
  logistic_coefficients:
    type: object
    required:
      - intercept
      - fidelity_slope
      - density_slope
      - interaction_term
    properties:
      intercept:
        type: number
      fidelity_slope:
        type: number
      density_slope:
        type: number
      interaction_term:
        type: number
        description: Coefficient for fidelity * density interaction.
  p_values:
    type: object
    required:
      - fidelity_effect
      - density_effect
      - interaction_effect
    properties:
      fidelity_effect:
        type: number
        minimum: 0
        maximum: 1
      density_effect:
        type: number
        minimum: 0
        maximum: 1
      interaction_effect:
        type: number
        minimum: 0
        maximum: 1
  correction_method:
    type: string
    enum:
      - bonferroni
      - benjamini-hochberg
      - none
    description: Method used for multiple comparison correction.
  power_analysis:
    type: object
    required:
      - achieved_power
      - effect_size
      - sample_size
    properties:
      achieved_power:
        type: number
        minimum: 0
        maximum: 1
      effect_size:
        type: number
        description: Cohen's d or similar metric.
      sample_size:
        type: integer
        minimum: 1
  fallback_test_used:
    type: string
    enum:
      - none
      - cochran-armitage
    description: If logistic regression failed, indicates the fallback test used.
  token_savings_metrics:
    type: object
    properties:
      avg_tokens_dense:
        type: number
      avg_tokens_pruned:
        type: number
      reduction_percentage:
        type: number
        minimum: 0
        maximum: 100
  warnings:
    type: array
    items:
      type: string
    description: List of warnings generated during analysis (e.g., low power).
additionalProperties: false