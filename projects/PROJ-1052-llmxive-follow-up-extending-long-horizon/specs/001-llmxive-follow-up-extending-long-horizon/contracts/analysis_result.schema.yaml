$schema: http://json-schema.org/draft-07/schema#
title: Analysis Result Schema
description: |
  Schema for statistical analysis results including inflection points,
  regression coefficients, and trend test outcomes.
type: object
required:
  - analysis_id
  - timestamp
  - method
  - results
properties:
  analysis_id:
    type: string
    description: Unique identifier for this analysis run
    pattern: "^analysis_[a-zA-Z0-9_]+$"
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of analysis completion
  method:
    type: string
    enum:
      - logistic_regression
      - cochran_armitage
      - fallback
    description: Statistical method used for analysis
  results:
    type: object
    required:
      - success_rate_by_fidelity
    properties:
      inflection_point:
        type:
          - number
          - "null"
        description: |
          The fidelity level (or index) where recovery capability degrades non-linearly.
          Null if curve fitting failed or no inflection detected.
      logistic_coefficients:
        type:
          - object
          - "null"
        description: Coefficients from logistic regression model
        properties:
          intercept:
            type: number
          fidelity_coefficient:
            type: number
          density_coefficient:
            type: number
        required:
          - intercept
          - fidelity_coefficient
      p_value:
        type: number
        minimum: 0
        maximum: 1
        description: Raw p-value from statistical test
      p_value_corrected:
        type: number
        minimum: 0
        maximum: 1
        description: P-value after multiple-comparison correction (Bonferroni/BH)
      statistical_power:
        type: number
        minimum: 0
        maximum: 1
        description: Calculated statistical power of the test
      trend_significance:
        type:
          - string
          - "null"
        description: |
          Result of Cochran-Armitage trend test if used as fallback.
          Values: 'significant', 'not_significant', 'inconclusive'
      success_rate_by_fidelity:
        type: object
        description: Success rates grouped by reward fidelity level
        additionalProperties:
          type: object
          required:
            - success_count
            - total_count
            - rate
          properties:
            success_count:
              type: integer
              minimum: 0
            total_count:
              type: integer
              minimum: 1
            rate:
              type: number
              minimum: 0
              maximum: 1
      token_savings:
        type: object
        description: Token savings metrics per fidelity level
        additionalProperties:
          type: object
          properties:
            average_savings_percent:
              type: number
              minimum: 0
            total_tokens_saved:
              type: integer
              minimum: 0
      warnings:
        type: array
        description: List of warnings generated during analysis
        items:
          type: string
      fallback_reason:
        type:
          - string
          - "null"
        description: Reason for using fallback method, if applicable
additionalProperties: false
