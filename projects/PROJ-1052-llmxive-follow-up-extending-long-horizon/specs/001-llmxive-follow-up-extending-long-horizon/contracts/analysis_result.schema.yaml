$schema: http://json-schema.org/draft-07/schema#
title: Analysis Result Schema
description: >
  Schema for statistical analysis results, including inflection point detection,
  logistic regression coefficients, and multiple-comparison corrections.
type: object
required:
  - analysis_id
  - timestamp
  - model_type
  - inflection_point
  - coefficients
  - p_values
  - corrected_p_values
  - power_analysis
  - summary
properties:
  analysis_id:
    type: string
    description: Unique identifier for this analysis run
  timestamp:
    type: string
    description: ISO 8601 timestamp of analysis completion
    format: date-time
  model_type:
    type: string
    description: Type of statistical model used (e.g., 'logistic_regression', 'cochran_armitage')
  inflection_point:
    type: object
    description: The identified inflection point where recovery capability degrades
    required:
      - fidelity_level
      - threshold_value
      - confidence_interval
    properties:
      fidelity_level:
        type: string
        description: The fidelity level at the inflection point
      threshold_value:
        type: number
        format: float
        description: The numerical threshold value
      confidence_interval:
        type: object
        properties:
          lower:
            type: number
            format: float
          upper:
            type: number
            format: float
      method:
        type: string
        description: Method used to identify the point (e.g., 'curve_fit', 'ci_non_overlap')
  coefficients:
    type: object
    description: Logistic regression coefficients
    properties:
      fidelity_coefficient:
        type: number
        format: float
      density_coefficient:
        type: number
        format: float
      intercept:
        type: number
        format: float
      standard_errors:
        type: object
        properties:
          fidelity:
            type: number
            format: float
          density:
            type: number
            format: float
          intercept:
            type: number
            format: float
  p_values:
    type: object
    description: Raw p-values for coefficients
    properties:
      fidelity:
        type: number
        format: float
      density:
        type: number
        format: float
      intercept:
        type: number
        format: float
  corrected_p_values:
    type: object
    description: P-values after multiple-comparison correction (Bonferroni or BH)
    properties:
      fidelity:
        type: number
        format: float
      density:
        type: number
        format: float
      intercept:
        type: number
        format: float
    method:
      type: string
      description: Correction method used (e.g., 'bonferroni', 'benjamini_hochberg')
  power_analysis:
    type: object
    description: Statistical power analysis results
    properties:
      achieved_power:
        type: number
        format: float
      target_power:
        type: number
        format: float
      effect_size:
        type: number
        format: float
      sample_size:
        type: integer
      epv:
        type: number
        format: float
        description: Events Per Variable
      fallback_triggered:
        type: boolean
        description: Whether the Cochran-Armitage fallback was triggered
  token_savings:
    type: object
    description: Token consumption metrics
    properties:
      baseline_avg_tokens:
        type: number
        format: float
      pruned_avg_tokens:
        type: number
        format: float
      savings_percentage:
        type: number
        format: float
  summary:
    type: string
    description: Human-readable summary of the analysis findings
  warnings:
    type: array
    description: List of warnings generated during analysis
    items:
      type: string
  metadata:
    type: object
    description: Additional metadata
    additionalProperties: true