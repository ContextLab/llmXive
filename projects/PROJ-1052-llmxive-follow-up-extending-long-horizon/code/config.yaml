# llmXive Project Configuration
# Generated for PROJ-1052-llmxive-follow-up-extending-long-horizon
# Task: T009 - Environment configuration and logging infrastructure

project:
  name: "llmXive-follow-up-extending-long-horizon"
  version: "1.0.0"
  root_path: "."

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  output_dir: "results"
  figures_dir: "figures"

logging:
  level: "INFO"
  file: "logs/run.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  # Metrics to capture in structured logs
  metrics:
    - "reward_fidelity_level"
    - "recovery_segment_id"
    - "task_id"
    - "success_status"
    - "token_count"

# Default experimental settings
defaults:
  reward_fidelity_level: "dense"
  model_name: "llama-3-8b"
  quantization: "q4_0"
  max_context_length: 4096

# Agent configuration
agent:
  temperature: 0.0
  top_p: 0.9
  max_tokens: 1024

# Pruning settings
pruning:
  enable: true
  min_segment_length: 50
  similarity_threshold: 0.85
