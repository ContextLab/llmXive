# Environment configuration for llmXive Follow-up: Reward Fidelity vs. Error Recovery Density
# Project: PROJ-1052-llmxive-follow-up-extending-long-horizon

# General settings
project_name: "llmXive-RewardFidelity-ErrorRecovery"
version: "1.0.0"
seed: 42

# Data paths
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  output_dir: "data/processed"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/run.log"
  # Custom metrics to capture
  metrics:
    - "reward_fidelity_level"
    - "recovery_segment_id"
    - "task_id"
    - "success_status"
    - "token_count"

# Agent settings
agent:
  default_model: "llama-3-8b"
  fallback_model: "qwen-1.5-1.8b"
  max_context_length: 4096
  quantization: "q4_0"

# Reward Fidelity Levels
# Used for T020/T021 pruning logic
reward_fidelity:
  levels:
    - "dense"
    - "binary"
    - "3-bin"
  default: "dense"

# Pruning settings
pruning:
  threshold: 0.05
  method: "cosine_similarity"
