$schema: "http://json-schema.org/draft-07/schema#"
title: "Unified Fatigue Dataset Record"
type: object
required:
  - sample_id
  - material_class
  - heat_input
  - cooling_rate
  - other_process_params
  - stress_unit
  - fatigue_life_cycles
  - source
  - checksum
properties:
  sample_id:
    type: string
    description: "Unique identifier for the observation."
  material_class:
    type: string
    enum: ["steel", "aluminum"]
    description: "Material family."
  heat_input:
    type: number
    description: "Process heat input in megajoules (MJ)."
  cooling_rate:
    type: number
    description: "Cooling rate in kelvin per second (K/s)."
  other_process_params:
    type: string
    description: "JSON-encoded dictionary of additional numeric process parameters."
  stress_unit:
    type: string
    enum: ["MPa", "psi"]
    description: "Original unit of the residual stress measurement before conversion."
  elastic_modulus:
    type: number
    description: "Elastic modulus in gigapascals (optional)."
  yield_strength:
    type: number
    description: "Yield strength in megapascals (optional)."
  residual_stress_measured:
    type: number
    description: "Directly measured residual stress in MPa."
  is_proxy:
    type: boolean
    description: "True if the proxy value is used as the stress feature in place of a missing measured stress; false if a measured value exists and is used."
  residual_stress_proxy:
    type: number
    description: "Proxy-computed residual stress in MPa, computed for all rows but used as a stress feature only when is_proxy is true; never set equal to the measured value."
  fatigue_life_cycles:
    type: integer
    description: "Number of cycles to failure."
  source:
    type: string
    description: "Origin of the record (e.g., 'synthetic', 'verification', or name of a real open dataset)."
  checksum:
    type: string
    description: "SHA-256 checksum of the raw row for provenance."
additionalProperties: false
