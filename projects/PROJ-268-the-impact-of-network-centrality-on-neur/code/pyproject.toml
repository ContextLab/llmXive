[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-268"
version = "0.1.0"
description = "Impact of Network Centrality on Neural Synchrony in Resting-State fMRI"
requires-python = ">=3.11"
dependencies = [
    "nibabel",
    "numpy",
    "scipy",
    "pandas",
    "networkx",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "datasets",
    "nilearn",
    "brainsmash",
    "tqdm",
    "ruff",
    "black",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (black handles this)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["download_data", "error_handling", "logging_config", "preprocess_raw", "setup_project", "setup_requirements", "utils"]
force-sort-within-sections = true

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["F811"]
