# Project Configuration for Network Topology Heat Dissipation Study
# Generated by T004: static configuration with default pipeline parameters

# General Settings
proximity_threshold: 2.5          # nm – baseline physical proximity threshold
scaling_factor: 1.0               # multiplier applied when statistical_override is true
validation_mode: false            # set true to run in synthetic‑validation‑only mode
statistical_override: false       # switch between fixed threshold and lattice‑constant‑scaled

# Seed for reproducibility
seed: 42

# Material Constants (defaults, can be overridden per‑material)
materials:
  graphene:
    lattice_constant: 0.246      # nm
    R_lattice: 1.0
  mos2:
    lattice_constant: 0.316      # nm
    R_lattice: 1.5

# Data directories (relative to project root)
data:
  raw: "data/raw"
  processed: "data/processed"
  results: "results"
  state: "state"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pipeline.log"
