[lint]
# Select error codes:
# E: pycodestyle errors
# F: Pyflakes
# W: pycodestyle warnings
select = ["E", "F", "W"]

# Ignore specific rules if necessary (none selected for now)
ignore = []

# Allow unused variables that start with underscore (e.g., _unused)
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Maximum line length (matching black default)
max-line-length = 88

[format]
# Quote style for strings
quote-style = "double"

# Indent style (spaces)
indent-style = "space"

# Skip magic trailing comma
skip-magic-trailing-comma = false

# Line ending (default to unix)
line-ending = "lf"

[lint.per-file-ignores]
# Allow specific ignores for test files if needed
"tests/**/*.py" = []