# Ruff configuration for llmXive project
# Linting rules as per task T003a

select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "BLE", # flake8-blind-except
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]

# Ignore specific rules if necessary
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in data classes)
]

# Target Python version
target-version = "py310"

# Line length for formatting (consistent with black)
line-length = 88

[isort]
known-first-party = ["src", "tests", "scripts", "setup_project"]
known-third-party = [
    "numpy",
    "pandas",
    "networkx",
    "scipy",
    "matplotlib",
    "seaborn",
    "sklearn",
    "yaml",
    "jsonschema",
    "pytest",
]

[flake8]
max-complexity = 15

[per-file-ignores]
"tests/*" = ["S101", "N802", "B017"] # Allow asserts, shorter names in tests, specific exception checks
"code/setup_project.py" = ["T201"]    # Allow print in setup script