[loggers]
keys=root, pipeline

[handlers]
keys=fileHandler

[formatters]
keys=defaultFormatter

[logger_root]
level=WARNING
handlers=fileHandler

[logger_pipeline]
level=INFO
handlers=fileHandler
qualName=pipeline
propagate=0

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=defaultFormatter
args=('logs/pipeline.log', 'a')

[formatter_defaultFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S