$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Statistical Test Result"
type: object
required:
  - test_name
  - metric
  - group_a_n
  - group_b_n
  - test_statistic
  - p_value
  - effect_size
  - effect_size_type
  - significance
  - bonferroni_corrected_alpha
properties:
  test_name:
    type: string
    description: "Name of the statistical test (e.g., independent-samples t-test, Mann-Whitney U, chi-square)."
  metric:
    type: string
    description: "Metric compared (e.g., review_active_seconds, comment_density, issue_severity)."
  group_a_n:
    type: integer
    description: "Sample size of the LLM-generated group."
  group_b_n:
    type: integer
    description: "Sample size of the Human-written group."
  test_statistic:
    type: number
    description: "t value, U statistic, or chi-square statistic."
  p_value:
    type: number
    description: "Raw p-value before correction."
  effect_size:
    type: number
    description: "Cohen's d, rank-biserial correlation, or Cramer's V."
  effect_size_type:
    type: string
    enum: ["cohen_d", "rank_biserial", "cramers_v"]
    description: "Which effect-size metric is reported."
  significance:
    type: boolean
    description: "True if p_value < bonferroni_corrected_alpha."
  bonferroni_corrected_alpha:
    type: number
    description: "Alpha after Bonferroni correction (0.05 divided by the number of primary tests)."