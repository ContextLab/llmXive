$schema: "http://json-schema.org/draft-07/schema#"
title: "Processed Battery Sequence Dataset"
description: "Tensor dataset produced after ingestion and preprocessing, ready for model training. Input shape per cell is (several cycles, multiple time‑steps, 3 channels)."
type: object
required:
  - version
  - generated_at
  - sequences
  - targets
  - cell_ids
  - protocols
properties:
  version:
    type: string
    description: "Semantic version of the processing pipeline (e.g., 'v1.0.0')."
  generated_at:
    type: string
    description: "UTC timestamp (ISO 8601) when the file was created."
  seed:
    type: integer
    description: "Random seed used for splitting and training reproducibility."
  sequences:
    type: array
    description: "Input tensors, each of shape (N, M, 100, 3), where M denotes the intermediate feature dimension."
    items:
      type: array
      items:
        type: array
        items:
          type: array
          items:
            type: number
  targets:
    type: array
    description: "Scalar final capacity‑fade targets, computed as described in the plan."
    items:
      type: number
  cell_ids:
    type: array
    description: "Original cell identifiers aligned with sequences/targets."
    items:
      type: string
  protocols:
    type: array
    description: "Cycling protocol label per cell, used for held‑out protocol split."
    items:
      type: string
  splits:
    type: object
    description: "Indices for train, validation, and held‑out protocol test sets."
    properties:
      train:
        type: array
        items:
          type: integer
      validation:
        type: array
        items:
          type: integer
      test:
        type: array
        items:
          type: integer
  provenance:
    type: object
    description: "Source URLs, raw file checksums, and pipeline version for reproducibility."
    properties:
      source_urls:
        type: array
        items:
          type: string
      raw_checksums:
        type: object
        additionalProperties:
          type: string
      pipeline_version:
        type: string
        description: "Version tag of the preprocessing code."