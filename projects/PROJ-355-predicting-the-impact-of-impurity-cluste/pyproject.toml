# pyproject.toml
# Configuration for build tools, linting (ruff) and formatting (black)

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "impurity-clustering-segregation"
version = "0.1.0"
description = "Predicting the impact of impurity clustering on grain boundary segregation"
authors = [{name = "Research Team"}]
requires-python = ">=3.11"

# -----------------
# Linting (ruff)
# -----------------
[tool.ruff]
line-length = 88
select = [
    "E", "F", "W", "C90", "N", "D", "UP", "YTT", "BLE", "B", "A", "C4",
    "DTZ", "T20", "ISC", "ICN", "G", "PIE", "PYI", "PT", "Q", "RET",
    "SLF", "SIM", "TID", "TCH", "ARG", "FIX", "ERA", "RUF"
]
ignore = []

# -----------------
# Formatting (black)
# -----------------
[tool.black]
line-length = 88
target-version = ["py311"]
include = '\\.pyi?$'
exclude = '''
/(
    \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
