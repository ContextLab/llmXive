[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impurity-clustering-segregation"
version = "0.1.0"
description = "Predicting the Impact of Impurity Clustering on Grain Boundary Segregation"
requires-python = ">=3.9"
dependencies = [
    "pymatgen==2024.1.1",
    "scikit-learn==1.4.0",
    "statsmodels==0.14.1",
    "numpy==1.26.0",
    "pandas==2.1.0",
    "ase==3.23.0",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "pytest==7.4.0",
    "ruff==0.1.0",
    "black==23.10.0"
]

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"] # Ignore unused imports in __init__.py files

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(\.eggs|\.git|\.hg|\.mypy_cache|\.nox|\.tox|\.venv|venv|_build|buck-out|build|dist)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
