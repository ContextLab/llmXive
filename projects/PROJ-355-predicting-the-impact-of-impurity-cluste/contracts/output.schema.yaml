$schema: http://json-schema.org/draft-07/schema#
type: object
required:
  - r2
  - rmse
  - p_values
  - vif_scores
properties:
  r2:
    type: number
  rmse:
    type: number
  p_values:
    type: object
    additionalProperties:
      type: number
  confidence_intervals:
    type: array
    items:
      type: object
      required:
        - lower
        - upper
        - predicted
      properties:
        lower:
          type: number
        upper:
          type: number
        predicted:
          type: number
  vif_scores:
    type: object
    additionalProperties:
      type: number
  sensitivity_metrics:
    type: object
    additionalProperties:
      type: number