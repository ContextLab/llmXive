$schema: http://json-schema.org/draft-07/schema#
type: object
required:
  - bulk_config_id
  - impurity_species
  - alloy_system_id
  - clustering_descriptors
properties:
  bulk_config_id:
    type: string
  impurity_species:
    type: string
  alloy_system_id:
    type: string
  clustering_descriptors:
    type: object
    required:
      - rdf_peak
      - pair_corr
      - voronoi_count
    properties:
      rdf_peak:
        type: number
      pair_corr:
        type: number
      voronoi_count:
        type: number
  segregation_energy:
    type: number
    nullable: true