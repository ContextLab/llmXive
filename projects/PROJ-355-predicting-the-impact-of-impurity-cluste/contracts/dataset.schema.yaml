$schema: http://json-schema.org/draft-07/schema#
title: Dataset Schema for Impurity Clustering Segregation Study
description: >
  Defines the required structure for the dataset generated by the data pipeline
  (User Story 1). This schema validates the output of the descriptor computation
  and energy simulation steps before modeling begins.
type: object
required:
  - bulk_config_id
  - impurity_species
  - segregation_energy
  - clustering_descriptors
properties:
  bulk_config_id:
    type: string
    description: >
      Unique identifier for the bulk configuration source (e.g., Materials Project ID
      'mp-xxxxx' or OQMD ID).
    pattern: "^(mp-\\d+|oqmd-\\d+)$"
  impurity_species:
    type: string
    description: >
      Chemical symbol of the impurity atom inserted at the grain boundary.
    pattern: "^[A-Z][a-z]?$"
  segregation_energy:
    type: number
    description: >
      Calculated segregation energy in eV. Negative values indicate favorable
      segregation to the grain boundary.
    minimum: -100.0
    maximum: 100.0
  clustering_descriptors:
    type: object
    description: >
      Object containing the computed clustering descriptors for the impurity
      within the interface region (atoms within 5 Å of the GB plane).
    required:
      - rdf_peak
      - pair_corr
      - voronoi_count
    properties:
      rdf_peak:
        type: number
        description: >
          Radial Distribution Function peak value within the defined cutoff
          from the GB plane.
      pair_corr:
        type: number
        description: >
          Pair correlation statistic for the impurity environment.
      voronoi_count:
        type: integer
        description: >
          Number of neighbors identified via Voronoi tessellation in the
          interface region.
additionalProperties: false