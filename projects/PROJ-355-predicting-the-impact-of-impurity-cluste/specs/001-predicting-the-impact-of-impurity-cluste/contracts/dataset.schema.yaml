$schema: "http://json-schema.org/draft-07/schema#"
title: "Training Dataset Row Schema"
description: "One row of data/processed/training_set.csv linking clustering descriptors (computed on bulk configuration before impurity insertion), covariates, and EAM segregation energy."
type: object
properties:
  sample_id:
    type: string
    description: "Unique training-sample identifier."
  bulk_id:
    type: string
    description: "Originating BulkConfiguration identifier."
  gb_id:
    type: string
    description: "GrainBoundaryStructure identifier."
  alloy_system:
    type: string
    description: "Alloy family, e.g. 'Fe-Cr'."
  impurity_species:
    type: string
    description: "Element symbol of the impurity."
  rdf_peak_value:
    type: number
    description: "RDF peak descriptor **computed on bulk configuration before impurity insertion**."
  pair_corr_value:
    type: number
    description: "Pair‑correlation statistic **computed on bulk configuration before impurity insertion**."
  voronoi_count:
    type: integer
    description: "Voronoi neighbor count for the impurity **computed on bulk configuration before impurity insertion**."
  cluster_size:
    type: number
    description: "Mean nearest‑neighbor distance among impurity atoms within the interface region (used for FR‑009)."
  local_lattice_strain:
    type: number
    description: "Covariate: trace of the local strain tensor around the interface."
  atomic_radius:
    type: number
    description: "Covariate: impurity atomic radius (from standard elemental property tables)."
  electronegativity:
    type: number
    description: "Covariate: impurity electronegativity (from standard elemental property tables)."
  segregation_energy_eV:
    type: number
    description: "Leave‑one‑out EAM segregation energy in eV."
  split:
    type: string
    enum: ["train", "test"]
    description: "Deterministic train/test assignment from the pinned seed."
required:
  - sample_id
  - bulk_id
  - gb_id
  - alloy_system
  - impurity_species
  - rdf_peak_value
  - pair_corr_value
  - voronoi_count
  - cluster_size
  - local_lattice_strain
  - atomic_radius
  - electronegativity
  - segregation_energy_eV
  - split
additionalProperties: false