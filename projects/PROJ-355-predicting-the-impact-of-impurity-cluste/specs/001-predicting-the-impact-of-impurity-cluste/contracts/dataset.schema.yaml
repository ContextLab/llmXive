$schema: "http://json-schema.org/draft-07/schema#"
title: "Training Dataset Row Schema"
description: "One row of data/processed/training_set.csv linking clustering descriptors (computed on the bulk lattice only), covariates, and EAM segregation energy."
type: object
properties:
  sample_id:
    type: string
    description: "Unique training‑sample identifier."
  bulk_id:
    type: string
    description: "Originating BulkConfiguration identifier."
  gb_id:
    type: string
    description: "GrainBoundaryStructure identifier."
  alloy_system:
    type: string
    description: "Alloy family, e.g. 'Fe-Cr'."
  impurity_species:
    type: string
    description: "Element symbol of the impurity."
  rdf_peak_value:
    type: number
    description: "RDF peak descriptor **computed on the bulk lattice only**."
  pair_corr_value:
    type: number
    description: "Pair‑correlation statistic **computed on the bulk lattice only**."
  voronoi_count:
    type: integer
    description: "Voronoi neighbor count **computed on the bulk lattice only**."
  misorientation_angle:
    type: number
    description: "Misorientation angle of the grain boundary (degrees)."
  boundary_plane:
    type: string
    description: "Boundary plane orientation (Miller indices)."
  local_lattice_strain:
    type: number
    description: "Trace of the local strain tensor around the interface."
  atomic_radius:
    type: number
    description: "Impurity atomic radius (standard elemental property)."
  electronegativity:
    type: number
    description: "Impurity electronegativity (standard elemental property)."
  segregation_energy_eV:
    type: number
    description: "EAM segregation energy in eV."
  split:
    type: string
    enum: ["train", "test"]
    description: "Deterministic train/test assignment from the pinned seed."
required:
  - sample_id
  - bulk_id
  - gb_id
  - alloy_system
  - impurity_species
  - rdf_peak_value
  - pair_corr_value
  - voronoi_count
  - misorientation_angle
  - boundary_plane
  - local_lattice_strain
  - atomic_radius
  - electronegativity
  - segregation_energy_eV
  - split
additionalProperties: false
