$schema: http://json-schema.org/draft-07/schema#
title: "Training Dataset Schema"
description: "Aggregated dataset linking clustering descriptors, covariates, and segregation energies for regression."
type: object
properties:
  sample_id:
    type: string
    description: "Unique identifier for the training sample."
  bulk_id:
    type: string
    description: "Reference to the originating BulkConfiguration."
  gb_id:
    type: string
    description: "Identifier of the GrainBoundaryStructure."
  alloy_system:
    type: string
    description: "Alloy family (e.g., 'Fe-Cr')."
  impurity_species:
    type: string
    description: "Element symbol of the impurity."
  rdf_peak_value:
    type: number
    description: "RDF peak value computed at the GB interface."
  pair_corr_value:
    type: number
    description: "Pair‑correlation statistic at the GB interface."
  voronoi_count:
    type: integer
    description: "Voronoi neighbor count for the impurity at the interface."
  local_lattice_strain:
    type: number
    description: "Trace of the strain tensor (covariate)."
  atomic_radius:
    type: number
    description: "Atomic radius of the impurity element."
  electronegativity:
    type: number
    description: "Electronegativity of the impurity element."
  segregation_energy_eV:
    type: number
    description: "Leave‑One‑Out segregation energy in eV."
  vif_rdf:
    type: number
    description: "VIF for the RDF descriptor."
  vif_pair:
    type: number
    description: "VIF for the pair‑correlation descriptor."
  vif_voronoi:
    type: number
    description: "VIF for the Voronoi count descriptor."
  descriptive_framing:
    type: string
    description: "Pre‑formatted text explaining joint relationships when VIF ≥ 10."
required:
  - sample_id
  - bulk_id
  - gb_id
  - alloy_system
  - impurity_species
  - rdf_peak_value
  - pair_corr_value
  - voronoi_count
  - local_lattice_strain
  - atomic_radius
  - electronegativity
  - segregation_energy_eV
  - vif_rdf
  - vif_pair
  - vif_voronoi
  - descriptive_framing
additionalProperties: false