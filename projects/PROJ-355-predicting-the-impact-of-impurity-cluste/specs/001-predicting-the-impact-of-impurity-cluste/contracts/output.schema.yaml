$schema: http://json-schema.org/draft-07/schema#
title: "Model Output Schema"
description: "Metrics, diagnostics, and sensitivity results produced by the regression pipeline."
type: object
properties:
  model_type:
    type: string
    description: "Regression model used (e.g., 'RidgeRegression')."
  cross_validation:
    type: object
    description: "Cross‑validation summary."
    properties:
      folds:
        type: integer
        description: "Number of folds (5 or N for LOOCV)."
      r2_mean:
        type: number
        description: "Mean R² across folds."
      r2_std:
        type: number
        description: "Standard deviation of R²."
      rmse_mean:
        type: number
        description: "Mean RMSE across folds."
      rmse_std:
        type: number
        description: "Standard deviation of RMSE."
    required:
      - folds
      - r2_mean
      - r2_std
      - rmse_mean
      - rmse_std
  coefficients:
    type: array
    description: "Regression coefficients with raw and adjusted p‑values."
    items:
      type: object
      properties:
        feature_name:
          type: string
        coefficient:
          type: number
        p_value_raw:
          type: number
        p_value_adjusted:
          type: number
          description: "Adjusted p‑value after Bonferroni or FDR correction."
      required:
        - feature_name
        - coefficient
        - p_value_raw
        - p_value_adjusted
  collinearity:
    type: object
    description: "VIF diagnostics and framing."
    properties:
      vif_scores:
        type: object
        additionalProperties:
          type: number
        description: "VIF for each predictor."
      high_collinearity_detected:
        type: boolean
        description: "True if any VIF ≥ 10."
      vif_threshold:
        type: number
        description: "Threshold used for VIF detection (10)."
      descriptive_framing:
        type: string
        description: "Joint‑relationship text when VIF ≥ 10."
    required:
      - vif_scores
      - high_collinearity_detected
      - vif_threshold
      - descriptive_framing
  sensitivity_analysis:
    type: object
    description: "Results of the three‑point threshold sweep."
    properties:
      threshold_values:
        type: array
        items:
          type: number
        description: "The three λ values (25th, 50th, 75th percentiles)."
      rmse_variance:
        type: number
        description: "Variance of RMSE across the sweep."
      r2_stability:
        type: number
        description: "Standard deviation of R² across the sweep."
    required:
      - threshold_values
      - rmse_variance
      - r2_stability
  metadata:
    type: object
    description: "Run‑level provenance."
    properties:
      random_seed:
        type: integer
      sample_size:
        type: integer
      date:
        type: string
        format: date-time
      code_version_hash:
        type: string
      power_analysis:
        type: object
        description: "Power‑analysis summary."
        properties:
          required_n:
            type: integer
            description: "Required sample size for desired power."
          achieved_n:
            type: integer
            description: "Actual number of samples used."
          achieved_power:
            type: number
            description: "Achieved statistical power given achieved_n."
        required:
          - required_n
          - achieved_n
          - achieved_power
    required:
      - random_seed
      - sample_size
      - date
      - code_version_hash
      - power_analysis
required:
  - model_type
  - cross_validation
  - coefficients
  - collinearity
  - sensitivity_analysis
  - metadata
additionalProperties: false