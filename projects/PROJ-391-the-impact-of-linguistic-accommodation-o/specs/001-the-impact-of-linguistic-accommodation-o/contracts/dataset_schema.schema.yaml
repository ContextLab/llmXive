$schema: "http://json-schema.org/draft-07/schema#"
title: "Final Processed Dataset Schema"
description: "Schema for the final_dataset.csv containing accommodation metrics and dialogue-level emotion scores."
type: object
properties:
  conversation_id:
    type: string
    description: "Unique session identifier."
  turn_index:
    type: integer
    description: "Turn sequence number."
  text:
    type: string
    description: "User text, normalized to NFKC."
  partner_turn:
    type: string
    description: "Partner text, normalized to NFKC."
  lexical_overlap:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Jaccard similarity of token sets."
  syntactic_similarity:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Jaccard similarity of POS tag sets."
  bigram_overlap:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Jaccard similarity of bigram sets."
  dependency_similarity:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Jaccard similarity of dependency relations."
  sentence_length_variance:
    type: number
    minimum: 0.0
    description: "Variance of sentence lengths."
  dialogue_emotion_label:
    type: string
    enum:
      - "Joy"
      - "Sadness"
      - "Anger"
      - "Fear"
      - "Surprise"
      - "Disgust"
      - "Neutral"
    description: "Raw emotion label."
  emotion_mapped_score:
    type: integer
    minimum: 1
    maximum: 5
    description: "Proxy emotion score (1‑5) derived from the mapping rule."
  word_count:
    type: integer
    minimum: 0
    description: "Total word count of the dialogue pair."
  lda_topic_id:
    type: integer
    minimum: 0
    maximum: 9
    description: "Dominant LDA cluster ID (k=10)."
required:
  - conversation_id
  - turn_index
  - text
  - partner_turn
  - lexical_overlap
  - syntactic_similarity
  - sentence_length_variance
  - dialogue_emotion_label
  - emotion_mapped_score
  - word_count
  - lda_topic_id
additionalProperties: false