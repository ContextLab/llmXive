$schema: "http://json-schema.org/draft-07/schema#"
title: "Processed Dialogue Dataset Schema"
description: "Schema for the processed dialogue dataset containing accommodation metrics and dialogue-level emotion scores."
type: object
properties:
  conversation_id:
    type: string
    description: "Unique identifier for the conversation."
  turn_index:
    type: integer
    description: "Index of the turn within the conversation."
  text:
    type: string
    description: "Normalized text of the first turn in the pair."
  partner_turn:
    type: string
    description: "Normalized text of the adjacent turn."
  dialogue_emotion_label:
    type: string
    description: "Emotion label from the source (e.g., \"Joy\")."
  lexical_overlap:
    type: number
    description: "Jaccard similarity of token sets between turns."
    minimum: 0.0
    maximum: 1.0
  syntactic_similarity:
    type: number
    description: "Jaccard similarity of POS tag sets."
    minimum: 0.0
    maximum: 1.0
  bigram_overlap:
    type: number
    description: "Jaccard similarity of bigram sets."
    minimum: 0.0
    maximum: 1.0
  dependency_similarity:
    type: number
    description: "Jaccard similarity of dependency relation labels (optional)."
    minimum: 0.0
    maximum: 1.0
  sentence_length_variance:
    type: number
    description: "Variance of sentence lengths in the turns."
    minimum: 0.0
  emotion_mapped_score:
    type: integer
    description: "Proxy emotion score derived from emotion label (1‑5)."
    minimum: 1
    maximum: 5
  word_count:
    type: integer
    description: "Total word count of the dialogue pair."
    minimum: 0
  lda_topic_id:
    type: integer
    description: "Dominant LDA cluster ID (k=10)."
    minimum: 0
    maximum: 9
required:
  - conversation_id
  - turn_index
  - text
  - partner_turn
  - lexical_overlap
  - syntactic_similarity
  - sentence_length_variance
  - dialogue_emotion_label
  - emotion_mapped_score
  - word_count
  - lda_topic_id
additionalProperties: false