$schema: http://json-schema.org/draft-07/schema#
title: Statistical Report Output Schema
description: >
  Schema defining the structure of statistical analysis outputs generated by the
  linguistic accommodation pipeline (correlation, regression, bootstrap, sensitivity).
type: object
required:
  - metadata
  - correlation_analysis
  - regression_analysis
  - bootstrap_results
  - effect_sizes
  - sensitivity_analysis
  - validation
properties:
  metadata:
    type: object
    description: Execution context and provenance.
    required:
      - timestamp
      - pipeline_version
      - dataset_source
      - sample_size
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of report generation.
      pipeline_version:
        type: string
        description: Version of the pipeline that generated this report.
      dataset_source:
        type: string
        description: Path or identifier of the input dataset used.
      sample_size:
        type: integer
        minimum: 1
        description: Number of records included in the analysis.
      seed:
        type: integer
        description: Random seed used for reproducibility.

  correlation_analysis:
    type: object
    description: Results of Pearson and Spearman correlation tests.
    required:
      - lexical_overlap
      - syntactic_similarity
    properties:
      lexical_overlap:
        type: object
        description: Correlation results for lexical overlap metric.
        required:
          - pearson
          - spearman
        properties:
          pearson:
            type: object
            required:
              - coefficient
              - p_value
              - n
            properties:
              coefficient:
                type: number
                description: Pearson correlation coefficient (r).
              p_value:
                type: number
                description: Two-tailed p-value.
              n:
                type: integer
                description: Number of observations.
          spearman:
            type: object
            required:
              - coefficient
              - p_value
              - n
            properties:
              coefficient:
                type: number
                description: Spearman rank correlation coefficient (rho).
              p_value:
                type: number
                description: Two-tailed p-value.
              n:
                type: integer
                description: Number of observations.
          bonferroni_corrected_p:
            type: number
            description: P-value after Bonferroni correction for multiple testing.

      syntactic_similarity:
        type: object
        description: Correlation results for syntactic similarity metric.
        required:
          - pearson
          - spearman
        properties:
          pearson:
            type: object
            required:
              - coefficient
              - p_value
              - n
            properties:
              coefficient:
                type: number
                description: Pearson correlation coefficient (r).
              p_value:
                type: number
                description: Two-tailed p-value.
              n:
                type: integer
                description: Number of observations.
          spearman:
            type: object
            required:
              - coefficient
              - p_value
              - n
            properties:
              coefficient:
                type: number
                description: Spearman rank correlation coefficient (rho).
              p_value:
                type: number
                description: Two-tailed p-value.
              n:
                type: integer
                description: Number of observations.
          bonferroni_corrected_p:
            type: number
            description: P-value after Bonferroni correction for multiple testing.

  regression_analysis:
    type: object
    description: Results of linear and ordinal logistic regression models.
    required:
      - linear_regression
      - ordinal_logistic_regression
    properties:
      linear_regression:
        type: object
        description: Linear regression of emotional intensity on accommodation metrics.
        required:
          - coefficients
          - r_squared
          - p_values
        properties:
          coefficients:
            type: object
            description: Mapping of predictor names to coefficient values.
            additionalProperties:
              type: number
          r_squared:
            type: number
            description: R-squared value of the model.
          p_values:
            type: object
            description: Mapping of predictor names to p-values.
            additionalProperties:
              type: number
          covariates:
            type: array
            items:
              type: string
            description: List of covariates included (e.g., conversation length, topic).

      ordinal_logistic_regression:
        type: object
        description: Ordinal logistic regression (Proportional Odds Model) results.
        required:
          - coefficients
          - pseudo_r_squared
          - p_values
        properties:
          coefficients:
            type: object
            description: Mapping of predictor names to coefficient values.
            additionalProperties:
              type: number
          pseudo_r_squared:
            type: number
            description: McFadden's Pseudo-R2 value.
          p_values:
            type: object
            description: Mapping of predictor names to p-values.
            additionalProperties:
              type: number
          model_fit:
            type: string
            description: Summary of model fit statistics.

  bootstrap_results:
    type: object
    description: Bootstrap resampling results for correlation stability.
    required:
      - iterations
      - ci_width
      - correlation_distribution
    properties:
      iterations:
        type: integer
        minimum: 1000
        description: Number of bootstrap iterations performed.
      target_ci_width:
        type: number
        description: Target confidence interval width (default 0.05).
      ci_width:
        type: number
        description: Achieved confidence interval width.
      confidence_level:
        type: number
        default: 0.95
        description: Confidence level (e.g., 0.95 for 95% CI).
      correlation_distribution:
        type: array
        items:
          type: number
        description: Array of correlation coefficients from each bootstrap iteration.
      final_estimate:
        type: number
        description: Final correlation estimate (mean of bootstrap distribution).
      ci_lower:
        type: number
        description: Lower bound of the confidence interval.
      ci_upper:
        type: number
        description: Upper bound of the confidence interval.

  effect_sizes:
    type: object
    description: Interpretation of effect sizes based on Cohen's thresholds.
    required:
      - lexical_overlap_effect
      - syntactic_similarity_effect
    properties:
      lexical_overlap_effect:
        type: object
        required:
          - magnitude
          - interpretation
        properties:
          magnitude:
            type: number
            description: Absolute value of the correlation coefficient.
          interpretation:
            type: string
            enum:
              - negligible
              - small
              - medium
              - large
            description: Interpretation based on Cohen's thresholds (0.1, 0.3, 0.5).

      syntactic_similarity_effect:
        type: object
        required:
          - magnitude
          - interpretation
        properties:
          magnitude:
            type: number
            description: Absolute value of the correlation coefficient.
          interpretation:
            type: string
            enum:
              - negligible
              - small
              - medium
              - large
            description: Interpretation based on Cohen's thresholds (0.1, 0.3, 0.5).

  sensitivity_analysis:
    type: object
    description: Results of sensitivity analysis comparing POS vs. Dependency metrics.
    required:
      - pos_based
      - dependency_based
      - comparison
    properties:
      pos_based:
        type: object
        description: Metrics based on POS tag sets.
        required:
          - correlation_with_intensity
          - p_value
        properties:
          correlation_with_intensity:
            type: number
          p_value:
            type: number

      dependency_based:
        type: object
        description: Metrics based on dependency relation sets.
        required:
          - correlation_with_intensity
          - p_value
        properties:
          correlation_with_intensity:
            type: number
          p_value:
            type: number

      comparison:
        type: object
        description: Comparison between the two metrics.
        required:
          - difference_in_correlation
          - conclusion
        properties:
          difference_in_correlation:
            type: number
          conclusion:
            type: string
            description: Qualitative assessment of metric stability.

  validation:
    type: object
    description: Validation metrics and checks.
    required:
      - data_integrity
      - assumption_checks
    properties:
      data_integrity:
        type: object
        required:
          - missing_values
          - outliers_detected
        properties:
          missing_values:
            type: integer
            description: Count of missing values found.
          outliers_detected:
            type: boolean
            description: Whether outliers were detected.

      assumption_checks:
        type: object
        description: Checks for statistical assumptions (normality, linearity, etc.).
        required:
          - normality_test
          - homoscedasticity
        properties:
          normality_test:
            type: object
            required:
              - method
              - statistic
              - p_value
              - passed
            properties:
              method:
                type: string
              statistic:
                type: number
              p_value:
                type: number
              passed:
                type: boolean

          homoscedasticity:
            type: object
            required:
              - method
              - statistic
              - p_value
              - passed
            properties:
              method:
                type: string
              statistic:
                type: number
              p_value:
                type: number
              passed:
                type: boolean