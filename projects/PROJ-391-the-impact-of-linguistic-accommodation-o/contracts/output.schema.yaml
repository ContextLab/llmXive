$schema: http://json-schema.org/draft-07/schema#
title: Statistical Report Output Schema
description: >
  Schema for the final statistical analysis report generated by the pipeline.
  Contains correlation results, regression metrics, bootstrap confidence intervals,
  and effect size interpretations.
type: object
required:
  - metadata
  - correlation_analysis
  - regression_analysis
  - bootstrap_results
  - effect_size_interpretation
  - validation_summary
properties:
  metadata:
    type: object
    description: Metadata about the analysis run.
    required:
      - timestamp
      - dataset_source
      - sample_size
      - python_version
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of the analysis run.
      dataset_source:
        type: string
        description: Path or identifier of the dataset used (e.g., 'data/processed/final_dataset.csv').
      sample_size:
        type: integer
        minimum: 1
        description: Number of records analyzed.
      python_version:
        type: string
        description: Python version used for the analysis.
      random_seed:
        type: integer
        description: Random seed used for reproducibility.

  correlation_analysis:
    type: object
    description: Results of Pearson and Spearman correlation tests.
    required:
      - lexical_overlap
      - syntactic_similarity
    properties:
      lexical_overlap:
        type: object
        description: Correlation results for lexical overlap metric.
        required:
          - pearson
          - spearman
        properties:
          pearson:
            type: object
            required:
              - coefficient
              - p_value
            properties:
              coefficient:
                type: number
                description: Pearson correlation coefficient.
              p_value:
                type: number
                minimum: 0
                maximum: 1
                description: P-value for the Pearson test.
          spearman:
            type: object
            required:
              - coefficient
              - p_value
            properties:
              coefficient:
                type: number
                description: Spearman rank correlation coefficient.
              p_value:
                type: number
                minimum: 0
                maximum: 1
                description: P-value for the Spearman test.
          bonferroni_adjusted:
            type: object
            required:
              - adjusted_p_value_pearson
              - adjusted_p_value_spearman
            properties:
              adjusted_p_value_pearson:
                type: number
                description: Bonferroni-adjusted p-value for Pearson.
              adjusted_p_value_spearman:
                type: number
                description: Bonferroni-adjusted p-value for Spearman.

      syntactic_similarity:
        type: object
        description: Correlation results for syntactic similarity metric.
        required:
          - pearson
          - spearman
        properties:
          pearson:
            type: object
            required:
              - coefficient
              - p_value
            properties:
              coefficient:
                type: number
                description: Pearson correlation coefficient.
              p_value:
                type: number
                minimum: 0
                maximum: 1
                description: P-value for the Pearson test.
          spearman:
            type: object
            required:
              - coefficient
              - p_value
            properties:
              coefficient:
                type: number
                description: Spearman rank correlation coefficient.
              p_value:
                type: number
                minimum: 0
                maximum: 1
                description: P-value for the Spearman test.
          bonferroni_adjusted:
            type: object
            required:
              - adjusted_p_value_pearson
              - adjusted_p_value_spearman
            properties:
              adjusted_p_value_pearson:
                type: number
                description: Bonferroni-adjusted p-value for Pearson.
              adjusted_p_value_spearman:
                type: number
                description: Bonferroni-adjusted p-value for Spearman.

  regression_analysis:
    type: object
    description: Results of linear and ordinal logistic regression models.
    required:
      - linear_regression
      - ordinal_logistic
    properties:
      linear_regression:
        type: object
        description: Linear regression results with controls.
        required:
          - r_squared
          - coefficients
        properties:
          r_squared:
            type: number
            description: R-squared value of the linear model.
          coefficients:
            type: object
            description: Regression coefficients for predictors.
            additionalProperties:
              type: object
              properties:
                estimate:
                  type: number
                std_error:
                  type: number
                p_value:
                  type: number

      ordinal_logistic:
        type: object
        description: Ordinal logistic regression (Proportional Odds Model) results.
        required:
          - pseudo_r_squared
          - coefficients
        properties:
          pseudo_r_squared:
            type: number
            description: McFadden's Pseudo-R2 value.
          coefficients:
            type: object
            description: Regression coefficients for predictors.
            additionalProperties:
              type: object
              properties:
                estimate:
                  type: number
                std_error:
                  type: number
                p_value:
                  type: number

  bootstrap_results:
    type: object
    description: Bootstrap resampling results for correlation confidence intervals.
    required:
      - iterations
      - ci_width
      - correlation_estimate
      - ci_lower
      - ci_upper
    properties:
      iterations:
        type: integer
        minimum: 1000
        description: Number of bootstrap iterations performed.
      ci_width:
        type: number
        description: Final confidence interval width.
      correlation_estimate:
        type: number
        description: Bootstrap mean correlation estimate.
      ci_lower:
        type: number
        description: Lower bound of the 95% confidence interval.
      ci_upper:
        type: number
        description: Upper bound of the 95% confidence interval.
      convergence_status:
        type: string
        enum:
          - converged
          - max_iterations_reached
        description: Status of the bootstrap convergence.

  effect_size_interpretation:
    type: object
    description: Interpretation of effect sizes based on Cohen's thresholds.
    required:
      - lexical_overlap_effect
      - syntactic_similarity_effect
      - overall_conclusion
    properties:
      lexical_overlap_effect:
        type: object
        required:
          - magnitude
          - interpretation
        properties:
          magnitude:
            type: string
            enum:
              - small
              - medium
              - large
              - negligible
          interpretation:
            type: string
      syntactic_similarity_effect:
        type: object
        required:
          - magnitude
          - interpretation
        properties:
          magnitude:
            type: string
            enum:
              - small
              - medium
              - large
              - negligible
          interpretation:
            type: string
      overall_conclusion:
        type: string
        description: Summary conclusion regarding the relationship between accommodation and emotional intensity.

  validation_summary:
    type: object
    description: Summary of validation metrics and checks.
    required:
      - inter_rater_reliability
      - validation_correlation
      - distribution_fit
    properties:
      inter_rater_reliability:
        type: object
        description: Krippendorff's Alpha result.
        required:
          - alpha
          - interpretation
        properties:
          alpha:
            type: number
            minimum: 0
            maximum: 1
          interpretation:
            type: string
      validation_correlation:
        type: object
        description: Correlation between mapped scores and human ratings.
        required:
          - coefficient
          - p_value
        properties:
          coefficient:
            type: number
          p_value:
            type: number
      distribution_fit:
        type: object
        description: Chi-Square Goodness-of-Fit test results.
        required:
          - statistic
          - p_value
          - conclusion
        properties:
          statistic:
            type: number
          p_value:
            type: number
          conclusion:
            type: string