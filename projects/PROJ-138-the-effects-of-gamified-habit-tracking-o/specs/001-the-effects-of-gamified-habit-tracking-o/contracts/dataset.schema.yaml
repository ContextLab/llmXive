$schema: "http://json-schema.org/draft-07/schema#"
title: "Merged Analysis Dataset Schema"
description: "Schema for the final analysis-ready dataset (one row per user-week)."
type: object
properties:
  user_id:
    type: string
    description: "Unique anonymized user identifier (UUID)."
  week_number:
    type: integer
    description: "Sequential week number starting from 1."
    minimum: 1
  adherence_flag:
    type: integer
    description: "Binary indicator of adherence (1 = active, 0 = inactive) for the week."
    enum: [0, 1]
  gamification_status:
    type: integer
    description: "Binary indicator of app type (1 = gamified, 0 = non-gamified)."
    enum: [0, 1]
  conscientiousness_score:
    type: number
    description: "Normalized Big Five Conscientiousness score (0.0 to 1.0)."
    minimum: 0.0
    maximum: 1.0
  achievement_score:
    type: number
    description: "Normalized Need for Achievement score (0.0 to 1.0)."
    minimum: 0.0
    maximum: 1.0
  streak_length:
    type: integer
    description: "Current consecutive weeks of adherence."
    minimum: 0
  dropout_event:
    type: integer
    description: "Binary indicator if 3 consecutive weeks of non-adherence occurred."
    enum: [0, 1]
  censoring_indicator:
    type: integer
    description: "1 if the user dropped out (event occurred), 0 if censored (study ended or lost to follow-up)."
    enum: [0, 1]
required:
  - user_id
  - week_number
  - adherence_flag
  - gamification_status
  - conscientiousness_score
  - achievement_score
  - streak_length
  - dropout_event
  - censoring_indicator
additionalProperties: false
