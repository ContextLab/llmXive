# Dataset Schema Definition
# Defines required columns and valid values for validation
schema:
  name: habit_tracking_dataset
  version: "1.0"
  required_columns:
    - User_ID
    - Gamified
    - Adherence
    - Conscientiousness
    - Need_for_Achievement
    - date
    - event_type
  column_types:
    User_ID: string
    Gamified: boolean
    Adherence: integer
    Conscientiousness: float
    Need_for_Achievement: float
    date: date
    event_type: string
  valid_tags:
    gamified_app_usage:
      - "habitica"
      - "gamified"
      - "standard"
      - "none"
