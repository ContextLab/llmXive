  r: 'The test file `code/tests/test_graph_generator.py` exists and is substantive,
    but there is no evidence of a passing pytest run, and the tests cannot actually
    pass: `code/graph_generator.py` uses `Any` in type annotations (`Tuple[List[Any],
    List[Any]]`, `Dict[str, Any]`) without importing `Any` from `typing`, which raises
    `NameError` at import/collection time, so `pytest code/tests/test_graph_generator.py`
    would fail immediately. Additionally, `test_nx_set_seed_compatibility` calls `nx.set_seed`,
    which is not a real networkx API, and `_write_validation_metrics` writes `cycle_rate`
    as the placeh'
