[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-multi-turn-r"
version = "0.1.0"
description = "llmXive follow-up: extending Multi-Turn Reflective Masking Elicits Reasoning in Mask Diffusion Mode"
requires-python = ">=3.11"
dependencies = [
    "torch==2.1.0",
    "transformers==4.36.0",
    "datasets==2.14.0",
    "networkx==3.2.1",
    "lifelines==0.29.0",
    "scikit-learn==1.3.2",
    "pandas==2.1.3",
    "numpy==1.26.2",
    "pytest==7.4.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.1.6",
    "black==23.11.0",
    "pytest-cov==4.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["code", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
