$schema: "http://json-schema.org/draft-07/schema#"
title: "SyntheticPuzzle"
description: "Schema for a single logical puzzle instance with topological metadata and deterministic text mapping."
type: "object"
required:
  - instance_id
  - text
  - ground_truth
  - ground_truth_path
  - nesting_depth
  - branching_factor
  - graph_structure
  - is_acyclic
  - is_solvable
  - text_generation_method
  - target_path_id
  - seed
  - is_orthogonal
properties:
  instance_id:
    type: "string"
    pattern: "^[a-z0-9_]+$"
    description: "Unique identifier for the puzzle instance."
  text:
    type: "string"
    description: "Natural language representation of the logical puzzle."
  ground_truth:
    type: "string"
    description: "The correct solution path in textual form."
  ground_truth_path:
    type: "json"
    description: "Ordered list of node IDs comprising the valid logical path."
  nesting_depth:
    type: "integer"
    minimum: 1
    maximum: 10
    description: "Maximum length of any path in the DAG."
  branching_factor:
    type: "number"
    minimum: 1.0
    maximum: 5.0
    description: "Average in-degree of non‑root nodes."
  graph_structure:
    type: "object"
    description: "JSON representation of the DAG (nodes and edges)."
    properties:
      nodes:
        type: "array"
        items:
          type: "string"
      edges:
        type: "array"
        items:
          type: "array"
          items:
            type: "string"
  target_path_id:
    type: "string"
    description: "Identifier of selected ground‑truth path (perturbation )."
  seed:
    type: "integer"
    description: "Random seed for generation."
  is_orthogonal:
    type: "boolean"
    description: "Flag indicating whether (depth  )."
  is_acyclic:
    type: "boolean"
    description: "Must  "
    #  
  is_solvable:
    type: "boolean"
    description: "Must  "
    # -
    #  "
  text_generation_method:
    type: "string"
    description: "Method  "
    #  "
  #  


