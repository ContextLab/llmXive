%YAML 1.2
---
# Schema for the molecular toxicity dataset
# Defines the expected structure of data files used in the pipeline
$schema: http://json-schema.org/draft-07/schema#
title: Molecular Toxicity Dataset
description: |
  Schema for the primary dataset used in the molecular toxicity prediction pipeline.
  Contains SMILES strings, toxicity labels, and metadata.
type: object
required:
  - metadata
  - records
properties:
  metadata:
    type: object
    description: Metadata about the dataset source and processing
    required:
      - source
      - assay_id
      - assay_type
      - total_compounds
      - created_at
      - checksum
    properties:
      source:
        type: string
        description: Original data source (e.g., "PubChem", "ToxCast")
        pattern: "^[A-Za-z0-9_\\- ]+$"
      assay_id:
        type: string
        description: Specific assay identifier (e.g., "AID_1851")
        pattern: "^[A-Za-z0-9_]+$"
      assay_type:
        type: string
        description: Type of assay (e.g., "Ames", "ToxCast")
        pattern: "^(Ames|ToxCast|Tox21)$"
      total_compounds:
        type: integer
        minimum: 1000
        description: Total number of compounds in the dataset (minimum 1000 per reviewer concerns)
      created_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of dataset creation
      checksum:
        type: string
        pattern: "^[a-f0-9]{64}$"
        description: SHA-256 checksum of the raw data file
      preprocessing:
        type: object
        description: Details of preprocessing steps applied
        properties:
          smiles_canonicalized:
            type: boolean
            description: Whether SMILES were canonicalized
          mw_filter_applied:
            type: boolean
            description: Whether molecular weight filtering was applied
          mw_threshold:
            type: number
            description: Molecular weight threshold in Daltons
          duplicates_removed:
            type: integer
            description: Number of duplicate records removed
  records:
    type: array
    description: Array of molecular records
    items:
      type: object
      required:
        - smiles
        - label
        - compound_id
      properties:
        smiles:
          type: string
          description: Canonical SMILES string
          pattern: "^[A-Za-z0-9@\\+\\-\\[\\]\\(\\)\\\\/=#%]+$"
        label:
          type: integer
          description: Toxicity label (0: inactive, 1: active)
          enum: [0, 1]
        compound_id:
          type: string
          description: Unique identifier for the compound
        molecular_weight:
          type: number
          description: Calculated molecular weight
        log_p:
          type: number
          description: Calculated partition coefficient
additionalProperties: false
