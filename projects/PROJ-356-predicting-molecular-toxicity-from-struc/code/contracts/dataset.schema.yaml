$schema: http://json-schema.org/draft-07/schema#
title: Molecular Toxicity Dataset Schema
description: Schema for the raw and processed molecular toxicity datasets used in the pipeline.
type: object
required:
  - metadata
  - records
properties:
  metadata:
    type: object
    required:
      - assay_id
      - assay_type
      - source_url
      - total_compounds
      - checksum_sha256
      - created_at
    properties:
      assay_id:
        type: string
        description: Unique identifier for the assay (e.g., PubChem AID)
      assay_type:
        type: string
        description: Type of assay (e.g., Ames, ToxCast)
      source_url:
        type: string
        format: uri
        description: URL where the data was downloaded from
      total_compounds:
        type: integer
        minimum: 1000
        description: Total number of compounds in the dataset
      checksum_sha256:
        type: string
        pattern: '^[a-f0-9]{64}$'
        description: SHA-256 checksum of the raw data file
      created_at:
        type: string
        format: date-time
        description: Timestamp when the dataset was processed
  records:
    type: array
    description: List of molecular records
    items:
      type: object
      required:
        - smiles
        - label
        - molecular_weight
      properties:
        smiles:
          type: string
          description: Canonical SMILES string of the molecule
        label:
          type: integer
          enum: [0, 1]
          description: Toxicity label (0: non-toxic, 1: toxic)
        molecular_weight:
          type: number
          description: Molecular weight in Daltons
        inchi_key:
          type: string
          description: InChIKey for the molecule
        source_id:
          type: string
          description: Original identifier from the source dataset
