%YAML 1.2
---
# Schema for model evaluation metrics and Out-of-Fold (OOF) predictions
# Used by: src/evaluation/metrics.py, src/pipeline/run.py
type: object
required:
  - metadata
  - rule_based
  - logistic
  - statistical_significance
properties:
  metadata:
    type: object
    required:
      - pipeline_version
      - cv_folds
      - cv_repeats
      - dataset_source
    properties:
      pipeline_version:
        type: string
      cv_folds:
        type: integer
        default: 5
      cv_repeats:
        type: integer
        default: 3
      dataset_source:
        type: string
  rule_based:
    type: object
    required:
      - roc_auc
      - f1_score
      - recall
    properties:
      roc_auc:
        type: number
        minimum: 0.0
        maximum: 1.0
      f1_score:
        type: number
        minimum: 0.0
        maximum: 1.0
      recall:
        type: number
        minimum: 0.0
        maximum: 1.0
  logistic:
    type: object
    required:
      - roc_auc
      - f1_score
      - recall
    properties:
      roc_auc:
        type: number
        minimum: 0.0
        maximum: 1.0
      f1_score:
        type: number
        minimum: 0.0
        maximum: 1.0
      recall:
        type: number
        minimum: 0.0
        maximum: 1.0
  comparison:
    type: object
    required:
      - recall_diff
      - threshold
    properties:
      recall_diff:
        type: number
        description: "Recall (Logistic) - Recall (Rule-Based)"
      threshold:
        type: number
        default: 0.05
        description: "Threshold for marginal gain (SC-002)"
  statistical_significance:
    type: object
    required:
      - delong_p_value
      - ci_95_lower
      - ci_95_upper
      - is_significant
    properties:
      delong_p_value:
        type: number
        minimum: 0.0
        maximum: 1.0
      ci_95_lower:
        type: number
      ci_95_upper:
        type: number
      is_significant:
        type: boolean
        description: "True if p-value < 0.05"
  out_of_fold_predictions:
    type: object
    description: "Path to the JSON file containing OOF prediction vectors"
    properties:
      rule_based_path:
        type: string
      logistic_path:
        type: string
  error_analysis:
    type: object
    description: "Optional error analysis results (US3)"
    properties:
      false_negative_scaffolds:
        type: array
        items:
          type: object
          properties:
            scaffold_smiles:
              type: string
            count:
              type: integer
            frequency:
              type: number
