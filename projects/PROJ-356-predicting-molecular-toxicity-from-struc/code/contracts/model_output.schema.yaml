$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: Schema for model predictions and evaluation metrics.
type: object
required:
  - metadata
  - predictions
  - metrics
properties:
  metadata:
    type: object
    required:
      - model_type
      - cv_folds
      - cv_repeats
      - timestamp
    properties:
      model_type:
        type: string
        enum: ["rule_based", "logistic_regression"]
        description: Type of model that generated the output
      cv_folds:
        type: integer
        minimum: 1
        description: Number of cross-validation folds
      cv_repeats:
        type: integer
        minimum: 1
        description: Number of CV repeats
      timestamp:
        type: string
        format: date-time
        description: Timestamp of model execution
  predictions:
    type: array
    description: Out-of-fold predictions for each instance
    items:
      type: object
      required:
        - instance_id
        - prediction
        - true_label
      properties:
        instance_id:
          type: integer
          description: Unique identifier for the instance
        prediction:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Predicted probability of toxicity
        true_label:
          type: integer
          enum: [0, 1]
          description: Ground truth label
  metrics:
    type: object
    required:
      - roc_auc
      - f1_score
      - recall
    properties:
      roc_auc:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Area Under the ROC Curve
      f1_score:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: F1 Score
      recall:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Recall (True Positive Rate)
      precision:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Precision
      accuracy:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Accuracy
  statistical_analysis:
    type: object
    description: Results of DeLong's test comparing models
    properties:
      p_value:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: P-value from DeLong's test
      confidence_interval:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
        description: 95% Confidence Interval for AUC difference
      is_significant:
        type: boolean
        description: Whether the difference is statistically significant (p < 0.05)
