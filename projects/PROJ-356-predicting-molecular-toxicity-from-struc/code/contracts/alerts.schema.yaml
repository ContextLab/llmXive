$schema: http://json-schema.org/draft-07/schema#
title: StructuralAlertsConfig
type: object
properties:
  patterns:
    type: array
    minItems: 10
    items:
      type: object
      required:
        - pattern_id
        - smarts_string
        - weight
        - source
        - description
      properties:
        pattern_id:
          type: string
        smarts_string:
          type: string
        weight:
          type: number
        source:
          type: string
        description:
          type: string
required:
  - patterns