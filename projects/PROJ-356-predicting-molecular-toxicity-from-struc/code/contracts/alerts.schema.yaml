%YAML 1.2
---
# Schema for structural alerts configuration
# Defines the format for SMARTS patterns and their weights
$schema: http://json-schema.org/draft-07/schema#
title: Structural Alerts Schema
description: |
  Schema for the structural alerts configuration file containing
  SMARTS patterns, weights, and metadata for rule-based toxicity prediction.
type: object
required:
  - alerts
  - metadata
properties:
  metadata:
    type: object
    description: Metadata about the alerts configuration
    required:
      - version
      - created_at
      - source
    properties:
      version:
        type: string
        description: Configuration version (semantic versioning)
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      created_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of creation
      source:
        type: string
        description: Source of the alerts (e.g., "Literature", "Curated")
      description:
        type: string
        description: Human-readable description of the alerts set
  alerts:
    type: array
    description: Array of structural alert definitions
    items:
      type: object
      required:
        - name
        - smarts
        - weight
      properties:
        name:
          type: string
          description: Human-readable name for the alert
          pattern: "^[A-Za-z0-9_]+$"
        smarts:
          type: string
          description: SMARTS pattern string for substructure matching
          minLength: 1
        weight:
          type: number
          description: Weight multiplier for this alert in scoring
          minimum: 0.0
          multipleOf: 0.1
        description:
          type: string
          description: Detailed description of the alert's toxicological significance
        references:
          type: array
          description: List of literature references
          items:
            type: string
            pattern: "^\\[\\d+\\]"
        category:
          type: string
          description: Toxicological category
          enum: [Genotoxic, Carcinogenic, Mutagenic, Reactive, Other]
        priority:
          type: integer
          description: Priority level (1 = highest)
          minimum: 1
          maximum: 5
additionalProperties: false