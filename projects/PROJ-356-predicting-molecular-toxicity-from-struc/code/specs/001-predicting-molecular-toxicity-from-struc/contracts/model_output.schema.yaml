$schema: http://json-schema.org/draft-07/schema#
title: ModelOutput
description: >
  Schema for model evaluation outputs produced by the pipeline. Covers
  per-instance out-of-fold predictions and the consolidated metrics
  report (results/metrics_baseline.json) comparing the rule-based and
  descriptor-based (Logistic Regression) models.
type: object
required:
  - model_type
  - roc_auc
  - f1_score
properties:
  model_type:
    type: string
    description: Identifier of the evaluated model.
    enum:
      - rule_based
      - descriptor_logistic
  roc_auc:
    type: number
    description: ROC-AUC on the held-out test set (FR-006).
    minimum: 0
    maximum: 1
  f1_score:
    type: number
    description: F1-score on the held-out test set (FR-006).
    minimum: 0
    maximum: 1
  recall:
    type: number
    description: Recall on the held-out test set.
    minimum: 0
    maximum: 1
  confusion_matrix:
    type: array
    description: 2x2 confusion matrix [[TN, FP], [FN, TP]].
    minItems: 2
    maxItems: 2
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: integer
        minimum: 0
  recall_diff_pct_points:
    type: number
    description: >
      Percentage-point difference in recall between the descriptor-based
      and rule-based models (Desc - Rule), scaled to percentage units.
  recall_diff_raw:
    type: number
    description: Raw difference in recall (Desc - Rule) in [0, 1] units.
  recall_diff_significant:
    type: boolean
    description: True if abs(recall_diff_raw) > 0.05 (SC-002).
  delong_p_value:
    type: number
    description: >
      P-value from DeLong's test on paired out-of-fold predictions
      (FR-007). No multiple-comparison correction is applied (FR-009).
    minimum: 0
    maximum: 1
  delong_ci:
    type: object
    description: 95% confidence interval for the AUC difference.
    properties:
      lower:
        type: number
      upper:
        type: number
  statistically_significant:
    type: boolean
    description: True if delong_p_value < 0.05 (FR-009).
  oof_predictions:
    type: array
    description: >
      Out-of-fold prediction vector (one prediction per instance from
      the fold where it was held out).
    items:
      type: object
      required:
        - instance_id
        - prediction
      properties:
        instance_id:
          type: integer
          description: Row index of the preprocessed DataFrame.
        prediction:
          type: number
          description: Predicted probability or rule-based score.
  dataset_metadata:
    type: object
    description: Metadata about the source dataset (reviewer concern).
    properties:
      assay_id:
        type: string
      assay_type:
        type: string
      total_compounds:
        type: integer
        minimum: 0
additionalProperties: true