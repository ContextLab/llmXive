$schema: http://json-schema.org/draft-07/schema#
title: MutagenicityDataset
description: >
  Schema for the raw and preprocessed mutagenicity datasets used in the
  molecular toxicity prediction pipeline. Each record represents a single
  compound with a SMILES string and a binary mutagenicity label sourced
  from a PubChem BioAssay (e.g., AID 1851) or ToxCast assay.
type: object
required:
  - smiles
  - label
properties:
  smiles:
    type: string
    description: Molecular structure encoded as a SMILES string.
    minLength: 1
  label:
    type: integer
    description: Binary mutagenicity label (1 = active/mutagenic, 0 = inactive).
    enum:
      - 0
      - 1
  canonical_smiles:
    type: string
    description: >
      RDKit-canonicalized SMILES produced during preprocessing
      (FR-002). Present in preprocessed outputs only.
  molecular_weight:
    type: number
    description: >
      Molecular weight in Daltons. Preprocessing filters compounds
      with molecular_weight >= 1000.
    exclusiveMinimum: 0
    maximum: 1000
  assay_id:
    type: string
    description: Identifier of the source assay (e.g., a PubChem AID).
  assay_type:
    type: string
    description: Type of mutagenicity assay (e.g., Ames, ToxCast).
additionalProperties: false
