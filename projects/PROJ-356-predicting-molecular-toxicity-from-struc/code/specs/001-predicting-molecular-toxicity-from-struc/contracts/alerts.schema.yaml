$schema: http://json-schema.org/draft-07/schema#
title: StructuralAlertsConfig
description: Schema for the structural alerts configuration file.
type: object
required:
  - patterns
properties:
  patterns:
    type: array
    minItems: 10
    description: List of structural alert patterns
    items:
      type: object
      required:
        - pattern_id
        - smarts_string
        - weight
        - source
        - description
      properties:
        pattern_id:
          type: string
          description: Unique identifier for the pattern (e.g., NITRO_AROMATIC_01)
        smarts_string:
          type: string
          description: SMARTS string defining the substructure
        weight:
          type: number
          minimum: 0.0
          description: Weight associated with this alert for scoring
        source:
          type: string
          description: Origin of the alert (e.g., 'Brenk Set', 'ToxCast')
        description:
          type: string
          description: Human-readable description of the structural motif
additionalProperties: false