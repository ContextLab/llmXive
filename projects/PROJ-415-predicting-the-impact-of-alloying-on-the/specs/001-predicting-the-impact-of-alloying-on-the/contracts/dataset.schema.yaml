$schema: "http://json-schema.org/draft-07/schema#"
title: "Curated Diffusion Dataset Schema"
description: "Schema for the filtered FCC solute-diffusion dataset used in the analysis."
type: "object"
properties:
  host_element:
    type: "string"
    description: "Symbol of the host metal (e.g., Ni, Al)."
  solute_element:
    type: "string"
    description: "Symbol of the solute element."
  crystal_structure:
    type: "string"
    enum: ["FCC"]
    description: "Must be FCC."
  diffusion_mode:
    type: "string"
    enum: ["solute", "impurity"]
    description: "Must be solute or impurity diffusion (not self)."
  concentration_at_percent:
    type: "number"
    minimum: 0
    description: "Solute concentration in atomic percent."
  activation_energy_eV:
    type: "number"
    minimum: 0
    description: "Activation energy in eV."
  size_mismatch:
    type: "number"
    description: "Calculated size mismatch: (r_solute - r_host) / r_host."
  baseline_shift_eV:
    type: "number"
    description: "Difference between alloy activation energy and pure host baseline."
required:
  - host_element
  - solute_element
  - concentration_at_percent
  - activation_energy_eV
  - size_mismatch
  - baseline_shift_eV
additionalProperties: false