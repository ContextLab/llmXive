$schema: "http://json-schema.org/draft-07/schema#"
title: "FCC Diffusion Dataset Schema"
description: "Schema for the curated FCC self-diffusion dataset (data/curated/filtered.csv)"
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the record"
  host_metal:
    type: "string"
    description: "Host metal symbol (e.g., 'Ni', 'Cu')"
  solute_metal:
    type: "string"
    description: "Solute metal symbol"
  crystal_structure:
    type: "string"
    description: "Must be 'FCC'"
    enum: ["FCC"]
  diffusion_mode:
    type: "string"
    description: "Must be 'self'"
    enum: ["self"]
  activation_energy_eV:
    type: "number"
    description: "Activation energy in eV/atom"
    minimum: 0
  concentration_at_pct:
    type: "number"
    description: "Solute concentration in atomic percent"
    minimum: 0
  source_url:
    type: "string"
    description: "Source URL of the data point"
required:
  - id
  - host_metal
  - solute_metal
  - crystal_structure
  - diffusion_mode
  - activation_energy_eV
  - concentration_at_pct
  - source_url
additionalProperties: false
