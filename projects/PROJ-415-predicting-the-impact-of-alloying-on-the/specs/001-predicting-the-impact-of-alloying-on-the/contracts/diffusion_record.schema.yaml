$schema: "http://json-schema.org/draft-07/schema#"
title: "DiffusionRecord"
description: "Schema for a single diffusion data point in the curated dataset."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the record."
  host_element:
    type: "string"
    pattern: "^[A-Z][a-z]?$"
    description: "Chemical symbol of the host metal."
  solute_element:
    type: "string"
    pattern: "^[A-Z][a-z]?$"
    description: "Chemical symbol of the solute element."
  crystal_structure:
    type: "string"
    enum:
      - "FCC"
      - "BCC"
      - "HCP"
    description: "Crystal lattice structure."
  diffusion_mode:
    type: "string"
    enum:
      - "self"
      - "solute"
    description: "Diffusion mechanism type."
  activation_energy_eV:
    type: "number"
    minimum: 0
    description: "Activation energy in electron-volts."
  solute_concentration_at_pct:
    type: "number"
    minimum: 0
    description: "Solute concentration in atomic percent."
  source_url:
    type: "string"
    format: "uri"
    description: "URL of the original data source."
required:
  - id
  - host_element
  - solute_element
  - crystal_structure
  - diffusion_mode
  - activation_energy_eV
  - solute_concentration_at_pct
  - source_url
additionalProperties: false
