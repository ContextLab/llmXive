$schema: "http://json-schema.org/draft-07/schema#"
title: "Linear Regression Model Output Schema"
description: "Schema for the linear regression coefficients and statistical significance metrics."
type: "object"
properties:
  model_type:
    type: "string"
    const: "LinearRegression"
  coefficients:
    type: "object"
    properties:
      size_mismatch:
        type: "number"
        description: "Coefficient for the size_mismatch feature."
      intercept:
        type: "number"
    required:
      - size_mismatch
      - intercept
  statistics:
    type: "object"
    properties:
      size_mismatch_p_value:
        type: "number"
        description: "P-value for the size_mismatch coefficient."
      size_mismatch_ci_95:
        type: "array"
        items:
          type: "number"
        minItems: 2
        maxItems: 2
        description: "95% Bootstrap confidence interval [lower, upper]."
    required:
      - size_mismatch_p_value
      - size_mismatch_ci_95
  metrics:
    type: "object"
    properties:
      r_squared:
        type: "number"
      rmse:
        type: "number"
      mae:
        type: "number"
    required:
      - r_squared
      - rmse
      - mae
required:
  - model_type
  - coefficients
  - statistics
  - metrics
