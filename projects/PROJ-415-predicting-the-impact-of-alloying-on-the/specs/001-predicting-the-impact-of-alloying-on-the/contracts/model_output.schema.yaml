$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Output Schema"
description: "Schema for the trained model artifacts and metrics"
type: "object"
properties:
  model_type:
    type: "string"
    description: "Type of model: 'RF', 'GB', or 'Linear'"
    enum: ["RF", "GB", "Linear"]
  hyperparameters:
    type: "object"
    description: "Dictionary of hyperparameters used"
  metrics:
    type: "object"
    description: "Performance metrics"
    properties:
      r_squared:
        type: "number"
      rmse:
        type: "number"
      mae:
        type: "number"
  coefficients:
    type: "object"
    description: "Coefficients and p-values (only for Linear)"
    properties:
      size_mismatch:
        type: "object"
        properties:
          coef:
            type: "number"
          p_value:
            type: "number"
          std_error:
            type: "number"
  timestamp:
    type: "string"
    format: "date-time"
  random_seed:
    type: "integer"
required:
  - model_type
  - hyperparameters
  - metrics
  - timestamp
  - random_seed
additionalProperties: true
