$schema: "http://json-schema.org/draft-07/schema#"
title: "AtomicDescriptor"
description: "Schema for computed atomic features."
type: "object"
properties:
  host_radius:
    type: "number"
    description: "Atomic radius of host in pm."
    minimum: 0
  solute_radius:
    type: "number"
    description: "Atomic radius of solute in pm."
    minimum: 0
  size_mismatch:
    type: "number"
    description: "Calculated size mismatch (r_solute - r_host) / r_host."
  electronegativity_diff:
    type: "number"
    description: "Difference in Pauling electronegativity."
  valence_electron_diff:
    type: "integer"
    description: "Difference in valence electrons."
required:
  - host_radius
  - solute_radius
  - size_mismatch
  - electronegativity_diff
  - valence_electron_diff
additionalProperties: false