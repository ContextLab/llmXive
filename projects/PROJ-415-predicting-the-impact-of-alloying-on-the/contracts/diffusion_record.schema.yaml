$schema: http://json-schema.org/draft-07/schema#
title: DiffusionRecord
description: Schema for diffusion data records in FCC metals.
type: object
required:
  - host_element
  - solute_element
  - crystal_structure
  - diffusion_mode
  - activation_energy_eV
  - temperature_K
  - concentration_at_percent
properties:
  host_element:
    type: string
    description: The host metal element symbol (e.g., 'Al', 'Cu', 'Ni').
  solute_element:
    type: string
    description: The solute element symbol.
  crystal_structure:
    type: string
    enum:
      - FCC
      - BCC
      - HCP
      - Diamond
    description: The crystal structure of the host metal.
  diffusion_mode:
    type: string
    enum:
      - self
      - impurity
      - interstitial
      - vacancy
    description: The mode of diffusion.
  activation_energy_eV:
    type: number
    description: Activation energy in eV/atom.
  temperature_K:
    type: number
    description: Temperature in Kelvin.
  concentration_at_percent:
    type: number
    description: Solute concentration in atomic percent.
  pre_exponential_factor:
    type: number
    description: Pre-exponential factor (D0) in cm^2/s.
  reference_id:
    type: string
    description: Unique identifier for the source reference.
additionalProperties: false
