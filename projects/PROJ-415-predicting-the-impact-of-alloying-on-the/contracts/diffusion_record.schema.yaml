$schema: "http://json-schema.org/draft-07/schema#"
title: DiffusionRecord
description: Schema for a single diffusion record in the FCC alloy dataset.
type: object
required:
  - solute_symbol
  - host_symbol
  - crystal_structure
  - diffusion_mode
  - concentration
  - activation_energy_eV
  - pre_exponential_factor
  - temperature_range_min
  - temperature_range_max
properties:
  solute_symbol:
    type: string
    description: Chemical symbol of the solute element.
  host_symbol:
    type: string
    description: Chemical symbol of the host metal.
  crystal_structure:
    type: string
    description: Crystal structure of the host metal.
    enum:
      - FCC
      - BCC
      - HCP
  diffusion_mode:
    type: string
    description: Mode of diffusion (self, impurity, etc.).
    enum:
      - self
      - impurity
      - tracer
  concentration:
    type: number
    description: Solute concentration in atomic percent (at.%).
  activation_energy_eV:
    type: number
    description: Diffusion activation energy in eV/atom.
  pre_exponential_factor:
    type: number
    description: Pre-exponential factor D0 in cm^2/s.
  temperature_range_min:
    type: number
    description: Minimum temperature of the measurement range in Kelvin.
  temperature_range_max:
    type: number
    description: Maximum temperature of the measurement range in Kelvin.
  source:
    type: string
    description: Reference or source of the data.
  notes:
    type: string
    description: Additional notes or comments.
additionalProperties: false
