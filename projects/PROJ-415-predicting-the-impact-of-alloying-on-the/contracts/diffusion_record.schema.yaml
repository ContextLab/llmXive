$schema: "http://json-schema.org/draft-07/schema#"
title: DiffusionRecord
description: Schema for a single diffusion measurement record in FCC metals.
type: object
required:
  - host_id
  - solute_id
  - concentration
  - activation_energy
  - crystal_structure
  - diffusion_mode
properties:
  host_id:
    type: string
    description: Chemical symbol of the host metal (e.g., 'Al', 'Cu').
  solute_id:
    type: string
    description: Chemical symbol of the solute element.
  concentration:
    type: number
    description: Solute concentration in atomic percent (at.%).
  activation_energy:
    type: number
    description: Diffusion activation energy in eV/atom.
  crystal_structure:
    type: string
    description: Crystal structure of the host lattice.
    enum:
      - FCC
      - BCC
      - HCP
  diffusion_mode:
    type: string
    description: Mode of diffusion (e.g., self, impurity).
    enum:
      - self
      - impurity
additionalProperties: false
