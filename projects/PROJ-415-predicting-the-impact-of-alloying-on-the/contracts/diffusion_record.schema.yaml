$schema: "http://json-schema.org/draft-07/schema#"
title: "DiffusionRecord"
description: "Schema for diffusion data records in FCC metals."
type: "object"
required:
  - host_id
  - solute_id
  - concentration
  - activation_energy
  - crystal_structure
  - diffusion_mode
properties:
  host_id:
    type: "string"
    description: "Identifier for the host metal (e.g., element symbol)."
  solute_id:
    type: "string"
    description: "Identifier for the solute metal (e.g., element symbol)."
  concentration:
    type: "number"
    description: "Solute concentration in atomic percent."
    minimum: 0
  activation_energy:
    type: "number"
    description: "Activation energy for diffusion in eV/atom."
    minimum: 0
  crystal_structure:
    type: "string"
    description: "Crystal structure of the alloy."
    enum:
      - "FCC"
      - "BCC"
      - "HCP"
  diffusion_mode:
    type: "string"
    description: "Mode of diffusion (self or solute)."
    enum:
      - "self"
      - "solute"
additionalProperties: false
