$schema: http://json-schema.org/draft-07/schema#
title: Frozen Embeddings Schema
description: |
  Schema for frozen embeddings generated by the MulTaBench extension pipeline.
  These embeddings are produced by CLIP ViT-B/32 (images) and Sentence-BERT (text)
  without gradient tracking, ensuring deterministic CPU-only inference.
type: object
required:
  - run_id
  - dataset_id
  - embedding_type
  - embedding_vector
  - source_field
  - generated_at
properties:
  run_id:
    type: string
    description: Unique identifier for the pipeline run (e.g., 'run_20231027_123456').
    pattern: '^run_\\d{8}_\\d{6}$'
  dataset_id:
    type: string
    description: Identifier of the source dataset (e.g., 'multabench_clevr', 'multabench_ade20k').
  embedding_type:
    type: string
    description: Type of embedding model used.
    enum:
      - clip_vit_b32_image
      - clip_vit_b32_text
      - sentence_bert
  embedding_vector:
    type: array
    description: The frozen embedding vector (list of floats).
    items:
      type: number
      format: float
    minItems: 512
    maxItems: 2048
  source_field:
    type: string
    description: Name of the original field in the dataset used for embedding.
  source_hash:
    type: string
    description: SHA-256 hash of the source content (for reproducibility verification).
    pattern: '^[a-f0-9]{64}$'
  generated_at:
    type: string
    description: ISO 8601 timestamp of generation.
    format: date-time
  model_version:
    type: string
    description: Version string of the embedding model (e.g., 'clip-vit-base-patch32').
  device:
    type: string
    description: Device used for inference.
    enum:
      - cpu
      - cuda
    const: cpu
  precision:
    type: string
    description: Numerical precision used.
    enum:
      - float32
      - float16
      - bfloat16
    default: float32
  metadata:
    type: object
    description: Additional optional metadata.
    properties:
      batch_index:
        type: integer
        minimum: 0
      sample_index:
        type: integer
        minimum: 0
      original_shape:
        type: array
        description: Original shape of the input (e.g., image dimensions).
        items:
          type: integer
additionalProperties: true
examples:
  - run_id: run_20231027_123456
    dataset_id: multabench_clevr
    embedding_type: clip_vit_b32_image
    embedding_vector: [0.123, -0.456, 0.789, ...]
    source_field: image
    source_hash: "a1b2c3d4e5f6..."
    generated_at: "2023-10-27T12:34:56Z"
    model_version: "clip-vit-base-patch32"
    device: cpu
    precision: float32
    metadata:
      batch_index: 0
      sample_index: 42
      original_shape: [3, 224, 224]