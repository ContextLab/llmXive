[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-noise-cognitive-flexibility"
version = "0.1.0"
description = "Pipeline for analyzing impact of ambient noise on cognitive flexibility in remote workers"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.3",
    "numpy>=1.24.3",
    "scipy>=1.11.1",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "jsonschema>=4.18.4",
    "pytest>=7.4.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["black>=23.0", "flake8>=6.0", "isort>=5.12"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
