$schema: "http://json-schema.org/draft-07/schema#"
title: "Ambient Noise Cognitive Flexibility Dataset"
description: "JSON Schema for raw logs and processed entities in the ambient noise study."

definitions:
  Participant:
    type: object
    required:
      - participant_id
      - start_time
      - end_time
      - device_id
      - calibration_status
      - calibration_error_margin
    properties:
      participant_id:
        type: string
        description: "Unique identifier for the participant"
      start_time:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of session start"
      end_time:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of session end"
      device_id:
        type: string
        description: "Identifier for the recording device"
      calibration_status:
        type: string
        enum: ["PASS", "FAIL", "MISSING"]
        description: "Status of the device calibration"
      calibration_error_margin:
        type: number
        description: "Calibration error in decibels (dB)"
      demographic_info:
        type: object
        properties:
          age:
            type: integer
          gender:
            type: string
          work_experience_years:
            type: number

  NoiseLog:
    type: object
    required:
      - participant_id
      - timestamp
      - db_level
      - frequency_band
    properties:
      participant_id:
        type: string
      timestamp:
        type: string
        format: date-time
      db_level:
        type: number
        description: "Sound pressure level in decibels"
      frequency_band:
        type: string
        enum: ["Low", "Mid", "High", "Full"]
        description: "Frequency band of the measurement"
      source:
        type: string
        description: "Source of the noise (e.g., 'ambient', 'device')"

  TaskPerformance:
    type: object
    required:
      - participant_id
      - task_id
      - timestamp
      - reaction_time_ms
      - error_count
      - correct
    properties:
      participant_id:
        type: string
      task_id:
        type: string
        description: "Identifier for the specific cognitive task"
      timestamp:
        type: string
        format: date-time
      reaction_time_ms:
        type: number
        description: "Reaction time in milliseconds"
      error_count:
        type: integer
        description: "Number of errors in the task trial"
      correct:
        type: boolean
        description: "Whether the trial was correct"
      task_type:
        type: string
        enum: ["switching", "n_back", "stroop"]
        description: "Type of cognitive task performed"

oneOf:
  - $ref: "#/definitions/Participant"
  - $ref: "#/definitions/NoiseLog"
  - $ref: "#/definitions/TaskPerformance"
