[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-orca"
version = "0.1.0"
description = "Extending Orca: The World is in Your Mind - Counterfactual Analysis Pipeline"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "datasets>=2.14.0",
    "mujoco>=3.0.0",
    "pybullet>=3.2.5",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["code*", "code.utils*", "code.data*", "code.models*", "code.analysis*"]

# Ruff Configuration (Linting)
[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501", # Line too long (black handles this)
    "B008", # Do not perform function call in argument defaults (common in dataclasses)
]
exclude = [
    ".git",
    "__pycache__",
    "data/",
    "docs/",
    "build/",
    "dist/",
]

[tool.ruff.per-file-ignores]
"code/data/models.py" = ["N815"] # Allow camelCase for Pydantic fields if needed

# Black Configuration (Formatting)
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
)/
'''

# Isort Configuration (Imports)
[tool.isort]
profile = "black"
line_length = 88
target_version = "py311"
skip_glob = [
    "data/*",
    "build/*",
    "dist/*",
]
known_first_party = ["code"]
known_third_party = [
    "numpy",
    "pandas",
    "torch",
    "sklearn",
    "datasets",
    "mujoco",
    "pybullet",
    "pydantic",
    "psutil",
    "matplotlib",
    "seaborn",
    "pytest",
]

# MyPy Configuration (Type Checking)
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false # Allow gradual typing adoption
strict_optional = true
exclude = ["data/", "build/", "dist/"]
