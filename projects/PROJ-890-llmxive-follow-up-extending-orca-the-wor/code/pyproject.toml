[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-orca-followup"
version = "0.1.0"
description = "Extending Orca: The World is in Your Mind - Counterfactual Analysis"
requires-python = ">=3.11"
dependencies = [
    "datasets==2.18.0",
    "pandas==2.2.1",
    "numpy==1.26.4",
    "scikit-learn==1.4.1.post1",
    "mujoco==3.1.3",
    "pybullet==3.2.6",
    "torch==2.2.1+cpu",
    "torchaudio==2.2.1+cpu",
    "torchvision==0.17.1+cpu",
    "pydantic==2.6.3",
    "psutil==5.9.8",
    "tqdm==4.66.2",
    "huggingface-hub==0.21.4",
    "pytest==8.1.1",
    "ruff==0.3.3",
    "black==24.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.isort]
known-first-party = ["code"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=code --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning"
]
