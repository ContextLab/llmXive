[lint]
# Select common rules: E (pycodestyle errors), W (pycodestyle warnings), F (Pyflakes), I (isort), B (flake8-bugbear)
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B905"] # Ignore line-length (handled by black) and zip-without-explicit-strict

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude a few common directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Per-file-ignores if needed
# [lint.per-file-ignores]

# Target Python version
target-version = "py311"
