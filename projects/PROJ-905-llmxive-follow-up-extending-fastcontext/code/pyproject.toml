[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-fastcontext-followup"
version = "0.1.0"
description = "Follow-up research extending FastContext: Training Efficient Repository Explorer for Coding Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.4.0",
    "pandas==2.1.0",
    "networkx==3.2.1",
    "transformers==4.40.0",
    "datasets==2.18.0",
    "pytest==8.1.0",
    "torch==2.2.0",
    "scipy==1.12.0",
    "nltk==3.8.1",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]