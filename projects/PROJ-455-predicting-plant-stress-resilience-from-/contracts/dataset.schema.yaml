$schema: http://json-schema.org/draft-07/schema#
title: MetabolomicProfile
description: >-
  Schema for a single metabolomic profile representing a plant sample
  under specific stress conditions with pre-stress and post-stress measurements.
type: object
required:
  - sample_id
  - stress_type
  - pre_stress_metabolites
  - post_stress_metabolites
  - recovery_days
  - recovery_metrics
properties:
  sample_id:
    type: string
    description: Unique identifier for the sample (e.g., GEO accession + sample index)
    pattern: "^[A-Za-z0-9_-]+$"
  stress_type:
    type: string
    description: Type of stress applied to the sample
    enum:
      - drought
      - heat
      - cold
      - salt
      - pathogen
      - nutrient_deficiency
  pre_stress_metabolites:
    type: object
    description: >-
      Dictionary mapping metabolite names (or KEGG IDs) to their concentrations
      measured before stress application.
    additionalProperties:
      type: number
      minimum: 0
  post_stress_metabolites:
    type: object
    description: >-
      Dictionary mapping metabolite names (or KEGG IDs) to their concentrations
      measured after stress application.
    additionalProperties:
      type: number
      minimum: 0
  recovery_days:
    type: number
    description: Number of days between stress application and recovery measurement
    minimum: 0
  recovery_metrics:
    type: object
    description: >-
      Dictionary of recovery measurements (biomass, survival rate, etc.)
      used to calculate the RecoveryIndex.
    additionalProperties:
      type: number
      minimum: 0
      maximum: 100
  metadata:
    type: object
    description: Optional additional metadata (plant species, growth conditions, etc.)
    additionalProperties: true
additionalProperties: false
