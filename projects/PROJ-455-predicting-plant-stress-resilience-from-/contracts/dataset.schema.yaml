$schema: http://json-schema.org/draft-07/schema#
title: MetabolomicProfile
description: Schema for plant metabolomic dataset matching the project's data model.
type: object
required:
  - sample_id
  - stress_type
  - recovery_days
  - biomass_change
  - metabolites
  - timestamp
properties:
  sample_id:
    type: string
    description: Unique identifier for the sample.
  stress_type:
    type: string
    enum:
      - DROUGHT
      - HEAT
      - COLD
      - SALT
    description: Type of stress applied.
  recovery_days:
    type: number
    minimum: 0
    description: Number of days post-stress for recovery measurement.
  biomass_change:
    type: number
    description: Relative change in biomass (post/pre).
  metabolites:
    type: object
    description: Key-value pairs of metabolite names to concentrations.
    additionalProperties:
      type: number
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the measurement.
