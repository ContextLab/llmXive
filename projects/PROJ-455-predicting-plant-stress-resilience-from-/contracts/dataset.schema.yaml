$schema: http://json-schema.org/draft-07/schema#
title: MetabolomicProfile Dataset
description: Schema for the metabolomic profile dataset used in plant stress resilience prediction.
type: object
properties:
  sample_id:
    type: string
    description: Unique identifier for the sample.
  accession_id:
    type: string
    description: External dataset accession identifier.
  stress_type:
    type: string
    enum: [drought, heat, cold, salinity, pathogen]
    description: Type of stress applied.
  pre_stress_metabolites:
    type: object
    additionalProperties:
      type: number
    description: Dictionary of metabolite concentrations before stress.
  post_stress_metabolites:
    type: object
    additionalProperties:
      type: number
    description: Dictionary of metabolite concentrations after stress.
  recovery_days:
    type: number
    description: Time in days for recovery.
  recovery_index:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: Normalized recovery metric (0-1 scale).
  biomass_change:
    type: number
    description: Relative change in biomass.
  survival_rate:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: Survival rate of the plant population.
  experiment_date:
    type: string
    format: date-time
    description: Date of the experiment.
  source_dataset:
    type: string
    description: Name of the source dataset.
required:
  - sample_id
  - stress_type
  - pre_stress_metabolites
  - post_stress_metabolites
  - recovery_days
  - recovery_index
