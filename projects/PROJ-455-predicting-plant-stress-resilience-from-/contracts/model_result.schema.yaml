$schema: http://json-schema.org/draft-07/schema#
title: ModelResult
description: Schema for model training results including metrics and top features.
type: object
required:
  - model_type
  - training_time_sec
  - cv_folds
  - metric_value
  - metric_name
  - top_features
properties:
  model_type:
    type: string
    description: The type of model trained (e.g., RandomForest, SVM).
  training_time_sec:
    type: number
    description: Time taken to train the model in seconds.
  n_estimators:
    type: integer
    description: Number of estimators (only for tree-based models).
    nullable: true
  kernel:
    type: string
    description: Kernel type (only for SVM).
    nullable: true
  cv_folds:
    type: integer
    description: Number of cross-validation folds used.
  metric_value:
    type: number
    description: The performance metric value (R² or Pearson r).
  metric_name:
    type: string
    description: Name of the metric (e.g., R2, Pearson_r).
  top_features:
    type: array
    description: List of top features with their importance scores.
    items:
      type: array
      maxItems: 2
      minItems: 2
      items:
        - type: string
          description: Feature name.
        - type: number
          description: Importance score.
