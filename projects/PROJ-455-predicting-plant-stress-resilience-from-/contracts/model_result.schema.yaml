$schema: http://json-schema.org/draft-07/schema#
title: ModelResult
description: Schema for model training results and metrics.
type: object
required:
  - r2
  - rmse
  - mean_absolute_error
  - model_type
  - cv_folds
  - training_time_seconds
properties:
  r2:
    type: number
    description: Coefficient of determination (R²) or Pearson correlation depending on mode.
  rmse:
    type: number
    description: Root Mean Squared Error.
  mean_absolute_error:
    type: number
    description: Mean Absolute Error.
  model_type:
    type: string
    description: Name of the model class used (e.g., RandomForestRegressor).
  cv_folds:
    type: integer
    description: Number of cross-validation folds used.
  training_time_seconds:
    type: number
    description: Total time taken for training in seconds.
  mode:
    type: string
    description: Metric calculation mode ('individual' or 'population').
    enum:
      - individual
      - population
additionalProperties: false
