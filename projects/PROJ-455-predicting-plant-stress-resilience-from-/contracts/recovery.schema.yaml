$schema: http://json-schema.org/draft-07/schema#
title: RecoveryMetric
description: Schema for plant recovery metrics post-stress.
type: object
required:
  - sample_id
  - recovery_index
  - biomass_change
properties:
  sample_id:
    type: string
    description: Unique identifier for the sample.
    minLength: 1
  recovery_index:
    type: number
    description: Normalized recovery index (0-1 scale).
    minimum: 0
    maximum: 1
  biomass_change:
    type: number
    description: Percentage change in biomass compared to control.
    nullable: true
  survival_rate:
    type: number
    description: Survival rate percentage (0-100).
    minimum: 0
    maximum: 100
    nullable: true
  days_to_recovery:
    type: number
    description: Days taken to reach baseline or recovery threshold.
    minimum: 0
    nullable: true
  metadata:
    type: object
    description: Optional additional metadata.
    additionalProperties: true