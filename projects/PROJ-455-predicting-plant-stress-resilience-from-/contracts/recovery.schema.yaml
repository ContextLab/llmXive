$schema: http://json-schema.org/draft-07/schema#
title: RecoveryMetric
description: Schema for recovery metrics derived from biomass or survival data.
type: object
required:
  - sample_id
  - metric_type
  - value
  - normalized_index
properties:
  sample_id:
    type: string
    description: Reference to the sample this metric belongs to.
  metric_type:
    type: string
    description: Original type of measurement.
    enum:
      - biomass
      - survival_rate
      - chlorophyll_content
      - root_length
  value:
    type: number
    description: Raw measured value.
  normalized_index:
    type: number
    description: Normalized Recovery Index (0.0 to 1.0).
    minimum: 0.0
    maximum: 1.0
  timepoint:
    type: integer
    description: Days post-stress for this measurement.
    minimum: 0
  metadata:
    type: object
    description: Optional context for the measurement.
    additionalProperties: true