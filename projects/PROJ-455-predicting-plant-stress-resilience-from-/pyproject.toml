[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predict-plant-stress-resilience"
version = "0.1.0"
description = "Predicting plant stress resilience from publicly available metabolomic data"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.0.3",
    "scikit-learn==1.3.0",
    "numpy==1.24.0",
    "requests==2.31.0",
    "biopython==1.81",
    "pyyaml==6.0.1",
    "pytest==7.4.0",
]

[project.optional-dependencies]
dev = [
    "flake8==6.1.0",
    "black==23.7.0",
    "isort==5.12.0",
    "pytest-cov==4.1.0",
    "mypy==1.5.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | \.eggs
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["code", "tests", "contracts"]
known_third_party = ["pandas", "numpy", "sklearn", "requests", "bio", "yaml", "pytest"]
skip = [".git", ".hg", ".mypy_cache", ".tox", ".venv", "build", "dist", ".eggs"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"