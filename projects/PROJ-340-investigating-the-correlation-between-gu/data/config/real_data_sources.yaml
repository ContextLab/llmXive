# Real Data Source Configuration
#
# This file stores the specific IDs/URLs for verified real datasets
# (e.g., NCBI BioProject IDs, Zenodo DOIs, GEO Accession numbers).
#
# CONSTRAINT: This file must be empty initially and populated only
# during the research phase when a real source is verified.
#
# Addresses Constitution Principle II: No data is used unless it
# comes from a verified source explicitly listed here.
#
# Format:
# sources:
#   - id: "PRJNA123456"  # Example: NCBI BioProject ID
#     type: "ncbi_bioproject"
#     description: "Human gut microbiome and sleep study"
#     url: "https://www.ncbi.nlm.nih.gov/bioproject/PRJNA123456"
#
#   - id: "10.5281/zenodo.123456" # Example: Zenodo DOI
#     type: "zenodo"
#     description: "Metagenomic sequencing data"
#     url: "https://doi.org/10.5281/zenodo.123456"
#
# If this list is empty or contains no valid sources, the pipeline
# MUST fail loudly with a RealDataFetchError.
#
sources: []