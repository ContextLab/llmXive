name: Analysis Pipeline CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.9, "3.10"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify directory structure
      run: |
        mkdir -p data/raw data/processed data/results data/config data/metadata
        mkdir -p specs/001-gut-microbiome-sleep-architecture/contracts

    - name: Run Reference Validator Gate
      run: |
        python code/reference_validator.py --check-only
      continue-on-error: false

    - name: Run Ingestion and Validation
      run: |
        python code/ingest.py --mode synthetic --output data/raw/synthetic_data.csv

    - name: Run Full Analysis Pipeline
      run: |
        python code/main.py --input data/raw/synthetic_data.csv --output data/results/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: analysis-results-${{ matrix.python-version }}
        path: |
          data/results/
          data/processed/
          data/metadata/
          logs/
        retention-days: 5

# Resource limits enforced by GitHub Actions runners (2 cores, 7GB RAM for ubuntu-latest)
# If specific stricter limits are needed, they would be configured in the runner environment
# or via self-hosted runners with specific hardware profiles.