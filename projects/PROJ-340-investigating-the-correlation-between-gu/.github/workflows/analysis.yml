name: Analysis Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Synthetic Data (Validation Mode)
      run: |
        python code/generate_synthetic_data.py --output data/raw/synthetic_test_data.csv

    - name: Run Pipeline
      run: |
        python code/main.py \
          --input data/raw/synthetic_test_data.csv \
          --output data/results/ \
          --allow-synthetic-fallback

    - name: Verify Artifacts
      run: |
        python scripts/verify_integrity.py
        python scripts/final_validation.py
        python scripts/review_power_sensitivity.py

    - name: Upload Results
      uses: actions/upload-artifact@v3
      with:
        name: analysis-results
        path: |
          data/results/
          data/processed/
          data/metadata/
