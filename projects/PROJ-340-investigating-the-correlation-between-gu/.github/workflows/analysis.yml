name: Analysis Pipeline & Citation Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  reference-validation:
    name: Reference Validator Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Reference Validator Gate
        id: validator
        run: |
          python code/reference_validator.py --project-root .
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: false

      - name: Check Gate Result
        if: steps.validator.outputs.exit_code != '0'
        run: |
          echo "ERROR: Reference Validator Gate Failed. Citation verification failed or missing."
          exit 1

  analysis-pipeline:
    name: Run Analysis Pipeline
    runs-on: ubuntu-latest
    needs: reference-validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core dependencies from requirements.txt if it exists
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas scipy numpy scikit-learn pyyaml
          fi

      - name: Run Main Pipeline
        run: |
          python code/main.py --project-root .

      - name: Verify Outputs
        run: |
          if [ ! -f data/results/correlation_matrix.json ]; then
            echo "ERROR: Expected output data/results/correlation_matrix.json not found."
            exit 1
          fi
          echo "Pipeline completed successfully with required outputs."
