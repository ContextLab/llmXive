$schema: "http://json-schema.org/draft-07/schema#"
title: "MicrobiomeSleepDatasetSchema"
description: "Schema for input dataset containing microbiome counts and sleep metrics."
type: object
properties:
  metadata:
    type: object
    properties:
      source:
        type: string
        description: "Source of the dataset (e.g., 'synthetic', 'real')."
      created_at:
        type: string
        format: date-time
      checksum:
        type: string
        description: "SHA256 checksum of the raw file."
  columns:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          description: "Column name in the CSV."
        type:
          type: string
          enum: ["integer", "float", "string"]
        required:
          type: boolean
          description: "Whether this column is required for analysis."
      required: ["name", "type", "required"]
  data:
    type: array
    items:
      type: object
      additionalProperties: true
      description: "Rows of data. Specific keys depend on the 'columns' definition."
required: ["metadata", "columns", "data"]
additionalProperties: false