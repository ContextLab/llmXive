$schema: http://json-schema.org/draft-07/schema#
title: Synthetic Data Manifest Schema
description: |
  Defines the schema for data lineage tracking to satisfy Constitution Principle I (Reproducibility).
  Supports two versions:
    - schema_v1_synthetic: For pipeline validation studies (synthetic data). Chain of custody is optional (nullable).
    - schema_v2_real: For real biological data. Chain of custody log is REQUIRED.
type: object
required:
  - schema_version
  - generated_at
  - generator_script_checksum
properties:
  schema_version:
    type: string
    enum:
      - schema_v1_synthetic
      - schema_v2_real
    description: Identifies the schema version to enforce specific validation rules.
  generated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of generation.
  generator_script_checksum:
    type: string
    pattern: '^[a-f0-9]{64}$'
    description: SHA-256 checksum of the exact script used to generate the data (e.g., code/data_generator.py).
  dataset_type:
    type: string
    enum:
      - synthetic
      - real
    description: Explicit classification of the data source.
  chain_of_custody_log:
    type:
      - "null"
      - array
    items:
      type: object
      required:
        - timestamp
        - actor
        - action
        - details
      properties:
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
          description: User or system identifier performing the action.
        action:
          type: string
          description: Action taken (e.g., 'downloaded', 'preprocessed', 'filtered').
        details:
          type: string
          description: Specific details of the action.
    description: |
      Log of data handling steps.
      - For schema_v1_synthetic: This field MUST be null.
      - For schema_v2_real: This field MUST be a non-empty array.
  parameters_used:
    type: object
    description: Key hyperparameters or random seeds used during generation/fetching.
  notes:
    type: string
    description: Optional human-readable notes about the dataset.

# Conditional validation logic description (enforced by code in data_generator.py):
# IF schema_version == 'schema_v1_synthetic':
#   - chain_of_custody_log MUST be null
#   - dataset_type MUST be 'synthetic'
# IF schema_version == 'schema_v2_real':
#   - chain_of_custody_log MUST NOT be null and MUST have at least one entry
#   - dataset_type MUST be 'real'
