# Output Schema for Gut Microbiome - Sleep Architecture Correlation Analysis
# Defines the structure of the CorrelationResult objects and the aggregate output file.
# This schema is used by T018 (Contract Test) and T025 (FDR Correction Output).

$schema: "http://json-schema.org/draft-07/schema#"
title: "CorrelationResult"
description: "Schema for a single correlation result between a taxon and a sleep metric."

definitions:
  CorrelationResult:
    type: object
    required:
      - taxon
      - sleep_metric
      - correlation_coefficient
      - p_value_raw
      - p_value_adjusted
      - is_significant
      - method_used
      - direction
      - effect_size_category
    properties:
      taxon:
        type: string
        description: "Name of the gut microbiome taxon (predictor)."
      sleep_metric:
        type: string
        description: "Name of the sleep architecture metric (outcome)."
      correlation_coefficient:
        type: number
        description: "The calculated correlation coefficient (Pearson, Spearman, or ZINB beta)."
      p_value_raw:
        type: number
        description: "The unadjusted p-value for the correlation test."
      p_value_adjusted:
        type: number
        description: "The Benjamini-Hochberg adjusted p-value (q-value)."
      is_significant:
        type: boolean
        description: "True if p_value_adjusted <= 0.05, False otherwise."
      method_used:
        type: string
        enum:
          - "Pearson"
          - "Spearman"
          - "ZINB"
          - "Hurdle"
        description: "The statistical method used for this specific pair."
      effect_size_category:
        type: string
        enum:
          - "negligible"
          - "weak"
          - "moderate"
          - "strong"
        description: "Categorization of the absolute correlation coefficient."
      direction:
        type: string
        enum:
          - "positive"
          - "negative"
        description: "Direction of the relationship based on the sign of the coefficient."

  CorrelationMatrixOutput:
    type: object
    required:
      - metadata
      - results
    properties:
      metadata:
        type: object
        required:
          - generated_at
          - total_pairs_tested
          - significant_pairs_count
          - method_distribution
          - fdr_threshold
        properties:
          generated_at:
            type: string
            format: date-time
            description: "ISO 8601 timestamp of generation."
          total_pairs_tested:
            type: integer
            minimum: 0
            description: "Total number of (taxon, metric) pairs analyzed."
          significant_pairs_count:
            type: integer
            minimum: 0
            description: "Count of pairs where is_significant is true."
          method_distribution:
            type: object
            description: "Count of pairs analyzed by each method."
            additionalProperties:
              type: integer
          fdr_threshold:
            type: number
            description: "The FDR threshold used (default 0.05)."
      results:
        type: array
        description: "List of CorrelationResult objects."
        items:
          $ref: "#/definitions/CorrelationResult"

# The primary output file `data/results/correlation_matrix.json` must conform to CorrelationMatrixOutput.
allOf:
  - $ref: "#/definitions/CorrelationMatrixOutput"