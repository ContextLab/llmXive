[metadata]
name = llmxive
version = 0.1.0
description = Automated Science Pipeline for Audio Compression Robustness
author = llmXive Team
author_email = team@llmxive.org
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.11
install_requires =
    torch
    torchaudio
    scikit-learn
    datasets
    pandas
    matplotlib
    numpy
    ruff
    black

[options.packages.find]
where = .

[ruff]
# Explicitly point to the ruff.toml file if needed, though ruff auto-discovers
config = ruff.toml

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''