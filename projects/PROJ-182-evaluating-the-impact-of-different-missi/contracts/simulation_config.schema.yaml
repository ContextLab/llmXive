$schema: "http://json-schema.org/draft-07/schema#"
title: "Simulation Configuration"
description: "Schema for the simulation configuration used to generate RD data."
type: object
properties:
  sample_size:
    type: integer
    description: "Number of observations to generate."
    minimum: 1
  true_effect:
    type: number
    description: "The true treatment effect (tau) used in data generation."
  seed:
    type: integer
    description: "Random seed for reproducibility."
  beta0:
    type: number
    description: "Intercept term."
    default: 0.0
  beta1:
    type: number
    description: "Slope for running variable X."
    default: 1.0
  beta2:
    type: number
    description: "Coefficient for exclusion restriction Z."
    default: 0.5
  sigma:
    type: number
    description: "Standard deviation of the error term."
    default: 1.0
  exclusion_restriction:
    type: number
    description: "Value for the exclusion restriction parameter (Z*)."
    default: 0.0
required:
  - sample_size
  - true_effect
  - seed
