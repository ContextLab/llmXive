$schema: "http://json-schema.org/draft-07/schema#"
title: "Estimation Result"
description: "Schema for the result of a single RD estimation run."
type: object
properties:
  mechanism:
    type: string
    description: "The missingness mechanism applied (MCAR, MAR, MNAR)."
  rate:
    type: number
    description: "The missingness rate used."
  estimator:
    type: string
    description: "The estimator used (Naive, MI, IPW, Selection)."
  estimate:
    type: number
    description: "The point estimate of the treatment effect."
  se:
    type: number
    description: "The standard error of the estimate."
  ci_lower:
    type: number
    description: "Lower bound of the confidence interval."
  ci_upper:
    type: number
    description: "Upper bound of the confidence interval."
  converged:
    type: boolean
    description: "Whether the estimation algorithm converged."
  bandwidth:
    type: number
    description: "Bandwidth used for local linear regression (if applicable)."
required:
  - mechanism
  - rate
  - estimator
  - estimate
  - se
  - ci_lower
  - ci_upper
  - converged
