$schema: "http://json-schema.org/draft-07/schema#"
title: "Aggregated Metric"
description: "Schema for aggregated Monte-Carlo simulation metrics."
type: object
properties:
  mechanism:
    type: string
    description: "The missingness mechanism."
  rate:
    type: number
    description: "The missingness rate."
  estimator:
    type: string
    description: "The estimator name."
  bias:
    type: number
    description: "Mean difference between estimate and true effect."
  rmse:
    type: number
    description: "Root Mean Squared Error."
  coverage:
    type: number
    description: "Proportion of confidence intervals containing the true effect."
  n_replications:
    type: integer
    description: "Number of replications used for aggregation."
required:
  - mechanism
  - rate
  - estimator
  - bias
  - rmse
  - coverage
  - n_replications