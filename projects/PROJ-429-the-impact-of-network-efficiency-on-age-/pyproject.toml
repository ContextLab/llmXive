[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-network-efficiency"
version = "0.1.0"
description = "Impact of Network Efficiency on Age-Related Changes in Resting-State EEG"
requires-python = ">=3.11"
dependencies = [
    "mne>=1.6.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "networkx>=3.1.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
# Inherits from .ruff.toml or defines here if preferred
line-length = 88
target-version = "py311"
