[project]
name = "llmxive-network-efficiency-aging"
version = "0.1.0"
description = "Impact of Network Efficiency on Age-Related Changes in Resting-State EEG"
requires-python = ">=3.11"

[tool.ruff]
# Target Python version
target-version = "py311"

# Line length for linting
line-length = 88

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "data",
    "state",
    "docs",
    "build",
    "dist",
]

# Select rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

# Ignore specific rules if needed
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in dataclasses)
]

[tool.ruff.isort]
known-first-party = ["code"]
force-sort-within-sections = true

[tool.black]
# Line length for formatting
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | __pycache__
    | data
    | state
    | docs
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
