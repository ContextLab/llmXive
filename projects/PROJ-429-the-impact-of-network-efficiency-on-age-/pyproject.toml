[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-network-efficiency"
version = "0.1.0"
description = "Impact of Network Efficiency on Age-Related Changes in Resting-State EEG"
requires-python = ">=3.11"
dependencies = [
    "mne>=1.0",
    "networkx>=3.0",
    "scipy>=1.9",
    "pandas>=1.5",
    "statsmodels>=0.13",
    "pywavelets>=1.3",
    "numpy>=1.23",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
