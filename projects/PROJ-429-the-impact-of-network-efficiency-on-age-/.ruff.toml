# Ruff configuration for llmXive project
# This file extends/overrides pyproject.toml if needed, but primarily
# serves as the explicit configuration file for ruff linter and formatter.

# Same as [tool.ruff] in pyproject.toml for consistency
line-length = 88
target-version = "py311"

select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

exclude = [
    ".git",
    ".venv",
    "data",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
]

[isort]
known-first-party = ["config", "data", "network", "stats", "viz", "state"]
force-sort-within-sections = true

[flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"