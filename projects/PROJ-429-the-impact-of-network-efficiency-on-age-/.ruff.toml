# Linting configuration for llmXive project
# Uses Ruff as a fast drop-in replacement for Flake8 and other linters

line-length = 100
target-version = "py311"

[lint]
# Enable all rules except those explicitly ignored
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501", # line-too-long (handled by formatter)
    "B008", # do-not-perform-argument-default-in-function-definition (needed for MNE defaults)
    "SIM105", # use-contextlib-suppress (optional stylistic choice)
]

# Per-file ignores
[lint.per-file-ignores]
"code/setup_structure.py" = ["ARG"] # setup scripts often have unused args in helpers
"code/tools/lint_format.py" = ["ARG"] # CLI tools often have unused args

[lint.isort]
known-first-party = ["config", "data", "network", "stats", "viz", "tools", "state", "inject_trace_id"]
force-sort-within-sections = true
lines-after-imports = 2
