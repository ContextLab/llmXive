$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Results Schema"
description: "Schema for the output CSV: data/results/correlation_results.csv"
type: "object"
properties:
  metric_name:
    type: "string"
    description: "Name of the network metric (e.g., global_efficiency)."
  outcome:
    type: "string"
    description: "Outcome variable being correlated with."
    enum: ["age", "cognitive_score"]
  correlation_r:
    type: "number"
    description: "Spearman or Partial correlation coefficient."
  p_value:
    type: "number"
    description: "Raw p-value from the hypothesis test."
  p_adjusted:
    type: "number"
    description: "FDR or Bonferroni corrected p-value."
  method:
    type: "string"
    description: "Statistical method used."
    enum: ["Spearman", "Partial"]
  n_samples:
    type: "integer"
    description: "Number of samples used in the correlation."
  trace_id:
    type: "string"
    description: "SHA-256 hash of the run artifact."
    pattern: "^[a-f0-9]{64}$"
required:
  - metric_name
  - outcome
  - correlation_r
  - p_value
  - p_adjusted
  - method
  - n_samples
  - trace_id
additionalProperties: false