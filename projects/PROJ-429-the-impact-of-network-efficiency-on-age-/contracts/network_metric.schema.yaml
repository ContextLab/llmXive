$schema: http://json-schema.org/draft-07/schema#
title: Network Metrics Schema
description: |
  Schema for data/results/network_metrics.csv containing graph-theoretical
  network efficiency metrics derived from resting-state EEG connectivity.
type: object
required:
  - participant_id
  - age
  - global_efficiency
  - local_efficiency
  - clustering_coeff
  - modularity
  - trace_id
  - signal_quality_flag
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant
    minLength: 1
  age:
    type: integer
    description: Age of the participant in years
    minimum: 18
  global_efficiency:
    type: number
    description: Global efficiency of the network (1 / characteristic path length)
    minimum: 0
    maximum: 1
  local_efficiency:
    type: number
    description: Local efficiency of the network (mean of local efficiencies of nodes)
    minimum: 0
    maximum: 1
  clustering_coeff:
    type: number
    description: Average clustering coefficient of the network
    minimum: 0
    maximum: 1
  modularity:
    type: number
    description: Modularity of the network community structure
    minimum: 0
    maximum: 1
  trace_id:
    type: string
    description: SHA-256 hash of source data and code versions for reproducibility
    pattern: "^[a-f0-9]{64}$"
  signal_quality_flag:
    type: string
    description: Flag indicating the quality of the EEG signal
    enum:
      - OK
      - Low Signal Quality
additionalProperties: false