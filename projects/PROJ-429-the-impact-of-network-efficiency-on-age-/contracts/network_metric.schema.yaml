$schema: http://json-schema.org/draft-07/schema#
title: Network Metrics Schema
description: Schema for data/results/network_metrics.csv generated by the network efficiency analysis pipeline.
type: object
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant.
  age:
    type: integer
    description: Age of the participant in years.
  global_efficiency:
    type: number
    format: float
    description: Global efficiency of the functional network (1.0 / characteristic path length).
  local_efficiency:
    type: number
    format: float
    description: Local efficiency of the functional network (mean of local efficiencies of all nodes).
  clustering_coeff:
    type: number
    format: float
    description: Average clustering coefficient of the network.
  modularity:
    type: number
    format: float
    description: Modularity score of the network partition.
  trace_id:
    type: string
    pattern: "^[a-f0-9]{64}$"
    description: SHA-256 hash of the source code and data used to generate this record.
  signal_quality_flag:
    type: string
    enum:
      - "OK"
      - "Low Signal Quality"
    description: Flag indicating the signal quality based on SNR thresholds.
required:
  - participant_id
  - age
  - global_efficiency
  - local_efficiency
  - clustering_coeff
  - modularity
  - trace_id
  - signal_quality_flag
additionalProperties: false
csv_columns:
  - participant_id
  - age
  - global_efficiency
  - local_efficiency
  - clustering_coeff
  - modularity
  - trace_id
  - signal_quality_flag