$schema: http://json-schema.org/draft-07/schema#
title: Network Metric Result Schema
description: Schema for validating the output of network metric calculations (network_metrics.csv).
type: object
required:
  - participant_id
  - age
  - global_efficiency
  - characteristic_path_length
  - local_efficiency
  - clustering_coefficient
  - modularity
  - signal_quality_flag
  - trace_id
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant.
  age:
    type: integer
    description: Age of the participant in years.
  global_efficiency:
    type: number
    format: float
    description: Global efficiency of the network (1.0 / characteristic_path_length).
  characteristic_path_length:
    type: number
    format: float
    description: Average shortest path length in the network.
  local_efficiency:
    type: number
    format: float
    description: Local efficiency calculated via subgraph path lengths.
  clustering_coefficient:
    type: number
    format: float
    description: Average clustering coefficient of the network.
  modularity:
    type: number
    format: float
    description: Modularity score of the network.
  signal_quality_flag:
    type: string
    enum:
      - Good Signal Quality
      - Low Signal Quality
    description: Flag indicating signal quality based on SNR threshold (10dB).
  trace_id:
    type: string
    pattern: "^[a-f0-9]{64}$"
    description: SHA-256 hash of source code and data for reproducibility.
additionalProperties: false
