# Schema for regression_results.csv
# Generated for task T042c: Define schema for regression analysis outputs
# This schema validates the output of code/stats/regression.py and code/stats/regression_table.py
type: object
properties:
  outcome:
    type: string
    description: The dependent variable name (e.g., 'cognitive_score', 'global_efficiency')
    minLength: 1
  predictor:
    type: string
    description: The independent variable name (e.g., 'age', 'sex', 'education', 'global_efficiency')
    minLength: 1
  coef:
    type: number
    description: The regression coefficient (beta weight)
    format: float
  std_err:
    type: number
    description: The standard error of the coefficient
    format: float
    minimum: 0
  t_value:
    type: number
    description: The t-statistic for the coefficient (coef / std_err)
    format: float
  p_value:
    type: number
    description: The two-tailed p-value for the t-statistic
    format: float
    minimum: 0
    maximum: 1
  trace_id:
    type: string
    description: SHA-256 hash of the source code and data used to generate this result
    pattern: '^[a-f0-9]{64}$'
required:
  - outcome
  - predictor
  - coef
  - std_err
  - t_value
  - p_value
  - trace_id
additionalProperties: false
description: |
  This schema defines the structure of the regression results CSV file.
  Each row represents a single predictor variable within a specific regression model.
  The file is generated by code/stats/regression.py and validated by code/stats/regression_summary.py.