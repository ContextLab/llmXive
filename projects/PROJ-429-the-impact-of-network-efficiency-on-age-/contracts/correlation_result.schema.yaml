$schema: http://json-schema.org/draft-07/schema#
title: Correlation Result Schema
description: Schema for data/results/correlation_results.csv containing Spearman correlation results between network metrics and age/cognitive outcomes.
type: object
required:
  - metric_name
  - outcome
  - spearman_r
  - p_value
  - p_adjusted
  - n
  - trace_id
properties:
  metric_name:
    type: string
    description: Name of the network metric being correlated (e.g., 'global_efficiency', 'local_efficiency').
    minLength: 1
  outcome:
    type: string
    description: The outcome variable used in the correlation (e.g., 'age', 'cognitive_score').
    minLength: 1
  spearman_r:
    type: number
    description: Spearman rank correlation coefficient.
    minimum: -1.0
    maximum: 1.0
  p_value:
    type: number
    description: Raw p-value from the Spearman correlation test.
    minimum: 0.0
    maximum: 1.0
  p_adjusted:
    type: number
    description: P-value after multiple-comparison correction (Bonferroni or FDR).
    minimum: 0.0
    maximum: 1.0
  n:
    type: integer
    description: Number of observations used in the correlation.
    minimum: 2
  trace_id:
    type: string
    description: SHA-256 hex string tracing the source data and code version.
    pattern: '^[a-f0-9]{64}$'
additionalProperties: false
