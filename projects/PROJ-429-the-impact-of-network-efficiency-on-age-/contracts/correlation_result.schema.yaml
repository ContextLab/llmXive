$schema: http://json-schema.org/draft-07/schema#
title: Correlation Result Schema
description: Schema for data/results/correlation_results.csv generated by T023_run
type: object
properties:
  metric_name:
    type: string
    description: Name of the network metric (e.g., global_efficiency, local_efficiency)
  outcome:
    type: string
    description: The outcome variable correlated with (e.g., age, moca_score, mmse_score)
  spearman_r:
    type: number
    description: Spearman rank correlation coefficient
  p_value:
    type: number
    description: Raw p-value from the correlation test
  p_adjusted:
    type: number
    description: P-value after multiple-comparison correction (Bonferroni or FDR)
  n:
    type: integer
    description: Number of samples used in the correlation
  trace_id:
    type: string
    description: SHA-256 hash tracing the data and code version used to generate this result
    pattern: "^[a-f0-9]{64}$"
required:
  - metric_name
  - outcome
  - spearman_r
  - p_value
  - p_adjusted
  - n
  - trace_id
additionalProperties: false
