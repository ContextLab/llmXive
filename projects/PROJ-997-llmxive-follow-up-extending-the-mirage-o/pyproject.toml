[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "Extending 'The Mirage of Optimizing Training Policies'"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.30.0",
    "llama-cpp-python>=0.2.0",
    "scikit-learn>=1.3.0",
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "pytest>=7.0.0",
    "einops>=0.6.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "tests*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
# Ruff configuration is in .ruff.toml to keep pyproject.toml focused on build/package config
# This file serves as the primary entry point for Black and project metadata