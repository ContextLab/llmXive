[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evolutionary-pressure-on-alternative-spl"
version = "0.1.0"
description = "Analysis of evolutionary pressure on alternative splicing in primates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "biopython>=1.81",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "pybedtools>=0.8.1",
    "pyBigWig>=0.3.18",
    "scikit-learn>=1.3.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "flake8>=6.1.0",
    "black>=23.7.0",
    "pre-commit>=3.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "data",
]
