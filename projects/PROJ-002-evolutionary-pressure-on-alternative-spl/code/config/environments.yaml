# Environment configuration for PROJ-002
# Defines runtime parameters for CI (Sampled) vs Full (HPC) execution modes.
#
# Usage:
#   export PROJ_ENV=ci  # or 'full'
#   python -m code.pipeline.main --config config/environments.yaml
#
# The pipeline reads this file to determine data volume, parallelism limits,
# and retention policies.

ci:
  mode: "sampled"
  description: "CI/CD execution using minimal real data samples to verify logic."
  constraints:
    max_replicates: 1
    min_replicates: 1
    max_alignments: 2
    max_psi_calculations: 2
    max_events_detected: 100
    max_phylop_queries: 50
    max_permutations: 100
    timeout_seconds: 600
    memory_limit_gb: 4
    disk_limit_gb: 10
  data_sources:
    human:
      sra_accession: "SRP010775"
      sample_subset: 1
    chimp:
      sra_accession: "SRP009050"
      sample_subset: 1
    macaque:
      sra_accession: "SRP009051"
      sample_subset: 1
    marmoset:
      sra_accession: "SRP009052"
      sample_subset: 1
  tools:
    star:
      threads: 2
      limit: "low"
    suppa:
      threads: 2
    r_stats:
      threads: 1
  retention:
    fastq: true
    bam: false
    psi: true
    log: true
    manifest: true
  logging:
    level: "DEBUG"
    file: "data/pipeline_ci.log"

full:
  mode: "full"
  description: "HPC execution using complete datasets for production analysis."
  constraints:
    max_replicates: 10
    min_replicates: 3
    max_alignments: 0  # 0 means unlimited
    max_psi_calculations: 0
    max_events_detected: 0
    max_phylop_queries: 0
    max_permutations: 1000
    timeout_seconds: 0
    memory_limit_gb: 64
    disk_limit_gb: 500
  data_sources:
    human:
      sra_accession: "SRP010775"
      sample_subset: 0
    chimp:
      sra_accession: "SRP009050"
      sample_subset: 0
    macaque:
      sra_accession: "SRP009051"
      sample_subset: 0
    marmoset:
      sra_accession: "SRP009052"
      sample_subset: 0
  tools:
    star:
      threads: 16
      limit: "high"
    suppa:
      threads: 8
    r_stats:
      threads: 4
  retention:
    fastq: false
    bam: true
    psi: true
    log: true
    manifest: true
  logging:
    level: "INFO"
    file: "data/pipeline_full.log"

