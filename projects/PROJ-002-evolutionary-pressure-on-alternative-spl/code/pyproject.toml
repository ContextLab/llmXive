[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evolutionary-pressure-analysis"
version = "0.1.0"
description = "Analysis of evolutionary pressure on alternative splicing in primates"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "biopython>=1.80",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "pybedtools>=0.9.0",
    "pyBigWig>=0.3.0",
    "scikit-learn>=1.2.0",
    "loguru>=0.7.0",
    # Linting and formatting tools
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.0.0",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | results
    | docs
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["data_models", "pipeline", "utils", "tests"]
skip = [".git", ".venv", "venv", "data", "results", "docs", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
