[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-002-evolutionary-pressure"
version = "0.1.0"
description = "Evolutionary Pressure on Alternative Splicing in Primates"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "biopython>=1.81",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "pybedtools>=0.8.1",
    "pyBigWig>=0.3.17",
    "scikit-learn>=1.3.0",
    "loguru>=0.7.0",
    # Linting and formatting
    "flake8>=6.1.0",
    "black>=23.7.0",
    "pre-commit>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
