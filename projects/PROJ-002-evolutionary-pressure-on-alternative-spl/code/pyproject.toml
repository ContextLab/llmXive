[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primate-splicing-pipeline"
version = "0.1.0"
description = "Evolutionary pressure on alternative splicing in primates"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyyaml",
    "biopython",
    "requests",
    "tqdm",
    "pybedtools",
    "pyBigWig",
    "scikit-learn",
    "loguru",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "black",
    "isort",
    "pytest",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["code"]
force_sort_within_sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
