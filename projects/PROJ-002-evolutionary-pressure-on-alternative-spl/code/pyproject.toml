[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primate-splicing-analysis"
version = "0.1.0"
description = "Evolutionary Pressure on Alternative Splicing in Primates"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyyaml",
    "biopython",
    "requests",
    "tqdm",
    "pybedtools",
    "pyBigWig",
    "scikit-learn",
    "loguru",
    "phylolm",
    "ape",
    "data.table",
    "pytest",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | venv
    | .eggs
    | *.egg-info
    | data
    | figures
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["code", "data_models", "pipeline", "utils"]
known_third_party = [
    "pandas",
    "numpy",
    "pyyaml",
    "biopython",
    "requests",
    "tqdm",
    "pybedtools",
    "pyBigWig",
    "scikit-learn",
    "loguru",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
