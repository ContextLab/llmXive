[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evolutionary-pressure-on-alternative-spl"
version = "0.1.0"
description = "Pipeline for analyzing evolutionary pressure on alternative splicing in primates"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "biopython>=1.81",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "pybedtools>=0.9.0",
    "pyBigWig>=0.3.0",
    "scikit-learn>=1.3.0",
    "loguru>=0.7.0",
    # Linting and formatting tools
    "flake8>=6.1.0",
    "black>=23.12.1",
    "pre-commit>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | \.eggs
)/
'''

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["code"]
