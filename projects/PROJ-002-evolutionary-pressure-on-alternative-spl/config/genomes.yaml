# Global configuration
defaults:
  min_replicates: 3
  max_replicates: 5
  psi_threshold: 0.1
  fdr_threshold: 0.05
  flank_size_bp: 500
  phyloP_track_base: "phyloP100way"
  tree_file: "data/references/primate_tree.nwk"

# Lineage definitions for differential analysis
lineages:
  human_specific:
    name: "Human"
    target: "human"
    outgroups:
      - "chimp"
      - "macaque"
      - "marmoset"
  chimp_specific:
    name: "Chimpanzee"
    target: "chimp"
    outgroups:
      - "human"
      - "macaque"
      - "marmoset"
  macaque_specific:
    name: "Rhesus Macaque"
    target: "macaque"
    outgroups:
      - "human"
      - "chimp"
      - "marmoset"
  marmoset_specific:
    name: "Marmoset"
    target: "marmoset"
    outgroups:
      - "human"
      - "chimp"
      - "macaque"