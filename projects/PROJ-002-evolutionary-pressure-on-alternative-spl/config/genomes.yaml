# Genome Assembly Configuration for PROJ-002
# Defines reference assemblies and associated metadata for:
# Human (GRCh38), Chimpanzee (panTro6), Rhesus Macaque (rheMac10), Marmoset (calJac4)
#
# This file is consumed by the pipeline to resolve reference paths,
# chromosome naming conventions, and annotation sources.

assemblies:
  human:
    species: "Homo sapiens"
    assembly: "GRCh38"
    assembly_id: "GRCh38.p14"
    chromosomes:
      - "chr1"
      - "chr2"
      - "chr3"
      - "chr4"
      - "chr5"
      - "chr6"
      - "chr7"
      - "chr8"
      - "chr9"
      - "chr10"
      - "chr11"
      - "chr12"
      - "chr13"
      - "chr14"
      - "chr15"
      - "chr16"
      - "chr17"
      - "chr18"
      - "chr19"
      - "chr20"
      - "chr21"
      - "chr22"
      - "chrX"
      - "chrY"
      - "chrM"
    paths:
      fasta: "data/references/GRCh38.fa"
      gtf: "data/references/GRCh38.gtf"
      star_index: "data/references/GRCh38_star_index"
      bigwig: "data/references/GRCh38.bw"
    sra_accession: "SRP010775"
    phyloP_track: "phyloP100way.hg38.bw"

  chimp:
    species: "Pan troglodytes"
