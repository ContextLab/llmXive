  h: 4a500c663776a16d069b98ecfe58592530900b9238709c18771baa7d67ea0407
  r: "The `code/resampling.py` implementation does not match the required API (it\
    \ takes a factor, not a target resolution in meters, and returns a string instead\
    \ of a `Path`), never enforces \u22642000\u202F\xD7\u202F2000\u2011pixel windowed\
    \ processing, and provides no logic to create the four specific files `data/derived/nlcd_{60,120,240,480}m_co.tif`\
    \ or to skip out\u2011of\u2011bounds resolutions with a warning. Moreover, the\
    \ required source raster `data/raw/nlcd_30m_co.tif` is missing. These gaps prevent\
    \ the task from being genuinely completed."
  sig: 554e13f6a40283363666243658f555aa57976a50de79870afaedb7a6453e4865
