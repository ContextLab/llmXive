  r: "The `code/calibration.py` does not perform the required Moran\u2019s\u202FI\u2011\
    based \u03BB calibration, nor does it write the mandated `data/results/calibration.json`\
    \ with the keys `lambda`, `sample_size`, `observed_morans_i`, `simulated_morans_i`,\
    \ and `fit_error_pct`. The integration test fails because the code uses `np.erf`,\
    \ which does not exist, causing a runtime error, and the produced JSON lacks the\
    \ required fields and error metric. The required output file is missing entirely."
