  r: "The unit test `tests/unit/test_data_loader.py` fails with a `FileNotFoundError`\
    \ because it looks for the script at `tests/code/01_ingest_and_filter.py` instead\
    \ of the actual location `code/01_ingest_and_filter.py`; consequently the test\
    \ never reaches the intended `DataFetchError` assertion. This means the required\
    \ verification that a simulated fetch failure raises `DataFetchError` is not satisfied.\
    \ Fix the test\u2019s path (or adjust the import logic) so it correctly loads\
    \ the script and the test can pass."
