[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-salience-moral-judgments"
version = "0.1.0"
description = "Research pipeline for studying visual salience effects on moral judgments"
authors = [
    {name = "Research Team"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "statsmodels>=0.12.0",
    "Pillow>=8.0.0",
    "requests>=2.25.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "opencv-python-headless>=4.5.0",
    "streamlit>=1.10.0",
    "torch>=1.9.0",
    "transformers>=4.10.0",
    "diffusers>=0.1.0",
    "ordinal>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=22.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0"
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in init files

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=code",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]
