[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-visual-salience"
version = "0.1.0"
description = "The Influence of Visual Salience on Moral Judgments of Simulated Scenarios"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "Pillow",
    "requests",
    "matplotlib",
    "seaborn",
    "opencv-python-headless",
    "streamlit",
    "torch",
    "transformers",
    "diffusers",
    "ordinal",
]
optional-dependencies.dev = [
    "ruff",
    "black",
    "pytest",
    "pytest-cov",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]  # assert statements allowed in tests

[tool.ruff.isort]
known-first-party = ["code"]
force-sort-within-sections = true
