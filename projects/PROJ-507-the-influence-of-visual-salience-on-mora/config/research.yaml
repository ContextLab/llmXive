# Research Configuration Parameters
# This file stores configurable parameters for the research pipeline.

# Data Settings
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  survey_dir: "data/survey"
  synth_dir: "data/synth"

# Analysis Settings
analysis:
  clmm:
    formula: "rating ~ salience + (1|participant_id) + (1|scenario_id)"
    link: "logit"
  precision:
    min_width: 0.1
    level: 0.95

# Reproducibility
seed: 42

# Linting Configuration (Reference)
linting:
  line_length: 100
  target_version: "py310"