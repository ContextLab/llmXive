$schema: "http://json-schema.org/draft-07/schema#"
title: "Response Schema"
type: "object"
properties:
  response_id:
    type: "string"
    description: "Unique identifier for the response"
  participant_id:
    type: "string"
    description: "Anonymized participant identifier"
  variant_id:
    type: "string"
    description: "Foreign key to the stimulus variant"
  blame_rating:
    type: "integer"
    minimum: 1
    maximum: 7
    description: "Blame rating on 1-7 Likert scale"
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of response"
  valid:
    type: "boolean"
    description: "Whether the response passed data cleaning"
required:
  - response_id
  - participant_id
  - variant_id
  - blame_rating
  - timestamp
  - valid
additionalProperties: false