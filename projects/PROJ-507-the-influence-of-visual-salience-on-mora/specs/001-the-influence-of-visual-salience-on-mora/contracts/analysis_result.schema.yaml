$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Result Schema"
description: "Schema for the output of the Cumulative Link Mixed Model (CLMM)."
type: "object"
properties:
  analysis_id:
    type: "string"
    description: "Unique identifier for the analysis run."
  model_type:
    type: "string"
    enum:
      - "Cumulative_Link_Mixed_Model"
    description: "Type of statistical model used."
  fixed_effects:
    type: "object"
    description: "Fixed effect coefficients (log-odds)."
    additionalProperties:
      type: "number"
  random_effects_variance:
    type: "object"
    description: "Random effect variances."
    additionalProperties:
      type: "number"
  p_value:
    type: "number"
    description: "Raw p-value for the main effect of salience."
    minimum: 0
    maximum: 1
  p_value_corrected:
    type: "number"
    description: "Bonferroni-corrected p-value."
    minimum: 0
    maximum: 1
  effect_size:
    type: "object"
    description: "Odds ratios and confidence intervals."
    properties:
      odds_ratio:
        type: "number"
      ci_lower:
        type: "number"
      ci_upper:
        type: "number"
  convergence_status:
    type: "string"
    enum:
      - "converged"
      - "warning"
      - "failed"
    description: "Convergence status of the model."
required:
  - "analysis_id"
  - "model_type"
  - "fixed_effects"
  - "random_effects_variance"
  - "p_value"
  - "p_value_corrected"
  - "effect_size"
  - "convergence_status"
additionalProperties: false