$schema: "http://json-schema.org/draft-07/schema#"
title: "Stimulus Variant Schema"
type: "object"
properties:
  variant_id:
    type: "string"
    description: "Unique identifier for the stimulus variant"
  scenario_id:
    type: "string"
    description: "Foreign key to the parent scenario"
  salience_level:
    type: "string"
    enum:
      - "low"
      - "medium"
      - "high"
    description: "Salience level of the variant"
  manipulation_params:
    type: "object"
    properties:
      contrast_adjustment:
        type: "number"
        description: "Luminance contrast adjustment value"
      brightness_adjustment:
        type: "number"
        description: "Brightness adjustment value"
      version:
        type: "string"
        description: "Version of the manipulation parameters (e.g., 'v1.0')"
    required:
      - contrast_adjustment
      - brightness_adjustment
      - version
  clip_similarity:
    type: "number"
    minimum: 0.95
    description: "Cosine similarity to original image (must be ≥0.95)"
  rms_contrast_change:
    type: "number"
    minimum: 15.0
    description: "Percentage change in RMS contrast in ROI (must be ≥15%)"
  moral_intent_preservation_score:
    type: "number"
    minimum: 0.90
    description: "Correlation between pre- and post-manipulation moral intent scores (must be ≥0.90)"
  semantic_integrity:
    type: "string"
    enum:
      - "passed"
      - "failed"
    description: "Status of semantic integrity check"
  image_path:
    type: "string"
    description: "Path to the manipulated image file"
required:
  - variant_id
  - scenario_id
  - salience_level
  - manipulation_params
  - clip_similarity
  - rms_contrast_change
  - moral_intent_preservation_score
  - semantic_integrity
  - image_path
additionalProperties: false