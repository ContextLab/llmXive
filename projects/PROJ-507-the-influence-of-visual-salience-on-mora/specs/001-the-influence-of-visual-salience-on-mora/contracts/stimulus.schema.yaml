$schema: "http://json-schema.org/draft-07/schema#"
title: "Stimulus Variant Schema"
description: "Schema for each visual stimulus variant with salience manipulation"
type: "object"
properties:
  variant_id:
    type: "string"
    description: "Unique identifier for the stimulus variant"
  scenario_id:
    type: "string"
    description: "Foreign key linking to the scenario"
  salience_level:
    type: "string"
    enum: ["low", "medium", "high"]
    description: "Salience level applied"
  manipulation_params:
    type: "object"
    description: "Parameters used for contrast/brightness adjustment"
    properties:
      contrast_adjustment:
        type: "number"
        description: "Contrast scaling factor"
      brightness_adjustment:
        type: "number"
        description: "Brightness offset"
      version:
        type: "string"
        description: "Version tag for reproducibility"
    required: ["contrast_adjustment", "brightness_adjustment", "version"]
    additionalProperties: false
  clip_similarity:
    type: "number"
    minimum: 0.95
    description: "CLIP cosine similarity to original (≥ 0.95 required)"
  rms_contrast_change:
    type: "number"
    minimum: 15
    description: "RMS contrast change percentage (≥ 15 %)"
  moral_intent_preservation_score:
    type: "number"
    minimum: 0.90
    description: "BERT‑based moral‑intent similarity score (≥ 0.90 required)"
  semantic_integrity:
    type: "string"
    enum: ["passed", "failed"]
    description: "Result of semantic similarity check"
  image_path:
    type: "string"
    description: "Filesystem path to the manipulated image"
required:
  - variant_id
  - scenario_id
  - salience_level
  - manipulation_params
  - clip_similarity
  - rms_contrast_change
  - moral_intent_preservation_score
  - semantic_integrity
  - image_path
additionalProperties: false