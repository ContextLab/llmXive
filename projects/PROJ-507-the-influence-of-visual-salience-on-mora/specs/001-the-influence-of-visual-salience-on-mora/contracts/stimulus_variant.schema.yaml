$schema: "http://json-schema.org/draft-07/schema#"
title: "Stimulus Variant Schema"
type: "object"
properties:
  variant_id:
    type: "string"
  scenario_id:
    type: "string"
  salience_level:
    type: "string"
    enum: ["low", "medium", "high"]
  manipulation_params:
    type: "object"
    properties:
      contrast_adjustment:
        type: "number"
      brightness_adjustment:
        type: "number"
      version:
        type: "string"
    required: ["contrast_adjustment", "brightness_adjustment", "version"]
  clip_similarity:
    type: "number"
    minimum: 0.95
  rms_contrast_change:
    number: "number"
    minimum: 15
  moral_intent_preservation_score:
    type: "number"
    minimum: 0.90
  semantic_integrity:
    type: "string"
    enum: ["passed", "failed"]
  image_path:
    type: "string"
required:
  - variant_id
  - scenario_id
  - salience_level
  - manipulation_params
  - clip_similarity
  - rms_contrast_change
  - moral_intent_preservation_score
  cross‑? 