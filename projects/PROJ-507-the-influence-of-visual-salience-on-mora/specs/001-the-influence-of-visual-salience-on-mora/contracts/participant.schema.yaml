$schema: "http://json-schema.org/draft-07/schema#"
title: "Participant Schema"
type: "object"
properties:
  participant_id:
    type: "string"
    description: "Unique identifier for the participant"
  start_time:
    type: "string"
    format: "date-time"
    description: "Timestamp of when the participant started"
  end_time:
    type: "string"
    format: "date-time"
    description: "Timestamp of when the participant finished"
  total_responses:
    type: "integer"
    description: "Number of responses submitted by the participant"
  exclusion_flag:
    type: "boolean"
    description: "True if the participant was excluded during cleaning"
  exclusion_reason:
    type: "string"
    description: "Optional free‑text reason for exclusion"
required:
  - participant_id
  - start_time
  - end_time
  - total_responses
  - exclusion_flag
additionalProperties: false