$schema: "http://json-schema.org/draft-07/schema#"
title: "Survey Responses Schema"
type: "object"
description: "Schema for raw survey responses without validation flags."
properties:
  response_id:
    type: "string"
  participant_id:
    type: "string"
  variant_id:
    type: "string"
  salience_level:
    type: "string"
    enum: ["low", "medium", "high"]
  blame_rating:
    type: "number"
    minimum: 0
    maximum: 7
  timestamp:
    type: "string"
    format: "date-time"
  order_index:
    type: "number"
required:
  - response_id
  - participant_id
  - variant_id
  ****