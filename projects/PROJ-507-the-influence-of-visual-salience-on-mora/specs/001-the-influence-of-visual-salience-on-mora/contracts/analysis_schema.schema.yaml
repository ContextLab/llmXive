$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Results Schema"
description: "Schema for statistical analysis outputs (CLMM) - Visual Salience Study"
type: "object"
properties:
  model_type:
    type: "string"
    enum:
      - "Cumulative_Link_Mixed_Model"
      - "Linear_Mixed_Effects_Model"
      - "Wilcoxon_Signed_Rank_Test"
    description: "Type of model used."
  fixed_effects:
    type: "object"
    description: "Fixed effect coefficients."
    additionalProperties:
      type: "number"
  random_effects_variance:
    type: "object"
    description: "Random effect variances."
    additionalProperties:
      type: "number"
  p_value:
    type: "number"
    description: "Raw p-value for salience effect."
    minimum: 0
    maximum: 1
  p_value_corrected:
    type: "number"
    description: "Bonferroni-corrected p-value."
    minimum: 0
    maximum: 1
  effect_size:
    type: "object"
    properties:
      odds_ratio:
        type: "number"
        description: "Odds ratio for the main effect."
      ci_95_lower:
        type: "number"
      ci_95_upper:
        "number"
    required:
      - "odds_ratio"
      - "ci_95_lower"
      - "ci_95_upper"
  post_hoc_tests:
    type: "array"
    items:
      type: "object"
      properties:
        comparison:
          type: "string"
        odds_ratio:
          type: "number"
        p_value_uncorrected:
          type: "number"
        p_value_bonferroni:
          "number"
      required:
        - "comparison"
        - "odds_ratio"
        - "p_value_uncorrected"
        - "p_value_bonferroni"
  exclusion_rate:
    type: "number"
    minimum: 0
    maximum: 1
  sample_size:
    type: "number"
    minimum: 0
  "..." ... 