access_python: "import networkx as nx\n\ndef make_record(g, gid, deg_type, params):\n\
  \    return {\n        \"graph_id\": gid,\n        \"node_list\": list(g.nodes()),\n\
  \        \"edge_list\": list(g.edges()),\n        \"degree_distribution_type\":\
  \ deg_type,\n        \"parameter_values\": params,\n        \"clustering_coefficient\"\
  : nx.average_clustering(g),\n        \"is_connected\": nx.is_connected(g),\n   \
  \ }\n\nrecords = []\ngenerators = [\n    (\"erdos_renyi\", lambda: nx.erdos_renyi_graph(30,\
  \ 0.1), {\"p\": 0.1}),\n    (\"barabasi_albert\", lambda: nx.barabasi_albert_graph(30,\
  \ 2), {\"m\": 2}),\n    (\"watts_strogatz\", lambda: nx.watts_strogatz_graph(30,\
  \ 4, 0.3), {\"k\": 4, \"p\": 0.3}),\n]\n\nfor i, (deg_type, gen_func, params) in\
  \ enumerate(generators, start=1):\n    g = gen_func()\n    records.append(make_record(g,\
  \ i, deg_type, params))\n\nprint(f\"RECORDS={len(records)}\")\nprint(\"FIELDS=\"\
  \ + \",\".join(records[0].keys()))"
