$schema: http://json-schema.org/draft-07/schema#
title: Global Batch Manifest Schema
description: >
  Schema for the global batch manifest generated by the network topology
  energy transfer simulation pipeline.
type: object
required:
  - version
  - generation_timestamp
  - generation_algorithm
  - stratification_summary
  - graphs
  - summary_statistics
  - config_snapshot
properties:
  version:
    type: string
    description: Schema version of the manifest.
    const: "1.0.0"
  generation_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the manifest was generated.
  generation_algorithm:
    type: object
    description: Metadata about the generation algorithms used.
    required:
      - algorithms
      - seeds
    properties:
      algorithms:
        type: array
        items:
          type: object
          required:
            - name
            - description
            - parameters
          properties:
            name:
              type: string
              description: Name of the algorithm (e.g., 'erdos_renyi', 'watts_strogatz', 'barabasi_albert').
            description:
              type: string
              description: Brief description of the algorithm.
            parameters:
              type: object
              description: Parameters used for the algorithm generation.
      seeds:
        type: object
        description: Mapping of algorithm names to their random seeds.
  stratification_summary:
    type: object
    description: Summary of the stratification process.
    required:
      - bins
      - target_counts
      - actual_counts
      - tolerance
      - status
    properties:
      bins:
        type: array
        items:
          type: number
        description: List of clustering coefficient bin boundaries.
      target_counts:
        type: object
        description: Target count per bin.
        additionalProperties:
          type: integer
      actual_counts:
        type: object
        description: Actual count generated per bin.
        additionalProperties:
          type: integer
      tolerance:
        type: number
        description: Allowed deviation from target counts.
      status:
        type: string
        enum: ["complete", "partial", "failed"]
        description: Overall status of the stratification process.
  graphs:
    type: array
    description: List of generated graph metadata.
    items:
      type: object
      required:
        - graph_id
        - algorithm
        - parameters
        - metrics
        - is_connected
      properties:
        graph_id:
          type: string
          description: Unique identifier for the graph.
        algorithm:
          type: string
          description: Name of the algorithm used to generate the graph.
        parameters:
          type: object
          description: Parameters used for generation.
        metrics:
          type: object
          description: Topological metrics computed for the graph.
          required:
            - clustering_coefficient
            - average_path_length
            - degree_distribution
          properties:
            clustering_coefficient:
              type: number
              description: Average clustering coefficient.
            average_path_length:
              type: number
              description: Average path length (if connected).
            degree_distribution:
              type: object
              description: Degree distribution statistics.
              properties:
                mean:
                  type: number
                variance:
                  type: number
                max_degree:
                  type: integer
                min_degree:
                  type: integer
        is_connected:
          type: boolean
          description: Whether the graph is connected.
        file_path:
          type: string
          description: Relative path to the graph file in data/raw/.
  summary_statistics:
    type: object
    description: Aggregate statistics across all generated graphs.
    properties:
      total_graphs:
        type: integer
      connected_graphs:
        type: integer
      avg_clustering:
        type: number
      avg_path_length:
        type: number
      success_rate:
        type: number
        description: Percentage of successful generations (connected graphs / total attempts).
  config_snapshot:
    type: object
    description: Snapshot of the configuration used for this run.
    properties:
      global_seed:
        type: integer
      topology_targets:
        type: array
      simulation_params:
        type: object
      stratification_params:
        type: object
