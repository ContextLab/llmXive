$schema: "http://json-schema.org/draft-07/schema#"
title: "Subspace Ranks Schema"
description: "Schema for the per-effect LoRA subspace ranks in data/subspace_ranks.json"
type: "object"
patternProperties:
  "^[a-zA-Z0-9_\\s-]+$":
    type: "integer"
    minimum: 1
    description: "Effect name and its effective rank"
additionalProperties: false
required: []
description: "Key-value pairs where key is effect name and value is rank"
