$schema: "http://json-schema.org/draft-07/schema#"
title: "SubspaceRanks"
description: "Schema for subspace rank analysis (data/subspace_ranks.json)"
type: "object"
properties:
  effect_id:
    type: "string"
    description: "Identifier for the effect"
  subspace_rank:
    type: "integer"
    description: "Effective rank computed via SVD"
  rank_tolerance:
    type: "number"
    description: "Tolerance threshold used for SVD"
  matrix_shape:
    type: "array"
    items:
      type: "integer"
    description: "Shape of the weight matrix [rows, cols]"
required:
  - effect_id
  - subspace_rank
  - rank_tolerance
  - matrix_shape
additionalProperties: false
