$schema: "http://json-schema.org/draft-07/schema#"
title: "ArtifactsState"
description: "Schema for versioning and hashing (state/artifacts.yaml)"
type: "object"
properties:
  artifacts:
    type: "object"
    description: "Map of artifact path to SHA-256 hash"
    additionalProperties:
      type: "string"
      pattern: "^[a-f0-9]{64}$"
  metadata:
    type: "object"
    properties:
      created_at:
        type: "string"
        format: "date-time"
      updated_at:
        type: "string"
        format: "date-time"
      version:
        type: "string"
    required:
      - created_at
      - updated_at
      - version
  analysis_results:
    type:
      - "object"
      - "null"
    description: "Optional embedded analysis summary"
required:
  - artifacts
  - metadata
additionalProperties: false
