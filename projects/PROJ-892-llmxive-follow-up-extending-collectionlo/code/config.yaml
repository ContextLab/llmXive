# Configuration for Quantization Robustness of Multi-Effect LoRA Adapters
# Generated by T004 and extended by T011b

# Fixed seed for deterministic generation (T011b requirement)
seed: 42

# Fixed reference prompt for the "known reference" image (T011b requirement)
# This prompt is used to generate the ground truth image for LPIPS checks
reference_prompt: "a high quality photograph of a cat"

# List of distinct effect prompts for the study
effect_prompts:
  - "a photograph of a cat in the style of oil painting"
  - "a photograph of a cat in the style of watercolor"
  - "a photograph of a cat in the style of pixel art"
  - "a photograph of a cat in the style of charcoal sketch"
  - "a photograph of a cat in the style of cyberpunk"

# Model paths (relative to project root)
base_model_id: "runwayml/stable-diffusion-v1-5"
adapter_path: "data/models/adapter_fp16.safetensors"

# Generation parameters
num_inference_steps: 50
guidance_scale: 7.5
image_width: 512
image_height: 512
