# Configuration for Quantization Robustness of Multi-Effect LoRA Adapters
# This file is the single source of truth for test prompts and seeds.
# Implemented by T004.
#
# VALIDATION LOGIC:
# This configuration is validated against data/subspace_ranks.json at runtime.
# Each prompt MUST start with one of the effect names defined in subspace_ranks.json.
# If a prompt does not map to a known effect, the pipeline will raise a ValueError.

# EXACT, FIXED list of test prompts (10 items)
# These map to the 5 distinct effects required by the specification.
# Mapping:
# - "oil painting", "acrylic", "pastel" -> "oil_painting" (Effect 1)
# - "watercolor", "ink wash" -> "watercolor" (Effect 2)
# - "cyberpunk", "digital art", "concept art" -> "cyberpunk" (Effect 3)
# - "pencil sketch", "charcoal" -> "pencil_sketch" (Effect 4)
# - "ink wash" is also used for watercolor, but here we ensure distinct mapping.
# Note: The exact mapping logic is implemented in code/main.py and code/data_loader.py
# to check prefix matches against data/subspace_ranks.json keys.

prompts:
  - "oil painting style"
  - "watercolor style"
  - "cyberpunk style"
  - "pencil sketch style"
  - "ink wash style"
  - "acrylic style"
  - "charcoal style"
  - "pastel style"
  - "digital art style"
  - "concept art style"

# Seed values for deterministic generation (FR-003, FR-009)
seeds:
  - 42
  - 123
  - 456
  - 789
  - 101112

# Reference generation settings (used for baseline comparisons)
reference:
  seed: 42
  prompt: "a simple test object"
  output_path: "data/references/baseline_ref.png"

# Generation settings (default parameters for image generation)
generation:
  num_inference_steps: 30
  height: 512
  width: 512
  dtype: "float16"

# Quantization settings
quantization:
  enabled: true
  modes:
    - "int8"
    - "int4"
  backend: "cpu"

# Analysis settings
analysis:
  subspace_rank_tolerance: 1e-5
  cesr_exclusion: true
  bayesian_priors:
    fixed_effect: "Normal(0, 1)"
    random_effect: "HalfNormal(0.5)"

# Streaming/Sampling Rule (FR-001, Constitution Principle: Real Data)
# If the full dataset cannot be processed due to memory constraints,
# this pipeline will process the first N seeds/prompts defined above.
# It will NOT generate synthetic data. If memory is exceeded, it will fail loudly.
sampling_rule: "process_all_defined_prompts_and_seeds"