# Quantization settings
quantization:
  enabled: true
  modes:
    - "int8"
    - "int4"
  backend: "cpu"

# Analysis settings
analysis:
  subspace_rank_tolerance: 1e-5
  cesr_exclusion: true
  bayesian_priors:
    fixed_effect: "Normal(0, 1)"
    random_effect: "HalfNormal(0.5)"