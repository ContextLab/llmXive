[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-051-turbulence-analysis"
version = "0.1.0"
description = "Investigating the relationship between fractal dimension and energy dissipation in turbulent flows"
requires-python = ">=3.10"
authors = [
    {name = "llmXive Research Team"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "h5py>=3.8.0",
    "matplotlib>=3.7.0",
    "pytest>=7.3.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.0"
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pre-commit>=3.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 88
target-version = ['py310']
