$schema: http://json-schema.org/draft-07/schema#
title: Turbulence Analysis Output Schema
description: >
  Schema defining the required output fields for fractal dimension (D_f),
  energy dissipation rate (ε), and correlation analysis results.
  This contract is validated by `main.py` before pipeline completion.
type: object
required:
  - metadata
  - fractal_dimension
  - energy_dissipation
  - correlation_results
properties:
  metadata:
    type: object
    description: Execution metadata and configuration snapshot
    required:
      - re_lambda
      - vorticity_threshold
      - timestamp
      - config_hash
    properties:
      re_lambda:
        type: number
        description: The Taylor-scale Reynolds number for this run
      vorticity_threshold:
        type: string
        description: Threshold method (e.g., "2x_rms", "3x_rms")
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of execution
      config_hash:
        type: string
        description: SHA-256 hash of the config used for reproducibility

  fractal_dimension:
    type: object
    description: Results from the box-counting algorithm
    required:
      - D_f
      - D_f_std
      - num_boxes
      - rejection_reason
    properties:
      D_f:
        type: number
        description: Estimated fractal dimension (2.0 <= D_f <= 3.0)
      D_f_std:
        type: number
        description: Standard deviation of the estimate
      num_boxes:
        type: integer
        description: Number of boxes used in the final fit
      rejection_reason:
        type: ["string", "null"]
        description: If D_f is out of bounds or fit failed, the reason; null if valid

  energy_dissipation:
    type: object
    description: Statistics for the local energy dissipation rate ε
    required:
      - mean_epsilon
      - max_epsilon
      - intermittency_ratio
      - kinematic_viscosity
    properties:
      mean_epsilon:
        type: number
        description: Mean energy dissipation rate
      max_epsilon:
        type: number
        description: Maximum local energy dissipation rate
      intermittency_ratio:
        type: number
        description: Ratio max(ε) / mean(ε)
      kinematic_viscosity:
        type: number
        description: Kinematic viscosity ν used in calculation

  correlation_results:
    type: object
    description: Statistical correlation between D_f and log(ε)
    required:
      - pearson_r
      - p_value
      - slope
      - intercept
      - bootstrap_ci_lower
      - bootstrap_ci_upper
      - fwe_corrected_p
      - n_samples
    properties:
      pearson_r:
        type: number
        description: Pearson correlation coefficient
      p_value:
        type: number
        description: Raw p-value for the correlation
      slope:
        type: number
        description: Slope of the linear regression D_f ~ log(ε)
      intercept:
        type: number
        description: Intercept of the linear regression
      bootstrap_ci_lower:
        type: number
        description: Lower bound of the 95% bootstrap confidence interval for r
      bootstrap_ci_upper:
        type: number
        description: Upper bound of the 95% bootstrap confidence interval for r
      fwe_corrected_p:
        type: number
        description: Family-wise error corrected p-value
      n_samples:
        type: integer
        description: Number of independent spatial samples used