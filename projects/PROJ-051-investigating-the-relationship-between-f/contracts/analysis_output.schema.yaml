%YAML 1.1
---
$schema: http://json-schema.org/draft-07/schema#
title: Turbulence Analysis Output Schema
description: |
  Schema defining the required output fields for fractal dimension (D_f),
  energy dissipation rate (ε), and correlation analysis results.
  Used for contract validation in the pipeline (T006).
type: object
required:
  - metadata
  - fractal_dimension
  - energy_dissipation
  - correlation_analysis
properties:
  metadata:
    type: object
    description: Execution metadata for reproducibility
    required:
      - timestamp
      - re_lambda
      - vorticity_threshold
      - grid_size
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of execution
      re_lambda:
        type: number
        description: Taylor-scale Reynolds number
      vorticity_threshold:
        type: number
        description: Threshold multiplier used for iso-surface extraction (e.g., 2.0, 3.0, 4.0 times RMS)
      grid_size:
        type: array
        items:
          type: integer
        description: Dimensions of the input grid (e.g., [512, 512, 512])
      seed:
        type: integer
        description: Random seed used for the run
      pipeline_version:
        type: string
        description: Version of the pipeline code

  fractal_dimension:
    type: object
    description: Results from the box-counting algorithm
    required:
      - D_f
      - R_squared
      - box_counts
    properties:
      D_f:
        type: number
        description: Estimated fractal dimension
        minimum: 2.0
        maximum: 3.0
      R_squared:
        type: number
        description: R-squared value of the linear fit in log-log space
        minimum: 0.0
        maximum: 1.0
      box_counts:
        type: array
        description: Mapping of box size to count
        items:
          type: object
          required:
            - log_size
            - log_count
          properties:
            log_size:
              type: number
            log_count:
              type: number

  energy_dissipation:
    type: object
    description: Results from the energy dissipation rate calculation
    required:
      - mean_epsilon
      - max_epsilon
      - intermittency_ratio
      - kinematic_viscosity
    properties:
      mean_epsilon:
        type: number
        description: Mean energy dissipation rate
      max_epsilon:
        type: number
        description: Maximum local energy dissipation rate
      intermittency_ratio:
        type: number
        description: Ratio of max(ε) to mean(ε)
      kinematic_viscosity:
        type: number
        description: Kinematic viscosity (ν) used in calculation

  correlation_analysis:
    type: object
    description: Statistical correlation between D_f and log(ε)
    required:
      - pearson_r
      - p_value
      - n_samples
      - bootstrap_ci
      - null_model_check
    properties:
      pearson_r:
        type: number
        description: Pearson correlation coefficient
      p_value:
        type: number
        description: P-value for the correlation test
      n_samples:
        type: integer
        description: Number of independent samples used
        minimum: 1
      bootstrap_ci:
        type: object
        description: 95% confidence interval from block-bootstrapping
        required:
          - lower
          - upper
        properties:
          lower:
            type: number
          upper:
            type: number
      null_model_check:
        type: boolean
        description: True if the correlation holds against the Phase-Shifted DNS null model
      method:
        type: string
        enum:
          - normalized_rms
          - absolute_vorticity
        description: Thresholding method used for this correlation result
      is_null_finding:
        type: boolean
        description: True if the correlation is statistically insignificant (p > 0.05)