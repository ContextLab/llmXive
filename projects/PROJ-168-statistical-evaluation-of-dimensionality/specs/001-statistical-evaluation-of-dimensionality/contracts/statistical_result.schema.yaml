$schema: "http://json-schema.org/draft-07/schema#"
title: "Statistical Result Schema"
description: "Schema for the final statistical analysis results including Fixed‑Effects ANOVA, Mixed‑Effects, and sensitivity analysis."
type: object
properties:
  model_summary:
    type: object
    properties:
      formula:
        type: string
        description: "The model formula used (e.g., 'logit_fidelity ~ method + intrinsic_dimensionality + local_density + (1|dataset)')"
      fixed_effects:
        type: array
        items:
          type: object
          properties:
            term:
              type: string
              description: "Model term (e.g., method[PCA])"
            estimate:
              type: number
              description: "Estimated coefficient"
            std_error:
              type: number
              description: "Standard error of the coefficient"
            p_value:
              type: number
              minimum: 0.0
              maximum: 1.0
              description: "Raw p‑value"
            p_value_fdr:
              type: number
              minimum: 0.0
              maximum: 1.0
              description: "Benjamini‑Hochberg adjusted p‑value"
          required:
            - term
            - estimate
            - std_error
            - p_value
            - p_value_fdr
      random_effects_variance:
        type: [ "number", "null" ]
        description: "Variance of the random intercept for dataset (null if not applicable)."
      vif_values:
        type: object
        description: "Variance Inflation Factor for each predictor (after dropping one dummy level)."
        additionalProperties:
          type: number
      collinearity_passed:
        type: boolean
        description: "True if all VIF < 5"
    required:
      - formula
      - fixed_effects
      - random_effects_variance
      - vif_values
      - collinearity_passed
  sensitivity_analysis:
    type: object
    properties:
      thresholds:
        type: array
        items:
          type: number
        description: "Silhouette‑score thresholds swept (e.g., 0.4, 0.5, 0.6)"
      variance_ari:
        type: number
        description: "Variance in ARI across thresholds"
      variance_nmi:
        type: number
        description: "Variance in NMI across thresholds"
      stability_report:
        type: string
        description: "Narrative description of stability (no hard pass/fail cutoff)."
    required:
      - thresholds
      - variance_ari
      - variance_nmi
      - stability_report
  execution_metadata:
    type: object
    properties:
      peak_memory_bytes:
        type: integer
        description: "Peak RSS observed during execution"
      total_runtime_seconds:
        type: number
        description: "Total wall‑clock time"
      datasets_processed:
        type: integer
        description: "Number of datasets successfully processed"
      datasets_skipped:
        type: integer
        description: "Number of datasets skipped due to errors or missing sources"
      exit_code:
        type: integer
        description: "Exit code of the pipeline (0 for success, 1 for failure)"
    required:
      - peak_memory_bytes
      - total_runtime_seconds
      - datasets_processed
      - datasets_skipped
      - exit_code
required:
  - model_summary
  - sensitivity_analysis
  - execution_metadata