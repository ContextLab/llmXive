$schema: "http://json-schema.org/draft-07/schema#"
title: Dataset Manifest Entry
description: >
  Each entry describes a raw dataset required for the pipeline.
type: object
required:
  - dataset_id
  - source_url
  - status
  - checksum
  - raw_file_path
  - processed_file_path
properties:
  dataset_id:
    type: string
    description: GEO accession identifier (e.g., GSE131907).
  source_url:
    type: string
    format: uri
    description: URL pointing to the original GEO entry for provenance.
  status:
    type: string
    enum: [Available, Unavailable]
    description: Availability flag.
  checksum:
    type: string
    pattern: "^[a-fA-F0-9]{64}$"
    description: SHA‑256 checksum of the raw H5AD file.
  raw_file_path:
    type: string
    format: uri
    description: Absolute or project‑relative path to the raw H5AD file.
  processed_file_path:
    anyOf:
      - type: string
        format: uri
      - type: "null"
    description: Path to a processed version (populated later) or null.
additionalProperties: false
