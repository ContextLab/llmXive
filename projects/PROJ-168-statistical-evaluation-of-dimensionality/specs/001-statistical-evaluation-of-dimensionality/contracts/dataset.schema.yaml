$schema: "http://json-schema.org/draft-07/schema#"
description: Schema for the dataset manifest generated by the data gap resolver.
type: array
items:
  type: object
  required:
    - dataset_id
    - source_url
    - status
    - checksum
    - raw_file_path
    - processed_file_path
  properties:
    dataset_id:
      type: string
      description: GEO accession identifier.
    source_url:
      type: string
      format: uri
      description: Original GEO URL for provenance.
    status:
      type: string
      enum:
        - Available
        - Unavailable
      description: Availability status of the dataset.
    checksum:
      type: [string, "null"]
      description: SHA‑256 checksum of the raw H5AD file (null if unavailable).
    raw_file_path:
      type: [string, "null"]
      description: Absolute path to the downloaded raw H5AD file (null if unavailable).
    processed_file_path:
      type: [string, "null"]
      description: Path to the processed version (populated later).