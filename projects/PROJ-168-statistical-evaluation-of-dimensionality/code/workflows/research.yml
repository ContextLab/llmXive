# GitHub Actions workflow for the research pipeline (SC-003 / SC-004 enforcement).
#
# NOTE ON PLACEMENT: this file is the project-owned master copy of the CI
# workflow. The `.github/` namespace at the repository root is owned by the
# platform, so the canonical project artifact lives here under `code/`.
# To activate it in a real GitHub repository, copy (or symlink) this file to
# `.github/workflows/research.yml` from outside the project tree:
#     cp code/workflows/research.yml .github/workflows/research.yml
#
# The workflow (a) sets up Python, (b) runs `python code/main.py`,
# (c) captures the exit code, and (d) fails the job if the exit code != 0.
# Limit enforcement (peak RAM <= 7,000,000,000 bytes, summed wall time
# <= 21,600 s) is delegated to `code/ci_limits.py` (created in T004), which
# the workflow references explicitly — guaranteeing the script exists
# before the workflow runs.

name: Research Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install snakemake

      - name: Run Data Gap Resolution
        run: |
          python code/data_gap_resolver.py
          echo "Data gap resolution completed"

      - name: Run Pipeline
        id: pipeline
        continue-on-error: true
        run: |
          # Execute the main pipeline script; its exit code is captured by
          # the step outcome/conclusion for the check below.
          python code/main.py
          echo "PIPELINE_EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Check pipeline exit code
        if: steps.pipeline.outcome != 'success'
        run: |
          echo "ERROR: pipeline step concluded with '${{ steps.pipeline.conclusion }}' (exit code ${{ env.PIPELINE_EXIT_CODE }})."
          exit 1

      - name: Enforce limits
        run: |
          # SC-003 / SC-004 enforcement via the T004 script.
          # ci_limits.py parses results/monitoring.csv and exits 1 if any
          # peak_ram_bytes > 7,000,000,000 or summed wall_time_s > 21,600.
          if [ ! -f "results/monitoring.csv" ]; then
            echo "ERROR: results/monitoring.csv not found. Pipeline may have failed."
            exit 1
          fi
          python code/ci_limits.py

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: research-results
          path: |
            results/
            data/processed/
          retention-days: 7
