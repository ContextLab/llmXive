T005:
  c: false
  h: d1944a9b03dfd5139ccaaea53f9187d86c6c1d72c1461a84a9522a5062de674c
  r: "The `code/utils.py` defines `ResourceMonitor` and a self\u2011test that generated\
    \ `results/monitoring.csv`, but the CSV header written by the module is `step_name,wall_time_s,peak_ram_bytes`\
    \ while the task requires the header `step,wall_time_s,peak_ram_bytes`. Moreover,\
    \ `get_logger` merely forwards to `llmxive_toolkit.get_logger` without any evidence\
    \ that the returned logger is set to INFO level and has a file handler for `results/pipeline.log`.\
    \ The implementation must be corrected to write the exact required header and\
    \ to explicitly configure the logger as specified."
  sig: a27ecc89e0fffec7d4d4eb8f6be6543570cce5fe13d1050c43a121e9a5777c8a
T006:
  c: false
  h: 97a308114d7187ffc68214540b840bf8eefc9fab36fd65c9e099f8a3f26f9e18
  r: "The repository contains `data/manifest.json` and the data\u2011gap resolver\
    \ script, but no `Snakefile` (or any Snakemake workflow) is present. Consequently\
    \ the required `verify_data_availability` rule, its dependency on `download`,\
    \ and the minimal `data_gap_resolver` rule are missing. A proper Snakefile must\
    \ be added to satisfy the task."
  sig: 9393aaa16d5413f804b6b28d655570eb3b59b690841a74e6fec4e9217e235f39
