# Project tooling configuration: black formatting (T003).
# Flake8 configuration lives in code/.flake8 (flake8 does not read
# pyproject.toml natively).
[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | venv
    | renv
    | data
    | artifacts
    | results
    | cache
)/
'''
