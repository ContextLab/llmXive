[project]
name = "agentdog-drift"
version = "0.1.0"
dependencies = [
  "sentence-transformers",
  "scikit-learn",
  "pandas",
  "numpy",
  "datasets",
  "jsonschema",
  "statsmodels",
  "pytest",
  "transformers",
  "accelerate"
]