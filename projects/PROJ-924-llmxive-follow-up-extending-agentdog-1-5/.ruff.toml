# Ruff configuration for llmXive project
# Extends default settings with project-specific rules

[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and flake8-bugbear (`B`)
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in pytest)
    "C408", # Unnecessary dict call (sometimes more readable)
]

[lint.per-file-ignores]
# Allow unused imports in __init__.py files for public API exposure
"__init__.py" = ["F401"]
# Allow print statements in main scripts for debugging/logging
"main.py" = ["T201"]

[lint.isort]
known-first-party = ["config", "utils", "data_loader", "drift_scoring", "taxonomy_builder", "validation", "annotator_interface"]
force-sort-within-sections = true

[format]
# Enforce double quotes and 4-space indentation (matching Black defaults)
quote-style = "double"
indent-style = "space"
line-ending = "auto"
