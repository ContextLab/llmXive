# Ruff configuration for llmXive project
# This file satisfies the requirement for T010 (configuring ruff)

# Target Python version
target-version = "py310"

# Line length (matching black's default)
line-length = 88

# Exclude directories
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".eggs",
    "venv",
    ".venv",
]

[lint]
# Enable pycodestyle (E), Pyflakes (F), and isort (I) rules
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

# Ignore specific rules if needed
ignore = [
    "E501",  # Line too long (handled by black)
    "B008",  # Do not perform function call in argument defaults (common in pytest)
]

# Per-file ignores
[lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests

[lint.isort]
# Isort configuration
known-first-party = ["code"]
force-single-line = false
lines-after-imports = 2
