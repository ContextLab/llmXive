# Ruff configuration for llmXive project
# Linting rules and settings

[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in data loading)
]

# Allow autofix for all enabled rules (if possible)
fixable = ["ALL"]
unfixable = []

# Exclude a few files/directories
exclude = [
    ".git",
    "__pycache__",
    ".tox",
    "venv",
    ".venv",
    "build",
    "dist",
    "data",
]

# Same as Black
line-length = 88
target-version = "py311"

[lint.per-file-ignores]
# Ignore specific rules for test files if needed
"tests/*" = ["S101"] # Allow assert in tests

[lint.isort]
known-first-party = ["code"]
force-single-line = false
lines-after-imports = 2
