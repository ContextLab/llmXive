# Ruff configuration for llmXive Follow-up project
# Enforces strict linting rules for code quality and consistency

[lint]
# Enable specific rule sets
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort (import sorting)
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N",  # pep8-naming
    "SIM",# flake8-simplify
    "ARG",# flake8-unused-arguments
]

# Ignore specific rules that are too strict for this project
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function calls in argument defaults (common in config)
    "ARG001", # Unused function arguments (sometimes needed for interface compliance)
]

# Allow automatic fixes for certain issues
fixable = ["ALL"]
unfixable = []

# Exclude generated files and virtual environments
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "venv",
    ".venv",
    "data",
    "build",
    "dist",
]

# Per-file ignores (if needed)
per-file-ignores = {}

# Maximum line length (should match black)
line-length = 88

# Target Python version
target-version = "py311"

[lint.isort]
# Configuration for import sorting
known-first-party = ["config", "utils", "data_loader", "drift_scoring", "taxonomy_builder", "validation", "annotator_interface", "checksums_generator", "main"]
force-single-line = false
force-sort-within-sections = false
lines-after-imports = 2
combine-as-imports = true

[lint.flake8-unused-arguments]
# Ignore unused arguments in certain cases (e.g., interface compliance)
ignore-variadic-names = true
