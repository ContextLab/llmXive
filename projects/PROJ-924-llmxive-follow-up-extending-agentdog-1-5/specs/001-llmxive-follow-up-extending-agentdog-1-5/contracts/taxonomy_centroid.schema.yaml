$schema: "http://json-schema.org/draft-07/schema#"
title: "TaxonomyCentroid"
description: "Mean embedding vector for one AgentDoG 1.5 safety category."
type: "object"
properties:
  category:
    type: "string"
    enum: ["Safety", "Privacy", "Bias", "Jailbreak"]
  description:
    type: "string"
    minLength: 1
    description: "Category definition from the AgentDoG 1.5 taxonomy."
  embedding:
    type: "array"
    items:
      type: "number"
    minItems: 384
    maxItems: 384
    description: "384-dim all-MiniLM-L6-v2 embedding, L2-normalized."
  n_samples:
    type: "integer"
    minimum: 100
    description: "Number of curated example logs used (must be >= 100, FR-004)."
  source_version:
    type: "string"
    minLength: 1
    description: "Revision id of agentdog/safety-v1 used."
required:
  - category
  - description
  - embedding
  - n_samples
  - source_version
additionalProperties: false
