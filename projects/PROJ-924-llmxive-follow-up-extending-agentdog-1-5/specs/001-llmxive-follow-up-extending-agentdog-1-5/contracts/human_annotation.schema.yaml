$schema: "http://json-schema.org/draft-07/schema#"
title: "Human Annotation Schema"
description: "Schema for human-annotated validation data."
type: "object"
properties:
  log_id:
    type: "string"
    description: "Unique identifier for the log entry."
  annotator_id:
    type: "string"
    description: "ID of the human annotator."
  is_novel:
    type: "integer"
    enum:
      - 0
      - 1
    description: "1 if the log is novel/harmful (outside 4 categories), 0 otherwise."
  confidence:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Confidence score of the annotation."
required:
  - "log_id"
  - "annotator_id"
  - "is_novel"
additionalProperties: false
