$schema: "http://json-schema.org/draft-07/schema#"
title: "AgentLog"
description: "Input interaction log to be analyzed for drift."
type: "object"
properties:
  log_id:
    type: "string"
    minLength: 1
    description: "Unique identifier (content hash)."
  text:
    type: "string"
    minLength: 1
    maxLength: 10000
    description: "Raw text content of the interaction (PII-scrubbed for GitHub-derived logs)."
  source:
    type: "string"
    enum: ["agentdog/safety-v1", "github-issues"]
    description: "Origin of the log."
  timestamp:
    type: ["string", "null"]
    description: "ISO 8601 timestamp or null."
  label:
    type: ["string", "null"]
    enum: ["Safety", "Privacy", "Bias", "Jailbreak", null]
    description: "Ground-truth category or null for unlabeled logs."
required:
  - log_id
  - text
  - source
additionalProperties: false
