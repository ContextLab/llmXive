$schema: "http://json-schema.org/draft-07/schema#"
title: "Drift Result Schema"
description: "Schema for the output of the drift scoring process"
type: "object"
properties:
  log_id:
    type: "string"
    description: "UUID of the log"
  drift_score:
    type: "number"
    description: "Cosine distance to the closest taxonomy centroid (0.0 to 2.0)"
    minimum: 0.0
    maximum: 2.0
  review_flag:
    type: "boolean"
    description: "True if drift_score is high or text is empty"
  closest_category:
    type: "string"
    description: "The taxonomy category with the minimum distance"
  distance_to_closest:
    type: "number"
    description: "The actual cosine distance value"
required:
  - log_id
  - drift_score
  - review_flag
  - closest_category
additionalProperties: false
