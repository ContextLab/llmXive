$schema: "http://json-schema.org/draft-07/schema#"
title: "Drift Output Schema"
description: "Schema for the output of the zero-shot drift detection pipeline."
type: "object"
properties:
  log_id:
    type: "string"
  drift_score:
    type: "number"
    minimum: 0.0
    maximum: 2.0
  nearest_centroid:
    type: "string"
    enum:
      - "Safety"
      - "Privacy"
      - "Bias"
      - "Jailbreak"
  review_flag:
    type: "boolean"
required:
  - "log_id"
  - "drift_score"
  - "nearest_centroid"
  - "review_flag"
additionalProperties: false
