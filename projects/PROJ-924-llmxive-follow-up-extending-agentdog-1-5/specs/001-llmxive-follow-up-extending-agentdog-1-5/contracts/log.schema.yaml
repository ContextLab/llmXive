$schema: "http://json-schema.org/draft-07/schema#"
title: "Log Schema"
description: "Schema for the raw log entry derived from ATBench"
type: "object"
properties:
  log_id:
    type: "string"
    description: "UUID generated from dataset ID"
  text:
    type: "string"
    description: "The raw log content (e.g., 'contents' field)"
  timestamp:
    type: "string"
    format: "date-time"
    description: "Timestamp (derived deterministically from log_id hash if missing to ensure reproducibility)"
  source_category:
    type: "string"
    description: "Ground truth category (e.g., 'risk_source')"
required:
  - log_id
  - text
  - timestamp
  - source_category
additionalProperties: false
