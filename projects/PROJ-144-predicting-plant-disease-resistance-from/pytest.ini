[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Mark tests as slow (optional)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
