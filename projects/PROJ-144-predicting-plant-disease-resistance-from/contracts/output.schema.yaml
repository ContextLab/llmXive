$schema: "http://json-schema.org/draft-07/schema#"
title: "Output Metrics Schema"
type: "object"
properties:
  metrics:
    type: "object"
    properties:
      balanced_accuracy:
        type: "number"
      roc_auc:
        type: "number"
      permutation_p_value:
        type: "number"
      framing:
        type: "string"
    required:
      - "balanced_accuracy"
      - "roc_auc"
      - "permutation_p_value"
      - "framing"
  shap_analysis:
    type: "object"
    properties:
      correlations:
        type: "array"
        items:
          type: "object"
          properties:
            feature_name:
              type: "string"
            correlation:
              type: "number"
            p_value:
              type: "number"
            fdr_corrected_p:
              type: "number"
          required:
            - "feature_name"
            - "correlation"
            - "p_value"
            - "fdr_corrected_p"
      collinearity_vif:
        type: "array"
        items:
          type: "object"
          properties:
            feature_name:
              type: "string"
            vif_value:
              type: "number"
          required:
            - "feature_name"
            - "vif_value"
      framing:
        type: "string"
    required:
      - "correlations"
      - "framing"
required:
  - "metrics"
  - "shap_analysis"
