$schema: http://json-schema.org/draft-07/schema#
title: Plant Disease Resistance Analysis Output Schema
description: >
  Schema defining the structure of output artifacts generated by the modeling pipeline.
  Specifically defines the structure for metrics.json and shap_analysis.json.
  All findings derived from this data must be framed as associational (FR-011).

definitions:
  model_metrics:
    type: object
    description: Primary performance metrics calculated on the hold-out set.
    required:
      - balanced_accuracy
      - roc_auc
      - precision_recall_auc
      - accuracy
      - confusion_matrix
    properties:
      balanced_accuracy:
        type: number
        description: Balanced accuracy score (average of recall obtained on each class).
        minimum: 0.0
        maximum: 1.0
      roc_auc:
        type: number
        description: Area Under the Receiver Operating Characteristic Curve.
        minimum: 0.0
        maximum: 1.0
      precision_recall_auc:
        type: number
        description: Area Under the Precision-Recall Curve.
        minimum: 0.0
        maximum: 1.0
      accuracy:
        type: number
        description: Standard accuracy score.
        minimum: 0.0
        maximum: 1.0
      confusion_matrix:
        type: array
        description: 2x2 confusion matrix [[TN, FP], [FN, TP]].
        items:
          type: array
          items:
            type: integer
        minItems: 2
        maxItems: 2
      f1_score:
        type: number
        description: F1 score (harmonic mean of precision and recall).
        minimum: 0.0
        maximum: 1.0
      recall:
        type: number
        description: True Positive Rate (Sensitivity).
        minimum: 0.0
        maximum: 1.0
      precision:
        type: number
        description: Positive Predictive Value.
        minimum: 0.0
        maximum: 1.0

  permutation_test_results:
    type: object
    description: Results from the permutation testing to assess significance.
    required:
      - observed_score
      - null_distribution_mean
      - null_distribution_std
      - p_value
      - n_permutations
    properties:
      observed_score:
        type: number
        description: The balanced accuracy of the trained model on real data.
      null_distribution_mean:
        type: number
        description: Mean of the balanced accuracy scores from permuted labels.
      null_distribution_std:
        type: number
        description: Standard deviation of the null distribution.
      p_value:
        type: number
        description: Empirical p-value (fraction of permuted scores >= observed score).
      n_permutations:
        type: integer
        description: Total number of permutations performed.
        minimum: 1000

  feature_correlations:
    type: object
    description: Correlations between metabolites and resistance labels with FDR correction.
    properties:
      top_correlations:
        type: array
        description: List of top significant metabolite correlations.
        items:
          type: object
          properties:
            metabolite_name:
              type: string
            inchikey:
              type: string
              description: InChIKey for the metabolite.
            correlation_coefficient:
              type: number
            p_value_raw:
              type: number
            p_value_fdr:
              type: number
              description: Benjamini-Hochberg FDR corrected p-value.
            significant:
              type: boolean
              description: True if p_value_fdr <= 0.05.

  shap_analysis:
    type: object
    description: SHAP (SHapley Additive exPlanations) analysis results.
    required:
      - top_features
      - summary_stats
    properties:
      top_features:
        type: array
        description: Top N features ranked by mean absolute SHAP value.
        items:
          type: object
          properties:
            feature_name:
              type: string
            mean_abs_shap:
              type: number
              description: Mean absolute SHAP value indicating importance.
            mean_shap:
              type: number
              description: Mean SHAP value indicating direction (positive/negative impact).
            shap_interaction:
              type: array
              description: Optional interaction effects if calculated.
              items:
                type: object
      summary_stats:
        type: object
        description: Aggregate statistics for SHAP values.
        properties:
          global_mean_abs_shap:
            type: number
          feature_count:
            type: integer

  collinearity_diagnostics:
    type: object
    description: Variance Inflation Factor (VIF) diagnostics for top features.
    properties:
      vif_scores:
        type: array
        description: VIF score for each top feature.
        items:
          type: object
          properties:
            feature_name:
              type: string
            vif_value:
              type: number
            is_high_collinearity:
              type: boolean
              description: True if VIF > 5.0.

  learning_curve_data:
    type: object
    description: Data points for the learning curve analysis.
    properties:
      train_sizes:
        type: array
        items:
          type: number
      train_scores_mean:
        type: array
        items:
          type: number
      train_scores_std:
        type: array
        items:
          type: number
      test_scores_mean:
        type: array
        items:
          type: number
      test_scores_std:
        type: array
        items:
          type: number

oneOf:
  - $ref: "#/definitions/metrics_json"
  - $ref: "#/definitions/shap_analysis_json"

# Structure for results/metrics.json
metrics_json:
  type: object
  required:
    - model_metrics
    - permutation_test
  properties:
    metadata:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        random_seed:
          type: integer
        dataset_id:
          type: string
        model_type:
          type: string
          enum: ["RandomForest"]
    model_metrics:
      $ref: "#/definitions/model_metrics"
    permutation_test:
      $ref: "#/definitions/permutation_test_results"
    feature_correlations:
      $ref: "#/definitions/feature_correlations"
    collinearity_diagnostics:
      $ref: "#/definitions/collinearity_diagnostics"
    learning_curve:
      $ref: "#/definitions/learning_curve_data"
    sensitivity_analysis:
      type: object
      description: Results from sensitivity analysis sweeping decision cutoffs.
      properties:
        cutoffs:
          type: array
          items:
            type: number
        fp_rates:
          type: array
          items:
            type: number
        fn_rates:
          type: array
          items:
            type: number

# Structure for results/shap_analysis.json
shap_analysis_json:
  type: object
  required:
    - shap_values
    - top_features
  properties:
    metadata:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        model_type:
          type: string
    shap_values:
      type: object
      description: Aggregated SHAP value summaries (e.g., mean, std) per feature.
      properties:
        mean_abs:
          type: object
          additionalProperties:
            type: number
        mean:
          type: object
          additionalProperties:
            type: number
    top_features:
      $ref: "#/definitions/shap_analysis/properties/top_features"
    pathway_mapping:
      type: array
      description: Pathway mapping for top features (if available).
      items:
        type: object
        properties:
          feature_name:
            type: string
          inchikey:
            type: string
          pathways:
            type: array
            items:
              type: string
              description: Pathway names (KEGG/MetaCyc).
          biological_note:
            type: string
            description: Brief note on biological plausibility (e.g., "Phytoalexin precursor").
    visualization_data:
      type: object
      description: Data prepared for plotting (e.g., bar charts).
      properties:
        feature_names:
          type: array
          items:
            type: string
        shap_importance:
          type: array
          items:
            type: number