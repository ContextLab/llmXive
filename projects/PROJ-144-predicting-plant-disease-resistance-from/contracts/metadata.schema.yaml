$schema: "http://json-schema.org/draft-07/schema#"
title: "Metabolomics Metadata Schema"
type: "object"
$defs:
  MetaboliteProfile:
    type: "object"
    properties:
      sample_id:
        type: "string"
      InChIKey:
        type: "string"
      normalized_intensity:
        type: "number"
      study_id:
        type: "string"
    required:
      - "sample_id"
      - "InChIKey"
      - "normalized_intensity"
  ResistanceLabel:
    type: "object"
    properties:
      germplasm_id:
        type: "string"
      assay_score:
        type: "number"
      measurement_method:
        type: "string"
      harmonized_score:
        type: "number"
    required:
      - "germplasm_id"
      - "assay_score"
      - "harmonized_score"
properties:
  metabolite_profile:
    $ref: "#/$defs/MetaboliteProfile"
  resistance_label:
    $ref: "#/$defs/ResistanceLabel"
required:
  - "metabolite_profile"
  - "resistance_label"
