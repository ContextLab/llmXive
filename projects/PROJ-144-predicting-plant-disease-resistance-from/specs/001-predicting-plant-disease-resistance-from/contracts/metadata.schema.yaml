$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Metadata Schema"
description: "Schema for model performance metrics and diagnostics."
type: object
properties:
  metrics:
    type: object
    description: "Performance metrics on hold-out set."
    properties:
      balanced_accuracy:
        type: number
        minimum: 0
        maximum: 1
        description: "Balanced accuracy score."
      roc_auc:
        type: number
        minimum: 0
        maximum: 1
        description: "ROC-AUC score."
      permutation_p_value:
        type: number
        minimum: 0
        maximum: 1
        description: "Significance against null distribution."
      fdr_threshold:
        type: number
        const: 0.05
        description: "Benjamini-Hochberg FDR threshold."
    required:
      - balanced_accuracy
      - roc_auc
      - permutation_p_value
      - fdr_threshold
  diagnostics:
    type: object
    description: "Collinearity and sensitivity diagnostics."
    properties:
      vif_scores:
        type: object
        description: "Variance Inflation Factor for each metabolite."
        additionalProperties:
          type: number
          minimum: 1
      correlation_analysis:
        type: object
        description: "Correlation results with FDR correction."
        properties:
          threshold_r:
            type: number
            const: 0.4
          threshold_p:
            type: number
            const: 0.01
          fdr_corrected:
            type: boolean
            const: true
        required:
          - threshold_r
          - threshold_p
          - fdr_corrected
      sensitivity_analysis:
        type: object
        description: "False-positive/false-negative rates at different cutoffs."
        properties:
          diff_0_01:
            type: object
            properties:
              false_positive_rate:
                type: number
              false_negative_rate:
                type: number
          diff_0_05:
            type: object
            properties:
              false_positive_rate:
                type: number
              false_negative_rate:
                type: number
          diff_0_10:
            type: object
            properties:
              false_positive_rate:
                type: number
              false_negative_rate:
                type: number
        required:
          - diff_0_01
          - diff_0_05
          - diff_0_10
    required:
      - vif_scores
      - correlation_analysis
      - sensitivity_analysis
required:
  - metrics
  - diagnostics
additionalProperties: false