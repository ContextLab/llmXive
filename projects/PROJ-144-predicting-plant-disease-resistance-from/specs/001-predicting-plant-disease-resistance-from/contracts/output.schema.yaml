$schema: "http://json-schema.org/draft-07/schema#"
title: "Pathway Analysis Output Schema"
description: "Schema for pathway mapping and visualization data."
type: object
properties:
  top_metabolites:
    type: array
    description: "Top 10 metabolites by feature importance."
    items:
      type: object
      properties:
        inchikey:
          type: string
          description: "InChIKey of the metabolite."
        importance_score:
          type: number
          minimum: 0
        pathways:
          type: array
          description: "List of mapped pathways."
          items:
            type: object
            properties:
              pathway_id:
                type: string
                description: "KEGG or MetaCyc pathway ID."
              pathway_name:
                type: string
                description: "Human-readable pathway name."
              reference:
                type: string
                description: "Literature reference or database URL."
            required:
              - pathway_id
              - pathway_name
        vif_score:
          type: number
          minimum: 1
          description: "VIF score for collinearity check."
      required:
        - inchikey
        - importance_score
        - pathways
        - vif_score
  visualization:
    type: object
    description: "Visualization metadata."
    properties:
      plot_path:
        type: string
        const: "results/plots/pathway_barplot.png"
        description: "Path to the generated bar plot."
      data_source:
        type: string
        const: "results/pathway_analysis.json"
        description: "Source data file for the plot."
    required:
      - plot_path
      - data_source
  framing:
    type: string
    const: "associational"
    description: "Explicit statement that findings are associational, not causal."
required:
  - top_metabolites
  - visualization
  - framing
additionalProperties: false