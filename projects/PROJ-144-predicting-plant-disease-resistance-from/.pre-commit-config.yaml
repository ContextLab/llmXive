# Pre-commit configuration for llmXive project
# Enforces code quality, formatting, and linting standards
# Run 'pre-commit install' after adding this file to enable hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Ensure files end with a newline
      - id: check-yaml
        name: Validate YAML syntax
      - id: check-json
        name: Validate JSON syntax
      - id: check-merge-conflict
        name: Check for merge conflict markers
      - id: debug-statements
        name: Check for debug statements (print, pdb)

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        name: Format Python code (Black)
        language_version: python3.11

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Lint Python code (Flake8)
        args:
          - --max-line-length=88
          - --extend-ignore=E203
          - --exclude=venv,.git,__pycache__,build,dist
        additional_dependencies:
          - flake8-docstrings>=1.7.0
          - flake8-bandit>=4.1.1

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports (isort)
        args:
          - --profile=black
          - --line-length=88

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
      - id: pyupgrade
        name: Upgrade syntax for newer Python versions
        args:
          - --py311-plus

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        name: Security lint (Bandit)
        args:
          - --exclude=tests/
          - --skip=B101
        additional_dependencies:
          - bandit[toml]