access_python: "import datetime, json\nfrom pycoingecko import CoinGeckoAPI\ncg =\
  \ CoinGeckoAPI()\ndef fetch(coin_id, symbol):\n    # last 30 days of daily data\
  \ (CoinGecko returns hourly data for <90 days)\n    data = cg.get_coin_market_chart_by_id(id=coin_id,\
  \ vs_currency='usd', days=30)\n    prices = data.get('prices', [])\n    volumes\
  \ = data.get('total_volumes', [])\n    # Align by timestamp index (both lists have\
  \ same length and order)\n    records = []\n    for (ts_price, price), (ts_vol,\
  \ vol) in zip(prices, volumes):\n        # Convert timestamp (ms) to date string\n\
  \        dt = datetime.datetime.utcfromtimestamp(ts_price/1000).strftime('%Y-%m-%d')\n\
  \        records.append({\n            'date': dt,\n            'close': price,\n\
  \            'volume': vol,\n            'asset': symbol\n        })\n    return\
  \ records\nbtc = fetch('bitcoin', 'BTC')\neth = fetch('ethereum', 'ETH')\nall_records\
  \ = btc + eth\nprint(f\"RECORDS={len(all_records)}\")\nprint(\"FIELDS=date,close,volume,asset\"\
  )"
