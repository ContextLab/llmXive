access_python: "import datetime\nfrom pycoingecko import CoinGeckoAPI\n\ncg = CoinGeckoAPI()\n\
  \ndef fetch(symbol, coin_id):\n    market = cg.get_coin_market_chart_by_id(id=coin_id,\
  \ vs_currency='usd', days='365', interval='daily')\n    records = []\n    for price_entry,\
  \ vol_entry in zip(market['prices'], market['total_volumes']):\n        ts = price_entry[0]\
  \  # timestamp in ms\n        price = price_entry[1]\n        volume = vol_entry[1]\n\
  \        date = datetime.datetime.utcfromtimestamp(ts / 1000).date()\n        records.append({\n\
  \            'date': str(date),\n            'open': price,\n            'high':\
  \ price,\n            'low': price,\n            'close': price,\n            'volume':\
  \ volume,\n            'symbol': symbol.upper()\n        })\n    return records\n\
  \nbtc = fetch('btc', 'bitcoin')\neth = fetch('eth', 'ethereum')\ncombined = btc\
  \ + eth\n\nprint(f\"RECORDS={len(combined)}\")\nif combined:\n    print(\"FIELDS=\"\
  \ + \",\".join(combined[0].keys()))"
