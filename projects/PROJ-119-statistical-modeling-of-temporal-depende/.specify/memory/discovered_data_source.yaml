access_python: "from pycoingecko import CoinGeckoAPI\nimport time, datetime\n\ncg\
  \ = CoinGeckoAPI()\n# time range: last 30 days\nend_ts = int(time.time())\nstart_ts\
  \ = end_ts - 30 * 24 * 60 * 60\n\ncoins = [\"bitcoin\", \"ethereum\"]\nrecords =\
  \ []\nfor coin in coins:\n    # OHLC data (open, high, low, close) \u2013 returns\
  \ list of [timestamp, o, h, l, c]\n    ohlc = cg.get_coin_ohlc_by_id(id=coin, vs_currency=\"\
  usd\", days=30)\n    daily = {}\n    for ts, o, h, l, c in ohlc:\n        d = datetime.datetime.utcfromtimestamp(ts\
  \ / 1000).date().isoformat()\n        daily[d] = {\"date\": d, \"open\": o, \"high\"\
  : h, \"low\": l, \"close\": c}\n    # Volume data \u2013 list of [timestamp, volume]\n\
  \    vol_data = cg.get_coin_market_chart_range_by_id(\n        id=coin, vs_currency=\"\
  usd\", from_timestamp=start_ts, to_timestamp=end_ts\n    )\n    for ts, v in vol_data.get(\"\
  total_volumes\", []):\n        d = datetime.datetime.utcfromtimestamp(ts / 1000).date().isoformat()\n\
  \        if d in daily:\n            daily[d][\"volume\"] = v\n    # keep only days\
  \ where volume was merged\n    for rec in daily.values():\n        if \"volume\"\
  \ in rec:\n            records.append(rec)\n\nprint(f\"RECORDS={len(records)}\"\
  )\nprint(\"FIELDS=date,open,high,low,close,volume\")"
