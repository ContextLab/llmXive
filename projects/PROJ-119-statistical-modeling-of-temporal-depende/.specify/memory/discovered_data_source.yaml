  \ 'usd', 30)\n    # Volume data (timestamp in ms, volume)\n    vol_data = cg.get_coin_market_chart_by_id(symbol,\
  \ 'usd', 30)['total_volumes']\n    out = {}\n    for ts, o, h, l, c in ohlc:\n \
  \       date = datetime.utcfromtimestamp(ts/1000).date().isoformat()\n        out[date]\
  \ = {'open': o, 'high': h, 'low': l, 'close': c}\n    for ts, v in vol_data:\n \
  \       date = datetime.utcfromtimestamp(ts/1000).date().isoformat()\n        if\
  \ date in out:\n            out[date]['volume'] = v\n    return out\n\nbtc = fetch('bitcoin')\n\
  eth = fetch('ethereum')\nrecords = []\nfor date in sorted(set(btc) & set(eth)):\n\
  \    rec = {\n        'date': date,\n        'btc_open': btc[date]['open'],\n  \
  \      'btc_high': btc[date]['high'],\n        'btc_low': btc[date]['low'],\n  \
  \      'btc_close': btc[date]['close'],\n        'btc_volume': btc[date].get('volume'),\n\
  \        'eth_open': eth[date]['open'],\n        'eth_high': eth[date]['high'],\n\
  \        'eth_low': eth[date]['low'],\n        'eth_close': eth[date]['close'],\n\
  \        'eth_volume': eth[date].get('volume')\n    }\n    records.append(rec)\n\
  print(f\"RECORDS={len(records)}\")\nprint(\"FIELDS=date,btc_open,btc_high,btc_low,btc_close,btc_volume,eth_open,eth_high,eth_low,eth_close,eth_volume\"\
  )"
