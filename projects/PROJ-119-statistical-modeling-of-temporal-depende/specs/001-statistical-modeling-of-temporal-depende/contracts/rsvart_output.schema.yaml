$schema: "http://json-schema.org/draft-07/schema#"
title: "RS‑VAR model output per regime"
type: object
required: [regime, lag, coef_matrix, cov_matrix, autocorr_btc, autocorr_eth, cross_corr_resid]
properties:
  regime:
    type: integer
  lag:
    type: integer
    minimum: 1
  coef_matrix:
    type: array
    items:
      type: array
      items:
        type: number
  cov_matrix:
    type: array
    items:
      type: array
      items:
        type: number
  autocorr_btc:
    type: number
  autocorr_eth:
    type: number
  cross_corr_resid:
    type: number
additionalProperties: false
