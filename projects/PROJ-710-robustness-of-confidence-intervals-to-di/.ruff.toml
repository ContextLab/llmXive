# This file is a duplicate of the configuration in pyproject.toml
# for tools that do not yet support pyproject.toml for Ruff.
line-length = 88
target-version = "py39"
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
]
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
]
