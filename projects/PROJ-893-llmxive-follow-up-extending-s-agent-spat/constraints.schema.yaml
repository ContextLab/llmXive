$schema: http://json-schema.org/draft-07/schema#
$id: https://llmxive.org/schemas/constraints
title: "Spatial Constraints Schema"
description: "Schema for validated spatial constraints extracted from scenes."
type: "object"
required:
  - scene_id
  - constraints
  - status
properties:
  scene_id:
    type: "string"
    description: "Unique identifier for the scene."
  constraints:
    type: "array"
    description: "List of spatial constraints for the scene."
    items:
      type: "object"
      required:
        - type
        - a
        - b
      properties:
        type:
          type: "string"
          description: "Type of constraint (e.g., 'left_of', 'above', 'inside')."
        a:
          type: "string"
          description: "Identifier of the first object."
        b:
          type: "string"
          description: "Identifier of the second object."
      additionalProperties: false
  status:
    type: "string"
    enum:
      - "valid"
      - "ambiguous"
      - "no_solution"
    description: "Validation status of the constraints."
additionalProperties: false
