$schema: http://json-schema.org/draft-07/schema#
title: CSP Solver Output Schema
description: >-
  Schema for the output generated by the symbolic CSP solver. This includes
  the predicted answer, the solver status, and timing information.
type: object
required:
  - scene_id
  - prediction
  - status
  - solver_latency_ms
properties:
  scene_id:
    type: string
    description: The ID of the scene being solved.
  prediction:
    oneOf:
      - type: integer
      - type: string
      - type: boolean
      - type: "null"
    description: The solution found by the CSP solver. Null if no solution exists.
  status:
    type: string
    enum:
      - solved
      - no_solution
      - timeout
      - error
    description: The outcome of the constraint satisfaction process.
  solver_latency_ms:
    type: number
    minimum: 0
    description: Time taken to solve the constraints in milliseconds.
  constraint_count:
    type: integer
    minimum: 0
    description: Number of constraints passed to the solver.
  variable_count:
    type: integer
    minimum: 0
    description: Number of variables in the CSP.
  error_message:
    type: string
    description: Error details if status is 'error'.
additionalProperties: false
