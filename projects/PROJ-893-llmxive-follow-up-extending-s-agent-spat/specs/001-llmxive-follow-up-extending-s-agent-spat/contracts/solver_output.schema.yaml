$schema: "http://json-schema.org/draft-07/schema#"
title: CSP Solver Output Schema
description: Schema for the output generated by the symbolic CSP solver for each scene.
type: object
required:
  - scene_id
  - solver_status
  - timestamp
properties:
  scene_id:
    type: string
    description: The scene_id corresponding to the input constraints.
    pattern: "^scene_\\d+$"
  solver_status:
    type: string
    enum: ["solved", "no_solution", "timeout", "error"]
    description: The final status of the constraint satisfaction problem.
  solution:
    type: object
    nullable: true
    description: The valid assignment of variables if solved, null otherwise.
    properties:
      assignments:
        type: array
        description: List of variable assignments.
        items:
          type: object
          required:
            - variable
            - value
          properties:
            variable:
              type: string
              description: Name of the variable (e.g., "obj_1_position").
            value:
              type: object
              description: The assigned value (coordinates, object type, etc.).
              properties:
                x:
                  type: number
                y:
                  type: number
                z:
                  type: number
                rotation:
                  type: number
  error_details:
    type: object
    nullable: true
    description: Details if the solver encountered an error or timeout.
    properties:
      message:
        type: string
      code:
        type: string
        enum: ["TIMEOUT", "CONSTRAINT_CONFLICT", "PARSE_ERROR", "UNKNOWN"]
  latency_ms:
    type: number
    minimum: 0
    description: Time taken to solve the problem in milliseconds.
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the solving process completed.
