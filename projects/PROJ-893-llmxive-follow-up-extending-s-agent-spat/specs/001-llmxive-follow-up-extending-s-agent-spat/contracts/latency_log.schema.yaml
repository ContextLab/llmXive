$schema: "http://json-schema.org/draft-07/schema#"
title: Latency Log Schema
description: Schema for the per-scene latency logs generated during solver execution.
type: object
required:
  - scene_id
  - start_time
  - end_time
  - duration_ms
  - status
properties:
  scene_id:
    type: string
    pattern: "^scene_\\d+$"
  start_time:
    type: string
    format: date-time
    description: ISO 8601 timestamp when processing started.
  end_time:
    type: string
    format: date-time
    description: ISO 8601 timestamp when processing ended.
  duration_ms:
    type: number
    minimum: 0
    description: Total processing time in milliseconds.
  status:
    type: string
    enum: ["success", "timeout", "error", "skipped"]
  error_message:
    type: string
    nullable: true
    description: Error message if status is not 'success'.
  cpu_usage_percent:
    type: number
    minimum: 0
    maximum: 100
    nullable: true
    description: Peak CPU usage during the operation (optional).
  memory_usage_mb:
    type: number
    minimum: 0
    nullable: true
    description: Peak memory usage in MB (optional).
  constraints_loaded:
    type: boolean
    description: Whether the constraints were successfully loaded for this scene.
  solver_engine:
    type: string
    description: Name/version of the solver engine used (e.g., "python-constraint-1.4.4").
  hardware_info:
    type: object
    nullable: true
    properties:
      cpu_model:
        type: string
      num_cores:
        type: integer
      platform:
        type: string