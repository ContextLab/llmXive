$schema: http://json-schema.org/draft-07/schema#
title: Benchmark Result
description: Schema for the benchmark results CSV generated by T019b.
type: object
required:
  - scene_id
  - symbolic_pred
  - vlm_pred
  - ground_truth
  - exact_match
  - f1
  - latency_ms
  - status
  - p_value
properties:
  scene_id:
    type: string
    description: Unique identifier for the scene.
  symbolic_pred:
    type: string
    description: Prediction made by the symbolic CSP solver.
  vlm_pred:
    type: string
    description: Prediction made by the VLM baseline.
  ground_truth:
    type: string
    description: Ground truth label for the scene.
  exact_match:
    type: ["integer", "null"]
    description: 1 if symbolic_pred matches ground_truth, 0 otherwise. Null if data missing.
  f1:
    type: ["number", "null"]
    description: F1 score (0.0 or 1.0 for binary exact match). Null if data missing.
  latency_ms:
    type: number
    description: Execution time in milliseconds.
  status:
    type: string
    description: Status of the solver run (e.g., Success, No Solution, Timeout).
  p_value:
    type: ["number", "null"]
    description: McNemar's test p-value comparing symbolic vs VLM accuracy.
additionalProperties: false