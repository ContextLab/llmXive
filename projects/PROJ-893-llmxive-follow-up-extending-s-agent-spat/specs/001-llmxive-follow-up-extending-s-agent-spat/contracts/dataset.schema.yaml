$schema: "http://json-schema.org/draft-07/schema#"
title: S-Agent-300K Dataset Schema
description: Schema for the raw and extracted scene data from the S-Agent-300K dataset used in spatial reasoning tasks.
type: object
required:
  - scene_id
  - metadata
  - geometry
properties:
  scene_id:
    type: string
    description: Unique identifier for the scene (e.g., "scene_00123").
    pattern: "^scene_\\d+$"
  metadata:
    type: object
    required:
      - source
      - timestamp
      - difficulty_level
    properties:
      source:
        type: string
        enum: ["S-Agent-300K", "Generated-Subset"]
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of data creation or extraction.
      difficulty_level:
        type: string
        enum: ["easy", "medium", "hard"]
        description: Difficulty rating of the spatial reasoning task.
      object_count:
        type: integer
        minimum: 0
        description: Number of objects in the scene.
      grid_size:
        type: object
        required:
          - x
          - y
          - z
        properties:
          x:
            type: integer
            minimum: 1
          y:
            type: integer
            minimum: 1
          z:
            type: integer
            minimum: 1
        description: Dimensions of the 3D grid.
  geometry:
    type: array
    description: List of objects in the scene with their spatial properties.
    items:
      type: object
      required:
        - object_id
        - type
        - position
        - dimensions
      properties:
        object_id:
          type: string
          description: Unique identifier for the object within the scene.
        type:
          type: string
          enum: ["box", "sphere", "cylinder", "wall", "floor", "ceiling"]
          description: Type of the geometric object.
        position:
          type: object
          required:
            - x
            - y
            - z
          properties:
            x:
              type: number
              format: float
            y:
              type: number
              format: float
            z:
              type: number
              format: float
          description: Center position (x, y, z) in grid coordinates.
        dimensions:
          type: object
          required:
            - width
            - height
            - depth
          properties:
            width:
              type: number
              format: float
              minimum: 0
            height:
              type: number
              format: float
              minimum: 0
            depth:
              type: number
              format: float
              minimum: 0
          description: Dimensions (width, height, depth) of the object.
        rotation:
          type: object
          required:
            - roll
            - pitch
            - yaw
          properties:
            roll:
              type: number
              format: float
            pitch:
              type: number
              format: float
            yaw:
              type: number
              format: float
          description: Rotation angles in radians.
  constraints:
    type: array
    description: Explicit spatial constraints defined for the scene (optional, may be empty).
    items:
      type: object
      required:
        - constraint_id
        - type
        - parameters
      properties:
        constraint_id:
          type: string
        type:
          type: string
          enum: ["adjacency", "containment", "alignment", "distance", "non_overlap"]
        parameters:
          type: object
          description: Constraint-specific parameters (e.g., object IDs, distance thresholds).
