$schema: "http://json-schema.org/draft-07/schema#"
title: "Output Artifacts Schema"
description: "Schema for model outputs and metrics"
type: object
required:
  - feature_matrix
  - model_metrics
properties:
  feature_matrix:
    type: object
    description: "Matrix of extracted features"
    properties:
      shape:
        type: array
        items:
          type: integer
      columns:
        type: array
        items:
          type: string
      data:
        type: array
        items:
          type: array
          items:
            type: number
  model_metrics:
    type: object
    description: "Model performance metrics"
    properties:
      r2:
        type: number
      mse:
        type: number
      coefficients:
        type: array
        items:
          type: number
      p_values:
        type: array
        items:
          type: number
additionalProperties: false