%YAML 1.2
---
# Output Schema Definitions for Neural Oscillations TDCS Biomarker Project
# Defines the structure of output artifacts generated by the pipeline.
# Matches plan.md output artifacts strictly.

schema_version: "1.0.0"
project_id: "PROJ-164-neural-oscillations-as-a-biomarker-for-p"

artifacts:
  feature_matrix:
    description: >
      CSV file containing the assembled feature matrix with spectral power
      and connectivity metrics for each subject. Used as input for modeling.
    file_path: "data/processed/feature_matrix.csv"
    format: "CSV"
    delimiter: ","
    encoding: "UTF-8"
    fields:
      - name: subject_id
        type: string
        description: Unique identifier for the subject
        required: true
      - name: channel
        type: string
        description: EEG channel name (e.g., C3, C4, Cz)
        required: true
      - name: delta_power
        type: float
        description: Mean spectral power in delta band (1-4 Hz)
        required: true
      - name: theta_power
        type: float
        description: Mean spectral power in theta band (4-8 Hz)
        required: true
      - name: alpha_power
        type: float
        description: Mean spectral power in alpha band (8-13 Hz)
        required: true
      - name: beta_power
        type: float
        description: Mean spectral power in beta band (13-30 Hz)
        required: true
      - name: gamma_power
        type: float
        description: Mean spectral power in gamma band (30-45 Hz)
        required: true
      - name: plv_c3_c4
        type: float
        description: Phase Locking Value between C3 and C4
        required: false
      - name: plv_c3_cz
        type: float
        description: Phase Locking Value between C3 and Cz
        required: false
      - name: plv_c4_cz
        type: float
        description: Phase Locking Value between C4 and Cz
        required: false
      - name: wpli_c3_c4
        type: float
        description: Weighted Phase Lag Index between C3 and C4
        required: false
      - name: wpli_c3_cz
        type: float
        description: Weighted Phase Lag Index between C3 and Cz
        required: false
      - name: wpli_c4_cz
        type: float
        description: Weighted Phase Lag Index between C4 and Cz
        required: false
      - name: tDCS_response
        type: float
        description: Continuous measure of tDCS response (target variable)
        required: true
    
  model_metrics:
    description: >
      JSON file containing model performance metrics, coefficients, and
      validation results from the Ridge or Rank-Ridge regression.
    file_path: "models/model_metrics.json"
    format: "JSON"
    encoding: "UTF-8"
    structure:
      type: object
      properties:
        model_type:
          type: string
          description: "Either 'Ridge' or 'Rank-Ridge' based on normality check"
          required: true
        best_alpha:
          type: float
          description: Best regularization parameter found during cross-validation
          required: true
        r_squared_cv:
          type: float
          description: R² score from cross-validation
          required: true
        rmse_cv:
          type: float
          description: Root Mean Squared Error from cross-validation
          required: true
        coefficients:
          type: object
          description: Mapping of feature names to their regression coefficients
          required: true
        feature_importance:
          type: object
          description: Normalized importance scores for each feature
          required: true
        cv_results:
          type: object
          description: Detailed cross-validation results (mean/std of scores)
          required: true
        normality_test:
          type: object
          description: Results of Shapiro-Wilk test on target variable
          properties:
            statistic:
              type: float
            p_value:
              type: float
            is_normal:
              type: boolean
          required: true
        timestamp:
          type: string
          description: ISO 8601 timestamp of model training
          required: true
        mode_flag:
          type: string
          description: "Primary, Data Insufficient, or Underpowered"
          required: true
        
# Note: Fields not explicitly defined in plan.md (e.g., sensitivity_table)
# are intentionally excluded from this schema as per task requirements.
# Sensitivity analysis outputs are handled in separate artifacts (T035).