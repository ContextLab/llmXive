$schema: "http://json-schema.org/draft-07/schema#"
title: "Neural Oscillations TDCS Biomarker Dataset Schema"
description: |
  Base data schema for EEG and tDCS paired dataset.
  Strictly defined fields based on spec.md data model.
  Excludes non-specified fields such as 'mode_flag'.
type: object
required:
  - subject_id
  - channel
  - time
  - voltage
  - condition
properties:
  subject_id:
    type: string
    description: "Unique identifier for the subject (e.g., 'sub-001')"
    pattern: "^sub-\\d+$"
  channel:
    type: string
    description: "EEG channel name (e.g., 'C3', 'C4', 'Cz')"
  time:
    type: number
    description: "Time point in seconds relative to epoch start"
    minimum: 0
  voltage:
    type: number
    description: "Voltage measurement in microvolts (µV)"
  condition:
    type: string
    description: "Experimental condition label (e.g., 'anodal', 'cathodal', 'sham')"
    enum:
      - "anodal"
      - "cathodal"
      - "sham"
      - "baseline"
additionalProperties: false
metadata:
  version: "1.0.0"
  source: "spec.md data model"
  last_updated: "2023-10-27"