$schema: "http://json-schema.org/draft-07/schema#"
title: "Neural Oscillations EEG Dataset Schema"
description: "Base data schema for EEG + tDCS paired dataset. Fields strictly match the spec data model."
type: object
properties:
  subject_id:
    type: string
    description: "Unique identifier for the subject/participant."
  channel:
    type: string
    description: "EEG channel name (e.g., 'C3', 'Cz', 'C4')."
  time:
    type: number
    format: float
    description: "Time point in seconds relative to epoch start."
  voltage:
    type: number
    format: float
    description: "Voltage amplitude in microvolts (µV)."
  condition:
    type: string
    description: "Experimental condition label (e.g., 'sham', 'anodal', 'cathodal')."
required:
  - subject_id
  - channel
  - time
  - voltage
  - condition
additionalProperties: false