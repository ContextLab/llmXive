$schema: "http://json-schema.org/draft-07/schema#"
title: "Neural Oscillations Dataset Schema"
description: "Schema for EEG + tDCS paired dataset"
type: object
required:
  - subject_id
  - channel
  - time
  - voltage
  - condition
properties:
  subject_id:
    type: string
    description: "Unique identifier for the subject"
  channel:
    type: string
    description: "EEG channel name (e.g., C3, C4, Cz)"
  time:
    type: number
    description: "Time in seconds relative to event onset"
  voltage:
    type: number
    description: "Voltage in microvolts (uV)"
  condition:
    type: string
    description: "Experimental condition (e.g., sham, active)"
additionalProperties: false
