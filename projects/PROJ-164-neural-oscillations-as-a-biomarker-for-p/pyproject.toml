[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-oscillations-tDCS-biomarker"
version = "0.1.0"
description = "Neural Oscillations as a Biomarker for Predicting Response to Transcranial Direct Current Stimulation"
requires-python = ">=3.11"
dependencies = [
    "mne==1.7.0",
    "scikit-learn==1.4.0",
    "numpy==1.26.0",
    "pandas==2.1.0",
    "scipy==1.12.0",
    "statsmodels==0.14.1",
    "pyyaml==6.0.1",
    "pytest==7.4.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | models
    | state
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    "data/",
    "models/",
    "state/",
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"