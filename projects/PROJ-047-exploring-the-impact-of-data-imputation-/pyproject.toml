[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-047"
version = "0.1.0"
description = "Exploring the Impact of Data Imputation Methods on Causal Inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.0",
    "pandas==2.1.0",
    "scikit-learn==1.3.0",
    "statsmodels==0.14.0",
    "matplotlib==3.8.0",
    "seaborn==0.13.0",
    "pytest==7.4.0",
    "causalgraphicalmodels==0.0.1",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
  | docs
  | figures
  | state
  | specs
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["code"]
include = ["analysis*", "simulation*", "utils*"]
