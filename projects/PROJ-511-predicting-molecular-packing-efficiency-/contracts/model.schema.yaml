$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: Schema for the trained model metadata and configuration stored alongside the model artifact.
type: object
required:
  - model_type
  - architecture
  - hyperparameters
  - training_config
  - input_features
  - target_variable
properties:
  model_type:
    type: string
    description: Type of model used (e.g., "MLP").
    enum:
      - MLP
  architecture:
    type: object
    description: Description of the neural network architecture.
    required:
      - layers
      - activation
      - dropout
    properties:
      layers:
        type: array
        items:
          type: integer
        description: List of layer sizes (input, hidden, output).
      activation:
        type: string
        description: Activation function used in hidden layers.
      dropout:
        type: number
        description: Dropout rate applied to hidden layers.
  hyperparameters:
    type: object
    description: Hyperparameters used during training.
    required:
      - learning_rate
      - batch_size
      - optimizer
    properties:
      learning_rate:
        type: number
      batch_size:
        type: integer
      optimizer:
        type: string
      weight_decay:
        type: number
        default: 0
      epochs:
        type: integer
  training_config:
    type: object
    description: Configuration details of the training run.
    required:
      - seed
      - device
      - train_split
      - val_split
    properties:
      seed:
        type: integer
      device:
        type: string
        enum:
          - cpu
          - cuda
      train_split:
        type: number
        description: Fraction of data used for training.
      val_split:
        type: number
        description: Fraction of data used for validation.
  input_features:
    type: array
    description: List of feature names used as input to the model.
    items:
      type: string
  target_variable:
    type: string
    description: Name of the target variable being predicted.
  parameter_count:
    type: integer
    description: Total number of trainable parameters in the model.
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the model was trained.
  version:
    type: string
    description: Version of the model schema.
    default: "1.0.0"
