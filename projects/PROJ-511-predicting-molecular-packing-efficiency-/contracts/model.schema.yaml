$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: Schema for the trained model metadata and configuration stored alongside model.pt
type: object
required:
  - model_type
  - architecture
  - hyperparameters
  - training_config
  - feature_config
  - metrics
  - timestamp
  - version
properties:
  model_type:
    type: string
    description: Type of model (e.g., "mlp")
    enum:
      - mlp
  architecture:
    type: object
    description: Description of the neural network architecture
    required:
      - layers
      - activation
      - dropout
    properties:
      layers:
        type: array
        items:
          type: object
          required:
            - in_features
            - out_features
            - activation
          properties:
            in_features:
              type: integer
            out_features:
              type: integer
            activation:
              type: string
              enum:
                - ReLU
                - LeakyReLU
                - Tanh
                - None
      dropout_rate:
        type: number
        minimum: 0.0
        maximum: 1.0
  hyperparameters:
    type: object
    description: Training hyperparameters used
    required:
      - learning_rate
      - batch_size
      - epochs
      - optimizer
    properties:
      learning_rate:
        type: number
        minimum: 0.0
      batch_size:
        type: integer
        minimum: 1
      epochs:
        type: integer
        minimum: 1
      optimizer:
        type: string
      weight_decay:
        type: number
        minimum: 0.0
  training_config:
    type: object
    description: Configuration related to the training process
    required:
      - seed
      - device
      - train_split_ratio
      - val_split_ratio
    properties:
      seed:
        type: integer
      device:
        type: string
        enum:
          - cpu
          - cuda
      train_split_ratio:
        type: number
        minimum: 0.0
        maximum: 1.0
      val_split_ratio:
        type: number
        minimum: 0.0
        maximum: 1.0
  feature_config:
    type: object
    description: Configuration of input features
    required:
      - embedding_model
      - embedding_dim
      - descriptors
      - confounders
    properties:
      embedding_model:
        type: string
      embedding_dim:
        type: integer
      descriptors:
        type: array
        items:
          type: string
      confounders:
        type: array
        items:
          type: string
  metrics:
    type: object
    description: Final training metrics
    required:
      - train_loss
      - val_loss
      - best_val_loss
    properties:
      train_loss:
        type: number
      val_loss:
        type: number
      best_val_loss:
        type: number
      total_parameters:
        type: integer
        description: Total trainable parameters (must be <= 100k per FR-005)
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of model creation
  version:
    type: string
    description: Version string of the model (e.g., "1.0.0")
additionalProperties: false
