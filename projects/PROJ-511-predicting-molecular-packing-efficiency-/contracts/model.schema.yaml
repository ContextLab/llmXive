$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: Schema for the trained model checkpoint metadata and configuration.
type: object
required:
  - model_type
  - architecture
  - hyperparameters
  - training_metrics
  - feature_columns
  - target_column
  - timestamp
properties:
  model_type:
    type: string
    description: Type of model (e.g., 'baseline', 'control', 'upper_bound', 'baseline+physics')
    enum:
      - baseline
      - control
      - upper_bound
      - baseline+physics
  architecture:
    type: object
    description: Description of the neural network architecture.
    required:
      - type
      - layers
    properties:
      type:
        type: string
        enum:
          - MLP
      layers:
        type: array
        description: List of layer dimensions (including input and output).
        items:
          type: integer
        minItems: 2
      activation:
        type: string
        default: "ReLU"
      dropout:
        type: number
        minimum: 0
        maximum: 1
        default: 0.1
  hyperparameters:
    type: object
    description: Training hyperparameters used.
    required:
      - learning_rate
      - batch_size
      - epochs
      - optimizer
    properties:
      learning_rate:
        type: number
        minimum: 0
      batch_size:
        type: integer
        minimum: 1
      epochs:
        type: integer
        minimum: 1
      optimizer:
        type: string
        enum:
          - Adam
          - SGD
          - RMSprop
      weight_decay:
        type: number
        minimum: 0
        default: 0
  training_metrics:
    type: object
    description: Final training and validation metrics.
    required:
      - train_loss
      - val_loss
      - train_mae
      - val_mae
    properties:
      train_loss:
        type: number
      val_loss:
        type: number
      train_mae:
        type: number
        minimum: 0
      val_mae:
        type: number
        minimum: 0
      train_r2:
        type: number
      val_r2:
        type: number
  feature_columns:
    type: array
    description: List of feature names used for training.
    items:
      type: string
  target_column:
    type: string
    description: Name of the target variable (e.g., 'cape').
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the model was trained.
  seed:
    type: integer
    description: Random seed used for reproducibility.
  notes:
    type: string
    description: Optional notes about the training run.
