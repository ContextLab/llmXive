$schema: http://json-schema.org/draft-07/schema#
title: Molecular Packing Efficiency Dataset Schema
description: |
  Schema for the final dataset (data/dataset.csv) containing SMILES representations,
  packing coefficients (PC, CAPE), 3D descriptors, and confounder fields.
  This schema enforces data integrity and type safety for downstream ML pipelines.
type: object
required:
  - smiles
  - pc
  - cape
  - hbond_count
  - aromatic_ring_count
  - radius_of_gyration
  - asphericity
  - temperature
  - solvent_present
  - non_h_atom_count
  - source
properties:
  # Molecular Connectivity
  smiles:
    type: string
    description: Canonical SMILES string representing molecular connectivity.
    minLength: 1

  # Packing Metrics (Target & Diagnostic)
  pc:
    type: number
    description: Raw Packing Coefficient (diagnostic). Ratio of molecular volume to unit cell volume.
    minimum: 0.0
    maximum: 1.0

  cape:
    type: number
    description: Corrected Atomic Packing Efficiency (target). Adjusted for thermal motion and voids.
    minimum: 0.0
    maximum: 1.0

  # Physics-Derived Features (Pauling/Curie requirements)
  hbond_count:
    type: integer
    description: Total count of potential hydrogen bond donors and acceptors.
    minimum: 0

  aromatic_ring_count:
    type: integer
    description: Number of aromatic rings in the molecule.
    minimum: 0

  # 3D Descriptors (ETKDG generated conformers)
  radius_of_gyration:
    type: number
    description: Radius of gyration (Angstrom) calculated from 3D conformer.
    minimum: 0.0

  asphericity:
    type: number
    description: Asphericity descriptor (0=sphere, >0=elongated).
    minimum: 0.0

  # Thermodynamic Confounders
  temperature:
    type: number
    description: Data collection temperature in Kelvin.
    minimum: 0.0

  solvent_present:
    type: boolean
    description: Flag indicating if solvent molecules are present in the crystal structure.

  # Metadata & Quality Control
  non_h_atom_count:
    type: integer
    description: Count of non-hydrogen atoms (filtering criterion).
    minimum: 1

  source:
    type: string
    description: Source identifier (e.g., COD ID or dataset name).

additionalProperties: false
description: |
  This schema ensures that the dataset produced by T018 (add_3d_descriptors.py)
  and validated by T019 (validate_dataset.py) contains all necessary fields
  for the MLP training in US2. It explicitly includes fields mandated by
  reviewer feedback (Pauling: H-bonds, Curie: confounders, Franklin: source).