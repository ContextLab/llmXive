$schema: http://json-schema.org/draft-07/schema#
title: Molecular Packing Efficiency Dataset Schema
description: |
  Schema for the final dataset used in predicting molecular packing efficiency.
  Contains SMILES representations, packing metrics (PC, CAPE), 3D descriptors,
  and experimental confounders.
type: object
required:
  - cod_id
  - smiles
  - smiles_source
  - raw_packing_coefficient
  - cape
  - radius_of_gyration
  - asphericity
  - principal_moments
  - lattice_system
  - temperature_K
  - has_solvent
  - n_atoms
  - unit_cell_volume
properties:
  cod_id:
    type: string
    description: Unique identifier from the Crystallography Open Database.
    pattern: "^[0-9]+$"
  
  smiles:
    type: string
    description: Canonical SMILES string representing the molecular connectivity.
    minLength: 1
  
  smiles_source:
    type: string
    description: Source of the SMILES string.
    enum:
      - extracted_cif
      - generated_rdkit
  
  raw_packing_coefficient:
    type: number
    description: Raw Packing Coefficient calculated using Bondi radii.
    minimum: 0.0
    maximum: 1.0
  
  cape:
    type: number
    description: Corrected Accessible Packing Efficiency (target variable).
    minimum: 0.0
    maximum: 1.0
  
  radius_of_gyration:
    type: number
    description: Radius of gyration of the 3D conformer (Angstroms).
    minimum: 0.0
  
  asphericity:
    type: number
    description: Asphericity parameter describing the shape of the molecule (0 for sphere, 1 for rod).
    minimum: 0.0
    maximum: 1.0
  
  principal_moments:
    type: object
    description: Principal moments of inertia (I1, I2, I3).
    required:
      - i1
      - i2
      - i3
    properties:
      i1:
        type: number
        description: First principal moment of inertia.
      i2:
        type: number
        description: Second principal moment of inertia.
      i3:
        type: number
        description: Third principal moment of inertia.
  
  lattice_system:
    type: string
    description: Crystal lattice system extracted from space group.
    enum:
      - triclinic
      - monoclinic
      - orthorhombic
      - tetragonal
      - trigonal
      - hexagonal
      - cubic
  
  temperature_K:
    type: number
    description: Temperature at which the crystal structure was determined (Kelvin).
    minimum: 0.0
  
  has_solvent:
    type: boolean
    description: Whether the structure contains solvent molecules.
  
  n_atoms:
    type: integer
    description: Total number of non-hydrogen atoms in the molecule.
    minimum: 1
  
  unit_cell_volume:
    type: number
    description: Volume of the unit cell in cubic Angstroms.
    minimum: 0.0
additionalProperties: false