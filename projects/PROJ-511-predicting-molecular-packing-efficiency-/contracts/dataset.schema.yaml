$schema: http://json-schema.org/draft-07/schema#
title: Molecular Packing Efficiency Dataset Schema
description: >
  Schema for the final dataset (data/dataset.csv) containing SMILES representations,
  3D descriptors, packing metrics, and confounders for organic crystal structures.
  Used for training and validating the packing efficiency prediction model.
type: object
required:
  - properties
  - type
properties:
  cod_id:
    type: string
    description: Unique identifier from the Crystallography Open Database (COD).
    pattern: "^[0-9]+$"
  smiles:
    type: string
    description: Canonical SMILES string representing the molecular structure.
    minLength: 1
  smiles_source:
    type: string
    description: Source of the SMILES string.
    enum:
      - "extracted_from_cif"
      - "generated_from_geometry"
  unit_cell_volume:
    type: number
    description: Unit cell volume in cubic angstroms (Å³).
    minimum: 0
  n_atoms:
    type: integer
    description: Total number of non-hydrogen atoms in the asymmetric unit.
    minimum: 1
  lattice_system:
    type: string
    description: Crystal lattice system derived from symmetry information.
    enum:
      - "triclinic"
      - "monoclinic"
      - "orthorhombic"
      - "tetragonal"
      - "trigonal"
      - "hexagonal"
      - "cubic"
      - "unknown"
  temperature_K:
    type: number
    description: Temperature in Kelvin at which the crystal structure was determined.
    minimum: 0
  has_solvent:
    type: boolean
    description: Flag indicating if solvent molecules are present in the unit cell.
  radius_of_gyration:
    type: number
    description: Radius of gyration (Å) calculated from the gas-phase minimized conformer.
    minimum: 0
  asphericity:
    type: number
    description: Asphericity parameter (dimensionless) describing molecular shape anisotropy.
    minimum: 0
    maximum: 1
  principal_moments:
    type: string
    description: Comma-separated string of the three principal moments of inertia (amu·Å²).
    pattern: "^[0-9]+\\.[0-9]+,[0-9]+\\.[0-9]+,[0-9]+\\.[0-9]+$"
  cape:
    type: number
    description: Composition-Adjusted Packing Efficiency (CAPE). Target variable.
    minimum: 0
    maximum: 2
  raw_pc:
    type: number
    description: Raw Packing Coefficient (PC_raw). Diagnostic metric.
    minimum: 0
    maximum: 2
additionalProperties: false