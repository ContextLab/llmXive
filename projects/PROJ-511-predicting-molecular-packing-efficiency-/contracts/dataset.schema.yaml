$schema: http://json-schema.org/draft-07/schema#
title: Molecular Packing Efficiency Dataset Schema
description: |
  Schema for the final dataset (data/dataset.csv) containing SMILES representations,
  packing coefficients (CAPE and Raw PC), 3D molecular descriptors, and experimental confounders
  derived from organic crystal structures.
type: object
required:
  - cod_id
  - smiles
  - smiles_source
  - unit_cell_volume
  - n_atoms
  - lattice_system
  - temperature_K
  - has_solvent
  - radius_of_gyration
  - asphericity
  - principal_moments
  - cape
  - raw_pc
properties:
  cod_id:
    type: string
    pattern: '^[0-9]+$'
    description: Unique identifier from the Crystallography Open Database (COD).
  smiles:
    type: string
    description: Canonical SMILES string representing the molecular connectivity.
  smiles_source:
    type: string
    enum:
      - metadata
      - generated_3d
    description: |
      Indicates how the SMILES was obtained:
      - 'metadata': Extracted directly from CIF _chemical_structure_SMILES tag.
      - 'generated_3d': Generated from 3D atomic coordinates using RDKit.
  unit_cell_volume:
    type: number
    minimum: 0
    description: Unit cell volume in cubic Angstroms (Å³).
  n_atoms:
    type: integer
    minimum: 1
    description: Total number of non-hydrogen atoms in the asymmetric unit or formula unit.
  lattice_system:
    type: string
    description: Crystal lattice system (e.g., 'monoclinic', 'orthorhombic', 'triclinic').
  temperature_K:
    type: number
    minimum: 0
    description: Temperature at which the crystal structure was determined (Kelvin).
  has_solvent:
    type: boolean
    description: Flag indicating the presence of solvent molecules in the structure.
  radius_of_gyration:
    type: number
    minimum: 0
    description: Radius of gyration of the molecule in Angstroms, calculated from 3D coordinates.
  asphericity:
    type: number
    minimum: 0
    maximum: 1
    description: Asphericity parameter (0=spherical, 1=rod-like) derived from principal moments.
  principal_moments:
    type: string
    description: |
      Comma-separated string of the three principal moments of inertia (I1, I2, I3) in amu·Å².
      Example: "12.5,45.2,102.8"
  cape:
    type: number
    description: |
      Corrected Atomic Packing Efficiency (CAPE).
      Defined as PC_raw / (Sum(V_vdW) / N_atoms).
      Target variable for prediction.
  raw_pc:
    type: number
    description: |
      Raw Packing Coefficient (diagnostic).
      Defined as Unit-cell volume / Sum(V_vdW).
additionalProperties: false
examples:
  - cod_id: "1543210"
    smiles: "CC(=O)Oc1ccccc1C(=O)O"
    smiles_source: "generated_3d"
    unit_cell_volume: 1205.4
    n_atoms: 13
    lattice_system: "monoclinic"
    temperature_K: 150.0
    has_solvent: false
    radius_of_gyration: 4.23
    asphericity: 0.65
    principal_moments: "45.1, 120.5, 180.2"
    cape: 0.72
    raw_pc: 0.68