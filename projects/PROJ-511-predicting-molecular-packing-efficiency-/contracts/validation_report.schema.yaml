$schema: http://json-schema.org/draft-07/schema#
title: Validation Report Schema
description: Schema for the final validation report generated by the pipeline.
type: object
required:
  report_id
  timestamp
  pipeline_version
  dataset_validation
  model_validation
  statistical_rigor
  physics_consistency
  summary
properties:
  report_id:
    type: string
  timestamp:
    type: string
    format: date-time
  pipeline_version:
    type: string
  dataset_validation:
    type: object
    required:
      - schema_valid
      - row_count
      - missing_values
      - smi_validity
      - cape_validity
    properties:
      schema_valid:
        type: boolean
      row_count:
        type: integer
        minimum: 500
      missing_values:
        type: object
        additionalProperties:
          type: integer
      smi_validity:
        type: number
        minimum: 0.0
        maximum: 1.0
      cape_validity:
        type: number
        minimum: 0.0
        maximum: 1.0
      unit_cell_anchored:
        type: boolean
        description: True if all records have valid unit-cell dimensions from CIFs.
  model_validation:
    type: object
    required:
      - architecture_check
      - parameter_count
      - convergence
    properties:
      architecture_check:
        type: object
        properties:
          type:
            type: string
          layers:
            type: array
      parameter_count:
        type: integer
        maximum: 100000
        description: Must be <= 100k per FR-005.
      convergence:
        type: boolean
      final_loss:
        type: number
  statistical_rigor:
    type: object
    required:
      - permutation_test
      - vif_check
      - residual_normality
    properties:
      permutation_test:
        type: object
        required:
          - shuffles
          - p_value
        properties:
          shuffles:
            type: integer
            minimum: 10000
            description: Must be exactly 10,000 per FR-016.
          p_value:
            type: number
          timeout_occurred:
            type: boolean
            description: True if the test failed to complete in time budget.
      vif_check:
        type: object
        required:
          - max_vif
          - features_checked
        properties:
          max_vif:
            type: number
          features_checked:
            type: integer
            description: Must equal total number of features.
      residual_normality:
        type: object
        required:
          - statistic
          - p_value
        properties:
          statistic:
            type: number
          p_value:
            type: number
  physics_consistency:
    type: object
    required:
      - bondi_radii_used
      - h_bond_features_included
      - thermodynamic_confounders
    properties:
      bondi_radii_used:
        type: boolean
        description: Confirms Bondi radii were used for CAPE calculation.
      h_bond_features_included:
        type: boolean
      thermodynamic_confounders:
        type: boolean
  sensitivity_analysis:
    type: object
    description: Results from threshold sensitivity sweep.
    properties:
      thresholds_tested:
        type: array
        items:
          type: number
        description: Should be [0.5, 0.6, 0.7].
      r_variation:
        type: number
        description: Variation in Pearson r across thresholds.
      bonferroni_corrected:
        type: boolean
      robust:
        type: boolean
        description: True if r_variation <= 0.05.
  summary:
    type: object
    required:
      - status
      - pass_fail
    properties:
      status:
        type: string
        enum: ["passed", "failed", "warning"]
      pass_fail:
        type: boolean
      issues:
        type: array
        items:
          type: string
      recommendations:
        type: array
        items:
          type: string