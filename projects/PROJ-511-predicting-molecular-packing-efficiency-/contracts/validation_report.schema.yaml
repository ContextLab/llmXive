$schema: http://json-schema.org/draft-07/schema#
title: Validation Report Schema
description: >
  Schema for the model validation report containing performance metrics,
  statistical diagnostics, and robustness checks.
type: object
required:
  - primary_metrics
  - diagnostics
  - model_info
  - timestamp
properties:
  primary_metrics:
    type: object
    description: Core performance metrics on the validation set.
    required:
      - pearson_r
      - spearman_rho
      - mae
    properties:
      pearson_r:
        type: number
        description: Pearson correlation coefficient.
        minimum: -1.0
        maximum: 1.0
      spearman_rho:
        type: number
        description: Spearman rank correlation coefficient.
        minimum: -1.0
        maximum: 1.0
      mae:
        type: number
        description: Mean Absolute Error.
        minimum: 0.0
      rmse:
        type: number
        description: Root Mean Squared Error (optional).
        minimum: 0.0
      r_squared:
        type: number
        description: Coefficient of determination (optional).
  diagnostics:
    type: object
    description: Statistical diagnostics and robustness checks.
    required:
      - shapiro_wilk_p
      - permutation_p_value
      - vif_flags
      - partial_corr_r
      - partial_corr_p
    properties:
      shapiro_wilk_p:
        type: number
        description: P-value from Shapiro-Wilk test on residuals.
        minimum: 0.0
        maximum: 1.0
      permutation_p_value:
        type: number
        description: P-value from the fixed two-sided permutation test (10,000 shuffles).
        minimum: 0.0
        maximum: 1.0
      permutation_n_shuffles:
        type: integer
        description: Number of shuffles performed.
        const: 10000
      vif_flags:
        type: object
        description: Variance Inflation Factor flags for predictors.
        additionalProperties:
          type: object
          required:
            - vif
            - flag
          properties:
            vif:
              type: number
              minimum: 0.0
            flag:
              type: string
              enum: ["ok", "moderate", "severe"]
      partial_corr_r:
        type: number
        description: Partial correlation coefficient controlling for atom-type composition.
        minimum: -1.0
        maximum: 1.0
      partial_corr_p:
        type: number
        description: P-value for the partial correlation.
        minimum: 0.0
        maximum: 1.0
  model_info:
    type: object
    description: Reference to the model artifact.
    required:
      - model_path
      - model_version
    properties:
      model_path:
        type: string
        description: Relative path to the model file (e.g., "models/mlp.pt").
      model_version:
        type: string
        description: Version tag of the model.
  sensitivity_analysis:
    type: array
    description: Optional sensitivity analysis results (threshold sweep).
    items:
      type: object
      required:
        - threshold
        - r
        - rho
        - mae
        - p_value
        - bonferroni_corrected_p
      properties:
        threshold:
          type: number
        r:
          type: number
        rho:
          type: number
        mae:
          type: number
        p_value:
          type: number
        bonferroni_corrected_p:
          type: number
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of report generation.
  version:
    type: string
    description: Schema version.
    const: "1.0.0"