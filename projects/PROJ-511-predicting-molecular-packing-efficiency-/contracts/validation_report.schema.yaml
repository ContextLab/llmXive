$schema: http://json-schema.org/draft-07/schema#
title: Validation Report Schema
description: Schema for the comprehensive model validation report (results/validation_report.json)
type: object
required:
  - primary_metrics
  - diagnostics
  - permutation_test
  - vif_diagnostics
  - partial_correlation
  - metadata
properties:
  primary_metrics:
    type: object
    description: Core regression metrics on the validation set
    required:
      - pearson_r
      - spearman_rho
      - mae
    properties:
      pearson_r:
        type: number
        description: Pearson correlation coefficient
      spearman_rho:
        type: number
        description: Spearman rank correlation coefficient
      mae:
        type: number
        description: Mean Absolute Error
  diagnostics:
    type: object
    description: Statistical diagnostics
    required:
      - shapiro_wilk_p
    properties:
      shapiro_wilk_p:
        type: number
        description: P-value from Shapiro-Wilk test on residuals
  permutation_test:
    type: object
    description: Results of the permutation test for significance
    required:
      - p_value
      - n_shuffles
      - observed_correlation
    properties:
      p_value:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Two-sided p-value from permutation test
      n_shuffles:
        type: integer
        description: Number of permutations performed (must be 10,000 per FR-016)
      observed_correlation:
        type: number
        description: The absolute value of the observed correlation used as baseline
  vif_diagnostics:
    type: object
    description: Variance Inflation Factor diagnostics for all predictors
    required:
      - flags
      - max_vif
      - threshold
    properties:
      flags:
        type: array
        items:
          type: object
          required:
            - feature_name
            - vif_value
          properties:
            feature_name:
              type: string
            vif_value:
              type: number
      max_vif:
        type: number
        description: Maximum VIF value observed
      threshold:
        type: number
        description: Threshold used to flag multicollinearity (default 10.0)
  partial_correlation:
    type: object
    description: Partial correlation controlling for atom-type composition (FR-014)
    required:
      - r
      - p_value
    properties:
      r:
        type: number
        description: Partial correlation coefficient
      p_value:
        type: number
        description: P-value for the partial correlation
  metadata:
    type: object
    description: Metadata about the validation run
    required:
      - timestamp
      - dataset_version
      - model_path
      - script_version
    properties:
      timestamp:
        type: string
        format: date-time
      dataset_version:
        type: string
      model_path:
        type: string
      script_version:
        type: string
additionalProperties: false