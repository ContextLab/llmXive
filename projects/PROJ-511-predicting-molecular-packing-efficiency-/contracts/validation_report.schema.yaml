$schema: http://json-schema.org/draft-07/schema#
title: Validation Report Schema
description: Schema for the comprehensive validation report generated after model evaluation.
type: object
required:
  - model_type
  - metrics
  - statistical_tests
  - feature_analysis
  - sensitivity_analysis
  - timestamp
properties:
  model_type:
    type: string
    description: The type of model being validated.
  metrics:
    type: object
    description: Primary performance metrics.
    required:
      - mae
      - pearson_r
      - spearman_rho
    properties:
      mae:
        type: number
        minimum: 0
        description: Mean Absolute Error on the validation set.
      mse:
        type: number
        minimum: 0
        description: Mean Squared Error on the validation set.
      rmse:
        type: number
        minimum: 0
        description: Root Mean Squared Error on the validation set.
      pearson_r:
        type: number
        minimum: -1
        maximum: 1
        description: Pearson correlation coefficient between predicted and observed.
      pearson_p:
        type: number
        minimum: 0
        maximum: 1
        description: P-value for Pearson correlation.
      spearman_rho:
        type: number
        minimum: -1
        maximum: 1
        description: Spearman rank correlation coefficient.
      spearman_p:
        type: number
        minimum: 0
        maximum: 1
        description: P-value for Spearman correlation.
      r2:
        type: number
        description: R-squared coefficient of determination.
  statistical_tests:
    type: object
    description: Results of statistical significance and assumption tests.
    required:
      - shapiro_wilk
      - permutation_test
    properties:
      shapiro_wilk:
        type: object
        description: Shapiro-Wilk test for normality of residuals.
        required:
          - statistic
          - p_value
        properties:
          statistic:
            type: number
            minimum: 0
            maximum: 1
          p_value:
            type: number
            minimum: 0
            maximum: 1
      permutation_test:
        type: object
        description: Permutation test results for significance.
        required:
          - observed_statistic
          - p_value
          - n_permutations
        properties:
          observed_statistic:
            type: number
            description: The observed metric (e.g., r or MAE) before shuffling.
          p_value:
            type: number
            minimum: 0
            maximum: 1
          n_permutations:
            type: integer
            minimum: 1
            description: Number of permutations performed.
      partial_correlation:
        type: object
        description: Partial correlation controlling for confounders.
        properties:
          coefficient:
            type: number
          p_value:
            type: number
  feature_analysis:
    type: object
    description: Analysis of feature importance and multicollinearity.
    properties:
      vif_scores:
        type: array
        description: Variance Inflation Factor scores for each feature.
        items:
          type: object
          required:
            - feature
            - vif
          properties:
            feature:
              type: string
            vif:
              type: number
              minimum: 1
      feature_importance:
        type: array
        description: Relative importance of features (if available).
        items:
          type: object
          properties:
            feature:
              type: string
            importance:
              type: number
  sensitivity_analysis:
    type: object
    description: Results of sensitivity analysis (threshold sweeps).
    properties:
      threshold_sweep:
        type: array
        description: Metrics across different packing efficiency thresholds.
        items:
          type: object
          required:
            - threshold
            - r
            - mae
            - p_value
          properties:
            threshold:
              type: number
            r:
              type: number
            mae:
              type: number
            p_value:
              type: number
      bonferroni_corrected:
        type: boolean
        description: Whether Bonferroni correction was applied.
      max_variation_r:
        type: number
        description: Maximum variation in r across thresholds.
  comparative_analysis:
    type: object
    description: Comparison between different model variants (Baseline vs Control vs Upper Bound).
    properties:
      baseline_vs_control:
        type: object
        properties:
          delta_mae:
            type: number
          delta_r:
            type: number
          significance:
            type: boolean
      baseline_vs_upper_bound:
        type: object
        properties:
          delta_mae:
            type: number
          delta_r:
            type: number
          significance:
            type: boolean
  thermodynamic_consistency:
    type: object
    description: Checks for physical grounding (e.g., correlation with H-bond energy).
    properties:
      h_bond_correlation:
        type: number
      planarity_correlation:
        type: number
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of report generation.
  dataset_info:
    type: object
    description: Information about the dataset used for validation.
    properties:
      n_samples:
        type: integer
      n_features:
        type: integer
      target_mean:
        type: number
      target_std:
        type: number
  notes:
    type: string
    description: Additional notes or warnings.