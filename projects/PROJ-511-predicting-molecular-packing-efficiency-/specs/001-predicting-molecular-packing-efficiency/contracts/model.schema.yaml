$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Checkpoint Metadata Schema"
type: "object"
properties:
  model_type:
    type: "string"
    const: "MLP_Regression"
    description: "Type of model architecture."
  layers:
    type: "array"
    items:
      type: "integer"
    description: "List of layer dimensions (e.g., [1024, 64, 32, 1])."
  total_parameters:
    type: "integer"
    description: "Total number of trainable parameters."
  target_variable:
    type: "string"
    const: "pc_raw"
    description: "The target variable predicted by the model."
  training_config:
    type: "object"
    properties:
      seed:
        type: "integer"
      learning_rate:
        type: "number"
      batch_size:
        type: "integer"
      epochs:
        type: "integer"
      train_split_ratio:
        type: "number"
    required:
      - seed
      - train_split_ratio
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of model creation."
required:
  - model_type
  - layers
  - total_parameters
  - target_variable
  - training_config
  - timestamp
