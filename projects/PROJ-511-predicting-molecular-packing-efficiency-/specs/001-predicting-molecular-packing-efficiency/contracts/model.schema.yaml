$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Schema"
description: "Schema for the trained model checkpoint (results/model.pt)"
type: "object"
properties:
  architecture:
    type: "string"
    description: "Model architecture name"
    const: "SMILES_MLP"
  parameters:
    type: "object"
    properties:
      hidden_layers:
        type: "array"
        items:
          type: "integer"
        description: "Number of units in each hidden layer"
      input_dim:
        type: "integer"
      output_dim:
        type: "integer"
    required:
      - "hidden_layers"
      - "input_dim"
      - "output_dim"
  total_params:
    type: "integer"
    description: "Total trainable parameters (must be <= 100000)"
    maximum: 100000
  training_config:
    type: "object"
    properties:
      seed:
        type: "integer"
      epochs:
        type: "integer"
      learning_rate:
        type: "number"
      l2_penalty:
        type: "number"
      dropout_rate:
        type: "number"
    required:
      - "seed"
      - "epochs"
      - "learning_rate"
  frozen_transformer:
    type: "string"
    description: "Name of the frozen transformer used"
required:
  - "architecture"
  - "parameters"
  - "total_params"
  - "training_config"
  - "frozen_transformer"
additionalProperties: false