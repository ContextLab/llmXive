$schema: "http://json-schema.org/draft-07/schema#"
title: "Validation Report Schema"
type: "object"
properties:
  mae:
    type: "number"
    description: "Mean Absolute Error"
  pearson_r:
    type: "number"
    description: "Pearson correlation coefficient"
  spearman_rho:
    type: "number"
    description: "Spearman rank correlation coefficient"
  shapiro_wilk_p:
    type: "number"
    description: "p-value from Shapiro-Wilk normality test on residuals"
  permutation_test_p:
    type: "number"
    description: "Two-sided p-value from 10,000 shuffle permutation test"
  vif_flags:
    type: "array"
    items:
      type: "string"
    description: "List of feature names with VIF > 5"
  partial_corr:
    type: "number"
    description: "Partial correlation coefficient controlling for composition"
  sensitivity_analysis:
    type: "object"
    properties:
      thresholds:
        type: "array"
        items:
          type: "number"
        description: "List of thresholds tested"
      pearson_r_variation:
        type: "number"
        description: "Variation in Pearson r across thresholds"
      bonferroni_corrected_p:
        type: "number"
        description: "Bonferroni corrected p-value"
required:
  - mae
  - pearson_r
  - spearman_rho
  - shapiro_wilk_p
  - permutation_test_p
  - vif_flags
  - partial_corr
  - sensitivity_analysis
additionalProperties: false
