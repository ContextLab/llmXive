$schema: "http://json-schema.org/draft-07/schema#"
title: "Validation Report Schema"
type: "object"
properties:
  mae:
    type: "number"
    description: "Mean Absolute Error on the validation set."
  pearson_r:
    type: "number"
    description: "Pearson correlation coefficient between predicted and observed PC_raw."
  spearman_rho:
    type: "number"
    description: "Spearman rank correlation coefficient."
  shapiro_wilk_stat:
    type: "number"
    description: "Shapiro-Wilk test statistic for residual normality."
  shapiro_wilk_p:
    type: "number"
    description: "Shapiro-Wilk test p-value."
  permutation_test:
    type: "object"
    properties:
      n_shuffles:
        type: "integer"
        const: 10000
      p_value:
        type: "number"
        description: "Two-sided p-value from permutation test."
      actual_shuffles:
        type: "integer"
        description: "Actual number of shuffles performed (may be < 10000 if timeout occurred)."
    required:
      - n_shuffles
      - p_value
  bonferroni_correction:
    type: "object"
    properties:
      alpha_initial:
        type: "number"
        const: 0.05
      n_tests:
        type: "integer"
        const: 3
      alpha_corrected:
        type: "number"
      is_significant:
        type: "boolean"
    required:
      - alpha_initial
      - n_tests
      - alpha_corrected
      - is_significant
  vif_diagnostics:
    type: "object"
    properties:
      flagged_features:
        type: "array"
        items:
          type: "string"
        description: "List of features with VIF > 5."
      max_vif:
        type: "number"
    required:
      - flagged_features
      - max_vif
  sensitivity_analysis:
    type: "array"
    items:
      type: "object"
      properties:
        threshold:
          type: "number"
        pearson_r:
          type: "number"
        p_value:
          type: "number"
      required:
        - threshold
        - pearson_r
        - p_value
    description: "Results of the threshold sweep {0.5, 0.6, 0.7}."
  residual_analysis:
    type: "object"
    properties:
      correlation_with_composition:
        type: "number"
        description: "Correlation of model residuals with atom-type composition."
    required:
      - correlation_with_composition
  target_distribution:
    type: "object"
    properties:
      shapiro_stat:
        type: "number"
      shapiro_p:
        type: "number"
      is_normal:
        type: "boolean"
    required:
      - shapiro_stat
      - shapiro_p
      - is_normal
required:
  - mae
  - pearson_r
  - spearman_rho
  - shapiro_wilk_stat
  - shapiro_wilk_p
  - permutation_test
  - bonferroni_correction
  - vif_diagnostics
  - sensitivity_analysis
  - residual_analysis
  - target_distribution
