$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema"
type: "object"
properties:
  cod_id:
    type: "string"
    description: "Unique COD identifier"
  smiles:
    type: "string"
    description: "Canonical SMILES string"
  smiles_source:
    type: "string"
    enum:
      - "extracted"
      - "generated"
    description: "Source of the SMILES string"
  unit_cell_volume:
    type: "number"
    description: "Unit cell volume in Angstroms cubed"
  vdw_volume_sum:
    type: "number"
    description: "Sum of Bondi van der Waals volumes"
  packing_coefficient:
    type: "number"
    description: "Raw packing coefficient"
  cape:
    type: "number"
    description: "Composition-Adjusted Packing Efficiency"
  num_non_hydrogen_atoms:
    type: "integer"
    description: "Count of non-hydrogen atoms"
  radius_of_gyration:
    type: "number"
    description: "Radius of gyration in Angstroms"
  asphericity:
    type: "number"
    description: "Asphericity descriptor"
  principal_moments:
    type: "string"
    description: "Principal moments of inertia as comma-separated string"
  lattice_system:
    type: "string"
    description: "Crystal system"
  temperature_K:
    type: ["number", "null"]
    description: "Measurement temperature in Kelvin"
  has_solvent:
    type: "boolean"
    description: "Flag for solvent presence"
  atom_type_counts:
    type: "string"
    description: "Comma-separated counts of each atom type"
required:
  - cod_id
  - smiles
  - smiles_source
  - unit_cell_volume
  - vdw_volume_sum
  - packing_coefficient
  - cape
  - num_non_hydrogen_atoms
  - radius_of_gyration
  - asphericity
  - principal_moments
  - lattice_system
  - has_solvent
  - atom_type_counts
additionalProperties: false
