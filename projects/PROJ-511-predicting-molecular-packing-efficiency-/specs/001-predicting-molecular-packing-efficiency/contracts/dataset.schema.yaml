$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema"
description: "Schema for the processed dataset CSV (data/processed/dataset.csv)"
type: "object"
properties:
  cod_id:
    type: "string"
    description: "Unique COD identifier"
  smiles:
    type: "string"
    description: "Canonical SMILES string (generated from 2D graph)"
  smiles_source:
    type: "string"
    enum:
      - "extracted"
      - "generated"
    description: "Origin of the SMILES string"
  unit_cell_volume:
    type: "number"
    description: "Unit cell volume in Angstroms^3"
  sum_vdw_volume:
    type: "number"
    description: "Sum of Van der Waals volumes in Angstroms^3"
  pc_raw:
    type: "number"
    description: "Raw packing coefficient (Target)"
  n_atoms:
    type: "integer"
    description: "Number of non-hydrogen atoms"
  mean_atomic_volume:
    type: "number"
    description: "Mean atomic volume (Covariate)"
  cape:
    type: "number"
    description: "Composition-Adjusted Packing Efficiency (Diagnostic)"
  radius_of_gyration:
    type: "number"
    description: "Radius of gyration (from experimental coords)"
  asphericity:
    type: "number"
    description: "Asphericity of the molecule (from experimental coords)"
  principal_moments:
    type: "string"
    description: "Comma-separated principal moments of inertia (from experimental coords)"
  lattice_system:
    type: "string"
    description: "Crystal lattice system"
  temperature_K:
    type: ["number", "null"]
    description: "Measurement temperature in Kelvin"
  has_solvent:
    type: "boolean"
    description: "Presence of solvent molecules"
  atom_counts:
    type: "string"
    description: "Comma-separated counts of each element (e.g., C:10,N:1,O:2)"
required:
  - "cod_id"
  - "smiles"
  - "smiles_source"
  - "unit_cell_volume"
  - "sum_vdw_volume"
  - "pc_raw"
  - "n_atoms"
  - "mean_atomic_volume"
  - "cape"
  - "radius_of_gyration"
  - "asphericity"
  - "principal_moments"
  - "lattice_system"
  - "has_solvent"
  - "atom_counts"
additionalProperties: false