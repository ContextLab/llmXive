$schema: http://json-schema.org/draft-07/schema#
title: LLMXive Results Schema
description: >
  JSON Schema defining the required columns and data types for all result CSVs
  generated by the LLMXive analysis pipeline (Baseline, Lazy, Greedy, and Noisy variants).
type: object
required:
  - task_id
  - accuracy
  - nodes_visited
  - latency_ms
  - status
properties:
  task_id:
    type: string
    description: Unique identifier for the benchmark task (e.g., 'locomo_task_001').
    minLength: 1
  accuracy:
    type: number
    description: >
      Accuracy metric for the task execution.
      For binary success (exact match), this is 0.0 or 1.0.
      For partial credit scenarios, this is a float between 0.0 and 1.0.
    minimum: 0.0
    maximum: 1.0
  nodes_visited:
    type: integer
    description: >
      The number of graph nodes visited during the traversal strategy execution.
      Must be a non-negative integer.
    minimum: 0
  latency_ms:
    type: number
    description: >
      Total execution latency in milliseconds, including graph traversal and LLM inference time.
      Must be non-negative.
    minimum: 0.0
  status:
    type: string
    description: >
      Execution status of the task.
      Allowed values: 'completed', 'timeout', 'degenerate', 'unresolved'.
    enum:
      - completed
      - timeout
      - degenerate
      - unresolved
additionalProperties: false