# Schema for all result CSVs generated by the llmXive pipeline
# Used by code/utils/validate_results.py to enforce data integrity
type: object
properties:
  task_id:
    type: string
    description: Unique identifier for the benchmark task
    pattern: "^task_[0-9]+$"
  accuracy:
    type: number
    description: Accuracy score (0.0 to 1.0)
    minimum: 0.0
    maximum: 1.0
  nodes_visited:
    type: integer
    description: Number of graph nodes visited during traversal
    minimum: 0
  latency_ms:
    type: number
    description: Inference latency in milliseconds
    minimum: 0
  strategy:
    type: string
    description: Name of the traversal strategy used
    enum:
      - full
      - lazy
      - greedy
      - noisy_full
      - noisy_lazy
      - noisy_greedy
  noise_level:
    type: number
    description: Noise injection level (0.0 for clean data)
    minimum: 0.0
    maximum: 1.0
    nullable: true
required:
  - task_id
  - accuracy
  - nodes_visited
  - latency_ms
  - strategy
additionalProperties: false
