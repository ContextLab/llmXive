[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-memory-is-re"
version = "0.1.0"
description = "Follow-up research on Graph Memory for LLM Agents"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas==2.0.3",
    "numpy==1.24.3",
    "scipy==1.11.1",
    "networkx==3.1",
    "pytest==7.4.0",
    "spacy==3.7.0",
    "statsmodels==0.14.0",
    "datasets==2.14.0",
    "huggingface_hub==0.17.0",
    "llama-cpp-python==0.2.0",
    "psutil==5.9.5",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.setuptools]
packages = ["code", "code.analysis", "code.strategies", "code.utils", "code.report"]