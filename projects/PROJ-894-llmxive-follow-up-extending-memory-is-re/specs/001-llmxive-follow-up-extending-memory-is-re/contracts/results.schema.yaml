$schema: "http://json-schema.org/draft-07/schema#"
title: "Execution Results Schema"
type: "object"
properties:
  task_id:
    type: "string"
    description: "Unique identifier for the task"
  strategy:
    type: "string"
    enum:
      - "Full"
      - "Lazy"
      - "Greedy"
    description: "The traversal strategy used"
  accuracy:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Accuracy score (0.0 to 1.0)"
  nodes_visited:
    type: "integer"
    minimum: 0
    description: "Number of nodes visited during traversal"
  latency_ms:
    type: "number"
    minimum: 0
    description: "Execution time in milliseconds"
  token_count:
    type: "integer"
    minimum: 0
    description: "Total tokens generated/consumed (Constitution Principle VI)"
  status:
    type: "string"
    enum:
      - "completed"
      - "timeout"
      - "degenerate"
      - "unresolved"
    description: "Execution status"
  evidence_threshold:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Evidence threshold used (only for Lazy strategy)"
  noise_applied:
    type: "boolean"
    description: "Whether noise was applied to the graph"
required:
  - task_id
  - strategy
  - accuracy
  - nodes_visited
  - latency_ms
  - token_count
  - status
  - noise_applied
additionalProperties: false
