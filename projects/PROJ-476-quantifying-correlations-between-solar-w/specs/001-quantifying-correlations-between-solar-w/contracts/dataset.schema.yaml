$schema: "http://json-schema.org/draft-07/schema#"
title: "Synchronized Solar Wind and Geomagnetic Dataset Row"
description: "Schema for one row of data/processed/synced.csv (hourly UTC grid)."
type: object
properties:
  timestamp:
    type: string
    format: date-time
    description: "UTC timestamp, hourly resolution, ISO-8601."
  proton_density:
    type: number
    minimum: 0
    description: "Proton density in cm^-3 (ACE SWEPAM N_p; interpolated if gap <= 6 h)."
  temperature:
    type: number
    minimum: 0
    description: "Proton temperature in K (ACE SWEPAM T_p; interpolated if gap <= 6 h)."
  helium_abundance:
    type: number
    minimum: 0
    description: "He2+/H+ abundance ratio (ACE SWICS He2+_ratio; interpolated if gap <= 6 h)."
  Kp:
    type: number
    minimum: 0
    maximum: 9
    description: "Planetary K-index (scale ranging from the lowest to the highest level)."
  Dst:
    type: number
    description: "Disturbance Storm Time index in nT."
  interpolated_flag:
    type: boolean
    description: "True if any value in this row was linearly interpolated."
required:
  - timestamp
  - proton_density
  - temperature
  - helium_abundance
  - Kp
  - Dst
  - interpolated_flag
additionalProperties: false
