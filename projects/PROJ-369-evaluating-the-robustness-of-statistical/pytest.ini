[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests for individual functions and classes.
    integration: Integration tests for full pipelines and workflows.
    contract: Contract tests for schema and API compliance.
    slow: Tests that take a long time to run (e.g., large datasets).
    real_data: Tests that require real external data access.
    synthetic: Tests that use synthetic data generation.
    parallel: Tests that can be run in parallel.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S