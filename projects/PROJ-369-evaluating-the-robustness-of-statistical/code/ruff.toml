# Ruff configuration for llmXive project
# Strict linting rules: E (Error), F (Pyflakes), W (Warning), I (Isort), N (PEP8-Naming), C (Comprehensions), UP (PyUpgrade)
# Integrated with Black formatting

# Target Python version
target-version = "py39"

# Line length compatible with Black (default 88)
line-length = 88

[lint]
# Enable strict rule sets
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "C",    # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (type hints)
    "S",    # flake8-bandit (security)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions (more rules)
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
]

# Ignore specific rules that conflict with project style or are too noisy
ignore = [
    "ANN101", # Missing type annotation for self in method
    "ANN102", # Missing type annotation for cls in classmethod
    "S101",   # Use of assert detected (allowed in tests)
    "S105",   # Possible hardcoded password (false positives in config)
    "S106",   # Possible hardcoded password assigned to argument
    "S107",   # Possible hardcoded password assigned to function default
    "B904",   # Within an except clause, raise exceptions with raise ... from err
    "C408",   # Unnecessary 'dict' call (rewrite as a literal)
    "C409",   # Unnecessary 'list' passed to 'tuple()'
    "C416",   # Unnecessary 'set' comprehension (rewrite using set())
    "SIM102", # Use a single if statement instead of nested if statements
    "SIM108", # Use ternary operator instead of if-else block
    "SIM114", # Combine if branches using logical 'or' operator
    "SIM117", # Use a single 'with' statement with multiple contexts
]

# Per-file ignores for test files
[lint.per-file-ignores]
"tests/**/*" = [
    "ANN",    # Type annotations not required in tests
    "S",      # Security checks not required in tests
    "B018",   # Found useless expression (common in tests)
]
"code/setup_*.py" = [
    "ANN",    # Type annotations not required in setup scripts
    "S101",   # Assert allowed in setup scripts
]

[lint.isort]
# Configuration to match Black's isort integration
known-first-party = ["src", "tests", "scripts"]
force-single-line = false
force-sort-within-sections = false
line-ordering-type = "alphabetical"
case-sensitive = false
combine-as-imports = true
split-on-trailing-comma = true

[lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[lint.flake8-annotations]
allow-star-arg-any = true
suppress-dummy-args = true
suppress-none-returning = true

[lint.flake8-bandit]
check-typed-exception = true

[lint.flake8-bugbear]
extend-immutable-calls = [
    "src.utils.config.get_path",
    "src.utils.config.ensure_dirs",
]

[format]
# Format configuration (compatible with Black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 80