# Ruff configuration for llmXive project
target-version = "py39"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in data pipelines)
]

[lint.per-file-ignores]
"tests/*" = ["ARG", "S101"] # Allow asserts in tests, ignore unused args in fixtures

[lint.isort]
known-first-party = ["src", "tests", "scripts"]
force-sort-within-sections = true
