[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-predict-stiffness"
version = "0.1.0"
description = "Predicting material stiffness from microstructure images using CNNs"
requires-python = ">=3.10"
dependencies = [
    "torch==2.0.0",
    "scikit-image==0.21.0",
    "scipy==1.11.0",
    "numpy==1.24.0",
    "pandas==2.0.0",
    "pytest==7.3.0",
    "scikit-learn==1.2.0",
    "pyfftw==0.13.1",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.ruff]
# Enable rules: E (pycodestyle), F (pyflakes), W (pycodestyle warnings), I (isort), N (pep8-naming)
select = ["E", "F", "W", "I", "N"]
ignore = []

# Same as Black
line-length = 88
target-version = "py310"

[tool.ruff.isort]
known-first-party = ["code"]
force-sort-within-sections = true

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"