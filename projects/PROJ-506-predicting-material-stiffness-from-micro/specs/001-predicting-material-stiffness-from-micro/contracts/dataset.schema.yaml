# Dataset Schema Contract for Microstructure-Stiffness Dataset
# This schema defines the required structure for the generated dataset metadata.
# Used for validation in T019 and T016 (Contract Tests).
#
# Fields:
# - image_path: Relative path to the generated microstructure image (PNG)
# - stiffness_tensor: 6x6 Voigt notation stiffness tensor (C_ij) flattened to 36 floats
# - inclusion_density: Fraction of volume occupied by inclusions (0.0 to 1.0)
# - seed: Random seed used for reproducibility

type: object
required:
  - image_path
  - stiffness_tensor
  - inclusion_density
  - seed

properties:
  image_path:
    type: string
    description: "Relative path to the microstructure image file (e.g., 'data/raw/micro_12345.png')"
    pattern: "^data/raw/micro_\\d+\\.png$"

  stiffness_tensor:
    type: array
    description: "Flattened 6x6 effective stiffness tensor (Voigt notation) in Pa"
    items:
      type: number
      format: float
    minItems: 36
    maxItems: 36

  inclusion_density:
    type: number
    format: float
    description: "Volume fraction of inclusions in the microstructure"
    minimum: 0.0
    maximum: 1.0

  seed:
    type: integer
    description: "Random seed used to generate this specific microstructure instance"

additionalProperties: false
description: "Schema for validating individual dataset entries in the metadata file."