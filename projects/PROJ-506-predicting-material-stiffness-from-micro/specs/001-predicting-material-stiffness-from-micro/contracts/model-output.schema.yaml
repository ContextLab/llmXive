# Model Output Schema Contract
# Defines the structure of prediction outputs generated by the CNN model.
# Used for validation of evaluation results and reporting.

schema_name: model-output-schema
version: 1.0.0
description: >
  Schema for CNN model predictions on material stiffness.
  This schema ensures consistency in output formats across different
  model versions and evaluation runs.

required_fields:
  - name: model_version
    type: string
    description: >
      Unique identifier for the model version (e.g., "v1.0.0", "cnn-shallow-20231015").
      Must match the version recorded during training.
    validation:
      pattern: "^v\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9]+)?$"
      example: "v1.0.0"

  - name: prediction
    type: float[]
    description: >
      Predicted effective stiffness tensor components in Voigt notation.
      For 2D plane strain problems, this is a 6-element array:
      [C11, C12, C22, C16, C26, C66] or reduced form depending on symmetry.
      Values must be in Pascals (Pa).
    validation:
      min_length: 1
      max_length: 6
      element_type: float
      example: [1.2e10, 0.4e10, 1.2e10, 0.0, 0.0, 0.3e10]

  - name: error
    type: float
    description: >
      Absolute error between predicted stiffness (C_pred) and ground truth (C_gt).
      Calculated as ||C_pred - C_gt||_F (Frobenius norm) or component-wise MAE.
      Unit: Pascals (Pa).
      Positive values indicate magnitude of deviation.
    validation:
      minimum: 0.0
      example: 1.5e8

  - name: density_bin
    type: string
    description: >
      Binned inclusion density category for stratification analysis.
      Used to group predictions by density ranges for statistical testing.
      Format: "low", "medium", "high" or specific range labels like "0.1-0.2".
    validation:
      enum:
        - "low"
        - "medium"
        - "high"
        - "0.0-0.1"
        - "0.1-0.2"
        - "0.2-0.3"
        - "0.3-0.4"
        - "0.4-0.5"
      example: "medium"

optional_fields:
  - name: seed
    type: integer
    description: Random seed used to generate the input microstructure.

  - name: topology_type
    type: string
    description: Topology of the microstructure (e.g., "random", "aligned", "percolated").

  - name: inference_time_ms
    type: float
    description: Time taken for inference in milliseconds.

  - name: confidence_score
    type: float
    description: Model confidence score if available (0.0 to 1.0).

example_record:
  model_version: "v1.0.0"
  prediction: [1.15e10, 0.38e10, 1.15e10, 0.0, 0.0, 0.29e10]
  error: 2.3e8
  density_bin: "medium"
  seed: 42
  topology_type: "random"
  inference_time_ms: 12.5

usage_notes:
  - All stiffness values must be in scientific notation for large numbers.
  - Error calculation method must be documented in the evaluation report.
  - density_bin must align with bins defined in the training metadata.
  - This schema is validated by tests/contract/test_output_schema.py (T024).