type: object
required:
  - model_version
  - prediction
  - error
  - density_bin
properties:
  model_version:
    type: string
    description: "Version string of the trained model"
  prediction:
    type: array
    items:
      type: number
    description: "Predicted stiffness tensor"
  error:
    type: number
    description: "Absolute error of the prediction"
  density_bin:
    type: string
    description: "Density bin label (e.g., 'low', 'medium', 'high')"