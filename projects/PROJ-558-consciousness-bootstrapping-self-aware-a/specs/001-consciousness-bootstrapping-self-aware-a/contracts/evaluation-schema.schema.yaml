$schema: "http://json-schema.org/draft-07/schema#"
title: "EvaluationResult"
description: "Schema for a single evaluation result record containing metrics and generated paths."
type: object
required:
  - question_id
  - question_text
  - ground_truth
  - generated_paths
  - majority_vote
  - is_correct
  - metrics
  - tie_breaker_used
properties:
  question_id:
    type: string
    description: "Unique identifier for the question."
  question_text:
    type: string
    description: "The input prompt text."
  ground_truth:
    type: string
    description: "The correct answer from the dataset."
  generated_paths:
    type: array
    items:
      type: object
      properties:
        path_id:
          type: integer
        text:
          type: string
        confidence_score:
          type: number
          minimum: 0
          maximum: 1
          description: "Confidence score for this path."
        is_correct:
          type: boolean
    description: "List of 5 generated answer paths."
    minItems: 5
    maxItems: 5
  majority_vote:
    type: string
    description: "The answer chosen by majority vote."
  is_correct:
    type: boolean
    description: "Whether the majority vote matches the ground truth."
  tie_breaker_used:
    type: boolean
    description: "True if the tie-breaking rule (max avg confidence) was applied."
  metrics:
    type: object
    required:
      - brier_score
      - ece
      - roc_auc
      - correlation_coefficient
    properties:
      brier_score:
        type: number
        minimum: 0
        maximum: 1
        description: "Brier score for uncertainty calibration."
      ece:
        type: number
        minimum: 0
        maximum: 1
        description: "Expected Calibration Error."
      roc_auc:
        type: number
        minimum: 0
        maximum: 1
        description: "ROC-AUC for error detection."
      correlation_coefficient:
        type: number
        minimum: -1
        maximum: 1
        description: "Pearson correlation between consistency and accuracy."
    additionalProperties: false
additionalProperties: false