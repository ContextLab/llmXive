$schema: "http://json-schema.org/draft-07/schema#"
title: "EvaluationResult"
description: "Schema for a single evaluation result record including generated paths and metrics."
type: "object"
properties:
  question_id:
    type: "string"
    description: "Unique ID for the question."
  dataset_source:
    type: "string"
    enum:
      - "gsm8k"
      - "mmlu"
    description: "Source dataset for the question."
  ground_truth:
    type: "string"
    description: "The correct answer."
  generated_paths:
    type: "array"
    description: "List of generated reasoning paths."
    items:
      type: "object"
      properties:
        path_id:
          type: "integer"
        text:
          type: "string"
        confidence_score:
          type: "number"
          description: "Average confidence of tokens in the path."
        is_correct:
          type: "boolean"
      required:
        - "path_id"
        - "text"
        - "confidence_score"
        - "is_correct"
    minItems: 5
    maxItems: 5
  majority_vote:
    type: "string"
    description: "The answer chosen by majority vote."
  is_consistent:
    type: "boolean"
    description: "Whether majority_vote matches ground_truth."
  metrics:
    type: "object"
    properties:
      self_consistency:
        type: "boolean"
      error_detection_score:
        type: "number"
      calibration_brier:
        type: "number"
      calibration_ece:
        type: "number"
    required:
      - "self_consistency"
      - "error_detection_score"
      - "calibration_brier"
      - "calibration_ece"
  timestamp:
    type: "string"
    format: "date-time"
required:
  - "question_id"
  - "dataset_source"
  - "ground_truth"
  - "generated_paths"
  - "majority_vote"
  - "is_consistent"
  - "metrics"
  - "timestamp"
additionalProperties: false