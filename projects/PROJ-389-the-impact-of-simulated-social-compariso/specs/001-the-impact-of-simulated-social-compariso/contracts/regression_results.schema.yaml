$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Regression Results"
type: object
required:
  - model_id
  - subgroup
  - coefficients
  - p_values
  - corrected_p_values
  - interaction_term_significant
  - vif_scores
  - sample_size
properties:
  model_id:
    type: string
    description: "Identifier for the regression model (e.g., \"model3_interaction\")"
  subgroup:
    type: string
    description: "Demographic subgroup label (\"global\" if no stratification)"
  coefficients:
    type: object
    description: "Mapping from predictor name to estimated coefficient"
    additionalProperties:
      type: number
  p_values:
    type: object
    description: "Raw p-values for each predictor"
    additionalProperties:
      type: number
  corrected_p_values:
    type: object
    description: "Benjamini-Hochberg FDR-adjusted p-values"
    additionalProperties:
      type: number
  interaction_term_significant:
    type: boolean
    description: "True if the interaction term's corrected p-value < 0.05"
  vif_scores:
    type: object
    description: "Variance Inflation Factor for each predictor"
    additionalProperties:
      type: number
  sample_size:
    type: integer
    description: "Number of observations used in this regression"
  inference_framing:
    type: string
    description: "Always \"associational\" for this observational design (SC-002)"
  notes:
    type: string
    description: "Optional free-text notes (e.g., low-variance skip, collinearity warning, power limitation)"