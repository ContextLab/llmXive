# Ruff configuration for llmXive TriSplat extension
# Extends pyproject.toml settings for specific linting rules

target-version = "py311"
line-length = 88

[lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "ARG", "SIM", "RET", "RUF"
]
ignore = [
    "E501", # Line length handled by black
    "B008", # Function calls in defaults (often necessary for CLI args)
    "RUF012", # Mutable class attributes (common in dataclasses)
]

[lint.per-file-ignores]
"code/models/geometry_only.py" = ["ARG002"] # Unused method argument in torch.nn.Module
"code/utils/mesh_utils.py" = ["B007"] # Unused loop variable in trimesh processing

[lint.flake8-arg-names]
# Allow generic names in specific contexts if needed
extend-ignore-names = ["self", "cls"]
