$schema: http://json-schema.org/draft-07/schema#
title: Threshold Result Schema
description: Schema for sparsity threshold identification result
type: object
required:
  - tolerance_threshold
  - identified_threshold
  - view_count_stats
  - method
properties:
  tolerance_threshold:
    type: number
    minimum: 0
    maximum: 1.0
  identified_threshold:
    type: integer
    minimum: 2
    maximum: 5
  view_count_stats:
    type: object
    patternProperties:
      "^[2-5]$":
        type: object
        properties:
          mean_error:
            type: number
          relative_error:
            type: number
          sample_size:
            type: integer
            minimum: 1
        required:
          - mean_error
          - relative_error
          - sample_size
  method:
    type: string
    enum: [t_test, wilcoxon, shapiro_wilk]
additionalProperties: false
