$schema: http://json-schema.org/draft-07/schema#
title: Threshold Result Schema
description: Schema for sparsity threshold identification output
type: object
properties:
  threshold_view_count:
    type: integer
    minimum: 2
    maximum: 5
  tolerance:
    type: number
    minimum: 0
  relative_error:
    type: number
  baseline_view_count:
    type: integer
  method:
    type: string
    enum: [shapiro_wilk_ttest, shapiro_wilk_wilcoxon]
required: [threshold_view_count, tolerance, relative_error, baseline_view_count, method]
