$schema: http://json-schema.org/draft-07/schema#
title: Batch Results Schema
description: Schema for batch experiment results JSON
type: object
required:
  - total_scenes
  - successful_scenes
  - failed_scenes
  - scenes
  - summary
properties:
  total_scenes:
    type: integer
    minimum: 0
  successful_scenes:
    type: integer
    minimum: 0
  failed_scenes:
    type: integer
    minimum: 0
  scenes:
    type: array
    items:
      type: object
      required:
        - scene_id
        - view_count
        - status
        - metrics
      properties:
        scene_id:
          type: string
        view_count:
          type: integer
          minimum: 2
          maximum: 5
        status:
          type: string
          enum: [success, failed, skipped, timeout]
        metrics:
          type: object
          properties:
            chamfer_distance:
              type: number
            psnr:
              type: number
            latency:
              type: number
        error_message:
          type: string
  summary:
    type: object
    properties:
      avg_chamfer_distance:
        type: number
      avg_psnr:
        type: number
      avg_latency:
        type: number
      threshold_identified:
        type: integer
        minimum: 2
        maximum: 5
additionalProperties: false
