$schema: "http://json-schema.org/draft-07/schema#"
title: "Statistical Summary Schema"
description: "Defines the aggregated statistical results across multiple scenes."
type: "object"
properties:
  view_count:
    type: "integer"
    enum:
      - 2
      - 3
      - 4
      - 5
    description: "Number of input views for this summary."
  n_scenes:
    type: "integer"
    description: "Sample size (number of scenes)."
  mean_chamfer:
    type: "number"
    description: "Mean Chamfer Distance."
  std_chamfer:
    type: "number"
    description: "Standard deviation of Chamfer Distance."
  mean_psnr:
    type: "number"
    description: "Mean PSNR."
  std_psnr:
    type: "number"
    description: "Standard deviation of PSNR."
  mean_latency:
    type: "number"
    description: "Mean inference latency."
  p_value:
    type: "number"
    description: "P-value from the significance test."
  test_type:
    type: "string"
    enum:
      - t_test
      - wilcoxon
    description: "Type of statistical test performed."
  threshold_exceeded:
    type: "boolean"
    description: "True if the error increase relative to 5-view baseline exceeds 15%."
required:
  - view_count
  - n_scenes
  - mean_chamfer
  - std_chamfer
  - mean_psnr
  - std_psnr
  - mean_latency
  - p_value
  - test_type
  - threshold_exceeded
