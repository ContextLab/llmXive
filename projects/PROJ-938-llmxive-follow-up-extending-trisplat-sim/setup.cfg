[metadata]
name = llmxive-trisplat-ext
version = 0.1.0
description = Extending TriSplat for CPU-only Edge Robotics
author = llmXive Team
license = MIT

[options]
packages = find:
package_dir =
    = code
python_requires = >=3.11
install_requires =
    torch>=2.0.0
    numpy>=1.24.0
    scipy>=1.10.0
    trimesh>=4.0.0
    pygltflib>=1.16.0
    datasets>=2.14.0
    scikit-learn>=1.3.0
    tqdm>=4.65.0
    pandas>=2.0.0
    Pillow>=9.0.0

[options.packages.find]
where = code