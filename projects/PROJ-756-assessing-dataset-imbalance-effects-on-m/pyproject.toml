[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-756-assessing-dataset-imbalance-effects"
version = "0.1.0"
description = "Assessing Dataset Imbalance Effects on Materials Property Predictions"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "shap",
    "datasets",
    "numpy",
    "scipy",
    "pyyaml",
    "ruff",
    "black",
    "pytest",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "data",
    "artifacts",
    "state",
    "logs",
    "specs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "E722", # bare except (used in defensive error handling in research scripts)
    "E741", # ambiguous variable name
    "F401", # unused imports (kept for re-export surface stability)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["code"]
force-sort-within-sections = true

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | artifacts
    | state
    | logs
)/
'''
