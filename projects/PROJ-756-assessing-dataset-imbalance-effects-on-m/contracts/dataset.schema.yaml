# Dataset Schema Contract for PROJ-756
# Defines the expected structure for processed material science data
# Used by contract tests (T012) to validate data integrity

$schema: "http://json-schema.org/draft-07/schema#"
title: "Processed Materials Dataset"
description: "Schema for validated material property datasets after ingestion and descriptor computation"

type: object
required:
  - metadata
  - data
  - targets
  - features

properties:
  metadata:
    type: object
    required:
      - source
      - timestamp
      - record_count
      - version
    properties:
      source:
        type: string
        description: "Origin of the data (e.g., 'OQMD', 'AFLOW', 'MaterialsProject')"
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of dataset creation"
      record_count:
        type: integer
        minimum: 1
        description: "Total number of material records in the dataset"
      version:
        type: string
        description: "Schema version identifier"

  data:
    type: object
    required:
      - composition
      - structure_id
    properties:
      composition:
        type: array
        items:
          type: string
        description: "List of chemical formulas (e.g., ['Fe2O3', 'SiO2'])"
      structure_id:
        type: array
        items:
          type: string
        description: "Unique identifiers for crystal structures"

  targets:
    type: object
    description: "Target properties with their statistical summaries"
    additionalProperties:
      type: object
      required:
        - values
        - count
        - min
        - max
        - mean
        - std
      properties:
        values:
          type: array
          items:
            type: number
          description: "Array of target values for this property"
        count:
          type: integer
          minimum: 100
          description: "Number of samples (must be >= 100 per FR-011)"
        min:
          type: number
        max:
          type: number
        mean:
          type: number
        std:
          type: number

  features:
    type: object
    required:
      - magpie_descriptors
      - feature_names
    properties:
      magpie_descriptors:
        type: array
        items:
          type: array
          items:
            type: number
        description: "L2-normalized Magpie compositional descriptors (N_samples x N_features)"
      feature_names:
        type: array
        items:
          type: string
        description: "List of feature names corresponding to descriptor columns"

  imbalance_scores:
    type: object
    description: "Optional imbalance metrics attached to the dataset"
    properties:
      target_gini:
        type: object
        additionalProperties:
          type: number
        description: "Gini coefficient for each target property"
      compositional_gini:
        type: number
        description: "Gini coefficient of K-Means cluster sizes"

additionalProperties: false
