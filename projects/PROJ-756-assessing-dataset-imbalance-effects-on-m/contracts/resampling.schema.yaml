# Resampling Schema Contract for PROJ-756
# Defines the expected structure for resampling configuration and results
# Used by contract tests (T014, T020) to validate CV constraints

$schema: "http://json-schema.org/draft-07/schema#"
title: "Resampling Configuration and Results"
description: "Schema for validating resampling logic and cross-validation constraints"

type: object
required:
  - configuration
  - results
  - cv_metrics

properties:
  configuration:
    type: object
    required:
      - method
      - bins
      - seed
    properties:
      method:
        type: string
        enum: ["dynamic_binning", "stratified_undersampling", "stratified_oversampling", "cost_sensitive"]
        description: "Resampling strategy used"
      bins:
        type: integer
        minimum: 2
        maximum: 100
        description: "Number of bins for dynamic binning"
      seed:
        type: integer
        description: "Random seed for reproducibility"
      fallback_triggered:
        type: boolean
        description: "Whether cost-sensitive fallback was triggered"

  results:
    type: object
    required:
      - original_count
      - resampled_count
      - data_loss_ratio
    properties:
      original_count:
        type: integer
        minimum: 1
      resampled_count:
        type: integer
        minimum: 1
      data_loss_ratio:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Proportion of data lost (0.0 = no loss, 1.0 = all lost)"

  cv_metrics:
    type: object
    required:
      - real_data_cv
      - combined_cv
    properties:
      real_data_cv:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Coefficient of Variation on real data (must be <= 0.10)"
      combined_cv:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Combined CV (real + synthetic) (must be <= 0.30)"
      is_valid:
        type: boolean
        description: "True if both CV constraints are satisfied"

  bin_distribution:
    type: object
    description: "Distribution of samples across bins (for dynamic binning)"
    additionalProperties:
      type: object
      required:
        - count
        - mean_target
      properties:
        count:
          type: integer
          minimum: 1
        mean_target:
          type: number

additionalProperties: false