type: object
required:
  - imputed_data_checksum
  - missingness_report
properties:
  imputed_data_checksum:
    type: string
    description: SHA-256 checksum of the imputed data file (data/processed/imputed_data.csv) to ensure data integrity and reproducibility.
  missingness_report:
    type: object
    description: Summary statistics regarding missing data handling and exclusion.
    required:
      - total_rows
      - rows_excluded
      - missingness_pct
    properties:
      total_rows:
        type: integer
        description: Total number of rows in the raw input dataset before imputation or exclusion.
      rows_excluded:
        type: integer
        description: Number of rows excluded from analysis due to missingness exceeding the 20% threshold (FR-002).
      missingness_pct:
        type: number
        description: Percentage of total missing values in the raw dataset (before imputation), calculated as (missing_cells / total_cells) * 100.