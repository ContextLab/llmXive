$schema: http://json-schema.org/draft-07/schema#
title: Output Schema
description: Schema for intermediate output artifacts, specifically imputation reports.
type: object
required:
  - imputed_data_checksum
  - missingness_report
properties:
  imputed_data_checksum:
    type: string
    description: SHA-256 checksum of the imputed dataset for reproducibility verification.
  missingness_report:
    type: object
    description: Summary of missing data before and after imputation.
    required:
      - initial_missing_count
      - final_missing_count
      - missing_percentage
    properties:
      initial_missing_count:
        type: integer
      final_missing_count:
        type: integer
      missing_percentage:
        type: number
        format: float
        minimum: 0.0
        maximum: 100.0
additionalProperties: false
