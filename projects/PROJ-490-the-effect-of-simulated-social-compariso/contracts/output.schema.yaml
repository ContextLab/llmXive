type: object
required:
  - imputed_data_checksum
  - missingness_report
properties:
  imputed_data_checksum:
    type: string
    description: SHA-256 checksum of the imputed dataset artifact (data/processed/imputed_data.csv)
  missingness_report:
    type: object
    properties:
      total_rows:
        type: integer
        description: Total number of rows in the input dataset before exclusion
      rows_excluded:
        type: integer
        description: Number of rows excluded due to > 20% missingness across key variables (FR-002)
      missingness_pct:
        type: number
        description: Overall percentage of missing values across key variables