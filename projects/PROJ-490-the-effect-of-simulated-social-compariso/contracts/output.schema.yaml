$schema: "http://json-schema.org/draft-07/schema#"
title: "Output Schema for Preprocessed Data"
description: "Schema for the cleaned and preprocessed dataset ready for analysis."
type: object
required:
  - participant_id
  - avatar_condition
  - pre_self_esteem
  - post_self_esteem
  - comparison_tendency
  - imputation_method
properties:
  participant_id:
    type: string
    description: "Unique identifier for the participant"
  avatar_condition:
    type: integer
    description: "Normalized experimental condition (0 or 1)"
    enum: [0, 1]
  pre_self_esteem:
    type: number
    description: "RSES score after missing value imputation"
  post_self_esteem:
    type: number
    description: "RSES score after missing value imputation"
  comparison_tendency:
    type: number
    description: "INCOM score after missing value imputation"
  imputation_method:
    type: string
    description: "Method used for imputation (e.g., 'miceforest', 'iterative_imputer')"
  imputed:
    type: boolean
    description: "Whether this row was originally missing and has been imputed"
  data_source_type:
    type: string
    description: "Source of the data"
    enum: ["real", "synthetic"]
additionalProperties: false
