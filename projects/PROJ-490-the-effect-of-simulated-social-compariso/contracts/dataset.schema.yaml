$schema: http://json-schema.org/draft-07/schema#
title: Dataset Schema
description: >
  Schema for the raw and processed dataset used in the study of simulated social
  comparison on self-esteem. Defines the required variables and their types.
type: object
properties:
  participant_id:
    type: integer
    description: Unique identifier for the participant.
  avatar_condition:
    type: integer
    description: >
      Binary indicator of the experimental condition.
      0 = Control (Neutral Avatar), 1 = Treatment (High-Status Avatar).
    enum: [0, 1]
  pre_self_esteem:
    type: number
    description: Baseline self-esteem score (RSES) measured before the VR interaction.
    minimum: 0
  post_self_esteem:
    type: number
    description: Self-esteem score (RSES) measured after the VR interaction.
    minimum: 0
  comparison_tendency:
    type: number
    description: >
      Score on the InCOM (Individual Differences in the Tendency to Engage in Social Comparison)
      scale, measuring the participant's baseline tendency to compare themselves to others.
    minimum: 0
  data_source_type:
    type: string
    description: >
      Indicator of data origin.
      "real" = Downloaded from a verified repository (HuggingFace, OSF).
      "synthetic" = Generated by the pipeline's synthetic generator for validation.
    enum: ["real", "synthetic"]
  irb_verified:
    type: boolean
    description: True if IRB/Consent verification passed for real data; N/A for synthetic.
required:
  - participant_id
  - avatar_condition
  - pre_self_esteem
  - post_self_esteem
  - comparison_tendency
  - data_source_type
additionalProperties: true
