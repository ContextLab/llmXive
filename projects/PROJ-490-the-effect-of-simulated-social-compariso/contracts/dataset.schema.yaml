$schema: http://json-schema.org/draft-07/schema#
title: Dataset Schema
description: Schema for the raw and processed dataset containing participant self-esteem and comparison metrics.
type: object
required:
  - participant_id
  - pre_self_esteem
  - post_self_esteem
  - comparison_tendency
  - avatar_condition
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant.
  pre_self_esteem:
    type: number
    format: float
    description: Baseline self-esteem score (e.g., RSES).
  post_self_esteem:
    type: number
    format: float
    description: Post-intervention self-esteem score.
  comparison_tendency:
    type: number
    format: float
    description: Measure of social comparison tendency (e.g., INCOM).
  avatar_condition:
    type: integer
    minimum: 0
    maximum: 1
    description: Binary condition indicator (0=Control, 1=Experimental).
additionalProperties: false
constraints:
  min_participants: 100
  description: FR-001: Dataset must contain at least 100 participants.
