type: object
required:
  - participant_id
  - pre_self_esteem
  - post_self_esteem
  - comparison_tendency
  - avatar_condition
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant
  pre_self_esteem:
    type: number
    description: Rosenberg Self-Esteem Scale (RSES) score, pre-intervention
  post_self_esteem:
    type: number
    description: Rosenberg Self-Esteem Scale (RSES) score, post-intervention
  comparison_tendency:
    type: number
    description: Incomparability (INCOM) scale score
  avatar_condition:
    type: integer
    enum: [0, 1]
    description: Experimental condition: 0=Neutral Avatar, 1=Idealized Avatar
validation_rules:
  min_participants: 100
  description: "FR-001: Dataset must contain N >= 100 participants to ensure statistical power."