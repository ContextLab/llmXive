$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema for Social Comparison Study"
description: "Schema for the raw dataset containing participant responses on self-esteem and social comparison metrics."
type: object
required:
  - participant_id
  - avatar_condition
  - pre_self_esteem
  - post_self_esteem
  - comparison_tendency
properties:
  participant_id:
    type: string
    description: "Unique identifier for the participant"
  avatar_condition:
    type: integer
    description: "Experimental condition (0: Control, 1: High Status Avatar)"
    enum: [0, 1]
  pre_self_esteem:
    type: number
    description: "Rosenberg Self-Esteem Scale (RSES) score before intervention"
    minimum: 0
    maximum: 40
  post_self_esteem:
    type: number
    description: "Rosenberg Self-Esteem Scale (RSES) score after intervention"
    minimum: 0
    maximum: 40
  comparison_tendency:
    type: number
    description: "INCOM (Integrative Comparison Scale) baseline score"
    minimum: 0
    maximum: 50
  data_source_type:
    type: string
    description: "Source of the data"
    enum: ["real", "synthetic"]
  source_metadata:
    type: object
    description: "Metadata regarding the source (license, IRB status, dataset ID)"
    properties:
      license:
        type: string
      irb_approved:
        type: boolean
      dataset_id:
        type: string
      download_url:
        type: string
additionalProperties: true
