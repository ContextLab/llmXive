# Results Schema: Regression Output Validation
# Task T002c - Schema for statistical analysis results (FR-008, FR-010)
type: object
required:
  - coefficients
  - assumptions
  - data_source_type
properties:
  coefficients:
    type: array
    description: Array of regression coefficients from the ANCOVA model
    items:
      type: object
      required:
        - name
        - estimate
        - std_err
        - p_value
      properties:
        name:
          type: string
          description: Coefficient name (e.g., intercept, avatar_condition, comparison_tendency, interaction)
        estimate:
          type: number
          description: Estimated coefficient value
        std_err:
          type: number
          description: Standard error of the estimate
        p_value:
          type: number
          description: P-value for the hypothesis test of the coefficient
          minimum: 0
          maximum: 1
  assumptions:
    type: object
    description: Model assumption diagnostic results (FR-004)
    properties:
      shapiro_p:
        type: number
        description: Shapiro-Wilk test p-value for normality of residuals
        minimum: 0
        maximum: 1
      breusch_pagan_p:
        type: number
        description: Breusch-Pagan test p-value for homoscedasticity
        minimum: 0
        maximum: 1
      vif_max:
        type: number
        description: Maximum Variance Inflation Factor across predictors (flag if >= 5)
        minimum: 0
  data_source_type:
    type: string
    description: Whether the analysis used real or synthetic data (FR-010, FR-011)
    enum: ["real", "synthetic"]