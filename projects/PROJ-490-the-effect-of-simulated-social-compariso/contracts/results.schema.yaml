$schema: "http://json-schema.org/draft-07/schema#"
title: "Results Schema for ANCOVA Analysis"
description: "Schema for the regression coefficients and diagnostic metrics."
type: object
required:
  - model_type
  - coefficients
  - diagnostics
  - interpretation_label
properties:
  model_type:
    type: string
    description: "Type of model fitted"
    enum: ["ANCOVA"]
  coefficients:
    type: object
    description: "Regression coefficients for the model"
    properties:
      intercept:
        type: number
      avatar_condition:
        type: number
      pre_self_esteem:
        type: number
      comparison_tendency:
        type: number
      interaction_term:
        type: number
    required:
      - intercept
      - avatar_condition
      - pre_self_esteem
      - comparison_tendency
  diagnostics:
    type: object
    description: "Model assumption validation results"
    properties:
      normality:
        type: object
        properties:
          test:
            type: string
            enum: ["Shapiro-Wilk"]
          statistic:
            type: number
          p_value:
            type: number
          passed:
            type: boolean
      homoscedasticity:
        type: object
        properties:
          test:
            type: string
            enum: ["Breusch-Pagan"]
          statistic:
            type: number
          p_value:
            type: number
          passed:
            type: boolean
      collinearity:
        type: object
        properties:
          vif_values:
            type: object
            additionalProperties:
              type: number
          max_vif:
            type: number
          passed:
            type: boolean
          flagged:
            type: boolean
            description: "True if any VIF >= 5"
    required:
      - normality
      - homoscedasticity
      - collinearity
  interpretation_label:
    type: string
    description: "Dynamic interpretation based on data source"
    enum: ["Empirical Association", "Simulated Causal Effect"]
  confidence_intervals:
    type: object
    description: "95% Confidence intervals for coefficients"
    properties:
      avatar_condition:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
      pre_self_esteem:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
      comparison_tendency:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
  bootstrap_stability:
    type: object
    description: "Bootstrap stability metrics"
    properties:
      ci_width_variance:
        type: number
      stable:
        type: boolean
  sensitivity_findings:
    type: object
    description: "Results from sensitivity analysis"
    properties:
      parameter_recovery_error:
        type: number
      threshold_sensitivity:
        type: object
        additionalProperties:
          type: boolean
      fwe_corrected_significance:
        type: boolean
additionalProperties: false