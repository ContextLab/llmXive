$schema: http://json-schema.org/draft-07/schema#
title: Results Schema
description: Schema for final regression results and model diagnostics.
type: object
required:
  - coefficients
  - assumptions
  - data_source_type
properties:
  coefficients:
    type: array
    description: List of regression coefficients.
    items:
      type: object
      required:
        - name
        - estimate
        - std_err
        - p_value
      properties:
        name:
          type: string
        estimate:
          type: number
          format: float
        std_err:
          type: number
          format: float
        p_value:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
  assumptions:
    type: object
    description: Model assumption validation results.
    required:
      - shapiro_p
      - breusch_pagan_p
      - vif_max
    properties:
      shapiro_p:
        type: number
        format: float
        minimum: 0.0
        maximum: 1.0
        description: Shapiro-Wilk normality test p-value.
      breusch_pagan_p:
        type: number
        format: float
        minimum: 0.0
        maximum: 1.0
        description: Breusch-Pagan homoscedasticity test p-value.
      vif_max:
        type: number
        format: float
        minimum: 1.0
        description: Maximum Variance Inflation Factor.
  data_source_type:
    type: string
    enum:
      - real
      - synthetic
    description: Indicates whether the analysis used real or synthetic data.
additionalProperties: false
