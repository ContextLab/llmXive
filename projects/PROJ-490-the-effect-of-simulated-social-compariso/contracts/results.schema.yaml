$schema: http://json-schema.org/draft-07/schema#
title: Final Results Report Schema
description: Schema for the comprehensive final report including robustness and sensitivity analysis.
type: object
required:
  - project_info
  - data_summary
  - model_results
  - robustness_analysis
  - sensitivity_analysis
  - conclusion
properties:
  project_info:
    type: object
    required:
      - project_id
      - project_name
      - version
    properties:
      project_id:
        type: string
        description: Project identifier (e.g., PROJ-490).
      project_name:
        type: string
        description: Full project name.
      version:
        type: string
        description: Pipeline version.
  data_summary:
    type: object
    required:
      - source_path
      - source_type
      - n_participants
      - missing_ratio
      - variables_validated
    properties:
      source_path:
        type: string
        description: Path to the data file used.
      source_type:
        type: string
        enum:
          - real
          - synthetic
        description: Data origin.
      n_participants:
        type: integer
        description: Number of participants after cleaning.
      missing_ratio:
        type: number
        description: Ratio of missing data before imputation.
      variables_validated:
        type: boolean
        description: Whether required variables were found.
  model_results:
    type: object
    description: Aggregated regression results.
    required:
      - coefficients
      - diagnostics
      - interpretation
    properties:
      coefficients:
        type: array
        description: Final model coefficients.
        items:
          type: object
      diagnostics:
        type: object
        description: Assumption validation results.
      interpretation:
        type: string
        enum:
          - Empirical Association
          - Simulated Causal Effect
        description: Context-aware interpretation label.
  robustness_analysis:
    type: object
    description: Bootstrap stability results.
    required:
      - bootstrap_iterations
      - ci_width_variance
      - stability_flag
    properties:
      bootstrap_iterations:
        type: integer
        description: Number of bootstrap samples.
      ci_width_variance:
        type: number
        description: Variance of confidence interval widths.
      stability_flag:
        type: boolean
        description: True if variance < 0.01 (stable).
  sensitivity_analysis:
    type: object
    description: Sensitivity sweep results.
    required:
      - thresholds_tested
      - parameter_recovery_error
      - error_correction_applied
    properties:
      thresholds_tested:
        type: array
        items:
          type: number
        description: List of p-value thresholds tested.
      parameter_recovery_error:
        type: number
        description: Absolute error for synthetic data (|beta_hat - beta_true|).
        nullable: true
      error_correction_applied:
        type: string
        enum:
          - Bonferroni
          - Holm
          - None
        description: Family-wise error correction method used.
  conclusion:
    type: object
    required:
      - summary
      - limitations
      - next_steps
    properties:
      summary:
        type: string
        description: High-level summary of findings.
      limitations:
        type: array
        items:
          type: string
        description: List of identified limitations.
      next_steps:
        type: array
        items:
          type: string
        description: Recommended future actions.
