[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
      \.git
    | \.venv
    | venv
    | build
    | dist
)/
'''

[tool.pylint.format]
max-line-length = 100

[tool.pylint.main]
# Research pipeline: pandas/numpy idioms trigger many default warnings.
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "too-many-locals",
    "too-many-arguments",
    "too-many-branches",
    "too-many-statements",
    "duplicate-code",
    "consider-using-f-string",
    "invalid-name",
    "line-too-long",
]
ignore-paths = ["venv", "\.venv", "build", "dist"]
recursive = true

[tool.pylint.basic]
good-names = ["df", "X", "y", "i", "j", "k", "n", "p", "ax", "fp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"