access_python: "from speedruncomapi import requests\n\nurl = \"https://www.speedrun.com/api/v1/runs\"\
  \nparams = {\"max\": 200, \"offset\": 0}\nall_runs = []\n\nwhile True:\n    resp\
  \ = requests.get(url, params=params)\n    data = resp.json()\n    batch = data.get(\"\
  data\", [])\n    if not batch:\n        break\n    all_runs.extend(batch)\n    if\
  \ len(batch) < params[\"max\"]:\n        break\n    params[\"offset\"] += params[\"\
  max\"]\n\nprint(f\"RECORDS={len(all_runs)}\")\nif all_runs:\n    fields = list(all_runs[0].keys())\n\
  \    print(\"FIELDS=\" + \",\".join(fields))"
