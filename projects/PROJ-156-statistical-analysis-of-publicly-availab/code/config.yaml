# Project configuration for Statistical Analysis of Speedrun Data
# Generated for llmXive pipeline PROJ-156

games:
  - "super-mario-64"
  - "zelda-oot"
  - "minecraft"
  - "doom"
  - "celeste"
  - "super-mario-world"
  - "metroid-zero-mission"
  - "pokemon-crystal"
  - "earthbound"
  - "chronotrigger"
  - "starcraft"
  - "diablo"
  - "half-life"
  - "quake"
  - "super-metro"

min_sample_size: 100

# Salt for SHA-256 hashing of runner IDs (Constitution Principle III)
# This ensures deterministic anonymization while preserving unique grouping
salt: "llmXive-speedrun-salt-2024-secure-random-string"

# Effect size assumptions for power analysis (Cohen's d)
effect_size_assumptions: 0.5

# API settings
speedrun_api_base: "https://www.speedrun.com/api/v1"
request_timeout_seconds: 30
retry_attempts: 3
retry_delay_seconds: 2

# Logging settings
log_level: "INFO"
log_file: "logs/preprocess.log"
