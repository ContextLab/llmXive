$schema: "http://json-schema.org/draft-07/schema#"
title: "ConfigSchema"
description: "Configuration schema for the speedrun analysis pipeline."
type: object
required:
  - games
  - min_sample_size
  - random_seed
  - lagged_pressure_window_days
  - effect_size_assumptions
properties:
  games:
    type: array
    description: "List of game identifiers to analyze."
    items:
      type: string
  min_sample_size:
    type: integer
    description: "Minimum number of runs required for parametric distribution fitting."
    minimum: 1
  random_seed:
    type: integer
    description: "Seed for all random number generators to ensure reproducibility."
  lagged_pressure_window_days:
    type: integer
    description: "Window size (in days) for calculating lagged competitive pressure."
    minimum: 1
  effect_size_assumptions:
    type: number
    description: "Assumed effect size (Cohen's d) for power analysis."
    minimum: 0.0
additionalProperties: false