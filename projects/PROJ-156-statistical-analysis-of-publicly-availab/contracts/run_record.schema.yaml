$schema: "http://json-schema.org/draft-07/schema#"
title: RunRecord
description: "Schema for a single speedrun record after preprocessing."
type: object
required:
  - run_time_seconds
  - runner_id
  - attempt_number
  - category
  - submission_date
  - game_id
properties:
  run_time_seconds:
    type: number
    description: "Total run time in seconds."
    minimum: 0
  runner_id:
    type: string
    description: "SHA-256 salted hash of the original runner ID."
    pattern: "^[a-f0-9]{64}$"
  attempt_number:
    type: integer
    description: "Sequential attempt number for this runner in this game."
    minimum: 1
  category:
    type: string
    description: "Speedrun category (e.g., 'any%', '100%')."
  submission_date:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of the submission."
  game_id:
    type: string
    description: "Unique identifier for the game."
  total_prior_runs:
    type: integer
    description: "Total number of prior runs by this runner in this game."
    minimum: 0
    nullable: true
  time_since_first_run_days:
    type: number
    description: "Days elapsed since the runner's first recorded run in this game."
    minimum: 0
    nullable: true
  lagged_competitive_pressure:
    type: integer
    description: "Count of active runners in the 30-day window prior to this run."
    minimum: 0
    nullable: true
additionalProperties: false
