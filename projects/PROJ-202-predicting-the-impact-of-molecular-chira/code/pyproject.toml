[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-202"
version = "0.1.0"
description = "Predicting the Impact of Molecular Chirality on Flavor Perception"
requires-python = ">=3.11"
dependencies = [
    "rdkit",
    "openmm",
    "mdanalysis",
    "scikit-learn",
    "pandas",
    "numpy",
    "pymc",
    "vina",
    "requests",
    "chembl-webresource-client",
    "python-dotenv",
    "ruff",
    "black",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["code"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
