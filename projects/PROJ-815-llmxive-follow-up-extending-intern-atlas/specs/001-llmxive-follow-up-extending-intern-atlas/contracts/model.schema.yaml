# Model Parameters and Metrics Schema
# Defines the structure for model configuration, training parameters, and evaluation metrics
# used in the llmXive follow-up study on extending Intern-Atlas.

version: "1.0.0"
description: "Schema for model training parameters and evaluation metrics"

model_parameters:
  type: object
  required:
    - model_type
    - features
    - target_variable
    - hyperparameters
  properties:
    model_type:
      type: string
      enum:
        - "logistic_regression_binary"
        - "logistic_regression_multinomial"
        - "random_forest_binary"
        - "random_forest_multinomial"
        - "gradient_boosting_binary"
        - "gradient_boosting_multinomial"
      description: "Type of model being trained"
    
    features:
      type: array
      items:
        type: string
      description: "List of feature names used for training"
      example: ["bottleneck_resolution_ratio", "branching_entropy"]
    
    target_variable:
      type: string
      enum:
        - "retraction_status_binary"
        - "retraction_status"
      description: "Target variable for prediction"
    
    hyperparameters:
      type: object
      description: "Model-specific hyperparameters"
      properties:
        C:
          type: number
          description: "Inverse of regularization strength (Logistic Regression)"
        penalty:
          type: string
          enum: ["l1", "l2", "elasticnet", "none"]
          description: "Regularization type"
        solver:
          type: string
          description: "Algorithm for optimization"
        max_iter:
          type: integer
          description: "Maximum number of iterations"
        random_state:
          type: integer
          description: "Random seed for reproducibility"
        n_estimators:
          type: integer
          description: "Number of trees (for tree-based models)"
        max_depth:
          type: integer
          description: "Maximum depth of trees"

training_config:
  type: object
  required:
    - train_test_split
    - stratification
    - seed
  properties:
    train_test_split:
      type: object
      properties:
        test_size:
          type: number
          description: "Proportion of data for testing"
        shuffle:
          type: boolean
          description: "Whether to shuffle data before splitting"
        stratify:
          type: string
          description: "Column name for stratified splitting"
    
    stratification:
      type: boolean
      description: "Whether to use stratified sampling"
    
    seed:
      type: integer
      description: "Random seed for reproducibility"

evaluation_metrics:
  type: object
  required:
    - auc_roc
    - precision
    - recall
    - f1_score
  properties:
    auc_roc:
      type: object
      properties:
        binary:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: "AUC-ROC for binary classification"
        multiclass:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: "AUC-ROC for multiclass (One-vs-Rest)"
      
      precision:
        type: object
        properties:
          macro:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: "Macro-averaged precision"
          weighted:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: "Weighted-averaged precision"
          per_class:
            type: object
            description: "Precision per class"
      
      recall:
        type: object
        properties:
          macro:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: "Macro-averaged recall"
          weighted:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: "Weighted-averaged recall"
          per_class:
            type: object
            description: "Recall per class"
      
      f1_score:
        type: object
        properties:
          macro:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: "Macro-averaged F1 score"
          weighted:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: "Weighted-averaged F1 score"
          per_class:
            type: object
            description: "F1 score per class"
      
      confusion_matrix:
        type: array
        items:
          type: array
          items:
            type: integer
        description: "Confusion matrix as nested arrays"
      
      pr_curve:
        type: object
        properties:
          precision:
            type: array
            items:
              type: number
          recall:
            type: array
            items:
              type: number
          thresholds:
            type: array
            items:
              type: number
        description: "Precision-Recall curve data points"

model_comparison:
  type: object
  properties:
    delta_auc:
      type: object
      properties:
        topological_vs_citation_binary:
          type: number
          description: "AUC difference: Topological Binary - Citation Baseline"
        topological_vs_citation_multinomial:
          type: number
          description: "AUC difference: Topological Multinomial - Citation Baseline"
    
    independent_predictive_power:
      type: boolean
      description: "Whether topological features provide independent predictive power"
    
    statistical_significance:
      type: object
      properties:
        p_value:
          type: number
          description: "P-value from permutation test"
        significant_at_alpha:
          type: boolean
          description: "Whether result is significant at alpha=0.05"

output_schema:
  type: object
  required:
    - model_type
    - parameters
    - metrics
    - timestamp
  properties:
    model_type:
      type: string
      description: "Type of model trained"
    
    parameters:
      $ref: "#/model_parameters"
    
    metrics:
      $ref: "#/evaluation_metrics"
    
    training_config:
      $ref: "#/training_config"
    
    timestamp:
      type: string
      format: date-time
      description: "ISO 8601 timestamp of model training"
    
    data_version:
      type: string
      description: "Version/hash of the training data used"
    
    artifacts:
      type: object
      properties:
        model_path:
          type: string
          description: "Path to saved model pickle"
        coefficients:
          type: object
          description: "Model coefficients (for linear models)"
        feature_importance:
          type: object
          description: "Feature importance scores (for tree-based models)"