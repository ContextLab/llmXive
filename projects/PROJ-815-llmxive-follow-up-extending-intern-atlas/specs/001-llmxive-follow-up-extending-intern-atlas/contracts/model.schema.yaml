$schema: http://json-schema.org/draft-07/schema#
title: Model Training Configuration and Parameters Schema
description: Schema for model hyperparameters, training configuration, and resulting parameters.
type: object
required:
  - model_type
  - target_variable
  - features
  - hyperparameters
  - training_config
properties:
  model_type:
    type: string
    enum:
      - logistic_regression_baseline
      - logistic_regression_topological
    description: Type of model being trained.
  target_variable:
    type: string
    enum:
      - retraction_status_binary
      - retraction_status
    description: The label column used for training.
  features:
    type: array
    items:
      type: string
    description: List of feature column names used in the model.
  hyperparameters:
    type: object
    description: Hyperparameters passed to the estimator.
    properties:
      penalty:
        type: string
        enum: ["l2", "l1", "elasticnet", null]
      C:
        type: number
        minimum: 0.0
      solver:
        type: string
      max_iter:
        type: integer
        minimum: 1
      multi_class:
        type: string
        enum: ["auto", "ovr", "multinomial"]
    required:
      - C
      - solver
      - max_iter
  training_config:
    type: object
    description: Configuration for the training process.
    properties:
      train_year_range:
        type: array
        items:
          type: integer
        minItems: 2
        maxItems: 2
      val_year_range:
        type: array
        items:
          type: integer
        minItems: 2
        maxItems: 2
      stratify_by:
        type: string
        description: Column name to use for stratification (e.g., field_of_study).
      random_seed:
        type: integer
    required:
      - random_seed
  class_weights:
    type: object
    description: Optional class weights used during training.
    additionalProperties:
      type: number
  coefficients:
    type: array
    description: Learned coefficients for each feature (per class if multi-class).
    items:
      type: object
      properties:
        class_label:
          type: integer
        features:
          type: object
          additionalProperties:
            type: number
  intercept:
    type: array
    items:
      type: number
    description: Intercept terms for each class.
additionalProperties: false
