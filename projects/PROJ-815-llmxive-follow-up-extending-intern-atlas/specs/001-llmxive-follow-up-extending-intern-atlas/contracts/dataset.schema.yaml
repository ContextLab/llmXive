$schema: http://json-schema.org/draft-07/schema#
title: Intern-Atlas Extended Dataset Schema
description: Schema for the processed features dataset derived from Intern-Atlas graph and retraction databases.
type: object
required:
  - node_id
  - publication_year
  - field_of_study
  - citation_count
  - bottleneck_resolution_ratio
  - branching_entropy
  - retraction_status
  - retraction_status_binary
  - edge_type_distribution
properties:
  node_id:
    type: string
    description: Unique identifier for the method node (e.g., DOI or internal ID).
  publication_year:
    type: integer
    minimum: 2010
    maximum: 2018
    description: Year the method was published.
  field_of_study:
    type: string
    description: Domain or sub-domain of the research.
  publication_venue:
    type: string
    description: Journal or conference name.
  citation_count:
    type: integer
    minimum: 0
    description: Total number of citations at the time of data extraction.
  bottleneck_resolution_ratio:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: Ratio of (improves + replaces) edges to total outgoing edges.
  branching_entropy:
    type: number
    minimum: 0.0
    description: Shannon entropy of downstream method types.
  edge_type_distribution:
    type: object
    description: Count of outgoing edges by type.
    properties:
      improves:
        type: integer
      replaces:
        type: integer
      extends:
        type: integer
      unknown:
        type: integer
    required:
      - improves
      - replaces
      - extends
      - unknown
  retraction_status:
    type: integer
    enum: [0, 1, 2]
    description: >
      0 = Robust (no retraction),
      1 = Fragile (methodological error/irreproducibility),
      2 = Retraction-Only (fraud/other).
  retraction_status_binary:
    type: integer
    enum: [0, 1]
    description: >
      Binary label for modeling:
      1 = Fragile (original status 1),
      0 = Robust or Retraction-Only (original status 0 or 2).
  is_human_annotated:
    type: boolean
    description: True if all incoming edge types are human-annotated (no LLM inference).
additionalProperties: false
