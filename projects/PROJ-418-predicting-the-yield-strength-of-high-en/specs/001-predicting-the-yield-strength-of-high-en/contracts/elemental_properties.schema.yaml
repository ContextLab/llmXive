$schema: "http://json-schema.org/draft-07/schema#"
title: "Elemental Properties Schema"
type: object
required:
  - element
  - atomic_radius
  - electronegativity
  - valence_electrons
  - melting_point
properties:
  element:
    type: string
    description: "Chemical symbol (e.g., Fe, Ni)."
  atomic_radius:
    type: number
    description: "Atomic radius (pm)."
  electronegativity:
    type: number
    description: "Pauling electronegativity."
  valence_electrons:
    type: integer
    description: "Number of valence electrons."
  melting_point:
    type: number
    description: "Melting temperature (K)."