$schema: "http://json-schema.org/draft-07/schema#"
title: "Elemental Property Record"
type: object
additionalProperties: false
required:
  - element
  - atomic_radius
  - electronegativity
  - melting_point
  - valence_electrons
properties:
  element:
    type: string
    description: "Chemical symbol, e.g., \"Fe\"."
    pattern: "^[A-Z][a-z]?$"
  atomic_radius:
    type: number
    description: "Atomic radius in picometers."
    minimum: 0
  electronegativity:
    type: number
    description: "Pauling electronegativity."
    minimum: 0
  melting_point:
    type: number
    description: "Melting point in Kelvin."
    minimum: 0
  valence_electrons:
    type: integer
    description: "Number of valence electrons."
    minimum: 0
