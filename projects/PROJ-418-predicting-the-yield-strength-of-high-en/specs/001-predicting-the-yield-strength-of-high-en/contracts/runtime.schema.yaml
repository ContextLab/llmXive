$schema: "http://json-schema.org/draft-07/schema#"
title: "Runtime Summary"
type: object
required:
  - status
  - total_seconds
  - cpu_seconds
  - memory_mb
properties:
  status:
    type: string
    enum: ["pass", "fail"]
    description: "Overall pipeline status."
  total_seconds:
    type: number
    description: "Wall‑clock time."
  cpu_seconds:
    type: number
    description: "CPU time consumed."
  memory_mb:
    type: number
    description: "Peak RAM usage."