$schema: "http://json-schema.org/draft-07/schema#"
title: "HEA Composition with Descriptors"
type: array
items:
  type: object
  required:
    - alloy_id
    - features
  additionalProperties: false
  properties:
    alloy_id:
      type: string
      description: "Unique identifier matching the raw dataset."
    features:
      type: object
      description: "Computed compositional descriptors."
      additionalProperties:
        type: number
        description: "Descriptor value (unitless or as defined)."