$schema: "http://json-schema.org/draft-07/schema#"
title: "Provenance Manifest"
type: object
required:
  - seed
  - software_versions
  - checksums
  - timestamp
properties:
  seed:
    type: integer
    description: "Global random seed used for all stochastic steps."
  software_versions:
    type: object
    description: "Mapping from package name to version string."
    additionalProperties:
      type: string
  checksums:
    type: object
    description: "SHA‑256 checksums for each artifact file."
    additionalProperties:
      type: string
  timestamp:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp of pipeline completion."
additionalProperties: false
