$schema: "http://json-schema.org/draft-07/schema#"
title: "Reproducibility Manifest"
type: object
required:
  - seed
  - python_version
  - package_versions
  - timestamps
  - checksums
additionalProperties: false
properties:
  seed:
    type: integer
    description: "Master random seed used throughout the pipeline."
  python_version:
    type: string
    description: "Exact Python version, e.g., '3.11.8'."
  package_versions:
    type: object
    description: "Mapping from package name to version string."
    additionalProperties:
      type: string
  timestamps:
    type: object
    required:
      - start
      - end
    properties:
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
  checksums:
    type: object
    description: "SHA‑256 checksums of key artifacts."
    properties:
      raw_dataset:
        type: string
      elemental_properties:
        type: string
      descriptors:
        type: string
      model:
        type: string
    additionalProperties: false
