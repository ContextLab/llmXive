$schema: "http://json-schema.org/draft-07/schema#"
title: "HEA Yield‑Strength Dataset"
type: array
items:
  type: object
  required:
    - alloy_id
    - composition
    - yield_strength
  additionalProperties: false
  properties:
    alloy_id:
      type: string
      description: "Unique identifier for the alloy."
    composition:
      type: object
      description: "Mapping from element symbol to fractional amount (sums to 1)."
      patternProperties:
        "^[A-Z][a-z]?$":
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: false
      minProperties: 1
    yield_strength:
      type: number
      description: "Experimentally measured yield strength (MPa)."
      minimum: 0
