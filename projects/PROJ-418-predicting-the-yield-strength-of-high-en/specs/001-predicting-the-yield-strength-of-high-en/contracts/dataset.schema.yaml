$schema: "http://json-schema.org/draft-07/schema#"
title: "HEA Dataset Schema"
description: "Schema for the processed HEA dataset with compositional descriptors."
type: "object"
properties:
  composition:
    type: "object"
    additionalProperties:
      type: "number"
      minimum: 0
      maximum: 1
    description: "Atomic fractions of elements in the alloy."
  yield_strength_mpa:
    type: "number"
    minimum: 0
    description: "Yield strength in MPa."
  phase:
    type: "string"
    enum: ["Single-phase", "BCC", "FCC", "HCP", "Multi-phase"]
    description: "Phase structure of the alloy."
  testing_temp_c:
    type: "number"
    description: "Testing temperature in Celsius."
  delta:
    type: "number"
    description: "Atomic size mismatch."
  delta_chi:
    type: "number"
    description: "Electronegativity variance."
  vec:
    type: "number"
    description: "Valence electron concentration."
  mixing_entropy:
    type: "number"
    description: "Mixing entropy."
  delta_tm:
    type: "number"
    description: "Melting temperature variance."
required:
  - composition
  - yield_strength_mpa
  - phase
  - testing_temp_c
  - delta
  - delta_chi
  - vec
  - mixing_entropy
  - delta_tm
additionalProperties: false