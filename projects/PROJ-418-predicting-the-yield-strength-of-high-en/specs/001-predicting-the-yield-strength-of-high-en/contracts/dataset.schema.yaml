$schema: "http://json-schema.org/draft-07/schema#"
title: "HEA Yield‑Strength Dataset"
type: object
required:
  - composition
  - yield_strength
properties:
  composition:
    type: object
    description: "Mapping from element symbol (e.g., 'Fe') to atomic fraction (0‑1). All fractions must sum to a complete whole."
    patternProperties:
      "^[A-Z][a-z]?$":
        type: number
        minimum: 0
        maximum: 1
    additionalProperties: false
  yield_strength:
    type: number
    description: "Experimental yield strength in MPa."
    minimum: 0
  sample_id:
    type: string
    description: "Optional unique identifier for the record."
additionalProperties: false
