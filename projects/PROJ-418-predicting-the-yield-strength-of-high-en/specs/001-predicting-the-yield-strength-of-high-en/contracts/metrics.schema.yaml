$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Performance Metrics"
type: object
additionalProperties: false
required:
  - r2
  - pearson_r
  - p_value
  - dataset_split
properties:
  r2:
    type: number
    description: "Coefficient of determination (R²)."
    minimum: -1
    maximum: 1
  pearson_r:
    type: number
    description: "Pearson correlation coefficient."
    minimum: -1
    maximum: 1
  p_value:
    type: number
    description: "Two‑tailed p‑value for the correlation."
    minimum: 0
    maximum: 1
  dataset_split:
    type: string
    description: "Which split the metrics refer to."
    enum:
      - "test"
      - "external"
