$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Performance Metrics"
type: object
required:
  - r2
  - pearson_r
  - p_value
  - bootstrap_ci
properties:
  r2:
    type: number
    description: "Coefficient of determination on the held‑out test set."
    minimum: -1
    maximum: 1
  pearson_r:
    type: number
    description: "Pearson correlation coefficient between predictions and true yield strength."
    minimum: -1
    maximum: 1
  p_value:
    type: number
    description: "Two‑tailed p‑value for the Pearson correlation."
    minimum: 0
    maximum: 1
  bootstrap_ci:
    type: array
    description: "Bootstrap confidence interval for R² (lower, upper) at a conventional confidence level."
    items:
      type: number
    minItems: 2
    maxItems: 2
additionalProperties: false
