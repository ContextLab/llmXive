$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Performance Metrics Schema"
description: "Schema for the output metrics of the model training and evaluation phase."
type: "object"
required:
  - "models"
properties:
  models:
    type: "array"
    items:
      type: "object"
      required:
        - "model_type"
        - "r2"
        - "mae"
        - "rmse"
        - "bootstrap_ci_lower"
        - "bootstrap_ci_upper"
      properties:
        model_type:
          type: "string"
          enum:
            - "RF"
            - "GBM"
            - "OLS"
          description: "Type of the model."
        r2:
          type: "number"
          description: "Coefficient of determination (R²)."
        mae:
          type: "number"
          description: "Mean Absolute Error."
        rmse:
          type: "number"
          description: "Root Mean Squared Error."
        bootstrap_ci_lower:
          type: "number"
          description: "Lower bound of the 95% bootstrap confidence interval for R²."
        bootstrap_ci_upper:
          type: "number"
          description: "Upper bound of the 95% bootstrap confidence interval for R²."
        permutation_p_values:
          type: "object"
          description: "Permutation p-values for each descriptor (k=5)."
          additionalProperties:
            type: "number"
        significant_descriptors:
          type: "array"
          items:
            type: "string"
          description: "List of descriptors with corrected p-values < alpha."
        corrected_p_values:
          type: "object"
          description: "Multiple-comparison corrected p-values (Bonferroni k=5)."
          additionalProperties:
            type: "number"