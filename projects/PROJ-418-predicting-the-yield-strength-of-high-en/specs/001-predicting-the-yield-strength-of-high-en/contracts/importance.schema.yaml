$schema: "http://json-schema.org/draft-07/schema#"
title: "Permutation Importance Result"
type: object
additionalProperties: false
required:
  - feature
  - importance_score
  - p_value
  - significant
properties:
  feature:
    type: string
    description: "Descriptor name (e.g., \"delta_atomic_size\")."
  importance_score:
    type: number
    description: "Mean decrease in model performance after permutation."
  p_value:
    type: number
    description: "Holm‑Bonferroni‑adjusted p‑value."
    minimum: 0
    maximum: 1
  significant:
    type: boolean
    description: "True if p_value < 0.05 after correction."
