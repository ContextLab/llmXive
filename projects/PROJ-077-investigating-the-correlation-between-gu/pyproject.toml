[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PROJ-077-investigating-the-correlation-between-gu"
version = "0.1.0"
description = "Gut Microbiome and Cognitive Performance Analysis"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.0.3",
    "numpy==1.24.3",
    "scikit-bio==0.5.9",
    "scikit-learn==1.3.0",
    "statsmodels==0.14.0",
    "matplotlib==3.7.2",
    "seaborn==0.12.2",
    "pyyaml==6.0.1",
    "scipy==1.11.1"
]

[tool.flake8]
max-line-length = 88
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs"
]
ignore = [
    "E203",
    "E501",
    "W503"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''