# PhysisForcing Training Configuration
# Default configuration for the llmXive follow-up project

experiment_name: "physs_filter_experiment"
seed: 42
cpu_only: true
max_memory_gb: 6.0

# Filtering parameters
filter_discard_percent: 0.4

# Training hyperparameters
batch_size: 1
num_workers: 0
pin_memory: false
training_epochs: 10
learning_rate: 0.0001
weight_decay: 0.01

# Model architecture parameters (targeting ~50M params)
model_params:
  channels: 64
  num_blocks: 4
  attention_heads: 4
  target_params_millions: 50.0

# Directory paths
paths:
  data_root: "data"
  curated_dir: "data/curated"
  raw_dir: "data/raw"
  model_output_dir: "models"
  checkpoint_dir: "models/checkpoints"

# Validation settings
validation:
  check_nan_loss: true
  nan_retry_limit: 3
  timeout_hours: 4.0
