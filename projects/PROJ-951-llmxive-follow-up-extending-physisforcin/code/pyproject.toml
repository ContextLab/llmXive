[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-physisforcin"
version = "0.1.0"
description = "Extending PhysisForcing: Physics Filter for Synthetic Video Dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "pybullet",
    "mujoco",
    "diffusers",
    "transformers",
    "scikit-learn",
    "opencv-python",
    "pandas",
    "numpy",
    "requests",
    "datasets",
    "ruff",
    "black",
]

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
