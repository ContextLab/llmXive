# Ruff configuration for llmXive Physics Filter
# This file extends settings from pyproject.toml if needed,
# but currently we rely on pyproject.toml for full configuration.
# Included for tooling compatibility.

line-length = 88
target-version = "py39"

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[lint.per-file-ignores]
"code/tests/*" = ["S101", "T201"]
