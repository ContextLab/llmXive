# Standalone Ruff configuration file (also defined in pyproject.toml)
# This file is provided for IDE integration and direct CLI usage.
line-length = 100
target-version = "py39"

select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[isort]
known-first-party = ["src", "tests"]
force-sort-within-sections = true
