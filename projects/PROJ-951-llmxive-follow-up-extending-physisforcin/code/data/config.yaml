# PhysisForcing Configuration Schema
# This file defines all required keys for the physics-filter pipeline.
# Generated by T007b to resolve FR-003 with a fixed discard rate of 0.4.

# --- Core Project Settings ---
project_id: "PROJ-951-llmxive-follow-up-extending-physisforcin"
seed: 42
cpu_only: true

# --- Physics Filter Settings (FR-003 Resolution) ---
# Explicitly sets the discard rate to 0.4 (40%) as per specification.
filter_discard_percent: 0.4

# --- Model Settings ---
generation:
  model_id: "Wan-AI/Wan2.1-Turbo"
  max_frames: 48
  resolution: "480p"
  offload_to_gpu: false  # Set to true if CPU OOM occurs and GPU offload is available

training:
  base_channels: 64
  down_blocks: 4
  up_blocks: 4
  attention_heads: 8
  target_params_millions: 50
  max_epochs: 100
  patience: 5
  learning_rate: 1.0e-4
  batch_size: 4

evaluation:
  eval_set_size: 30
  benchmark:
    - "R-Bench"
    - "PAI-Bench"
  orthogonality_threshold: 0.95

# --- Paths (Relative to project root) ---
paths:
  data_raw: "data/raw"
  data_curated: "data/curated"
  data_eval: "data/eval"
  data_validation: "data/validation"
  data_control: "data/control"
  models_dir: "models"
  logs_dir: "logs"
  figures_dir: "figures"

# --- Resource Limits ---
memory:
  max_ram_gb: 6.0
  timeout_hours: 4.0
