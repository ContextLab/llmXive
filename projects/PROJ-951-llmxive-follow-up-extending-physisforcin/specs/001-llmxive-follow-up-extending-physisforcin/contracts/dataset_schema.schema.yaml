$schema: "http://json-schema.org/draft-07/schema#"
title: "RawVideoDataset"
type: object
required:
  - dataset_id
  - source_url
  - video_count
  - checksum_algorithm
  - checksums
properties:
  dataset_id:
    type: string
    description: "Identifier for the raw acquired dataset batch."
  source_url:
    type: string
    description: "Canonical verified URL the videos were downloaded from (Constitution Principle I)."
  video_count:
    type: integer
    minimum: 1
    description: "Number of video files in this batch."
  checksum_algorithm:
    type: string
    enum:
      - "sha256"
    description: "Algorithm used for data-hygiene checksums (Constitution Principle III)."
  checksums:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - file_path
        - digest
      properties:
        file_path:
          type: string
          description: "Relative path under data/raw/wan21_videos/."
        digest:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: "Hex SHA-256 digest of the file."
      additionalProperties: false
additionalProperties: false