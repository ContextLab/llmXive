$schema: "http://json-schema.org/draft-07/schema#"
title: "VideoSample Schema"
description: "Schema for a single video sample with physics metadata"
type: object
required:
  - id
  - prompt
  - video_path
  - physics_score
  - status
properties:
  id:
    type: string
    description: "Unique identifier for the video sample"
  prompt:
    type: string
    description: "Text prompt used for generation"
  video_path:
    type: string
    description: "Relative path to the MP4 file"
  physics_score:
    type: number
    description: "Composite physics consistency score (0.0 to 1.0)"
    minimum: 0.0
    maximum: 1.0
  continuity_score:
    type: number
    description: "Trajectory continuity score"
    minimum: 0.0
    maximum: 1.0
  contact_score:
    type: number
    description: "Contact conservation score"
    minimum: 0.0
    maximum: 1.0
  action_variance:
    type: number
    description: "Action variance (causal signal)"
    minimum: 0.0
  object_displacement:
    type: number
    description: "Object displacement (causal signal)"
    minimum: 0.0
  status:
    type: string
    enum:
      - "pending"
      - "pass"
      - "fail"
    description: "Filter status"
  generated_at:
    type: string
    format: date-time
    description: "ISO8601 timestamp of generation"
examples:
  - id: "vid-001"
    prompt: "Robot arm picking a block"
    video_path: "data/raw/vid-001.mp4"
    physics_score: 0.85
    continuity_score: 0.90
    contact_score: 0.80
    action_variance: 0.50
    object_displacement: 0.30
    status: "pass"
    generated_at: "2026-07-13T10:00:00Z"