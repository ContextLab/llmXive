$schema: "http://json-schema.org/draft-07/schema#"
title: "VideoSample Schema"
type: object
required:
  - id
  - prompt
  - video_path
  - physics_score
  - status
properties:
  id:
    type: string
    description: "Unique identifier for the video sample."
  prompt:
    type: string
    description: "Text prompt used for generation."
  video_path:
    type: string
    description: "Relative path to the MP4 file."
  physics_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Composite physics consistency score (0 – 1)."
  continuity_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Trajectory continuity score."
  contact_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Contact conservation score."
  action_variance:
    type: number
    minimum: 0.0
    description: "Action variance (causal signal)."
  object_displacement:
    type: number
    minimum: 0.0
    description: "Object displacement (causal signal)."
  status:
    type: string
    enum:
      - "pending"
      - "pass"
      - "fail"
    description: "Filter status."
  generated_at:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp of generation."
additionalProperties: false
