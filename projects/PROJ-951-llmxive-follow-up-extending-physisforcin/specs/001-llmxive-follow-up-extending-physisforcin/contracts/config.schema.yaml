$schema: "http://json-schema.org/draft-07/schema#"
title: "ProjectConfig"
description: "Schema for the project configuration file (config.yaml)."
type: "object"
required:
  - generation_batch_size
  - filter_discard_percent
  - training_epochs
properties:
  generation_batch_size:
    type: "integer"
    description: "Number of videos to generate per run."
    minimum: 1
    maximum: 1000
  filter_discard_percent:
    type: "number"
    description: "Percentage of videos to discard (bottom) based on physics score. Default setting discards a moderate proportion of low‑scoring videos, retaining the majority of higher‑scoring ones."
    minimum: 0.0
    maximum: 100.0
    default: a standard default value
  training_epochs:
    type: "integer"
    description: "Number of epochs for diffusion training."
    minimum: 1
    maximum: 100
  cpu_only:
    type: "boolean"
    description: "Force CPU execution (default true)."
    default: true
  kaggle_offload:
    type: "boolean"
    description: "Allow GPU offload to Kaggle if CPU fails."
    default: true
  equivalence_margin:
    type: "number"
    description: "Equivalence margin for TOST (e.g., a modestly sized margin)."
    default: a typical baseline value
additionalProperties: false