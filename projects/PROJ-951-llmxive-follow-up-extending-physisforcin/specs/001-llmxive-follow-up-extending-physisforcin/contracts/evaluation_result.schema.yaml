$schema: "http://json-schema.org/draft-07/schema#"
title: "EvaluationResult"
type: object
required:
  - model_id
  - r_bench_score
  - pai_bench_score
  - sample_count
  - tost_p_value
  - equivalence_margin
  - equivalent
properties:
  model_id:
    type: string
    description: "ID of the evaluated diffusion model."
  r_bench_score:
    type: number
    description: "Physical consistency score on R‑Bench."
  pai_bench_score:
    type: number
    description: "Physical consistency score on PAI‑Bench."
  sample_count:
    type: integer
    minimum: 30
    description: "Number of evaluation samples (n ≥ 30)."
  tost_p_value:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "P‑value from the Two‑One‑Sided Tests."
  equivalence_margin:
    type: number
    description: "Equivalence margin used (e.g., 0.15)."
  equivalent:
    type: boolean
    description: "True if the model is equivalent to baseline within the margin."
additionalProperties: false
