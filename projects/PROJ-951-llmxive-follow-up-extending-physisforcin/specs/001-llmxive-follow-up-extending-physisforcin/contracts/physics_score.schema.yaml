$schema: "http://json-schema.org/draft-07/schema#"
title: "PhysicsScore"
description: "Schema for physics consistency scores generated by the PyBullet filter."
type: "object"
properties:
  video_id:
    type: "string"
    description: "Unique identifier for the video sample."
  physics_score:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Normalized physics consistency score (0.0 = impossible, 1.0 = perfect)."
  trajectory_continuity:
    type: "number"
    description: "Score for trajectory smoothness and continuity."
  contact_conservation:
    type: "number"
    description: "Score for physical contact conservation (no clipping)."
  simulation_status:
    type: "string"
    enum: ["success", "crash", "timeout"]
    description: "Status of the physics simulation."
  passed_filter:
    type: "boolean"
    description: "True if score >= 60th percentile of the batch."
required:
  - video_id
  - physics_score
  - trajectory_continuity
  - contact_conservation
  - simulation_status
  - passed_filter
additionalProperties: false
