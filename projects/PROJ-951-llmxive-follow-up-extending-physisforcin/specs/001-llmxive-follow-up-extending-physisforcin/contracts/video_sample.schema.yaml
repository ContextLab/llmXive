$schema: "http://json-schema.org/draft-07/schema#"
title: "VideoSample"
description: "Schema for a single video sample with metadata."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique UUID for the video."
  prompt:
    type: "string"
    description: "Text prompt used for generation."
  video_path:
    type: "string"
    description: "Relative path to the MP4 file."
  physics_score:
    type: "number"
    description: "Physics consistency score."
  pass_status:
    type: "boolean"
    description: "Whether the video passed the filter."
  generation_timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of generation."
required:
  - id
  - prompt
  - video_path
  - physics_score
  - pass_status
  - generation_timestamp
additionalProperties: false
