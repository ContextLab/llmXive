$schema: "http://json-schema.org/draft-07/schema#"
title: "VideoSample"
description: "Schema for a single generated video sample with physics metadata."
type: "object"
required:
  - id
  - prompt
  - raw_path
  - physics_score
  - status
  - generation_seed
  - timestamp
properties:
  id:
    type: "string"
    description: "Unique UUID for the sample."
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  prompt:
    type: "string"
    description: "Text prompt used for generation."
    minLength: 1
  raw_path:
    type: "string"
    description: "Relative path to the MP4 file in data/raw/."
    pattern: "^data/raw/.*\\.mp4$"
  physics_score:
    type: "number"
    description: "Score from PyBullet filter (0-100)."
    minimum: 0.0
    maximum: 100.0
  status:
    type: "string"
    description: "Pass or fail status."
    enum:
      - "pass"
      - "fail"
  generation_seed:
    type: "integer"
    description: "Random seed used for generation."
    minimum: 0
  timestamp:
    type: "string"
    description: "ISO 8601 timestamp of generation."
    format: "date-time"
additionalProperties: false