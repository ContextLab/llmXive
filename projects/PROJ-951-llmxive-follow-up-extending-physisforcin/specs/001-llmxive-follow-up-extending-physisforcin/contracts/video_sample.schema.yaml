$schema: "http://json-schema.org/draft-07/schema#"
title: "VideoSample"
type: object
required:
  - video_id
  - prompt
  - video_path
  - generation_timestamp
  - physics_score
  - filter_status
  - condition
properties:
  video_id:
    type: string
    description: "Unique identifier for the video sample."
  prompt:
    type: string
    description: "Text prompt used for generation."
  video_path:
    type: string
    description: "Relative path to the MP4 file."
  generation_timestamp:
    type: string
    format: date-time
    description: "ISO-8601 timestamp of acquisition/generation."
  physics_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Normalized physics consistency score (0 – 1); raw 0‑100 scale divided by 100."
  filter_status:
    type: string
    enum:
      - "pass"
      - "fail"
      - "error"
    description: "Result of the PyBullet physics filter."
  condition:
    type: string
    enum:
      - "filtered"
      - "unfiltered"
    description: "Experimental condition this sample belongs to."
  simulation_failure:
    type: boolean
    default: false
    description: "True if the PyBullet simulation crashed or timed out on this video."
additionalProperties: false