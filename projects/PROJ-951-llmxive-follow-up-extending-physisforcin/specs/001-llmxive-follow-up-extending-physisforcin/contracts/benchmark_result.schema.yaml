$schema: "http://json-schema.org/draft-07/schema#"
title: "BenchmarkResult"
type: object
required:
  - result_id
  - model_id
  - benchmark_name
  - score
  - mujoco_physics_score
  - sample_count
properties:
  result_id:
    type: string
    description: "Unique identifier for the result record."
  model_id:
    type: string
    description: "Reference to the TrainedModel or named baseline (e.g., physisforcing_baseline, unfiltered_baseline)."
  benchmark_name:
    type: string
    enum:
      - "R-Bench"
      - "PAI-Bench"
    description: "Benchmark on which the score was computed (Constitution Principle VII)."
  score:
    type: number
    minimum: 0.0
    description: "Benchmark score."
  mujoco_physics_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "MuJoCo-validated physical consistency score (primary construct, SC-002)."
  sample_count:
    type: integer
    minimum: 1
    description: "Number of evaluation samples behind this result."
  training_duration_seconds:
    type: number
    minimum: 0.0
    description: "Training wall time in seconds (SC-005), if applicable to this model."
additionalProperties: false