$schema: "http://json-schema.org/draft-07/schema#"
title: "BenchmarkResult"
type: object
required:
  - result_id
  - model_id
  - r_bench_score
  - pai_bench_score
  - tost_p_value
  - equivalence_flag
  - training_duration
properties:
  result_id:
    type: string
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    description: "UUID for the result record."
  model_id:
    type: string
    description: "Reference to the TrainedModel."
  r_bench_score:
    type: number
    minimum: 0.0
    description: "Physical consistency score on R‑Bench."
  pai_bench_score:
    type: number
    minimum: 0.0
    description: "Physical consistency score on PAI‑Bench."
  downstream_success_rate:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Success rate on a separate control task."
    default: 0.0
  mujoco_correlation:
    type: number
    minimum: -1.0
    maximum: 1.0
    description: "Pearson correlation with MuJoCo validator (if computed)."
    default: 0.0
  tost_p_value:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "P‑value from the TOST equivalence test."
  equivalence_flag:
    type: boolean
    description: "True if equivalent within the 15 % margin."
  training_duration:
    type: number
    minimum: 0.0
    description: "Training time in seconds."
additionalProperties: false
