$schema: "http://json-schema.org/draft-07/schema#"
title: "CuratedDataset"
type: object
required:
  - dataset_id
  - total_samples
  - threshold_percentile
  - threshold_score
  - samples
  - created_at
  - augmented
  - augmentation_method
properties:
  dataset_id:
    type: string
    description: "Unique identifier for the curated dataset."
  total_samples:
    type: integer
    description: "Number of VideoSample entries in the curated set."
  threshold_percentile:
    type: number
    minimum: 0
    maximum: 100
    description: "Percentile used to retain top videos (e.g., 60)."
  threshold_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Normalized physics score corresponding to the percentile."
  samples:
    type: array
    items:
      $ref: "#/definitions/VideoSampleRef"
  created_at:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp of manifest creation."
  augmented:
    type: boolean
    description: "True if augmentations were applied to reach the target sample size."
  augmentation_method:
    type: string
    description: "Method used for augmentation (e.g., \"geometric_transforms\")."
definitions:
  VideoSampleRef:
    type: object
    required:
      - video_id
      - physics_score
      - continuity_score
      - contact_score
    properties:
      video_id:
        type: string
      physics_score:
        type: number
        minimum: 0.0
        maximum: 1.0
      continuity_score:
        type: number
      contact_score:
        type: number
additionalProperties: false
