$schema: "http://json-schema.org/draft-07/schema#"
title: "P300 Measure Schema"
description: "Schema for extracted P300 metrics per subject and condition."
type: "object"
properties:
  subject_id:
    type: "string"
    description: "Anonymized participant identifier."
  condition:
    type: "string"
    enum:
      - "simulated"
      - "real"
    description: "Type of social validation condition."
  p300_amplitude:
    type: "number"
    description: "Peak amplitude in microvolts (µV)."
    minimum: -20.0
    maximum: 20.0
  p300_latency:
    type: "number"
    description: "Time to peak in milliseconds (ms)."
    minimum: 0.0
    maximum: 1000.0
  trial_count:
    type: "integer"
    description: "Number of valid trials included in the average."
    minimum: 0
  rejected:
    type: "boolean"
    description: "True if the subject was excluded due to QC failure."
required:
  - subject_id
  - condition
  - p300_amplitude
  - p300_latency
  - trial_count
  - rejected
additionalProperties: false
