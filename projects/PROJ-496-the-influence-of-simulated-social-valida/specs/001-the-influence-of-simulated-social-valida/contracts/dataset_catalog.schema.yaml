$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Catalog Schema"
description: "Schema for the catalog of candidate datasets found during search."
type: "object"
properties:
  dataset_id:
    type: "string"
    description: "Unique dataset identifier (e.g., OpenNeuro ID)."
  task_description:
    type: "string"
    description: "Brief description of the experimental task."
  feedback_type:
    type: "string"
    enum:
      - "simulated"
      - "real"
      - "mixed"
      - "unknown"
    description: "Type of social feedback provided."
  anxiety_measure:
    type: "string"
    description: "Name of the anxiety scale used (e.g., LSAS, SPIN) or 'none'."
  file_urls:
    type: "array"
    items:
      type: "string"
      format: "uri"
    description: "List of verified download URLs."
  status:
    type: "string"
    enum:
      - "eligible"
      - "sim-only"
      - "real-only"
      - "partial"
      - "none"
    description: "Eligibility status based on spec criteria."
required:
  - dataset_id
  - task_description
  - feedback_type
  - anxiety_measure
  - file_urls
  - status
additionalProperties: false
