$schema: "http://json-schema.org/draft-07/schema#"
title: "HubSet"
type: "object"
properties:
  subject_id:
    type: "string"
    description: "Unique identifier for the subject"
  atlas_name:
    type: "string"
    description: "Name of the atlas"
  metric_type:
    type: "string"
    enum:
      - "degree"
      - "betweenness"
    description: "Centrality metric used"
  threshold_percent:
    type: "number"
    description: "Percentage of nodes considered hubs (e.g., 0.10)"
  hub_count:
    type: "integer"
    description: "Number of hubs (floor(N * threshold_percent))"
  hub_nodes:
    type: "array"
    items:
      type: "integer"
    description: "Indices of the hub nodes"
required:
  - subject_id
  - atlas_name
  - metric_type
  - threshold_percent
  - hub_count
  - hub_nodes
additionalProperties: false
