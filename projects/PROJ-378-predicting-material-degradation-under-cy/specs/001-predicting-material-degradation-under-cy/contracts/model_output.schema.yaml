$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelOutput"
description: "Schema for the model training results and predictions. If data is unavailable, this file will contain a 'gap_report' instead of model results."
type: "object"
properties:
  model_results:
    type: "array"
    items:
      type: "object"
      properties:
        model_type:
          type: "string"
          enum:
            - "ElasticNet"
            - "RandomForest"
            - "GradientBoosting"
        mean_r2:
          type: "number"
        std_r2:
          type: "number"
        feature_importance:
          type: "array"
          items:
            type: "number"
        p_values:
          type: "array"
          items:
            type: "number"
        significant_features:
          type: "array"
          items:
            type: "string"
      required:
        - model_type
        - mean_r2
        - std_r2
  prediction_intervals:
    type: "array"
    items:
      type: "object"
      properties:
        point_estimate:
          type: "number"
        lower_bound:
          type: "number"
        upper_bound:
          type: "number"
        confidence_level:
          type: "string"
          const: "[deferred]"
      required:
        - point_estimate
        - lower_bound
        - upper_bound
        - confidence_level
  gap_report:
    type: "object"
    properties:
      status:
        type: "string"
        const: "coverage_gap"
      missing_columns:
        type: "array"
        items:
          type: "string"
      recommendation:
        type: "string"
    required:
      - status
      - missing_columns
      - recommendation
required:
  - model_results
  - prediction_intervals
  - gap_report
additionalProperties: false