$schema: "http://json-schema.org/draft-07/schema#"
title: "MaterialDegradationDataset"
description: "Schema for the unified material degradation dataset. Note: This schema defines the expected structure if data were available. If data is unavailable, the 'status' will be 'coverage_gap' and 'rows' will be empty."
type: "object"
properties:
  metadata:
    type: "object"
    properties:
      source:
        type: "string"
        description: "The verified source URL used."
      timestamp:
        type: "string"
        format: "date-time"
        description: "Creation timestamp."
      status:
        type: "string"
        enum:
          - "success"
          - "coverage_gap"
          - "error"
        description: "Pipeline status."
      missing_columns:
        type: "array"
        items:
          type: "string"
        description: "List of required columns not found (if status is coverage_gap)."
    required:
      - source
      - timestamp
      - status
  rows:
    type: "array"
    items:
      type: "object"
      properties:
        source_id:
          type: "string"
          description: "Original row ID."
        composition:
          type: "object"
          additionalProperties:
            type: "number"
          description: "Map of element to percentage."
        stress_amplitude:
          type: "number"
          description: "Stress amplitude in MPa."
        frequency:
          type: "number"
          description: "Frequency in Hz."
        r_ratio:
          type: "number"
          description: "Stress ratio."
        degradation_metric:
          type: "number"
          description: "Target variable (RUL or stiffness loss)."
        censored:
          type: "boolean"
          description: "Whether the data point is censored."
      required:
        - source_id
        - stress_amplitude
        - degradation_metric
      additionalProperties: false
required:
  - metadata
  - rows
additionalProperties: false