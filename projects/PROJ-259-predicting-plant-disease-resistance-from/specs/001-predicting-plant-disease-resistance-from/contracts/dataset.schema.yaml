$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Manifest Schema"
description: "Schema for data_manifest.yaml to ensure provenance and integrity."
type: object
required:
  - datasets
  - generated_at
  - checksums
properties:
  datasets:
    type: array
    items:
      type: object
      required:
        - id
        - source_type
        - source_url
        - retrieval_date
      properties:
        id:
          type: string
          description: "Unique identifier for the dataset."
        source_type:
          type: string
          enum:
            - REAL
            - SIMULATED
          description: "Whether data is from a real source (NCBI/MetaboLights) or synthetic generation (CI only)."
        source_url:
          type: string
          description: "URL for real data (NCBI SRA/MetaboLights) or script path for synthetic data."
        retrieval_date:
          type: string
          format: date-time
          description: "ISO 8601 timestamp of retrieval."
        sample_count:
          type: integer
          minimum: 0
          description: "Number of samples in the dataset."
        modalities:
          type: array
          items:
            type: string
            enum:
              - SNP
              - METABOLITE
              - PHENOTYPE
          description: "List of data modalities present."
  generated_at:
    type: string
    format: date-time
    description: "Timestamp when the manifest was generated."
  checksums:
    type: object
    description: "Map of file paths to SHA-256 checksums."
    additionalProperties:
      type: string
      pattern: "^[a-f0-9]{64}$"
      description: "SHA-256 hash of the file."
