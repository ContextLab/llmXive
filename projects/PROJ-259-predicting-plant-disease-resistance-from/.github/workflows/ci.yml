name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint:
    name: Lint (flake8 & black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run flake8
        run: |
          flake8 code/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # flake8 will exit with non-zero if errors found
          flake8 code/ tests/ --count --max-line-length=120 --statistics

      - name: Run black check
        run: |
          black --check code/ tests/ --line-length 120

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Unit Tests
        run: |
          pytest tests/ -v --tb=short

      - name: Run Pipeline (Simulation Mode)
        env:
          MAX_MEMORY_GB: 7
          MAX_RUNTIME_HOURS: 6
        run: |
          python code/main.py