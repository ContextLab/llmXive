target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = []
line-length = 88
indent-width = 4

[per-file-ignores]
# Allow longer lines in config files or specific test files if needed
"tests/*" = ["E501"]
"code/config.py" = ["E501"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"