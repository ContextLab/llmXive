# Ruff configuration for llmXive project
target-version = "py311"
select = ["E", "F", "W", "I"]

# Ignore specific rules if needed (none currently)
# ignore = []

# Line length consistent with project standards
line-length = 88

# Exclude generated or third-party code
exclude = [
    ".git",
    "__pycache__",
    ".ruff_cache",
    "data/*",
    "docs/*",
    "build/*",
    "dist/*",
]