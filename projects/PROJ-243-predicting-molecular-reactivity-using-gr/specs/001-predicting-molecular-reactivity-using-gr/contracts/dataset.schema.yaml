$schema: "http://json-schema.org/draft-07/schema#"
title: "MolecularGraphDataset"
description: "Schema for the preprocessed molecular graph dataset used in training."
type: "object"
properties:
  metadata:
    type: "object"
    properties:
      source:
        type: "string"
        description: "Source dataset URL (e.g., HuggingFace QM9)."
      version:
        type: "string"
        description: "Version of the preprocessing pipeline."
      checksum:
        type: "string"
        description: "SHA-256 checksum of the raw source file."
    required:
      - "source"
      - "version"
      - "checksum"
  graphs:
    type: "array"
    description: "List of molecular graph objects."
    items:
      type: "object"
      properties:
        molecule_id:
          type: "string"
          description: "Unique identifier for the molecule."
        smiles:
          type: "string"
          description: "SMILES string of the molecule."
        node_features:
          type: "array"
          description: "List of node feature vectors."
          items:
            type: "object"
            properties:
              atomic_number:
                type: "integer"
              hybridization:
                type: "integer"
              formal_charge:
                type: "integer"
              num_neighbors:
                type: "integer"
            required:
              - "atomic_number"
              - "hybridization"
              - "formal_charge"
              - "num_neighbors"
        edge_features:
          type: "array"
          description: "List of edge feature vectors."
          items:
            type: "object"
            properties:
              bond_type:
                type: "integer"
                description: "1: Single, 2: Double, 3: Triple, 4: Aromatic."
              conjugation:
                type: "boolean"
              in_ring:
                type: "boolean"
            required:
              - "bond_type"
              - "conjugation"
              - "in_ring"
        target:
          type: "object"
          properties:
            homo_lumo_gap:
              type: "number"
              description: "HOMO-LUMO gap in eV."
          required:
            - "homo_lumo_gap"
        split:
          type: "string"
          enum:
            - "train"
            - "val"
            - "test"
          description: "Scaffold-based split assignment."
        similarity_score:
          type: "number"
          description: "Max Tanimoto similarity to training set (used for filtering)."
      required:
        - "molecule_id"
        - "smiles"
        - "node_features"
        - "edge_features"
        - "target"
        - "split"
required:
  - "metadata"
  - "graphs"
