[project]
name = "llmxive-proj-243"
version = "0.1.0"
description = "Predicting Molecular Reactivity Using Graph Neural Networks"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "rdkit",
    "scikit-learn",
    "pandas",
    "datasets",
    "networkx",
    "psutil",
    "ruff",
    "black",
    "flake8",
    "pytest",
    "scipy",
    "parquet",
    "pyarrow"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''