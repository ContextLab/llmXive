[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-243"
version = "0.1.0"
description = "Predicting Molecular Reactivity Using Graph Neural Networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "rdkit",
    "torch-geometric",
    "scikit-learn",
    "pandas",
    "datasets",
    "networkx",
    "psutil",
    "pyyaml",
    "requests",
    "chembl_webresource_client",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | artifacts
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "data",
    "artifacts",
    "venv",
]

[tool.ruff.per-file-ignores]
# Allow unused imports in __init__.py
"__init__.py" = ["F401"]
# Allow unused imports in test files for fixtures
"tests/*" = ["F401"]

[tool.ruff.isort]
known-first-party = ["code", "utils", "data"]
force-sort-within-sections = true
