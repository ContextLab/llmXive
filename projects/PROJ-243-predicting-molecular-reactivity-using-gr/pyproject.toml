[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-molecular-reactivity"
version = "0.1.0"
description = "Predicting Molecular Reactivity Using Graph Neural Networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "rdkit",
    "torch-geometric",
    "scikit-learn",
    "pandas",
    "datasets",
    "networkx",
    "psutil",
    "pyyaml",
    "requests",
    "chembl_webresource_client",
    "scipy",
    "numpy"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0"
]

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "D",   # pydocstyle
]
ignore = [
    "E203", # Whitespace before ':' (conflicts with black)
    "E501", # Line too long (handled by black)
    "W503", # Line break before binary operator (conflicts with black)
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D203", # 1 blank line required before class docstring (conflicts with D211)
    "D213", # Multi-line docstring summary should start at the second line (conflicts with D212)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["D", "S"]
"code/data/*" = ["D"]
"code/utils/*" = ["D"]

[tool.ruff.isort]
known-first-party = ["config", "utils", "data", "models"]
known-third-party = [
    "torch", "rdkit", "pandas", "numpy", "scipy", "sklearn", 
    "datasets", "networkx", "requests", "yaml"
]
force-single-line = false
lines-after-imports = 2

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | artifacts
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
