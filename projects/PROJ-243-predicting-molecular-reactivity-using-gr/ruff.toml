[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E731", "F403"]
target-version = "py311"

[lint.isort]
known-first-party = ["code", "utils", "config"]
force-single-line = true

[format]
line-length = 88
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false