    \ 0.31 consistent with k=6, p=0.2)"
  sig: 93e4f12afeabd5a4424cbe0fe8a3e365793affb43010c281d230e429f9d08991
T007:
  c: false
  h: 885b1150986c797d59a9ce8694b0c10a18ffcd393acbab4844fb2aaf91d6dff9
  r: "The test file exists and is substantive, but it does not use `psutil` as required:\
    \ on Linux/macOS it uses `resource.getrusage` (ru_maxrss), with psutil only as\
    \ a Windows fallback, contradicting the task's explicit \"uses psutil to monitor\
    \ peak RAM\" requirement. Additionally, there is no execution evidence (no CI/test-run\
    \ output) that the test actually passes, and the peak-memory logic is weak \u2014\
    \ it compares `max(initial, final)` after `gc.collect()` rather than measuring\
    \ true peak during generation, so the assertion may not genuinely verify the 7\
    \ GB constraint."
  sig: d47d0fcd3f0bbc13c58fec55b1e43fb235500d29dc5e94c759d500518e3de0a7
