  r: "The test file exists, generates 50 networks of N=500 across all three topologies,\
    \ asserts peak memory < 7 GB, and the pytest run log shows all 3 tests passing\
    \ (exit 0, 13.26s). The only deviation is that it uses `resource.getrusage`/`ru_maxrss`\
    \ (a true OS peak-RAM high-water mark) as the primary monitor with `psutil` as\
    \ the Windows fallback, rather than `psutil` as the primary tool \u2014 functionally\
    \ equivalent peak-memory measurement, and the assertion and generation requirements\
    \ are genuinely met."
