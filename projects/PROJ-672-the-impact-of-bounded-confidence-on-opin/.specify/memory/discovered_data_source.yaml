access_python: "import networkx as nx\n\ndef make_record(gid, topo, seed, n, params,\
  \ G):\n    edge_list = list(G.edges())\n    # build adjacency matrix without numpy\n\
  \    matrix = [[1 if j in G[i] else 0 for j in range(n)] for i in range(n)]\n  \
  \  degrees = [d for _, d in G.degree()]\n    avg_deg = sum(degrees) / n\n    clustering\
  \ = nx.average_clustering(G)\n    try:\n        apl = nx.average_shortest_path_length(G)\n\
  \    except nx.NetworkXError:\n        apl = None\n    return {\n        \"graph_id\"\
  : gid,\n        \"topology_type\": topo,\n        \"seed\": seed,\n        \"num_nodes\"\
  : n,\n        \"parameters\": params,\n        \"edge_list\": edge_list,\n     \
  \   \"adjacency_matrix\": matrix,\n        \"degree_distribution\": degrees,\n \
  \       \"average_degree\": avg_deg,\n        \"clustering_coefficient\": clustering,\n\
  \        \"average_path_length\": apl,\n    }\n\ndef generate():\n    records =\
  \ []\n    seeds = [42, 43, 44, 45, 46]\n    # Erdos\u2011Renyi graphs\n    for i,\
  \ seed in enumerate(seeds[:2], start=1):\n        n = 100\n        p = 0.05\n  \
  \      G = nx.erdos_renyi_graph(n, p, seed=seed)\n        records.append(make_record(i,\
  \ \"erdos_renyi\", seed, n, {\"p\": p}, G))\n    # Barab\xE1si\u2011Albert graphs\n\
  \    for i, seed in enumerate(seeds[2:4], start=3):\n        n = 100\n        m\
  \ = 3\n        G = nx.barabasi_albert_graph(n, m, seed=seed)\n        records.append(make_record(i,\
  \ \"barabasi_albert\", seed, n, {\"m\": m}, G))\n    # Watts\u2011Strogatz graph\n\
  \    seed = seeds[4]\n    n = 100\n    k = 4\n    p = 0.1\n    G = nx.watts_strogatz_graph(n,\
  \ k, p, seed=seed)\n    records.append(make_record(5, \"watts_strogatz\", seed,\
  \ n, {\"k\": k, \"p\": p}, G))\n    return records\n\nrecords = generate()\nprint(f\"\
  RECORDS={len(records)}\")\nprint(\"FIELDS=graph_id,topology_type,seed,num_nodes,parameters,edge_list,adjacency_matrix,degree_distribution,average_degree,clustering_coefficient,average_path_length\"\
  )"
