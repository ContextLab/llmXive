access_python: "import networkx as nx\n\n# Generate synthetic networks using NetworkX\n\
  networks = []\n\n# Erd\u0151s-R\xE9nyi graph\ner_graph = nx.erdos_renyi_graph(n=500,\
  \ p=0.01, seed=42)\ner_degrees = [d for n, d in er_graph.degree()]\nnetworks.append({\n\
  \    'network_type': 'erdos_renyi',\n    'num_nodes': er_graph.number_of_nodes(),\n\
  \    'random_seed': 42,\n    'degree_distribution': er_degrees,\n    'clustering_coefficient':\
  \ nx.average_clustering(er_graph),\n    'average_path_length': nx.average_shortest_path_length(er_graph)\
  \ if nx.is_connected(er_graph) else None,\n    'average_degree': sum(er_degrees)\
  \ / len(er_degrees),\n    'edge_list': list(er_graph.edges())\n})\n\n# Barab\xE1\
  si-Albert graph\nba_graph = nx.barabasi_albert_graph(n=500, m=2, seed=42)\nba_degrees\
  \ = [d for n, d in ba_graph.degree()]\nnetworks.append({\n    'network_type': 'barabasi_albert',\n\
  \    'num_nodes': ba_graph.number_of_nodes(),\n    'random_seed': 42,\n    'degree_distribution':\
  \ ba_degrees,\n    'clustering_coefficient': nx.average_clustering(ba_graph),\n\
  \    'average_path_length': nx.average_shortest_path_length(ba_graph) if nx.is_connected(ba_graph)\
  \ else None,\n    'average_degree': sum(ba_degrees) / len(ba_degrees),\n    'attachment_parameter_m':\
  \ 2,\n    'edge_list': list(ba_graph.edges())\n})\n\n# Watts-Strogatz graph\nws_graph\
  \ = nx.watts_strogatz_graph(n=500, k=4, p=0.3, seed=42)\nws_degrees = [d for n,\
  \ d in ws_graph.degree()]\nnetworks.append({\n    'network_type': 'watts_strogatz',\n\
  \    'num_nodes': ws_graph.number_of_nodes(),\n    'random_seed': 42,\n    'degree_distribution':\
  \ ws_degrees,\n    'clustering_coefficient': nx.average_clustering(ws_graph),\n\
  \    'average_path_length': nx.average_shortest_path_length(ws_graph) if nx.is_connected(ws_graph)\
