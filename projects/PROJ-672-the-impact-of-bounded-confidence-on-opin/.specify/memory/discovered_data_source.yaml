access_python: "import itertools\nimport networkx as nx\n\nrecords = []\nseeds = [42,\
  \ 43, 44]\nprobs = [0.01, 0.05, 0.1]\n\nfor idx, (seed, p) in enumerate(itertools.product(seeds,\
  \ probs), start=1):\n    G = nx.erdos_renyi_graph(n=500, p=p, seed=seed)\n    record\
  \ = {\n        \"graph_id\": idx,\n        \"topology_type\": \"erdos_renyi\",\n\
  \        \"num_nodes\": G.number_of_nodes(),\n        \"parameter_values\": p,\n\
  \        \"random_seed\": seed,\n        \"edge_list\": list(G.edges()),\n     \
  \   \"adjacency_dict\": nx.to_dict_of_dicts(G),\n        \"degree_distribution\"\
  : [d for _, d in G.degree()],\n        \"average_clustering_coefficient\": nx.average_clustering(G),\n\
  \    }\n    try:\n        record[\"average_path_length\"] = nx.average_shortest_path_length(G)\n\
  \    except nx.NetworkXError:\n        record[\"average_path_length\"] = float(\"\
  inf\")\n    records.append(record)\n\nprint(f\"RECORDS={len(records)}\")\nprint(\"\
  FIELDS=\" + \",\".join(records[0].keys()) if records else \"FIELDS=\")"
