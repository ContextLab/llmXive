access_python: "import networkx as nx\n\ndef make_record(gid, gtype, n, param, seed):\n\
  \    if gtype == \"erdos_renyi\":\n        G = nx.erdos_renyi_graph(n, param, seed=seed)\n\
  \    elif gtype == \"barabasi_albert\":\n        G = nx.barabasi_albert_graph(n,\
  \ param, seed=seed)\n    elif gtype == \"watts_strogatz\":\n        k, p = param\n\
  \        G = nx.watts_strogatz_graph(n, k, p, seed=seed)\n    else:\n        raise\
  \ ValueError(f\"Unsupported graph type: {gtype}\")\n    return {\n        \"graph_id\"\
  : gid,\n        \"graph_type\": gtype,\n        \"num_nodes\": G.number_of_nodes(),\n\
  \        \"num_edges\": G.number_of_edges(),\n        \"seed\": seed,\n        \"\
  edge_list\": list(G.edges()),\n        \"node_attributes\": {node: G.nodes[node]\
  \ for node in G.nodes()},\n    }\n\nrecords = [\n    make_record(1, \"erdos_renyi\"\
  , 100, 0.05, 42),\n    make_record(2, \"barabasi_albert\", 100, 3, 43),\n    make_record(3,\
  \ \"watts_strogatz\", 100, (6, 0.1), 44),\n]\n\nprint(f\"RECORDS={len(records)}\"\
  )\nprint(\"FIELDS=graph_id,graph_type,num_nodes,num_edges,seed,edge_list,node_attributes\"\
  )"
