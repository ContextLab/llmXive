# Ruff Configuration for llmXive Follow-up Project
# Pinned to ruff==0.9.0 compatibility
target-version = "py310"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in CLI)
    "C901", # Complex structure (allowed for pipeline logic)
]

[lint.per-file-ignores]
"code/__init__.py" = ["F401"]
"tests/*" = ["S101", "ANN"]

[lint.isort]
known-first-party = ["alignment", "features", "ingest", "model_selection"]
force-sort-within-sections = true
