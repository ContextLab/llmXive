# Ruff configuration for llmXive Follow-up project
# Satisfies Constitution Principle I (Reproducibility) via pinned tool versions
# See: pyproject.toml for version pinning

[lint]
# Enable pycodestyle (E), Pyflakes (F), and isort (I)
select = ["E", "F", "I", "W"]

# Ignore specific rules if needed (currently none)
ignore = []

[lint.isort]
# Configuration for isort via ruff
known-first-party = ["code"]
force-sort-within-sections = false
lines-after-imports = 2
combine-as-imports = true

[format]
# Configuration for black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
