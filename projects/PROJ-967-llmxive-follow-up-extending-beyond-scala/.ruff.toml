# Ruff configuration for llmXive Follow-up
# Extends settings from pyproject.toml for specific file overrides if needed,
# or serves as the primary config if pyproject.toml is minimal.
# Per Constitution Principle I, exact versions are pinned in pyproject.toml.

extend = "pyproject.toml"

# Explicitly set the linting rules to match the project's strict reproducibility
# requirements.
[lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "E741", # ambiguous variable name (allow for math-heavy code like x, y, z)
]

[lint.per-file-ignores]
"tests/*" = ["S101"] # Allow asserts in tests

[lint.isort]
known-first-party = ["code"]
force-sort-within-sections = true
