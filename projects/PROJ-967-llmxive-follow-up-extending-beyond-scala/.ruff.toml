# Ruff Configuration for llmXive Follow-up Project
# Pinned to satisfy Constitution Principle I (Reproducibility)

line-length = 88
target-version = "py310"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in data pipelines)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"] # allow assert in tests

[lint.isort]
known-first-party = ["code", "tests"]
force-sort-within-sections = true
