[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "LLMXive Follow-up: Teacher Entanglement vs. Scalar Distillation Loss"
requires-python = ">=3.9"
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.0",
    "scipy==1.13.1",
    "pyyaml==6.0.1",
    "pytest==8.2.2",
    "ruff==0.4.10",
    "black==24.4.2",
    "datasets==2.20.0",
    "pyarrow==16.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"