[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "llmXive Follow-up: Teacher Entanglement vs. Scalar Distillation Loss"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.0.3",
    "numpy==1.24.3",
    "scikit-learn==1.3.0",
    "scipy==1.11.1",
    "pyyaml==6.0.1",
    "pytest==7.4.0",
    "ruff==0.9.0",
    "black==24.8.0",
    "pyarrow==12.0.1",
    "datasets==2.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ["py310"]
quote-style = "double"
indent-style = "space"
