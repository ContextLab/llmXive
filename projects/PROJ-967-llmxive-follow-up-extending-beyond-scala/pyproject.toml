[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-beyond-scala"
version = "0.1.0"
description = "LlmXive Follow-up: Teacher Entanglement vs. Scalar Distillation Loss"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas==2.0.3",
    "numpy==1.24.3",
    "scikit-learn==1.3.0",
    "scipy==1.11.1",
    "pyyaml==6.0.1",
    "pytest==7.4.0",
    "ruff==0.1.0",
    "black==23.7.0",
    "parquet==1.1.0",
    "pyarrow==13.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*", "tests*"]

[tool.ruff]
# Configuration is in .ruff.toml
