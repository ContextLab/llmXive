[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-beyond-scala"
version = "0.1.0"
description = "Follow-up study: Teacher Entanglement vs. Scalar Distillation Loss"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.0.3",
    "numpy==1.24.3",
    "scikit-learn==1.3.0",
    "scipy==1.11.0",
    "pyyaml==6.0.1",
    "datasets>=2.14.0",
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "ruff==0.9.0",
    "black==24.8.0",
    "coverage>=7.0.0",
]

[tool.setuptools]
packages = ["code", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"