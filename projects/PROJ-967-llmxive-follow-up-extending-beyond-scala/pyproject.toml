[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "llmXive Follow-up: Teacher Entanglement vs. Scalar Distillation Loss"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "pytest>=7.4.0,<8.0.0",
    "black==24.3.0",
    "ruff==0.3.4",
    "datasets>=2.18.0,<3.0.0",
    "pyarrow>=15.0.0,<16.0.0",
    "tqdm>=4.66.0,<5.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
# Same as .ruff.toml but duplicated here for CI compatibility if needed
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"