$schema: http://json-schema.org/draft-07/schema#
title: Z-Reward Dataset Schema
description: Schema for the raw Z-Reward evaluation dataset.
type: object
properties:
  sample_id:
    type: string
    description: Unique identifier for the sample.
  prompt:
    type: string
    description: Input text prompt.
  teacher_scores:
    type: array
    items:
      type: number
    minItems: 4
    maxItems: 4
    description: Scores for [Alignment, Realism, Aesthetics, Plausibility].
  student_score:
    type: number
    description: Scalar output from student model.
  human_annotations:
    type: object
    properties:
      Alignment:
        type: number
      Realism:
        type: number
      Aesthetics:
        type: number
      Plausibility:
        type: number
    required:
      - Alignment
      - Realism
      - Aesthetics
      - Plausibility
    description: Human annotations for all four dimensions.
  primary_dimension:
    type: string
    enum:
      - Alignment
      - Realism
      - Aesthetics
      - Plausibility
    description: The dimension used for fidelity loss calculation.
required:
  - sample_id
  - prompt
  - teacher_scores
  - student_score
  - human_annotations
  - primary_dimension
additionalProperties: false