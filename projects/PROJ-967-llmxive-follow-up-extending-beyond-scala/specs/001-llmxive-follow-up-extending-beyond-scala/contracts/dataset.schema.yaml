# Dataset Schema Contract for Z-Reward Entanglement Analysis
# Updated via T038 Schema Discovery
# Source: Z-Reward Evaluation Dataset (z-reward/z-reward)

version: "1.0"
dataset_name: "z-reward-evaluation"
format: "parquet"
source_url: "https://huggingface.co/datasets/z-reward/z-reward"

columns:
  - name: sample_id
    type: string
    description: "Unique identifier for the sample"
    required: true

  - name: prompt
    type: string
    description: "Text prompt used to generate the image"
    required: true

  - name: image_url
    type: string
    description: "URL to the generated image"
    required: true

  - name: teacher_scores
    type: object
    description: "Teacher model scores for rubric dimensions"
    required: true
    properties:
      Alignment:
        type: number
        description: "Score for alignment dimension"
      Realism:
        type: number
        description: "Score for realism dimension"
      Aesthetics:
        type: number
        description: "Score for aesthetics dimension"
      Plausibility:
        type: number
        description: "Score for plausibility dimension"

  - name: student_scalar
    type: number
    description: "Student model scalar output (aggregated score)"
    required: true

  - name: human_annotations
    type: object
    description: "Human annotations for rubric dimensions"
    required: true
    properties:
      Alignment:
        type: number
        description: "Human score for alignment dimension"
      Realism:
        type: number
        description: "Human score for realism dimension"
      Aesthetics:
        type: number
        description: "Human score for aesthetics dimension"
      Plausibility:
        type: number
        description: "Human score for plausibility dimension"

  - name: primary_dimension
    type: string
    description: "Primary quality dimension for this sample (one of: Alignment, Realism, Aesthetics, Plausibility)"
    required: true
    enum:
      - Alignment
      - Realism
      - Aesthetics
      - Plausibility

validation_rules:
  - rule: "All four rubric dimensions must exist in teacher_scores"
    dimensions: ["Alignment", "Realism", "Aesthetics", "Plausibility"]
  - rule: "All four rubric dimensions must exist in human_annotations"
    dimensions: ["Alignment", "Realism", "Aesthetics", "Plausibility"]
  - rule: "primary_dimension must be a valid enum value"
  - rule: "student_scalar must be a numeric value"

notes: |
  This schema was discovered and validated by inspecting the actual
  z-reward/z-reward dataset on Hugging Face Hub. The dataset contains
  image prompts, generated images, and human annotations for the four
  rubric dimensions (Alignment, Realism, Aesthetics, Plausibility).
