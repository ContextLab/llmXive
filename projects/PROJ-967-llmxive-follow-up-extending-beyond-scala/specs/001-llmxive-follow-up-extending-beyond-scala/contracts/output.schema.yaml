schema_version: "1.0"
description: "Schema for data/processed/features.json containing per-sample entanglement metrics and target variable"
type: array
items:
  type: object
  properties:
    sample_id:
      type: string
      description: "Unique identifier for the data sample"
    variance:
      type: number
      description: "Variance of the teacher scores across the four rubric dimensions"
    entropy:
      type: number
      description: "Entropy of the teacher score distribution"
    skewness:
      type: number
      description: "Skewness of the teacher score distribution"
    kurtosis:
      type: number
      description: "Kurtosis of the teacher score distribution"
    mahalanobis_distance:
      type: number
      description: "Mahalanobis distance of the sample's teacher score vector from the global mean"
    fidelity_loss:
      type: number
      description: "Mean Absolute Error between student_scalar and human_annotations for the primary_dimension"
  required:
    - sample_id
    - variance
    - entropy
    - skewness
    - kurtosis
    - mahalanobis_distance
    - fidelity_loss
