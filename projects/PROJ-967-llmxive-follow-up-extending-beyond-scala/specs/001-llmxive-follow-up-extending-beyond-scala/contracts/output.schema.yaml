schema_version: "1.0"
description: "Schema for the final processed features dataset (data/processed/features.json)"
fields:
  - name: sample_id
    type: string
    description: "Unique identifier for the sample"
  - name: variance
    type: float
    description: "Per-sample variance of the 4-dimensional teacher score vector"
  - name: entropy
    type: float
    description: "Per-sample Shannon entropy of the normalized teacher score vector"
  - name: skewness
    type: float
    description: "Per-sample skewness of the teacher score distribution"
  - name: kurtosis
    type: float
    description: "Per-sample kurtosis of the teacher score distribution"
  - name: mahalanobis_distance
    type: float
    description: "Per-sample Mahalanobis distance from the global teacher score mean (computed only if model_type == 'rf')"
  - name: fidelity_loss
    type: float
    description: "MAE between student_scalar and human annotation for the primary_dimension"
  - name: primary_dimension
    type: string
    description: "The quality dimension used for fidelity loss calculation"
  - name: feature_status
    type: object
    properties:
      mahalanobis_computed:
        type: boolean
        description: "True if Mahalanobis distance was computed, False if skipped (e.g., Ridge model selected)"
