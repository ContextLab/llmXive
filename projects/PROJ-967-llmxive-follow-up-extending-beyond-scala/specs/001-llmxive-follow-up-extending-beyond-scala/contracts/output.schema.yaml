schema_version: "1.0"
description: Output schema for processed features and results
fields:
  - name: sample_id
    type: string
  - name: variance
    type: float
  - name: entropy
    type: float
  - name: skewness
    type: float
  - name: kurtosis
    type: float
  - name: mahalanobis_distance
    type: float
  - name: fidelity_loss
    type: float
  - name: dominant_eigenvalue
    type: float
  - name: covariance_matrix
    type: object
  - name: features
    type: object
    properties:
      variance: float
      entropy: float
      skewness: float
      kurtosis: float
      mahalanobis_distance: float
