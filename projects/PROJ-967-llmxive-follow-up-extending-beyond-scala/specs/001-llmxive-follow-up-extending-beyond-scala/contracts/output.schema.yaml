# Output Schema Contract for data/processed/features.json
# Defines the structure of the engineered feature set used for modeling.
# Generated by task T001f.
schema_version: "1.0.0"
description: "Per-sample entanglement and fidelity features derived from teacher distributions and human annotations."
type: object
required:
  - sample_id
  - variance
  - entropy
  - skewness
  - kurtosis
  - mahalanobis_distance
  - difficulty_proxy
  - fidelity_loss
  - dominant_eigenvalue
properties:
  sample_id:
    type: string
    description: "Unique identifier for the data sample."
    minLength: 1

  variance:
    type: number
    description: "Variance of the 4-dimensional teacher score vector for this sample."
    minimum: 0.0

  entropy:
    type: number
    description: "Normalized Shannon entropy of the teacher score distribution for this sample."
    minimum: 0.0
    maximum: 1.0

  skewness:
    type: number
    description: "Skewness of the teacher score distribution for this sample."

  kurtosis:
    type: number
    description: "Kurtosis of the teacher score distribution for this sample."

  mahalanobis_distance:
    type: number
    description: "Mahalanobis distance of this sample's score vector from the global mean, using the global covariance matrix."
    minimum: 0.0

  difficulty_proxy:
    type: number
    description: "Mean of the 4-dimensional teacher score vector (control for prompt difficulty)."

  fidelity_loss:
    type: number
    description: "Mean Absolute Error (MAE) between student scalar and human annotation for the primary dimension."
    minimum: 0.0

  dominant_eigenvalue:
    type: number
    description: "The largest eigenvalue of the global covariance matrix (scalar feature repeated per sample). Context-only; excluded from training."
    minimum: 0.0
    x-training-feature: false

additionalProperties: false

# Explicit list of features used for training (excluding context_only)
training_feature_set:
  - variance
  - entropy
  - skewness
  - kurtosis
  - mahalanobis_distance
  - difficulty_proxy