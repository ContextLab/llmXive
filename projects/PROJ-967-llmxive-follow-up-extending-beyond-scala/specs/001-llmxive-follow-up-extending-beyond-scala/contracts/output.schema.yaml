# Output Schema Contract for Entanglement Analysis
# Updated via T038 Schema Discovery
# Defines the structure of data/processed/features.json

version: "1.0"
output_format: "json"
target_file: "data/processed/features.json"

record_structure:
  sample_id:
    type: string
    description: "Unique identifier for the sample"
    required: true

  variance:
    type: number
    description: "Variance of teacher scores across dimensions"
    required: true

  entropy:
    type: number
    description: "Shannon entropy of normalized teacher scores"
    required: true

  skewness:
    type: number
    description: "Skewness of teacher score distribution"
    required: true

  kurtosis:
    type: number
    description: "Kurtosis of teacher score distribution"
    required: true

  dominant_eigenvalue:
    type: number
    description: "Dominant eigenvalue of the outer product matrix (v * v^T)"
    required: true

  fidelity_loss:
    type: number
    description: "MAE between student scalar and human annotation for primary dimension"
    required: true

  excluded_reason:
    type: string
    description: "Reason for exclusion if sample was excluded (optional)"
    required: false
    enum:
      - missing_student_scalar
      - missing_primary_dimension
      - missing_human_annotations
      - missing_teacher_scores

array_structure:
  type: array
  items:
    $ref: "#/record_structure"

notes: |
  This output schema defines the structure of the features JSON file
  generated by the feature engineering pipeline. Each record contains
  per-sample statistical descriptors derived from the teacher model's
  score distribution across the four rubric dimensions.
