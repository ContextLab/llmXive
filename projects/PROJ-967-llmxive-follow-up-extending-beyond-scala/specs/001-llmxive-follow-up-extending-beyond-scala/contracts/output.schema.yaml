# Output Schema Contract for Feature Engineering Results
# This file defines the expected structure of data/processed/features.json
# Generated for Project: PROJ-967-llmxive-follow-up-extending-beyond-scala
# Task: T001f - Create output schema contract
schema:
  version: "1.0.0"
  description: |
    Schema for per-sample entanglement features and model targets.
    This structure is generated by code/features.py and consumed by code/train.py.
  type: object
  properties:
    sample_id:
      type: string
      description: Unique identifier for the data sample
      required: true
    variance:
      type: number
      description: Variance of the teacher scores across dimensions
      required: true
    entropy:
      type: number
      description: Shannon entropy of the normalized teacher score distribution
      required: true
    skewness:
      type: number
      description: Skewness of the teacher score distribution
      required: true
    kurtosis:
      type: number
      description: Kurtosis of the teacher score distribution
      required: true
    dominant_eigenvalue:
      type: number
      description: |
        The dominant (largest) eigenvalue of the global covariance matrix
        of teacher scores, broadcast to every sample.
      required: true
    fidelity_loss:
      type: number
      description: |
        Mean Absolute Error (MAE) between student scalar output and
        human-annotated score for the primary dimension.
      required: true
    score_magnitude:
      type: number
      description: L2 norm (Euclidean norm) of the teacher score vector
      required: false
  required_fields:
    - sample_id
    - variance
    - entropy
    - skewness
    - kurtosis
    - dominant_eigenvalue
    - fidelity_loss
  notes:
    - "All numeric fields must be finite (no NaN or Inf)."
    - "Zero-variance cases must result in entropy=0, variance=0."
    - "The 'dominant_eigenvalue' is constant across all samples in a given run."
    - "The 'fidelity_loss' is calculated only for samples with valid primary_dimension and human annotations."
