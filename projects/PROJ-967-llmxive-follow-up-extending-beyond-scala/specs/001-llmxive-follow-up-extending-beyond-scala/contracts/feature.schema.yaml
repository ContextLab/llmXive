$schema: "http://json-schema.org/draft-07/schema#"
title: "Entanglement Feature Schema"
description: "Schema for the derived features used in the Random Forest model. Note: difficulty_proxy renamed to mean_teacher_score for consistency. Statistical features are optional to allow for VIF filtering."
type: "object"
properties:
  sample_id:
    type: "string"
    description: "Unique identifier for the sample."
  variance:
    type: "number"
    description: "Variance of the teacher score distribution."
  entropy:
    type: "number"
    description: "Shannon entropy of L1-normalized (shifted) teacher score distribution."
  skewness:
    type: "number"
    description: "Skewness of the teacher score distribution."
  kurtosis:
    type: "number"
    description: "Kurtosis of the teacher score distribution."
  mean_teacher_score:
    type: "number"
    description: "Mean of teacher scores (control for difficulty)."
  theoretical_baseline_error:
    type: "number"
    description: "Theoretical MAE derived from the known distillation function."
  observed_mae:
    type: "number"
    description: "Observed MAE between student and target dimension."
  residual_error:
    type: "number"
    description: "Target variable: Observed MAE - Theoretical Baseline."
  target_variable_source:
    type: "string"
    description: "The metadata field used to select the target dimension."
  vif_filtered_features:
    type: "array"
    description: "List of feature names retained after VIF filtering."
    items:
      type: "string"
required:
  - sample_id
  - mean_teacher_score
  - theoretical_baseline_error
  - observed_mae
  - residual_error
  - target_variable_source
  - vif_filtered_features