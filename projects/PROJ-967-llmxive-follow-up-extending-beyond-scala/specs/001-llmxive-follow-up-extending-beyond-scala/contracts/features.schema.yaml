$schema: http://json-schema.org/draft-07/schema#
title: Entanglement Features Schema
description: Schema for the engineered entanglement features.
type: object
properties:
  sample_id:
    type: string
    description: Unique identifier for the sample.
  variance:
    type: number
    description: Variance of teacher scores.
  entropy:
    type: number
    description: Shannon entropy of normalized teacher scores.
  skewness:
    type: number
    description: Skewness of teacher scores.
  kurtosis:
    type: number
    description: Kurtosis of teacher scores.
  mahalanobis_distance:
    type: number
    description: Mahalanobis distance from the mean of teacher scores.
  difficulty_proxy:
    type: number
    description: Mean of teacher scores (control for difficulty).
  dominant_eigenvalue:
    type: number
    description: Global dominant eigenvalue (context_only, not for training).
    x-training-feature: false
  fidelity_loss:
    type: number
    description: MAE between student score and human annotation.
required:
  - sample_id
  - variance
  - entropy
  - skewness
  - kurtosis
  - mahalanobis_distance
  - difficulty_proxy
  - dominant_eigenvalue
  - fidelity_loss
additionalProperties: false