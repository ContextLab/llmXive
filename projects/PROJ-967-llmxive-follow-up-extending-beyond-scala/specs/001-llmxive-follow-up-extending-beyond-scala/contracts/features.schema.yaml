$schema: http://json-schema.org/draft-07/schema#
title: Entanglement Features Schema
description: Schema for the engineered entanglement features.
type: object
properties:
  sample_id:
    type: string
    description: Unique identifier for the sample.
  variance:
    type: number
    description: Variance of teacher scores.
  entropy:
    type: number
    description: Shannon entropy of L1-normalized (shifted) teacher scores.
  skewness:
    type: number
    description: Skewness of teacher scores.
  kurtosis:
    type: number
    description: Kurtosis of teacher scores.
  difficulty_proxy:
    type: number
    description: Mean of teacher scores (control for difficulty).
  fidelity_loss:
    type: number
    description: MAE between student score and human annotation.
  target_variable_source:
    type: string
    description: Source of the target dimension (metadata field).
required:
  - sample_id
  - variance
  - entropy
  - skewness
  - kurtosis
  - difficulty_proxy
  - fidelity_loss
  - target_variable_source
additionalProperties: false
