# Schema for output artifacts generated by the binding problem analysis
# This file defines the structure and validation rules for all final outputs

type: object
properties:
  sdc_results:
    type: object
    description: Spectral Density Correlation results between model and MEG data
    properties:
      correlation_values:
        type: array
        items:
          type: number
        description: Array of SDC values for each layer/head or batch item
      mean_correlation:
        type: number
        description: Mean SDC across all measurements
      std_correlation:
        type: number
        description: Standard deviation of SDC values
      significant_indices:
        type: array
        items:
          type: integer
        description: Indices where SDC is statistically significant (p < 0.05)
      method:
        type: string
        enum: [pearson]
        description: Correlation method used
      normalization:
        type: boolean
        description: Whether PSDs were normalized to unit area before correlation

  plv_results:
    type: object
    description: Phase Locking Value results (primary metric)
    properties:
      plv_values:
        type: array
        items:
          type: number
        description: Array of PLV values
      mean_plv:
        type: number
      significant_plv_indices:
        type: array
        items:
          type: integer

  statistical_tests:
    type: object
    description: Results from permutation tests and corrections
    properties:
      permutation_p_values:
        type: array
        items:
          type: number
      bonferroni_corrected:
        type: boolean
      family_wise_error_rate:
        type: number

  metadata:
    type: object
    properties:
      model_name:
        type: string
      dataset:
        type: string
      frequency_band:
        type: string
      sequence_length:
        type: integer
      seed:
        type: integer
      timestamp:
        type: string
        format: date-time

required:
  - sdc_results
  - plv_results
  - metadata

additionalProperties: false