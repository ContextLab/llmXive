$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema"
description: "Schema for raw and processed dataset files used in the project. Validates FR‑001 – FR‑004."
type: "object"
properties:
  metadata:
    type: "object"
    properties:
      source:
        type: "string"
        description: "Canonical source identifier (e.g., HuggingFace dataset name)."
      checksum:
        type: "string"
        description: "SHA256 checksum of the raw file."
      version:
        type: "string"
        description: "Dataset version or commit hash."
    required: ["source", "checksum"]
  raw_data:
    type: "object"
    properties:
      plv_reference:
        type: "object"
        properties:
          format:
            type: "string"
            enum: ["json"]
          fields:
            type: "array"
            items:
              type: "string"
        required: ["format", "fields"]
      clutrr:
        type: "object"
        properties:
          format:
            type: "string"
            enum: ["parquet"]
          fields:
            type: "array"
            items:
              type: "string"
          sample_size:
            type: "integer"
            description: "Number of CLUTRR examples used."
        required: ["format", "fields", "sample_size"]
    required: ["plv_reference", "clutrr"]
  processed_data:
    type: "object"
    properties:
      spectral_features:
        type: "object"
        properties:
          frequency_band:
            type: "string"
          snr_threshold:
            type: "number"
        required: ["frequency_band", "snr_threshold"]
      plv_results:
        type: "object"
        properties:
          frequency_hz:
            type: "integer"
          plv_value:
            type: "number"
        required: ["frequency_hz", "plv_value"]
      benchmark_results:
        type: "object"
        properties:
          task:
            type: "string"
          accuracy:
            type: "number"
          f1_score:
            type: "number"
          seed:
            type: "integer"
        required: ["task", "accuracy", "f1_score", "seed"]
    required: ["spectral_features", "plv_results", "benchmark_results"]
required:
  - metadata
  - raw_data
  - processed_data