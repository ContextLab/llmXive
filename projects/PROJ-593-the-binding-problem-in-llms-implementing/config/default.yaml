# Configuration for The Binding Problem in LLMs: Implementing Synchronized Oscillations
# This file centralizes seeds, frequency parameters, and dataset paths.
# Verified by: python -c "import yaml; yaml.safe_load(open('config/default.yaml'))"

# --- Random Seeds ---
# Ensures reproducibility across runs.
seeds:
  global: 42
  torch: 42
  numpy: 42

# --- Frequency Parameters ---
# Note: Frequencies are defined as "cycles per sequence length", not physical Hz.
# The mapping to physical Hz depends on the token processing rate (tokens/sec).
oscillation:
  # Target relative frequency (cycles/sequence) for the gamma-band analog
  target_cycles_per_sequence: 8.0
  # Sweep range for frequency analysis
  sweep_range:
    start: 2.0
    end: 16.0
    step: 2.0
  # Primary frequency band for analysis (in cycles/sequence)
  target_band:
    lower: 6.0
    upper: 10.0
  # Adjacent bands for SNR calculation (in cycles/sequence)
  adjacent_bands:
    lower:
      start: 2.0
      end: 6.0
    upper:
      start: 10.0
      end: 14.0

# --- Dataset Paths ---
# Relative to project root.
data:
  raw:
    meg: "data/raw/meg_streamed.parquet"
    clutrr: "data/raw/clutrr.parquet"
  processed:
    meg_filtered: "data/processed/meg_filtered.npy"
    meg_psd_normalized: "data/processed/meg_psd_normalized.npy"
    clutrr_processed: "data/processed/clutrr_processed.parquet"
  synthetic:
    color_motion: "data/synthetic/color_motion.json"
    toy_failure: "data/synthetic/toy_failure_case.json"
  final:
    control_run: "data/final/control_run_comparison.json"
    sdc_comparison: "data/final/sdc_comparison.json"
    latency_report: "data/final/latency_report.json"
    feature_binding: "data/final/feature_binding_analysis.json"
    statistical_report: "data/final/statistical_report.json"
    metric_definitions: "data/final/metric_definitions.json"
    bound_heads_mapping: "data/final/bound_heads_mapping.json"
    stability_check: "data/final/stability_check_results.json"
    aggregated_results: "data/final/aggregated_results.json"
    bonferroni_results: "data/final/bonferroni_corrected_results.json"
    toy_failure_results: "data/final/toy_failure_results.json"
    binding_vs_extraction: "data/final/binding_vs_extraction_comparison.csv"
    sweep_results: "data/processed/sweep_results.csv"
    layer_metrics: "data/processed/layer_metrics.csv"
    permutation_results_sdc: "data/final/permutation_results_sdc.json"
  plots:
    feature_binding: "plots/feature_binding_diagnostic.png"

# --- Model Configuration ---
model:
  name: "distilbert-base-uncased"
  device: "cpu"
  max_length: 512
  batch_size: 8
  # Oscillatory injection parameters
  oscillatory:
    enabled: true
    target_layer: 4  # DistilBERT has 6 layers; targeting middle layer
    target_head: 2   # Targeting a specific head within the layer

# --- Analysis Thresholds ---
analysis:
  snr_threshold_db: 3.0
  sdc_significance_threshold: 0.15
  p_value_threshold: 0.05
  permutation_iterations: 1000
  latency_budget_seconds: 300.0
  token_latency_budget_ms: 25.0

# --- Logging & Reporting ---
logging:
  level: "INFO"
  log_file: "logs/run.log"
  save_activations: true
  save_attention_weights: true

# --- Reviewer Constraints ---
# Explicitly addressing reviewer constraints from Plan.md
constraints:
  # PLV is rejected per Plan.md (Category Error: discrete vs continuous)
  use_plv: false
  # SDC is the primary metric
  primary_metric: "sdc"
  # Global Bonferroni correction
  apply_bonferroni_globally: true