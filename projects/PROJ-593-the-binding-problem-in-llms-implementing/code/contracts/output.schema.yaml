# Output Schema for Spectral Analysis Results
# This schema defines the structure of output files generated by the analysis pipeline.
# It is used for validation of SDC, PLV, and other spectral metrics.

type: object
required:
  - sdc_results
  - plv_results
  - metadata

properties:
  sdc_results:
    type: object
    description: Spectral Density Correlation results
    required:
      - mean_sdc
      - std_sdc
      - sdc_values
      - layer_ids
      - head_ids
    properties:
      mean_sdc:
        type: number
        description: Mean SDC value across all layers/heads
      std_sdc:
        type: number
        description: Standard deviation of SDC values
      sdc_values:
        type: array
        description: Array of SDC values for each layer/head combination
        items:
          type: number
      layer_ids:
        type: array
        description: List of layer IDs corresponding to SDC values
        items:
          type: integer
      head_ids:
        type: array
        description: List of head IDs corresponding to SDC values
        items:
          type: integer

  plv_results:
    type: object
    description: Phase Locking Value results
    required:
      - mean_plv
      - std_plv
      - plv_values
      - layer_ids
      - head_ids
    properties:
      mean_plv:
        type: number
        description: Mean PLV value across all layers/heads
      std_plv:
        type: number
        description: Standard deviation of PLV values
      plv_values:
        type: array
        description: Array of PLV values for each layer/head combination
        items:
          type: number
      layer_ids:
        type: array
        description: List of layer IDs corresponding to PLV values
        items:
          type: integer
      head_ids:
        type: array
        description: List of head IDs corresponding to PLV values
        items:
          type: integer

  metadata:
    type: object
    description: Metadata about the analysis
    required:
      - timestamp
      - frequency_range
      - n_layers
      - n_heads
      - seed
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of analysis
      frequency_range:
        type: object
        description: Frequency range used for analysis
        properties:
          min_freq:
            type: number
          max_freq:
            type: number
      n_layers:
        type: integer
        description: Number of layers analyzed
      n_heads:
        type: integer
        description: Number of heads per layer
      seed:
        type: integer
        description: Random seed used for reproducibility

additionalProperties: false