$schema: "http://json-schema.org/draft-07/schema#"
title: "Final Research Report Schema"
description: "Schema for the final research report generated by the pipeline. Validates presence of correlation metrics, FDR corrections, and sensitivity analysis results."
type: object
required:
  - metadata
  - structural_metrics_summary
  - dynamic_metrics_summary
  - correlation_analysis
  - sensitivity_analysis
  - exclusions
properties:
  metadata:
    type: object
    required:
      - pipeline_version
      - generation_timestamp
      - data_source
      - total_subjects_processed
      - total_subjects_excluded
    properties:
      pipeline_version:
        type: string
      generation_timestamp:
        type: string
        format: date-time
      data_source:
        type: string
      total_subjects_processed:
        type: integer
      total_subjects_excluded:
        type: integer
  structural_metrics_summary:
    type: object
    description: "Summary statistics for structural graph metrics (Global Efficiency, Clustering, Modularity)"
    required:
      - global_efficiency
      - clustering_coefficient
      - modularity
    properties:
      global_efficiency:
        type: object
        properties:
          mean:
            type: number
          std:
            type: number
          min:
            type: number
          max:
            type: number
      clustering_coefficient:
        type: object
        properties:
          mean:
            type: number
          std:
            type: number
          min:
            type: number
          max:
            type: number
      modularity:
        type: object
        properties:
          mean:
            type: number
          std:
            type: number
          min:
            type: number
          max:
            type: number
  dynamic_metrics_summary:
    type: object
    description: "Summary statistics for dynamic functional metrics (Dwell Time, Visited States)"
    required:
      - mean_dwell_time
      - visited_states_count
    properties:
      mean_dwell_time:
        type: object
        properties:
          mean:
            type: number
          std:
            type: number
          min:
            type: number
          max:
            type: number
      visited_states_count:
        type: object
        properties:
          mean:
            type: number
          std:
            type: number
          min:
            type: number
          max:
            type: number
  correlation_analysis:
    type: object
    description: "Correlation results between structural and dynamic metrics"
    required:
      - pairs
      - fdr_corrected_pairs
    properties:
      pairs:
        type: array
        items:
          type: object
          required:
            - metric_a
            - metric_b
            - r_value
            - p_value
            - method
          properties:
            metric_a:
              type: string
            metric_b:
              type: string
            r_value:
              type: number
            p_value:
              type: number
            method:
              type: string
              enum: ["pearson", "spearman"]
      fdr_corrected_pairs:
        type: array
        items:
          type: object
          required:
            - metric_a
            - metric_b
            - p_value_raw
            - p_value_fdr
            - is_significant
          properties:
            metric_a:
              type: string
            metric_b:
              type: string
            p_value_raw:
              type: number
            p_value_fdr:
              type: number
            is_significant:
              type: boolean
      summary_statement:
        type: string
        description: "Text summary of findings, explicitly stating if zero significant findings were found after FDR."
  sensitivity_analysis:
    type: object
    description: "Sensitivity analysis results for window length and density thresholds"
    required:
      - window_length_sensitivity
      - density_threshold_sensitivity
    properties:
      window_length_sensitivity:
        type: object
        required:
          - baseline_window_tr
          - sensitivity_window_tr
          - absolute_difference_correlation
        properties:
          baseline_window_tr:
            type: integer
          sensitivity_window_tr:
            type: integer
          absolute_difference_correlation:
            type: number
            description: "Absolute difference between 30 TR and 20 TR correlation coefficients."
      density_threshold_sensitivity:
        type: object
        required:
          - baseline_threshold
          - variations
        properties:
          baseline_threshold:
            type: number
          variations:
            type: array
            items:
              type: object
              properties:
                threshold:
                  type: number
                correlation_change:
                  type: number
  exclusions:
    type: object
    description: "Summary of excluded subjects and reasons"
    required:
      - count
      - reasons
    properties:
      count:
        type: integer
      reasons:
        type: object
        properties:
          convergence_failure:
            type: integer
          sparsity_exclusion:
            type: integer
          other:
            type: integer
additionalProperties: false
