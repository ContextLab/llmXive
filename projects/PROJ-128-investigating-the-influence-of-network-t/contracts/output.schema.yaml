# Placeholder schema for pipeline output files.
$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  structural_metrics:
    type: array
    items:
      type: object
      properties:
        subject_id:
          type: string
        global_efficiency:
          type: number
        clustering:
          type: number
        modularity:
          type: number
      required:
        - subject_id
        - global_efficiency
        - clustering
        - modularity
  dynamic_metrics:
    type: array
    items:
      type: object
      properties:
        subject_id:
          type: string
        mean_dwell_time:
          type: number
        num_visited_states:
          type: integer
      required:
        - subject_id
        - mean_dwell_time
        - num_visited_states
  correlation_results:
    type: array
    items:
      type: object
      properties:
        metric_structural:
          type: string
        metric_dynamic:
          type: string
        r_value:
          type: number
        p_value:
          type: number
        is_significant_fdr:
          type: boolean
      required:
        - metric_structural
        - metric_dynamic
        - r_value
        - p_value
        - is_significant_fdr