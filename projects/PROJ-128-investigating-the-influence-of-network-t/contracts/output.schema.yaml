# Schema for pipeline output validation
type: object
required:
  - subject_id
  - structural_metrics
  - dynamic_metrics
properties:
  subject_id:
    type: string
  structural_metrics:
    type: object
    properties:
      global_efficiency:
        type: number
      average_clustering:
        type: number
      modularity:
        type: number
  dynamic_metrics:
    type: object
    properties:
      dwell_times:
        type: array
        items:
          type: number
      visited_states:
        type: integer
      state_sequence:
        type: array
        items:
          type: integer
