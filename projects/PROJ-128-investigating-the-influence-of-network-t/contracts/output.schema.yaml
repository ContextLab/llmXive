name: Pipeline_Output_Schema
version: '1.0.0'
description: Schema for pipeline output metrics
outputs:
  structural_metrics:
    type: csv
    columns:
    - subject_id
    - global_efficiency
    - clustering_coeff
    - modularity
    - density
  dynamic_metrics:
    type: csv
    columns:
    - subject_id
    - state_id
    - mean_dwell_time
    - num_visits
  correlation_results:
    type: csv
    columns:
    - metric_pair
    - r_value
    - p_value
    - fdr_corrected
  exclusion_log:
    type: json
    schema:
    - subject_id: string
      reason: string
      timestamp: string