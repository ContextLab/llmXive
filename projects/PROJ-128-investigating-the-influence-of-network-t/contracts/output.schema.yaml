$schema: http://json-schema.org/draft-07/schema#
title: Final Research Report Schema
description: Schema for the final report generated by the pipeline, including metrics, correlations, and sensitivity analysis.
type: object
required:
  - metadata
  - structural_metrics_summary
  - dynamic_metrics_summary
  - correlation_results
  - sensitivity_analysis
  - exclusions
properties:
  metadata:
    type: object
    required:
      - generated_at
      - pipeline_version
      - config_snapshot
    properties:
      generated_at:
        type: string
        format: date-time
      pipeline_version:
        type: string
      config_snapshot:
        type: object
  structural_metrics_summary:
    type: object
    required:
      - global_efficiency
      - average_clustering
      - modularity
      - subject_count
    properties:
      global_efficiency:
        type: object
        properties:
          mean:
            type: number
          std:
            type: number
          min:
            type: number
          max:
            type: number
      average_clustering:
        type: object
        properties:
          mean:
            type: number
          std:
            type: number
      modularity:
        type: object
        properties:
          mean:
            type: number
          std:
            type: number
      subject_count:
        type: integer
  dynamic_metrics_summary:
    type: object
    required:
      - visited_states
      - mean_dwell_time
      - state_count
    properties:
      visited_states:
        type: object
        properties:
          mean:
            type: number
          std:
            type: number
      mean_dwell_time:
        type: object
        properties:
          mean:
            type: number
          std:
            type: number
      state_count:
        type: integer
  correlation_results:
    type: object
    required:
      - pairs
      - significant_count
      - fdr_threshold
    properties:
      pairs:
        type: array
        items:
          type: object
          required:
            - structural_metric
            - dynamic_metric
            - correlation_type
            - r_value
            - p_value
            - fdr_corrected_p_value
            - is_significant
          properties:
            structural_metric:
              type: string
            dynamic_metric:
              type: string
            correlation_type:
              type: string
              enum: ["pearson", "spearman"]
            r_value:
              type: number
            p_value:
              type: number
            fdr_corrected_p_value:
              type: number
            is_significant:
              type: boolean
      significant_count:
        type: integer
      fdr_threshold:
        type: number
        description: The q-value threshold used for FDR correction (e.g., 0.05).
  sensitivity_analysis:
    type: object
    required:
      - window_length_sensitivity
      - density_threshold_sensitivity
      - absolute_difference_30_20_tr
    properties:
      window_length_sensitivity:
        type: object
        required:
          - baseline_30_tr
          - sensitivity_20_tr
          - comparison
        properties:
          baseline_30_tr:
            type: object
            description: Correlation results for 30 TR window.
          sensitivity_20_tr:
            type: object
            description: Correlation results for 20 TR window.
          comparison:
            type: object
            description: Summary of differences.
      density_threshold_sensitivity:
        type: object
        required:
          - baseline
          - variation_plus
          - variation_minus
        properties:
          baseline:
            type: object
          variation_plus:
            type: object
          variation_minus:
            type: object
      absolute_difference_30_20_tr:
        type: array
        description: List of absolute differences in correlation coefficients between 30 TR and 20 TR analyses for each metric pair.
        items:
          type: object
          required:
            - metric_pair
            - diff_r
          properties:
            metric_pair:
              type: string
            diff_r:
              type: number
  exclusions:
    type: object
    required:
      - total_subjects_processed
      - total_excluded
      - reasons
    properties:
      total_subjects_processed:
        type: integer
      total_excluded:
        type: integer
      reasons:
        type: array
        items:
          type: object
          properties:
            subject_id:
              type: string
            reason:
              type: string
additionalProperties: false
