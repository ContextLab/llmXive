name: HCP_Dataset_Schema
version: '1.0.0'
description: Schema for HCP OpenNeuro data loading
fields:
  subject_id:
    type: string
    required: true
    description: HCP Subject ID
  session_id:
    type: string
    required: false
    description: Session ID
  modality:
    type: string
    enum:
    - dMRI
    - fMRI
    required: true
  raw_path:
    type: string
    required: true
    description: Path to raw data file
  processed_path:
    type: string
    required: false
    description: Path to processed data file
