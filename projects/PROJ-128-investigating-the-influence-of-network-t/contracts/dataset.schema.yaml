# Schema for input dataset validation
type: object
required:
  - subject_id
  - fmri_path
  - dmri_path
properties:
  subject_id:
    type: string
    description: Unique HCP subject identifier
  fmri_path:
    type: string
    description: Path to preprocessed fMRI data (NIFTI or HDF5)
  dmri_path:
    type: string
    description: Path to preprocessed dMRI data (NIFTI or HDF5)
