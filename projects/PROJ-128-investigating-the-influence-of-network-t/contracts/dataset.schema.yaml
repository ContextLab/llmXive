$schema: http://json-schema.org/draft-07/schema#
title: HCP Dataset Schema
description: Schema for the raw and processed HCP brain imaging dataset structure.
type: object
properties:
  raw:
    type: object
    description: Raw data directories
    properties:
      fmri:
        type: string
        description: Path to raw fMRI NIfTI files
      dmri:
        type: string
        description: Path to raw dMRI NIfTI files
      bval:
        type: string
        description: Path to dMRI b-values
      bvec:
        type: string
        description: Path to dMRI b-vectors
    required:
      - fmri
      - dmri
  processed:
    type: object
    description: Processed data artifacts
    properties:
      structural_metrics:
        type: string
        description: Path to structural metrics CSV
      dynamic_metrics:
        type: string
        description: Path to dynamic metrics CSV
      correlation_results:
        type: string
        description: Path to correlation results CSV
      sensitivity_results:
        type: string
        description: Path to sensitivity analysis results
    required:
      - structural_metrics
      - dynamic_metrics
  logs:
    type: object
    description: Execution logs
    properties:
      exclusion_log:
        type: string
        description: Path to subject exclusion log JSON
      resource_log:
        type: string
        description: Path to resource usage log
required:
  - raw
  - processed
  - logs
