# Minimal placeholder schema for the OpenNeuro ds000224 dataset.
# Real validation rules should be added as the project matures.
$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  subject_id:
    type: string
  modality:
    type: string
  filename:
    type: string
  url:
    type: string
required:
  - subject_id
  - modality
  - filename
  - url
