$schema: "http://json-schema.org/draft-07/schema#"
title: "OpenNeuro HCP Dataset Schema"
description: "Schema for the verified OpenNeuro ds000224 dataset used in structural-functional analysis."
type: "object"
properties:
  subject_id:
    type: "string"
    description: "Unique identifier for the subject."
  structural_matrix:
    type: "array"
    items:
      type: "number"
    description: "Flattened structural connectivity matrix."
  fMRI_time_series:
    type: "array"
    items:
      type: "array"
      items:
        type: "number"
    description: "2D array of fMRI time series (time x regions)."
  metadata:
    type: "object"
    properties:
      age:
        type: "number"
      sex:
        type: "string"
    description: "Subject metadata."
required:
  - "subject_id"
  - "structural_matrix"
  - "fMRI_time_series"