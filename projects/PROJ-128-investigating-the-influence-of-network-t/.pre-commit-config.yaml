repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: []

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/pylint
    rev: v3.0.3
    hooks:
      - id: pylint
        args:
          - --disable=too-many-arguments,too-many-locals,too-many-branches,too-many-statements,missing-module-docstring,missing-class-docstring,missing-function-docstring,invalid-name,import-outside-toplevel,cyclic-import
        additional_dependencies:
          - nilearn>=0.10.0
          - networkx>=3.1
          - scikit-learn>=1.3.0
          - pandas>=2.0.0
          - numpy>=1.24.0
          - statsmodels>=0.14.0
          - scipy>=1.11.0
          - pyyaml>=6.0