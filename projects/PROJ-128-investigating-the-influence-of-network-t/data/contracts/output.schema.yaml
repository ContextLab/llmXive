schema_version: "1.0"
name: "Analysis Output Schema"
description: "Schema for all output files generated by the pipeline"

required_outputs:
  structural_metrics:
    file: "data/processed/structural_metrics.csv"
    format: "CSV"
    columns:
      - name: "subject_id"
        type: "string"
        required: true
      - name: "global_efficiency"
        type: "number"
        required: true
      - name: "average_clustering_coefficient"
        type: "number"
        required: true
      - name: "modularity"
        type: "number"
        required: true
      - name: "density_threshold"
        type: "number"
        required: true
      - name: "actual_density"
        type: "number"
        required: true
      - name: "num_nodes"
        type: "integer"
        required: true
      - name: "num_edges"
        type: "integer"
        required: true
        
  dynamic_metrics:
    file: "data/processed/dynamic_metrics.csv"
    format: "CSV"
    columns:
      - name: "subject_id"
        type: "string"
        required: true
      - name: "state_id"
        type: "integer"
        required: true
      - name: "mean_dwell_time"
        type: "number"
        required: true
      - name: "num_visits"
        type: "integer"
        required: true
        
  correlation_results:
    file: "data/processed/correlation_results.csv"
    format: "CSV"
    columns:
      - name: "structural_metric"
        type: "string"
        required: true
      - name: "dynamic_metric"
        type: "string"
        required: true
      - name: "correlation_coefficient"
        type: "number"
        required: true
      - name: "p_value"
        type: "number"
        required: true
      - name: "fdr_corrected_p_value"
        type: "number"
        required: true
      - name: "significant"
        type: "boolean"
        required: true
        
  sensitivity_analysis:
    file: "data/processed/structural_density_sensitivity.csv"
    format: "CSV"
    columns:
      - name: "subject_id"
        type: "string"
        required: true
      - name: "density_threshold"
        type: "number"
        required: true
      - name: "global_efficiency"
        type: "number"
        required: true
      - name: "average_clustering_coefficient"
        type: "number"
        required: true
      - name: "modularity"
        type: "number"
        required: true
        
  exclusion_log:
    file: "data/logs/exclusion_log.json"
    format: "JSON"
    schema:
      type: "array"
      items:
        type: "object"
        properties:
          subject_id:
            type: "string"
          reason:
            type: "string"
          timestamp:
            type: "string"
            format: "date-time"
            
  final_report:
    file: "data/reports/final_report.json"
    format: "JSON"
    required_fields:
      - "summary_statistics"
      - "correlation_matrix"
      - "sensitivity_analysis"
      - "exclusion_summary"
      - "associational_framing"