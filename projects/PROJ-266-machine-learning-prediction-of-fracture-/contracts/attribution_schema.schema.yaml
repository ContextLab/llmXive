$schema: "http://json-schema.org/draft-07/schema#"
title: "Attribution Schema"
type: "object"
properties:
  image_id:
    type: "string"
  heatmap_paths:
    type: "array"
    items:
      type: "string"
  iou_scores:
    type: "array"
    items:
      type: "number"
  stability_threshold_met:
    type: "boolean"
required:
  - image_id
  - heatmap_paths
  - iou_scores
  - stability_threshold_met