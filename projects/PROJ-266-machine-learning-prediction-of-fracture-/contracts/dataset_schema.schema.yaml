$schema: "http://json-schema.org/draft-07/schema#"
title: "Fracture Toughness Dataset Schema"
description: "Schema for the microstructure image dataset used to predict fracture toughness (K_IC)."
type: "object"
required:
  - image_id
  - image_path
  - alloy_family
  - k_ic
  - magnification_calibration
  - section_thickness
properties:
  image_id:
    type: "string"
    description: "Unique identifier for the image sample."
  image_path:
    type: "string"
    description: "Relative path to the image file within the data/raw directory."
  alloy_family:
    type: "string"
    enum:
      - "steel"
      - "Al"
      - "Ti"
    description: "The metallic alloy family of the sample."
  k_ic:
    type: "number"
    description: "Fracture toughness value (MPa√m). Synthetic ground truth derived from physics-informed logic."
  magnification_calibration:
    type: "number"
    description: "Pixels per micron calibration factor for the image."
  section_thickness:
    type: "number"
    description: "Sample thickness in nanometers (proxy for TEM/sectioning preparation)."
  metadata_version:
    type: "string"
    description: "Version of the schema used to generate this record."
    default: "1.0.0"
additionalProperties: false