$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema"
type: "object"
properties:
  image_id:
    type: "string"
  alloy_family:
    type: "string"
    enum: ["steel", "Al", "Ti"]
  k_ic:
    type: "number"
  num_grains:
    type: "integer"
  avg_grain_size_px:
    type: "number"
  precipitate_density:
    type: "number"
  magnification_calibration:
    type: "number"
  section_thickness:
    type: "number"
  surface_prep_protocol:
    type: "string"
  seed:
    type: "integer"
required:
  - image_id
  - alloy_family
  - k_ic
  - num_grains
  - avg_grain_size_px
  - precipitate_density
