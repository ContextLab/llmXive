$schema: http://json-schema.org/draft-07/schema#
title: Model Evaluation Schema
description: >-
  Schema for the results of model training and evaluation.
  Captures performance metrics, statistical test results, and hyperparameters.
type: object
required:
  - model_name
  - metrics
  - dataset_splits
properties:
  model_name:
    type: string
    description: Name of the model architecture evaluated.
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the evaluation run.
  dataset_splits:
    type: object
    description: Counts of samples in each split.
    required:
      - train
      - val
      - test
    properties:
      train:
        type: integer
        minimum: 1
      val:
        type: integer
        minimum: 0
      test:
        type: integer
        minimum: 1
  metrics:
    type: object
    description: Regression performance metrics.
    required:
      - r2
      - mae
      - rmse
    properties:
      r2:
        type: number
        description: Coefficient of determination.
      mae:
        type: number
        description: Mean Absolute Error.
      rmse:
        type: number
        description: Root Mean Squared Error.
      mape:
        type: number
        description: Mean Absolute Percentage Error (optional).
  statistical_tests:
    type: object
    description: Results of statistical comparisons against baselines.
    properties:
      wilcoxon:
        type: object
        description: Wilcoxon signed-rank test results.
        properties:
          statistic:
            type: number
          p_value:
            type: number
            minimum: 0
            maximum: 1
          alternative:
            type: string
            enum:
              - two-sided
              - less
              - greater
      permutation_test:
        type: object
        description: Permutation test results.
        properties:
          statistic:
            type: number
          p_value:
            type: number
            minimum: 0
            maximum: 1
          n_permutations:
            type: integer
            minimum: 1
  hyperparameters:
    type: object
    description: Key hyperparameters used for the model.
    additionalProperties: true
  stability_metrics:
    type: object
    description: Metrics regarding model stability and explainability.
    properties:
      mean_iou:
        type: number
        description: Mean Intersection over Union for attribution stability.
        minimum: 0
        maximum: 1
      std_iou:
        type: number
        description: Standard deviation of IoU scores.
        minimum: 0
additionalProperties: false