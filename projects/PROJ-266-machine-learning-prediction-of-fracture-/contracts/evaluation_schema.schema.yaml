$schema: "http://json-schema.org/draft-07/schema#"
title: "Evaluation Schema"
type: "object"
properties:
  model_type:
    type: "string"
    enum: ["cnn", "linear", "random_forest"]
  r_squared:
    type: "number"
  mae:
    type: "number"
  rmse:
    type: "number"
  wilcoxon_p_value:
    type: "number"
required:
  - model_type
  - r_squared
  - mae
  - rmse
