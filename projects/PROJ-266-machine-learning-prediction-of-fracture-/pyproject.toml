[project]
name = "machine-learning-prediction-of-fracture"
version = "0.1.0"
description = "Machine Learning Prediction of Fracture Toughness from Microstructure Images"
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
select = ['E', 'F', 'W']
ignore = ['E501']
line-length = 88
target-version = 'py311'

[tool.ruff.per-file-ignores]
"tests/*" = ["F401"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
