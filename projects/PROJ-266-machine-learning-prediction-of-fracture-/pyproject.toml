[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fracture-toughness-prediction"
version = "0.1.0"
description = "Machine Learning Prediction of Fracture Toughness from Microstructure Images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "scikit-learn",
    "opencv-python-headless",
    "pandas",
    "numpy",
    "matplotlib",
    "captum",
    "pyyaml",
    "pytest",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
select = ['E', 'F', 'W']
ignore = ['E501']