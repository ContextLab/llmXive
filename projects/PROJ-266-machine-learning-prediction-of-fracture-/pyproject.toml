[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fracture-toughness-prediction"
version = "0.1.0"
description = "Machine Learning Prediction of Fracture Toughness from Microstructure Images"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "opencv-python-headless>=4.8.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "captum>=0.6.0",
    "pillow>=9.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # assert allowed in tests

[tool.ruff.isort]
known-first-party = ["code"]
known-third-party = ["torch", "numpy", "pandas", "matplotlib", "sklearn", "pillow", "captum"]

[tool.setuptools]
packages = ["code", "code.data", "code.models", "code.train", "code.explain", "code.utils"]
