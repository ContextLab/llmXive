[metadata]
name = physical-activity-mood-analysis
version = 0.1.0
description = Analysis of Physical Activity Levels and Mood Variability
long_description = file: README.md
long_description_content_type = text/markdown
author = llmXive Research Team
license = MIT

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pandas
    statsmodels
    scikit-learn
    pyyaml
    requests
    numpy

[options.packages.find]
where = .
exclude =
    tests*