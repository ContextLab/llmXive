[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
skip-string-normalization = false
force-exclude = '''.(egg-info|build|dist|\.git|\.tox|\.mypy_cache|\.venv)'''

[tool.isort]
profile = "black"
line_length = 88
skip = ["venv", ".git", "build", "dist"]
