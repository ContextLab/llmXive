# Schema for daily_aggregates.csv
# Validates the output of User Story 1 (Preprocessing)
type: object
required:
  - participant_id
  - date
  - total_steps
  - mean_mood
  - mood_std
  - log_mood_std
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant
  date:
    type: string
    format: date
    description: Date of the observation (YYYY-MM-DD)
  total_steps:
    type: integer
    minimum: 0
    description: Total number of steps recorded for the day
  mean_mood:
    type: number
    description: Average mood rating for the day
  mood_std:
    type: number
    minimum: 0
    description: Standard deviation of mood ratings for the day
  log_mood_std:
    type: number
    description: Log-transformed mood standard deviation (mood_std + epsilon)
  sleep_duration:
    type: number
    nullable: true
    description: Derived sleep duration in hours (optional)
  baseline_affect:
    type: number
    nullable: true
    description: Derived baseline affect (optional)
additionalProperties: false
