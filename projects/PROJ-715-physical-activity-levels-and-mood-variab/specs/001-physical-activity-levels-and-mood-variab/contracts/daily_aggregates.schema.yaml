# Schema for daily_aggregates.csv
# Generated for Task T016
# Defines the expected structure, types, and constraints for the daily aggregates output.

name: daily_aggregates
description: Daily aggregated metrics for physical activity and mood variability
fields:
  - name: participant_id
    type: string
    required: true
    description: Unique identifier for the participant
    
  - name: date
    type: date
    format: "%Y-%m-%d"
    required: true
    description: The date of the aggregated data (YYYY-MM-DD)
    
  - name: total_steps
    type: integer
    required: true
    minimum: 0
    description: Total number of steps recorded for the participant on this day
    
  - name: mean_mood
    type: number
    required: true
    description: Mean mood rating for the day (calculated from EMA responses)
    # Note: Mood ratings are typically on a scale (e.g., 1-5 or 0-100)
    
  - name: mood_std
    type: number
    required: true
    minimum: 0.0
    description: Standard deviation of mood ratings for the day
    # Note: This value is log-transformed (log(mood_std + epsilon)) as per T015b
    
  - name: sleep_duration
    type: number
    required: false
    nullable: true
    description: Derived sleep duration in hours (may be null if not derivable)
    
  - name: baseline_affect
    type: number
    required: false
    nullable: true
    description: Derived baseline affect score (may be null if not derivable)
    
  - name: n_mood_ratings
    type: integer
    required: true
    minimum: 2
    description: Number of valid mood ratings used for the daily calculation
    
  - name: day_of_week
    type: integer
    required: true
    minimum: 0
    maximum: 6
    description: Day of week (0=Monday, 6=Sunday)
    
constraints:
  - name: unique_participant_day
    description: Each participant_id and date combination must be unique
    unique:
      - participant_id
      - date
  - name: min_ratings
    description: Days with fewer than 2 mood ratings are excluded
    filter: n_mood_ratings >= 2
