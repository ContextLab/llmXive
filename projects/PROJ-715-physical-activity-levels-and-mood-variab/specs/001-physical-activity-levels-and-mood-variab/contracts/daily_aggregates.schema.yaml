type: object
required:
  - participant_id
  - date
  - total_steps
  - mean_mood
  - mood_std
  - n_mood_ratings
  - day_of_week
properties:
  participant_id:
    type: string
  date:
    type: string
    format: date
  total_steps:
    type: integer
    minimum: 0
  mean_mood:
    type: number
  mood_std:
    type: number
    minimum: 0
  n_mood_ratings:
    type: integer
    minimum: 2
  sleep_duration:
    type: number
    nullable: true
  baseline_affect:
    type: number
    nullable: true
  day_of_week:
    type: integer
    minimum: 0
    maximum: 6