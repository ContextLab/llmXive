$schema: http://json-schema.org/draft-07/schema#
title: Model Results Schema
description: Schema for the output of the statistical modeling pipeline (T025).
type: object
required:
  - metadata
  - models
  - validation
  - sensitivity
properties:
  metadata:
    type: object
    properties:
      version:
        type: string
      generated_at:
        type: string
        format: date-time
      pipeline_task:
        type: string
    required:
      - version
      - pipeline_task
  models:
    type: object
    required:
      - mood_std
      - mean_mood
    properties:
      mood_std:
        type: object
        description: Results for the model with log-transformed mood_std as outcome.
        properties:
          fixed_effects:
            type: object
            additionalProperties:
              type: object
              properties:
                estimate:
                  type: number
                std_error:
                  type: number
                p_value:
                  type: number
                ci_lower:
                  type: number
                ci_upper:
                  type: number
              required:
                - estimate
                - p_value
          convergence_status:
            type: boolean
          associational_label:
            type: string
            const: "associational"
      mean_mood:
        type: object
        description: Results for the model with mean_mood as outcome.
        properties:
          fixed_effects:
            type: object
            additionalProperties:
              type: object
              properties:
                estimate:
                  type: number
                std_error:
                  type: number
                p_value:
                  type: number
                ci_lower:
                  type: number
                ci_upper:
                  type: number
              required:
                - estimate
                - p_value
          convergence_status:
            type: boolean
          associational_label:
            type: string
            const: "associational"
  validation:
    type: object
    description: Leave-One-Participant-Out (LOPO) cross-validation results.
    required:
      - lopo_sign_consistency
      - lopo_average_rmse
    properties:
      lopo_sign_consistency:
        type: number
        description: Percentage of folds where the total_steps coefficient sign matches the full model.
        minimum: 0
        maximum: 100
      lopo_average_rmse:
        type: number
        description: Average RMSE across all LOPO folds.
      threshold_met:
        type: boolean
        description: Whether sign consistency >= 90%.
  sensitivity:
    type: object
    description: Sensitivity analysis results.
    required:
      - single_rating_bootstrap_consistency
    properties:
      weekdays_only:
        type: object
        description: Results of re-running model on weekdays only.
      active_minutes:
        type: object
        description: Results of re-running model with active minutes metric.
      single_rating_bootstrap_consistency:
        type: number
        description: Percentage of bootstrap samples where direction is consistent between exclusion and imputation models.
        minimum: 0
        maximum: 100
      threshold_met:
        type: boolean
        description: Whether consistency >= 80%.
additionalProperties: false