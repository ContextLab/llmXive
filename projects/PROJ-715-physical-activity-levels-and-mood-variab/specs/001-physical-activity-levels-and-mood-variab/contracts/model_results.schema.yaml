# Schema for model_results.json
# Defines the expected structure for the output of the statistical modeling phase
type: object
required:
  - models
  - diagnostics
  - lopo_results
  - sensitivity_analysis
  - metadata
properties:
  models:
    type: array
    description: List of fitted model results
    items:
      type: object
      required:
        - model_name
        - outcome
        - predictor
        - fixed_effects
        - converged
      properties:
        model_name:
          type: string
          description: Name of the model (e.g., 'mood_std_model', 'mean_mood_model')
        outcome:
          type: string
          description: The dependent variable used
        predictor:
          type: string
          description: The primary independent variable (total_steps)
        fixed_effects:
          type: object
          description: Dictionary of fixed effect coefficients
          additionalProperties:
            type: object
            required:
              - estimate
              - se
              - p_value
              - ci_lower
              - ci_upper
            properties:
              estimate:
                type: number
              se:
                type: number
              p_value:
                type: number
              ci_lower:
                type: number
              ci_upper:
                type: number
        converged:
          type: boolean
          description: Whether the model optimization converged successfully
        random_effects:
          type: object
          description: Random effects variance components (optional)
          nullable: true
  diagnostics:
    type: object
    description: Model diagnostic test results
    properties:
      shapiro_wilk:
        type: object
        properties:
          statistic:
            type: number
          p_value:
            type: number
      breusch_pagan:
        type: object
        properties:
          statistic:
            type: number
          p_value:
            type: number
  lopo_results:
    type: object
    description: Leave-One-Participant-Out cross-validation results
    required:
      - sign_stability
      - folds
    properties:
      sign_stability:
        type: number
        description: Percentage of folds where coefficient sign matched
      folds:
        type: integer
        description: Number of participants/folds
  sensitivity_analysis:
    type: object
    description: Results from sensitivity analyses
    properties:
      weekdays_only:
        type: object
        properties:
          coefficient:
            type: number
      active_minutes:
        type: object
        properties:
          coefficient:
            type: number
      exclude_single_ratings:
        type: object
        properties:
          coefficient:
            type: number
      impute_single_ratings:
        type: object
        properties:
          coefficient:
            type: number
  metadata:
    type: object
    description: Pipeline execution metadata
    required:
      - timestamp
      - pipeline_version
    properties:
      timestamp:
        type: string
        format: date-time
      pipeline_version:
        type: string
      data_source:
        type: string
      sample_size:
        type: integer
additionalProperties: false