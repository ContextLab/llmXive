type: object
required:
  - model_type
  - fixed_effects
  - random_effects
  - model_fit
  - validation
  - sensitivity
  - diagnostics
  - associational
properties:
  model_type:
    type: string
    description: Name of the primary model, e.g., "LMM_mood_variability"
  fixed_effects:
    type: object
    description: Fixed effect coefficients for the primary model
    additionalProperties:
      type: object
      required:
        - estimate
        - std_err
        - p_value
        - ci_lower
        - ci_upper
      properties:
        estimate:
          type: number
        std_err:
          type: number
        p_value:
          type: number
        ci_lower:
          type: number
        ci_upper:
          type: number
  random_effects:
    type: object
    description: Variance components for random effects
    additionalProperties:
      type: number
  model_fit:
    type: object
    required:
      - aic
      - bic
      - log_likelihood
    properties:
      aic:
        type: number
      bic:
        type: number
      log_likelihood:
        type: number
  secondary_model:
    type: object
    description: Results for the secondary model (mean_mood)
    required:
      - model_type
      - fixed_effects
      - random_effects
      - model_fit
    properties:
      model_type:
        type: string
      fixed_effects:
        type: object
        additionalProperties:
          type: object
          required:
            - estimate
            - std_err
            - p_value
            - ci_lower
            - ci_upper
          properties:
            estimate:
              type: number
            std_err:
              type: number
            p_value:
              type: number
            ci_lower:
              type: number
            ci_upper:
              type: number
      random_effects:
        type: object
        additionalProperties:
          type: number
      model_fit:
        type: object
        required:
          - aic
          - bic
          - log_likelihood
        properties:
          aic:
            type: number
          bic:
            type: number
          log_likelihood:
            type: number
  validation:
    type: object
    required:
      - lopo_average_rmse
      - lopo_sign_consistency_pct
    properties:
      lopo_average_rmse:
        type: number
      lopo_sign_consistency_pct:
        type: number
  sensitivity:
    type: object
    required:
      - weekdays_only_sign_consistent
      - active_minutes_sign_consistent
      - single_rating_bootstrap_consistency
      - single_rating_bootstrap_pass
    properties:
      weekdays_only_sign_consistent:
        type: boolean
      active_minutes_sign_consistent:
        type: boolean
      single_rating_bootstrap_consistency:
        type: number
      single_rating_bootstrap_pass:
        type: boolean
  diagnostics:
    type: object
    required:
      - shapiro_wilk
      - breusch_pagan
      - residuals_plot
    properties:
      shapiro_wilk:
        type: object
        required:
          - statistic
          - p_value
        properties:
          statistic:
            type: number
          p_value:
            type: number
      breusch_pagan:
        type: object
        required:
          - lm_statistic
          - p_value
        properties:
          lm_statistic:
            type: number
          p_value:
            type: number
      residuals_plot:
        type: string
  associational:
    type: boolean
    description: Flag indicating results are associational, not causal
