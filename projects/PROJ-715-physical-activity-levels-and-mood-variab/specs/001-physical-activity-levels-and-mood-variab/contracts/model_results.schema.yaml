type: object
properties:
  model_name:
    type: string
  fixed_effects:
    type: object
    properties:
      total_steps:
        type: object
        properties:
          coefficient:
            type: number
          std_error:
            type: number
          p_value:
            type: number
          ci_lower:
            type: number
          ci_upper:
            type: number
      sleep_duration:
        type: object
        properties:
          coefficient:
            type: number
          std_error:
            type: number
          p_value:
            type: number
          ci_lower:
            type: number
          ci_upper:
            type: number
      day_of_week:
        type: array
        items:
          type: object
          properties:
            day:
              type: string
            coefficient:
              type: number
            std_error:
              type: number
            p_value:
              type: number
            ci_lower:
              type: number
            ci_upper:
              type: number
      baseline_affect:
        type: object
        properties:
          coefficient:
            type: number
          std_error:
            type: number
          p_value:
            type: number
          ci_lower:
            type: number
          ci_upper:
            type: number
  random_effects:
    type: object
    properties:
      participant_id:
        type: object
        properties:
          variance:
            type: number
  diagnostics:
    type: object
    properties:
      convergence:
        type: boolean
      shapiro_wilk:
        type: object
        properties:
          statistic:
            type: number
          p_value:
            type: number
      breusch_pagan:
        type: object
        properties:
          statistic:
            type: number
          p_value:
            type: number
required:
  - model_name
  - fixed_effects
  - random_effects
  - diagnostics
