$schema: http://json-schema.org/draft-07/schema#
title: Preprocess Stats Schema
description: >
  Schema for data/processed/preprocess_stats.json.
  Tracks preprocessing statistics and data provenance.
type: object
required:
  - excluded_days_count
  - reason
  - data_source_url
properties:
  excluded_days_count:
    type: integer
    description: Number of days excluded during preprocessing.
    minimum: 0
  reason:
    type: string
    description: >
      Reason for exclusion (e.g., "n_mood_ratings < 2", "missing step data").
      For the initial state, may be "initial".
  data_source_url:
    type: string
    description: >
      The URL or DOI of the data source used (e.g., OSF DOI or HuggingFace URL).
      Must be a valid URL or DOI string.
  timestamp:
    type: string
    format: date-time
    description: Optional ISO 8601 timestamp of when the stats were generated.
additionalProperties: false