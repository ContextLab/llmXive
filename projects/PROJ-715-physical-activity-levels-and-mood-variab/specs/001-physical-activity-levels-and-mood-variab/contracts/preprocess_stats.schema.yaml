$schema: http://json-schema.org/draft-07/schema#
title: Preprocess Stats Schema
description: Schema for data/processed/preprocess_stats.json tracking preprocessing statistics and data provenance.
type: object
required:
  - excluded_days_count
  - reason
  - data_source_url
properties:
  excluded_days_count:
    type: integer
    description: Number of days excluded during preprocessing.
    minimum: 0
  reason:
    type: string
    description: Reason for exclusion (e.g., "n_mood_ratings < 2").
    examples:
      - "n_mood_ratings < 2"
      - "initial"
      - "missing_steps"
  data_source_url:
    type: string
    description: The URL or DOI of the source dataset used (OSF or HuggingFace).
    format: uri
    examples:
      - "https://doi.org/10.7910/DVN/28475"
      - "https://huggingface.co/datasets/studentlife"
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the stats were generated.
    nullable: true
additionalProperties: false