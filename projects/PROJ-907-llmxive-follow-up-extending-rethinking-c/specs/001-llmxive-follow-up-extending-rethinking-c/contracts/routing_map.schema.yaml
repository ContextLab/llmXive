$schema: "http://json-schema.org/draft-07/schema#"
title: "Canonical Routing Map Schema"
description: "Schema for data/routing_cache/canonical_map.json"
type: "object"
required:
  - "version"
  - "generated_at"
  - "blocks"
properties:
  version:
    type: "string"
    description: "Schema version identifier"
  generated_at:
    type: "string"
    format: "date-time"
    description: "ISO8601 timestamp of generation"
  blocks:
    type: "array"
    items:
      type: "object"
      required:
        - "block_id"
        - "static_weights"
        - "source"
      properties:
        block_id:
          type: "integer"
          description: "Unique identifier for the transformer block"
        static_weights:
          type: "array"
          items:
            type: "number"
          description: "The static weight vector for this block"
        source:
          type: "string"
          enum:
            - "dominant_cluster"
            - "global_average"
          description: "Method used to derive the weights"
additionalProperties: false