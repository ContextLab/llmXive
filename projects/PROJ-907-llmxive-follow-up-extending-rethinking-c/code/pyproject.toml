[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-rethinking-c"
version = "0.1.0"
description = "Automated science pipeline for extending Rethinking Cross-Layer Information Routing in Diffusion Transformers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch==2.3.0+cpu",
    "torchvision==0.18.0",
    "transformers",
    "diffusers",
    "scikit-learn",
    "torchmetrics",
    "datasets",
    "numpy",
    "pandas",
    "matplotlib",
    "ruff",
    "black"
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["src*", "tests*"]

[tool.ruff]
# Enable specific rules: E (pycodestyle), F (pyflakes), W (warning), I (isort), N (pep8-naming)
select = ["E", "F", "W", "I", "N"]
ignore = []

# Exclude standard build directories
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "code/data",
    "code/docs"
]

# Line length for formatting
line-length = 88

# Target version
target-version = "py39"

[tool.ruff.per-file-ignores]
"tests/*" = ["N802"] # Allow test functions to start with test_ (N802 check for naming)

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.tox
    | __pycache__
    | build
    | dist
    | code/data
    | code/docs
)/
'''

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"