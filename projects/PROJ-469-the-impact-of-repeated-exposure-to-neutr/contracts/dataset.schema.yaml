name: project_implicit_political_iat
description: >-
  Schema for the Project Implicit Political IAT dataset used in the study
  "The Impact of Self-Reported Political News Exposure on Implicit Political Bias".
  Defines required columns, data types, and validation logic for data ingestion.
version: "1.0.0"

columns:
  - name: IAT_D_score
    type: float
    description: >-
      The D-score measure of implicit bias from the Implicit Association Test.
      Positive values indicate faster association of the first category with the
      first attribute (e.g., Liberal+Good), negative values indicate the reverse.
      Calculated using the improved D-algorithm.
    validation:
      - min: -4.0
        max: 4.0
        message: "IAT_D_score must be within the plausible range [-4.0, 4.0]."
      - not_null: true
        message: "IAT_D_score cannot be null."

  - name: political_ideology
    type: float
    description: >-
      Self-reported political ideology on a continuous scale (typically 1-7).
      1 = Very Liberal, 7 = Very Conservative. Used as a continuous predictor
      in the primary interaction model.
    validation:
      - min: 1.0
        max: 7.0
        message: "political_ideology must be within the scale range [1.0, 7.0]."
      - not_null: true
        message: "political_ideology cannot be null."

  - name: news_exposure_freq
    type: float
    description: >-
      Frequency of political news exposure (self-reported).
      Typically measured on a Likert scale (e.g., 1 = Never, 5 = Daily).
      Used as the primary exposure variable.
    validation:
      - min: 1.0
        max: 7.0
        message: "news_exposure_freq must be within the plausible scale range [1.0, 7.0]."
      - not_null: true
        message: "news_exposure_freq cannot be null."

  # Optional covariates often present in the raw data, validated if present
  - name: age
    type: float
    description: "Participant age in years."
    validation:
      - min: 18.0
        max: 120.0
        message: "age must be between 18 and 120."
      - not_null: false # Optional in primary analysis, but if present must be valid

  - name: gender
    type: string
    description: "Self-reported gender."
    validation:
      - allowed_values: ["Male", "Female", "Non-binary", "Prefer not to say", "Other"]
        message: "gender must be one of the allowed categories."

  - name: education
    type: string
    description: "Highest level of education completed."
    validation:
      - allowed_values: ["High School", "Some College", "Bachelor's Degree", "Master's Degree", "Doctorate", "Professional Degree"]
        message: "education must be one of the allowed categories."

validation_logic:
  description: >-
    Rules to be applied when loading data to ensure integrity before analysis.
  steps:
    - name: check_required_columns
      description: "Verify all columns marked 'required' in the analysis plan exist."
      columns: ["IAT_D_score", "political_ideology", "news_exposure_freq"]
      action: "raise ValueError"

    - name: validate_ranges
      description: "Ensure numeric columns fall within their defined min/max bounds."
      action: "raise ValueError"

    - name: check_missingness
      description: >-
        Calculate missingness rate for each required column.
        If any required column has > 50% missing values, halt processing.
        (Imputation will handle lower rates of missingness).
      threshold: 0.50
      action: "raise ValueError"

    - name: type_coercion
      description: "Ensure all numeric columns are cast to float64."
      action: "warn and coerce"

meta:
  source: "Project Implicit Research Data"
  license: "CC BY-NC-SA 4.0"
  citation: >-
    Nosek, B. A., et al. (2002). Project Implicit: The Implicit Association Test.
    Retrieved from https://implicit.harvard.edu/implicit/