version: "1.0.0"
description: >
  Schema for the Project Implicit Political IAT dataset.
  Defines required columns, data types, validation rules, and
  constraints for the core analysis variables.
source:
  name: "Project Implicit Political IAT"
  description: "Data from the Project Implicit website regarding political ideology and implicit bias."
  fetch_task: "T038"
columns:
  - name: IAT_D_score
    type: float
    description: >
      The D-score metric for the political IAT.
      Represents the strength of the implicit association.
      Negative values indicate a preference for one group,
      positive for the other, magnitude indicates strength.
    constraints:
      min: -2.0
      max: 2.0
      allow_nan: true
      nan_policy: "impute"
    validation:
      - "is_finite_or_nan"
  
  - name: political_ideology
    type: float
    description: >
      Self-reported political ideology on a continuous scale.
      Typically 1 (Very Liberal) to 7 (Very Conservative) or similar.
      Higher values indicate more conservative ideology.
    constraints:
      min: 1.0
      max: 7.0
      allow_nan: true
      nan_policy: "impute"
    validation:
      - "is_finite_or_nan"
      - "in_range(1.0, 7.0)"

  - name: news_exposure_freq
    type: float
    description: >
      Self-reported frequency of political news exposure.
      Scale typically 1 (Never) to 7 (Very Often).
      Higher values indicate more frequent exposure.
    constraints:
      min: 1.0
      max: 7.0
      allow_nan: true
      nan_policy: "impute"
    validation:
      - "is_finite_or_nan"
      - "in_range(1.0, 7.0)"

  - name: age
    type: float
    description: "Participant age in years."
    constraints:
      min: 18.0
      max: 120.0
      allow_nan: true
      nan_policy: "impute"
    validation:
      - "is_finite_or_nan"

  - name: gender
    type: string
    description: "Self-reported gender."
    constraints:
      allowed_values: ["Male", "Female", "Non-binary", "Other", "Prefer not to answer"]
      allow_nan: true
      nan_policy: "drop"
    validation:
      - "is_valid_categorical"

  - name: education
    type: string
    description: "Self-reported education level."
    constraints:
      allowed_values: ["Less than high school", "High school graduate", "Some college", "Bachelor's degree", "Graduate degree"]
      allow_nan: true
      nan_policy: "drop"
    validation:
      - "is_valid_categorical"

global_validations:
  - name: "check_sample_size"
    description: "Ensure the dataset has enough rows for analysis."
    condition: "len(df) >= 30"
    error_message: "Dataset has fewer than 30 rows. Power is insufficient for reliable analysis."
    severity: "error"

  - name: "check_missingness_rate"
    description: "Check if missingness in key variables exceeds 50%."
    columns: ["IAT_D_score", "political_ideology", "news_exposure_freq"]
    threshold: 0.50
    error_message: "Missingness rate for key variables exceeds 50%. Imputation may not be reliable."
    severity: "error"

derived_columns:
  - name: news_exposure_z
    source: news_exposure_freq
    transformation: "z_score"
    description: "Z-scored news exposure frequency."
  
  - name: ideology_binary
    source: political_ideology
    transformation: "median_split"
    description: "Binary ideology (0: Liberal, 1: Conservative) based on median split."

metadata:
  created_by: "T007"
  created_date: "2023-10-27"
  last_modified: "2023-10-27"