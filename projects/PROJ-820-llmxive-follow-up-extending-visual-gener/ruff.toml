# Ruff configuration for llmXive project
# Enforces consistent style, linting, and formatting rules

[lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N",  # pep8-naming
    "SIM",# flake8-simplify
]
ignore = [
    "E501", # Line too long (handled by Black)
    "B008", # Do not perform function call in argument defaults (common in testing)
    "SIM105", # Use `contextlib.suppress` instead of try/except (optional preference)
]

# Exclude a few common directories
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "data",
    "specs",
]

# Allow autofixes for all selected rules
fixable = ["ALL"]
unfixable = []

# Exclude from autofix if needed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Ignore specific rules for specific files if necessary
"tests/*" = ["S101"] # Allow assert in tests
"code/utils/create_scene_descriptions.py" = ["S311"] # Allow random for scene generation

[format]
# Use double quotes for strings (matching Black default)
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect the line length defined in pyproject.toml
line-ending = "auto"
