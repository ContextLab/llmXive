[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-graph-loss"
version = "0.1.0"
description = "Investigating Loss Functions on Small-World Graphs"
requires-python = ">=3.10"
dependencies = [
    "networkx",
    "torch",
    "scikit-learn",
    "statsmodels",
    "lifelines",
    "numpy",
    "pandas",
    "flake8",
    "black",
    "isort",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["power_analysis", "setup_structure"]

[tool.flake8]
max-line-length = 88
extend-ignore = "E203,W503"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
]
per-file-ignores = ""
