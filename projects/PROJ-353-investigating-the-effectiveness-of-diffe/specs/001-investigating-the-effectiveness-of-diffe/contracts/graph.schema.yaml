$schema: "http://json-schema.org/draft-07/schema#"
title: "SyntheticGraph"
description: "Schema for a single Watts-Strogatz graph record generated by code/generate_graphs.py"
type: "object"
properties:
  graph_id:
    type: "string"
    description: "Unique identifier for the graph"
  rewiring_probability_beta:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "The beta parameter used for generation"
  node_count:
    type: "integer"
    description: "Total number of nodes (fixed at 100)"
  k_neighbors:
    type: "integer"
    description: "Initial number of neighbors per node (fixed at 4)"
  clustering_coefficient:
    type: "number"
    description: "Global clustering coefficient"
  avg_path_length:
    type: "number"
    description: "Average shortest path length"
  community_labels:
    type: "array"
    items:
      type: "integer"
    description: "Community ID for each node"
  adjacency_matrix:
    type: "array"
    items:
      type: "array"
      items:
        type: "integer"
    description: "Adjacency matrix (list of lists)"
  seed:
    type: "integer"
    description: "Random seed used for generation"
required:
  - graph_id
  - rewiring_probability_beta
  - node_count
  - k_neighbors
  - clustering_coefficient
  - community_labels
  - seed
additionalProperties: false