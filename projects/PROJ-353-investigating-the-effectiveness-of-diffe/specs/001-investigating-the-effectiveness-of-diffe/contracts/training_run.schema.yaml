$schema: "http://json-schema.org/draft-07/schema#"
title: "TrainingRun"
description: "Schema for a single training run record"
type: "object"
properties:
  run_id:
    type: "string"
    description: "Unique identifier for the run"
  graph_id:
    type: "string"
    description: "Reference to the graph ID"
  loss_type:
    type: "string"
    enum:
      - "cross_entropy"
      - "info_nce"
    description: "Loss function used"
  convergence_epoch:
    type:
      - "integer"
      - "null"
    description: "Epoch where accuracy >= 0.90, or null if censored"
  is_censored:
    type: "boolean"
    description: "True if convergence_epoch is null"
  final_accuracy:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Final accuracy achieved"
  accuracy_epoch_100:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Accuracy at epoch 100"
  accuracy_epoch_500:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Accuracy at epoch 500"
  total_epochs:
    type: "integer"
    description: "Total epochs run"
  loss_curve:
    type: "array"
    items:
      type: "number"
    description: "Loss per epoch"
  training_seed:
    type: "integer"
    description: "Random seed for training"
required:
  - run_id
  - graph_id
  - loss_type
  - is_censored
  - final_accuracy
  - total_epochs
  - training_seed
additionalProperties: false