$schema: "http://json-schema.org/draft-07/schema#"
title: "AnalysisResult"
description: "Schema for the final statistical analysis output"
type: "object"
properties:
  tobit_interaction_p_value:
    type: "number"
    description: "P-value for the interaction term in the Tobit model"
  cox_interaction_p_value:
    type: "number"
    description: "P-value for the interaction term in the Cox model"
  cox_ph_valid:
    type: "boolean"
    description: "True if the Proportional Hazards assumption was verified (Schoenfeld test)"
  is_significant:
    type: "boolean"
    description: "True if (Tobit p < 0.05) OR (Cox p < 0.05 AND Cox is valid). No Bonferroni correction applied."
  tobit_coefficients:
    type: "object"
    description: "Full coefficient dictionary from Tobit model"
  cox_coefficients:
    type: "object"
    description: "Full coefficient dictionary from Cox model"
  fixed_epoch_results:
    type: "object"
    description: "P-values for interaction terms at fixed epochs (e.g., 100, 500)"
  generated_at:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of generation"
required:
  - tobit_interaction_p_value
  - cox_interaction_p_value
  - cox_ph_valid
  - is_significant
  - generated_at
additionalProperties: false