$schema: http://json-schema.org/draft-07/schema#
title: TrainingRun
description: >-
  Schema for a single training run result (Cross-Entropy or InfoNCE).
  Captures convergence metrics, trajectory, and metadata as required by
  Constitution Principle VI and US-2.
type: object
required:
  - run_id
  - graph_id
  - loss_type
  - beta
  - node_count
  - epochs_trained
  - convergence_status
  - steps_to_convergence
  - final_accuracy
  - max_loss
  - trajectory
properties:
  run_id:
    type: string
    description: Unique identifier for this training run.
  graph_id:
    type: string
    description: ID of the source graph from data/raw/graphs.jsonl.
  loss_type:
    type: string
    enum:
      - ce
      - infonce
    description: The loss function used for training.
  beta:
    type: number
    description: The rewiring probability (beta) of the source Watts-Strogatz graph.
  node_count:
    type: integer
    minimum: 1
    description: Number of nodes in the source graph.
  epochs_trained:
    type: integer
    minimum: 1
    description: Total number of epochs the model was trained for.
  convergence_status:
    type: string
    enum:
      - converged
      - censored
    description: >-
      Status indicating if the model reached the convergence threshold
      (accuracy >= CONVERGENCE_THRESHOLD) or hit MAX_EPOCHS.
  steps_to_convergence:
    type: integer
    minimum: 0
    description: >-
      Number of epochs until convergence. If censored, this is equal to
      epochs_trained (or MAX_EPOCHS).
  final_accuracy:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: Accuracy measured at the final epoch (via linear probe for InfoNCE).
  max_loss:
    type: number
    description: Maximum loss value observed during training.
  trajectory:
    type: array
    description: >-
      Full per-epoch trajectory of loss and accuracy. Required by
      Constitution Principle VI and US-2 to allow detailed analysis of
      convergence behavior.
    items:
      type: object
      required:
        - epoch
        - loss
        - accuracy
      properties:
        epoch:
          type: integer
          minimum: 1
          description: Epoch number (1-indexed).
        loss:
          type: number
          description: Loss value at this epoch.
        accuracy:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Accuracy at this epoch.
additionalProperties: false