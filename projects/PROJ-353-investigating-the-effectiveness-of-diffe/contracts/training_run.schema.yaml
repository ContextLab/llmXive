$schema: "http://json-schema.org/draft-07/schema#"
title: "TrainingRun"
description: |
  Schema for a single training run result.
  Captures convergence steps, censorship status, and the full per-epoch trajectory.
  Required by Constitution Principle VI and US-2.
type: object
required:
  - run_id
  - graph_id
  - loss_type
  - beta
  - epochs_trained
  - convergence_status
  - steps_to_convergence
  - final_accuracy
  - trajectory
properties:
  run_id:
    type: string
    description: "Unique identifier for this training run (e.g., UUID or hash)."
  graph_id:
    type: string
    description: "Reference to the source graph ID from data/raw/graphs.jsonl."
  loss_type:
    type: string
    enum:
      - "cross_entropy"
      - "infonce"
    description: "The loss function used for this training run."
  beta:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "The rewiring probability beta of the Watts-Strogatz graph."
  epochs_trained:
    type: integer
    minimum: 1
    description: "Total number of epochs the model was trained for."
  convergence_status:
    type: string
    enum:
      - "converged"
      - "censored"
    description: |
      Status indicating if the model reached the convergence threshold.
      'converged': Accuracy >= CONVERGENCE_THRESHOLD (0.90) was reached.
      'censored': Max epochs reached without convergence.
  steps_to_convergence:
    type: integer
    minimum: 0
    description: |
      The epoch number at which convergence was first achieved.
      If 'censored', this value equals 'epochs_trained' (max epochs).
  final_accuracy:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Accuracy measured at the final epoch (or at convergence if earlier)."
  trajectory:
    type: array
    minItems: 1
    description: |
      Full per-epoch recording of training metrics.
      Required by Constitution Principle VI and US-2 for survival analysis.
      Each entry corresponds to one epoch of training.
    items:
      type: object
      required:
        - epoch
        - loss
        - accuracy
      properties:
        epoch:
          type: integer
          minimum: 1
          description: "1-based epoch index."
        loss:
          type: number
          description: "Loss value recorded at this epoch."
        accuracy:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: "Accuracy value recorded at this epoch."
  metadata:
    type: object
    description: "Optional additional metadata (e.g., seed, hardware info)."
    additionalProperties: true
additionalProperties: false