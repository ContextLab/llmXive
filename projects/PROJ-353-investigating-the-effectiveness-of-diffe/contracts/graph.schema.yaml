$schema: http://json-schema.org/draft-07/schema#
title: SyntheticGraph
description: >
  JSON Schema for a generated Watts-Strogatz graph used in the
  "Investigating Loss Functions on Small-World Graphs" study.
  Defines the structure for entries in data/raw/graphs.jsonl.
type: object
required:
  - id
  - beta
  - seed
  - node_count
  - clustering_coeff
  - edge_list
  - labels
  - connected
properties:
  id:
    type: string
    description: Unique identifier for the graph instance.
    pattern: "^graph_[0-9a-f]{8}$"
  beta:
    type: number
    description: Rewiring probability parameter (0.0 to 1.0).
    minimum: 0.0
    maximum: 1.0
  seed:
    type: integer
    description: Random seed used for graph generation.
  node_count:
    type: integer
    description: Total number of nodes in the graph (N).
    minimum: 1
  clustering_coeff:
    type: number
    description: Global clustering coefficient of the generated graph.
    minimum: 0.0
    maximum: 1.0
  edge_list:
    type: array
    description: List of edges as [source, target] pairs.
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: integer
        minimum: 0
    uniqueItems: true
  labels:
    type: array
    description: Community labels derived from the initial ring lattice.
    items:
      type: integer
    minItems: 1
  connected:
    type: boolean
    description: Flag indicating if the graph is fully connected.
    const: true
  metadata:
    type: object
    description: Optional additional metadata.
    additionalProperties: true
additionalProperties: false
examples:
  - id: "graph_00000001"
    beta: 0.0
    seed: 42
    node_count: 100
    clustering_coeff: 0.523
    edge_list:
      - [0, 1]
      - [1, 2]
      - [2, 0]
    labels:
      - 0
      - 0
      - 0
    connected: true