$schema: http://json-schema.org/draft-07/schema#
title: SyntheticGraph
description: >
  JSON Schema Draft 7 for the SyntheticGraph entity used in the
  Watts-Strogatz graph generation pipeline. Defines the structure for
  graph metadata, topology, and community labels.
type: object
required:
  - id
  - beta
  - seed
  - node_count
  - edge_list
  - labels
  - clustering_coeff
  - is_connected
properties:
  id:
    type: string
    description: Unique identifier for the graph instance.
    pattern: "^graph_\\d+$"
  beta:
    type: number
    description: Rewiring probability parameter for Watts-Strogatz model.
    minimum: 0.0
    maximum: 1.0
  seed:
    type: integer
    description: Random seed used for generation reproducibility.
    minimum: 0
  node_count:
    type: integer
    description: Total number of nodes in the graph.
    minimum: 2
  edge_list:
    type: array
    description: List of edges represented as [source, target] pairs.
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: integer
        minimum: 0
    uniqueItems: true
  labels:
    type: array
    description: Community labels derived from the initial ring lattice.
    items:
      type: integer
      minimum: 0
    minItems: 1
  clustering_coeff:
    type: number
    description: Global transitivity (clustering coefficient) of the graph.
    minimum: 0.0
    maximum: 1.0
  is_connected:
    type: boolean
    description: Indicates if the graph is a single connected component.
  generation_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the graph was generated.
  checksum:
    type: string
    description: SHA-256 checksum of the serialized graph data.
    pattern: "^[a-f0-9]{64}$"
additionalProperties: false