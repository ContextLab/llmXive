$schema: "http://json-schema.org/draft-07/schema#"
title: SyntheticGraph
description: >
  Schema for a single generated Watts-Strogatz graph with topology annotations.
  Corresponds to the SyntheticGraph entity in data-model.md (FR-001).
type: object
required:
  - graph_id
  - beta
  - seed
  - node_count
  - clustering_coeff
  - edge_list
  - labels
properties:
  graph_id:
    type: string
    description: Unique identifier for the graph instance.
    pattern: "^graph_[0-9a-f]{8}$"
  beta:
    type: number
    description: Rewiring probability parameter for Watts-Strogatz model.
    minimum: 0.0
    maximum: 1.0
  seed:
    type: integer
    description: Random seed used for reproducibility of this specific graph.
    minimum: 0
  node_count:
    type: integer
    description: Total number of nodes in the graph. Fixed at 110 per spec.
    const: 110
  clustering_coeff:
    type: number
    description: Measured global clustering coefficient of the generated graph.
    minimum: 0.0
    maximum: 1.0
  edge_list:
    type: array
    description: List of edges represented as pairs of node indices.
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: integer
        minimum: 0
        maximum: 109
  labels:
    type: array
    description: Community labels derived from the initial lattice structure before rewiring.
    items:
      type: integer
      minimum: 0
    minItems: 110
    maxItems: 110
  metadata:
    type: object
    description: Optional additional metadata.
    properties:
      generated_at:
        type: string
        format: date-time
      generator_version:
        type: string
additionalProperties: false
examples:
  - graph_id: "graph_a1b2c3d4"
    beta: 0.1
    seed: 42
    node_count: 110
    clustering_coeff: 0.452
    edge_list:
      - [0, 1]
      - [1, 2]
      - [0, 2]
    labels:
      - 0
      - 0
      - 1
      - 1
      - 2
      - 2
      - 3
      - 3