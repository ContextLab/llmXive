# Dataset Schema for Pollinator Network Prediction
name: pollinator_feature_matrix
version: "1.0"
description: "Feature matrix for plant-pollinator interaction prediction"

columns:
  - name: plant_species
    type: string
    required: true
  - name: pollinator_species
    type: string
    required: true
  - name: floral_trait_1
    type: float
    required: false
  - name: floral_trait_2
    type: float
    required: false
  - name: floral_trait_3
    type: float
    required: false
  - name: sampling_effort
    type: float
    required: true
  - name: link_label
    type: integer
    required: true
    description: "1 for observed interaction, 0 for negative sample"
    
constraints:
  - rule: "link_label must be 0 or 1"
    columns: [link_label]
  - rule: "No missing plant or pollinator species"
    columns: [plant_species, pollinator_species]
    
metadata:
  source: "Web of Life"
  processed_date: "auto-generated"
