# Output Schema for Model Metrics
name: training_metrics
version: "1.0"
description: "Metrics from model training and validation"

required_fields:
  - auc_mean
  - auc_std
  - precision_mean
  - recall_mean
  - trait_importance_ranking
  
field_types:
  auc_mean: float
  auc_std: float
  precision_mean: float
  recall_mean: float
  trait_importance_ranking: list
  loeo_auc: float
  trait_gap: float
