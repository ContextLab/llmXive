[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predicting-insect-pollinator-networks"
version = "0.1.0"
description = "Predicting Insect Pollinator Networks from Floral Trait Data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn",
    "pandas",
    "numpy",
    "networkx",
    "requests",
    "tqdm",
    "pyyaml",
    "datasets",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["code"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["config", "ingestion", "preprocessing", "main", "validation", "visualization", "reporting", "model_training", "utils", "setup_dirs", "validate_output"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["numpy.typing.mypy_plugin"]

[[tool.mypy.overrides]]
module = "utils.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
ignore_errors = true

[[tool.mypy.overrides]]
module = "config"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ingestion"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "preprocessing"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "main"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "setup_dirs"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "validate_output"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "datasets"
ignore_missing_imports = true