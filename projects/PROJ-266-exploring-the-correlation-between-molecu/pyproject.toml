[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | \.egg-info
    | data
    | tests
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["data", "utils", "setup_linting", "setup_project_structure"]