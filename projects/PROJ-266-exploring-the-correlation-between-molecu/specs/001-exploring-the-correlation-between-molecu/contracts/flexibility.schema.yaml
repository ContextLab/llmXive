$schema: "http://json-schema.org/draft-07/schema#"
title: "Flexibility Summary Record"
type: object
additionalProperties: false
required:
  - smiles
  - dihedral_variance
  - size_normalized_flexibility
properties:
  smiles:
    type: string
    description: "Canonical SMILES."
  dihedral_variance:
    type: number
    description: "Dihedral variance (rad²)."
  size_normalized_flexibility:
    type: number
    description: "Flexibility normalized by molecular size."
