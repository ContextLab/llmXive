$schema: "http://json-schema.org/draft-07/schema#"
title: Flexibility Summary Record
description: >
  Additional contract summarising flexibility metrics that may be used for
  downstream reporting or aggregation.
type: object
required:
  - smiles
  - dihedral_variance
  - size_normalized_flexibility
properties:
  smiles:
    type: string
  dihedral_variance:
    type: number
  size_normalized_flexibility:
    type: number
    description: dihedral_variance divided by rotatable bond count.
  notes:
    type: string
    description: Optional free‑form notes.
