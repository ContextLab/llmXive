$schema: "http://json-schema.org/draft-07/schema#"
title: "Flexibility Descriptors Schema"
type: object
properties:
  SMILES:
    type: string
    description: "Canonical SMILES string"
  dihedral_variance:
    type: number
    description: "Variance of dihedral angles across conformer ensemble (rad²)"
  bond_variance:
    type: number
    description: "Variance of bond lengths (diagnostic only)"
  angle_variance:
    type: number
    description: "Variance of bond angles (diagnostic only)"
  ensemble_size:
    type: integer
    description: "Number of conformers generated (adaptive, up to 100)"
  energy_window:
    type: number
    description: "Energy window in kcal/mol (fixed at 10)"
  converged:
    type: boolean
    description: "True if variance stability criterion met"
required:
  - SMILES
  - dihedral_variance
  - bond_variance
  - angle_variance
  - ensemble_size
  - energy_window
  - converged
additionalProperties: false