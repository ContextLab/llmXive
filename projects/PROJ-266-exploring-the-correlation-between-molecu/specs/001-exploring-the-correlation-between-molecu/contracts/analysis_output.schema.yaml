$schema: http://json-schema.org/draft-07/schema#
title: Analysis Output Schema
description: >
  Schema for the output of the molecular flexibility analysis pipeline.
  Includes computed variance metrics, outlier flags, and correlation results.
  Used by T025 (contract tests) and T015 (analysis).
type: object
required:
  - smiles
  - bond_variance
  - angle_variance
  - dihedral_variance
  - is_outlier
  - logPapp
  - confounders
properties:
  smiles:
    type: string
    description: Canonical SMILES string of the molecule.
  bond_variance:
    type: number
    description: Variance of bond lengths across the conformer ensemble (rad² or Å²).
    minimum: 0.0
  angle_variance:
    type: number
    description: Variance of bond angles across the conformer ensemble (rad²).
    minimum: 0.0
  dihedral_variance:
    type: number
    description: Variance of dihedral angles across the conformer ensemble (rad²).
    minimum: 0.0
  is_outlier:
    type: boolean
    description: Flag indicating if the molecule is an outlier based on IQR method (T014b).
  logPapp:
    type: number
    description: Apparent permeability coefficient (log Papp) from the processed dataset.
  confounders:
    type: object
    description: Dictionary of physicochemical confounders.
    required:
      - logP
      - mw
      - psa
    properties:
      logP:
        type: number
        description: Partition coefficient (XLogP).
      mw:
        type: number
        description: Molecular weight (g/mol).
      psa:
        type: number
        description: Polar Surface Area (Å²).
  correlation_results:
    type: ["object", "null"]
    description: Optional dictionary containing correlation statistics (pearson, spearman, p-values).
    properties:
      pearson_bond:
        type: number
      pearson_angle:
        type: number
      pearson_dihedral:
        type: number
      spearman_bond:
        type: number
      spearman_angle:
        type: number
      spearman_dihedral:
        type: number
      p_value_bond:
        type: number
      p_value_angle:
        type: number
      p_value_dihedral:
        type: number
additionalProperties: true