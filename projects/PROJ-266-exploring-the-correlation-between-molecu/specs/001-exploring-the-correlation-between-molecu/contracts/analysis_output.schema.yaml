$schema: http://json-schema.org/draft-07/schema#
title: Analysis Output Schema
description: >
  Schema for the output of the molecular flexibility analysis pipeline.
  Includes computed variance metrics, outlier flags, and correlation results.
  Note: bond/angle variances are excluded from the final model.
type: object
required:
  - smiles
  - dihedral_variance
  - is_outlier
  - logPapp
  - confounders
properties:
  smiles:
    type: string
    description: Canonical SMILES string of the molecule.
  dihedral_variance:
    type: number
    description: Variance of dihedral angles across the conformer ensemble (rad²).
    minimum: 0.0
  bond_variance:
    type: number
    description: Variance of bond lengths (diagnostic only, not used in model).
    minimum: 0.0
  angle_variance:
    type: number
    description: Variance of bond angles (diagnostic only, not used in model).
    minimum: 0.0
  is_outlier:
    type: boolean
    description: Flag indicating if the molecule is an outlier based on IQR method.
  logPapp:
    type: number
    description: Apparent permeability coefficient (log Papp) from the processed dataset.
  confounders:
    type: object
    description: Dictionary of physicochemical confounders.
    required:
      - logP
      - mw
      - psa
      - size_normalized_flexibility
    properties:
      logP:
        type: number
        description: Partition coefficient (XLogP).
      mw:
        type: number
        description: Molecular weight (g/mol).
      psa:
        type: number
        description: Polar Surface Area (Å²).
      size_normalized_flexibility:
        type: number
        description: Dihedral variance per rotatable bond.
  correlation_results:
    type: ["object", "null"]
    description: Optional dictionary containing correlation statistics (pearson, spearman, p-values).
    properties:
      pearson_dihedral:
        type: number
      spearman_dihedral:
        type: number
      p_value_dihedral:
        type: number
additionalProperties: true