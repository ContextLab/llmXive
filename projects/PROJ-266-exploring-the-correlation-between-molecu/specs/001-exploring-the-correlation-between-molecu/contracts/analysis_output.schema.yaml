$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Output – Multivariate Model Performance"
type: object
additionalProperties: false
required:
  - model_performance
properties:
  model_performance:
    type: object
    additionalProperties: false
    required:
      - mean_r2
      - std_r2
      - rmse
      - mae
      - coefficients
    properties:
      mean_r2:
        type: number
        description: "Mean R² across cross‑validation folds."
      std_r2:
        type: number
        description: "Standard deviation of R² across folds."
      rmse:
        type: number
        description: "Root‑Mean‑Square Error."
      mae:
        type: number
        description: "Mean Absolute Error."
      coefficients:
        type: object
        description: "Regression coefficients keyed by predictor name."
        additionalProperties:
          type: number
