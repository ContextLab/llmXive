$schema: "http://json-schema.org/draft-07/schema#"
title: Analysis Output (Model Results)
description: >
  Schema for the JSON output produced by the multivariate regression analysis.
  Covers FR‑006, FR‑007, FR‑008.
type: object
required:
  - model_performance
properties:
  model_performance:
    type: object
    required:
      - mean_r2
      - std_r2
      - rmse
      - mae
      - coefficients
    properties:
      mean_r2:
        type: number
        description: Mean R² across cross‑validation folds.
      std_r2:
        type: number
        description: Standard deviation of R² across folds.
      rmse:
        type: number
        description: Root‑mean‑square error (average across folds).
      mae:
        type: number
        description: Mean absolute error (average across folds).
      coefficients:
        type: object
        description: Mapping from predictor name to coefficient value.
        additionalProperties:
          type: number
  diagnostics:
    type: object
    description: Optional diagnostic information.
    additionalProperties: true
