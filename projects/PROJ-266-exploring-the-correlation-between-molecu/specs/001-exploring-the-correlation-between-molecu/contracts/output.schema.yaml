$schema: "http://json-schema.org/draft-07/schema#"
title: General Output Artifact Contract
description: >
  Generic contract used for validating miscellaneous output artifacts such as
  PNG figures, TXT summaries, etc.  It ensures the artifact exists and records
  basic metadata.
type: object
required:
  - path
  - type
  - checksum
properties:
  path:
    type: string
    description: Relative path to the artifact within the project.
  type:
    type: string
    description: MIME‑type or a short descriptor (e.g., "png", "txt", "json").
  checksum:
    type: string
    pattern: "^[a-f0-9]{64}$"
    description: SHA‑256 checksum of the file.
  created_at:
    type: string
    format: date-time
    description: ISO‑8601 timestamp when the artifact was created.
