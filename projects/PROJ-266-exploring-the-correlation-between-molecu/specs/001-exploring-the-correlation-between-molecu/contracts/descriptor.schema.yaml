$schema: "http://json-schema.org/draft-07/schema#"
title: Flexibility Descriptor Record
description: >
  Schema for a descriptor record produced by the descriptor calculation step.
  Matches FR‑004.
type: object
required:
  - smiles
  - dihedral_variance
  - bond_variance
  - angle_variance
  - conformer_count
  - converged
properties:
  smiles:
    type: string
    description: SMILES string of the molecule.
  dihedral_variance:
    type: number
    description: Variance of dihedral angles (rad²).
  bond_variance:
    type: number
    description: Variance of bond lengths (Å²).
  angle_variance:
    type: number
    description: Variance of bond angles (rad²).
  conformer_count:
    type: integer
    minimum: 0
    description: Number of conformers generated for this molecule.
  converged:
    type: boolean
    description: Whether the descriptor calculation converged.
  additional_metrics:
    type: object
    description: Optional extra metrics.
    additionalProperties: true
