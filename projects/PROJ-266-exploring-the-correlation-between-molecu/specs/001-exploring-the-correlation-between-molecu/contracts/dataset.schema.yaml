$schema: http://json-schema.org/draft-07/schema#
title: Caco-2 Permeability Dataset Schema
description: >
  JSON Schema for the Caco-2 permeability dataset retrieved from ChEMBL.
  This schema defines the structure for both raw and processed data files,
  ensuring consistency across the pipeline.
type: object
required:
  - smiles
  - logPapp
  - mw
  - psa
  - assay_id
  - protocol_metadata
properties:
  smiles:
    type: string
    description: >
      SMILES string representing the molecular structure.
      Must be a valid canonical SMILES string.
    minLength: 1
  logPapp:
    type: number
    description: >
      Apparent permeability coefficient (Papp) in cm/s, typically
      expressed as log10(Papp).
    minimum: -10.0
    maximum: -4.0
  mw:
    type: number
    description: >
      Molecular weight of the compound in Daltons (g/mol).
    minimum: 0.0
  psa:
    type: number
    description: >
      Polar Surface Area (PSA) in Angstroms squared (Å²).
    minimum: 0.0
  assay_id:
    type: string
    description: >
      Unique identifier for the assay from ChEMBL (e.g., CHEMBL12345).
    pattern: '^CHEMBL[0-9]+$'
  protocol_metadata:
    type: object
    description: >
      Metadata describing the experimental protocol used for the assay.
      This object captures the heterogeneity of the data sources.
    required:
      - standard_type
      - heterogeneity_score
    properties:
      standard_type:
        type: string
        description: >
          The type of standard measurement used (e.g., MEASUREMENT,
          CALCULATION, ESTIMATE). Expected values: 'MEASUREMENT'.
        enum:
          - MEASUREMENT
          - CALCULATION
          - ESTIMATE
      heterogeneity_score:
        type: number
        description: >
          A numeric score indicating the level of heterogeneity or
          uncertainty in the protocol. Lower scores indicate higher
          consistency with standard protocols.
        minimum: 0.0
        maximum: 1.0
additionalProperties: false