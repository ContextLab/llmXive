$schema: http://json-schema.org/draft-07/schema#
title: Caco-2 Permeability Dataset Schema
description: |
  JSON Schema for the Caco-2 permeability dataset used in the study of
  molecular flexibility and drug transport across cell membranes.
  This schema validates the structure of both raw and processed data files
  generated during the retrieval and preprocessing phases.
type: object
required:
  - smiles
  - logPapp
  - mw
  - psa
  - assay_id
properties:
  smiles:
    type: string
    description: >
      Canonical SMILES string representing the molecular structure.
      Must be a valid non-empty string representing a chemical structure.
    minLength: 1
  logPapp:
    type: number
    description: >
      Apparent permeability coefficient (log Papp) measured in cm/s.
      This is the primary dependent variable for the study.
      Represents the logarithm of the permeability coefficient.
  mw:
    type: number
    description: >
      Molecular weight of the compound in g/mol.
      Used as a confounder in multivariate analysis.
  psa:
    type: number
    description: >
      Polar Surface Area (PSA) in Å².
      Used as a confounder in multivariate analysis.
  assay_id:
    type: string
    description: >
      Unique identifier for the assay from the source database (e.g., ChEMBL).
      Used for traceability and audit purposes.
additionalProperties: false