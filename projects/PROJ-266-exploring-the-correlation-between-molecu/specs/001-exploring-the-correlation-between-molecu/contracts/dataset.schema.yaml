$schema: http://json-schema.org/draft-07/schema#
title: Caco-2 Permeability Dataset Schema
description: |
  Schema for the Caco-2 dataset used in the molecular flexibility permeability study.
  Validated against requirements from T007 and FR-010.
type: object
required:
  - smiles
  - logPapp
  - mw
  - psa
  - assay_id
  - protocol_metadata
properties:
  smiles:
    type: string
    description: Canonical SMILES string of the molecule.
    minLength: 1
  logPapp:
    type: number
    description: Log of the apparent permeability coefficient (cm/s).
  mw:
    type: number
    description: Molecular weight in g/mol.
  psa:
    type: number
    description: Polar Surface Area in Å².
  assay_id:
    type: string
    description: Unique identifier for the assay from ChEMBL.
  protocol_metadata:
    type: object
    description: Metadata regarding the assay protocol and conditions.
    required:
      - standard_type
      - heterogeneity_score
    properties:
      standard_type:
        type: string
        description: The type of standard used (e.g., MEASUREMENT, ESTIMATE).
      heterogeneity_score:
        type: number
        description: A normalized score indicating protocol heterogeneity (0.0 to 1.0).
      lab_id:
        type: string
        description: Identifier for the laboratory performing the assay.
      temperature:
        type: number
        description: Temperature in Kelvin.
      passage:
        type: integer
        description: Cell passage number.
