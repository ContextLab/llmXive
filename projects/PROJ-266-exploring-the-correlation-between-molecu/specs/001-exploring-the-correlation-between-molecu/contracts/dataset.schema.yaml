$schema: "http://json-schema.org/draft-07/schema#"
title: "Caco‑2 Permeability Dataset Record"
type: object
additionalProperties: false
required:
  - smiles
  - logPapp
  - protocol_metadata
properties:
  smiles:
    type: string
    description: "Canonical SMILES representation of the molecule."
  logPapp:
    type: number
    description: "Caco‑2 apparent permeability (logPapp)."
  protocol_metadata:
    type: object
    description: "Metadata describing the assay protocol."
    additionalProperties: false
    required:
      - standard_type
    properties:
      standard_type:
        type: string
        enum:
          - MEASUREMENT
