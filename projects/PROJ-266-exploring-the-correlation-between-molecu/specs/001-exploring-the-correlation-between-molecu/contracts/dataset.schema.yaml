$schema: "http://json-schema.org/draft-07/schema#"
title: "Caco-2 Permeability Dataset Schema"
description: "Schema for the raw and cleaned Caco-2 permeability dataset from ChEMBL."
type: "object"
properties:
  smi:
    type: "string"
    description: "Canonical SMILES string of the molecule."
  logPapp:
    type: "number"
    description: "Caco-2 permeability value (logPapp)."
  mw:
    type: "number"
    description: "Molecular weight (g/mol)."
  psa:
    type: "number"
    description: "Polar surface area (Å²)."
  lab_id:
    type: "string"
    description: "Identifier for the laboratory that performed the assay."
  temperature:
    type: "number"
    description: "Assay temperature in Celsius."
  passage_number:
    type: "integer"
    description: "Cell passage number used in the assay."
  num_rotatable_bonds:
    type: "integer"
    description: "Number of rotatable bonds (computed)."
required:
  - "smi"
  - "logPapp"
additionalProperties: false