$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Result Record"
type: object
additionalProperties: false
required:
  - descriptor
  - pearson_r
  - pearson_p
  - spearman_r
  - spearman_p
properties:
  descriptor:
    type: string
    description: "Name of the flexibility descriptor."
  pearson_r:
    type: number
    description: "Pearson correlation coefficient."
  pearson_p:
    type: number
    description: "Two‑tailed p‑value for Pearson correlation."
  spearman_r:
    type: number
    description: "Spearman rank correlation coefficient."
  spearman_p:
    type: number
    description: "Two‑tailed p‑value for Spearman correlation."
