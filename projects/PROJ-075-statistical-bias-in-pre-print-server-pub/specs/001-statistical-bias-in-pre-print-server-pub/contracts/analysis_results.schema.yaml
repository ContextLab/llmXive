$schema: http://json-schema.org/draft-07/schema#
title: AnalysisResult Schema
description: Schema for the analysis results JSON files.
type: object
properties:
  result_id:
    type: string
    description: "Unique identifier for the result"
  test_type:
    type: string
    enum:
      - p_curve
      - paired_ttest
      - wilcoxon
      - sensitivity
    description: "Type of statistical test"
  threshold:
    type: number
    nullable: true
    description: "Significance threshold (if applicable)"
  statistic_value:
    type: number
    description: "Test statistic (e.g., t-value, p-curve power)"
  p_value:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "P-value of the test"
  ci_lower:
    type: number
    nullable: true
    description: "Lower bound of confidence interval"
  ci_upper:
    type: number
    nullable: true
    description: "Upper bound of confidence interval"
  interpretation:
    type: string
    description: "Human-readable interpretation"
  threshold_context:
    type: string
    nullable: true
    description: "Context for sensitivity analysis"
required:
  - result_id
  - test_type
  - statistic_value
  - p_value
  - interpretation
additionalProperties: false