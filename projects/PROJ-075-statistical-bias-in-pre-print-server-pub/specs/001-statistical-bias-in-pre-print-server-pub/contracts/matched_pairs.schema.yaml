$schema: http://json-schema.org/draft-07/schema#
title: MatchedPaperPair Schema
description: Schema for the matched_pairs.csv file containing pre-print/journal pairs.
type: object
properties:
  pair_id:
    type: string
    description: "Unique identifier for the pair (e.g., pair_0001)"
  preprint_id:
    type: string
    description: "Pre-print ID (arXiv/bioRxiv)"
  journal_doi:
    type: string
    description: "Journal DOI"
  title:
    type: string
    description: "Paper title"
  authors:
    type: array
    items:
      type: string
    description: "List of author names"
  preprint_date:
    type: string
    format: date
    description: "Pre-print publication date"
  journal_date:
    type: string
    format: date
    description: "Journal publication date"
  field:
    type: string
    description: "Research field (e.g., Quantitative Biology)"
  match_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Fuzzy matching score"
  exclusion_reason:
    type: string
    nullable: true
    description: "Reason for exclusion (if any)"
required:
  - pair_id
  - preprint_id
  - journal_doi
  - title
  - authors
  - preprint_date
  - journal_date
  - field
  - match_score
additionalProperties: false