# Preprocessing Configuration for Gut Microbiome - EEG Alpha Power Analysis
# Generated by T008: Base Configuration Loader Implementation

# EEG Preprocessing Settings
eeg:
  # Filter bands (Hz)
  filter_bands:
    low_cutoff: 0.5
    high_cutoff: 45.0
    
  # ICA settings
  ica:
    method: "fastica"
    n_components: 20
    random_state: 42
    max_iter: 500
    tol: 1.0e-4
    
  # Epoching configuration
  epoch:
    duration_minutes: 2
    alpha_band:
      low: 8.0
      high: 13.0
    valid_epoch_threshold: 0.80  # 80% valid epochs required
    
# Microbiome Preprocessing Settings
microbiome:
  # Pseudocount for CLR transformation and zero handling
  pseudocount: 0.5
  
  # QIIME2 settings
  qiime2:
    version: "2023.5"
    genus_level: true
    
# Matching and Cohort Settings
matching:
  # Virtual Cohort Matching parameters
  nearest_neighbor:
    n_neighbors: 5
    metric: "euclidean"
    
  # Fallback propensity score settings
  propensity_score:
    model_type: "logistic"
    caliper: 0.2
    
  # Decision thresholds
  min_matched_pairs: 10
  
# Logging and Output Settings
logging:
  level: "INFO"
  output_path: "artifacts/preprocess.yaml"
  
# Random seed for reproducibility
random_seed: 42
