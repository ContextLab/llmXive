$schema: "http://json-schema.org/draft-07/schema#"
title: "Stratum Aggregation Output Schema"
description: "Schema for the output of the ecological aggregation process."
type: object
required:
  - stratum_id
  - stratum_mean_alpha_power
  - stratum_taxa_means
  - valid_strata_count
properties:
  stratum_id:
    type: string
    description: "Unique identifier for the demographic stratum"
  stratum_mean_alpha_power:
    type: number
    description: "Mean alpha power across all subjects in this stratum"
  stratum_taxa_means:
    type: object
    description: "Dictionary of mean taxon abundances for this stratum"
    additionalProperties:
      type: number
  valid_strata_count:
    type: integer
    description: "Total count of valid strata identified in the dataset"
    minimum: 0
additionalProperties: false
