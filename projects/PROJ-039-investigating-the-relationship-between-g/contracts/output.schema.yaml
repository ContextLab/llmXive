$schema: "http://json-schema.org/draft-07/schema#"
title: "Ecological Aggregation Output Schema"
description: "Schema for the stratum-level aggregation report."
type: object
required:
  - stratum_id
  - stratum_mean_alpha_power
  - stratum_taxa_means
  - valid_strata_count
properties:
  stratum_id:
    type: string
    description: "Unique identifier for the demographic stratum"
  stratum_mean_alpha_power:
    type: number
    description: "Mean alpha power for subjects in this stratum"
  stratum_taxa_means:
    type: object
    description: "Dictionary mapping genus names to mean relative abundances for this stratum"
    additionalProperties:
      type: number
  valid_strata_count:
    type: integer
    minimum: 0
    description: "Total number of valid strata identified (used for exit logic)"
