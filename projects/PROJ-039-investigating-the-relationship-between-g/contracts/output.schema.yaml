$schema: "http://json-schema.org/draft-07/schema#"
title: "Stratum Aggregation Output Schema"
description: "Schema for the output of ecological aggregation (stratum-level means)."
type: object
required:
  - stratum_id
  - stratum_mean_alpha_power
  - stratum_taxa_means
  - valid_strata_count
properties:
  stratum_id:
    type: string
    description: "Canonical stratum identifier: Age{bin}_Sex{sex}_BMI{bin}_Diet{diet}"
  stratum_mean_alpha_power:
    type: number
    description: "Mean alpha power for subjects in this stratum."
  stratum_taxa_means:
    type: object
    description: "Mean relative abundances of taxa for this stratum."
    additionalProperties:
      type: number
  valid_strata_count:
    type: integer
    description: "Total number of valid strata (>=5 subjects in both cohorts) found in the dataset."
    minimum: 0
additionalProperties: false
