type: object
required:
  - stratum_id
  - stratum_mean_alpha_power
  - stratum_taxa_means
  - valid_strata_count
properties:
  stratum_id:
    type: string
    description: Unique identifier for the demographic stratum
  stratum_mean_alpha_power:
    type: number
    description: Mean alpha power across subjects in this stratum
  stratum_taxa_means:
    type: object
    additionalProperties:
      type: number
    description: Dictionary mapping taxon names to mean abundances in this stratum
  valid_strata_count:
    type: integer
    minimum: 0
    description: Total number of valid strata identified (>= 5 subjects each)
