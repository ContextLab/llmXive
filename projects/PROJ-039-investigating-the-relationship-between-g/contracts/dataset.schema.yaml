type: object
required:
  - subject_id
  - age
  - sex
  - bmi
  - diet
  - alpha_power
  - taxon_abundances
properties:
  subject_id:
    type: string
    description: Unique identifier for the subject
  age:
    type: integer
    minimum: 0
    description: Age in years
  sex:
    type: string
    enum: ["Male", "Female", "Other"]
    description: Biological sex
  bmi:
    type: number
    minimum: 0
    description: Body Mass Index
  diet:
    type: string
    description: Diet category (e.g., "Western", "Vegetarian", "Mediterranean")
  alpha_power:
    type: number
    minimum: 0
    description: Resting-state EEG alpha power (µV²)
  taxon_abundances:
    type: object
    additionalProperties:
      type: number
      minimum: 0
    description: Dictionary mapping taxon names to relative abundances
