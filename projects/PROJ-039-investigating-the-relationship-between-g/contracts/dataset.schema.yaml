$schema: "http://json-schema.org/draft-07/schema#"
title: "Gut Microbiome and EEG Dataset Schema"
description: "Schema for the combined microbiome and EEG dataset used in ecological aggregation."
type: object
required:
  - age
  - sex
  - bmi
  - diet
  - alpha_power
  - taxon_abundances
properties:
  age:
    type: integer
    description: "Age of the subject in years"
    minimum: 0
  sex:
    type: string
    description: "Biological sex of the subject"
    enum: ["M", "F", "Other"]
  bmi:
    type: number
    description: "Body Mass Index"
    minimum: 0.0
  diet:
    type: string
    description: "Dietary category"
    enum: ["Standard", "High-Fiber", "Ketogenic", "Vegan", "Other"]
  alpha_power:
    type: number
    description: "Resting-state EEG alpha power (8-12 Hz) in uV^2/Hz"
  taxon_abundances:
    type: object
    description: "Dictionary of taxon names to relative abundances (floats)"
    additionalProperties:
      type: number
      minimum: 0.0
additionalProperties: false
