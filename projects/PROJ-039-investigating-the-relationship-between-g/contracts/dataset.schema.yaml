$schema: "http://json-schema.org/draft-07/schema#"
title: "Gut Microbiome and EEG Dataset Schema"
description: "Schema for raw and processed subject-level data combining AGP microbiome and OpenNeuro EEG features."
type: object
required:
  - age
  - sex
  - bmi
  - alpha_power
  - taxon_abundances
properties:
  age:
    type: integer
    description: "Subject age in years."
    minimum: 0
    maximum: 120
  sex:
    type: string
    description: "Biological sex of the subject."
    enum: ["M", "F"]
  bmi:
    type: number
    description: "Body Mass Index."
    minimum: 0.0
  alpha_power:
    type: number
    description: "Resting-state EEG alpha power (µV^2/Hz) calculated via Welch's method."
    minimum: 0.0
  taxon_abundances:
    type: object
    description: "Relative abundances of genera (keys) as floats between 0.0 and 1.0."
    additionalProperties:
      type: number
      minimum: 0.0
      maximum: 1.0
  diet:
    type: ["string", "null"]
    description: "Self-reported diet category. Null values are allowed in the schema but must be treated as 'Unknown' in downstream aggregation logic."
    enum: ["Vegan", "Vegetarian", "Omnivore", "Other", "Unknown", null]
additionalProperties: false
