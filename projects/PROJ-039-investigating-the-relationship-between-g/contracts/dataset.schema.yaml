$schema: "http://json-schema.org/draft-07/schema#"
title: "Gut Microbiome and EEG Dataset Schema"
description: "Schema for the combined dataset containing microbiome abundances, EEG alpha power, and demographics."
type: object
required:
  - age
  - sex
  - bmi
  - alpha_power
  - taxon_abundances
properties:
  age:
    type: integer
    minimum: 0
    maximum: 120
    description: "Subject age in years"
  sex:
    type: string
    enum: ["M", "F"]
    description: "Biological sex of the subject"
  bmi:
    type: number
    minimum: 0.0
    description: "Body Mass Index"
  alpha_power:
    type: number
    minimum: 0.0
    description: "Resting-state EEG alpha power (log-transformed or raw, depending on preprocessing)"
  taxon_abundances:
    type: object
    description: "Dictionary mapping genus names to relative abundances (0.0 to 1.0)"
    additionalProperties:
      type: number
      minimum: 0.0
      maximum: 1.0
  diet:
    type: ["string", "null"]
    enum: ["Vegan", "Vegetarian", "Omnivore", "Other", null]
    description: "Dietary preference (optional, nullable)"
