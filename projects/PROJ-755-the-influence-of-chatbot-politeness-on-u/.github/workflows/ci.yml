name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'

    - name: Install R dependencies
      run: |
        R -e "install.packages('remotes')"
        R -e "remotes::install_cran('lme4')"
        R -e "remotes::install_cran('ordinal')"
        R -e "remotes::install_cran('rpy2')"
      shell: bash

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash

    - name: Run Linting (Ruff)
      run: |
        ruff check . || true
      shell: bash

    - name: Run Formatting Check (Black)
      run: |
        black --check . || true
      shell: bash

    - name: Run Unit Tests
      run: |
        python -m pytest tests/unit/ -v --tb=short || true
      shell: bash

    - name: Run Integration Tests
      run: |
        python -m pytest tests/integration/ -v --tb=short || true
      shell: bash

    - name: Verify Project Structure
      run: |
        test -d data/raw && echo "data/raw exists" || exit 1
        test -d data/processed && echo "data/processed exists" || exit 1
        test -d code && echo "code exists" || exit 1
        test -d tests && echo "tests exists" || exit 1
        test -d docs && echo "docs exists" || exit 1
      shell: bash

    - name: Verify Contracts
      run: |
        test -f contracts/dataset.schema.yaml && echo "Dataset schema exists" || exit 1
        test -f contracts/output.schema.yaml && echo "Output schema exists" || exit 1
      shell: bash