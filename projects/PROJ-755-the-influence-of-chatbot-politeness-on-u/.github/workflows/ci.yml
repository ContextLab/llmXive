name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Ensure test dependencies are installed if separate
        if [ -f requirements-test.txt ]; then
          pip install -r requirements-test.txt
        fi

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'

    - name: Install R dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
        R -e "install.packages('remotes')"
        R -e "remotes::install_cran('lme4')"
        R -e "remotes::install_cran('ordinal')"
        R -e "remotes::install_cran('devtools')"
        # Install any R packages listed in a DESCRIPTION file if present
        # if [ -f DESCRIPTION ]; then R -e "devtools::install_deps(dependencies=TRUE)"; fi

    - name: Run Linting (Ruff)
      run: |
        if command -v ruff &> /dev/null; then
          ruff check .
        else
          echo "Ruff not found, skipping linting check"
        fi

    - name: Run Formatting Check (Black)
      run: |
        if command -v black &> /dev/null; then
          black --check .
        else
          echo "Black not found, skipping formatting check"
        fi

    - name: Run Unit Tests
      run: |
        python -m pytest tests/unit -v

    - name: Run Contract Tests
      run: |
        python -m pytest tests/contract -v

    - name: Run Integration Tests
      run: |
        python -m pytest tests/integration -v

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          **/test-results.xml
          .pytest_cache/
