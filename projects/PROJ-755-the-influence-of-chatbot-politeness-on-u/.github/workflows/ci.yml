name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  setup-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r code/requirements.txt

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.0'

    - name: Install R system dependencies for lme4 and ordinal
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

    - name: Install R packages lme4 and ordinal
      run: |
        Rscript -e "install.packages('remotes')"
        Rscript -e "remotes::install_cran('lme4')"
        Rscript -e "remotes::install_cran('ordinal')"
        Rscript -e "if (!require('lme4')) stop('lme4 installation failed')"
        Rscript -e "if (!require('ordinal')) stop('ordinal installation failed')"

    - name: Verify R packages are available
      run: |
        Rscript -e "library(lme4); cat('lme4 loaded successfully\n')"
        Rscript -e "library(ordinal); cat('ordinal loaded successfully\n')"

    - name: Run basic sanity checks
      run: |
        python code/utils/setup_dirs.py
        python code/utils/schema_validator.py --help || true
        echo "CI Setup and R Environment Check Completed"