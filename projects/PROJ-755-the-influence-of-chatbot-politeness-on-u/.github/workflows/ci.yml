name: CI Pipeline - R and Python Dependencies

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "requirements.txt not found"
          exit 1
        fi

    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.2'
        use-public-rspm: true

    - name: Install R packages
      run: |
        R -e "install.packages('remotes')"
        R -e "remotes::install_cran(c('lme4', 'ordinal', 'testthat', 'knitr', 'rmarkdown'))"
      shell: bash

    - name: Verify R packages
      run: |
        R -e "library(lme4); library(ordinal); cat('R packages installed successfully\n')"

    - name: Run Python linting
      run: |
        if command -v ruff &> /dev/null; then
          ruff check .
        elif command -v flake8 &> /dev/null; then
          flake8 .
        else
          echo "No linter found, skipping..."
        fi

    - name: Run Python tests
      run: |
        if command -v pytest &> /dev/null; then
          pytest tests/ -v --tb=short
        else
          echo "pytest not installed, skipping tests..."
        fi

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          .pytest_cache/
          test-results/

    - name: Verify data directories exist
      run: |
        ls -la data/
        ls -la code/
        ls -la tests/

    - name: Display environment info
      run: |
        echo "Python version:"
        python --version
        echo "R version:"
        R --version | head -1