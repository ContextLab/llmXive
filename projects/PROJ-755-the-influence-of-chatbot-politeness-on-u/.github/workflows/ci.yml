name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  setup-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'

    - name: Install R packages (lme4, ordinal)
      run: |
        sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
        Rscript -e 'install.packages("remotes")'
        Rscript -e 'remotes::install_cran("lme4")'
        Rscript -e 'remotes::install_cran("ordinal")'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting (ruff)
      run: |
        ruff check .

    - name: Run formatting check (black)
      run: |
        black --check .

    - name: Run unit tests
      run: |
        pytest tests/unit -v

    - name: Run contract tests
      run: |
        pytest tests/contract -v

    - name: Run integration tests
      run: |
        pytest tests/integration -v
      if: always()
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          .pytest_cache/
          test-reports/
          junit-*.xml
