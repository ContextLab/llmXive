name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.0'

    - name: Install R packages (lme4, ordinal)
      run: |
        sudo apt-get update && sudo apt-get install -y libxml2-dev libcurl4-openssl-dev libssl-dev
        R -e "install.packages(c('lme4', 'ordinal', 'lattice', 'Matrix', 'nlme'), repos='https://cloud.r-project.org')"

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('code/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r code/requirements.txt

    - name: Install R packages for rpy2
      run: |
        pip install rpy2

    - name: Verify R packages are available
      run: |
        R -e "library(lme4); library(ordinal); cat('R packages loaded successfully\n')"

    - name: Run linting
      run: |
        pip install ruff black
        ruff check code/
        black --check code/

    - name: Run tests
      run: |
        pip install pytest
        pytest tests/ -v

    - name: Run basic pipeline validation
      run: |
        python code/setup_directories.py
        python code/01_download_and_score.py --sample-size 5  # Run on a tiny sample for CI validation