name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "requirements.txt not found"
          exit 1
        fi

    - name: Install R-base
      run: |
        sudo apt-get update
        sudo apt-get install -y r-base r-base-dev

    - name: Install R packages (lme4, ordinal)
      run: |
        Rscript -e "if (!requireNamespace('remotes', quietly = TRUE)) install.packages('remotes', repos='https://cloud.r-project.org')"
        Rscript -e "remotes::install_cran('lme4', dependencies=TRUE, repos='https://cloud.r-project.org')"
        Rscript -e "remotes::install_cran('ordinal', dependencies=TRUE, repos='https://cloud.r-project.org')"

    - name: Verify R packages installation
      run: |
        Rscript -e "library(lme4); library(ordinal); cat('R packages installed successfully\\n')"

    - name: Run linting (ruff)
      run: |
        if command -v ruff &> /dev/null; then
          ruff check code/
        else
          echo "ruff not found, skipping linting"
        fi

    - name: Run formatting check (black)
      run: |
        if command -v black &> /dev/null; then
          black --check code/
        else
          echo "black not found, skipping formatting check"
        fi

    - name: Run unit tests
      run: |
        if [ -d tests ]; then
          python -m pytest tests/unit -v --tb=short
        else
          echo "No unit tests found"
        fi

    - name: Run integration tests
      run: |
        if [ -d tests ]; then
          python -m pytest tests/integration -v --tb=short
        else
          echo "No integration tests found"
        fi