[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-politeness-study"
version = "0.1.0"
description = "Research on the influence of chatbot politeness on user-perceived quality"
requires-python = ">=3.11"
# Dependencies are managed in requirements.txt for this project structure
# but listed here for tooling compatibility if needed
dependencies = [
    "transformers",
    "datasets",
    "statsmodels",
    "pandas",
    "scikit-learn",
    "numpy",
    "pyyaml",
    "tqdm",
    "rpy2",
    "textstat",
    "evalue",
    "python-dotenv",
    "pyarrow",
    "parquet",
    "ruff",
    "black",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
  | state
  | docs
)/
'''

[tool.ruff]
# Inherit settings from .ruff.toml if present, but we can override here if needed
# This section is kept minimal as .ruff.toml handles the heavy lifting
line-length = 100
target-version = "py311"
