[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-politeness-study"
version = "0.1.0"
description = "Study on the influence of chatbot politeness on user-perceived quality"
requires-python = ">=3.9"
dependencies = [
    "transformers",
    "datasets",
    "statsmodels",
    "pandas",
    "scikit-learn",
    "numpy",
    "pyyaml",
    "tqdm",
    "rpy2",
    "textstat",
    "evalue",
    "liwc",
    "python-dotenv",
    "pyarrow",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
