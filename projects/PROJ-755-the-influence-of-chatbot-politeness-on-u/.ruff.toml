[lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "SIM", "UP"]
ignore = ["E501", "W505"]
fixable = ["ALL"]
exclude = [
    ".git",
    "__pycache__",
    "data",
    "state",
    "docs",
]
force-exclude = true

[lint.per-file-ignores]
"tests/*" = ["S101", "D100", "D101", "D102", "D103"]

[lint.isort]
known-first-party = ["utils"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"