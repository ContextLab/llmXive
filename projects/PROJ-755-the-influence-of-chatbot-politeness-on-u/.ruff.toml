# Explicit configuration for Ruff Linter
# This file can be used as an alternative to [tool.ruff] in pyproject.toml

line-length = 88
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "data",
    "__pycache__",
]

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by black)
]

[lint.per-file-ignores]
"tests/*" = ["S101"] # Allow asserts in tests

[format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
