$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Output Schema"
description: "Schema for the CLMM and robustness analysis results."
type: object
properties:
  term:
    type: string
    description: "Name of the predictor or model parameter."
  estimate:
    type: number
    description: "Coefficient estimate."
  std_error:
    type: number
    description: "Standard error of the estimates."
  z_value:
    type: number
    description: "Z-statistic."
  p_value:
    type: number
    description: "Raw p-value."
  p_adj:
    type: number
    description: "Adjusted p-value (Bonferroni or Benjamini-Hochberg)."
  confidence_interval_lower:
    type: number
    description: "Lower bound of the 95% confidence interval."
  confidence_interval_upper:
    type: number
    description: "Upper bound of the 95% confidence interval."
  model_type:
    type: string
    enum:
      - "CLMM"
      - "Robustness"
      - "Subgroup"
    description: "Type of model analysis performed."
  subgroup:
    type: string
    description: "Subgroup identifier (e.g., 'All', 'Age_<30', 'Gender_Female')."
  source_dataset:
    type: string
    description: "Source dataset name (e.g., 'All', 'HCI_P2')."
required:
  - term
  - estimate
  - std_error
  - z_value
  - p_value
  - p_adj
  - confidence_interval_lower
  - confidence_interval_upper
  - model_type
  - subgroup
  - source_dataset
additionalProperties: false