$schema: "http://json-schema.org/draft-07/schema#"
title: "CLMM Results Schema"
description: "Schema for the results of the Cumulative Link Mixed-Effects Model (CLMM)."
type: object
properties:
  term:
    type: string
    description: "Name of the predictor."
  estimate:
    type: number
    description: "Coefficient estimate."
  std_error:
    type: number
    description: "Standard error."
  p_value:
    type: number
    description: "Raw p-value."
  p_adj:
    type: number
    description: "Adjusted p-value."
  confidence_interval_lower:
    type: number
    description: "Lower bound of 95% CI."
  confidence_interval_upper:
    type: number
    description: "Upper bound of 95% CI."
required:
  - term
  - estimate
  - std_error
  - p_value
  - p_adj
  - confidence_interval_lower
  - confidence_interval_upper
additionalProperties: false
