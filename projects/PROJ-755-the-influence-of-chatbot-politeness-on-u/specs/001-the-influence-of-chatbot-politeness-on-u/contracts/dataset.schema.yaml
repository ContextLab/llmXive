$schema: "http://json-schema.org/draft-07/schema#"
title: "Processed Dialogue Dataset Schema"
description: "Schema for the processed dialogue dataset containing politeness scores and quality ratings."
type: object
properties:
  dialogue_id:
    type: string
    description: "Unique identifier for the dialogue."
  user_id:
    type: string
    description: "Identifier for the user who participated in the dialogue."
  quality_rating:
    type: integer
    minimum: 1
    maximum: 5
    description: "User-reported quality rating (1-5 Likert scale)."
  mean_politeness_score:
    type: number
    description: "Z-scored mean politeness score of chatbot utterances in the dialogue."
  conversation_length:
    type: integer
    description: "Total word count of the dialogue."
  user_sentiment:
    type: number
    description: "Average sentiment score of user utterances."
  utterance_count:
    type: integer
    description: "Number of utterances in the dialogue."
  is_complete:
    type: boolean
    description: "Flag indicating if the dialogue passed all filtering criteria."
  source_dataset:
    type: string
    description: "Source dataset name (e.g., 'HCI_P2')."
required:
  - dialogue_id
  - user_id
  - quality_rating
  - mean_politeness_score
  - conversation_length
  - utterance_count
  - is_complete
  - source_dataset
additionalProperties: false