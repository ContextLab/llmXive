$schema: "http://json-schema.org/draft-07/schema#"
title: "Politeness Analysis Dataset Schema"
description: "Schema for the processed dialogue dataset used in CLMM analysis."
type: object
properties:
  dialogue_id:
    type: string
    description: "Unique identifier for the dialogue."
  annotator_id:
    type: string
    description: "Anonymized annotator identifier."
  quality_rating:
    type: integer
    description: "User-reported quality rating (1-5)."
    minimum: 1
    maximum: 5
  mean_politeness_score:
    type: number
    description: "Z-scored mean politeness score of chatbot utterances (within-dataset)."
  conversation_length:
    type: integer
    description: "Word count of chatbot utterances in the dialogue."
    minimum: 0
  dataset_source:
    type: string
    description: "Source dataset name."
    enum:
      - "EmpatheticDialogues"
      - "HCI_P2"
  utterance_count:
    type: integer
    description: "Number of chatbot utterances."
    minimum: 1
required:
  - dialogue_id
  - annotator_id
  - quality_rating
  - mean_politeness_score
  - conversation_length
  - dataset_source
  - utterance_count
additionalProperties: false
