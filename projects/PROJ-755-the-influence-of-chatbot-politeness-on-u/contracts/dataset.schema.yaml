$schema: "http://json-schema.org/draft-07/schema#"
title: "Chatbot Politeness Dataset Schema"
description: "Schema for the merged dataset containing dialogues, politeness scores, and user metadata."
type: object
properties:
  fields:
    type: object
    description: "Definition of expected columns in the dataset."
    properties:
      dialogue_id:
        type: string
        description: "Unique identifier for the dialogue session."
        required: true
        data_type: "string"
      user_id:
        type: string
        description: "Unique identifier for the user."
        required: true
        data_type: "string"
      quality_rating:
        type: number
        description: "User-perceived quality rating of the dialogue."
        required: true
        data_type: "float"
        constraints:
          min: 1
          max: 5
      politeness_score:
        type: number
        description: "Mean politeness score for the dialogue (BERT-based)."
        required: false
        data_type: "float"
      conversation_length:
        type: integer
        description: "Number of utterances in the dialogue."
        required: false
        data_type: "integer"
      age:
        type: integer
        description: "Age of the user."
        required: false
        data_type: "integer"
        constraints:
          min: 10
          max: 120
      gender:
        type: string
        description: "Gender of the user."
        required: false
        data_type: "string"
        allowed_values:
          - "Male"
          - "Female"
          - "Non-binary"
          - "Prefer not to say"
          - "Other"
    required:
      - dialogue_id
      - user_id
      - quality_rating
  metadata:
    type: object
    properties:
      source_dataset:
        type: string
      processed_at:
        type: string
        format: date-time
      version:
        type: string
required:
  - fields
