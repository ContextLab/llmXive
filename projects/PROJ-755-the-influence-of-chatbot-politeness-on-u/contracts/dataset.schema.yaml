$schema: "http://json-schema.org/draft-07/schema#"
title: "Chatbot Politeness Dataset Schema"
description: "Schema for validating dialogue datasets used in the politeness study."
type: object
properties:
  Dialogue:
    type: object
    description: "A single dialogue session between a user and a chatbot."
    required:
      - dialogue_id
      - user_id
      - utterances
    properties:
      dialogue_id:
        type: string
        description: "Unique identifier for the dialogue."
        minLength: 1
      user_id:
        type: string
        description: "Unique identifier for the user."
        minLength: 1
      quality_rating:
        type: ["integer", "null"]
        description: "User-perceived quality rating of the dialogue."
        minimum: 1
        maximum: 5
      utterances:
        type: array
        description: "List of utterances in the dialogue."
        items:
          $ref: "#/properties/Utterance"
      age:
        type: ["integer", "null"]
        description: "Age of the user."
        minimum: 0
        maximum: 120
      gender:
        type: ["string", "null"]
        description: "Gender of the user."
      source_dataset:
        type: ["string", "null"]
        description: "Source dataset name (e.g., HCI_P2, Persona-Chat)."
  Utterance:
    type: object
    description: "A single turn in the dialogue."
    required:
      - utterance_id
      - speaker
      - text
    properties:
      utterance_id:
        type: string
        description: "Unique identifier for the utterance."
      speaker:
        type: string
        description: "Speaker role (user or chatbot)."
        enum:
          - user
          - chatbot
      text:
        type: string
        description: "Text content of the utterance."
        minLength: 1
      politeness_score:
        type: ["number", "null"]
        description: "Politeness score for the utterance."
  User:
    type: object
    description: "User metadata."
    required:
      - user_id
    properties:
      user_id:
        type: string
        description: "Unique identifier for the user."
      age:
        type: ["integer", "null"]
        description: "Age of the user."
      gender:
        type: ["string", "null"]
        description: "Gender of the user."
required:
  - Dialogue
  - Utterance
  - User
