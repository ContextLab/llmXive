$schema: "http://json-schema.org/draft-07/schema#"
title: "HCI Politeness Dataset Schema"
description: >
  Schema definition for the Dialogue, Utterance, and User entities
  used in the "Influence of Chatbot Politeness on User-Perceived Quality" project.
  This schema is validated by code/utils/schema_validator.py.

definitions:
  User:
    type: object
    description: "Demographic and identifier information for a participant."
    properties:
      user_id:
        type: string
        description: "Unique identifier for the user."
        minLength: 1
      age:
        type: integer
        description: "Age of the user in years."
        minimum: 18
        maximum: 100
        nullable: true
      gender:
        type: string
        description: "Gender identity of the user."
        enum: ["Male", "Female", "Non-binary", "Prefer not to say", "Other"]
        nullable: true
    required:
      - user_id
    additionalProperties: false

  Utterance:
    type: object
    description: "A single turn of conversation within a dialogue."
    properties:
      utterance_id:
        type: string
        description: "Unique identifier for the utterance."
        minLength: 1
      dialogue_id:
        type: string
        description: "Reference to the parent dialogue."
        minLength: 1
      user_id:
        type: string
        description: "Reference to the user who generated this utterance."
        minLength: 1
      role:
        type: string
        description: "Role of the speaker."
        enum: ["user", "chatbot"]
      text:
        type: string
        description: "The actual text content of the utterance."
        minLength: 1
      turn_index:
        type: integer
        description: "Zero-based index of the turn within the dialogue."
        minimum: 0
    required:
      - utterance_id
      - dialogue_id
      - user_id
      - role
      - text
      - turn_index
    additionalProperties: false

  Dialogue:
    type: object
    description: "A complete conversation session between a user and a chatbot."
    properties:
      dialogue_id:
        type: string
        description: "Unique identifier for the dialogue."
        minLength: 1
      user_id:
        type: string
        description: "Reference to the user participating in the dialogue."
        minLength: 1
      quality_rating:
        type: integer
        description: "User-perceived quality rating (Likert scale 1-5)."
        minimum: 1
        maximum: 5
      source_dataset:
        type: string
        description: "Name of the source dataset (e.g., 'HCI_P2')."
        minLength: 1
      utterances:
        type: array
        description: "List of utterances comprising the dialogue."
        items:
          $ref: "#/definitions/Utterance"
        minItems: 1
      metadata:
        type: object
        description: "Optional metadata fields."
        additionalProperties: true
    required:
      - dialogue_id
      - user_id
      - quality_rating
      - source_dataset
      - utterances
    additionalProperties: false

dataset:
  type: array
  description: "Root collection of Dialogue objects."
  items:
    $ref: "#/definitions/Dialogue"
  minItems: 1

validation_rules:
  - name: "user_id_consistency"
    description: "All utterances in a dialogue must share the same user_id as the dialogue."
    logic: "forall d in dataset: forall u in d.utterances: u.user_id == d.user_id"
  - name: "dialogue_id_consistency"
    description: "All utterances must reference the correct parent dialogue_id."
    logic: "forall d in dataset: forall u in d.utterances: u.dialogue_id == d.dialogue_id"
  - name: "turn_index_order"
    description: "Turn indices within a dialogue must be sequential starting from 0."
    logic: "forall d in dataset: sort(d.utterances.turn_index) == range(0, len(d.utterances))"