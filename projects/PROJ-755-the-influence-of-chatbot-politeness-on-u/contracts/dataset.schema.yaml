$schema: http://json-schema.org/draft-07/schema#
title: Dialogue Dataset Schema
description: |
  Defines the structure for the dialogue dataset used in the study
  "The Influence of Chatbot Politeness on User-Perceived Quality".
  This schema validates raw and processed dialogue data including
  User, Dialogue, and Utterance entities.
type: object
required:
  - entities
properties:
  entities:
    type: object
    required:
      - User
      - Dialogue
      - Utterance
    properties:
      User:
        type: object
        description: |
          Represents a participant in the study.
          Note: Demographic fields (age, gender) may be optional depending on the source dataset.
        required:
          - user_id
        properties:
          user_id:
            type: string
            description: Unique identifier for the user/participant.
            minLength: 1
          age:
            type: ["integer", "null"]
            description: Age of the user in years.
            minimum: 10
            maximum: 100
          gender:
            type: ["string", "null"]
            description: Gender of the user.
            enum:
              - Male
              - Female
              - Non-binary
              - Prefer not to say
              - Other
              - null
      Dialogue:
        type: object
        description: |
          Represents a single conversation session between a user and a chatbot (or between two users).
        required:
          - dialogue_id
          - user_id
          - utterances
        properties:
          dialogue_id:
            type: string
            description: Unique identifier for the dialogue session.
            minLength: 1
          user_id:
            type: string
            description: Foreign key referencing the User entity.
          source_dataset:
            type: string
            description: Name of the source dataset (e.g., 'hci_p2', 'persona_chat', 'empathetic_dialogues').
          quality_rating:
            type: ["integer", "null"]
            description: |
              User-perceived quality rating of the dialogue.
              Used as the dependent variable in the CLMM analysis.
              Scale is typically 1-5 (Likert).
            minimum: 1
            maximum: 5
          conversation_length:
            type: integer
            description: Number of utterances in the dialogue.
            minimum: 1
          mean_politeness_score:
            type: ["number", "null"]
            description: |
              Aggregated and standardized politeness score for the dialogue.
              Calculated from utterance-level scores using BERT-based models.
          raw_politeness_score:
            type: ["number", "null"]
            description: |
              Raw (non-standardized) mean politeness score for the dialogue.
      Utterance:
        type: object
        description: |
          Represents a single turn of speech within a dialogue.
          Utterances are nested within the Dialogue entity.
        required:
          - utterance_id
          - dialogue_id
          - text
          - speaker
        properties:
          utterance_id:
            type: string
            description: Unique identifier for the utterance.
            minLength: 1
          dialogue_id:
            type: string
            description: Foreign key referencing the Dialogue entity.
          speaker:
            type: string
            description: Role of the speaker (e.g., 'user', 'bot', 'A', 'B').
            minLength: 1
          text:
            type: string
            description: The actual text content of the utterance.
            minLength: 1
          politeness_score:
            type: ["number", "null"]
            description: Politeness score assigned to this specific utterance.
            minimum: 0.0
            maximum: 1.0
            nullable: true
examples:
  - entities:
      User:
        user_id: "u123"
        age: 25
        gender: "Female"
      Dialogue:
        dialogue_id: "d_001"
        user_id: "u123"
        source_dataset: "hci_p2"
        quality_rating: 4
        conversation_length: 10
        mean_politeness_score: 0.75
        raw_politeness_score: 0.82
        utterances:
          - utterance_id: "u_001_1"
            dialogue_id: "d_001"
            speaker: "user"
            text: "Hello, can you help me?"
            politeness_score: 0.9
          - utterance_id: "u_001_2"
            dialogue_id: "d_001"
            speaker: "bot"
            text: "Of course! What do you need?"
            politeness_score: 0.8
      Utterance:
        utterance_id: "u_001_1"
        dialogue_id: "d_001"
        speaker: "user"
        text: "Hello, can you help me?"
        politeness_score: 0.9