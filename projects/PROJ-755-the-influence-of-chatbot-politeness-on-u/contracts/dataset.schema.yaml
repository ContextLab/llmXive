# Dataset Schema Contract for Chatbot Politeness Research
# Defines the expected structure for dialogue datasets
$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  Dialogue:
    type: object
    properties:
      dialogue_id:
        type: string
        description: Unique identifier for the dialogue
      user_id:
        type: string
        description: Unique identifier for the user
      utterances:
        type: array
        items:
          type: object
          properties:
            speaker:
              type: string
              enum: [user, chatbot]
            text:
              type: string
            timestamp:
              type: string
              format: date-time
      quality_rating:
        type: number
        minimum: 1
        maximum: 5
        description: User-provided quality rating
      age:
        type: integer
        minimum: 18
      gender:
        type: string
        enum: [Male, Female, Other, Prefer not to say]
      conversation_length:
        type: integer
        minimum: 1
    required:
      - dialogue_id
      - user_id
      - utterances
      - quality_rating
  Dataset:
    type: object
    properties:
      metadata:
        type: object
        properties:
          source:
            type: string
          version:
            type: string
          download_date:
            type: string
            format: date-time
      records:
        type: array
        items:
          $ref: "#/properties/Dialogue"
    required:
      - metadata
      - records