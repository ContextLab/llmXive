$schema: http://json-schema.org/draft-07/schema#
title: CLMM Results Schema
description: >
  Schema defining the structure of Cumulative Link Mixed-Effects Model (CLMM)
  results generated by code/02_fit_clmm.py. This includes fixed effects,
  random effects variance, model convergence status, and sensitivity analysis metrics.
type: object
required:
  - model_metadata
  - fixed_effects
  - random_effects
  - convergence_info
  - sensitivity_analysis
properties:
  model_metadata:
    type: object
    description: Metadata about the model execution and data source.
    required:
      - model_type
      - formula
      - dataset_source
      - n_observations
      - n_groups
      - execution_timestamp
    properties:
      model_type:
        type: string
        enum: ["CLMM", "OrdinalGLM"]
        description: Type of model fitted (CLMM or fallback Ordinal GLM).
      formula:
        type: string
        description: The R formula used for the model (e.g., "quality_rating ~ politeness + (1|user_id)").
      dataset_source:
        type: string
        description: Path to the input dataset (e.g., "data/processed/scored_dialogues.parquet").
      n_observations:
        type: integer
        minimum: 0
        description: Total number of observations (dialogues) used in the model.
      n_groups:
        type: integer
        minimum: 1
        description: Number of unique levels for the random effect (e.g., unique users).
      execution_timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of model execution.
      convergence_status:
        type: boolean
        description: Whether the model converged successfully.
      fallback_triggered:
        type: boolean
        description: True if the model fell back to fixed-effects due to non-convergence.

  fixed_effects:
    type: array
    description: List of fixed effect coefficients, standard errors, and p-values.
    items:
      type: object
      required:
        - term
        - estimate
        - std_error
        - z_value
        - p_value
        - p_value_adj
        - significance
      properties:
        term:
          type: string
          description: Name of the predictor variable (e.g., "politeness", "conversation_length").
        estimate:
          type: number
          description: Estimated coefficient value.
        std_error:
          type: number
          description: Standard error of the estimate.
        z_value:
          type: number
          description: Z-statistic (estimate / std_error).
        p_value:
          type: number
          minimum: 0
          maximum: 1
          description: Raw p-value for the coefficient.
        p_value_adj:
          type: number
          minimum: 0
          maximum: 1
          description: Benjamini-Hochberg adjusted p-value.
        significance:
          type: string
          enum: ["***", "**", "*", ".", ""]
          description: Significance stars based on adjusted p-value.

  random_effects:
    type: object
    description: Variance components for random effects.
    required:
      - user_id_variance
      - residual_variance
    properties:
      user_id_variance:
        type: number
        minimum: 0
        description: Variance of the random intercept for user_id.
      residual_variance:
        type: number
        minimum: 0
        description: Residual variance (or threshold variance depending on parameterization).
      thresholds:
        type: array
        description: Thresholds for the ordinal response levels.
        items:
          type: number

  convergence_info:
    type: object
    description: Detailed convergence diagnostics.
    required:
      - converged
      - convergence_code
      - convergence_message
      - n_iterations
    properties:
      converged:
        type: boolean
        description: Whether the optimizer converged.
      convergence_code:
        type: integer
        description: Optimizer return code (0 usually indicates success).
      convergence_message:
        type: string
        description: Human-readable convergence message.
      n_iterations:
        type: integer
        description: Number of iterations performed.
      warning_logs:
        type: array
        items:
          type: string
        description: List of warnings generated during fitting.

  sensitivity_analysis:
    type: object
    description: Results from sensitivity analysis across different significance thresholds.
    required:
      - thresholds_tested
      - significance_rates
    properties:
      thresholds_tested:
        type: array
        items:
          type: number
        description: List of p-value thresholds tested (e.g., [0.01, 0.05, 0.10]).
      significance_rates:
        type: array
        items:
          type: number
        description: Proportion of tests significant at each corresponding threshold.
      e_value:
        type: number
        minimum: 1
        description: E-value for the primary effect (robustness to unmeasured confounding).
        nullable: true

  collinearity_check:
    type: object
    description: Variance Inflation Factor (VIF) check results.
    required:
      - checked
      - results
    properties:
      checked:
        type: boolean
        description: Whether VIF check was performed.
      results:
        type: object
        description: Map of variable names to VIF scores.
        additionalProperties:
          type: number
          minimum: 1
      dropped_variables:
        type: array
        items:
          type: string
        description: List of variables dropped due to high VIF (>= 5).
