%YAML 1.2
---
# CLMM Results Output Schema
# Defines the structure for Cumulative Link Mixed-Effects Model results
# generated by code/02_fit_clmm.py and related analysis scripts.

$schema: "http://json-schema.org/draft-07/schema#"
title: CLMM Results
description: "Schema for Cumulative Link Mixed-Effects Model output containing coefficients, standard errors, p-values, and convergence metrics."
type: object

properties:
  model_info:
    type: object
    description: "Metadata about the fitted model"
    properties:
      model_type:
        type: string
        description: "Type of model fitted (e.g., 'clmm', 'clmm_fallback')"
        enum: ["clmm", "clmm_fallback", "fixed_effects"]
      formula:
        type: string
        description: "R formula used for the model"
      convergence_status:
        type: string
        description: "Convergence status of the model fitting"
        enum: ["success", "failed", "warning"]
      convergence_message:
        type: string
        description: "Detailed message from the model fitting process"
      n_observations:
        type: integer
        minimum: 0
        description: "Number of observations used in the model"
      n_groups:
        type: integer
        minimum: 0
        description: "Number of random effect groups (e.g., users)"
      random_effects:
        type: array
        description: "List of random effects terms"
        items:
          type: string
      fixed_effects:
        type: array
        description: "List of fixed effects terms"
        items:
          type: string
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp when the model was fitted"
    
    required:
      - model_type
      - formula
      - convergence_status
      - n_observations
      - timestamp

  fixed_effects_results:
    type: array
    description: "Results for each fixed effect coefficient"
    items:
      type: object
      properties:
        term:
          type: string
          description: "Name of the fixed effect term"
        estimate:
          type: number
          description: "Estimated coefficient value"
        std_error:
          type: number
          description: "Standard error of the estimate"
        z_value:
          type: number
          description: "Z-statistic (estimate / std_error)"
        p_value:
          type: number
          minimum: 0
          maximum: 1
          description: "Raw p-value for the coefficient"
        p_value_bh:
          type: number
          minimum: 0
          maximum: 1
          description: "Benjamini-Hochberg corrected p-value"
        ci_lower:
          type: number
          description: "Lower bound of 95% confidence interval"
        ci_upper:
          type: number
          description: "Upper bound of 95% confidence interval"
        significance:
          type: string
          description: "Significance flag based on BH-corrected p-value"
          enum: ["*", "**", "***", "ns"]
          pattern: "^(\\*{1,3}|ns)$"
      required:
        - term
        - estimate
        - std_error
        - z_value
        - p_value
        - p_value_bh
        - ci_lower
        - ci_upper
        - significance

  threshold_estimates:
    type: array
    description: "Threshold (cut-point) estimates for the ordinal outcome"
    items:
      type: object
      properties:
        threshold:
          type: string
          description: "Name of the threshold (e.g., 'quality_rating|1|2')"
        estimate:
          type: number
          description: "Estimated threshold value"
        std_error:
          type: number
          description: "Standard error of the threshold estimate"
      required:
        - threshold
        - estimate
        - std_error

  model_fit_statistics:
    type: object
    description: "Overall model fit statistics"
    properties:
      log_likelihood:
        type: number
        description: "Log-likelihood of the fitted model"
      aic:
        type: number
        description: "Akaike Information Criterion"
      bic:
        type: number
        description: "Bayesian Information Criterion"
      deviance:
        type: number
        description: "Deviance of the fitted model"
      pseudo_r2:
        type: number
        minimum: 0
        maximum: 1
        description: "Pseudo R-squared value (e.g., Nagelkerke)"
      sc003_status:
        type: string
        description: "Status of Success Criterion 003 (convergence rate)"
        enum: ["met", "not_met", "partial", "not_evaluated"]
      sc003_note:
        type: string
        description: "Additional notes about SC-003 evaluation"
    required:
      - log_likelihood
      - aic
      - sc003_status

required:
  - model_info
  - fixed_effects_results
  - threshold_estimates
  - model_fit_statistics

additionalProperties: false