%YAML 1.2
---
# Schema for CLMM (Cumulative Link Mixed-Effects Model) results
# This schema defines the structure of the output files generated by the
# statistical analysis pipeline (code/02_fit_clmm.py, code/02_apply_bh_correction.py).
#
# It covers:
# 1. Primary model results (fixed effects coefficients, SEs, p-values, CIs)
# 2. Convergence metrics
# 3. Model metadata (formula, random effects structure)
# 4. Correction method applied (BH or Bonferroni)

title: CLMM Results Schema
description: |
  Defines the structure for Cumulative Link Mixed-Effects Model output.
  Used to validate `data/processed/clmm_primary_results.csv`,
  `data/processed/clmm_fallback_results.csv`, and `data/processed/clmm_results.csv`.

type: object
required:
  - meta
  - fixed_effects
  - convergence

properties:
  meta:
    type: object
    description: Metadata about the model run and dataset
    required:
      - model_type
      - formula
      - random_effects
      - correction_method
      - timestamp
      - dataset_source
    properties:
      model_type:
        type: string
        enum: [CLMM, ORDINAL_LOGISTIC]
        description: Type of model fitted (Cumulative Link Mixed Model or Fixed-Effects Ordinal)
      formula:
        type: string
        description: The model formula used (e.g., "quality_rating ~ politeness + conversation_length + (1|user_id)")
      random_effects:
        type: string
        description: Description of random effects structure (e.g., "(1|user_id)")
      correction_method:
        type: string
        enum: [BENJAMINI_HOCHBERG, BONFERRONI, NONE]
        description: Multiple comparison correction method applied to p-values
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the model was fitted
      dataset_source:
        type: string
        description: Path or identifier of the input dataset (e.g., "data/processed/scored_dialogues.parquet")
      convergence_status:
        type: string
        enum: [SUCCESS, FAILED, WARNING]
        description: Overall convergence status of the optimization

  fixed_effects:
    type: array
    description: List of fixed effect terms and their statistics
    items:
      type: object
      required:
        - term
        - estimate
        - std_error
        - p_value
        - p_value_adjusted
        - ci_lower
        - ci_upper
        - ci_level
      properties:
        term:
          type: string
          description: Name of the predictor variable (e.g., "politeness", "conversation_length", "Intercept")
        estimate:
          type: number
          format: float
          description: Estimated coefficient (log-odds)
        std_error:
          type: number
          format: float
          description: Standard error of the estimate
        z_value:
          type: number
          format: float
          description: Z-statistic (estimate / std_error)
        p_value:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Raw p-value for the hypothesis test
        p_value_adjusted:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: P-value after multiple comparison correction
        ci_lower:
          type: number
          format: float
          description: Lower bound of the confidence interval
        ci_upper:
          type: number
          format: float
          description: Upper bound of the confidence interval
        ci_level:
          type: number
          format: float
          description: Confidence level (e.g., 0.95)
        odds_ratio:
          type: number
          format: float
          description: Exponentiated coefficient (exp(estimate)), representing the odds ratio
        ci_lower_or:
          type: number
          format: float
          description: Lower bound of the odds ratio CI
        ci_upper_or:
          type: number
          format: float
          description: Upper bound of the odds ratio CI

  convergence:
    type: object
    description: Details about the model convergence
    required:
      - status
      - message
      - iterations
    properties:
      status:
        type: string
        enum: [CONVERGED, MAX_ITERATIONS, NON_POS_DEF, SINGULAR, FAILED]
        description: Specific convergence code or status
      message:
        type: string
        description: Human-readable message from the optimizer
      iterations:
        type: integer
        minimum: 0
        description: Number of iterations performed by the optimizer
      warnings:
        type: array
        items:
          type: string
        description: List of warnings generated during fitting

  thresholds:
    type: array
    description: Estimated thresholds (cut-points) for the ordinal outcome
    items:
      type: object
      required:
        - threshold_name
        - estimate
        - std_error
      properties:
        threshold_name:
          type: string
          description: Name of the threshold (e.g., "quality_rating|1", "quality_rating|2")
        estimate:
          type: number
          format: float
        std_error:
          type: number
          format: float

  diagnostics:
    type: object
    description: Model fit diagnostics
    properties:
      aic:
        type: number
        format: float
        description: Akaike Information Criterion
      bic:
        type: number
        format: float
        description: Bayesian Information Criterion
      log_likelihood:
        type: number
        format: float
        description: Log-likelihood of the model
      n_obs:
        type: integer
        minimum: 0
        description: Number of observations used
      n_groups:
        type: integer
        minimum: 0
        description: Number of levels in the random effect grouping factor (e.g., number of users)