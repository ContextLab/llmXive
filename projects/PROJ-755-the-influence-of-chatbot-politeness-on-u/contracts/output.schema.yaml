# CLMM Results Output Schema
# Defines the structure of the Cumulative Link Mixed-Effects Model results
# produced by code/02_fit_clmm.py and saved to data/processed/clmm_results.csv

$schema: http://json-schema.org/draft-07/schema#
title: CLMM Results
description: Output schema for Cumulative Link Mixed-Effects Model analysis results
type: object
required:
  - model_info
  - fixed_effects
  - random_effects
  - diagnostics
properties:
  model_info:
    type: object
    description: Metadata about the fitted model
    required:
      - formula
      - family
      - convergence_status
      - n_observations
      - n_groups
    properties:
      formula:
        type: string
        description: R formula used for model fitting
        example: "quality_rating ~ politeness + conversation_length + (1|user_id)"
      family:
        type: string
        description: Model family (e.g., cumulative link)
        example: "cumulative"
      convergence_status:
        type: boolean
        description: Whether the model converged successfully
      convergence_message:
        type: string
        description: Convergence diagnostic message if available
      n_observations:
        type: integer
        description: Total number of observations used
        minimum: 0
      n_groups:
        type: integer
        description: Number of random effect groups (e.g., unique user_ids)
        minimum: 1
      link_function:
        type: string
        description: Link function used (e.g., logit, probit, cloglog)
        example: "logit"

  fixed_effects:
    type: array
    description: Fixed effects coefficients and statistics
    items:
      type: object
      required:
        - term
        - estimate
        - std_error
        - z_value
        - p_value
        - p_value_adj
        - ci_lower
        - ci_upper
      properties:
        term:
          type: string
          description: Name of the fixed effect term
          example: "politeness"
        estimate:
          type: number
          description: Coefficient estimate
        std_error:
          type: number
          description: Standard error of the estimate
        z_value:
          type: number
          description: Z-statistic (estimate / std_error)
        p_value:
          type: number
          description: Raw p-value
          minimum: 0
          maximum: 1
        p_value_adj:
          type: number
          description: Benjamini-Hochberg adjusted p-value
          minimum: 0
          maximum: 1
        ci_lower:
          type: number
          description: Lower bound of 95% confidence interval
        ci_upper:
          type: number
          description: Upper bound of 95% confidence interval
        significance:
          type: string
          description: Significance level indicator
          enum: ["***", "**", "*", ".", ""]

  random_effects:
    type: object
    description: Random effects variance components
    required:
      - user_id
    properties:
      user_id:
        type: object
        description: Variance components for user_id random intercept
        required:
          - variance
          - std_dev
        properties:
          variance:
            type: number
            description: Variance of the random intercept
            minimum: 0
          std_dev:
            type: number
            description: Standard deviation of the random intercept
            minimum: 0
          n_levels:
            type: integer
            description: Number of levels in the user_id factor
            minimum: 1

  diagnostics:
    type: object
    description: Model fit diagnostics and quality metrics
    required:
      - aic
      - bic
      - log_likelihood
      - residual_df
    properties:
      aic:
        type: number
        description: Akaike Information Criterion
      bic:
        type: number
        description: Bayesian Information Criterion
      log_likelihood:
        type: number
        description: Log-likelihood of the fitted model
      residual_df:
        type: integer
        description: Residual degrees of freedom
      rho:
        type: number
        description: Intraclass correlation coefficient (ICC)
        minimum: 0
        maximum: 1
      n_thresholds:
        type: integer
        description: Number of threshold parameters estimated
        minimum: 1

  thresholds:
    type: array
    description: Threshold (cut-point) estimates for ordinal categories
    items:
      type: object
      required:
        - threshold_name
        - estimate
        - std_error
      properties:
        threshold_name:
          type: string
          description: Name of the threshold (e.g., "1|2", "2|3")
        estimate:
          type: number
          description: Threshold estimate
        std_error:
          type: number
          description: Standard error of the threshold estimate

additionalProperties: false
