# Contract: CLMM Results Output Schema
# Defines the structure of data/processed/clmm_results.csv and related artifacts
# Generated for project: PROJ-755-the-influence-of-chatbot-politeness-on-u
# Task: T009

schema_version: "1.0"
artifact_type: "clmm_results"
description: "Schema for Cumulative Link Mixed-Effects Model results including coefficients, standard errors, p-values, confidence intervals, and convergence metrics."

# Primary Output: CSV/Parquet Table
table:
  name: "clmm_results"
  file_path: "data/processed/clmm_results.csv"
  format: "csv"
  rows_description: "One row per fixed effect term in the model."
  columns:
    - name: "term"
      type: "string"
      description: "Name of the fixed effect variable (e.g., 'politeness', 'conversation_length', 'intercept')."
      required: true
      constraints:
        - "Must not be empty"
        - "Must match variable names in the fitted model formula"

    - name: "estimate"
      type: "float"
      description: "Estimated coefficient value for the fixed effect."
      required: true
      constraints:
        - "Numeric value"

    - name: "std_error"
      type: "float"
      description: "Standard error of the estimate."
      required: true
      constraints:
        - "Positive float"

    - name: "statistic"
      type: "float"
      description: "Test statistic (z-value or t-value) for the coefficient."
      required: true

    - name: "p_value"
      type: "float"
      description: "Raw p-value for the hypothesis test (H0: estimate = 0)."
      required: true
      constraints:
        - "Range: [0.0, 1.0]"

    - name: "p_value_bh"
      type: "float"
      description: "Benjamini-Hochberg corrected p-value for multiple comparisons."
      required: true
      constraints:
        - "Range: [0.0, 1.0]"

    - name: "conf_int_low"
      type: "float"
      description: "Lower bound of the 95% confidence interval."
      required: true

    - name: "conf_int_high"
      type: "float"
      description: "Upper bound of the 95% confidence interval."
      required: true

    - name: "significance"
      type: "string"
      description: "Significance flag based on corrected p-value (e.g., '***', '**', '*', '.' , 'ns')."
      required: true
      allowed_values:
        - "***"
        - "**"
        - "*"
        - "."
        - "ns"

# Secondary Output: Model Status JSON
status_file:
  name: "project_status"
  file_path: "data/processed/project_status.json"
  format: "json"
  schema:
    - name: "convergence_rate"
      type: "float"
      description: "Proportion of models that converged successfully (0.0 to 1.0)."
      required: true
      constraints:
        - "Range: [0.0, 1.0]"

    - name: "status"
      type: "string"
      description: "Overall pipeline status."
      required: true
      allowed_values:
        - "success"
        - "partial"
        - "failed"

    - name: "sc003_met"
      type: "boolean"
      description: "True if convergence rate >= 95% (Success Criterion 003)."
      required: true

    - name: "model_info"
      type: "object"
      description: "Metadata about the fitted model."
      required: false
      properties:
        - name: "formula"
          type: "string"
          description: "The R formula used for fitting."
        - name: "family"
          type: "string"
          description: "Distribution family (e.g., 'cumulative')."
        - name: "random_effects"
          type: "array"
          description: "List of random effect terms."
          items:
            type: "string"

# Validation Rules
validation:
  - rule: "All p-values must be between 0 and 1"
    severity: "error"
  - rule: "Standard errors must be positive"
    severity: "error"
  - rule: "Convergence rate must be >= 0.95 for 'success' status"
    severity: "critical"
  - rule: "Term names must be unique"
    severity: "error"