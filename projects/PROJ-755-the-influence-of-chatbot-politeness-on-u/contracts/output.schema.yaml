# CLMM Results Output Schema
# Defines the structure of the Cumulative Link Mixed-Effects Model results
# generated by code/02_fit_clmm.py and related analysis scripts.
#
# This schema is used by code/utils/schema_validator.py to validate
# the output files before downstream consumption.

$schema: "http://json-schema.org/draft-07/schema#"
title: CLMM Results
description: "Schema for Cumulative Link Mixed-Effects Model output data"

type: object
required:
  - metadata
  - model_summary
  - fixed_effects
  - random_effects
  - diagnostics

properties:
  metadata:
    type: object
    description: "Information about the model run and data source"
    required:
      - timestamp
      - dataset_version
      - model_formula
      - software_version
    properties:
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of model execution"
      dataset_version:
        type: string
        description: "Version or checksum of the input dataset"
      model_formula:
        type: string
        description: "The R formula used for the CLMM"
      software_version:
        type: string
        description: "Version of R and lme4 used"
      convergence_status:
        type: boolean
        description: "Whether the model converged successfully"
      convergence_message:
        type: string
        description: "Optional message from the optimizer"

  model_summary:
    type: object
    description: "High-level model fit statistics"
    required:
      - logLik
      - AIC
      - BIC
      - n_obs
      - n_groups
    properties:
      logLik:
        type: number
        description: "Log-likelihood of the model"
      AIC:
        type: number
        description: "Akaike Information Criterion"
      BIC:
        type: number
        description: "Bayesian Information Criterion"
      n_obs:
        type: integer
        description: "Number of observations"
      n_groups:
        type: integer
        description: "Number of random effect groups (users)"

  fixed_effects:
    type: array
    description: "Table of fixed effect coefficients"
    items:
      type: object
      required:
        - term
        - estimate
        - std_error
        - z_value
        - p_value
        - p_adj
        - ci_lower
        - ci_upper
      properties:
        term:
          type: string
          description: "Name of the predictor variable"
        estimate:
          type: number
          description: "Estimated coefficient"
        std_error:
          type: number
          description: "Standard error of the estimate"
        z_value:
          type: number
          description: "Z-statistic (estimate / std_error)"
        p_value:
          type: number
          description: "Raw p-value"
        p_adj:
          type: number
          description: "Benjamini-Hochberg adjusted p-value"
        ci_lower:
          type: number
          description: "Lower bound of 95% confidence interval"
        ci_upper:
          type: number
          description: "Upper bound of 95% confidence interval"

  random_effects:
    type: object
    description: "Random effect variance components"
    required:
      - user_id
    properties:
      user_id:
        type: object
        description: "Random intercept variance for user_id"
        required:
          - variance
          - std_dev
        properties:
          variance:
            type: number
            description: "Variance of the random intercept"
          std_dev:
            type: number
            description: "Standard deviation of the random intercept"

  diagnostics:
    type: object
    description: "Model convergence and quality diagnostics"
    required:
      - convergence_code
      - optimizer
      - n_iterations
    properties:
      convergence_code:
        type: integer
        description: "Convergence code (0 indicates success)"
      optimizer:
        type: string
        description: "Optimizer used (e.g., 'bobyqa')"
      n_iterations:
        type: integer
        description: "Number of iterations to convergence"
      warnings:
        type: array
        items:
          type: string
        description: "List of any warnings generated during fitting"

examples:
  - metadata:
      timestamp: "2024-01-15T10:30:00Z"
      dataset_version: "hci_p2_v1.0"
      model_formula: "quality_rating ~ politeness + conversation_length + (1|user_id)"
      software_version: "R 4.3.1 / lme4 1.1-34"
      convergence_status: true
      convergence_message: "Model converged successfully"
    model_summary:
      logLik: -1250.5
      AIC: 2511.0
      BIC: 2545.2
      n_obs: 1500
      n_groups: 300
    fixed_effects:
      - term: "(Intercept)"
        estimate: 2.1
        std_error: 0.15
        z_value: 14.0
        p_value: 1e-10
        p_adj: 1e-10
        ci_lower: 1.8
        ci_upper: 2.4
      - term: "politeness"
        estimate: 0.45
        std_error: 0.12
        z_value: 3.75
        p_value: 0.00018
        p_adj: 0.00036
        ci_lower: 0.21
        ci_upper: 0.69
      - term: "conversation_length"
        estimate: -0.02
        std_error: 0.01
        z_value: -2.0
        p_value: 0.045
        p_adj: 0.067
        ci_lower: -0.04
        ci_upper: 0.00
    random_effects:
      user_id:
        variance: 0.85
        std_dev: 0.92
    diagnostics:
      convergence_code: 0
      optimizer: "bobyqa"
      n_iterations: 150
      warnings: []