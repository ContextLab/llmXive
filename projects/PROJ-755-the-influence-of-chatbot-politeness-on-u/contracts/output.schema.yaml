$schema: "http://json-schema.org/draft-07/schema#"
title: "CLMM Results Schema"
description: "Schema defining the structure of Cumulative Link Mixed-Effects Model (CLMM) results output."
type: object
required:
  - model_info
  - fixed_effects
  - random_effects
  - fit_statistics
  - convergence_status
  - corrections
properties:
  model_info:
    type: object
    description: "Metadata about the model execution."
    required:
      - formula
      - dataset_source
      - timestamp
      - software_version
    properties:
      formula:
        type: string
        description: "The R formula used for the model (e.g., 'quality_rating ~ politeness + (1|user_id)')."
      dataset_source:
        type: string
        description: "Path or identifier of the input dataset used."
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of when the model was fitted."
      software_version:
        type: string
        description: "Version of R and lme4 used."

  fixed_effects:
    type: array
    description: "Coefficients and statistics for fixed effects."
    items:
      type: object
      required:
        - term
        - estimate
        - std_error
        - z_value
        - p_value
        - p_value_adj
      properties:
        term:
          type: string
          description: "Name of the predictor variable."
        estimate:
          type: number
          description: "Estimated coefficient."
        std_error:
          type: number
          description: "Standard error of the estimate."
        z_value:
          type: number
          description: "Z-statistic (estimate / std_error)."
        p_value:
          type: number
          description: "Raw p-value."
        p_value_adj:
          type: number
          description: "Benjamini-Hochberg adjusted p-value."
        ci_lower:
          type: number
          description: "Lower bound of 95% Confidence Interval."
        ci_upper:
          type: number
          description: "Upper bound of 95% Confidence Interval."

  random_effects:
    type: object
    description: "Variance components for random effects."
    properties:
      user_id:
        type: object
        required:
          - variance
          - std_dev
        properties:
          variance:
            type: number
            description: "Variance of the random intercept for user_id."
          std_dev:
            type: number
            description: "Standard deviation of the random intercept for user_id."
      residual:
        type: number
        description: "Residual variance (if applicable)."

  fit_statistics:
    type: object
    description: "Overall model fit metrics."
    properties:
      log_likelihood:
        type: number
        description: "Log-likelihood of the fitted model."
      aic:
        type: number
        description: "Akaike Information Criterion."
      bic:
        type: number
        description: "Bayesian Information Criterion."
      n_obs:
        type: integer
        description: "Number of observations used."
      n_groups:
        type: integer
        description: "Number of groups (e.g., unique user_ids)."

  convergence_status:
    type: object
    description: "Status of the model convergence."
    required:
      - converged
      - message
    properties:
      converged:
        type: boolean
        description: "True if the model converged successfully."
      message:
        type: string
        description: "Convergence message or error code from lme4."
      optimizer:
        type: string
        description: "Optimizer used (e.g., 'bobyqa')."
      iterations:
        type: integer
        description: "Number of iterations performed."

  corrections:
    type: object
    description: "Details on multiple comparison corrections applied."
    properties:
      method:
        type: string
        description: "Correction method used (e.g., 'BH' for Benjamini-Hochberg)."
      alpha:
        type: number
        description: "Significance level used (e.g., 0.05)."
      applied:
        type: boolean
        description: "Whether correction was successfully applied."

  threshold_estimates:
    type: array
    description: "Threshold (cut-point) estimates for the ordinal outcome."
    items:
      type: object
      required:
        - threshold_name
        - estimate
      properties:
        threshold_name:
          type: string
          description: "Name of the threshold (e.g., 'quality_rating|1|2')."
        estimate:
          type: number
          description: "Estimated threshold value."

additionalProperties: false
version: "1.0"