# CLMM Results Output Schema
# Defines the structure of the Cumulative Link Mixed-Effects model results
# generated by code/02_fit_clmm.py and subsequent analysis scripts.
#
# This schema is used to validate the CSV output files containing:
# - Fixed effects coefficients, standard errors, p-values, and confidence intervals
# - Random effects variance components
# - Model convergence status and diagnostics
# - Correction method applied (Benjamini-Hochberg or Bonferroni)

type: object
properties:
  term:
    type: string
    description: Name of the model term (fixed effect or random effect)
    examples:
      - "(Intercept)"
      - "politeness"
      - "conversation_length"
      - "user_id"
  effect_type:
    type: string
    enum:
      - fixed
      - random
    description: Whether the term is a fixed effect or random effect
  estimate:
    type: number
    description: Estimated coefficient value (log-odds for fixed effects, variance for random effects)
    nullable: true
  std_error:
    type: number
    description: Standard error of the estimate
    nullable: true
  statistic:
    type: number
    description: Test statistic (z-value for fixed effects, chi-square for likelihood ratio tests)
    nullable: true
  p_value:
    type: number
    description: Raw p-value from the statistical test
    minimum: 0
    maximum: 1
    nullable: true
  p_value_corrected:
    type: number
    description: Multiple-comparison corrected p-value (Benjamini-Hochberg or Bonferroni)
    minimum: 0
    maximum: 1
    nullable: true
  method_corrected:
    type: string
    enum:
      - benjamini_hochberg
      - bonferroni
    description: Method used for p-value correction
    nullable: true
  ci_lower:
    type: number
    description: Lower bound of the 95% confidence interval
    nullable: true
  ci_upper:
    type: number
    description: Upper bound of the 95% confidence interval
    nullable: true
  odds_ratio:
    type: number
    description: Exponentiated coefficient (odds ratio) for fixed effects
    nullable: true
  ci_or_lower:
    type: number
    description: Lower bound of the 95% confidence interval for odds ratio
    nullable: true
  ci_or_upper:
    type: number
    description: Upper bound of the 95% confidence interval for odds ratio
    nullable: true
  convergence_status:
    type: string
    enum:
      - success
      - failed
      - warning
    description: Model convergence status
    nullable: true
  model_type:
    type: string
    enum:
      - clmm
      - ordinal_fixed_effects
    description: Type of model fitted (primary CLMM or fallback ordinal regression)
  threshold_1:
    type: number
    description: Threshold parameter 1 for cumulative link model (if applicable)
    nullable: true
  threshold_2:
    type: number
    description: Threshold parameter 2 for cumulative link model (if applicable)
    nullable: true
  threshold_3:
    type: number
    description: Threshold parameter 3 for cumulative link model (if applicable)
    nullable: true
  threshold_4:
    type: number
    description: Threshold parameter 4 for cumulative link model (if applicable)
    nullable: true
  variance_component:
    type: number
    description: Variance component for random effects
    nullable: true
  std_dev:
    type: number
    description: Standard deviation for random effects
    nullable: true
  n_observations:
    type: integer
    description: Number of observations used in the model
    minimum: 1
  n_groups:
    type: integer
    description: Number of groups (e.g., unique user_ids) for random effects
    minimum: 1
  log_likelihood:
    type: number
    description: Log-likelihood of the fitted model
    nullable: true
  aic:
    type: number
    description: Akaike Information Criterion
    nullable: true
  bic:
    type: number
    description: Bayesian Information Criterion
    nullable: true
  error_message:
    type: string
    description: Error message if model fitting failed
    nullable: true

required:
  - term
  - effect_type
  - p_value
  - model_type

additionalProperties: false