# Output Schema for CLMM Results
# Defines the structure for model output files
$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  model_info:
    type: object
    properties:
      formula:
        type: string
      family:
        type: string
      convergence_status:
        type: boolean
      convergence_message:
        type: string
    required:
      - formula
      - family
      - convergence_status
  fixed_effects:
    type: array
    items:
      type: object
      properties:
        term:
          type: string
        estimate:
          type: number
        std_error:
          type: number
        z_value:
          type: number
        p_value:
          type: number
        p_value_adj:
          type: number
        conf_low:
          type: number
        conf_high:
          type: number
      required:
        - term
        - estimate
        - std_error
        - p_value
  random_effects:
    type: array
    items:
      type: object
      properties:
        group:
          type: string
        variance:
          type: number
        std_dev:
          type: number
  diagnostics:
    type: object
    properties:
      aic:
        type: number
      bic:
        type: number
      log_likelihood:
        type: number
      iterations:
        type: integer
    required:
      - aic
      - bic
      - log_likelihood
required:
  - model_info
  - fixed_effects
  - diagnostics