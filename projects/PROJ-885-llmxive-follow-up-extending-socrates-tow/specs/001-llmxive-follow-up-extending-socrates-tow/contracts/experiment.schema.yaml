$schema: "http://json-schema.org/draft-07/schema#"
title: "ExperimentRun"
description: "Schema for a single experiment run (LLM inference on a trajectory)."
type: "object"
required:
  - "run_id"
  - "trajectory_id"
  - "llm_id"
  - "condition"
  - "prompt"
  - "output"
  - "metrics"
properties:
  run_id:
    type: "string"
    description: "Unique identifier for the run (UUID)."
  trajectory_id:
    type: "string"
    description: "Reference to the trajectory used."
  llm_id:
    type: "string"
    description: "Identifier of the LLM model (e.g., \"llama-3-8b\")."
  condition:
    type: "string"
    enum:
      - "static"
      - "adapter"
    description: "Experimental condition."
  prompt:
    type: "string"
    description: "Full system prompt sent to the LLM."
  output:
    type: "string"
    description: "Raw text generated by the LLM."
  metrics:
    type: "object"
    required:
      - "consensus_gap_score"
      - "inference_time_ms"
    properties:
      consensus_gap_score:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Consensus gap closure score (0 = perfect, 1 = worst)."
      inference_time_ms:
        type: "integer"
        minimum: 0
        description: "Inference latency in milliseconds."
