$schema: "http://json-schema.org/draft-07/schema#"
title: "ConflictTrajectory"
description: "Schema for a single conflict trajectory generated by the SoCRATES pipeline."
type: "object"
required:
  - "trajectory_id"
  - "dialogue_history"
  - "emotional_reactivity_score"
  - "cultural_identity_tags"
  - "ideal_resolution"
properties:
  trajectory_id:
    type: "string"
    description: "Unique identifier for the trajectory (UUID)."
  dialogue_history:
    type: "array"
    description: "List of dialogue turns (strings)."
    items:
      type: "string"
  emotional_reactivity_score:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Generated score representing emotional intensity (0‑1)."
  cultural_identity_tags:
    type: "array"
    description: "Cultural identity tags attached to the participants."
    items:
      type: "string"
  ideal_resolution:
    type: "string"
    description: "Ground‑truth ideal resolution text for the conflict."
