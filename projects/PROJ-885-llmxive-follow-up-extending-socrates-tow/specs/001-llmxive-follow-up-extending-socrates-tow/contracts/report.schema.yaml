$schema: "http://json-schema.org/draft-07/schema#"
title: "StatisticalReport"
description: "Schema for the aggregated statistical report for a single LLM."
type: "object"
required:
  - "llm_id"
  - "comparison"
  - "correction_applied"
properties:
  llm_id:
    type: "string"
    description: "Identifier of the LLM model."
  comparison:
    type: "object"
    required:
      - "mean_diff"
      - "p_value"
      - "is_significant"
      - "effect_size"
      - "test_type"
      - "normality_p_value"
    properties:
      mean_diff:
        type: "number"
        description: "Mean difference in consensus gap closure (Adapter − Static)."
      p_value:
        type: "number"
        description: "Raw p‑value from the statistical test."
      is_significant:
        type: "boolean"
        description: "Whether the corrected p‑value < 0.05."
      effect_size:
        type: "number"
        description: "Effect size (Cohen's d for t‑test or rank‑biserial for Wilcoxon)."
      test_type:
        type: "string"
        enum:
          - "t-test"
          - "wilcoxon"
        description: "Statistical test applied."
      normality_p_value:
        type: "number"
        description: "Shapiro‑Wilk p‑value for normality of difference scores."
  correction_applied:
    type: "boolean"
    description: "Whether Holm‑Bonferroni correction was applied across models."
