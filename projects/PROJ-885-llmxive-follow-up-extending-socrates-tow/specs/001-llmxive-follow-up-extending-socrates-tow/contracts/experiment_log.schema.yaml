$schema: http://json-schema.org/draft-07/schema#
title: ExperimentLog
description: Schema for a single LLM inference run record.
type: object
required:
  - run_id
  - trajectory_id
  - model_name
  - condition
  - injected_state
  - llm_output
  - consensus_gap_score
  - status
properties:
  run_id:
    type: string
    description: "Unique UUID for this run."
  trajectory_id:
    type: string
    description: "Reference to the ConflictTrajectory."
  model_name:
    type: string
    description: "Name of the LLM used (e.g., 'llama-3-8b')."
  condition:
    type: string
    enum:
      - static
      - adapter
    description: "Experimental condition."
  injected_state:
    type: string
    description: "State label injected (e.g., 'escalating') or 'none'/'neutral-monitoring'."
  llm_output:
    type: string
    description: "The generated resolution text."
  consensus_gap_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Calculated gap score (0.0 = perfect, 1.0 = worst)."
  status:
    type: string
    enum:
      - success
      - skipped
      - timeout
    description: "Execution status."
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of execution."
additionalProperties: false