# Data Output Schema Definition for PROJ-071
# This file defines the expected structure for all output artifacts.

schemas:
  merged_drugs:
    description: "Merged dataset of structural and degradation data"
    file: "data/processed/merged_drugs.csv"
    columns:
      - name: smiles
        type: string
        required: true
      - name: canonical_smiles
        type: string
        required: false
      - name: half_life
        type: float
        required: false
      - name: rate_constant
        type: float
        required: false
      - name: temperature
        type: float
        required: false
      - name: ph
        type: float
        required: false

  excluded_molecules:
    description: "Log of molecules excluded due to calculation errors"
    file: "data/processed/excluded_molecules.csv"
    columns:
      - name: smiles
        type: string
        required: true
        description: "The SMILES string of the excluded molecule"
      - name: error_type
        type: string
        required: true
        description: "Type of error encountered (e.g., AtomValenceException)"
      - name: timestamp
        type: string
        required: true
        description: "ISO8601 timestamp of the error"
      - name: source_hash
        type: string
        required: true
        description: "SHA256 hash of the source data file at the time of processing"

  analysis_results:
    description: "JSON file containing statistical analysis results"
    file: "data/processed/analysis_results.json"
    structure:
      status: "PASS|FAIL|WARN|SKIPPED"
      N: integer
      R2: float (nullable)
      p_values: object (nullable)
      coefficients: object (nullable)
      methodology: string
      timestamp: string (ISO8601)
      diagnostics:
        shapiro_wilk:
          stat: float
          p: float
        breusch_pagan:
          stat: float
          p: float

  gate_status:
    description: "Status of the data availability gate"
    file: "data/gate_status.json"
    structure:
      status: "PASS|FAIL"
      reason: string (optional, if FAIL)
      N: integer (optional, if FAIL)
      column_found: string (optional)

  reproducibility_log:
    description: "Machine-readable log for reproducibility"
    file: "reproducibility_log.json"
    structure:
      artifacts:
        - path: string
          hash: string
          lineage:
            source_path: string
            transformation: string
