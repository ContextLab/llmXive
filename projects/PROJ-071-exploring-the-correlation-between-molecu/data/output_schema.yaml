# Data Output Schema for PROJ-071
# Defines the structure for all generated CSV and JSON files

schemas:
  excluded_molecules:
    file: data/processed/excluded_molecules.csv
    description: Log of molecules that failed descriptor calculation
    columns:
      - name: smiles
        type: string
        required: true
        description: SMILES string of the failed molecule
      - name: error_type
        type: string
        required: true
        description: Type of error (e.g., AtomValenceException, MolSanitizeException)
      - name: timestamp
        type: iso8601
        required: true
        description: UTC timestamp of the failure
      - name: source_hash
        type: string
        required: true
        description: SHA256 hash of the source file containing the molecule

  gate_status:
    file: data/gate_status.json
    description: Data availability gate status
    fields:
      - name: status
        type: string
        required: true
        enum: [PASS, FAIL]
      - name: reason
        type: string
        required: false
      - name: N
        type: integer
        required: false
      - name: column_found
        type: string
        required: false

  stat_gate_status:
    file: data/stat_gate_status.json
    description: Statistical gate status (Standard Conditions)
    fields:
      - name: status
        type: string
        required: true
        enum: [PASS, FAIL]
      - name: reason
        type: string
        required: false
      - name: N_std
        type: integer
        required: false

  analysis_results:
    file: data/processed/analysis_results.json
    description: Results of correlation and regression analysis
    fields:
      - name: status
        type: string
        required: true
        enum: [PASS, FAIL, WARN, SKIPPED]
      - name: N
        type: integer
        required: true
      - name: R2
        type: float
        required: false
        nullable: true
      - name: p_values
        type: object
        required: false
        nullable: true
      - name: coefficients
        type: object
        required: false
        nullable: true
      - name: methodology
        type: string
        required: true
      - name: timestamp
        type: iso8601
        required: true
      - name: diagnostics
        type: object
        required: true
        properties:
          shapiro_wilk:
            type: object
            properties:
              stat: float
              p: float
          breusch_pagan:
            type: object
            properties:
              stat: float
              p: float

  reproducibility_log:
    file: data/reproducibility_log.json
    description: Machine-readable reproducibility log
    fields:
      - name: artifacts
        type: array
        required: true
        items:
          type: object
          properties:
            path: string
            hash: string
            lineage:
              type: object
              properties:
                source_path: string
                transformation: string
