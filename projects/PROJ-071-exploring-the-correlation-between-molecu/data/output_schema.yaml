# Data Output Schema for PROJ-071
# This file defines the expected structure for all output data artifacts.

schemas:
  merged_drugs:
    file: data/processed/merged_drugs.csv
    columns:
      - name: canonical_smiles
        type: string
        required: true
      - name: half_life
        type: float
        required: false
      - name: degradation_rate
        type: float
        required: false
      - name: tpsa
        type: float
        required: true
      - name: rotatable_bonds
        type: integer
        required: true
      - name: molecular_weight
        type: float
        required: true
      - name: aromatic_rings
        type: integer
        required: true
      - name: wiener_index
        type: float
        required: true
      - name: zagreb_index
        type: float
        required: true

  excluded_molecules:
    file: data/processed/excluded_molecules.csv
    columns:
      - name: smiles
        type: string
        required: true
      - name: error_type
        type: string
        required: true
      - name: timestamp
        type: string
        format: ISO8601
        required: true
      - name: source_hash
        type: string
        required: true

  analysis_results:
    file: data/processed/analysis_results.json
    schema:
      status: string (PASS|FAIL|WARN|SKIPPED)
      N: integer
      R2: float|null
      p_values: object|null
      coefficients: object|null
      methodology: string
      timestamp: string (ISO8601)
      diagnostics:
        shapiro_wilk:
          stat: float
          p: float
        breusch_pagan:
          stat: float
          p: float

  gate_status:
    file: data/gate_status.json
    schema:
      status: string (PASS|FAIL)
      reason: string|null
      N: integer|null
      column_found: string|null

  stat_gate_status:
    file: data/stat_gate_status.json
    schema:
      status: string (PASS|FAIL)
      reason: string|null
      N_std: integer|null

  reproducibility_log:
    file: data/reproducibility_log.json
    schema:
      artifacts:
        - path: string
          hash: string
          lineage:
            source_path: string
            transformation: string

  pipeline_metrics:
    file: data/output/pipeline_metrics.json
    schema:
      total_duration_seconds: float
      status: string (PASS|FAIL|WARN|SKIPPED)
      error_message: string|null
