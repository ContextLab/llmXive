# JSON Schema (YAML form) for a single cleaned NetFlow record.
$schema: "http://json-schema.org/draft-07/schema#"
title: NetFlow record
type: object
required:
  - src_ip
  - dst_ip
  - packets
  - start_time
  - label
additionalProperties: true
properties:
  src_ip:
    type: string
    description: SHA-256 hashed source IP address.
    minLength: 64
    maxLength: 64
  dst_ip:
    type: string
    description: SHA-256 hashed destination IP address.
    minLength: 64
    maxLength: 64
  packets:
    type: integer
    minimum: 0
    description: Packet count for the flow (edge weight).
  start_time:
    type: number
    description: Flow start time as a unix-style timestamp.
  duration:
    type: number
    minimum: 0
  bytes:
    type: integer
    minimum: 0
  label:
    type: integer
    enum: [0, 1]
    description: Ground-truth anomaly label (1 = botnet/anomalous).
