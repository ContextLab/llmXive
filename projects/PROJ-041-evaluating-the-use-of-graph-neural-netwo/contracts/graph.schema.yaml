# JSON Schema (YAML form) for the serialised communication graph.
$schema: "http://json-schema.org/draft-07/schema#"
title: Directed communication graph
type: object
required:
  - directed
  - nodes
  - edges
properties:
  directed:
    const: true
  multigraph:
    type: boolean
  nodes:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Hashed IP address (node identifier).
        is_anomaly:
          type: boolean
  edges:
    type: array
    items:
      type: object
      required:
        - source
        - target
        - weight
      properties:
        source:
          type: string
        target:
          type: string
        weight:
          type: integer
          minimum: 0
          description: Packet count aggregated over the flow.
        timestamp:
          type: number
