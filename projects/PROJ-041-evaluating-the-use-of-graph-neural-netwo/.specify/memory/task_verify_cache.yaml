  h: 863b1f7ab3c5033f0e814fda3ced9cc670bd2593106388d9384e92bcdd83d8f2
  r: "The core artifacts exist (directories, `__init__.py` files, `requirements.txt`,\
    \ `pyproject.toml`, `seed.py`, `memory_monitor.py`), but key requirements fail:\
    \ (1) `run_with_limit` is a simulated stand-in \u2014 it never executes a function\
    \ or performs a dummy allocation, it merely compares `limit_gb * 1024` against\
    \ the configured limit, so it cannot actually wrap work or enforce a real 7 GB\
    \ RAM constraint as specified; (2) `requirements.txt` pins `tracemalloc==0.1.0`,\
    \ a nonexistent PyPI package (tracemalloc is stdlib), and `torch==2.3.0+cpu` needs\
    \ an extra index URL, so `pip install -r requirements."
  sig: cf821ab069b325f5f86ce032dac650992541fc20df958d7a1d45f7d7a2535661
