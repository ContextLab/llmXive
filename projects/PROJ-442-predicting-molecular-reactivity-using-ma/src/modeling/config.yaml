# Configuration for Molecular Reactivity Prediction Pipeline
# Project: PROJ-442-predicting-molecular-reactivity-using-ma

# Logging configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/pipeline.log

# Data paths
data:
  raw_dir: data/raw
  processed_dir: data/processed
  models_dir: data/models
  input_file: uspto_mit_subset.jsonl.gz
  output_filtered: filtered_reactions.csv
  output_features: feature_matrix.parquet

# Reaction templates for classification (SMARTS patterns)
# These define the structural transformations for SN1, SN2, and Diels-Alder reactions
reaction_templates:
  SN1:
    # SN1: Heterolytic cleavage of C-LG bond forming a carbocation intermediate
    # Pattern: C-O bond breaking where O leaves as anion, C becomes cationic center
    # Example: R-OH -> R+ + OH- (simplified representation)
    pattern: "[C:1]([O:2])>>[C:1+]([O:2-])"
    description: "SN1 reaction: C-O bond heterolysis forming carbocation"

  SN2:
    # SN2: Concerted backside attack with inversion of configuration
    # Pattern: Nucleophile attacks C while LG leaves, transition state
    # Simplified: Nu-C-LG -> Nu-C + LG (with stereochemical inversion implied)
    pattern: "[N,O,F,Cl,Br,I:1][C:2][C,Cl,Br,I:3]>>[N,O,F,Cl,Br,I:1][C:2][C,Cl,Br,I:3]"
    description: "SN2 reaction: Concerted nucleophilic substitution"

  Diels-Alder:
    # Diels-Alder: [4+2] cycloaddition between diene and dienophile
    # Pattern: Two double bonds (diene) reacting with one double bond (dienophile)
    # to form a six-membered ring
    pattern: "[C:1]=[C:2].[C:3]=[C:4]>>[C:1]1[C:3][C:4][C:2]1"
    description: "Diels-Alder reaction: [4+2] cycloaddition forming cyclohexene"

# Model training parameters
model:
  algorithm: xgboost
  max_depth: 6
  learning_rate: 0.1
  n_estimators: 100
  objective: reg:squarederror
  subsample: 0.8
  colsample_bytree: 0.8
  n_jobs: -1

# Feature extraction settings
features:
  molecular_descriptors:
    - molecular_weight
    - num_atoms
    - num_bonds
    - num_rings
    - topological_polar_surface_area
    - logp
    - num_h_acceptors
    - num_h_donors
  fingerprint_type: morgan
  fingerprint_radius: 2
  fingerprint_length: 2048

# Dimensionality reduction
dimensionality_reduction:
  variance_threshold: 0.01
  select_k_best: 100
  scoring_function: f_regression

# Validation settings
validation:
  n_folds: 5
  loso_scaffold: true
  max_runtime_seconds: 1800

# Class filtering thresholds
filtering:
  min_samples_per_class: 1000
