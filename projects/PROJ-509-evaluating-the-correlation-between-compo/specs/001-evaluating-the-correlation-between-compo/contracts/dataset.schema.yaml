$schema: "http://json-schema.org/draft-07/schema#"
title: "ProcessedDatasetSchema"
description: "Schema for the cleaned and feature-engineered dataset used in model training."
type: "object"
properties:
  formula:
    type: "string"
    description: "Chemical formula of the compound."
  formation_energy_per_atom:
    type: "number"
    description: "Formation energy in eV/atom."
  crystal_system:
    type: "string"
    description: "Crystal system of the material."
  chemical_family:
    type: "string"
    description: "Chemical family classification for stratification."
  is_inorganic:
    type: "boolean"
    description: "Flag indicating if the compound is inorganic."
  mean_electronegativity:
    type: "number"
    description: "Mean electronegativity of constituent elements."
  var_electronegativity:
    type: "number"
    description: "Variance of electronegativity."
  mean_atomic_radius:
    type: "number"
    description: "Mean atomic radius."
  var_atomic_radius:
    type: "number"
    description: "Variance of atomic radius."
  mean_valence_electrons:
    type: "number"
    description: "Mean valence electron count."
  var_valence_electrons:
    type: "number"
    description: "Variance of valence electron count."
  mean_melting_point:
    type: "number"
    description: "Mean melting point."
  var_melting_point:
    type: "number"
    description: "Variance of melting point."
  mean_ionization_energy:
    type: "number"
    description: "Mean first ionization energy."
  var_ionization_energy:
    type: "number"
    description: "Variance of first ionization energy."
required:
  - formula
  - formation_energy_per_atom
  - chemical_family
  - mean_electronegativity
  - var_electronegativity
  - mean_atomic_radius
  - var_atomic_radius
  - mean_valence_electrons
  - var_valence_electrons
  - mean_melting_point
  - var_melting_point
  - mean_ionization_energy
  - var_ionization_energy
additionalProperties: false
