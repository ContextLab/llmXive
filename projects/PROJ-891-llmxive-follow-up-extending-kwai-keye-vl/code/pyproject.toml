[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-research"
version = "0.1.0"
description = "Automated science pipeline for llmXive: Kwai Keye-VL follow-up"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8.0,<5.0.0",
    "ffmpeg-python>=0.2.0,<0.3.0",
    "transformers>=4.35.0,<5.0.0",
    "optimum-intel>=1.10.0,<2.0.0",
    "llama-cpp-python>=0.2.0,<0.3.0",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.11.0,<2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "huggingface_hub>=0.19.0,<0.20.0",
    "psutil>=5.9.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "black>=23.0.0,<24.0.0",
    "ruff>=0.1.0,<0.2.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
# This section mirrors .ruff.toml for consistency if both are present,
# but .ruff.toml takes precedence or can be used for specific overrides.
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"