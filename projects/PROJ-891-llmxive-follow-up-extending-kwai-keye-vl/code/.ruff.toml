# Ruff configuration for llmXive project
# Configured for T003: Linting and Formatting setup

[lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # Line too long (handled by Black)
    "B008",  # Do not perform function call in argument defaults (common in tests)
    "SIM105", # Use `contextlib.suppress` instead of `try`/`except` (optional preference)
]

# Allow autofix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []

# Exclude a few paths from linting.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as `per-file-ignores`, but for specific files only.
per-file-ignores = {}

# Assume Python 3.11 (as per project plan)
target-version = "py311"

[lint.mccabe]
# Flag functions with high complexity.
max-complexity = 15

[lint.isort]
# Force a single newline after imports.
lines-after-imports = 2
known-first-party = ["src", "tests", "setup_data_dirs", "setup_env_limits", "setup_linting", "setup_model_cache", "setup_python_env", "setup_source_dirs"]