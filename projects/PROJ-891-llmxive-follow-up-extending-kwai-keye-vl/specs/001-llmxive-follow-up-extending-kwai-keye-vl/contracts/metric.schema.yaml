$schema: "http://json-schema.org/draft-07/schema#"
title: "Metric Evaluation Result Schema"
description: |
  Schema for evaluation results generated by the statistical analysis pipeline
  (src/analysis/mIoU.py, src/analysis/stats.py). Defines the structure for
  per-video mIoU scores, aggregated metrics, and statistical test outcomes.
type: object
required:
  - run_id
  - timestamp
  - metrics
  - statistical_tests
properties:
  run_id:
    type: string
    description: "Unique identifier for this evaluation run (e.g., UUID or timestamp-hash)"
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp when the analysis was completed"
  dataset_info:
    type: object
    description: "Metadata about the dataset used for evaluation"
    properties:
      source_dataset:
        type: string
        description: "Name of the source dataset (e.g., 'ActivityNet-Captions')"
      total_videos:
        type: integer
        description: "Total number of video clips evaluated"
      conditions:
        type: array
        items:
          type: string
        description: "List of conditions evaluated (e.g., 'extreme-aspect', 'square-cropped', 'original')"
        examples:
          - "extreme-aspect"
          - "square-cropped"
          - "original"
      aspect_ratios:
        type: array
        items:
          type: string
        description: "List of aspect ratios tested in the extreme-aspect condition"
        examples:
          - "1:10"
          - "10:1"
          - "1:20"
          - "20:1"
  metrics:
    type: object
    description: "Per-condition and per-video mIoU scores"
    required:
      - per_video
      - aggregated
    properties:
      per_video:
        type: array
        description: "List of mIoU scores for each individual video"
        items:
          type: object
          required:
            - video_id
            - condition
            - mIoU
            - prediction_start
            - prediction_end
            - ground_truth_start
            - ground_truth_end
          properties:
            video_id:
              type: string
              description: "Unique identifier for the video clip"
            condition:
              type: string
              description: "Condition under which this video was evaluated"
              enum:
                - "extreme-aspect"
                - "square-cropped"
                - "original"
            aspect_ratio:
              type: string
              description: "Aspect ratio if condition is 'extreme-aspect', otherwise null"
              nullable: true
              examples:
                - "1:10"
                - "10:1"
                - null
            mIoU:
              type: number
              format: float
              minimum: 0.0
              maximum: 1.0
              description: "Mean Intersection over Union score for this video"
            prediction_start:
              type: number
              format: float
              description: "Predicted start timestamp in seconds"
            prediction_end:
              type: number
              format: float
              description: "Predicted end timestamp in seconds"
            ground_truth_start:
              type: number
              format: float
              description: "Ground truth start timestamp in seconds"
            ground_truth_end:
              type: number
              format: float
              description: "Ground truth end timestamp in seconds"
      aggregated:
        type: object
        description: "Aggregated metrics by condition"
        required:
          - by_condition
        properties:
          by_condition:
            type: object
            description: "Metrics grouped by condition"
            additionalProperties:
              type: object
              required:
                - mean_mIoU
                - std_mIoU
                - min_mIoU
                - max_mIoU
                - count
              properties:
                mean_mIoU:
                  type: number
                  format: float
                  description: "Mean mIoU for this condition"
                std_mIoU:
                  type: number
                  format: float
                  description: "Standard deviation of mIoU for this condition"
                min_mIoU:
                  type: number
                  format: float
                  description: "Minimum mIoU for this condition"
                max_mIoU:
                  type: number
                  format: float
                  description: "Maximum mIoU for this condition"
                count:
                  type: integer
                  description: "Number of videos in this condition"
                median_mIoU:
                  type: number
                  format: float
                  description: "Median mIoU for this condition"
  statistical_tests:
    type: object
    description: "Results of statistical hypothesis tests"
    required:
      - paired_test
      - independent_test
    properties:
      paired_test:
        type: object
        description: "Results of the paired test (distorted vs square-cropped)"
        required:
          - test_name
          - statistic
          - p_value
          - significance
          - effect_size
        properties:
          test_name:
            type: string
            description: "Name of the statistical test performed"
            enum:
              - "paired_t_test"
              - "wilcoxon_signed_rank"
          normality_check:
            type: object
            description: "Shapiro-Wilk test results for normality assumption"
            required:
              - statistic
              - p_value
              - is_normal
            properties:
              statistic:
                type: number
                format: float
              p_value:
                type: number
                format: float
              is_normal:
                type: boolean
                description: "True if p-value > 0.05 (normal distribution assumed)"
          statistic:
            type: number
            format: float
            description: "Test statistic value"
          p_value:
            type: number
            format: float
            description: "P-value of the test"
          significance:
            type: boolean
            description: "True if p-value < 0.05 (statistically significant)"
          effect_size:
            type: number
            format: float
            description: "Effect size (e.g., Cohen's d or r)"
          conclusion:
            type: string
            description: "Human-readable conclusion statement"
      independent_test:
        type: object
        description: "Results of the independent test (original vs distorted)"
        required:
          - test_name
          - statistic
          - p_value
          - significance
          - effect_size
        properties:
          test_name:
            type: string
            description: "Name of the statistical test performed"
            enum:
              - "welch_t_test"
              - "mann_whitney_u"
          statistic:
            type: number
            format: float
            description: "Test statistic value"
          p_value:
            type: number
            format: float
            description: "P-value of the test"
          significance:
            type: boolean
            description: "True if p-value < 0.05 (statistically significant)"
          effect_size:
            type: number
            format: float
            description: "Effect size (e.g., Cohen's d or r)"
          conclusion:
            type: string
            description: "Human-readable conclusion statement"
  execution_metadata:
    type: object
    description: "Metadata about the execution environment and parameters"
    properties:
      python_version:
        type: string
      dependencies:
        type: object
        description: "Versions of key dependencies used"
        properties:
          scipy:
            type: string
          numpy:
            type: string
          pandas:
            type: string
      config:
        type: object
        description: "Configuration parameters used for the analysis"
        properties:
          alpha:
            type: number
            format: float
            description: "Significance level (default 0.05)"
          min_sample_size:
            type: integer
            description: "Minimum sample size required for statistical tests"