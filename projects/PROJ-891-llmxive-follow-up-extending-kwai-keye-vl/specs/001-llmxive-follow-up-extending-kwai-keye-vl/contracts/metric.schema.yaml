$schema: http://json-schema.org/draft-07/schema#
title: Evaluation Metrics Schema
description: |
  Schema for evaluation results (mIoU and statistical metrics) generated by the
  llmXive pipeline. This schema defines the structure for both individual video
  metrics (output of T026) and the aggregate statistical report (output of T027).

definitions:
  metric_record:
    type: object
    description: Individual video-level metric record
    required:
      - video_id
      - source_id
      - condition
      - mIoU
      - ground_truth_start
      - ground_truth_end
      - prediction_start
      - prediction_end
      - iou_score
    properties:
      video_id:
        type: string
        description: Unique identifier for the video clip
      source_id:
        type: string
        description: |
          The mandatory join key linking this record to its original source
          (from T007a dataset.schema). Used for Paired test linking.
      condition:
        type: string
        description: The experimental condition this video belongs to
        enum:
          - extreme_aspect_ratio
          - square_cropped
          - original_unmodified
      mIoU:
        type: number
        description: Mean Intersection over Union for this clip (0.0 to 1.0)
      ground_truth_start:
        type: number
        description: Start timestamp of the ground truth segment (seconds)
      ground_truth_end:
        type: number
        description: End timestamp of the ground truth segment (seconds)
      prediction_start:
        type: number
        description: Start timestamp of the predicted segment (seconds)
      prediction_end:
        type: number
        description: End timestamp of the predicted segment (seconds)
      iou_score:
        type: number
        description: Raw IoU score for this specific prediction (0.0 to 1.0)
      exclusion_reason:
        type: string
        nullable: true
        description: If the clip was excluded from scoring, the reason why

  statistical_report:
    type: object
    description: Aggregate statistical analysis report
    required:
      - primary_test
      - secondary_test
      - summary_statistics
      - metadata
    properties:
      primary_test:
        type: object
        description: Paired test results (Distorted vs Square-Cropped)
        required:
          - test_type
          - statistic
          - p_value
          - significance
          - sample_size
        properties:
          test_type:
            type: string
            description: Name of the statistical test used (e.g., "Wilcoxon signed-rank")
          statistic:
            type: number
            description: Test statistic value
          p_value:
            type: number
            description: P-value from the test
          significance:
            type: boolean
            description: True if p < 0.05
          sample_size:
            type: integer
            description: Number of paired samples used
          effect_size:
            type: number
            nullable: true
            description: Calculated effect size (e.g., r or Cohen's d)
          normality_check:
            type: object
            description: Results of Shapiro-Wilk normality test
            required:
              - statistic
              - p_value
              - is_normal
            properties:
              statistic:
                type: number
              p_value:
                type: number
              is_normal:
                type: boolean

      secondary_test:
        type: object
        description: Independent test results (Original vs Distorted)
        required:
          - test_type
          - statistic
          - p_value
          - significance
          - sample_size_1
          - sample_size_2
        properties:
          test_type:
            type: string
            description: Name of the statistical test used (e.g., "Mann-Whitney U")
          statistic:
            type: number
          p_value:
            type: number
          significance:
            type: boolean
          sample_size_1:
            type: integer
            description: Sample size of Original group
          sample_size_2:
            type: integer
            description: Sample size of Distorted group
          effect_size:
            type: number
            nullable: true

      summary_statistics:
        type: object
        description: Descriptive statistics per condition
        required:
          - extreme_aspect_ratio
          - square_cropped
          - original_unmodified
        properties:
          extreme_aspect_ratio:
            type: object
            required: [mean, median, std, min, max, count]
            properties:
              mean: {type: number}
              median: {type: number}
              std: {type: number}
              min: {type: number}
              max: {type: number}
              count: {type: integer}
          square_cropped:
            type: object
            required: [mean, median, std, min, max, count]
            properties:
              mean: {type: number}
              median: {type: number}
              std: {type: number}
              min: {type: number}
              max: {type: number}
              count: {type: integer}
          original_unmodified:
            type: object
            required: [mean, median, std, min, max, count]
            properties:
              mean: {type: number}
              median: {type: number}
              std: {type: number}
              min: {type: number}
              max: {type: number}
              count: {type: integer}

      metadata:
        type: object
        required:
          - generated_at
          - pipeline_version
          - alpha_threshold
        properties:
          generated_at:
            type: string
            format: date-time
          pipeline_version:
            type: string
          alpha_threshold:
            type: number
            default: 0.05

# Top-level schema for the metrics CSV (array of metric_record)
# Note: JSON Schema doesn't natively support CSV, but this defines the row structure.
# The CSV file `data/outputs/metrics.csv` must contain headers matching the properties
# of `metric_record` (excluding `exclusion_reason` if not applicable).

# Top-level schema for the statistical report JSON
$ref: "#/definitions/statistical_report"