$schema: http://json-schema.org/draft-07/schema#
title: Kwai Keye-VL Temporal Grounding Prediction Schema
description: >
  Schema for inference output from the Kwai Keye-VL model (INT4 quantized)
  running on the extreme aspect ratio distorted and control video datasets.
  This schema defines the structure of prediction JSON files generated by
  `src/inference/run_inference.py`.

type: object
required:
  - run_id
  - model_checkpoint
  - quantization_level
  - hardware_config
  - predictions

properties:
  run_id:
    type: string
    description: Unique identifier for the inference run (UUID or timestamp-based).
    pattern: "^[a-zA-Z0-9_-]+$"
    example: "run_20231027_153000_cpu_int4"

  model_checkpoint:
    type: string
    description: Full HuggingFace model ID or local path used for inference.
    example: "Kwai-Kyle/Kwai-Keye-VL-2.0-Int4"

  quantization_level:
    type: string
    description: Quantization configuration used (e.g., INT4, FP16 fallback).
    enum:
      - INT4
      - FP16_vision_INT4_llm
      - FP16_full
    example: "INT4"

  hardware_config:
    type: object
    description: Hardware environment details for reproducibility.
    required:
      - device
      - cpu_cores
      - memory_limit_bytes
      - time_limit_seconds
    properties:
      device:
        type: string
        enum:
          - cpu
          - cuda
        example: "cpu"
      cpu_cores:
        type: integer
        minimum: 1
        description: Number of CPU cores allocated.
        example: 16
      memory_limit_bytes:
        type: integer
        minimum: 1
        description: Memory limit enforced by cgroups/ulimit (e.g., 7GB in bytes).
        example: 7340032000
      time_limit_seconds:
        type: integer
        minimum: 1
        description: Time limit for the inference process.
        example: 3600

  metadata:
    type: object
    description: Additional context about the execution environment.
    properties:
      python_version:
        type: string
        example: "3.11.5"
      library_versions:
        type: object
        properties:
          transformers:
            type: string
          optimum_intel:
            type: string
          llama_cpp_python:
            type: string
          torch:
            type: string
        required:
          - transformers
          - torch

  predictions:
    type: array
    description: List of prediction results for each video clip.
    items:
      type: object
      required:
        - video_id
        - source_id
        - condition
        - aspect_ratio
        - predicted_start
        - predicted_end
        - ground_truth_start
        - ground_truth_end
        - status
      properties:
        video_id:
          type: string
          description: Unique ID of the processed video file (filename without extension).
          example: "distorted_10_1_video_001"
        
        source_id:
          type: string
          description: ID of the original ActivityNet clip this was derived from.
          example: "v_00123456"
        
        condition:
          type: string
          description: Experimental condition of the video.
          enum:
            - extreme_aspect_ratio_1_10
            - extreme_aspect_ratio_10_1
            - extreme_aspect_ratio_1_20
            - extreme_aspect_ratio_20_1
            - square_crop
            - original_unmodified
          example: "extreme_aspect_ratio_10_1"
        
        aspect_ratio:
          type: number
          description: The aspect ratio (width/height) of the processed video.
          minimum: 0.01
          maximum: 100.0
          example: 10.0
        
        predicted_start:
          type: number
          description: Predicted start timestamp in seconds.
          minimum: 0.0
          example: 12.5
        
        predicted_end:
          type: number
          description: Predicted end timestamp in seconds.
          minimum: 0.0
          exclusiveMinimum: false
          example: 24.3
        
        ground_truth_start:
          type: number
          description: Ground truth start timestamp from ActivityNet annotations.
          minimum: 0.0
          example: 12.0
        
        ground_truth_end:
          type: number
          description: Ground truth end timestamp from ActivityNet annotations.
          minimum: 0.0
          exclusiveMinimum: false
          example: 25.0
        
        status:
          type: string
          description: Status of the prediction generation.
          enum:
            - success
            - timeout
            - oom_error
            - inference_error
            - fallback_triggered
          example: "success"
        
        error_message:
          type: string
          description: Error details if status is not 'success'.
          nullable: true
          example: "Inference timed out after 60s"
        
        duration_seconds:
          type: number
          description: Time taken to process this specific video clip.
          minimum: 0.0
          nullable: true
          example: 45.2

  summary_stats:
    type: object
    description: Aggregate statistics computed at the end of the run.
    properties:
      total_videos:
        type: integer
        minimum: 0
      successful_predictions:
        type: integer
        minimum: 0
      failed_predictions:
        type: integer
        minimum: 0
      avg_inference_time_seconds:
        type: number
        nullable: true
      peak_memory_bytes:
        type: integer
        nullable: true
        description: Peak memory usage observed during the run.
      fallback_count:
        type: integer
        minimum: 0
        description: Number of times FP16 vision fallback was triggered.