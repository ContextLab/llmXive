$schema: http://json-schema.org/draft-07/schema#
title: Inference Prediction Schema
description: >
  Schema for temporal grounding predictions generated by the Kwai Keye-VL model.
  Used to store start/end timestamps, confidence scores, and metadata linkage.
type: object
required:
  - video_id
  - original_video_id
  - condition
  - predictions
  - model_info
  - timestamp
properties:
  video_id:
    type: string
    description: Unique identifier for the processed video clip (includes distortion info).
    pattern: "^[a-zA-Z0-9_-]+$"
  
  original_video_id:
    type: string
    description: The ID of the source ActivityNet video before distortion.
  
  condition:
    type: string
    description: The experimental condition applied to this video.
    enum:
      - extreme_aspect_ratio
      - square_cropped
      - original_unmodified
    examples:
      - "extreme_aspect_ratio_1:10"
      - "square_cropped"
      - "original_unmodified"
  
  distortion_params:
    type: object
    description: Parameters of the geometric distortion applied, if applicable.
    properties:
      target_aspect_ratio:
        type: string
        description: Target aspect ratio string (e.g., "1:10", "10:1", "1:20").
      original_dimensions:
        type: object
        properties:
          width:
            type: integer
            minimum: 1
          height:
            type: integer
            minimum: 1
      distorted_dimensions:
        type: object
        properties:
          width:
            type: integer
            minimum: 1
          height:
            type: integer
            minimum: 1
    required:
      - target_aspect_ratio
      - original_dimensions
      - distorted_dimensions
  
  predictions:
    type: array
    description: List of temporal grounding predictions for the video.
    items:
      type: object
      required:
        - start_time
        - end_time
        - confidence
      properties:
        start_time:
          type: number
          description: Start timestamp in seconds relative to video start.
          minimum: 0
        end_time:
          type: number
          description: End timestamp in seconds relative to video start.
          minimum: 0
          exclusiveMinimum: 0
        confidence:
          type: number
          description: Model confidence score for this prediction.
          minimum: 0.0
          maximum: 1.0
        description:
          type: string
          description: Optional natural language description of the grounded segment.
        metadata:
          type: object
          description: Additional model-specific metadata.
          additionalProperties: true
  
  ground_truth:
    type: object
    description: Ground truth annotations from the original dataset.
    properties:
      start_time:
        type: number
        minimum: 0
      end_time:
        type: number
        minimum: 0
        exclusiveMinimum: 0
      description:
        type: string
  
  model_info:
    type: object
    description: Information about the model and inference configuration.
    required:
      - model_name
      - model_version
      - quantization
      - device
    properties:
      model_name:
        type: string
        example: "Kwai-Kyle/Kwai-Keye-VL-2.0-Int4"
      model_version:
        type: string
        description: Specific version or commit hash of the model.
      quantization:
        type: string
        enum:
          - int4
          - int8
          - fp16
          - fp32
        description: Quantization level used for inference.
      device:
        type: string
        enum:
          - cpu
          - cuda
          - mps
        description: Hardware device used for inference.
      inference_engine:
        type: string
        description: Engine used for inference (e.g., "llama.cpp", "optimum-intel").
      memory_peak_mb:
        type: number
        description: Peak memory usage in MB during inference (if monitored).
      inference_time_seconds:
        type: number
        description: Time taken for inference in seconds.
  
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the prediction was generated.
  
  execution_status:
    type: string
    enum:
      - success
      - partial_success
      - failed
    description: Overall status of the inference execution.
  
  error_info:
    type: object
    description: Error details if execution failed or was partial.
    properties:
      error_code:
        type: string
      error_message:
        type: string
      fallback_used:
        type: boolean
        description: Whether a fallback (e.g., FP16 vision) was triggered.
        default: false
  
  mIoU:
    type: number
    description: Mean Intersection-over-Union score between prediction and ground truth (calculated post-hoc).
    minimum: 0.0
    maximum: 1.0
  
  _schema_version:
    type: string
    const: "1.0.0"
    description: Version of this schema.