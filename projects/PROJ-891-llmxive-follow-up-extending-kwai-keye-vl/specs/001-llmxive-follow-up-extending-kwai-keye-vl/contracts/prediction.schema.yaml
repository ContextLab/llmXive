%YAML 1.2
---
$schema: http://json-schema.org/draft-07/schema#
title: Kwai Keye-VL Temporal Grounding Prediction Schema
description: >
  Schema for inference outputs from the Kwai Keye-VL model on the 
  extreme-aspect-ratio robustness benchmark. Defines the structure of 
  predicted start/end timestamps and associated metadata.
type: object
required:
  - video_id
  - condition
  - prediction
  - metadata
properties:
  video_id:
    type: string
    description: >
      Unique identifier for the source video clip. 
      Must match IDs in data/raw/original/ and data/distorted/ metadata.
    pattern: "^[a-zA-Z0-9_-]+$"
  
  condition:
    type: string
    description: >
      The experimental condition under which this video was processed.
    enum:
      - extreme_aspect_ratio
      - square_cropped
      - original_unmodified
  
  prediction:
    type: object
    description: The model's predicted temporal grounding.
    required:
      - start
      - end
    properties:
      start:
        type: number
        description: >
          Predicted start timestamp in seconds relative to video start.
          Must be >= 0 and < video_duration.
        minimum: 0
      end:
        type: number
        description: >
          Predicted end timestamp in seconds relative to video start.
          Must be > start and <= video_duration.
        minimum: 0
      confidence:
        type: number
        description: >
          Model confidence score for the prediction (if available).
          Range [0, 1]. Null if not provided by model.
        minimum: 0
        maximum: 1
        nullable: true
  
  metadata:
    type: object
    description: Execution and environmental metadata.
    required:
      - model_version
      - inference_timestamp
      - hardware_info
    properties:
      model_version:
        type: string
        description: Version string of the Kwai Keye-VL model used (e.g., "2.0-Int4").
      quantization_level:
        type: string
        description: Quantization configuration used (e.g., "INT4", "FP16_Vision_INT4_LLM").
      inference_timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp when inference was executed.
      hardware_info:
        type: string
        description: Description of hardware used (e.g., "CPU-Intel-i9-13900K").
      memory_peak_kb:
        type: integer
        description: Peak VmRSS in KB during inference (from cgroups/monitoring).
        minimum: 0
      duration_ms:
        type: integer
        description: Inference duration in milliseconds.
        minimum: 0
      error:
        type: string
        description: Error message if inference failed, otherwise null.
        nullable: true
      fallback_applied:
        type: boolean
        description: True if a fallback (e.g., FP16 vision) was triggered.

examples:
  - video_id: "ActivityNet_12345_clip_001"
    condition: "extreme_aspect_ratio"
    prediction:
      start: 12.5
      end: 18.2
      confidence: 0.87
    metadata:
      model_version: "Kwai-Keye-VL-2.0-Int4"
      quantization_level: "INT4"
      inference_timestamp: "2024-01-15T10:30:00Z"
      hardware_info: "CPU-Intel-i9-13900K"
      memory_peak_kb: 6500000
      duration_ms: 4500
      error: null
      fallback_applied: false

  - video_id: "ActivityNet_67890_clip_002"
    condition: "original_unmodified"
    prediction:
      start: 5.0
      end: 10.0
      confidence: null
    metadata:
      model_version: "Kwai-Keye-VL-2.0-Int4"
      quantization_level: "FP16_Vision_INT4_LLM"
      inference_timestamp: "2024-01-15T10:35:00Z"
      hardware_info: "CPU-Intel-i9-13900K"
      memory_peak_kb: 6800000
      duration_ms: 5200
      error: null
      fallback_applied: true