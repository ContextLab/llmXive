$schema: http://json-schema.org/draft-07/schema#
title: Inference Prediction Schema
description: |
  Schema for temporal grounding predictions generated by the Kwai Keye-VL model
  on extreme-aspect ratio distorted, square-cropped, and original video clips.
  This schema is used to validate the output of `src/inference/run_inference.py`
  before statistical analysis (T026).

type: object
required:
  - predictions
  - metadata

properties:
  metadata:
    type: object
    description: Run-level metadata for reproducibility and tracking.
    required:
      - model_id
      - quantization_level
      - execution_environment
      - timestamp
    properties:
      model_id:
        type: string
        description: The specific model checkpoint used (e.g., Kwai-Kyle/Kwai-Keye-VL-2.0-Int4).
      quantization_level:
        type: string
        enum: [INT4, FP16, FP32]
        description: The quantization level used for this inference run.
      execution_environment:
        type: string
        enum: [CPU, GPU, CPU_FALLBACK]
        description: The hardware environment where inference was executed.
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the inference run started.
      config_hash:
        type: string
        description: A hash of the inference configuration parameters for reproducibility.
      fallback_events:
        type: integer
        default: 0
        description: Count of clips that required fallback to full FP16 (FR-002).

  predictions:
    type: array
    description: |
      List of prediction records, one per processed video clip.
      Each record links the prediction back to the source via `source_id`.
    items:
      type: object
      required:
        - video_id
        - source_id
        - condition
        - start_time
        - end_time
        - confidence
        - processing_time_ms
      properties:
        video_id:
          type: string
          description: |
            Unique identifier for the processed video clip (e.g., 'distorted_10_1_abc123.mp4').
            This matches the filename in `data/distorted/` or `output/control/`.
        source_id:
          type: string
          description: |
            The join key linking this prediction to the original ActivityNet Captions entry.
            This MUST match the `source_id` in `data/metadata/generation_metadata.csv`
            and `specs/001-extreme-aspect-ratio-robustness/contracts/dataset.schema.yaml`.
            Used for Paired statistical tests (T027).
        condition:
          type: string
          enum: [extreme_aspect, square_cropped, original]
          description: |
            The condition under which the video was processed.
            - 'extreme_aspect': Distorted video (1:10, 10:1, 1:20, 20:1).
            - 'square_cropped': Square-cropped control from `output/control/`.
            - 'original': Unmodified original from `data/raw/original/`.
        start_time:
          type: number
          minimum: 0
          description: |
            Predicted start timestamp of the event in seconds relative to video start.
            Must be less than `end_time`.
        end_time:
          type: number
          minimum: 0
          description: |
            Predicted end timestamp of the event in seconds relative to video start.
            Must be greater than `start_time` and less than video duration.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Model confidence score for the prediction (0.0 to 1.0).
            If the model does not output a confidence, this may be a default value (e.g., 1.0) or NaN.
        processing_time_ms:
          type: number
          minimum: 0
          description: Wall-clock time taken to process this specific clip in milliseconds.
        fallback_mode:
          type: boolean
          default: false
          description: |
            True if this specific clip required a fallback to full FP16 due to INT4 failure.
        error_message:
          type: string
          nullable: true
          description: |
            If inference failed for this clip, the error message is logged here.
            If successful, this field is null.

examples:
  - metadata:
      model_id: "Kwai-Kyle/Kwai-Keye-VL-2.0-Int4"
      quantization_level: "INT4"
      execution_environment: "CPU"
      timestamp: "2023-10-27T10:00:00Z"
      config_hash: "a1b2c3d4"
      fallback_events: 2
    predictions:
      - video_id: "distorted_10_1_activitynet_123.mp4"
        source_id: "activitynet_123"
        condition: "extreme_aspect"
        start_time: 12.5
        end_time: 18.2
        confidence: 0.85
        processing_time_ms: 4500
        fallback_mode: false
        error_message: null
      - video_id: "control_square_activitynet_123.mp4"
        source_id: "activitynet_123"
        condition: "square_cropped"
        start_time: 12.5
        end_time: 18.2
        confidence: 0.92
        processing_time_ms: 3200
        fallback_mode: false
        error_message: null