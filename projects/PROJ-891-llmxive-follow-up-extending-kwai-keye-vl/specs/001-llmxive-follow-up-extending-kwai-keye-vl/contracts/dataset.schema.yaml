$schema: http://json-schema.org/draft-07/schema#
title: Synthetic Video Metadata Schema
description: >
  Schema for metadata generated during the extreme aspect ratio distortion
  pipeline. This schema defines the structure of the CSV/JSON records linking
  distorted videos, square-cropped controls, and original source clips.
  
  CRITICAL: The `source_id` field is the mandatory join key used to link
  Distorted and Square-Cropped pairs for the Primary Paired Statistical Test.
type: object
required:
  - source_id
  - video_id
  - condition
  - aspect_ratio
  - distortion_type
  - original_duration
  - original_width
  - original_height
  - distorted_width
  - distorted_height
  - fps
  - file_path
  - timestamp_start
  - timestamp_end
  - fr_001_passed
  - exclusion_reason
properties:
  source_id:
    type: string
    description: >
      Unique identifier from the source dataset (ActivityNet Captions).
      This is the PRIMARY JOIN KEY for linking Distorted and Square-Cropped
      pairs in the statistical analysis (User Story 3).
    minLength: 1
    pattern: "^[a-zA-Z0-9_-]+$"
    
  video_id:
    type: string
    description: Unique identifier for this specific generated clip (e.g., source_id_condition_timestamp).
    minLength: 1
    
  condition:
    type: string
    description: The experimental condition of this clip.
    enum:
      - distorted_extreme
      - control_square
      - original_unmodified
    examples:
      - distorted_extreme
      - control_square
      
  aspect_ratio:
    type: string
    description: >
      The aspect ratio configuration applied.
      For distorted clips: "1:10", "10:1", "1:20", "20:1".
      For control clips: "1:1".
      For original: "native".
    examples:
      - "1:10"
      - "10:1"
      - "1:1"
      - "native"
      
  distortion_type:
    type: string
    description: The type of geometric distortion applied.
    enum:
      - stretch
      - crop
      - none
    examples:
      - stretch
      - crop
      - none
      
  original_duration:
    type: number
    description: Duration of the source clip in seconds.
    minimum: 0
    
  original_width:
    type: integer
    description: Width of the source clip in pixels.
    minimum: 1
    
  original_height:
    type: integer
    description: Height of the source clip in pixels.
    minimum: 1
    
  distorted_width:
    type: integer
    description: Width of the generated clip in pixels.
    minimum: 1
    
  distorted_height:
    type: integer
    description: Height of the generated clip in pixels.
    minimum: 1
    
  fps:
    type: number
    description: Frames per second of the generated clip.
    minimum: 0.1
    
  file_path:
    type: string
    description: Relative path to the generated video file from the project root.
    minLength: 1
    
  timestamp_start:
    type: number
    description: Start timestamp of the clip relative to the original video (seconds).
    minimum: 0
    
  timestamp_end:
    type: number
    description: End timestamp of the clip relative to the original video (seconds).
    minimum: 0
    
  fr_001_passed:
    type: boolean
    description: >
      Result of the Bounding Box Integrity Check (FR-001).
      True if the primary subject (largest contour) was preserved (>5% area).
      False if the subject was lost or unresolvable.
      
  exclusion_reason:
    type: ["string", "null"]
    description: >
      If fr_001_passed is false, this field contains the reason for exclusion.
      Examples: "subject_area_reduction_gt_95pct", "no_contour_found", "unresolvable_line".
      Null if the clip was included.
    examples:
      - "subject_area_reduction_gt_95pct"
      - "no_contour_found"
      - null
      
  metadata_source:
    type: string
    description: The original dataset source identifier.
    const: "ActivityNet-Captions"
    
  generation_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp when this metadata record was created.
    
  checksum:
    type: ["string", "null"]
    description: Optional SHA-256 checksum of the video file.
additionalProperties: false
examples:
  - source_id: "v_12345"
    video_id: "v_12345_distorted_1_10"
    condition: "distorted_extreme"
    aspect_ratio: "1:10"
    distortion_type: "stretch"
    original_duration: 15.5
    original_width: 1920
    original_height: 1080
    distorted_width: 192
    distorted_height: 1080
    fps: 30.0
    file_path: "data/distorted/v_12345_distorted_1_10.mp4"
    timestamp_start: 10.0
    timestamp_end: 25.5
    fr_001_passed: true
    exclusion_reason: null
    metadata_source: "ActivityNet-Captions"
    generation_timestamp: "2023-10-27T10:00:00Z"
  - source_id: "v_12345"
    video_id: "v_12345_control_square"
    condition: "control_square"
    aspect_ratio: "1:1"
    distortion_type: "crop"
    original_duration: 15.5
    original_width: 1920
    original_height: 1080
    distorted_width: 1080
    distorted_height: 1080
    fps: 30.0
    file_path: "output/control/v_12345_control_square.mp4"
    timestamp_start: 10.0
    timestamp_end: 25.5
    fr_001_passed: true
    exclusion_reason: null
    metadata_source: "ActivityNet-Captions"
    generation_timestamp: "2023-10-27T10:00:05Z"
  - source_id: "v_12345"
    video_id: "v_12345_excluded"
    condition: "distorted_extreme"
    aspect_ratio: "20:1"
    distortion_type: "stretch"
    original_duration: 15.5
    original_width: 1920
    original_height: 1080
    distorted_width: 21600
    distorted_height: 1080
    fps: 30.0
    file_path: null
    timestamp_start: 10.0
    timestamp_end: 25.5
    fr_001_passed: false
    exclusion_reason: "subject_area_reduction_gt_95pct"
    metadata_source: "ActivityNet-Captions"
    generation_timestamp: "2023-10-27T10:00:10Z"