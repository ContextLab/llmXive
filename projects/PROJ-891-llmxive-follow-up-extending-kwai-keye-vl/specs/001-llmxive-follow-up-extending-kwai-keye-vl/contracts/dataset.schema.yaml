$schema: http://json-schema.org/draft-07/schema#
title: Synthetic Video Dataset Metadata Schema
description: >
  Schema for metadata generated by the synthetic video benchmark pipeline.
  This schema defines the structure of the metadata CSV/JSON files that map
  distorted videos to their original ActivityNet Captions source clips,
  including distortion parameters and validation results.
type: object
required:
  - video_id
  - original_video_id
  - original_timestamp_start
  - original_timestamp_end
  - distortion_type
  - target_aspect_ratio
  - output_path
  - original_dimensions
  - output_dimensions
  - frame_rate
  - duration_seconds
  - fr001_check_passed
  - generated_at
properties:
  video_id:
    type: string
    description: Unique identifier for the generated distorted video (e.g., 'distorted_<original_id>_<ratio>')
    pattern: "^distorted_[a-zA-Z0-9_-]+_\\d+:\\d+$"
  
  original_video_id:
    type: string
    description: The ID of the source ActivityNet Captions video
    minLength: 1
  
  original_timestamp_start:
    type: number
    description: Start timestamp (in seconds) of the clip in the original video
    minimum: 0
  
  original_timestamp_end:
    type: number
    description: End timestamp (in seconds) of the clip in the original video
    minimum: 0
    exclusiveMinimum: true
  
  distortion_type:
    type: string
    description: Type of geometric distortion applied
    enum:
      - extreme_vertical_compression
      - extreme_horizontal_compression
      - extreme_vertical_stretch
      - extreme_horizontal_stretch
      - square_crop_control
  
  target_aspect_ratio:
    type: string
    description: Target aspect ratio as a string ratio (e.g., "1:10", "10:1", "1:20", "20:1", "1:1")
    pattern: "^\\d+:\\d+$"
  
  output_path:
    type: string
    description: Relative path to the generated video file from the project root
    pattern: "^data/(distorted|control)/"
  
  original_dimensions:
    type: object
    description: Original video dimensions (width, height)
    required:
      - width
      - height
    properties:
      width:
        type: integer
        minimum: 1
      height:
        type: integer
        minimum: 1
  
  output_dimensions:
    type: object
    description: Output video dimensions after distortion
    required:
      - width
      - height
    properties:
      width:
        type: integer
        minimum: 1
      height:
        type: integer
        minimum: 1
  
  frame_rate:
    type: number
    description: Frame rate of the output video
    minimum: 1
    maximum: 120
  
  duration_seconds:
    type: number
    description: Duration of the video clip in seconds
    minimum: 0.1
  
  fr001_check_passed:
    type: boolean
    description: >
      Result of FR-001 bounding box integrity check. True if the primary subject
      bounding box area was reduced by <= 95% during distortion. False otherwise.
      For square_crop_control, this should always be True.
  
  fr001_reason:
    type: string
    description: Optional explanation for FR-001 failure or success
    minLength: 0
  
  primary_subject_bbox:
    type: array
    description: >
      Bounding box of the primary subject [x_min, y_min, x_max, y_max] in the
      original video coordinates. Null if detection failed or not applicable.
    items:
      type: number
    minItems: 4
    maxItems: 4
  
  generation_status:
    type: string
    description: Status of the generation process
    enum:
      - success
      - failed
      - skipped
      - excluded
  
  failure_reason:
    type: string
    description: Reason for failure or exclusion if status is not 'success'
    minLength: 0
  
  generated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the video was generated
  
  source_url:
    type: string
    description: URL of the original video source (if applicable)
    format: uri
    minLength: 1
  
  metadata_version:
    type: string
    description: Schema version for this metadata file
    const: "1.0.0"
  
  notes:
    type: string
    description: Optional notes about the generation process
    minLength: 0
additionalProperties: false