# Dataset Schema for Extreme Aspect Ratio Robustness Benchmark
# This schema defines the metadata structure for generated synthetic video clips.
# It is used to link Distorted and Square-Cropped pairs via the `source_id` key
# to enable Paired Statistical Tests (US3).
#
# Source: Kwai Keye-VL-2.0 Technical Report Follow-up
# Project: llmXive

$schema: "http://json-schema.org/draft-07/schema#"
title: "ExtremeAspectRatioDatasetMetadata"
description: "Metadata schema for video clips generated from ActivityNet Captions with extreme aspect ratio distortions."

type: object
required:
  - source_id
  - clip_id
  - condition
  - aspect_ratio
  - duration_seconds
  - original_dimensions
  - output_dimensions
  - distortion_params
  - generation_timestamp
  - file_path

properties:
  source_id:
    type: string
    description: |
      Unique identifier for the original source video/clip from ActivityNet Captions.
      THIS IS THE MANDATORY JOIN KEY for linking Distorted and Square-Cropped pairs
      for Paired Statistical Tests (US3).
      Format: "activitynet_{video_id}_{start}_{end}" or similar unique source reference.
    minLength: 1

  clip_id:
    type: string
    description: "Unique identifier for this specific generated clip instance."
    pattern: "^[a-zA-Z0-9_-]+$"

  condition:
    type: string
    description: "The experimental condition of this clip."
    enum:
      - "distorted"
      - "square_cropped"
      - "original" # Used for reference/validation only

  aspect_ratio:
    type: object
    description: "The aspect ratio of the clip (width / height)."
    required:
      - width
      - height
      - ratio_float
    properties:
      width:
        type: integer
        minimum: 1
      height:
        type: integer
        minimum: 1
      ratio_float:
        type: number
        description: "Calculated width/height ratio (e.g., 0.1 for 1:10, 10.0 for 10:1)."

  duration_seconds:
    type: number
    description: "Duration of the video clip in seconds."
    minimum: 0.1

  original_dimensions:
    type: object
    description: "Dimensions of the source video before distortion/cropping."
    required:
      - width
      - height
    properties:
      width:
        type: integer
      height:
        type: integer

  output_dimensions:
    type: object
    description: "Final dimensions of the generated video file."
    required:
      - width
      - height
    properties:
      width:
        type: integer
      height:
        type: integer

  distortion_params:
    type: object
    description: "Parameters used to generate this specific clip."
    properties:
      method:
        type: string
        description: "Method used (e.g., 'ffmpeg_scale', 'opencv_resize', 'center_crop')."
        enum:
          - "ffmpeg_scale"
          - "opencv_resize"
          - "center_crop"
          - "none"
      target_aspect_ratio:
        type: string
        description: "Target aspect ratio string (e.g., '1:10', '10:1', '1:1')."
      primary_subject_bbox_area_ratio:
        type: number
        description: |
          Ratio of the primary subject's bounding box area after distortion vs original.
          Used for FR-001 compliance check. If < 0.05 (95% reduction), clip should be excluded.
          Null if not calculated or condition is 'original'.
        minimum: 0.0
        maximum: 1.0
      excluded_reason:
        type: ["string", "null"]
        description: "Reason for exclusion if FR-001 or other checks failed."

  generation_timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of when the clip was generated."

  file_path:
    type: string
    description: "Relative path to the video file from the project root."
    pattern: "^(data/distorted/|output/control/).*\\.mp4$"

  metadata_source:
    type: string
    description: "Identifier of the source dataset entry (e.g., HuggingFace dataset ID)."
    default: "activitynet-captions"

  quality_checks:
    type: object
    description: "Results of automated quality checks performed post-generation."
    properties:
      codec:
        type: string
        description: "Video codec used (e.g., 'h264')."
      fps:
        type: number
        description: "Frames per second."
      is_resolvable:
        type: boolean
        description: "True if clip is not a 1-pixel line or unresolvable."
      has_audio:
        type: boolean
        description: "Whether the clip retains audio (usually false for distorted)."

additionalProperties: false

# Example entries for reference
examples:
  - source_id: "activitynet_v1.3_12345_10.0_20.0"
    clip_id: "dist_12345_10_20_1_10"
    condition: "distorted"
    aspect_ratio:
      width: 100
      height: 1000
      ratio_float: 0.1
    duration_seconds: 10.0
    original_dimensions:
      width: 1920
      height: 1080
    output_dimensions:
      width: 100
      height: 1000
    distortion_params:
      method: "ffmpeg_scale"
      target_aspect_ratio: "1:10"
      primary_subject_bbox_area_ratio: 0.45
    generation_timestamp: "2023-10-27T10:00:00Z"
    file_path: "data/distorted/activitynet_v1.3_12345_10.0_20.0_1_10.mp4"
    quality_checks:
      codec: "h264"
      fps: 24.0
      is_resolvable: true

  - source_id: "activitynet_v1.3_12345_10.0_20.0"
    clip_id: "ctrl_12345_10_20_1_1"
    condition: "square_cropped"
    aspect_ratio:
      width: 1080
      height: 1080
      ratio_float: 1.0
    duration_seconds: 10.0
    original_dimensions:
      width: 1920
      height: 1080
    output_dimensions:
      width: 1080
      height: 1080
    distortion_params:
      method: "center_crop"
      target_aspect_ratio: "1:1"
      primary_subject_bbox_area_ratio: 0.92
    generation_timestamp: "2023-10-27T10:00:00Z"
    file_path: "output/control/activitynet_v1.3_12345_10.0_20.0_1_1.mp4"
    quality_checks:
      codec: "h264"
      fps: 24.0
      is_resolvable: true