$schema: http://json-schema.org/draft-07/schema#
title: Synthetic Video Metadata Schema
description: >
  Schema for metadata generated during the extreme aspect ratio distortion
  of the ActivityNet Captions dataset. This schema validates the CSV/JSON
  records linking distorted videos to their original sources and transformation
  parameters.
type: object
required:
  - video_id
  - original_video_id
  - source_url
  - distortion_type
  - aspect_ratio_target
  - actual_aspect_ratio
  - original_dimensions
  - distorted_dimensions
  - duration_seconds
  - fps
  - codec
  - ground_truth_annotations
  - fr_001_status
  - generation_timestamp
properties:
  video_id:
    type: string
    description: Unique identifier for the generated distorted video file.
    pattern: "^[a-zA-Z0-9_-]+_distorted_[0-9]+$"
  
  original_video_id:
    type: string
    description: The ID of the source ActivityNet video.
  
  source_url:
    type: string
    format: uri
    description: Direct URL to the original video clip used for generation.
  
  distortion_type:
    type: string
    enum:
      - horizontal_stretch
      - horizontal_compress
      - vertical_stretch
      - vertical_compress
    description: The type of geometric distortion applied.
  
  aspect_ratio_target:
    type: string
    description: Target aspect ratio as a string (e.g., "1:10", "10:1", "1:20").
    pattern: "^[12][0-9]*:[12][0-9]*$"
  
  actual_aspect_ratio:
    type: number
    minimum: 0.01
    maximum: 100.0
    description: The actual calculated aspect ratio of the output video (width/height).
  
  original_dimensions:
    type: object
    required:
      - width
      - height
    properties:
      width:
        type: integer
        minimum: 1
      height:
        type: integer
        minimum: 1
  
  distorted_dimensions:
    type: object
    required:
      - width
      - height
    properties:
      width:
        type: integer
        minimum: 1
      height:
        type: integer
        minimum: 1
  
  duration_seconds:
    type: number
    minimum: 0.0
    description: Duration of the video clip in seconds.
  
  fps:
    type: number
    minimum: 1.0
    description: Frames per second of the generated video.
  
  codec:
    type: string
    enum:
      - h264
      - hevc
      - mp4v
    description: Video codec used for the output file.
  
  ground_truth_annotations:
    type: object
    description: Original temporal annotations from ActivityNet, preserved.
    required:
      - start_time
      - end_time
      - labels
    properties:
      start_time:
        type: number
        minimum: 0.0
      end_time:
        type: number
        minimum: 0.0
      labels:
        type: array
        items:
          type: string
  
  fr_001_status:
    type: string
    enum:
      - pass
      - fail
      - excluded
    description: Result of the FR-001 bounding box integrity check.
    fail: >
      If "fail", the primary subject bounding box area was reduced >95%.
      If "excluded", the clip was skipped due to this failure.
  
  primary_subject_bb:
    type: object
    description: Bounding box of the primary subject detected (if applicable).
    required:
      - x
      - y
      - width
      - height
      - area
    properties:
      x:
        type: number
      y:
        type: number
      width:
        type: number
      height:
        type: number
      area:
        type: number
  
  generation_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the video was generated.
  
  file_path:
    type: string
    description: Relative path to the generated video file in `data/distorted/`.
  
  control_group_id:
    type: string
    nullable: true
    description: If this is part of a paired test (square-cropped), the ID of the
      corresponding square-cropped clip from the same source.