$schema: "http://json-schema.org/draft-07/schema#"
title: "Feature Graph Schema"
description: "Specification for feature graph structures (k‑NN graphs constructed from GARD feature maps)"
type: object
required:
  - scene_id
  - num_nodes
  - num_edges
  - k
  - adjacency_matrix_path
  - node_features_path
  - is_connected
  - fallback_applied
properties:
  scene_id:
    type: string
    description: "Unique identifier for the scene (e.g., 'scene_001')"
    pattern: "^scene_[0-9]{3,}$"
  num_nodes:
    type: integer
    description: "Number of nodes in the feature graph (flattened feature vectors)"
    minimum: 100
    maximum: 10000
  num_edges:
    type: integer
    description: "Number of edges in the k‑NN graph (≈ k × num_nodes for connected graphs)"
    minimum: 100
  k:
    type: integer
    description: "Number of nearest neighbors used for graph construction"
    enum: [5, 10, 15]
  adjacency_matrix_path:
    type: string
    description: "File path to sparse adjacency matrix in .npz format (scipy.sparse.csr_matrix)"
    pattern: "^data/processed/feature_graphs/.*\\.npz$"
  node_features_path:
    type: string
    description: "File path to node feature vectors in .npy format (shape: [num_nodes, channels])"
    pattern: "^data/processed/feature_graphs/.*\\.npy$"
  is_connected:
    type: boolean
    description: "Whether the graph is a single connected component (true) or has multiple components (false)"
  fallback_applied:
    type: boolean
    description: "Whether a fallback strategy (smoothing or k‑increase) was applied to handle disconnected graphs"
additionalProperties: false
examples:
  - scene_id: "scene_001"
    num_nodes: [appropriate number of nodes]
    num_edges: a substantial number of edges appropriate for the study
    k: 10
    adjacency_matrix_path: "data/processed/feature_graphs/adjacency_scene_001.npz"
    node_features_path: "data/processed/feature_graphs/node_features_scene_001.npy"
    is_connected: true
    fallback_applied: false
