[metadata]
name = llmXive-proj-094
version = 0.1.0
description = Evaluating the Effectiveness of Retrieval-Augmented Generation for Code Search
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/example/llmXive-proj-094
author = llmXive Research Team
author_email = research@llmxive.example
license = MIT
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
packages = find:
python_requires = >=3.11
install_requires =
    ir-datasets
    sentence-transformers
    faiss-cpu
    rank_bm25
    scikit-learn
    pandas
    numpy
    psutil
    transformers
    torch
    accelerate
    pytest
    ruff
    black

[options.packages.find]
where = .
include = src*, tests*

[options.package_data]
* = *.json, *.csv, *.yaml, *.txt

[flake8]
max-line-length = 88
exclude = .git,__pycache__,build,dist
ignore = E501,W503