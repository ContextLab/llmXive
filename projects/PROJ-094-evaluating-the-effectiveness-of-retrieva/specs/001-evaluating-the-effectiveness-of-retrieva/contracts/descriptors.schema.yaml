$schema: "http://json-schema.org/draft-07/schema#"
title: "Semantic Descriptors Schema"
type: "object"
properties:
  query_id:
    type: "string"
    description: "Unique identifier for the query"
  baseline_method:
    type: "string"
    enum:
      - "bm25"
      - "dual_encoder"
    description: "Baseline method for delta calculation"
  ndcg_delta:
    type: "number"
    description: "RAG nDCG@10 − Baseline nDCG@10"
  precision_delta:
    type: "number"
    description: "RAG Precision@10 − Baseline Precision@10"
  api_density:
    type: "number"
    description: "API density of the query's code snippet"
  doc_density:
    type: "number"
    description: "Documentation density of the query's code snippet"
  naming_consistency:
    type: "number"
    description: "Naming consistency of the query's code snippet (CodeBERT-base)"
required:
  - query_id
  - baseline_method
  - ndcg_delta
  - precision_delta
  - api_density
  - doc_density
  - naming_consistency
additionalProperties: false