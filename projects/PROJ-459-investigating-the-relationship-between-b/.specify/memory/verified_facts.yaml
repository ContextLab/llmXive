'|python version':
  quote: Guido van Rossum began working on Python in the late 1980s as a successor
    to the ABC programming language. Python 3.0, released in 2008, was a major revision
    and not completely backward-compatible with earlier versions. Beginning with Python
    3.5, capabilities and keywords for typing were added to the language, allowing
    optional static typing. As of 2026, the Python Software Foundation supports Python
    3.10, 3.11, 3.12, 3.13, and 3.14, following the project's annual release cycle
    and five-year support policy. Python 3.15.0rc1 (which defaults to UTF-8) is out
    in preview, and the stable release is expected to launch in October 2026. Earlier
    versions in the 3.x series have reached end-of-life and no longer receive security
    updates.
  source_id: Python (programming language)
  url: https://en.wikipedia.org/wiki/Python_(programming_language)
  value: '3.11'
