name: Verify Reproducibility

on:
  workflow_dispatch:
    inputs:
      verify_flag:
        description: 'Trigger verification mode'
        required: true
        default: 'true'
        type: string
  # Optional: Trigger on push to main or specific tags if desired
  # push:
  #   branches: [ main ]
  #   tags: [ 'v*' ]

jobs:
  verify-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found. Installing core dependencies."
            pip install pandas numpy scipy matplotlib seaborn pyyaml pytest
          fi

      - name: Ensure data directories exist
        run: |
          mkdir -p data/raw data/processed state config docs tests

      - name: Run analysis with --verify-reproducible flag
        run: |
          python code/main.py --verify-reproducible
        env:
          # Ensure any necessary environment variables for data access are set here
          # Example: if using HuggingFace datasets
          # HF_HOME: ${{ runner.temp }}/hf_cache

      - name: Verify output artifacts
        run: |
          echo "Checking for required output artifacts..."
          if [ ! -f "data/processed/discrepancies.csv" ]; then
            echo "ERROR: data/processed/discrepancies.csv not found."
            exit 1
          fi
          if [ ! -f "state/checksums.json" ]; then
            echo "ERROR: state/checksums.json not found."
            exit 1
          fi
          echo "All required artifacts found."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-outputs
          path: |
            data/processed/
            state/
            docs/
          retention-days: 7