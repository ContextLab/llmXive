# Sensitivity Analysis Configuration
# Thresholds are expressed as decimal fractions (e.g., 0.005 = 0.5%)

primary_threshold: 0.005  # 0.5%

# Sweep thresholds for stability analysis
# Order: smallest to largest (most strict to least strict)
sweep_thresholds:
  - 0.0001  # 0.01%
  - 0.0005  # 0.05%
  - 0.0010  # 0.10%
