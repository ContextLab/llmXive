# Ruff configuration for llmXive DSSC project
# Linting rules aligned with scientific computing best practices

target-version = "py311"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "B008", # Do not perform function call in argument defaults (common in ML)
    "SIM105", # Use `contextlib.suppress` instead of try/except (optional style)
]

[lint.isort]
known-first-party = ["data", "models", "analysis", "utils"]
force-sort-within-sections = true
combine-as-imports = true

[lint.per-file-ignores]
"tests/*" = ["S101"] # Allow assert in tests
"code/utils/logger.py" = ["B028"] # Logger setup doesn't need stacklevel
