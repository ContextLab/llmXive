$schema: "http://json-schema.org/draft-07/schema#"
title: Pipeline Output Schema
description: Consolidated schema for all pipeline output artifacts.
type: object
required:
  - version
  - artifacts
properties:
  version:
    type: string
    description: Semantic version of the output schema.
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  artifacts:
    type: object
    description: Collection of output artifacts grouped by type.
    required:
      - processed_data
      - models
      - evaluations
      - interpretations
    properties:
      processed_data:
        type: object
        description: Processed CSV/JSON files.
        properties:
          binned_matrix:
            type: object
            required:
              - file_path
              - schema_ref
              - checksum
            properties:
              file_path:
                type: string
              schema_ref:
                type: string
                description: Reference to `dataset.schema.yaml#processed_feature_matrix`.
              checksum:
                type: string
          filtered_expression:
            type: object
            required:
              - file_path
              - schema_ref
              - checksum
            properties:
              file_path:
                type: string
              schema_ref:
                type: string
                description: Reference to `dataset.schema.yaml#raw_rna_counts` after filtering.
              checksum:
                type: string
          imputed_expression:
            type: object
            required:
              - file_path
              - schema_ref
              - checksum
            properties:
              file_path:
                type: string
              schema_ref:
                type: string
                description: Reference to `dataset.schema.yaml#processed_target_vector`.
              checksum:
                type: string
          housekeeping_genes:
            type: object
            required:
              - file_path
              - schema_ref
              - checksum
          cell_type_specific_genes:
            type: object
            required:
              - file_path
              - schema_ref
              - checksum
      models:
        type: object
        description: Serialized Elastic Net models.
        properties:
          elastic_net_models:
            type: array
            items:
              type: object
              required:
                - cell_line
                - file_path
                - checksum
                - hyperparameters
              properties:
                cell_line:
                  type: string
                file_path:
                  type: string
                checksum:
                  type: string
                hyperparameters:
                  type: object
                  required:
                    - alpha
                    - l1_ratio
                  properties:
                    alpha:
                      type: number
                    l1_ratio:
                      type: number
      evaluations:
        type: object
        description: Performance metrics and statistical tests.
        properties:
          cv_scores:
            type: object
            required:
              - file_path
              - schema_ref
              - checksum
          sc003_verification:
            type: object
            required:
              - file_path
              - schema_ref
              - checksum
          housekeeping_r2:
            type: object
            required:
              - file_path
              - schema_ref
              - checksum
          performance_gap:
            type: object
            required:
              - file_path
              - schema_ref
              - checksum
          external_validation:
            type: object
            required:
              - file_path
              - schema_ref
              - checksum
      interpretations:
        type: object
        description: Human‑readable outputs for the manuscript.
        properties:
          feature_importance:
            type: object
            required:
              - file_path
              - schema_ref
              - checksum
          performance_report:
            type: object
            required:
              - file_path
              - schema_ref
              - checksum
additionalProperties: false
