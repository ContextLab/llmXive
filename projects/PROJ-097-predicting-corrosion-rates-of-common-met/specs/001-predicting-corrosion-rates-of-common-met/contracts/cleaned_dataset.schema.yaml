$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Cleaned Corrosion Dataset"
type: object
required:
  - record_id
  - pH
  - salinity
  - temperature
  - composition
  - corrosion_rate_mm_per_year
  - source_id
properties:
  record_id:
    type: string
    description: "Unique identifier for the observation."
  pH:
    type: number
    description: "Standardized acidity (mean = 0, std = 1)."
  salinity:
    type: number
    description: "Standardized salinity (mean = 0, std = 1)."
  temperature:
    type: number
    description: "Standardized temperature (mean = 0, std = 1)."
  composition:
    type: string
    description: "Material composition descriptor (e.g., \"Fe‑Cr\")."
  crystal_structure:
    type: string
    description: "Optional crystal structure label."
    nullable: true
  corrosion_rate_mm_per_year:
    type: number
    description: "Harmonized corrosion rate (mm per year, standardized)."
  source_id:
    type: string
    description: "Identifier of the experimental batch or study."
additionalProperties: false
