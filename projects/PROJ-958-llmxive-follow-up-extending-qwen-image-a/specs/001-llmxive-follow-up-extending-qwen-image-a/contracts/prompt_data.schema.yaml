$schema: "http://json-schema.org/draft-07/schema#"
title: "Prompt Data Schema"
description: "Schema for raw and derived prompt data used in the ambiguity scoring pipeline."
type: object
properties:
  prompt_id:
    type: string
    description: "Unique identifier for the prompt."
  text:
    type: string
    description: "The raw text of the prompt."
  source:
    type: string
    enum:
      - "IA-Bench"
      - "WISE-Verified"
    description: "Source dataset name."
  domain:
    type: string
    description: "Visual domain of the prompt (e.g., photorealistic, abstract)."
  image_url:
    type: string
    description: "URL or local path to the ground-truth image."
required:
  - prompt_id
  - text
  - source
  - image_url