$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Analysis Output"
description: "Schema for the piecewise linear regression results and statistical validation based on REAL CLIP scores."
type: "object"
required:
  - domain
  - knee_point
  - slope_low
  - slope_high
  - r_squared
  - f_test_p_value
  - permutation_p_value
  - model_comparison
properties:
  domain:
    type: "string"
    description: "Visual domain analyzed."
  knee_point:
    type: "number"
    description: "The ambiguity score threshold where the slope changes (i.e., where fidelity loss becomes significant)."
    minimum: 0.0
    maximum: 1.0
  slope_low:
    type: "number"
    description: "Slope of the regression line below the knee point (should be near 0 if hybrid works)."
  slope_high:
    type: "number"
    description: "Slope of the regression line above the knee point (should be negative if fidelity drops)."
  r_squared:
    type: "number"
    description: "R-squared value of the piecewise model fit."
    minimum: 0.0
    maximum: 1.0
  f_test_p_value:
    type: "number"
    description: "P-value from the F-test comparing piecewise vs. linear model."
  permutation_p_value:
    type: "number"
    description: "P-value from the 10,000 permutation test."
  model_comparison:
    type: "string"
    description: "Result of the model comparison."
    enum:
      - "piecewise_superior"
      - "linear_sufficient"
      - "no_threshold_found"
  sample_size:
    type: "integer"
    description: "Number of data points used in the regression."
additionalProperties: false