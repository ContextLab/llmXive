# Ruff configuration for llmXive
# Enforces strict linting rules to maintain code quality

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501", # Line too long (handled by Black)
    "B008", # Do not perform function call in argument defaults (common in testing)
]

[lint.per-file-ignores]
"tests/*" = ["ARG", "S101"] # Allow unused args and assert in tests
"code/analysis/feasibility.py" = ["SIM105"] # Allow contextlib.suppress in feasibility check

[lint.isort]
known-first-party = ["config", "data", "analysis", "utils", "contracts", "setup_directories"]
force-sort-within-sections = true
lines-after-imports = 2

[format]
line-length = 88
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
