$schema: "http://json-schema.org/draft-07/schema#"
title: "ThresholdResult"
description: "Schema for piecewise regression and change‑point detection results."
type: object
properties:
  metric_name:
    type: string
    description: "Complexity metric analyzed."
  language:
    type: string
    description: "Language subset."
  threshold_value:
    type: number
    description: "Identified structural breakpoint."
  slope_before:
    type: number
    description: "Slope below the breakpoint."
  slope_after:
    type: number
    description: "Slope above the breakpoint."
  model_fit:
    type: string
    enum:
      - piecewise
      - linear
    description: "Preferred model based on AIC/BIC comparison."
  aic_difference:
    type: number
    description: "ΔAIC (piecewise ‑ linear)."
  significance:
    type: boolean
    description: "True if non‑linear model preferred (ΔAIC > 2)."
  bootstrap_stability:
    type: number
    description: "Maximum shift across bootstrap samples (SC‑002)."
  confidence_interval_width:
    type: number
    description: "Width of 95 % CI for threshold."
  sensitivity_range:
    type: array
    items:
      type: number
    description: "Threshold values examined in sensitivity sweep."
required:
  - metric_name
  - language
  - threshold_value
  - slope_before
  - slope_after
  - model_fit
  - aic_difference
  - significance
  - bootstrap_stability
  - confidence_interval_width
  - sensitivity_range
additionalProperties: false