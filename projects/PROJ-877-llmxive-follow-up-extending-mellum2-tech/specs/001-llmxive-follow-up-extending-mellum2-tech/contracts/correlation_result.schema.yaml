$schema: "http://json-schema.org/draft-07/schema#"
title: "CorrelationResult"
description: "Schema for statistical correlation results between complexity and loss (repository aggregates)."
type: object
properties:
  metric_name:
    type: string
    description: "Complexity metric (e.g., 'cyclomatic_complexity')."
  language:
    type: string
    description: "Language subset analyzed."
  method:
    type: string
    enum:
      - pearson
      - spearman
    description: "Correlation method."
  correlation_coefficient:
    type: number
    description: "Correlation value."
  p_value:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Raw permutation p‑value."
  p_value_adjusted:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "FDR‑corrected p‑value."
  sample_size:
    type: integer
    minimum: 1
    description: "Number of repositories."
required:
  - metric_name
  - language
  - method
  - correlation_coefficient
  - p_value
  - p_value_adjusted
  - sample_size
additionalProperties: false