$schema: "http://json-schema.org/draft-07/schema#"
title: "CodeChunk"
description: "Schema for a code chunk with static analysis and LLM inference metrics."
type: object
properties:
  id:
    type: string
    description: "Unique identifier for the chunk (repo:file:chunk_index)."
  repo_name:
    type: string
    description: "Source repository name."
  language:
    type: string
    enum:
      - python
      - java
      - other
    description: "Programming language of the chunk."
  content:
    type: string
    description: "Raw source code."
  cyclomatic_complexity:
    type: integer
    minimum: 0
    description: "Cyclomatic complexity score."
  nesting_depth:
    type: integer
    minimum: 0
    description: "Maximum nesting depth."
  repetition_ratio:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Ratio of repeated n‑grams."
  token_count:
    type: integer
    minimum: 1
    description: "Number of tokens (confounder control)."
  ngram_probability:
    type: number
    description: "KenLM probability of the token sequence."
  per_token_loss:
    type: number
    description: "Average per‑token cross‑entropy loss."
  entropy:
    type: number
    description: "Average prediction entropy."
  inference_time_ms:
    type: integer
    minimum: 0
    description: "Inference latency in milliseconds."
  status:
    type: string
    enum:
      - success
      - timeout
      - parse_error
      - oom
    description: "Processing outcome."
required:
  - id
  - repo_name
  - language
  - content
  - cyclomatic_complexity
  - nesting_depth
  - repetition_ratio
  - token_count
  - ngram_probability
  - per_token_loss
  - entropy
  - inference_time_ms
  - status
additionalProperties: false
