$schema: "http://json-schema.org/draft-07/schema#"
title: "CodeChunk"
description: "Schema for a code chunk with static analysis and LLM inference metrics."
type: object
properties:
  id:
    type: string
    description: "Unique identifier for the chunk (repo:file:chunk_index)."
  repo_name:
    type: string
    description: "Source repository name."
  language:
    type: string
    enum:
      - python
      - java
      - other
    description: "Programming language of the chunk."
  content:
    type: string
    description: "Raw source code."
  cyclomatic_complexity:
    type: integer
    minimum: 0
    description: "Cyclomatic complexity score."
  nesting_depth:
    type: integer
    minimum: 0
    description: "Maximum nesting depth."
  repetition_ratio:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Ratio of repeated n‑grams."
  token_count:
    type: integer
    minimum: 1
    description: "Number of tokens (confound control)."
  ngram_probability:
    type: number
    description: "KenLM probability of the token sequence."
  per_token_loss:
    type: number
    description: "Average per‑token cross‑entropy loss."
  entropy:
    type: number
    description: "Prediction entropy."
  inference_time_ms:
    type: integer
    minimum: 0
    description: "Inference latency (ms)."
  status:
    type: string
    enum:
      - success
      - timeout
      - parse_error
      - oom
    description: "Processing outcome."
  comment_density:
    type: number
    minimum: 0.0
    description: "Ratio of comment tokens to total tokens (optional confound)."
  file_length:
    type: integer
    minimum: 0
    description: "Number of lines in the source file (optional confound)."
  repo_popularity:
    type: number
    description: "Normalized star/fork count for the repository (optional confound)."
  normalized_loss:
    type: number
    description: "Residual from regression controlling for n‑gram probability and other confounds; serves as the normalized difficulty metric."
required:
  - id
  - repo_name
  - language
  - content
  - cyclomatic_complexity
  - nesting_depth
  - repetition_ratio
  - token_count
  - ngram_probability
  - per_token_loss
  - entropy
  - inference_time_ms
  - status
additionalProperties: false