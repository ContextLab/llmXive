$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Results Schema"
description: "Schema for statistical analysis results including correlations and thresholds."
type: object
properties:
  correlation_results:
    type: array
    items:
      type: object
      properties:
        metric_name:
          type: string
        language:
          type: string
        method:
          type: string
          enum:
            - pearson
            - spearman
        correlation_coefficient:
          type: number
        p_value:
          type: number
        p_value_adjusted:
          type: number
        sample_size:
          type: integer
      required:
        - metric_name
        - language
        - method
        - correlation_coefficient
        - p_value
        - p_value_adjusted
        - sample_size
  threshold_results:
    type: array
    items:
      type: object
      properties:
        metric_name:
          type: string
        language:
          type: string
        threshold_value:
          type: number
        slope_before:
          type: number
        slope_after:
          type: number
        model_fit:
          type: string
          enum:
            - piecewise
            - linear
        aic_difference:
          type: number
        significance:
          type: boolean
        bootstrap_stability:
          type: number
        confidence_interval_width:
          type: number
        sensitivity_range:
          type: array
          items:
            type: number
      required:
        - metric_name
        - language
        - threshold_value
        - slope_before
        - slope_after
        - model_fit
        - aic_difference
        - significance
        - bootstrap_stability
        - confidence_interval_width
        - sensitivity_range
  power_analysis:
    type: object
    properties:
      effect_size:
        type: number
      sample_size_used:
        type: integer
      power:
        type: number
      limitation_noted:
        type: boolean
      description:
        type: string
    required:
      - effect_size
      - sample_size_used
      - power
      - limitation_noted
      - description
required:
  - correlation_results
  - threshold_results
  - power_analysis