$schema: "http://json-schema.org/draft-07/schema#"
title: "Final Report Output Schema"
description: "Schema for the final JSON report generated by the pipeline."
type: object
properties:
  summary:
    type: object
    properties:
      total_chunks_processed:
        type: integer
      total_chunks_success:
        type: integer
      languages_analyzed:
        type: array
        items:
          type: string
      primary_correlation:
        type: number
        description: "Pearson correlation between complexity and loss (overall)."
      threshold_detected:
        type: boolean
      threshold_value:
        type: number
        nullable: true
      cross_language_consistent:
        type: boolean
    required:
      - total_chunks_processed
      - total_chunks_success
      - languages_analyzed
      - primary_correlation
      - threshold_detected
      - cross_language_consistent
  validation:
    type: object
    properties:
      benchmark_used:
        type: boolean
      benchmark_source:
        type: string
        nullable: true
      validation_skipped_reason:
        type: string
        nullable: true
    required:
      - benchmark_used
  constraints:
    type: object
    properties:
      cpu_only:
        type: boolean
        const: true
      execution_time_hours:
        type: number
      memory_peak_gb:
        type: number
    required:
      - cpu_only
      - execution_time_hours
      - memory_peak_gb
required:
  - summary
  - validation
  - constraints
additionalProperties: false