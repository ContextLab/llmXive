# Ruff configuration for llmXive project
# This file configures the ruff linter for the project.
# Run with: ruff check .

# Select specific rule sets:
# E: pycodestyle errors
# F: Pyflakes (unused imports, undefined names, etc.)
# I: isort (import sorting)
select = ["E", "F", "I"]

# Ignore specific rules if necessary (currently none ignored)
ignore = []

# Line length for formatting
line-length = 88

# Target Python version
target-version = "py310"

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data/",
    "data/raw",
    "data/processed",
    "data/results",
    "build",
    "dist",
    "*.egg-info",
]

# Per-file ignores (if needed)
# [per-file-ignores]
# "tests/*" = ["S101"]

# Import sorting configuration
[isort]
force-single-line = false
force-sort-within-sections = false
known-first-party = ["code"]
known-third-party = ["datasets", "transformers", "torch", "scikit-learn", "statsmodels", "pandas", "numpy", "matplotlib", "seaborn", "kenlm", "pwlf", "ruptures", "ruff", "black", "pytest", "yaml"]
order-by-type = true
lines-after-imports = 2
lines-between-types = 0
relative-imports-order = "closest-to-furthest"

# Formatter configuration (if using ruff format)
[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"