# Black formatting configuration for PROJ-431
# Used via: black --config code/pyproject.toml code/ tests/
[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
(
    /(
          \.git
        | \.venv
        | venv
        | build
        | dist
        | data
        | results
    )/
)
'''
