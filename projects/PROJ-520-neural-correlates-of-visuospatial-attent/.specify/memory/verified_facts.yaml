'|establish iteration least permutation significance statistical testing use':
  quote: Blocks are batches of microarrays; for example for eight samples split into
    two groups (control and affected) there are 4!=24 permutations for each block
    and the total number of permutations is (24)(24)= 576. A minimum of 1000 permutations
    are recommended;
  source_id: Microarray analysis techniques
