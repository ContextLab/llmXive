[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "data",
    "models",
    "logs",
    "state",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by black; avoid duplicate complaints
]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "data_loader",
    "llm_generator",
    "test_executor",
    "analyzer",
    "report_generator",
    "validate_schemas",
    "power_sensitivity_analysis",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
      \.git
    | __pycache__
    | \.venv
    | venv
    | build
    | dist
    | data
    | models
    | logs
    | state
)/
'''
