$schema: http://json-schema.org/draft-07/schema#
title: Latent Vector Schema
description: Defines the structure for extracted latent vectors (hidden states) from the model.
type: object
required:
  - pair_id
  - task_type
  - vector_base64
  - norm_status
properties:
  pair_id:
    type: integer
    description: Unique identifier linking back to the original dataset entry.
  task_type:
    type: string
    description: The category of the reasoning task.
  vector_base64:
    type: string
    description: The L2-normalized hidden state vector encoded as a base64 string.
  norm_status:
    type: string
    description: Status of the normalization process (e.g., 'normalized', 'error', 'skipped').
    enum:
      - normalized
      - error
      - skipped
