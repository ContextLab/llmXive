$schema: http://json-schema.org/draft-07/schema#
title: Validity Log Schema
description: Defines the structure for logging the validity of perturbed inputs and outputs during the sweep.
type: object
required:
  - task_type
  - sigma
  - pass_rate
  - collapse_point
  - semantic_drift_score
  - output_validity_score
properties:
  task_type:
    type: string
    description: The category of the reasoning task.
  sigma:
    type: number
    description: The standard deviation of the Gaussian noise injected.
  pass_rate:
    type: number
    description: The proportion of pairs that passed validity checks (0.0 to 1.0).
  collapse_point:
    type: boolean
    description: True if the pass_rate dropped below the threshold (indicating collapse).
  semantic_drift_score:
    type: number
    description: The average cosine similarity score between baseline and perturbed input embeddings.
  output_validity_score:
    type: number
    description: The average BERTScore F1 or perplexity-based validity score of the model outputs.