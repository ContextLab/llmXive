$schema: http://json-schema.org/draft-07/schema#
title: Reasoning Dataset Schema
description: Defines the structure for the input reasoning dataset used in the noise injection pipeline.
type: object
required:
  - pair_id
  - task_type
  - question
  - expected_answer
  - input_token_ids
properties:
  pair_id:
    type: integer
    description: Unique identifier for the question pair.
  task_type:
    type: string
    description: The category or type of the reasoning task (e.g., 'math', 'logic', 'commonsense').
  question:
    type: string
    description: The raw text of the input question.
  expected_answer:
    type: string
    description: The ground truth answer for validation purposes.
  input_token_ids:
    type: array
    items:
      type: integer
    description: List of token IDs representing the tokenized question.
