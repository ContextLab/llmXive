$schema: http://json-schema.org/draft-07/schema#
title: Statistical Result Schema
description: Defines the structure for statistical hypothesis testing results comparing baseline and perturbed vectors.
type: object
required:
  - task_type
  - sigma
  - p_value
  - mean_diff
  - ci_lower
  - ci_upper
  - test_type
  - validity_collapse_point
properties:
  task_type:
    type: string
    description: The category of the reasoning task being analyzed.
  sigma:
    type: number
    description: The standard deviation of the Gaussian noise injected.
  p_value:
    type: number
    description: The p-value resulting from the statistical test.
  mean_diff:
    type: number
    description: The mean difference in cosine similarity or distance between groups.
  ci_lower:
    type: number
    description: The lower bound of the confidence interval for the mean difference.
  ci_upper:
    type: number
    description: The upper bound of the confidence interval for the mean difference.
  test_type:
    type: string
    description: The statistical test used (e.g., 't-test', 'Wilcoxon').
    enum:
      - t-test
      - Wilcoxon
  validity_collapse_point:
    type: boolean
    description: Indicates if this sigma level represents a point where validity collapsed (>90% failure).
