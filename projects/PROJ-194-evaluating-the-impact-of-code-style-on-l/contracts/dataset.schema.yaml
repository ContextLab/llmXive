$schema: "http://json-schema.org/draft-07/schema#"
title: Base Function Dataset
description: Schema for the base Python functions dataset used as input for transformation.
type: object
required:
  - id
  - source_code
  - language
  - metadata
properties:
  id:
    type: string
    description: Unique identifier for the base function.
  source_code:
    type: string
    description: The original Python source code of the function.
  language:
    type: string
    enum: ["python"]
    default: "python"
    description: Programming language of the source code.
  metadata:
    type: object
    description: Additional metadata about the function (e.g., difficulty, source, tags).
    properties:
      difficulty:
        type: string
        enum: ["easy", "medium", "hard"]
      source:
        type: string
        description: Origin of the function (e.g., "LeetCode", "Custom").
      tags:
        type: array
        items:
          type: string
        description: List of tags associated with the function.
  created_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of creation.
additionalProperties: false
