$schema: http://json-schema.org/draft-07/schema#
title: Base Function Dataset Schema
description: Schema for the base Python function dataset used in the study.
type: object
required:
  - function_id
  - source_code
  - docstring
  - language
  - source
properties:
  function_id:
    type: string
    description: Unique identifier for the function (e.g., hash or UUID).
    minLength: 1
  source_code:
    type: string
    description: The original Python source code of the function.
    minLength: 1
  docstring:
    type: string
    description: The original docstring of the function.
    minLength: 0
  language:
    type: string
    description: Programming language of the function.
    const: python
  source:
    type: string
    description: Original source of the function (e.g., "HumanEval", "MBPP").
    minLength: 1
  metadata:
    type: object
    description: Optional metadata such as difficulty, tags, or original file path.
    additionalProperties: true
additionalProperties: false
