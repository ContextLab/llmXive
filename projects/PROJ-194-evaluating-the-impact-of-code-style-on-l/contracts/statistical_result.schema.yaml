$schema: "http://json-schema.org/draft-07/schema#"
title: Statistical Result
description: Schema for the result of statistical analysis (LMM/GLMM/Permutation).
type: object
required:
  - analysis_id
  - metric_name
  - model_type
  - fixed_effects
  - random_effects
  - normality_test
  - results
  - timestamp
properties:
  analysis_id:
    type: string
    description: Unique identifier for this analysis.
  metric_name:
    type: string
    description: The metric being analyzed (e.g., "codebleu", "exact_match").
  model_type:
    type: string
    enum: ["LMM", "GLMM", "Permutation"]
    description: The type of statistical model used.
  fixed_effects:
    type: array
    items:
      type: string
    description: List of fixed effect factors (e.g., "formatting", "naming").
  random_effects:
    type: array
    items:
      type: string
    description: List of random effect factors (e.g., "function_id").
  normality_test:
    type: object
    description: Result of the Shapiro-Wilk normality test on residuals.
    properties:
      statistic:
        type: number
        format: float
      p_value:
        type: number
        format: float
      passed:
        type: boolean
        description: True if p_value >= 0.05.
  results:
    type: object
    description: Model coefficients and significance.
    properties:
      coefficients:
        type: object
        additionalProperties:
          type: object
          properties:
            estimate:
              type: number
            std_error:
              type: number
            t_value:
              type: number
            p_value:
              type: number
            p_value_corrected:
              type: number
      effect_size:
        type: number
        format: float
      confidence_interval:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of analysis.
additionalProperties: false
