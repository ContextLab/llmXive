$schema: "http://json-schema.org/draft-07/schema#"
title: Analysis Output Report
description: Schema for the final aggregated analysis report.
type: object
required:
  - report_id
  - generated_at
  - summary
  - detailed_results
  - visualizations
  - semantic_opacity_analysis
properties:
  report_id:
    type: string
    description: Unique identifier for this report.
  generated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of report generation.
  summary:
    type: object
    description: High-level summary of findings.
    properties:
      total_variants_analyzed:
        type: integer
      total_tasks_executed:
        type: integer
      primary_finding:
        type: string
        description: One-sentence summary of the main result.
  detailed_results:
    type: array
    items:
      $ref: "statistical_result.schema.yaml"
    description: List of detailed statistical results per metric.
  visualizations:
    type: array
    items:
      type: object
      properties:
        type:
          type: string
          enum: ["interaction_plot", "bar_chart", "scatter_plot"]
        file_path:
          type: string
        description:
          type: string
    description: List of generated visualization file paths and descriptions.
  semantic_opacity_analysis:
    type: object
    description: Specific analysis comparing Semantic Opacity vs Baseline.
    properties:
      performance_drop_percentage:
        type: number
        format: float
      statistical_significance:
        type: boolean
      p_value:
        type: number
        format: float
      conclusion:
        type: string
additionalProperties: false