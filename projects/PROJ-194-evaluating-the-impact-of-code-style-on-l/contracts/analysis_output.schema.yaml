$schema: http://json-schema.org/draft-07/schema#
title: Analysis Output Schema
description: Schema for the final aggregated analysis report and summary tables.
type: object
required:
  report_id
  generated_at
  summary_table
  semantic_opacity_comparison
  correlation_analysis
  figures
properties:
  report_id:
    type: string
    description: Unique identifier for this report.
  generated_at:
    type: string
    format: date-time
    description: Timestamp of report generation.
  summary_table:
    type: array
    description: List of rows for the summary statistical table.
    items:
      type: object
      required:
        - factor
        - estimate
        - std_error
        - statistic
        - p_value_raw
        - p_value_corrected
      properties:
        factor:
          type: string
        estimate:
          type: number
        std_error:
          type: number
        statistic:
          type: number
        p_value_raw:
          type: number
        p_value_corrected:
          type: number
  semantic_opacity_comparison:
    type: object
    description: Specific comparison results for Semantic Opacity vs Baseline.
    properties:
      mean_difference:
        type: number
      confidence_interval:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
      p_value:
        type: number
      conclusion:
        type: string
        description: Textual conclusion about the impact of semantic opacity.
  correlation_analysis:
    type: object
    description: Correlation between token count and performance drop.
    properties:
      correlation_coefficient:
        type: number
      p_value:
        type: number
      conclusion:
        type: string
  figures:
    type: array
    description: List of generated figure paths and descriptions.
    items:
      type: object
      properties:
        filename:
          type: string
        type:
          type: string
          enum: [interaction_plot, histogram, boxplot, scatter]
        description:
          type: string
additionalProperties: false