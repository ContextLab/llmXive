$schema: "http://json-schema.org/draft-07/schema#"
title: Style Variant
description: Schema for a generated style variant of a base function (8-way factorial design).
type: object
required:
  - id
  - base_function_id
  - source_code
  - flags
  - transformation_seed
  - created_at
properties:
  id:
    type: string
    description: Unique identifier for this specific variant.
  base_function_id:
    type: string
    description: Reference to the base function ID.
  source_code:
    type: string
    description: The transformed Python source code.
  flags:
    type: object
    description: Boolean flags indicating the applied transformations.
    required:
      - is_generic_naming
      - is_stripped_comments
      - is_minified
      - is_semantic_opacity
    properties:
      is_generic_naming:
        type: boolean
        description: True if identifiers were replaced with generic tokens (e.g., var1).
      is_stripped_comments:
        type: boolean
        description: True if comments and docstrings were removed.
      is_minified:
        type: boolean
        description: True if code was minified (whitespace removed).
      is_semantic_opacity:
        type: boolean
        description: True if BOTH generic naming AND stripped comments are applied.
  transformation_seed:
    type: string
    description: The seed used for this transformation (for reproducibility).
  mapping_hash:
    type: string
    description: SHA256 hash of the identifier mapping dictionary used.
  created_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of generation.
additionalProperties: false
