$schema: http://json-schema.org/draft-07/schema#
title: Task Result Schema
description: Schema for the result of an LLM task execution on a style variant.
type: object
required:
  result_id
  variant_id
  task_type
  model_name
  input_prompt
  generated_output
  ground_truth
  metrics
  token_count
  execution_time_ms
  is_buggy
  mutation_type
properties:
  result_id:
    type: string
    description: Unique identifier for this result.
  variant_id:
    type: string
    description: Reference to the style variant used.
  task_type:
    type: string
    enum: [completion, bug_detection, summarization]
    description: Type of task executed.
  model_name:
    type: string
    description: Name of the LLM used (e.g., "salesforce/codegen-2b-mono").
  input_prompt:
    type: string
    description: The full prompt sent to the LLM.
  generated_output:
    type: string
    description: The raw output generated by the LLM.
  ground_truth:
    type: string
    description: The expected correct output (for evaluation).
  metrics:
    type: object
    description: Dictionary of calculated metrics.
    properties:
      exact_match:
        type: number
        minimum: 0
        maximum: 1
      codebleu:
        type: number
        minimum: 0
        maximum: 1
      bleu:
        type: number
        minimum: 0
        maximum: 1
      rouge_l:
        type: number
        minimum: 0
        maximum: 1
      precision:
        type: number
        minimum: 0
        maximum: 1
      recall:
        type: number
        minimum: 0
        maximum: 1
      f1:
        type: number
        minimum: 0
        maximum: 1
    additionalProperties: true
  token_count:
    type: integer
    description: Number of tokens in the input prompt + generated output.
  execution_time_ms:
    type: integer
    description: Time taken to generate the response in milliseconds.
  is_buggy:
    type: boolean
    description: Whether the input variant contained a mutation.
  mutation_type:
    type: string
    nullable: true
    description: Type of mutation injected (if any).
  is_semantic_opacity:
    type: boolean
    description: Inherited flag from the variant indicating semantic opacity.
  confounded:
    type: boolean
    description: Flagged if token count delta exceeds threshold T.
additionalProperties: false
