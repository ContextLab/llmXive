$schema: "http://json-schema.org/draft-07/schema#"
title: Task Result
description: Schema for the result of an LLM task execution on a style variant.
type: object
required:
  - result_id
  - variant_id
  - base_function_id
  - task_type
  - model_id
  - input_tokens
  - output_tokens
  - generated_code
  - metrics
  - is_semantic_opacity
  - execution_timestamp
properties:
  result_id:
    type: string
    description: Unique identifier for this result.
  variant_id:
    type: string
    description: Reference to the style variant ID.
  base_function_id:
    type: string
    description: Reference to the base function ID.
  task_type:
    type: string
    enum: ["completion", "bug_detection", "summarization"]
    description: The type of task performed.
  model_id:
    type: string
    description: Identifier of the LLM used (e.g., "codegen-2b").
  input_tokens:
    type: integer
    description: Number of tokens in the input prompt.
  output_tokens:
    type: integer
    description: Number of tokens in the generated output.
  generated_code:
    type: string
    description: The code generated by the LLM.
  metrics:
    type: object
    description: Dictionary of calculated metrics.
    properties:
      exact_match:
        type: number
        format: float
      bleu:
        type: number
        format: float
      rouge_l:
        type: number
        format: float
      codebleu:
        type: number
        format: float
      precision:
        type: number
        format: float
      recall:
        type: number
        format: float
      f1:
        type: number
        format: float
      is_potentially_confounded:
        type: boolean
        description: True if token count delta exceeds threshold T.
  is_semantic_opacity:
    type: boolean
    description: Flag inherited from the variant indicating semantic opacity.
  execution_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of execution.
additionalProperties: false
