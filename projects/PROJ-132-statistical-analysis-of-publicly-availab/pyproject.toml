[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bird-migration-climate-analysis"
version = "0.1.0"
description = "Statistical Analysis of Publicly Available Bird Migration Patterns and Climate Change"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "polars>=0.19.0",
    "pygam>=0.8.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "datasets>=2.14.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    "filelock>=3.12.0",
    "geomstats>=2.4.0",
]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]

[tool.ruff]
select = ["E", "F", "W", "I"]
ignore = []
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
]