[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-bird-migration"
version = "0.1.0"
description = "Statistical Analysis of Publicly Available Bird Migration Patterns and Climate Change"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "statsmodels>=0.14.0",
    "pyarrow>=12.0.0",
    "huggingface_hub>=0.16.0",
    "datasets>=2.14.0",
    "geomstats>=2.5.0",
    "joblib>=1.3.0",
    "filelock>=3.12.0",
    "pytest>=7.3.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
    "pre-commit>=3.3.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
lint.select = ['E', 'F', 'W', 'I']
lint.ignore = []
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"