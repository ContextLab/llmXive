$schema: "http://json-schema.org/draft-07/schema#"
title: "GAMM Model Results"
description: "Schema for the output of the Generalized Additive Mixed Model fitting."
type: "object"
properties:
  species_id:
    type: "string"
  grid_cell:
    type: "string"
  model_id:
    type: "string"
    description: "Unique identifier for the model run."
  term:
    type: "string"
    description: "Predictor name (e.g., \"temp_smooth\")."
  estimate:
    type: "number"
    description: "Coefficient or smooth effect estimate."
  p_value:
    type: "number"
    description: "Permutation‑derived p‑value based on 10000 shuffles."
  fdr_q_value:
    type: "number"
    description: "Benjamini–Hochberg corrected q‑value."
  aic:
    type: "number"
    description: "Akaike Information Criterion (AIC)."
  r_squared:
    type: "number"
    description: "Coefficient of determination (R²)."
required:
  - species_id
  - model_id
  - term
  - estimate
  - p_value
  - fdr_q_value
  - aic
additionalProperties: false