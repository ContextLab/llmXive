$schema: "http://json-schema.org/draft-07/schema#"
title: "Bird Migration and Climate Dataset Schema"
description: "Schema for the raw eBird and PRISM datasets used to validate the pipeline. Field names align with the data model definitions."
type: "object"
properties:
  migration_records:
    type: "array"
    description: "Array of bird observation records"
    items:
      type: "object"
      properties:
        species_id:
          type: "string"
          description: "Scientific name of the bird species"
        latitude:
          type: "number"
          description: "Latitude in decimal degrees (WGS84)"
          minimum: -90
          maximum: 90
        longitude:
          type: "number"
          description: "Longitude in decimal degrees (WGS84)"
          minimum: -180
          maximum: 180
        date:
          type: "string"
          format: "date"
          description: "Observation date (YYYY-MM-DD)"
        count:
          type: "integer"
          description: "Number of individuals observed"
          minimum: 1
        checklist_id:
          type: "string"
          description: "Unique checklist identifier"
        grid_cell:
          type: "string"
          description: "Grid cell identifier (lat_lon format, at a sub-degree spatial resolution)"
        checklist_duration:
          type: "integer"
          description: "Checklist duration in minutes (effort covariate)"
        observer_count:
          type: "integer"
          description: "Number of observers contributing to the checklist (effort covariate)"
      required:
        - species_id
        - latitude
        - longitude
        - date
        - count
        - checklist_id
        - grid_cell
      additionalProperties: false
  climate_records:
    type: "array"
    description: "Array of climate records per grid cell and week"
    items:
      type: "object"
      properties:
        grid_cell:
          type: "string"
          description: "Grid cell identifier (lat_lon format, 0.5° resolution)"
        week_start:
          type: "string"
          format: "date"
          description: "ISO week start date"
        year:
          type: "integer"
          description: "Year of observation"
          minimum: 2020
          maximum: 2024
        mean_temperature:
          type: "number"
          description: "Mean temperature in Celsius"
        total_precipitation:
          type: "number"
          description: "Total precipitation in mm"
        extreme_weather_index:
          type: "number"
          description: "Extreme weather index (0.0 to 1.0)"
          minimum: 0
          maximum: 1
        imputed:
          type: "boolean"
          description: "True if value was interpolated"
      required:
        - grid_cell
        - week_start
        - year
        - mean_temperature
        - total_precipitation
        - extreme_weather_index
        - imputed
      additionalProperties: false
required:
  - migration_records
  - climate_records
additionalProperties: false