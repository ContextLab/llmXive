[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
]

[lint.isort]
known-first-party = ["main", "utils", "agents", "data_generation", "retrieval", "evaluation"]

[format]
# Black-compatible formatting
line-length = 88
quote-style = "double"
indent-style = "space"
