# Schema definition for results/coverage.csv
# This file defines the contract for the output of the calibration evaluation pipeline.
# It is used by T011 (Contract Test) to validate the output.

required_columns:
  - series_id
  - model
  - horizon
  - nominal_coverage
  - empirical_coverage
  - deviation
  - p_raw
  - p_value

column_order:
  - series_id
  - model
  - horizon
  - nominal_coverage
  - empirical_coverage
  - deviation
  - p_raw
  - p_value

columns:
  - name: series_id
    type: str
    description: Unique identifier for the time series (e.g., M4-1001)
  - name: model
    type: str
    description: Name of the forecasting model used (ARIMA, ETS, Prophet, LightGBM)
  - name: horizon
    type: int64
    description: Forecast horizon step (1-12)
  - name: nominal_coverage
    type: float64
    description: Target coverage level from config.yaml (0.80 or 0.95)
  - name: empirical_coverage
    type: float64
    description: Observed proportion of test points inside the prediction interval
  - name: deviation
    type: float64
    description: Absolute difference between empirical and nominal coverage
  - name: p_raw
    type: float64
    description: Raw p-value from hypothesis test
  - name: p_value
    type: float64
    description: FDR-corrected p-value (Benjamini-Hochberg)

constraints:
  nominal_coverage:
    - 0.80
    - 0.95
  horizon:
    min: 1
    max: 12
  coverage_range:
    min: 0.0
    max: 1.0
  p_value_range:
    min: 0.0
    max: 1.0