required_columns:
  - series_id
  - model
  - horizon
  - nominal_coverage
  - empirical_coverage
  - deviation
  - p_raw
  - p_value

column_order:
  - series_id
  - model
  - horizon
  - nominal_coverage
  - empirical_coverage
  - deviation
  - p_raw
  - p_value

columns:
  - name: series_id
    type: str
    description: Unique identifier for the time series
  - name: model
    type: str
    description: Model name (e.g., ARIMA, ETS, Prophet, LightGBM)
  - name: horizon
    type: int64
    description: Forecast horizon (1-12)
  - name: nominal_coverage
    type: float64
    description: Target coverage level (0.80 or 0.95)
  - name: empirical_coverage
    type: float64
    description: Observed coverage proportion
  - name: deviation
    type: float64
    description: Absolute difference between empirical and nominal coverage
  - name: p_raw
    type: float64
    description: Raw p-value from hypothesis test
  - name: p_value
    type: float64
    description: FDR-corrected p-value

constraints:
  nominal_coverage:
    - 0.80
    - 0.95
  coverage_range:
    min: 0.0
    max: 1.0
  p_value_range:
    min: 0.0
    max: 1.0

uniqueness:
  - fields:
      - series_id
      - model
      - horizon
    constraint: unique
