$schema: http://json-schema.org/draft-07/schema#
title: Coverage Results Schema
description: JSON Schema for the coverage evaluation results generated by the pipeline.
type: object
required:
  - series_id
  - model
  - horizon
  - nominal_coverage
  - empirical_coverage
  - deviation
properties:
  series_id:
    type: string
    description: Unique identifier for the time series.
  model:
    type: string
    description: Name of the forecasting model used (e.g., "ARIMA", "ETS", "Prophet", "LightGBM").
  horizon:
    type: integer
    description: Forecast horizon step (h).
    minimum: 1
  nominal_coverage:
    type: number
    description: The target nominal coverage level (e.g., 0.80, 0.95).
    minimum: 0
    maximum: 1
  empirical_coverage:
    type: number
    description: The observed empirical coverage rate calculated from the test set.
    minimum: 0
    maximum: 1
  deviation:
    type: number
    description: The absolute difference between empirical and nominal coverage.
additionalProperties: false
