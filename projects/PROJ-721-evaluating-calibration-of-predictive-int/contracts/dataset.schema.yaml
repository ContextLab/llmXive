$schema: http://json-schema.org/draft-07/schema#
title: M4 Dataset Schema
description: >
  Schema for the processed M4 dataset structure used in the calibration evaluation pipeline.
  Defines the expected format for the time series data and metadata after extraction and loading.
type: object
required:
  - metadata
  - series
properties:
  metadata:
    type: object
    description: Global metadata about the dataset version and source.
    required:
      - dataset_name
      - version
      - source_url
      - download_date
      - checksum
    properties:
      dataset_name:
        type: string
        const: "M4"
      version:
        type: string
      source_url:
        type: string
        format: uri
      download_date:
        type: string
        format: date-time
      checksum:
        type: string
        pattern: "^[a-f0-9]{64}$"
      series_count:
        type: integer
        minimum: 0
  series:
    type: array
    description: List of time series objects.
    items:
      type: object
      required:
        - series_id
        - frequency
        - seasonality
        - train
        - test
      properties:
        series_id:
          type: string
          description: Unique identifier for the series (e.g., "M1", "Hourly_1").
        frequency:
          type: string
          description: Frequency of the time series (e.g., "Yearly", "Monthly", "Hourly").
        seasonality:
          type: integer
          description: Seasonal period length.
        train:
          type: array
          description: Training data points (floats).
          items:
            type: number
          minItems: 1
        test:
          type: array
          description: Test data points (floats).
          items:
            type: number
          minItems: 1
        meta:
          type: object
          description: Optional additional metadata (e.g., category, region).
          additionalProperties: true
additionalProperties: false
