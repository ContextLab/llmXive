$schema: http://json-schema.org/draft-07/schema#
title: M4 Time Series Dataset Schema
description: JSON Schema for M4 series data structure including id, frequency, seasonality, and values.
type: object
required:
  - id
  - frequency
  - seasonality
  - values
properties:
  id:
    type: string
    description: Unique identifier for the time series (e.g., "M1", "M456").
  frequency:
    type: string
    description: The frequency of the time series (e.g., "Yearly", "Quarterly", "Monthly", "Weekly", "Daily", "Hourly").
    enum:
      - Yearly
      - Quarterly
      - Monthly
      - Weekly
      - Daily
      - Hourly
  seasonality:
    type: integer
    description: The seasonal period of the time series (e.g., 1 for non-seasonal, 4 for quarterly, 12 for monthly).
    minimum: 1
  values:
    type: array
    description: The time series values as a list of numbers.
    items:
      type: number
    minItems: 1
additionalProperties: false
