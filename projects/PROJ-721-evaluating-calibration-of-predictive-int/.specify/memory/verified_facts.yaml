'|dataset evaluation m4 used':
  quote: The M4 extended and replicated the results of the previous three competitions,
    using an extended and diverse set of time series to identify the most accurate
    forecasting method(s) for different types of predictions. It aimed to get answers
    on how to improve forecasting accuracy and identify the most appropriate methods
    for each case. To get precise and compelling answers, the M4 Competition utilized
    100,000 real-life series, and incorporates all major forecasting methods, including
    those based on Artificial Intelligence (Machine Learning, ML), as well as traditional
    statistical ones.
  source_id: Makridakis Competitions
  url: https://en.wikipedia.org/wiki/Makridakis_Competitions
  value: 100,000
