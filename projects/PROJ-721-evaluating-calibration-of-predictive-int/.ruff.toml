[lint]
# Select specific rules:
# E4: pycodestyle (Import formatting)
# E7: pycodestyle (Syntax errors)
# E9: pycodestyle (Runtime errors)
# F: Pyflakes
# I: isort (Import sorting)
select = ["E4", "E7", "E9", "F", "I"]

# Ignore specific rules if necessary (currently none)
ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude a few files/directories
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "data",
    "results",
    "state",
    "contracts",
    "tests",
]

# Same as above but only for files (not directories)
extend-exclude = []

# Line length
line-length = 88

# Allow unused variables and imports in test files
[lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
