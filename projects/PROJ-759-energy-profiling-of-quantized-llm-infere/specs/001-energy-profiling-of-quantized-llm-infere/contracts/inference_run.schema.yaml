$schema: "http://json-schema.org/draft-07/schema#"
title: InferenceRun
type: object
required:
  - config_id
  - run_index
  - energy_joules
  - latency_ms
  - token_count
  - perplexity
  - measurement_method
properties:
  config_id:
    type: string
    description: "SHA256 hash of the Configuration object."
  run_index:
    type: integer
    minimum: 0
    maximum: 11
    description: "0-based index of the repetition (0-11, 12 runs per FR-003)."
  energy_joules:
    type:
      - "number"
      - "null"
    description: "Energy in Joules; may be null when measurement_method is 'unavailable'. Null entries are **excluded** from aggregation; zero is never used as a placeholder."
  latency_ms:
    type: number
    description: "Wall-clock time for the forward pass (milliseconds)."
  token_count:
    type: integer
    description: "Number of tokens processed (fixed at 500 for primary runs)."
  perplexity:
    type: number
    description: "Per-token perplexity on the prompt."
  measurement_method:
    type: string
    enum: [pyRAPL, ci_rapl, wattmeter, unavailable]
    description: "Tool that supplied the energy measurement; 'ci_rapl' readings are non‑authoritative per FR-002; 'unavailable' means energy was omitted."
  cpu_freq_mhz:
    type: number
    description: "Average CPU frequency during the run (MHz), from /proc/cpuinfo."
  timestamp_iso:
    type: string
    format: date-time
    description: "ISO-8601 timestamp when the run completed."