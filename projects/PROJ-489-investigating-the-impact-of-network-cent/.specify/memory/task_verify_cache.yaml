  r: "All 4 unit tests in `code/tests/test_preprocess.py` fail (exit 1) due to real\
    \ bugs: `mne.time_frequency.psd_welch` doesn't exist, `spike[::sfreq]` uses a\
    \ float slice index, ambiguous annotation `orig_time`, and a missing `paths` import\
    \ in the test. Additionally, the required verification run on a real 3-subject\
    \ subset never happened \u2014 no `data/processed/epochs_*.npz`, `metadata_*.json`,\
    \ or `validation_log.txt` files exist, and `epoch_by_sleep_stage` doesn't actually\
    \ extract `waking_night_id`/`sleep_night_id` from recording metadata (it just\
    \ duplicates `info[\"description\"]`)."
