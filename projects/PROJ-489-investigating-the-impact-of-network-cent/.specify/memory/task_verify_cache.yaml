  r: "The verification criteria fail: `data/raw/` contains only an empty `download_log.txt`\
    \ (0 bytes, no checksum-verified files) and zero `.edf` files, so the \"\u2265\
    \ 30 subjects\" requirement is unmet. The execution log shows the download run\
    \ \"completed\" in 0.6 seconds with \"0 files verified, 0 errors\" \u2014 no actual\
    \ PhysioNet download occurred (each fetch returned instantly with no data), so\
    \ the checksum log was never populated with real entries. Additionally, `requirements.txt`\
    \ uses `>=` version ranges rather than the pinned versions the task specified."
  sig: 4d7f2642eab70747d679a44c82cfe5befaf74b81f2d3b1ad169c603d15c90f30
T002:
