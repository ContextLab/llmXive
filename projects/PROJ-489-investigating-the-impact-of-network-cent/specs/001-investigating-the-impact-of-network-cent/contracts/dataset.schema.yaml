$schema: "http://json-schema.org/draft-07/schema#"
title: "SubjectMetricsSchema"
description: "Schema for the aggregated subject‑level metrics CSV (one row per subject per sleep stage)."
type: object
properties:
  subject_id:
    type: string
    description: "Unique identifier for the subject (e.g., S001)."
  stage_label:
    type: string
    description: "Sleep stage label."
    enum:
      - "N1"
      - "N2"
      - "N3"
      - "REM"
  mean_pli:
    type: number
    description: "Mean Phase‑Locking Value across all epochs of this stage."
    minimum: 0
    maximum: 1
  n_epochs:
    type: integer
    description: "Number of epochs contributed to the mean PLV calculation."
    minimum: 1
  theta_mean_degree:
    type: number
    description: "Average degree centrality in theta band (0 ≤ ≤ 1)."
    minimum: 0
    maximum: 1
  theta_mean_eigenvector:
    type: number
    description: "Average eigenvector centrality in theta band (0 ≤ ≤ 1)."
    minimum: 0
    maximum: 1
  alpha_mean_degree:
    type: number
    description: "Average degree centrality in alpha band (0 ≤ ≤ 1)."
    minimum: 0
    maximum: 1
  alpha_mean_eigenvector:
    type: number
    description: "Average eigenvector centrality in alpha band (0 ≤ ≤ 1)."
    minimum: 0
    maximum: 1
  theta_icc:
    type: number
    description: "Split‑half ICC for theta‑band coherence (0 ≤ ≤ 1)."
    minimum: 0
    maximum: 1
  alpha_icc:
    type: number
    description: "Split‑half ICC for alpha‑band coherence (0 ≤ ≤ 1)."
    minimum: 0
    maximum: 1
  theta_icc_flag:
    type: boolean
    description: "True if theta ICC < 0.6 (unstable)."
  alpha_icc_flag:
    type: boolean
    description: "True if alpha ICC < 0.6 (unstable)."
  waking_night_id:
    type: string
    description: "Identifier for the waking recording night (extracted from EDF header)."
  sleep_night_id:
    type: string
    description: "Identifier for the sleep recording night (extracted from EDF header)."
  temporal_proximity:
    type: boolean
    description: "True if waking and sleep nights are the same."
  age:
    type: ["integer", "null"]
    description: "Age in years (optional)."
  gender:
    type: ["string", "null"]
    description: "Gender (M or F, optional)."
  total_sleep_time_min:
    type: number
    description: "Total sleep time in minutes."
    minimum: 0
  waking_duration_min:
    type: number
    description: "Duration of ≥ 2 min waking segment (minimum 0)."
    minimum: 0
required:
  - subject_id
  - stage_label
  - mean_pli
  - n_epochs
  - theta_mean_degree
  - theta_mean_eigenvector
  - alpha_mean_degree
  - alpha_mean_eigenvector
  - theta_icc
  - alpha_icc
  - theta_icc_flag
  - alpha_icc_flag
  - waking_night_id
  - sleep_night_id
  - temporal_proximity
  - total_sleep_time_min
  - waking_duration_min
additionalProperties: false