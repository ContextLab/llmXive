$schema: "http://json-schema.org/draft-07/schema#"
title: "SubjectMetricsSchema"
description: "Schema for the aggregated subject-level metrics CSV (one row per subject per sleep stage)."
type: object
properties:
  subject_id:
    type: string
    description: "Unique identifier for the subject (e.g., S001)."
  stage_label:
    type: string
    description: "Sleep stage label."
    enum:
      - "N1"
      - "N2"
      - "N3"
      - "REM"
  mean_pli:
    type: number
    description: "Mean Phase Lag Index across all epochs of this stage."
    minimum: 0
    maximum: 1
  n_epochs:
    type: integer
    description: "Number of epochs included in the mean PLI calculation."
    minimum: 1
  centrality_degree_mean:
    type: number
    description: "Mean degree centrality across all nodes in the waking network."
  centrality_betweenness_mean:
    type: number
    description: "Mean betweenness centrality across all nodes in the waking network."
  centrality_eigenvector_mean:
    type: number
    description: "Mean eigenvector centrality across the **EEG‑only** network."
  waking_night_id:
    type: string
    description: "Identifier for the waking recording night (extracted from EDF header)."
  sleep_night_id:
    type: string
    description: "Identifier of the sleep recording night."
  temporal_proximity:
    type: boolean
    description: "True if waking and sleep nights are the same."
  age:
    type: ["integer", "null"]
    description: "Age in years (optional)."
  gender:
    type: ["string", "null"]
    description: "Gender (M or F, optional)."
  total_sleep_time_min:
    type: number
    description: "Total sleep time in minutes."
    minimum: 0
  waking_duration_min:
    type: number
    description: "Duration of the **≥ 2 min** waking segment."
    minimum: 0
  centrality_icc:
    type: number
    description: "Split‑half Intraclass Correlation Coefficient for centrality stability within the waking segment."
  centrality_icc_flag:
    type: boolean
    description: "True if ICC < 0.6 (unstable)."
  centrality_wake_sleep_icc:
    type: number
    description: "Cross‑state ICC between waking centrality and N2‑stage centrality."
  centrality_wake_sleep_icc_flag:
    type: boolean
    description: "True if cross‑state ICC < 0.6 (unstable across states)."
required:
  - subject_id
  - stage_label
  - mean_pli
  - n_epochs
  - centrality_degree_mean
  - centrality_betweenness_mean
  - centrality_eigenvector_mean
  - waking_night_id
  - sleep_night_id
  - temporal_proximity
  - total_sleep_time_min
  - waking_duration_min
additionalProperties: false