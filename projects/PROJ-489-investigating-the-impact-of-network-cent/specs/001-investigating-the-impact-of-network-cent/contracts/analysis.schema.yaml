$schema: "http://json-schema.org/draft-07/schema#"
title: "AnalysisResultSchema"
description: "Schema for the correlation analysis results JSON."
type: object
properties:
  metric_name:
    type: string
    description: "Centrality metric name."
    enum:
      - "degree"
      - "betweenness"
      - "eigenvector"
  stage_label:
    type: string
    description: "Sleep stage label."
    enum:
      - "N1"
      - "N2"
      - "N3"
      - "REM"
  band:
    type: string
    description: "Frequency band used for connectivity."
    enum:
      - "theta"
      - "alpha"
  correlation_coefficient:
    type: number
    description: "Pearson, Spearman, or partial correlation coefficient."
  p_value_raw:
    type: number
    description: "Unadjusted p-value."
    minimum: 0
    maximum: 1
  p_value_corrected:
    type: number
    description: "Bonferroni-corrected p-value."
    minimum: 0
    maximum: 1
  significant:
    type: boolean
    description: "True if corrected p < 0.05."
  method:
    type: string
    description: "Correlation method used."
    enum:
      - "pearson"
      - "spearman"
      - "partial"
  global_vif_flag:
    type: boolean
    description: "True if global VIF across subjects exceeds 5.0."
  temporal_proximity_flag:
    type: boolean
    description: "True if waking and sleep recordings are from the same night."
required:
  - metric_name
  - stage_label
  - band
  - correlation_coefficient
  - p_value_raw
  - p_value_corrected
  - significant
  - method
  - global_vif_flag
  - temporal_proximity_flag
additionalProperties: false