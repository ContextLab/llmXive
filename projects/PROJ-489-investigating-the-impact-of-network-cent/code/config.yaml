# Configuration for Network Centrality and Sleep Synchrony Analysis
random_seed: 42

# Signal Processing Parameters
signal_processing:
  filter:
    low_cutoff: 0.5
    high_cutoff: 45.0
    filter_type: "bandpass"
    order: 4
    method: "butter"
  ica:
    n_components: 0.95
    algorithm: "fastica"
    thresholds:
      kurtosis: 5.0
      high_freq_power_multiplier: 3.0
  epoching:
    duration: 30
    sleep_stages: ["Wake", "N1", "N2", "N3", "REM"]

# Frequency Band Definitions (Hz)
frequency_bands:
  theta: [4.0, 8.0]
  alpha: [8.0, 13.0]
  waking_connectivity: ["theta", "alpha"]

# Statistics
statistics:
  alpha: 0.05
  correction_method: "bonferroni"
  min_sample_size: 30
  vif_threshold: 5.0

# Path Configuration
paths:
  raw_data: "data/raw/"
  processed_data: "data/processed/"
  metrics_output: "data/metrics/"
  results_output: "data/results/"
