[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-dark-matter-halos"
version = "0.1.0"
description = "Investigating Statistical Properties of Simulated Dark Matter Halos"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "h5py",
    "requests",
    "pyarrow",
    "pyyaml",
    "matplotlib",
    "seaborn",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.flake8]
max-line-length = 100
ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]
per-file-ignores = []
extend-ignore = []

[tool.pylint.messages_control]
disable = [
    "C0111",
    "C0103",
    "R0903",
    "W0511",
]

[tool.pylint.format]
max-line-length = 100