$schema: "http://json-schema.org/draft-07/schema#"
title: "Processed Trial Dataset Schema"
type: "object"
properties:
  trial_id:
    type: "string"
    description: "Unique identifier for the trial"
  participant_id:
    type: "string"
    description: "Unique identifier for the participant"
  response_time:
    type: "number"
    description: "Response time in milliseconds"
  prime_valence:
    type: "number"
    description: "Derived or human-rated prime valence score"
    minimum: -1.0
    maximum: 1.0
  stimulus_ambiguity:
    type: "number"
    description: "Stimulus ambiguity score"
    minimum: 0.0
    maximum: 1.0
  stimulus_id:
    type: "string"
    description: "Link to stimulus metadata"
  linkage_status:
    type: "string"
    enum:
      - "linked"
      - "missing_image"
      - "missing_metadata"
    description: "Status of the linkage process"
required:
  - trial_id
  - participant_id
  - response_time
  - prime_valence
  - stimulus_ambiguity
  - stimulus_id
  - linkage_status
additionalProperties: false
