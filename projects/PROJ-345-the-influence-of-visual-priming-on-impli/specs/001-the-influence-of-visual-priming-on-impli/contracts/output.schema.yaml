$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Convergence Metrics Schema"
type: "object"
properties:
  convergence_rate:
    type: "number"
    description: "Ratio of successful model convergences"
    minimum: 0.0
    maximum: 1.0
  total_attempts:
    type: "integer"
    description: "Total number of model fitting attempts"
    minimum: 1
  successful_runs:
    type: "integer"
    description: "Number of successful model fits"
    minimum: 0
  failed_runs:
    type: "integer"
    description: "Number of failed model fits"
    minimum: 0
  optimizer_settings:
    type: "array"
    items:
      type: "string"
    description: "List of optimizer settings attempted"
required:
  - convergence_rate
  - total_attempts
  - successful_runs
  - failed_runs
  - optimizer_settings
additionalProperties: false
