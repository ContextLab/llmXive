T019:
  c: false
  h: 3bcff88cfcc5711e4acf76850b992fb01e8d86401934ea770cccf9ec3149cf4a
  r: 'The provided `code/preprocessing.py` is truncated, never reads `data/contracts/alloy_class_map.json`,
