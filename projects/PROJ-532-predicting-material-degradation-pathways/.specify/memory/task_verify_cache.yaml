    OOD_SPLIT_FAILED` and message. The claimed parquet files are only described as
    simulated text placeholders, not real Parquet outputs. Consequently the OOD split
    implementation and required artifacts are not genuinely present.'
T019a:
  c: false
  h: 92458e6283fe98e26cf72de8a4e61c14bcadf0fcb85ad3e52f8f0a99b2c4ffd1
  r: "The provided `alloy_class_map.json` is a fabricated sample (it contains a comment,\
    \ which is invalid JSON, and maps record IDs to classes rather than the required\
    \ class\u2011to\u2011indices map). Moreover, the required input file `data/processed/cleaned_alloys.csv`\
