# Ruff configuration for PROJ-532-predicting-material-degradation-pathways
# Enforces PEP 8 compliance, imports sorting, and project-specific rules

line-length = 100
target-version = "py311"

[lint]
# Enable specific rule sets
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort (import sorting)
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "S",  # flake8-bandit (security)
]

# Ignore specific rules that conflict with project style or are too noisy
ignore = [
    "E501", # Line too long (handled by line-length above, but sometimes needed)
    "B008", # Do not perform function call in argument defaults (common in data pipelines)
    "S101", # Use of assert (allowed in tests and simple checks)
]

[lint.isort]
known-first-party = ["utils", "ingestion", "preprocessing", "training", "evaluation", "explainability", "literature_review", "config_env"]
force-to-top = ["utils"]
order-by-type = true
lines-after-imports = 2

[lint.per-file-ignores]
# Allow specific exceptions for test files if needed
"tests/*" = ["S101", "B018"]
