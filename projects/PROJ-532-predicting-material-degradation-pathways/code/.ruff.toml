# Ruff configuration for PROJ-532
# Enforces PEP 8 compliance and project-specific rules

[lint]
# Select specific rule categories
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "C90", # mccabe (complexity)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modernize syntax)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
]

# Ignore specific rules that are too noisy or conflict with style
ignore = [
    "E501", # line-too-long (handled by black)
    "SIM117", # avoid-redundant-async (sometimes too aggressive)
]

[lint.per-file-ignores]
# Allow unused imports in __init__.py for public API exposure
"code/__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["utils", "ingestion", "preprocessing", "training", "evaluation", "explainability", "literature_review"]
force-sort-within-sections = true

[format]
# Ruff formatter settings (compatible with Black)
quote-style = "double"
indent-style = "space"
line-ending = "auto"
