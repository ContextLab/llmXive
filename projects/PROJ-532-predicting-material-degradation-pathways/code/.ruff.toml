# Ruff configuration for PROJ-532-predicting-material-degradation-pathways
# This file is required by Task T003.

[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",  # Line too long (handled by Black)
  "F403",  # 'from module import *' used (allowed in specific __init__ files if needed)
  "N806",  # Variable in function should be lowercase (allowing some scientific naming)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude a few files/directories from linting
extend-exclude = [
  "__pycache__",
  "*.pyc",
  "*.ipynb",
  ".git",
  "data/raw",  # External data files
  "data/processed", # Generated data files
  "results", # Generated results
]

[lint.per-file-ignores]
# Allow wildcard imports in __init__.py for clean API surface
"__init__.py" = ["F403", "F405"]
# Allow long lines in test data mocks if necessary
"tests/**/test_*.py" = ["N802"]

[lint.isort]
known-first-party = ["code"]
force-single-line = true
lines-after-imports = 2
