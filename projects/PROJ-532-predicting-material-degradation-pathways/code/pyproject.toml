[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "material-degradation-pipeline"
version = "0.1.0"
description = "Predicting Material Degradation Pathways from Compositional Data"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "shap",
    "requests",
    "pyyaml",
    "numpy",
    "scipy",
    "pytest",
    "ruff",
    "black",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.ruff]
# Target Python version
target-version = "py311"

# Line length for formatting and linting
line-length = 88

# Exclude generated files and build artifacts
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "data",
    "results",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "I", "UP", "N", "W"]

# Ignore specific rules if necessary (e.g., E501 handled by black)
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["code"]
force-sort-within-sections = false
lines-after-imports = 2

[tool.black]
# Line length matching ruff
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
  | results
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
