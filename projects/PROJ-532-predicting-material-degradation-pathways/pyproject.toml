[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-proj-532"
version = "0.1.0"
description = "Predicting Material Degradation Pathways from Compositional Data"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "shap",
    "requests",
    "pyyaml",
    "numpy",
    "scipy",
    "matplotlib",
    "pyarrow",
]

[tool.setuptools]
packages = ["code"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
  | results
)/
'''

[tool.ruff]
# Path to the separate ruff config file
config = "code/.ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"