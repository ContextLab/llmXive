$schema: "https://json-schema.org/draft/2020-12/schema"
title: "PerFileAnalysis"
type: "object"
required: ["file_id", "source_group", "vulnerability_count", "cwe_ids"]
properties:
  file_id:
    type: "string"
  source_group:
    enum: ["llm", "human", "proxy"]
  language:
    enum: ["python", "javascript", "java", "other"]
  loc:
    type: ["integer", "null"]
  vulnerability_count:
    type: "integer"
    minimum: 0
  deduped_vulnerability_count:
    type: "integer"
    minimum: 0
    description: "Unique vulnerability findings after collapsing duplicates across tools"
  corrected_vulnerability_count:
    type: "integer"
    minimum: 0
    description: "Vulnerability count after adjusting for tool‑specific false‑positive **and** false‑negative rates"
  cwe_ids:
    type: "array"
    items:
      type: "string"
      pattern: "^CWE-[0-9]+$"
  density:
    type: ["number", "null", "string"]
    description: "vulnerabilities per LOC (raw); null or 'undefined' when LOC is zero"
  density_corrected:
    type: ["number", "null", "string"]
    description: "vulnerabilities per LOC after false‑positive and false‑negative correction; null or 'undefined' when LOC is zero"
  tools_run:
    type: "array"
    items:
      enum: ["bandit", "semgrep", "sonarqube"]