$schema: "https://json-schema.org/draft/2020-12/schema"
title: "FileManifest"
type: "object"
required: ["files"]
properties:
  files:
    type: "array"
    minItems: 1
    items:
      type: "object"
      required: ["file_id", "rel_path", "source_group", "language", "status"]
      properties:
        file_id:
          type: "string"
        rel_path:
          type: "string"
        source_group:
          enum: ["llm", "human"]
        language:
          enum: ["python", "javascript", "java", "other"]
        loc:
          type: ["integer", "null"]
        status:
          enum: ["ok", "parse_error", "skipped_size"]
