[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-eval-llm-review-quality"
version = "0.1.0"
description = "Evaluating the Impact of Code Generation on Code Review Quality with LLM Assistance"
requires-python = ">=3.9"
dependencies = []

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.ruff]
# Same as Black
line-length = 100
target-version = "py39"

# Exclude a few directories
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "venv",
    "data",
    "results",
    "logs"
]

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "I", "W", "N", "B", "C90", "UP", "ANN", "S", "BLE", "A", "COM", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "T20", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "ARG", "PTH", "ERA", "PL", "TRY", "FLY", "PERF", "RUF"]
ignore = [
    "ANN101", # Missing type annotation for `self` in method
    "ANN102", # Missing type annotation for `cls` in classmethod
    "S101",   # Use of `assert` detected (often useful in tests)
    "S113",   # Probable use of requests call without timeout (handled by our timeout wrapper)
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar` (dataclasses handle this)
]

# Allow autofix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "ARG"] # Tests often don't need type annotations or strict security checks
"code/setup_*.py" = ["T20"] # Setup scripts often print to stdout intentionally

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a threshold of 10 instead of 15
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["code"]
force-sort-within-sections = false
combine-as-imports = true
