# Contract for BugDetection
# Used to validate JSON output from src/analysis/metrics.py and src/inference/run_inference.py
type: object
required:
  - pr_id
  - file_path
  - line_start
  - line_end
  - severity
  - description
  - source
properties:
  pr_id:
    type: string
  file_path:
    type: string
  line_start:
    type: integer
    minimum: 0
  line_end:
    type: integer
    minimum: 0
  severity:
    type: string
    enum:
      - critical
      - major
      - minor
      - style
  description:
    type: string
  source:
    type: string
    enum:
      - human
      - llm
  confidence:
    type: number
    minimum: 0
    maximum: 1
  is_verified:
    type: boolean
  verification_method:
    type: string
