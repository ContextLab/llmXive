# GitHub Actions workflow for lint enforcement (ruff + black).
#
# NOTE: this file is intentionally stored under ``code/ci/`` rather than
# ``.github/workflows/`` because the top-level ``.github/`` directory is
# platform-owned state in this project tree. To activate it in a real
# GitHub repository, copy it to ``.github/workflows/ci.yml``:
#
#     mkdir -p .github/workflows
#     cp code/ci/github_actions_ci.yml .github/workflows/ci.yml
#
# The workflow runs ``ruff check .`` and ``black --check .`` (both
# configured in the root ``pyproject.toml`` with line-length 88 and the
# exclude patterns for data/, results/, logs/, venv/, and __pycache__).

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt
          pip install ruff black

      - name: Run ruff
        run: ruff check .

      - name: Run black check
        run: black --check .
