$schema: "http://json-schema.org/draft-07/schema#"
title: "AnalysisMetrics Schema"
description: "Schema for aggregated statistical analysis metrics"
type: "object"
required:
  - threshold
  - precision
  - recall
  - f1_score
  - llm_only_recall
  - mcnemar_p_value
  - chi_square_p_value
  - chi_square_statistic
  - effect_size
  - sensitivity_to_noise
  - total_runtime_seconds
properties:
  threshold:
    type: "number"
    description: "The similarity threshold used for this analysis"
    enum:
      - 0.8
      - 0.85
      - 0.9
  precision:
    type: "number"
    description: "Precision of LLM detection"
    minimum: 0.0
    maximum: 1.0
  recall:
    type: "number"
    description: "Recall of LLM detection relative to triangulated ground truth or manual validation set"
    minimum: 0.0
    maximum: 1.0
  f1_score:
    type: "number"
    description: "F1 Score of LLM detection"
    minimum: 0.0
    maximum: 1.0
  llm_only_recall:
    type: "number"
    description: "Proportion of LLM‑only detections that are confirmed in the manual validation set (0.0 when no manual set is available)"
    minimum: 0.0
    maximum: 1.0
  mcnemar_p_value:
    type: "number"
    description: "P‑value from McNemar's test (or exact binomial fallback)"
  chi_square_p_value:
    type: "number"
    description: "P‑value from Chi‑square test (or Fisher's exact fallback)"
  chi_square_statistic:
    type: "number"
    description: "Chi‑square statistic"
  effect_size:
    type: "number"
    description: "Effect size (e.g., Cohen's h or Cramér's V)"
  total_runtime_seconds:
    type: "integer"
    description: "Total wall‑clock runtime of the entire pipeline in seconds (SC‑004)"
    minimum: 0
  sensitivity_to_noise:
    type: "object"
    description: "Results from high‑confidence vs full‑set analysis"
    properties:
      high_confidence_p_value:
        type: "number"
      full_set_p_value:
        type: "number"