$schema: "http://json-schema.org/draft-07/schema#"
title: "RunLogEvent Schema"
description: "Schema for one JSON line emitted by src/pipeline/logging_utils.py to logs/pipeline.jsonl and logs/timeout.log"
type: "object"
required:
  - timestamp
  - event
  - status
properties:
  timestamp:
    type: "string"
    description: "ISO-8601 UTC timestamp of the event"
  event:
    type: "string"
    description: "Event type (e.g., 'timeout', 'pr_skipped', 'retry', 'pr_processed', 'seed_used')"
  pr_id:
    type: "string"
    description: "Optional PR identifier the event concerns"
  status:
    type: "string"
    description: "Outcome status (e.g., 'ok', 'timeout', 'error')"
  detail:
    type: "string"
    description: "Optional human-readable detail"