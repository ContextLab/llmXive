# Schema for Alignment Results matching LLM detections to Human Baseline
# Used for alignment results in analysis
type: object
required:
  - pr_id
  - human_bug_index
  - llm_bug_index
  - match_type
  - jaccard_index
  - cosine_similarity
  - file_path_match
  - line_overlap
properties:
  pr_id:
    type: integer
    description: PR identifier
  human_bug_index:
    type: integer
    description: Index of the bug in the human_baseline list
  llm_bug_index:
    type: integer
    description: Index of the bug in the llm_detections list
  match_type:
    type: string
    enum: [exact, partial, false_positive, false_negative]
    description: Type of alignment match
  jaccard_index:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: Jaccard similarity of line sets (>= 0.5 required for valid match)
  cosine_similarity:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: Cosine similarity of line content embeddings
  file_path_match:
    type: boolean
    description: Whether file paths match exactly
  line_overlap:
    type: boolean
    description: Whether line ranges overlap significantly
  severity_match:
    type: boolean
    description: Whether severity labels match
  alignment_threshold_met:
    type: boolean
    description: Whether both Jaccard (>=0.5) and Cosine (>=0.85) thresholds are met
  notes:
    type: string
    description: Additional notes on the alignment decision
