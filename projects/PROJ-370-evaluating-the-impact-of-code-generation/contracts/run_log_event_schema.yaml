# JSON Schema for pipeline run log events
# Minimal schema ensuring each event has an "event" identifier and a timestamp.
$schema: "http://json-schema.org/draft-07/schema#"
type: object
required:
  - event
  - timestamp
properties:
  event:
    type: string
    description: Name of the logged event.
  timestamp:
    type: string
    format: date-time
    description: ISO‑8601 UTC timestamp of when the event occurred.
  # Additional fields are allowed.
additionalProperties: true