# Schema for Bug Detection results (Human Baseline and LLM Detections)
# Used for human_baseline.json and llm_detections.json
type: object
required:
  - pr_id
  - file_path
  - line_start
  - line_end
  - severity
  - description
properties:
  pr_id:
    type: integer
    description: Reference to the PR containing the bug
  file_path:
    type: string
    description: Path to the file within the repository
  line_start:
    type: integer
    description: Starting line number of the bug (1-indexed)
  line_end:
    type: integer
    description: Ending line number of the bug (1-indexed)
  severity:
    type: string
    enum: [critical, major, minor, style]
    description: Severity classification of the bug
  description:
    type: string
    description: Human-readable description of the bug or detection
  is_verified:
    type: boolean
    description: (Human Baseline only) True if bug meets strict triangulation criteria
  verification_method:
    type: string
    enum: [strict_triangulation, excluded_unverified]
    description: (Human Baseline only) Method used to determine verification status
  detection_source:
    type: string
    enum: [human_baseline, llm_inference]
    description: Origin of the detection
  confidence:
    type: string
    enum: [low, medium, high]
    description: (LLM Detections only) Confidence level of the LLM
  llm_error_flag:
    type: boolean
    description: (LLM Detections only) True if inference failed for this PR
  context_window_truncated:
    type: boolean
    description: Whether the diff was truncated due to context limits
