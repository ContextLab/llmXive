%YAML 1.1
---
# Schema for LLM Bug Detection Results
# Used for output from src/inference/run_inference.py
# Corresponds to src/inference/schema.py InferenceResponse and src/extraction/schema.py BugDetection

$schema: "http://json-schema.org/draft-07/schema#"
title: BugDetectionResult
description: "Bug detection results generated by the LLM inference pipeline"

type: object
required:
  - pr_id
  - repo_name
  - detection_status
  - timestamp
properties:
  pr_id:
    type: integer
    description: "GitHub Pull Request number"

  repo_name:
    type: string
    description: "Full repository name (owner/repo)"

  detection_status:
    type: string
    enum: [success, error, timeout, skipped]
    description: "Status of the detection run"

  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp when detection was performed"

  llm_code_flag:
    type: boolean
    description: "Whether LLM-generated code was detected in the PR"

  bugs_detected:
    type: array
    description: "List of bugs identified by the LLM"
    items:
      type: object
      required:
        - file_path
        - line_start
        - line_end
        - severity
        - description
      properties:
        file_path:
          type: string
          description: "Path to the file containing the bug"
          example: "src/core/processor.py"

        line_start:
          type: integer
          description: "Starting line number of the bug"
          minimum: 1

        line_end:
          type: integer
          description: "Ending line number of the bug"
          minimum: 1
          exclusiveMinimum: false

        severity:
          type: string
          enum: [critical, major, minor, style]
          description: "Severity classification of the bug"

        description:
          type: string
          description: "Human-readable description of the bug"

  llm_error_flag:
    type: boolean
    description: "True if the LLM failed to parse or return valid JSON"
    default: false

  error_message:
    type: string
    description: "Error message if detection_status is 'error'"
    nullable: true

  latency_seconds:
    type: number
    description: "Time taken for inference in seconds"
    minimum: 0
    nullable: true

additionalProperties: false
