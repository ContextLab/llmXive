$schema: http://json-schema.org/draft-07/schema#
title: PullRequestData
description: |
  Schema for raw Pull Request data extracted from GitHub.
  Includes the PR metadata, diff content, and linked issues.
  Linked issues are marked as 'reported' but not verified ground truth.
type: object
required:
  - pr_id
  - repo_name
  - title
  - body
  - state
  - created_at
  - updated_at
  - author
  - diff
  - linked_issue_ids
  - review_comments
properties:
  pr_id:
    type: integer
    description: GitHub Pull Request number
  repo_name:
    type: string
    description: Repository name in format 'owner/repo'
  title:
    type: string
    description: PR title
  body:
    type: string
    description: PR description body
  state:
    type: string
    enum: [open, closed, merged]
    description: Current state of the PR
  created_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of PR creation
  updated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of last update
  author:
    type: string
    description: GitHub username of the PR author
  diff:
    type: string
    description: The raw unified diff of the PR
  linked_issue_ids:
    type: array
    items:
      type: integer
    description: |
      List of issue IDs explicitly linked in the PR (e.g., "Fixes #123").
      These are reported links, NOT verified ground truth for bugs.
  review_comments:
    type: array
    items:
      type: object
      required:
        - id
        - author
        - body
        - path
        - line
        - created_at
      properties:
        id:
          type: integer
          description: Comment ID
        author:
          type: string
          description: Commenter username
        body:
          type: string
          description: Comment text
        path:
          type: string
          description: File path in the PR
        line:
          type: integer
          description: Line number (1-indexed)
        created_at:
          type: string
          format: date-time
          description: Comment timestamp
