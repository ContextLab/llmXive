# Schema for Pull Request data extracted from GitHub
# Used for raw PR data and derived datasets
type: object
required:
  - pr_id
  - repo_name
  - url
  - title
  - body
  - created_at
  - state
  - author
  - files_changed
  - additions
  - deletions
  - linked_issue_ids
  - review_comments
  - diff_content
properties:
  pr_id:
    type: integer
    description: GitHub PR number
  repo_name:
    type: string
    description: Repository identifier (owner/repo)
  url:
    type: string
    format: uri
    description: Full URL to the PR
  title:
    type: string
    description: PR title
  body:
    type: string
    description: PR description body
  created_at:
    type: string
    format: date-time
    description: ISO 8601 creation timestamp
  state:
    type: string
    enum: [open, closed, merged]
    description: Current state of the PR
  author:
    type: string
    description: GitHub username of the PR author
  files_changed:
    type: integer
    description: Number of files modified
  additions:
    type: integer
    description: Total lines added
  deletions:
    type: integer
    description: Total lines removed
  linked_issue_ids:
    type: array
    items:
      type: integer
    description: List of issue numbers linked to this PR (reported, not ground truth)
  review_comments:
    type: array
    items:
      type: object
      required:
        - comment_id
        - author
        - body
        - created_at
        - path
        - line
        - position
      properties:
        comment_id:
          type: integer
        author:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
        path:
          type: string
        line:
          type: integer
          nullable: true
        position:
          type: integer
          nullable: true
  diff_content:
    type: string
    description: Unified diff string for the PR
  llm_code_flag:
    type: boolean
    description: Flag indicating if LLM-generated code was detected
  llm_code_confidence:
    type: string
    enum: [low, medium, high]
    description: Confidence level of LLM detection
  checksum:
    type: string
    description: SHA-256 checksum of the raw JSON payload
