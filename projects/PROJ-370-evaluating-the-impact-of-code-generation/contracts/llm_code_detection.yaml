$schema: http://json-schema.org/draft-07/schema#
title: LLMCodeDetectionResult
description: |
  Schema for results detecting if code in a PR diff was generated by an LLM.
  Used to split datasets into Human-Written and LLM-Generated subsets.
type: object
required:
  - pr_id
  - file_path
  - llm_code_flag
  - confidence
properties:
  pr_id:
    type: integer
    description: Pull Request ID
  file_path:
    type: string
    description: File path within the PR
  llm_code_flag:
    type: boolean
    description: True if LLM-generated code was detected
  confidence:
    type: string
    enum: [low, medium, high]
    description: Confidence level of the detection heuristic
  heuristic_details:
    type: string
    description: Brief explanation of why the heuristic triggered (optional)