[project]
name = "llmXive-statistical-properties"
version = "0.1.0"
description = "Statistical properties of simulated black hole mergers"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "requests",
    "tqdm",
    "pytest",
    "h5py",
    "statsmodels",
    "memory-profiler",
]

[tool.black]
line-length = 88
target-version = ["py39"]
