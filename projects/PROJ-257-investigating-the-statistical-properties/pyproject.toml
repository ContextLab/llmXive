[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statistical-properties-black-hole-mergers"
version = "0.1.0"
description = "Investigating the statistical properties of simulated black hole mergers"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "requests",
    "tqdm",
    "pytest",
    "h5py",
    "statsmodels",
    "memory-profiler",
]

[tool.black]
line-length = 88
target-version = ['py39']
