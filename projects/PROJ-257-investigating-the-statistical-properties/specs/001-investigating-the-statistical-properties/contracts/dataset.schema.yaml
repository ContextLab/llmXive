$schema: "http://json-schema.org/draft-07/schema#"
title: "Merger Dataset Row Schema"
description: "Schema for preprocessed observational (or synthetic) black‑hole merger catalog rows."
type: "object"
properties:
  event_id:
    type: "string"
    description: "Unique identifier for the merger event."
  component_mass_1:
    type: "number"
    description: "Primary component mass in solar masses (M_sun)."
    minimum: 0
  component_mass_2:
    type: "number"
    description: "Secondary component mass in solar masses."
    minimum: 0
  mass_ratio:
    type: "number"
    description: "Mass ratio q = m2 / m1 (0 < q <= 1)."
    exclusiveMinimum: 0
    maximum: 1
  effective_spin:
    type: "number"
    description: "Effective spin parameter (chi_eff)."
    minimum: -1
    maximum: 1
  formation_channel:
    type: "string"
    description: "Origin of the event."
    enum:
      - "GWTC_observed"
      - "synthetic_power_law"
      - "synthetic"
  data_status:
    type: "string"
    description: "Provenance flag."
    enum:
      - "real"
      - "synthetic"
required:
  - event_id
  - component_mass_1
  - component_mass_2
  - mass_ratio
  - effective_spin
  - formation_channel
  - data_status
additionalProperties: false