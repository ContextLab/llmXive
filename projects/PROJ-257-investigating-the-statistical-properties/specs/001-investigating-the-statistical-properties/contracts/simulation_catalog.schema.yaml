$schema: "http://json-schema.org/draft-07/schema#"
title: "Simulation Catalog Schema"
description: "Schema for synthetic binary‑black‑hole population catalog rows derived from a power‑law spin hypothesis."
type: "object"
properties:
  event_id:
    type: "string"
    description: "Unique identifier for the synthetic event."
  component_mass_1:
    type: "number"
    description: "Primary component mass in solar masses."
    minimum: 0
  component_mass_2:
    type: "number"
    description: "Secondary component mass in solar masses."
    minimum: 0
  mass_ratio:
    type: "number"
    description: "Mass ratio q = m2 / m1 (0 < q <= 1)."
    exclusiveMinimum: 0
    maximum: 1
  effective_spin:
    type: "number"
    description: "Effective aligned spin parameter chi_eff."
    minimum: -1
    maximum: 1
  formation_channel:
    type: "string"
    description: "Source of the synthetic event."
    enum:
      - "derived_from_power_law_spin"
  generation_method:
    type: "string"
    description: "Description of the generation hypothesis (e.g., \"power_law_spin_distribution\")."
  data_status:
    type: "string"
    description: "Provenance flag for synthetic data."
    enum:
      - "synthetic"
required:
  - event_id
  - component_mass_1
  - component_mass_2
  - mass_ratio
  - effective_spin
  - formation_channel
  - generation_method
  - data_status
additionalProperties: false
