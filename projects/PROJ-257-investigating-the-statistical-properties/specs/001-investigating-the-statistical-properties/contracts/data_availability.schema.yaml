$schema: "http://json-schema.org/draft-07/schema#"
title: "Data Availability Report Schema"
description: "Report on the status of external data downloads."
type: "object"
properties:
  source_name:
    type: "string"
    description: "Name of the data source (e.g., \"GWTC-1\")."
  status:
    type: "string"
    description: "Verification outcome."
    enum:
      - "verified"
      - "unavailable"
  reason:
    type: "string"
    description: "Explanation when status is \"unavailable\"."
  checksum:
    type: "string"
    description: "SHA‑256 checksum of the accepted file; null if unavailable."
required:
  - source_name
  - status
  - reason
  - checksum
additionalProperties: false