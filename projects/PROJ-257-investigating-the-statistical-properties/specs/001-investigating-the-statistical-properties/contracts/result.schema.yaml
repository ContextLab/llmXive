$schema: "http://json-schema.org/draft-07/schema#"
title: "Data Availability Report Schema"
description: "Re‑purposed schema for GWTC data‑availability reports (used by T002)."
type: "object"
properties:
  source_name:
    type: "string"
    description: "Name of the data source."
  status:
    type: "string"
    enum:
      - "verified"
      - "unavailable"
  reason:
    type: "string"
    description: "Failure reason when unavailable."
  checksum:
    type: "string"
    description: "SHA‑256 checksum if file was accepted, else null."
required:
  - source_name
  - status
  - reason
  - checksum
additionalProperties: false