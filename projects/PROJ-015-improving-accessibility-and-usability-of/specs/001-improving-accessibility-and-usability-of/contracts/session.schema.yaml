$schema: "http://json-schema.org/draft-07/schema#"
title: "Session Schema"
description: "Schema for a single interaction session in the accessibility study."
type: "object"
required:
  - session_id
  - participant_id
  - interface_variant
  - order
  - task_results
  - sus_responses
  - status
properties:
  session_id:
    type: "string"
    description: "Unique identifier for the session (UUID)."
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
  participant_id:
    type: "string"
    description: "Anonymized participant identifier."
    minLength: 3
  interface_variant:
    type: "string"
    enum:
      - "traditional"
      - "explainable"
    description: "The interface variant presented."
  order:
    type: "string"
    enum:
      - "T->X"
      - "X->T"
    description: "Order of presentation (Latin Square)."
  task_results:
    type: "object"
    required:
      - completion_time
      - error_count
      - explanation_engagement_time
    properties:
      completion_time:
        type: "number"
        minimum: 0
        description: "Time in seconds to complete the task."
      error_count:
        type: "integer"
        minimum: 0
        description: "Number of errors made."
      explanation_engagement_time:
        type: "number"
        minimum: 0
        description: "Time spent viewing XAI overlays."
  sus_responses:
    type: "array"
    minItems: 10
    maxItems: 10
    items:
      type: "integer"
      minimum: 1
      maximum: 5
    description: "Array of 10 SUS responses (1-5 scale)."
  status:
    type: "string"
    enum:
      - "complete"
      - "incomplete"
    description: "Status of the session."
additionalProperties: false
