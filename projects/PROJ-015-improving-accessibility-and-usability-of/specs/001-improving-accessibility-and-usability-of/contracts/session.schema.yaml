$schema: "http://json-schema.org/draft-07/schema#"
title: "Session Data Schema"
description: "Schema for validating raw interaction data collected from the Streamlit simulator."
type: "object"
required:
  - "session_id"
  - "participant_id"
  - "interface_variant"
  - "task_start"
  - "task_end"
  - "sus_responses"
  - "explanation_engagement_time_ms"
  - "status"
properties:
  session_id:
    type: "string"
    description: "Unique identifier for the session (UUID)."
  participant_id:
    type: "string"
    description: "Anonymized participant ID."
  interface_variant:
    type: "string"
    enum:
      - "Traditional"
      - "Explainable"
    description: "The interface variant used in this session."
  task_start:
    type: "string"
    format: "date-time"
    description: "ISO8601 timestamp of task start."
  task_end:
    type: "string"
    format: "date-time"
    description: "ISO8601 timestamp of task end."
  errors:
    type: "array"
    items:
      type: "object"
      properties:
        error_type:
          type: "string"
        timestamp:
          type: "string"
          format: "date-time"
    description: "List of errors encountered during the task."
  explanation_engagement_time_ms:
    type: "integer"
    minimum: 0
    description: "Time spent interacting with XAI overlays in milliseconds."
  sus_responses:
    type: "array"
    minItems: 10
    maxItems: 10
    items:
      type: "integer"
      minimum: 1
      maximum: 5
    description: "10-item System Usability Scale responses (1-5). All 10 must be present."
  status:
    type: "string"
    enum:
      - "complete"
      - "incomplete"
    description: "Status of the session. 'incomplete' sessions are excluded from analysis."
additionalProperties: false