$schema: "http://json-schema.org/draft-07/schema#"
title: "Bootstrap Metrics Schema"
type: object
required:
  - dataset
  - variant_id
  - bootstrap_iterations
  - p_value_ci
  - effect_size_ci
properties:
  dataset:
    type: string
  variant_id:
    type: string
  bootstrap_iterations:
    type: integer
    minimum: 1
    description: "Number of bootstrap samples used (must equal config.BOOTSTRAP_ITERATIONS)."
  p_value_ci:
    type: object
    required: [lower, upper]
    properties:
      lower:
        type: number
        minimum: 0
        maximum: 1
      upper:
        type: number
        minimum: 0
        maximum: 1
  effect_size_ci:
    type: object
    required: [lower, upper]
    properties:
      lower:
        type: number
      upper:
        type: number
