$schema: "http://json-schema.org/draft-07/schema#"
title: "Bootstrap Metrics Schema"
type: object
required:
  - dataset
  - variant_id
  - bootstrap_iterations
  - p_value_ci
  - effect_size_ci
properties:
  dataset_id:
    type: "string"
  cleaning_variant:
    type: "string"
  bootstrap_ci_lower:
    type: "number"
    description: "Lower bound of bootstrap confidence interval for effect size."
  bootstrap_ci_upper:
    type: "number"
    description: "Upper bound of bootstrap confidence interval for effect size."
  iterations:
    type: "integer"
    minimum: 1
    description: "Number of bootstrap resamples used (must match config.BOOTSTRAP_ITERATIONS)."
additionalProperties: false