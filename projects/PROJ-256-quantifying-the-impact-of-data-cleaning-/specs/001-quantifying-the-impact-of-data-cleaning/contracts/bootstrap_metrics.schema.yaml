$schema: "http://json-schema.org/draft-07/schema#"
title: "Bootstrap Metrics Schema"
description: "Validates bootstrap confidence intervals for each cleaning variant."
type: object
required:
  - dataset_id
  - cleaning_variant
  - bootstrap_ci_lower
  - bootstrap_ci_upper
  - iterations
properties:
  dataset_id:
    type: string
    description: "Matches an entry in dataset_metadata.json."
  cleaning_variant:
    type: string
    description: "Identifier of the cleaning variant (same format as variant_id)."
  bootstrap_ci_lower:
    type: number
    description: "Lower bound of bootstrap CI for the primary effect size."
  bootstrap_ci_upper:
    type: number
    description: "Upper bound of bootstrap CI for the primary effect size."
  iterations:
    type: integer
    minimum: 1
    description: "Number of bootstrap resamples; must equal config.BOOTSTRAP_ITERATIONS."
additionalProperties: false
