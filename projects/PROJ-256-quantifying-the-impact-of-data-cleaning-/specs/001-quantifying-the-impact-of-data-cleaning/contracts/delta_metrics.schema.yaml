$schema: "http://json-schema.org/draft-07/schema#"
title: "Delta Metrics Schema"
description: "Minimal schema for per‑variant delta fields required by SC‑001."
type: object
required:
  - dataset_id
  - variant_id
  - p_value_delta
  - direction
  - ci_overlap
  - effect_size_change
properties:
  dataset_id:
    type: string
  variant_id:
    type: string
  p_value_delta:
    type: number
    description: "Baseline p‑value minus cleaned p‑value (≥ 0.001 precision)."
  direction:
    type: string
    enum: ["increase", "decrease"]
  ci_overlap:
    type: number
    minimum: 0
    maximum: 1
  effect_size_change:
    type: number
    description: "Absolute change in effect size (≥ 0.001 precision)."
