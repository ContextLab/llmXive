$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Metadata Schema"
type: object
required:
  - dataset_id
  - outcome_column
  - n_rows
  - missingness_rate
  - source_url
  - checksum
properties:
  dataset_id:
    type: string
    description: "Unique identifier for the dataset (e.g., 'uci_har')."
  outcome_column:
    type: string
    description: "Name of the documented outcome variable."
  n_rows:
    type: integer
    minimum: 1
    description: "Number of rows in the raw dataset."
  missingness_rate:
    type: number
    minimum: 0
    maximum: 1
    description: "Proportion of missing values before any cleaning."
  source_url:
    type: string
    format: uri
    description: "Verified download URL (must be one of the URLs in the Verified Datasets block)."
  checksum:
    type: string
    pattern: "^[a-fA-F0-9]{64}$"
    description: "SHA‑256 checksum of the raw file."
