$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema"
type: object
required:
  - name
  - outcome_column
  - n_samples
  - missingness_proportion
  - checksum
properties:
  name:
    type: string
    description: "Human‑readable identifier of the dataset (e.g., 'Wine Quality')."
  outcome_column:
    type: string
    description: "Name of the documented outcome variable."
  n_samples:
    type: integer
    minimum: 1
    description: "Number of rows after loading."
  missingness_proportion:
    type: number
    minimum: 0
    maximum: 1
    description: "Proportion of missing values before any cleaning."
  checksum:
    type: string
    pattern: "^[a-fA-F0-9]{64}$"
    description: "SHA‑256 checksum of the raw file."
