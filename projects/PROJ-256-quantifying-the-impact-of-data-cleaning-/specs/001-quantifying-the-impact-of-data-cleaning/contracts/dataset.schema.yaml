$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Metadata Schema"
type: object
required:
  - name
  - outcome_column
  - outcome_type
  - n_rows
  - missingness_proportion
properties:
  name:
    type: string
    description: "Human‑readable identifier of the dataset (e.g., 'Wine Quality')."
  outcome_column:
    type: string
    description: "Exact column name designated as the dependent variable."
  outcome_type:
    type: string
    enum: [binary, continuous]
    description: "Whether the outcome is binary or continuous."
  n_rows:
    type: integer
    minimum: 1
    description: "Number of rows after dropping rows with missing outcome."
  missingness_proportion:
    type: number
    minimum: 0
    maximum: 1
    description: "Proportion of missing values across all predictor columns."
