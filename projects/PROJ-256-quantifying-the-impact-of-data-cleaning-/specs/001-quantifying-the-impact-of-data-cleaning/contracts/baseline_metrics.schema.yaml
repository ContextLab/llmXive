$schema: "http://json-schema.org/draft-07/schema#"
title: "Baseline Metrics Schema"
type: object
required:
  - dataset_id
  - test_type
  - p_value
  - p_value_delta
  - ci_lower
  - ci_upper
  - effect_size
  - assumptions_met
properties:
  dataset_id:
    type: string
  test_type:
    type: string
    enum: ["t-test", "welch-t-test", "linear-regression"]
  p_value:
    type: number
    minimum: 0
    maximum: 1
    description: "Three‑decimal precision required."
  p_value_delta:
    type: number
    const: 0.0
    description: "Baseline delta is always at its reference level."
  ci_lower:
    type: number
  ci_upper:
    type: number
  effect_size:
    type: number
  assumptions_met:
    type: boolean
  # Optional fields for future extensions (allowed but not required)
  additional_info:
    type: object
    additionalProperties: true
