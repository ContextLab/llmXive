$schema: "http://json-schema.org/draft-07/schema#"
title: "Baseline Metrics Schema"
description: "Validates baseline statistical results on raw data."
type: object
required:
  - dataset_id
  - test_type
  - p_value
  - ci_lower
  - ci_upper
  - effect_size
  - assumptions_met
properties:
  dataset_id:
    type: string
    description: "Identifier matching an entry in dataset_metadata.json."
  test_type:
    type: string
    enum: ["t_test", "welch_t", "linear_regression"]
    description: "Statistical test performed on the raw data."
  p_value:
    type: number
    minimum: 0
    maximum: 1
    description: "P‑value rounded to ≥ 3 decimal places."
  ci_lower:
    type: number
    description: "Lower bound of the 95 % confidence interval."
  ci_upper:
    type: number
    description: "Upper bound of the 95 % confidence interval."
  effect_size:
    type: number
    description: "Cohen's d for t‑tests or R² for regressions."
  assumptions_met:
    type: boolean
    description: "True if all pre‑test assumptions were satisfied."
