$schema: "http://json-schema.org/draft-07/schema#"
title: "Baseline Metrics Schema"
type: "object"
properties:
  dataset_id:
    type: "string"
    description: "Unique identifier of the source dataset (e.g., HuggingFace repo name)."
  predictor:
    type: "string"
    description: "Name of the independent variable column."
  outcome:
    type: "string"
    description: "Name of the dependent variable column."
  test_type:
    type: "string"
    enum: ["ttest", "ols"]
    description: "Statistical test performed."
  p_value:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Two‑sided p‑value (≥ 3‑decimal precision)."
  ci_lower:
    type: "number"
    description: "Lower bound of 95 % confidence interval for the effect size."
  ci_upper:
    type: "number"
    description: "Upper bound of 95 % confidence interval for the effect size."
  effect_size:
    type: "number"
    description: "Cohen’s d (t‑test) or standardized β (OLS)."
  bootstrap_iterations:
    type: "integer"
    minimum: a sufficiently large sample size
    description: "Number of bootstrap resamples used."
  delta_ci_low:
    type: ["number", "null"]
    description: "Bootstrap CI lower bound for delta vs. cleaned (optional)."
  delta_ci_high:
    type: ["number", "null"]
    description: "Bootstrap CI upper bound for delta vs. cleaned (optional)."
  assumption_passed:
    type: "boolean"
    description: "True if classical assumptions held; False if robust fallback used."
required:
  - dataset_id
  - predictor
  - outcome
  - test_type
  - p_value
  - ci_lower
  - ci_upper
  - effect_size
  - bootstrap_iterations
additionalProperties: false