$schema: "http://json-schema.org/draft-07/schema#"
title: "Baseline Metrics Schema"
type: object
required:
  - dataset
  - test_type
  - p_value
  - ci_lower
  - ci_upper
  - effect_size
properties:
  dataset:
    type: string
    description: "Dataset name matching entry in dataset_metadata.json."
  test_type:
    type: string
    enum: [chi2, fisher, logistic_regression, welch_t, ols]
    description: "Statistical test performed."
  p_value:
    type: number
    minimum: 0
    maximum: 1
    description: "P‑value reported with ≥ 3 decimal precision."
  ci_lower:
    type: number
    description: "Lower bound of the confidence interval at a conventional confidence level."
  ci_upper:
    type: number
    description: "Upper bound of the confidence interval at a conventional confidence level."
  effect_size:
    type: number
    description: "Cohen's d for continuous, odds ratio for binary."
