$schema: "http://json-schema.org/draft-07/schema#"
title: "Null FPR Metrics Schema"
type: "object"
properties:
  dataset_id:
    type: "string"
    description: "Identifier of the original dataset."
  outlier_k:
    type: "number"
    description: "IQR multiplier used for this permutation batch."
  fpr:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "False‑positive‑rate (proportion of p < 0.05)."
  num_permutations:
    type: "integer"
    minimum: 1
    description: "Number of permutation datasets generated."
  seed:
    type: "integer"
    description: "Random seed used for permutation generation."
required:
  - dataset_id
  - outlier_k
  - fpr
  - num_permutations
  - seed
additionalProperties: false