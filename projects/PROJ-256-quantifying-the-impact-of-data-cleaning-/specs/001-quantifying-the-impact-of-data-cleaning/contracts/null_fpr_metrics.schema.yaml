$schema: "http://json-schema.org/draft-07/schema#"
title: "Null FPR Metrics Schema"
type: object
required:
  - dataset_id
  - variant_id
  - missingness_mechanism
  - fpr
  - fpr_ci_lower
  - fpr_ci_upper
properties:
  dataset_id:
    type: string
  variant_id:
    type: string
  missingness_mechanism:
    type: string
    enum: ["none", "MCAR", "MAR", "MNAR"]
  fpr:
    type: number
    minimum: 0
    maximum: 1
  fpr_ci_lower:
    type: number
    minimum: 0
    maximum: 1
  fpr_ci_upper:
    type: number
    minimum: 0
    maximum: 1
