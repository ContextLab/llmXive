$schema: "http://json-schema.org/draft-07/schema#"
title: "Comparison Report Schema"
type: object
required:
  - overall_effect_size_change_mean
  - overall_ci_overlap_mean
  - overall_fpr_mean
  - variant_summary
properties:
  overall_effect_size_change_mean:
    type: number
  overall_ci_overlap_mean:
    type: number
  overall_fpr_mean:
    type: number
  variant_summary:
    type: array
    description: "One entry per dataset‑variant pair."
    items:
      type: object
      required:
        - variant_id
        - mean_effect_size_change
        - mean_ci_overlap
        - mean_fpr
      properties:
        variant_id:
          type: string
        mean_effect_size_change:
          type: number
        mean_ci_overlap:
          type: number
        mean_fpr:
          type: number
