$schema: "http://json-schema.org/draft-07/schema#"
title: "Comparison Report Schema"
type: object
required:
  - generated_at
  - aggregated_deltas
properties:
  generated_at:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp of report generation."
  aggregated_deltas:
    type: array
    description: "One entry per dataset‑variant pair."
    items:
      type: object
      required:
        - dataset
        - variant_id
        - p_value_delta
        - direction
        - ci_overlap
        - effect_size_change
      properties:
        dataset:
          type: string
        variant_id:
          type: string
        p_value_delta:
          type: number
        direction:
          type: string
          enum: ["increase", "decrease"]
        ci_overlap:
          type: number
          minimum: 0
          maximum: 1
        effect_size_change:
          type: number
