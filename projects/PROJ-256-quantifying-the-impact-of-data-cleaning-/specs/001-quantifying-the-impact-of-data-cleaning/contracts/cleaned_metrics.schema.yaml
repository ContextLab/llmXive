$schema: "http://json-schema.org/draft-07/schema#"
title: "Cleaned Metrics Schema"
type: object
required:
  - dataset
  - variant_id
  - rows_removed
  - missing_before
  - missing_after
  - variance_reduction
  - ci_overlap
  - effect_size_change
  - p_value_delta
  - direction
  - assumptions_met
properties:
  dataset:
    type: string
  variant_id:
    type: string
    description: "Identifier encoding cleaning steps, e.g., 'outlier_k1.5_impute_mean'."
  rows_removed:
    type: integer
    minimum: 0
  missing_before:
    type: number
    minimum: 0
    maximum: 1
  missing_after:
    type: number
    minimum: 0
    maximum: 1
  variance_reduction:
    type: number
    minimum: 0
    description: "Proportion of variance lost after imputation (0‑1)."
  ci_overlap:
    type: number
    minimum: 0
    maximum: 1
  effect_size_change:
    type: number
  p_value_delta:
    type: number
    description: "Baseline p‑value minus cleaned p‑value (≥ 3‑decimal)."
  direction:
    type: string
    enum: ["increase", "decrease"]
  assumptions_met:
    type: boolean
    description: "True if all pre‑test assumptions held; false triggers robust fallback."
  robust_used:
    type: boolean
    description: "True if a robust alternative test was employed for the cleaned variant."
