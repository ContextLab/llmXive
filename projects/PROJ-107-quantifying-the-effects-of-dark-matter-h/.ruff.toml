# This file extends the ruff configuration in pyproject.toml
# or can be used as a standalone configuration if pyproject.toml is not preferred.
# For this project, we rely on pyproject.toml, but this file ensures
# compatibility with tools that specifically look for .ruff.toml.

target-version = "py311"
line-length = 88
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[isort]
known-first-party = ["utils", "ingestion", "processing", "analysis", "tests"]
force-sort-within-sections = true
