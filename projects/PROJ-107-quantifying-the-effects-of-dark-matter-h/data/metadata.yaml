# --- SCHEMA DEFINITION ---
# The following structure defines the required fields for all sections.
# This file serves as both the schema documentation and the live state store.
#
# Required Keys:
# - project: name (str), version (str), hardware_constraints (dict)
# - sources: <source_id>: status (str), url (str), checksum (str|null), last_updated (str|null)
