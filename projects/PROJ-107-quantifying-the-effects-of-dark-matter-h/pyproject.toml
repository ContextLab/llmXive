[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-shape-analysis"
version = "0.1.0"
description = "Quantifying the effects of dark matter halo shapes on galaxy formation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "h5py>=3.9.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
