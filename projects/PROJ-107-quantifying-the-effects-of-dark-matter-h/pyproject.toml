[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-dark-matter-halo-analysis"
version = "0.1.0"
description = "Quantifying the Effects of Dark Matter Halo Shapes on Galaxy Formation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "requests>=2.31.0",
    "h5py>=3.9.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | build
    | dist
)/
'''

[tool.setuptools]
packages = ["code"]

[tool.setuptools.package-dir]
"" = "code"