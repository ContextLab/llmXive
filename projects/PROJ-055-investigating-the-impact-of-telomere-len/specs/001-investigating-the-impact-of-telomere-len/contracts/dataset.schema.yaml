$schema: "http://json-schema.org/draft-07/schema#"
title: "SpeciesRecord"
description: "Schema for the merged, cleaned analysis dataset (SpeciesRecord entity). Each row represents a species proxy derived from the verified CSV."
type: "object"
properties:
  species_id:
    type: "string"
    description: "Unique species proxy identifier."
  telomere_length_kb:
    type: "number"
    description: "Telomere length in kilobases."
    exclusiveMinimum: 0
  lifespan_days:
    type: "number"
    description: "Lifespan in days."
    exclusiveMinimum: 0
  migration_status:
    type: "string"
    description: "Migration status of the species proxy."
    enum:
      - "Migratory"
      - "Resident"
      - "Unknown"
  breeding_latitude:
    type: "number"
    description: "Mean breeding latitude (decimal degrees)."
    minimum: -90
    maximum: 90
  body_mass_g:
    type: "number"
    description: "Body mass in grams."
    exclusiveMinimum: 0
  sex:
    type: "string"
    description: "Sex of the individual."
    enum:
      - "Male"
      - "Female"
      - "Unknown"
  age_at_measurement_days:
    type: "number"
    description: "Age of the individual at telomere measurement (days)."
    minimum: 0
  measurement_method:
    type: "string"
    description: "Method used to obtain telomere length."
    enum:
      - "qPCR"
      - "TRF"
      - "Other"
  batch_id:
    type: "string"
    description: "Identifier for the laboratory batch or study source."
  n_obs:
    type: "integer"
    description: "Number of raw rows aggregated into this species proxy."
    minimum: 1
  source_file:
    type: "string"
    description: "Path to the raw CSV file(s) that contributed to this record."
  checksum:
    type: "string"
    description: "SHA‑256 checksum of the raw row block used to create this record."
required:
  - species_id
  - telomere_length_kb
  - lifespan_days
  - migration_status
  - breeding_latitude
  - body_mass_g
  - sex
  - age_at_measurement_days
  - measurement_method
  - batch_id
  - n_obs
  - source_file
  - checksum
additionalProperties: false