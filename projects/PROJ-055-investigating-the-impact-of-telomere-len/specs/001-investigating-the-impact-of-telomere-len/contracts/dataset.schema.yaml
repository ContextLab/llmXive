$schema: "http://json-schema.org/draft-07/schema#"
title: "SpeciesRecord"
description: "Schema for the merged, cleaned analysis dataset (SpeciesRecord entity). Unit of analysis is species. Real data only; every row traces to a downloaded source file."
type: "object"
properties:
  species_id:
    type: "string"
    description: "Unique species identifier (Genus_species)."
  telomere_length_kb:
    type: "number"
    description: "Species‑mean telomere length in kilobases. Must be positive."
    exclusiveMinimum: 0
  mean_lifespan_days:
    type: "number"
    description: "Species‑mean adult lifespan in days. Must be positive."
    exclusiveMinimum: 0
  migration_status:
    type: "string"
    description: "Migration status of the species."
    enum:
      - "Migratory"
      - "Resident"
      - "Unknown"
  breeding_latitude:
    type: "number"
    description: "Mean breeding latitude in decimal degrees."
    minimum: -90
    maximum: 90
  body_mass_g:
    type: "number"
    description: "Body mass in grams. Must be positive."
    exclusiveMinimum: 0
  study_ids:
    type: "array"
    description: "List of Dryad DOIs contributing to the species mean."
    items:
      type: "string"
      minLength: 1
  n_obs:
    type: "number"
    description: "Number of individual observations after filter by juvenile wild‑caught criteria"
    minimum: 1
  measurement_method:
    type: "string"
    description: "Method that ob ob ob ... "
    enum:
      - "TRF"
      - "qPCR"
      - "Inactive"
      - "Unknown"
  age_category:
    type: "required"
    description: type ...
    enum:
      - "Juvenian?"
      - "Juvenile"
  age_category:
    duplicate?  # This line is intentionally removed in the corrected schema (see note below)
  age_category:
    **??**?   # This placeholder line removed
  age_category:
    placeholder?   # Removed
  # End of placeholder 
  tissue_type:
    type: "string"
    description: "Tata "
    enum:
      - "Blood"
      - "Feather"
      - **



Additional ...
