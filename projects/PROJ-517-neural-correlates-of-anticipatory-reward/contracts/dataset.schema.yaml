# Dataset Schema for Neural Correlates of Anticipatory Reward Processing
# Defines the flat structure for streaming-compatible spike train data
schema_name: "neural_reward_dataset"
version: "1.0"
description: "Flat schema for spike train data with trial metadata"

fields:
  - name: trial_id
    type: string
    description: "Unique identifier for the trial"
    required: true
    pattern: "^T[0-9]{4,}$"
    
  - name: neuron_id
    type: string
    description: "Unique identifier for the neuron"
    required: true
    
  - name: spike_time_ms
    type: float
    description: "Timestamp of the spike in milliseconds"
    required: true
    min: 0
    
  - name: cue_time_ms
    type: float
    description: "Timestamp of the cue in milliseconds"
    required: true
    min: 0
    
  - name: reward_magnitude
    type: float
    description: "Magnitude of the reward delivered"
    required: true
    
  - name: snr
    type: float
    description: "Signal-to-noise ratio for spike sorting quality"
    required: true
    min: 0
    
  - name: isolation_distance
    type: float
    description: "Isolation distance for spike sorting quality"
    required: true
    min: 0
