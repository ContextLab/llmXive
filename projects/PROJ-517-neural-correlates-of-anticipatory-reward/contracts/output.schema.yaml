# Output Schema for Analysis Results
# Defines the expected structure of reports and figures
schema_name: "neural_reward_output"
version: "1.0"
description: "Schema for validation reports, model results, and figures"

artifacts:
  - name: validation_report.json
    type: file
    description: "JSON report with data validation metrics"
    schema:
      type: object
      properties:
        ingestion_rows_total:
          type: integer
        ingestion_rows_valid:
          type: integer
        ingestion_rows_dropped:
          type: integer
        validated_sample_size:
          type: integer
        confounded_trial_count:
          type: integer
        flagged_trial_ids:
          type: array
          items:
            type: string
      required:
        - ingestion_rows_total
        - ingestion_rows_valid
        - ingestion_rows_dropped
        - validated_sample_size
        - confounded_trial_count
        - flagged_trial_ids
        
  - name: spike_sorting_validation_report.md
    type: file
    description: "Markdown report documenting spike sorting quality"
    
  - name: summary_report.txt
    type: file
    description: "Text summary of analysis results"
    
  - name: figures/*.png
    type: file
    description: "Generated visualization plots"
    pattern: "data/figures/*.png"
