$schema: http://json-schema.org/draft-07/schema#
title: Neural Correlates Dataset Schema
description: Schema for raw spike train and reward data ingestion.
type: object
properties:
  trial_id:
    type: string
    description: Unique identifier for each trial.
  neuron_id:
    type: string
    description: Identifier for the recorded neuron.
  spike_timestamps:
    type: array
    items:
      type: number
    description: Array of spike times in milliseconds.
  reward_magnitude:
    type: number
    description: Magnitude of reward delivered.
  cue_timestamps:
    type: array
    items:
      type: number
    description: Array of cue presentation times.
  reward_timestamp:
    type: number
    description: Timestamp of reward delivery (reference point).
  cue_timestamp:
    type: number
    description: Timestamp of cue presentation.
  spike_sorting_metadata:
    type: object
    description: SNR and isolation distance metrics.
    properties:
      snr:
        type: number
        description: Signal-to-Noise Ratio.
      isolation_distance:
        type: number
        description: Isolation distance metric.
    required:
      - snr
      - isolation_distance
required:
  - trial_id
  - neuron_id
  - spike_timestamps
  - reward_magnitude
  - reward_timestamp
  - spike_sorting_metadata
