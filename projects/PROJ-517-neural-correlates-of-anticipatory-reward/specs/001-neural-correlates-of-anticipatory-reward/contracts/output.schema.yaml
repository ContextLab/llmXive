$schema: http://json-schema.org/draft-07/schema#
title: Neural Correlates Output Schema
description: Schema for the unified DataFrame and analysis results.
type: object
properties:
  trial_id:
    type: string
    description: Unique identifier for each trial.
  neuron_id:
    type: string
    description: Identifier for the recorded neuron.
  spike_count:
    type: integer
    description: Count of spikes in [-500ms, 0ms] window.
  reward_magnitude:
    type: number
    description: Magnitude of reward delivered.
  cue_delay_ms:
    type: number
    description: Time difference (cue to reward) in milliseconds.
  valid_spike_sorting:
    type: boolean
    description: True if SNR and isolation distance meet thresholds.
  flagged_short_delay:
    type: boolean
    description: True if cue-reward delay < 500ms.
  firing_rate:
    type: number
    description: Calculated firing rate (spikes/sec).
  cv_score:
    type: number
    description: Cross-validation score (R^2 or MSE).
  mdes:
    type: number
    description: Minimum Detectable Effect Size.
  ingestion_rows_total:
    type: integer
    description: Total rows read from input.
  ingestion_rows_valid:
    type: integer
    description: Rows passing validation.
  ingestion_rows_dropped:
    type: integer
    description: Rows dropped due to validation failure.
required:
  - trial_id
  - neuron_id
  - spike_count
  - reward_magnitude
  - valid_spike_sorting
  - firing_rate
  - cv_score
  - mdes
  - ingestion_rows_total
  - ingestion_rows_valid
  - ingestion_rows_dropped
