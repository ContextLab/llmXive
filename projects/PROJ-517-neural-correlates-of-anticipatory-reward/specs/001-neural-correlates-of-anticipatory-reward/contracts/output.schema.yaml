$schema: http://json-schema.org/draft-07/schema#
title: Output Report Schema
description: Schema for expected report structure and plot metadata

type: object
required:
  - summary_statistics
  - validation_metrics
  - model_results
  - plot_metadata

properties:
  summary_statistics:
    type: object
    properties:
      total_trials:
        type: integer
      valid_trials:
        type: integer
      dropped_trials:
        type: integer
      reward_levels:
        type: array
        items:
          type: object
          properties:
            magnitude:
              type: number
            trial_count:
              type: integer

  validation_metrics:
    type: object
    properties:
      ingestion_rows_total:
        type: integer
      ingestion_rows_valid:
        type: integer
      ingestion_rows_dropped:
        type: integer
      validation_status:
        type: string
        enum: [PASS, FAIL, WARN]
      flags:
        type: array
        items:
          type: string

  model_results:
    type: object
    properties:
      coefficient:
        type: number
      p_value:
        type: number
      model_family:
        type: string
        enum: [Poisson, NegativeBinomial]
      dispersion:
        type: number
      mdes_80_power:
        type: number
      cv_score_mean:
        type: number
      cv_score_std:
        type: number
      neuron_count:
        type: integer
      bonferroni_corrected_p:
        type: number
      permutation_p_value:
        type: number

  plot_metadata:
    type: object
    properties:
      figure_path:
        type: string
      figure_type:
        type: string
        enum: [scatter_with_regression]
      x_label:
        type: string
      y_label:
        type: string
      confidence_interval:
        type: number
        enum: [95]

additionalProperties: true
