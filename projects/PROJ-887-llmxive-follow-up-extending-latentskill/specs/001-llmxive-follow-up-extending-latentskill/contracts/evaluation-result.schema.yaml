$schema: http://json-schema.org/draft-07/schema#
title: Evaluation Result Schema
description: >
  Defines the structure for the final evaluation results, including
  success rates, statistical tests, and sensitivity analysis.
  This validates `data/results/stats_report.json`.
type: object
required:
  - experiment_metadata
  - primary_results
  - statistical_analysis
  - sensitivity_analysis
  - linearity_check
  - reconstruction_error
properties:
  experiment_metadata:
    type: object
    required:
      - run_id
      - timestamp
      - model_config
    properties:
      run_id:
        type: string
        description: Unique identifier for this experiment run.
      timestamp:
        type: string
        format: date-time
      model_config:
        type: object
        properties:
          base_model:
            type: string
            description: e.g., "TinyLlama-1.1B-Chat-v1.0"
          quantization:
            type: string
            description: e.g., "q4_0"
          lora_rank:
            type: integer
          alpha:
            type: number

  primary_results:
    type: object
    description: Success rates for different strategies (Single, Mean, Weighted).
    required:
      - strategies
    properties:
      strategies:
        type: array
        items:
          type: object
          required:
            - strategy_name
            - success_rate
            - trials
            - successes
          properties:
            strategy_name:
              type: string
              enum:
                - single_nearest_neighbor
                - unweighted_mean
                - cosine_weighted_average
            success_rate:
              type: number
              minimum: 0.0
              maximum: 1.0
            trials:
              type: integer
              minimum: 5
            successes:
              type: integer

  statistical_analysis:
    type: object
    description: Results of paired t-tests and Benjamini-Hochberg correction.
    required:
      - comparisons
      - bh_corrected
    properties:
      comparisons:
        type: array
        items:
          type: object
          required:
            - strategy_a
            - strategy_b
            - p_value
            - test_type
          properties:
            strategy_a:
              type: string
            strategy_b:
              type: string
            p_value:
              type: number
            test_type:
              type: string
              enum:
                - paired_ttest
                - wilcoxon_signed_rank
      bh_corrected:
        type: array
        items:
          type: object
          required:
            - strategy_pair
            - adjusted_q_value
            - significant
          properties:
            strategy_pair:
              type: string
            adjusted_q_value:
              type: number
            significant:
              type: boolean

  sensitivity_analysis:
    type: object
    description: Performance degradation across different k values.
    required:
      - k_values
      - results
    properties:
      k_values:
        type: array
        items:
          type: integer
        description: List of k values tested (e.g., [1, 3, 5, 10]).
      results:
        type: object
        additionalProperties:
          type: object
          required:
            - k
            - success_rate
            - latency_ms
          properties:
            k:
              type: integer
            success_rate:
              type: number
            latency_ms:
              type: number

  linearity_check:
    type: object
    description: Pearson correlation between text-space and weight-space distances.
    required:
      - correlation
      - validity_flag
    properties:
      correlation:
        type: number
        description: Pearson correlation coefficient.
      validity_flag:
        type: boolean
        description: True if correlation >= 0.6.
      pairs_tested:
        type: integer
        description: Number of task pairs evaluated.

  reconstruction_error:
    type: object
    description: Cosine distance between synthesized and ground truth weights.
    required:
      - mean_error
      - std_error
      - composite_tasks
    properties:
      mean_error:
        type: number
      std_error:
        type: number
      composite_tasks:
        type: array
        items:
          type: object
          required:
            - task_name
            - alpha
            - error
          properties:
            task_name:
              type: string
            alpha:
              type: number
            error:
              type: number

additionalProperties: false