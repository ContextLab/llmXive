$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: |
  Schema defining the structure of model performance metrics and comparison results
  generated by the plant root architecture prediction pipeline.
type: object
required:
  - metadata
  - models
  - comparisons
properties:
  metadata:
    type: object
    description: Metadata about the run that generated this output.
    required:
      - timestamp
      - seed
      - pipeline_version
      - data_source
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the model was trained/evaluated.
      seed:
        type: integer
        description: Random seed used for reproducibility.
      pipeline_version:
        type: string
        description: Version of the pipeline used (e.g., from git commit or config).
      data_source:
        type: string
        enum:
          - real
          - mock
        description: Indicates if the underlying data was real or synthetic.
      nutrient_condition:
        type: string
        description: The specific nutrient condition this model was trained on (e.g., 'LowP', 'HighN').
      split_type:
        type: string
        description: The type of data split used (e.g., 'stratified', 'random').

  models:
    type: array
    description: List of metrics for each trained model.
    items:
      type: object
      required:
        - model_type
        - hyperparameters
        - metrics
      properties:
        model_type:
          type: string
          enum:
            - Null
            - Lasso
            - ElasticNet
            - Ridge
            - RandomForest
            - GradientBoosting
          description: The type of model trained.
        hyperparameters:
          type: object
          description: The specific hyperparameters used for this model instance.
          additionalProperties: true
        metrics:
          type: object
          description: Performance metrics calculated on the test set.
          required:
            - r2_score
            - mae
            - rmse
          properties:
            r2_score:
              type: number
              description: Coefficient of determination (R²).
            mae:
              type: number
              description: Mean Absolute Error.
            rmse:
              type: number
              description: Root Mean Squared Error.
            cv_mean_r2:
              type: number
              description: Mean R² score from cross-validation.
            cv_std_r2:
              type: number
              description: Standard deviation of R² scores from cross-validation.
            ci_95_lower:
              type: number
              description: Lower bound of 95% confidence interval for R².
            ci_95_upper:
              type: number
              description: Upper bound of 95% confidence interval for R².
            training_time_seconds:
              type: number
              description: Time taken to train the model in seconds.

  comparisons:
    type: array
    description: Results from comparing models against the null baseline.
    items:
      type: object
      required:
        - model_type
        - baseline_type
        - improvement
        - p_value
        - is_significant
      properties:
        model_type:
          type: string
          description: The model being compared.
        baseline_type:
          type: string
          enum:
            - Null
            - InterceptOnly
          description: The baseline model used for comparison.
        improvement:
          type: number
          description: Absolute improvement in R² over the baseline.
        relative_improvement_pct:
          type: number
          description: Percentage improvement over the baseline.
        p_value:
          type: number
          description: P-value from the statistical significance test (e.g., permutation test).
        is_significant:
          type: boolean
          description: Whether the improvement is statistically significant (p < 0.05).
        bh_corrected_p_value:
          type: number
          description: P-value after Benjamini-Hochberg correction for multiple testing.
        is_significant_bh:
          type: boolean
          description: Whether the result is significant after BH correction.

  feature_importance:
    type: object
    description: Optional block for feature importance data if available.
    properties:
      shap_summary:
        type: array
        description: List of SHAP summary values.
        items:
          type: object
          required:
            - feature_name
            - mean_abs_shap
          properties:
            feature_name:
              type: string
            mean_abs_shap:
              type: number
      lasso_coefficients:
        type: array
        description: List of non-zero Lasso coefficients.
        items:
          type: object
          required:
            - feature_name
            - coefficient
          properties:
            feature_name:
              type: string
            coefficient:
              type: number

  stability_selection:
    type: object
    description: Optional block for stability selection results.
    properties:
      markers:
        type: array
        items:
          type: object
          required:
            - feature_name
            - stability_score
            - selection_frequency
          properties:
            feature_name:
              type: string
            stability_score:
              type: number
            selection_frequency:
              type: number
              minimum: 0
              maximum: 1

  disclaimers:
    type: array
    description: List of required disclaimers included in the report.
    items:
      type: string
    example:
      - "Findings are associational and do not imply causation"
      - "Model performance is specific to the nutrient condition tested"