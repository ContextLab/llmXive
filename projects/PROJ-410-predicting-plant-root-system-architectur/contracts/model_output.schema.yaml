$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: |
  Schema defining the structure of model performance metrics and results
  produced by the training and evaluation pipeline (code/train.py, code/evaluate.py).
  This schema ensures consistency across model comparisons, null model baselines,
  and final result reporting.
type: object
required:
  - metadata
  - model_results
properties:
  metadata:
    type: object
    description: Metadata about the run, data source, and configuration.
    required:
      - timestamp
      - data_source
      - nutrient_condition
      - random_seed
      - pipeline_version
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the model was trained/evaluated.
      data_source:
        type: string
        description: Identifier for the dataset version used (e.g., 'unified_v1', 'mock_v1').
      nutrient_condition:
        type: string
        description: The specific nutrient condition this model was trained on (e.g., 'low_phosphate', 'high_nitrogen').
      random_seed:
        type: integer
        description: The random seed used for reproducibility.
      pipeline_version:
        type: string
        description: Version tag of the training pipeline code.
      split_ratios:
        type: object
        description: Ratios used for train/val/test splits.
        properties:
          train:
            type: number
            minimum: 0
            maximum: 1
          val:
            type: number
            minimum: 0
            maximum: 1
          test:
            type: number
            minimum: 0
            maximum: 1
      hyperparameters:
        type: object
        description: Dictionary of hyperparameters used for this specific model run.
        additionalProperties: true

  model_results:
    type: array
    description: List of performance metrics for each model run.
    items:
      type: object
      required:
        - model_type
        - model_id
        - metrics
        - cv_scores
      properties:
        model_type:
          type: string
          enum:
            - NullModel
            - Lasso
            - ElasticNet
            - Ridge
            - RandomForest
            - GradientBoosting
          description: The type of algorithm used.
        model_id:
          type: string
          description: Unique identifier for this specific model instance (e.g., 'lasso_alpha0.1').
        metrics:
          type: object
          description: Primary performance metrics on the test set.
          required:
            - r2_score
            - mae
            - rmse
          properties:
            r2_score:
              type: number
              description: Coefficient of determination.
            mae:
              type: number
              description: Mean Absolute Error.
            rmse:
              type: number
              description: Root Mean Squared Error.
            fit_time_seconds:
              type: number
              description: Time taken to train the model.
        cv_scores:
          type: object
          description: Cross-validation statistics.
          required:
            - mean_r2
            - std_r2
            - mean_mae
            - std_mae
          properties:
            mean_r2:
              type: number
            std_r2:
              type: number
            mean_mae:
              type: number
            std_mae:
              type: number
            n_folds:
              type: integer
              minimum: 2
        feature_importance:
          type: array
          description: Top N features by importance (optional, for tree/linear models).
          items:
            type: object
            properties:
              feature_name:
                type: string
              importance_score:
                type: number
              rank:
                type: integer
        shap_summary:
          type: object
          description: Summary statistics for SHAP values (if calculated).
          properties:
            mean_abs_shap:
              type: array
              items:
                type: number
              description: Mean absolute SHAP values per feature.
            feature_names:
              type: array
              items:
                type: string
              description: Corresponding feature names.

  null_model_comparison:
    type: object
    description: Comparison against the null model baseline.
    properties:
      null_model_r2:
        type: number
      null_model_mae:
        type: number
      improvement_r2:
        type: number
        description: Difference in R2 between trained model and null model.
      significant_improvement:
        type: boolean
        description: Whether the improvement is statistically significant (p < 0.05).
      p_value:
        type: number
        description: P-value from the significance test (e.g., permutation test).

  warnings:
    type: array
    description: Any warnings generated during training or evaluation.
    items:
      type: string
additionalProperties: false