$schema: http://json-schema.org/draft-07/schema#
title: Unified Dataset Schema
description: >
  Schema for the unified genomic and phenotypic dataset used in the
  Predicting Plant Root System Architecture pipeline. This schema defines
  the structure of `data/processed/unified_dataset.parquet` generated by
  `code/preprocess.py`.
type: object
required:
  - metadata
  - columns
  - records
properties:
  metadata:
    type: object
    description: Metadata describing the dataset version and source.
    required:
      - version
      - generated_by
      - source_real
      - nutrient_conditions
    properties:
      version:
        type: string
        description: Semantic version of the schema or dataset processing pipeline.
        pattern: "^\\d+\\.\\d+\\.\\d+$"
      generated_by:
        type: string
        description: Name of the script or module that generated this dataset.
        const: "code/preprocess.py"
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation.
      source_real:
        type: boolean
        description: True if data comes from real external sources (1001 Genomes/ATRDB), False if mock.
      nutrient_conditions:
        type: array
        items:
          type: string
        description: List of nutrient conditions included in the dataset (e.g., "Low_N", "High_P").
      total_accessions:
        type: integer
        minimum: 0
        description: Total number of unique accessions in the dataset.
      total_records:
        type: integer
        minimum: 0
        description: Total number of rows (accession-condition pairs) in the dataset.
  columns:
    type: array
    description: Definition of each column in the dataset.
    items:
      type: object
      required:
        - name
        - type
        - description
      properties:
        name:
          type: string
          description: Column name.
        type:
          type: string
          enum:
            - integer
            - float
            - string
            - category
          description: Data type of the column.
        description:
          type: string
          description: Human-readable description of the column.
        nullable:
          type: boolean
          default: false
          description: Whether the column allows null values.
        encoded:
          type: boolean
          default: false
          description: True if the column contains encoded values (e.g., genotype 0,1,2).
        split:
          type: string
          enum:
            - train
            - val
            - test
            - null
          description: Which split this data belongs to, if applicable (null for unified dataset before split).
  records:
    type: array
    description: Sample records (or full data if small) to validate structure.
    items:
      type: object
      additionalProperties: true
      properties:
        accession_id:
          type: string
          description: Unique identifier for the plant accession (e.g., "Col-0", "Ler-0").
        nutrient_condition:
          type: string
          description: The nutrient condition for this measurement (e.g., "Low_N", "High_P").
        total_root_length:
          type: number
          description: Total root length (phenotype).
        lateral_root_density:
          type: number
          description: Density of lateral roots (phenotype).
        main_root_angle:
          type: number
          description: Average angle of main roots (phenotype).
        genotype_matrix:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 2
          description: Encoded genotype vector (0, 1, 2) for SNPs.
        missingness_flags:
          type: array
          items:
            type: boolean
          description: Flags indicating if specific features were missing and imputed/dropped.
examples:
  - metadata:
      version: "1.0.0"
      generated_by: "code/preprocess.py"
      source_real: true
      nutrient_conditions: ["Low_N", "High_P"]
      total_accessions: 100
      total_records: 200
    columns:
      - name: accession_id
        type: string
        description: Unique accession identifier
      - name: nutrient_condition
        type: category
        description: Nutrient condition label
      - name: total_root_length
        type: float
        description: Total root length phenotype
      - name: genotype_vector
        type: array
        description: Encoded SNP vector
    records:
      - accession_id: "Col-0"
        nutrient_condition: "Low_N"
        total_root_length: 15.4
        genotype_vector: [0, 1, 2, 0, 0]