%YAML 1.2
---
# Schema for the aligned and preprocessed dataset artifact
# Generated for task T008
# This file defines the structure and types for data/preprocessed/aligned_data.npz
# and associated metadata.

$schema: "http://json-schema.org/draft-07/schema#"
title: "Molecular Vibrational Spectra Dataset"
description: >
  Schema for the dataset resulting from the alignment of QM9 and IR-spectra
  datasets, followed by preprocessing (interpolation, smoothing, normalization).

type: object
required:
  - metadata
  - data

properties:
  metadata:
    type: object
    description: "Metadata describing the dataset creation process."
    required:
      - source_qm9
      - source_ir
      - alignment_key
      - preprocessing_steps
      - creation_timestamp
      - sample_count
      - spectral_range
    properties:
      source_qm9:
        type: string
        description: "Identifier or version of the QM9 dataset used."
      source_ir:
        type: string
        description: "Identifier or version of the IR-spectra dataset used."
      alignment_key:
        type: string
        description: "The key used for joining datasets (e.g., 'InChIKey')."
      preprocessing_steps:
        type: array
        items:
          type: string
        description: "Ordered list of preprocessing steps applied."
      creation_timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of when the dataset was created."
      sample_count:
        type: integer
        minimum: 1
        description: "Total number of molecules in the aligned dataset."
      spectral_range:
        type: object
        description: "Wavenumber range of the spectra."
        required:
          - min_cm1
          - max_cm1
          - step_cm1
        properties:
          min_cm1:
            type: integer
            description: "Minimum wavenumber in cm⁻¹."
          max_cm1:
            type: integer
            description: "Maximum wavenumber in cm⁻¹."
          step_cm1:
            type: integer
            description: "Spacing between wavenumber points in cm⁻¹."

  data:
    type: object
    description: "The actual data arrays stored in the .npz file."
    required:
      - InChIKeys
      - wavenumbers
      - spectra
      - dipole_moment
      - polarizability
      - homol_gap
    properties:
      InChIKeys:
        type: array
        items:
          type: string
        description: "List of InChIKeys for the aligned molecules."
      wavenumbers:
        type: array
        items:
          type: number
        description: "1D array of wavenumber values (cm⁻¹)."
      spectra:
        type: array
        items:
          type: array
          items:
            type: number
        description: "2D array of normalized IR spectra (N_samples x N_wavenumbers)."
      dipole_moment:
        type: array
        items:
          type: number
        description: "1D array of dipole moment values (Debye)."
      polarizability:
        type: array
        items:
          type: number
        description: "1D array of polarizability values (Å³)."
      homol_gap:
        type: array
        items:
          type: number
        description: "1D array of HOMO-LUMO gap values (eV)."
