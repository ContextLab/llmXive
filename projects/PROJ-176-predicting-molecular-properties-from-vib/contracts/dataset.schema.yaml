schema_version: "1.0.0"
description: "Schema for the aligned molecular dataset (QM9 + IR Spectra)"
type: object
required:
  - metadata
  - data
properties:
  metadata:
    type: object
    required:
      - source_qm9
      - source_ir
      - alignment_key
      - creation_timestamp
      - total_samples
      - filtered_count
      - grid_range
      - grid_spacing
    properties:
      source_qm9:
        type: string
        description: "Identifier for the QM9 dataset version used"
      source_ir:
        type: string
        description: "Identifier for the IR spectra dataset version used"
      alignment_key:
        type: string
        description: "Key used for alignment (e.g., InChIKey)"
      creation_timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of dataset creation"
      total_samples:
        type: integer
        minimum: 0
        description: "Total number of aligned molecules"
      filtered_count:
        type: integer
        minimum: 0
        description: "Number of samples discarded due to missing properties"
      grid_range:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
        description: "[min_wavenumber, max_wavenumber] in cm^-1"
      grid_spacing:
        type: number
        description: "Spacing between wavenumber points in cm^-1"
  data:
    type: object
    required:
      - InChIKey
      - spectra
      - dipole_moment
      - polarizability
      - homo_lumo_gap
    properties:
      InChIKey:
        type: array
        items:
          type: string
        description: "Unique molecular identifier"
      spectra:
        type: array
        items:
          type: array
          items:
            type: number
        description: "Normalized IR spectra (N_samples x N_grid_points)"
      dipole_moment:
        type: array
        items:
          type: number
        description: "Dipole moment values in Debye"
      polarizability:
        type: array
        items:
          type: number
        description: "Polarizability values in Angstrom^3"
      homo_lumo_gap:
        type: array
        items:
          type: number
        description: "HOMO-LUMO gap values in eV"
