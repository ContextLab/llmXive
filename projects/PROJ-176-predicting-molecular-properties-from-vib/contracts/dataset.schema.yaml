# Schema for aligned preprocessed molecular dataset
# Generated for PROJ-176-predicting-molecular-properties-from-vib
# Task: T008
type: object
description: "Aligned molecular dataset containing IR spectra and target properties"
required:
  - metadata
  - molecules
  - spectra
  - properties
properties:
  metadata:
    type: object
    description: "Dataset provenance and processing parameters"
    required:
      - created_at
      - source_qm9
      - source_ir
      - alignment_key
      - preprocessing_steps
      - total_molecules
    properties:
      created_at:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of dataset creation"
      source_qm9:
        type: string
        description: "Source dataset identifier for QM9 (e. g., 'qm9_v1.0')"
      source_ir:
        type: string
        description: "Source dataset identifier for IR spectra"
      alignment_key:
        type: string
        const: "InChIKey"
        description: "Key used to join datasets"
      preprocessing_steps:
        type: array
        items:
          type: string
        description: "List of preprocessing steps applied"
      total_molecules:
        type: integer
        minimum: 1
        description: "Number of molecules in the final aligned dataset"
      dft_functional:
        type: string
        description: "DFT functional used for property calculation"
      dft_basis_set:
        type: string
        description: "DFT basis set used for property calculation"
      coverage_audit_pvalue:
        type: number
        minimum: 0
        maximum: 1
        description: "KS-test p-value for coverage audit"
      coverage_audit_warning:
        type: boolean
        description: "True if p < 0.05 indicating potential selection bias"
  molecules:
    type: array
    description: "List of unique molecules in the dataset"
    items:
      type: object
      required:
        - inchi_key
        - molecule_id
      properties:
        inchi_key:
          type: string
          description: "Standard InChIKey for molecular identification"
        molecule_id:
          type: integer
          description: "Internal index in the dataset arrays"
  spectra:
    type: object
    description: "Preprocessed IR spectra data"
    required:
      - wavenumbers
      - intensity_matrix
      - grid_unit
      - smoothing_sigma
    properties:
      wavenumbers:
        type: array
        items:
          type: number
        description: "1D array of wavenumbers (cm^-1) on fixed grid"
      intensity_matrix:
        type: array
        items:
          type: array
          items:
            type: number
        description: "2D array [n_molecules x n_wavenumbers] of normalized intensities"
      grid_unit:
        type: string
        const: "cm^-1"
        description: "Unit of wavenumber axis"
      smoothing_sigma:
        type: number
        const: 2.0)
        description: "Sigma value for Gaussian smoothing"
      normalization_method:
        type: string
        const: "unit_area"
        description: "Method used for spectrum normalization"
  properties:
    type: object
    description: "Target molecular properties for regression"
    required:
      - dipole_moment
      - polarizability
      - homo_lumo_gap
      - units
    properties:
      dipole_moment:
        type: array
        items:
          type: number
        description: "Dipole moment values (D)"
      polarizability:
        type: array
        items:
          type: number
        description: "Polarizability values (Angstrom^3)"
      homo_lumo_gap:
        type: array
        items:
          type: number
        description: "HOMO-LUMO gap values (eV)"
      units:
        type: object
        required:
          - dipole
          - polarizability
          - gap
        properties:
          dipole:
            type: string
            const: "D"
          polarizability:
            type: string
            const: "Angstrom^3"
          gap:
            type: string
            const: "eV"
additionalProperties: false
