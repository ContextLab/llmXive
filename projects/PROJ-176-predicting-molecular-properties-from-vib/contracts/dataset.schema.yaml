$schema: http://json-schema.org/draft-07/schema#
title: Preprocessed Molecular Dataset Schema
description: >
  Schema for the aligned and preprocessed molecular dataset combining QM9 properties
  and IR spectra, stored as data/preprocessed/aligned_molecules.npz.
type: object
required:
  - metadata
  - data
properties:
  metadata:
    type: object
    required:
      - source_datasets
      - alignment_key
      - preprocessing_steps
      - dft_functional
      - dft_basis_set
      - grid_range
      - grid_step
      - smoothing_sigma
      - normalization_method
      - sample_count
      - created_at
      - version
    properties:
      source_datasets:
        type: array
        description: List of source dataset names used to generate this file.
        items:
          type: string
        enum:
          - QM9
          - IR-Spectra
      alignment_key:
        type: string
        description: The key used to join datasets.
        const: InChIKey
      preprocessing_steps:
        type: array
        description: Ordered list of preprocessing operations applied.
        items:
          type: string
        enum:
          - inner_join
          - interpolation
          - gaussian_smoothing
          - unit_area_normalization
          - property_filtering
          - metadata_check
      dft_functional:
        type: string
        description: DFT functional used for property calculation (e.g., B3LYP).
      dft_basis_set:
        type: string
        description: DFT basis set used (e.g., 6-31G*).
      grid_range:
        type: array
        description: Wavenumber range [min, max] in cm^-1.
        items:
          type: number
        minItems: 2
        maxItems: 2
      grid_step:
        type: number
        description: Step size of the wavenumber grid in cm^-1.
      smoothing_sigma:
        type: number
        description: Standard deviation for Gaussian smoothing in cm^-1.
      normalization_method:
        type: string
        description: Method used for normalizing spectra.
        const: unit_area
      sample_count:
        type: integer
        description: Number of molecules in the final dataset.
        minimum: 1
      created_at:
        type: string
        description: ISO 8601 timestamp of dataset creation.
      version:
        type: string
        description: Schema version of this dataset.
  data:
    type: object
    description: Numpy arrays stored in the .npz file.
    properties:
      InChIKeys:
        type: array
        description: List of InChIKey strings.
        items:
          type: string
      wavenumbers:
        type: array
        description: 1D array of wavenumber values (cm^-1).
        items:
          type: number
      ir_spectra:
        type: array
        description: 2D array of IR spectra (N_samples x N_wavenumbers).
        items:
          type: number
      dipole_moment:
        type: array
        description: 1D array of dipole moments (Debye).
        items:
          type: number
      polarizability:
        type: array
        description: 1D array of polarizability (Angstrom^3).
        items:
          type: number
      homo_lumo_gap:
        type: array
        description: 1D array of HOMO-LUMO gaps (eV).
        items:
          type: number
      dft_metadata:
        type: array
        description: 2D array of DFT metadata flags (e.g., functional mismatch).
        items:
          type: integer
        description: >
          Optional: Metadata flags for domain shift detection.
          0 = match, 1 = domain shift candidate.
