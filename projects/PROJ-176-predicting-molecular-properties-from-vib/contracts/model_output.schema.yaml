schema_version: "1.0.0"
description: "Schema for model checkpoint and prediction outputs"
type: object
required:
  - model_info
  - predictions
properties:
  model_info:
    type: object
    required:
      - architecture
      - hyperparameters
      - training_seed
      - checkpoint_hash
    properties:
      architecture:
        type: string
        description: "Model architecture name (e.g., CNN_1D_Molecular)"
      hyperparameters:
        type: object
        properties:
          kernel_sizes:
            type: array
            items:
              type: integer
            description: "Kernel sizes for convolutional blocks"
          filters:
            type: integer
            description: "Number of filters per block"
          learning_rate:
            type: number
          patience:
            type: integer
            description: "Early stopping patience"
      training_seed:
        type: integer
        description: "Random seed used for training"
      checkpoint_hash:
        type: string
        description: "SHA-256 hash of the saved checkpoint file"
  predictions:
    type: object
    required:
      - dipole_moment
      - polarizability
      - homo_lumo_gap
      - inference_time
    properties:
      dipole_moment:
        type: array
        items:
          type: number
        description: "Predicted dipole moments"
      polarizability:
        type: array
        items:
          type: number
        description: "Predicted polarizabilities"
      homo_lumo_gap:
        type: array
        items:
          type: number
        description: "Predicted HOMO-LUMO gaps"
      inference_time:
        type: number
        description: "Total inference time in seconds"
