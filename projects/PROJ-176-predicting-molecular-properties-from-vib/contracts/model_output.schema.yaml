%YAML 1.2
---
# Schema for the trained model checkpoint artifact
# Generated for task T008
# This file defines the structure expected for the model checkpoint
# saved by code/models/trainer.py.

$schema: "http://json-schema.org/draft-07/schema#"
title: "Molecular Property CNN Model Checkpoint"
description: >
  Schema for the PyTorch model checkpoint containing weights, optimizer state,
  and training metadata.

type: object
required:
  - model_state_dict
  - optimizer_state_dict
  - training_metadata
  - architecture_config

properties:
  model_state_dict:
    type: object
    description: "State dictionary of the trained MolecularPropertyCNN model."
    # Note: The actual keys depend on the specific model architecture (cnn_1d.py)

  optimizer_state_dict:
    type: object
    description: "State dictionary of the optimizer (Adam)."

  training_metadata:
    type: object
    description: "Metadata regarding the training run."
    required:
      - best_val_loss
      - epochs_trained
      - early_stopping_patience
      - timestamp
      - seed
    properties:
      best_val_loss:
        type: number
        description: "The lowest validation loss achieved during training."
      epochs_trained:
        type: integer
        description: "Total number of epochs the model was trained for."
      early_stopping_patience:
        type: integer
        description: "Patience parameter used for early stopping."
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of when the checkpoint was saved."
      seed:
        type: integer
        description: "Random seed used for reproducibility."

  architecture_config:
    type: object
    description: "Configuration used to instantiate the model."
    required:
      - input_dim
      - kernel_sizes
      - num_filters
      - num_heads
    properties:
      input_dim:
        type: integer
        description: "Input dimension (number of wavenumber points)."
      kernel_sizes:
        type: array
        items:
          type: integer
        description: "List of kernel sizes for convolutional blocks (e.g., [9, 7, 5])."
      num_filters:
        type: integer
        description: "Number of filters per convolutional block."
      num_heads:
        type: integer
        description: "Number of regression heads (should be 3)."
      loss_weights:
        type: array
        items:
          type: number
        description: "Weights for the weighted sum of losses from each head."
