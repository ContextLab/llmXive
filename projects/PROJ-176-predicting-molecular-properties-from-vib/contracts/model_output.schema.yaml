$schema: http://json-schema.org/draft-07/schema#
title: Model Checkpoint and Output Schema
description: >
  Schema for the saved model checkpoint (model_best.pt) and its associated
  inference outputs. This defines the structure of the model architecture
  and the expected format of prediction results.
type: object
required:
  - model_config
  - training_config
  - weights
properties:
  model_config:
    type: object
    description: Configuration of the 1D CNN architecture.
    required:
      - model_type
      - input_dim
      - output_dims
      - kernel_sizes
      - num_filters
      - num_blocks
    properties:
      model_type:
        type: string
        const: MolecularPropertyCNN
      input_dim:
        type: integer
        description: Input dimension (number of wavenumbers).
      output_dims:
        type: array
        description: Output dimensions for each regression head.
        items:
          type: integer
        enum:
          - 1
      kernel_sizes:
        type: array
        description: Kernel sizes for the three convolutional blocks.
        items:
          type: integer
        const: [9, 64, 9] # Based on T025 spec: kernel sizes 9, 64, 9
      num_filters:
        type: integer
        description: Number of filters per block.
      num_blocks:
        type: integer
        const: 3
      device:
        type: string
        description: Device used for training (CPU only enforced).
        const: cpu
  training_config:
    type: object
    description: Hyperparameters and settings used during training.
    required:
      - optimizer
      - learning_rate
      - patience
      - loss_weights
      - epochs_trained
    properties:
      optimizer:
        type: string
        const: Adam
      learning_rate:
        type: number
        const: 0.001
      patience:
        type: integer
        description: Patience for early stopping.
        const: 10
      loss_weights:
        type: array
        description: Weights for the weighted sum of losses from 3 heads.
        items:
          type: number
        minItems: 3
        maxItems: 3
      epochs_trained:
        type: integer
        description: Number of epochs the model was trained for.
      seed:
        type: integer
        description: Random seed used for reproducibility.
  weights:
    type: object
    description: State dictionary of the model weights.
    properties:
      state_dict:
        type: object
        description: PyTorch state dictionary.
      hash:
        type: string
        description: SHA-256 hash of the weights for integrity verification.
