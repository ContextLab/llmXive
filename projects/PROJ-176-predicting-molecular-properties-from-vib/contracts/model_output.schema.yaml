# Contract Schema: Model Output
# Defines the expected structure of trained model checkpoints and inference outputs
schema_version: "1.0"
artifact_type: "model_checkpoint"
source_tasks: ["T023", "T024", "T025", "T026"]

file_format: "torchscript" or "pickle"
location: "models/model_best.pt"

architecture:
  type: "1D-CNN"
  blocks: 3
  kernel_sizes: [9, 64, 64] # First block kernel=9, subsequent=64 (or as implemented)
  filters: 64
  heads:
    - name: "dipole_moment"
      output_dim: 3
      loss_weight: 1.0
    - name: "polarizability"
      output_dim: 1
      loss_weight: 1.0
    - name: "homo_lumo_gap"
      output_dim: 1
      loss_weight: 1.0

checkpoint_contents:
  - name: "model_state_dict"
    type: "dict"
    description: "PyTorch state dictionary"
  - name: "optimizer_state_dict"
    type: "dict"
    description: "Optimizer state (optional but recommended)"
  - name: "epoch"
    type: "int"
    description: "Epoch number of best model"
  - name: "val_loss"
    type: "float"
    description: "Validation loss at best epoch"
  - name: "train_config"
    type: "dict"
    description: "Hyperparameters and training configuration"
    required_keys:
      - "learning_rate"
      - "batch_size"
      - "patience"
      - "weight_decay"
      - "seed"

inference_output_schema:
  file_format: "numpy.npz" or "json"
  location: "results/predictions.npz"
  required_arrays:
    - name: "predicted_dipole"
      shape: "(n_test, 3)"
      dtype: "float32"
    - name: "predicted_polarizability"
      shape: "(n_test,)"
      dtype: "float32"
    - name: "predicted_gap"
      shape: "(n_test,)"
      dtype: "float32"
    - name: "ground_truth_dipole"
      shape: "(n_test, 3)"
      dtype: "float32"
    - name: "ground_truth_polarizability"
      shape: "(n_test,)"
      dtype: "float32"
    - name: "ground_truth_gap"
      shape: "(n_test,)"
      dtype: "float32"
    - name: "test_indices"
      shape: "(n_test,)"
      dtype: "int64"

validation_rules:
  - "Model must run on CPU without CUDA operations"
  - "Output dimensions must match architecture definition"
  - "No NaN/Inf in predictions"
  - "Checkpoint must be loadable by PyTorch >= 2.0"
