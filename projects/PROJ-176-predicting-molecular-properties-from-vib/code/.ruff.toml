[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "SIM",# flake8-simplify
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in torch)
    "SIM105", # Use contextlib.suppress (sometimes less readable)
]
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"code/models/cnn_1d.py" = ["E741"] # Allow ambiguous variable names like 'l' in loops if necessary, though we try to avoid
"code/utils/timeout_wrapper.py" = ["B010"] # Allow setattr in specific wrapper logic

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
