$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Output Schema"
description: "Schema for the model checkpoint and associated metadata."
type: object
properties:
  checkpoint_path:
    type: string
    description: "Filesystem path to the saved model checkpoint (e.g., .pt file)."
  architecture:
    type: string
    description: "Identifier of the model architecture (e.g., 'cnn_1d')."
  training_parameters:
    type: object
    description: "Parameters used during training."
    properties:
      epochs:
        type: integer
      learning_rate:
        type: number
      batch_size:
        type: integer
      early_stopping_patience:
        type: integer
    required:
      - epochs
      - learning_rate
      - batch_size
      - early_stopping_patience
  metrics:
    type: object
    description: "Training and validation metrics recorded."
required:
  - checkpoint_path
  - architecture
  - training_parameters
  - metrics
additionalProperties: false
