[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-mobileforge-followup"
version = "0.1.0"
description = "Extending MobileForge with CPU-Tractable Logic Distillation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pytest>=7.4.0",
    "statsmodels>=0.14.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.black]
# Black Configuration
# Target line length consistent with Ruff's E501 ignore
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.venv
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["data*", "utils*", "models*", "tests*"]
exclude = ["tests.*"]