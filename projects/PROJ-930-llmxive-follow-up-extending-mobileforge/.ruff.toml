# Ruff configuration for llmXive project
target-version = "py311"
line-length = 88

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # Line too long (handled by black)
    "C901", # Too complex
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
