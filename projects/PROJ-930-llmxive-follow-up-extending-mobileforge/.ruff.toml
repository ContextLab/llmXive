# Ruff configuration for the MobileForge Logic Distillation project.
# Task T003: linting rules for the repository.

target-version = "py311"
line-length = 88

[tool.ruff]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "W",  # pycodestyle warnings
]
ignore = [
    "E501", # Line too long (handled by black)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
