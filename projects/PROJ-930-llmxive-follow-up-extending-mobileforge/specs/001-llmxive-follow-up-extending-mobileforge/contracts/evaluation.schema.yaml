$schema: "http://json-schema.org/draft-07/schema#"
title: "EvaluationResult"
description: "Schema for the evaluation results including statistical tests."
type: "object"
properties:
  metrics:
    type: "object"
    properties:
      success_rate_distilled:
        type: "number"
        minimum: 0
        maximum: 1
      success_rate_baseline:
        type: "number"
        minimum: 0
        maximum: 1
      step_efficiency_distilled:
        type: "number"
      step_efficiency_baseline:
        type: "number"
    required:
      - success_rate_distilled
      - success_rate_baseline
  statistical_test:
    type: "object"
    properties:
      test_type:
        type: "string"
        const: "mcnemar"
      chi2:
        type: "number"
        description: "McNemar chi‑square statistic"
      p_value:
        type: "number"
        description: "Two‑tailed p‑value"
      significant:
        type: "boolean"
      effect_size_odds_ratio:
        type: "number"
        description: "Odds‑ratio effect size for McNemar"
    required:
      - test_type
      - chi2
      - p_value
      - significant
      - effect_size_odds_ratio
  power_analysis:
    type: "object"
    properties:
      n_required:
        type: "integer"
        minimum: 1
      parameters:
        type: "object"
        properties:
          power_target:
            type: "number"
            minimum: 0
            maximum: 1
          effect_size_odds_ratio:
            type: "number"
            description: "Odds‑ratio effect size used in power calculation"
          significance_level:
            type: "number"
            minimum: 0
            maximum: 1
          baseline_rate:
            type: "number"
            minimum: 0
            maximum: 1
          p0_source:
            type: "string"
            description: "Source of baseline rate estimate (e.g., 'Pilot Run', 'Fallback 0.5')"
        required:
          - power_target
          - effect_size_odds_ratio
          - significance_level
          - baseline_rate
          - p0_source
    required:
      - n_required
      - parameters
  sensitivity_report:
    type: "object"
    properties:
      thresholds:
        type: "array"
        items:
          type: "integer"
      success_rates:
        type: "array"
        items:
          type: "number"
    required:
      - thresholds
      - success_rates
required:
  - metrics
  - statistical_test
  - power_analysis
  - sensitivity_report