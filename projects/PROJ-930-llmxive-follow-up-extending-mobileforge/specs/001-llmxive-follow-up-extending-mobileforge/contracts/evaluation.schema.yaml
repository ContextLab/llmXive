$schema: "http://json-schema.org/draft-07/schema#"
title: "EvaluationResult (paired t-test)"
description: "Schema for the evaluation results when using a paired two‑tailed t‑test."
type: "object"
properties:
  metrics:
    type: "object"
    properties:
      success_rate_distilled:
        type: "number"
        minimum: 0
        maximum: 1
      baseline_metrics:
        type: "array"
        items:
          type: "object"
          properties:
            name:
              type: "string"
            success_rate:
              type: "number"
              minimum: 0
              maximum: 1
            step_efficiency:
              type: "number"
          required:
            - name
            - success_rate
            - step_efficiency
    required:
      - success_rate_distilled
      - baseline_metrics
  statistical_test:
    type: "object"
    properties:
      test_type:
        type: "string"
        const: "paired_ttest"
      t_stat:
        type: "number"
        description: "Paired t statistic"
      p_value:
        type: "number"
        description: "Two‑tailed p‑value"
      corrected_p_value:
        type: "number"
        description: "Bonferroni‑adjusted p‑value"
      significant:
        type: "boolean"
      effect_size_cohens_d:
        type: "number"
        description: "Cohen's d effect size"
    required:
      - test_type
      - t_stat
      - p_value
      - corrected_p_value
      - significant
      - effect_size_cohens_d
required:
  - metrics
  - statistical_test
additionalProperties: false