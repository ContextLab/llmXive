$schema: "http://json-schema.org/draft-07/schema#"
title: "Evaluation Result Schema"
description: "Schema for the output of the evaluation pipeline, including paired t-test results."
type: "object"
properties:
  metrics:
    type: "object"
    properties:
      success_rate_distilled:
        type: "number"
        minimum: 0
        maximum: 1
      success_rate_baseline:
        type: "number"
        minimum: 0
        maximum: 1
      step_efficiency_distilled:
        type: "number"
      step_efficiency_baseline:
        type: "number"
    required:
      - success_rate_distilled
      - success_rate_baseline
  statistical_test:
    type: "object"
    properties:
      test_type:
        type: "string"
        const: "paired_t_test"
      t_statistic:
        type: "number"
        description: "t‑statistic from paired t‑test"
      degrees_of_freedom:
        type: "integer"
        description: "Degrees of freedom (N‑1)."
      p_value:
        type: "number"
        description: "Two‑tailed p‑value"
      significant:
        type: "boolean"
        description: "True if p < 0.05"
      effect_size_cohen_d:
        "type": "number"
        description: "Cohen’s d effect size"
    required:
      - test_type
      - t_statistic
      - degrees_of_freedom
      - p_value
      - significant
      - effect_size_cohen_d
  power_analysis:
    type: "object"
    properties:
      n_required:
        type: "integer"
        minimum: 1
      power_target:
        type: "number"
        minimum: 0
        maximum: 1
      effect_size:
        type: "number"
        description: "Cohen’s d used in power calculation"
      baseline_rate:
        type: "number"
        minimum: 0
        maximum: 1
      p0_source:
        type: "string"
        description: "Source of baseline estimate"
    required:
      - n_required
      - power_target
      - effect_size
      - baseline_rate
      - p0_source
required:
  - metrics
  - statistical_test
  - power_analysis