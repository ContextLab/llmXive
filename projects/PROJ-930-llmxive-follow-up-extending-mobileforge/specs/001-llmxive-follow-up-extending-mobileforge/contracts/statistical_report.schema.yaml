$schema: "http://json-schema.org/draft-07/schema#"
title: "StatisticalReport"
description: "Schema for the final statistical analysis report including paired McNemar results."
type: "object"
properties:
  mcnemar:
    type: "object"
    description: "Results of the McNemar test between distilled and baseline models."
    properties:
      chi2:
        type: "number"
      p_value:
        type: "number"
      confidence_interval_95:
        type: "array"
        items:
          type: "number"
        minItems: 2
        maxItems: 2
      effect_size_odds_ratio:
        type: "number"
      significant:
        type: "boolean"
    required:
      - chi2
      - p_value
      - confidence_interval_95
      - effect_size_odds_ratio
      - significant
  sensitivity_analysis:
    type: "object"
    description: "Results of the Levenshtein‑based inconsistency tolerance sweep."
    properties:
      thresholds_tested:
        type: "array"
        items:
          type: "number"
      success_rates:
        type: "array"
        items:
          type: "number"
      variance:
        type: "number"
        description: "Variance in success rates across thresholds."
    required:
      - thresholds_tested
      - success_rates
      - variance
required:
  - mcnemar
  - sensitivity_analysis