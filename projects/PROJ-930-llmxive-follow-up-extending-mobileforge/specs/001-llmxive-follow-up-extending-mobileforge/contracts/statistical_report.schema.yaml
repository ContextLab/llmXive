$schema: "http://json-schema.org/draft-07/schema#"
title: "StatisticalReport"
description: "Schema for the final statistical analysis report including paired t‑test results."
type: "object"
properties:
  paired_t_test:
    type: "object"
    description: "Results of the paired t‑test between distilled and baseline models."
    properties:
      t_statistic:
        type: "number"
      degrees_of_freedom:
        type: "integer"
      p_value:
        type: "number"
      confidence_interval_95:
        type: "array"
        items:
          type: "number"
        minItems: 2
        maxItems: 2
      effect_size_cohen_d:
        type: "number"
      significant:
        type: "boolean"
    required:
      - t_statistic
      - degrees_of_freedom
      - p_value
      - confidence_interval_95
      - effect_size_cohen_d
      - significant
  sensitivity_analysis:
    type: "object"
    description: "Results of the Levenshtein‑based inconsistency tolerance sweep."
    properties:
      thresholds_tested:
        type: "array"
        items:
          type: "number"
      success_rates:
        type: "array"
        items:
          type: "number"
      variance:
        type: "number"
        description: "Variance in success rates across thresholds."
    required:
      - thresholds_tested
      - success_rates
      - variance
required:
  - paired_t_test
  - sensitivity_analysis