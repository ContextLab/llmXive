$schema: "http://json-schema.org/draft-07/schema#"
title: "PowerAnalysis"
description: "Schema for the a priori power analysis output for a paired t-test."
type: "object"
properties:
  n_required:
    type: "integer"
    minimum: 1
    description: "Calculated sample size N required for the study."
  parameters:
    type: "object"
    properties:
      power_target:
        type: "number"
        minimum: 0
        maximum: 1
        description: "Target statistical power (e.g., 0.8)."
      effect_size_cohen_d:
        type: "number"
        description: "Cohen's d effect size (medium, 0.5 per spec)."
      significance_level:
        type: "number"
        minimum: 0
        maximum: 1
        description: "Alpha level (e.g., 0.05)."
      baseline_rate:
        type: "number"
        minimum: 0
        maximum: 1
        description: "Baseline success rate p0 used in the calculation."
      p0_source:
        type: "string"
        description: "Source of baseline rate estimate ('Pilot Run' or 'Fallback 0.5')."
    required:
      - power_target
      - effect_size_cohen_d
      - significance_level
      - baseline_rate
      - p0_source
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO‑8601 timestamp of when the calculation was performed."
required:
  - n_required
  - parameters
  - timestamp
additionalProperties: false