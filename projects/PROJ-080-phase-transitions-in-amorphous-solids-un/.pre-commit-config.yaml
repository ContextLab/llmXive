# Pre-commit configuration for PROJ-080
# Ensures code quality before commits

repos:
  # Ruff: Fast Python linting
  - repo: https://github.com/astralabs/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Black: Uncompainable code formatting
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        args: [--config, py.toml]

  # Mypy: Static type checking
  - repo: https://github.com/pre-commit/mypy-pre-commit
    rev: v1.14.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests]

  # Check for merged conflicts
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.8.0
    hooks:
      - id: check-merge-conflicts

  # Check for trailing whitespace
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.8.0
    hooks:
      - id: trailing-whitespace

  # Check for end of file newline
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.8.0
    hooks:
      - id: end-of-file-fixer
