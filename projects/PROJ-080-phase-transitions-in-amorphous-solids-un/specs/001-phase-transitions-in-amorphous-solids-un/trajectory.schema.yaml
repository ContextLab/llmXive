$schema: http://json-schema.org/draft-07/schema#
title: MD Trajectory Schema
description: |
  Schema for molecular dynamics trajectory data of amorphous solids under shear stress.
  Defines structure for particle coordinates, box dimensions, stress tensors, and metadata.
type: object
required:
  - metadata
  - frames
properties:
  metadata:
    type: object
    required:
      - system_id
      - particle_count
      - box_dimensions
      - strain_rate
      - temperature
      - label
    properties:
      system_id:
        type: string
        description: Unique identifier for the simulation run
        pattern: "^SIM-[0-9]{6}$"
      particle_count:
        type: integer
        minimum: 100
        maximum: 100000
        description: Total number of particles in the system
        error_message: "Particle count must be between 100 and 100,000. Exceeding 100k violates FR-006 memory constraints."
      box_dimensions:
        type: array
        items:
          type: number
          minimum: 0
        minItems: 3
        maxItems: 3
        description: [Lx, Ly, Lz] in Angstroms
      strain_rate:
        type: number
        minimum: 0
        description: Applied strain rate in 1/s
      temperature:
        type: number
        minimum: 0
        description: Simulation temperature in Kelvin
      label:
        type: string
        enum:
          - brittle
          - ductile
        description: Mechanical response classification
      creation_timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of data generation
      source:
        type: string
        enum:
          - huggingface
          - synthetic
        description: Origin of the data
  frames:
    type: array
    minItems: 1
    description: Sequence of timesteps
    items:
      type: object
      required:
        - timestep
        - positions
        - box
        - stress_tensor
      properties:
        timestep:
          type: integer
          minimum: 0
          description: Simulation timestep index
        positions:
          type: array
          minItems: 100
          description: Particle positions [N, 3]
          items:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: number
        box:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
            minimum: 0
          description: Box dimensions [Lx, Ly, Lz] at this timestep
        stress_tensor:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: number
          description: Virial stress components [xx, yy, zz, xy, xz, yz] in GPa
        strain:
          type: number
          minimum: 0
          description: Cumulative engineering strain
additionalProperties: false
