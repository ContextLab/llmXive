$schema: http://json-schema.org/draft-07/schema#
title: Amorphous Silicon Shear Trajectory Schema
description: Schema for validating downloaded trajectory data from HuggingFace.
type: object
properties:
  dataset_id:
    type: string
    description: HuggingFace dataset identifier.
    const: "materials-science/amorphous-silicon-shear-trajectories"
  split:
    type: string
    description: Dataset split to download.
    const: "train"
  file_format:
    type: string
    description: Expected file format of the downloaded shard.
    const: "parquet"
  expected_sha256:
    type: string
    description: Expected SHA-256 checksum of the downloaded file for integrity verification.
    pattern: "^[a-f0-9]{64}$"
  max_particles:
    type: integer
    description: Maximum allowed particle count per frame (FR-006).
    maximum: 100000
  required_columns:
    type: array
    items:
      type: string
    description: Columns that must be present in the dataset.
    minItems: 5
    contains:
      const: "position"
    contains:
      const: "stress_tensor"
    contains:
      const: "strain"
    contains:
      const: "temperature"
    contains:
      const: "time_step"
required:
  - dataset_id
  - split
  - expected_sha256
  - max_particles
  - required_columns
additionalProperties: false
