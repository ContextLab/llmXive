$schema: "http://json-schema.org/draft-07/schema#"
title: "AttentionMatrix"
description: "Schema for a synthetic attention matrix record."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier (UUID)."
  shape:
    type: "array"
    items:
      type: "integer"
    minItems: 2
    maxItems: 2
    description: "Matrix dimensions (e.g., [128, 128])."
  mean:
    type: "number"
    description: "Mean of the matrix values."
  variance:
    type: "number"
    description: "Variance of the matrix values."
  sparsity_level:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of zero values (0.0 to 1.0)."
  outlier_magnitude:
    type: "number"
    minimum: 1.0
    description: "Factor by which outliers are scaled."
  generated_at:
    type: "string"
    format: "date-time"
    description: "Timestamp of generation."
required:
  - "id"
  - "shape"
  - "mean"
  - "variance"
  - "sparsity_level"
  - "outlier_magnitude"
  - "generated_at"
additionalProperties: false