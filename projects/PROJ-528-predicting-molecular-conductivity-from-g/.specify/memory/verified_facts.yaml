'|aromatic bond estimated order':
  quote: "In molecules which have resonance, bond order may not be an integer. In\
    \ benzene, the delocalized molecular orbitals contain 6 pi electrons over six\
    \ carbons, essentially yielding half a pi bond together with the sigma bond for\
    \ each pair of carbon atoms, giving a calculated bond order of 1.5 (one and a\
    \ half bond). Furthermore, bond orders of 1.1 (eleven tenths bond), 4/3 (or 1.333333...,\
    \ four thirds bond) or 0.5 (half bond), for example, can occur in some molecules\
    \ and essentially refer to bond strength relative to bonds with order 1. In the\
    \ nitrate anion (NO\u22123), the bond order for each bond between nitrogen and\
    \ oxygen is 4/3 (or 1.333333...)."
  source_id: Bond order
  url: https://en.wikipedia.org/wiki/Bond_order
  value: '1.5'
