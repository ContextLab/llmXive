# Contract for data/processed/descriptors.csv (CSV column requirements).
type: object
required:
  - smiles
  - aromatic_ring_count
  - conjugation_path_length
  - average_path_length
  - degree_mean
  - degree_std
  - ring_count
  - molecular_weight
properties:
