    type: string
  aromatic_ring_count:
    type: number
  conjugation_path_length:
    type: number
  average_path_length:
    type: number
  degree_mean:
    type: number
  degree_std:
    type: number
  ring_count:
    type: number
  molecular_weight:
    type: number
  homo_lumo_gap:
    type: number
