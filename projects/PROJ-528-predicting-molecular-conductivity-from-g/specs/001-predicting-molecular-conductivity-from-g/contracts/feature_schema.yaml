# Contract for data/processed/feature_vif_report.json.
type: object
required:
  - features
  - summary
properties:
  features:
    type: array
    items:
      type: object
      required:
        - feature_name
        - importance_score
        - vif_score
        - is_excluded
      properties:
        feature_name:
          type: string
        importance_score:
          type: number
        vif_score:
          type: number
        is_excluded:
          type: boolean
  summary:
    type: object
    required:
      - total_features
      - excluded_features
      - max_vif
    properties:
      total_features:
        type: integer
      excluded_features:
        type: integer
      max_vif:
        type: number
