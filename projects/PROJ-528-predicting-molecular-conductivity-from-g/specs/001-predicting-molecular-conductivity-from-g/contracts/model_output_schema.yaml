# Contract for data/processed/model_output.json.
type: object
required:
  - runs
properties:
  runs:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - run_id
        - model_type
        - r2_test
        - mae_test
        - r2_cv_mean
        - r2_cv_std
        - outlier_threshold
        - target_type
        - vif_excluded_features
      properties:
        run_id:
          type: string
        model_type:
          type: string
          enum: [random_forest, gradient_boosting]
        r2_test:
          type: number
        mae_test:
          type: number
        r2_cv_mean:
          type: number
        r2_cv_std:
          type: number
        outlier_threshold:
          type: number
        target_type:
          type: string
        vif_excluded_features:
          type: array
          items:
            type: string
