# Contract for the Molecule entity collection (data/processed/molecules.json).
type: array
minItems: 1
items:
  type: object
  required:
    - smiles
    - molecular_weight
    - log_conductivity
    - is_valid
    - scaffold_id
  properties:
    smiles:
      type: string
    molecular_weight:
      type: number
    log_conductivity:
      type: number
    is_valid:
      type: boolean
    scaffold_id:
      type: string
