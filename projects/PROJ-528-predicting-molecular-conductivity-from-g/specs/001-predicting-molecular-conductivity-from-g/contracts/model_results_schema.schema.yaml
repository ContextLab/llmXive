$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Results Schema"
description: "Schema for model performance metrics and feature importance (data/processed/model_results.json)"
type: "object"
properties:
  model_type:
    type: "string"
    description: "Type of model (RandomForest or GradientBoosting)"
  r2_test:
    type: "number"
    description: "R-squared score on the test set"
  mae_test:
    type: "number"
    description: "Mean Absolute Error on the test set"
  r2_cv_mean:
    type: "number"
    description: "Mean R-squared from 5-fold cross-validation"
  r2_cv_std:
    type: "number"
    description: "Standard deviation of R-squared from 5-fold cross-validation"
  feature_importance_ranking:
    type: "array"
    description: "List of feature names sorted by importance (descending)"
    items:
      type: "string"
  vif_excluded_features:
    type: "array"
    description: "List of features excluded due to VIF > 10"
    items:
      type: "string"
required:
  - "model_type"
  - "r2_test"
  - "mae_test"
  - "r2_cv_mean"
  - "r2_cv_std"
  - "feature_importance_ranking"
  - "vif_excluded_features"
additionalProperties: false