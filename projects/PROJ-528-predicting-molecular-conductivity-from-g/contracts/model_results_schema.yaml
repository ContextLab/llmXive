%YAML 1.2
---
# Schema for Molecular Conductivity Prediction Model Results
# This file defines the structure for the output of the model training and
# sensitivity analysis pipeline (User Story 2 & 3).
#
# Fields:
#   r2: Coefficient of determination (float)
#   mae: Mean Absolute Error (float)
#   cv_scores: Cross-validation metrics (list of objects)
#   sensitivity_data: Sensitivity analysis results (list of objects)
#   vif_scores: Variance Inflation Factor scores for features (dict)

type: object
required:
  - r2
  - mae
  - cv_scores
  - sensitivity_data
  - vif_scores
properties:
  r2:
    type: number
    description: "Coefficient of determination (R²) on the test set."
    minimum: -1.0
    examples:
      - 0.854
      - 0.912

  mae:
    type: number
    description: "Mean Absolute Error on the test set."
    minimum: 0.0
    examples:
      - 0.125
      - 0.089

  cv_scores:
    type: array
    description: "List of cross-validation fold results."
    items:
      type: object
      required:
        - fold
        - r2
        - mae
      properties:
        fold:
          type: integer
          description: "Fold index (1-based)."
          minimum: 1
        r2:
          type: number
          description: "R² score for this fold."
        mae:
          type: number
          description: "MAE for this fold."
    examples:
      - - fold: 1
          r2: 0.82
          mae: 0.15
        - fold: 2
          r2: 0.88
          mae: 0.11

  sensitivity_data:
    type: array
    description: "Results from the outlier sensitivity analysis (sweeping thresholds)."
    items:
      type: object
      required:
        - threshold_sigma
        - r2
        - kruskal_stat
        - kruskal_pval
      properties:
        threshold_sigma:
          type: number
          description: "Outlier threshold in standard deviations (e.g., 3.0, 3.5)."
        r2:
          type: number
          description: "Model R² after applying this threshold."
        kruskal_stat:
          type: number
          description: "Kruskal-Wallis H statistic comparing variances."
        kruskal_pval:
          type: number
          description: "P-value from the Kruskal-Wallis test."
    examples:
      - threshold_sigma: 3.0
        r2: 0.85
        kruskal_stat: 12.4
        kruskal_pval: 0.002
      - threshold_sigma: 3.5
        r2: 0.86
        kruskal_stat: 10.1
        kruskal_pval: 0.006

  vif_scores:
    type: object
    description: "Variance Inflation Factor scores for each feature in the final model."
    additionalProperties:
      type: number
      description: "VIF value for the feature."
      minimum: 1.0
    examples:
      degree_mean: 1.2
      path_length_mean: 1.5
      aromaticity_index: 2.1
      bond_polarity: 1.8
      resonance_energy: 1.1

metadata:
  version: "1.0.0"
  generated_by: "llmXive pipeline"
  schema_version: "1.0"