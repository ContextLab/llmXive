$schema: "http://json-schema.org/draft-07/schema#"
title: "CodeSample Dataset Schema"
description: "Schema for the processed vulnerability counts dataset (data/processed/vulnerability_counts.csv)"
type: "object"
properties:
  sample_id:
    type: "string"
    description: "Unique identifier for the code sample (e.g., humaneval-001-starcoder-01)"
  source_type:
    type: "string"
    enum: ["LLM", "Human"]
    description: "Source of the code sample"
  model_name:
    type: "string"
    description: "Name of the model used for generation (e.g., starcoder, codegen)"
    pattern: "^[a-z0-9_-]+$"
  benchmark_name:
    type: "string"
    enum: ["HumanEval", "MBPP"]
    description: "Benchmark dataset used"
  task_id:
    type: "string"
    description: "Task identifier from the benchmark"
  lines_of_code:
    type: "integer"
    minimum: 1
    description: "Number of lines of code in the sample"
  is_valid:
    type: "boolean"
    description: "Whether the sample passed benchmark tests"
  vulnerability_count:
    type: "integer"
    minimum: 0
    description: "Raw count of vulnerabilities found by Bandit"
  adjusted_vulnerability_count:
    type: "number"
    minimum: 0
    description: "Vulnerability count adjusted for false positive rate"
  cwe_ids:
    type: "array"
    items:
      type: "string"
      pattern: "^CWE-[0-9]+$"
    description: "List of Common Weakness Enumeration IDs found"
required:
  - sample_id
  - source_type
  - model_name
  - benchmark_name
  - task_id
  - lines_of_code
  - is_valid
  - vulnerability_count
  - adjusted_vulnerability_count
  - cwe_ids
additionalProperties: false
