# CWE ID to Regex Pattern Mapping for Reference-Validator Agent
# Patterns are case-insensitive and multiline by default in the validator.
# These are simplified patterns for demonstration. In a real scenario,
# these would be more comprehensive based on CWE definitions.

# CWE-78: OS Command Injection
CWE-78: "os\\.system\\(|subprocess\\.call\\(|subprocess\\.Popen\\(|exec\\("

# CWE-89: SQL Injection
CWE-89: "execute\\(.*%|execute\\(.*\\.format\\(|f\\\".*SELECT.*%|f\\\".*INSERT.*%|f\\\".*UPDATE.*%|f\\\".*DELETE.*%"

# CWE-22: Path Traversal
CWE-22: "open\\(.*\\.join\\(.*,.*\\.\\)|open\\(.*request\\.args|open\\(.*request\\.form"

# CWE-200: Sensitive Information Exposure
CWE-200: "print\\(.*password|print\\(.*secret|print\\(.*api_key|print\\(.*token"

# CWE-798: Use of Hard-coded Credentials
CWE-798: "password\\s*=\\s*[\"'][^\"']+[\"']|api_key\\s*=\\s*[\"'][^\"']+[\"']|secret\\s*=\\s*[\"'][^\"']+[\"']"

# CWE-434: Unrestricted Upload of File with Dangerous Type
CWE-434: "save\\(.*\\.filename|save_as\\(.*\\.filename"

# CWE-611: XML External Entity (XXE) Injection
CWE-611: "parse\\(.*etree|fromstring\\(.*etree|XML\\(.*lxml"

# CWE-79: Cross-site Scripting (XSS)
CWE-79: "render_template_string\\(.*request|\\.safe\\(.*request"

# CWE-352: Cross-Site Request Forgery (CSRF)
CWE-352: "csrf_exempt|@csrf\\.protect"

# CWE-502: Deserialization of Untrusted Data
CWE-502: "pickle\\.loads?\\(|yaml\\.load\\(.*Loader|marshal\\.loads\\("
