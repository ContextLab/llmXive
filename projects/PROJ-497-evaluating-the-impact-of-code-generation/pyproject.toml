[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-eval-code-vuln-density"
version = "0.1.0"
description = "Evaluating the Impact of Code Generation Models on Code Vulnerability Density"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "datasets",
    "bandit",
    "scikit-learn",
    "statsmodels",
    "pandas",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "pingouin",
    "ruff",
    "black",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
include = ["code/**/*.py", "tests/**/*.py"]
extend-exclude = [
    "__pycache__",
    "*.egg-info",
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"code/__init__.py" = ["F401"]
"tests/**/*.py" = ["F401", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "download", "generate", "analyze", "stats", "validator", "main", "state_utils", "setup_project"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]