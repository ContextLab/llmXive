%YAML 1.2
---
$schema: http://json-schema.org/draft-07/schema#
title: Stellar Flare Correlation Results Schema
description: >
  Defines the output schema for statistical correlation results
  between stellar flare activity and exoplanet atmospheric retention.
  Used by code/analysis.py for saving to data/results/correlation_results.json.
type: object
required:
  - metadata
  - correlation
  - sensitivity
properties:
  metadata:
    type: object
    description: Execution and provenance metadata
    required:
      - timestamp
      - pipeline_version
      - input_file
      - filter_criteria
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of analysis execution
      pipeline_version:
        type: string
        description: Git commit hash or version tag of the pipeline
      input_file:
        type: string
        description: Relative path to the input derived physics file
      filter_criteria:
        type: object
        description: Summary of data filtering applied
        required:
          - min_flare_count
          - stellar_type
          - unphysical_mass_loss_threshold
        properties:
          min_flare_count:
            type: integer
            description: Minimum number of flares required for inclusion
          stellar_type:
            type: string
            description: Stellar classification filter (e.g., "M-dwarf")
          unphysical_mass_loss_threshold:
            type: number
            description: Threshold for mass loss rate exclusion (fraction per Gyr)
      data_quality_flags:
        type: array
        items:
          type: string
        description: List of data quality issues encountered (e.g., missing rotation periods)

  correlation:
    type: object
    description: Primary partial Spearman rank correlation results
    required:
      - method
      - variables
      - rho_partial
      - p_value
      - n_samples
      - confidence_interval
    properties:
      method:
        type: string
        enum:
          - partial_spearman_rank
        description: Statistical method used
      variables:
        type: object
        description: Variables involved in the correlation
        required:
          - independent
          - dependent
          - controls
        properties:
          independent:
            type: string
            description: Name of the independent variable (e.g., cumulative_flux)
          dependent:
            type: string
            description: Name of the dependent variable (e.g., retention_fraction)
          controls:
            type: array
            items:
              type: string
            description: List of control variables (e.g., mass, semi_major_axis)
      rho_partial:
        type: number
        description: Partial Spearman rank correlation coefficient (ρ)
        minimum: -1.0
        maximum: 1.0
      p_value:
        type: number
        description: Two-tailed p-value for the correlation
        minimum: 0.0
        maximum: 1.0
      n_samples:
        type: integer
        description: Number of samples used in the calculation
        minimum: 1
      confidence_interval:
        type: object
        description: 95% confidence interval for ρ
        required:
          - lower
          - upper
        properties:
          lower:
            type: number
          upper:
            type: number
      significance_statement:
        type: string
        description: Human-readable statement about statistical significance
        pattern: "^(associational|significant|not significant).*$"

  sensitivity:
    type: object
    description: Results from sensitivity analysis on atmospheric mass baseline
    required:
      - parameter
      - baselines
      - correlations
      - variation
    properties:
      parameter:
        type: string
        description: Name of the parameter varied (e.g., M_atm_initial_baseline)
      baselines:
        type: array
        items:
          type: number
        description: List of baseline values tested
      correlations:
        type: array
        items:
          type: number
        description: List of ρ values corresponding to each baseline
      variation:
        type: object
        description: Statistical variation of correlation coefficients
        required:
          - range
          - std_dev
        properties:
          range:
            type: object
            required:
              - min
              - max
            properties:
              min:
                type: number
              max:
                type: number
          std_dev:
            type: number
            description: Standard deviation of the correlation coefficients
      robustness_assessment:
        type: string
        description: Qualitative assessment of result robustness
        enum:
          - robust
          - moderately_robust
          - sensitive
          - highly_sensitive

  provenance:
    type: object
    description: Detailed execution provenance
    required:
      - code_checksum
      - dependencies
    properties:
      code_checksum:
        type: string
        description: SHA-256 checksum of the analysis script
      dependencies:
        type: object
        description: Versions of key dependencies used
        properties:
          scipy:
            type: string
          pingouin:
            type: string
          pandas:
            type: string
          numpy:
            type: string