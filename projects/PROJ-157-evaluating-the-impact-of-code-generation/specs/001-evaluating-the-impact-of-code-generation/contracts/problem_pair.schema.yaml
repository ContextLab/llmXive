$schema: "http://json-schema.org/draft-07/schema#"
title: "ProblemPair"
type: "object"
required:
  - problem_id
  - human_code
  - llm_code
  - generation_timestamp
properties:
  problem_id:
    type: "string"
    description: "Unique identifier of the programming challenge (e.g., Codeforces‑001)."
  human_code:
    type: "string"
    description: "C++ source code submitted by a human (reference solution)."
  llm_code:
    type: "object"
    description: "Mapping from model name to generated source code."
    additionalProperties:
      type: "string"
  generation_timestamp:
    type: "string"
    format: "date-time"
    description: "ISO‑8601 timestamp of when the LLM variant was generated."