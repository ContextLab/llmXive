[project]
name = "proj-472-network-structure-avalanche-dynamics"
version = "0.1.0"
description = "Investigating the impact of network structure on neural avalanche dynamics"
requires-python = ">=3.11"

[tool.black]
# Formatting configuration (T003)
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | data
  | figures
)/
'''

[tool.ruff]
# Linting configuration (T003)
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "data",
    "figures",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["config", "data", "analysis", "utils"]

[tool.ruff.format]
# Use ruff format as a drop-in for black-compatible formatting
quote-style = "double"
indent-style = "space"