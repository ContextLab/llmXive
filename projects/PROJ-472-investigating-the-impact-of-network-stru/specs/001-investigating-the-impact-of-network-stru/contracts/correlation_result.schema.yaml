$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Result Schema"
description: "Schema for statistical association results"
type: object
properties:
  metric_pair:
    type: string
    description: "Name of the metric pair (e.g., 'degree_vs_exponent_size')"
  spearman_rho:
    type: number
    description: "Spearman correlation coefficient"
  p_value:
    type: number
    description: "Raw p-value"
  corrected_p_value:
    type: number
    description: "Permutation-corrected p-value"
  vif_score:
    type: number
    description: "Variance Inflation Factor (if applicable)"
  threshold_used:
    type: number
    description: "Avalanche threshold used (e.g., 0.75)"
  collinearity_status:
    type: string
    enum:
      - "low"
      - "high"
    description: "Status based on VIF >= 5"
  sample_size:
    type: integer
    description: "Number of participants included in this specific correlation."
  ci_lower:
    type: number
    description: "Lower bound of bootstrap confidence interval."
  ci_upper:
    type: number
    description: "Upper bound of bootstrap confidence interval."
required:
  - metric_pair
  - spearman_rho
  - p_value
  - corrected_p_value
  - threshold_used
  - collinearity_status
  - sample_size
  - ci_lower
  - ci_upper
additionalProperties: false