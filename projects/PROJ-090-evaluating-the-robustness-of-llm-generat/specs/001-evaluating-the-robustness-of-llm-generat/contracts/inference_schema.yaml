$schema: "http://json-schema.org/draft-07/schema#"
title: "Inference Log Schema"
type: "object"
required:
  - "task_id"
  - "perturbation_type"
  - "prompt"
  - "generation"
  - "status"
  - "execution_time"
properties:
  task_id:
    type: "string"
    description: "Unique identifier for the HumanEval task"
  perturbation_type:
    type: "string"
    enum:
      - "original"
      - "synonym"
      - "typo"
      - "rephrase"
    description: "Type of prompt used"
  prompt:
    type: "string"
    description: "The prompt text sent to the model"
  generation:
    type: "string"
    description: "The code generated by the model"
  status:
    type: "string"
    enum:
      - "pass"
      - "fail"
      - "timeout"
      - "oom"
      - "syntax_error"
    description: "Result of code execution"
  execution_time:
    type: "number"
    description: "Time taken for generation and execution in seconds"
  error_message:
    type: "string"
    nullable: true
    description: "Error details if status is not 'pass'"
  model_config:
    type: "object"
    description: "Configuration used for inference"
    properties:
      model_name:
        type: "string"
      quantization:
        type: "string"
      device:
        type: "string"
