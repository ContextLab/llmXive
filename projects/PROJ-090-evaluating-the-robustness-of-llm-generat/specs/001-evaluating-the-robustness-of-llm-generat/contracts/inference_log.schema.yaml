$schema: "http://json-schema.org/draft-07/schema#"
title: "Inference Log Schema"
description: "Schema for the inference logs generated by the StarCoder2-1.5B model."
type: "object"
required:
  - "task_id"
  - "prompt_type"
  - "perturbation_type"
  - "generated_code"
  - "pass"
  - "error_type"
  - "execution_environment"
properties:
  task_id:
    type: "string"
    description: "Unique identifier for the HumanEval task."
  prompt_type:
    type: "string"
    enum:
      - "original"
      - "perturbed"
    description: "Whether the prompt was original or perturbed."
  perturbation_type:
    type:
      - "string"
      - "null"
    description: "Type of perturbation (synonym, typo, rephrase) or null if original."
  generated_code:
    type: "string"
    description: "The code generated by the model."
  generation_time:
    type: "number"
    description: "Time taken for generation in seconds."
  pass:
    type: "boolean"
    description: "Whether the generated code passed all tests."
  error_type:
    type: "string"
    enum:
      - "syntax"
      - "logic"
      - "timeout"
      - "oom"
      - "none"
    description: "Classification of the error if the code did not pass."
  confidence_score:
    type:
      - "number"
      - "null"
    description: "Model's confidence score (if available)."
  seed:
    type:
      - "integer"
      - "null"
    description: "Random seed used for generation."
  execution_environment:
    type: "string"
    enum:
      - "CPU"
      - "GPU"
    description: "Hardware environment used for inference."