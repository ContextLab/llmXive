# Standalone ruff config for compatibility with older runners
# This file mirrors settings in pyproject.toml

line-length = 88
target-version = "py311"

select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
]

ignore = [
    "E501",
    "B008",
]

[isort]
known-first-party = [
    "utils",
    "generate_data",
    "run_tests",
    "collect_pvalues",
    "analyze_pvalues",
    "bootstrap_ci",
    "plot_qq",
    "sensitivity_analysis",
    "integrate_pipeline",
    "profile_simulation",
    "cleanup_refactor",
]
force-sort-within-sections = true
