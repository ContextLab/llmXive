# Standalone ruff configuration file for explicit CLI usage
# Extends settings from pyproject.toml if needed, but this file
# ensures `ruff check` works without loading pyproject.toml explicitly
extend = "pyproject.toml"
line-length = 88
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "C", "B", "UP", "N"]
ignore = ["E501"]
