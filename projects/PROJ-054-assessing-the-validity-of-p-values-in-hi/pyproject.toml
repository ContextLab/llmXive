[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assess-p-value-validity"
version = "0.1.0"
description = "Assessing the validity of p-values in high-dimensional data"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "pytest",
    "ruff",
    "black",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (black handles this)
    "B008", # do not perform function calls in argument defaults (common in tests)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # assertions allowed in tests

[tool.ruff.isort]
known-first-party = ["utils", "generate_data", "run_tests", "collect_pvalues", "analyze_pvalues", "bootstrap_ci", "plot_qq", "sensitivity_analysis", "integrate_pipeline", "profile_simulation", "cleanup_refactor"]
force-sort-within-sections = true
