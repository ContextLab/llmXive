$schema: "http://json-schema.org/draft-07/schema#"
title: "Action Sequence"
description: "Discrete list of user inputs driving the simulation."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the sequence"
  global_seed:
    type: "integer"
    description: "Global random seed for the experiment"
  sequence_index:
    type: "integer"
    description: "Index of the sequence within the global seed (0-9)"
  stochastic_seed:
    type: "integer"
    description: "Derived seed for visual noise generation (global_seed + sequence_index). Used to ensure Baseline and Hybrid runs share the same noise stream."
  actions:
    type: "array"
    description: "List of actions performed in the sequence"
    items:
      type: "object"
      properties:
        timestamp:
          type: "integer"
          description: "Frame index when the action occurs"
        action_type:
          type: "string"
          description: "Type of action (e.g., 'hit', 'summon', 'die')"
        target_id:
          type: "string"
          description: "ID of the target object"
      required: ["timestamp", "action_type"]
required: ["id", "global_seed", "sequence_index", "stochastic_seed", "actions"]