$schema: "http://json-schema.org/draft-07/schema#"
title: "Drift Metric"
description: "Final calculated score for a sequence comparing symbolic and visual states (Semantic Drift)."
type: "object"
properties:
  sequence_id:
    type: "string"
    description: "Unique identifier for the sequence"
  mode:
    type: "string"
    enum: ["baseline", "hybrid"]
    description: "Whether the run used the vanilla or hybrid approach"
  semantic_drift_score:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Normalized score representing the divergence between logical and visual states"
  permanence_violations:
    type: "integer"
    minimum: 0
    description: "Count of objects visually alive but logically dead"
  phantom_objects:
    type: "integer"
    minimum: 0
    description: "Count of objects visually alive but logically missing"
  render_failures:
    type: "integer"
    minimum: 0
    description: "Count of state mismatches due to teleportation or unrenderable states"
  cv_accuracy:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Validation accuracy of the CV pipeline on the annotated subset"
  is_valid:
    type: "boolean"
    description: "True if CV accuracy >= 85%, otherwise the score is invalid"
  stationarity_check_method:
    type: "string"
    description: "Method used for stationarity check (e.g., 'Variance Check')"
  stationarity_p_value:
    type: "number"
    description: "P-value from the stationarity check (Shapiro-Wilk)"
  shapiro_p_value:
    type: "number"
    description: "P-value from the Shapiro-Wilk test on paired differences"
  shapiro_stationary:
    type: "boolean"
    description: "True if Shapiro-Wilk test indicates normality (p > 0.05)"
  resource_usage:
    type: "object"
    properties:
      peak_ram_mb:
        type: "number"
        description: "Peak memory usage in Megabytes"
      wall_clock_seconds:
        type: "number"
        description: "Total execution time in seconds"
    required: ["peak_ram_mb", "wall_clock_seconds"]
required: ["sequence_id", "mode", "semantic_drift_score", "permanence_violations", "phantom_objects", "is_valid", "stationarity_check_method", "stationarity_p_value", "shapiro_p_value", "shapiro_stationary"]