$schema: "http://json-schema.org/draft-07/schema#"
title: "Symbolic State Log"
description: "Deterministic ground truth state trajectory from the symbolic engine."
type: object
required:
  - sequence_id
  - seed
  - timesteps
properties:
  sequence_id:
    type: string
    description: "Unique identifier for the action sequence."
  seed:
    type: integer
    description: "Random seed used for action generation."
  timesteps:
    type: array
    description: "List of state snapshots at each timestep."
    items:
      type: object
      required:
        - timestep
        - objects
      properties:
        timestep:
          type: integer
          description: "Frame index (0-indexed)."
        objects:
          type: array
          description: "List of object states at this timestep."
          items:
            type: object
            required:
              - object_id
              - type
              - hp
              - position
              - is_alive
            properties:
              object_id:
                type: string
                description: "Unique ID for the object."
              type:
                type: string
                description: "Object type (e.g., 'player', 'enemy', 'item')."
              hp:
                type: integer
                description: "Current health points."
              position:
                type: array
                description: "[x, y] coordinates."
                items:
                  type: integer
              is_alive:
                type: boolean
                description: "True if HP > 0."
  global_state:
    type: object
    description: "Global simulation state (e.g., time, score)."
    properties:
      time_elapsed:
        type: integer
      score:
        type: integer
