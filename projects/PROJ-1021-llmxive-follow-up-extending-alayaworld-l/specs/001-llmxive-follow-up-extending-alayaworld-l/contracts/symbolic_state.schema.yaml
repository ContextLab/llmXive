$schema: "http://json-schema.org/draft-07/schema#"
title: "Symbolic State Log"
description: "Time-series record of logical object states derived from the rule-based engine."
type: "object"
required:
  - "log_id"
  - "sequence_id"
  - "frame_index"
  - "objects"
properties:
  log_id:
    type: "string"
    description: "Unique identifier for the log."
  sequence_id:
    type: "string"
    description: "Reference to the action sequence."
  frame_index:
    type: "integer"
    minimum: 0
    description: "Frame number (0-indexed)."
  objects:
    type: "array"
    items:
      type: "object"
      required:
        - "id"
        - "hp"
        - "exists"
        - "position"
      properties:
        id:
          type: "string"
          description: "Unique object ID."
        hp:
          type: "integer"
          minimum: 0
          description: "Current HP (0 = dead)."
        exists:
          type: "boolean"
          description: "Whether the object exists in the logical world."
        position:
          type: "array"
          items:
            type: "number"
          minItems: 2
          maxItems: 2
          description: "Logical (x, y) position."
additionalProperties: false
