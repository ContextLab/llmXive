$schema: "http://json-schema.org/draft-07/schema#"
title: "Drift Result"
description: "Computed semantic drift score and metadata for a sequence."
type: object
required:
  - sequence_id
  - drift_score
  - validation_status
  - resource_metrics
properties:
  sequence_id:
    type: string
    description: "Unique identifier for the action sequence."
  drift_score:
    type: number
    description: "Calibrated semantic drift score (0.0 = perfect, 1.0 = complete drift), weighted by CV confidence."
    minimum: 0.0
    maximum: 1.0
  validation_status:
    type: string
    enum:
      - "high_confidence"
      - "medium_confidence"
      - "low_confidence"
      - "inconclusive"
    description: "Status of the CV validation. 'low_confidence' scores are retained but weighted less in aggregation."
  confidence_weight:
    type: number
    description: "Weight applied to this score in the final aggregation (0.0 to 1.0). Derived from CV confidence."
    minimum: 0.0
    maximum: 1.0
  reason:
    type: string
    description: "Reason for status if not 'high_confidence' (e.g., 'CV_ACCURACY_LOW', 'RENDER_FAILURE')."
  resource_metrics:
    type: object
    required:
      - peak_ram_gb
      - wall_clock_time_sec
    properties:
      peak_ram_gb:
        type: number
        description: "Peak RAM usage in GB."
        maximum: 7.0
      wall_clock_time_sec:
        type: number
        description: "Total execution time in seconds."
        maximum: 1800
  correction_events:
    type: integer
    description: "Number of correction tokens injected."
  rendering_failures:
    type: array
    description: "List of rendering failure logs."
    items:
      type: object
      properties:
        error_code:
          type: string
          enum:
            - RENDER_FAILURE
        object_id:
          type: string
        timestamp:
          type: integer