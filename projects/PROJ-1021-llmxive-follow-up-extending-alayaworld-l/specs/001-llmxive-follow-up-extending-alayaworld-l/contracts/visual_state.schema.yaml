$schema: "http://json-schema.org/draft-07/schema#"
title: "Visual State Log"
type: object
properties:
  sequence_id:
    type: string
  timestamp:
    type: string
    format: date-time
  frame_analysis:
    type: array
    items:
      type: object
      properties:
        frame_id:
          type: integer
        detected_objects:
          type: array
          items:
            type: object
            properties:
              object_id:
                type: string
              confidence:
                type: number
                minimum: 0.0
                maximum: 1.0
              bounding_box:
                type: object
                properties:
                  x:
                    type: number
                  y:
                    type: number
                  width:
                    type: number
                  height:
                    type: number
                required: [x, y, width, height]
              status:
                type: string
                enum: ["alive", "dead", "hidden", "unknown"]
              is_phantom:
                type: boolean
                description: "True if object detected but not in symbolic log"
              is_low_confidence:
                type: boolean
                description: "True if detection confidence < 0.85 (e.g., occlusion)"
      required: [frame_id, detected_objects]
required: [sequence_id, timestamp, frame_analysis]