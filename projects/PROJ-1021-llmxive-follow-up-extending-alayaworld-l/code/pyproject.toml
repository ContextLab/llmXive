[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-alayaworld-extend"
version = "0.1.0"
description = "Hybrid Logic Integration for AlayaWorld"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless",
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "av",
    "pytest",
    "pyyaml",
    "psutil",
    "scipy",
    "bitsandbytes",
    "transformers",
    "diffusers",
    "accelerate"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0"
]

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501", # Line too long (handled by black)
    "F403", # 'from module import *' used; unable to detect undefined names (common in some legacy patterns)
]
line-length = 120
target-version = "py311"

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "N802"] # Allow asserts in tests, ignore naming conventions for test methods
"code/data/gt_tool.py" = ["E402"] # Allow relative imports for GUI tools if needed

[tool.ruff.isort]
known-first-party = ["cv_pipeline", "symbolic_engine", "metrics", "naive_generator", "utils", "data", "tests", "scripts"]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
