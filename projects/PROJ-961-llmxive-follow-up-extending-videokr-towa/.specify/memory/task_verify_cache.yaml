  r: '`code/utils/config.py` correctly defines `SEEDS` (pinned ints for pilot_sampling/oversampling/permutation),
    `PATHS` (raw/processed), and `SENSITIVITY_THRESHOLDS = [2, 3, 4]`, and the checksum
    schema is consistently a JSON list of `{path, sha256}` entries with `main()` exiting
    1 on mismatch. However, `code/ingest/checksum.py` uses `from utils.config import
    ...`, which only resolves if `code/` is on `sys.path`; running the task''s stated
    verification command `python code/ingest/checksum.py` from the project root puts
    `code/ingest` (not `code/`) on the path, so the import would raise `ModuleNotFou'
  sig: c14e6f2cea346f5689be04677113c8ebedfd0436d8b7bf8f291734a84df50074
