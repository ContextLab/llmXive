$schema: "http://json-schema.org/draft-07/schema#"
title: "Annotated Questions Schema"
description: "Schema for the annotated dataset containing structural chain length, binning, and correctness labels."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the question record."
  question:
    type: "string"
    description: "Natural language question text."
  answer:
    type: "string"
    description: "Ground truth answer text."
  correctness:
    type: "boolean"
    description: "Whether the model prediction was correct."
  chain_length:
    type: "integer"
    minimum: -1
    description: "Shortest path hops between query and answer entities; -1 indicates unresolvable."
  chain_bin:
    type: "string"
    enum:
      - "1"
      - "2"
      - "3+"
    description: "Binned hop count derived from chain_length."
  status:
    type: "string"
    enum:
      - "valid"
      - "disconnected"
      - "mapping_failure"
    description: "Status of the graph traversal or entity linking."
required:
  - id
  - question
  - answer
  - correctness
  - chain_length
  - chain_bin
  - status
additionalProperties: false
