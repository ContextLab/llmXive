$schema: "http://json-schema.org/draft-07/schema#"
title: "Annotated Questions Schema"
description: "Schema for the annotated dataset containing structural chain length, binning, covariates, and correctness labels."
type: "object"
properties:
  question_id:
    type: "string"
    description: "Unique identifier for the question record."
  question_text:
    type: "string"
    description: "Natural language question text."
  answer_text:
    type: "string"
    description: "Ground truth answer text."
  correctness:
    type: "boolean"
    description: "Binary label indicating whether the model answer is correct."
  predicted_correctness:
    type: "number"
    description: "Model prediction of correctness (probability, 0.0–1.0)."
  chain_length:
    type: "integer"
    minimum: -1
    description: "Shortest path hops between query and answer entities; -1 indicates unresolvable."
  chain_bin:
    type: "string"
    enum:
      - "1"
      - "2"
      - "3+"
    description: "Binned hop count derived from `chain_length`."
  question_difficulty:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Difficulty score (0–1) from the dataset."
  video_length_seconds:
    type: "number"
    minimum: 0
    description: "Video duration in seconds."
  answer_type:
    type: "string"
    enum:
      - "multiple_choice"
      - "open_ended"
    description: "Answer format (multiple_choice or open_ended)."
required:
  - question_id
  - question_text
  - answer_text
  - correctness
  - predicted_correctness
  - chain_length
  - chain_bin
  - question_difficulty
  - video_length_seconds
  - answer_type
additionalProperties: false