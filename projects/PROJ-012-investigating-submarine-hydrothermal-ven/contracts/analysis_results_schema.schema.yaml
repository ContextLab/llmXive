$schema: http://json-schema.org/draft-07/schema#
title: Analysis Results Schema
description: Schema for validating statistical analysis outputs (LME, PERMANOVA, dbRDA).
type: object
required:
  - analysis_type
  - model_id
  - parameters
  - results
properties:
  analysis_type:
    type: string
    enum:
      - lme
      - permanova
      - dbRDA
      - sensitivity
    description: Type of analysis performed.
  model_id:
    type: string
    description: Unique identifier for the model run.
  parameters:
    type: object
    description: Parameters used in the model.
    additionalProperties: true
  results:
    type: object
    description: Statistical results.
    additionalProperties: true
  metadata_flags:
    type: object
    description: Metadata flags associated with the result.
    properties:
      associational_analysis_of_summary_statistic:
        type: boolean
        description: Flag indicating if this is an associational analysis of a summary statistic.
  execution_time_seconds:
    type: number
    minimum: 0
    description: Time taken to run the analysis.
additionalProperties: true