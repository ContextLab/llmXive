$schema: "http://json-schema.org/draft-07/schema#"
title: Analysis Results Schema
description: Schema for diversity metrics and statistical analysis results.
type: object
required:
  - sample_id
  - metric_name
  - value
properties:
  sample_id:
    type: string
    description: Foreign key referencing the Sample entity.
    pattern: "^[A-Za-z0-9_-]+$"
  metric_name:
    type: string
    description: Name of the diversity metric or analysis type.
    enum:
      - shannon
      - simpson
      - bray_curtis
      - lme_result
      - permanova_result
      - dbrda_result
  value:
    type: number
    description: Calculated value of the metric.
  rarefaction_depth:
    type: integer
    description: Rarefaction depth used for calculation (if applicable).
    minimum: 1
    nullable: true
  model_type:
    type: string
    description: Type of statistical model used (e.g., LME, Spearman).
    nullable: true
  estimate:
    type: number
    description: Regression coefficient or effect size.
    nullable: true
  se:
    type: number
    description: Standard error of the estimate.
    nullable: true
  p_value:
    type: number
    description: P-value from statistical test.
    minimum: 0.0
    maximum: 1.0
    nullable: true
  dispersion_confounded:
    type: boolean
    description: Flag indicating if PERMANOVA is confounded by dispersion.
    nullable: true
additionalProperties: false
