# Analysis Results Schema
# Used for validating LME, PERMANOVA, and other statistical outputs
# (T022a-T035) and for contract tests (T016, T027)

$schema: "http://json-schema.org/draft-07/schema#"
title: Analysis_Results
description: >
  Schema for statistical analysis outputs including LME models,
  PERMANOVA tests, and diversity metrics.
type: object

required:
  - analysis_type
  - model_stats

properties:
  analysis_type:
    type: string
    enum:
      - lme
      - fixed_effects
      - spearman
      - permanova
      - permanova_dispersion_confounded
      - dbrda
      - alpha_diversity
      - sensitivity_analysis
    description: Type of statistical analysis performed

  model_stats:
    type: array
    description: List of result rows
    items:
      type: object
      required:
        - sample_id
        - predictor
        - estimate

      properties:
        sample_id:
          type: string
          description: Sample or group identifier

        predictor:
          type: string
          description: Predictor variable name (e.g., pH, temperature)

        estimate:
          type: number
          description: Coefficient estimate

        se:
          type: number
          description: Standard error

        p_value:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: P-value

        model_type:
          type: string
          enum:
            - lme
            - fixed_effects
            - spearman
            - permanova
            - dbrda
          description: Model type used

        r_squared:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: R-squared (for PERMANOVA/dbRDA)

        f_statistic:
          type: number
          description: F-statistic (for PERMANOVA)

        dispersion_confounded:
          type: boolean
          default: false
          description: True if betadisper test indicated confounding

        warning:
          type: string
          description: Warning message if non-linearity detected

        metadata_flag:
          type: string
          default: "associational analysis of summary statistic"
          description: FR-003.1 required flag

  input_params:
    type: object
    description: Parameters used in the analysis
    properties:
      rarefaction_depth:
        type: integer
      transformation:
        type: string
      random_effects:
        type: array
        items:
          type: string
      fixed_effects:
        type: array
        items:
          type: string

  timestamp:
    type: string
    format: date-time
    description: When the analysis was run

  software_versions:
    type: object
    properties:
      qiime2:
        type: string
      statsmodels:
        type: string
      scipy:
        type: string

additionalProperties: true

