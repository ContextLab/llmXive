$schema: http://json-schema.org/draft-07/schema#
title: OTU Table Schema
description: Schema for validating OTU/ASV table data.
type: object
required:
  - feature_id
  - taxonomy
  - counts
properties:
  feature_id:
    type: string
    description: Unique identifier for the feature (OTU/ASV).
    pattern: "^OTU[0-9]+$|^ASV[0-9]+$"
  taxonomy:
    type: string
    description: Taxonomic classification string.
    pattern: "^[a-zA-Z]+;[a-zA-Z]+;[a-zA-Z]+;[a-zA-Z]+;[a-zA-Z]+;[a-zA-Z]+;[a-zA-Z]+$"
  counts:
    type: object
    description: Dictionary mapping sample_id to abundance count.
    additionalProperties:
      type: integer
      minimum: 0
additionalProperties: true
