$schema: http://json-schema.org/draft-07/schema#
title: Sample Schema
description: Schema for validating unified sample table data from ingestion pipeline.
type: object
required:
  - sample_id
  - timestamp
  - pH
  - temperature
  - deployment_event
  - sensor_id
  - coordinates
  - fastq_path
properties:
  sample_id:
    type: string
    description: Unique identifier for the sample.
    pattern: "^S[0-9]+$"
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the sample collection.
  pH:
    type: number
    minimum: 1.0
    maximum: 14.0
    description: Measured pH value.
  temperature:
    type: number
    description: Measured temperature in Celsius.
  deployment_event:
    type: string
    description: Identifier for the deployment campaign.
  sensor_id:
    type: string
    description: Identifier for the sensor used.
  coordinates:
    type: string
    description: Coordinates in format 'lat,lon,depth'.
    pattern: "^-?[0-9]+(\\.[0-9]+)?,-?[0-9]+(\\.[0-9]+)?,-?[0-9]+(\\.[0-9]+)?$"
  pH_sd:
    type: number
    minimum: 0
    description: Standard deviation of pH within the ±15 min window.
  fastq_path:
    type: string
    description: Relative path to the FASTQ file.
  rejected:
    type: boolean
    default: false
    description: Flag indicating if the sample was rejected.
  rejection_reason:
    type: ["string", "null"]
    description: Reason for rejection if applicable.
additionalProperties: true
