$schema: http://json-schema.org/draft-07/schema#
title: Sample Schema
description: Schema for unified sample table containing environmental and sequencing metadata.
type: object
required:
  - sample_id
  - timestamp
  - pH
  - temperature
  - deployment_event
  - sensor_id
  - coordinates
  - fastq_path
properties:
  sample_id:
    type: string
    description: Unique identifier for the sample.
    pattern: "^[A-Z0-9-]+$"
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of sample collection.
  deployment_event:
    type: string
    description: Campaign or deployment identifier.
  sensor_id:
    type: string
    description: ID of the sensor used for measurement.
  coordinates:
    type: string
    description: Geo-spatial coordinates (lat, long, depth).
    pattern: "^[\\d.-]+,[\\d.-]+,[\\d.-]+$"
  pH:
    type: number
    description: Measured pH value.
    minimum: 0.0
    maximum: 14.0
  temperature:
    type: number
    description: Temperature in Celsius.
  pH_sd:
    type: number
    description: Standard deviation of pH within ±15 min window.
    minimum: 0.0
  pH_heterogeneous:
    type: boolean
    description: Flag if pH_sd > 0.2.
  outlier_status:
    type: string
    enum:
      - valid
      - review_low
      - review_high
      - excluded
    description: Status based on pH outlier detection rules.
  fastq_path:
    type: string
    description: Relative path to raw FASTQ file.
  quality_flag:
    type: string
    enum:
      - pass
      - review
      - fail
    description: Derived quality status.
additionalProperties: false
