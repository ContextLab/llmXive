# Sample Metadata Schema
# Used for validating input CSV files in the ingestion pipeline (T010-T014)
# and for contract tests (T008)

$schema: "http://json-schema.org/draft-07/schema#"
title: Sample
description: >
  Represents a single environmental sampling event with pH, temperature,
  and metadata from submarine hydrothermal vent deployments.
type: object

required:
  - sample_id
  - timestamp
  - pH
  - temp
  - location
  - deployment_event
  - sensor_id
  - coordinates

properties:
  sample_id:
    type: string
    pattern: "^[A-Za-z0-9_-]+$"
    description: Unique identifier for the sample

  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of sampling event

  pH:
    type: number
    minimum: 0.0
    maximum: 14.0
    description: Measured pH value
    x-validation-rules:
      - pH < 1.0 or pH > 10.0: FLAG AS OUTLIER (reject)
      - 1.0 <= pH < 2.0: FLAG FOR REVIEW (edge range)
      - 8.5 <= pH <= 10.0: FLAG FOR REVIEW (edge range)

  temp:
    type: number
    description: Measured temperature in degrees Celsius

  pH_sd:
    type: number
    minimum: 0.0
    description: Standard deviation of pH within ±15 min window
    x-validation-rules:
      - pH_sd > 0.2: Set pH_heterogeneous = True (exclude from analysis)

  location:
    type: string
    description: Deployment location name

  fastq_path:
    type: string
    format: uri-reference
    description: Path to raw FASTQ file (relative to project root)

  deployment_event:
    type: string
    description: Deployment event identifier

  sensor_id:
    type: string
    description: Sensor identifier

  coordinates:
    type: string
    pattern: "^[+-]?[0-9]+(\\.[0-9]+)?,[+-]?[0-9]+(\\.[0-9]+)?$"
    description: GPS coordinates in lat,lon format

  pH_heterogeneous:
    type: boolean
    default: false
    description: True if pH_sd > 0.2 (flagged for exclusion)

additionalProperties: false

x-schema-version: "1.0.0"
x-generated-from: specs/001-submarine-hydrothermal-vent-microbial-communities/spec.md
x-related-tasks:
  - T004  # pH heterogeneity calculation
  - T010  # Load and validate sensor data
  - T011  # Temporal alignment
  - T012  # Outlier filtering
  - T013  # Exclusion logic
  - T014  # Unified output
  - T008  # Contract test
