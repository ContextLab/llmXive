[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-submarine-hydrothermal-vent"
version = "0.1.0"
description = "Submarine Hydrothermal Vent Microbial Communities as Indicators of Ocean Acidification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "biopython>=1.81",
    "scikit-bio>=0.5.9",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pytest>=7.4.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = 'code/.*\.py$'
exclude = '''
/(
    \.git
  | \.tox
  | build
  | dist
  | \.eggs
  | .*\.egg-info
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]
exclude = [
    ".git",
    "__pycache__",
    ".tox",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]
per-file-ignores = {
    "tests/*": ["E501", "S101"], # Allow assert in tests
}

[tool.isort]
profile = "black"
line_length = 88
known_third_party = ["pandas", "numpy", "matplotlib", "seaborn", "skbio", "qiime2", "biopython", "statsmodels", "scipy"]

[tool.pypytest]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["code/"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]