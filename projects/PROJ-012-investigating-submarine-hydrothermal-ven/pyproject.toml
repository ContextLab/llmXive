[project]
name = "submarine-hydrothermal-vent"
version = "0.1.0"
description = "Submarine Hydrothermal Vent Microbial Communities as Indicators of Ocean Acidification"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "statsmodels",
    "biopython",
    "scipy",
    "matplotlib",
    "seaborn",
    "skbio",
    "qiime2",
    "ruff",
    "black",
    "pytest",
    "pyyaml",
    "aiohttp",
    "h5py",
    "requests",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"