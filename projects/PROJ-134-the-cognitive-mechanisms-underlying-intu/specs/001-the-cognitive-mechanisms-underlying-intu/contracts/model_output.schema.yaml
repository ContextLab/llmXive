$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Output Schema"
description: "Schema for Bayesian model posterior summaries and comparison metrics"
type: "object"
properties:
  model_name:
    type: "string"
    description: "Name of the model (e.g., 'Bayesian_Hierarchical', 'Frequentist_LME')"
  waic:
    type: "number"
    description: "Widely Applicable Information Criterion (for Bayesian models)"
  aic:
    type: "number"
    description: "Akaike Information Criterion (for frequentist models)"
  posterior_means:
    type: "object"
    description: "Dictionary of parameter names to their posterior mean values"
    additionalProperties:
      type: "number"
  credible_intervals:
    type: "object"
    description: "95% Credible Intervals for parameters"
    additionalProperties:
      type: "array"
      items:
        type: "number"
      minItems: 2
      maxItems: 2
  convergence_status:
    type: "string"
    enum:
      - "converged"
      - "divergent"
      - "failed"
    description: "Status of the MCMC convergence"
required:
  - model_name
  - convergence_status
  - posterior_means
additionalProperties: false
