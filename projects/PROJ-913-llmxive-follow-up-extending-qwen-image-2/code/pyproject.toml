[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-qwen-image-2"
version = "0.1.0"
description = "Automated science pipeline for OPD Generalization Gap in Unified Diffusion"
requires-python = ">=3.9"
dependencies = [
    "diffusers",
    "transformers",
    "torch",
    "scikit-learn",
    "pandas",
    "numpy",
    "requests",
    "huggingface_hub",
    "seaborn",
    "datasets",
    "pytest",
    "statsmodels",
    "robust",
    "ruff",
    "black",
]

[tool.ruff]
# Line length to match Black
line-length = 88
target-version = "py39"

# Enable specific lint rules
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # Line too long (handled by Black)
    "B008", # Do not perform function call in argument defaults (common in ML pipelines)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in init files

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
