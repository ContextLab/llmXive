# Explicit configuration file for Ruff
# Extends the settings in pyproject.toml but allows for command-line overrides
extend = "pyproject.toml"

# Specific overrides for the codebase if needed
# For now, we rely on pyproject.toml settings
line-length = 88
target-version = "py39"

[lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501"]
