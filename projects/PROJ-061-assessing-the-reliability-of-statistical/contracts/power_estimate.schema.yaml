$schema: "http://json-schema.org/draft-07/schema#"
title: PowerEstimate
description: Schema for baseline power analysis results (T014)
type: object
required:
  - dataset_id
  - theoretical_power
  - empirical_power
  - absolute_error
properties:
  dataset_id:
    type: string
    description: The ID of the dataset used
  n_obs:
    type: integer
    description: Number of observations after cleaning
  is_binary:
    type: boolean
    description: Whether the outcome variable is binary
  status:
    type: string
    enum:
      - completed
      - skipped
      - excluded_unreliable
      - error
    description: Status of the analysis
  reason:
    type: string
    description: Reason for skipping or error, if applicable
  theoretical_power:
    type: number
    description: Theoretical power calculated via statsmodels
  empirical_power:
    type: number
    description: Empirical power estimated via bootstrap
  absolute_error:
    type: number
    description: Absolute difference between theoretical and empirical
  bootstrap_iterations:
    type: integer
    description: Number of bootstrap iterations performed
  validation_passed:
    type: boolean
    description: Whether the bootstrap validity check passed
additionalProperties: true