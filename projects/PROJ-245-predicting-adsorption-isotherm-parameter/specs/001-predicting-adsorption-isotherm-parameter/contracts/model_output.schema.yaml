$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Performance Output Schema"
description: "Schema for the JSON output containing model metrics and null model comparison."
type: object
properties:
  best_model:
    type: object
    properties:
      model_type:
        type: string
        enum: ["Linear Regression", "Random Forest", "Gradient Boosting"]
      r2:
        type: number
        description: "R-squared score on the test set."
      rmse:
        type: number
        description: "Root Mean Squared Error."
      mae:
        type: number
        description: "Mean Absolute Error."
      cv_r2_mean:
        type: number
        description: "Mean R-squared from cross-validation."
      cv_r2_std:
        type: number
        description: "Standard deviation of R-squared from cross-validation."
    required:
      - model_type
      - r2
      - rmse
      - mae
  null_model:
    type: object
    properties:
      rmse_mean:
        type: number
        description: "Mean RMSE of the null model (predicting mean)."
      fold_rmses:
        type: array
        items:
          type: number
        description: "RMSE for each fold of the null model."
    required:
      - rmse_mean
      - fold_rmses
  comparison:
    type: object
    properties:
      improvement_percent:
        type: number
        description: "Percentage improvement of best model over null model."
      is_significant:
        type: boolean
        description: "True if improvement > 20% (per SC-001)."
    required:
      - improvement_percent
      - is_significant
required:
  - best_model
  - null_model
  - comparison
additionalProperties: false
