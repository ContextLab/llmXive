$schema: "http://json-schema.org/draft-07/schema#"
title: "Adsorption Dataset Schema"
type: "object"
properties:
  molecule_id:
    type: "string"
    description: "Unique identifier for the adsorbate molecule."
  smiles:
    type: "string"
    description: "Canonical SMILES string representing the molecular structure."
  material_id:
    type: "string"
    description: "Unique identifier for the adsorbent material."
  isotherm_type:
    type: "string"
    enum: ["Type I", "Type II", "Type IV"]
    description: "Classification of the adsorption isotherm."
  langmuir_capacity:
    type: "number"
    description: "Langmuir capacity parameter (Q_max) in mmol/g."
  henry_constant:
    type: "number"
    description: "Henry's constant (K_H) in mmol/g/bar."
  molecular_weight:
    type: "number"
    description: "Molecular weight in g/mol."
  polarizability:
    type: "number"
    description: "Polarizability in Å³."
  van_der_waals_volume:
    type: "number"
    description: "Van der Waals volume in Å³."
  surface_area:
    type: "number"
    description: "Surface area of the adsorbent in m²/g."
  pore_volume:
    type: "number"
    description: "Pore volume of the adsorbent in cm³/g."
required:
  - molecule_id
  - material_id
  - isotherm_type
  - langmuir_capacity
  - henry_constant
  - molecular_weight
  - polarizability
  - van_der_waals_volume
  - surface_area
additionalProperties: false
