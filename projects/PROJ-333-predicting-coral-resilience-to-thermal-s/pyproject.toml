[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coral-resilience-pipeline"
version = "0.1.0"
description = "Predicting Coral Resilience to Thermal Stress Using Publicly Available Genomic Data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "biopython",
    "pysam",
    "scipy",
    "pandas",
    "matplotlib",
    "gprofiler-official",
    "rpy2",
    "requests",
    "numpy",
    "tomlkit",
    "tomli_w",
    "tomli",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["models", "utils", "data", "setup_environment"]
skip = [".git", ".venv", "data", "build", "dist"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
addopts = "-v --tb=short"
