[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-coral-resilience"
version = "0.1.0"
description = "Predicting Coral Resilience to Thermal Stress Using Publicly Available Genomic Data"
requires-python = ">=3.9"
dependencies = [
    "biopython",
    "pysam",
    "scipy",
    "pandas",
    "matplotlib",
    "gprofiler-official",
    "rpy2",
    "tomlkit",
    "tomli_w",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
known_first_party = ["code", "tests"]
known_third_party = ["biopython", "pysam", "scipy", "pandas", "matplotlib", "gprofiler_official", "rpy2", "tomlkit", "tomli_w"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true