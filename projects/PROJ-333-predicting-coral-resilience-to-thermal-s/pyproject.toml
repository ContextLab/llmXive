[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
known_first_party = ["code", "tests", "data"]
known_third_party = [
  "biopython",
  "pysam",
  "scipy",
  "pandas",
  "matplotlib",
  "gprofiler_official",
  "rpy2",
  "numpy",
  "tomlkit",
  "tomli_w"
]
default_section = "THIRDPARTY"
force_sort_within_sections = false
force_to_top = []
skip = [
  ".git",
  ".hg",
  ".mypy_cache",
  ".tox",
  ".venv",
  "_build",
  "buck-out",
  "build",
  "dist"
]