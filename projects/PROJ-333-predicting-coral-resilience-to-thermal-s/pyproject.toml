[project]
name = "llmXive-coral-resilience"
version = "0.1.0"
description = "Predicting Coral Resilience to Thermal Stress Using Publicly Available Genomic Data"
requires-python = ">=3.9"

[tool.black]
line-length = 88
target-version = ["py39"]
exclude = "/(\\.git|__pycache__|\\.venv|venv|data|build|dist)/"
skip-string-normalization = false
preview = true

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
known_first_party = ["code", "data", "utils", "models"]
