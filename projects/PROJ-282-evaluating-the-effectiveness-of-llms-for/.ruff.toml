[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG",# flake8-unused-arguments
    "SIM",# flake8-simplify
]
ignore = [
    "E501", # line-too-long (handled by black)
    "B008", # do not perform function calls in argument defaults (often needed for config)
    "ARG001", # unused arguments (sometimes valid in abstract methods or interfaces)
    "SIM102", # collapsible if statements (style preference)
]

[lint.per-file-ignores]
"tests/*" = ["ARG", "S101"] # Allow assertions in tests, ignore unused args
"code/setup_project_structure.py" = ["ARG001"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
