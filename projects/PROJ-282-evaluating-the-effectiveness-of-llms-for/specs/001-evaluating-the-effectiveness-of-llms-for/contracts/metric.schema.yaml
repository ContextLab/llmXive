$schema: "http://json-schema.org/draft-07/schema#"
title: "AnalysisMetric"
description: "Schema for statistical analysis results"
type: "object"
properties:
  metric_name:
    type: "string"
    description: "Name of the metric (e.g., 'Pearson_r', 'McFadden_R2')"
  feature_name:
    type: "string"
    description: "Name of the feature being analyzed"
  model_type:
    type: "string"
    description: "Model type associated with the metric"
  value:
    type: "number"
    description: "Calculated value of the metric"
  p_value:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Raw p-value"
  adjusted_p_value:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Bonferroni corrected p-value"
  significance:
    type: "string"
    enum:
      - "Significant"
      - "Not_Significant"
    description: "Statistical significance status"
required:
  - metric_name
  - feature_name
  - model_type
  - value
  - p_value
  - adjusted_p_value
  - significance
additionalProperties: false