$schema: "http://json-schema.org/draft-07/schema#"
title: "FeatureVector"
description: "Schema for extracted structural and semantic features (Canonical SSoT)."
type: "object"
properties:
  snippet_id:
    type: "string"
    description: "Foreign key to CodeSnippet."
  ast_depth:
    type: "integer"
    minimum: 0
    description: "Maximum depth of the AST."
  cyclomatic_complexity:
    type: "number"
    minimum: 0
    description: "McCabe cyclomatic complexity score."
  node_count:
    type: "integer"
    minimum: 0
    description: "Total number of AST nodes."
  taint_api_count:
    type: "integer"
    minimum: 0
    description: "Frequency of taint-source APIs."
  sanitization_present:
    type: "boolean"
    description: "True if sanitization functions are present."
  parse_error:
    type: "boolean"
    description: "True if parsing failed."
  language:
    type: "string"
    enum: ["C", "Python", "JavaScript"]
    description: "Language of the snippet for stratification."
  dataset_source:
    type: "string"
    description: "Source dataset name (e.g., VulDeePecker, NIST_Juliet, JSVulnDB)."
  obfuscation_level:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Optional: Obfuscation level if available in dataset."
    nullable: true
required:
  - snippet_id
  - ast_depth
  - cyclomatic_complexity
  - node_count
  - taint_api_count
  - sanitization_present
  - parse_error
  - language
  - dataset_source
additionalProperties: false