$schema: "http://json-schema.org/draft-07/schema#"
title: "FeatureVector"
description: "Schema for extracted structural and semantic features."
type: "object"
properties:
  snippet_id:
    type: "string"
    description: "Foreign key to CodeSnippet."
  ast_depth:
    type: "integer"
    minimum: 0
    description: "Maximum depth of the AST."
  cyclomatic_complexity:
    type: "number"
    minimum: 0
    description: "McCabe cyclomatic complexity score."
  node_count:
    type: "integer"
    minimum: 0
    description: "Total number of AST nodes."
  taint_api_count:
    type: "integer"
    minimum: 0
    description: "Frequency of taint-source APIs."
  sanitization_present:
    type: "boolean"
    description: "True if sanitization functions are present."
  embedding_similarity_score:
    type: "number"
    minimum: -1.0
    maximum: 1.0
    description: "Cosine similarity to vulnerable patterns."
  parsing_error:
    type: "boolean"
    description: "True if parsing failed."
  language:
    type: "string"
    enum: ["C", "Python", "JavaScript"]
    description: "Language of the snippet for stratification."
required:
  - snippet_id
  - ast_depth
  - cyclomatic_complexity
  - node_count
  - taint_api_count
  - sanitization_present
  - embedding_similarity_score
  - parsing_error
  - language
additionalProperties: false
