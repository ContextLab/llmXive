$schema: "http://json-schema.org/draft-07/schema#"
title: "PredictionResult Schema"
type: object
properties:
  snippet_id:
    type: string
    description: "Reference to CodeSnippet.id"
  model_name:
    type: string
    description: "Name of the model or analyzer used"
  predicted_label:
    type: string
    enum:
      - "vulnerable"
      - "safe"
    description: "Predicted vulnerability status"
  predicted_category:
    type: string
    nullable: true
    description: "Predicted vulnerability category"
  confidence_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Confidence score of the prediction"
  is_correct:
    type: boolean
    description: "True if prediction matches ground truth"
  inference_time_ms:
    type: number
    description: "Time taken for inference in milliseconds"
  truncation_event:
    type: boolean
    description: "True if input was truncated"
  timeout_risk:
    type: boolean
    description: "True if processed after circuit breaker trigger"
required:
  - snippet_id
  - model_name
  - predicted_label
  - confidence_score
  - is_correct
  - inference_time_ms
  - truncation_event