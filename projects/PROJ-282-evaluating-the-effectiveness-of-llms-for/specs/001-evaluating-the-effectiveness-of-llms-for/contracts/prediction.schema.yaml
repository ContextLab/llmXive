$schema: "http://json-schema.org/draft-07/schema#"
title: "PredictionResult"
description: "Schema for LLM and Static Analyzer prediction results"
type: "object"
properties:
  snippet_id:
    type: "string"
    description: "Unique identifier for the code snippet"
  model_type:
    type: "string"
    enum:
      - "LLM_ZeroShot"
      - "Bandit"
      - "Cppcheck"
    description: "Type of model that generated the prediction"
  predicted_label:
    type: "string"
    enum:
      - "Vulnerable"
      - "Safe"
      - "Uncertain"
    description: "Binary or uncertain label predicted by the model"
  predicted_category:
    type: "string"
    description: "Specific vulnerability category (e.g., 'SQLi', 'CWE-89')"
  confidence_score:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Model confidence score (if available)"
  is_correct:
    type: "boolean"
    description: "Whether the prediction matches the ground truth"
  inference_time_ms:
    type: "number"
    description: "Time taken for inference in milliseconds"
required:
  - snippet_id
  - model_type
  - predicted_label
  - is_correct
  - inference_time_ms
additionalProperties: false