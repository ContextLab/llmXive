$schema: "http://json-schema.org/draft-07/schema#"
title: "PredictionResult Schema"
description: "Schema for LLM and Static Analyzer prediction results."
type: "object"
properties:
  snippet_id:
    type: "string"
    description: "Reference to the CodeSnippet ID."
  model_type:
    type: "string"
    enum:
      - "LLM"
      - "Bandit"
      - "Cppcheck"
    description: "Type of model or tool used."
  predicted_label:
    type: "string"
    enum:
      - "Vulnerable"
      - "Safe"
      - "Uncertain"
    description: "Predicted vulnerability status."
  predicted_category:
    type: "string"
    description: "Predicted vulnerability category or 'none'."
  confidence_score:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Confidence score if available."
  inference_time_ms:
    type: "number"
    minimum: 0
    description: "Time taken for inference in milliseconds."
  is_correct:
    type: "boolean"
    description: "Whether the prediction matches the ground truth."
required:
  - "snippet_id"
  - "model_type"
  - "predicted_label"
  - "predicted_category"
  - "inference_time_ms"
  - "is_correct"
additionalProperties: false