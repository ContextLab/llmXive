$schema: "http://json-schema.org/draft-07/schema#"
title: "CodeSnippet Dataset Schema"
description: "Schema for raw code snippets (Canonical SSoT)."
type: object
properties:
  id:
    type: string
    description: "Unique identifier for the snippet"
  language:
    type: string
    enum:
      - "python"
      - "c"
      - "javascript"
    description: "Programming language of the snippet"
  source_code:
    type: string
    description: "Raw source code content"
  ground_truth_label:
    type: string
    enum:
      - "vulnerable"
      - "safe"
      - "unknown"
    description: "Ground truth vulnerability status"
  ground_truth_category:
    type: string
    nullable: true
    description: "CWE category or vulnerability type"
  source_dataset:
    type: string
    description: "Name of the source dataset"
  truncated:
    type: boolean
    description: "Indicates if code was truncated for context window"
required:
  - id
  - language
  - source_code
  - ground_truth_label
  - source_dataset
  - truncated
additionalProperties: false