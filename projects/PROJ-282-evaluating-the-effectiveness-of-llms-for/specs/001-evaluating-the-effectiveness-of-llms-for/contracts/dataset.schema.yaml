$schema: "http://json-schema.org/draft-07/schema#"
title: "CodeSnippet Dataset Schema"
description: "Schema for the raw and processed code snippet data."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the snippet."
  language:
    type: "string"
    enum:
      - "C"
      - "Python"
      - "JavaScript"
    description: "Programming language of the snippet."
  source_code:
    type: "string"
    description: "The source code content, truncated if necessary."
  ground_truth_label:
    type: "string"
    enum:
      - "Vulnerable"
      - "Safe"
    description: "Ground truth vulnerability status."
  ground_truth_category:
    type: "string"
    description: "Specific vulnerability category (e.g., SQLi, XSS)."
  dataset_source:
    type: "string"
    description: "Source dataset name (e.g., VulDeePecker, NIST_Juliet, JSVulnDB)."
required:
  - "id"
  - "language"
  - "source_code"
  - "ground_truth_label"
  - "ground_truth_category"
  - "dataset_source"
additionalProperties: false