# Ruff configuration for llmXive project
# Linting rules to ensure code quality and consistency

[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "W", "I", "D", "UP", "B", "C4", "SIM"]

# Ignore specific rules that might be too strict for research code
# D100: Missing docstring in public module
# D101: Missing docstring in public class
# D102: Missing docstring in public method
# D103: Missing docstring in public function
ignore = ["D100", "D101", "D102", "D103", "D203", "D213"]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude a few generated files
exclude = [
    "data/raw/*",
    "data/processed/*",
    "data/results/*",
    "state/*",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

# Same as Black
line-length = 88
target-version = "py310"

[lint.per-file-ignores]
# Tests can have shorter names and less strict docstrings
"tests/*" = ["D", "S101"]
# Scripts can have simpler structure
"code/scripts/*" = ["D"]
