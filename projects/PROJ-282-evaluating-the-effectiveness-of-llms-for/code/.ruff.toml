# Standalone Ruff configuration for CLI usage
# This file is redundant with pyproject.toml but ensures CLI tools pick up settings
# even if run from subdirectories without pyproject discovery.

line-length = 100
target-version = "py310"

select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
]

exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
]
