repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.9
        args: [--config=code/pyproject.toml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --config=code/pyproject.toml]
      - id: ruff-format
        args: [--config=code/pyproject.toml]
