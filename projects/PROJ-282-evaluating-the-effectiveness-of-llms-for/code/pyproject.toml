[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-282"
version = "0.1.0"
description = "Evaluating the Effectiveness of LLMs for Identifying Security Vulnerabilities in Open-Source Code"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "transformers",
    "scikit-learn",
    "pandas",
    "tree-sitter",
    "networkx",
    "requests",
    "pyyaml",
    "bitsandbytes",
    "sentence-transformers",
    "pytest",
    "radon",
    "statsmodels",
    "pydantic",
    "ruff",
    "black",
    "pre-commit",
    "torch",
    "numpy",
    "parquet",
    "fastparquet"
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
# Target Python version
target-version = "py39"
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    ".eggs",
    "*.egg-info",
    ".venv",
    "venv",
    "build",
    "dist",
    "data",
    "state",
    "logs"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF"  # ruff-specific rules
]
ignore = [
    "E501", # Line too long (handled by black)
    "B904"  # raise-without-from-inside-except (optional strictness)
]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "tests"]
force-sort-within-sections = true

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
  | state
)/
'''

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
