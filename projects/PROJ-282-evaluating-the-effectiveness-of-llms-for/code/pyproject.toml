[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-evaluating-llms-security"
version = "0.1.0"
description = "Evaluating the Effectiveness of LLMs for Identifying Security Vulnerabilities in Open-Source Code"
requires-python = ">=3.10"
dependencies = [
    "transformers",
    "scikit-learn",
    "pandas",
    "tree-sitter",
    "networkx",
    "requests",
    "pyyaml",
    "bitsandbytes",
    "sentence-transformers",
    "pytest",
    "radon",
    "statsmodels",
    "pydantic",
    "ruff",
    "black",
    "pre-commit",
    "parquet",
    "pyarrow"
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | state
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]
exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "data",
    "state",
    "venv"
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-v --tb=short"
