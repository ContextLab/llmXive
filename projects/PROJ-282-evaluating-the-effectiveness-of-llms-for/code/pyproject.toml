[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-security-evaluation"
version = "0.1.0"
description = "Evaluating the effectiveness of LLMs for identifying security vulnerabilities"
requires-python = ">=3.10"
dependencies = [
    "transformers",
    "scikit-learn",
    "pandas",
    "tree-sitter",
    "networkx",
    "requests",
    "pyyaml",
    "bitsandbytes",
    "sentence-transformers",
    "pytest",
    "radon",
    "statsmodels",
    "pydantic",
    "ruff",
    "black",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
