$schema: http://json-schema.org/draft-07/schema#
title: GNNOutput
description: Schema for the output of the GNN training and inference pipeline.
type: object
required:
  model_id
  architecture
  hyperparameters
  training_metrics
  feature_importance
properties:
  model_id:
    type: string
    description: Unique identifier for the trained model.
  architecture:
    type: string
    enum:
      - "StaticScatteringPotentialGNN"
    description: Name of the model architecture used.
  hyperparameters:
    type: object
    required:
      - hidden_dim
      - num_layers
      - learning_rate
    properties:
      hidden_dim:
        type: integer
        minimum: 1
      num_layers:
        type: integer
        minimum: 1
      learning_rate:
        type: number
        minimum: 0.0
  training_metrics:
    type: object
    required:
      - final_loss
      - convergence_epoch
    properties:
      final_loss:
        type: number
        minimum: 0.0
      convergence_epoch:
        type: integer
        minimum: 1
      history:
        type: array
        items:
          type: object
          properties:
            epoch:
              type: integer
            loss:
              type: number
  feature_importance:
    type: object
    description: Map of feature names to importance scores.
    additionalProperties:
      type: number
additionalProperties: false
