# GNN Output Schema
# Defines the structure for GNN model outputs
# Used by T007 and T030

type: object
required:
  - predicted_flux
  - loss
  - epoch

properties:
  predicted_flux:
    type: array
    description: Predicted local heat flux for each atom
    items:
      type: number
    minItems: 1

  loss:
    type: number
    description: Training loss value
    minimum: 0.0

  epoch:
    type: integer
    description: Training epoch number
    minimum: 0

  model_checkpoint:
    type: string
    description: Path to saved model checkpoint

  training_metrics:
    type: object
    description: Additional training metrics
    properties:
      mse:
        type: number
      rmse:
        type: number
      r2_score:
        type: number

additionalProperties: false
