# Thermal Sample Schema
# Defines the structure for thermal conductivity samples
# Used by T007 and T025

type: object
required:
  - graph_id
  - conductivity
  - converged
  - metadata

properties:
  graph_id:
    type: string
    description: Unique identifier for the source graph
    pattern: "^sample_\\d+$"

  conductivity:
    type: number
    description: Thermal conductivity in W/(m·K)
    minimum: 0.0
    maximum: 100.0

  converged:
    type: boolean
    description: Whether the Green-Kubo simulation converged

  metadata:
    type: object
    description: Additional metadata about the sample
    properties:
      atoms:
        type: integer
        minimum: 1
      temperature:
        type: number
        minimum: 0.0
      cutoff:
        type: number
        minimum: 0.0
      simulation_time:
        type: number
        minimum: 0.0
      reason:
        type: string
        description: Reason for non-convergence if applicable

additionalProperties: false
