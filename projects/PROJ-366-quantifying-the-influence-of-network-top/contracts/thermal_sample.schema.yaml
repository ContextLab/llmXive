$schema: http://json-schema.org/draft-07/schema#
title: ThermalSample
description: >
  Schema for a thermal sample containing an atomic graph, computed thermal conductivity,
  simulation metadata, and convergence status.
type: object
required:
  - sample_id
  - graph_id
  - thermal_conductivity
  - conductivity_unit
  - simulation_params
  - metadata
properties:
  sample_id:
    type: string
    description: Unique identifier for the thermal sample.
  graph_id:
    type: string
    description: Reference to the associated AtomicGraph graph_id.
  thermal_conductivity:
    type: number
    minimum: 0
    description: Computed thermal conductivity value.
  conductivity_unit:
    type: string
    const: "W/mK"
    description: Unit of thermal conductivity.
  converged:
    type: boolean
    description: Whether the Green-Kubo simulation converged (relative change < 1% in final segment).
  simulation_params:
    type: object
    description: Parameters used for the Green-Kubo simulation.
    required:
      - lammps_version
      - potential_file
      - timestep
      - thermostat_type
      - temperature
      - cores
    properties:
      lammps_version:
        type: string
      potential_file:
        type: string
      timestep:
        type: number
        description: Timestep in femtoseconds.
      thermostat_type:
        type: string
      temperature:
        type: number
        description: Simulation temperature in Kelvin.
      cores:
        type: integer
        minimum: 1
      duration_ps:
        type: number
        description: Total simulation duration in picoseconds.
      hcacf_segments:
        type: integer
        description: Number of segments used for averaging.
  metadata:
    type: object
    description: Additional metadata.
    properties:
      creation_timestamp:
        type: string
        format: date-time
      checksum:
        type: string
        description: SHA-256 checksum of the serialized sample.
      outlier_excluded:
        type: boolean
        description: True if this sample was excluded due to topological defects.
      exclusion_reason:
        type: string
        description: Reason for exclusion if outlier_excluded is true.
    additionalProperties: true
additionalProperties: false
