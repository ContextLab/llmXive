$schema: http://json-schema.org/draft-07/schema#
title: ThermalSample
description: Schema for a thermal sample containing graph data and conductivity metadata.
type: object
required:
  sample_id
  graph_id
  conductivity
  conductivity_unit
  metadata
properties:
  sample_id:
    type: string
    description: Unique identifier for the thermal sample.
  graph_id:
    type: string
    description: Reference to the associated AtomicGraph.
  conductivity:
    type: number
    description: Thermal conductivity value in W/(m·K).
  conductivity_unit:
    type: string
    const: "W/(m·K)"
    description: Unit of thermal conductivity.
  metadata:
    type: object
    required:
      - converged
      - simulation_time_ps
      - temperature_k
    properties:
      converged:
        type: boolean
        description: Whether the Green-Kubo simulation converged.
      simulation_time_ps:
        type: number
        minimum: 0.0
        description: Total simulation time in picoseconds.
      temperature_k:
        type: number
        minimum: 0.0
        description: Simulation temperature in Kelvin.
      excluded_reason:
        type: string
        description: Reason for exclusion if the sample was filtered out.
additionalProperties: false
