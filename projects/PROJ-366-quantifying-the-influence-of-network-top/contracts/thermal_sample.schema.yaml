$schema: http://json-schema.org/draft-07/schema#
title: ThermalSample
description: >-
  Schema for a thermal conductivity sample resulting from Green-Kubo simulation.
  Corresponds to FR-002 and SC-003 requirements.
type: object
properties:
  graph_id:
    type: string
    description: Unique identifier linking to the atomic graph used for this sample.
  conductivity:
    type: number
    format: float
    description: Computed thermal conductivity in W/(m·K).
  converged:
    type: boolean
    description: Whether the Green-Kubo simulation has converged (relative change < 1%).
  metadata:
    type: object
    description: Additional simulation metadata.
    properties:
      simulation_time_ps:
        type: number
        description: Total simulation time in picoseconds.
      temperature_K:
        type: number
        description: Simulation temperature in Kelvin.
      potential:
        type: string
        description: Interatomic potential used (e.g., "Stillinger-Weber").
      cores:
        type: integer
        description: Number of CPU cores used for simulation.
      hcacf_relative_change:
        type: number
        description: Relative change in heat current autocorrelation in the final segment.
      voronoi_volume_mean:
        type: number
        format: float
        description: Mean Voronoi volume per atom (optional, from T027).
        nullable: true
      impurity_fraction:
        type: number
        format: float
        description: Fraction of impurity atoms (optional, from T027).
        nullable: true
    required:
      - simulation_time_ps
      - temperature_K
      - potential
      - cores
      - hcacf_relative_change
    additionalProperties: true
required:
  - graph_id
  - conductivity
  - converged
  - metadata
additionalProperties: false
