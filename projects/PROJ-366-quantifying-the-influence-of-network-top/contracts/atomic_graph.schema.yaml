$schema: http://json-schema.org/draft-07/schema#
title: AtomicGraph
description: |
  Schema for atomic graph representation of amorphous silicon structures.
  Defines nodes (atoms) and edges (bonds) based on a distance cutoff.
  Used for validation of graph construction outputs.
type: object
required:
  - nodes
  - edges
  - metadata
properties:
  nodes:
    type: array
    description: List of atomic nodes with topological features.
    items:
      type: object
      required:
        - id
        - coords
        - degree
        - clustering_coeff
      properties:
        id:
          type: integer
          description: Unique identifier for the atom/node.
        coords:
          type: array
          description: Cartesian coordinates (x, y, z).
          items:
            type: number
            format: float32
          minItems: 3
          maxItems: 3
        degree:
          type: integer
          description: Number of bonds connected to this atom.
          minimum: 0
        clustering_coeff:
          type: number
          description: Local clustering coefficient for the atom.
          format: float32
          minimum: 0.0
          maximum: 1.0
  edges:
    type: array
    description: List of bonds represented as pairs of node indices.
    items:
      type: array
      description: Pair of node IDs [u, v] representing a bond.
      items:
        type: integer
      minItems: 2
      maxItems: 2
  metadata:
    type: object
    description: Additional metadata about the graph.
    properties:
      cutoff_distance:
        type: number
        description: Distance cutoff used for bond determination (Angstroms).
      atom_count:
        type: integer
        description: Total number of atoms in the system.
      bond_count:
        type: integer
        description: Total number of bonds in the system.
      source_file:
        type: string
        description: Path to the source XYZ file.
additionalProperties: false
