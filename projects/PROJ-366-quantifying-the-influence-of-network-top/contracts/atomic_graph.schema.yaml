$schema: http://json-schema.org/draft-07/schema#
title: AtomicGraph
description: >
  Schema for an atomic graph representing an amorphous silicon configuration.
  Nodes are atoms, edges are bonds defined by a cutoff distance (default 3.0 Å).
type: object
required:
  - graph_id
  - atom_count
  - bond_count
  - cutoff_distance
  - nodes
  - edges
  - metadata
properties:
  graph_id:
    type: string
    description: Unique identifier for the graph (derived from source file hash or name).
  atom_count:
    type: integer
    minimum: 1
    description: Total number of atoms (nodes) in the graph.
  bond_count:
    type: integer
    minimum: 0
    description: Total number of bonds (edges) in the graph.
  cutoff_distance:
    type: number
    minimum: 0
    description: Bond cutoff distance in Angstroms used for construction.
  nodes:
    type: array
    description: List of atomic node data.
    items:
      type: object
      required:
        - atom_id
        - element
        - position
        - degree
      properties:
        atom_id:
          type: integer
          description: Unique integer ID for the atom within this graph.
        element:
          type: string
          const: "Si"
          description: Chemical element symbol.
        position:
          type: array
          description: Cartesian coordinates [x, y, z] in Angstroms.
          items:
            type: number
          minItems: 3
          maxItems: 3
        degree:
          type: integer
          minimum: 0
          description: Node degree (number of bonds).
        properties:
          type: object
          description: Optional per-atom properties (e.g., forces, energy).
          additionalProperties: true
  edges:
    type: array
    description: List of bond connections.
    items:
      type: object
      required:
        - source
        - target
        - distance
      properties:
        source:
          type: integer
          description: ID of the source atom.
        target:
          type: integer
          description: ID of the target atom.
        distance:
          type: number
          minimum: 0
          description: Bond length in Angstroms.
  metadata:
    type: object
    description: Additional metadata about the graph construction.
    properties:
      source_file:
        type: string
        description: Path to the original XYZ file.
      creation_timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of graph creation.
      builder_version:
        type: string
        description: Version of the graph builder script.
      box_dimensions:
        type: array
        description: Simulation box dimensions [Lx, Ly, Lz] if periodic.
        items:
          type: number
        minItems: 3
        maxItems: 3
    additionalProperties: true
additionalProperties: false
