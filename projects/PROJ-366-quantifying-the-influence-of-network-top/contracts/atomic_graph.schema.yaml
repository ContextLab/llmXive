$schema: http://json-schema.org/draft-07/schema#
title: AtomicGraph
description: >
  Schema for atomic graph representations of amorphous silicon configurations.
  Defines nodes with topological features (degree, clustering coefficient) and edges.
  Used for validation of graph construction outputs from code/ingest/graph_builder.py.
type: object
required:
  - nodes
  - edges
  - graph_id
  - cutoff_distance
properties:
  graph_id:
    type: string
    description: Unique identifier for the graph, derived from the source XYZ filename.
    pattern: "^[a-zA-Z0-9_-]+$"
  cutoff_distance:
    type: number
    description: Bond cutoff distance in Angstroms used for edge construction.
    minimum: 0.0
  nodes:
    type: array
    description: List of atomic nodes with topological properties.
    items:
      type: object
      required:
        - id
        - coords
        - degree
        - clustering_coeff
      properties:
        id:
          type: integer
          description: Unique integer identifier for the atom/node.
        coords:
          type: array
          description: 3D coordinates of the atom in Angstroms.
          items:
            type: number
          minItems: 3
          maxItems: 3
        degree:
          type: integer
          description: Number of edges connected to this node (coordination number).
          minimum: 0
        clustering_coeff:
          type: number
          description: Local clustering coefficient for the node.
          minimum: 0.0
          maximum: 1.0
  edges:
    type: array
    description: List of edges represented as pairs of node indices.
    items:
      type: array
      description: Pair of node IDs [source, target].
      items:
        type: integer
      minItems: 2
      maxItems: 2
additionalProperties: false
