$schema: http://json-schema.org/draft-07/schema#
title: AtomicGraph
description: Schema for an atomic graph representing amorphous silicon structure.
type: object
required:
  - graph_id
  - node_count
  - edge_count
  - nodes
  - edges
  - bond_cutoff
  - metadata
properties:
  graph_id:
    type: string
    description: Unique identifier for the graph.
  node_count:
    type: integer
    minimum: 1
    description: Total number of atoms (nodes) in the graph.
  edge_count:
    type: integer
    minimum: 0
    description: Total number of bonds (edges) in the graph.
  bond_cutoff:
    type: number
    minimum: 0
    description: Bond cutoff distance in Angstroms used for construction.
  nodes:
    type: array
    description: List of atomic nodes.
    items:
      type: object
      required:
        - node_id
        - element
        - position
        - degree
      properties:
        node_id:
          type: integer
          description: Unique index for the atom.
        element:
          type: string
          enum: ["Si"]
          description: Chemical element symbol.
        position:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
          description: [x, y, z] coordinates in Angstroms.
        degree:
          type: integer
          minimum: 0
          description: Number of connected bonds (coordination number).
  edges:
    type: array
    description: List of undirected edges.
    items:
      type: object
      required:
        - source
        - target
        - distance
      properties:
        source:
          type: integer
          description: Index of the source node.
        target:
          type: integer
          description: Index of the target node.
        distance:
          type: number
          minimum: 0
          description: Bond length in Angstroms.
  metadata:
    type: object
    description: Additional metadata about the graph construction.
    properties:
      source_file:
        type: string
        description: Path to the source XYZ file.
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of graph creation.
      software:
        type: string
        description: Software used for construction (e.g., 'ase').
