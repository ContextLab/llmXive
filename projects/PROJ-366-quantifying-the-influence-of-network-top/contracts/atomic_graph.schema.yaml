# Atomic Graph Schema
# Defines the structure for atomic graphs constructed from XYZ files
# Used by T007 and T012

type: object
required:
  - nodes
  - edges
  - graph_id
  - cutoff

properties:
  graph_id:
    type: string
    description: Unique identifier for the graph

  nodes:
    type: array
    description: List of atomic nodes
    items:
      type: object
      required:
        - id
        - coords
        - degree
        - clustering_coeff
      properties:
        id:
          type: integer
          description: Unique node identifier
        coords:
          type: array
          description: Cartesian coordinates [x, y, z]
          items:
            type: number
          minItems: 3
          maxItems: 3
        degree:
          type: integer
          description: Node degree (number of bonds)
          minimum: 0
        clustering_coeff:
          type: number
          description: Local clustering coefficient
          minimum: 0.0
          maximum: 1.0

  edges:
    type: array
    description: List of edges as pairs of node indices
    items:
      type: array
      items:
        type: integer
      minItems: 2
      maxItems: 2

  cutoff:
    type: number
    description: Bond cutoff distance in Å
    minimum: 0.0

  metadata:
    type: object
    description: Additional graph metadata
    properties:
      source_file:
        type: string
      atom_count:
        type: integer
      edge_count:
        type: integer

additionalProperties: false
