version: 1
disable_existing_loggers: False
formatters:
  default:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    level: INFO
  file:
    class: logging.FileHandler
    formatter: default
    filename: data/processed/pipeline.log
    level: INFO
loggers:
  ingestion:
    level: INFO
    handlers: [console, file]
    propagate: no
  utils.data_loader:
    level: INFO
    handlers: [console, file]
    propagate: no
root:
  level: INFO
  handlers: [console, file]
