[tool.black]
# Black formatting configuration
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
# Exclude common directories
extend-exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''