[tool.ruff]
# Linter rules
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long (handled by black)

# Target Python version
target-version = "py39"

# Exclude common directories
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "data",
]

# Per-file-specific settings
[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py