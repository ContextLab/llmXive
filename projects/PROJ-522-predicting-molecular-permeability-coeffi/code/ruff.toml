# Ruff configuration for llmXive project
line-length = 88
target-version = "py39"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[lint.per-file-ignores]
"code/__init__.py" = ["F401"]
"code/utils/__init__.py" = ["F401"]
"code/models/__init__.py" = ["F401"]
"tests/*" = ["S101"]  # allow assert in tests

[lint.isort]
known-first-party = ["config", "ingestion", "models", "training", "utils", "setup_directories", "setup_linting"]
force-sort-within-sections = true
