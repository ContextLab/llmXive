$schema: "http://json-schema.org/draft-07/schema#"
title: "SensitivityAnalysisResult"
description: "Schema for sensitivity analysis results."
type: "object"
properties:
  width:
    type: "number"
    description: "Prediction interval width (0.01, 0.05, or 0.1)."
  MAE:
    type: "number"
    description: "Mean Absolute Error at this width."
  confidence_interval:
    type: "string"
    description: "Confidence interval string representation."
required:
  - width
  - MAE
  - confidence_interval