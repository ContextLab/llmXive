[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "Extended Improved Large Language Diffusion Models Research Pipeline"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "datasets",
    "torch",
    "scikit-learn",
    "scipy",
    "pandas",
    "pyyaml",
    "huggingface_hub",
    "ruff",
    "black"
]

[tool.ruff]
# Target Python 3.11
target-version = "py311"
# Exclude common build artifacts and dependencies
exclude = [
    ".git",
    ".tox",
    ".eggs",
    "venv",
    ".venv",
    "build",
    "dist",
    "__pycache__"
]

[tool.ruff.lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # Line too long (handled by black)
    "E731",  # Do not assign a lambda expression, use a def
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Maximum line length for ruff (should match black)
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["utils", "models", "data", "training", "analysis", "tests"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.tox
  | \.eggs
  | venv
  | .venv
  | build
  | dist
)/
'''