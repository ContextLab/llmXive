# llmXive Follow-up Project Configuration
# PROJ-864-llmxive-follow-up-extending-improved-lar

# Project Structure
project_root: projects/PROJ-864-llmxive-follow-up-extending-improved-lar
data_dir: data

# Data Directories (relative to data_dir)
raw_dir: raw
processed_dir: processed
artifacts_dir: artifacts

# Corpus Configuration (Staged Simplification)
# Spec FR-001 requested 10M tokens, but Plan simplifies to 1M tokens due to CPU constraints.
token_limit: 1000000
max_ram_gb: 6.0

# Training Hyperparameters
learning_rate: 1e-4
batch_size: 32
num_epochs: 100
max_seq_length: 1024
device: cpu

# Model Configuration
vocab_size: 50257
embed_dim: 768
num_heads: 12

# Data Splitting
train_split_ratio: 0.9