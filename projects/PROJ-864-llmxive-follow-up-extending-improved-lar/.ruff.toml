# Explicit configuration for ruff to ensure it picks up settings correctly
# This file extends or mirrors pyproject.toml settings for CLI usage
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    ".eggs",
    "*.egg-info",
    "build",
    "dist",
    "venv",
    ".venv",
    "data",
]

[lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N",
]
ignore = ["E501", "B008"]

[lint.isort]
known-first-party = ["utils", "models", "data", "training", "analysis", "tests"]
force-sort-within-sections = true