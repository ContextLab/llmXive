[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "Follow-up research on Improved Large Language Diffusion Models"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "datasets",
    "torch",
    "scikit-learn",
    "scipy",
    "pandas",
    "pyyaml",
    "huggingface_hub",
    "ruff",
    "black",
    "pytest",
    "pingouin",
    "statsmodels",
    "evaluate",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
# Same as Black
line-length = 88
target-version = "py311"

# Assume we are in the project root, so we look for src or code
src = ["code", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"] # Allow asserts in tests, ignore line length
"code/utils/monitor.py" = ["S310"] # Allow URL opening in monitor (if needed)
"code/data/download_micro_corpus.py" = ["S310"] # Allow URL opening for dataset fetch

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-v"
