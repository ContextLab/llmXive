[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "llmXive Follow-up: Extending Improved Large Language Diffusion Models"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "datasets",
    "torch",
    "scikit-learn",
    "scipy",
    "pandas",
    "pyyaml",
    "huggingface_hub",
    "ruff",
    "black",
]

[tool.ruff]
# Target Python version
target-version = "py311"
# Line length
line-length = 88
# Exclude common directories
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    ".eggs",
    "*.egg-info",
    "build",
    "dist",
    "venv",
    ".venv",
    "data",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
]
ignore = [
    "E501",   # Line too long (handled by black)
    "B008",   # Do not perform function call in argument defaults (common in dataclasses)
]

[tool.ruff.lint.per-file-ignores]
# Allow imports in __init__.py
"__init__.py" = ["F401"]
# Allow wildcard imports in tests if needed
"tests/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["utils", "models", "data", "training", "analysis", "tests"]
force-sort-within-sections = true

[tool.black]
# Line length
line-length = 88
# Target version
target-version = ["py311"]
# Exclude directories
exclude = '''
/(
    \.git
    | \.tox
    | __pycache__
    | \.eggs
    | \.egg-info
    | build
    | dist
    | venv
    | \.venv
    | data
)/
'''
# Include .py files
include = '\.pyi?$'
# Force exclude if necessary (black specific)
force-exclude = ''
/(
    \.git
    | \.tox
    | __pycache__
    | \.eggs
    | \.egg-info
    | build
    | dist
    | venv
    | \.venv
    | data
)/
''