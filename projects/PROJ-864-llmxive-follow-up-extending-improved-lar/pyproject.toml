[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-improved-lar"
version = "0.1.0"
description = "LLM-Xive Follow-up: Extending Improved Large Language Diffusion Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "torch>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.21.0",
    "pingouin>=0.5.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["code"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["code"]
include = ["utils*", "models*", "data*", "training*", "analysis*", "tests*"]
