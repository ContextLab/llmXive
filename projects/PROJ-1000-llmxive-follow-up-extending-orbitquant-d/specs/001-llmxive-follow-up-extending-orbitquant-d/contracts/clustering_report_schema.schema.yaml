$schema: "http://json-schema.org/draft-07/schema#"
title: "Clustering Report"
description: "Schema for the report generated after clustering activation histograms."
type: "object"
properties:
  num_clusters:
    type: "integer"
    description: "Number of clusters (should be 16)."
  entropy_bins:
    type: "array"
    description: "List of entropy bin definitions."
    items:
      type: "object"
      properties:
        cluster_id:
          type: "integer"
          description: "Cluster identifier (0‑15)."
        entropy_range_min:
          type: "number"
          description: "Minimum entropy for this bin."
        entropy_range_max:
          type: "number"
          description: "Maximum entropy for this bin."
      required:
        - cluster_id
        - entropy_range_min
        - entropy_range_max
      additionalProperties: false
  derived_from_prompt_ids:
    type: "array"
    description: "Prompt IDs used for clustering."
    items:
      type: "string"
required:
  - num_clusters
  - entropy_bins
  - derived_from_prompt_ids
additionalProperties: false
