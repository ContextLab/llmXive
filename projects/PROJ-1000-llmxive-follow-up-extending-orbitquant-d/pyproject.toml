[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-orbitquant-d"
version = "0.1.0"
description = "llmXive follow-up: extending OrbitQuant"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "transformers",
    "diffusers",
    "datasets",
    "scikit-learn",
    "accelerate",
    "sentence-transformers",
    "peft",
    "fid-score",
    "clip-score",
    "ruff",
    "black",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
    "pytest-cov",
]

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501", # Line too long (black handles this)
    "B008", # Do not perform function call in argument defaults (common in ML)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # Allow asserts in tests

[tool.ruff.isort]
known-first-party = ["analysis", "config", "data", "models", "quantization", "validation", "evaluation"]
known-third-party = ["torch", "transformers", "diffusers", "datasets", "sklearn", "accelerate", "sentence_transformers", "peft", "numpy", "scipy"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
)/
'''

[tool.setuptools]
packages = ["code"]
package-dir = {"code" = "code"}
