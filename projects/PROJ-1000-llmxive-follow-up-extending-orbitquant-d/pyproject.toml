[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-orbitquant-d"
version = "0.1.0"
description = "Follow-up research implementation extending OrbitQuant for diffusion models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "diffusers",
    "datasets",
    "scikit-learn",
    "accelerate",
    "sentence-transformers",
    "peft",
    "fid-score",
    "clip-score",
    "ruff",
    "black",
    "matplotlib",
    "scipy",
    "numpy",
    "pandas",
    "pytest",
    "pytest-cov"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
    "pytest-cov",
    "mypy"
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["analysis*", "models*", "quantization*", "data*", "validation*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (black handles this)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"code/data/download_coco.py" = ["E402"]
"code/data/download_diverse_prompts.py" = ["E402"]

[tool.ruff.isort]
known-first-party = ["analysis", "models", "quantization", "data", "validation"]
known-third-party = ["torch", "numpy", "pandas", "transformers", "diffusers", "datasets", "sklearn", "accelerate", "sentence_transformers", "peft", "scipy", "matplotlib", "pytest"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = false