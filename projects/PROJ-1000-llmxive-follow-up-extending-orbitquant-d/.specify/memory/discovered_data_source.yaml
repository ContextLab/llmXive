access_python: "import os, urllib.request, zipfile, tempfile\nfrom pycocotools.coco\
  \ import COCO\n\n# Download COCO 2017 validation annotations\nurl = \"http://images.cocodataset.org/annotations/annotations_trainval2017.zip\"\
  \ntmp_dir = tempfile.mkdtemp()\nzip_path = os.path.join(tmp_dir, \"ann.zip\")\n\
  urllib.request.urlretrieve(url, zip_path)\nwith zipfile.ZipFile(zip_path, \"r\"\
  ) as z:\n    json_path = z.extract(\"annotations/captions_val2017.json\", path=tmp_dir)\n\
  \ncoco = COCO(json_path)\nimg_ids = coco.getImgIds()\nrecords = []\nfor img_id in\
  \ img_ids:\n    img_info = coco.loadImgs(img_id)[0]\n    ann_ids = coco.getAnnIds(imgIds=img_id)\n\
  \    anns = coco.loadAnns(ann_ids)\n    captions = \" \".join(a[\"caption\"] for\
  \ a in anns)\n    records.append({\n        \"image_id\": img_info[\"id\"],\n  \
  \      \"file_name\": img_info[\"file_name\"],\n        \"height\": img_info[\"\
  height\"],\n        \"width\": img_info[\"width\"],\n        \"captions\": captions,\n\
  \    })\nprint(f\"RECORDS={len(records)}\")\nprint(\"FIELDS=image_id,file_name,height,width,captions\"\
  )"
