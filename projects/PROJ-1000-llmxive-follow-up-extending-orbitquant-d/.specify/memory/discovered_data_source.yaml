access_python: "import os, ssl, urllib.request, zipfile, json\nfrom pycocotools.coco\
  \ import COCO\n\nurl = \"https://images.cocodataset.org/annotations/annotations_trainval2017.zip\"\
  \nzip_path = \"/tmp/coco_ann.zip\"\nif not os.path.exists(zip_path):\n    ctx =\
  \ ssl.create_default_context()\n    ctx.check_hostname = False\n    ctx.verify_mode\
  \ = ssl.CERT_NONE\n    with urllib.request.urlopen(url, context=ctx) as resp, open(zip_path,\
  \ \"wb\") as out:\n        out.write(resp.read())\n\nwith zipfile.ZipFile(zip_path,\
  \ \"r\") as z:\n    ann_file = next(f for f in z.namelist() if f.endswith(\"instances_val2017.json\"\
  ))\n    extract_dir = \"/tmp\"\n    z.extract(ann_file, extract_dir)\n    ann_path\
  \ = os.path.join(extract_dir, ann_file)\n\ncoco = COCO(ann_path)\nimg_ids = coco.getImgIds()\n\
  print(f\"RECORDS={len(img_ids)}\")\n\nif img_ids:\n    sample = coco.loadImgs(img_ids[0])[0]\n\
  \    fields = \",\".join(sample.keys())\n    print(f\"FIELDS={fields}\")"
