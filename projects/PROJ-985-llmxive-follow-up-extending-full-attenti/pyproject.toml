[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive"
version = "0.1.0"
description = "LLM-Xive: Automated Science Pipeline for Attention Sparsification"
requires-python = ">=3.10"
dependencies = [
    "transformers",
    "torch",
    "datasets",
    "scikit-learn",
    "spacy",
    "kenlm",
    "numpy",
    "pandas",
    "bitsandbytes",
    "ruff",
    "black",
    "pytest",
    "h5py",
    "tracemalloc",
]

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["code", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["lib", "data", "models", "evaluation", "tests"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.setuptools]
packages = ["lib", "data", "models", "evaluation", "tests"]
package-dir = {"" = "code"}