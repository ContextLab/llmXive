# Ruff configuration for PROJ-212
# Extends pyproject.toml settings if needed, or standalone if pyproject.toml is not used by the runner
# This file ensures ruff is explicitly configured for the project root

select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
    "UP", # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex (handled by manual review or specific thresholds)
]

target-version = "py311"
line-length = 88

[isort]
known-first-party = ["src", "data_models", "loader", "simulation", "stats", "topology", "utils", "validators", "viz", "main", "config"]
force-sort-within-sections = true

[per-file-ignores]
"tests/*" = ["S101", "D100", "D103"] # Allow asserts in tests, skip docstring requirements
"code/__init__.py" = ["F401"]
