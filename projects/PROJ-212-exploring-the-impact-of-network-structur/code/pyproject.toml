[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-network-synchronization"
version = "0.1.0"
description = "Exploring the impact of network structure on synchronization in complex physical systems"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "datasets>=2.14",
    "pyyaml>=6.0",
    "seaborn>=0.13",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
# Ruff configuration is in .ruff.toml, this block ensures integration if needed
line-length = 88
target-version = "py311"
