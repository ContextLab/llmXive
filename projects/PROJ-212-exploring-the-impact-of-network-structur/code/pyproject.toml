[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-network-synchronization"
version = "0.1.0"
description = "Exploring the impact of network structure on synchronization in complex physical systems"
requires-python = ">=3.11"
dependencies = [
    "networkx",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "datasets",
    "pyyaml",
    "seaborn",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.isort]
known-first-party = ["data_models", "loader", "simulation", "stats", "topology", "utils", "validators", "config", "verify_snap"]
known-third-party = ["numpy", "pandas", "networkx", "scipy", "sklearn", "matplotlib", "yaml", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
