$schema: "http://json-schema.org/draft-07/schema#"
title: "SimulationResult"
description: "Schema for the output of a single Kuramoto simulation run."
type: "object"
properties:
  network_id:
    type: "string"
    description: "Unique identifier for the input network graph."
  coupling_strength_threshold:
    type: ["number", "null"]
    description: "Minimum K where r(t) > 0.8 for t > 100. Null if disconnected."
    minimum: 0
  integration_time:
    type: "number"
    description: "Total simulation duration in time units."
    minimum: 0
  step_size:
    type: "number"
    description: "Average step size used by RK45 integrator."
    minimum: 0
  order_parameter_final:
    type: "number"
    description: "Final value of the synchronization order parameter r(t)."
    minimum: 0
    maximum: 1
  status:
    type: "string"
    enum:
      - "synchronized"
      - "failed"
      - "disconnected"
    description: "Outcome status of the simulation."
  warning:
    type: ["string", "null"]
    description: "Optional warning if N < 200 or other issues."
required:
  - "network_id"
  - "coupling_strength_threshold"
  - "integration_time"
  - "step_size"
  - "order_parameter_final"
  - "status"
additionalProperties: false