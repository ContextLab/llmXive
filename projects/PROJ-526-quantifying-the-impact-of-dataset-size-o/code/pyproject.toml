[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantifying-dataset-impact"
version = "0.1.0"
description = "Quantifying the Impact of Dataset Size on ML Accuracy for Material Properties"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pymatgen",
    "matminer",
    "scikit-learn",
    "pandas",
    "numpy",
    "requests",
    "huggingface_hub",
    "pyarrow"
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "contract: marks tests as contract tests"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*", "tests*"]
