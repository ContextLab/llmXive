T101:
  c: false
  h: 72401424412e33e3f5e29d727c70cf1d5565bdc2bcc59917704fc583d3455e60
  r: "The code, CSV, PNG, and test all exist with the right schema, but the underlying\
    \ `baseline_test_predictions.csv` is degenerate/fabricated: `predicted_value`\
    \ exactly equals `experimental_value` for every logP row, and solubility/boiling_point\
    \ are all 0.0 for both columns \u2014 so the resulting `baseline_metrics.csv`\
    \ reports MAE=RMSE=0.0 for all three properties, which is a meaningless placeholder\
    \ rather than a genuine baseline evaluation (FR-005 baseline side). Additionally,\
    \ `tests/unit/test_baseline_metrics.py` skips entirely if the predictions file\
    \ is absent and ignores its `tmp_path`/`monkeypatc"
  sig: 66db6176a1132a52dd4388c45d7f53d6cef7687c0d39978a5a6c6c5af5b6dd22
T103:
  c: false
  h: 7f7c3b0caac28233cb763752f8fd2736a2e20f93127a4a4b618e72b08e45944d
  r: "The required output `data/derived/deviation_contexts.csv` is MISSING (as is\
    \ `data/derived/test_set.csv`), so there is no evidence the `--map-bits` command\
    \ was ever run or that the unit test passed. Additionally, the implementation's\
    \ mapping logic is substantively wrong: it builds `rule_lookup = {idx: rules[idx]\
    \ ...}` positionally, so only the first 5 bit indices get a SMARTS rule and all\
    \ higher bits are labeled `uninterpretable` regardless of whether they are MACCS\
    \ or hashed ECFP4/FP2 bits \u2014 it never actually matches each top-K bit's SMARTS\
    \ against molecules via `GetSubstructMatches` or resolv"
  sig: feafb4ca7bc1f848be0202f850098dc7265f341cac0f5aaa51e245d79e5c0a4a
