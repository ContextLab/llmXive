$schema: "http://json-schema.org/draft-07/schema#"
title: "Fingerprint Schema"
description: "Schema for intermediate fingerprint data"
type: object
properties:
  smiles:
    type: string
    description: "Isomeric SMILES string"
  maccs:
    type: array
    items:
      type: integer
      enum: [0, 1]
    description: "MACCS fingerprint (standard bit length)"
    minItems: a sufficient number of items
    maxItems: 166
  ecfp4:
    type: array
    items:
      type: integer
      enum: [0, 1]
    description: "ECFP fingerprint (standard dimensionality)"
    minItems: a sufficiently large number of items
    maxItems: 1024
  fp2:
    type: array
    items:
      type: integer
      enum: [0, 1]
    description: "FP* fingerprint (fixed‑length binary vector)"
    minItems: a sufficiently large number of items
    maxItems: 1024
required:
  - smiles
  - maccs
  - ecfp4
  - fp2
