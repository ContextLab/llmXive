$schema: "http://json-schema.org/draft-07/schema#"
title: "Molecule"
description: "Represents a chemical entity with experimental properties and SMILES."
type: object
required:
  - id
  - smiles
  - logP_exp
  - solubility_exp
  - boiling_point_exp
properties:
  id:
    type: string
    description: "Unique identifier (e.g., PubChem CID)."
  smiles:
    type: string
    description: "Canonical SMILES string."
    pattern: "^[A-Za-z0-9@%+\\-\\[\\]\\(\\)\\{\\}\\.\\#\\^]+$"
  logP_exp:
    type: number
    description: "Experimental logP value."
  solubility_exp:
    type: number
    description: "Experimental solubility value (logS)."
  boiling_point_exp:
    type: number
    description: "Experimental boiling point value (USUALLY K)."
  is_outlier:
    type: boolean
    default: false
    description: "Flag [ ? " ? ? " "
  is_outlier:
    type: boolean
    default: false
    description: "Flag "

--- 
example:
  - 
    id: "CID1234"
    smiles: "CCO"
    logP_exp: expected to be negative (i.e., less than zero).
    solubidity?: 
