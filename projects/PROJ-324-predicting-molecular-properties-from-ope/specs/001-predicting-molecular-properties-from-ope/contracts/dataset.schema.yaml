$schema: "http://json-schema.org/draft-07/schema#"
title: "Molecular Dataset Schema"
description: "Schema for raw molecular data downloaded from PubChem. Only experimental property values are permitted."
type: object
properties:
  cid:
    type: integer
    description: "PubChem Compound ID"
  smiles:
    type: string
    description: "Isomeric SMILES string"
  logp:
    type: number
    description: "Experimental logP (must be sourced from experimental measurement)"
    minimum: -10
    maximum: 10
  solubility:
    type: number
    description: "Experimental aqueous solubility (logS) (must be sourced from experimental measurement)"
    minimum: -10
    maximum: 5
  boiling_point:
    type: number
    description: "Experimental boiling point (K) (must be sourced from experimental measurement)"
    minimum: 200
    maximum: 1000
  molecular_weight:
    type: number
    description: "Molecular weight (g/mol)"
    minimum: 10
    maximum: 10000
  property_type:
    type: string
    enum: ["Experimental"]
    description: "Only experimental values are permitted"
  measurement_uncertainty:
    type: ["number", "null"]
    description: "Optional confidence score from PubChem"
    minimum: 0
    maximum: 1
  quantity_of_substance:
    type: ["number", "null"]
    description: "Optional amount of substance, if available"
    minimum: 0
    maximum: 100000
  source:
    type: string
    const: "PubChem"
  confidence:
    type: string
    enum: ["High", "Medium", "Low"]
    description: "Derived confidence based on property_type"
  logp_source:
    type: string
    enum: ["Experimental"]
    description: "Source of logP value; must be \"Experimental\""
  solubility_source:
    type: string
    enum: ["Experimental"]
    description: "Source of solubility value; must be \"Experimental\""
  boiling_point_source:
    type: string
    enum: ["Experimental"]
    description: "Source of boiling point value; must be \"Experimental\""
required:
  - cid
  - smiles
  - logp
  - solubility
  - boiling_point
  - property_type
  - source
  - confidence
  - logp_source
  - solubility_source
  - boiling_point_source
