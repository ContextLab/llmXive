$schema: "http://json-schema.org/draft-07/schema#"
title: "Final Report"
description: "Schema for the final analysis report containing key metrics and conclusions."
type: "object"
required:
  - observed_dipole
  - observed_quadrupole
  - dipole_p_value
  - quadrupole_p_value
  - is_anisotropic
  - n_simulations
  - dataset_version
properties:
  observed_dipole:
    type: "number"
    description: "Observed dipole amplitude (mag)."
  observed_quadrupole:
    type: "number"
    description: "Observed quadrupole amplitude (mag)."
  dipole_p_value:
    type: "number"
    description: "P‑value for the dipole test."
    minimum: 0
    maximum: 1
  quadrupole_p_value:
    type: "number"
    description: "P‑value for the quadrupole test."
    minimum: 0
    maximum: 1
  is_anisotropic:
    type: "boolean"
    description: "True if either p‑value < 0.05."
  n_simulations:
    type: "integer"
    description: "Number of simulations run."
    minimum: 1
  dataset_version:
    type: "string"
    description: "Pantheon+ dataset version identifier."
additionalProperties: false
