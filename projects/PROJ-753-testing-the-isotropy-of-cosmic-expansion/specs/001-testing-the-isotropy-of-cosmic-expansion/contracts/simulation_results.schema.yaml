$schema: "http://json-schema.org/draft-07/schema#"
title: "Simulation Results"
description: "Schema for the null distribution simulation results CSV file."
type: "object"
required:
  - run_id
  - dipole_amp
  - quadrupole_amp
properties:
  run_id:
    type: "integer"
    description: "Simulation iteration number (starting at 1)."
    minimum: 1
  dipole_amp:
    type: "number"
    description: "Dipole amplitude (mag) for this simulation."
  quadrupole_amp:
    type: "number"
    description: "Quadrupole amplitude (mag) for this simulation."
additionalProperties: false
