$schema: "http://json-schema.org/draft-07/schema#"
title: "Pantheon+ Residuals"
description: "Schema for the processed residuals CSV file containing filtered supernova data and calculated residuals."
type: "object"
required:
  - id
  - ra
  - dec
  - z
  - mu_obs
  - mu_err
  - mu_th
  - residual
  - valid
properties:
  id:
    type: "string"
    description: "Supernova identifier."
  ra:
    type: "number"
    description: "Right Ascension (degrees)."
    minimum: 0
    maximum: 360
  dec:
    type: "number"
    description: "Declination (degrees)."
    minimum: -90
    maximum: 90
  z:
    type: "number"
    description: "Redshift."
    minimum: 0
  mu_obs:
    type: "number"
    description: "Observed distance modulus."
  mu_err:
    type: "number"
    description: "Uncertainty on distance modulus."
    minimum: 0
  mu_th:
    type: "number"
    description: "Theoretical distance modulus from flat ΛCDM."
  residual:
    type: "number"
    description: "Residual (μ_obs − μ_th)."
  valid:
    type: "boolean"
    description: "True if the record passed all filters."
additionalProperties: false
