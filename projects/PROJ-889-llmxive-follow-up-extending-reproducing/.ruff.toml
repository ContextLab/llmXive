# Ruff configuration for llmXive project
# Enforces PEP8 and Google style guidelines
[lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort (import sorting)
    "N",  # pep8-naming
]

# Ignore specific rules if necessary (add as project evolves)
ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude specific files or directories
extend-exclude = [
    "data/",
    "__pycache__",
    ".git",
    "*.ipynb",
]

# Line length for PEP8 compliance
line-length = 88

[lint.per-file-ignores]
# Allow specific overrides for test files if needed
"tests/*" = ["N802"]  # Allow test functions to not be CamelCase if desired

[lint.isort]
# Configuration for import sorting (I rules)
known-first-party = ["code", "utils"]
force-single-line = false
lines-after-imports = 2

[lint.pydocstyle]
# Enforce Google style docstrings
convention = "google"