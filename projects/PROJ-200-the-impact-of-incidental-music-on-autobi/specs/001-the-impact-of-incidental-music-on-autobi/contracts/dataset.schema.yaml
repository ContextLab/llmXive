$schema: "http://json-schema.org/draft-07/schema#"
title: "User-Track Pair Analysis Dataset"
description: "Schema for data/processed/user_track_pairs.parquet"
type: object
properties:
  user_id:
    type: string
    description: "Unique user identifier"
  track_id:
    type: string
    description: "Unique track identifier"
  total_listens:
    type: integer
    description: "Total listens for this pair"
    minimum: 3
  adolescent_listens:
    type: integer
    description: "Listens during adolescence"
    minimum: 0
  adolescent_exposure_ratio:
    type: number
    description: "Ratio of adolescent listens to total listens"
    minimum: 0.0
    maximum: 1.0
  logit_ratio:
    type: number
    description: "Logit transformation of adolescent_exposure_ratio"
  mean_vividness:
    type: number
    description: "Average vividness rating (1-7)"
    minimum: 1.0
    maximum: 7.0
  mean_valence:
    type: number
    description: "Average valence rating (1-7)"
    minimum: 1.0
    maximum: 7.0
  track_popularity:
    type: number
    description: "Track popularity score"
  match_threshold_used:
    type: integer
    description: "Levenshtein threshold used"
    enum: [1, 2, 3, 4, 5]
  n_cues:
    type: integer
    description: "Number of memory cues"
    minimum: 1
  global_exposure_proxy:
    type: number
    description: "Population-level proxy for missing birth years"
required:
  - user_id
  - track_id
  - total_listens
  - adolescent_listens
  - adolescent_exposure_ratio
  - logit_ratio
  - mean_vividness
  - mean_valence
  - track_popularity
  - match_threshold_used
  - n_cues
additionalProperties: false
