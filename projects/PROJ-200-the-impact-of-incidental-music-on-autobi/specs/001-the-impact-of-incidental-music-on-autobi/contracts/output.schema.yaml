$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Summary Output"
description: "Schema for data/final/regression_summary.csv"
type: object
properties:
  term:
    type: string
    description: "Variable name (e.g., logit_ratio)"
  estimate:
    type: number
    description: "Coefficient estimate"
  std_error:
    type: number
    description: "Standard error"
  t_value:
    type: number
    description: "t-statistic"
  p_value:
    type: number
    description: "P-value from permutation test"
    minimum: 0.0
    maximum: 1.0
  vif:
    type: number
    description: "Variance Inflation Factor"
    minimum: 1.0
required:
  - term
  - estimate
  - std_error
  - t_value
  - p_value
  - vif
additionalProperties: false
