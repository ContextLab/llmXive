T000:
  c: false
  h: 9d154d6f119db49a48dd25e0862781e5d32eca4eebacaf383d0a4f4f82320b6d
  r: "The repository does not contain a `state.yaml` file (it is listed as MISSING),\
    \ and the `state_manager` implementation creates a default state with top\u2011\
    level keys `metadata` and `files`, not the required `artifact_hashes`, `updated_at`,\
    \ and `config`. Consequently the task\u2019s requirement to initialise `state.yaml`\
    \ with those specific keys is not met."
  sig: 3c62bf41a326d93855653b0711f07f6a7409c551277a182b2b35718e3f51da4f
T001:
  c: false
  h: 1faadebd87fdc53ee6e975f19ff869a373f7e03abaf13f8bec49ffe34e7dad4d
  r: "The `quickstart.md` does contain the required `python -m code.main --demo` command,\
    \ but `requirements.txt` does not pin all dependencies (only `python-levenshtein`\
    \ is version\u2011pinned) and the required test file `tests/unit/test_quickstart.py`\
    \ is missing, so the CI checks cannot be satisfied."
  sig: 4fb951d211e13324ea1bd4a7e914280c880ee681fefd4382286d881d3881b83a
T002:
  c: false
  h: ee2522c8e62455c1ae09bf3930f08110f7a65b79bac69a45b35f95e3db3be803
  r: "The two schema files (`contracts/dataset.schema.yaml` and `contracts/output.schema.yaml`)\
    \ are present and contain plausible JSON\u2011Schema definitions, but there is\
    \ no evidence that `jsonschema` validation was actually run against the generated\
    \ parquet/CSV files nor that all such files passed validation. Provide validation\
    \ logs or test results confirming the schemas successfully validate the produced\
    \ data."
  sig: 013930a9d1254bbe0be7fc959ba7923865f273df87d3f784d29b347c54e4b581
