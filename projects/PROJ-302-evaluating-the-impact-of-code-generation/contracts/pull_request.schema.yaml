# Pull Request Schema
#
# This schema defines the expected columns and data types for the
# Parquet files generated by `code/data_acquisition.py`.  It follows
# the JSON‑Schema draft‑07 specification (compatible with tools that
# validate pandas/pyarrow tables).

$schema: "http://json-schema.org/draft-07/schema#"
title: PullRequest
type: object
additionalProperties: false
required:
  - pr_id
  - repo_owner
  - repo_name
  - repo_id
properties:
  pr_id:
    type: integer
    description: Pull request number within the repository.
  repo_owner:
    type: string
    description: GitHub username or organization that owns the repository.
  repo_name:
    type: string
    description: Repository name.
  repo_id:
    type: string
    description: Full repository identifier in the form "owner/name".
  created_at:
    type: [string, "null"]
    format: date-time
    description: ISO‑8601 timestamp when the PR was opened.
  merged_at:
    type: [string, "null"]
    format: date-time
    description: ISO‑8601 timestamp when the PR was merged (if applicable).
  state:
    type: [string, "null"]
    description: Current state of the PR (e.g., open, closed, merged).
  title:
    type: [string, "null"]
    description: Title of the pull request.
  body:
    type: [string, "null"]
    description: Body/description of the pull request.
  additions:
    type: [integer, "null"]
    description: Number of lines added in the PR.
  deletions:
    type: [integer, "null"]
    description: Number of lines deleted in the PR.
  changed_files:
    type: [integer, "null"]
    description: Number of files changed in the PR.
  author_login:
    type: [string, "null"]
    description: GitHub login of the PR author.
  review_comment_count:
    type: [integer, "null"]
    description: Number of review comments on the PR (populated when a token is available).
  ci_duration_seconds:
    type: [number, "null"]
    description: Average CI build duration for the commit associated with the PR (seconds).