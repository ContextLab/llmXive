$schema: "http://json-schema.org/draft-07/schema#"
title: "PullRequest"
description: "Represents a GitHub PR with metadata and review metrics."
type: object
properties:
  pr_id:
    type: string
    description: "Unique PR identifier (e.g., repo#123)"
  repo_id:
    type: string
    description: "Repository identifier (owner/repo)"
  author_type:
    type: string
    enum:
      - "human"
      - "llm"
    description: "Source of the code"
  generation_source:
    type: string
    enum:
      - "generation-from-scratch"
      - "refactoring"
      - "null"
    description: "Cohort label for LLM snippets"
  created_at:
    type: string
    format: date-time
    description: "PR creation timestamp"
  first_comment_at:
    type: string
    format: date-time
    description: "First reviewer comment timestamp"
  merge_at:
    type: string
    format: date-time
    description: "PR merge timestamp (used for full review latency)"
  review_latency:
    type: number
    description: "Seconds between `created_at` and `merge_at` (full review time)"
  file_size_loc:
    type: integer
    description: "Lines of code"
  complexity_score:
    type: number
    description: "Cyclomatic complexity"
  repo_activity_level:
    type: integer
    description: "Number of PRs in the repository"
  workflow_type:
    type: string
    enum:
      - "ci-enabled"
      - "no-ci"
    description: "Repository CI status"
  semantic_similarity:
    type: number
    minimum: -1
    maximum: 1
    description: "Cosine similarity to original human snippet (optional, exploratory)"
    x-optional: true
  source_code:
    type: string
    description: "Full code diff (human) or generated snippet (LLM)"
required:
  - pr_id
  - repo_id
  - author_type
  - created_at
  - first_comment_at
  - review_latency
  - file_size_loc
  - complexity_score
  - repo_activity_level
  - workflow_type
additionalProperties: false