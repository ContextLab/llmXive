$schema: "http://json-schema.org/draft-07/schema#"
title: "PullRequest"
description: "Represents a GitHub PR with metadata and review metrics."
type: object
properties:
  pr_id:
    type: string
    description: "Unique PR identifier (e.g., repo#123)"
  repo_id:
    type: string
    description: "Repository identifier (e.g., owner/repo)"
  author_type:
    type: string
    enum:
      - "human"
      - "llm"
    description: "Source of the code"
  generation_source:
    type: string
    enum:
      - "generation-from-scratch"
      - "refactoring"
      - "null"
    description: "Source of generation if author_type is llm"
  created_at:
    type: string
    format: date-time
    description: "PR creation timestamp"
  first_comment_at:
    type: string
    format: date-time
    description: "First reviewer comment timestamp"
  review_latency:
    type: number
    description: "Duration (seconds) from created_at to first_comment_at"
  file_size:
    type: integer
    description: "Lines of code (LOC)"
  complexity_score:
    type: number
    description: "Cyclomatic complexity"
  workflow_type:
    type: string
    enum:
      - "ci-enabled"
      - "no-ci"
    description: "Repository workflow type"
  semantic_similarity:
    type: number
    minimum: -1
    maximum: 1
    description: "Cosine similarity to human original (Optional, Exploratory)"
    x-optional: true
required:
  - pr_id
  - repo_id
  - author_type
  - created_at
  - first_comment_at
  - review_latency
  - file_size
  - complexity_score
  - workflow_type
additionalProperties: false