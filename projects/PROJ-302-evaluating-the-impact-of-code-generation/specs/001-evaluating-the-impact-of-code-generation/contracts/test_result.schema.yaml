$schema: "http://json-schema.org/draft-07/schema#"
title: "TestResult"
type: object
properties:
  test_name:
    type: string
    description: "Name of the statistical test performed"
  p_value:
    type: number
    description: "P‑value of the test"
  effect_size:
    type: number
    description: "Effect size metric (Cohen's d or rank‑biserial)"
  passed:
    type: boolean
    description: "Whether the test met the significance threshold"
required:
  - test_name
  - p_value
  - effect_size
  - passed
additionalProperties: false