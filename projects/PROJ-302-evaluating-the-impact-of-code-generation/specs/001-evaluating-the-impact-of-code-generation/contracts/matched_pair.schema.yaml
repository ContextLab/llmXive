$schema: "http://json-schema.org/draft-07/schema#"
title: "MatchedPair"
type: object
properties:
  pair_id:
    type: string
    description: "Unique identifier for the matched pair"
  human_pr_ref:
    type: string
    description: "pr_id of the human PR"
  llm_pr_ref:
    type: string
    description: "pr_id of the LLM PR (prompt‑only or context‑based)"
  complexity_diff:
    type: number
    description: "Human complexity minus LLM complexity"
  size_diff:
    type: number
    description: "Human LOC minus LLM LOC"
  activity_diff:
    type: number
    description: "Human repo activity level minus LLM repo activity level"
  ci_build_diff:
    type: number
    description: "Human CI build time minus LLM CI build time"
  semantic_similarity_diff:
    type: number
    description: "Human semantic similarity minus LLM semantic similarity"
  balance_verified:
    type: boolean
    description: "True if this pair satisfied covariate balance criteria"
required:
  - pair_id
  - human_pr_ref
  - llm_pr_ref
  - complexity_diff
  - size_diff
  - activity_diff
  - ci_build_diff
  - semantic_similarity_diff
  - balance_verified
additionalProperties: false