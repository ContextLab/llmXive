$schema: "http://json-schema.org/draft-07/schema#"
title: "MatchedPair"
type: object
properties:
  pair_id:
    type: string
    description: "Unique identifier for the matched pair"
  human_pr_ref:
    type: string
    description: "Reference to the human PR"
  llm_pr_ref:
    type: string
    description: "Reference to the LLM‑generated PR"
  complexity_diff:
    type: number
    description: "Difference in cyclomatic complexity (human – LLM)"
  size_diff:
    type: number
    description: "Difference in LOC (human – LLM)"
  activity_diff:
    type: number
    description: "Difference in repository activity level"
  balance_verified:
    type: boolean
    description: "Indicates whether the pair meets the covariate balance criteria"
required:
  - pair_id
  - human_pr_ref
  - llm_pr_ref
  - complexity_diff
  - size_diff
  - activity_diff
  - balance_verified
additionalProperties: false