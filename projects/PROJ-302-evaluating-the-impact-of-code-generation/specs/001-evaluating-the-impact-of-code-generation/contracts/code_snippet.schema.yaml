$schema: "http://json-schema.org/draft-07/schema#"
title: "CodeSnippet"
description: "Represents a code artifact (human-written, classified by style)."
type: object
properties:
  snippet_id:
    type: string
    description: "Unique snippet identifier"
  source_commit:
    type: string
    description: "Original commit hash"
  generation_source:
    type: string
    enum:
      - "human"
      - "llm"
    description: "Generation source"
  code_content:
    type: string
    description: "Code text"
  complexity_metrics:
    type: object
    properties:
      cyclomatic:
        type: number
        description: "Cyclomatic complexity"
      lines:
        type: integer
        description: "Lines of code"
    required:
      - cyclomatic
      - lines
  is_valid_syntax:
    type: boolean
    description: "True if AST parsing succeeds"
  model_version:
    type: string
    description: "Model version used for generation"
required:
  - snippet_id
  - source_commit
  - generation_source
  - code_content
  - complexity_metrics
  - is_valid_syntax
  - model_version
additionalProperties: false