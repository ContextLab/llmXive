$schema: "http://json-schema.org/draft-07/schema#"
title: "CodeSnippet"
description: "Represents a code artifact (human or LLM generated)."
type: object
properties:
  snippet_id:
    type: string
    description: "Unique snippet identifier"
  pr_id:
    type: string
    description: "Associated PullRequest identifier"
  generation_source:
    type: string
    enum:
      - "human"
      - "llm"
    description: "Origin of the snippet"
  code_content:
    type: string
    description: "Raw code text"
  complexity_metrics:
    type: object
    properties:
      cyclomatic:
        type: number
        description: "Cyclomatic complexity"
      lines:
        type: number
        description: "Lines of code (LOC)"
    required:
      - cyclomatic
      - lines
  is_valid_syntax:
    type: boolean
    description: "True if AST parsing succeeded"
  model_version:
    type: string
    description: "Version of the LLM model"
  generation_params:
    type: object
    description: "Parameters such as temperature, max_tokens, intent_prompt"
    additionalProperties: true
required:
  - snippet_id
  - pr_id
  - generation_source
  - code_content
  - complexity_metrics
  - is_valid_syntax
  - model_version
additionalProperties: false