$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Evaluation Output Schema"
description: "Schema for validating model evaluation artifacts including metrics, SHAP values, and permutation test results."

type: object
required:
  - model_name
  - model_type
  - metrics
  - feature_importance
  - shap_summary
  - permutation_test
  - hyperparameters
  - timestamp

properties:
  model_name:
    type: string
    description: "Unique identifier for the model instance"
    pattern: "^[a-zA-Z0-9_-]+$"
    
  model_type:
    type: string
    description: "Type of model trained"
    enum:
      - "GAM"
      - "LinearRegression"
      - "RandomForest"
      - "XGBoost"
      
  metrics:
    type: object
    required:
      - r2
      - rmse
      - mae
      - cv_scores
    properties:
      r2:
        type: number
        minimum: -1
        description: "Coefficient of determination"
      rmse:
        type: number
        minimum: 0
        description: "Root Mean Squared Error"
      mae:
        type: number
        minimum: 0
        description: "Mean Absolute Error"
      cv_scores:
        type: array
        items:
          type: number
        description: "Cross-validation scores for each fold"
      cv_mean:
        type: number
        description: "Mean of cross-validation scores"
      cv_std:
        type: number
        description: "Standard deviation of cross-validation scores"
        
  feature_importance:
    type: array
    description: "List of features ranked by importance"
    items:
      type: object
      required:
        - feature_name
        - importance_score
      properties:
        feature_name:
          type: string
        importance_score:
          type: number
        rank:
          type: integer
          minimum: 1
          
  shap_summary:
    type: object
    required:
      - mean_abs_shap
      - top_features
    properties:
      mean_abs_shap:
        type: object
        additionalProperties:
          type: number
        description: "Mean absolute SHAP values per feature"
      top_features:
        type: array
        items:
          type: string
        description: "List of top 10 features by mean absolute SHAP"
      plot_path:
        type: string
        pattern: "^data/results/shap_summary_plots/.*\\.png$"
        description: "Path to the saved SHAP summary plot"
        
  permutation_test:
    type: object
    required:
      - interaction_terms
      - p_values
      - is_significant
    properties:
      interaction_terms:
        type: array
        items:
          type: string
        description: "List of interaction terms tested"
      p_values:
        type: object
        additionalProperties:
          type: number
          minimum: 0
          maximum: 1
        description: "P-values for each interaction term"
      is_significant:
        type: object
        additionalProperties:
          type: boolean
        description: "Whether each term passed significance (alpha=0.05)"
      fdr_corrected:
        type: boolean
        description: "Whether Benjamini-Hochberg correction was applied"
        
  hyperparameters:
    type: object
    description: "Final hyperparameters used for the model"
    additionalProperties: true
    
  training_config:
    type: object
    required:
      - cv_folds
      - random_seed
      - cv_strategy
    properties:
      cv_folds:
        type: integer
        minimum: 2
      random_seed:
        type: integer
      cv_strategy:
        type: string
        enum:
          - "KFold"
          - "RepeatedKFold"
          
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of when the model was evaluated"
    
  data_checksum:
    type: string
    pattern: "^[a-f0-9]{64}$"
    description: "SHA256 checksum of the input dataset used"
    
  version:
    type: string
    default: "1.0.0"
    description: "Schema version"
