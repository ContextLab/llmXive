# Dataset Schema for Steel Yield Strength Prediction
# Validates the output of the ingestion pipeline (US1)
type: object
required:
  - composition_columns
  - thermal_columns
  - target_column
  - derived_columns
properties:
  composition_columns:
    type: array
    description: List of elemental composition column names (percentage or fraction)
    items:
      type: string
    minItems: 1
    example: ["Carbon", "Manganese", "Chromium", "Nickel", "Silicon", "Sulfur", "Phosphorus"]
  
  thermal_columns:
    type: array
    description: List of normalized thermal parameter column names
    items:
      type: string
    minItems: 1
    example: ["Normalized_Austenitizing_Temp", "Normalized_Cooling_Rate", "Normalized_Holding_Time"]
  
  target_column:
    type: string
    description: Name of the target variable column
    const: "Yield_Strength_MPa"
  
  derived_columns:
    type: array
    description: List of derived feature column names (ratios, interactions, orthogonalized terms)
    items:
      type: string
    minItems: 1
    example: ["C_Mn_Ratio", "Cr_Ni_Ratio", "CoolingRate_x_HoldingTime", "C_x_CoolingRate", "Ortho_CoolingRate_x_HoldingTime"]
  
  one_hot_columns:
    type: array
    description: List of one-hot encoded heat treatment type columns
    items:
      type: string
    minItems: 0
    example: ["HT_Air_Cooled", "HT_Oil_Quenched", "HT_Furnace_Cooled"]
  
  metadata:
    type: object
    description: Optional metadata about the dataset
    properties:
      source:
        type: string
      row_count:
        type: integer
        minimum: 0
      column_count:
        type: integer
        minimum: 0
      missing_target_count:
        type: integer
        minimum: 0
additionalProperties: true
