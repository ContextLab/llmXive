$schema: "http://json-schema.org/draft-07/schema#"
type: object
required:
  - record_id
  - alloy_designation
  - composition
  - ph
  - temperature_celsius
  - corrosion_potential_mV
properties:
  record_id:
    type: string
  alloy_designation:
    type: string
  composition:
    type: object
    additionalProperties:
      type: number
  ph:
    type: number
  temperature_celsius:
    type: number
  corrosion_potential_mV:
    type: number
additionalProperties: false
