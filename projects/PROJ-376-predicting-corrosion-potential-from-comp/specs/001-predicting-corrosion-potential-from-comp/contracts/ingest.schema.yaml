$schema: "http://json-schema.org/draft-2020-12/schema"
title: IngestRecord
description: Schema for raw records ingested from the NIST corrosion database (and optional Materials Project augmentation).
type: object
additionalProperties: false
required:
  - record_id
  - specific_alloy_designation
  - composition
  - ph
  - temperature_celsius
  - electrolyte_type
  - corrosion_potential_mV
properties:
  record_id:
    type: string
    description: Unique identifier for the record (e.g., NIST accession number).
  specific_alloy_designation:
    type: string
    description: Human‑readable alloy designation (e.g., "SS304").
  composition:
    type: object
    description: Mapping of element symbols to weight fractions. All fractions should be non‑negative and sum to 1.0.
    additionalProperties: false
    patternProperties:
      "^[A-Za-z]+$":
        type: number
        minimum: 0
  ph:
    type: number
    description: Measured pH of the test environment.
    minimum: 0
    maximum: 14
  temperature_celsius:
    type: number
    description: Test temperature in degrees Celsius.
  electrolyte_type:
    type: string
    description: Categorical description of the electrolyte (e.g., "saline", "acidic").
  corrosion_potential_mV:
    type: number
    description: Measured corrosion potential versus SHE, expressed in millivolts.