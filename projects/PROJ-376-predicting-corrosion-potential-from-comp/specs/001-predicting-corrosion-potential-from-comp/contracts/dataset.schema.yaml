$schema: "http://json-schema.org/draft-07/schema#"
title: "DatasetSchema"
description: "Schema for the processed and validated dataset used for training."
type: "object"
properties:
  train_set:
    type: "array"
    description: "Training data rows."
    items:
      $ref: "#/definitions/RowSchema"
  test_set:
    type: "array"
    description: "Test data rows (held-out alloys)."
    items:
      $ref: "#/definitions/RowSchema"
  metadata:
    type: "object"
    properties:
      total_records:
        type: "integer"
      unique_alloys_train:
        type: "integer"
      unique_alloys_test:
        type: "integer"
      split_strategy:
        type: "string"
        enum:
          - "Leave-One-Specific-Alloy-Out"
          - "GroupKFold-5"
      clr_transformed:
        type: "boolean"
        const: true
required:
  - "train_set"
  - "test_set"
  - "metadata"
definitions:
  RowSchema:
    type: "object"
    properties:
      record_id:
        type: "string"
      specific_alloy_designation:
        type: "string"
      Fe_clr:
        type: "number"
      Cr_clr:
        type: "number"
      Ni_clr:
        type: "number"
      # Additional elements as needed (CLR transformed)
      ph:
        type: "number"
        minimum: 0.0
        maximum: 14.0
      temperature_celsius:
        type: "number"
      electrolyte_type:
        type: "string"
      corrosion_potential_mV:
        type: "number"
    required:
      - "record_id"
      - "specific_alloy_designation"
      - "Fe_clr"
      - "Cr_clr"
      - "Ni_clr"
      - "ph"
      - "temperature_celsius"
      - "corrosion_potential_mV"
    additionalProperties: false