$schema: "http://json-schema.org/draft-07/schema#"
type: object
required:
  - record_id
  - alloy_designation
  - ph
  - temperature_celsius
  - corrosion_potential_mV
  - composition_clr
  - electrolyte_type_onehot
properties:
  record_id:
    type: string
  alloy_designation:
    type: string
  ph:
    type: number
  temperature_celsius:
    type: number
  corrosion_potential_mV:
    type: number
  composition_clr:
    type: array
    items:
      type: number
  electrolyte_type_onehot:
    type: array
    items:
      type: number
additionalProperties: false