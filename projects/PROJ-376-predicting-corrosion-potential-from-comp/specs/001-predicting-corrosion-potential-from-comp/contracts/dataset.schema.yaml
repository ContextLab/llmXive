$schema: "http://json-schema.org/draft-07/schema#"
title: "Processed Corrosion Dataset Schema"
description: "Schema for the preprocessed dataset used for model training and evaluation, ensuring compositional transformations and environmental metadata are present (FR-003, FR-013, FR-020)."
type: "object"
required:
  - "specific_alloy_designation"
  - "ph"
  - "temperature_celsius"
  - "corrosion_potential_mV"
properties:
  specific_alloy_designation:
    type: "string"
    description: "The unique alloy grade used for Group Split (LOSO) to prevent data leakage (FR-004, FR-012)."
  ph:
    type: "number"
    minimum: 0.0
    maximum: 14.0
    description: "The aqueous pH of the environment; values outside 0-14 are excluded from primary analysis (FR-016)."
  temperature_celsius:
    type: "number"
    description: "The environmental temperature in degrees Celsius."
  corrosion_potential_mV:
    type: "number"
    description: "The target variable: corrosion potential measured in millivolts (mV) vs SHE."
  electrolyte_type:
    type: "string"
    description: "The categorical type of the electrolyte used in the measurement."
additionalProperties: true # Allows for CLR-transformed elemental weight fractions (e.g., clr_Fe, clr_Cr) as per FR-020.