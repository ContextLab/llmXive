$schema: "http://json-schema.org/draft-07/schema#"
title: Model Results Schema
description: Schema for the model results artifact generated by T024.
type: object
required:
  - models
  - null_baseline
  - learnability
  - astm_comparison
  - metadata
properties:
  models:
    type: object
    description: Metrics for each trained model.
    required:
      - random_forest
      - gradient_boosting
    properties:
      random_forest:
        $ref: "#/definitions/model_metrics"
      gradient_boosting:
        $ref: "#/definitions/model_metrics"
  null_baseline:
    type: object
    description: Metrics for the mean prediction baseline.
    required:
      - mean_prediction_r2
      - mean_prediction_rmse
      - mean_prediction_rmse_unit
    properties:
      mean_prediction_r2:
        type: number
      mean_prediction_rmse:
        type: number
      mean_prediction_rmse_unit:
        type: string
        enum: ["mV"]
  learnability:
    type: object
    description: Classification of whether the problem is learnable.
    required:
      - best_model
      - best_model_r2
      - is_learnable
      - p_value
      - method
    properties:
      best_model:
        type: string
      best_model_r2:
        type: number
      is_learnable:
        type: boolean
      p_value:
        type: number
      method:
        type: string
        enum: ["permutation_test_on_aggregated_predictions"]
  astm_comparison:
    type: object
    description: Comparison against ASTM G59 tolerance.
    required:
      - tolerance_value
      - tolerance_unit
      - tolerance_source
      - best_model_rmse
      - within_tolerance
      - report
    properties:
      tolerance_value:
        type: number
      tolerance_unit:
        type: string
        enum: ["mV"]
      tolerance_source:
        type: string
      best_model_rmse:
        type: number
      within_tolerance:
        type: boolean
      report:
        type: string
  metadata:
    type: object
    description: Pipeline execution metadata.
    required:
      - dataset_size
      - train_test_split
      - random_seed
      - timestamp
      - pipeline_version
    properties:
      dataset_size:
        type: integer
      train_test_split:
        type: string
      random_seed:
        type: integer
      timestamp:
        type: string
        format: date-time
      pipeline_version:
        type: string
definitions:
  model_metrics:
    type: object
    required:
      - r2
      - rmse
      - rmse_unit
      - feature_importance
    properties:
      r2:
        type: number
      rmse:
        type: number
      rmse_unit:
        type: string
        enum: ["mV"]
      feature_importance:
        type: object
        additionalProperties:
          type: number