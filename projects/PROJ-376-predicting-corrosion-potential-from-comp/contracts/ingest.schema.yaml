# Schema for raw data ingestion from NIST-IR-8200
# Based on AlloyRecord definition in data-model.md
type: object
required:
  - alloy_id
  - composition
  - specific_alloy_designation
properties:
  alloy_id:
    type: string
    description: Unique identifier for the alloy record
  composition:
    type: object
    description: Dictionary of chemical composition (element: weight_fraction)
    additionalProperties:
      type: number
      minimum: 0.0
      maximum: 1.0
  specific_alloy_designation:
    type: string
    description: Specific alloy grade or designation (e.g., "304L", "Inconel 625")
  source:
    type: string
    description: Source identifier (e.g., "NIST-IR-8200")
  record_date:
    type: string
    format: date-time
    description: Timestamp of record creation or ingestion
additionalProperties: true
