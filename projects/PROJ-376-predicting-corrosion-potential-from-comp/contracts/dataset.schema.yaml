# Schema for processed corrosion dataset
# Includes AlloyRecord, EnvironmentRecord, and CorrosionMeasurement fields
type: object
required:
  - record_id
  - alloy_id
  - specific_alloy_designation
  - composition
  - ph
  - temperature
  - electrolyte_type
  - potential_mV
properties:
  record_id:
    type: string
    description: Unique identifier for the measurement record
  alloy_id:
    type: string
    description: Unique identifier for the alloy
  specific_alloy_designation:
    type: string
    description: Specific alloy grade or designation
  composition:
    type: object
    description: Dictionary of chemical composition (element: weight_fraction)
    additionalProperties:
      type: number
      minimum: 0.0
      maximum: 1.0
  ph:
    type: number
    description: pH of the environment
  temperature:
    type: number
    description: Temperature in Celsius
  electrolyte_type:
    type: string
    description: Type of electrolyte (e.g., "NaCl", "H2SO4")
  potential_mV:
    type: number
    description: Corrosion potential in millivolts
  source:
    type: string
    description: Source identifier
  processed_at:
    type: string
    format: date-time
    description: Timestamp of data processing
additionalProperties: true
