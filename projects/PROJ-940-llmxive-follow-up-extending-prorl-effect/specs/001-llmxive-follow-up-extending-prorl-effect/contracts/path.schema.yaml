$schema: "http://json-schema.org/draft-07/schema#"
title: "Recommendation Path Schema"
description: "Schema for a single recommendation path generated by the beam or ProRL method."
type: "object"
properties:
  path_id:
    type: "string"
    description: "Unique hash of the path."
  seed_id:
    type: "string"
    description: "The starting item ID."
  nodes:
    type: "array"
    items:
      type: "string"
    description: "Ordered list of item IDs in the path."
  raw_score:
    type: "number"
    description: "Sum of edge weights before rectification."
  rectified_score:
    type: "number"
    description: "Score after applying SRC and PSA formulas."
  method:
    type: "string"
    enum:
      - "beam"
      - "prorl"
      - "prorl-null"
      - "greedy"
    description: "Method used to generate the score."
  alpha:
    type: "number"
    description: "The alpha value used for PSA (e.g., 0.1 or 0.0)."
required:
  - path_id
  - seed_id
  - nodes
  - raw_score
  - rectified_score
  - method
  - alpha
additionalProperties: false