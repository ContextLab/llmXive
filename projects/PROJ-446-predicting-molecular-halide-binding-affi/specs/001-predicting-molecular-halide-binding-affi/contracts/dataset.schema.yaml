$schema: http://json-schema.org/draft-07/schema#
title: Halide Binding Dataset Schema
description: Schema for the processed halide binding dataset used in the ML pipeline.
type: object
properties:
  host_id:
    type: string
    description: "Unique identifier for the host molecule"
  smiles:
    type: string
    description: "Canonical SMILES string of the host"
  halide_identity:
    type: string
    enum:
      - "F-"
      - "Cl-"
      - "Br-"
      - "I-"
    description: "Identity of the bound halide ion"
  binding_constant:
    type: number
    description: "Experimental or simulated binding constant (log K or ΔG)"
  solvent:
    type: string
    enum:
      - "acetonitrile"
      - "chloroform"
      - "dichloromethane"
    description: "Solvent used in the measurement"
  charge_density:
    type: number
    description: "Sum of Gasteiger charges on the host molecule"
  cavity_volume:
    type: number
    description: "Molecular volume in Å³ calculated via RDKit"
  source:
    type: string
    enum:
      - "NIST"
      - "PubChem"
      - "Simulated"
    description: "Origin of the data point"
required:
  - host_id
  - smiles
  - halide_identity
  - binding_constant
  - solvent
  - charge_density
  - cavity_volume
  - source
