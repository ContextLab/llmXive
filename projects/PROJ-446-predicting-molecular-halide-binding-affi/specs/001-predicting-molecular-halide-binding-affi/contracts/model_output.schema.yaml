$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: Schema for the aggregated model performance and feature stability results.
type: object
properties:
  run_id:
    type: string
    description: "Unique identifier for the model run"
  model_type:
    type: string
    enum:
      - "random_forest"
      - "gradient_boosting"
    description: "Type of model trained"
  data_mode:
    type: string
    enum:
      - "Real"
      - "Simulated"
    description: "Whether the data was real or simulated"
  metrics:
    type: object
    properties:
      r2_mean:
        type: number
      r2_std:
        type: number
      rmse_mean:
        type: number
      rmse_std:
        type: number
    required:
      - r2_mean
      - r2_std
      - rmse_mean
      - rmse_std
  feature_stability:
    type: array
    items:
      type: object
      properties:
        feature_name:
          type: string
        cv:
          type: number
          description: "Coefficient of variation of feature importance"
        is_stable:
          type: boolean
          description: "True if CV < 0.3"
      required:
        - feature_name
        - cv
        - is_stable
required:
  - run_id
  - model_type
  - data_mode
  - metrics
  - feature_stability
