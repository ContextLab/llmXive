# Dataset schema for halide binding affinity data
type: object
required:
  - host_id
  - smiles
  - halide
  - solvent
  - log_k
  - charge_density
  - cavity_volume
properties:
  host_id:
    type: string
    description: Unique identifier for the host molecule
  smiles:
    type: string
    description: SMILES string representation of the molecule
  halide:
    type: string
    enum:
      - F-
      - Cl-
      - Br-
      - I-
    description: Identity of the halide anion
  solvent:
    type: string
    description: Solvent used in the experiment
  log_k:
    type: number
    description: Binding affinity as log K
  charge_density:
    type: number
    description: Calculated charge density descriptor
  cavity_volume:
    type: number
    description: Calculated cavity volume descriptor
