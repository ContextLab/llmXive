    \ Gasteiger charge sum (`rdPartialCharges.ComputeGasteigerCharges` is never used),\
    \ and `cavity_volume` attempts `rdMolDescriptors.CalcSASA` (an area, not a volume)\
    \ which the execution log shows fails (\"has no attribute 'CalcSASA'\"), so it\
    \ silently returns 0.0 \u2014 not the required RDKit molecular volume in \xC5\xB3\
    . Additionally, the unit test is circular: it compares"
