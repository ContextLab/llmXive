  r: "The pipeline script never performs the required web\u2011fetch (no `requests`\
    \ calls, no delay/back\u2011off, no HTML/JSON parsing) and instead reads a pre\u2011\
    made `raw_scrape.json`. It also falls back to simulated data when host count\u202F\
    <\u202F50, violating the \u201Cmust raise on fetch failure, no synthetic fallback\u201D\
    \ rule. The generated CSVs lack the required columns (`halide_identity`, `binding_constant`,\
    \ `source`) and the required test file `code/tests/test_data_ingestion.py` is\
    \ missing. The cleaning logic does not handle duplicate host\u2011halide averaging\
    \ or logging of excluded records."
