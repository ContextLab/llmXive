[flake8]
max-line-length = 120
exclude = .git,__pycache__,data/,results/,state/
ignore = E203, E266, W503
per-file-ignores =
    */__init__.py:F401

[isort]
profile = black
line_length = 120
skip = .git,data,results,state
known_first_party = utils,download_data,generate_code,analyze_metrics,statistical_tests,report_generator,validate_citations,validate_quickstart,artifact_manager,append_sensitivity_comparison,extract_citations,generate_code_gpu,generate_code_llama,initialize_model_availability,merge_sensitivity_metrics,run_gpu_pipeline,run_pipeline,run_pipeline_gate,setup_data_dirs,create_results_dirs
known_third_party = datasets,radon,pytest,transformers,torch,accelerate,safetensors,sklearn,statsmodels,pandas,yaml,jinja2,matplotlib,docker,requests
