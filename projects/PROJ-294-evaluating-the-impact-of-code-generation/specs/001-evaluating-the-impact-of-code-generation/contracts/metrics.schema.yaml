$schema: http://json-schema.org/draft-07/schema#
title: "Metrics Schema"
description: "Schema for data/analysis/metrics.json"
type: "object"
properties:
  task_id:
    type: "string"
    description: "Unique identifier for the HumanEval task"
  model_name:
    type: "string"
    description: "Name of the model used for generation"
  human_complexity:
    type: "number"
    description: "Cyclomatic complexity of the human reference solution"
  model_complexity:
    type: "number"
    description: "Cyclomatic complexity of the generated code"
  human_halstead:
    type: "number"
    description: "Halstead volume of the human reference solution"
  model_halstead:
    type: "number"
    description: "Halstead volume of the generated code"
  mutation_score:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Mutation score (testability proxy) - percentage of mutants killed."
  pass_rate:
    type: "number"
    description: "Pass rate of the generated code on the test suite (0.0 or 1.0)"
  execution_error:
    type: "string"
    nullable: true
    description: "Error message if execution failed, null if successful"
  checksum:
    type: "string"
    description: "SHA256 hash of the generated code snippet"
required:
  - task_id
  - model_name
  - human_complexity
  - model_complexity
  - human_halstead
  - model_halstead
  - mutation_score
  - pass_rate
  - checksum
additionalProperties: false
