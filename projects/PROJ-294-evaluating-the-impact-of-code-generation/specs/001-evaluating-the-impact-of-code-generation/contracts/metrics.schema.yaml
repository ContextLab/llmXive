$schema: "http://json-schema.org/draft-07/schema#"
title: "Code Testability Metrics"
type: "object"
properties:
  task_id:
    type: "string"
    description: "Unique identifier for the task"
  model:
    type: "string"
    description: "Model used to generate the code"
  cyclomatic_complexity:
    type: "number"
    minimum: 0
    description: "Cyclomatic complexity metric"
  static_branch_count:
    type: "integer"
    minimum: 0
    description: "Static branch count from radon"
  dynamic_branch_coverage:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Dynamic branch coverage from coverage.py"
  pass_rate:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Pass rate of the test suite"
  is_valid:
    type: "boolean"
    description: "Whether the code passed the pass_rate filter"
  parse_error:
    type: "boolean"
    description: "Whether radon failed to parse the code"
required:
  - task_id
  - model
  - cyclomatic_complexity
  - static_branch_count
  - dynamic_branch_coverage
  - pass_rate
  - is_valid
  - parse_error
additionalProperties: false