$schema: "http://json-schema.org/draft-07/schema#"
title: "Metrics Record"
description: "Schema for the computed static and dynamic metrics for each code sample. Pass Rate is treated as binary (0 or 1) for McNemar's test."
type: "object"
properties:
  task_id:
    type: "string"
    description: "Unique identifier for the task (e.g., HumanEval/0)."
  model:
    type: "string"
    description: "Name of the model (e.g., 'human', 'Salesforce/codegen-mono')."
  cyclomatic_complexity:
    type: "integer"
    minimum: 0
    description: "Cyclomatic complexity computed by radon."
  halstead_volume:
    type: "number"
    minimum: 0
    description: "Halstead volume."
  branch_coverage_pct:
    type: "number"
    minimum: 0.0
    maximum: 100.0
    description: "Branch coverage percentage (0-100)."
  pass_rate:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Binary pass rate (1.0 if all tests pass, 0.0 otherwise). Treated as binary for statistical tests."
  generated_code:
    type: "string"
    description: "The generated code snippet."
  checksum:
    type: "string"
    pattern: "^[a-f0-9]{64}$"
    description: "SHA256 checksum of the generated code."
required:
  - task_id
  - model
  - cyclomatic_complexity
  - halstead_volume
  - branch_coverage_pct
  - pass_rate
  - generated_code
  - checksum
additionalProperties: false