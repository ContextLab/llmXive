$schema: "http://json-schema.org/draft-07/schema#"
title: "PerovskiteEntry Instrumentation Metadata"
description: >
  Schema for instrumentation metadata associated with perovskite thermal stability
  measurements (TGA). Defines the TGA model, temperature uncertainty, and flags
  indicating whether the uncertainty is explicitly reported or defaulted.
  This schema supports the "Verified Accuracy" requirement by ensuring all
  stability measurements carry quantified uncertainty bounds.
type: object
required:
  - perovskite_id
  - tga_model
  - uncertainty_value
  - uncertainty_unit
  - uncertainty_source
properties:
  perovskite_id:
    type: string
    description: "Unique identifier for the perovskite entry (e.g., formula or database ID)"
    pattern: "^[A-Za-z0-9_.-]+$"
    examples:
      - "CsPbI3"
      - "FAPbI3"
      - "MAPbBr3"

  tga_model:
    type: string
    description: "Manufacturer and model of the Thermogravimetric Analyzer used"
    minLength: 1
    examples:
      - "TA Instruments Q500"
      - "Mettler Toledo TGA/DSC 3+"
      - "Netzsch STA 449 F3"
      - "PerkinElmer TGA 4000"

  uncertainty_value:
    type: number
    description: >
      Numerical value of the temperature uncertainty (e.g., 5.0 for ±5°C).
      Must be positive.
    exclusiveMinimum: 0
    examples:
      - 5.0
      - 10.0

  uncertainty_unit:
    type: string
    description: "Unit of the uncertainty value"
    enum:
      - "Celsius"
      - "Kelvin"
      - "K"
      - "°C"
    default: "Celsius"

  uncertainty_source:
    type: string
    description: >
      Source of the uncertainty value.
      - 'instrument_spec': Value derived from the manufacturer's specification for the specific model.
      - 'reported_value': Value explicitly reported in the source publication or dataset.
      - 'default_bound': Value assigned because no specific uncertainty was provided (e.g., ±10°C default).
    enum:
      - "instrument_spec"
      - "reported_value"
      - "default_bound"

  is_default_uncertainty:
    type: boolean
    description: >
      Flag indicating if the uncertainty is a default fallback (e.g., ±10°C)
      rather than a specific measurement or instrument spec. Used for weighting
      in model training (lower weight for default uncertainty).
    default: false

  notes:
    type: string
    description: "Optional notes regarding the measurement conditions or uncertainty derivation"
    maxLength: 500

additionalProperties: false
