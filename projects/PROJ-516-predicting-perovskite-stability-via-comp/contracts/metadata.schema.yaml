$schema: http://json-schema.org/draft-07/schema#
title: PerovskiteInstrumentationMetadata
description: >
  Schema for instrumentation metadata extracted from TGA source data.
  Adheres to the requirement for specifying the instrument model and precision.
type: object
properties:
  metadata_version:
    type: string
    description: Version of this metadata schema.
    const: "1.0.0"
  generated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of generation.
  entries:
    type: array
    description: List of metadata entries for each perovskite record.
    items:
      type: object
      required:
        - entry_id
        - source_citation
        - tga_model
        - precision
      properties:
        entry_id:
          type: string
          description: Unique identifier for the perovskite entry (matches raw data).
        source_citation:
          type: string
          description: DOI or reference string for the source publication.
        tga_model:
          type: string
          description: Manufacturer and model of the Thermogravimetric Analyzer (e.g., "TA Instruments Q500").
          minLength: 1
        precision:
          type: object
          description: Temperature precision/uncertainty of the measurement.
          required:
            - value
            - unit
          properties:
            value:
              type: number
              description: Numerical value of the uncertainty (e.g., 5.0).
            unit:
              type: string
              description: Unit of the uncertainty (e.g., "°C").
              pattern: "^°C$"
        flags:
          type: object
          description: Optional flags regarding the precision source.
          properties:
            is_default:
              type: boolean
              description: True if the precision is a default assumption (e.g., ±10°C) rather than explicitly stated.
            default_reason:
              type: string
              description: Reason for using the default if is_default is true.
required:
  - metadata_version
  - generated_at
  - entries
