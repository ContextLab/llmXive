$schema: http://json-schema.org/draft-07/schema#
title: PerovskiteEntry Instrumentation Metadata
description: >
  Schema for instrumentation metadata extracted from source data,
  specifically focusing on TGA model and measurement uncertainty.
  Adheres to the requirements of US1 and the feedback from reviewer marie-curie-simulated
  regarding the critical nature of instrument precision.
type: object
required:
  - entry_id
  - source
  - tga_model
  - uncertainty
  - uncertainty_source
properties:
  entry_id:
    type: string
    description: Unique identifier for the perovskite entry (matches source data).
  source:
    type: string
    description: Original data source (e.g., NREL, Materials Project).
  tga_model:
    type: string
    description: Specific model of the Thermogravimetric Analyzer used.
    minLength: 1
  uncertainty:
    type: number
    description: >
      The uncertainty bound (± value) for the TGA temperature measurement (T_d).
      Represents the precision of the instrument or the estimated error margin.
      Unit: degrees Celsius (°C).
    minimum: 0
  uncertainty_source:
    type: string
    enum:
      - explicit
      - default
    description: >
      Indicates whether the uncertainty was explicitly stated in the source
      (explicit) or assigned a default fallback value (default) due to missing info.
  instrument_manufacturer:
    type: string
    description: Optional manufacturer name if available.
  notes:
    type: string
    description: Optional notes regarding the measurement conditions or instrument calibration.
  extracted_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the metadata was extracted.
additionalProperties: false
