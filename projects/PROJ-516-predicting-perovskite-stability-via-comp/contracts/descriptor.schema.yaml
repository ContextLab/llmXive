$schema: http://json-schema.org/draft-07/schema#
title: CompositionalDescriptor
description: >
  Schema for CompositionalDescriptor entities representing computed
  compositional fingerprints for perovskite stability prediction.
  Matches the output of code/feature_engineering.py.
type: object
required:
  - formula
  - T_d
  - atomic_fraction_A
  - atomic_fraction_B
  - atomic_fraction_X
  - weighted_ionic_radius
  - weighted_electronegativity
  - weighted_formation_enthalpy
  - weighted_first_ionization_energy
  - variance_ionic_radius
  - variance_electronegativity
  - variance_formation_enthalpy
  - variance_first_ionization_energy
  - tolerance_factor
  - octahedral_factor
properties:
  formula:
    type: string
    description: "Chemical formula string (e.g., 'CsPbI3')."
    minLength: 1

  T_d:
    type: number
    description: "Thermal decomposition onset temperature in Celsius."
    minimum: -273.15

  atomic_fraction_A:
    type: number
    description: "Atomic fraction of the A-site cation."
    minimum: 0.0
    maximum: 1.0

  atomic_fraction_B:
    type: number
    description: "Atomic fraction of the B-site cation."
    minimum: 0.0
    maximum: 1.0

  atomic_fraction_X:
    type: number
    description: "Atomic fraction of the X-site anion."
    minimum: 0.0
    maximum: 1.0

  weighted_ionic_radius:
    type: number
    description: "Composition-weighted average ionic radius (Angstroms)."

  weighted_electronegativity:
    type: number
    description: "Composition-weighted average electronegativity (Pauling scale)."

  weighted_formation_enthalpy:
    type: number
    description: "Composition-weighted average formation enthalpy (eV/atom)."

  weighted_first_ionization_energy:
    type: number
    description: "Composition-weighted average first ionization energy (eV)."

  variance_ionic_radius:
    type: number
    description: "Variance of ionic radii within the composition."

  variance_electronegativity:
    type: number
    description: "Variance of electronegativities within the composition."

  variance_formation_enthalpy:
    type: number
    description: "Variance of formation enthalpies within the composition."

  variance_first_ionization_energy:
    type: number
    description: "Variance of first ionization energies within the composition."

  tolerance_factor:
    type: number
    description: "Goldschmidt tolerance factor."

  octahedral_factor:
    type: number
    description: "Octahedral factor."

  uncertainty:
    type: number
    description: "Optional uncertainty bound for T_d (Celsius)."
    minimum: 0.0

additionalProperties: false