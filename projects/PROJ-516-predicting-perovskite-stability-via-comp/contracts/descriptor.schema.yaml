$schema: http://json-schema.org/draft-07/schema#
title: CompositionalDescriptor
description: >
  Schema for the CompositionalDescriptor entity representing computed
  chemical and physical features derived from perovskite composition.
  Used to validate the output of feature_engineering.py and downstream
  model inputs.
type: object
required:
  - formula
  - atomic_fraction_A
  - atomic_fraction_B
  - atomic_fraction_X
  - weighted_ionic_radius
  - weighted_electronegativity
  - weighted_formation_enthalpy
  - weighted_first_ionization_energy
  - variance_ionic_radius
  - variance_electronegativity
  - variance_formation_enthalpy
  - variance_first_ionization_energy
properties:
  formula:
    type: string
    description: "The parsed chemical formula (e.g., 'CsPbI3')."
    pattern: "^[A-Za-z0-9]+$"
  
  atomic_fraction_A:
    type: number
    description: "Atomic fraction of the A-site cation."
    minimum: 0.0
    maximum: 1.0
  
  atomic_fraction_B:
    type: number
    description: "Atomic fraction of the B-site cation."
    minimum: 0.0
    maximum: 1.0
  
  atomic_fraction_X:
    type: number
    description: "Atomic fraction of the X-site anion."
    minimum: 0.0
    maximum: 1.0
  
  weighted_ionic_radius:
    type: number
    description: "Composition-weighted average ionic radius (Å)."
  
  weighted_electronegativity:
    type: number
    description: "Composition-weighted average electronegativity (Pauling scale)."
  
  weighted_formation_enthalpy:
    type: number
    description: "Composition-weighted average formation enthalpy (eV/atom)."
  
  weighted_first_ionization_energy:
    type: number
    description: "Composition-weighted average first ionization energy (eV)."
  
  variance_ionic_radius:
    type: number
    description: "Variance of ionic radii across the composition."
    minimum: 0.0
  
  variance_electronegativity:
    type: number
    description: "Variance of electronegativity values across the composition."
    minimum: 0.0
  
  variance_formation_enthalpy:
    type: number
    description: "Variance of formation enthalpy values across the composition."
    minimum: 0.0
  
  variance_first_ionization_energy:
    type: number
    description: "Variance of first ionization energy values across the composition."
    minimum: 0.0
  
  # Optional metadata fields if present in the dataset
  perovskite_family:
    type: string
    description: "Optional classification of the perovskite family."
  
  source_id:
    type: string
    description: "Optional identifier from the source database."
additionalProperties: false