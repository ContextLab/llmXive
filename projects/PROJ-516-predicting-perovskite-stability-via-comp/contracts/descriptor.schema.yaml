$schema: "http://json-schema.org/draft-07/schema#"
title: CompositionalDescriptor
description: |
  Schema for CompositionalDescriptor entities representing
  computed compositional fingerprints for perovskite stability prediction.
  This schema defines the structure for the processed dataset derived from
  raw experimental data and elemental properties.
type: object
required:
  - formula
  - T_d
  - atomic_fraction_A
  - atomic_fraction_B
  - atomic_fraction_X
  - weighted_ionic_radius
  - weighted_electronegativity
  - weighted_formation_enthalpy
  - weighted_first_ionization_energy
  - variance_ionic_radius
  - variance_electronegativity
  - perovskite_family
  - T_d_uncertainty
properties:
  formula:
    type: string
    description: "Normalized chemical formula (e.g., 'CsPbI3')"
    pattern: "^[A-Z][a-z]?[0-9]*([A-Z][a-z]?[0-9]*)*$"

  T_d:
    type: number
    description: "Thermal decomposition temperature (onset) in Celsius"
    minimum: -273.15

  atomic_fraction_A:
    type: number
    description: "Atomic fraction of the A-site cation"
    minimum: 0.0
    maximum: 1.0

  atomic_fraction_B:
    type: number
    description: "Atomic fraction of the B-site cation"
    minimum: 0.0
    maximum: 1.0

  atomic_fraction_X:
    type: number
    description: "Atomic fraction of the X-site anion"
    minimum: 0.0
    maximum: 1.0

  weighted_ionic_radius:
    type: number
    description: "Composition-weighted average ionic radius (Angstroms)"

  weighted_electronegativity:
    type: number
    description: "Composition-weighted average electronegativity (Pauling scale)"

  weighted_formation_enthalpy:
    type: number
    description: "Composition-weighted average formation enthalpy (eV/atom)"

  weighted_first_ionization_energy:
    type: number
    description: "Composition-weighted average first ionization energy (eV)"

  variance_ionic_radius:
    type: number
    description: "Variance of ionic radii across constituent elements"
    minimum: 0.0

  variance_electronegativity:
    type: number
    description: "Variance of electronegativity across constituent elements"
    minimum: 0.0

  perovskite_family:
    type: string
    description: "Classification of the perovskite family"
    enum:
      - lead-halide
      - tin-halide
      - double-perovskite
      - other

  T_d_uncertainty:
    type: number
    description: "Combined standard uncertainty for T_d (±°C), derived from instrument precision and experimental error"
    minimum: 0.0

additionalProperties: false
description: |
  This schema enforces the structure required for the machine learning pipeline.
  It ensures that all necessary compositional fingerprints and uncertainty metrics
  are present before model training (US2) and validation (US3).
  The T_d_uncertainty field is critical for the weighted regression analysis
  mandated by the instrumentation rigor review (Phase 7).