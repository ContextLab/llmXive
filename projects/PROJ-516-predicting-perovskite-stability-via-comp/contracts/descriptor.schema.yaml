$schema: http://json-schema.org/draft-07/schema#
title: CompositionalDescriptor
description: |
  Schema for CompositionalDescriptor entities representing
  computed compositional fingerprints for perovskite stability analysis.
  Defines elemental fractions, weighted averages, and variance metrics
  derived from chemical formulas.
type: object
required:
  - formula
  - atomic_fraction_A
  - atomic_fraction_B
  - atomic_fraction_X
  - weighted_ionic_radius
  - weighted_electronegativity
  - weighted_formation_enthalpy
  - weighted_first_ionization_energy
  - variance_ionic_radius
  - variance_electronegativity
properties:
  formula:
    type: string
    description: "Normalized chemical formula (e.g., 'CsPbI3')"
    pattern: "^[A-Za-z0-9_]+$"
  
  atomic_fraction_A:
    type: number
    description: "Atomic fraction of the A-site cation"
    minimum: 0.0
    maximum: 1.0
  
  atomic_fraction_B:
    type: number
    description: "Atomic fraction of the B-site cation"
    minimum: 0.0
    maximum: 1.0
  
  atomic_fraction_X:
    type: number
    description: "Atomic fraction of the X-site anion"
    minimum: 0.0
    maximum: 1.0
  
  weighted_ionic_radius:
    type: number
    description: "Composition-weighted average ionic radius (Angstroms)"
  
  weighted_electronegativity:
    type: number
    description: "Composition-weighted average electronegativity (Pauling scale)"
  
  weighted_formation_enthalpy:
    type: number
    description: "Composition-weighted average formation enthalpy (eV/atom)"
  
  weighted_first_ionization_energy:
    type: number
    description: "Composition-weighted average first ionization energy (eV)"
  
  variance_ionic_radius:
    type: number
    description: "Variance of ionic radii across the composition"
    minimum: 0.0
  
  variance_electronegativity:
    type: number
    description: "Variance of electronegativity across the composition"
    minimum: 0.0
  
  t_d:
    type: number
    nullable: true
    description: "Thermal decomposition temperature (°C) from TGA, if available"
  
  t_d_uncertainty:
    type: number
    nullable: true
    description: "Uncertainty bound for T_d (±°C), derived from instrument metadata"
  
  perovskite_family:
    type: string
    description: "Classification of perovskite family (e.g., 'halide', 'oxide')"
    enum:
      - halide
      - oxide
      - nitride
      - other
  
  source_id:
    type: string
    description: "Unique identifier from the source database (e.g., NREL ID)"
  
  computed_at:
    type: string
    format: date-time
    description: "ISO 8601 timestamp when descriptors were computed"
  
  checksum:
    type: string
    description: "SHA-256 checksum of the raw input data used for this computation"
additionalProperties: false