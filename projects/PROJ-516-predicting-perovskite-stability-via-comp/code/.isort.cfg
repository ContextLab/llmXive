[settings]
profile=black
line_length=88
skip=.git,__pycache__,.venv,venv,env,build,dist,*.egg-info
known_first_party=utils
known_third_party=pandas,numpy,pymatgen,scikit_learn,sklearn,yaml,requests,urllib3
multi_line_output=3
include_trailing_comma=True
force_grid_wrap=0
use_parentheses=True
ensure_newline_before_comments=True
