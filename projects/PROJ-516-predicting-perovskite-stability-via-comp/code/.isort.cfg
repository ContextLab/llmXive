[settings]
profile=black
line_length=100
known_first_party=utils,data_ingestion_metadata,feature_engineering,filter_descriptors,uncertainty_flagger,verify_descriptors,vif_diagnostic
skip=.git,.hg,.mypy_cache,.tox,.venv,_build,buck-out,build,dist,venv
multi_line_output=3
include_trailing_comma=True
force_grid_wrap=0
use_parentheses=True
ensure_newline_before_comments=True
lines_after_imports=2
