$schema: http://json-schema.org/draft-07/schema#
title: MotifImportance
description: Schema for motif importance scores linking subgraphs to degradation pathways.
type: object
properties:
  motif_id:
    type: string
    description: "Unique motif identifier"
  motif_pattern:
    type: string
    description: "SMILES subgraph pattern"
  pathway:
    type: string
    description: "Associated degradation pathway"
    enum:
      - hydrolysis
      - oxidation
      - photolysis
  importance_score:
    type: number
    description: "Integrated Gradients score"
    minimum: 0.0
    maximum: 1.0
  p_value:
    type: number
    description: "χ² test p-value"
    minimum: 0.0
    maximum: 1.0
  significant:
    type: boolean
    description: "True if p < 0.05"
required:
  - motif_id
  - motif_pattern
  - pathway
  - importance_score
  - p_value
  - significant
additionalProperties: false
