$schema: "http://json-schema.org/draft-07/schema#"
title: "MotifImportance"
description: "Schema for motif importance scores and statistical validation. Uses Null Attribution Test (algorithmic validation) and χ² test (data quality)."
type: "object"
properties:
  motif_pattern:
    type: "string"
    description: "SMILES fragment or subgraph description"
  pathway:
    type: "string"
    description: "Associated degradation pathway (always 'unknown' in feasibility study)"
    enum:
      - "unknown"
  importance_score:
    type: "number"
    description: "Integrated Gradients attribution score (for technical demonstration only)"
  p_value_null:
    type: "number"
    description: "Null Attribution Test p-value (algorithmic validation only)"
    minimum: 0
    maximum: 1
  chi_square_statistic:
    type: "number"
    description: "χ² statistic for motif distribution analysis (data quality)"
  chi_square_p_value:
    type: "number"
    description: "χ² p-value for motif distribution analysis"
    minimum: 0
    maximum: 1
  confidence:
    type: "number"
    description: "Prediction confidence (0-1)"
    minimum: 0
    maximum: 1
required:
  - "motif_pattern"
  - "pathway"
  - "importance_score"
  - "p_value_null"
  - "chi_square_statistic"
  - "chi_square_p_value"
  - "confidence"
additionalProperties: false
