$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  smiles:
    type: string
    description: "SMILES string representing the polymer."
  temperature:
    type: number
    format: float
    description: "Temperature in Celsius."
  ph:
    type: number
    format: float
    description: "pH value."
  uv_exposure:
    type: number
    format: float
    description: "UV exposure level."
  degradation_pathway:
    type: string
    description: "Degradation pathway."
required:
  - smiles
  - temperature
  - ph
  - uv_exposure
  - degradation_pathway
