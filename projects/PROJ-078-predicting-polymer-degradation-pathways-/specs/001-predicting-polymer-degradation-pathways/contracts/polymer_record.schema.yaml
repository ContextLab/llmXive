$schema: "http://json-schema.org/draft-07/schema#"
title: "PolymerRecord"
type: "object"
properties:
  smiles:
    type: "string"
    description: "Canonical SMILES string of the polymer"
  degradation_pathway:
    type: "string"
    description: "Categorical label (always 'unknown' in feasibility study)"
    enum:
      - "unknown"
  temperature:
    type: "number"
    description: "Temperature in Kelvin"
    minimum: 0
  ph:
    type: "number"
    description: "pH value"
    minimum: 0
    maximum: 14
  uv_exposure:
    type: "number"
    description: "Normalized UV exposure level"
    minimum: 0
    maximum: 1
  source:
    type: "string"
    description: "Origin of the record"
  flags:
    type: "array"
    items:
      type: "string"
    description: "List of flags (e.g., missing_pathway, missing_ph, imputed_temp)"
required:
  - smiles
  - degradation_pathway
  - source
additionalProperties: false
