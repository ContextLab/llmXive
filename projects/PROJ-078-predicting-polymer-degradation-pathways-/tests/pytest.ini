[pytest]
# Pin random seed for reproducibility across all test runs
addopts = -v --strict-markers --tb=short -s --seed=42
testpaths = tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_gpu: marks tests that require GPU execution
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
