[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poissons-ratio-aluminum"
version = "0.1.0"
description = "Predicting the Effect of Alloying on the Poisson's Ratio of Aluminum Alloys"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "requests",
    "pyyaml",
    "seaborn",
    "matplotlib",
    "compositional",
    "statsmodels",
    "materialsproject",
    "datasets",
    "periodictable",
    "joblib",
    "pytest",
    "pytest-cov",
    "ruff==0.1.6",
    "black==23.12.1"
]

[tool.ruff]
# Linting configuration for ruff==0.1.6
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in dataclasses)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"cli/*.py" = ["B008"]

[tool.black]
# Formatting configuration for black==23.12.1
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
(
    __pycache__
    | \.venv
    | \.git
    | data
)
'''