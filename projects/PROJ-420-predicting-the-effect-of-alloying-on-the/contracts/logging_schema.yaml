type: object
required:
  - timestamp
  - level
  - message
  - trace_id
  - module
properties:
  timestamp:
    type: string
    description: ISO 8601 timestamp of the log entry
  level:
    type: string
    description: Log level (INFO, DEBUG, WARNING, ERROR, CRITICAL)
  message:
    type: string
    description: Log message content
  trace_id:
    type: string
    description: Unique trace identifier for correlation
  module:
    type: string
    description: Module name where the log originated
