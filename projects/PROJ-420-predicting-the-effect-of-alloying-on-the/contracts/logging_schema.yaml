# Schema for JSON log entries
# This file is generated by T006a and used by T006 for validation
type: object
properties:
  timestamp:
    type: string
    description: ISO 8601 timestamp of the log entry
  level:
    type: string
    enum:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
      - CRITICAL
    description: Log level
  message:
    type: string
    description: The log message
  trace_id:
    type: string
    description: Unique identifier for tracing
  module:
    type: string
    description: Module name that generated the log
required:
  - timestamp
  - level
  - message
  - trace_id
  - module
additionalProperties: false