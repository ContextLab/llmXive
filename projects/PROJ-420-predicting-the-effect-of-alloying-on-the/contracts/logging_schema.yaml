type: object
properties:
  timestamp:
    type: string
    description: ISO 8601 timestamp of the log entry
  level:
    type: string
    enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
    description: Log level
  message:
    type: string
    description: Log message content
  trace_id:
    type: string
    description: Unique identifier for tracing the log entry
  module:
    type: string
    description: Module or component name generating the log
required:
  - timestamp
  - level
  - message
  - trace_id
  - module
