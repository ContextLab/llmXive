$schema: "http://json-schema.org/draft-07/schema#"
title: "AlloyRecord"
description: "Schema for a single aluminum alloy entry after cleaning and filtering."
type: object
required:
  - material_id
  - formula
  - elemental_composition
  - poissons_ratio
  - youngs_modulus_gpa
  - poisson_source
  - measurement_method
  - source
  - is_alloy
  - is_independent_measurement
properties:
  material_id:
    type: string
    description: "Unique identifier from the source database."
  formula:
    type: string
    description: "Chemical formula (e.g., 'Al95Cu5')."
  elemental_composition:
    type: object
    required:
      - Cu
      - Mg
      - Si
      - Zn
      - Mn
      - Al
    properties:
      Cu:
        type: number
        minimum: 0
        maximum: 1
        description: "Atomic fraction of Copper."
      Mg:
        type: number
        minimum: 0
        maximum: 1
        description: "Atomic fraction of Magnesium."
      Si:
        type: number
        minimum: 0
        maximum: 1
        description: "Atomic fraction of Silicon."
      Zn:
        type: number
        minimum: 0
        maximum: 1
        description: "Atomic fraction of Zinc."
      Mn:
        type: number
        minimum: 0
        maximum: 1
        description: "Atomic fraction of Manganese."
      Al:
        type: number
        minimum: 0
        maximum: 1
        description: "Atomic fraction of Aluminum (balance)."
  poissons_ratio:
    type: number
    minimum: 0
    maximum: 0.5
    description: "Poisson's ratio (dimensionless)."
  youngs_modulus_gpa:
    type: number
    exclusiveMinimum: 0
    description: "Young's modulus normalized to GPa."
  poisson_source:
    type: string
    description: "Source of Poisson's ratio measurement."
    enum:
      - "ultrasonic"
      - "direct_measurement"
      - "laser_ultrasonics"
  measurement_method:
    type: string
    description: "Method used to measure Poisson's ratio."
    enum:
      - "Ultrasonic"
      - "Resonant Ultrasound Spectroscopy"
      - "Static Tensile"
      - "Other"
  source:
    type: string
    description: "Original data source."
    enum:
      - "Materials Project"
      - "NIST MDR"
  is_alloy:
    type: boolean
    description: "True if the entry represents a continuous solid solution."
  is_independent_measurement:
    type: boolean
    description: "True if poisson_source is in the allowed set."
additionalProperties: false