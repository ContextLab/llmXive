$schema: "http://json-schema.org/draft-07/schema#"
title: "FeatureImportance"
description: "Schema for back-transformed feature importance scores."
type: "object"
required:
  - "Cu_importance"
  - "Mg_importance"
  - "Si_importance"
  - "Zn_importance"
  - "Mn_importance"
  - "ranked_elements"
properties:
  Cu_importance:
    type: "number"
    description: "Importance score for Copper."
  Mg_importance:
    type: "number"
    description: "Importance score for Magnesium."
  Si_importance:
    type: "number"
    description: "Importance score for Silicon."
  Zn_importance:
    type: "number"
    description: "Importance score for Zinc."
  Mn_importance:
    type: "number"
    description: "Importance score for Manganese."
  ranked_elements:
    type: "array"
    items:
      type: "string"
      enum:
        - "Cu"
        - "Mg"
        - "Si"
        - "Zn"
        - "Mn"
    description: "List of elements ranked by importance (highest to lowest)."
additionalProperties: false