$schema: "http://json-schema.org/draft-07/schema#"
title: "Feature Importance Schema"
description: "Schema for Grouped ILR Importance results. Importance is aggregated from ILR coordinates to rank alloying elements."
type: object
required:
  - element
  - importance_mean
  - importance_std
  - method
properties:
  element:
    type: array
    items:
      type: string
    description: "List of alloying elements (Cu, Mg, Si, Zn, Mn)."
  importance_mean:
    type: array
    items:
      type: number
    description: "Mean Grouped ILR Importance for each element."
  importance_std:
    type: array
    items:
      type: number
    description: "Standard deviation of Grouped ILR Importance."
  method:
    type: string
    const: "Grouped ILR Importance"
    description: "Method used to calculate importance. Must be 'Grouped ILR Importance'."
additionalProperties: false