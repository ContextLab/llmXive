$schema: http://json-schema.org/draft-07/schema#
title: Feature Importance Schema
description: Schema for permutation importance results on ILR features
type: object
required:
  - feature
  - importance_mean
  - importance_std
  - importance_min
  - importance_max
properties:
  feature:
    type: array
    items:
      type: string
    description: List of feature names (ILR transformed)
  importance_mean:
    type: array
    items:
      type: number
    description: Mean permutation importance for each feature
  importance_std:
    type: array
    items:
      type: number
    description: Standard deviation of permutation importance
  importance_min:
    type: array
    items:
      type: number
    description: Minimum permutation importance value
  importance_max:
    type: array
    items:
      type: number
    description: Maximum permutation importance value
additionalProperties: false
