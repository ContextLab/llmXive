$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelOutput"
description: "Schema for the final model performance metrics, feature importance, and diagnostics."
type: "object"
properties:
  cv_mae_mean:
    type: "number"
    minimum: 0
    description: "Mean Absolute Error from Repeated 5-Fold cross-validation."
  cv_mae_ci_lower:
    type: "number"
    minimum: 0
    description: "95% CI Lower Bound."
  cv_mae_ci_upper:
    type: "number"
    minimum: 0
    description: "95% CI Upper Bound."
  n_train:
    type: "integer"
    minimum: 1
    description: "Number of samples in training folds."
  n_test:
    type: "integer"
    minimum: 1
    description: "Number of samples in test folds (per fold)."
  feature_importance:
    type: "object"
    properties:
      Cu:
        type: "number"
        minimum: 0
        description: "Permutation Importance score for Copper."
      Mg:
        type: "number"
        minimum: 0
        description: "Permutation Importance score for Magnesium."
      Si:
        type: "number"
        minimum: 0
        description: "Permutation Importance score for Silicon."
      Zn:
        type: "number"
        minimum: 0
        description: "Permutation Importance score for Zinc."
      Mn:
        type: "number"
        minimum: 0
        description: "Permutation Importance score for Manganese."
    required:
      - Cu
      - Mg
      - Si
      - Zn
      - Mn
    additionalProperties: false
  associational_framing:
    type: "boolean"
    const: true
    description: "Flag indicating results are framed as associational (not causal)."
  vif_scores:
    type: "object"
    description: "Variance Inflation Factors for raw predictors. High values are expected due to closure problem."
    properties:
      Cu:
        type: "number"
        minimum: 1
      Mg:
        type: "number"
        minimum: 1
      Si:
        type: "number"
        minimum: 1
      Zn:
        type: "number"
        minimum: 1
      Mn:
        type: "number"
        minimum: 1
    required:
      - Cu
      - Mg
      - Si
      - Zn
      - Mn

required:
  - cv_mae_mean
  - cv_mae_ci_lower
  - cv_mae_ci_upper
  - n_train
  - n_test
  - feature_importance
  - associational_framing
  - vif_scores
additionalProperties: false