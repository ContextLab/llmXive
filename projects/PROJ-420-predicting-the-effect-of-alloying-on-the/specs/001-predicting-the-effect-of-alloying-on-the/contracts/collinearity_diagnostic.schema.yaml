$schema: "http://json-schema.org/draft-07/schema#"
title: "CollinearityDiagnostic"
description: "Schema for Variance Inflation Factor (VIF) diagnostics on raw predictors. IMPORTANT: VIF MUST be computed on raw atomic fractions, NOT on ILR-transformed features."
type: "object"
required:
  - "Cu_vif"
  - "Mg_vif"
  - "Si_vif"
  - "Zn_vif"
  - "Mn_vif"
  - "max_vif"
  - "is_flagged"
properties:
  Cu_vif:
    type: "number"
    description: "VIF for Copper."
  Mg_vif:
    type: "number"
    description: "VIF for Magnesium."
  Si_vif:
    type: "number"
    description: "VIF for Silicon."
  Zn_vif:
    type: "number"
    description: "VIF for Zinc."
  Mn_vif:
    type: "number"
    description: "VIF for Manganese."
  max_vif:
    type: "number"
    description: "Maximum VIF among all predictors."
  is_flagged:
    type: "boolean"
    description: "True if max_vif > 5, indicating high collinearity."
additionalProperties: false