$schema: "http://json-schema.org/draft-07/schema#"
title: "AlloyRecord"
description: "Schema for a single aluminum alloy record in the processed dataset."
type: "object"
required:
  - "material_id"
  - "formula"
  - "elemental_composition"
  - "poissons_ratio"
  - "youngs_modulus"
  - "measurement_method"
  - "source"
properties:
  material_id:
    type: "string"
    description: "Unique identifier from the source database."
  formula:
    type: "string"
    description: "Chemical formula of the alloy."
  elemental_composition:
    type: "object"
    required:
      - "Cu"
      - "Mg"
      - "Si"
      - "Zn"
      - "Mn"
      - "Al"
    properties:
      Cu:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Atomic fraction of Copper."
      Mg:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Atomic fraction of Magnesium."
      Si:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Atomic fraction of Silicon."
      Zn:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Atomic fraction of Zinc."
      Mn:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Atomic fraction of Manganese."
      Al:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Atomic fraction of Aluminum (calculated balance)."
  poissons_ratio:
    type: "number"
    description: "Poisson's ratio (dimensionless)."
  youngs_modulus:
    type: "number"
    description: "Young's modulus in GPa."
  measurement_method:
    type: "string"
    description: "Method used to measure Poisson's ratio (e.g., 'Ultrasonic')."
  source:
    type: "string"
    enum:
      - "Materials Project"
      - "NIST"
    description: "Source of the data."
