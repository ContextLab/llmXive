$schema: http://json-schema.org/draft-07/schema#
title: AlloyRecord Schema
description: Schema for cleaned and validated aluminum alloy records.
type: object
properties:
  id:
    type: string
    description: Unique identifier for the alloy record.
  source:
    type: string
    description: Source of the data (e.g., 'Materials Project', 'NIST').
  composition:
    type: object
    description: Atomic fractions of alloying elements and Aluminum.
    properties:
      Cu:
        type: number
        minimum: 0
        maximum: 1
      Mg:
        type: number
        minimum: 0
        maximum: 1
      Si:
        type: number
        minimum: 0
        maximum: 1
      Zn:
        type: number
        minimum: 0
        maximum: 1
      Mn:
        type: number
        minimum: 0
        maximum: 1
      Al:
        type: number
        minimum: 0
        maximum: 1
    required:
      - Cu
      - Mg
      - Si
      - Zn
      - Mn
      - Al
  poisson_ratio:
    type: number
    description: Poisson's ratio (dimensionless).
    minimum: 0
  youngs_modulus:
    type: number
    description: Young's modulus in GPa.
    minimum: 0
  measurement_method:
    type: ["string", "null"]
    description: Method used to measure Poisson's ratio.
  row_index:
    type: integer
    description: Original row index in the raw dataset.
required:
  - id
  - source
  - composition
  - poisson_ratio
  - youngs_modulus
  - row_index
additionalProperties: false
