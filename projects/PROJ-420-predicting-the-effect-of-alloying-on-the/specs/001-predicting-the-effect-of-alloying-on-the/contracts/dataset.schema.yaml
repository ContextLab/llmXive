$schema: "http://json-schema.org/draft-07/schema#"
title: "AlloyRecord Schema"
description: "Schema for the cleaned and normalized aluminum alloy dataset."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the alloy record."
  source:
    type: "string"
    enum:
      - "nist"
      - "materials_project"
    description: "Origin of the data."
  composition:
    type: "object"
    properties:
      Cu:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Atomic fraction of Copper."
      Mg:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Atomic fraction of Magnesium."
      Si:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Atomic fraction of Silicon."
      Zn:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Atomic fraction of Zinc."
      Mn:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Atomic fraction of Manganese."
      Al:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Calculated atomic fraction of Aluminum."
    required:
      - "Cu"
      - "Mg"
      - "Si"
      - "Zn"
      - "Mn"
      - "Al"
  properties:
    type: "object"
    properties:
      poissons_ratio:
        type: "number"
        minimum: 0.0
        maximum: 0.5
        description: "Poisson's ratio (dimensionless)."
      youngs_modulus:
        type: "number"
        minimum: 0.0
        description: "Young's modulus in GPa."
    required:
      - "poissons_ratio"
      - "youngs_modulus"
  metadata:
    type: "object"
    properties:
      is_independent_measurement:
        type: "boolean"
        description: "True if Poisson's ratio is from ultrasonic measurement."
      exclusion_reason:
        type: ["string", "null"]
        description: "Reason for exclusion if applicable."
required:
  - "id"
  - "source"
  - "composition"
  - "properties"
  - "metadata"
additionalProperties: false
