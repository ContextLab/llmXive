$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelMetrics"
description: "Schema for model performance metrics."
type: "object"
required:
  - "cv_mae"
  - "test_mae"
  - "n_samples"
  - "train_size"
  - "test_size"
properties:
  cv_mae:
    type: "number"
    description: "Mean Absolute Error from 5-fold cross-validation."
  test_mae:
    type: "number"
    description: "Mean Absolute Error on the held-out test set."
  n_samples:
    type: "integer"
    minimum: 0
    description: "Total number of samples in the dataset."
  train_size:
    type: "integer"
    minimum: 0
    description: "Number of samples in the training set."
  test_size:
    type: "integer"
    minimum: 0
    description: "Number of samples in the test set."
