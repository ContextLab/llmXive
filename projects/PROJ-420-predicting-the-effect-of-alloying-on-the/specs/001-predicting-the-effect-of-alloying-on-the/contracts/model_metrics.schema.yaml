$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelMetrics"
description: "Schema for the evaluation results of the Random Forest model."
type: object
required:
  - cv_mae
  - test_mae
  - feature_importance_cu
  - feature_importance_mg
  - feature_importance_si
  - feature_importance_zn
  - feature_importance_mn
properties:
  cv_mae:
    type: number
    description: "Mean Absolute Error from 5-fold cross-validation"
    minimum: 0
  test_mae:
    type: number
    description: "Mean Absolute Error on the held-out test set"
    minimum: 0
  feature_importance_cu:
    type: number
    description: "Permutation importance score for Copper (in ILR space)"
    minimum: 0
    maximum: 1
  feature_importance_mg:
    type: number
    description: "Permutation importance score for Magnesium (in ILR space)"
    minimum: 0
    maximum: 1
  feature_importance_si:
    type: number
    description: "Permutation importance score for Silicon (in ILR space)"
    minimum: 0
    maximum: 1
  feature_importance_zn:
    type: number
    description: "Permutation importance score for Zinc (in ILR space)"
    minimum: 0
    maximum: 1
  feature_importance_mn:
    type: number
    description: "Permutation importance score for Manganese (in ILR space)"
    minimum: 0
    maximum: 1
  collinearity_flag:
    type: boolean
    description: "True if any VIF > 5 (Diagnostic only)"
additionalProperties: false
