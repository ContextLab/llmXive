$schema: "http://json-schema.org/draft-07/schema#"
title: "BlindSpotsBenchTask"
description: "Schema for a single task record from the filtered Blind-Spots-Bench dataset."
type: object
required:
  - id
  - category
  - prompt
  - constraint
properties:
  id:
    type: string
    description: "Unique identifier for the task."
  category:
    type: string
    description: "Task category."
    enum:
      - "Abstract Reasoning"
      - "Object-Centric"
  prompt:
    type: string
    description: "The full text prompt given to the model."
  constraint:
    type: string
    description: "The explicit constraint string the model must follow."
    minLength: 1
  ground_truth:
    type: ["string", "null"]
    description: "The correct answer to the task."
  metadata:
    type: object
    description: "Additional metadata fields."
    additionalProperties: true
additionalProperties: false
