$schema: http://json-schema.org/draft-07/schema#
title: CoT Trace Schema
description: >
  Defines the structure of a Chain-of-Thought trace generated for a task.
  Includes parsing results and classification labels.
type: object
required:
  - trace_id
  - task_id
  - model_id
  - generated_text
  - parse_result
  - classification
  - metadata
properties:
  trace_id:
    type: string
    description: Unique identifier for this trace generation run.
  task_id:
    type: string
    description: Reference to the original task_id.
  model_id:
    type: string
    description: Identifier of the model used (e.g., "Llama-3-8B-Int4").
  generated_text:
    type: string
    description: The full raw text generated by the model.
  parse_result:
    type: object
    description: Results from the parsing phase (exact and semantic matches).
    required:
      - first_mention
      - last_mention
      - semantic_match_found
    properties:
      first_mention:
        type: object
        description: Details of the first constraint mention found.
        properties:
          offset_start:
            type: integer
            description: Character offset start.
          offset_end:
            type: integer
            description: Character offset end.
          text_snippet:
            type: string
            description: The extracted text snippet.
          match_type:
            type: string
            enum: [exact, semantic, none]
            description: Type of match found.
      last_mention:
        type: object
        description: Details of the last constraint mention found.
        properties:
          offset_start:
            type: integer
            description: Character offset start.
          offset_end:
            type: integer
            description: Character offset end.
          text_snippet:
            type: string
            description: The extracted text snippet.
          match_type:
            type: string
            enum: [exact, semantic, none]
            description: Type of match found.
      semantic_match_found:
        type: boolean
        description: Whether a paraphrased constraint was detected.
      tokens_scanned:
        type: integer
        description: Number of tokens scanned in the temporal window.
  classification:
    type: object
    description: The final error classification result.
    required:
      - label
      - reason
    properties:
      label:
        type: string
        enum: [Perceptual, Procedural, Correct]
        description: The assigned error type.
      reason:
        type: string
        description: Explanation for the classification.
  metadata:
    type: object
    description: Runtime metadata.
    properties:
      generation_timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation.
      duration_seconds:
        type: number
        description: Time taken to generate the trace.
      timeout_occurred:
        type: boolean
        description: Whether a timeout occurred during generation.
      temperature:
        type: number
        description: Temperature setting used.
additionalProperties: false
