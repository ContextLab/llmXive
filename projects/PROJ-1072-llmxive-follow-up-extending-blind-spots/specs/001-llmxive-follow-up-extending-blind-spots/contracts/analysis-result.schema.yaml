$schema: "http://json-schema.org/draft-07/schema#"
title: "StatisticalResult"
description: "Schema for the final statistical analysis output"
type: "object"
required:
  - "test_type"
  - "p_value"
  - "statistic"
  - "contingency_table"
  - "significant"
properties:
  test_type:
    type: "string"
    enum:
      - "Chi-squared"
      - "Fisher's Exact"
    description: "The statistical test performed"
  p_value:
    type: "number"
    description: "The p-value from the test"
    minimum: 0
    maximum: 1
  statistic:
    type: "number"
    description: "The test statistic (Chi-squared value or odds ratio)"
  contingency_table:
    type: "object"
    description: "The matrix of counts"
    additionalProperties:
      type: "object"
      additionalProperties:
        type: "integer"
  correction_applied:
    type: "string"
    enum:
      - "None"
      - "Bonferroni"
      - "Benjamini-Hochberg"
    description: "Multiple comparison correction method"
  significant:
    type: "boolean"
    description: "True if p < 0.05"
  effect_size:
    type: ["number", "null"]
    description: "Cramér's V or similar effect size"
