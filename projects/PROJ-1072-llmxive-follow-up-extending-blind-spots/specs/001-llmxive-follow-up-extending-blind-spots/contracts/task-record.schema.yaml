$schema: http://json-schema.org/draft-07/schema#
title: Task Record Schema
description: >
  Defines the structure of a single task record from the Blind-Spots-Bench dataset.
  Used for validation of raw and filtered data.
type: object
required:
  - task_id
  - category
  - sub_category
  - question
  - constraint
  - answer
  - metadata
properties:
  task_id:
    type: string
    description: Unique identifier for the task.
  category:
    type: string
    description: The high-level category (e.g., "Abstract Reasoning", "Object-Centric").
  sub_category:
    type: string
    description: The specific sub-category within the main category.
  question:
    type: string
    description: The natural language question or prompt presented to the model.
  constraint:
    type: string
    description: >
      The specific constraint or rule the model is expected to follow.
      This field is critical for the integrity check (FR-006).
  answer:
    type: string
    description: The ground truth answer or expected output.
  metadata:
    type: object
    description: Additional metadata about the task.
    properties:
      source:
        type: string
        description: Source of the task (e.g., arXiv ID).
      difficulty:
        type: string
        description: Difficulty rating if available.
      tags:
        type: array
        items:
          type: string
        description: List of tags associated with the task.
    additionalProperties: true
additionalProperties: false
