$schema: "http://json-schema.org/draft-07/schema#"
title: "Test Result Schema"
description: "Schema for statistical test results."
type: object
properties:
  result_id:
    type: string
    description: "Unique ID."
  transformation_id:
    type: string
    description: "Reference to Transformation."
  test_type:
    type: string
    enum:
      - "t_test"
      - "anova"
    description: "Type of statistical test."
  condition:
    type: string
    enum:
      - "null"
      - "alternative"
    description: "Condition of the test."
  effect_size:
    type: number
    nullable: true
    description: "Known effect size (for simulated data)."
  p_value:
    type: number
    minimum: 0
    maximum: 1
    description: "P-value from test."
  is_significant:
    type: boolean
    description: "Whether p_value < alpha."
  seed_used:
    type: integer
    description: "Random seed for this run."
  iteration:
    type: integer
    minimum: 1
    description: "Iteration number."
required:
  - result_id
  - transformation_id
  - test_type
  - condition
  - p_value
  - is_significant
  - seed_used
  - iteration
additionalProperties: false