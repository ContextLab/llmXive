$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Metadata Schema"
description: "Schema for data/datasets.csv containing metadata of downloaded datasets."
type: object
properties:
  dataset_id:
    type: string
    description: "Unique identifier for the dataset."
  source_url:
    type: string
    description: "Canonical download URL."
    pattern: "^https?://"
  filename:
    type: string
    description: "Local file path."
  checksum_sha256:
    type: string
    description: "SHA-256 hash of the raw file."
    pattern: "^[a-f0-9]{64}$"
  sample_size:
    type: integer
    minimum: 30
    description: "Number of rows (N)."
  num_continuous_vars:
    type: integer
    minimum: 1
    description: "Count of continuous variables."
  shapiro_wilk_p:
    type: number
    minimum: 0
    maximum: 1
    description: "Minimum p-value across variables."
  skewness:
    type: number
    description: "Average skewness."
  kurtosis:
    type: number
    description: "Average kurtosis."
  missing_pct:
    type: number
    minimum: 0
    maximum: 10
    description: "Percentage of missing values."
  status:
    type: string
    enum:
      - "downloaded"
      - "filtered_out"
      - "processed"
    description: "Current status."
  filter_reason:
    type: string
    enum:
      - "normal"
      - "small_n"
      - "missing_too_high"
      - "no_group"
    description: "Reason for exclusion (if filtered_out)."
  exclusion_details:
    type: string
    description: "Specific details of exclusion."
required:
  - dataset_id
  - source_url
  - filename
  - checksum_sha256
  - sample_size
  - num_continuous_vars
  - shapiro_wilk_p
  - missing_pct
  - status
additionalProperties: false