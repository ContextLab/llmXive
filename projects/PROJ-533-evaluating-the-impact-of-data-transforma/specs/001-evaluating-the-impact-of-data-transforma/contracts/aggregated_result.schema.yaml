# Schema for aggregated result records
type: object
properties:
  dataset_id:
    type: string
  transformation:
    type: string
    description: Transformation applied (including baseline).
    enum:
      - baseline          # added to ensure baseline compliance
      - box_cox
      - yeo_johnson
      - rank_normal
  test_type:
    type: string
    enum: [t_test, anova]
  metric:
    type: string
    enum: [type1_error, power]
  mean_value:
    type: number
  ci_lower:
    type: number
  ci_upper:
    type: number
  ci_half_width:
    type: number
  validation_status:
    type: string
    enum: [pass, fail]
required:
  - dataset_id
  - transformation
  - test_type
  - metric
  - mean_value
  - ci_lower
  - ci_upper
  - ci_half_width
  - validation_status
