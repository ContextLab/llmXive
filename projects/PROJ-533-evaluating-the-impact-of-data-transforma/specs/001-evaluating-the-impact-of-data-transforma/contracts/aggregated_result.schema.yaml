# Schema for aggregated results, now including baseline as a valid transformation
type: object
properties:
  dataset_id:
    type: string
  transformation:
    type: string
    enum:
      - baseline
      - box_cox
      - yeo_johnson
      - rank_normal
  test_type:
    type: string
    enum: [t_test, anova]
  metric:
    type: string
    enum: [type1_error, power]
  mean:
    type: number
  ci_lower:
    type: number
  ci_upper:
    type: number
  ci_half_width:
    type: number
  validation_status:
    type: string
required:
  - dataset_id
  - transformation
  - test_type
  - metric
  - mean
  - ci_lower
  - ci_upper
  - ci_half_width
  - validation_status
