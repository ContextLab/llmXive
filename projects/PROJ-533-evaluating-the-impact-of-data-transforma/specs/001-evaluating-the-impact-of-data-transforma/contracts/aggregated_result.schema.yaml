# Aggregated result schema – extended to recognise the baseline transformation.
#
# Only the enum modification is required for this task.
type: object
properties:
  transformation:
    type: string
    enum:
      - baseline          # <--- added to satisfy T001 requirements
      - box_cox
      - yeo_johnson
      - rank_inverse_normal
  metric:
    type: string
    enum: [type1_error, power]
  mean:
    type: number
  ci_lower:
    type: number
  ci_upper:
    type: number
required:
  - transformation
  - metric
  - mean
  - ci_lower
  - ci_upper
