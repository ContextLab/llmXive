$schema: "http://json-schema.org/draft-07/schema#"
title: "Aggregated Result Schema"
description: "Schema for aggregated statistical results."
type: object
properties:
  agg_id:
    type: string
    description: "Unique ID."
  transformation:
    type: string
    enum:
      - "box_cox"
      - "yeo_johnson"
      - "rank_based"
    description: "Method used."
  test_type:
    type: string
    enum:
      - "t_test"
      - "anova"
    description: "Test used."
  metric:
    type: string
    enum:
      - "type1_error"
      - "power"
    description: "Metric type."
  mean_value:
    type: number
    minimum: 0
    maximum: 1
    description: "Mean error/power rate."
  ci_lower:
    type: number
    minimum: 0
    maximum: 1
    description: "Lower bound of bootstrap CI."
  ci_upper:
    type: number
    minimum: 0
    maximum: 1
    description: "Upper bound of bootstrap CI."
  ci_half_width:
    type: number
    minimum: 0
    description: "Half-width of bootstrap CI."
  validation_status:
    type: string
    enum:
      - "pass"
      - "fail"
    description: "Pass if half-width <= 0.02."
  n_datasets:
    type: integer
    minimum: 1
    description: "Number of datasets contributing."
  n_iterations:
    type: integer
    minimum: 1
    description: "Total iterations."
required:
  - agg_id
  - transformation
  - test_type
  - metric
  - mean_value
  - ci_lower
  - ci_upper
  - ci_half_width
  - validation_status
  - n_datasets
  - n_iterations
additionalProperties: false