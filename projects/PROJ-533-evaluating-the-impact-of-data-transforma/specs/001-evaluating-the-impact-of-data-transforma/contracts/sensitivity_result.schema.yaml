# Schema for sensitivity analysis results
type: object
properties:
  dataset_id:
    type: string
  transformation:
    type: string
    description: Transformation applied (including baseline).
    enum:
      - baseline          # added for compatibility
      - box_cox
      - yeo_johnson
      - rank_normal
  test_type:
    type: string
    enum: [t_test, anova]
  alpha:
    type: number
  error_rate:
    type: number
  ci_lower:
    type: number
  ci_upper:
    type: number
  validation_status:
    type: string
    enum: [pass, fail]
required:
  - dataset_id
  - transformation
  - test_type
  - alpha
  - error_rate
  - ci_lower
  - ci_upper
  - validation_status
