# Schema for sensitivity analysis results, now supporting baseline transformation
type: object
properties:
  dataset_id:
    type: string
  transformation:
    type: string
    enum:
      - baseline
      - box_cox
      - yeo_johnson
      - rank_normal
  test_type:
    type: string
    enum: [t_test, anova]
  alpha:
    type: number
  error_rate:
    type: number
  validation_status:
    type: string
required:
  - dataset_id
  - transformation
  - test_type
  - alpha
  - error_rate
  - validation_status
