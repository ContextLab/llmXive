# Sensitivity‑result schema – extended to include the baseline transformation.
#
# The rest of the schema is unchanged; only the enum list is updated.
type: object
properties:
  transformation:
    type: string
    enum:
      - baseline          # <--- added to satisfy T001 requirements
      - box_cox
      - yeo_johnson
      - rank_inverse_normal
  alpha:
    type: number
  error_rate:
    type: number
required:
  - transformation
  - alpha
  - error_rate