access_python: "import openml, pandas as pd\n\n# Retrieve the full list of OpenML\
  \ datasets as a DataFrame\ndf = openml.datasets.list_datasets(output_format='dataframe')\n\
  \n# Map OpenML column names to the required field names where they correspond\n\
  mapping = {\n    'did': 'dataset_id',\n    'name': 'name',\n    'url': 'download_url',\n\
  \    'md5_checksum': 'sha256_checksum',\n    'NumberOfInstances': 'n_instances',\n\
  \    'NumberOfFeatures': 'n_features',\n    'NumberOfNumericFeatures': 'n_numeric_features',\n\
  \    'NumberOfSymbolicFeatures': 'n_categorical_features',\n    'NumberOfMissingValues':\
  \ 'missing_percentage',\n    'default_target_attribute': 'target_type',\n    'format':\
  \ 'task_type'\n}\n# Keep only mappings for columns that actually exist in the DataFrame\n\
  valid_mapping = {orig:new for orig, new in mapping.items() if orig in df.columns}\n\
  # Rename the DataFrame columns according to the mapping\ndf_renamed = df.rename(columns=valid_mapping)\n\
  # Convert to a list of records (dicts)\nrecords = df_renamed.to_dict(orient='records')\n\
  print(f\"RECORDS={len(records)}\")\nprint(\"FIELDS=\" + \",\".join(valid_mapping.values()))"
