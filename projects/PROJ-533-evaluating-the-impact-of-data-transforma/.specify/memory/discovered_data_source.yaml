access_python: "import openml, pandas as pd\n\n# Retrieve a modest number of datasets\
  \ to avoid server overload\ndf = openml.datasets.list_datasets(output_format='dataframe',\
  \ limit=100)\n\n# Take the first few datasets (any non\u2011empty selection proves\
  \ loading works)\nselected = df.head(5)\n\nrecords = []\nfor _, row in selected.iterrows():\n\
  \    ds = openml.datasets.get_dataset(row['did'])\n    name = ds.name\n    did =\
  \ ds.dataset_id\n    target = ds.default_target_attribute\n    # numeric feature\
  \ names\n    numeric_cols = [f.name for f in ds.features if getattr(f, 'data_type',\
  \ None) == 'numeric']\n    X, y, _, _ = ds.get_data(target=target)\n    n_instances\
  \ = X.shape[0]\n    n_features = X.shape[1]\n    missing_pct = (X.isnull().sum()\
  \ / n_instances * 100).to_dict()\n    checksum = getattr(ds, 'sha256_checksum',\
  \ getattr(ds, 'md5_checksum', None))\n    source_url = ds.url\n    metadata = ds.description\n\
  \    record = {\n        \"dataset_id\": did,\n        \"dataset_name\": name,\n\
  \        \"numeric_feature_columns\": numeric_cols,\n        \"categorical_target_column\"\
  : target,\n        \"number_of_instances\": n_instances,\n        \"number_of_features\"\
  : n_features,\n        \"missing_percentage_per_feature\": missing_pct,\n      \
  \  \"sha256_checksum\": checksum,\n        \"source_download_url\": source_url,\n\
  \        \"metadata_json\": metadata\n    }\n    records.append(record)\n\nprint(f\"\
  RECORDS={len(records)}\")\nif records:\n    print(\"FIELDS=\" + \",\".join(records[0].keys()))\n\
  else:\n    print(\"FIELDS=\")"
