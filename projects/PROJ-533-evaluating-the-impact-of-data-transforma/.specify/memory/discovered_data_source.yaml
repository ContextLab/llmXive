  \ if pd.notna(val) else None\n\ndef safe_float(val):\n    return float(val) if pd.notna(val)\
  \ else None\n\ndf = openml.datasets.list_datasets(output_format=\"dataframe\")\n\
  records = []\nfor _, r in df.iterrows():\n    n_instances = safe_int(r[\"NumberOfInstances\"\
  ])\n    n_missing = safe_int(r[\"NumberOfMissingValues\"])\n    rec = {\n      \
  \  \"dataset_id\": safe_int(r[\"did\"]),\n        \"name\": r[\"name\"],\n     \
  \   \"source\": r.get(\"source\", None),\n        \"task_type\": r.get(\"format\"\
  , None),\n        \"n_samples\": safe_int(r[\"NumberOfInstances\"]),\n        \"\
  n_features\": safe_int(r[\"NumberOfFeatures\"]),\n        \"n_continuous_features\"\
  : safe_int(r[\"NumberOfNumericFeatures\"]),\n        \"target_name\": r.get(\"default_target_attribute\"\
  , None),\n        \"missing_percentage\": (\n            (n_missing / n_instances\
  \ * 100) if n_instances and n_missing is not None else None\n        ),\n      \
  \  \"download_url\": r.get(\"url\", None),\n    }\n    records.append(rec)\n\nprint(f\"\
  RECORDS={len(records)}\")\nfirst = records[0] if records else {}\nfields = [k for\
  \ k, v in first.items() if v is not None]\nprint(\"FIELDS=\" + \",\".join(fields))"
