access_python: "import openml, pandas as pd\n# Retrieve dataset metadata as a DataFrame\n\
  df = openml.datasets.list_datasets(output_format='dataframe')\nRECORDS = len(df)\n\
  # Map available columns to the required field names\nfields = []\nif 'did' in df.columns:\n\
  \    fields.append('dataset_id')\nif 'name' in df.columns:\n    fields.append('dataset_name')\n\
  if 'url' in df.columns:\n    fields.append('download_url')\nif 'NumberOfInstances'\
  \ in df.columns:\n    fields.append('number_of_instances')\nif 'NumberOfNumericFeatures'\
  \ in df.columns:\n    fields.append('number_of_numeric_features')\nif 'NumberOfCategoricalFeatures'\
  \ in df.columns:\n    fields.append('number_of_categorical_features')\nif 'default_target_attribute'\
  \ in df.columns:\n    fields.append('target_column_name')\nif 'NumberOfMissingValues'\
  \ in df.columns:\n    fields.append('missing_percentage_per_feature')\nif 'md5_checksum'\
  \ in df.columns:\n    fields.append('sha256_checksum')\n# OpenML provides the source\
  \ repository implicitly; we add a placeholder name\nfields.append('source_repository')\n\
  if 'tag' in df.columns:\n    fields.append('task_type')\nprint(f'RECORDS={RECORDS}')\n\
  print('FIELDS=' + ','.join(fields))"
