[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-data-transformation-sensitivity"
version = "0.1.0"
description = "Evaluating the Impact of Data Transformation on Statistical Test Sensitivity"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn",
    "scipy",
    "pandas",
    "numpy",
    "seaborn",
    "matplotlib",
    "requests",
    "pyyaml",
    "statsmodels"
]

[tool.black]
line-length = 100
target-version = ['py311']
include = 'code/.*\.py$'
extend-exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | data
    | results
    | tests
)/
'''