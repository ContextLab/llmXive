[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-research-implementer"
version = "0.1.0"
description = "Automated science pipeline for evaluating data transformation impact on statistical test sensitivity"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn",
    "scipy",
    "pandas",
    "numpy",
    "seaborn",
    "matplotlib",
    "requests",
    "pyyaml",
    "statsmodels",
    "portalocker"
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pytest",
    "pytest-cov"
]

[tool.black]
line-length = 100
target-version = ['py311']
include = 'code/.*\.py'
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"