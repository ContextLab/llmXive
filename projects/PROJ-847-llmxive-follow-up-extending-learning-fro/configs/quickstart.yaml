# Quickstart configuration for the density-supervision study.
# See docs/quickstart.md for full usage instructions.
seed: 42

# Output directory tree created at pipeline initialization.
output_dirs:
  - statistics
  - figures
  - summary
  - checkpoints

# Pipeline stages to execute, in order. Stages whose implementing
# modules do not exist yet are skipped with a warning; they are added
# by subsequent tasks (data, model, trainer, analysis).
stages:
  - data
  - model
  - fixed_baselines
  - adaptive_runs
  - analysis

# Training hyper-parameters (consumed by later tasks).
training:
  rhos: [0.5]          # thin run uses a single rho
  seeds: [42]          # single seed for reproducibility
  max_epochs: 2        # very short run for quickstart
  batch_size: 16
  adaptive: false
  timeout_seconds: 21600

data:
  gsm8k_split: test
  streaming: true

model:
  model_id: "hf://author/lightdiff-100m"