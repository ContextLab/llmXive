# Quickstart configuration for the density-supervision study.
# See docs/quickstart.md for full usage instructions.
seed: 42

# Output directory tree created at pipeline initialization.
output_dirs:
  - statistics
  - figures
  - summary
  - checkpoints

# Pipeline stages to execute, in order. Stages whose implementing
# modules do not exist yet are skipped with a warning; they are
# added by subsequent tasks (data, model, trainer, analysis).
stages:
  - data
  - model
  - fixed_baselines
  - adaptive_runs
  - analysis

# Training hyper-parameters (consumed by later tasks).
training:
  rhos: [0.1, 0.3, 0.5, 0.7, 0.9]
  seeds: [42, 43, 44]
  max_epochs: 10
  batch_size: 32
  adaptive: false
  timeout_seconds: 21600

data:
  gsm8k_split: test
  streaming: true

model:
  model_id: "hf://author/lightdiff-100m"
