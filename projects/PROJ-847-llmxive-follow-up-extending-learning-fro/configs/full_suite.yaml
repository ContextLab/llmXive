# Full‑suite configuration for the density‑supervision study.
seed: 42

output_dirs:
  - statistics
  - figures
  - summary
  - checkpoints

stages:
  - data
  - model
  - fixed_baselines
  - adaptive_runs
  - analysis

training:
  rhos: [0.1, 0.3, 0.5, 0.7, 0.9]
  seeds: [42, 43, 44, 45, 46]
  max_epochs: 5
  batch_size: 16
  adaptive: false
  timeout_seconds: 21600

data:
  gsm8k_split: test
  streaming: true

model:
  model_id: "distilgpt2"
