$schema: http://json-schema.org/draft-07/schema#
title: LSTRecordSchema
description: "Schema for the canonical LST wear resistance dataset"
type: object
properties:
  pulse_duration:
    type: number
    description: "Laser pulse duration in nanoseconds or microseconds"
  power:
    type: number
    description: "Laser power in Watts"
  scanning_speed:
    type: number
    description: "Scanning speed in mm/s"
  pattern_geometry:
    type: string
    description: "Textured pattern type (e.g., grid, dot, line)"
  hardness:
    type: number
    description: "Material hardness in HV or GPa"
  elastic_modulus:
    type: number
    description: "Elastic modulus in GPa"
  contact_load:
    type:
      - "number"
      - "null"
    description: "Contact load in Newtons (optional)"
  sliding_speed:
    type:
      - "number"
      - "null"
    description: "Sliding speed in m/s (optional)"
  wear_rate:
    type: number
    description: "Raw wear rate"
  material_class:
    type: string
    description: "Base material category"
  normalization_method:
    type: string
    enum:
      - "archard"
      - "raw"
    description: "Method used for wear rate normalization"
  wear_coefficient:
    type:
      - "number"
      - "null"
    description: "Calculated specific wear coefficient (K)"
  unit_conversion_status:
    type: string
    enum:
      - "valid"
      - "unavailable"
      - "failed"
    description: "Status of unit conversion for wear rate"
required:
  - pulse_duration
  - power
  - scanning_speed
  - pattern_geometry
  - hardness
  - elastic_modulus
  - wear_rate
  - material_class
  - normalization_method
additionalProperties: false