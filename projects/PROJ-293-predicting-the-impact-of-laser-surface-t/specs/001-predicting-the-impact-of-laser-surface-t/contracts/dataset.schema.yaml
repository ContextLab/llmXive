$schema: "http://json-schema.org/draft-07/schema#"
title: "LST Wear Dataset Schema"
type: "object"
properties:
  pulse_duration:
    type: "number"
    description: "Laser pulse duration in microseconds"
  power:
    type: "number"
    description: "Laser power in Watts"
  scanning_speed:
    type: "number"
    description: "Scanning speed in mm/s"
  pattern_geometry:
    type: "string"
    description: "Texturing pattern type (e.g., 'grid', 'dot')"
  hardness:
    type: "number"
    description: "Material hardness (HV)"
  elastic_modulus:
    type: "number"
    description: "Elastic modulus (GPa)"
  wear_rate:
    type: "number"
    description: "Raw wear rate"
  contact_load:
    type: ["number", "null"]
    description: "Contact load (N) - Optional"
  sliding_speed:
    type: ["number", "null"]
    description: "Sliding speed (m/s) - Optional"
  density:
    type: ["number", "null"]
    description: "Material density - Optional"
  contact_area:
    type: ["number", "null"]
    description: "Contact area (mm²) - Optional"
  sliding_distance:
    type: ["number", "null"]
    description: "Sliding distance (m) - Optional"
  material_class:
    type: "string"
    description: "Broad material category"
  normalization_method:
    type: "string"
    enum:
      - "normalized"
      - "raw"
    description: "Flag indicating if Archard normalization was applied"
  source_id:
    type: "string"
    description: "Unique identifier of the source dataset"
required:
  - pulse_duration
  - power
  - scanning_speed
  - pattern_geometry
  - hardness
  - elastic_modulus
  - wear_rate
  - normalization_method
  - source_id