# Explicit Black configuration file
# Ensures consistent formatting settings across the project

line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''
skip-string-normalization = false
preview = false
