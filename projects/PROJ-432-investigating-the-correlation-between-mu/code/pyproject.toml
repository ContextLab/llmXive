[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muon-temp-correlation"
version = "0.1.0"
description = "Investigating the Correlation Between Muon Flux and Atmospheric Temperature Profiles"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "requests",
    "h5py",
    "pyyaml",
    "cdsapi",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.venv
    | venv
    | data
    | logs
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
include = ["code/**/*.py"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "data",
    "logs",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"code/tests/**/*.py" = ["S101"] # allow asserts in tests

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false
lines-between-types = 0
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-v --tb=short"
