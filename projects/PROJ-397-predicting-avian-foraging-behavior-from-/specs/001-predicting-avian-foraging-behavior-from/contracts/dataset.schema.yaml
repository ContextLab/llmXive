$schema: "http://json-schema.org/draft-07/schema#"
title: "MergedObservationsSchema"
description: "Schema for the merged eBird and NLCD dataset used in analysis."
type: "object"
properties:
  species_id:
    type: "string"
    description: "Unique identifier for the bird species."
  foraging_guild:
    type: "string"
    enum:
      - "ground"
      - "canopy"
      - "aerial"
    description: "Foraging strategy assigned to the species."
  forest_proportion:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of forest cover within 100m buffer."
  grassland_proportion:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of grassland cover within 100m buffer."
  wetland_proportion:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of wetland cover within 100m buffer."
  urban_proportion:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of urban cover within 100m buffer."
  other_proportion:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of other land cover within 100m buffer."
  latitude:
    type: "number"
    description: "Latitude of the observation point."
  longitude:
    type: "number"
    description: "Longitude of the observation point."
  observation_date:
    type: "string"
    format: "date"
    description: "Date of the observation."
required:
  - species_id
  - foraging_guild
  - forest_proportion
  - grassland_proportion
  - wetland_proportion
  - urban_proportion
  - other_proportion
  - latitude
  - longitude
  - observation_date
additionalProperties: false
constraints:
  - "Sum of all proportion fields must be approximately unity (tolerance 0.01)."
  - "Only species with >= 50 observations are included."
