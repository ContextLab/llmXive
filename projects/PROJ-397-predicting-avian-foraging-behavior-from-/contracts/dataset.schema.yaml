# Schema for merged_observations.csv
# Generated for PROJ-397: Predicting Avian Foraging Behavior
version: "1.0"
description: "Schema for the merged observations dataset after joining EBD records with NLCD land cover data and guild labels."

required_columns:
  - species_id
  - foraging_guild
  - forest_prop_100m
  - grassland_prop_100m
  - wetland_prop_100m
  - urban_prop_100m
  - other_prop_100m

column_types:
  species_id: string
  foraging_guild: string
  forest_prop_100m: float
  grassland_prop_100m: float
  wetland_prop_100m: float
  urban_prop_100m: float
  other_prop_100m: float

constraints:
  - column: species_id
    rule: "non-empty string"
  - column: foraging_guild
    rule: "non-empty string"
  - columns:
      - forest_prop_100m
      - grassland_prop_100m
      - wetland_prop_100m
      - urban_prop_100m
      - other_prop_100m
    rule: "float values between 0.0 and 1.0"
  - rule: "Sum of all land-cover proportion columns must be <= 1.0 (allowing for minor floating point errors)"

file_format:
  format: csv
  delimiter: ","
  encoding: "utf-8"
  header: true
