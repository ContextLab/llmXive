# Schema for merged_observations.csv
# Generated for PROJ-397: Predicting Avian Foraging Behavior
type: object
properties:
  species_id:
    type: string
    description: "Unique species identifier (e.g., 'melanospiza')"
  foraging_guild:
    type: string
    description: "Assigned foraging guild label"
  forest_prop_100m:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of forest land cover within 100m buffer"
  grassland_prop_100m:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of grassland land cover within 100m buffer"
  wetland_prop_100m:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of wetland land cover within 100m buffer"
  urban_prop_100m:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of urban land cover within 100m buffer"
  water_prop_100m:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of water land cover within 100m buffer"
  shrub_prop_100m:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of shrub land cover within 100m buffer"
  agricultural_prop_100m:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of agricultural land cover within 100m buffer"
  bare_prop_100m:
    type: number
    minimum: 0.0
    maximum: 1.0
