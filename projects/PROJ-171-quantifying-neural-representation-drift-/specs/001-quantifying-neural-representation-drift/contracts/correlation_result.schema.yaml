$schema: "http://json-schema.org/draft-07/schema#"
title: "CorrelationResult"
description: "Schema for the correlation results between drift rate and learning speed."
type: "object"
properties:
  correlation_r:
    type: "number"
    description: "Pearson correlation coefficient."
  p_value_permutation:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "P‑value from the permutation test (a large number of shuffles)."
  p_value_lmm:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "P‑value for the fixed effect in the Linear Mixed‑Effects Model."
  lmm_fixed_effect_coeff:
    type: "number"
    description: "Coefficient of drift rate in the LMM."
  lmm_random_effect_variance:
    type: "number"
    description: "Variance of the subject random effect in the LMM."
  sample_size:
    type: "integer"
    minimum: 1
    description: "Number of subjects included."
  power_warning:
    type: "boolean"
    description: "True if N < 15 (insufficient power)."
  bonferroni_corrected_p:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Bonferroni‑corrected p‑value when multiple metrics are tested."
  metrics_tested:
    type: "array"
    items:
      type: "string"
    description: "List of distance metrics evaluated."
required:
  - correlation_r
  - p_value_permutation
  - p_value_lmm
  - sample_size
  - power_warning
  - metrics_tested
additionalProperties: false
