$schema: "http://json-schema.org/draft-07/schema#"
title: "CorrelationResult"
description: "Schema for the correlation results between drift rate and learning speed."
type: "object"
properties:
  correlation_r:
    type: "number"
    description: "Pearson correlation coefficient."
  p_value_permutation:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "P-value from the permutation test (10,000 shuffles)."
  p_value_lmm:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "P-value for the fixed effect in the Linear Mixed-Effects Model."
  lmm_fixed_effect_coeff:
    type: "number"
    description: "Coefficient of the drift rate in the LMM."
  lmm_random_effect_variance:
    type: "number"
    description: "Variance of the random effect (subject) in the LMM."
  sample_size:
    type: "integer"
    minimum: 1
    description: "Number of subjects included in the analysis."
  power_warning:
    type: "boolean"
    description: "True if sample size < 15."
  bonferroni_corrected_p:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Bonferroni corrected p-value if multiple metrics were tested."
  metrics_tested:
    type: "array"
    items:
      type: "string"
    description: "List of distance metrics tested (for Bonferroni correction)."
required:
  - correlation_r
  - p_value_permutation
  - p_value_lmm
  - sample_size
  - power_warning
  - metrics_tested
