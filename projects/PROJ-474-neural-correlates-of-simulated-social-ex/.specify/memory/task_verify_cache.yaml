  r: "Checked `data/raw/checksums.json` and its generation log \u2013 it contains\
    \ a single SHA\u2011256 entry that matches the recomputed checksum for `harvard_oxford_cort_maxprob_thr25_2mm.nii.gz`.\
    \ However, the task requires a checksum entry for **every** downloaded NIfTI file;\
    \ there is no evidence that other NIfTI files (e.g., the fMRI runs from ds000030)\
    \ were included or that the JSON covers all of them. Add entries for all downloaded\
    \ NIfTI files (or provide proof that only this file was downloaded) and verify\
    \ each checksum."
  sig: c78b22d042da9ba96dbd0c7bbdb772e0c8a487febe643cc874ee66e399cc4ad9
