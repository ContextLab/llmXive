  h: ba2cae33d1e3d82da0d4a745e67a5f49c7d4f072facaf05029cae699c4172ce5
  r: "Checked `code/data_loader.py`, `data/raw/checksums.json`, `data/processed/dataset_manifest.json`,\
    \ the unit tests, and the execution log. The loader implements backoff and marker\u2011\
    checking logic, and the tests pass, but it never streams the subject fMRI files\
    \ (it only downloads the Harvard\u2011Oxford atlas) and the generated `dataset_manifest.json`\
    \ does not follow the required `contracts/dataset_schema.schema.yaml` (it lacks\
    \ the subject/run/condition/time_series fields). Moreover, when the OpenNeuro\
    \ API call fails (404) the script proceeds in \u201Crecord\u201D mode instead\
    \ of aborting with error\u202F101897695 as"
  sig: 6f5a5ce64e98061aa6d7ca23225e944a990df3457c2c0d34a177d9096a438b8f
T001b:
