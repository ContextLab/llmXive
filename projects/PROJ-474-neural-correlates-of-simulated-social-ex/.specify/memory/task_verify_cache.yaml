  r: "The QC module cannot be imported (test collection fails) because `code/qc.py`\
    \ tries to import `src.exceptions`, but the `src` package only re\u2011exports\
    \ the `code/src` directory and does not contain an `exceptions` submodule, causing\
    \ a `ModuleNotFoundError`. Moreover, the generated `data/processed/subjects_metadata.json`\
    \ is just an empty list (`[]`), which does not satisfy the required schema (missing\
    \ required fields and contains extra keys like `condition_valid` with lower\u2011\
    cased condition names). The implementation therefore does not produce the correct\
    \ output nor pass the provided tests."
  sig: efc64e8f2acee0093f5c28f97a8f8b99ea65effaf4f2738b5bff973f4cb18352
