$schema: "http://json-schema.org/draft-07/schema#"
title: "ConnectivityMatrix"
description: "Schema for connectivity matrix and strength metric."
type: object
properties:
  subject_id:
    type: string
    description: "Subject ID."
  condition:
    type: string
    enum:
      - "Inclusion"
      - "Exclusion"
    description: "Task condition."
  nodes:
    type: array
    items:
      type: string
    description: "List of ROI names."
  matrix:
    type: array
    items:
      type: array
      items:
        type: number
    description: "Correlation matrix."
  strength_absolute:
    type: number
    description: "Primary metric – mean absolute correlation across ROI edges."
  strength_signed:
    type: number
    description: "Mean signed correlation (provided for descriptive purposes)."
  edges:
    type: object
    description: "Individual edge correlation values (signed)."
    additionalProperties:
      type: number
required:
  - subject_id
  - condition
  - nodes
  - matrix
  - strength_absolute
  - edges
additionalProperties: false