# Standalone ruff config for CLI usage if pyproject.toml is not picked up
target-version = "py39"
line-length = 88
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501", "B008", "C901"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "data",
    "figures",
    "artifacts",
]

[isort]
known-first-party = ["ingestion", "modeling", "utils"]
force-sort-within-sections = true
lines-after-imports = 2
