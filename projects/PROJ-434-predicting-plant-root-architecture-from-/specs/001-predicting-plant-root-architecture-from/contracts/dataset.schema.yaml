%YAML 1.2
---
# Dataset Schema Contract for Root Architecture Prediction
# Defines the structure of the merged dataset produced by US1 (T012-T017)
# and consumed by US2 (T020+).

$schema: http://json-schema.org/draft-07/schema#
title: MergedRootTraitDataset
description: >
  Unified dataset containing paired soil nutrient profiles and root trait measurements.
  Generated by the ingestion pipeline (code/ingestion/).

type: object
required:
  - metadata
  - columns
  - data

metadata:
  type: object
  required:
    - generated_at
    - source_soil_grid
    - source_trait_data
    - total_rows
    - valid_rows
    - excluded_rows
  properties:
    generated_at:
      type: string
      format: date-time
      description: ISO 8601 timestamp of generation
    source_soil_grid:
      type: string
      description: Identifier for the SoilGrids layer/version used
    source_trait_data:
      type: string
      description: Identifier for the trait dataset (e.g., Zenodo DOI)
    total_rows:
      type: integer
      minimum: 0
    valid_rows:
      type: integer
      minimum: 0
    excluded_rows:
      type: integer
      minimum: 0

columns:
  type: array
  description: >
    Ordered list of column definitions.
    Order must match the CSV header order.
  items:
    type: object
    required:
      - name
      - dtype
      - description
    properties:
      name:
        type: string
        pattern: "^[a-z_][a-z0-9_]*$"
      dtype:
        type: string
        enum: [int64, float64, object, category]
      description:
        type: string

data:
  type: array
  description: >
    List of records. Each record is a dictionary matching the column definitions.
    Note: In CSV representation, this corresponds to the rows.
  items:
    type: object
    required:
      - species_name
      - root_depth_cm
      - root_diameter_mm
      - soil_n_mg_kg
      - soil_p_mg_kg
      - soil_k_mg_kg
      - soil_ph
      - latitude
      - longitude
    properties:
      species_name:
        type: string
        description: Scientific name of the plant species
        minLength: 1
      root_depth_cm:
        type: float
        minimum: 0.0
        description: Maximum rooting depth in centimeters
      root_diameter_mm:
        type: float
        minimum: 0.0
        description: Average root diameter in millimeters
      soil_n_mg_kg:
        type: float
        minimum: 0.0
        description: Soil Nitrogen concentration (mg/kg)
      soil_p_mg_kg:
        type: float
        minimum: 0.0
        description: Soil Phosphorus concentration (mg/kg)
      soil_k_mg_kg:
        type: float
        minimum: 0.0
        description: Soil Potassium concentration (mg/kg)
      soil_ph:
        type: float
        minimum: 3.0
        maximum: 9.0
        description: Soil pH value
      latitude:
        type: float
        minimum: -90.0
        maximum: 90.0
      longitude:
        type: float
        minimum: -180.0
        maximum: 180.0

# Constraints specific to this project
constraints:
  - name: species_filter
    description: Species with < 10 valid observations are excluded in T014
    rule: "count(species) >= 10"
  - name: soil_data_completeness
    description: Rows with missing soil data are excluded in T015
    rule: "soil_n_mg_kg IS NOT NULL AND soil_p_mg_kg IS NOT NULL AND soil_k_mg_kg IS NOT NULL AND soil_ph IS NOT NULL"
  - name: physical_plausibility
    description: Traits must be physically plausible (depth > 0, pH 3-9)
    rule: "root_depth_cm > 0 AND soil_ph BETWEEN 3.0 AND 9.0"
