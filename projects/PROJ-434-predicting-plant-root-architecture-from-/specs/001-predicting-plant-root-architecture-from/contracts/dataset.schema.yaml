$schema: "http://json-schema.org/draft-07/schema#"
title: "Merged Root Trait and Soil Nutrient Dataset"
description: |
  Schema for the unified dataset produced by User Story 1 (T014/T015).
  Contains paired observations of root architecture traits and soil nutrient profiles.
  This file serves as the contract for data ingestion and validation.
type: object
required:
  - columns
  - rows
  - metadata
properties:
  columns:
    type: array
    description: "List of column definitions matching the dataset headers."
    items:
      type: object
      required:
        - name
        - type
        - description
      properties:
        name:
          type: string
          description: "Column name as it appears in the CSV."
        type:
          type: string
          enum:
            - string
            - integer
            - float
            - boolean
          description: "Data type of the column."
        description:
          type: string
          description: "Human-readable description of the column."
        units:
          type: string
          description: "Physical units if applicable (e.g., 'cm', 'mg/kg')."
        nullable:
          type: boolean
          default: false
          description: "Whether null values are permitted."
    minItems: 10
  rows:
    type: array
    description: "Array of row objects representing individual observations."
    items:
      type: object
      required:
        - record_id
        - species_name
        - depth
        - branching
        - soil_n
        - soil_p
        - soil_k
        - soil_ph
        - latitude
        - longitude
      properties:
        record_id:
          type: string
          description: "Unique identifier for the record (e.g., UUID or composite key)."
        species_name:
          type: string
          description: "Scientific name of the plant species."
        depth:
          type: number
          format: float
          description: "Maximum root depth observed."
          minimum: 0
          units: "cm"
        branching:
          type: number
          format: float
          description: "Root branching density or count."
          minimum: 0
          units: "branch/cm"
        soil_n:
          type: number
          format: float
          description: "Nitrogen concentration in soil."
          minimum: 0
          units: "mg/kg"
          nullable: true
        soil_p:
          type: number
          format: float
          description: "Phosphorus concentration in soil."
          minimum: 0
          units: "mg/kg"
          nullable: true
        soil_k:
          type: number
          format: float
          description: "Potassium concentration in soil."
          minimum: 0
          units: "mg/kg"
          nullable: true
        soil_ph:
          type: number
          format: float
          description: "Soil pH value."
          minimum: 0
          maximum: 14
          nullable: true
        latitude:
          type: number
          format: float
          description: "Latitude coordinate (WGS84)."
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: float
          description: "Longitude coordinate (WGS84)."
          minimum: -180
          maximum: 180
        source_dataset:
          type: string
          description: "Name of the source dataset for this record."
        extraction_date:
          type: string
          format: date-time
          description: "Timestamp of soil data extraction."
  metadata:
    type: object
    required:
      - version
      - generated_at
      - source_datasets
      - processing_steps
    properties:
      version:
        type: string
        description: "Schema version (e.g., '1.0.0')."
      generated_at:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of dataset generation."
      source_datasets:
        type: array
        description: "List of source datasets used to create this merged file."
        items:
          type: object
          properties:
            name:
              type: string
            id:
              type: string
              description: "DOI, Zenodo ID, or internal identifier."
            url:
              type: string
              format: uri
      processing_steps:
        type: array
        description: "Ordered list of processing steps applied."
        items:
          type: string
      checksum:
        type: string
        description: "SHA256 checksum of the raw CSV file."
      validation_status:
        type: string
        enum:
          - passed
          - failed
          - pending
        description: "Result of schema validation."
examples:
  - columns:
      - name: record_id
        type: string
        description: "Unique record identifier"
      - name: species_name
        type: string
        description: "Plant species"
      - name: depth
        type: float
        description: "Root depth"
        units: "cm"
    rows:
      - record_id: "rec_001"
        species_name: "Zea mays"
        depth: 45.2
        branching: 12.5
        soil_n: 15.4
        soil_p: 8.2
        soil_k: 120.0
        soil_ph: 6.5
        latitude: 40.7128
        longitude: -74.0060
    metadata:
      version: "1.0.0"
      generated_at: "2023-10-27T10:00:00Z"
      source_datasets:
        - name: "Root Trait Database"
          id: "10.5281/zenodo.123456"
      processing_steps:
        - "Loaded root traits from source"
        - "Extracted SoilGrids values at coordinates"
        - "Merged on coordinate proximity"
        - "Filtered for valid species counts"