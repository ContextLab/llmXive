$schema: "http://json-schema.org/draft-07/schema#"
title: "Merged Root Trait and Soil Nutrient Dataset Schema"
description: >
  Schema for the unified dataset produced by User Story 1 (Data Ingestion and Geospatial Alignment).
  This dataset pairs root trait measurements with extracted soil nutrient profiles (N, P, K, pH)
  at the same geospatial coordinates.
type: object
required:
  - $schema
  - metadata
  - data
properties:
  $schema:
    type: string
    const: "http://json-schema.org/draft-07/schema#"
  metadata:
    type: object
    required:
      - source_files
      - processing_date
      - record_count
      - species_count
    properties:
      source_files:
        type: array
        description: List of source files used to generate this dataset
        items:
          type: string
      processing_date:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the dataset was generated
      record_count:
        type: integer
        minimum: 0
        description: Total number of records in the dataset
      species_count:
        type: integer
        minimum: 0
        description: Number of unique species in the dataset
      validation_status:
        type: string
        enum: ["valid", "partial", "invalid"]
        description: Result of schema validation
      match_proportion:
        type: number
        minimum: 0
        maximum: 1
        description: Proportion of input rows that successfully matched soil data
  data:
    type: array
    description: Array of records, each containing paired soil and root trait data
    items:
      type: object
      required:
        - record_id
        - species_name
        - latitude
        - longitude
        - soil_n
        - soil_p
        - soil_k
        - soil_ph
        - root_depth
        - root_branching
      properties:
        record_id:
          type: string
          description: Unique identifier for this record
          pattern: "^REC-[0-9]+$"
        species_name:
          type: string
          description: Scientific name of the plant species
          minLength: 1
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude in WGS84 (EPSG:4326)
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude in WGS84 (EPSG:4326)
        soil_n:
          type: number
          description: Soil Nitrogen (N) concentration in mg/kg
          minimum: 0
          nullable: true
        soil_p:
          type: number
          description: Soil Phosphorus (P) concentration in mg/kg
          minimum: 0
          nullable: true
        soil_k:
          type: number
          description: Soil Potassium (K) concentration in mg/kg
          minimum: 0
          nullable: true
        soil_ph:
          type: number
          description: Soil pH value
          minimum: 0
          maximum: 14
          nullable: true
        root_depth:
          type: number
          description: Maximum root depth in cm
          minimum: 0
          nullable: true
        root_branching:
          type: number
          description: Root branching intensity (count or index)
          minimum: 0
          nullable: true
        data_source:
          type: string
          description: Source of the trait data (e.g., "Zenodo", "Dryad", "Field Study")
        quality_flags:
          type: array
          description: List of quality flags applied to this record
          items:
            type: string
            enum:
              - "geocoding_confidence_low"
              - "soil_interpolation"
              - "outlier_detected"
              - "unit_conversion_applied"
additionalProperties: false