$schema: http://json-schema.org/draft-07/schema#
title: Merged Plant Root Architecture Dataset Schema
description: |
  Schema for the unified dataset pairing soil nutrient profiles with root trait measurements.
  This schema enforces data quality gates (SC-001) and ensures compatibility with downstream
  modeling tasks (US2). All values must be derived from real sources as per project constraints.
type: object
required:
  - properties
  - records
properties:
  properties:
    type: object
    description: Metadata about the dataset generation
    required:
      - generated_at
      - source_soil_data
      - source_trait_data
      - filter_criteria
    properties:
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation
      source_soil_data:
        type: string
        description: Identifier for the soil data source (e.g., SoilGrids version)
      source_trait_data:
        type: string
        description: Identifier for the trait data source (e.g., Zenodo DOI)
      filter_criteria:
        type: object
        properties:
          min_observations_per_species:
            type: integer
            minimum: 1
          valid_ph_range:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
          valid_depth_range:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2

  records:
    type: array
    description: List of validated, merged records
    items:
      type: object
      required:
        - record_id
        - species_name
        - latitude
        - longitude
        - soil_n_kg_ha
        - soil_p_kg_ha
        - soil_k_kg_ha
        - soil_ph
        - root_depth_cm
        - root_mass_g
        - root_density_g_cm3
      properties:
        record_id:
          type: string
          description: Unique identifier for the merged record
        species_name:
          type: string
          description: Scientific name of the plant species
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 latitude
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 longitude
        soil_n_kg_ha:
          type: number
          description: Soil Nitrogen in kg/ha (extracted from SoilGrids)
          exclusiveMinimum: 0
        soil_p_kg_ha:
          type: number
          description: Soil Phosphorus in kg/ha (extracted from SoilGrids)
          exclusiveMinimum: 0
        soil_k_kg_ha:
          type: number
          description: Soil Potassium in kg/ha (extracted from SoilGrids)
          exclusiveMinimum: 0
        soil_ph:
          type: number
          description: Soil pH value
          minimum: 3.0
          maximum: 9.0
        root_depth_cm:
          type: number
          description: Maximum root depth in cm
          exclusiveMinimum: 0
        root_mass_g:
          type: number
          description: Total root mass in grams
          exclusiveMinimum: 0
        root_density_g_cm3:
          type: number
          description: Root tissue density in g/cm3
          exclusiveMinimum: 0
        data_quality_flags:
          type: array
          items:
            type: string
          description: List of flags indicating data provenance or quality notes
          default: []

additionalProperties: false
examples:
  - properties:
      generated_at: "2023-10-27T10:00:00Z"
      source_soil_data: "SoilGrids 250m v2.0"
      source_trait_data: "TRY Database (Zenodo:10.5281/zenodo.12345)"
      filter_criteria:
        min_observations_per_species: 10
        valid_ph_range: [3.0, 9.0]
        valid_depth_range: [0.1, 200.0]
    records:
      - record_id: "REC-001"
        species_name: "Zea mays"
        latitude: 40.7128
        longitude: -74.0060
        soil_n_kg_ha: 150.5
        soil_p_kg_ha: 25.2
        soil_k_kg_ha: 180.0
        soil_ph: 6.5
        root_depth_cm: 120.0
        root_mass_g: 45.5
        root_density_g_cm3: 0.15
        data_quality_flags: ["verified_source"]