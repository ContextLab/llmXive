$schema: "http://json-schema.org/draft-07/schema#"
title: "Merged Root-Soil Dataset Schema"
description: "Schema for the merged dataset containing soil nutrients and root traits."
type: "object"
properties:
  pair_id:
    type: "string"
    description: "Unique identifier for the observation pair."
  latitude:
    type: "number"
    minimum: -90
    maximum: 90
    description: "WGS84 Latitude."
  longitude:
    type: "number"
    minimum: -180
    maximum: 180
    description: "WGS84 Longitude."
  nitrogen_mg_kg:
    type: "number"
    minimum: 0
    description: "Soil Nitrogen in mg/kg."
  phosphorus_mg_kg:
    type: "number"
    minimum: 0
    description: "Soil Phosphorus in mg/kg."
  potassium_mg_kg:
    type: "number"
    minimum: 0
    description: "Soil Potassium in mg/kg."
  ph:
    type: "number"
    minimum: 3.0
    maximum: 9.0
    description: "Soil pH."
  species_id:
    type: "string"
    description: "Species name (e.g., 'Zea mays')."
  root_depth_cm:
    type: "number"
    exclusiveMinimum: 0
    description: "Root depth in cm."
  branching_density:
    type: "number"
    minimum: 0
    description: "Branching density (roots/cm)."
  is_valid:
    type: "boolean"
    description: "Flag indicating if the record passed validation."
  is_complete_case:
    type: "boolean"
    description: "Flag indicating if the record has no missing soil data."
required:
  - pair_id
  - latitude
  - longitude
  - nitrogen_mg_kg
  - phosphorus_mg_kg
  - potassium_mg_kg
  - ph
  - species_id
  - root_depth_cm
  - branching_density
  - is_valid
  - is_complete_case
additionalProperties: false