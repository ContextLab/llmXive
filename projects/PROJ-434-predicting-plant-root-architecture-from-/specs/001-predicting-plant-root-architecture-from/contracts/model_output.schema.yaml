$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Output Schema"
description: |
  Schema for model performance metrics and validation results generated by the
  predictive root architecture pipeline. This schema enforces the data contract
  for User Story 2 outputs, ensuring consistency across training runs and
  compliance with Success Criteria SC-002 (Significance of Soil+Species model).

type: object
required:
  - experiment_id
  - timestamp
  - model_type
  - validation_method
  - metrics
  - sc002_status
additionalProperties: false

properties:
  experiment_id:
    type: string
    description: "Unique identifier for the training run (e.g., UUID or timestamp-hash)."
    pattern: "^[a-zA-Z0-9\\-_]+$"

  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of when the model was trained and evaluated."

  model_type:
    type: string
    enum:
      - "Model_A_SoilOnly"
      - "Model_B_SoilPlusSpecies"
    description: "Type of model trained according to FR-003."

  validation_method:
    type: string
    enum:
      - "StratifiedKFold_5"
      - "LOSO"
    description: "Cross-validation strategy used for evaluation."

  metrics:
    type: object
    description: "Performance metrics calculated on held-out test folds."
    required:
      - mean_r2
      - mean_rmse
      - std_r2
      - std_rmse
    properties:
      mean_r2:
        type: number
        description: "Mean R² score across all CV folds."
        minimum: -1.0
      mean_rmse:
        type: number
        description: "Mean Root Mean Squared Error across all CV folds."
        minimum: 0.0
      std_r2:
        type: number
        description: "Standard deviation of R² scores."
        minimum: 0.0
      std_rmse:
        type: number
        description: "Standard deviation of RMSE scores."
        minimum: 0.0
      baseline_mean_r2:
        type: number
        description: "Mean R² of the baseline (mean-prediction) model."
        minimum: -1.0
      delta_r2:
        type: number
        description: "Improvement over baseline (observed_r2 - baseline_r2)."

  sc002_status:
    type: object
    description: "Result of Success Criterion 002 check (Delta R² >= 0.05 AND p < 0.05)."
    required:
      - pass
      - reason
      - delta_r2
      - p_value
    properties:
      pass:
        type: boolean
        description: "True if SC-002 is satisfied."
      reason:
        type: string
        description: "Human-readable explanation of the pass/fail decision."
      delta_r2:
        type: number
        description: "Observed delta R² value used for the check."
      p_value:
        type: number
        description: "P-value from the permutation test."
        minimum: 0.0
        maximum: 1.0

  feature_importance:
    type: object
    description: "Optional summary of feature importance scores if generated."
    properties:
      top_features:
        type: array
        items:
          type: object
          properties:
            feature_name:
              type: string
            importance_score:
              type: number
            rank:
              type: integer
              minimum: 1
        description: "List of top N features sorted by importance."

  raw_artifact_paths:
    type: object
    description: "Filesystem paths to raw artifacts generated during this run."
    properties:
      model_pickle:
        type: string
        description: "Path to the serialized model file (.pkl)."
      metrics_json:
        type: string
        description: "Path to the detailed metrics JSON file."
      permutation_distribution_json:
        type: string
        description: "Path to the permutation test distribution data."
      feature_importance_csv:
        type: string
        description: "Path to the feature importance CSV file."