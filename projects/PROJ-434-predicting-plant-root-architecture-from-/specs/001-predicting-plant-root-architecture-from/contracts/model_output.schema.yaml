%YAML 1.2
---
$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: |
  Schema defining the structure of model output artifacts generated by the
  predictive modeling pipeline (User Story 2). This includes metrics,
  cross-validation scores, and validation statuses required for downstream
  reporting and analysis.

type: object
required:
  - model_a_r2
  - model_a_rmse
  - model_b_r2
  - model_b_rmse
  - mean_r2
  - mean_rmse
  - loso_r2_sd
  - per_target_metrics

properties:
  model_a_r2:
    type: number
    description: R² score for Model A (Soil-Only predictors)
    minimum: -1.0
    maximum: 1.0

  model_a_rmse:
    type: number
    description: Root Mean Squared Error for Model A
    minimum: 0.0

  model_b_r2:
    type: number
    description: R² score for Model B (Soil + Species predictors)
    minimum: -1.0
    maximum: 1.0

  model_b_rmse:
    type: number
    description: Root Mean Squared Error for Model B
    minimum: 0.0

  mean_r2:
    type: number
    description: Mean R² across both models
    minimum: -1.0
    maximum: 1.0

  mean_rmse:
    type: number
    description: Mean RMSE across both models
    minimum: 0.0

  loso_r2_sd:
    type: number
    description: Standard deviation of R² scores from Leave-One-Species-Out CV
    minimum: 0.0

  per_target_metrics:
    type: object
    description: Metrics broken down by target variable (Depth, Branching)
    required:
      - Depth
      - Branching
    properties:
      Depth:
        type: object
        required:
          - r2
          - rmse
        properties:
          r2:
            type: number
          rmse:
            type: number
      Branching:
        type: object
        required:
          - r2
          - rmse
        properties:
          r2:
            type: number
          rmse:
            type: number

  loso_fold_scores:
    type: object
    description: Per-fold R² scores for LOSO cross-validation
    required:
      - model_a
      - model_b
    properties:
      model_a:
        type: object
        required:
          - r2_scores
        properties:
          r2_scores:
            type: array
            items:
              type: number
            description: List of R² scores for each fold in Model A

      model_b:
        type: object
        required:
          - r2_scores
        properties:
          r2_scores:
            type: array
            items:
              type: number
            description: List of R² scores for each fold in Model B

  baseline_metrics:
    type: object
    description: Baseline model comparison metrics
    required:
      - mean_baseline_r2
      - delta_r2_model_a
      - delta_r2_model_b
    properties:
      mean_baseline_r2:
        type: number
      per_fold_baseline_r2:
        type: array
        items:
          type: number
      delta_r2_model_a:
        type: number
      delta_r2_model_b:
        type: number

  permutation_distributions:
    type: object
    description: Distributions of R² scores from permutation tests
    required:
      - model_a
      - model_b
    properties:
      model_a:
        type: object
        required:
          - r2_scores
        properties:
          r2_scores:
            type: array
            items:
              type: number
      model_b:
        type: object
        required:
          - r2_scores
        properties:
          r2_scores:
            type: array
            items:
              type: number

  sc002_status:
    type: object
    description: Compliance status for Scientific Claim 002
    required:
      - pass
      - reason
      - delta_r2
      - p_value
    properties:
      pass:
        type: boolean
      reason:
        type: string
      delta_r2:
        type: number
      p_value:
        type: number
        minimum: 0.0
        maximum: 1.0

  feature_importance:
    type: array
    description: List of feature importance scores
    items:
      type: object
      required:
        - feature_name
        - importance_score
      properties:
        feature_name:
          type: string
        importance_score:
          type: number

additionalProperties: false