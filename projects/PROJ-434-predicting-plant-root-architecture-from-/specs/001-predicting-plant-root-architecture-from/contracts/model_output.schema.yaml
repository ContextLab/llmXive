$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Output Schema"
description: >
  Schema for the primary model metrics and cross-validation results
  produced by the predictive modeling pipeline (User Story 2).
  This contract ensures that all model evaluation artifacts conform to
  the expected structure for downstream analysis and reporting.
type: object
required:
  - model_a_r2
  - model_a_rmse
  - model_b_r2
  - model_b_rmse
  - mean_r2
  - mean_rmse
  - loso_r2_sd
  - per_target_metrics
properties:
  model_a_r2:
    type: number
    description: "Leave-One-Species-Out (LOSO) R² score for Model A (Soil-Only predictors: N, P, K, pH)."
    minimum: -100.0
    maximum: 1.0
  model_a_rmse:
    type: number
    description: "LOSO Root Mean Squared Error for Model A (averaged across Depth and Branching targets)."
    minimum: 0.0
  model_b_r2:
    type: number
    description: "LOSO R² score for Model B (Soil + Species predictors: N, P, K, pH, Species)."
    minimum: -100.0
    maximum: 1.0
  model_b_rmse:
    type: number
    description: "LOSO RMSE for Model B (averaged across Depth and Branching targets)."
    minimum: 0.0
  mean_r2:
    type: number
    description: "Arithmetic mean of model_a_r2 and model_b_r2."
  mean_rmse:
    type: number
    description: "Arithmetic mean of model_a_rmse and model_b_rmse."
  loso_r2_sd:
    type: number
    description: "Standard deviation of the per-fold R² scores across the LOSO cross-validation."
    minimum: 0.0
  per_target_metrics:
    type: object
    description: "Breakdown of metrics for each specific target variable."
    required:
      - depth
      - branching
    properties:
      depth:
        type: object
        required:
          - model_a_r2
          - model_a_rmse
          - model_b_r2
          - model_b_rmse
        properties:
          model_a_r2:
            type: number
          model_a_rmse:
            type: number
          model_b_r2:
            type: number
          model_b_rmse:
            type: number
      branching:
        type: object
        required:
          - model_a_r2
          - model_a_rmse
          - model_b_r2
          - model_b_rmse
        properties:
          model_a_r2:
            type: number
          model_a_rmse:
            type: number
          model_b_r2:
            type: number
          model_b_rmse:
            type: number
  baseline_comparison:
    type: object
    description: "Metrics comparing model performance against a mean-prediction baseline."
    required:
      - mean_baseline_r2
      - delta_r2_model_a
      - delta_r2_model_b
    properties:
      mean_baseline_r2:
        type: number
        description: "R² score of the null model (predicting the mean of training targets)."
      delta_r2_model_a:
        type: number
        description: "Difference: model_a_r2 - mean_baseline_r2."
      delta_r2_model_b:
        type: number
        description: "Difference: model_b_r2 - mean_baseline_r2."
  sc002_compliance:
    type: object
    description: "Status of compliance with Specification Constraint SC-002 (Significance of Soil Features)."
    required:
      - pass
      - reason
      - p_value
    properties:
      pass:
        type: boolean
        description: "True if delta_r2 >= 0.05 AND p_value < 0.05."
      reason:
        type: string
        description: "Human-readable explanation of the compliance status."
      p_value:
        type: number
        description: "P-value derived from the permutation test distribution."
        minimum: 0.0
        maximum: 1.0
  metadata:
    type: object
    description: "Run metadata for reproducibility."
    properties:
      timestamp:
        type: string
        format: date-time
      random_seed:
        type: integer
      software_versions:
        type: object
        properties:
          python:
            type: string
          scikit_learn:
            type: string
          pandas:
            type: string
          numpy:
            type: string
additionalProperties: false