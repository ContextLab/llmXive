$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: >
  Schema for the primary model metrics output artifact (artifacts/model_metrics.json).
  This schema defines the structure of the results produced by the Leave-One-Species-Out
  (LOSO) and Stratified k-Fold cross-validation pipelines as specified in User Story 2.
type: object
required:
  - mean_r2
  - mean_rmse
  - loso_r2_sd
  - per_target_metrics
properties:
  mean_r2:
    type: number
    description: >
      The mean R² score across all cross-validation folds for the primary target variable.
      Calculated as the average of R² scores from the held-out test sets.
  mean_rmse:
    type: number
    description: >
      The mean Root Mean Squared Error (RMSE) across all cross-validation folds
      for the primary target variable.
  loso_r2_sd:
    type: number
    description: >
      The standard deviation of the R² scores across the Leave-One-Species-Out folds.
      Used to assess the stability of the model performance across different species.
  per_target_metrics:
    type: object
    description: >
      Detailed metrics broken down by specific target variables (e.g., root depth, root mass).
      Allows for multi-target evaluation if the model predicts multiple root architecture traits.
    additionalProperties:
      type: object
      required:
        - loso_mean_r2
        - loso_mean_rmse
        - stratified_cv_mean_r2
        - stratified_cv_mean_rmse
        - baseline_r2
        - delta_r2
      properties:
        loso_mean_r2:
          type: number
          description: Mean R² from Leave-One-Species-Out CV for this target.
        loso_mean_rmse:
          type: number
          description: Mean RMSE from Leave-One-Species-Out CV for this target.
        stratified_cv_mean_r2:
          type: number
          description: Mean R² from Stratified 5-Fold CV for this target.
        stratified_cv_mean_rmse:
          type: number
          description: Mean RMSE from Stratified 5-Fold CV for this target.
        baseline_r2:
          type: number
          description: >
            R² score of the mean-prediction null model for this target.
            Used as a baseline for comparison.
        delta_r2:
          type: number
          description: >
            The difference between the model's R² and the baseline R² (observed_r2 - baseline_r2).
            Used to validate SC-002 compliance.
  model_info:
    type: object
    description: Metadata about the model configuration and training run.
    required:
      - model_type
      - hyperparameters
      - validation_strategy
      - random_seed
    properties:
      model_type:
        type: string
        enum:
          - RandomForestRegressor
          - GradientBoostingRegressor
          - LinearRegression
        description: The type of machine learning model used.
      hyperparameters:
        type: object
        description: The specific hyperparameters used for the model.
      validation_strategy:
        type: string
        enum:
          - LOSO
          - StratifiedKFold
        description: The primary validation strategy employed.
      random_seed:
        type: integer
        description: The random seed used for reproducibility.
  timestamps:
    type: object
    description: Timestamps for the generation of this artifact.
    required:
      - generated_at
    properties:
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when this file was generated.

examples:
  - mean_r2: 0.45
    mean_rmse: 12.3
    loso_r2_sd: 0.08
    per_target_metrics:
      root_depth:
        loso_mean_r2: 0.45
        loso_mean_rmse: 12.3
        stratified_cv_mean_r2: 0.52
        stratified_cv_mean_rmse: 10.1
        baseline_r2: 0.02
        delta_r2: 0.43
    model_info:
      model_type: RandomForestRegressor
      hyperparameters:
        n_estimators: 100
        max_depth: 10
        min_samples_split: 5
      validation_strategy: LOSO
      random_seed: 42
    timestamps:
      generated_at: "2023-10-27T10:00:00Z"