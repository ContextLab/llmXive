$schema: "http://json-schema.org/draft-07/schema#"
title: SensitivityReport
description: Schema for sensitivity analysis report on regression start times.
type: object
required:
  - solvent
  - timescale
  - total_trajectory_length
  - start_time_fractions
  - results
  - variance_percentage
  - variance_passed
  - timestamp
properties:
  solvent:
    type: string
    description: Name of the solvent
    enum:
      - water
      - ethanol
      - acetone
  timescale:
    type: string
    description: Simulation duration
  total_trajectory_length:
    type: number
    description: Total trajectory length in nanoseconds
  start_time_fractions:
    type: array
    items:
      type: number
    description: List of start time fractions swept (e.g., [0.1, 0.2, 0.3])
    minItems: 1
  results:
    type: array
    items:
      type: object
      required:
        - start_fraction
        - diffusion_coefficient
        - r_squared
      properties:
        start_fraction:
          type: number
          description: Fraction of trajectory used as start time
        diffusion_coefficient:
          type: number
          description: Calculated diffusion coefficient at this start time
        r_squared:
          type: number
          description: R² value for the linear fit at this start time
  variance_percentage:
    type: number
    description: Variance of diffusion coefficients across start times, expressed as a percentage of the mean
  variance_passed:
    type: boolean
    description: True if variance_percentage < 5% (threshold defined in spec.md SC-003)
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the analysis was performed
  metadata:
    type: object
    description: Additional metadata
    additionalProperties: true
