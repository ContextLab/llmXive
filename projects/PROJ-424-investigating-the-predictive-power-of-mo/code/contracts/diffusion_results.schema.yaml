$schema: "http://json-schema.org/draft-07/schema#"
title: DiffusionResults
description: Schema for diffusion coefficient analysis results generated by MSD analysis.
type: object
required:
  - solvent
  - timescale
  - diffusion_coefficient
  - r_squared
  - linear_regression_params
  - timestamp
properties:
  solvent:
    type: string
    description: Name of the solvent (e.g., 'water', 'ethanol', 'acetone')
    enum:
      - water
      - ethanol
      - acetone
  timescale:
    type: string
    description: Simulation duration (e.g., '1ns', '5ns', '10ns')
  diffusion_coefficient:
    type: object
    required:
      - value
      - unit
    properties:
      value:
        type: number
        description: Diffusion coefficient value in m²/s
      unit:
        type: string
        const: "m²/s"
  r_squared:
    type: number
    description: R² value from linear regression of MSD vs time. Must be >= 0.95 per Constitution Principle VI and spec.md FR-008.
    minimum: 0.0
    maximum: 1.0
  linear_regression_params:
    type: object
    required:
      - slope
      - intercept
      - std_err
    properties:
      slope:
        type: number
        description: Slope of the MSD vs time fit (m²/s)
      intercept:
        type: number
        description: Intercept of the fit
      std_err:
        type: number
        description: Standard error of the slope
  scaling_factor_applied:
    type: number
    description: Solvent-specific scaling factor applied to the raw diffusion coefficient
  validation_status:
    type: string
    enum:
      - passed
      - failed
    description: Whether the linearity check (R² >= 0.95) passed
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the analysis was performed
  source_files:
    type: array
    items:
      type: string
    description: List of source trajectory/topology files used
  metadata:
    type: object
    description: Additional metadata (force field, temperature, etc.)
    additionalProperties: true
