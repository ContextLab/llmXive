$schema: http://json-schema.org/draft-07/schema#
title: Sensitivity Report
description: >
  Schema for the sensitivity analysis report generated by T021.
  This report captures the stability of diffusion coefficient estimates
  across different regression start times (fractions of trajectory length).
type: object
required:
  - report_id
  - generated_at
  - solvent
  - trajectory_duration_ns
  - sweep_parameters
  - results
  - variance_percent
  - passes_threshold
properties:
  report_id:
    type: string
    description: Unique identifier for this sensitivity report run.
    example: "sens_water_10ns_20231027_143022"
  generated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the report was generated.
  solvent:
    type: string
    description: The solvent analyzed (e.g., water, ethanol, acetone).
    enum:
      - water
      - ethanol
      - acetone
  trajectory_duration_ns:
    type: number
    description: Total duration of the trajectory analyzed in nanoseconds.
    minimum: 0
  sweep_parameters:
    type: object
    description: Configuration of the sensitivity sweep.
    required:
      - start_fractions
      - end_fraction
      - step_fraction
    properties:
      start_fractions:
        type: array
        items:
          type: number
        description: List of start time fractions used for the sweep (e.g., [0.1, 0.2, 0.3]).
      end_fraction:
        type: number
        description: The end fraction of the trajectory used for regression.
      step_fraction:
        type: number
        description: The step size between start fractions (if applicable).
  results:
    type: array
    description: List of sensitivity points, one for each start time fraction.
    items:
      $ref: "#/definitions/SensitivityPoint"
  variance_percent:
    type: number
    description: >
      Calculated variance (coefficient of variation * 100) of the diffusion
      coefficients across all start times.
    minimum: 0
  passes_threshold:
    type: boolean
    description: >
      True if variance_percent is less than or equal to 5.0 (per spec.md SC-003).
      False otherwise.
  notes:
    type: string
    description: Optional notes regarding the analysis or data quality.

definitions:
  SensitivityPoint:
    type: object
    description: A single data point in the sensitivity sweep.
    required:
      - start_fraction
      - start_time_ns
      - diffusion_coefficient_m2_s
      - r_squared
      - standard_error
    properties:
      start_fraction:
        type: number
        description: The fraction of the trajectory used as the start time.
        minimum: 0
        maximum: 1
      start_time_ns:
        type: number
        description: The actual start time in nanoseconds (fraction * total_duration).
        minimum: 0
      diffusion_coefficient_m2_s:
        type: number
        description: Calculated diffusion coefficient in m²/s.
        minimum: 0
      r_squared:
        type: number
        description: R² value from the linear regression of MSD vs time.
        minimum: 0
        maximum: 1
      standard_error:
        type: number
        description: Standard error of the slope from linear regression.
        minimum: 0