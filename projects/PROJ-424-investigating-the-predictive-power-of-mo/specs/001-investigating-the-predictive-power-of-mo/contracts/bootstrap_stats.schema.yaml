$schema: "http://json-schema.org/draft-07/schema#"
title: "Bootstrap Statistics Schema"
description: "Schema for data/processed/bootstrap_stats.json"
type: "object"
properties:
  duration_ns:
    type: "number"
    enum: [1.0, 5.0, 10.0]
  iterations:
    type: "integer"
    minimum: 100
    maximum: 1000
    description: "Number of bootstrap iterations. 1000 default, 100 fallback if time > 5.5h."
  mean_mae:
    type: "number"
    minimum: 0
  ci_lower:
    type: "number"
    minimum: 0
  ci_upper:
    type: "number"
    minimum: 0
  convergence_check:
    type: "boolean"
    description: "True if all trajectories for this duration met R2 >= 0.95."
  n_seeds:
    type: "integer"
    minimum: 1
    description: "Number of seeds used for this duration. 5 (target) or 3 (fallback)."
required:
  - duration_ns
  - iterations
  - mean_mae
  - ci_lower
  - ci_upper
  - convergence_check
  - n_seeds
additionalProperties: false