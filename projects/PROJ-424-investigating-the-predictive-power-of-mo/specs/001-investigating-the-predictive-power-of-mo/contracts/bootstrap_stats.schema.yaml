$schema: "http://json-schema.org/draft-07/schema#"
title: "Bootstrap Statistics Schema"
description: "Schema for data/processed/bootstrap_stats.json"
type: "object"
properties:
  duration_ns:
    type: "number"
    enum: [1, 5, 10]
  iterations:
    type: "integer"
    minimum: 1000
    maximum: 1000
    description: "Number of bootstrap iterations. Fixed at 1000 as required by FR‑004."
  mean_mae:
    type: "number"
    minimum: 0
  ci_lower:
    type: "number"
    minimum: 0
  ci_upper:
    type: "number"
    minimum: 0
  convergence_check:
    type: "boolean"
    description: "True if all trajectories for this duration met R2 >= 0.95."
  n_seeds:
    type: "integer"
    minimum: 1
    description: "Number of seeds used for this duration (target 5)."
required:
  - duration_ns
  - iterations
  - mean_mae
  - ci_lower
  - ci_upper
  - convergence_check
  - n_seeds
additionalProperties: false