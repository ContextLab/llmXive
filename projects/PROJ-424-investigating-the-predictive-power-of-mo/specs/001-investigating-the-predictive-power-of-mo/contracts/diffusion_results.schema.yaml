$schema: "http://json-schema.org/draft-07/schema#"
title: "Diffusion Results Schema"
description: "Schema for one row of data/processed/diffusion_results.csv (validated as JSON objects after CSV parsing)"
type: "object"
properties:
  solvent:
    type: "string"
    enum: ["water", "ethanol", "acetone"]
  duration_ns:
    type: "number"
    enum: [1, 5, 10]
  seed:
    type: "integer"
    minimum: 0
  msd_slope:
    type: "number"
    minimum: 0
  r_squared:
    type: "number"
    minimum: 0
    maximum: 1
    description: "R-squared of the MSD linear fit; accepted rows must be >= 0.95 (FR-003, Constitution VI)."
  d_calc_m2_s:
    type: "number"
    minimum: 0
  d_scaled_m2_s:
    type: "number"
    minimum: 0
    description: "Equals d_calc_m2_s; no CG scaling applied in atomistic workflow (spec section 6)."
  mae:
    type: "number"
    minimum: 0
    description: "Absolute error |D_sim - D_exp| for this trajectory."
  status:
    type: "string"
    enum: ["accepted", "convergence_failed"]
required:
  - solvent
  - duration_ns
  - seed
  - msd_slope
  - r_squared
  - d_calc_m2_s
  - d_scaled_m2_s
  - mae
  - status
additionalProperties: false