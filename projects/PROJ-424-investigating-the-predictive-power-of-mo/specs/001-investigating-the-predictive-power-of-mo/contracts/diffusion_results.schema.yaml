$schema: "http://json-schema.org/draft-07/schema#"
title: "Diffusion Results Schema"
description: "Schema for data/processed/diffusion_results.csv"
type: "object"
properties:
  solvent:
    type: "string"
    enum:
      - "water"
      - "ethanol"
      - "acetone"
  duration_ns:
    type: "number"
    minimum: 1.0
    maximum: 10.0
  seed:
    type: "integer"
    minimum: 0
  msd_slope:
    type: "number"
    minimum: 0
  r_squared:
    type: "number"
    minimum: 0.95
    maximum: 1.0
    description: "R-squared value of the linear fit. Must be >= 0.95 per Constitution Principle VI."
  d_calc_m2_s:
    type: "number"
    minimum: 0
  d_scaled_m2_s:
    type: "number"
    minimum: 0
  mae:
    type: "number"
    minimum: 0
  status:
    type: "string"
    enum:
      - "accepted"
      - "convergence_failed"
required:
  - solvent
  - duration_ns
  - r_squared
  - d_calc_m2_s
  - mae
  - status
additionalProperties: false