type: object
description: Configuration schema for the entire analysis pipeline.
properties:
  random_seed:
    type: integer
    description: Seed for all random number generators.
  clone_thresholds:
    type: array
    description: List of clone‑density thresholds used in sensitivity analysis.
    items:
      type: number
  memory_limit_mb:
    type: integer
    description: Maximum memory usage allowed for the pipeline (MB).
  max_runtime_seconds:
    type: integer
    description: Upper bound on total runtime (seconds).
  min_valid_segments:
    type: integer
    description: Minimum number of code segments required for a valid analysis.
  correlation_method:
    type: string
    description: Method used for correlation (e.g., "spearman").
  significance_threshold:
    type: number
    description: P‑value threshold for statistical significance.
  figure_format:
    type: string
    description: File format for generated figures (e.g., "png" or "pdf").
  figure_dpi:
    type: integer
    description: DPI resolution for saved figures.
  checksum_algorithm:
    type: string
    description: Algorithm used for artifact checksum computation (e.g., "sha256").
  dataset_name:
    type: string
    description: Identifier of the source dataset (e.g., "codeparrot/github-code").
  model_name:
    type: string
    description: HuggingFace model identifier used for perplexity computation.
  quantization_bits:
    type: integer
    description: Number of bits for model quantization (e.g., 8).
  streaming_enabled:
    type: boolean
    description: Whether dataset streaming mode is enabled.
  pii_scan_enabled:
    type: boolean
    description: Whether PII scanning is performed on the dataset.
required:
  - random_seed
  - clone_thresholds
  - memory_limit_mb
  - max_runtime_seconds
  - min_valid_segments
  - correlation_method
  - significance_threshold
  - figure_format
  - figure_dpi
  - checksum_algorithm
  - dataset_name
  - model_name
  - quantization_bits
  - streaming_enabled
  - pii_scan_enabled
additionalProperties: false