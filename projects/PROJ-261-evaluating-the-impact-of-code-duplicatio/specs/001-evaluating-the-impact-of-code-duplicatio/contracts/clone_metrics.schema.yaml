type: object
description: Schema for clone density metrics per file.
properties:
  file_path:
    type: string
    description: Relative path to the source file within the dataset.
  clone_density:
    type: number
    description: Proportion of code that participates in clones (0.0 – 1.0).
required:
  - file_path
  - clone_density
additionalProperties: false
