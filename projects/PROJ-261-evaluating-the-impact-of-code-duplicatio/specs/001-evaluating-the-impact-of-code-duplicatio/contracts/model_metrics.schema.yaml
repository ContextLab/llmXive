type: object
description: Schema for model perplexity metrics per file.
properties:
  file_path:
    type: string
    description: Relative path to the source file within the dataset.
  perplexity:
    type: number
    description: Token‑level perplexity computed by the language model.
required:
  - file_path
  - perplexity
additionalProperties: false
