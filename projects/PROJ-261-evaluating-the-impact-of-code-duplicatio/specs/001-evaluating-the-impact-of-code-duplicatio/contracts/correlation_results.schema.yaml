type: object
description: Schema for correlation analysis results.
properties:
  metric:
    type: string
    description: Name of the metric pair being correlated (e.g., "clone_vs_perplexity").
  spearman_coefficient:
    type: number
    description: Spearman rank correlation coefficient.
  p_value:
    type: number
    description: Two‑tailed p‑value for the correlation.
required:
  - metric
  - spearman_coefficient
  - p_value
additionalProperties: false
