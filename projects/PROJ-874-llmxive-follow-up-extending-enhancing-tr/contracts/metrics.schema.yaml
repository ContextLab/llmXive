%YAML 1.2
---
$schema: http://json-schema.org/draft-07/schema#
title: llmXive Metrics Schema
description: >
  Schema defining the structure of evaluation metrics computed for the
  llmXive follow-up study (VBench, FVD, Object Permanence).
type: object
required:
  - experiment_id
  - timestamp
  - metrics
properties:
  experiment_id:
    type: string
    description: Unique identifier for the experiment run
    pattern: '^[a-zA-Z0-9_-]+$'
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp when metrics were computed
  mode:
    type: string
    description: Generation mode (baseline-full, baseline-naive, corrected)
    enum:
      - baseline-full
      - baseline-naive
      - corrected
  video_id:
    type: string
    description: ID of the video being evaluated
  metrics:
    type: object
    required:
      - vbench_score
      - fvd
      - object_permanence
    properties:
      vbench_score:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Overall VBench consistency score
      vbench_details:
        type: object
        description: Breakdown of VBench sub-metrics
        properties:
          subject_consistency:
            type: number
          background_consistency:
            type: number
          motion_smoothness:
            type: number
          temporal_flickering:
            type: number
      fvd:
        type: number
        description: Fréchet Video Distance (lower is better)
      object_permanence:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Score indicating object retention over occlusion
      generation_time_seconds:
        type: number
        minimum: 0
        description: Wall-clock time for generation
      peak_memory_mb:
        type: number
        minimum: 0
        description: Peak RSS memory usage during generation
  statistical_summary:
    type: object
    description: Optional statistical aggregation if multiple runs exist
    properties:
      mean_vbench:
        type: number
      std_vbench:
        type: number
      mean_fvd:
        type: number
      std_fvd:
        type: number
      n_samples:
        type: integer
        minimum: 1
      p_value:
        type: number
        minimum: 0.0
        maximum: 1.0
      test_type:
        type: string
        enum:
          - t-test
          - wilcoxon
          - shapiro-wilk
      power:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Statistical power of the test
additionalProperties: false