$schema: http://json-schema.org/draft-07/schema#
title: LlmXive Metrics Schema
description: |
  Schema defining the structure and validation rules for metric
  results generated by the LlmXive evaluation pipeline.
type: object
required:
  - experiment_id
  - timestamp
  - metrics
  - statistical_analysis
properties:
  experiment_id:
    type: string
    description: "Unique identifier for the experiment run"
    pattern: "^[a-zA-Z0-9_-]+$"
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of when metrics were computed"
  video_id:
    type: string
    description: "Identifier for the video being evaluated"
  condition:
    type: string
    enum:
      - baseline-naive
      - baseline-full
      - flow-corrected
    description: "Experimental condition under which the video was generated"
  metrics:
    type: object
    description: "Collection of computed metrics"
    required:
      - vbench_score
      - fvd
      - object_permanence
    properties:
      vbench_score:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "VBench consistency score (0-1)"
      fvd:
        type: number
        minimum: 0.0
        description: "Fréchet Video Distance (lower is better)"
      object_permanence:
        type: number
        minimum: 0.0
        maximum: 100.0
        description: "Object permanence score (percentage)"
      wall_clock_time_seconds:
        type: number
        minimum: 0.0
        description: "Total end-to-end wall-clock time in seconds"
      peak_memory_mb:
        type: number
        minimum: 0.0
        description: "Peak memory usage in MB"
      frame_count:
        type: integer
        minimum: 0
        description: "Number of frames in the video"
      resolution:
        type: object
        properties:
          width:
            type: integer
            minimum: 1
          height:
            type: integer
            minimum: 1
      artifacts_detected:
        type: boolean
        description: "Whether tearing or other artifacts were detected"
      artifact_details:
        type: array
        items:
          type: object
          properties:
            frame_index:
              type: integer
            artifact_type:
              type: string
            severity:
              type: string
              enum:
                - low
                - medium
                - high
  statistical_analysis:
    type: object
    description: "Results of statistical tests comparing conditions"
    properties:
      normality_test:
        type: object
        properties:
          test_name:
            type: string
            enum:
              - shapiro-wilk
            description: "Name of the normality test performed"
          p_value:
            type: number
            minimum: 0.0
            maximum: 1.0
          is_normal:
            type: boolean
            description: "True if p >= 0.05 (fail to reject null hypothesis)"
      comparative_test:
        type: object
        properties:
          test_name:
            type: string
            enum:
              - wilcoxon-signed-rank
              - paired-t-test
            description: "Name of the comparative test performed"
          statistic:
            type: number
          p_value:
            type: number
            minimum: 0.0
            maximum: 1.0
          significant_at_005:
            type: boolean
            description: "True if p < 0.05"
      power_analysis:
        type: object
        properties:
          calculated_power:
            type: number
            minimum: 0.0
            maximum: 1.0
          sample_size:
            type: integer
            minimum: 1
          effect_size:
            type: number
          sufficient:
            type: boolean
            description: "True if power >= 0.8"
  failure_case_flags:
    type: object
    description: "Flags indicating if this video is a failure case"
    properties:
      is_failure_case:
        type: boolean
      reason:
        type: string
        enum:
          - object_permanence_drop
          - vbench_score_drop
          - artifact_severe
        description: "Reason for flagging as failure case"
      drop_percentage:
        type: number
        description: "Percentage drop compared to naive baseline"
  notes:
    type: string
    description: "Additional notes about the metric computation"
additionalProperties: false