$schema: "http://json-schema.org/draft-07/schema#"
title: "llmXive Metrics Report"
description: "Schema for metrics reports generated during evaluation and analysis."
type: object
required:
  - video_id
  - condition
  - metrics
  - timestamp
properties:
  video_id:
    type: string
    description: "Unique identifier for the video"
  condition:
    type: string
    enum:
      - "baseline-full"
      - "baseline-naive"
      - "corrected"
    description: "The experimental condition under which the video was generated"
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of when the metrics were calculated"
  metrics:
    type: object
    description: "Dictionary of metric names to their values"
    properties:
      vbench_score:
        type: number
        minimum: 0
        maximum: 1
        description: "VBench overall score"
      fvd:
        type: number
        description: "Frechet Video Distance (lower is better)"
      object_permanence:
        type: number
        minimum: 0
        maximum: 1
        description: "Object permanence score"
      inference_time_seconds:
        type: number
        minimum: 0
        description: "Time taken for inference in seconds"
      total_wall_clock_time:
        type: string
        format: date-time
        description: "Total wall clock time for the process (ISO 8601 duration or timestamp)"
      flow_estimation_time:
        type: number
        minimum: 0
        description: "Time taken for optical flow estimation in seconds"
      memory_peak_mb:
        type: number
        minimum: 0
        description: "Peak memory usage in MB"
    additionalProperties:
      type: number
      description: "Allow other numeric metrics"
  failures:
    type: array
    description: "List of any failures or warnings encountered during metric calculation"
    items:
      type: object
      properties:
        type:
          type: string
          description: "Type of failure (e.g., 'timeout', 'oom', 'invalid_input')"
        message:
          type: string
          description: "Human-readable error message"
        frame_idx:
          type: integer
          minimum: 0
          description: "Frame index where failure occurred (if applicable)"
additionalProperties: false
