%YAML 1.2
---
$schema: http://json-schema.org/draft-07/schema#
title: LlmXive Metrics Schema
description: >
  Schema defining the structure for evaluation metrics (VBench, FVD, Object Permanence)
  and statistical analysis results.
type: object
required:
  - experiment_id
  - timestamp
  - metrics
  - statistical_analysis
properties:
  experiment_id:
    type: string
    description: Unique identifier for the experiment run
  timestamp:
    type: string
    description: ISO 8601 timestamp of the evaluation
    format: date-time
  mode:
    type: string
    description: Generation mode used (baseline-full, baseline-naive, corrected)
    enum:
      - baseline-full
      - baseline-naive
      - corrected
  video_id:
    type: string
    description: ID of the video being evaluated
  metrics:
    type: object
    description: Dictionary of calculated metrics
    required:
      - vbench_score
      - fvd
      - object_permanence
      - wall_clock_time
    properties:
      vbench_score:
        type: number
        description: VBench consistency score (0.0 to 1.0)
        minimum: 0.0
        maximum: 1.0
      fvd:
        type: number
        description: Frechet Video Distance (lower is better)
        minimum: 0.0
      object_permanence:
        type: number
        description: Object permanence score (0.0 to 1.0)
        minimum: 0.0
        maximum: 1.0
      wall_clock_time:
        type: number
        description: Total wall-clock time in seconds
        minimum: 0.0
      memory_peak_mb:
        type: number
        description: Peak memory usage in MB (optional)
        minimum: 0.0
  statistical_analysis:
    type: object
    description: Results of statistical tests comparing modes
    properties:
      normality_test:
        type: object
        properties:
          method:
            type: string
            enum:
              - shapiro-wilk
          p_value:
            type: number
            minimum: 0.0
            maximum: 1.0
          is_normal:
            type: boolean
      comparative_test:
        type: object
        properties:
          method:
            type: string
            enum:
              - wilcoxon-signed-rank
              - paired-t-test
          statistic:
            type: number
          p_value:
            type: number
            minimum: 0.0
            maximum: 1.0
          is_significant:
            type: boolean
          alpha:
            type: number
            default: 0.05
      power_analysis:
        type: object
        properties:
          calculated_power:
            type: number
            minimum: 0.0
            maximum: 1.0
          is_sufficient:
            type: boolean
          sample_size:
            type: integer
            minimum: 1
      failure_cases:
        type: array
        description: List of videos flagged as failure cases
        items:
          type: object
          required:
            - video_id
            - failure_reason
          properties:
            video_id:
              type: string
            failure_reason:
              type: string
              enum:
                - object_permanence_drop
                - vbench_score_drop
                - tearing_artifact
                - flow_estimation_failed
            severity:
              type: string
              enum:
                - minor
                - moderate
                - severe
  notes:
    type: string
    description: Optional notes about the evaluation
additionalProperties: false