$schema: "http://json-schema.org/draft-07/schema#"
title: "llmXive Dataset Manifest"
description: "Schema for dataset manifest files used to track downloaded datasets, checksums, and metadata."
type: object
required:
  - dataset_name
  - version
  - source
  - files
  - checksums
  - created_at
properties:
  dataset_name:
    type: string
    description: "Name of the dataset (e.g., 'NarrLV', 'VBench')"
    pattern: "^[a-zA-Z0-9_-]+$"
  version:
    type: string
    description: "Version string of the dataset"
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  source:
    type: string
    description: "Source identifier (e.g., HuggingFace dataset ID, URL)"
  created_at:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of when the dataset was downloaded/verified"
  files:
    type: array
    description: "List of files included in the dataset"
    items:
      type: object
      required:
        - path
        - size_bytes
        - relative_path
      properties:
        path:
          type: string
          description: "Absolute path to the file on disk"
        relative_path:
          type: string
          description: "Path relative to the dataset root"
        size_bytes:
          type: integer
          minimum: 0
          description: "File size in bytes"
  checksums:
    type: object
    description: "Mapping of file relative paths to their checksums"
    additionalProperties:
      type: object
      required:
        - md5
        - sha256
      properties:
        md5:
          type: string
          pattern: "^[a-f0-9]{32}$"
          description: "MD5 hash of the file (lowercase hex)"
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: "SHA256 hash of the file (lowercase hex)"
additionalProperties: false
