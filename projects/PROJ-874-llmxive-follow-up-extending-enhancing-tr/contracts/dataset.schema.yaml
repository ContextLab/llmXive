%YAML 1.2
---
$schema: http://json-schema.org/draft-07/schema#
title: llmXive Dataset Schema
description: >
  Schema defining the structure of the raw and processed datasets used in the
  llmXive follow-up study (NarrLV and VBench).
type: object
required:
  - dataset_name
  - version
  - source
  - records
properties:
  dataset_name:
    type: string
    description: Name of the dataset (e.g., "NarrLV", "VBench")
    enum:
      - NarrLV
      - VBench
  version:
    type: string
    description: Semantic version of the dataset snapshot
    pattern: '^\d+\.\d+\.\d+$'
  source:
    type: string
    description: Original source URL or HuggingFace ID
    format: uri
  download_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the dataset was downloaded
  checksum:
    type: object
    required:
      - algorithm
      - value
    properties:
      algorithm:
        type: string
        enum:
          - sha256
          - md5
      value:
        type: string
        description: Hexadecimal checksum string
  records:
    type: array
    description: List of video records in the dataset
    items:
      type: object
      required:
        - video_id
        - file_path
        - duration_seconds
        - frame_count
        - resolution
        - fps
      properties:
        video_id:
          type: string
          description: Unique identifier for the video
        file_path:
          type: string
          description: Relative path to the video file from data/raw/
          pattern: '^data/raw/.*\.(mp4|avi|mov|mkv)$'
        duration_seconds:
          type: number
          minimum: 0
          description: Duration in seconds
        frame_count:
          type: integer
          minimum: 1
          description: Total number of frames
        resolution:
          type: object
          required:
            - width
            - height
          properties:
            width:
              type: integer
              minimum: 1
            height:
              type: integer
              minimum: 1
        fps:
          type: number
          minimum: 0.1
          description: Frames per second
        metadata:
          type: object
          description: Optional additional metadata (e.g., prompt, seed)
          additionalProperties: true
additionalProperties: false
