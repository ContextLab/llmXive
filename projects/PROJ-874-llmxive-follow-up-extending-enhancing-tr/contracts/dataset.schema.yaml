%YAML 1.2
---
$schema: http://json-schema.org/draft-07/schema#
title: LlmXive Dataset Schema
description: >
  Schema defining the structure and constraints for the NarrLV and VBench datasets
  used in the llmXive pipeline.
type: object
required:
  - dataset_name
  - version
  - source
  - samples
properties:
  dataset_name:
    type: string
    description: Name of the dataset (e.g., "NarrLV", "VBench")
    enum:
      - NarrLV
      - VBench
  version:
    type: string
    description: Semantic version of the dataset
    pattern: '^\d+\.\d+\.\d+$'
  source:
    type: string
    description: Source identifier (HuggingFace ID or URL)
  download_status:
    type: string
    description: Status of the dataset download
    enum:
      - pending
      - downloading
      - verified
      - failed
      - missing
  checksum:
    type: string
    description: SHA-256 checksum of the downloaded archive
    pattern: '^[a-f0-9]{64}$'
  samples:
    type: array
    description: List of sample entries in the dataset
    minItems: 1
    items:
      type: object
      required:
        - sample_id
        - video_path
        - prompt
        - metadata
      properties:
        sample_id:
          type: string
          description: Unique identifier for the sample
        video_path:
          type: string
          description: Relative path to the video file
          pattern: '^data/raw/.+\.mp4$'
        prompt:
          type: string
          description: Text prompt associated with the video
        metadata:
          type: object
          description: Additional metadata for the sample
          properties:
            duration_seconds:
              type: number
              minimum: 0
            resolution:
              type: string
              description: Video resolution (e.g., "1920x1080")
              pattern: '^\d+x\d+$'
            fps:
              type: integer
              minimum: 1
            frame_count:
              type: integer
              minimum: 1
          additionalProperties: true
additionalProperties: false
