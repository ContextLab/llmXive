$schema: http://json-schema.org/draft-07/schema#
title: LlmXive Dataset Schema
description: |
  Schema defining the structure and validation rules for dataset files
  used in the LlmXive video generation pipeline.
type: object
required:
  - dataset_name
  - version
  - source
  - files
  - checksums
  - metadata
properties:
  dataset_name:
    type: string
    description: "Name of the dataset (e.g., 'NarrLV', 'VBench')"
    pattern: "^[A-Za-z0-9_-]+$"
  version:
    type: string
    description: "Semantic version of the dataset"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  source:
    type: string
    description: "URL or identifier of the data source (e.g., HuggingFace dataset ID)"
    minLength: 1
  files:
    type: array
    description: "List of required files in the dataset"
    minItems: 1
    items:
      type: object
      required:
        - path
        - type
        - size_bytes
      properties:
        path:
          type: string
          description: "Relative path to the file within the dataset"
        type:
          type: string
          enum:
            - video
            - audio
            - text
            - metadata
            - index
          description: "Type of the file"
        size_bytes:
          type: integer
          minimum: 0
          description: "File size in bytes"
        frame_count:
          type: integer
          minimum: 0
          description: "Number of frames (only for video files)"
        duration_seconds:
          type: number
          minimum: 0
          description: "Duration in seconds (only for video files)"
  checksums:
    type: object
    description: "SHA-256 checksums for each file to ensure integrity"
    additionalProperties:
      type: string
      pattern: "^[a-f0-9]{64}$"
      description: "SHA-256 hash of the file"
  metadata:
    type: object
    description: "Additional dataset metadata"
    properties:
      total_videos:
        type: integer
        minimum: 0
      total_frames:
        type: integer
        minimum: 0
      average_duration:
        type: number
        minimum: 0
      resolution:
        type: object
        properties:
          width:
            type: integer
            minimum: 1
          height:
            type: integer
            minimum: 1
      fps:
        type: number
        minimum: 0
      tags:
        type: array
        items:
          type: string
      license:
        type: string
      download_date:
        type: string
        format: date-time
  download_info:
    type: object
    description: "Information about the download process"
    properties:
      downloaded_at:
        type: string
        format: date-time
      download_method:
        type: string
        enum:
          - huggingface
          - wget
          - manual
      status:
        type: string
        enum:
          - complete
          - partial
          - failed
      error_message:
        type: string
additionalProperties: false
