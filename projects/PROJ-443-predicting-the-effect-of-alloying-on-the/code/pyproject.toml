[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hea-elastic-modulus-pipeline"
version = "0.1.0"
description = "Predicting the Effect of Alloying on the Elastic Modulus of High-Entropy Alloys"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "requests>=2.31",
    "pyyaml>=6.0",
    "shap>=0.44",
    "scipy>=1.11",
    "pymatgen>=2023.10.10",
    "pytest>=7.4",
]

[project.optional-dependencies]
dev = [
    "flake8>=6.1",
    "black>=23.12.0",
    "isort>=5.13",
    "pre-commit>=3.6",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["utils", "models", "features", "data", "pipeline", "report", "eval", "interpret"]
skip_glob = ["*/__init__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
