$schema: "http://json-schema.org/draft-07/schema#"
title: "Materials property dataset contract"
description: "Required columns for the composition-only GNN pipeline. Rows failing any rule are dropped with a warning."
type: array
minItems: 1
items:
  type: object
  required:
    - material_id
    - formula
    - band_gap
    - hardness
    - crystal_system
  additionalProperties: true
  properties:
    material_id:
      type: string
      minLength: 1
      description: "Unique source identifier; duplicate IDs are dropped (first occurrence kept)."
    formula:
      type: string
      minLength: 2
      description: "Parseable chemical formula, e.g. Fe2O3; materials with elements missing from the periodic-table lookup are skipped with a warning."
    band_gap:
      type: number
      minimum: 0
      description: "Band gap in eV; 0 denotes a metal and is retained."
    hardness:
      type: number
      minimum: 0
      description: "Hardness in GPa."
    crystal_system:
      type: string
      enum:
        - triclinic
        - monoclinic
        - orthorhombic
        - tetragonal
        - trigonal
        - hexagonal
        - cubic
