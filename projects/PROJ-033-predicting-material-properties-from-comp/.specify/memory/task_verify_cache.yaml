T003:
  c: false
  h: 5a839b66996db7ac2450484559f0f9e580136fe53c7a4b0882eec99945b76ac9
  r: "The pytest run for `tests/unit/test_loader.py` failed 4 of 9 tests (exit 1):\
    \ the zero-band-gap metal m09 (Si, band_gap=0.0, hardness=0.0) is dropped by the\
    \ 1.5\xD7IQR filter, violating the explicit requirement to retain zero-band-gap\
    \ metals, and the outlier-removal logging test also fails (the loader dropped\
    \ 2 rows where the test expects 1). The loader must exclude zero-band-gap metals\
    \ from the IQR outlier rule (or otherwise retain them) and fix the outlier drop-count\
    \ behavior so all unit tests pass."
  sig: f786db479b70e9b60fddc5826b6439dff64df9912df8741d1c48b3fa041f4543
T004:
