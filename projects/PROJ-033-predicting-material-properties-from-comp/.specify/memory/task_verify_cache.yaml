T005:
  c: true
  h: f85a8c2613fb279fdfbd717a3fb9019dd173282d2f679cbea9d1cd6b55701b7e
  r: '`src/training/split.py` implements a real seeded stratified 80/10/10 split with
    material_id disjointness assertions, 5 stratified CV folds, and JSON export; `data/processed/splits/train_val_test.json`
    and `cv_folds.json` exist and match the actual 2-row processed CSV (the only data
    available in the project), and the pytest log shows all 6 tests in `tests/unit/test_split.py`
    passing (exit 0), covering stratification, disjointness, and reproducibility.
    The degenerate-looking split contents (empty val, single-material folds) are a
    faithful consequence of the 2-row input dataset, not a stub or fab'
