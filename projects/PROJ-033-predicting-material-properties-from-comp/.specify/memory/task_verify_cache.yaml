  r: "The `src/graphs/composition.py` file exists and implements most of the required\
    \ logic, but the unit\u2011test suite cannot be run because the `pymatgen` package\
    \ is not available, causing an import error. Moreover, the test that checks for\
    \ an unknown\u2011element warning expects the warning message to contain \u201C\
    Unknown element\u201D, which the current implementation does not emit (it logs\
    \ a different message when parsing fails). Consequently the verification tests\
    \ do not pass."
