# Dataset Schema for Emotional Synchrony Trust Study
# Defines the expected structure for interaction data used in US1 analysis
type: object
required:
  - interaction_id
  - trust_score
  - facial_features
  - vocal_features
  - consistency_score
properties:
  interaction_id:
    type: string
    description: Unique identifier for the interaction session
    required: true
  trust_score:
    type: number
    description: User trust rating (scale 1-5)
    required: true
    minimum: 1.0
    maximum: 5.0
  facial_features:
    type: object
    description: Extracted facial action units and expressions
    required: true
    properties:
      au1:
        type: number
      au2:
        type: number
      au4:
        type: number
      au6:
        type: number
      au12:
        type: number
      au25:
        type: number
      valence:
        type: number
      arousal:
        type: number
  vocal_features:
    type: object
    description: Extracted vocal prosody features
    required: true
    properties:
      mean_pitch:
        type: number
      pitch_std:
        type: number
      mean_energy:
        type: number
      energy_std:
        type: number
      speech_rate:
        type: number
      pause_ratio:
        type: number
  consistency_score:
    type: number
    description: Normalized intra-modal consistency metric (max abs cross-correlation)
    required: true
    minimum: 0.0
    maximum: 1.0
  metadata:
    type: object
    description: Optional metadata about the interaction
    required: false
    properties:
      avatar_type:
        type: string
      duration_seconds:
        type: number
      difficulty_level:
        type: integer
additionalProperties: false