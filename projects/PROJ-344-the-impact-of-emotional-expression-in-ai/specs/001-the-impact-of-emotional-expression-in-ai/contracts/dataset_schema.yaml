# Dataset Schema for Emotional Synchrony Trust Study
# This schema defines the structure for the interaction dataset used in US1.
# It enforces FR-001 requirements for metadata presence and modality consistency.

type: object
title: "EmotionalSynchronyInteractionDataset"
description: "Schema for dataset containing facial, vocal, and trust metrics per interaction."

properties:
  interaction_id:
    type: string
    description: "Unique identifier for the interaction session."
    required: true
    pattern: "^[a-zA-Z0-9_-]+$"

  participant_id:
    type: string
    description: "Anonymized participant identifier."
    required: true

  avatar_type:
    type: string
    description: "Type of AI avatar used (e.g., 'neutral', 'expressive')."
    required: true
    enum:
      - neutral
      - expressive
      - mixed

  duration_seconds:
    type: number
    description: "Duration of the interaction in seconds."
    required: true
    minimum: 0.0

  difficulty_level:
    type: integer
    description: "Task difficulty level (1-5)."
    required: true
    minimum: 1
    maximum: 5

  trust_score:
    type: number
    description: "User trust score (1.0 to 5.0 Likert scale)."
    required: true
    minimum: 1.0
    maximum: 5.0

  facial_consistency_score:
    type: number
    description: "Intra-modal consistency score for facial features."
    required: false
    minimum: 0.0
    maximum: 1.0

  vocal_consistency_score:
    type: number
    description: "Intra-modal consistency score for vocal features."
    required: false
    minimum: 0.0
    maximum: 1.0

  combined_consistency_score:
    type: number
    description: "Combined consistency metric."
    required: false
    minimum: 0.0
    maximum: 1.0

  metadata:
    type: object
    description: "Additional metadata about the session."
    required: false
    properties:
      timestamp:
        type: string
        format: date-time
      device_id:
        type: string
      environment:
        type: string

required:
  - interaction_id
  - participant_id
  - avatar_type
  - duration_seconds
  - difficulty_level
  - trust_score

additionalProperties: false