$schema: "http://json-schema.org/draft-07/schema#"
title: "OmniDoc Dataset Sample Schema"
description: "Schema for the sampled dataset used in the analysis. Derived from the OmniDoc-TokenBench dataset."
type: "object"
properties:
  image_id:
    type: "string"
    description: "Unique identifier for the source document image."
  crop_id:
    type: "string"
    description: "Unique identifier for the cropped region."
  modality:
    type: "string"
    enum:
      - "text"
      - "image"
    description: "Ground-truth modality label for the crop."
  bbox:
    type: "array"
    items:
      type: "number"
    minItems: 4
    maxItems: 4
    description: "Bounding box coordinates [x1, y1, x2, y2]."
  pixels:
    type: "object"
    description: "Image pixel data (stored as base64 or reference to file)."
    properties:
      format:
        type: "string"
        const: "numpy"
      shape:
        type: "array"
        items:
          type: "integer"
        description: "Dimensions [height, width, channels]."
required:
  - "image_id"
  - "crop_id"
  - "modality"
  - "bbox"