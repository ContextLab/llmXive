$schema: "http://json-schema.org/draft-07/schema#"
title: "Latent Vector Schema"
description: "Schema for the encoded latent vectors extracted by the Qwen-Image-VAE encoder."
type: "object"
properties:
  latent_id:
    type: "string"
    description: "Unique identifier for the latent vector."
  crop_id:
    type: "string"
    description: "Reference to the source crop_id."
  vector:
    type: "array"
    items:
      type: "number"
    description: "The high-dimensional latent representation."
  modality:
    type: "string"
    enum:
      - "text"
      - "image"
    description: "The ground-truth modality label."
  encoder_version:
    type: "string"
    description: "Version of the Qwen-Image-VAE encoder used."
required:
  - "latent_id"
  - "crop_id"
  - "vector"
  - "modality"