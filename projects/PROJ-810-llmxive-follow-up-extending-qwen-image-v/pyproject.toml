[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "llmXive follow-up: extending Qwen-Image-VAE-2.0 Technical Report"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch==2.2.0+cpu",
    "transformers==4.40.0",
    "datasets==2.18.0",
    "scikit-learn==1.4.0",
    "opencv-python-headless==4.9.0.80",
    "paddleocr==2.7.3",
    "pyyaml==6.0.1",
    "pi",
    "numpy==1.26.4",
    "matplotlib==3.8.3",
    "seaborn==0.13.2",
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "statsmodels==0.14.1",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "flake8>=6.0.0",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (black handles this)
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=code --cov-report=term-missing"
