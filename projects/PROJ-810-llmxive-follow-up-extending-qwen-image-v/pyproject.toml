[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-qwen-image-v"
version = "0.1.0"
description = "Extension analysis for Qwen-Image-VAE-2.0 Technical Report"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch==2.2.0+cpu",
    "transformers==4.40.0",
    "datasets==2.18.0",
    "scikit-learn==1.4.0",
    "opencv-python-headless==4.9.0.80",
    "paddleocr==2.7.3",
    "pyyaml==6.0.1",
    "numpy==1.26.4",
    "matplotlib==3.8.3",
    "seaborn==0.13.2",
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]