# Ruff configuration for llmXive project
# Aligns with Black formatting and strict linting rules

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by Black)
    "B008", # Do not perform function call in argument defaults (common in ML)
]

[lint.isort]
known-first-party = ["src", "code"]
force-single-line = true
lines-after-imports = 2

[format]
# Ensure Ruff's formatter matches Black's default behavior
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
