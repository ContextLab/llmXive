[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-arcane"
version = "0.1.0"
description = "Automated science pipeline for ArcANE character analysis"
requires-python = ">=3.9"
dependencies = [
    "transformers",
    "llama-cpp-python",
    "datasets",
    "scikit-learn",
    "scipy",
    "pandas",
    "numpy",
    "tiktoken",
    "hypothesis",
    "pytest",
    "sentence-transformers",
    "vaderSentiment"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pytest-cov",
    "mypy"
]

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "ANN"] # Allow assert and ignore type hints in tests
"scripts/*" = ["S101"]

[tool.ruff.isort]
known-first-party = ["src", "scripts", "tests"]
force-sort-within-sections = true

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests"
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
