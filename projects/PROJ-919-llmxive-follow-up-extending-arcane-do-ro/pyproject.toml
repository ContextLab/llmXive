[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive"
version = "0.1.0"
description = "Automated science pipeline for gene regulation and character arc analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "transformers",
    "llama-cpp-python",
    "datasets",
    "scikit-learn",
    "scipy",
    "pandas",
    "numpy",
    "tiktoken",
    "hypothesis",
    "pytest",
    "sentence-transformers",
    "vaderSentiment",
    "pyyaml",
    "ruff",
    "black"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*", "scripts*", "code*"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # Allow asserts in tests
"scripts/*" = ["T201"] # Allow print in scripts

[tool.ruff.isort]
known-first-party = ["src", "tests", "scripts"]
known-third-party = ["transformers", "datasets", "sklearn", "pandas", "numpy", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
