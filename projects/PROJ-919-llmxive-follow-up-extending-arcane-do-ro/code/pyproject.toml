[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-arcane"
version = "0.1.0"
description = "Automated science pipeline for character arc analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "transformers",
    "llama-cpp-python",
    "datasets",
    "scikit-learn",
    "scipy",
    "pandas",
    "numpy",
    "tiktoken",
    "hypothesis",
    "pytest",
    "sentence-transformers",
    "vaderSentiment",
    "networkx",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.ruff]
# This file is also referenced by .ruff.toml, but we keep basic project metadata here
line-length = 88
target-version = "py39"
src = ["src", "tests", "scripts"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
