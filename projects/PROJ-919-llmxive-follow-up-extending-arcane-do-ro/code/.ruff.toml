[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`) by default
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM", "ARG"]
ignore = []

# Allow autofix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Exclude a few files/directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as `per-file-ignores` but for a specific file pattern
per-file-ignores = {}

# Allow unused variables when they start with an underscore
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Target version
target-version = "py310"

[lint.isort]
known-first-party = ["src", "scripts", "tests", "setup_project_structure", "setup_data_dirs"]
force-single-line = false
lines-after-imports = 2
