$schema: "http://json-schema.org/draft-07/schema#"
title: "CharacterAxis"
description: |
  JSON Schema for defining Character Psychological Axes in the ArcANE framework.
  Defines the structure for both Coarse (broad traits) and Fine (nuanced behavioral) axes.
type: "object"
required:
  - character_name
  - coarse_axis
  - fine_axis
  - metadata
properties:
  character_name:
    type: "string"
    description: "The name of the character being analyzed."
    minLength: 1
  coarse_axis:
    type: "object"
    description: |
      Broad psychological dimensions (e.g., Introversion/Extraversion, Moral Alignment).
      Must be distinct from the fine axis.
    required:
      - name
      - definition
      - scale_min
      - scale_max
      - description
    properties:
      name:
        type: "string"
        description: "Short identifier for the axis (e.g., 'Aggression_Level')."
      definition:
        type: "string"
        description: "High-level definition of the psychological dimension."
      scale_min:
        type: "number"
        description: "Lower bound of the measurement scale."
      scale_max:
        type: "number"
        description: "Upper bound of the measurement scale."
      description:
        type: "string"
        description: "Detailed explanation of what the axis measures."
  fine_axis:
    type: "object"
    description: |
      Nuanced, specific behavioral tendencies derived from independent narrative observations.
      Must be semantically distinct from the coarse axis.
    required:
      - name
      - definition
      - scale_min
      - scale_max
      - description
      - source_observation_id
    properties:
      name:
        type: "string"
        description: "Short identifier for the fine-grained axis."
      definition:
        type: "string"
        description: "Specific definition of the behavioral tendency."
      scale_min:
        type: "number"
        description: "Lower bound of the measurement scale."
      scale_max:
        type: "number"
        description: "Upper bound of the measurement scale."
      description:
        type: "string"
        description: "Detailed explanation of the nuance captured by this axis."
      source_observation_id:
        type: "string"
        description: "Reference to the specific narrative segment or observation ID that generated this axis."
  metadata:
    type: "object"
    description: "Additional validation and provenance data."
    required:
      - created_at
      - validation_status
      - lexical_overlap_score
      - semantic_distance_score
    properties:
      created_at:
        type: "string"
        format: "date-time"
        description: "ISO 8601 timestamp of creation."
      validation_status:
        type: "string"
        enum:
          - "pending"
          - "passed"
          - "failed"
        description: "Result of the semantic overlap validation."
      lexical_overlap_score:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Calculated lexical overlap between coarse and fine definitions."
      semantic_distance_score:
        type: "number"
        minimum: 0.0
        maximum: 2.0
        description: "Calculated cosine distance between coarse and fine embeddings."
      notes:
        type: "string"
        description: "Optional notes regarding the axis generation or validation."
additionalProperties: false