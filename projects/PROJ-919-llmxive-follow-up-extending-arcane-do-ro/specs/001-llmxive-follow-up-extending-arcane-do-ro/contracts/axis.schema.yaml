$schema: "http://json-schema.org/draft-07/schema#"
title: CharacterAxis
description: >
  JSON Schema for defining CharacterAxis specifications, including
  distinct Coarse and Fine psychological axes for character analysis.
type: object
required:
  - character_name
  - coarse_axis
  - fine_axis
  - source_text_segment
  - validation_metrics
  - created_at
properties:
  character_name:
    type: string
    description: The name of the character being analyzed.
    minLength: 1
    pattern: "^[A-Za-z0-9_\\- ]+$"
  
  coarse_axis:
    type: object
    description: >
      Coarse psychological axis: Broad, high-level psychological trait or dimension
      (e.g., "Extraversion vs. Introversion", "Aggression vs. Pacifism").
    required:
      - definition
      - labels
    properties:
      definition:
        type: string
        description: A clear, concise definition of the coarse axis.
        minLength: 10
      labels:
        type: array
        description: The two opposing ends of the coarse axis.
        minItems: 2
        maxItems: 2
        items:
          type: string
          minLength: 1
  
  fine_axis:
    type: object
    description: >
      Fine psychological axis: A more granular, nuanced dimension derived from
      specific narrative observations, independent of the coarse axis.
    required:
      - definition
      - labels
      - source_observation
    properties:
      definition:
        type: string
        description: A detailed definition of the fine axis.
        minLength: 10
      labels:
        type: array
        description: The two opposing ends of the fine axis.
        minItems: 2
        maxItems: 2
        items:
          type: string
          minLength: 1
      source_observation:
        type: string
        description: >
          The specific narrative observation or text segment from which this
          fine axis was derived. Used to verify independence.
        minLength: 1
  
  source_text_segment:
    type: string
    description: >
      The original text segment from the narrative used to validate the
      independence of the fine axis.
    minLength: 1
  
  validation_metrics:
    type: object
    description: >
      Metrics resulting from the validation process (lexical overlap, semantic similarity).
    required:
      - lexical_overlap_score
      - semantic_similarity_score
      - is_valid
    properties:
      lexical_overlap_score:
        type: number
        description: >
          Lexical overlap score between coarse and fine axis definitions.
          Must be <= 0.4 to pass validation.
        minimum: 0.0
        maximum: 1.0
      semantic_similarity_score:
        type: number
        description: >
          Cosine similarity score between coarse and fine axis embeddings.
          Must be < 0.3 to pass validation.
        minimum: -1.0
        maximum: 1.0
      is_valid:
        type: boolean
        description: True if all validation constraints are satisfied.
      validation_message:
        type: string
        description: Human-readable message explaining the validation result.
  
  created_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the axis definition was created.
  
  metadata:
    type: object
    description: Optional metadata for the axis definition.
    properties:
      generator_version:
        type: string
      model_used:
        type: string
      notes:
        type: string