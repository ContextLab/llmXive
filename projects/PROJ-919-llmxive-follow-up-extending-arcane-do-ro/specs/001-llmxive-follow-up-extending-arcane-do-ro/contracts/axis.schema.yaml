$schema: "http://json-schema.org/draft-07/schema#"
title: CharacterAxis
description: >
  JSON Schema for Character Axis definitions in the ArcANE pipeline.
  Defines both Coarse (broad psychological traits) and Fine (specific narrative behaviors) axes.
type: object
properties:
  character:
    type: string
    description: The name of the character being analyzed.
  coarse:
    type: object
    description: >
      Coarse Axis: Broad, high-level psychological traits (e.g., Introversion, Conscientiousness).
      Derived from general psychological frameworks or broad character archetypes.
    properties:
      trait_name:
        type: string
        description: The name of the broad trait (e.g., "Agreeableness").
      definition:
        type: string
        description: A clear, high-level definition of the trait in the context of the character.
      range:
        type: object
        description: The scale of the trait.
        properties:
          min_label:
            type: string
          max_label:
            type: string
        required:
          - min_label
          - max_label
      indicators:
        type: array
        items:
          type: string
        description: List of general behavioral indicators for this coarse trait.
    required:
      - trait_name
      - definition
      - range
      - indicators
  fine:
    type: object
    description: >
      Fine Axis: Specific, granular narrative behaviors or micro-decisions derived from independent observations.
      These must be distinct from Coarse axes and grounded in specific plot points or dialogue.
    properties:
      behavior_name:
        type: string
        description: The specific name of the micro-behavior (e.g., "Hesitates before answering").
      definition:
        type: string
        description: A precise definition of the behavior, explicitly tied to observable actions.
      origin:
        type: string
        description: >
          The specific narrative source or independent observation that led to this definition.
          Must be distinct from the source used for Coarse axes to ensure independence (FR-001).
      triggers:
        type: array
        items:
          type: string
        description: List of specific narrative triggers that elicit this behavior.
      manifestation:
        type: string
        description: How this behavior manifests in the character's response or dialogue.
    required:
      - behavior_name
      - definition
      - origin
      - triggers
      - manifestation
  metadata:
    type: object
    properties:
      created_at:
        type: string
        format: date-time
      source_version:
        type: string
      validation_status:
        type: string
        enum: ["pending", "validated", "rejected"]
        description: Status of the semantic overlap validation (T012).
required:
  - character
  - coarse
  - fine
additionalProperties: false