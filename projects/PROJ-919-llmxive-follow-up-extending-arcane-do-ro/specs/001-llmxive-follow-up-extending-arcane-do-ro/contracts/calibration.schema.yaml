$schema: http://json-schema.org/draft-07/schema#
title: Human Annotation for Judge Calibration
description: Schema for gold standard human annotations used to calibrate and validate the Judge model (FR-006, FR-007).
type: object
required:
  - character
  - scenario
  - ground_truth_score
  - ground_truth_phase
properties:
  character:
    type: string
    description: The name or identifier of the character being evaluated.
    minLength: 1
  scenario:
    type: string
    description: A unique identifier or description of the specific scenario/probe.
    minLength: 1
  ground_truth_score:
    type: number
    description: The human-annotated consistency score (Likert scale, e.g., 1.0 to 5.0).
    minimum: 0.0
    maximum: 5.0
  ground_truth_phase:
    type: string
    description: The psychological phase or condition associated with this annotation (e.g., 'Coarse', 'Fine', 'Hybrid').
    enum:
      - Coarse
      - Fine
      - Hybrid
additionalProperties: false
