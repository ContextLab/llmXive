$schema: http://json-schema.org/draft-07/schema#
title: Human Annotation Calibration Schema
description: >
  Schema for human annotations used to calibrate the Judge model.
  Each record represents a ground truth evaluation of a character's response
  to a specific scenario.
type: object
required:
  - character
  - scenario
  - ground_truth_score
  - ground_truth_phase
properties:
  character:
    type: string
    description: >
      The name or identifier of the character being evaluated.
      Must match the character identifier used in the experiment configuration.
    minLength: 1
  scenario:
    type: string
    description: >
      The text of the "Out-of-World" scenario prompt presented to the character.
      This serves as the context for the ground truth evaluation.
    minLength: 1
  ground_truth_score:
    type: integer
    description: >
      The human-annotated consistency score on a standard Likert scale (e.g., 1-5).
      1 = Not consistent, 5 = Highly consistent with character arc.
    minimum: 1
    maximum: 5
  ground_truth_phase:
    type: string
    description: >
      The narrative phase or character arc stage referenced by the annotation.
      Examples: 'Inciting Incident', 'Climax', 'Resolution', 'Internal Conflict'.
    minLength: 1
additionalProperties: false