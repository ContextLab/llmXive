# Calibration Schema for Human Annotations
# Used for Judge model calibration against ground truth
# Task: T009b - Define calibration.schema.yaml

$schema: "http://json-schema.org/draft-07/schema#"
title: "HumanAnnotation"
description: "Schema for human annotation data used in Judge model calibration"
type: object
required:
  - character
  - scenario
  - ground_truth_score
  - ground_truth_phase
properties:
  character:
    type: string
    description: "Name of the character being evaluated"
    minLength: 1
    maxLength: 100
  scenario:
    type: string
    description: "The out-of-world scenario prompt presented to the character"
    minLength: 10
    maxLength: 1000
  ground_truth_score:
    type: number
    description: "Human-annotated score representing moral alignment (1.0 to 5.0)"
    minimum: 1.0
    maximum: 5.0
  ground_truth_phase:
    type: string
    description: "The moral phase assigned by human annotators"
    enum:
      - "pre-moral"
      - "emerging-conscience"
      - "conflicted"
      - "principled"
      - "self-sacrificing"
additionalProperties: false

# Array schema for the dataset
$defs:
  HumanAnnotationDataset:
    type: array
    items:
      $ref: "#"
    minItems: 1
    description: "Array of human annotation samples for calibration"