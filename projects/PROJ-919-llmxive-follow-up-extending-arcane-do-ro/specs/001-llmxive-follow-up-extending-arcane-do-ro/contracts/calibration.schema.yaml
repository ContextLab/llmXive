$schema: http://json-schema.org/draft-07/schema#
title: Human Annotation for Judge Calibration
description: >
  Schema for gold standard human annotations used to calibrate the Judge model.
  Each record represents a human-verified score for a specific character in a specific scenario.
type: object
required:
  - character
  - scenario
  - ground_truth_score
  - ground_truth_phase
properties:
  character:
    type: string
    description: Name or identifier of the character being evaluated.
    minLength: 1
  scenario:
    type: string
    description: The unique identifier or text of the scenario/probe being evaluated.
    minLength: 1
  ground_truth_score:
    type: number
    description: >
      The human-verified consistency score. 
      Expected range: 0.0 to 5.0 (Likert scale) or 0.0 to 1.0 normalized.
      Must be a valid float.
    minimum: 0.0
    maximum: 5.0
  ground_truth_phase:
    type: string
    description: >
      The psychological phase or condition under which this score applies.
      Valid values: 'Coarse', 'Fine', 'Hybrid'.
    enum:
      - Coarse
      - Fine
      - Hybrid
  annotator_id:
    type: string
    description: Optional ID of the human annotator.
  timestamp:
    type: string
    format: date-time
    description: Optional timestamp of the annotation.
additionalProperties: false
