$schema: http://json-schema.org/draft-07/schema#
title: Probe
description: >
  Schema for an "Out-of-World" probe scenario used in the ArcANE 
  character consistency evaluation. Probes must be semantically distant 
  from the source text and novel relative to the character's established 
  narrative.
type: object
required:
  - probe_id
  - character_name
  - scenario_prompt
  - coarse_axis_ref
  - fine_axis_ref
  - similarity_metrics
  - status
  - created_at
properties:
  probe_id:
    type: string
    description: Unique identifier for the probe (e.g., 'probe_001_charname')
    pattern: "^probe_[0-9]+_[a-zA-Z0-9_-]+$"
  
  character_name:
    type: string
    description: Name of the character this probe targets
    minLength: 1
  
  scenario_prompt:
    type: string
    description: The full natural language prompt describing the out-of-world scenario
    minLength: 10
  
  coarse_axis_ref:
    type: string
    description: Reference ID to the Coarse CharacterAxis used for generation
    pattern: "^axis_coarse_[a-zA-Z0-9_-]+$"
  
  fine_axis_ref:
    type: string
    description: Reference ID to the Fine CharacterAxis used for generation
    pattern: "^axis_fine_[a-zA-Z0-9_-]+$"
  
  similarity_metrics:
    type: object
    description: Metrics verifying the probe is 'out-of-world' and distinct from source
    required:
      - lexical_overlap
      - cosine_similarity
      - source_text_checksum
    properties:
      lexical_overlap:
        type: number
        description: Jaccard similarity or n-gram overlap with source text
        minimum: 0.0
        maximum: 1.0
      cosine_similarity:
        type: number
        description: Cosine similarity between probe embedding and source text embedding
        minimum: -1.0
        maximum: 1.0
      source_text_checksum:
        type: string
        description: SHA-256 hash of the source text corpus used for comparison
        pattern: "^[a-f0-9]{64}$"
  
  status:
    type: string
    description: Validation status of the probe
    enum:
      - valid
      - invalid_low_similarity
      - invalid_high_overlap
      - generation_failed
    default: valid
  
  created_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of generation
  
  attempts:
    type: integer
    description: Number of generation attempts made to produce this valid probe
    minimum: 1
    default: 1
  
  notes:
    type: string
    description: Optional notes regarding generation constraints or rejection reasons
    default: ""
additionalProperties: false