$schema: http://json-schema.org/draft-07/schema#
title: Probe
description: |
  JSON Schema for an "Out-of-World" character probe.
  A probe is a scenario prompt generated to test character consistency
  in a context semantically distant from the source narrative.
type: object
required:
  - probe_id
  - character_name
  - scenario_description
  - source_axes_coarse
  - source_axes_fine
  - semantic_similarity_score
  - generation_status
  - created_at
properties:
  probe_id:
    type: string
    description: Unique identifier for the probe (e.g., UUID or hash).
    pattern: "^[a-zA-Z0-9_-]+$"
  
  character_name:
    type: string
    description: Name of the character this probe is designed for.
    minLength: 1
  
  scenario_description:
    type: string
    description: The full text of the "Out-of-World" scenario prompt.
    minLength: 10
  
  source_axes_coarse:
    type: array
    description: List of coarse psychological axes used to generate this probe.
    items:
      type: string
    minItems: 1
  
  source_axes_fine:
    type: array
    description: List of fine-grained psychological axes used to generate this probe.
    items:
      type: string
    minItems: 1
  
  semantic_similarity_score:
    type: number
    description: |
      Cosine similarity score between the probe text and the source narrative corpus.
      Must be < 0.3 to be considered valid "Out-of-World".
    minimum: 0.0
    maximum: 1.0
  
  generation_status:
    type: string
    description: Status of the generation attempt.
    enum:
      - success
      - regenerated
      - failed_limit_exceeded
      - failed_similarity_threshold
  
  similarity_check_passed:
    type: boolean
    description: True if semantic_similarity_score < 0.3 threshold.
  
  generated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the probe was generated.
  
  metadata:
    type: object
    description: Additional metadata for the probe generation process.
    properties:
      model_version:
        type: string
      temperature:
        type: number
      attempt_count:
        type: integer
        minimum: 1
    additionalProperties: true