# Probe Schema Definition
# Defines the structure for "Out-of-World" scenario probes used in the ArcANE evaluation pipeline.
#
# This schema validates the output of src/services/probe_generator.py (T017-T020).
# Each record represents a single probe scenario designed to test character consistency
# in a novel, semantically distant context.

type: object
required:
  - character
  - scenario_text
  - target_phase
  - similarity_score
properties:
  character:
    type: string
    description: >-
      The name of the character being evaluated (e.g., "Harry Potter", "Elizabeth Bennet").
      Must match the character name used in the associated Coarse/Fine axis definitions.
    minLength: 1
    examples:
      - "Harry Potter"
      - "Elizabeth Bennet"
      - "Sherlock Holmes"

  scenario_text:
    type: string
    description: >-
      The full text of the "Out-of-World" scenario prompt.
      This text must be semantically distant from the character's source material
      (cosine similarity < 0.3 against source corpus as per T018).
      It should not contain direct quotes or specific plot points from the original work.
    minLength: 50
    examples:
      - "You are a senior project manager at a tech startup. A key stakeholder is demanding a feature that violates your team's core ethical guidelines. How do you respond?"
      - "Imagine you are a botanist in the 19th century discovering a new species of orchid that glows in the dark. Describe your reaction and next steps."

  target_phase:
    type: string
    description: >-
      The specific phase of the character's development or psychological state
      that this probe is designed to elicit or test.
      Must align with the phases defined in the character's axis specifications.
    minLength: 1
    examples:
      - "Initial Optimism"
      - "Crisis of Faith"
      - "Reconciliation"
      - "Moral Dilemma"

  similarity_score:
    type: number
    format: float
    description: >-
      The calculated cosine similarity score between the generated scenario_text
      and the character's source text corpus.
      Per the validation logic (T018), this value must be < 0.30 for the probe to be accepted.
      Lower values indicate greater semantic distance.
    minimum: 0.0
    maximum: 1.0
    examples:
      - 0.12
      - 0.25
      - 0.05

additionalProperties: false
description: >-
  This schema ensures that every probe generated by the pipeline contains the necessary
  metadata for later evaluation by the Judge model (T025) and statistical analysis (T030-T033).
  It enforces the "Out-of-World" constraint by requiring the similarity_score field,
  which is populated by the generator's validation loop.