# Result schema for statistical analysis outputs
# This schema defines the required fields for result JSON files produced by the simulation.
# It follows a simple JSON‑Schema style but is interpreted manually in the validation code.
required:
  - p_value
  - ci_lower
  - ci_upper
  - effect_size
  - type_i_flag
properties:
  p_value:
    type: number
    description: "p‑value of the statistical test (0 ≤ p ≤ 1)."
  ci_lower:
    type: number
    description: "Lower bound of the confidence interval."
  ci_upper:
    type: number
    description: "Upper bound of the confidence interval."
  effect_size:
    type: number
    description: "Effect‑size estimate (e.g., Cohen's d, Eta‑squared, Cramér's V)."
  type_i_flag:
    type: boolean
    description: "True if the null hypothesis is rejected (Type I error)."
