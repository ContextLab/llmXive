$schema: "http://json-schema.org/draft-07/schema#"
title: ResultMetrics
description: Schema for statistical test result artifacts produced by the pipeline.
type: object
required:
  - p_value
  - ci_lower
  - ci_upper
  - effect_size
  - type_i_flag
properties:
  p_value:
    type: number
    description: Two‑sided p‑value from the statistical test.
    minimum: 0.0
    maximum: 1.0
  ci_lower:
    type: number
    description: Lower bound of the confidence interval for the effect size or mean difference.
  ci_upper:
    type: number
    description: Upper bound of the confidence interval for the effect size or mean difference.
  effect_size:
    type: number
    description: Estimated effect size (e.g., Cohen's d, Eta‑squared, Cramér's V) for the test.
  type_i_flag:
    type: boolean
    description: Indicates whether the null hypothesis was rejected (True = Type I error if ground truth is null).