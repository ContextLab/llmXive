# Simple dataset schema used by the download/clean pipeline.
#
# The schema is deliberately minimal: it only defines an optional
# ``columns`` list. If the list is provided, the cleaning step will
# enforce that the CSV contains exactly those column names (order is
# ignored). When omitted or empty, only basic validation (non‑empty
# column names) is performed.
type: object
properties:
  columns:
    type: array
    items:
      type: string
required: []
