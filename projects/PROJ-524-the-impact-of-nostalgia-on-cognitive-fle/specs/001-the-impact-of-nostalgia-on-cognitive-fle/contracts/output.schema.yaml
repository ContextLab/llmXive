$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Output Schema"
description: "Schema for statistical analysis results"
type: object
required:
  - comparison_name
  - p_value
  - p_value_corrected
  - cohen_d
  - cohen_d_ci_lower
  - cohen_d_ci_upper
  - significance_status
  - mdes
  - validity_status
properties:
  comparison_name:
    type: string
    description: "Name of the comparison (e.g., 'nostalgia vs control - errors')"
  p_value:
    type: number
    description: "Raw p-value from Welch's t-test"
  p_value_corrected:
    type: number
    description: "Bonferroni-corrected p-value"
  cohen_d:
    type: number
    description: "Cohen's d effect size (Welch‑compatible, bias‑corrected)"
  cohen_d_ci_lower:
    type: number
    description: "Lower bound of the 95% confidence interval for Cohen's d"
  cohen_d_ci_upper:
    type: number
    description: "Upper bound of the 95% confidence interval for Cohen's d"
  significance_status:
    type: string
    enum:
      - "significant"
      - "non-significant"
      - "sensitive"
    description: "Significance status at corrected alpha = 0.025; 'sensitive' if raw p in [0.04, 0.06]"
  mdes:
    type: number
    description: "Minimum Detectable Effect Size (post‑hoc power limitation)"
  validity_status:
    type: string
    enum:
      - "verified"
      - "unverified"
      - "simulation"
    description: "Dataset validity flag; all runs of this project are flagged accordingly"
  sensitivity_analysis:
    type: array
    items:
      type: object
      required:
        - threshold
        - significance_status
      properties:
        threshold:
          type: number
          description: "Significance threshold examined"
        significance_status:
          type: string
          enum:
            - "significant"
            - "non-significant"
          description: "Status at the given threshold"
additionalProperties: false