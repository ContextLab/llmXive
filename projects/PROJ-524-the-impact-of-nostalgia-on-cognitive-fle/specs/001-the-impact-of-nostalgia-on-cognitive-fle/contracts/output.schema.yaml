$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Output Schema"
description: "Schema for statistical analysis results"
type: object
required:
  - comparison_name
  - p_value
  - p_value_corrected
  - effect_size
  - effect_size_ci_lower
  - effect_size_ci_upper
  - significance_status
  - mdes
  - adjustment_status
  - validity_status
properties:
  comparison_name:
    type: string
    description: "Name of the comparison (e.g., 'nostalgia vs control - errors')"
  p_value:
    type: number
    description: "Raw p-value from Welch's t-test"
  p_value_corrected:
    type: number
    description: "Bonferroni-corrected p-value"
  effect_size:
    type: number
    description: "Hedges' g effect size (bias-corrected, non-pooled variance convention consistent with Welch's test)"
  effect_size_ci_lower:
    type: number
    description: "Lower bound of the 95% confidence interval for effect size"
  effect_size_ci_upper:
    type: number
    description: "Upper bound of the 95% confidence interval for effect size"
  significance_status:
    type: string
    enum:
      - "significant"
      - "non-significant"
      - "sensitive"
    description: "Significance status at corrected alpha = 0.025; 'sensitive' if corrected p in [0.020, 0.030]"
  mdes:
    type: number
    description: "Minimum Detectable Effect Size (post-hoc power limitation)"
  adjustment_status:
    type: string
    enum:
      - "adjusted"
      - "unadjusted"
      - "covariates_missing"
    description: "Whether covariate adjustment was applied"
  validity_status:
    type: string
    enum:
      - "verified"
      - "unverified"
      - "simulation"
    description: "Dataset validity flag; all runs of this project produce 'simulation'"
  sensitivity_analysis:
    type: array
    items:
      type: object
      required:
        - threshold
        - significance_status
      properties:
        threshold:
          type: number
          description: "Significance threshold examined (e.g., 0.01, 0.025, 0.05)"
        significance_status:
          type: string
          enum:
            - "significant"
            - "non-significant"
          description: "Status at the given threshold"
additionalProperties: false