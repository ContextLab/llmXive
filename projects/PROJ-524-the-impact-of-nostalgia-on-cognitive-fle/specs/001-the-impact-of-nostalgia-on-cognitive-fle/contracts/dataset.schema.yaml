$schema: "http://json-schema.org/draft-07/schema#"
title: "WCST Dataset Schema"
description: "Schema for validated (simulated) WCST performance dataset rows"
type: object
required:
  - participant_id
  - age
  - stimulus_type
  - stimulus_id
  - perseverative_errors
  - categories_completed
properties:
  participant_id:
    type: string
    description: "Unique identifier for participant"
  age:
    type: integer
    minimum: 65
    description: "Age of participant in years (must be >= 65)"
  stimulus_type:
    type: string
    enum:
      - "nostalgia"
      - "control"
    description: "Experimental condition assignment (synthetic for demonstration)"
  stimulus_id:
    type: string
    description: "Identifier linking participant to a stimulus audio file"
  perseverative_errors:
    type: number
    description: "Number of perseverative errors on the WCST"
  categories_completed:
    type: number
    description: "Number of categories completed on the WCST"
  MMSE:
    type: integer
    minimum: 0
    maximum: 30
    description: "Mini-Mental State Examination score (optional; exclusion if < 24)"
  education_years:
    type: number
    minimum: 0
    description: "Years of education (covariate for adjusted model)"
  gender:
    type: string
    enum:
      - "female"
      - "male"
      - "other"
    description: "Gender category (covariate for adjusted model)"
additionalProperties: false

