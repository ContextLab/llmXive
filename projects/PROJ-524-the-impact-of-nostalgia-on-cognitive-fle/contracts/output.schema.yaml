$schema: http://json-schema.org/draft-07/schema#
title: NostalgiaCognitiveFlexibilityAnalysisReport
description: Schema for the statistical analysis output report.
type: object
properties:
  meta:
    type: object
    properties:
      generated_at:
        type: string
        format: date-time
      version:
        type: string
      source_file:
        type: string
  descriptive_statistics:
    type: object
    properties:
      nostalgia:
        type: object
        properties:
          n:
            type: integer
          mean_perseverative_errors:
            type: number
          mean_categories_completed:
            type: number
          std_perseverative_errors:
            type: number
          std_categories_completed:
            type: number
      control:
        type: object
        properties:
          n:
            type: integer
          mean_perseverative_errors:
            type: number
          mean_categories_completed:
            type: number
          std_perseverative_errors:
            type: number
          std_categories_completed:
            type: number
  statistical_tests:
    type: array
    items:
      type: object
      properties:
        metric:
          type: string
        test_type:
          type: string
        statistic:
          type: number
        p_value:
          type: number
        p_value_corrected:
          type: number
        effect_size:
          type: number
        ci_lower:
          type: number
        ci_upper:
          type: number
  power_analysis:
    type: object
    properties:
      achieved_power:
        type: number
      min_detectable_effect_size:
        type: number
  sensitivity_analysis:
    type: object
    properties:
      thresholds_tested:
        type: array
        items:
          type: number
      significance_stability:
        type: boolean
required:
- meta
- descriptive_statistics
- statistical_tests