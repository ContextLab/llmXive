# Output Schema - Generated by T007
# Will be populated by T020a based on data-model.md
# This is a placeholder until T020a generates the full schema
type: object
properties:
  statistical_report:
    type: object
    properties:
      welch_t_test_results:
        type: object
        properties:
          statistic:
            type: number
          pvalue:
            type: number
          degrees_of_freedom:
            type: number
      effect_sizes:
        type: object
        properties:
          cohens_d:
            type: number
          confidence_interval:
            type: array
            items:
              type: number
      power_analysis:
        type: object
        properties:
          power:
            type: number
          mdes:
            type: number
      sensitivity_analysis:
        type: object
        properties:
          is_sensitive_to_threshold:
            type: boolean
          borderline_range:
            type: array
            items:
              type: number
  exclusion_log:
    type: object
    properties:
      ERR_MISSING_AGE_FIELD:
        type: integer
      ERR_MISSING_SCORE:
        type: integer
      ERR_MMSE_IMPAIRED:
        type: integer
  validity_metrics:
    type: object
    properties:
      valid_percentage:
        type: number
      total_records:
        type: integer
      valid_records:
        type: integer
required:
  - statistical_report
  - exclusion_log
  - validity_metrics
