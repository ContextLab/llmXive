type: object
properties:
  statistical_test:
    type: string
    description: Name of the statistical test performed
    required: true
  p_value:
    type: number
    description: Raw p-value from the test
    required: true
  p_value_corrected:
    type: number
    description: Bonferroni-corrected p-value
    required: true
  effect_size:
    type: number
    description: Cohen's d effect size
    required: true
  effect_size_ci:
    type: object
    description: 95% Confidence Interval for effect size
    properties:
      lower:
        type: number
      upper:
        type: number
    required: true
  power:
    type: number
    description: Calculated statistical power
    required: true
  mdes:
    type: number
    description: Minimum Detectable Effect Size
    required: true
  sensitivity_flags:
    type: object
    description: Flags indicating sensitivity to threshold choices
    required: true
required_fields:
- statistical_test
- p_value
- p_value_corrected
- effect_size
- effect_size_ci
- power
- mdes
- sensitivity_flags