$schema: "http://json-schema.org/draft-07/schema#"
title: "Statistical Analysis Output Schema"
description: "Schema for the statistical analysis results including p-values, effect sizes, and power analysis."
type: object
properties:
  p_values:
    type: object
    description: "P-values for each metric"
    properties:
      perseverative_errors:
        type: number
        minimum: 0
        maximum: 1
      categories_completed:
        type: number
        minimum: 0
        maximum: 1
  corrected_p_values:
    type: object
    description: "Bonferroni corrected p-values"
    properties:
      perseverative_errors:
        type: number
        minimum: 0
        maximum: 1
      categories_completed:
        type: number
        minimum: 0
        maximum: 1
  effect_sizes:
    type: object
    description: "Effect sizes for each metric"
    properties:
      perseverative_errors:
        type: object
        properties:
          cohen_d:
            type: number
          ci_95_lower:
            type: number
          ci_95_upper:
            type: number
      categories_completed:
        type: object
        properties:
          cohen_d:
            type: number
          ci_95_lower:
            type: number
          ci_95_upper:
            type: number
  power:
    type: number
    description: "Statistical power of the test"
    minimum: 0
    maximum: 1
  MDES:
    type: number
    description: "Minimum Detectable Effect Size"
    minimum: 0
  sensitivity_analysis:
    type: object
    description: "Results of sensitivity analysis"
    properties:
      thresholds:
        type: array
        items:
          type: number
      is_sensitive_to_threshold:
        type: boolean
required:
  - p_values
  - effect_sizes
  - power
  - MDES