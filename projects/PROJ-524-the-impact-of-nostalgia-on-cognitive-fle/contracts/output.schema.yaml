schema_name: nostalgia_cognitive_flexibility_output
version: 1.0.0
generated_at: 2023-10-27T10:00:00Z
description: Schema for statistical analysis results and reports.
entities:
  statistical_comparison:
    description: Results of the Welch's t-test between nostalgia and control groups.
    fields:
    - name: metric
      type: string
      required: true
    - name: group_nostalgia_mean
      type: float
      required: true
    - name: group_nostalgia_std
      type: float
      required: true
    - name: group_control_mean
      type: float
      required: true
    - name: group_control_std
      type: float
      required: true
    - name: t_statistic
      type: float
      required: true
    - name: p_value
      type: float
      required: true
    - name: p_value_corrected
      type: float
      required: true
      description: Bonferroni corrected p-value.
    - name: cohens_d
      type: float
      required: true
    - name: cohens_d_ci_lower
      type: float
      required: true
    - name: cohens_d_ci_upper
      type: float
      required: true
  power_analysis:
    description: Post-hoc power analysis results.
    fields:
    - name: metric
      type: string
      required: true
    - name: observed_power
      type: float
      required: true
    - name: min_detectable_effect_size
      type: float
      required: true
    - name: alpha_level
      type: float
      required: true
  summary:
    description: High-level summary of the analysis.
    fields:
    - name: total_participants
      type: integer
      required: true
    - name: nostalgia_count
      type: integer
      required: true
    - name: control_count
      type: integer
      required: true
    - name: exclusion_count
      type: integer
      required: true
    - name: has_mmse_filter_applied
      type: boolean
      required: true
output_files:
- data/results/statistical_report.json
- data/results/sensitivity_report.json
