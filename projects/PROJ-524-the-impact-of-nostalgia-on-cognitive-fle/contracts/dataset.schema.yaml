type: object
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant
    required: true
  age:
    type: integer
    description: Age of the participant in years
    minimum: 65
    required: true
  stimulus_type:
    type: string
    description: Type of stimulus presented (nostalgia or control)
    enum:
    - nostalgia
    - control
    required: true
  perseverative_errors:
    type: integer
    description: Number of perseverative errors made in the task
    minimum: 0
    required: true
  categories_completed:
    type: integer
    description: Number of categories successfully completed
    minimum: 0
    required: true
  MMSE:
    type:
    - integer
    - 'null'
    description: Mini-Mental State Examination score (optional)
    minimum: 0
    maximum: 30
    required: false
required_fields:
- participant_id
- age
- stimulus_type
- perseverative_errors
- categories_completed
optional_fields:
- MMSE
