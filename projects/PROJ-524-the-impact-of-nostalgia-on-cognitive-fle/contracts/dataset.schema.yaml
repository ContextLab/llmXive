$schema: "http://json-schema.org/draft-07/schema#"
title: "Nostalgia Cognitive Flexibility Dataset Schema"
description: "Schema for the raw and processed dataset containing participant data, stimulus types, and cognitive flexibility metrics."
type: object
properties:
  participant_id:
    type: string
    description: "Unique identifier for the participant"
    minLength: 1
  age:
    type: integer
    description: "Age of the participant in years"
    minimum: 0
  stimulus_type:
    type: string
    description: "Type of stimulus presented (nostalgia or control)"
    enum:
      - nostalgia
      - control
  perseverative_errors:
    type: integer
    description: "Number of perseverative errors in WCST"
    minimum: 0
  categories_completed:
    type: integer
    description: "Number of categories completed in WCST"
    minimum: 0
  MMSE:
    type: integer
    description: "Mini-Mental State Examination score (optional)"
    minimum: 0
    maximum: 30
    nullable: true
required:
  - participant_id
  - age
  - stimulus_type
  - perseverative_errors
  - categories_completed
