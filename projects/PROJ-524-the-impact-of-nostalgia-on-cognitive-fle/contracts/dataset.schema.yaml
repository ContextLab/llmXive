# Dataset Schema - Generated by T007
# Will be populated by T020a based on data-model.md
# This is a placeholder until T020a generates the full schema
type: object
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant
  age:
    type: integer
    minimum: 65
    description: Age of the participant in years
  stimulus_type:
    type: string
    enum:
      - nostalgia
      - control
    description: Type of stimulus presented
  perseverative_errors:
    type: integer
    description: Number of perseverative errors in WCST
  categories_completed:
    type: integer
    description: Number of categories completed in WCST
  MMSE:
    type: integer
    minimum: 0
    maximum: 30
    nullable: true
    description: Mini-Mental State Examination score (optional)
required:
  - participant_id
  - age
  - stimulus_type
  - perseverative_errors
  - categories_completed
