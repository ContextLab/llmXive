schema_name: nostalgia_cognitive_flexibility_dataset
version: 1.0.0
generated_at: 2023-10-27T10:00:00Z
description: Schema for raw and processed data regarding nostalgia and cognitive flexibility in aging adults.
entities:
  participant:
    description: Core participant demographic and screening data.
    fields:
    - name: participant_id
      type: string
      required: true
      description: Unique identifier for the participant.
    - name: age
      type: integer
      required: true
      description: Age in years. Filtered for >= 65.
    - name: birth_year
      type: integer
      required: false
      description: Fallback for age calculation if age is missing.
    - name: gender
      type: string
      required: false
      description: Gender of the participant.
    - name: education_years
      type: integer
      required: false
      description: Years of formal education.
    - name: MMSE
      type: float
      required: false
      description: Mini-Mental State Examination score. Used for cognitive impairment exclusion if available.
  cognitive_task:
    description: Results from the Wisconsin Card Sorting Test (WCST) or equivalent executive function tasks.
    fields:
    - name: stimulus_type
      type: string
      required: true
      description: Condition type: 'nostalgia' or 'control'.
    - name: perseverative_errors
      type: integer
      required: true
      description: Number of perseverative errors made.
    - name: categories_completed
      type: integer
      required: true
      description: Number of sorting categories successfully completed.
    - name: total_tries
      type: integer
      required: false
      description: Total number of trials attempted.
    - name: response_time_avg
      type: float
      required: false
      description: Average response time in seconds.
constraints:
  age_min: 65
  stimulus_values:
  - nostalgia
  - control
  required_columns:
  - participant_id
  - stimulus_type
  - perseverative_errors
  - categories_completed
  - age
