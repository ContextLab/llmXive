[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-nostalgia-cognitive-fle"
version = "0.1.0"
description = "The Impact of Nostalgia on Cognitive Flexibility in Aging Adults"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "scipy",
    "statsmodels",
    "numpy",
    "pyyaml",
    "openml",
    "datasets",
    "requests",
    "pytest",
    "black",
    "ruff",
]

[tool.black]

[tool.ruff]