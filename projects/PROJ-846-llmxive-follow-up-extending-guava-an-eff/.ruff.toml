# Ruff configuration for llmXive project
# Linting rules with max-line-length=100

[lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

# Ignore specific rules that conflict with project style
ignore = [
    "E501",  # Line too long (handled by formatter, not linter)
    "B008",  # Do not perform function call in argument defaults (common in Pydantic/typing)
]

[lint.isort]
known-first-party = ["code"]
force-sort-within-sections = true

[format]
# Use black-compatible formatting
quote-style = "double"
indent-style = "space"
line-length = 100