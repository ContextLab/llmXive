[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guava-symbolic-pipeline"
version = "0.1.0"
description = "Symbolic extension of the Guava embodied manipulation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "onnxruntime",
    "datasets",
    "transformers",
    "torch",
    "scikit-learn",
    "pandas",
    "numpy",
    "pytest",
    "pydantic",
    "pyyaml",
    "radon",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["code/tests", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"