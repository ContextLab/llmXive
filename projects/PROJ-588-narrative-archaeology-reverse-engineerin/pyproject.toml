[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-archaeology"
version = "0.1.0"
description = "Reverse-engineering story memories from brain data"
requires-python = ">=3.11"
dependencies = [
    "nilearn>=0.10.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.35.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openneuro-cli>=0.1.0",
    "matplotlib>=3.7.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "torch>=2.0.0",
    "pytest>=7.4.0",
    "flake8>=6.1.0",
    "black>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=6.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["code", "tests"]
default_section = "THIRDPARTY"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
