$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Output Schema"
description: "Schema for RSA and Decoding results"
type: object
properties:
  analysis_type:
    type: string
    enum:
      - "RSA"
      - "Decoding"
    description: "Type of analysis performed"
  roi_name:
    type: string
    description: "Region of Interest analyzed"
  metric:
    type: string
    description: "Metric name (e.g., dissimilarity, accuracy)"
  value:
    type: number
    description: "Observed value"
  p_value:
    type: number
    description: "Statistical significance (p < 0.05)"
  corrected_p_value:
    type: number
    description: "FDR corrected p-value"
  chance_level:
    type: number
    description: "Baseline chance level (1/N)"
  n_permutations:
    type: integer
    description: "Number of permutations used"
  subject_count:
    type: integer
    description: "Number of subjects included"
required:
  - analysis_type
  - roi_name
  - metric
  - value
  - p_value
  - n_permutations
additionalProperties: false
