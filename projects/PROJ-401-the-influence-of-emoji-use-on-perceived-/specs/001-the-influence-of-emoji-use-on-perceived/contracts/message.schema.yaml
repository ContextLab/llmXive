$schema: "http://json-schema.org/draft-07/schema#"
title: "Message"
description: "Schema for a single text message record with extracted emoji features and human-rated intensity scores."
type: "object"
properties:
  message_id:
    type: "integer"
    description: "Unique identifier for the message."
  text:
    type: "string"
    description: "The raw text content of the message."
  emoji_present:
    type: "boolean"
    description: "True if at least one emoji is present."
  emoji_count:
    type: "integer"
    minimum: 0
    description: "Total number of emojis in the message."
  emoji_types:
    type: "array"
    items:
      type: "string"
      pattern: "^U\\+[0-9A-Fa-f]+$"
    description: "List of Unicode code points for emojis found."
  text_length:
    type: "integer"
    minimum: 0
    description: "Number of characters in the text."
  punctuation_count:
    type: "integer"
    minimum: 0
    description: "Count of punctuation marks."
  intensity_score:
    type: "integer"
    minimum: 1
    maximum: 7
    description: "Perceived emotional intensity (1-7 Likert scale) from human raters."
  is_proxy:
    type: "boolean"
    const: false
    description: "Always false. Synthetic scores are prohibited."
required:
  - message_id
  - text
  - emoji_present
  - emoji_count
  - emoji_types
  - text_length
  - punctuation_count
  - intensity_score
  - is_proxy
additionalProperties: false