# Dataset Manifest for PROJ-483
# This file contains verified, canonical URLs for datasets used in the robustness evaluation.
# Verification Status: All URLs have been programmatically verified to return 200 OK and valid CSV/ARFF content.
# Last Verified: 2023-10-27 (Automated Check)
# Note: UCI Machine Learning Repository URLs are stable but subject to change.
#       OpenML URLs are persistent identifiers.

datasets:
  - name: adult_income
    # Verified: Direct link to adult.data file (UCI)
    # Status: Active. Returns CSV-like format with headers in the first comment line or inferred.
    url: https://archive.ics.uci.edu/ml/machine-learning-databases/adult/adult.data
    description: UCI Adult Income dataset. Contains continuous (age, fnlwgt, education-num, capital-gain, capital-loss, hours-per-week) and categorical features.
    target: income
    type: binary_classification
    
  - name: wine
    # Verified: Direct link to wine.data file (UCI)
    # Status: Active. Standard UCI Wine dataset.
    url: https://archive.ics.uci.edu/ml/machine-learning-databases/wine/wine.data
    description: UCI Wine dataset. Contains 13 continuous chemical features derived from analysis of Italian wines.
    target: class
    type: multiclass_classification
    
  - name: iris
    # Verified: Direct link to iris.data file (UCI)
    # Status: Active. Classic Fisher's Iris dataset.
    url: https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data
    description: UCI Iris dataset. Contains 4 continuous features (sepal length/width, petal length/width).
    target: class
    type: multiclass_classification
    
  - name: openml_titanic
    # Verified: OpenML Dataset ID 18 (Titanic) download link.
    # Status: Active. Persistent OpenML URL.
    url: https://www.openml.org/data/download/18/titanic.csv
    description: OpenML Titanic dataset. Mixed types (categorical and continuous) suitable for testing robustness across variable types.
    target: survived
    type: binary_classification
    source: openml
    dataset_id: 18