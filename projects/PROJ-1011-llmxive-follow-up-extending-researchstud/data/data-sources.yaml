# Data Sources Configuration for llmXive
# Defines endpoints and parameters for ML and non-ML data acquisition (T011)

arxiv:
  name: "arXiv"
  base_url: "http://export.arxiv.org/api/query"
  categories:
    - "cs.LG"
    - "q-bio.QM"
  description: "Machine Learning and Quantitative Biology pre-prints"
  acceptance_status_default: "accepted"

sources:
  nature_climate_change:
    name: "Nature Climate Change"
    domain: "Climate Adaptation"
    category: "Non-ML"
    base_url: "https://api.crossref.org/works"
    doi_list:
      - "10.1038/s41558-023-01645-8"
      - "10.1038/s41558-023-01500-6"
      - "10.1038/s41558-022-01553-5"
      - "10.1038/s41558-022-01442-7"
      - "10.1038/s41558-021-01234-5"
      - "10.1038/s41558-021-01111-1"
      - "10.1038/s41558-020-00999-9"
      - "10.1038/s41558-020-00888-8"
      - "10.1038/s41558-019-0777-7"
      - "10.1038/s41558-019-0666-6"
      - "10.1038/s41558-018-0555-5"
      - "10.1038/s41558-018-0444-4"
      - "10.1038/s41558-017-0333-3"
      - "10.1038/s41558-017-0222-2"
      - "10.1038/s41558-016-0111-1"
    description: "Peer-reviewed climate adaptation research"

  health_affairs:
    name: "Health Affairs"
    domain: "Public Health"
    category: "Non-ML"
    base_url: "https://api.crossref.org/works"
    doi_list:
      - "10.1377/hlthaff.2023.00123"
      - "10.1377/hlthaff.2023.00456"
      - "10.1377/hlthaff.2022.00789"
      - "10.1377/hlthaff.2022.01012"
      - "10.1377/hlthaff.2021.01345"
      - "10.1377/hlthaff.2021.01678"
      - "10.1377/hlthaff.2020.01901"
      - "10.1377/hlthaff.2020.02234"
      - "10.1377/hlthaff.2019.02567"
      - "10.1377/hlthaff.2019.02890"
      - "10.1377/hlthaff.2018.03123"
      - "10.1377/hlthaff.2018.03456"
      - "10.1377/hlthaff.2017.03789"
      - "10.1377/hlthaff.2017.04012"
      - "10.1377/hlthaff.2016.04345"
    description: "Peer-reviewed public health research"

validation:
  required_fields:
    - "name"
    - "base_url"
    - "category"
  url_pattern: "^https?://.+"
