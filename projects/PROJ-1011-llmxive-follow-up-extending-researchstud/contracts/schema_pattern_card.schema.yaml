$schema: "http://json-schema.org/draft-07/schema#"
title: PatternCard
type: object
additionalProperties: false
required: [pattern_id, title, description, problem_domain, solution_strategy]
properties:
  pattern_id: {type: string, minLength: 1}
  title: {type: string, minLength: 1}
  description: {type: string, minLength: 1}
  problem_domain: {type: string, minLength: 1}
  solution_strategy: {type: string, minLength: 1}
  key_components: {type: array, items: {type: string}}
  examples: {type: array, items: {type: string}}
  source_references: {type: array, items: {type: string}}
  tags: {type: array, items: {type: string}}
  created_at: {type: string}
  metadata: {type: object}
  hash: {type: string}
