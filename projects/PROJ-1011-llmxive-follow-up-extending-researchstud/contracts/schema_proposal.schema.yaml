$schema: "http://json-schema.org/draft-07/schema#"
title: Proposal
type: object
additionalProperties: false
required: [proposal_id, problem_statement, group_type, text, domain]
properties:
  proposal_id: {type: string, minLength: 1}
  problem_statement: {type: string, minLength: 1}
  group_type: {type: string, enum: [pattern-guided, baseline]}
  text: {type: string, minLength: 1}
  domain: {type: string, minLength: 1}
  pattern_ids: {type: array, items: {type: string}}
  pattern_confidence_scores: {type: array, items: {type: number}}
  model_name: {type: string}
  generated_at: {type: string}
  token_count: {type: integer, minimum: 0}
  generation_time_seconds: {type: number, minimum: 0}
  metadata: {type: object}
  hash: {type: string}
