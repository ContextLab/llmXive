$schema: "http://json-schema.org/draft-07/schema#"
title: "Abstract Schema"
description: "Schema for research abstracts (ML and Non-ML)"
type: object
properties:
  id:
    type: string
    description: "Unique identifier for the abstract"
  title:
    type: string
    description: "Title of the research paper"
  abstract:
    type: string
    description: "Full text of the abstract"
    minLength: 1
  venue:
    type: string
    description: "Name of the conference or journal"
  domain:
    type: string
    enum:
      - "ML"
      - "PublicHealth"
      - "Climate"
    description: "Domain classification"
  acceptance_status:
    type: string
    enum:
      - "accepted"
      - "rejected"
    description: "Publication status"
  source_url:
    type: string
    format: uri
    description: "Original URL of the abstract"
  checksum:
    type: string
    description: "SHA-256 checksum of the raw data"
required:
  - id
  - title
  - abstract
  - venue
  - domain
  - acceptance_status
  - source_url
  - checksum
additionalProperties: false
