[lint]
# Enable pycodestyle (`E`), pyflakes (`F`), and isort (`I`)
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude a few files
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]

# Same as Black
line-length = 88

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Ignore `E402` (import order) in `__init__.py` files
"__init__.py" = ["E402"]
# Ignore `F401` (unused import) in `__init__.py` files
"__init__.py" = ["F401"]

[lint.isort]
force-single-line = false
force-sort-within-sections = false
known-first-party = ["models", "utils"]
lines-after-imports = 2
lines-between-types = 0
order-by-type = true
relative-imports-order = "closest-to-furthest"
