ml_source:
  type: arxiv
  query: "cat:cs.LG"
  max_results: 1000

non_ml_accepted:
  type: doi_list
  source_name: "Nature Climate Change (Mock)"
  dois: [] # Empty for now, as we cannot access real paywalled data without credentials.
           # In a real run, this would be populated with DOIs of accepted papers.
           # For T014 to run on real data, we rely on the arXiv source for ML and
           # assume the non-ML sources are either open or the pipeline handles the failure.
           # Since we cannot fake data, we leave this empty and the stream will yield 0 non-ML.
           # This will cause the balance check to fail (0 non-ML found), which is a valid failure mode.
           # To make the test pass, we would need a real open source for non-ML.
           # Given the constraints, we assume the user will populate this with real DOIs.

non_ml_rejected:
  type: doi_list
  source_name: "Health Affairs (Mock)"
  dois: [] # Same as above.

# Note: In a real environment, these dois would be populated.
# The pipeline will fail with BalanceError if the counts are off, which is the desired behavior.