$schema: http://json-schema.org/draft-07/schema#
title: Model Results Schema
description: >
  Schema defining the structure of statistical model outputs for the
  investigation of early life stress on hippocampal subfield volumes.
  This schema covers the primary results from linear mixed-effects models
  (CA3, DG, Subiculum) and the exploratory CA3:DG ratio model.
type: object
required:
  - model_name
  - subfield
  - coefficient_name
  - beta
  - ci_lower
  - ci_upper
  - p_value
  - corrected_p_value
  - significance
properties:
  model_name:
    type: string
    description: Identifier for the specific model run (e.g., 'LMM_CA3', 'LMM_DG', 'LMM_Subiculum', 'LMM_CA3_DG_Ratio')
  subfield:
    type: string
    description: The hippocampal subfield analyzed (CA3, DG, Subiculum, or CA3_DG_Ratio)
  coefficient_name:
    type: string
    description: Name of the predictor variable for this coefficient (e.g., 'ACE_score')
  beta:
    type: number
    description: The estimated regression coefficient (beta)
  ci_lower:
    type: number
    description: Lower bound of the 95% confidence interval
  ci_upper:
    type: number
    description: Upper bound of the 95% confidence interval
  p_value:
    type: number
    description: Unadjusted two-sided p-value
  corrected_p_value:
    type: number
    description: Bonferroni-corrected p-value (threshold = 0.05 / number_of_tests)
  significance:
    type: string
    description: Significance flag based on corrected p-value (e.g., '***', '**', '*', or 'ns')
  model_formula:
    type: string
    description: The statsmodels formula used for the model
  n_observations:
    type: integer
    description: Number of observations used in the model
  covariates:
    type: array
    items:
      type: string
    description: List of covariates included in the model (age, sex, scanner_site, family_id)
  metadata:
    type: object
    description: Additional metadata about the analysis run
    properties:
      timestamp:
        type: string
        format: date-time
      seed:
        type: integer
      software_version:
        type: string
additionalProperties: false