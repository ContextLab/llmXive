# Schema for Model Results
# Defines the structure for statistical model outputs including coefficients,
# confidence intervals, and p-values (both uncorrected and corrected).
#
# Used by: code/analysis/results.py, code/analysis/save_results.py
# Generated by: T006b

$schema: http://json-schema.org/draft-07/schema#
title: ModelResultsSchema
description: >
  Schema defining the structure of model output records.
  Each record represents a statistical test result for a specific hippocampal subfield
  or ratio, including effect size (beta), confidence intervals, and significance metrics.

type: object
required:
  - subfield
  - beta
  - ci_lower
  - ci_upper
  - p_value_uncorrected
  - p_value_corrected
  - model_formula
  - n_observations
  - n_parameters
properties:
  subfield:
    type: string
    description: >
      Name of the hippocampal subfield or metric analyzed.
      Allowed values: "CA3", "DG", "Subiculum", "CA3:DG_Ratio"
    enum:
      - CA3
      - DG
      - Subiculum
      - CA3:DG_Ratio

  beta:
    type: number
    format: float
    description: >
      Standardized regression coefficient (beta) for the primary predictor (ACE score).
      Represents the change in normalized subfield volume per unit increase in ACE score.
    minimum: -Infinity
    maximum: Infinity

  ci_level:
    type: number
    default: 0.95
    description: Confidence level used for interval calculation (e.g., 0.95 for 95% CI).

  ci_lower:
    type: number
    format: float
    description: Lower bound of the confidence interval for the beta coefficient.
    minimum: -Infinity
    maximum: Infinity

  ci_upper:
    type: number
    format: float
    description: Upper bound of the confidence interval for the beta coefficient.
    minimum: -Infinity
    maximum: Infinity

  p_value_uncorrected:
    type: number
    format: float
    description: >
      Two-tailed p-value from the linear mixed-effects model without multiple comparison correction.
    minimum: 0.0
    maximum: 1.0

  p_value_corrected:
    type: number
    format: float
    description: >
      P-value after applying Bonferroni correction for multiple comparisons.
      Threshold typically set at 0.05 / number_of_tests (e.g., 0.05/3 = 0.0167).
    minimum: 0.0
    maximum: 1.0

  is_significant_corrected:
    type: boolean
    description: >
      Boolean flag indicating if the result is significant after correction.
      Calculated as: p_value_corrected < alpha_threshold (default 0.05).

  model_formula:
    type: string
    description: >
      The R-style formula string used for the linear mixed-effects model.
      Example: "subfield_vol ~ ACE_score + age + sex + scanner_site + (1|family_id)"

  model_type:
    type: string
    description: Type of statistical model used.
    enum:
      - LMM
      - LME

  n_observations:
    type: integer
    description: Total number of observations (participants) included in the model.
    minimum: 1

  n_parameters:
    type: integer
    description: Number of estimated parameters in the model.
    minimum: 1

  random_effects_structure:
    type: string
    description: >
      Description of the random effects structure used in the model.
      Example: "(1|family_id)"

  covariates:
    type: array
    items:
      type: string
    description: List of covariates included in the fixed effects (excluding the primary predictor).
    example: ["age", "sex", "scanner_site"]

  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the model was run.

  software_version:
    type: string
    description: Version of the statsmodels or relevant library used.

additionalProperties: false

# Example instance for validation:
# {
#   "subfield": "CA3",
#   "beta": -0.0452,
#   "ci_level": 0.95,
#   "ci_lower": -0.0812,
#   "ci_upper": -0.0092,
#   "p_value_uncorrected": 0.0124,
#   "p_value_corrected": 0.0372,
#   "is_significant_corrected": false,
#   "model_formula": "CA3_vol ~ ACE_score + age + sex + scanner_site + (1|family_id)",
#   "model_type": "LMM",
#   "n_observations": 4500,
#   "n_parameters": 12,
#   "random_effects_structure": "(1|family_id)",
#   "covariates": ["age", "sex", "scanner_site"],
#   "timestamp": "2023-10-27T14:30:00Z",
#   "software_version": "1.0.0"
# }