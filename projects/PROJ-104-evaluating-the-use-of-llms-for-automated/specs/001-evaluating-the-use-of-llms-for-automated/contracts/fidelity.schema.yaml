$schema: "http://json-schema.org/draft-07/schema#"
title: "FidelityMetric"
type: object
properties:
  sample_id:
    type: string
    description: "Composite key `{commit_hash}_{model_id}`."
  model_id:
    type: string
    enum: ["phi3-mini", "gemma2-2b", "llama3.2-3b"]
    description: "Identifier of the LLM used."
  precision_intent:
    type: number
    minimum: 0
    maximum: 1
    description: "Precision for technical‑intent entities."
  recall_intent:
    type: number
    minimum: 0
    maximum: 1
    description: "Recall for technical‑intent entities."
  precision_surface:
    type: number
    minimum: 0
    maximum: 1
    description: "Precision for surface entities."
  recall_surface:
    type: number
    minimum: 0
    maximum: 1
    description: "Recall for surface entities."
  hallucination_rate:
    type: number
    minimum: 0
    maximum: 1
    description: "Proportion of generated surface entities not found in the repository codebase."
  intent_hallucination_rate:
    type: number
    minimum: 0
    maximum: 1
    description: "Proportion of generated intent entities not supported by any codebase token or gold intent annotation."
  timestamp:
    type: string
    format: date-time
    description: "When the metric was computed."
required:
  - sample_id
  - model_id
  - precision_intent
  - recall_intent
  - precision_surface
  - recall_surface
  - hallucination_rate
  - intent_hallucination_rate
  - timestamp
additionalProperties: false