$schema: "http://json-schema.org/draft-07/schema#"
title: CommitPair
type: object
properties:
  commit_hash:
    type: string
    pattern: "^[0-9a-f]{40}$"
    description: "The SHA hash of the commit, expressed as a fixed‑length character string."
  commit_message:
    type: string
    description: "The full commit message."
  repository_name:
    type: string
    description: "The name of the target repository."
  doc_diff:
    type: string
    description: "The isolated diff of documentation files (.md or .rst)."
  timestamp:
    type: string
    format: date-time
    description: "ISO-8601 timestamp of the commit."
required:
  - commit_hash
  - commit_message
  - repository_name
  - doc_diff
  - timestamp
