# JSON Schema for CommitPair entries
$schema: "http://json-schema.org/draft-07/schema#"
title: CommitPair
type: object
required:
  - commit_hash
  - commit_message
  - repository_name
  - doc_diff
  - timestamp
properties:
  commit_hash:
    type: string
    pattern: "^[0-9a-f]{40}$"
    description: "Full 40‑character SHA‑1 hash of the commit."
  commit_message:
    type: string
    minLength: 1
    description: "The commit message text."
  repository_name:
    type: string
    enum:
      - pandas
      - requests
      - scikit-learn
      - flask
      - django
    description: "Name of the source repository (as defined in the extraction script)."
  doc_diff:
    type: string
    minLength: 1
    description: "Unified diff (patch) containing only documentation changes (.md or .rst)."
  timestamp:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp of the commit author date."
