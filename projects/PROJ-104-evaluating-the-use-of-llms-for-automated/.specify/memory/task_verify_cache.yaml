T006:
  c: false
  h: 70dd70e29daa6152206cc7158d755cca4118c047263af669197e9e02223dfcf0
  r: "The repository contains `code/generation.py` and the expected output files,\
    \ but the script deliberately skips real 4\u2011bit CPU model loading, does not\
    \ enforce the required decoding parameters, lacks any retry\u2011logic or `log.txt`\
    \ files, provides no timing or timeout evidence, and `data/metadata.yaml` does\
    \ not record SHA\u2011256 checksums for the generated documentation files. Consequently\
    \ the core requirements of loading the three LLMs on CPU and measuring true success\u2011\
    rate performance are not met."
  sig: 6f6e0da8ca05012ab6a1c5add3f8d27e5284b7d673a512ca20dcbdfd12d96738
T007:
