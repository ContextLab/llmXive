T001:
  c: false
  h: aca2dbf975796052126fb1e490593ec8d0bb4300fb7b44af29987a97c979d73f
  r: "The quick\u2011start markdown is present and correct, but `code/run_pipeline.py`\
    \ raises a `NameError: name 'json' is not defined` during the smoke\u2011test\
    \ (see the test log), causing the command to exit with code\u202F1 and the `pytest\
    \ tests/test_quickstart.py` suite to fail. The missing `import json` (and the\
    \ broken `_write_dummy_intent_json` helper) prevents the required intent\u2011\
    entity JSON file from being written and makes the verification step fail. Fix\
    \ the import and ensure the smoke\u2011test runs successfully within 30\u202F\
    s."
  sig: f2c3e9b12253fe8165f4387412323202185ca63a3b70fae363a79ba78597fe98
T002:
  c: true
  h: 0de49338aea0cfd9acebbe7002f8052720fea440d1594609a418e745c2d1c3c0
  r: "Checked `code/power_analysis.py` (implements seeded Monte\u2011Carlo simulation,\
    \ estimates power for n\u202F=\u202F500, f\u202F=\u202F0.25, writes the markdown)\
    \ and the generated `results/power_report.md` (contains a numeric power estimate\
    \ and the correct `exploratory` flag). All required artifacts exist and match\
    \ the task specifications."
