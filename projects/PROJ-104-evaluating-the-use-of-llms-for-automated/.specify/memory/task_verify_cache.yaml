  r: "The `code/data_hygiene.py` module writes checksum entries with a `\"checksum\"\
    ` field, but the existing `data/metadata.yaml` uses `\"sha256\"` keys, causing\
    \ a `KeyError` in the tests and leaving many data files without entries. Consequently,\
    \ the test `test_metadata_covers_all_data_files` and the immutability test both\
    \ fail, so the checksum\u2011recording requirement is not met. The `SEED = 42`\
    \ implementation is present, but the overall task is incomplete."
