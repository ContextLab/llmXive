$schema: http://json-schema.org/draft-07/schema#
title: 316L LPBF Porosity Dataset Schema
description: Schema for the 316L Stainless Steel Laser Powder Bed Fusion dataset.
type: object
properties:
  columns:
    type: array
    items:
      type: string
    contains:
      - "laser_power"
      - "scan_speed"
      - "hatch_spacing"
      - "layer_thickness"
      - "porosity"
      - "energy_density"
required:
  - columns
