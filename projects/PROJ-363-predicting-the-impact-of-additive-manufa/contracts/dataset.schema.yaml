# Dataset Schema for 316L Stainless Steel LPBF Porosity Prediction
# Generated by T004b
description: "Schema for the 316L LPBF additive manufacturing dataset"

required_columns:
  - laser_power
  - scan_speed
  - hatch_spacing
  - layer_thickness
  - porosity
  - energy_density

column_definitions:
  laser_power:
    type: numeric
    description: "Laser power in Watts"
    unit: W
  scan_speed:
    type: numeric
    description: "Scan speed in mm/s"
    unit: mm/s
  hatch_spacing:
    type: numeric
    description: "Hatch spacing in mm"
    unit: mm
  layer_thickness:
    type: numeric
    description: "Layer thickness in mm"
    unit: mm
  porosity:
    type: numeric
    description: "Measured porosity percentage"
    unit: %
  energy_density:
    type: numeric
    description: "Volumetric Energy Density (J/mm^3)"
    unit: J/mm^3

constraints:
  value_ranges:
    laser_power:
      min: 0.0
      max: 1000.0
    scan_speed:
      min: 0.0
      max: 5000.0
    hatch_spacing:
      min: 0.0
      max: 1.0
    layer_thickness:
      min: 0.0
      max: 0.2
    porosity:
      min: 0.0
      max: 100.0
    energy_density:
      min: 0.0
      max: 500.0
  porosity_variance:
    min_variance: 0.000001
    description: "Porosity must have non-zero variance to be a valid dataset"
