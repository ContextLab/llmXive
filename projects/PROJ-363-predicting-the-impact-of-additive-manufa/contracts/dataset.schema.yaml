$schema: "http://json-schema.org/draft-07/schema#"
title: "316L LPBF Dataset Schema"
description: "Schema for the processed 316L Stainless Steel LPBF dataset"
type: object
properties:
  laser_power:
    type: number
    description: "Laser power in Watts"
    minimum: 0
  scan_speed:
    type: number
    description: "Scan speed in mm/s"
    minimum: 0
  hatch_spacing:
    type: number
    description: "Hatch spacing in mm"
    minimum: 0
  layer_thickness:
    type: number
    description: "Layer thickness in mm"
    minimum: 0
  porosity:
    type: number
    description: "Porosity percentage"
  energy_density:
    type: number
    description: "Volumetric energy density in J/mm^3"
    minimum: 0
required:
  - laser_power
  - scan_speed
  - hatch_spacing
  - layer_thickness
  - porosity
  - energy_density
