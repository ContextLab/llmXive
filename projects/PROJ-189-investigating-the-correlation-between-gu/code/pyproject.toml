[project]
name = "gut-microbiome-cognitive-decline"
version = "0.1.0"
description = "Investigating the correlation between gut microbiome and cognitive decline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "requests>=2.28.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "joblib>=1.2.0",
    "openpyxl>=3.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = [
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "data/",
    "docs/",
]

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",   # pycodes (errors)
    "W",   # warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # mccabe complexity
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "PTH", # path
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in arguments (common in ML)
    "S101",  # use of assert (allowed for validation)
]

[tool.ruff.per-file-ignores]
"code/utils/*" = ["N802", "N803"]  # Function name casing in utils

[tool.ruff.isort]
known-first-party = ["utils"]
section-ordering = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
