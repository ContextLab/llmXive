$schema: "http://json-schema.org/draft-07/schema#"
title: "Unified Results Schema"
description: "Schema covering paired dataset metadata, Spearman correlation results, and Random Forest model performance (including permutation null, VIF flags, and SHAP analysis)."
type: object
properties:
  dataset:
    type: object
    properties:
      metadata:
        type: object
        properties:
          source:
            type: string
            description: "Identifier or URL of the dataset source."
          total_samples:
            type: integer
            description: "Number of rows after age filtering."
          age_filter:
            type: integer
            description: "Minimum age applied."
          checksum:
            type: string
            description: "SHA‑256 checksum of the raw paired dataset."
        required:
          - source
          - total_samples
          - age_filter
          - checksum
      samples:
        type: array
        items:
          type: object
          properties:
            sample_id:
              type: string
            participant_id:
              type: string
            age:
              type: integer
              minimum: 60
            sex:
              type: string
              enum:
                - Male
                - Female
                - "Other"
                - Unknown
            bmi:
              type: number
              minimum: 0
            is_missing_bi
            # truncated for brevity – the rest of the schema remains unchanged
properties: {}