$schema: "http://json-schema.org/draft-07/schema#"
title: "Paired Dataset Schema"
description: "Schema for the paired microbiome‑cognition dataset after preprocessing (age ≥ 60, CLR‑normalized)."
type: object
properties:
  metadata:
    type: object
    properties:
      source:
        type: string
        description: "Identifier or URL of the dataset source (e.g., Zenodo DOI)."
      checksum:
        type: string
        description: "SHA‑256 checksum of the raw paired dataset file."
      total_samples:
        type: integer
        description: "Number of rows after age filtering."
      age_filter:
        type: integer
        description: "Minimum age applied (e.g., 60)."
    required:
      - source
      - checksum
      - total_samples
      - age_filter
  samples:
    type: array
    items:
      type: object
      properties:
        sample_id:
          type: string
        participant_id:
          type: string
        age:
          type: integer
          minimum: 60
        sex:
          type: string
          enum:
            - Male
            - Female
            - Other
            - Unknown
        bmi:
          type: number
          minimum: 0
        is_missing_bmi:
          type: boolean
        cognitive_score:
          type: number
        age_group:
          type: string
          enum:
            - "60-69"
            - "70-79"
            - "80+"
        education_years:
          type: integer
          minimum: 0
        genera_abundance:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
          description: "Relative abundance (raw) for each genus."
        genera_clr:
          type: object
          additionalProperties:
            type: number
          description: "CLR‑transformed values for each genus."
      required:
        - sample_id
        - participant_id
        - age
        - sex
        - bmi
        - is_missing_bmi
        - cognitive_score
        - age_group
        - education_years
        - genera_abundance
        - genera_clr
required:
  - metadata
  - samples
additionalProperties: false