$schema: "http://json-schema.org/draft-07/schema#"
title: "Merged Dataset Schema"
description: "Schema for the merged AGP‑HRS dataset after preprocessing (age ≥ 60, CLR‑normalized)."
type: object
properties:
  metadata:
    type: object
    properties:
      source_agp:
        type: string
        description: "AGP source identifier (Qiita study ID or URL)"
      source_hrs:
        type: string
        description: "HRS source identifier (URL or DUA reference)"
      merge_key:
        type: string
        description: "Column name used for merging (participant_id)"
      total_samples:
        type: integer
        description: "Number of rows after merge and age filter"
      age_filter:
        type: integer
        description: "Minimum age applied (60)"
    required:
      - source_agp
      - source_hrs
      - merge_key
      - total_samples
      - age_filter
  samples:
    type: array
    items:
      type: object
      properties:
        sample_id:
          type: string
        participant_id:
          type: string
        age:
          type: integer
          minimum: 60
        sex:
          type: string
          enum:
            - Male
            - Female
            - Other
            - Unknown
        bmi:
          type: number
          minimum: 0
        is_missing_bmi:
          type: boolean
        cognitive_score:
          type: number
        age_group:
          type: string
          enum:
            - "60-69"
            - "70-79"
            - "80+"
        genera_abundance:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
          description: "Relative abundance (raw) for each genus"
        genera_clr:
          type: object
          additionalProperties:
            type: number
          description: "CLR‑transformed values for each genus"
      required:
        - sample_id
        - participant_id
        - age
        - sex
        - bmi
        - is_missing_bmi
        - cognitive_score
        - age_group
        - genera_abundance
        - genera_clr
required:
  - metadata
  - samples
additionalProperties: false
