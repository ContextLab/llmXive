[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-189-gut-cognition"
version = "0.1.0"
description = "Investigating the correlation between gut microbiome and cognitive decline"
requires-python = ">=3.11"
dependencies = [
    "pandas", "scikit-learn", "scipy", "statsmodels",
    "scikit-bio", "numpy", "seaborn", "pytest", "ruff", "black", "pyyaml", "requests", "pydantic"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B006", # mutable default arguments
    "B008", # function calls in default arguments
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
