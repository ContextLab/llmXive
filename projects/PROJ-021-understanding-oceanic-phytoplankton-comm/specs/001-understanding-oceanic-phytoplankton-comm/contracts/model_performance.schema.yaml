$schema: http://json-schema.org/draft-07/schema#
title: Model Performance Metrics Schema
description: Schema for validating model comparison and evaluation metrics artifacts (e.g., model_comparison.csv, significance_test.json).
type: object
required:
  - model_name
  - metrics
properties:
  model_name:
    type: string
    description: Name of the model (e.g., "RandomForest", "SimpleVLM")
    enum:
      - RandomForest
      - SimpleVLM
  metrics:
    type: object
    description: Dictionary of performance metrics
    required:
      - rmse
      - r2
      - mae
    properties:
      rmse:
        type: number
        description: Root Mean Squared Error
        minimum: 0
      r2:
        type: number
        description: Coefficient of Determination
      mae:
        type: number
        description: Mean Absolute Error
        minimum: 0
      basin_breakdown:
        type: array
        description: Optional per-basin metrics
        items:
          type: object
          required:
            - basin
            - r2
            - rmse
            - mae
          properties:
            basin:
              type: string
            r2:
              type: number
            rmse:
              type: number
            mae:
              type: number
  training_time_seconds:
    type: number
    description: Total wall-clock training time
    minimum: 0
  inference_time_per_sample_ms:
    type: number
    description: Average inference latency
    minimum: 0
  status:
    type: string
    description: Status of the model run
    enum:
      - success
      - failed
      - partial
additionalProperties: false
