$schema: http://json-schema.org/draft-07/schema#
title: PhytoplanktonSample
description: |
  Schema for a single phytoplankton measurement point, containing location,
  timestamp, chlorophyll-a concentration, and associated environmental drivers.
  This represents the core data entity for the phytoplankton analysis pipeline.
type: object
required:
  - lat
  - lon
  - timestamp
  - chlorophyll_a
  - temp
  - salinity
  - nutrients
properties:
  lat:
    type: number
    description: Latitude coordinate in decimal degrees (-90 to 90)
    minimum: -90
    maximum: 90
  lon:
    type: number
    description: Longitude coordinate in decimal degrees (-180 to 180)
    minimum: -180
    maximum: 180
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 formatted datetime of measurement
  basin:
    type: string
    description: |
      Ocean basin identifier (e.g., north_atlantic, south_pacific, indian_ocean).
      Optional field populated during preprocessing.
    enum:
      - north_atlantic
      - south_atlantic
      - north_pacific
      - south_pacific
      - indian_ocean
      - southern_ocean
      - arctic
      - unknown
  chlorophyll_a:
    type: number
    description: Chlorophyll-a concentration in mg/m³ (target variable)
    minimum: 0
  temp:
    type: number
    description: Sea surface temperature in °C
    minimum: -2
    maximum: 40
  salinity:
    type: number
    description: Sea surface salinity in PSU (Practical Salinity Units)
    minimum: 0
    maximum: 42
  nutrients:
    type: number
    description: Nutrient concentration (nitrate or equivalent) in μmol/L
    minimum: 0
  quality_flags:
    type: integer
    description: |
      Quality flag bitmask for data reliability.
      0 = good, 1 = cloud contaminated, 2 = high aerosol, 3+ = other issues.
      Optional field from MODIS or other satellite sources.
    minimum: 0
additionalProperties: false
examples:
  - lat: 25.5
    lon: -45.2
    timestamp: "2015-06-15T12:00:00Z"
    basin: north_atlantic
    chlorophyll_a: 0.35
    temp: 24.5
    salinity: 36.2
    nutrients: 0.8
    quality_flags: 0
