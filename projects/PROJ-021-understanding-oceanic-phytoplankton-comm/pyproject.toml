[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phytoplankton-vlm-analysis"
version = "0.1.0"
description = "Understanding Oceanic Phytoplankton Communities through Remote Sensing and Oceanographic Data"
requires-python = ">=3.11"
authors = [
    {name = "llmXive", email = "research@llmxive.org"}
]
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "torch",
    "transformers",
    "xarray",
    "netCDF4",
    "matplotlib",
    "seaborn",
    "datasets",
    "copernicusmarine",
    "psutil",
    "pyyaml",
    "requests",
    "jsonschema"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff"
]

[tool.setuptools]
packages = ["code"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W"]
