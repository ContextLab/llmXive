$schema: "http://json-schema.org/draft-07/schema#"
title: "Ingestion Report Schema"
description: "JSON report generated after the data ingestion and filtering step."
type: "object"
properties:
  status:
    type: "string"
    description: "Status of the ingestion process."
    enum:
      - "success"
      - "blocked"
      - "error"
  reason:
    type: "string"
    description: "Explanation of the status. If blocked, explains the missing data source."
    nullable: true
  total_initial_samples:
    type: "integer"
    description: "Total number of samples in the raw dataset."
    nullable: true
  total_final_samples:
    type: "integer"
    description: "Total number of samples after filtering."
    nullable: true
  exclusion_rate_antibiotic:
    type: "number"
    description: "Proportion of samples excluded due to antibiotic use."
    nullable: true
  exclusion_rate_missing_sleep:
    type: "number"
    description: "Proportion of samples excluded due to missing sleep data."
    nullable: true
  timestamp:
    type: "string"
    description: "ISO 8601 timestamp of the report generation."
required:
  - "status"
  - "timestamp"
additionalProperties: false