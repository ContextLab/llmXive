$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Results Schema"
description: "Schema for the statistical correlation results between diversity and sleep metrics."
type: "object"
properties:
  diversity_metric:
    type: "string"
    description: "Name of the diversity metric (e.g., 'shannon', 'simpson')."
  sleep_metric:
    type: "string"
    description: "Name of the sleep metric (e.g., 'efficiency', 'duration')."
  r_value:
    type: "number"
    description: "Spearman correlation coefficient."
    nullable: true
  p_value:
    type: "number"
    description: "Raw p-value."
    nullable: true
  q_value:
    type: "number"
    description: "Benjamini-Hochberg adjusted p-value."
    nullable: true
  is_significant:
    type: "boolean"
    description: "True if q_value < 0.05."
    nullable: true
  is_moderate:
    type: "boolean"
    description: "True if |r| > 0.3."
    nullable: true
  status:
    type: "string"
    description: "Status of the row. 'blocked' if the analysis could not be performed."
    enum:
      - "valid"
      - "blocked"
  hash:
    type: "string"
    description: "SHA-256 hash of the artifact for self-verification. For blocked artifacts, derived from plan.md content hash."
    nullable: true
required:
  - "diversity_metric"
  - "sleep_metric"
  - "status"
additionalProperties: false