[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-moebius-dynamic"
version = "0.1.0"
description = "Dynamic rank adjustment for Moebius 0.2B image inpainting"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "datasets>=2.14.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "scipy>=1.11.0",
    "lpips>=0.1.4",
    "torchmetrics>=0.11.0",
    "tqdm>=4.65.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "W", "I"]
ignore = []

[tool.black]
line-length = 88
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
