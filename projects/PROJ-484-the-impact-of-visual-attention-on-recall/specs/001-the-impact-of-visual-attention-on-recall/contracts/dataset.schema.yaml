# Dataset Schema Validation Contract
# Project: PROJ-484-the-impact-of-visual-attention-on-recall
# Task: T006
# Description: YAML schema for the analysis-ready CSV generated by the preprocessing pipeline.
# Based on Key Entities: Participant, Stimulus, Trial.

schema_version: "1.0.0"
target_file: "data/processed/analysis.csv"
delimiter: ","

entities:
  participant:
    description: "Unique participant identifier and demographic/psychometric data."
    required: true
  stimulus:
    description: "Stimulus identification and emotional valence classification."
    required: true
  trial:
    description: "Trial-level metrics including fixation data and recall outcomes."
    required: true

columns:
  # Participant Entity
  - name: participant_id
    type: string
    required: true
    description: "Unique identifier for the participant (e.g., 'P001')."
    constraints:
      - non_empty
      - unique_per_group
  
  - name: stai_score
    type: float
    required: true
    description: "State-Trait Anxiety Inventory (STAI) total score."
    constraints:
      - range: [20, 80]
      - not_null
  
  # Stimulus Entity
  - name: stimulus_id
    type: string
    required: true
    description: "Unique identifier for the stimulus (e.g., IAPS ID or NimStim ID)."
    constraints:
      - non_empty
  
  - name: valence
    type: integer
    required: true
    description: "Emotional valence rating of the stimulus."
    constraints:
      - enum: [1, 2, 3, 4, 5]
      - description: "1=Very Negative, 2=Negative, 3=Neutral, 4=Positive, 5=Very Positive"
  
  - name: arousal
    type: integer
    required: false
    description: "Emotional arousal rating (optional, for exploratory analysis)."
    constraints:
      - range: [1, 9]
      - nullable: true
  
  # Trial Entity
  - name: trial_id
    type: string
    required: true
    description: "Unique identifier for the trial (e.g., 'P001_S001_T01')."
    constraints:
      - non_empty
      - unique
  
  - name: recall_correct
    type: integer
    required: true
    description: "Binary outcome: 1 if the stimulus was correctly recalled, 0 otherwise."
    constraints:
      - enum: [0, 1]
  
  - name: fixation_duration_ms
    type: float
    required: true
    description: "Total duration of fixations on the stimulus in milliseconds."
    constraints:
      - min: 0.0
      - not_null
  
  - name: fixation_count
    type: integer
    required: true
    description: "Number of distinct fixations detected on the stimulus."
    constraints:
      - min: 0
  
  - name: pupil_dilation_mean
    type: float
    required: false
    description: "Mean pupil dilation during the stimulus presentation (optional)."
    constraints:
      - min: 0.0
      - nullable: true
  
  - name: blink_count
    type: integer
    required: false
    description: "Number of blinks detected during the trial."
    constraints:
      - min: 0
      - nullable: true
  
validation_rules:
  - rule: "participant_id must exist in the raw data participant manifest."
    severity: error
  - rule: "stimulus_id must be mappable to a known valence value."
    severity: error
  - rule: "fixation_duration_ms must be > 0 for included trials (unless explicitly allowed by config)."
    severity: warning
  - rule: "All required columns must be present and non-null."
    severity: error
  - rule: "Data types must strictly match definitions."
    severity: error