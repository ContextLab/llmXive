# Dataset Schema Validation Contract
# Defines the expected structure for the analysis-ready CSV generated by the preprocessing pipeline.
# This schema is used by `code/validate_schemas.py` to ensure data integrity before modeling.
#
# Based on Key Entities: Participant, Stimulus, Trial
# Source: specs/001-visual-attention-recall/spec.md

schema_version: "1.0"
file_type: "csv"
output_path: "data/processed/analysis.csv"

required_columns:
  # Participant Level Data
  - name: participant_id
    type: string
    description: Unique identifier for the participant
    nullable: false
    pattern: "^sub-[0-9]{3}$"

  - name: stai_total
    type: integer
    description: State-Trait Anxiety Inventory total score
    nullable: false
    min_value: 20
    max_value: 80

  - name: age
    type: integer
    description: Participant age in years
    nullable: true
    min_value: 18
    max_value: 100

  - name: gender
    type: string
    description: Participant gender
    nullable: true
    allowed_values: ["M", "F", "Other", "Prefer not to say"]

  # Stimulus Level Data
  - name: stimulus_id
    type: string
    description: Unique identifier for the stimulus (e.g., IAPS ID)
    nullable: false
    pattern: "^\\d{4}$"

  - name: valence
    type: float
    description: Emotional valence rating (1-9 scale)
    nullable: false
    min_value: 1.0
    max_value: 9.0

  - name: arousal
    type: float
    description: Emotional arousal rating (1-9 scale)
    nullable: true
    min_value: 1.0
    max_value: 9.0

  - name: stimulus_category
    type: string
    description: Category of the stimulus (e.g., neutral, positive, negative)
    nullable: false
    allowed_values: ["neutral", "positive", "negative"]

  # Trial Level Data
  - name: trial_id
    type: string
    description: Unique identifier for the trial
    nullable: false
    pattern: "^trial-[0-9]{4}$"

  - name: recall_correct
    type: integer
    description: Binary indicator of correct recall (1 = correct, 0 = incorrect)
    nullable: false
    allowed_values: [0, 1]

  - name: fixation_duration_ms
    type: float
    description: Total fixation duration on the stimulus in milliseconds
    nullable: false
    min_value: 0.0

  - name: fixation_count
    type: integer
    description: Number of fixations on the stimulus
    nullable: false
    min_value: 0

  - name: saccade_amplitude_mean
    type: float
    description: Mean saccade amplitude in degrees of visual angle
    nullable: true
    min_value: 0.0

  - name: pupil_dilation_mean
    type: float
    description: Mean pupil dilation during stimulus presentation
    nullable: true
    min_value: 0.0

  - name: trial_duration_ms
    type: integer
    description: Total duration of the trial in milliseconds
    nullable: false
    min_value: 100

  # Metadata
  - name: timestamp_processed
    type: string
    description: ISO 8601 timestamp of when the record was processed
    nullable: false
    format: "ISO8601"

constraints:
  # Ensure no duplicate trials per participant
  - description: "Each participant_id must have unique trial_ids"
    type: "unique_combination"
    columns: ["participant_id", "trial_id"]

  # Ensure all required numeric fields are positive where applicable
  - description: "Fixation duration must be non-negative"
    type: "range_check"
    column: "fixation_duration_ms"
    min: 0

  # Ensure recall is binary
  - description: "Recall must be 0 or 1"
    type: "allowed_values"
    column: "recall_correct"
    values: [0, 1]

expected_row_count:
  min: 100
  description: "Minimum expected number of trials after filtering"

notes:
  - "This schema is generated based on the data-model.md specification."
  - "The preprocessing pipeline (code/preprocess.py) must validate output against this schema."
  - "Missing values are only allowed in optional columns (nullable: true)."
  - "All string fields must match the specified pattern or allowed values."