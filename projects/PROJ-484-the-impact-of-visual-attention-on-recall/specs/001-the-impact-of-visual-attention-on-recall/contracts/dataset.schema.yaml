# Dataset Schema Validation Contract
# Defines the expected structure for the analysis-ready CSV generated by preprocess.py
# based on Key Entities: Participant, Stimulus, Trial

$schema: http://json-schema.org/draft-07/schema#
title: VisualAttentionRecallAnalysisSchema
description: Schema for the analysis-ready CSV containing trial-level data with fixation metrics, valence, and anxiety scores.
type: object
properties:
  columns:
    type: array
    description: List of expected column names in the CSV
    items:
      type: string
    contains:
      - participant_id
      - trial_id
      - stimulus_id
      - stimulus_valence
      - stimulus_category
      - recall_correct
      - fixation_duration_ms
      - fixation_count
      - stai_total_score
      - stai_anxiety_level
      - trial_duration_ms
      - missing_frame_ratio
      - blink_duration_ratio
    minItems: 14
    maxItems: 14
  column_types:
    type: object
    description: Expected data types for each column
    properties:
      participant_id:
        type: string
        format: identifier
      trial_id:
        type: string
        format: identifier
      stimulus_id:
        type: string
        format: identifier
      stimulus_valence:
        type: integer
        minimum: 1
        maximum: 9
      stimulus_category:
        type: string
        enum: [neutral, positive, negative]
      recall_correct:
        type: boolean
      fixation_duration_ms:
        type: number
        minimum: 0
      fixation_count:
        type: integer
        minimum: 0
      stai_total_score:
        type: number
        minimum: 20
        maximum: 80
      stai_anxiety_level:
        type: string
        enum: [low, medium, high]
      trial_duration_ms:
        type: number
        minimum: 0
      missing_frame_ratio:
        type: number
        minimum: 0
        maximum: 1
      blink_duration_ratio:
        type: number
        minimum: 0
        maximum: 1
    required:
      - participant_id
      - trial_id
      - stimulus_id
      - stimulus_valence
      - stimulus_category
      - recall_correct
      - fixation_duration_ms
      - fixation_count
      - stai_total_score
      - stai_anxiety_level
      - trial_duration_ms
      - missing_frame_ratio
      - blink_duration_ratio
  constraints:
    type: object
    description: Business logic constraints for data validation
    properties:
      no_null_fixation_duration:
        type: boolean
        description: All rows must have a non-null fixation_duration_ms
      valid_valence_range:
        type: boolean
        description: stimulus_valence must be between 1 and 9
      valid_recall_binary:
        type: boolean
        description: recall_correct must be boolean (0 or 1)
      excluded_trials_threshold:
        type: number
        description: Rows with missing_frame_ratio > 0.5 or blink_duration_ratio > threshold should not be present
        default: 0.5
      stai_score_present:
        type: boolean
        description: All rows must have a valid stai_total_score
    required:
      - no_null_fixation_duration
      - valid_valence_range
      - valid_recall_binary
      - stai_score_present
required:
  - columns
  - column_types
  - constraints
additionalProperties: false
