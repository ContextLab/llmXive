# Model Output Schema Validation Contract
# Defines the structure for model results JSON and power analysis output
# Used by code/validate_schemas.py to verify artifacts before downstream consumption
#
# This schema validates:
# 1. artifacts/logs/model_results.json - Mixed-effects model fitting results
# 2. artifacts/logs/power_analysis.json - Monte Carlo power analysis results
#
# Dependencies: data-model artifact locked (T006 completed)

version: "1.0.0"
description: "Schema for model output artifacts in the Visual Attention Recall study"
last_updated: "2024-01-15"

# Schema for model_results.json
model_results_schema:
  type: object
  required:
    - metadata
    - model_specification
    - convergence_status
    - fixed_effects
    - random_effects
    - likelihood_ratio_test
    - diagnostics
  properties:
    metadata:
      type: object
      required:
        - timestamp
        - software_version
        - dataset_version
        - random_seed
      properties:
        timestamp:
          type: string
          format: date-time
          description: "ISO 8601 timestamp of model execution"
        software_version:
          type: string
          description: "Python and statsmodels versions used"
        dataset_version:
          type: string
          description: "Version identifier for the analysis dataset"
        random_seed:
          type: integer
          description: "Random seed used for reproducibility"

    model_specification:
      type: object
      required:
        - formula
        - link_function
        - optimizer
        - random_effects_structure
      properties:
        formula:
          type: string
          description: "R-style formula string for the mixed-effects model"
          pattern: "^recall~"
        link_function:
          type: string
          enum: ["logit"]
          description: "Link function used in GLMM"
        optimizer:
          type: string
          description: "Optimizer algorithm used for fitting"
        random_effects_structure:
          type: string
          description: "Description of random effects structure"

    convergence_status:
      type: object
      required:
        - converged
        - message
        - iterations
      properties:
        converged:
          type: boolean
          description: "Whether the model converged successfully"
        message:
          type: string
          description: "Convergence message from the optimizer"
        iterations:
          type: integer
          description: "Number of iterations until convergence or max_iter"
        status_code:
          type: integer
          description: "Numeric status code from the optimizer"

    fixed_effects:
      type: object
      required:
        - coefficients
        - standard_errors
        - z_values
        - p_values
        - confidence_intervals
      properties:
        coefficients:
          type: object
          additionalProperties:
            type: number
          description: "Fixed effect coefficient estimates"
        standard_errors:
          type: object
          additionalProperties:
            type: number
          description: "Standard errors for fixed effects"
        z_values:
          type: object
          additionalProperties:
            type: number
          description: "Z-statistics for fixed effects"
        p_values:
          type: object
          additionalProperties:
            type: number
          description: "P-values for fixed effects"
        confidence_intervals:
          type: object
          additionalProperties:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
          description: "95% confidence intervals [lower, upper] for fixed effects"

    random_effects:
      type: object
      required:
        - participant_variance
        - stimulus_variance
        - residual_variance
        - correlation_matrix
      properties:
        participant_variance:
          type: number
          minimum: 0
          description: "Variance of random intercept for participant"
        stimulus_variance:
          type: number
          minimum: 0
          description: "Variance of random intercept for stimulus"
        residual_variance:
          type: number
          minimum: 0
          description: "Residual variance (for GLMM, this is the dispersion parameter)"
        correlation_matrix:
          type: object
          description: "Correlation matrix for random effects if applicable"

    likelihood_ratio_test:
      type: object
      required:
        - chi2_statistic
        - df_difference
        - p_value
        - full_model_loglik
        - reduced_model_loglik
      properties:
        chi2_statistic:
          type: number
          description: "Chi-squared statistic from the likelihood ratio test"
        df_difference:
          type: integer
          description: "Difference in degrees of freedom between models"
        p_value:
          type: number
          minimum: 0
          maximum: 1
          description: "P-value from the likelihood ratio test"
        full_model_loglik:
          type: number
          description: "Log-likelihood of the full model"
        reduced_model_loglik:
          type: number
          description: "Log-likelihood of the reduced model (without interaction)"

    diagnostics:
      type: object
      required:
        - overdispersion
        - dispersion_ratio
      properties:
        overdispersion:
          type: string
          enum: ["OK", "WARNING", "CRITICAL"]
          description: "Status of overdispersion check"
        dispersion_ratio:
          type: number
          description: "Ratio of Pearson chi2 to degrees of freedom"
        vif_values:
          type: object
          additionalProperties:
            type: number
          description: "Variance Inflation Factors for fixed effects"

# Schema for power_analysis.json
power_analysis_schema:
  type: object
  required:
    - metadata
    - simulation_parameters
    - results
    - power_estimate
  properties:
    metadata:
      type: object
      required:
        - timestamp
        - software_version
        - method
      properties:
        timestamp:
          type: string
          format: date-time
          description: "ISO 8601 timestamp of power analysis execution"
        software_version:
          type: string
          description: "Python and scipy versions used"
        method:
          type: string
          enum: ["Monte Carlo"]
          description: "Method used for power analysis"

    simulation_parameters:
      type: object
      required:
        - iterations
        - alpha
        - sample_size
        - effect_size
        - variance_components
      properties:
        iterations:
          type: integer
          minimum: 100
          description: "Number of Monte Carlo iterations"
        alpha:
          type: number
          minimum: 0
          maximum: 1
          description: "Significance level (Type I error rate)"
        sample_size:
          type: object
          required:
            - n_participants
            - n_trials_per_participant
          properties:
            n_participants:
              type: integer
              minimum: 1
              description: "Number of participants in simulation"
            n_trials_per_participant:
              type: integer
              minimum: 1
              description: "Average number of trials per participant"
        effect_size:
          type: object
          required:
            - interaction_coefficient
          properties:
            interaction_coefficient:
              type: number
              description: "Target effect size for the interaction term"
        variance_components:
          type: object
          required:
            - participant_intercept
            - stimulus_intercept
            - residual
          properties:
            participant_intercept:
              type: number
              minimum: 0
              description: "Simulated participant intercept variance"
            stimulus_intercept:
              type: number
              minimum: 0
              description: "Simulated stimulus intercept variance"
            residual:
              type: number
              minimum: 0
              description: "Simulated residual variance"

    results:
      type: object
      required:
        - significant_count
        - convergence_count
        - convergence_rate
      properties:
        significant_count:
          type: integer
          minimum: 0
          description: "Number of iterations where p < alpha for interaction"
        convergence_count:
          type: integer
          minimum: 0
          description: "Number of iterations where model converged"
        convergence_rate:
          type: number
          minimum: 0
          maximum: 1
          description: "Proportion of iterations that converged"

    power_estimate:
      type: object
      required:
        - achieved_power
        - standard_error
        - ci_lower
        - ci_upper
      properties:
        achieved_power:
          type: number
          minimum: 0
          maximum: 1
          description: "Estimated statistical power (1 - beta)"
        standard_error:
          type: number
          minimum: 0
          description: "Standard error of the power estimate"
        ci_lower:
          type: number
          minimum: 0
          maximum: 1
          description: "Lower bound of 95% CI for power"
        ci_upper:
          type: number
          minimum: 0
          maximum: 1
          description: "Upper bound of 95% CI for power"

# Validation rules and constraints
validation_rules:
  - rule: "fixed_effects_keys_match"
    description: "Keys in coefficients, standard_errors, z_values, p_values, and confidence_intervals must be identical"
    type: structural
  - rule: "p_values_range"
    description: "All p-values must be between 0 and 1"
    type: range
  - rule: "variance_non_negative"
    description: "All variance components must be non-negative"
    type: range
  - rule: "power_range"
    description: "Power estimate must be between 0 and 1"
    type: range
  - rule: "convergence_rate_valid"
    description: "Convergence rate must be between 0 and 1"
    type: range
  - rule: "chi2_non_negative"
    description: "Chi-squared statistic must be non-negative"
    type: range
  - rule: "loglik_ordering"
    description: "Full model log-likelihood must be >= reduced model log-likelihood"
    type: logical

