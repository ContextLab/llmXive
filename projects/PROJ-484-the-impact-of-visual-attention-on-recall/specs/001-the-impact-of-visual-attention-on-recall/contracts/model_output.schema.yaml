example_power_analysis:
  metadata:
    timestamp: "2024-01-15T11:00:00Z"
    software_version: "Python 3.11.0, scipy 1.11.0"
    method: "Monte Carlo"
  simulation_parameters:
    iterations: 1000
    alpha: 0.05
    sample_size:
      n_participants: 50
      n_trials_per_participant: 100
    effect_size:
      interaction_coefficient: 0.02
    variance_components:
      participant_intercept: 0.45
      stimulus_intercept: 0.12
      residual: 1.0
  results:
    significant_count: 620
    convergence_count: 985
    convergence_rate: 0.985
  power_estimate:
