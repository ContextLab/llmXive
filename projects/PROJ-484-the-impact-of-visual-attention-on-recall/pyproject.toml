[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-proj-484"
version = "0.1.0"
description = "The Impact of Visual Attention on Recall of Emotional Stimuli in Rapid Visual Sequences"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "datasets>=2.14.0",
    "requests>=2.31.0",
    "pytest>=7.4.0",
    "pyyaml>=6.0.1",
    "black>=23.0.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = "E203,W503"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "data",
    "artifacts",
]
per-file-ignores = [
    "__init__.py:F401"
]
max-complexity = 10

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
skip = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "data",
    "artifacts",
]
known_first_party = ["code"]