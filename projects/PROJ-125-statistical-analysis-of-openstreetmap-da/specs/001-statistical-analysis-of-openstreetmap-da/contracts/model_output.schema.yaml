$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelResultSchema"
description: "Schema for per‑model JSON outputs of the spatial modeling pipeline."
type: object
properties:
  model_type:
    type: string
    enum: ["OLS", "SAR", "GWR", "OLS_DEGRADED"]
    description: "Type of spatial model fitted."
  city_name:
    type: string
    description: "City identifier."
  coefficients:
    type: object
    additionalProperties:
      type: number
    description: "Map of feature names to coefficient values."
  standard_errors:
    type: object
    additionalProperties:
      type: number
    description: "Map of feature names to standard errors (spatially clustered for OLS)."
  p_values:
    type: object
    additionalProperties:
      type: number
      minimum: 0.0
      maximum: 1.0
    description: "Map of feature names to FDR‑corrected p‑values."
  metrics:
    type: object
    properties:
      rmse:
        type: number
        minimum: 0.0
      mae:
        type: number
        minimum: 0.0
      r2:
        type: number
      aic:
        type: number
    required:
      - rmse
      - mae
      - r2
    description: "In‑sample performance metrics."
  cv_metrics:
    type: object
    properties:
      cv_rmse:
        type: number
        minimum: 0.0
      cv_mae:
        type: number
        minimum: 0.0
      cv_r2:
        type: number
    required:
      - cv_rmse
      - cv_mae
      - cv_r2
    description: "Out‑of‑sample performance via spatial 5‑fold block cross‑validation."
  morans_i:
    type: number
    description: "Moran's I of model residuals (always reported)."
  gwr_bandwidth:
    type: number
    description: "Optimal bandwidth for GWR (present only if model_type is GWR)."
  sensitivity_analysis:
    type: object
    properties:
      sweep_parameter:
        type: string
        description: "Either 'bandwidth_m' (GWR) or 'block_size' (OLS_DEGRADED)."
      sweep_values:
        type: array
        items:
          type: number
        description: "Values tested in the sweep."
      r2_values:
        type: array
        items:
          type: number
        description: "R‑squared at each sweep value."
      optimal_value:
        type: number
        description: "Selected band or reference block size."
      plot_path:
        type: string
        description: "Relative path to the saved sensitivity plot (SC‑004)."
    required:
      - sweep_parameter
      - sweep_values
      - r2_values
      - plot_path
    description: "Sensitivity sweep results (FR‑009)." 
  memory_status:
    type: string
    enum: ["OK", "DEGRADED"]
    description: "Memory govern govern ..."
  notes:
    type: string
    description: " "
additionalProperties: false