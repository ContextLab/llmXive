$schema: "http://json-schema.org/draft-07/schema#"
title: "Output Metrics Schema"
description: "Schema for the final consolidated metrics CSV file."
type: object
properties:
  model_type:
    type: string
    enum: ["OLS", "SAR", "GWR", "OLS_DEGRADED"]
    description: "Type of model fitted."
  city_name:
    type: string
    description: "Name of the city analyzed."
  rmse:
    type: number
    description: "Root Mean Square Error."
  mae:
    type: number
    description: "Mean Absolute Error."
  r2:
    type: number
    description: "R-squared value."
  p_values:
    type: string
    description: "JSON‑serialized FDR‑corrected p‑values per predictor."
  correction_method:
    type: string
    enum: ["permutation-FDR"]
    description: "Method used for multiple comparison correction (SC‑003)."
