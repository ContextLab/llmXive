$schema: "http://json-schema.org/draft-07/schema#"
title: "Output Metrics Schema"
description: "Schema for the final metrics CSV file."
type: object
properties:
  model_type:
    type: string
    enum:
      - "OLS"
      - "SAR"
      - "GWR"
      - "OLS_DEGRADED"
    description: "Type of model fitted. OLS_DEGRADED indicates fallback due to memory. If data is missing, the pipeline halts and no output is generated."
  rmse:
    type: number
    description: "Root Mean Square Error."
  mae:
    type: number
    description: "Mean Absolute Error."
  r2:
    type: number
    description: "R-squared value."
  p_value:
    type: number
    description: "P-value for the model (if applicable)."
  correction_method:
    type: string
    description: "Method used for multiple comparison correction (e.g., 'Permutation_FDR')."
  n_samples:
    type: integer
    description: "Number of samples used in the model."
  memory_peak_gb:
    type: number
    description: "Peak memory usage in GB during execution."
required:
  - model_type
  - rmse
  - mae
  - r2
  - correction_method
  - n_samples
additionalProperties: false