$schema: "http://json-schema.org/draft-07/schema#"
title: "Output Metrics Schema"
description: "Schema for the final metrics CSV file."
type: object
properties:
  model_type:
    type: string
    enum:
      - "OLS"
      - "SAR"
      - "GWR"
    description: "Type of model fitted."
  rmse:
    type: number
    description: "Root Mean Square Error."
  mae:
    type: number
    description: "Mean Absolute Error."
  r2:
    type: number
    description: "R-squared value."
  p_value:
    type: number
    description: "P-value for the model."
  correction_method:
    type: string
    description: "Method used for multiple comparison correction."
  n_samples:
    type: integer
    description: "Number of samples used in the model."
  memory_peak_gb:
    type: number
    description: "Peak memory usage in GB during execution."
  memory_status:
    type: string
    description: "Indicates if the memory limit was exceeded"
    enum: ["OK", "DEGRADED"]
required:
  - model_type
  - rmse
  - mae
  - r2
  - p_value
  - correction_method
  - n_samples
  - memory_status
additionalProperties: false
