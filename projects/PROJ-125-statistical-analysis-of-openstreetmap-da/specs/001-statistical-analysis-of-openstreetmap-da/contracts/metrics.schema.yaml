$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Metrics Schema"
description: "Schema for rows of the output metrics CSV."
type: object
properties:
  model_type:
    type: string
    description: "Type of model fitted; OLS_DEGRADED marks the memory-constraint fallback path."
    enum: ["OLS", "SAR", "GWR", "OLS_DEGRADED"]
  city_name:
    type: string
    description: "Name of the city analyzed."
  rmse:
    type: number
    description: "Root Mean Squared Error."
  mae:
    type: number
    description: "Mean Absolute Error."
  r2:
    type: number
    description: "R-squared value."
  p_values:
    type: string
    description: "JSON‑serialized FDR‑corrected p‑values per predictor."
  correction_method:
    type: string
    description: "Multiple‑comparison correction method (SC‑003)."
    enum: ["permutation-FDR"]
  memory_status:
    type: string
    description: "Memory status during execution."
    enum: ["OK", "DEGRADED"]
  memory_peak_gb:
    type: number
    description: "Peak RSS in GB measured via psutil."
  n_samples:
    type: integer
    description: "Number of cells used in the model."
  n_eff:
    type: number
    description: "Effective sample size N / (1 + Moran's I) (heuristic)."
required:
  - model_type
  - city_name
  - rmse
  - mae
  - r2
  - p_values
  - correction_method
  - memory_status
  - memory_peak_gb
  - n_samples
additionalProperties: false