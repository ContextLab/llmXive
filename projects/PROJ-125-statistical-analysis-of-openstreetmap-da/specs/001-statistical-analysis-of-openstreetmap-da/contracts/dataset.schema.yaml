$schema: "http://json-schema.org/draft-07/schema#"
title: "Processed Dataset Schema"
description: "Schema for the aligned dataset used in spatial regression."
type: object
properties:
  geometry:
    type: object
    description: "GeoJSON geometry for the point."
    properties:
      type:
        type: string
        enum: ["Point"]
      coordinates:
        type: array
        items:
          type: number
    required:
      - type
      - coordinates
  building_density:
    type: number
    description: "Building density per 30m cell."
  tree_cover:
    type: number
    description: "Tree cover percentage per 30m cell."
  road_density:
    type: number
    description: "Road density per 30m cell."
  lst:
    type: number
    description: "Land Surface Temperature (K)."
  albedo:
    type: number
    description: "Surface albedo (unitless)."
  elevation:
    type: number
    description: "Elevation above sea level (meters)."
  water_proximity:
    type: number
    description: "Distance to nearest water body (meters)."
  humidity:
    type: number
    description: "Atmospheric humidity (%)."
  city_name:
    type: string
    description: "Name of the city."
required:
  - geometry
  - building_density
  - tree_cover
  - road_density
  - lst
  - city_name
additionalProperties: false