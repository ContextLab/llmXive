$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema for UHI Analysis"
description: "Schema for the aligned raster dataset used in modeling."
type: object
properties:
  metadata:
    type: object
    properties:
      city_name:
        type: string
        description: "Name of the city analyzed."
      crs:
        type: string
        description: "Coordinate Reference System used (e.g., EPSG:3857)."
      resolution_m:
        type: number
        description: "Resolution of the raster grid in meters."
      data_version:
        type: string
        description: "Version hash of the raw data files."
  columns:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          description: "Variable name (e.g., 'building_density', 'LST')."
        type:
          type: string
          enum:
            - "continuous"
            - "categorical"
            - "target"
          description: "Type of variable."
        source:
          type: string
          description: "Source of the data (e.g., 'OSM', 'MODIS')."
required:
  - metadata
  - columns
additionalProperties: false