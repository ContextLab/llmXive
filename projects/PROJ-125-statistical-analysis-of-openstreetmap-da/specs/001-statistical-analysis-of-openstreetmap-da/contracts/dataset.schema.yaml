$schema: "http://json-schema.org/draft-07/schema#"
title: "Processed Dataset Schema"
description: "Schema for the aligned pixel dataset used in spatial regression."
type: object
properties:
  geometry:
    type: object
    description: "GeoJSON point geometry (cell centroid)."
    properties:
      type:
        type: string
        enum: ["Point"]
      coordinates:
        type: array
        items:
          type: number
    required:
      - type
      - coordinates
  building_density:
    type: number
    description: "Building density per 30m cell."
  land_use_class:
    type: string
    description: "Dominant land-use class per cell (categorical)."
  tree_cover:
    type: number
    description: "Tree cover percentage per 30m cell."
  road_density:
    type: number
    description: "Road density per 30m cell."
  lst:
    type: number
    description: "Land Surface Temperature (K), 5‑year JJA median composite average."
  city_name:
    type: string
    description: "Name of the city."
  spatial_block:
    type: integer
    description: "Spatial block ID used for blocked CV and sampling."
required:
  - geometry
  - building_density
  - tree_cover
  - road_density
  - lst
  - city_name
  - spatial_block
additionalProperties: false