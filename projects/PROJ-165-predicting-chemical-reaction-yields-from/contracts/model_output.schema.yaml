%YAML 1.2
---
# Model Output Schema
# Defines the structure of predictions and evaluation metrics produced
# by the attention-based model and baseline models.

version: "1.0.0"
description: >
  Schema for the output artifacts generated during model evaluation
  and inference.

fields:
  - name: model_id
    type: string
    description: Unique identifier for the model checkpoint/version.
    required: true

  - name: timestamp
    type: string
    description: ISO 8601 timestamp of the evaluation run.
    required: true
    format: date-time

  - name: split
    type: string
    description: The dataset split being evaluated (train/val/test).
    required: true
    enum:
      - train
      - val
      - test

  - name: metrics
    type: object
    description: Aggregated performance metrics.
    required: true
    properties:
      rmse:
        type: number
        description: Root Mean Squared Error (energy units).
      mae:
        type: number
        description: Mean Absolute Error.
      r2:
        type: number
        description: R-squared coefficient of determination.
      n_samples:
        type: integer
        description: Number of samples in the split.

  - name: predictions
    type: array
    description: Per-sample prediction details.
    required: true
    items:
      type: object
      properties:
        reaction_id:
          type: string
        true_value:
          type: number
        predicted_value:
          type: number
        error:
          type: number
        attention_weights:
          type: array
          item_type: number
          description: Extracted attention weights for the sample.
        residual:
          type: number
          description: Difference between true and predicted.

  - name: attention_analysis
    type: object
    description: Aggregated attention weight statistics.
    required: false
    nullable: true
    properties:
      mean_weight:
        type: number
      max_weight:
        type: number
      correlation_with_residual:
        type: number

  - name: literature_alignment
    type: object
    description: Alignment of attention peaks with literature values.
    required: false
    nullable: true
    properties:
      percentage_within_tolerance:
        type: number
        description: % of top peaks within ±50 cm⁻¹ of literature.
      passed_threshold:
        type: boolean
        description: Whether the ≥80% threshold (SC-003) was met.

  - name: configuration_hash
    type: string
    description: Hash of the config used for this run.
    required: true