%YAML 1.2
---
# Dataset Schema for Simulated DFT Data (MolSpectra)
# Used for training and validation of reaction yield/energy prediction models.
# Target variable: normalized DFT total molecular energy.

version: "1.0.0"
description: >
  Schema defining the structure of the raw and processed dataset files
  used by the data ingestion and preprocessing pipeline.

fields:
  - name: reaction_id
    type: string
    description: Unique identifier for the reaction instance.
    required: true
    pattern: "^RXN-[0-9]{6}$"

  - name: reactant_smiles
    type: string
    description: SMILES string of the reactants.
    required: true

  - name: product_smiles
    type: string
    description: SMILES string of the product.
    required: true

  - name: reaction_smiles
    type: string
    description: Full reaction SMILES (Reactants >> Product).
    required: true

  - name: ir_spectrum_wavenumbers
    type: array
    item_type: float
    description: Wavenumber axis for IR spectrum (cm⁻¹).
    required: true
    min_items: 100
    max_items: 5000

  - name: ir_spectrum_intensity
    type: array
    item_type: float
    description: IR intensity values corresponding to wavenumbers.
    required: true
    min_items: 100
    max_items: 5000

  - name: raman_spectrum_wavenumbers
    type: array
    item_type: float
    description: Wavenumber axis for Raman spectrum (cm⁻¹).
    required: false
    nullable: true

  - name: raman_spectrum_intensity
    type: array
    item_type: float
    description: Raman intensity values.
    required: false
    nullable: true

  - name: nmr_chemical_shifts
    type: array
    item_type: float
    description: NMR chemical shift axis (ppm).
    required: false
    nullable: true

  - name: nmr_intensity
    type: array
    item_type: float
    description: NMR intensity values.
    required: false
    nullable: true

  - name: solvent
    type: string
    description: Solvent used in the reaction.
    required: true
    enum:
      - DCM
      - THF
      - Toluene
      - Methanol
      - Water
      - Acetonitrile
      - DMF
      - None

  - name: catalyst
    type: string
    description: Catalyst used (or 'None').
    required: true

  - name: temperature_celsius
    type: number
    description: Reaction temperature in Celsius.
    required: true
    minimum: -273.15
    maximum: 1000.0

  - name: reaction_time_hours
    type: number
    description: Duration of the reaction in hours.
    required: true
    minimum: 0.0

  - name: ecfp4_fingerprint
    type: array
    item_type: integer
    description: ECFP4 fingerprint vector (binary).
    required: true
    min_items: 1024
    max_items: 2048

  - name: dft_total_energy
    type: number
    description: Raw DFT total molecular energy (Hartree).
    required: true

  - name: normalized_energy
    type: number
    description: Normalized DFT total molecular energy (target variable).
    required: true

  - name: reaction_template
    type: string
    description: Reaction template SMILES pattern extracted from the center.
    required: true

  - name: split
    type: string
    description: Dataset split assignment.
    required: true
    enum:
      - train
      - val
      - test

constraints:
  - description: "Spectral arrays must have matching lengths."
    condition: "len(ir_spectrum_wavenumbers) == len(ir_spectrum_intensity)"
  - description: "Normalized energy must be within a reasonable statistical range."
    condition: "-10.0 <= normalized_energy <= 10.0"
