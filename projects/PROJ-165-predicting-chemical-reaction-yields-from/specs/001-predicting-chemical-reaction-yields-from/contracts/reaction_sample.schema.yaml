$schema: "http://json-schema.org/draft-07/schema#"
title: "ReactionSample"
description: "Schema for a single reaction sample in the processed dataset. Includes all required fields for modeling."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier (UUID)."
  reaction_smiles:
    type: "string"
    description: "Canonical SMILES of the full reaction (reactants → products)."
  yield_percent:
    type: "number"
    minimum: 0
    maximum: 100
    description: "Yield expressed as a percentage (0–100)."
  ir_spectrum:
    type: "array"
    items:
      type: "number"
    minItems: a sufficiently large number of items
    maxItems: 1000
    description: "Resampled IR spectrum (400‑4000 cm⁻¹, 1 cm⁻¹ step)."
  nmr_spectrum:
    type: "array"
    items:
      type: "number"
    minItems: a sufficiently large number of items
    maxItems: 1000
    description: "Resampled ¹H‑NMR spectrum (0‑10 ppm, 0.01 ppm step)."
  fingerprint:
    type: "array"
    items:
      type: "integer"
    minItems: a sufficiently large number
    maxItems: 1024
    description: "ECFP4 fingerprint (1024‑bit integer vector)."
  template_id:
    type: "string"
    description: "MD5 hash of the reaction‑template identifier."
  solvent_id:
    type: "integer"
    description: "One‑hot encoded solvent identifier."
  catalyst_id:
    type: "integer"
    description: "One‑hot encoded catalyst identifier."
  temperature_k:
    type: "number"
    description: "Reaction temperature in Kelvin."
  split:
    type: "string"
    enum:
      - "train"
      - "val"
      - "test"
    description: "Dataset split assignment."
required:
  - id
  - reaction_smiles
  - yield_percent
  - ir_spectrum
  - nmr_spectrum
  - fingerprint
  - template_id
  - solvent_id
  - catalyst_id
  - temperature_k
  - split
additionalProperties: false
