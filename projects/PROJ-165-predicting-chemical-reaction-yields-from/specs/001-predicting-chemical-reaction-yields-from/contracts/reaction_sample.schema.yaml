$schema: "http://json-schema.org/draft-07/schema#"
title: "ReactionSample"
description: "Schema for a single chemical reaction instance with spectral and structural data."
type: "object"
properties:
  reaction_smiles:
    type: "string"
    description: "Canonical SMILES of the reaction."
  yield_percent:
    type: "number"
    minimum: 0
    maximum: 100
    description: "Reaction yield (0-100)."
  ir_spectrum:
    type: "array"
    items:
      type: "number"
    description: "IR spectrum intensities (resampled to fixed grid)."
  nmr_spectrum:
    type: "array"
    items:
      type: "number"
    description: "NMR spectrum intensities (resampled to fixed grid)."
  rfp:
    type: "array"
    items:
      type: "number"
    description: "ECFP4 fingerprint (2048 bits)."
  reaction_template_id:
    type: "string"
    description: "Hash of reaction center substructure."
  solvent_id:
    type: "integer"
    description: "Encoded solvent ID."
  catalyst_id:
    type: "integer"
    description: "Encoded catalyst ID."
  temperature_k:
    type: "number"
    description: "Temperature in Kelvin."
  split:
    type: "string"
    enum:
      - "train"
      - "val"
      - "test"
    description: "Dataset split assignment."
required:
  - reaction_smiles
  - yield_percent
  - ir_spectrum
  - nmr_spectrum
  - rfp
  - reaction_template_id
  - solvent_id
  - catalyst_id
  - temperature_k
  - split
additionalProperties: false
