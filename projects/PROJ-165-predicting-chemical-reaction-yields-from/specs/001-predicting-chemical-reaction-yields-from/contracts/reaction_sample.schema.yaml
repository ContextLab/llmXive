$schema: "http://json-schema.org/draft-07/schema#"
title: "ReactionSample"
description: "Schema for a single reaction sample including spectral and structural data."
type: "object"
properties:
  reaction_smiles:
    type: "string"
    description: "Canonical SMILES string of the reaction."
  yield_percent:
    type: "number"
    minimum: 0
    maximum: 100
    description: "Reaction yield percentage."
  ir_spectrum:
    type: "array"
    items:
      type: "number"
    description: "Resampled IR spectrum array (400-4000 cm⁻¹)."
  nmr_spectrum:
    type: "array"
    items:
      type: "number"
    description: "Resampled NMR spectrum array (0-10 ppm)."
  raman_spectrum:
    type: "array"
    items:
      type: "number"
    description: "Resampled Raman spectrum array (400-4000 cm⁻¹)."
  fingerprint:
    type: "array"
    items:
      type: "integer"
    description: "ECFP4 fingerprint vector."
  template_id:
    type: "string"
    description: "MD5 hash of the reaction template."
  solvent_id:
    type: "integer"
    description: "Encoded solvent identifier."
  catalyst_id:
    type: "integer"
    description: "Encoded catalyst identifier."
  temperature_k:
    type: "number"
    description: "Reaction temperature in Kelvin."
  split:
    type: "string"
    enum:
      - "train"
      - "val"
      - "test"
    description: "Dataset split assignment."
required:
  - reaction_smiles
  - yield_percent
  - ir_spectrum
  - nmr_spectrum
  - raman_spectrum
  - fingerprint
  - template_id
  - split
additionalProperties: false