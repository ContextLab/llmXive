$schema: "http://json-schema.org/draft-07/schema#"
title: "EvaluationReport"
description: "Schema for the model evaluation report."
type: "object"
properties:
  metrics:
    type: "object"
    properties:
      rmse:
        type: "number"
        description: "Root Mean Square Error."
      mae:
        type: "number"
        description: "Mean Absolute Error."
      r_squared:
        type: "number"
        description: "R-squared score."
    required:
      - rmse
      - mae
      - r_squared
  baselines:
    type: "array"
    items:
      type: "object"
      properties:
        name:
          type: "string"
        rmse:
          type: "number"
        r_squared:
          type: "number"
      required:
        - name
        - rmse
        - r_squared
  statistical_tests:
    type: "object"
    properties:
      paired_t_test:
        type: "object"
        properties:
          p_value:
            type: "number"
            description: "P-value from paired t-test (Bonferroni corrected)."
          significant:
            type: "boolean"
          valid:
            type: "boolean"
            description: "True if N_templates >= 50."
        required:
          - p_value
          - significant
          - valid
      permutation_test:
        type: "object"
        properties:
          mean_r_squared:
            type: "number"
            description: "Mean R-squared from permutation test (should be < 0.05)."
          passed:
            type: "boolean"
        required:
          - mean_r_squared
          - passed
    required:
      - paired_t_test
      - permutation_test
  attention_analysis:
    type: "object"
    properties:
      top_peaks_wavenumbers:
        type: "array"
        items:
          type: "number"
        description: "Top 5 attention peak wavenumbers."
      correlation_with_residuals:
        type: "number"
        description: "Correlation coefficient between attention weights and residuals."
      nist_alignment_score:
        type: "number"
        description: "Percentage of peaks within 50 cm-1 of simulated injection points."
    required:
      - top_peaks_wavenumbers
      - correlation_with_residuals
      - nist_alignment_score
required:
  - metrics
  - baselines
  - statistical_tests
  - attention_analysis
additionalProperties: false