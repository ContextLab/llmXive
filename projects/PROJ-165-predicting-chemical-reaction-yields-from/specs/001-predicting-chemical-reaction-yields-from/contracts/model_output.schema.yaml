$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelOutput"
description: "Schema for model evaluation results and predictions."
type: "object"
properties:
  model_name:
    type: "string"
    description: "Name of the model (e.g., 'attention', 'fingerprint_only')."
  metrics:
    type: "object"
    properties:
      rmse:
        type: "number"
        description: "Root Mean Square Error."
      mae:
        type: "number"
        description: "Mean Absolute Error."
      r_squared:
        type: "number"
        description: "R-squared coefficient."
    required:
      - rmse
      - mae
      - r_squared
  statistical_test:
    type: "object"
    properties:
      p_value:
        type: "number"
        description: "P-value from paired t-test."
      wilcoxon_p_value:
        type: "number"
        description: "P-value from Wilcoxon signed-rank test."
      significant:
        type: "boolean"
        description: "Whether the result is statistically significant (after correction)."
    required:
      - p_value
      - significant
  attention_peaks:
    type: "array"
    items:
      type: "object"
      properties:
        wavenumber:
          type: "number"
          description: "Wavenumber or ppm of the peak."
        weight:
          type: "number"
          description: "Attention weight at this peak."
      required:
        - wavenumber
        - weight
    description: "Top attention peaks identified."
required:
  - model_name
  - metrics
  - statistical_test
additionalProperties: false