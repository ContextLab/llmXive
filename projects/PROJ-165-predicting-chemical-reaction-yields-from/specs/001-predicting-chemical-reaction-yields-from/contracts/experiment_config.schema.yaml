$schema: "http://json-schema.org/draft-07/schema#"
title: "ExperimentConfig"
description: "Schema for the experiment configuration file."
type: "object"
properties:
  model:
    type: "object"
    properties:
      num_heads:
        type: "integer"
        description: "Number of attention heads."
      hidden_dim:
        type: "integer"
        description: "Hidden dimension size."
      num_layers:
        type: "integer"
        description: "Number of transformer layers."
    required:
      - num_heads
      - hidden_dim
      - num_layers
  training:
    type: "object"
    properties:
      learning_rate:
        type: "number"
        format: float
      batch_size:
        type: "integer"
      max_epochs:
        type: "integer"
      early_stopping_patience:
        type: "integer"
    required:
      - learning_rate
      - batch_size
      - max_epochs
      - early_stopping_patience
  data:
    type: "object"
    properties:
      train_split:
        type: "number"
        description: "Fraction for training (e.g., 0.7)."
      val_split:
        type: "number"
        description: "Fraction for validation (e.g., 0.15)."
      test_split:
        type: "number"
        description: "Fraction for testing (e.g., 0.15)."
      seed:
        type: "integer"
        description: "Random seed for reproducibility."
    required:
      - train_split
      - val_split
      - test_split
      - seed
required:
  - model
  - training
  - data
additionalProperties: false
