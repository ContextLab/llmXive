$schema: "http://json-schema.org/draft-07/schema#"
title: "ReactionSample"
description: "Schema for a single reaction sample in the processed dataset. Only real experimental data is permitted."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the sample."
  reaction_smiles:
    type: "string"
    description: "Canonical SMILES string of the reaction."
  yield_percent:
    type: "number"
    minimum: 0
    maximum: 100
    description: "Reaction yield percentage."
  ir_spectrum:
    type: "array"
    items:
      type: "number"
    minItems: 3601
    maxItems: 3601
    description: "Resampled IR spectrum (400-4000 cm-1). Must be real experimental data."
  nmr_spectrum:
    type: "array"
    items:
      type: "number"
    minItems: 1001
    maxItems: 1001
    description: "Resampled NMR spectrum (0-10 ppm). Must be real experimental data."
  rfp:
    type: "array"
    items:
      type: "integer"
    minItems: 2048
    maxItems: 2048
    description: "ECFP4 fingerprint vector."
  reaction_template_id:
    type: "string"
    description: "Hash of the reaction center substructure."
  solvent_id:
    type: "integer"
    description: "Encoded solvent category."
  catalyst_id:
    type: "integer"
    description: "Encoded catalyst category."
  temperature_k:
    type: "number"
    description: "Reaction temperature in Kelvin."
  source:
    type: "string"
    enum:
      - "USPTO"
      - "NMR_demo"
      - "MolSpectra"
      - "Unknown"
    description: "Origin of the data. Synthetic data sources (e.g., DFT_Simulated) are NOT permitted."
required:
  - id
  - reaction_smiles
  - yield_percent
  - ir_spectrum
  - nmr_spectrum
  - rfp
  - reaction_template_id
  - source
additionalProperties: false