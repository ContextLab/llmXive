$schema: "http://json-schema.org/draft-07/schema#"
title: "ReactionSample"
description: "Schema for a single reaction sample in the processed dataset. Includes simulated data."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the sample."
  reaction_smiles:
    type: "string"
    description: "Canonical SMILES string of the reaction."
  yield_percent:
    type: "number"
    minimum: 0
    maximum: 100
    description: "Reaction yield percentage."
  ir_spectrum:
    type: "array"
    items:
      type: "number"
    minItems: 200
    maxItems: 200
    description: "Resampled IR spectrum (400-4000 cm-1)."
  nmr_spectrum:
    type: "array"
    items:
      type: "number"
    minItems: 200
    maxItems: 200
    description: "Resampled NMR spectrum (0-10 ppm)."
  raman_spectrum:
    type: "array"
    items:
      type: "number"
    minItems: 200
    maxItems: 200
    description: "Resampled Raman spectrum (400-4000 cm-1)."
  rfp:
    type: "array"
    items:
      type: "integer"
    minItems: 1024
    maxItems: 1024
    description: "ECFP4 fingerprint vector."
  reaction_template_id:
    type: "string"
    description: "Hash of the reaction center substructure."
  solvent_id:
    type: "integer"
    description: "Encoded solvent category."
  catalyst_id:
    type: "integer"
    description: "Encoded catalyst category."
  temperature_k:
    type: "number"
    description: "Reaction temperature in Kelvin."
  source:
    type: "string"
    enum:
      - "DFT_Simulated"
      - "Unknown"
    description: "Origin of the data."
  is_simulated:
    type: "boolean"
    description: "Flag indicating if data is from DFT simulation."
required:
  - id
  - reaction_smiles
  - yield_percent
  - ir_spectrum
  - nmr_spectrum
  - raman_spectrum
  - rfp
  - reaction_template_id
  - source
  - is_simulated
additionalProperties: false