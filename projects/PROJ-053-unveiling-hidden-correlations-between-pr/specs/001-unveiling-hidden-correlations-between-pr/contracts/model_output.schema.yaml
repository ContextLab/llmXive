$schema: "http://json-schema.org/draft-07/schema#"
title: "GPR Model Output Schema"
description: "Schema for the metrics and analysis results generated by the GPR pipeline."
type: object
properties:
  r2_score:
    type: number
    description: "Coefficient of determination (R²) on the test set."
  rmse:
    type: number
    minimum: 0
    description: "Root Mean Square Error on the test set."
  rmse_percentage_of_range:
    type: number
    description: "RMSE as a percentage of the observed range of the target property."
  mae:
    type: number
    minimum: 0
    description: "Mean Absolute Error on the test set."
  high_uncertainty_percentage:
    type: number
    minimum: 0
    maximum: 100
    description: "Percentage of test samples with uncertainty (σ) > 2× median σ."
  permutation_importance:
    type: object
    description: "Ranking of feature importance."
    additionalProperties:
      type: number
  hyperparameters:
    type: object
    properties:
      length_scale:
        type: number
      sigma_f:
        type: number
      noise_level:
        type: number
    required:
      - length_scale
      - sigma_f
      - noise_level
  model_artifact_path:
    type: string
    description: "Relative path to the saved model file."
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of the run."
  random_seed:
    type: integer
    description: "Random seed used for reproducibility."
  runtime_seconds:
    type: number
    description: "Total runtime in seconds."
  baseline_r2:
    type: number
    description: "R² score of the linear regression baseline."
  null_result_flag:
    type: boolean
    description: "True if GPR is not significantly better than linear baseline."
required:
  - r2_score
  - rmse
  - rmse_percentage_of_range
  - mae
  - high_uncertainty_percentage
  - permutation_importance
  - hyperparameters
  - model_artifact_path
  - timestamp
  - random_seed
  - runtime_seconds
  - baseline_r2
  - null_result_flag
