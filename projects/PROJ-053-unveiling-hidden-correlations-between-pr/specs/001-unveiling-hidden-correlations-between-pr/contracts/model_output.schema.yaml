$schema: "http://json-schema.org/draft-07/schema#"
title: "GPR Model Output Schema"
description: "Schema for the metrics and analysis results generated by the GPR model."
type: "object"
properties:
  r2_score:
    type: "number"
    description: "Coefficient of determination on the test set."
  rmse:
    type: "number"
    description: "Root Mean Square Error on the test set."
  mae:
    type: "number"
    description: "Mean Absolute Error on the test set."
  rmse_percentage_range:
    type: "number"
    description: "RMSE expressed as a percentage of the observed target range."
  hyperparameters:
    type: "object"
    properties:
      length_scale:
        type: "number"
      sigma:
        type: "number"
    required:
      - "length_scale"
      - "sigma"
    description: "Optimized GPR hyperparameters."
  high_uncertainty_ratio:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Fraction of test samples with predictive std dev > 2x median."
  feature_importance:
    type: "array"
    items:
      type: "object"
      properties:
        feature_name:
          type: "string"
        importance_score:
          type: "number"
      required:
        - "feature_name"
        - "importance_score"
    description: "Permutation importance scores for each feature."
  baseline_r2:
    type: "number"
    description: "R2 score of the linear regression baseline."
  importance_correlation:
    type: "number"
    description: "Spearman correlation between model importance and baseline."
  residual_analysis:
    type: "object"
    properties:
      heteroscedasticity_detected:
        type: "boolean"
      method_used:
        type: "string"
    description: "Results of residual analysis."
  runtime_seconds:
    type: "number"
    description: "Total pipeline runtime in seconds."
required:
  - "r2_score"
  - "rmse"
  - "rmse_percentage_range"
  - "hyperparameters"
  - "high_uncertainty_ratio"
  - "feature_importance"
  - "baseline_r2"
  - "runtime_seconds"
additionalProperties: false