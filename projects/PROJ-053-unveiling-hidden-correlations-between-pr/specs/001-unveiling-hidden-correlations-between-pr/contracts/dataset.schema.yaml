$schema: "http://json-schema.org/draft-07/schema#"
title: "AM Process-Property Dataset Schema"
description: "Schema for the preprocessed dataset used in GPR training."
type: "object"
properties:
  laser_power_norm:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Normalized laser power in Watts."
  scan_speed_norm:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Normalized scan speed in mm/s."
  layer_thickness_norm:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Normalized layer thickness in µm."
  is_Ti-6Al-4V:
    type: "integer"
    enum: [0, 1]
    description: "One-hot encoded flag for Ti-6Al-4V alloy."
  is_Inconel_718:
    type: "integer"
    enum: [0, 1]
    description: "One-hot encoded flag for Inconel 718 alloy."
  yield_strength_norm:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Normalized yield strength in MPa."
  ductility_norm:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Normalized ductility in percent."
required:
  - "laser_power_norm"
  - "scan_speed_norm"
  - "layer_thickness_norm"
  - "yield_strength_norm"
  - "ductility_norm"
additionalProperties: false