# Dataset Schema for Additive Manufacturing Alloy Analysis
# Project: PROJ-053-unveiling-hidden-correlations-between-pr
# Version: 1.0

description: >
  Schema for the Additive Manufacturing Alloy Dataset.
  Defines required processing parameters and mechanical properties.

required_columns:
  - laser_power
  - scan_speed
  - layer_thickness
  - yield_strength
  - ductility

optional_columns:
  - fatigue_life

column_types:
  laser_power: numeric
  scan_speed: numeric
  layer_thickness: numeric
  yield_strength: numeric
  ductility: numeric
  fatigue_life: numeric

notes: >
  - All numeric columns must be parseable as floats.
  - Categorical columns (e.g., alloy_type) are handled via preprocessing
    and are not part of this core schema definition.
  - Missing values in required columns will be imputed during preprocessing.
  - Missing values in optional columns may be dropped or handled separately.
