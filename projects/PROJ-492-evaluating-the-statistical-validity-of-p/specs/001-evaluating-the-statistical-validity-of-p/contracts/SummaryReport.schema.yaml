$schema: "http://json-schema.org/draft-07/schema#"
title: "Summary Report"
type: "object"
required:
  - total_summaries
  - inconsistent_count
  - inconsistent_rate
  - bias_adjusted_rate
  - wilson_ci_lower
  - wilson_ci_upper
properties:
  total_summaries:
    type: "integer"
    minimum: 1
  inconsistent_count:
    type: "integer"
    minimum: 0
  inconsistent_rate:
    type: "number"
    minimum: 0
    maximum: 1
  bias_adjusted_rate:
    type: "number"
    minimum: 0
    maximum: 1
  wilson_ci_lower:
    type: "number"
    minimum: 0
    maximum: 1
  wilson_ci_upper:
    type: "number"
    minimum: 0
    maximum: 1
