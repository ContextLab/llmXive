$schema: "http://json-schema.org/draft-07/schema#"
title: "AuditRecord"
description: "Schema for audit record results (FR-024)"
type: "object"
required:
  - "url"
  - "reported_p"
  - "reported_effect_size"
  - "reported_sample_size_a"
  - "reported_sample_size_b"
  - "reconstructed_p"
  - "reconstructed_effect_size"
  - "diff_abs_p"
  - "diff_abs_effect"
  - "flag_inconsistent"
  - "notes"
properties:
  url:
    type: "string"
    format: "uri"
  reported_p:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    nullable: true
  reported_effect_size:
    type: "number"
  reported_sample_size_a:
    type: "integer"
    minimum: 1
  reported_sample_size_b:
    type: "integer"
    minimum: 1
  reconstructed_p:
    type: "number"
    minimum: 0.0
    maximum: 1.0
  reconstructed_effect_size:
    type: "number"
  diff_abs_p:
    type: "number"
    minimum: 0.0
  diff_abs_effect:
    type: "number"
    minimum: 0.0
  flag_inconsistent:
    type: "boolean"
  notes:
    type: "string"
    maxLength: 500
