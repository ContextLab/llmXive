[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-load-optimization"
version = "0.1.0"
description = "Adaptive Complexity Scaling for Personalized Learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn",
    "lightgbm",
    "pandas",
    "numpy",
    "textstat",
    "datasets",
    "statsmodels",
    "pytest",
    "requests",
    "ruff",
    "black",
]

[tool.ruff]
# Target Python version
target-version = "py311"

# Line length (standard for black compatibility)
line-length = 88

# Exclude directories
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".eggs",
]

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), and isort (I) rules
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]

# Ignore specific rules if necessary
ignore = [
    "E501", # Line too long (handled by black)
    "F403", # 'from module import *' used; unable to detect undefined names
]

[tool.ruff.lint.isort]
known-first-party = ["code", "tests"]
force-single-line = true
lines-after-imports = 2

[tool.black]
# Configuration for Black
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.tox
    | __pycache__
    | build
    | dist
    | \.eggs
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
