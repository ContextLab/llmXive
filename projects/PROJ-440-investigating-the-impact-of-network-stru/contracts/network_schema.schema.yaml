$schema: "http://json-schema.org/draft-07/schema#"
title: "Network Metrics Schema"
description: "Schema defining the structure of data/raw/networks.csv generated by US1 (T015). Contains structural metrics for synthetic oscillator networks."
type: object
properties:
  id:
    type: string
    description: "Unique identifier for the network instance (e.g., 'random_001', 'scale_free_002')"
    pattern: "^[a-z_]+_\\d{3}$"
  class:
    type: string
    description: "Network topology class"
    enum:
      - random
      - scale_free
      - small_world
      - lattice
      - star
  N:
    type: integer
    description: "Number of nodes in the network"
    minimum: 10
    maximum: 500
  avg_degree:
    type: number
    description: "Average degree of the network (float)"
    minimum: 0
  clustering_coefficient:
    type: number
    description: "Global clustering coefficient"
    minimum: 0.0
    maximum: 1.0
  average_path_length:
    type: number
    description: "Average shortest path length between all pairs of nodes"
    minimum: 0
  diameter:
    type: number
    description: "Graph diameter (longest shortest path)"
    minimum: 0
  density:
    type: number
    description: "Graph density (ratio of actual edges to possible edges)"
    minimum: 0.0
    maximum: 1.0
  degree_distribution_mean:
    type: number
    description: "Mean of the degree distribution"
    minimum: 0
  degree_distribution_std:
    type: number
    description: "Standard deviation of the degree distribution"
    minimum: 0
  degree_distribution_skewness:
    type: number
    description: "Skewness of the degree distribution"
  theoretical_match_status:
    type: string
    description: "Validation status against theoretical expectations"
    enum:
      - passed
      - failed
      - skipped
  theoretical_match_details:
    type: string
    description: "Details of the theoretical validation (e.g., KS-test p-value, % error)"
  checksum:
    type: string
    description: "SHA256 checksum of the source graph file or generation parameters"
required:
  - id
  - class
  - N
  - avg_degree
  - clustering_coefficient
  - average_path_length
  - diameter
  - density
  - theoretical_match_status