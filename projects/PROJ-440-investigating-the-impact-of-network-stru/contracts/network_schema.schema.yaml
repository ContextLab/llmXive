# Schema for data/raw/networks.csv
# Generated by T006a

type: object
required:
  - id
  - class
  - N
  - avg_degree
  - clustering_coefficient
  - average_path_length
  - degree_distribution_params

properties:
  id:
    type: string
    description: Unique identifier for the graph instance
    pattern: "^[a-z0-9_-]+$"
  
  class:
    type: string
    enum:
      - random
      - scale_free
      - small_world
      - lattice
      - star
    description: Topological class of the network
  
  N:
    type: integer
    minimum: 10
    description: Number of nodes in the graph
  
  avg_degree:
    type: number
    minimum: 0
    description: Average degree of the graph
  
  clustering_coefficient:
    type: number
    minimum: 0
    maximum: 1
    description: Global clustering coefficient
  
  average_path_length:
    type: number
    minimum: 0
    description: Average shortest path length between all node pairs
  
  degree_distribution_params:
    type: string
    description: JSON string containing parameters of the degree distribution
    # For scale_free: {"gamma": float, "p_value": float}
    # For random: {"p": float}
    # For others: {"type": "uniform"} or similar

additionalProperties: false
