$schema: http://json-schema.org/draft-07/schema#
title: Network Metrics Schema
description: >
  Schema defining the structure of data/raw/networks.csv.
  This file contains generated synthetic network topologies and their computed structural metrics.
type: object
properties:
  id:
    type: string
    description: Unique identifier for the network instance (e.g., 'net_001')
    pattern: "^net_\\d+$"
  class:
    type: string
    description: The topological class of the network
    enum:
      - random
      - scale_free
      - small_world
      - lattice
      - star
  N:
    type: integer
    description: Number of nodes in the graph
    minimum: 10
  avg_degree:
    type: number
    description: Average degree of the graph
    minimum: 0
  clustering_coefficient:
    type: number
    description: Average clustering coefficient (global)
    minimum: 0.0
    maximum: 1.0
  average_path_length:
    type: number
    description: Average shortest path length (finite values only)
    minimum: 0.0
  max_degree:
    type: integer
    description: Maximum degree in the graph
    minimum: 0
  min_degree:
    type: integer
    description: Minimum degree in the graph
    minimum: 0
  degree_std:
    type: number
    description: Standard deviation of the degree distribution
    minimum: 0.0
  theoretical_match:
    type: string
    description: Status of theoretical validation (e.g., 'passed', 'failed', 'n/a')
    enum:
      - passed
      - failed
      - n/a
  validation_details:
    type: string
    description: Optional details regarding the validation (e.g., KS-test p-value)
required:
  - id
  - class
  - N
  - avg_degree
  - clustering_coefficient
  - average_path_length
  - max_degree
  - min_degree
  - degree_std
  - theoretical_match
additionalProperties: false