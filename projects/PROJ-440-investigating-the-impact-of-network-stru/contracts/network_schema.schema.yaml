$schema: http://json-schema.org/draft-07/schema#
title: Network Metrics Schema
description: Schema for data/raw/networks.csv generated by US1
type: object
properties:
  id:
    type: string
    description: Unique identifier for the network instance
  class:
    type: string
    enum:
      - random
      - scale_free
      - small_world
      - lattice
      - star
    description: Topological class of the network
  N:
    type: integer
    minimum: 10
    description: Number of nodes in the network
  avg_degree:
    type: number
    minimum: 0
    description: Average degree of the network
  clustering_coefficient:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: Average clustering coefficient
  average_path_length:
    type: number
    minimum: 0
    description: Average shortest path length
  degree_distribution_variance:
    type: number
    minimum: 0
    description: Variance of the degree distribution
  theoretical_p_value:
    type: number
    minimum: 0.0
    maximum: 1.0
    nullable: true
    description: P-value from theoretical validation (e.g., KS-test for scale-free)
  validation_status:
    type: string
    enum:
      - passed
      - failed
      - skipped
    description: Result of theoretical validation checks
required:
  - id
  - class
  - N
  - avg_degree
  - clustering_coefficient
  - average_path_length
  - degree_distribution_variance
additionalProperties: false
