$schema: "http://json-schema.org/draft-07/schema#"
title: "Network Topology Metrics Schema"
description: "Schema defining the expected structure for data/raw/networks.csv generated by User Story 1. Contains structural metrics for diverse oscillator network topologies."
type: object
properties:
  file:
    type: string
    const: "data/raw/networks.csv"
  format:
    type: string
    const: "csv"
  columns:
    type: array
    minItems: 10
    items:
      type: object
      properties:
        name:
          type: string
          description: "Column name in the CSV"
        type:
          type: string
          enum: ["integer", "float", "string"]
          description: "Expected data type"
        description:
          type: string
          description: "Human-readable description of the metric"
        constraints:
          type: object
          description: "Validation constraints for the column"
          properties:
            min:
              type: number
              description: "Minimum allowed value (for numeric types)"
            max:
              type: number
              description: "Maximum allowed value (for numeric types)"
            pattern:
              type: string
              description: "Regex pattern for string types"
            enum:
              type: array
              items:
                type: string
              description: "Allowed values for categorical/string types"
      required:
        - name
        - type
        - description
  required_columns:
    type: array
    items:
      type: string
    description: "List of mandatory column names that must be present"
  validation_rules:
    type: array
    items:
      type: object
      properties:
        rule:
          type: string
          description: "Description of the validation rule"
        condition:
          type: string
          description: "Logical condition to verify"
required:
  - file
  - format
  - columns
  - required_columns
  - validation_rules
