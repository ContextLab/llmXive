%YAML 1.2
---
# Schema for data/raw/networks.csv
# Defines the expected structure for generated network topologies
# Generated for PROJ-440: Investigating the Impact of Network Structure on Energy Dissipation

schema_version: "1.0"
source_file: "data/raw/networks.csv"
description: |
  Contains static structural metrics for 50+ synthetic oscillator network topologies
  across 5 classes: Random, Scale-Free, Small-World, Lattice, Star.
  Generated by code/generate_networks.py (Task T012).

columns:
  - name: id
    type: string
    description: Unique identifier for the graph instance (e.g., "random_001", "scale_free_002")
    constraints:
      - not_null
      - unique
      - pattern: "^[a-z_]+_\\d{3}$"

  - name: class
    type: string
    description: Topological class of the network
    constraints:
      - not_null
      - enum:
          - random
          - scale_free
          - small_world
          - lattice
          - star

  - name: N
    type: integer
    description: Number of nodes in the graph
    constraints:
      - not_null
      - range:
          min: 100
          max: 200

  - name: avg_degree
    type: float
    description: Average degree of the network
    constraints:
      - not_null
      - range:
          min: 0.0
          max: 200.0

  - name: clustering_coefficient
    type: float
    description: Global clustering coefficient (transitivity)
    constraints:
      - not_null
      - range:
          min: 0.0
          max: 1.0

  - name: average_path_length
    type: float
    description: Average shortest path length between all pairs of nodes
    constraints:
      - not_null
      - range:
          min: 1.0
          max: 1000.0

  - name: degree_distribution_mean
    type: float
    description: Mean of the degree distribution
    constraints:
      - not_null

  - name: degree_distribution_std
    type: float
    description: Standard deviation of the degree distribution
    constraints:
      - not_null
      - range:
          min: 0.0

  - name: degree_distribution_skewness
    type: float
    description: Skewness of the degree distribution
    constraints:
      - not_null

  - name: power_law_fit_pvalue
    type: float
    description: P-value from KS-test against power-law distribution (valid for scale_free class)
    constraints:
      - not_null
      - range:
          min: 0.0
          max: 1.0

  - name: theoretical_avg_degree
    type: float
    description: Theoretical expected average degree for this class (for validation)
    constraints:
      - not_null

  - name: theoretical_clustering
    type: float
    description: Theoretical expected clustering coefficient (for validation)
    constraints:
      - not_null

  - name: generation_status
    type: string
    description: Status of graph generation and validation
    constraints:
      - not_null
      - enum:
          - success
          - validation_failed
          - excluded

  - name: seed
    type: integer
    description: Random seed used for generation
    constraints:
      - not_null

metadata:
  generated_by: "code/generate_networks.py"
  generation_task: "T012"
  expected_row_count: ">= 50"
  expected_classes: 5
  notes: |
    - Power law fit p-value is only meaningful for 'scale_free' class; other classes may have arbitrary values.
    - Graphs with generation_status != 'success' should be excluded from downstream analysis.
    - Theoretical values are used in validation tasks T014a and T014b.