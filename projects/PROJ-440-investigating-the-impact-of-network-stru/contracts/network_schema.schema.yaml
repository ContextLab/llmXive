$schema: http://json-schema.org/draft-07/schema#
title: Network Metrics Schema
description: >-
  Schema for validating data/raw/networks.csv generated by the network
  topology generation pipeline. Defines the expected structure and data
  types for network structural metrics.
type: object
properties:
  id:
    type: string
    description: Unique identifier for the network instance
    pattern: "^graph_[0-9]+$"
  class:
    type: string
    description: Topological class of the network
    enum:
      - random
      - scale_free
      - small_world
      - lattice
      - star
  N:
    type: integer
    description: Number of nodes in the network
    minimum: 10
    maximum: 500
  clustering_coeff:
    type: number
    description: Average clustering coefficient of the network
    minimum: 0.0
    maximum: 1.0
  avg_path_length:
    type: number
    description: Average shortest path length (finite for connected graphs)
    minimum: 0.0
    exclusiveMinimum: 0.0
  degree_dist_summary:
    type: string
    description: JSON string containing degree distribution statistics
    minLength: 2
  mean_degree:
    type: number
    description: Mean degree of the network
    minimum: 0.0
  max_degree:
    type: integer
    description: Maximum degree in the network
    minimum: 1
  min_degree:
    type: integer
    description: Minimum degree in the network
    minimum: 0
  degree_std:
    type: number
    description: Standard deviation of the degree distribution
    minimum: 0.0
  theoretical_match:
    type: string
    description: Result of theoretical validation (e.g., power-law fit p-value)
    enum:
      - passed
      - failed
      - not_applicable
  generation_seed:
    type: integer
    description: Random seed used for graph generation
    minimum: 0
required:
  - id
  - class
  - N
  - clustering_coeff
  - avg_path_length
  - degree_dist_summary
  - mean_degree
  - max_degree
  - min_degree
  - degree_std
  - theoretical_match
  - generation_seed
additionalProperties: false
