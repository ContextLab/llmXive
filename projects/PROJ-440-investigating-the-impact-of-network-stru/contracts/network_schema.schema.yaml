$schema: "http://json-schema.org/draft-07/schema#"
title: Network Metrics Schema
description: >-
  Schema for validating data/raw/networks.csv generated by code/generate_networks.py.
  Defines the expected structure for network topology metrics including clustering,
  path length, and degree distribution summaries.
type: object
required:
  - id
  - class
  - N
  - clustering_coeff
  - avg_path_length
  - degree_dist_summary
properties:
  id:
    type: string
    description: Unique identifier for the graph instance (e.g., "graph_001").
    pattern: "^graph_[0-9]+$"
  class:
    type: string
    description: Topological class of the network.
    enum:
      - random
      - scale_free
      - small_world
      - lattice
      - star
  N:
    type: integer
    description: Number of nodes in the graph.
    minimum: 2
  clustering_coeff:
    type: number
    description: Average clustering coefficient of the graph.
    minimum: 0.0
    maximum: 1.0
  avg_path_length:
    type: number
    description: Average shortest path length.
    minimum: 0.0
    exclusiveMinimum: true
  degree_dist_summary:
    type: object
    description: Summary statistics of the degree distribution.
    required:
      - mean_degree
      - std_degree
      - min_degree
      - max_degree
      - fit_type
    properties:
      mean_degree:
        type: number
        description: Mean degree of the nodes.
      std_degree:
        type: number
        description: Standard deviation of the degree.
      min_degree:
        type: integer
        description: Minimum degree observed.
        minimum: 0
      max_degree:
        type: integer
        description: Maximum degree observed.
        minimum: 0
      fit_type:
        type: string
        description: Type of theoretical fit applied (e.g., "power_law", "poisson", "none").
        enum:
          - power_law
          - poisson
          - exponential
          - none
      ks_statistic:
        type: number
        description: KS-test statistic for theoretical fit (if applicable).
        minimum: 0.0
        maximum: 1.0
      ks_pvalue:
        type: number
        description: KS-test p-value for theoretical fit (if applicable).
        minimum: 0.0
        maximum: 1.0
  validation_status:
    type: string
    description: Status of the validation checks performed on this graph.
    enum:
      - valid
      - theoretical_mismatch
      - metric_bounds_error
      - skipped
additionalProperties: false
examples:
  - id: "graph_001"
    class: "random"
    N: 100
    clustering_coeff: 0.05
    avg_path_length: 4.2
    degree_dist_summary:
      mean_degree: 5.0
      std_degree: 2.1
      min_degree: 1
      max_degree: 12
      fit_type: "poisson"
      ks_statistic: 0.08
      ks_pvalue: 0.45
    validation_status: "valid"
  - id: "graph_002"
    class: "scale_free"
    N: 150
    clustering_coeff: 0.12
    avg_path_length: 3.8
    degree_dist_summary:
      mean_degree: 6.5
      std_degree: 8.2
      min_degree: 1
      max_degree: 45
      fit_type: "power_law"
      ks_statistic: 0.04
      ks_pvalue: 0.82
    validation_status: "valid"