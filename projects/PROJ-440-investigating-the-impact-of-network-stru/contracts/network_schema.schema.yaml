# Schema for data/raw/networks.csv
# Generated for T006a
type: object
properties:
  id:
    type: integer
    description: Unique identifier for the network instance
  class:
    type: string
    description: Topology class (random, scale_free, small_world, lattice, star)
    enum:
      - random
      - scale_free
      - small_world
      - lattice
      - star
  N:
    type: integer
    description: Number of nodes in the network
  clustering_coefficient:
    type: number
    description: Average clustering coefficient of the network
    minimum: 0.0
    maximum: 1.0
  average_path_length:
    type: number
    description: Average shortest path length between connected node pairs
    minimum: 0.0
  average_degree:
    type: number
    description: Average degree of nodes in the network
  degree_distribution_stats:
    type: string
    description: JSON string containing statistical properties of the degree distribution
  validation_status:
    type: string
    description: Status of theoretical validation (e.g., valid, invalid)
  ks_p_value:
    type: number
    description: P-value from Kolmogorov-Smirnov test for power-law fit (optional)
    minimum: 0.0
    maximum: 1.0
required:
  - id
  - class
  - N
  - clustering_coefficient
  - average_path_length
  - average_degree
  - degree_distribution_stats
  - validation_status
