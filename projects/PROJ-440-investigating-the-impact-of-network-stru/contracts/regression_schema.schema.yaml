$schema: http://json-schema.org/draft-07/schema#
title: Regression Results Schema
description: Schema for data/analysis/regression_results.json generated by US3
type: object
properties:
  model_type:
    type: string
    enum:
      - PLS
    description: Type of regression model used
  n_samples:
    type: integer
    minimum: 1
    description: Number of samples used in regression
  n_predictors:
    type: integer
    minimum: 1
    description: Number of predictors used
  p_components:
    type: integer
    minimum: 1
    description: Number of PLS components retained
  coefficients:
    type: array
    items:
      type: number
    description: Regression coefficients for each predictor
  vip_scores:
    type: array
    items:
      type: number
    description: Variable Importance in Projection scores
  p_values:
    type: array
    items:
      type: number
      minimum: 0
      maximum: 1
    description: Raw p-values for coefficients
  corrected_p_values:
    type: array
    items:
      type: number
      minimum: 0
      maximum: 1
    description: Bonferroni/Holm-Bonferroni corrected p-values
  significant_predictors:
    type: array
    items:
      type: string
    description: Names of predictors that passed significance threshold
  pc_loadings:
    type: object
    description: Loadings of topological metrics on PC1 and PC2
    properties:
      PC1:
        type: object
        additionalProperties:
          type: number
      PC2:
        type: object
        additionalProperties:
          type: number
  vif_scores:
    type: object
    description: Variance Inflation Factor scores for each metric
    additionalProperties:
      type: number
  null_model_result:
    type: object
    properties:
      observed_correlation:
        type: number
      null_mean:
        type: number
      null_std:
        type: number
      p_value:
        type: number
    description: Results of the null model permutation test
  sensitivity_analysis:
    type: object
    description: Results of sensitivity analysis on significance thresholds
    additionalProperties:
      type: array
      items:
        type: integer
  excluded_count:
    type: integer
    minimum: 0
    description: Number of resonant instances excluded from analysis
  timestamp:
    type: string
    format: date-time
    description: ISO timestamp of the analysis run
required:
  - model_type
  - n_samples
  - n_predictors
  - coefficients
  - vip_scores
  - p_values
  - corrected_p_values
additionalProperties: false
