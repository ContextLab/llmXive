# Regression Analysis Schema
# Defines the expected structure for data/analysis/regression_results.json
# Generated for PROJ-440: Investigating the Impact of Network Structure on Energy Dissipation
# Task: T006c

$schema: http://json-schema.org/draft-07/schema#
title: Regression Results Schema
description: |
  Schema for Principal Component Regression (PCR) results correlating 
  topological network metrics with energy dissipation rates.
  Includes PCA loadings, regression coefficients, p-values, and sensitivity analysis.

type: object
required:
  - metadata
  - pca_loadings
  - regression_results
  - sensitivity_analysis
  - diagnostics
  - excluded_records

properties:
  metadata:
    type: object
    description: Information about the analysis run
    required:
      - timestamp
      - input_files
      - sample_size
      - excluded_count
      - method
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of the analysis run
      input_files:
        type: object
        required:
          - networks_csv
          - energy_csv
        properties:
          networks_csv:
            type: string
            description: Path to the input networks CSV file
          energy_csv:
            type: string
            description: Path to the input energy decay CSV file
      sample_size:
        type: integer
        minimum: 1
        description: Number of valid samples included in the regression
      excluded_count:
        type: integer
        minimum: 0
        description: Number of records excluded (e.g., resonant instances)
      method:
        type: string
        enum: ["PCR"]
        description: Regression method used

  pca_loadings:
    type: object
    description: |
      PCA loadings for topological metrics on the first two principal components.
      Used to interpret the physical meaning of the components.
    required:
      - pc1
      - pc2
      - explained_variance_ratio
    properties:
      pc1:
        type: object
        description: Loadings for Principal Component 1
        additionalProperties:
          type: number
          description: Loading value for each metric
      pc2:
        type: object
        description: Loadings for Principal Component 2
        additionalProperties:
          type: number
          description: Loading value for each metric
      explained_variance_ratio:
        type: array
        items:
          type: number
          minimum: 0
          maximum: 1
        description: Variance explained by each PC (e.g., [0.65, 0.20])
      interpretation:
        type: object
        description: Physical interpretation of the principal components
        required:
          - pc1_description
          - pc2_description
        properties:
          pc1_description:
            type: string
            description: Text description of what PC1 represents (e.g., "Global connectivity")
          pc2_description:
            type: string
            description: Text description of what PC2 represents (e.g., "Local clustering")

  regression_results:
    type: object
    description: |
      Principal Component Regression results.
      Includes coefficients, standard errors, and corrected p-values.
    required:
      - coefficients
      - standard_errors
      - p_values_raw
      - p_values_corrected
      - correction_method
      - r_squared
      - adj_r_squared
    properties:
      coefficients:
        type: object
        description: Regression coefficients for each PC
        additionalProperties:
          type: number
      standard_errors:
        type: object
        description: Standard errors for each coefficient
        additionalProperties:
          type: number
      p_values_raw:
        type: object
        description: Raw p-values for each coefficient
        additionalProperties:
          type: number
          minimum: 0
          maximum: 1
      p_values_corrected:
        type: object
        description: Multiple-comparison corrected p-values (e.g., Bonferroni)
        additionalProperties:
          type: number
          minimum: 0
          maximum: 1
      correction_method:
        type: string
        enum: ["bonferroni", "holm-bonferroni", "none"]
        description: Method used for p-value correction
      r_squared:
        type: number
        minimum: 0
        maximum: 1
        description: Coefficient of determination
      adj_r_squared:
        type: number
        minimum: 0
        maximum: 1
        description: Adjusted R-squared

  sensitivity_analysis:
    type: object
    description: |
      Results of the sensitivity analysis sweeping significance thresholds.
      Reports variance in significant predictor counts.
    required:
      - thresholds
      - significant_counts
      - variance
    properties:
      thresholds:
        type: array
        items:
          type: number
          minimum: 0
          maximum: 1
        description: List of significance thresholds tested (e.g., [0.01, 0.05, 0.10])
      significant_counts:
        type: array
        items:
          type: integer
          minimum: 0
        description: Count of significant predictors at each threshold
      variance:
        type: number
        description: Variance in the number of significant predictors across the sweep

  diagnostics:
    type: object
    description: Diagnostic metrics for the regression model
    required:
      - vif_scores
      - multicollinearity_flag
    properties:
      vif_scores:
        type: object
        description: Variance Inflation Factor scores for original metrics
        additionalProperties:
          type: number
          minimum: 1
      multicollinearity_flag:
        type: boolean
        description: True if any VIF > 5 (threshold defined in spec)

  excluded_records:
    type: object
    description: Details about records excluded from the analysis
    required:
      - resonant_count
      - resonant_ids
    properties:
      resonant_count:
        type: integer
        minimum: 0
        description: Number of resonant instances excluded
      resonant_ids:
        type: array
        items:
          type: string
        description: List of graph IDs that were excluded due to resonance