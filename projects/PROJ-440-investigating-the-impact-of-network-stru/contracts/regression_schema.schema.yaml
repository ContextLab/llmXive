$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Results Schema"
description: |
  Schema defining the structure for data/analysis/regression_results.json.
  This file contains the output of the PLS regression analysis correlating
  topological metrics with energy dissipation rates.
type: object
required:
  - metadata
  - pca_analysis
  - pls_results
  - null_model_validation
  - sensitivity_analysis
  - diagnostics
properties:
  metadata:
    type: object
    description: "Run metadata and configuration"
    required:
      - timestamp
      - software_versions
      - input_files
      - parameters
    properties:
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of the analysis run"
      software_versions:
        type: object
        properties:
          python:
            type: string
          numpy:
            type: string
          scipy:
            type: string
          scikit-learn:
            type: string
          pandas:
            type: string
      input_files:
        type: object
        description: "Paths to input data files used"
        properties:
          networks_csv:
            type: string
            description: "Path to data/raw/networks.csv"
          energy_decay_csv:
            type: string
            description: "Path to data/processed/energy_decay.csv"
      parameters:
        type: object
        description: "Key analysis parameters"
        properties:
          n_components:
            type: integer
            description: "Number of PLS components used"
          vif_threshold:
            type: number
            description: "VIF threshold for multicollinearity check"
          significance_level:
            type: number
            description: "Significance level for hypothesis testing"
          n_permutations:
            type: integer
            description: "Number of permutations for null model"

  pca_analysis:
    type: object
    description: "PCA results for handling collinearity in topological metrics"
    required:
      - explained_variance_ratio
      - cumulative_variance
      - loadings
      - interpretation
    properties:
      explained_variance_ratio:
        type: array
        items:
          type: number
        description: "Variance explained by each principal component"
      cumulative_variance:
        type: array
        items:
          type: number
        description: "Cumulative variance explained by components"
      loadings:
        type: object
        description: "Loadings of original metrics on principal components"
        properties:
          PC1:
            type: object
            description: "Loadings for PC1"
            additionalProperties:
              type: number
          PC2:
            type: object
            description: "Loadings for PC2"
            additionalProperties:
              type: number
      interpretation:
        type: string
        description: "Physical interpretation of PC1 and PC2 (e.g., local clustering vs global connectivity)"

  pls_results:
    type: object
    description: "Partial Least Squares Regression results"
    required:
      - coefficients
      - vip_scores
      - p_values
      - corrected_p_values
      - model_performance
      - selected_predictors
    properties:
      coefficients:
        type: object
        description: "PLS regression coefficients for each predictor"
        additionalProperties:
          type: number
      vip_scores:
        type: object
        description: "Variable Importance in Projection scores for each predictor"
        additionalProperties:
          type: number
      p_values:
        type: object
        description: "Raw p-values for each coefficient"
        additionalProperties:
          type: number
      corrected_p_values:
        type: object
        description: "Bonferroni or Holm-Bonferroni corrected p-values"
        additionalProperties:
          type: number
      model_performance:
        type: object
        description: "Model fit statistics"
        properties:
          r_squared_train:
            type: number
            description: "R-squared on training set"
          r_squared_test:
            type: number
            description: "R-squared on test set (if cross-validated)"
          rmse:
            type: number
            description: "Root Mean Square Error"
          cross_val_score:
            type: array
            items:
              type: number
            description: "Cross-validation scores"
      selected_predictors:
        type: array
        items:
          type: string
        description: "List of predictors with corrected p-value < significance_level"
      rationale:
        type: string
        description: "Rationale for choosing PLS over PCR, referencing Plan requirements"

  null_model_validation:
    type: object
    description: "Permutation test results for null model validation"
    required:
      - observed_statistic
      - null_distribution_mean
      - null_distribution_std
      - percentile_observed
      - p_value_permutation
      - conclusion
    properties:
      observed_statistic:
        type: number
        description: "Observed R-squared or correlation from real data"
      null_distribution_mean:
        type: number
        description: "Mean of R-squared values from permuted data"
      null_distribution_std:
        type: number
        description: "Standard deviation of null distribution"
      percentile_observed:
        type: number
        description: "Percentile of observed statistic in null distribution"
      p_value_permutation:
        type: number
        description: "Fraction of null samples >= observed statistic"
      conclusion:
        type: string
        description: "Statement on whether observed correlation exceeds null expectation"

  sensitivity_analysis:
    type: object
    description: "Results of sensitivity analysis on significance thresholds"
    required:
      - thresholds_tested
      - significant_predictors_count
      - variance_report
    properties:
      thresholds_tested:
        type: array
        items:
          type: number
        description: "List of significance thresholds swept (e.g., [0.01, 0.05, 0.1])"
      significant_predictors_count:
        type: array
        items:
          type: integer
        description: "Count of significant predictors at each threshold"
      variance_report:
        type: string
        description: "Summary of variance in significant predictor counts across thresholds"

  diagnostics:
    type: object
    description: "Diagnostic information and exclusions"
    required:
      - vif_checks
      - excluded_instances
      - total_samples
      - final_samples
    properties:
      vif_checks:
        type: object
        description: "VIF values for each predictor and flags for high collinearity"
        properties:
          metrics:
            type: object
            additionalProperties:
              type: number
            description: "VIF value for each metric"
          flagged:
            type: array
            items:
              type: string
            description: "List of metric names with VIF > threshold"
      excluded_instances:
        type: object
        description: "Counts of excluded data points"
        properties:
          resonant:
            type: integer
            description: "Number of instances excluded due to resonant status"
          other:
            type: integer
            description: "Other exclusion reasons"
      total_samples:
        type: integer
        description: "Total number of samples before filtering"
      final_samples:
        type: integer
        description: "Number of samples used in final analysis"