$schema: http://json-schema.org/draft-07/schema#
title: Regression Analysis Results Schema
description: >
  Schema defining the structure of regression analysis results for the 
  'Investigating the Impact of Network Structure on Energy Dissipation in Driven Oscillators' project.
  This file corresponds to data/analysis/regression_results.json.
  It captures PLS regression coefficients, VIP scores, PCA loadings, corrected p-values,
  and metadata regarding the analysis pipeline, including null model validation and sensitivity analysis.
type: object
required:
  - metadata
  - pca_loadings
  - pls_results
  - null_model_validation
  - sensitivity_analysis
  - diagnostics
properties:
  metadata:
    type: object
    description: Analysis execution metadata
    required:
      - timestamp
      - version
      - source_files
      - excluded_count
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of analysis execution
      version:
        type: string
        description: Schema version (e.g., "1.0.0")
      source_files:
        type: object
        required:
          - networks_csv
          - energy_decay_csv
        properties:
          networks_csv:
            type: string
            description: Path to the source network metrics file (data/raw/networks.csv)
          energy_decay_csv:
            type: string
            description: Path to the source energy decay file (data/processed/energy_decay.csv)
      excluded_count:
        type: integer
        minimum: 0
        description: Number of resonant instances excluded from analysis
      analysis_method:
        type: string
        enum: ["PLS", "PCR"]
        description: The regression method used (PLS as per Plan's Statistical Rigor)
      rationale:
        type: string
        description: Justification for method choice (e.g., handling collinearity)

  pca_loadings:
    type: object
    description: PCA loadings for topological metrics on principal components
    required:
      - components
      - variance_explained
    properties:
      components:
        type: object
        description: Mapping of component names to metric loadings
        additionalProperties:
          type: object
          additionalProperties:
            type: number
            description: Loading value for a specific metric on this component
      variance_explained:
        type: array
        items:
          type: number
          minimum: 0
          maximum: 1
        description: Fraction of variance explained by each component
      interpretation:
        type: string
        description: Physical interpretation of PC1 and PC2 (e.g., "local clustering" vs "global connectivity")

  pls_results:
    type: object
    description: PLS Regression results
    required:
      - coefficients
      - vip_scores
      - p_values
      - p_values_corrected
      - vif_flags
      - significant_predictors
    properties:
      coefficients:
        type: array
        items:
          type: number
        description: PLS regression coefficients for each predictor
      vip_scores:
        type: array
        items:
          type: number
        description: Variable Importance in Projection (VIP) scores
      p_values:
        type: array
        items:
          type: number
          minimum: 0
          maximum: 1
        description: Raw p-values for coefficients
      p_values_corrected:
        type: array
        items:
          type: number
          minimum: 0
          maximum: 1
        description: Bonferroni or Holm-Bonferroni corrected p-values
      vif_flags:
        type: array
        items:
          type: object
          required:
            - metric
            - vif_value
            - flagged
          properties:
            metric:
              type: string
            vif_value:
              type: number
            flagged:
              type: boolean
              description: True if VIF > 5
      significant_predictors:
        type: array
        items:
          type: string
        description: List of predictor names with corrected p-value < 0.05

  null_model_validation:
    type: object
    description: Results from the permutation test null model validation
    required:
      - method
      - observed_correlation
      - null_distribution_mean
      - null_distribution_percentiles
      - p_value
      - conclusion
    properties:
      method:
        type: string
        description: Description of the permutation test methodology
      observed_correlation:
        type: number
        description: Correlation observed in the real data
      null_distribution_mean:
        type: number
        description: Mean of the null distribution (should be ~0)
      null_distribution_percentiles:
        type: object
        required:
          - p_95
          - p_99
        properties:
          p_95:
            type: number
          p_99:
            type: number
      p_value:
        type: number
        description: Empirical p-value from the permutation test
      conclusion:
        type: string
        description: Pass/fail status relative to the Plan's requirements

  sensitivity_analysis:
    type: object
    description: Results from sweeping significance thresholds
    required:
      - thresholds
      - significant_counts
      - variance_report
    properties:
      thresholds:
        type: array
        items:
          type: number
        description: List of significance thresholds tested (e.g., [0.01, 0.05, 0.1])
      significant_counts:
        type: array
        items:
          type: integer
        description: Number of significant predictors for each threshold
      variance_report:
        type: string
        description: Textual report on the stability of results across thresholds

  diagnostics:
    type: object
    description: Additional diagnostic information
    properties:
      vif_check_passed:
        type: boolean
        description: True if no metrics exceeded VIF > 5 (or flagged appropriately)
      power_check_status:
        type: string
        enum: ["passed", "warning", "failed"]
        description: Status of the power limitation check (samples >= 10 * predictors)
      notes:
        type: string
        description: Any additional notes or warnings