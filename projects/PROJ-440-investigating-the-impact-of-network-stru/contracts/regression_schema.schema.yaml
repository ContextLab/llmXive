# Schema for regression analysis results
# File: data/analysis/regression_results.json
# Generated by: T006c
# Purpose: Define the expected structure for PCR regression results

$schema: http://json-schema.org/draft-07/schema#
type: object
required:
  - metadata
  - pca_results
  - regression_results
  - vif_analysis
  - sensitivity_analysis
  - summary

properties:
  metadata:
    type: object
    required:
      - timestamp
      - version
      - data_sources
    properties:
      timestamp:
        type: string
        description: ISO 8601 timestamp of analysis execution
      version:
        type: string
        description: Schema version
      data_sources:
        type: object
        required:
          - networks_file
          - energy_decay_file
        properties:
          networks_file:
            type: string
            description: Path to data/raw/networks.csv
          energy_decay_file:
            type: string
            description: Path to data/processed/energy_decay.csv
          excluded_resonant_count:
            type: integer
            description: Number of resonant instances excluded from analysis

  pca_results:
    type: object
    required:
      - n_components
      - explained_variance_ratio
      - loadings
    properties:
      n_components:
        type: integer
        description: Number of principal components retained
      explained_variance_ratio:
        type: array
        items:
          type: number
        description: Variance explained by each PC
      loadings:
        type: object
        description: Loadings of topological metrics on PCs
        additionalProperties:
          type: object
          properties:
            clustering_coefficient:
              type: number
            average_path_length:
              type: number
            average_degree:
              type: number
            degree_std:
              type: number
            graph_density:
              type: number
            small_world_sigma:
              type: number
        description: Mapping of PC names to metric loadings

  regression_results:
    type: object
    required:
      - coefficients
      - p_values
      - corrected_p_values
      - r_squared
      - adjusted_r_squared
    properties:
      coefficients:
        type: object
        description: PCR regression coefficients for each PC
        additionalProperties:
          type: number
      p_values:
        type: object
        description: Uncorrected p-values for each PC coefficient
        additionalProperties:
          type: number
      corrected_p_values:
        type: object
        description: Bonferroni or Holm-Bonferroni corrected p-values
        additionalProperties:
          type: number
      r_squared:
        type: number
        description: R-squared value of the regression model
      adjusted_r_squared:
        type: number
        description: Adjusted R-squared value
      significant_predictors:
        type: array
        items:
          type: string
        description: List of PC names with corrected p-value < 0.05

  vif_analysis:
    type: object
    required:
      - metrics
      - flagged_metrics
    properties:
      metrics:
        type: object
        description: VIF values for each original topological metric
        additionalProperties:
          type: number
      flagged_metrics:
        type: array
        items:
          type: string
        description: List of metrics with VIF > 5.0

  sensitivity_analysis:
    type: object
    required:
      - thresholds
      - significant_counts
      - variance
    properties:
      thresholds:
        type: array
        items:
          type: number
        description: Significance thresholds swept (e.g., [0.01, 0.05, 0.1])
      significant_counts:
        type: array
        items:
          type: integer
        description: Number of significant predictors at each threshold
      variance:
        type: number
        description: Variance in significant predictor counts across thresholds

  summary:
    type: object
    required:
      - conclusion
      - key_findings
    properties:
      conclusion:
        type: string
        description: High-level summary of the analysis
      key_findings:
        type: array
        items:
          type: string
        description: Bullet points of major findings
      pc_interpretation:
        type: object
        description: Physical interpretation of PC1 and PC2
        properties:
          PC1:
            type: string
            description: Interpretation of first principal component
          PC2:
            type: string
            description: Interpretation of second principal component