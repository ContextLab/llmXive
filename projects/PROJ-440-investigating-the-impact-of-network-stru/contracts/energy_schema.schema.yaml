# Schema for data/processed/energy_decay.csv
# Defines the structure of simulation results export

$schema: "http://json-schema.org/draft-07/schema#"
type: object
description: "Schema for energy decay simulation results"

properties:
  graph_id:
    type: string
    description: "Unique identifier for the graph"
    pattern: "^graph_\\d+$"

  class:
    type: string
    description: "Network topology class"
    enum:
      - random
      - scale_free
      - small_world
      - lattice
      - star

  N:
    type: integer
    description: "Number of nodes in the graph"
    minimum: 10

  decay_rate:
    type: number
    description: "Extracted decay rate (λ) from damped sinusoid fit"
    minimum: -1.0
    maximum: 1.0

  r_squared:
    type: number
    description: "R² value of the damped sinusoid fit"
    minimum: 0.0
    maximum: 1.0

  fit_status:
    type: string
    description: "Status of the curve fit"
    enum:
      - success
      - failed
      - convergence_warning

  driving_frequency:
    type: number
    description: "Driving frequency used in simulation"
    minimum: 0.0

  damping_coefficient:
    type: number
    description: "Damping coefficient (γ) used in simulation"
    minimum: 0.0

  status:
    type: string
    description: "Classification of the simulation result"
    enum:
      - dissipative
      - resonant

required:
  - graph_id
  - class
  - N
  - decay_rate
  - r_squared
  - fit_status
  - driving_frequency
  - damping_coefficient
  - status

additionalProperties: false
