# Schema for data/processed/energy_decay.csv
# Generated for T006b
type: object
properties:
  graph_id:
    type: integer
    description: Reference to the network ID in networks.csv
  decay_rate:
    type: number
    description: Extracted energy decay rate (lambda)
  r_squared:
    type: number
    description: R-squared value of the damped sinusoid fit
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    description: Status of the simulation/fit (e.g., success, resonant, failed)
    enum:
      - success
      - resonant
      - failed
  fit_parameters:
    type: string
    description: JSON string containing fit parameters (A, omega, phi, C)
required:
  - graph_id
  - decay_rate
  - r_squared
  - status
