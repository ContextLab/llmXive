$schema: http://json-schema.org/draft-07/schema#
title: Energy Decay Schema
description: Schema for data/processed/energy_decay.csv generated by US2
type: object
properties:
  graph_id:
    type: string
    description: Reference to the network ID in networks.csv
  decay_rate:
    type: number
    description: Extracted decay rate (lambda) from damped sinusoid fit
  r_squared:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: R-squared value of the damped sinusoid fit
  fit_status:
    type: string
    enum:
      - success
      - failed
    description: Status of the fitting procedure
  resonance_flag:
    type: boolean
    description: True if negative decay rate detected (resonance)
  status:
    type: string
    enum:
      - dissipative
      - resonant
      - excluded
    description: Final classification of the simulation result
required:
  - graph_id
  - decay_rate
  - r_squared
  - fit_status
  - resonance_flag
  - status
additionalProperties: false
