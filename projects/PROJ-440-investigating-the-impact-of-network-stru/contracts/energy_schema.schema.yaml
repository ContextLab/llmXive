# Schema for data/processed/energy_decay.csv
# Generated by T006b

type: object
required:
  - graph_id
  - decay_rate
  - r_squared
  - status

properties:
  graph_id:
    type: string
    description: Reference to the graph instance in networks.csv
  
  decay_rate:
    type: number
    description: Extracted decay rate (lambda) from damped sinusoid fit
  
  r_squared:
    type: number
    minimum: 0
    maximum: 1
    description: R-squared value of the fit
  
  status:
    type: string
    enum:
      - success
      - resonant
      - non_convergent
      - excluded
    description: Status of the simulation and fit
  
  fit_params:
    type: string
    description: JSON string containing fit parameters (A, omega, phi, C)
  
  simulation_time:
    type: number
    description: Total simulation time
  
  energy_initial:
    type: number
    description: Initial total energy
  
  energy_final:
    type: number
    description: Final total energy

additionalProperties: false
