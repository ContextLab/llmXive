# Schema for data/processed/energy_decay.csv
# Generated for PROJ-440: Investigating the Impact of Network Structure on Energy Dissipation
# Task: T006b
#
# This schema defines the expected structure for the energy decay results
# produced by the oscillator simulation pipeline (User Story 2).
#
# Columns:
#   graph_id: Unique identifier for the network topology (string)
#   decay_rate: Extracted exponential decay constant λ from damped sinusoid fit (float)
#   r_squared: Goodness-of-fit R² value for the decay model (float, 0-1)
#   status: Classification of the simulation result ('dissipative' or 'resonant')
#   graph_class: Topological class of the network (e.g., 'random', 'scale_free')
#   N: Number of nodes in the network (integer)
#   damping_coefficient: Damping parameter γ used in simulation (float)
#   driving_frequency: Driving frequency ω used in simulation (float)
#   fit_error: Root mean squared error of the fit (float)
#   simulation_seed: Random seed used for the simulation (integer)

schema_version: "1.0"
file_path: "data/processed/energy_decay.csv"
file_format: "csv"

columns:
  - name: graph_id
    type: string
    description: "Unique identifier for the graph instance"
    required: true
    nullable: false
    
  - name: decay_rate
    type: float
    description: "Extracted decay rate λ from E(t) = A * exp(-λt) * cos(ωt + φ) + C"
    required: true
    nullable: false
    constraints:
      min: -1.0
      max: 10.0
      
  - name: r_squared
    type: float
    description: "Coefficient of determination for the damped sinusoid fit"
    required: true
    nullable: false
    constraints:
      min: 0.0
      max: 1.0
      
  - name: status
    type: string
    description: "Simulation status classification"
    required: true
    nullable: false
    enum:
      - dissipative
      - resonant
      - failed
      
  - name: graph_class
    type: string
    description: "Topological class of the network"
    required: true
    nullable: false
    enum:
      - random
      - scale_free
      - small_world
      - lattice
      - star
      
  - name: N
    type: integer
    description: "Number of nodes in the network"
    required: true
    nullable: false
    constraints:
      min: 10
      
  - name: damping_coefficient
    type: float
    description: "Damping parameter γ used in simulation"
    required: true
    nullable: false
    constraints:
      min: 0.0
      
  - name: driving_frequency
    type: float
    description: "Driving frequency ω used in simulation"
    required: true
    nullable: false
    constraints:
      min: 0.0
      
  - name: fit_error
    type: float
    description: "Root mean squared error of the fit"
    required: true
    nullable: false
    constraints:
      min: 0.0
      
  - name: simulation_seed
    type: integer
    description: "Random seed used for the simulation"
    required: true
    nullable: false
    
validation_rules:
  - rule: r_squared_threshold
    condition: "r_squared >= 0.95 OR status == 'resonant'"
    severity: warning
    message: "Low R² value indicates poor fit quality"
    
  - rule: status_consistency
    condition: "status != 'resonant' OR decay_rate < 0"
    severity: error
    message: "Resonant status should only be assigned when decay_rate is negative"
    
  - rule: decay_rate_physical
    condition: "decay_rate >= 0 OR status == 'resonant'"
    severity: warning
    message: "Negative decay rate indicates energy gain (resonance)"

expected_row_count:
  min: 50
  description: "Minimum 10 samples per topological class (5 classes)"