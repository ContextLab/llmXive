# Schema definition for data/processed/energy_decay.csv
# Generated for task T006b: Investigating the Impact of Network Structure on Energy Dissipation
# This file defines the expected structure for the energy decay results produced by the simulation pipeline.

$schema: "http://json-schema.org/draft-07/schema#"
title: Energy Decay Results Schema
description: >
  Defines the structure for the CSV file containing energy decay rates and fit statistics
  extracted from driven damped oscillator simulations on network topologies.

type: object
properties:
  file_path:
    type: string
    const: "data/processed/energy_decay.csv"
  format:
    type: string
    const: "csv"
  delimiter:
    type: string
    const: ","
  header:
    type: boolean
    const: true
  columns:
    type: array
    minItems: 5
    items:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [integer, float, string, boolean]
        description:
          type: string
        constraints:
          type: object
          additionalProperties: true
      required: [name, type, description]

column_definitions:
  - name: graph_id
    type: string
    description: Unique identifier for the network graph used in the simulation.
    constraints:
      pattern: "^[a-z0-9_-]+$"
      nullable: false

  - name: class
    type: string
    description: Topological class of the network (e.g., random, scale_free, small_world, lattice, star).
    constraints:
      enum: [random, scale_free, small_world, lattice, star]
      nullable: false

  - name: N
    type: integer
    description: Number of nodes in the network.
    constraints:
      minimum: 2
      nullable: false

  - name: decay_rate
    type: float
    description: Extracted exponential decay rate (λ) from the damped sinusoid fit to energy data.
    constraints:
      nullable: true
      # Negative values indicate resonance (handled by status column)

  - name: r_squared
    type: float
    description: Coefficient of determination (R²) for the damped sinusoid fit.
    constraints:
      minimum: 0.0
      maximum: 1.0
      nullable: false

  - name: status
    type: string
    description: Classification of the simulation result based on decay rate and fit quality.
    constraints:
      enum: [dissipative, resonant, failed]
      nullable: false

  - name: fit_params
    type: string
    description: JSON-encoded string containing fit parameters (A, ω, φ, C) if fit was successful.
    constraints:
      nullable: true

  - name: seed
    type: integer
    description: Random seed used for the simulation initialization.
    constraints:
      nullable: false

  - name: timestamp
    type: string
    description: ISO 8601 timestamp of when the simulation was completed.
    constraints:
      nullable: false

validation_rules:
  - rule: "decay_rate_must_be_valid"
    description: "If status is 'dissipative', decay_rate must be > 0. If 'resonant', decay_rate must be <= 0."
    logic: "row.status == 'dissipative' => row.decay_rate > 0 AND row.status == 'resonant' => row.decay_rate <= 0"

  - rule: "r_squared_threshold"
    description: "Rows with r_squared < 0.95 should ideally be flagged, though not strictly excluded unless status='failed'."
    logic: "row.r_squared >= 0.95 OR row.status == 'failed'"

  - rule: "required_columns_present"
    description: "All defined columns must be present in the CSV."
    logic: "set(csv_columns) == set(schema_columns)"

metadata:
  version: "1.0.0"
  created_by: "T006b Implementation"
  generated_at: "2023-10-27T12:00:00Z"
  related_tasks:
    - T006b
    - T026
    - T031a