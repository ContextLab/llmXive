# Schema for data/processed/energy_decay.csv
# Generated for Project: PROJ-440-investigating-the-impact-of-network-stru
# Task: T006b - Define expected structure for energy decay results
type: object
description: |
  Defines the expected structure for the energy decay results CSV.
  This file contains the output of the oscillator simulations, including
  decay rates, fit quality, and convergence statistics.
properties:
  graph_id:
    type: string
    description: Unique identifier for the network graph used in the simulation.
    pattern: "^graph_[0-9]+$"
    examples:
      - "graph_001"
      - "graph_042"
  class:
    type: string
    description: Topological class of the network (e.g., random, scale_free, small_world, lattice, star).
    enum:
      - "random"
      - "scale_free"
      - "small_world"
      - "lattice"
      - "star"
    examples:
      - "random"
      - "scale_free"
  decay_rate:
    type: number
    description: |
      The fitted exponential decay rate (λ) from the damped sinusoid model.
      Units: inverse time steps.
      Expected range: Typically > 0 for dissipative systems, < 0 for resonant/unstable.
    minimum: -100.0
    maximum: 100.0
    examples:
      - 0.0523
      - -0.0012
  r_squared:
    type: number
    description: |
      Coefficient of determination (R²) for the damped sinusoid fit.
      Indicates goodness of fit.
    minimum: 0.0
    maximum: 1.0
    examples:
      - 0.9876
      - 0.9921
  status:
    type: string
    description: |
      Classification of the simulation result.
      'dissipative': Standard energy decay observed.
      'resonant': Negative decay rate detected (energy growth or sustained oscillation).
      'unstable': Convergence criteria not met (high variance across seeds).
    enum:
      - "dissipative"
      - "resonant"
      - "unstable"
    examples:
      - "dissipative"
      - "resonant"
  convergence_std:
    type: number
    description: |
      Standard deviation of the decay rate across multiple simulation seeds
      (used for convergence testing).
    minimum: 0.0
    examples:
      - 0.0005
      - 0.0012
  convergence_mean:
    type: number
    description: |
      Mean decay rate across multiple simulation seeds.
    examples:
      - 0.0520
      - 0.0518
  seed_count:
    type: integer
    description: Number of random seeds used for convergence testing.
    minimum: 1
    examples:
      - 10
  simulation_time:
    type: number
    description: Total simulation time duration.
    minimum: 0.0
    examples:
      - 200.0
  damping_coefficient:
    type: number
    description: The damping coefficient (γ) used in the oscillator equations.
    minimum: 0.0
    examples:
      - 0.1
  driving_frequency:
    type: number
    description: The driving frequency (ω) used in the oscillator equations.
    minimum: 0.0
    examples:
      - 1.0
required:
  - graph_id
  - class
  - decay_rate
  - r_squared
  - status
additionalProperties: false
