$schema: http://json-schema.org/draft-07/schema#
title: Energy Decay Results Schema
description: |
  Schema for the energy decay results CSV file generated by the oscillator
  simulation pipeline. This file contains the extracted decay rates, fit
  quality metrics, and status classifications for each simulated network.
type: object
properties:
  graph_id:
    type: string
    description: Unique identifier for the graph (matches id in data/raw/networks.csv)
  class:
    type: string
    description: Network class (e.g., random, scale_free, small_world, lattice, star)
  N:
    type: integer
    description: Number of nodes in the network
  decay_rate:
    type: number
    description: Extracted exponential decay rate (lambda) from the damped sinusoid fit
  r_squared:
    type: number
    description: Coefficient of determination (R²) for the damped sinusoid fit
  status:
    type: string
    description: |
      Classification of the simulation result.
      - 'dissipative': Normal energy decay (positive decay rate, R² >= 0.95)
      - 'resonant': Negative decay rate detected (energy growth/resonance)
      - 'failed': Fit quality below threshold (R² < 0.95) or simulation error
  fit_frequency:
    type: number
    description: Frequency (omega) extracted from the damped sinusoid fit
  fit_amplitude:
    type: number
    description: Amplitude (A) extracted from the damped sinusoid fit
  fit_phase:
    type: number
    description: Phase (phi) extracted from the damped sinusoid fit
  fit_offset:
    type: number
    description: Offset (C) extracted from the damped sinusoid fit
  simulation_seed:
    type: integer
    description: Random seed used for the simulation
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the simulation was completed

required:
  - graph_id
  - class
  - N
  - decay_rate
  - r_squared
  - status

additionalProperties: false
