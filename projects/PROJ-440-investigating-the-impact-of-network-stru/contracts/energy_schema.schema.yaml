# Schema for data/processed/energy_decay.csv
# Generated using Pydantic v2 field definitions
# Columns: graph_id, decay_rate, r_squared, status, convergence_std

type: object
title: EnergyDecayRecord
description: "Schema for energy decay results from oscillator simulations"
required:
  - graph_id
  - decay_rate
  - r_squared
  - status
properties:
  graph_id:
    type: string
    description: "Unique identifier for the network graph (matches id in networks.csv)"
    pattern: "^graph_\\d+$"
  
  decay_rate:
    type: number
    format: float
    description: "Fitted decay rate (lambda) from damped sinusoid fit"
    minimum: -1.0
    maximum: 10.0
  
  r_squared:
    type: number
    format: float
    description: "Coefficient of determination for the fit"
    minimum: 0.0
    maximum: 1.0
  
  status:
    type: string
    description: "Classification of the simulation result"
    enum:
      - dissipative
      - resonant
      - unstable
      - failed
  
  convergence_std:
    type: number
    format: float
    description: "Standard deviation of decay rates across multiple seeds (if convergence test performed)"
    minimum: 0.0
    nullable: true
  
  convergence_mean:
    type: number
    format: float
    description: "Mean decay rate across multiple seeds"
    minimum: -1.0
    maximum: 10.0
    nullable: true
  
  fit_parameters:
    type: object
    description: "Detailed fit parameters from curve_fit"
    properties:
      A:
        type: number
      omega:
        type: number
      phi:
        type: number
      C:
        type: number
    nullable: true
  
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of simulation completion"
    nullable: true

additionalProperties: false
