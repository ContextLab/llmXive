$schema: "http://json-schema.org/draft-07/schema#"
title: "NetworkTopology"
description: "Schema for generated network topologies and their static metrics."
type: "object"
properties:
  graph_id:
    type: "string"
    description: "Unique identifier for the graph (e.g., 'random_001')."
  topology_class:
    type: "string"
    description: "Class of the network topology."
    enum:
      - "random"
      - "scale_free"
      - "small_world"
      - "lattice"
      - "star"
  node_count:
    type: "integer"
    minimum: 100
    maximum: 200
    description: "Number of nodes in the graph."
  avg_degree:
    type: "number"
    description: "Average degree of the graph."
  clustering_coeff:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Global clustering coefficient."
  avg_path_length:
    type: "number"
    description: "Average shortest path length."
  degree_distribution:
    type: "object"
    description: "Histogram of degrees (for KS-test validation)."
    additionalProperties:
      type: "integer"
  seed:
    type: "integer"
    description: "Random seed used for generation."
required:
  - "graph_id"
  - "topology_class"
  - "node_count"
  - "avg_degree"
  - "clustering_coeff"
  - "avg_path_length"
  - "degree_distribution"
  - "seed"
