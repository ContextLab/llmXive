[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-network-dissipation"
version = "0.1.0"
description = "Investigating the Impact of Network Structure on Energy Dissipation in Driven Oscillators"
requires-python = ">=3.9"
dependencies = [
    "networkx>=3.0",
    "scipy>=1.10",
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.7",
    "scikit-learn>=1.2",
    "statsmodels>=0.13",
    "pytest>=7.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "pre-commit>=3.0"
]

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # allow asserts in tests

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
