# Dataset Schema for LLM-Generated Code Documentation Impact Study
# Generated based on data-model.md and participant_logs.json structure
# Task: T030a
type: object
required:
  - participant_id
  - session_id
  - condition
  - repo_id
  - start_time
  - end_time
  - task_duration_seconds
  - help_request_count
  - helpfulness_score
  - intervention_flag
  - status
properties:
  participant_id:
    type: string
    description: Unique anonymous identifier for the participant
    pattern: "^[A-Z0-9]{8}$"
  session_id:
    type: string
    description: Unique identifier for the specific study session
    pattern: "^[A-Z0-9]{12}$"
  condition:
    type: string
    description: Documentation condition assigned to the participant
    enum:
      - LLM
      - Human
      - None
  repo_id:
    type: string
    description: Identifier for the codebase repository used
    type: string
  start_time:
    type: string
    description: ISO 8601 timestamp when the session started
    format: date-time
  end_time:
    type: string
    description: ISO 8601 timestamp when the session ended
    format: date-time
  task_duration_seconds:
    type: number
    description: Total duration of the onboarding task in seconds
    minimum: 0
  help_request_count:
    type: integer
    description: Number of clarification questions asked during the session
    minimum: 0
  helpfulness_requests:
    type: array
    description: Detailed log of help requests (timestamp, content)
    items:
      type: object
      required:
        - timestamp
        - content
      properties:
        timestamp:
          type: string
          format: date-time
        content:
          type: string
  helpfulness_score:
    type: integer
    description: Subjective helpfulness rating from post-task survey (1-5)
    minimum: 1
    maximum: 5
  intervention_flag:
    type: boolean
    description: True if stop-loss intervention was triggered
  time_capped:
    type: boolean
    description: True if the recorded time was capped due to intervention
  final_time:
    type: number
    description: Final recorded time (may be capped) in seconds
  status:
    type: string
    description: Outcome status of the session
    enum:
      - completed
      - abandoned
      - failed
  dropout_reason:
    type: string
    description: Reason for dropout if status is abandoned or failed
    nullable: true
  metadata:
    type: object
    description: Additional metadata (optional)
    properties:
      platform:
        type: string
      browser:
        type: string
      notes:
        type: string
additionalProperties: false