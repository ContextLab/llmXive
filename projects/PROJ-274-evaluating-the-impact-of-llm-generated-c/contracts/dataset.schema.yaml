$schema: http://json-schema.org/draft-07/schema#
title: Participant Logs Schema
description: Schema for validating raw participant logs from the onboarding experiment.
type: object
required:
  - metadata
  - participants
properties:
  metadata:
    type: object
    required:
      - version
      - generated_at
      - experiment_id
    properties:
      version:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
      generated_at:
        type: string
        format: date-time
      experiment_id:
        type: string
      total_participants:
        type: integer
        minimum: 0
  participants:
    type: array
    minItems: 0
    items:
      type: object
      required:
        - participant_id
        - condition
        - session_start
        - session_end
        - tasks
      properties:
        participant_id:
          type: string
          pattern: '^[A-Z]{2}[0-9]{3}$'
        condition:
          type: string
          enum:
            - llm_docs
            - human_docs
            - no_docs
        session_start:
          type: string
          format: date-time
        session_end:
          type: string
          format: date-time
        repo_id:
          type: string
        tasks:
          type: array
          items:
            type: object
            required:
              - task_id
              - start_time
              - end_time
              - completed
            properties:
              task_id:
                type: string
              start_time:
                type: string
                format: date-time
              end_time:
                type: string
                format: date-time
              completed:
                type: boolean
              time_taken_seconds:
                type: number
        help_requests:
          type: array
          items:
            type: object
            required:
              - timestamp
              - content
              - type
            properties:
              timestamp:
                type: string
                format: date-time
              content:
                type: string
              type:
                type: string
                enum:
                  - keyword
                  - moderator_tag
        cognitive_load_proxy:
          type: number
          minimum: 0
        subjective_helpfulness:
          type: integer
          minimum: 1
          maximum: 5
        intervention_flag:
          type: boolean
        time_capped:
          type: boolean
        final_time:
          type: number
          minimum: 0
        status:
          type: string
          enum:
            - complete
            - incomplete
            - abandoned
            - stopped_loss
