$schema: "http://json-schema.org/draft-07/schema#"
title: "Participant Schema"
description: "Schema for anonymized participant data used in analysis."
type: "object"
properties:
  participant_id:
    type: "string"
    description: "Anonymized unique identifier."
  condition:
    type: "string"
    enum:
      - "llm_docs"
      - "human_docs"
      - "no_docs"
    description: "Experimental condition assigned."
  demographics:
    type: "object"
    description: "Optional demographic data."
    properties:
      age_range:
        type: "string"
      experience_level:
        type: "string"
  status:
    type: "string"
    enum:
      - "active"
      - "completed"
      - "dropped_out"
  consent_timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of consent."
required:
  - "participant_id"
  - "condition"
  - "status"
  - "consent_timestamp"
additionalProperties: false
