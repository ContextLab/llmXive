$schema: "http://json-schema.org/draft-07/schema#"
title: "Repository Schema"
description: "Schema for repository metadata and metrics."
type: "object"
properties:
  repo_id:
    type: "string"
    description: "Unique identifier for the repository."
  url:
    type: "string"
    format: "uri"
    description: "GitHub URL."
  commit_hash:
    type: "string"
    pattern: "^[a-f0-9]{40}$"
    description: "Pinned commit SHA-1."
  condition:
    type: "string"
    enum:
      - "llm_docs"
      - "human_docs"
      - "no_docs"
  loc:
    type: "integer"
    minimum: 0
    description: "Lines of Code."
  cc:
    type: "integer"
    minimum: 0
    description: "Cyclomatic Complexity."
  doc_quality_score:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Quality score based on rubric."
  generated_docs_path:
    type: "string"
    description: "Relative path to generated documentation."
required:
  - "repo_id"
  - "url"
  - "commit_hash"
  - "condition"
  - "loc"
  - "cc"
additionalProperties: false
