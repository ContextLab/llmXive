[project]
name = "llmxive-ceramics"
version = "0.1.0"
description = "Predicting the impact of composition on the Weibull modulus of ceramics"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "shap",
    "chemparse",
    "requests",
    "pyyaml",
    "scipy",
    "datasets",
    "huggingface_hub",
    "arxiv",
    "pdfplumber",
    "periodictable",
    "pymatgen",
    "pydantic",
    "python-dotenv",
    "jsonschema",
    "psutil",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
