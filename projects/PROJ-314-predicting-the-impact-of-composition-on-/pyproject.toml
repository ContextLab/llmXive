[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceramic-weibull-prediction"
version = "0.1.0"
description = "Predicting the impact of composition on the Weibull modulus of ceramics"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "shap",
    "chemparse",
    "requests",
    "pyyaml",
    "scipy",
    "datasets",
    "huggingface_hub",
    "arxiv",
    "pdfplumber",
    "periodictable",
    "pymatgen",
    "pydantic",
    "jsonschema",
    "psutil",
    "python-dotenv",
    "matplotlib",
    "seaborn"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
    "pytest-cov"
]

[tool.ruff]
# Target Python version
target-version = "py311"

# Line length
line-length = 100

# Select rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

# Ignore specific rules if necessary
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in dataclasses)
]

# Exclude directories
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "*.egg-info"
]

[tool.ruff.per-file-ignores]
# Allow unused imports in __init__.py files for exports
"__init__.py" = ["F401"]
# Allow print statements in scripts
"code/scripts/*.py" = ["T201"]

[tool.black]
# Black configuration
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
