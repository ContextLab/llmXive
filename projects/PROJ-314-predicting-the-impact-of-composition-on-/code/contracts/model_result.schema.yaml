$schema: http://json-schema.org/draft-07/schema#
title: ModelResult
description: >
  Schema for the output of the predictive modeling pipeline.
  Contains performance metrics, feature importance, and validation reports.
type: object
required:
  - model_type
  - metrics
  - feature_importance
  - stratification_report
  - permutation_p_value
  - timestamp
properties:
  model_type:
    type: string
    description: >
      Type of model trained (e.g., "RandomForest", "GradientBoosting").
    enum:
      - RandomForest
      - GradientBoosting
      - Baseline
  
  metrics:
    type: object
    required:
      - mae
      - r2
      - rmse
    properties:
      mae:
        type: number
        format: float
        description: Mean Absolute Error.
      r2:
        type: number
        format: float
        description: Coefficient of determination (R²).
      rmse:
        type: number
        format: float
        description: Root Mean Squared Error.
      baseline_mae:
        type: number
        format: float
        nullable: true
        description: MAE of the global mean baseline predictor.
  
  feature_importance:
    type: array
    description: >
      List of features ranked by importance (SHAP or model-based).
    items:
      type: object
      required:
        - feature_name
        - importance_score
      properties:
        feature_name:
          type: string
        importance_score:
          type: number
          format: float
        physical_mechanism:
          type: string
          nullable: true
          description: >
            Mapped physical mechanism from physics_mappings.py if available.
  
  stratification_report:
    type: object
    description: >
      Details about the stratified split or hold-out strategy used.
    required:
      - split_type
      - classes
      - class_distribution
    properties:
      split_type:
        type: string
        enum:
          - stratified_k_fold
          - hold_out
      k_folds:
        type: integer
        nullable: true
        description: Number of folds if split_type is stratified_k_fold.
      classes:
        type: array
        items:
          type: string
        description: List of unique classes (primary_anion_cation_group) used.
      class_distribution:
        type: object
        additionalProperties:
          type: integer
        description: >
          Map of class name to sample count in the training set.
  
  permutation_p_value:
    type: number
    format: float
    description: >
      P-value from the permutation test. If < 0.05, the model is
      considered statistically significant.
  
  leakage_warning:
    type: boolean
    description: >
      True if a potential data leakage issue was detected (performance drop < 10%
      when removing primary_anion_cation_group).
  
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the model was generated.
  
  hyperparameters:
    type: object
    description: >
      Dictionary of hyperparameters used for the model.
    additionalProperties: true
  
  data_hash:
    type: string
    description: >
      SHA-256 hash of the input dataset used for training, for reproducibility.
