$schema: http://json-schema.org/draft-07/schema#
title: ModelResult
description: >-
  Schema for the output of the predictive modeling pipeline (US2).
  Captures model performance metrics, hyperparameters, and stratification details.
type: object
required:
  - model_type
  - metrics
  - stratification_info
  - timestamp
  - data_version
properties:
  model_type:
    type: string
    description: Type of model trained (e.g., "RandomForest", "GradientBoosting").
    enum:
      - RandomForest
      - GradientBoosting
      - Baseline
  metrics:
    type: object
    description: Performance metrics calculated on the validation set.
    required:
      - mae
      - r2
      - rmse
    properties:
      mae:
        type: number
        description: Mean Absolute Error.
      r2:
        type: number
        description: R-squared (coefficient of determination).
      rmse:
        type: number
        description: Root Mean Squared Error.
      cv_scores:
        type: array
        description: List of scores from cross-validation folds.
        items:
          type: number
        nullable: true
      cv_mean:
        type: number
        description: Mean of cross-validation scores.
        nullable: true
      cv_std:
        type: number
        description: Standard deviation of cross-validation scores.
        nullable: true
  stratification_info:
    type: object
    description: Details about the stratification used during splitting.
    required:
      - strategy
      - base_column
    properties:
      strategy:
        type: string
        description: Strategy used (e.g., "kfold", "holdout").
      base_column:
        type: string
        description: Column used for stratification (e.g., "primary_anion_cation_group").
      folds:
        type: integer
        description: Number of folds if k-fold was used.
        nullable: true
      distribution:
        type: object
        description: Distribution of classes in the target variable before split.
        additionalProperties:
          type: integer
        nullable: true
  hyperparameters:
    type: object
    description: Final hyperparameters used for the trained model.
    additionalProperties: true
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the model was trained.
  data_version:
    type: string
    description: Hash or version identifier of the input dataset used.
  feature_names:
    type: array
    description: List of feature names used in the model.
    items:
      type: string
    nullable: true
  best_params_source:
    type: string
    description: Source of the best parameters (e.g., "grid_search", "manual", "default").
    nullable: true
additionalProperties: false