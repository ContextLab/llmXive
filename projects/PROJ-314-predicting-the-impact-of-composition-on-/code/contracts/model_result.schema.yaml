$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Result Schema"
description: "Schema for the output of the predictive modeling pipeline (US2). Defines the structure of model metrics, cross-validation results, and baseline comparisons."
type: object
required:
  - model_type
  - metrics
  - cross_validation
  - timestamp
  - data_version
properties:
  model_type:
    type: string
    description: "Type of model (e.g., 'RandomForest', 'GradientBoosting')"
    enum:
      - RandomForest
      - GradientBoosting
      - Baseline
  metrics:
    type: object
    description: "Primary performance metrics on the test set"
    required:
      - mae
      - r2
      - rmse
    properties:
      mae:
        type: number
        description: "Mean Absolute Error"
      r2:
        type: number
        description: "Coefficient of Determination (R-squared)"
      rmse:
        type: number
        description: "Root Mean Squared Error"
      mape:
        type: number
        description: "Mean Absolute Percentage Error (optional)"
  cross_validation:
    type: object
    description: "Cross-validation results"
    required:
      - mean_score
      - std_score
      - scores
    properties:
      mean_score:
        type: number
        description: "Mean R2 score across folds"
      std_score:
        type: number
        description: "Standard deviation of R2 scores"
      scores:
        type: array
        description: "Individual R2 scores for each fold"
        items:
          type: number
      fold_count:
        type: integer
        description: "Number of CV folds used"
  baseline_comparison:
    type: object
    description: "Comparison against the global mean baseline"
    required:
      - baseline_mae
      - model_mae
      - improvement_percent
    properties:
      baseline_mae:
        type: number
        description: "MAE of the global mean baseline predictor"
      model_mae:
        type: number
        description: "MAE of the trained model"
      improvement_percent:
        type: number
        description: "Percentage improvement over baseline"
  stratification_report:
    type: object
    description: "Details of the stratified split used"
    required:
      - train_size
      - test_size
      - groups
    properties:
      train_size:
        type: integer
        description: "Number of samples in training set"
      test_size:
        type: integer
        description: "Number of samples in test set"
      groups:
        type: object
        description: "Distribution of primary_anion_cation_group in train/test"
        additionalProperties:
          type: object
          properties:
            train_count:
              type: integer
            test_count:
              type: integer
  hyperparameters:
    type: object
    description: "Best hyperparameters found during tuning"
    additionalProperties: true
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of when the model was evaluated"
  data_version:
    type: string
    description: "Version hash of the input data used for training"
  pipeline_version:
    type: string
    description: "Version of the modeling pipeline code"
