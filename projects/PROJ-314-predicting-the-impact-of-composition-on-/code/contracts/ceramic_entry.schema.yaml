$schema: http://json-schema.org/draft-07/schema#
title: CeramicEntry
description: >
  Schema for a single ceramic material entry containing composition,
  processing parameters, and measured Weibull modulus.
type: object
required:
  - composition
  - weibull_modulus
  - source_id
  - primary_anion_cation_group
properties:
  composition:
    type: string
    description: >
      Chemical formula string (e.g., "Al2O3", "BaTiO3").
      Must be parseable by chemparse.
    minLength: 1
  weibull_modulus:
    type: number
    description: >
      The measured Weibull modulus (m) for the material.
      Must be a positive real number.
    minimum: 0
  sample_count:
    type: integer
    description: >
      Number of samples (N) used to derive the Weibull modulus.
      Used for data gap validation.
    minimum: 1
  source_id:
    type: string
    description: >
      Unique identifier for the source publication (DOI or URL).
    pattern: '^(doi:|https?://)'
  title:
    type: string
    description: Title of the source publication.
  primary_anion_cation_group:
    type: string
    description: >
      Derived grouping feature based on the primary anion and cation groups.
      Format: "Group_Anion-Group_Cation" (e.g., "16-2").
  sintering_temp:
    type: number
    description: Sintering temperature in Celsius.
    minimum: 0
  is_range_flag:
    type: boolean
    description: >
      Indicates if the Weibull modulus was originally reported as a range.
  range_original:
    type: string
    description: >
      Original string representation if the value was a range (e.g., "10-15").
  range_uncertainty:
    type: number
    description: >
      Calculated uncertainty for range values: (max - min) / 2.
  is_imputed:
    type: boolean
    description: >
      True if any missing values in this row were imputed.
  # Elemental descriptors (computed in T019)
  mean_atomic_radius:
    type: number
    description: Mean atomic radius of the constituent elements.
  electronegativity_std:
    type: number
    description: Standard deviation of electronegativity of constituent elements.
  cation_size_variance:
    type: number
    description: Variance in cation sizes.
  valence_electron_concentration:
    type: number
    description: >
      Valence Electron Concentration (VEC).
      Calculated as sum(valence electrons) / total atoms.
additionalProperties: false
