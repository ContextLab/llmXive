$schema: http://json-schema.org/draft-07/schema#
title: CeramicEntry
description: |
  Schema for a single ceramic material entry.
  Represents a row in the raw or processed dataset before model training.
  Includes composition, processing parameters, and target variable.
type: object
required:
  - composition
  - weibull_modulus
properties:
  composition:
    type: string
    description: |
      Chemical formula string (e.g., "Al2O3", "Y3Al5O12").
      Must be parseable by chemparse.
    minLength: 1
  weibull_modulus:
    type: number
    description: |
      The target variable: Weibull modulus (m).
      Must be a positive real number.
    minimum: 0
  sample_count:
    type: integer
    description: |
      Number of samples (N) used to calculate the Weibull modulus.
      Used for filtering (N >= 30) and weighting.
    minimum: 1
  sintering_temp:
    type: number
    description: |
      Sintering temperature in Celsius.
      Can be null if not reported.
    nullable: true
  sintering_time:
    type: number
    description: |
      Sintering time in hours.
      Can be null if not reported.
    nullable: true
  primary_anion_cation_group:
    type: string
    description: |
      Derived grouping feature based on the primary anion and cation.
      Used for stratified splitting.
      Example: "Oxide-Al", "Nitride-Si".
    nullable: true
  is_range_flag:
    type: boolean
    description: |
      Indicates if the original Weibull modulus was a range (e.g., "10-12").
      If true, the value stored in weibull_modulus is the midpoint.
    default: false
  range_original:
    type: string
    description: |
      Original string value of the Weibull modulus if it was a range.
      Null if not a range.
    nullable: true
  range_uncertainty:
    type: number
    description: |
      Calculated uncertainty from range: (max - min) / 2.
      Null if is_range_flag is false.
    nullable: true
  is_imputed:
    type: boolean
    description: |
      Indicates if any missing values in this row were imputed.
    default: false
  source_url:
    type: string
    description: |
      URL or DOI of the source paper for this entry.
      Used for citation validation.
    format: uri
    nullable: true
  material_class:
    type: string
    description: |
      Broad classification of the material (e.g., "Oxide", "Nitride", "Carbide").
      Used for filtering rare classes.
    nullable: true
  notes:
    type: string
    description: |
      Any additional notes or flags associated with this entry.
    nullable: true
additionalProperties: false
