type: object
properties:
  composition:
    type: string
    description: Chemical formula string, e.g., 'Al2O3'
  weibull_modulus:
    type: number
    description: The Weibull modulus (m) value
  sample_count:
    type: integer
    minimum: 1
    description: Number of samples used for measurement (N)
  is_range_flag:
    type: boolean
    description: True if weibull_modulus was a range midpoint
  range_original:
    anyOf:
      - type: string
      - type: 'null'
    description: Original range string if is_range_flag is True
  is_imputed:
    type: boolean
    description: True if any descriptors were imputed
  primary_anion_cation_group:
    anyOf:
      - type: string
      - type: 'null'
    description: e.g., 'O-Al', 'N-Si'
  sintering_temp:
    anyOf:
      - type: number
      - type: 'null'
    description: Sintering temperature in Kelvin
  mean_atomic_radius:
    anyOf:
      - type: number
      - type: 'null'
    minimum: 0.0
    description: Mean atomic radius of cations
  electronegativity_std:
    anyOf:
      - type: number
      - type: 'null'
    minimum: 0.0
    description: Std dev of electronegativity
  valence_electron_concentration:
    anyOf:
      - type: number
      - type: 'null'
    minimum: 0.0
    description: Valence electron concentration
  cation_size_variance:
    anyOf:
      - type: number
      - type: 'null'
    minimum: 0.0
  range_uncertainty:
    anyOf:
      - type: number
      - type: 'null'
    minimum: 0.0
required:
  - composition
  - weibull_modulus
  - sample_count
