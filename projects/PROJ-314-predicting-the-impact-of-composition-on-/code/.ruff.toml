[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in dataclasses/Pydantic)
    "C901", # too complex (will be addressed incrementally)
]

[lint.isort]
known-first-party = ["config", "contracts", "descriptors", "diagnostics", "ingestion", "logger", "memory_monitor", "modeling", "physics_mappings", "report", "run_pipeline_timing", "sample_fallback", "scripts", "setup_directories", "timeout_wrapper", "verify_citation_log"]
force-sort-within-sections = true
lines-after-imports = 2

[format]
line-length = 100
indent-width = 4
