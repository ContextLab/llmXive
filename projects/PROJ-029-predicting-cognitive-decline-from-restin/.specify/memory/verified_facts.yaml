  quote: The film received a U/A 13+ certificate on 2 July 2026 by the Central Board
    of Film Certification (CBFC). In two places in the film, the scenes having 'obscene'
    hand gestures were modified and replaced. The CBFC's Examining Committee had also
    asked the makers to replace 'obscene' words in seven places in the film. No scene
    in the film was cut. The runtime of the film is 143 minutes.
