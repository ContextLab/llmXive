$schema: "http://json-schema.org/draft-07/schema#"
title: "DiscreteStateVector"
description: "Schema for a single quantized state vector from the LIBERO dataset."
type: "object"
properties:
  episode_id:
    type: "string"
    description: "Unique identifier for the episode."
  timestep:
    type: "integer"
    description: "Time step index within the episode."
  bit_depth:
    type: "integer"
    enum:
      - 4
      - 6
      - 8
      - 16
    description: "Quantization level used."
  state_values:
    type: "array"
    items:
      type: "integer"
    description: "Discrete integer values in range [0, 2^bit_depth - 1]."
  velocity_values:
    type: "array"
    items:
      type: "number"
    description: "Discrete velocity values derived via finite differencing. Stored as number to allow float representation for continuous baseline context."
  noise_seed:
    type: "integer"
    description: "Random seed used for noise injection."
  quantization_error:
    type: "number"
    description: "Theoretical noise floor for this bit depth."
required:
  - episode_id
  - timestep
  - bit_depth
  - state_values
  - velocity_values
  - noise_seed
  - quantization_error
additionalProperties: false