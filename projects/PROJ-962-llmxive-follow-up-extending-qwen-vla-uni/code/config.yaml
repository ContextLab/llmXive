# Configuration for Non-Neural VLA Approximation Pipeline
# This file overrides defaults in code/utils/config.py

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_results: "data/results"
  models: "artifacts/models"
  vla_proxy_baseline: "data/results/vla_proxy_baseline.parquet"

clustering:
  initial_k: 50
  silhouette_threshold: 0.25
  k_decrement_step: 5
  max_attempts: 10
  min_samples_per_cluster: 100

simulation:
  joint_limits:
    shoulder_pan: [-6.28, 6.28]
    shoulder_lift: [-3.14, 3.14]
    elbow: [-3.14, 3.14]
    wrist_1: [-6.28, 6.28]
    wrist_2: [-6.28, 6.28]
    wrist_3: [-6.28, 6.28]
  task_types:
    - grasp
    - navigate
    - place
  max_steps: 100
  collision_threshold: 0.01

training:
  bert_model: "bert-base-uncased"
  r2_threshold: 0.6
  train_test_split: 0.8

evaluation:
  confidence_interval: 0.95
  fidelity_error_margin: 0.05