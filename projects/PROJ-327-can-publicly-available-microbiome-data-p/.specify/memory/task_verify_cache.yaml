  r: "The `code/acquire.py` script does download the FASTQ files and records SHA\u2011\
    256 checksums (evidence: files in `data/raw/sra_fastq/` and entries in `data/checksums/checksums.txt`),\
    \ and the unit test passes. However, the implementation does **not** use the required\
    \ `pysradb` or `sra-tools` libraries as stipulated in the task specification;\
    \ it downloads directly via `requests`. This violates the explicit requirement\
    \ that the download function \u201Cuses pysradb/sra-tools\u201D. The task therefore\
    \ remains incomplete."
