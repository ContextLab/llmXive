[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-correlates-predictive-error"
version = "0.1.0"
description = "Neural Correlates of Predictive Error Signals During Tactile Discrimination Learning"
requires-python = ">=3.11"
dependencies = [
    "mne",
    "pandas",
    "numpy",
    "statsmodels",
    "scikit-learn",
    "pyyaml",
    "requests",
    "datasets",
    "joblib",
    "ruff",
    "black",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-v --tb=short"
