[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-correlates-tactile-learning"
version = "0.1.0"
description = "Analysis of neural correlates of predictive error signals during tactile discrimination learning"
requires-python = ">=3.11"
dependencies = [
    "mne",
    "pandas",
    "numpy",
    "statsmodels",
    "scikit-learn",
    "pyyaml",
    "requests",
    "datasets",
    "joblib",
    "pytest",
    "pytest-cov",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pre-commit",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["code"]
