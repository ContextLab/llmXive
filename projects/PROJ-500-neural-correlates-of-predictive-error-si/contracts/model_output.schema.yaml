$schema: "http://json-schema.org/draft-07/schema#"
title: Model Output Schema
description: Schema for statistical model output
type: object
properties:
  model_type:
    type: string
    description: Type of model used (e.g., Gaussian LME)
  formula:
    type: string
    description: Model formula
  coefficients:
    type: object
    description: Model coefficients
    additionalProperties:
      type: object
      properties:
        estimate:
          type: number
        std_error:
          type: number
        t_value:
          type: number
        p_value:
          type: number
        p_value_corrected:
          type: number
  model_fit:
    type: object
    description: Model fit statistics
    properties:
      aic:
        type: number
      bic:
        type: number
      log_likelihood:
        type: number
  permutation_test:
    type: object
    description: Permutation test results
    properties:
      n_permutations:
        type: integer
      p_value:
        type: number
      observed_stat:
        type: number
      null_distribution:
        type: array
        items:
          type: number
  robustness:
    type: object
    description: Sensitivity analysis results
    properties:
      time_window_sweep:
        type: array
        items:
          type: object
          properties:
            window_start:
              type: number
            window_end:
              type: number
            coefficient:
              type: number
            p_value:
              type: number
  timestamp:
    type: string
    format: date-time
    description: Timestamp of model execution
required:
  - model_type
  - formula
  - coefficients
  - model_fit
  - timestamp
