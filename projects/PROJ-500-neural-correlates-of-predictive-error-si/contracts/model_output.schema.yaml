$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: >
  Schema for the statistical modeling results (LME coefficients, p-values,
  FDR corrections, and permutation test results) as required by T009b and FR-006/007/008.
type: object
required:
  - coefficients
  - p_values
  - fdr_p_values
  - permutation_p_value
properties:
  coefficients:
    type: object
    description: >
      Dictionary of model coefficients (fixed effects).
      Keys are parameter names (e.g., 'Intercept', 'Accuracy', 'Learning_Phase[T.Late]').
      Values are floats representing the estimated effect size.
    additionalProperties:
      type: number
  p_values:
    type: object
    description: >
      Dictionary of uncorrected p-values for each fixed effect parameter.
      Keys match those in 'coefficients'.
      Values are floats between 0 and 1.
    additionalProperties:
      type: number
  fdr_p_values:
    type: object
    description: >
      Dictionary of Benjamini-Hochberg FDR corrected p-values.
      Keys match those in 'coefficients'.
      Values are floats between 0 and 1.
    additionalProperties:
      type: number
  permutation_p_value:
    type: number
    description: >
      P-value derived from the permutation test (n=1000 or dynamic n).
      Represents the proportion of permuted statistics that were as extreme
      as the observed statistic.
      Value must be between 0 and 1.
  model_info:
    type: object
    description: Optional metadata about the model fit.
    properties:
      formula:
        type: string
      n_observations:
        type: integer
      n_groups:
        type: integer
      convergence_status:
        type: string
      log_likelihood:
        type: number
  permutation_details:
    type: object
    description: Optional details about the permutation test execution.
    properties:
      n_permutations:
        type: integer
      stability_variance:
        type: number
      pilot_variance:
        type: number
      final_n:
        type: integer
additionalProperties: false
