$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: >
  Schema for the statistical modeling results generated by the
  Gaussian LME analysis, including coefficients, p-values, FDR-corrected
  p-values, and permutation test results.
type: object
required:
  - coefficients
  - p_values
  - fdr_p_values
  - permutation_p_value
  - model_metadata
properties:
  coefficients:
    type: object
    description: >
      Dictionary mapping predictor names (e.g., 'Accuracy', 'Learning_Phase', 'Intercept')
      to their estimated coefficient values for each electrode analyzed.
    additionalProperties:
      type: number
      description: The estimated coefficient value for the predictor.
  p_values:
    type: object
    description: >
      Dictionary mapping predictor names to their raw p-values from the LME model
      for each electrode.
    additionalProperties:
      type: number
      minimum: 0
      maximum: 1
      description: The raw p-value for the predictor.
  fdr_p_values:
    type: object
    description: >
      Dictionary mapping predictor names to their Benjamini-Hochberg FDR-corrected
      p-values for multiple comparison correction across electrodes.
    additionalProperties:
      type: number
      minimum: 0
      maximum: 1
      description: The FDR-corrected p-value for the predictor.
  permutation_p_value:
    type: number
    minimum: 0
    maximum: 1
    description: >
      The p-value derived from the permutation test (null distribution generated
      by shuffling the predictor variable), indicating the robustness of the
      observed effect.
  model_metadata:
    type: object
    description: Metadata about the model fit and execution environment.
    required:
      - model_type
      - formula
      - n_observations
      - n_subjects
      - n_permutations
      - fdr_method
      - timestamp
    properties:
      model_type:
        type: string
        const: GaussianLME
      formula:
        type: string
        description: The R-style formula used for the LME model.
        const: "MMN_Amplitude ~ Accuracy + Learning_Phase + (1|Subject)"
      n_observations:
        type: integer
        minimum: 1
        description: Total number of observations (blocks) used in the model.
      n_subjects:
        type: integer
        minimum: 1
        description: Number of unique subjects included in the random effect.
      n_permutations:
        type: integer
        minimum: 1
        description: Number of permutations run for the stability test.
      fdr_method:
        type: string
        const: benjamini_hochberg
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the model was generated.
  stability_log_path:
    type: string
    nullable: true
    description: >
      Relative path to the permutation stability log file
      (analysis/results/permutation_stability_log.json) if generated.
additionalProperties: false
