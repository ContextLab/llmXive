$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: >
  Schema for the statistical modeling results generated by the analysis pipeline.
  This includes coefficients, p-values (raw and FDR-corrected), and permutation test results
  from the Gaussian Linear Mixed-Effects model analysis of MMN amplitudes.
type: object
required:
  - coefficients
  - p_values
  - fdr_p_values
  - permutation_p_value
properties:
  coefficients:
    type: object
    description: >
      Dictionary mapping electrode names to their respective model coefficients.
      Each electrode entry contains a sub-dictionary of predictor names to coefficient values.
    additionalProperties:
      type: object
      additionalProperties:
        type: number
        description: The estimated coefficient value for the predictor at this electrode.
    example:
      CP3:
        Intercept: 0.523
        Accuracy: -0.012
        Learning_Phase: 0.005
      CP4:
        Intercept: 0.518
        Accuracy: -0.015
        Learning_Phase: 0.004
  p_values:
    type: object
    description: >
      Dictionary mapping electrode names to their respective raw p-values for each predictor.
      These are uncorrected p-values from the model summary.
    additionalProperties:
      type: object
      additionalProperties:
        type: number
        minimum: 0
        maximum: 1
        description: The raw p-value for the predictor at this electrode.
    example:
      CP3:
        Intercept: 0.001
        Accuracy: 0.042
        Learning_Phase: 0.150
      CP4:
        Intercept: 0.001
        Accuracy: 0.038
        Learning_Phase: 0.160
  fdr_p_values:
    type: object
    description: >
      Dictionary mapping electrode names to their respective FDR (Benjamini-Hochberg) corrected p-values.
      These values account for multiple comparisons across electrodes.
    additionalProperties:
      type: object
      additionalProperties:
        type: number
        minimum: 0
        maximum: 1
        description: The FDR-corrected p-value for the predictor at this electrode.
    example:
      CP3:
        Intercept: 0.003
        Accuracy: 0.084
        Learning_Phase: 0.300
      CP4:
        Intercept: 0.003
        Accuracy: 0.076
        Learning_Phase: 0.320
  permutation_p_value:
    type: number
    description: >
      The p-value derived from the permutation test (n=1000 shuffles).
      This validates the significance of the observed effect against a null distribution.
      A value of 0.001 indicates the observed statistic was more extreme than 999/1000 permutations.
    minimum: 0
    maximum: 1
    example: 0.012
  metadata:
    type: object
    description: Optional metadata about the model run.
    properties:
      model_formula:
        type: string
        description: The formula used for the LME model.
      n_permutations:
        type: integer
        description: Number of permutations used in the test.
      fdr_method:
        type: string
        description: Method used for FDR correction (e.g., "benjamini_hochberg").
    required:
      - model_formula
      - n_permutations
      - fdr_method
additionalProperties: false