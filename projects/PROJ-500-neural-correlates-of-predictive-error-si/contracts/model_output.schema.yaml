$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: >
  Schema for the final statistical model output (Gaussian LME) generated by T034.
  Contains coefficients, p-values, and robustness metrics.
type: object
required:
  - model_type
  - formula
  - coefficients
  - permutation_test
  - robustness_metrics
  - metadata
properties:
  model_type:
    type: string
    const: Gaussian LME
    description: Fixed string identifying the model family.
  formula:
    type: string
    description: The R-style formula used for the model (e.g., MMN ~ Accuracy + (1|Subject)).
  coefficients:
    type: object
    description: Map of fixed effect names to their statistics.
    patternProperties:
      "^[a-zA-Z_][a-zA-Z0-9_]*$":
        type: object
        required:
          - estimate
          - std_error
          - t_value
          - p_value
          - p_value_fdr
        properties:
          estimate:
            type: number
            format: float
          std_error:
            type: number
            format: float
          t_value:
            type: number
            format: float
          p_value:
            type: number
            format: float
            minimum: 0.0
            maximum: 1.0
          p_value_fdr:
            type: number
            format: float
            minimum: 0.0
            maximum: 1.0
            description: FDR-corrected p-value (Benjamini-Hochberg).
  permutation_test:
    type: object
    description: Results of the permutation test (n=1000) for significance validation.
    required:
      - n_permutations
      - p_value
      - observed_statistic
      - null_distribution_stats
    properties:
      n_permutations:
        type: integer
        minimum: 100
      p_value:
        type: number
        format: float
        minimum: 0.0
        maximum: 1.0
      observed_statistic:
        type: number
        format: float
      null_distribution_stats:
        type: object
        required:
          - mean
          - std
        properties:
          mean:
            type: number
            format: float
          std:
            type: number
            format: float
  robustness_metrics:
    type: object
    description: Sensitivity analysis results (T032).
    required:
      - time_window_sweep
    properties:
      time_window_sweep:
        type: array
        description: Results for ±10ms window variations (140-240, 160-260).
        items:
          type: object
          required:
            - window_range
            - coefficient_change_percent
          properties:
            window_range:
              type: string
              description: e.g., "140-240ms"
            coefficient_change_percent:
              type: number
              format: float
  metadata:
    type: object
    required:
      - generated_at
      - input_file
      - subjects_included
      - subjects_excluded
      - total_rows
    properties:
      generated_at:
        type: string
        format: date-time
      input_file:
        type: string
        description: Path to the aligned_data.csv used.
      subjects_included:
        type: integer
        minimum: 1
      subjects_excluded:
        type: array
        items:
          type: string
        description: List of subject IDs excluded (e.g., zero accuracy, underpowered).
      total_rows:
        type: integer
        minimum: 1
additionalProperties: false
