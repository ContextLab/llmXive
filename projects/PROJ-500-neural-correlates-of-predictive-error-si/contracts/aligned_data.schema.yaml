$schema: http://json-schema.org/draft-07/schema#
title: Aligned Data Schema
description: >
  Schema for the aligned dataset containing MMN amplitudes, behavioral accuracy,
  and metadata required for the Gaussian LME analysis (US2).
  This artifact is generated by the Lagged Alignment logic (T024/T026).
type: object
required:
  - subject_id
  - block_id
  - mmn_amplitude
  - source_window_start_trial
  - analysis_mode
properties:
  subject_id:
    type: string
    description: Unique identifier for the subject.
  block_id:
    type: integer
    description: Sequential block number within the subject's session.
  mmn_amplitude:
    type: number
    format: float
    description: >
      Mean difference wave amplitude (deviant - standard) calculated over
      the 150-250ms window at electrodes CP3, CP4, C3, C4.
    minimum: -1000.0
    maximum: 1000.0
  source_window_start_trial:
    type: integer
    description: >
      The trial index where the MMN source window (t-50 to t-10) began.
      Used to verify the lagged alignment logic.
  analysis_mode:
    type: string
    enum:
      - error_signal
      - stimulus_driven
    description: >
      The analysis mode determined by T022 (Pipeline Branching).
      'error_signal' if behavioral logs are present, 'stimulus_driven' if missing.
  block_accuracy:
    type: number
    format: float
    description: >
      Behavioral accuracy percentage for the target block (t to t+n).
      Null if analysis_mode is 'stimulus_driven' and no accuracy data exists.
    minimum: 0.0
    maximum: 100.0
  n_trials_valid:
    type: integer
    description: Number of valid trials included in the MMN calculation for this block.
    minimum: 10
  electrode_set:
    type: array
    items:
      type: string
    description: List of electrodes used for averaging (e.g., ["CP3", "CP4", "C3", "C4"]).
    minItems: 1
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the alignment was generated.
additionalProperties: false
