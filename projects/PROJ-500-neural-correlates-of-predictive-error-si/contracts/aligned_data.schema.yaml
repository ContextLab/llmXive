$schema: http://json-schema.org/draft-07/schema#
title: Aligned Data Schema
description: >
  Schema for the final aligned dataset containing MMN amplitudes aligned with
  behavioral accuracy blocks. This file is generated by the finalization pipeline (T024).
type: object
required:
  - subject_id
  - block_id
  - mmn_amplitude
  - source_window_start_trial
  - analysis_mode
properties:
  subject_id:
    type: string
    description: Unique identifier for the subject.
    minLength: 1
  block_id:
    type: integer
    description: Unique identifier for the trial block within the subject.
    minimum: 0
  mmn_amplitude:
    type: number
    description: >
      Mean difference wave amplitude (Deviant - Standard) in microvolts (µV).
      Calculated at electrodes CP3, CP4, C3, C4 within the -250ms window.
      Note: If multiple electrodes are used, this may represent a specific
      electrode's amplitude or a derived feature, depending on the specific
      analysis configuration. The column name in the CSV may be suffixed
      (e.g., mmn_amplitude_CP3) if per-electrode values are stored.
  source_window_start_trial:
    type: integer
    description: >
      The trial index where the source window for the MMN calculation began.
      Used to define the lagged relationship between the neural signal and
      the subsequent behavioral block.
    minimum: 0
  analysis_mode:
    type: string
    description: >
      The analysis mode determined during dataset validation (T003).
      Valid values: "error_signal" or "stimulus_driven".
    enum:
      - error_signal
      - stimulus_driven
  learning_phase:
    type: string
    description: >
      Categorical feature indicating the learning phase (e.g., "Early", "Late")
      derived from the block_id or cumulative trial count.
      Optional, added by T022b.
    enum:
      - Early
      - Late
      - Mid
  accuracy:
    type: number
    description: >
      Behavioral accuracy (0.0 to 1.0) for the block corresponding to the MMN signal.
      Calculated over the configurable ACCURACY_BLOCK_SIZE window.
      Optional, added by T021/T024 merge.
    minimum: 0.0
    maximum: 1.0
  electrode:
    type: string
    description: >
      The specific electrode location if multiple electrodes are stored in separate rows.
      Valid values: "CP3", "CP4", "C3", "C4".
      Optional, present if data is not aggregated.
    enum:
      - CP3
      - CP4
      - C3
      - C4
additionalProperties: false