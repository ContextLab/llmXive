$schema: http://json-schema.org/draft-07/schema#
title: Aligned Data Schema
description: >
  Schema for the final aligned dataset containing MMN amplitudes,
  behavioral accuracy, and analysis mode flags, resulting from the
  Lagged Alignment process (Plan Methodological Correction).
type: object
required:
  - subject_id
  - block_id
  - mmn_amplitude
  - accuracy
  - analysis_mode
  - source_window_start_trial
  - target_window_start_trial
properties:
  subject_id:
    type: string
    description: Unique identifier for the subject.
  block_id:
    type: integer
    description: Unique identifier for the experimental block.
  mmn_amplitude:
    type: number
    description: >
      Mean MMN amplitude (difference wave) in microvolts (µV) calculated
      over the specified time window (e.g., -250ms to 0ms relative to
      stimulus onset) at electrodes CP3, CP4, C3, C4.
  accuracy:
    type: number
    format: float
    minimum: 0.0
    maximum: 1.0
    description: >
      Behavioral accuracy (proportion correct) for the target block.
      Range [0.0, 1.0].
  analysis_mode:
    type: string
    enum:
      - error_signal
      - stimulus_driven
    description: >
      The analysis mode determined by the pipeline branching logic
      based on the availability of behavioral logs and stimulus types.
  source_window_start_trial:
    type: integer
    description: >
      The trial index where the MMN source window begins (t-50).
      Used for the lagged alignment logic.
  source_window_end_trial:
    type: integer
    description: >
      The trial index where the MMN source window ends (t-10).
  target_window_start_trial:
    type: integer
    description: >
      The trial index where the behavioral target block begins (t).
  target_window_end_trial:
    type: integer
    description: >
      The trial index where the behavioral target block ends.
  electrode:
    type: string
    description: >
      The specific electrode used for this measurement (e.g., CP3, CP4).
      If aggregated, this may be "average" or a list.
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when this record was generated.
  quality_flags:
    type: array
    items:
      type: string
    description: >
      List of quality flags for this data point (e.g., "artifact_rejected",
      "low_trial_count", "stationarity_check_passed").
additionalProperties: false
