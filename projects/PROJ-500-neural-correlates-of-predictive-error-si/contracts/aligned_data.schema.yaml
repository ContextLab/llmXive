$schema: http://json-schema.org/draft-07/schema#
title: Aligned Data Schema
description: >
  Schema for the final aligned dataset used in statistical modeling.
  This dataset combines MMN amplitudes with behavioral accuracy blocks,
  filtered for underpowered subjects and invalid blocks.
type: object
required:
  - subject_id
  - block_id
  - mmn_amplitude
  - source_window_start_trial
  - analysis_mode
properties:
  subject_id:
    type: string
    description: Unique identifier for the participant.
  block_id:
    type: integer
    description: Sequential identifier for the trial block.
  mmn_amplitude:
    type: number
    format: float
    description: >
      Mean difference wave amplitude (Deviant - Standard) calculated
      at electrodes CP3, CP4, C3, and C4 within the specified window.
      Note: In the CSV output, this column may contain values for
      specific electrodes (e.g., 'CP3_amplitude') or a single average
      depending on the final aggregation step, but the schema expects
      a numeric representation of the signal strength.
  source_window_start_trial:
    type: integer
    description: >
      The trial index where the source window (used to calculate MMN) began.
      Used for lagged alignment logic.
  analysis_mode:
    type: string
    enum:
      - error_signal
      - stimulus_driven
    description: >
      The mode determined during dataset validation (T003).
      'error_signal' if response_correctness was available.
      'stimulus_driven' if only stimulus_type was available.
  learning_phase:
    type: string
    description: >
      Categorical label for the learning phase (e.g., 'Early', 'Late')
      derived from the block_id or cumulative trial count.
    enum:
      - Early
      - Late
      - Mid
  electrode:
    type: string
    description: >
      Optional field if the dataset is not aggregated.
      Indicates which electrode (CP3, CP4, C3, C4) the mmn_amplitude refers to.
    enum:
      - CP3
      - CP4
      - C3
      - C4
  accuracy:
    type: number
    format: float
    description: >
      Behavioral accuracy percentage for the corresponding block.
      Included in the final aligned dataset for the GLMM model.
additionalProperties: false