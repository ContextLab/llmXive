$schema: http://json-schema.org/draft-07/schema#
title: Aligned Data Schema
description: |
  Schema for the final aligned dataset used in statistical modeling.
  Contains MMN amplitudes aligned with behavioral accuracy blocks via lagged alignment.
  Generated by the T026 finalization pipeline.
type: object
required:
  - subject_id
  - block_id
  - mmn_amplitude
  - source_window_start_trial
  - analysis_mode
properties:
  subject_id:
    type: string
    description: Unique identifier for the participant.
    minLength: 1
  block_id:
    type: integer
    description: Unique identifier for the 10-trial behavioral block.
    minimum: 0
  mmn_amplitude:
    type: number
    description: |
      Mean difference wave amplitude (Standard - Deviant) in the early-mid latency window
      (approx 140-240ms) averaged across CP3, CP4, C3, C4 electrodes.
      Calculated from the preceding 50-trial window.
  source_window_start_trial:
    type: integer
    description: |
      The trial index (0-based) marking the start of the 50-trial window used to calculate
      the MMN amplitude for this block.
    minimum: 0
  analysis_mode:
    type: string
    description: |
      The analysis mode determined during dataset validation (T003).
      Either "error_signal" (if response_correctness was available) or "stimulus_driven".
    enum:
      - error_signal
      - stimulus_driven
additionalProperties: false
examples:
  - subject_id: "sub-001"
    block_id: 0
    mmn_amplitude: 2.45
    source_window_start_trial: 0
    analysis_mode: "error_signal"
  - subject_id: "sub-001"
    block_id: 1
    mmn_amplitude: 2.10
    source_window_start_trial: 10
    analysis_mode: "error_signal"