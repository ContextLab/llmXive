$schema: "http://json-schema.org/draft-07/schema#"
title: Aligned Data Schema
description: Schema for the aligned MMN and behavioral data
type: object
properties:
  subject_id:
    type: string
    description: Unique identifier for the subject
  block_id:
    type: integer
    description: Block number within the experiment
  mmn_amplitude:
    type: number
    description: MMN amplitude value (mean difference wave)
  accuracy:
    type: number
    minimum: 0
    maximum: 1
    description: Behavioral accuracy for the block
  source_window_start_trial:
    type: integer
    description: Starting trial index of the MMN source window
  analysis_mode:
    type: string
    enum:
      - error_signal
      - stimulus_driven
    description: Analysis mode determined by data availability
  timestamp:
    type: string
    format: date-time
    description: Timestamp of data alignment
required:
  - subject_id
  - block_id
  - mmn_amplitude
  - accuracy
  - source_window_start_trial
  - analysis_mode
