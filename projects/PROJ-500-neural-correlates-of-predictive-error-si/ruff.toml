# Ruff configuration for llmXive neural correlates project
target-version = "py311"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "ARG001", # unused function argument (sometimes needed for interfaces)
]

[lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]  # Allow asserts in tests
"code/src/data/ingest.py" = ["S113"]  # Allow requests without timeout in controlled env

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
