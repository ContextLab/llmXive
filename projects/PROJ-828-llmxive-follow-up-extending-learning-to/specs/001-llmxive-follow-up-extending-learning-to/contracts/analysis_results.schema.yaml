$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Results Schema"
description: "Schema for the aggregated analysis results across all variants and seeds."
type: object
properties:
  experiment_id:
    type: string
    description: "Unique identifier for the full experiment."
  variants:
    type: array
    items:
      type: object
      properties:
        variant_name:
          type: string
          enum: ["opd","standard_rl","low_rank_rl","random_low_rank_rl"]
        seeds:
          type: array
          items:
            type: integer
          description: "List of seeds used."
        steps_to_80pct:
          type: array
          items:
            type: integer
          description: "Steps required to reach [deferred] accuracy for each seed."
        mean_steps:
          type: number
        std_steps:
          type: number
        final_accuracy_long:
          type: array
          items:
            type: number
          description: "Generalization accuracy on held-out long-chain test set for each seed."
        mean_final_accuracy:
          type: number
        std_final_accuracy:
          type: number
        projection_constraint_scores:
          type: array
          items:
            type: number
          description: "Mean cosine similarity with subspace per seed (diagnostic only)."
      required:
        - variant_name
        - seeds
        - steps_to_80pct
        - mean_steps
        - std_steps
  statistical_tests:
    type: object
    properties:
      comparison:
        type: string
        description: "Description of the comparison (e.g., 'Low‑Rank RL vs Standard RL')."
      test_type:
        type: string
        enum: ["wilcoxon","t-test"]
      p_value:
        type: number
      significant:
        type: boolean
        description: "True if p_value < 0.05 after correction."
    required:
      - comparison
      - test_type
      - p_value
      - significant
  power_analysis:
    type: object
    description: "A priori and post-hoc power analysis results."
    properties:
      effect_size_assumed:
        type: number
        description: "A priori assumed Cohen's d."
      sample_size:
        type: integer
        description: "Number of seeds per variant."
      power_a_priori:
        type: number
        description: "A priori power (target 0.8)."
      effect_size_observed:
        type: number
        description: "Observed Cohen's d from results."
      power_post_hoc:
        type: number
        description: "Post-hoc power based on observed effect."
    required:
      - effect_size_assumed
      - sample_size
      - power_a_priori
      - effect_size_observed
      - power_post_hoc
required:
  - experiment_id
  - variants
  - statistical_tests
  - power_analysis
additionalProperties: false