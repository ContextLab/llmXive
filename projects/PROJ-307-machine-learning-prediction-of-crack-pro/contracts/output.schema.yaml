$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Output Schema"
description: "Schema for validating model training and evaluation outputs."
type: object
required:
  - metrics
  - model_info
properties:
  metrics:
    type: object
    properties:
      r2_score:
        type: number
      rmse:
        type: number
      p_value:
        type: number
        description: "P-value from permutation test."
      permutation_statistic:
        type: number
    required:
      - r2_score
  model_info:
    type: object
    properties:
      model_type:
        type: string
      parameters:
        type: object
      training_samples:
        type: integer
      test_samples:
        type: integer
    required:
      - model_type
  plots:
    type: array
    items:
      type: string
      description: "Path to generated plot files."
additionalProperties: true
