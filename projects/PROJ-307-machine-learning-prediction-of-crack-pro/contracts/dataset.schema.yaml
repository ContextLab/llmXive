$schema: "http://json-schema.org/draft-07/schema#"
title: "Crack Propagation Dataset Schema"
description: "Schema for validating the Fatigue Crack Growth (FCG) dataset."
type: object
required:
  - properties
properties:
  da_dN:
    type: number
    description: "Crack growth rate (da/dN) in m/cycle."
    minimum: 0
  delta_K:
    type: number
    description: "Stress intensity factor range (ΔK) in MPa√m."
    minimum: 0
  composition:
    type: string
    description: "Chemical composition string (e.g., 'Al 2024-T3')."
  heat_treatment:
    type: string
    description: "Heat treatment condition (e.g., 'T3', 'T6', 'Unknown')."
  material_id:
    type: string
    description: "Unique identifier for the material sample."
  source:
    type: string
    description: "Source of the data (e.g., 'NASA', 'NIST')."
additionalProperties: true
