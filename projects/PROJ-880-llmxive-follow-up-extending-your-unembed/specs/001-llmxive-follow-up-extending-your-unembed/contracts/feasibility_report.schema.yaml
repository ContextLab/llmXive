$schema: "http://json-schema.org/draft-07/schema#"
title: "Feasibility Report"
description: "Schema for the SVD feasibility and resource check results."
type: object
required:
  - model_name
  - svd_status
  - memory_usage_mb
  - runtime_seconds
  - warning_message
properties:
  model_name:
    type: string
    description: "Name of the model analyzed."
  svd_status:
    type: string
    description: "Status of the SVD computation."
    enum:
      - "success"
      - "skipped"
      - "failed"
  memory_usage_mb:
    type: number
    description: "Peak memory usage in MB."
  runtime_seconds:
    type: number
    description: "Time taken for SVD in seconds."
  warning_message:
    type: string
    description: "Detailed warning if status is not 'success'."
  fallback_method:
    type: string
    description: "Fallback method used if primary SVD failed."
    nullable: true
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of the check."
  seed:
    type: integer
    description: "Random seed used for reproducibility."
additionalProperties: false