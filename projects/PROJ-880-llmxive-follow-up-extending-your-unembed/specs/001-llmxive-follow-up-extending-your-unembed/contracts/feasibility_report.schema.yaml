$schema: "http://json-schema.org/draft-07/schema#"
title: "Feasibility Report"
description: "Schema for the feasibility check report regarding SVD and memory constraints."
type: object
properties:
  model_name:
    type: string
  memory_usage_mb:
    type: number
    description: "Peak memory usage in MB during SVD"
  svd_time_seconds:
    type: number
    description: "Time taken for SVD in seconds"
  is_feasible:
    type: boolean
    description: "True if memory usage < 6GB and time < 1 hour"
  warning:
    type: string
    description: "Warning message if any"
required:
  - model_name
  - memory_usage_mb
  - svd_time_seconds
  - is_feasible
additionalProperties: false