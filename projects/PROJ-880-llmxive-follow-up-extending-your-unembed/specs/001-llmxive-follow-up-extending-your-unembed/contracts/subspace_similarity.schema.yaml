$schema: "http://json-schema.org/draft-07/schema#"
title: "Subspace Similarity Report"
description: "Schema for the cosine similarity results between model edge spectrum subspaces."
type: object
required:
  - model_pair
  - cosine_similarity
  - k
  - method
properties:
  model_pair:
    type: string
    description: "Identifier for the pair of models compared (e.g., 'Llama3-BLOOM')."
  cosine_similarity:
    type: number
    description: "The computed cosine similarity between the two subspace bases."
    minimum: -1.0
    maximum: 1.0
  k:
    type: integer
    description: "The number of top singular vectors used (subspace dimension)."
    minimum: 1
  method:
    type: string
    description: "The method used for alignment (e.g., 'procrustes', 'direct')."
    enum:
      - "procrustes"
      - "direct"
      - "canonical"
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of when the computation was performed."
  seed:
    type: integer
    description: "Random seed used for reproducibility."
additionalProperties: false
