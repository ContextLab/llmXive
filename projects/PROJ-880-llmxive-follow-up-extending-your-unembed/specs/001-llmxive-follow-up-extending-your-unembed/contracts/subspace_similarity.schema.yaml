$schema: "http://json-schema.org/draft-07/schema#"
title: "Subspace Similarity Report"
description: "Schema for the cosine similarity matrix between edge spectrum subspaces of different models."
type: object
properties:
  models:
    type: array
    items:
      type: string
      description: "List of model names (e.g., 'llama-3', 'bloom')"
  similarities:
    type: array
    items:
      type: object
      properties:
        model_a:
          type: string
        model_b:
          type: string
        cosine_similarity:
          type: number
          description: "Cosine similarity between top-k subspaces"
        language_pair:
          type: string
          description: "e.g., 'EN-FR', 'EN-EN'"
      required:
        - model_a
        - model_b
        - cosine_similarity
        - language_pair
  timestamp:
    type: string
    format: date-time
  k_value:
    type: integer
    description: "Number of singular vectors used"
required:
  - models
  - similarities
  - k_value
additionalProperties: false
