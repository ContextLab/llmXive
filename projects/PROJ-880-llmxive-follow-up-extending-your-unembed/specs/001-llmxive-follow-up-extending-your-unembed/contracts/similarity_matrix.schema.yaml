$schema: "http://json-schema.org/draft-07/schema#"
title: Similarity Matrix Schema
type: object
required:
  - model_pairs
  - similarity_scores
  - bootstrap_ci
  - generated_at
properties:
  model_pairs:
    type: array
    items:
      type: string
  similarity_scores:
    type: array
    items:
      type: number
      minimum: -1
      maximum: 1
  bootstrap_ci:
    type: array
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
  generated_at:
    type: string
    format: date-time
