$schema: "http://json-schema.org/draft-07/schema#"
title: Similarity Matrix Schema
type: object
required:
  - model_pairs
  - similarity_matrix
  - ci_lower
  - ci_upper
properties:
  model_pairs:
    type: array
    description: "List of model‑pair identifiers (e.g., ['llama3‑mistral'])."
    items:
      type: string
  similarity_matrix:
    type: array
    description: "2‑D array of cosine similarity scores (row = model pair, column = language pair)."
    items:
      type: array
      items:
        type: number
        minimum: -1
        maximum: 1
  ci_lower:
    type: array
    description: "Lower bound of the bootstrap confidence interval (CI) for each entry."
    items:
      type: array
      items:
        type: number
        minimum: -1
        maximum: 1
  ci_upper:
    type: array
    description: "Upper bound of the bootstrap confidence interval at a conventional confidence level for each entry."
    items:
      type: array
      items:
        type: number
        minimum: -1
        maximum: 1
  checksum:
    type: string
  generated_at:
    type: string
    format: date-time
additionalProperties: false