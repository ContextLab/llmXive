$schema: "http://json-schema.org/draft-07/schema#"
title: "Similarity Metric"
description: "Schema for subspace similarity metrics"
type: object
required:
  - subspace_a_id
  - subspace_b_id
  - cosine_similarity
  - method
properties:
  subspace_a_id:
    type: string
    description: "Identifier of the first subspace"
  subspace_b_id:
    type: string
    description: "Identifier of the second subspace"
  cosine_similarity:
    type: number
    description: "Cosine similarity between subspaces"
    minimum: a negative value
    maximum: (to be defined during implementation)
  method:
    type: string
    description: "Method used for similarity calculation (e.g., 'mean_cosine', 'procrustes')"
  language_pair:
    type: array
    description: "Languages involved in the comparison"
    items:
      type: string
  timestamp:
    type: string
    format: date-time
    description: "Timestamp of the computation"
  alignment_method:
    type: string
    description: "Method used for alignment (e.g., 'procrustes_shared_vocab')"
  intersection_size:
    type: integer
    description: "Size of the shared vocabulary intersection used for calculation"
  normalized_by_intersection:
    type: boolean
    description: "Whether the metric was normalized by the intersection size"
additionalProperties: false