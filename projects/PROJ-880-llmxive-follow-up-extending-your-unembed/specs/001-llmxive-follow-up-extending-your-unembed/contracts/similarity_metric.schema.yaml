$schema: "http://json-schema.org/draft-07/schema#"
title: Similarity Metric Schema
type: object
required:
  - model_pair
  - similarity
  - ci_95
properties:
  model_pair:
    type: string
    description: "Identifier of the model pair (e.g., 'llama3‑bloom')."
  similarity:
    type: number
    minimum: -1
    maximum: 1
    description: "Cosine similarity between edge‑spectrum bases."
  ci_95:
    type: object
    required:
      - lower
      - upper
    properties:
      lower:
        type: number
        minimum: -1
        maximum: 1
      upper:
        type: number
        minimum: -1
        maximum: 1
    description: "A bootstrap confidence interval at a conventional confidence level."
  adjusted_similarity:
    type: number
    description: "Similarity after control‑analysis adjustment (paired‑architecture)."
  checksum:
    type: string
  generated_at:
    type: string
    format: date-time
additionalProperties: false