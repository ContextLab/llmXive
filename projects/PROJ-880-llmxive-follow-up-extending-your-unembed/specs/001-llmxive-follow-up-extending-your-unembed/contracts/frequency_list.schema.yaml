$schema: "http://json-schema.org/draft-07/schema#"
title: Frequency List Schema
type: object
required:
  - language
  - token_counts
  - total_tokens
  - generated_at
properties:
  language:
    type: string
    description: "ISO‑639‑1 language code."
  token_counts:
    type: object
    description: "Mapping from token ID (as string) to integer count."
    additionalProperties:
      type: integer
      minimum: 0
  total_tokens:
    type: integer
    minimum: 0
    description: "Sum of all token counts (should be ≥ 1,000,000)."
  generated_at:
    type: string
    format: date-time
    description: "UTC timestamp of generation."
