$schema: "http://json-schema.org/draft-07/schema#"
title: Frequency List Schema
type: object
required:
  - language
  - vocab_size
  - frequencies
properties:
  language:
    type: string
    description: "ISO 639‑1 language code (e.g., 'en', 'fr')."
  vocab_size:
    type: integer
    description: "Size of the shared subword vocabulary."
    minimum: 1
  frequencies:
    type: array
    description: "Normalized token frequency vector (length = vocab_size). Sum is approximately at the expected magnitude."
    items:
      type: number
      minimum: 0
  token_count:
    type: integer
    description: "Total number of tokens counted (must be ≥ 1 000 000)."
    minimum: 1000000
  checksum:
    type: string
  generated_at:
    type: string
    format: date-time
additionalProperties: false