$schema: "http://json-schema.org/draft-07/schema#"
title: "Frequency List Schema"
type: object
required:
  - "language"
  - "token_counts"
  - "total_tokens"
  - "generated_at"
properties:
  language:
    type: string
  token_counts:
    type: object
    description: "Mapping from token ID to integer count."
    additionalProperties:
      type: integer
      minimum: 0
  total_tokens:
    type: integer
    minimum: 1000000
  generated_at:
    type: string
    format: date-time
