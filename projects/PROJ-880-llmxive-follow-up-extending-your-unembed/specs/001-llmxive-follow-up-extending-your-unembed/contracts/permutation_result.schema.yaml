$schema: "http://json-schema.org/draft-07/schema#"
title: "Permutation Result Schema"
description: "Schema for the label permutation bootstrap resampling test results."
type: "object"
required:
  - "observed_similarity"
  - "null_distribution"
  - "p_value"
  - "metadata"
properties:
  observed_similarity:
    type: "number"
    description: "The observed cosine similarity between the two aligned subspaces."
  null_distribution:
    type: "array"
    description: "List of similarity scores from label-permuted frequency vectors."
    items:
      type: "number"
  p_value:
    type: "number"
    description: "Proportion of null distribution >= observed similarity."
    minimum: 0.0
    maximum: 1.0
  metadata:
    type: "object"
    required:
      - "iterations"
      - "seed"
      - "method"
    properties:
      iterations:
        type: "integer"
        description: "Number of bootstrap iterations performed."
      seed:
        type: "integer"
      method:
        type: "string"
        enum: ["label_permutation"]
        description: "Method used for null distribution generation."
      significant:
        type: "boolean"
        description: "True if p_value < 0.05."