$schema: "http://json-schema.org/draft-07/schema#"
title: "Edge Spectrum Similarity Report"
description: "JSON report summarizing all pairwise subspace cosine similarities, token attribution summaries, validation correlations, and permutation test result for the cross‑lingual study."
type: object
required:
  - generated_at
  - seed
  - subspace_similarity
  - token_attribution
  - validation
  - permutation_test
properties:
  generated_at:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp when the report was generated."
  seed:
    type: integer
    description: "Random seed used for all stochastic components."
  subspace_similarity:
    type: array
    description: "Pairwise cosine similarities between edge‑spectrum bases."
    items:
      type: object
      required: [model_a, model_b, cosine_similarity]
      properties:
        model_a:
          type: string
          enum: [llama3, mistral, bloom]
        model_b:
          type: string
          enum: [llama3, mistral, bloom]
        cosine_similarity:
          type: number
          minimum: -1.0
          maximum: 1.0
          description: "Cosine similarity of the two subspace bases (averaged over top‑k vectors)."
  token_attribution:
    type: array
    description: "Top‑N tokens with highest absolute logit weight in each model's edge spectrum."
    items:
      type: object
      required: [model, tokens]
      properties:
        model:
          type: string
          enum: [llama3, mistral, bloom]
        tokens:
          type: array
          description: "List of token entries sorted by absolute weight (descending)."
          items:
            type: object
            required: [token_id, token_str, weight]
            properties:
              token_id:
                type: integer
                description: "Token ID in the model's vocabulary."
              token_str:
                type: string
                description: "Human‑readable token string."
              weight:
                type: number
                description: "Absolute logit weight of the token within the edge spectrum."
  validation:
    type: object
    description: "Correlation results with external typological and benchmark data."
    required: [wals_correlation, senteval_correlation]
    properties:
      wals_correlation:
        type: number
        description: "Pearson r between subspace shift vector and WALS feature differences."
      senteval_correlation:
        type: number
        description: "Pearson r between subspace shift vector and SentEval STS performance drop."
  permutation_test:
    type: object
    description: "Statistical significance of the observed cross‑lingual shift."
    required: [p_value, null_mean, null_std, iterations]
    properties:
      p_value:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Two‑tailed p‑value (≥ 4 decimal places)."
      null_mean:
        type: number
        description: "Mean cosine similarity of the within‑language null distribution."
      null_std:
        type: number
        description: "Standard deviation of the null distribution."
      iterations:
        type: integer
        minimum: 1000
        description: "Number of permutation iterations performed."
