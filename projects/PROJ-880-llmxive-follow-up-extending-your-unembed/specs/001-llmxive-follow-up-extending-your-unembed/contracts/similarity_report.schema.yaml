$schema: "http://json-schema.org/draft-07/schema#"
title: "Similarity Report Schema"
description: "Schema for the geometric similarity report between model subspaces."
type: "object"
required:
  - "model_pairs"
  - "metadata"
properties:
  model_pairs:
    type: "array"
    description: "List of similarity metrics between model pairs."
    items:
      type: "object"
      required:
        - "model_a"
        - "model_b"
        - "cosine_similarity"
      properties:
        model_a:
          type: "string"
          description: "Identifier of the first model (e.g., 'Llama-3-EN')."
        model_b:
          type: "string"
          description: "Identifier of the second model (e.g., 'BLOOM-Multilingual')."
        cosine_similarity:
          type: "number"
          description: "Average cosine similarity between the top-k singular vectors after alignment."
          minimum: -1.0
          maximum: 1.0
        alignment_method:
          type: "string"
          description: "Method used for alignment (e.g., 'procrustes')."
        confidence_interval:
          type: "array"
          description: "95% confidence interval [lower, upper]."
          items:
            type: "number"
          minItems: 2
          maxItems: 2
  metadata:
    type: "object"
    required:
      - "k"
      - "timestamp"
    properties:
      k:
        type: "integer"
        description: "Number of singular vectors used (top-k)."
      timestamp:
        type: "string"
        description: "ISO 8601 timestamp of the run."
      seed:
        type: "integer"
        description: "Random seed used for reproducibility."