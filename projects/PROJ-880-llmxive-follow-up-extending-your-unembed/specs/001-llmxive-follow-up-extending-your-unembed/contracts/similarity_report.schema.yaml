$schema: "http://json-schema.org/draft-07/schema#"
title: Similarity Report Schema
type: object
required:
  - report_version
  - similarity_metrics
  - control_adjustments
properties:
  report_version:
    type: string
    description: "Semantic version of the report format."
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  similarity_metrics:
    type: array
    description: "List of similarity_metric objects for each model pair."
    items:
      $ref: "similarity_metric.schema.yaml"
  control_adjustments:
    type: array
    description: "Adjusted similarity entries derived from paired‑architecture analyses."
    items:
      $ref: "similarity_metric.schema.yaml"
  overall_findings:
    type: string
    description: "Narrative summary generated by the pipeline (e.g., 'Edge spectrum similarity is significantly lower across languages (statistically significant).')."
  checksum:
    type: string
  generated_at:
    type: string
    format: date-time
additionalProperties: false