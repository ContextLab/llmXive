$schema: "http://json-schema.org/draft-07/schema#"
title: Similarity Report Schema
type: object
required:
  - report_version
  - similarity_metrics
properties:
  report_version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  similarity_metrics:
    type: array
    items:
      type: object
      properties:
        model_pair: { type: string }
        similarity: { type: number }
        ci: { type: array, items: { type: number } }
  overall_findings:
    type: string
  generated_at:
    type: string
    format: date-time
