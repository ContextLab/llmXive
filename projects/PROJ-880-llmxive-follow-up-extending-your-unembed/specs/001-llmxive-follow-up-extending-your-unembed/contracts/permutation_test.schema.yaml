$schema: "http://json-schema.org/draft-07/schema#"
title: "Permutation Test Results"
description: "Schema for the results of the permutation test for statistical significance of subspace shift."
type: object
properties:
  observed_similarity:
    type: number
    description: "Cosine similarity between observed cross-lingual subspaces"
  null_distribution:
    type: array
    items:
      type: number
    description: "Similarities from permutation test (N=1000)"
  p_value:
    type: number
    minimum: 0
    maximum: 1
    description: "Probability of observing <= observed similarity under H0"
  iterations:
    type: integer
    description: "Number of permutations performed"
  significance_flag:
    type: boolean
    description: "True if p_value < 0.05"
required:
  - observed_similarity
  - null_distribution
  - p_value
  - iterations
  - significance_flag
additionalProperties: false