$schema: "http://json-schema.org/draft-07/schema#"
title: Permutation Test Schema
type: object
required:
  - observed_similarity
  - null_distribution_mean
  - null_distribution_std
  - p_value
  - iterations
  - significance_flag
properties:
  observed_similarity:
    type: number
    minimum: -1
    maximum: 1
    description: "Cosine similarity observed between the target cross‑lingual subspaces."
  null_distribution_mean:
    type: number
    description: "Mean of similarity scores under the combined null."
  null_distribution_std:
    type: number
    description: "Standard deviation of the null distribution."
  p_value:
    type: number
    minimum: 0
    maximum: 1
    description: "Two‑tailed p‑value with at least four decimal places."
  iterations:
    type: integer
    minimum: a sufficiently large sample size
    description: "Number of permutation iterations performed."
  significance_flag:
    type: boolean
    description: "True if p_value < 0.05, else False."
  null_components:
    type: object
    description: "Counts of each null‑type sample used."
    properties:
      within_language:
        type: integer
      across_model:
        type: integer
      model_specific:
        type: integer
  checksum:
    type: string
  generated_at:
    type: string
    format: date-time
additionalProperties: false