$schema: "http://json-schema.org/draft-07/schema#"
title: Edge Spectrum Schema
type: object
required:
  - model_name
  - top_k
  - edge_vectors
  - model_pairs
  - similarity_matrix
properties:
  model_name:
    type: string
    description: "Identifier of the model (e.g., 'llama3', 'mistral', 'bloom')."
  top_k:
    type: integer
    minimum: 1
    description: "Number of singular vectors retained (e.g., an appropriate number determined by the desired level of variance captured)."
  edge_vectors:
    type: array
    description: "List of top_k vectors, each vector is an array of floats (dimension = hidden size)."
    items:
      type: array
      items:
        type: number
        format: float
  model_pairs:
    type: array
    description: "List of model‑pair identifiers (e.g., ['llama3‑mistral', 'llama3‑bloom'])."
    items:
      type: string
  similarity_matrix:
    type: array
    description: "2‑D array of cosine similarity scores (row = model pair, column = language pair) for the edge‑spectrum subspaces."
    items:
      type: array
      items:
        type: number
        minimum: -1
        maximum: 1
  checksum:
    type: string
    description: "SHA‑256 checksum of the JSON file for versioning."
  generated_at:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp of artifact creation."
additionalProperties: false