$schema: "http://json-schema.org/draft-07/schema#"
title: Edge Spectrum Similarity Report
type: object
required:
  - model_pairs
  - similarity_matrix
properties:
  model_pairs:
    type: array
    description: "List of model name pairs (e.g., ['llama3', 'bloom'])."
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: string
  similarity_matrix:
    type: object
    description: "Mapping from model‑pair string to an object with cosine similarity and 95 % bootstrap CI."
    patternProperties:
      "^[a-z0-9_]+-[a-z0-9_]+$":
        type: object
        required:
          - cosine_similarity
          - ci_lower
          - ci_upper
        properties:
          cosine_similarity:
            type: number
            minimum: -1.0
            maximum: 1.0
          ci_lower:
            type: number
            minimum: -1.0
            maximum: 1.0
          ci_upper:
            type: number
            minimum: -1.0
            maximum: 1.0
    additionalProperties: false