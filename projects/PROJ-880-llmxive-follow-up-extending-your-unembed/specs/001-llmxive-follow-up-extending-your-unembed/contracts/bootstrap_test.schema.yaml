$schema: "http://json-schema.org/draft-07/schema#"
title: "Bootstrap Test Report"
description: "Schema for the statistical significance test results (p-value, null distribution)."
type: object
required:
  - observed_similarity
  - null_mean
  - null_std
  - p_value
  - iterations
  - significant
properties:
  observed_similarity:
    type: number
    description: "The observed cosine similarity between the real model subspaces."
    minimum: -1.0
    maximum: 1.0
  null_mean:
    type: number
    description: "The mean of the null distribution (random orthogonal bases)."
  null_std:
    type: number
    description: "Standard deviation of the null distribution."
  p_value:
    type: number
    description: "The calculated p-value from the bootstrap test."
    minimum: 0.0
    maximum: 1.0
  iterations:
    type: integer
    description: "Number of bootstrap iterations performed."
    minimum: 1
  significant:
    type: boolean
    description: "True if p_value < 0.05 (or adjusted threshold)."
  threshold:
    type: number
    description: "The significance threshold used (e.g., 0.05)."
  seed:
    type: integer
    description: "Random seed used for reproducibility."
additionalProperties: false