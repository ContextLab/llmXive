$schema: "http://json-schema.org/draft-07/schema#"
title: Similarity Report
description: "Schema for similarity_matrix.json output (US1)"
type: object
required:
  - summary
  - pairs
properties:
  summary:
    type: object
    required:
      - mean_similarity
      - std_dev
    properties:
      mean_similarity:
        type: number
      std_dev:
        type: number
  pairs:
    type: array
    items:
      type: object
      required:
        - model_a
        - model_b
        - cosine_similarity
      properties:
        model_a:
          type: string
        model_b:
          type: string
        cosine_similarity:
          type: number
additionalProperties: false
