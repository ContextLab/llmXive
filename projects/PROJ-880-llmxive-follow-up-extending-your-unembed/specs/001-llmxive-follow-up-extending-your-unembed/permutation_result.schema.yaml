$schema: "http://json-schema.org/draft-07/schema#"
title: Permutation Result
description: "Schema for permutation_result.json output (US3)"
type: object
required:
  - observed_similarity
  - null_distribution
  - p_value
  - significant
properties:
  observed_similarity:
    type: number
    description: "The similarity score observed between the actual model subspaces."
  null_distribution:
    type: array
    items:
      type: number
    description: "List of similarity scores generated from random orthogonal bases (T026)."
  p_value:
    type: number
    minimum: 0
    maximum: 1
  significant:
    type: boolean
    description: "Whether the observed shift is statistically significant (p < alpha)."
additionalProperties: false
