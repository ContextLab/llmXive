$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: >
  Schema defining the structure of the regression model output,
  including coefficients, diagnostics, and interpretation.
type: object
required:
  - coefficients
  - p_values
  - vif_scores
  - diagnostics
  - interpretation
properties:
  coefficients:
    type: object
    description: Map of predictor names to their estimated beta coefficients.
    additionalProperties:
      type: number
    example:
      intercept: 0.5
      switching_index: -0.12
      age: 0.03
      total_screen_time: -0.05
      switching_index_x_age: -0.02
  p_values:
    type: object
    description: Map of predictor names to their raw p-values.
    additionalProperties:
      type: number
      minimum: 0
      maximum: 1
    example:
      switching_index: 0.04
      age: 0.01
      total_screen_time: 0.15
      switching_index_x_age: 0.08
  vif_scores:
    type: object
    description: Variance Inflation Factor for each predictor to detect multicollinearity.
    additionalProperties:
      type: number
      minimum: 1.0
    example:
      switching_index: 1.2
      age: 1.5
      total_screen_time: 1.1
      switching_index_x_age: 1.8
  diagnostics:
    type: object
    description: Additional model diagnostics and statistical tests.
    required:
      - r_squared
      - adj_r_squared
      - f_statistic
      - f_p_value
      - correlation_matrix
      - n_observations
    properties:
      r_squared:
        type: number
        minimum: 0
        maximum: 1
      adj_r_squared:
        type: number
        minimum: 0
        maximum: 1
      f_statistic:
        type: number
      f_p_value:
        type: number
        minimum: 0
        maximum: 1
      correlation_matrix:
        type: object
        description: >
          Nested object representing the correlation matrix of predictors.
          Keys are variable names, values are objects mapping variable names to correlation coefficients.
        additionalProperties:
          type: object
          additionalProperties:
            type: number
            minimum: -1
            maximum: 1
        example:
          switching_index:
            switching_index: 1.0
            age: 0.12
            total_screen_time: 0.75
            switching_index_x_age: 0.15
          age:
            switching_index: 0.12
            age: 1.0
            total_screen_time: 0.05
            switching_index_x_age: 0.10
          total_screen_time:
            switching_index: 0.75
            age: 0.05
            total_screen_time: 1.0
            switching_index_x_age: 0.70
          switching_index_x_age:
            switching_index: 0.15
            age: 0.10
            total_screen_time: 0.70
            switching_index_x_age: 1.0
      n_observations:
        type: integer
        minimum: 1
      collinearity_warning:
        type: string
        description: Optional warning message if collinearity thresholds are exceeded.
        nullable: true
      fdr_corrected_p_values:
        type: object
        description: Benjamini-Hochberg corrected p-values for sensitivity analyses.
        additionalProperties:
          type: number
          minimum: 0
          maximum: 1
        example:
          switching_index: 0.06
          age: 0.02
  interpretation:
    type: string
    description: >
      Natural language summary of the results.
      Must strictly avoid causal language (e.g., "causes", "leads to", "impacts").
      Use associational terms only (e.g., "associated with", "correlated with").
    minLength: 1
    examples:
      - "Higher switching frequency is associated with lower cognitive flexibility scores, controlling for age and screen time."
      - "No significant association was found between total screen time and cognitive flexibility."
additionalProperties: false