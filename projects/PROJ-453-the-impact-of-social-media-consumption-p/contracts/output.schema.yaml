# Output Schema Contract for Model Results
# Defines the structure of the JSON reports generated by the analysis.

required_keys:
  - coefficients
  - p_values
  - r_squared
  - diagnostics

diagnostics:
  required_keys:
    - vif_scores
    - correlation_matrix
    - correlation_flag

types:
  coefficients: dict
  p_values: dict
  r_squared: float
  diagnostics: dict
  vif_scores: dict
  correlation_matrix: list
  correlation_flag: bool
