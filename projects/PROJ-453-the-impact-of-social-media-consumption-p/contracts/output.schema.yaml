# Schema for the model output and analysis results.
# This defines the structure of the JSON reports generated by the analysis pipeline.
schema_name: "social_media_cognitive_flexibility_output"
version: "1.0"
description: "Defines the expected structure for model results and diagnostics."

top_level_fields:
  - name: coefficients
    type: dict
    description: "Map of predictor names to beta coefficients"
  - name: p_values
    type: dict
    description: "Map of predictor names to p-values"
  - name: r_squared
    type: float
    description: "R-squared value of the model"
  - name: vif_scores
    type: dict
    description: "Variance Inflation Factor scores for each predictor"
  - name: diagnostics
    type: dict
    description: "Additional diagnostic metrics"
    properties:
      correlation_matrix:
        type: dict
        description: "Correlation matrix between predictors"
      correlation_flag:
        type: boolean
        description: "True if correlation > 0.7 detected (mathematical coupling risk)"
      fdr_corrected_p_values:
        type: dict
        description: "Benjamini-Hochberg corrected p-values"
  - name: interpretation
    type: string
    description: "Associational text summary (causal language forbidden)"
  - name: robustness_status
    type: string
    description: "PASS or FAIL based on SC-003 sensitivity analysis"

validation_rules:
  - rule: "No causal language in 'interpretation'"
    forbidden_terms: ["causes", "leads to", "impacts", "determines", "results in"]
  - rule: "VIF scores must be present for all predictors"
  - rule: "Diagnostics must include correlation matrix and flag"

notes: |
  This schema is validated by T027 and T039 to ensure the final report
  meets the project's scientific and structural requirements.