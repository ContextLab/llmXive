It looks like the file is corrupted. Below is a clean, valid schema that includes the missing `residual_first_arrival` field and removes all stray characters.

```yaml
$schema: "http://json-schema.org/draft-07/schema#"
title: "GridCellObservation"
description: "Canonical schema for the processed spatiotemporal grid cell data used in migration modeling. All pipeline outputs must conform to this structure."
type: "object"
required:
  - "grid_cell_id"
  - "year"
  - "week_number"
  - "total_obs_count"
  - "cumulative_count"
  - "first_arrival_week"
  - "data_quality_flag"
  - "threshold_used"
  - "effort_covariate"
properties:
  grid_cell_id:
    type: "string"
    description: "Unique identifier for the 0.5° grid cell (e.g., '45.5_-122.5')."
  year:
    type: "integer"
    minimum: 2015
    maximum: 2023
    description: "Calendar year."
  week_number:
    type: "integer"
    minimum: 1
    maximum: 52
    description: "ISO week number."
  total_obs_count:
    type: "integer"
    minimum: 0
    description: "Total Redstart observations in this cell/week."
  cumulative_count:
    type: "integer"
    minimum: 0
    description: "Running total of observations for the season up to this week."
  first_arrival_week:
    type:
      - "integer"
      - "null"
    description: "Week where cumulative count first reaches the threshold (k). Null if threshold not met."
  data_quality_flag:
    type: "string"
    enum:
      - "valid"
      - "missing_env"
      - "insufficient_data"
      - "low_effort"
      - "undetermined"
    description: "Flag indicating data quality or processing outcome."
  threshold_used:
    type: "integer"
    enum:
      - 3
      - 5
      - 10
    description: "Cumulative‑count threshold used to define first arrival."
  effort_covariate:
    type: "integer"
    description: "Total number of complete checklists contributing to this cell/week."
  residual_first_arrival:
    type:
      - "number"
      - "null"
    description: "Residual of the first arrival week after accounting for spatial random effects."
additionalProperties: false
```

This schema now validates the `first_arrival_sweep.csv` produced by the pipeline and matches the documentation in `plan.md` and `research.md`.
