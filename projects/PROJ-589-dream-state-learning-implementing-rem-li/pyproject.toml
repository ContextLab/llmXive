[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-state-learning"
version = "0.1.0"
description = "Implementing REM-like Consolidation in Language Models"
requires-python = ">=3.8"
dependencies = [
    "torch==2.0.0",
    "transformers==4.30.0",
    "datasets==2.12.0",
    "scikit-learn==1.2.2",
    "accelerate==0.20.0",
    "pytest==7.3.1",
    "scipy==1.10.1",
    "numpy==1.24.3"
]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
