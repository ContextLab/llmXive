$schema: http://json-schema.org/draft-07/schema#
title: Evaluation Result Schema
description: Schema for validating the output of evaluation runs in Dream-State Learning experiments.
type: object
required:
  - experiment_id
  - dataset_name
  - metrics
  - timestamp
properties:
  experiment_id:
    type: string
    description: Unique identifier linking to the training configuration.
  dataset_name:
    type: string
    description: Name of the dataset evaluated.
  model_name:
    type: string
    description: Model identifier used for evaluation.
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when evaluation was completed.
  metrics:
    type: object
    required:
      - accuracy
      - loss
    properties:
      accuracy:
        type: number
        minimum: 0
        maximum: 1
        description: Overall accuracy on the test set.
      loss:
        type: number
        minimum: 0
        description: Final loss value on the test set.
      f1_score:
        type: number
        minimum: 0
        maximum: 1
        description: F1 score (macro average).
      precision:
        type: number
        minimum: 0
        maximum: 1
        description: Precision score.
      recall:
        type: number
        minimum: 0
        maximum: 1
        description: Recall score.
      dream_phase_accuracy:
        type: number
        minimum: 0
        maximum: 1
        description: Accuracy specifically on dream-phase generated samples.
      wake_phase_accuracy:
        type: number
        minimum: 0
        maximum: 1
        description: Accuracy specifically on wake-phase real data samples.
  hyperparameters_snapshot:
    type: object
    description: Snapshot of hyperparameters used during training.
  resource_usage:
    type: object
    properties:
      peak_memory_gb:
        type: number
        minimum: 0
        description: Peak memory usage in GB.
      total_time_seconds:
        type: number
        minimum: 0
        description: Total wall-clock time in seconds.
      total_tokens_processed:
        type: integer
        minimum: 0
        description: Total number of tokens processed.
  statistical_comparison:
    type: object
    description: Results of statistical comparison with baseline (if applicable).
    properties:
      baseline_accuracy:
        type: number
        minimum: 0
        maximum: 1
      accuracy_difference:
        type: number
      wilcoxon_p_value:
        type: number
        minimum: 0
        maximum: 1
      significant_at_alpha_005:
        type: boolean
