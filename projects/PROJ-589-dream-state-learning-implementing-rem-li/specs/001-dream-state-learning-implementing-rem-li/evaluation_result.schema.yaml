$schema: http://json-schema.org/draft-07/schema#
title: Evaluation Result Schema
type: object
properties:
  model_name:
    type: string
  accuracy:
    type: number
    minimum: 0
    maximum: 1
  loss:
    type: number
  steps:
    type: integer
    minimum: 0
  phase:
    type: string
    enum: ["wake", "dream", "final"]
required:
  - model_name
  - accuracy
  - loss
  - steps