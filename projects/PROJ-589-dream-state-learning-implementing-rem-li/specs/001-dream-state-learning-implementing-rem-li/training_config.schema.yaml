$schema: http://json-schema.org/draft-07/schema#
title: Training Configuration Schema
type: object
properties:
  learning_rate:
    type: number
    minimum: 0
  dream_warmup_steps:
    type: integer
    minimum: 0
  dream_ratio:
    type: integer
    minimum: 1
  dae_mask_rate:
    type: number
    minimum: 0
    maximum: 1
  memory_limit_kb:
    type: integer
    minimum: 1024
  checkpoint_dir:
    type: string
  enable_entropy_check:
    type: boolean
  min_entropy_threshold:
    type: number
    minimum: 0
required:
  - learning_rate
  - dream_warmup_steps
  - dream_ratio
  - memory_limit_kb
