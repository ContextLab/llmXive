$schema: "http://json-schema.org/draft-07/schema#"
title: "Dream Pseudo‑Sample"
description: "Synthetic sample generated during a dream step, together with masking and quality metrics."
type: "object"
properties:
  original_id:
    type: "string"
    description: "ID of the source sample used for generation."
  generated_tokens:
    type: "array"
    items:
      type: "string"
    description: "Token strings produced by the model."
  masked_input:
    type: "string"
    description: "Masked version of generated tokens (input to the DAE)."
  target_original:
    type: "string"
    description: "Original ground‑truth text serving as reconstruction target."
  entropy_score:
    type: "number"
    description: "Average entropy (bits per token) of the generated sequence."
  perplexity_score:
    type: "number"
    description: "Perplexity of the generated sequence against a held‑out corpus."
required:
  - "original_id"
  - "generated_tokens"
  - "masked_input"
  - "target_original"
  - "entropy_score"
  - "perplexity_score"
additionalProperties: false