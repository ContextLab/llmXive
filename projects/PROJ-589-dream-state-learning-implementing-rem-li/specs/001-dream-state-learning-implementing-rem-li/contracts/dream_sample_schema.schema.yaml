$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  original_id:
    type: string
    description: "ID of the source sample used for generation"
  generated_tokens:
    type: array
    items:
      type: string
    description: "Tokens generated by the model"
  masked_input:
    type: string
    description: "The masked version of the generated tokens (input for DAE)"
  target_original:
    type: string
    description: "The original input text (target for reconstruction)"
  entropy_score:
    type: number
    description: "Average entropy of the generated tokens (bits per token)"
  perplexity_score:
    type: number
    description: "Perplexity of generated sample against held-out corpus"
required:
  - original_id
  - generated_tokens
  - masked_input
  - target_original
  - entropy_score
  - perplexity_score
additionalProperties: false
