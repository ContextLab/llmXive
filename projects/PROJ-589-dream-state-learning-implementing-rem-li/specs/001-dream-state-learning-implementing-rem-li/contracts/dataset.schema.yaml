$schema: "http://json-schema.org/draft-07/schema#"
title: "GLUE Dataset Record"
description: "Raw record from the GLUE suite used for wake‑phase training or evaluation."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the sample."
  text:
    type: "string"
    description: "Input text (e.g., premise + hypothesis)."
  label:
    type: "integer"
    description: "Ground‑truth label."
  split:
    type: "string"
    enum: ["train", "validation", "test"]
    description: "Dataset split."
required:
  - "id"
  - "text"
  - "label"
  - "split"
additionalProperties: false