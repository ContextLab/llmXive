$schema: "http://json-schema.org/draft-07/schema#"
title: "GLUE Dataset Schema"
description: "Schema for the GLUE/SuperGLUE dataset used in Wake/Dream training."
type: "object"
properties:
  text:
    type: "string"
    description: "The input text sequence (e.g., premise, hypothesis)."
  label:
    type: "integer"
    description: "The target label (e.g., 0 for contradiction, 1 for entailment)."
  source:
    type: "string"
    description: "The dataset source (e.g., 'glue_mrpc', 'super_glue_axb')."
required:
  - "text"
  - "label"
  - "source"
additionalProperties: false