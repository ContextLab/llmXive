$schema: "http://json-schema.org/draft-07/schema#"
title: "Training Result Schema"
description: "Schema for aggregated training results (accuracy, memory, time)."
type: "object"
properties:
  run_id:
    type: "string"
    description: "Unique identifier for the training run."
  seed:
    type: "integer"
    description: "Random seed used for reproducibility."
  mode:
    type: "string"
    enum:
      - "wake_dream"
      - "baseline"
      - "sweep"
    description: "The training mode executed."
  task:
    type: "string"
    description: "The evaluation task (e.g., 'mrpc', 'axb')."
  accuracy:
    type: "number"
    description: "Accuracy score on the held-out few-shot task."
    minimum: 0.0
    maximum: 1.0
  peak_memory_gb:
    type: "number"
    description: "Peak RSS memory usage in GB."
    minimum: 0.0
  wall_clock_seconds:
    type: "number"
    description: "Total execution time in seconds."
    minimum: 0.0
  status:
    type: "string"
    enum:
      - "success"
      - "oom_abort"
      - "timeout"
    description: "Final status of the run."
required:
  - "run_id"
  - "seed"
  - "mode"
  - "task"
  - "accuracy"
  - "peak_memory_gb"
  - "wall_clock_seconds"
  - "status"
additionalProperties: false