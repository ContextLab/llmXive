[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-state-learning"
version = "0.1.0"
description = "Implementing REM-like Consolidation in Language Models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch==2.0.0",
    "transformers==4.30.0",
    "datasets==2.14.0",
    "scikit-learn==1.3.0",
    "accelerate==0.20.0",
    "pytest==7.3.0",
    "scipy==1.11.0",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["code", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "C4", "UP", "N", "ARG", "SIM"
]
ignore = [
  "E501", # Line length handled by black
  "B008", # Function calls in defaults (common in config)
  "N806", # Variable in function should be lowercase (strict config vars)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"