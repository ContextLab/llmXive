[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-state-learning"
version = "0.1.0"
description = "Implementing REM-like consolidation in language models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch==2.0.0",
    "transformers==4.30.0",
    "datasets==2.14.0",
    "scikit-learn==1.2.2",
    "accelerate==0.20.0",
    "pytest==7.3.1",
    "scipy==1.11.0",
]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: unit tests",
    "integration: integration tests",
    "contract: contract tests",
]

[tool.ruff]
# Inherit settings from .ruff.toml or define here if preferred
# This section is primarily for project-wide tool configuration
line-length = 100
target-version = "py39"

[tool.setuptools]
packages = ["config", "data", "models", "utils", "eval"]
package-dir = {"" = "code"}
