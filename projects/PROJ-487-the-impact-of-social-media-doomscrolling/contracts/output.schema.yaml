$schema: http://json-schema.org/draft-07/schema#
title: AnalysisResult
description: Schema for statistical analysis output records
type: object
properties:
  metric:
    type: string
    description: Name of the metric being analyzed
  coefficient:
    type: number
    description: Correlation or regression coefficient
  p_value:
    type: number
    description: P-value from statistical test
  lag:
    type: integer
    description: Lag period for time-series analysis
  significance_flag:
    type: boolean
    description: Whether the result is statistically significant
  stationarity_status:
    type: string
    description: Status of the time series (e.g., 'stationary', 'non-stationary')
required:
  - metric
  - coefficient
  - p_value
  - lag
  - significance_flag
  - stationarity_status
additionalProperties: false
