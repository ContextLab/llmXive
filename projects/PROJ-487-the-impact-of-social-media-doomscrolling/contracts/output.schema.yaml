$schema: http://json-schema.org/draft-07/schema#
title: Processed and Analysis Output Schema
description: Schema for processed data and analysis results.
type: object
properties:
  aligned_timeseries:
    type: object
    required:
      - file_path
      - expected_columns
      - stationarity_status
    properties:
      file_path:
        type: string
        pattern: "^data/processed/aligned_timeseries\\.csv$"
      expected_columns:
        type: array
        items:
          type: string
        contains:
          const: "date"
          minItems: 1
      stationarity_status:
        type: string
        enum: ["stationary", "non-stationary"]
  granger_results:
    type: object
    required:
      - file_path
      - lags_tested
      - p_values
    properties:
      file_path:
        type: string
        pattern: "^data/processed/granger_results\\.csv$"
      lags_tested:
        type: array
        items:
          type: integer
        contains:
          const: 1
      p_values:
        type: array
        items:
          type: number
        minItems: 1
  analysis_report:
    type: object
    required:
      - file_path
    properties:
      file_path:
        type: string
        pattern: "^data/reports/analysis_report\\.pdf$"
additionalProperties: false
