$schema: "http://json-schema.org/draft-07/schema#"
title: "Preprocessed and Analyzed Output Schema"
description: "Schema for the processed dataset containing aligned, stationary, and normalized time-series data."
type: object
properties:
  date:
    type: string
    format: date
    description: "ISO 8601 date (YYYY-MM-DD)"
  gdelt_normalized:
    type: number
    description: "Z-score normalized GDELT event count"
  anxiety_normalized:
    type: number
    description: "Z-score normalized combined anxiety trend score"
  gdelt_stationary:
    type: boolean
    description: "True if the GDELT series passed ADF stationarity test"
  anxiety_stationary:
    type: boolean
    description: "True if the anxiety series passed ADF stationarity test"
  differences_applied:
    type: integer
    minimum: 0
    description: "Number of differences applied to achieve stationarity"
required:
  - date
  - gdelt_normalized
  - anxiety_normalized
  - gdelt_stationary
  - anxiety_stationary
  - differences_applied
additionalProperties: false
