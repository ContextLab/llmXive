$schema: http://json-schema.org/draft-07/schema#
title: TimeSeriesRecord
description: Schema for raw time-series data records (GDELT and Google Trends)
type: object
properties:
  date:
    type: string
    description: Date in YYYY-MM-DD format
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  value:
    type: number
    description: Numeric value of the metric
  source:
    type: string
    description: Source of the data (e.g., 'GDELT', 'Google Trends')
required:
  - date
  - value
  - source
additionalProperties: false
