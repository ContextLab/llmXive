$schema: http://json-schema.org/draft-07/schema#
title: TimeSeriesRecord
description: Schema for raw and processed time-series data records.
type: object
required:
  - date
  - value
properties:
  date:
    type: string
    description: ISO 8601 date string (YYYY-MM-DD).
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  value:
    type: number
    description: The numeric value for the time series at this date.
  source:
    type: string
    description: Source of the data (e.g., 'gdelt', 'google_trends').
    enum:
      - gdelt
      - google_trends
  metric:
    type: string
    description: The specific metric measured.
    enum:
      - event_count
      - search_volume
additionalProperties: false
