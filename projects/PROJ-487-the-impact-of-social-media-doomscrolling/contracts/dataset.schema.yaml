# Schema for raw dataset files (GDELT and Google Trends)
# Defines the structure and constraints for data ingestion
schema_name: dataset_schema
version: "1.0"
description: Schema for validating raw data files fetched from external APIs

fields:
  - name: date
    type: string
    description: ISO 8601 formatted date (YYYY-MM-DD)
    constraints:
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      required: true

  - name: value
    type: float
    description: Numeric value (event count or trend index)
    constraints:
      required: true
      min: 0.0
      max: 100.0

  - name: source
    type: string
    description: Source identifier (e.g., 'gdelt', 'google_trends')
    constraints:
      required: true
      allowed_values:
        - gdelt
        - google_trends

  - name: metric
    type: string
    description: Metric name (e.g., 'negative_sentiment', 'anxiety_searches')
    constraints:
      required: true

validation_rules:
  - rule: unique_dates
    description: Each date must appear only once per source/metric combination
    check: "groupby(['source', 'metric', 'date']).size() <= 1"

  - rule: non_empty
    description: File must contain at least one data row
    check: "len(df) > 0"
