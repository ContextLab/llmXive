$schema: http://json-schema.org/draft-07/schema#
title: GDELT and Google Trends Dataset Schema
description: Schema for raw dataset files fetched from GDELT and Google Trends.
type: object
properties:
  gdelt_events:
    type: object
    required:
      - file_path
      - expected_columns
      - column_types
    properties:
      file_path:
        type: string
        pattern: "^data/raw/gdelt_events\\.csv$"
      expected_columns:
        type: array
        items:
          type: string
        contains:
          const: "date"
          minItems: 1
      column_types:
        type: object
        properties:
          date:
            type: string
            const: "datetime"
          event_count:
            type: string
            const: "integer"
          sentiment_score:
            type: string
            const: "float"
additionalProperties: false
