$schema: "http://json-schema.org/draft-07/schema#"
title: "GDELT and Google Trends Dataset Schema"
description: "Schema for the raw dataset containing GDELT event counts and Google Trends anxiety metrics."
type: object
properties:
  date:
    type: string
    format: date
    description: "ISO 8601 date (YYYY-MM-DD)"
  gdelt_negative_events:
    type: integer
    minimum: 0
    description: "Count of negative sentiment events from GDELT for the day"
  google_trends_anticipatory_anxiety:
    type: integer
    minimum: 0
    maximum: 100
    description: "Google Trends interest score (0-100) for 'anticipatory anxiety'"
  google_trends_worry_future:
    type: integer
    minimum: 0
    maximum: 100
    description: "Google Trends interest score (0-100) for 'worry about future'"
required:
  - date
  - gdelt_negative_events
  - google_trends_anticipatory_anxiety
  - google_trends_worry_future
additionalProperties: false
