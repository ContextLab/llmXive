$schema: "http://json-schema.org/draft-07/schema#"
title: "TimeSeriesRecord"
type: "object"
properties:
  date:
    type: "string"
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    description: "Date of the record in YYYY-MM-DD format."
  value:
    type: "number"
    description: "Aggregated value (event count or search volume)."
  source:
    type: "string"
    enum:
      - "GDELT"
      - "Google Trends"
    description: "Source of the data."
  is_stationary:
    type: "boolean"
    description: "Flag indicating if the series is stationary after preprocessing."
  is_normalized:
    type: "boolean"
    description: "Flag indicating if the series is z-score normalized."
required:
  - "date"
  - "value"
  - "source"
  - "is_stationary"
  - "is_normalized"
additionalProperties: false
description: "Represents a single day's aggregated value for a specific metric."