$schema: http://json-schema.org/draft-07/schema#
title: Dataset Schema
description: JSON Schema for the aggregate negative news publication volume and anxiety search trends dataset.
type: object
properties:
  date:
    type: string
    description: The date of the observation in YYYY-MM-DD format.
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  value:
    type: number
    description: The numeric value of the metric (event count or trend index).
  source:
    type: string
    description: The source of the data (e.g., 'GDELT', 'Google Trends').
required:
  - date
  - value
  - source
additionalProperties: false