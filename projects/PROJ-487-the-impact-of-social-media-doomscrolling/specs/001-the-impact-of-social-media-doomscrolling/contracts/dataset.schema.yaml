$schema: http://json-schema.org/draft-07/schema#
title: TimeSeriesRecord
description: Schema for aggregate negative news publication volume and anxiety search trend records.
type: object
required:
  - date
  - value
  - source
properties:
  date:
    type: string
    description: ISO8601 formatted date string (YYYY-MM-DD).
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  value:
    type: number
    description: The numeric value of the metric (event count or search interest index).
    minimum: 0
  source:
    type: string
    description: The source of the data (e.g., 'GDELT', 'GoogleTrends').
    enum:
      - GDELT
      - GoogleTrends
additionalProperties: false
