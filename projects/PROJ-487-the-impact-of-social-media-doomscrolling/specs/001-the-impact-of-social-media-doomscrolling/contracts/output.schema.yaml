$schema: "http://json-schema.org/draft-07/schema#"
title: "AnalysisResultSchema"
description: "Schema for the statistical analysis results."
type: "object"
properties:
  summary:
    type: "object"
    properties:
      total_days:
        type: "integer"
        description: "Total number of days in the analysis"
      stationarity_achieved:
        type: "boolean"
        description: "Whether stationarity was achieved for both series"
  correlations:
    type: "array"
    items:
      type: "object"
      properties:
        method:
          type: "string"
          enum: ["Pearson", "Spearman"]
        coefficient:
          type: "number"
        p_value:
          type: "number"
        significance:
          type: "boolean"
          description: "True if p < 0.05"
      required:
        - method
        - coefficient
        - p_value
        - significance
  granger_causality:
    type: "array"
    items:
      type: "object"
      properties:
        lag:
          type: "integer"
          description: "Lag window in days"
        f_statistic:
          type: "number"
        p_value:
          type: "number"
        significance_uncorrected:
          type: "boolean"
        significance_corrected:
          type: "boolean"
          description: "True if p < 0.01 (Bonferroni corrected)"
      required:
        - lag
        - f_statistic
        - p_value
        - significance_uncorrected
        - significance_corrected
  sensitivity_analysis:
    type: "object"
    properties:
      lag_windows_tested:
        type: "array"
        items:
          type: "integer"
      significance_rate:
        type: "number"
        description: "Proportion of lag windows with significant results"
required:
  - summary
  - correlations
  - granger_causality
  - sensitivity_analysis
additionalProperties: false
