$schema: "http://json-schema.org/draft-07/schema#"
type: "object"
properties:
  metric:
    type: "string"
    description: "The name of the statistical metric (e.g., 'Pearson Correlation', 'Granger Causality')."
  coefficient:
    type: "number"
    description: "The calculated coefficient value (e.g., correlation coefficient, F-statistic)."
  p_value:
    type: "number"
    description: "The p-value associated with the test statistic."
  lag:
    type: "integer"
    description: "The time lag used for the analysis (e.g., 1, 2, 3, 7, 14 days)."
  significance_flag:
    type: "boolean"
    description: "True if the result is statistically significant after Bonferroni correction (p < 0.01), False otherwise."
  stationarity_status:
    type: "string"
    description: "The stationarity status of the time series used in this calculation (e.g., 'stationary', 'non-stationary')."
required:
  - "metric"
  - "coefficient"
  - "p_value"
  - "lag"
  - "significance_flag"
  - "stationarity_status"
additionalProperties: false