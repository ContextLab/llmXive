$schema: "http://json-schema.org/draft-07/schema#"
title: "AnalysisResult"
type: "object"
properties:
  metric:
    type: "string"
    description: "The metric being tested (e.g., 'Granger Causality', 'Correlation')."
  coefficient:
    type: "number"
    description: "The test statistic (e.g., correlation coefficient, F-statistic)."
  p_value:
    type: "number"
    description: "The p-value of the test."
  lag:
    type: "integer"
    description: "The lag window used (if applicable)."
  significance_flag:
    type: "boolean"
    description: "True if p < 0.01 (Bonferroni) OR p < 0.05 (FDR)."
  stationarity_status:
    type: "string"
    enum:
      - "stationary"
      - "non-stationary"
    description: "Stationarity status of the series."
  variance_stable:
    type: "boolean"
    description: "True if ARCH-LM test indicates stable variance."
required:
  - "metric"
  - "coefficient"
  - "p_value"
  - "significance_flag"
  - "stationarity_status"
  - "variance_stable"
additionalProperties: false
description: "Represents the output of a statistical test."