$schema: http://json-schema.org/draft-07/schema#
title: AnalysisResult
description: Schema for statistical analysis results (Granger causality, correlation).
type: object
required:
  - metric
  - coefficient
  - p_value
  - lag
  - significance_flag
  - stationarity_status
properties:
  metric:
    type: string
    description: The name of the metric being analyzed (e.g., 'GrangerCausality', 'PearsonCorrelation').
  coefficient:
    type: number
    description: The calculated coefficient (e.g., F-statistic, correlation coefficient).
  p_value:
    type: number
    description: The p-value associated with the test statistic.
    minimum: 0
    maximum: 1
  lag:
    type: integer
    description: The lag order used for the test.
    minimum: 1
  significance_flag:
    type: boolean
    description: True if the result is statistically significant (p < alpha), False otherwise.
  stationarity_status:
    type: string
    description: The stationarity status of the underlying series used for this result.
    enum:
      - stationary
      - non-stationary
      - differenced
additionalProperties: false
