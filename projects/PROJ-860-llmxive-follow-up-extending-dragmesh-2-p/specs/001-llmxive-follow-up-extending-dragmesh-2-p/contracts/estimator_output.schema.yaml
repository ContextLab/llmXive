$schema: "http://json-schema.org/draft-07/schema#"
title: "VirtualTactileEstimatorOutput"
description: "Schema for the output of the Virtual Tactile Estimator module."
type: "object"
properties:
  k_est:
    type: "number"
    description: "Estimated dynamic resistance proxy (ratio of torque derivative to velocity derivative)."
    minimum: 0.0
    exclusiveMinimum: true
    maximum: 10.0
  filter_applied:
    type: "boolean"
    description: "Indicates whether the moving‑average filter (window=5) was applied."
    const: true
  epsilon_clamped:
    type: "boolean"
    description: "True if the denominator was clamped to epsilon (1e‑4) due to near‑zero object velocity."
    const: true
  is_valid:
    type: "boolean"
    description: "True if `k_est` is finite and within the clamped bounds."
    const: true
required:
  - k_est
  - filter_applied
  - epsilon_clamped
  - is_valid
additionalProperties: false
