[pytest]
# Global settings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

# Timeout configuration per task T003
# Unit tests: 1 hour (3600 seconds)
# Integration tests: 6 hours (21600 seconds)
# The timeout is applied per test function.
# Unit tests will use the default timeout (3600).
# Integration tests must be marked with @pytest.mark.integration to apply the longer timeout.
timeout = 3600
timeout_func_only = true

# Markers
markers =
    integration: marks tests as integration tests (longer timeout)
    slow: marks tests as slow running