[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in dataclasses/pydantic)
    "C901", # complex structures (allow higher complexity for scientific logic)
]

[lint.per-file-ignores]
"tests/*" = ["S101"] # allow asserts in tests

[lint.isort]
known-first-party = ["config", "ingest", "interfaces", "main", "metrics", "models", "setup_data_dirs", "stats", "synthetic", "utils", "viz", "format_lint_check"]

[format]
# Enable format checking via ruff format (black-compatible)
line-length = 88
indent-style = "space"
quote-style = "double"
