[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantifying-network-heat-transport"
version = "0.1.0"
description = "Quantifying the Impact of Network Structure on Heat Transport in Disordered Alloys"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "networkx",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "pydantic",
    "ase",
    "phonopy",
    "statsmodels",
    "ruff",
    "black",
    "pytest",
    "pytest-cov"
]

[tool.ruff]
# Linter selection and configuration
lint.select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "RUF",    # Ruff-specific rules
]
lint.ignore = [
    "E501",   # Line too long (handled by black)
    "B008",   # Do not perform function call in argument defaults (common in pydantic/pytest)
]

# Exclude generated data and build artifacts
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "data",
    "figures",
    "venv",
]

# Target Python version
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["code"]
force-sort-within-sections = true
lines-after-imports = 2

[tool.black]
# Formatting configuration
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | figures
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=code --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
