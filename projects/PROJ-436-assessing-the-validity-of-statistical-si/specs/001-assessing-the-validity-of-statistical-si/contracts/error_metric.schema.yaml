$schema: "http://json-schema.org/draft-07/schema#"
title: "ErrorMetric"
description: "Result of a single simulation iteration."
type: "object"
properties:
  config_id:
    type: "string"
    description: "Hash of the SimulationConfig used."
  iteration_id:
    type: "integer"
    description: "Index of the iteration (0 to n-1)."
  method:
    type: "string"
    enum:
      - "CC"
      - "MI"
      - "IPW"
    description: "The analysis method used."
  p_value:
    type: "number"
    description: "The p-value obtained from the hypothesis test."
  rejected:
    type: "boolean"
    description: "True if p_value < 0.05."
  imputation_stats:
    type: "object"
    description: "Optional: Rubin's rules stats for MI (if applicable)."
    properties:
      pooled_estimate:
        type: "number"
      pooled_se:
        type: "number"
      degrees_of_freedom:
        type: "number"
required:
  - "config_id"
  - "iteration_id"
  - "method"
  - "p_value"
  - "rejected"