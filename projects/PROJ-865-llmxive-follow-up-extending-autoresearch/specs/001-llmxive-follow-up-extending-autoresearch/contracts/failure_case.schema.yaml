type: object
properties:
  task_id:
    type: string
  raw_error_log:
    type: string
  ground_truth_resolution:
    type: string
  annotated_structural_feature:
    type: string
    enum:
      - "Syntactic Error"
      - "Logical Loop"
      - "Semantic Ambiguity"
      - "Missing Context"
      - "Unstructured"
required:
  - task_id
  - raw_error_log
  - ground_truth_resolution
  - annotated_structural_feature
