$schema: http://json-schema.org/draft-07/schema#
title: Pivot Attempt Schema
description: Schema for recording pivot attempt metrics and outcomes in the rule engine execution phase.
type: object
required:
  - task_id
  - method
  - time_to_pivot
  - success
  - failure_type
properties:
  task_id:
    type: string
    description: Unique identifier for the task being attempted.
  method:
    type: string
    description: The method or rule used to attempt the pivot.
  time_to_pivot:
    type: number
    description: Time in seconds taken to execute the pivot action.
    minimum: 0
  success:
    type: boolean
    description: Whether the pivot attempt was successful.
  failure_type:
    type: string
    description: The type of failure if the pivot was unsuccessful, or 'None' if successful.
    enum:
      - "Syntactic Error"
      - "Logical Loop"
      - "Semantic Ambiguity"
      - "Missing Context"
      - "Unstructured"
      - "None"
additionalProperties: false