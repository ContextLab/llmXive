$schema: http://json-schema.org/draft-07/schema#
title: Pivot Attempt Schema
description: Schema for recording pivot attempt metrics and outcomes in the rule engine execution phase.
type: object
required:
  - attempt_id
  - task_id
  - method
  - steps_to_pivot
  - is_censored
  - success
  - failure_category
  - structural_feature
properties:
  attempt_id:
    type: string
    description: Unique identifier for the attempt.
  task_id:
    type: string
    description: Reference to the task.
  method:
    type: string
    enum:
      - "RuleEngine"
      - "Baseline"
    description: Method used for the pivot.
  steps_to_pivot:
    type: integer
    description: Number of steps taken to pivot (capped at 50).
    minimum: 0
    maximum: 50
  is_censored:
    type: boolean
    description: True if steps_to_pivot reached the cap (50).
  success:
    type: boolean
    description: Whether the pivot attempt was successful.
  failure_category:
    type: string
    description: The type of failure if the pivot was unsuccessful.
    enum:
      - "Coverage Gap"
      - "Distillation Error"
      - "None"
  structural_feature:
    type: string
    description: The root cause of the original failure (inherited from FailureCase).
    enum:
      - "Syntactic"
      - "Logical"
      - "Semantic"
      - "Missing Context"
      - "Unstructured"
      - "None (Success)"
additionalProperties: false