$schema: http://json-schema.org/draft-07/schema#
title: Pivot Attempt Schema
description: Schema for recording pivot attempt metrics and outcomes in the rule engine execution.
type: object
required:
  - task_id
  - method
  - time_to_pivot
  - success
  - failure_type
properties:
  task_id:
    type: string
    description: Unique identifier for the task being attempted.
  method:
    type: string
    description: The method or rule used to attempt the pivot.
  time_to_pivot:
    type: number
    format: float
    description: Time in seconds taken to reach the pivot point.
  success:
    type: boolean
    description: Whether the pivot attempt was successful.
  failure_type:
    type: string
    description: The type of failure if the pivot was unsuccessful.
    enum:
      - Syntactic Error
      - Logical Loop
      - Semantic Ambiguity
      - Missing Context
      - Unstructured
additionalProperties: false