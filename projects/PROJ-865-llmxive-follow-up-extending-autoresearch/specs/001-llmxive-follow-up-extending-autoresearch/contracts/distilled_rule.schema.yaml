$schema: http://json-schema.org/draft-07/schema#
title: Distilled Rule Schema
description: Schema for validated distilled rules in the AutoResearchClaw pipeline
type: object
required:
  - rule_id
  - condition_pattern
  - pivot_action
  - confidence
properties:
  rule_id:
    type: string
    description: Unique identifier for the rule
    pattern: "^rule_[0-9]{4}$"
  condition_pattern:
    type: string
    description: Regex pattern or logical condition to match failure cases
    minLength: 1
    example: "Error: SyntaxError.*unexpected indent"
  pivot_action:
    type: string
    description: Action to take when condition is met
    minLength: 1
    example: "RETRY_WITH_SYNTAX_CHECK"
  confidence:
    type: number
    description: Confidence score of the rule (0.0 to 1.0)
    minimum: 0.0
    maximum: 1.0
    example: 0.95
additionalProperties: false