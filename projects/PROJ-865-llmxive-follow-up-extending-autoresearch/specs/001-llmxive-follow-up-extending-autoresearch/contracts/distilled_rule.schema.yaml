$schema: http://json-schema.org/draft-07/schema#
title: Distilled Rule Schema
description: >
  Schema for rules distilled from failure analysis.
  Defines the condition pattern, the pivot action to take, and the confidence score.
type: object
required:
  - rule_id
  - condition_pattern
  - pivot_action
  - confidence
properties:
  rule_id:
    type: string
    description: Unique identifier for the distilled rule.
    pattern: "^RULE-[0-9]{4}$"
    example: "RULE-0001"
  condition_pattern:
    type: string
    description: >
      The logical or regex pattern used to detect this failure mode.
      Should be a valid Python regex or a descriptive natural language condition.
    minLength: 1
    example: "Error: SyntaxError.*unexpected indent"
  pivot_action:
    type: string
    description: >
      The deterministic action to execute when the condition_pattern matches.
      This corresponds to a specific strategy or fallback mechanism.
    minLength: 1
    example: "RETRY_WITH_SYNTAX_CHECK"
  confidence:
    type: number
    description: >
      Confidence score of the rule generation process (0.0 to 1.0).
      Derived from the LLM's probability or heuristic certainty.
    minimum: 0.0
    maximum: 1.0
    example: 0.95
additionalProperties: false