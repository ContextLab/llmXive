$schema: http://json-schema.org/draft-07/schema#
type: object
properties:
  rule_id:
    type: string
    description: "Unique identifier for the distilled rule."
  condition_pattern:
    type: string
    description: "The regex or pattern used to match the failure condition."
  pivot_action:
    type: string
    description: "The action to take when the condition is met."
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Confidence score of the rule."
  failure_type:
    type: string
    enum:
      - "Syntactic Error"
      - "Logical Loop"
      - "Semantic Ambiguity"
      - "Missing Context"
      - "Unstructured"
    description: "The structural feature category this rule addresses."
required:
  - rule_id
  - condition_pattern
  - pivot_action
  - confidence
  - failure_type
