$schema: http://json-schema.org/draft-07/schema#
type: object
properties:
  rule_id:
    type: string
    description: "Unique identifier for the rule"
  condition_pattern:
    type: string
    description: "Regex pattern or condition to match"
  pivot_action:
    type: string
    description: "Action to take when condition is met"
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Confidence score of the rule"
  source_feature:
    type: string
    description: "The failure feature this rule addresses"
required:
  - rule_id
  - condition_pattern
  - pivot_action
  - confidence