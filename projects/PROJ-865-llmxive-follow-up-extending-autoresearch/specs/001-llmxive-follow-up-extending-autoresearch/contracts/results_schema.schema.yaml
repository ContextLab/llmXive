$schema: "http://json-schema.org/draft-07/schema#"
title: "Experiment Results Schema"
description: "Schema for the aggregated pivot attempt results"
type: "object"
properties:
  pivot_attempts:
    type: "array"
    items:
      type: "object"
      properties:
        attempt_id:
          type: "string"
          description: "Unique identifier for the attempt"
        task_id:
          type: "string"
          description: "Reference to the task"
        method:
          type: "string"
          enum:
            - "RuleEngine"
            - "Baseline"
          description: "Method used for the pivot"
        steps_to_pivot:
          type: "integer"
          description: "Steps taken to pivot (capped at 50)"
        is_censored:
          type: "boolean"
          description: "Whether the steps were capped"
        success:
          type: "boolean"
          description: "Whether the pivot was successful"
        failure_category:
          type: "string"
          enum:
            - "Coverage Gap"
            - "Distillation Error"
            - "None"
          description: "Category of failure if success is false"
        structural_feature:
          type: "string"
          enum:
            - "Syntactic"
            - "Logical"
            - "Semantic"
            - "Missing Context"
            - "Unstructured"
            - "None (Success)"
          description: "Root cause of the original failure"
      required:
        - attempt_id
        - task_id
        - method
        - steps_to_pivot
        - success
required:
  - pivot_attempts
additionalProperties: false
