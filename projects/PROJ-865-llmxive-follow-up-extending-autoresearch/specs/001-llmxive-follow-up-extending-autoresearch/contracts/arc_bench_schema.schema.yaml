$schema: "http://json-schema.org/draft-07/schema#"
title: "ARC-Bench Failure Case Schema"
description: "Schema for parsed and annotated failure cases from ARC-Bench"
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the failure case"
  raw_error_log:
    type: "string"
    description: "Original error log from the agent"
  task_context:
    type: "string"
    description: "Context of the task when the error occurred"
  ground_truth_resolution:
    type: "string"
    description: "The correct resolution path"
  structural_feature:
    type: "string"
    enum:
      - "Syntactic"
      - "Logical"
      - "Semantic"
      - "Missing Context"
      - "Unstructured"
      - "None (Success)"
    description: "Annotated structural feature of the failure"
  source_dataset:
    type: "string"
    description: "URL of the source dataset"
required:
  - id
  - raw_error_log
  - task_context
  - ground_truth_resolution
  - structural_feature
  - source_dataset
additionalProperties: false
