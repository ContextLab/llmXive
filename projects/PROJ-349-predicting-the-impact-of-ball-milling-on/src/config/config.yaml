# Configuration for Predicting the Impact of Ball Milling on Particle Size Distribution
# This file defines API endpoints, resource limits, and OCR fallback settings.
# Generated by task T009.

# API Endpoints
api:
  materials_project:
    base_url: "https://next-gen.materialsproject.org/api/v2/materials"
    api_key_env: "MP_API_KEY"
  nist:
    base_url: "https://www.nist.gov/pml/atomic-spectra-database"
    search_endpoint: "/api/search"
  arxiv:
    base_url: "http://export.arxiv.org/api/query"
    search_query: "cat:cond-mat.mtrl-sci AND ball milling"

# Resource Limits for GPR Training (Task T023b)
# These limits trigger the fallback to Random Forest if exceeded.
gpr_max_runtime: 1800  # seconds (30 minutes)
gpr_max_memory: 5.0   # GB (RSS)

# OCR Fallback Settings (Task T014c)
# If true, the pipeline attempts to extract PSD data from images using EasyOCR.
# If false, flagged entries are skipped and logged for manual curation.
ocr:
  fallback_enabled: false
  language: ["en"]
  model_storage_directory: "./models/easyocr"
  download_enabled: true

# Data Paths (Optional overrides, defaults to standard project structure)
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  results_dir: "results"
  figures_dir: "figures"
  contracts_dir: "contracts"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pipeline.log"