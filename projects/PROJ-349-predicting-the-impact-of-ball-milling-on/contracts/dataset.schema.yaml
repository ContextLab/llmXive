# Dataset Schema for Ball Milling Particle Size Distribution
# Defines the required fields, types, and constraints for the ball milling dataset.
# This schema is used by src/preprocess/validate_schema.py for validation.

version: "1.0"
description: "Schema for ball milling experimental data including process parameters and PSD metrics."

fields:
  - name: experiment_id
    type: string
    required: true
    description: "Unique identifier for the experiment"

  - name: source
    type: string
    required: true
    description: "Source of the data (e.g., 'Materials Project', 'NIST', 'arXiv')"

  - name: material_type
    type: string
    required: true
    description: "Type of material being milled"

  - name: milling_speed
    type: float
    required: true
    description: "Milling speed in RPM"

  - name: milling_time
    type: float
    required: true
    description: "Milling time in hours"

  - name: ball_to_powder_ratio
    type: float
    required: true
    description: "Ratio of ball mass to powder mass"

  - name: youngs_modulus
    type: float
    required: true
    description: "Young's modulus of the material in GPa"

  - name: density
    type: float
    required: true
    description: "Density of the material in g/cm³"

  - name: d10
    type: float
    required: true
    description: "Particle size at 10th percentile (D10) in micrometers"

  - name: d50
    type: float
    required: true
    description: "Particle size at 50th percentile (D50) in micrometers"

  - name: d90
    type: float
    required: true
    description: "Particle size at 90th percentile (D90) in micrometers"

  - name: process_duration
    type: float
    required: true
    description: "Total process duration in hours"

constraints:
  # No row count validation here; handled by T015c and T017c
  # Only schema structure (presence and type) is validated.
  check_nulls: true
  check_types: true
