$schema: "http://json-schema.org/draft-07/schema#"
title: "Ball Milling Dataset Schema"
description: "Schema for the ball milling particle size distribution dataset."
type: "object"
required:
  - experiment_id
  - source
  - source_id
  - material_type
  - milling_speed
  - milling_time
  - ball_to_powder_ratio
  - youngs_modulus
  - density
  - d10
  - d50
  - d90
  - process_duration
properties:
  experiment_id:
    type: "string"
    description: "Unique identifier for the experiment."
  source:
    type: "string"
    description: "Name of the data source (e.g., 'Materials Project', 'NIST', 'arXiv')."
  source_id:
    type: "string"
    description: "Unique identifier for the record within the source."
  material_type:
    type: "string"
    description: "Type of material processed."
  milling_speed:
    type: ["number", "null"]
    description: "Milling speed in RPM."
  milling_time:
    type: ["number", "null"]
    description: "Milling time in hours."
  ball_to_powder_ratio:
    type: ["number", "null"]
    description: "Ratio of ball mass to powder mass."
  youngs_modulus:
    type: ["number", "null"]
    description: "Young's modulus of the material in GPa."
  density:
    type: ["number", "null"]
    description: "Density of the material in g/cm³."
  d10:
    type: ["number", "null"]
    description: "10th percentile of particle size distribution in micrometers."
  d50:
    type: ["number", "null"]
    description: "50th percentile (median) of particle size distribution in micrometers."
  d90:
    type: ["number", "null"]
    description: "90th percentile of particle size distribution in micrometers."
  process_duration:
    type: ["number", "null"]
    description: "Total process duration in minutes."
additionalProperties: true
