$schema: "http://json-schema.org/draft-07/schema#"
type: object
required:
  - experiment_id
  - source_name
  - source_id
  - material_type
  - milling_speed
  - milling_time
  - ball_to_powder_ratio
  - youngs_modulus
  - density
  - d10
  - d50
  - d90
  - process_duration
properties:
  experiment_id:
    type: string
  source_name:
    type: string
    enum: ["Materials Project", "NIST", "arXiv"]
  source_id:
    type: string
  material_type:
    type: string
  milling_speed:
    type: number
  milling_time:
    type: number
  ball_to_powder_ratio:
    type: number
  youngs_modulus:
    type: number
  density:
    type: number
  d10:
    type: number
  d50:
    type: number
  d90:
    type: number
  process_duration:
    type: number
