type: object
properties:
  experiment_id:
    type: string
    description: Unique identifier for the experiment
  source:
    type: string
    description: Name of the data source (e.g., Materials Project, NIST, arXiv)
  source_id:
    type: string
    description: Unique identifier within the source
  material_type:
    type: string
    description: Type of material processed
  milling_speed:
    type: number
    description: Milling speed in RPM
  milling_time:
    type: number
    description: Milling time in hours
  ball_to_powder_ratio:
    type: number
    description: Ratio of ball mass to powder mass
  youngs_modulus:
    type: number
    description: Young's modulus in GPa
  density:
    type: number
    description: Material density in g/cm³
  d10:
    type: number
    description: 10th percentile particle size in microns
  d50:
    type: number
    description: 50th percentile particle size (median) in microns
  d90:
    type: number
    description: 90th percentile particle size in microns
  process_duration:
    type: number
    description: Total process duration in hours
required:
  - experiment_id
  - source
  - source_id
  - material_type
  - milling_speed
  - milling_time
  - ball_to_powder_ratio
  - youngs_modulus
  - density
  - d10
  - d50
  - d90
  - process_duration
