# Configuration for Ball Milling Prediction Pipeline

# GPR Resource Limits (in seconds and GB)
gpr_max_runtime: 1800.0  # 30 minutes
gpr_max_memory: 5.0      # 5 GB

# OCR Fallback Settings
ocr:
  fallback_enabled: false

# Data Directory Paths
data:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  results_dir: results

# API Endpoints
api:
  materials_project: https://next-gen.materialsproject.org/api/v2/materials
  nist: https://www.nist.gov/pml/atomic-spectra-database

# API Keys (set via environment variables or here)
api_keys:
  materials_project: null
  nist: null
