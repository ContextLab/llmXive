[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ball-milling-prediction"
version = "0.1.0"
description = "Predicting the impact of ball milling on particle size distribution"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.2.*",
    "numpy==1.26.*",
    "scikit-learn==1.5.*",
    "statsmodels==0.14.*",
    "matplotlib==3.9.*",
    "seaborn==0.13.*",
    "requests==2.32.*",
    "tqdm==4.66.*",
    "pyarrow==16.*",
    "pdfminer.six==20231228",
    "arxiv",
    "easyocr==1.7.*",
    "opencv-python==4.8.*",
    "pdf2image==1.16.*",
    "psutil",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "black==24.3.0",
    "flake8==7.0.0",
    "pytest==8.0.0",
    "pre-commit==3.6.0",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''
skip-string-normalization = false
experimental-string-processing = false

[tool.setuptools]
packages = ["src", "tests", "scripts"]
package-dir = {"" = "code"}

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.isort]
profile = "black"
line_length = 88