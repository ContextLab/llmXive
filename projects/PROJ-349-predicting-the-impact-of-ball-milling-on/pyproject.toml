[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ball-milling-impact-prediction"
version = "0.1.0"
description = "Predicting the impact of ball milling on particle size distribution"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.2.*",
    "numpy==1.26.*",
    "scikit-learn==1.5.*",
    "statsmodels==0.14.*",
    "matplotlib==3.9.*",
    "seaborn==0.13.*",
    "requests==2.32.*",
    "tqdm==4.66.*",
    "pyarrow==16.*",
    "pdfminer.six==20231228",
    "easyocr==1.7.*",
    "opencv-python==4.8.*",
    "pdf2image==1.16.*",
    "arxiv",
    "psutil"
]

[project.optional-dependencies]
dev = [
    "flake8",
    "black",
    "pytest",
    "pre-commit"
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | code
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"