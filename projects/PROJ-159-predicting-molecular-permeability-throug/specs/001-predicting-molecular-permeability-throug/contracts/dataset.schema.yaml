$schema: "http://json-schema.org/draft-07/schema#"
title: "Gas‑Framework Pair Dataset Schema"
type: "object"
properties:
  pair_id:
    type: "string"
    description: "Unique identifier for the gas‑framework pair"
  molecule_smiles:
    type: "string"
    description: "SMILES string of the permeant molecule"
  molecule_graph:
    type: "object"
    properties:
      node_features:
        type: "array"
        items:
          type: "array"
          items:
            type: "number"
      edge_index:
        type: "array"
        items:
          type: "array"
          items:
            type: "integer"
      edge_features:
        type: "array"
        items:
          type: "array"
          items:
            type: "number"
  framework_id:
    type: "string"
    description: "Identifier for the porous framework (e.g., MOF‑1)"
  framework_graph:
    type: "object"
    properties:
      node_features:
        type: "array"
        items:
          type: "array"
          items:
            type: "number"
      edge_index:
        type: "array"
        items:
          type: "array"
          items:
            type: "integer"
      edge_features:
        type: "array"
        items:
          type: "array"
          items:
            type: "number"
  cross_edges:
    type: "object"
    properties:
      index:
        type: "array"
        items:
          type: "array"
          items:
            type: "integer"
      distances:
        type: "array"
        items:
          type: "number"
  experimental_permeability:
    type: "number"
    description: "Log₁₀‑transformed experimental permeability (peer‑reviewed source)"
  source_url:
    type: "string"
    description: "URL of the verified dataset source"
  hand_crafted_features:
    type: "object"
    properties:
      surface_area:
        type: "number"
      pore_volume:
        type: "number"
      largest_cavity_diameter:
        type: "number"
      accessible_surface_area:
        type: "number"
    description: "Exactly the four descriptors required for the linear‑regression baseline"
required:
  - pair_id
  - molecule_smiles
  - molecule_graph
  - framework_id
  - framework_graph
  - cross_edges
  - experimental_permeability
  - source_url
  - hand_crafted_features
additionalProperties: false
