# Configuration for data ingestion and processing
# This file is read by the pipeline to locate data sources

dataset_urls:
  - "https://www.openml.org/api/v1/data/42658"

# Timeout for the entire pipeline execution (seconds)
timeout: 3600

# Sample size for testing (if applicable)
sample_size: 100

# Feature columns for processing
target_column: "grain_size"
feature_columns:
  - "rolling_temperature"
  - "Mg"
  - "Si"
  - "Cu"
  - "Alloy_Series"

# Hyperparameter grids for modeling
hyperparameter_grids:
  rf:
    n_estimators: [50, 100, 200]
    max_depth: [5, 10, 20, None]
    min_samples_split: [2, 5, 10]
  baseline:
    fit_intercept: [True, False]

# Paths (relative to project root)
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  artifacts: "data/artifacts"
  figures: "data/figures"
  state: "state"