project_id: "PROJ-386-predicting-the-impact-of-processing-temp"
title: "Predicting the Impact of Processing Temperature on the Grain Size of Rolled Aluminum Alloys"
version: "1.0.0"
created_at: "2023-10-27T00:00:00Z"
last_updated: "2023-10-27T00:00:00Z"
status: "active"

schema_version: "1.0.0"

# Artifact tracking configuration
artifact_tracking:
  enabled: true
  hash_algorithm: "sha256"
  checksum_files:
    - "data/raw/checksums.json"
    - "data/processed/checksums.json"
    - "data/artifacts/checksums.json"

# Artifact definitions with hash storage
artifacts:
  raw_data:
    directory: "data/raw"
    files: []
    checksums: {}
    description: "Raw downloaded datasets from public sources"
    
  processed_data:
    directory: "data/processed"
    files: []
    checksums: {}
    description: "Processed and cleaned datasets"
    
  model_artifacts:
    directory: "data/artifacts/models"
    files: []
    checksums: {}
    description: "Trained model objects and configurations"
    
  reports:
    directory: "data/artifacts"
    files: []
    checksums: {}
    description: "Analysis reports, plots, and metrics"
    
  state_files:
    directory: "state"
    files: []
    checksums: {}
    description: "Intermediate state and pipeline execution logs"

# Pipeline execution history
pipeline_runs: []

# Dependencies and environment
environment:
  python_version: "3.11"
  dependencies:
    - "pandas"
    - "scikit-learn"
    - "numpy"
    - "requests"
    - "pyyaml"
    - "memory-profiler"
    - "seaborn"
    - "pytest"

# Validation rules for artifact integrity
validation:
  required_artifacts:
    - "data/raw/checksums.json"
    - "data/processed/data.csv"
    - "data/artifacts/collinearity_report.json"
    - "data/artifacts/baseline_model.pkl"
    - "data/artifacts/rf_model.pkl"
    - "data/artifacts/sensitivity_report.json"
    - "data/artifacts/final_report.json"
  integrity_check: true
  auto_verify_on_load: true