project_id: "PROJ-386-predicting-the-impact-of-processing-temp"
schema_version: "1.0.0"
description: "State tracking for predicting the impact of processing temperature on grain size of rolled aluminum alloys"

artifact_registry:
  # Tracks all generated data and model artifacts with checksums for reproducibility
  # Keys correspond to logical artifact names used in the pipeline
  data_ingestion:
    path: "data/raw/ingested_data.csv"
    hash_algorithm: "sha256"
    checksum: null
    generated_at: null
    source_urls: []
    
  preprocessing_interactions:
    path: "data/processed/interaction_features.parquet"
    hash_algorithm: "sha256"
    checksum: null
    generated_at: null
    parent_artifacts:
      - "data_ingestion"
      
  collinearity_report:
    path: "data/artifacts/collinearity_report.json"
    hash_algorithm: "sha256"
    checksum: null
    generated_at: null
    parent_artifacts:
      - "preprocessing_interactions"
      
  baseline_model:
    path: "data/artifacts/baseline_model.pkl"
    hash_algorithm: "sha256"
    checksum: null
    generated_at: null
    parent_artifacts:
      - "preprocessing_interactions"
      
  rf_model:
    path: "data/artifacts/rf_model.pkl"
    hash_algorithm: "sha256"
    checksum: null
    generated_at: null
    parent_artifacts:
      - "preprocessing_interactions"
      
  sensitivity_report:
    path: "data/artifacts/sensitivity_report.json"
    hash_algorithm: "sha256"
    checksum: null
    generated_at: null
    parent_artifacts:
      - "rf_model"
      
  permutation_test:
    path: "data/artifacts/permutation_test_results.json"
    hash_algorithm: "sha256"
    checksum: null
    generated_at: null
    parent_artifacts:
      - "rf_model"
      
  final_report:
    path: "data/artifacts/final_report.json"
    hash_algorithm: "sha256"
    checksum: null
    generated_at: null
    parent_artifacts:
      - "sensitivity_report"
      - "permutation_test"
      - "collinearity_report"
      
execution_state:
  last_run_id: null
  last_run_timestamp: null
  pipeline_status: "pending"
  timeout_limit_seconds: 18000  # 5 hours
  runner_environment:
    os: "ubuntu-latest"
    cpu_count: null
    has_gpu: false
    
validation_checks:
  data_availability: false
  schema_precheck_passed: false
  collinearity_report_exists: false
  baseline_model_trained: false
  rf_model_trained: false
  sensitivity_analysis_complete: false
  permutation_test_complete: false
  
dependency_graph:
  # Defines the strict execution order required for this project
  # Each node must complete successfully before its dependents run
  nodes:
    - id: "data_ingestion"
      depends_on: []
      required: true
    - id: "preprocessing"
      depends_on: ["data_ingestion"]
      required: true
    - id: "collinearity_check"
      depends_on: ["preprocessing"]
      required: true
    - id: "baseline_modeling"
      depends_on: ["preprocessing", "collinearity_check"]
      required: true
    - id: "rf_modeling"
      depends_on: ["preprocessing", "collinearity_check"]
      required: true
    - id: "sensitivity_analysis"
      depends_on: ["rf_modeling"]
      required: true
    - id: "permutation_test"
      depends_on: ["rf_modeling"]
      required: true
    - id: "final_reporting"
      depends_on: ["sensitivity_analysis", "permutation_test", "collinearity_check", "baseline_modeling"]
      required: true
