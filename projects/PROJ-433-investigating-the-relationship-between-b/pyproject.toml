[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-brain-time-perception"
version = "0.1.0"
description = "Investigating the Relationship Between Brain Network Dynamics and Subjective Time Perception"
requires-python = ">=3.11"
dependencies = [
    "nilearn==0.10.2",
    "networkx==3.2.1",
    "scikit-learn==1.3.2",
    "pandas==2.1.4",
    "matplotlib==3.8.2",
    "nibabel==5.2.0",
    "scipy==1.11.4",
    "dask==2023.12.0",
    "distributed==2023.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "ruff==0.1.9",
    "black==23.12.1",
]

[tool.ruff]
# Target Python version
target-version = "py311"
# Line length matching Black
line-length = 88
# Select specific rules
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort (import sorting)
    "C90", # mccabe complexity
    "UP", # pyupgrade
    "N",  # pep8-naming
]
ignore = [
    "E501", # Line too long (handled by black)
    "D100", # Missing docstring in public module (optional, can be strict)
    "D104", # Missing docstring in public package
]

[tool.ruff.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103"] # Ignore docstrings in tests

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
