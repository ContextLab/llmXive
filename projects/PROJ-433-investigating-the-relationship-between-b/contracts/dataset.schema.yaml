$schema: http://json-schema.org/draft-07/schema#
title: HCP Dataset Manifest Schema
description: Schema for the manifest file describing the raw downloaded HCP dataset structure.
type: object
required:
  - dataset_id
  - version
  - subjects
  - download_timestamp
  - data_root
properties:
  dataset_id:
    type: string
    description: Unique identifier for the dataset version (e.g., HCP-1200).
    pattern: "^HCP-\\d+$"
  version:
    type: string
    description: Semantic version of the schema.
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  download_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the download was initiated.
  data_root:
    type: string
    description: Absolute or relative path to the root of the downloaded data.
  subjects:
    type: array
    description: List of subject records included in this download.
    items:
      type: object
      required:
        - subject_id
        - fMRI_paths
        - behavioral_file
        - status
      properties:
        subject_id:
          type: string
          description: The HCP subject ID (e.g., '100307').
          pattern: "^\\d{6}$"
        fMRI_paths:
          type: object
          description: Paths to specific fMRI modalities.
          properties:
            resting_state_tfce:
              type: string
              description: Path to resting-state fMRI file (HCP format).
            resting_state_mni:
              type: string
              description: Path to preprocessed MNI space fMRI file.
            confounds:
              type: string
              description: Path to confounds TSV file.
          required:
            - resting_state_tfce
        behavioral_file:
          type: string
          description: Path to the behavioral data file for this subject.
        status:
          type: string
          enum:
            - PRESENT
            - MISSING
            - CORRUPT
          description: Integrity status of the subject's data.
        qc_metrics:
          type: object
          description: Initial QC metrics (optional).
          properties:
            fd_mean:
              type: number
            fd_max:
              type: number
          additionalProperties: true
additionalProperties: false
