$schema: "http://json-schema.org/draft-07/schema#"
title: HCP Dataset Schema
description: Schema for the raw and processed HCP fMRI and behavioral dataset artifacts.
type: object
required:
  - metadata
  - subjects
properties:
  metadata:
    type: object
    required:
      - version
      - source
      - download_date
      - checksums
    properties:
      version:
        type: string
        description: Schema version (e.g., "1.0.0")
      source:
        type: string
        description: Original data source (e.g., "HCP 1200 Release")
      download_date:
        type: string
        format: date-time
        description: ISO 8601 timestamp of download
      checksums:
        type: object
        description: MD5 or SHA256 checksums for raw files
        additionalProperties:
          type: string
  subjects:
    type: array
    items:
      type: object
      required:
        - subject_id
        - fMRI_paths
        - behavioral_data
      properties:
        subject_id:
          type: string
          description: Unique subject identifier (e.g., "100307")
        fMRI_paths:
          type: object
          required:
            - resting_state_rh
            - resting_state_lh
          properties:
            resting_state_rh:
              type: string
              format: uri
              description: Path to right hemisphere fMRI NIfTI file
            resting_state_lh:
              type: string
              format: uri
              description: Path to left hemisphere fMRI NIfTI file
            task_data:
              type: array
              items:
                type: string
                format: uri
              description: Optional list of task-based fMRI file paths
        behavioral_data:
          type: object
          required:
            - DSST_score
          properties:
            DSST_score:
              type: number
              description: Digit Symbol Substitution Test score
            age:
              type: integer
              description: Age in years
            sex:
              type: string
              enum: ["Male", "Female"]
            education:
              type: integer
              description: Years of education
        qc_metrics:
          type: object
          properties:
            fd_mean:
              type: number
            fd_max:
              type: number
            motion_excluded:
              type: boolean
              description: True if subject was excluded due to motion
additionalProperties: false
