$schema: http://json-schema.org/draft-07/schema#
title: Statistical Analysis Result Schema
description: Schema for the aggregated statistical results (correlations, p-values).
type: object
required:
  - analysis_id
  - metric_name
  - behavior_name
  - correlation_coefficient
  - p_value
  - adjusted_p_value
  - effect_size
  - n_subjects
  - correction_method
  - timestamp
properties:
  analysis_id:
    type: string
    description: Unique identifier for this analysis run.
  metric_name:
    type: string
    description: Name of the metric (e.g., 'transition_count').
  behavior_name:
    type: string
    description: Name of the behavioral measure (e.g., 'DSST_score').
  correlation_coefficient:
    type: number
    description: Spearman rank correlation coefficient.
    minimum: -1
    maximum: 1
  p_value:
    type: number
    description: Raw p-value from the correlation test.
    minimum: 0
    maximum: 1
  adjusted_p_value:
    type: number
    description: Bonferroni-adjusted p-value.
    minimum: 0
    maximum: 1
  effect_size:
    type: number
    description: Cohen's r or similar effect size.
  n_subjects:
    type: integer
    description: Number of subjects included in the analysis.
    minimum: 1
  correction_method:
    type: string
    description: Method used for multiple comparison correction.
    enum:
      - bonferroni
      - holm
      - none
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of analysis.
  permutation_p_value:
    type: number
    description: (Optional) P-value derived from permutation testing.
    minimum: 0
    maximum: 1
  notes:
    type: string
    description: Optional notes about the analysis.
additionalProperties: false