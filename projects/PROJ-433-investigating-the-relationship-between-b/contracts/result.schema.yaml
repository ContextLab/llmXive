$schema: "http://json-schema.org/draft-07/schema#"
title: Statistical Analysis Result Schema
description: Schema for aggregated statistical results and permutation test outputs.
type: object
required:
  - analysis_metadata
  - correlation_results
properties:
  analysis_metadata:
    type: object
    required:
      - timestamp
      - n_subjects
      - n_excluded
    properties:
      timestamp:
        type: string
        format: date-time
      n_subjects:
        type: integer
        minimum: 0
      n_excluded:
        type: integer
        minimum: 0
      exclusion_reasons:
        type: array
        items:
          type: string
  correlation_results:
    type: array
    items:
      type: object
      required:
        - metric_pair
        - coef
        - p_val
        - adj_p
        - effect_size
      properties:
        metric_pair:
          type: string
          description: Identifier for the metric-behavior pair (e.g., "transition_count-DSST")
        coef:
          type: number
          description: Spearman correlation coefficient
        p_val:
          type: number
          minimum: 0
          maximum: 1
          description: Raw p-value
        adj_p:
          type: number
          minimum: 0
          maximum: 1
          description: Bonferroni-adjusted p-value
        effect_size:
          type: number
          description: Cohen's r effect size
        significant:
          type: boolean
          description: Whether adj_p < 0.05
  permutation_results:
    type: object
    properties:
      n_permutations:
        type: integer
        minimum: 0
      observed_statistic:
        type: number
      null_distribution:
        type: array
        items:
          type: number
        description: Array of statistics from permuted data
      permutation_p_value:
        type: number
        minimum: 0
        maximum: 1
      histogram_path:
        type: string
        description: Relative path to histogram plot file
additionalProperties: false