$schema: "http://json-schema.org/draft-07/schema#"
title: "Split Configuration Schema"
description: "Schema for validating split configuration outputs from preprocessing (T004c)."
type: object
properties:
  strategy:
    type: string
    enum:
      - "80/20"
      - "LOOCV"
    description: "The split strategy used for model training and evaluation."
  n_samples:
    type: integer
    minimum: 1
    description: "Total number of samples in the dataset."
  warning_emitted:
    type: boolean
    description: "Whether a PowerWarning was emitted due to low sample count (N < 30)."
required:
  - strategy
  - n_samples
  - warning_emitted
additionalProperties: false