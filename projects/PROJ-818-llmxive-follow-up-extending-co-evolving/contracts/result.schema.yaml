$schema: http://json-schema.org/draft-07/schema#
title: Result Metrics Schema
description: >
  Schema for result metrics generated by the Co-Evolving Policy Distillation pipeline.
  This includes forgetting rates, accuracy scores, and rule retention statistics
  for comparing Sequential, Mixed-task, and Co-evolving training conditions.
type: object
required:
  - run_id
  - condition
  - seed
  - forgetting_rate
  - accuracy
  - rule_retention
  - rule_evaluations
  - generation_count
  - timestamps
properties:
  run_id:
    type: string
    description: Unique identifier for this training run.
    pattern: "^[a-zA-Z0-9_-]+$"

  condition:
    type: string
    description: The training condition executed.
    enum:
      - sequential
      - mixed
      - coevolving

  seed:
    type: integer
    description: Random seed used for reproducibility.
    minimum: 0

  forgetting_rate:
    type: object
    description: Metrics quantifying catastrophic forgetting.
    required:
      - initial_accuracy
      - final_accuracy
      - drop
      - percentage_drop
    properties:
      initial_accuracy:
        type: number
        description: Accuracy on held-out test instances after single-task training.
        minimum: 0.0
        maximum: 1.0
      final_accuracy:
        type: number
        description: Accuracy on held-out test instances after multi-task training.
        minimum: 0.0
        maximum: 1.0
      drop:
        type: number
        description: Absolute drop in accuracy (initial - final).
        minimum: -1.0
        maximum: 1.0
      percentage_drop:
        type: number
        description: Percentage drop relative to initial accuracy.
        minimum: 0.0
        maximum: 100.0

  accuracy:
    type: object
    description: Detailed accuracy breakdown per domain.
    required:
      - overall
      - by_domain
    properties:
      overall:
        type: number
        description: Weighted average accuracy across all domains.
        minimum: 0.0
        maximum: 1.0
      by_domain:
        type: object
        description: Accuracy per task domain (e.g., logic, grid).
        additionalProperties:
          type: object
          required:
            - accuracy
            - total_instances
            - correct_count
          properties:
            accuracy:
              type: number
              minimum: 0.0
              maximum: 1.0
            total_instances:
              type: integer
              minimum: 0
            correct_count:
              type: integer
              minimum: 0

  rule_retention:
    type: object
    description: Metrics tracking the retention of specific logical rules.
    required:
      - total_rules_initial
      - total_rules_final
      - retained_count
      - retention_rate
      - rules_by_domain
    properties:
      total_rules_initial:
        type: integer
        description: Count of distinct rules known after single-task phase.
        minimum: 0
      total_rules_final:
        type: integer
        description: Count of distinct rules known after multi-task phase.
        minimum: 0
      retained_count:
        type: integer
        description: Number of rules present in both initial and final sets.
        minimum: 0
      retention_rate:
        type: number
        description: Ratio of retained rules to initial rules.
        minimum: 0.0
        maximum: 1.0
      rules_by_domain:
        type: object
        description: Retention stats per domain.
        additionalProperties:
          type: object
          required:
            - initial_count
            - final_count
            - retained_count
            - retention_rate
          properties:
            initial_count:
              type: integer
              minimum: 0
            final_count:
              type: integer
              minimum: 0
            retained_count:
              type: integer
              minimum: 0
            retention_rate:
              type: number
              minimum: 0.0
              maximum: 1.0

  rule_evaluations:
    type: integer
    description: Total number of rule evaluations performed during training.
    minimum: 0

  generation_count:
    type: integer
    description: Total number of generations completed.
    minimum: 0

  timestamps:
    type: object
    description: Timing information for the run.
    required:
      - start_time
      - end_time
      - duration_seconds
    properties:
      start_time:
        type: string
        format: date-time
        description: ISO 8601 timestamp of run start.
      end_time:
        type: string
        format: date-time
        description: ISO 8601 timestamp of run end.
      duration_seconds:
        type: number
        description: Total wall-clock time in seconds.
        minimum: 0.0

  metadata:
    type: object
    description: Optional additional metadata.
    properties:
      config_snapshot:
        type: object
        description: Snapshot of configuration used for this run.
      notes:
        type: string
        description: Free-form notes about the run.