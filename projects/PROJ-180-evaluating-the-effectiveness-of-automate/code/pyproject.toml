[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-code-review-evaluation"
version = "0.1.0"
description = "Evaluating the effectiveness of automated code review tools"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "pygithub",
    "tqdm",
    "sentence-transformers",
    "networkx",
    "pytest",
    "ruff",
    "black",
]

[tool.ruff]
# Linter configuration
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in testing)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in init files for exports
"tests/*" = ["S101"]     # Allow assertions in tests

[tool.ruff.isort]
known-first-party = ["utils", "scripts", "tests"]
force-sort-within-sections = true

[tool.black]
# Formatter configuration
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | results
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
