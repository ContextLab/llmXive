$schema: http://json-schema.org/draft-07/schema#
title: ScoreRecord
description: JSON Schema for validating ScoreRecord data structure as defined in src/data_models.py
type: object
required:
  - instance_id
  - logic_score
  - fidelity_score
  - ssim
  - lpips
  - vllm_description
properties:
  instance_id:
    type: string
    description: Unique identifier for the edit instance
    minLength: 1
  logic_score:
    type: number
    description: Logic consistency score from VLM analysis
    minimum: -1.0
    maximum: 1.0
  fidelity_score:
    type: number
    description: Fidelity score combining SSIM and LPIPS metrics
    minimum: 0.0
    maximum: 1.0
  ssim:
    type: number
    description: Structural Similarity Index Measure
    minimum: -1.0
    maximum: 1.0
  lpips:
    type: number
    description: Learned Perceptual Image Patch Similarity
    minimum: 0.0
    maximum: 1.0
  vllm_description:
    type: string
    description: Description generated by the VLM model
    minLength: 1
additionalProperties: false
examples:
  - instance_id: "edit-001"
    logic_score: 0.85
    fidelity_score: 0.92
    ssim: 0.88
    lpips: 0.12
    vllm_description: "The image shows a cat sitting on a windowsill."