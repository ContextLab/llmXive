$schema: http://json-schema.org/draft-07/schema#
title: ScoreRecord
description: JSON Schema for validating ScoreRecord data generated by the scoring pipeline.
type: object
required:
  - instance_id
  - logic_score
  - fidelity_score
  - ssim
  - lpips
  - vllm_description
properties:
  instance_id:
    type: string
    description: Unique identifier for the edit instance.
    minLength: 1
  logic_score:
    type: number
    description: Logic consistency score (0-1 range).
    minimum: 0.0
    maximum: 1.0
  fidelity_score:
    type: number
    description: Fidelity score (0-1 range).
    minimum: 0.0
    maximum: 1.0
  ssim:
    type: number
    description: Structural Similarity Index Measure between source and edited images.
    minimum: -1.0
    maximum: 1.0
  lpips:
    type: number
    description: Learned Perceptual Image Patch Similarity between source and edited images.
    minimum: 0.0
    maximum: 1.0
  vllm_description:
    type: string
    description: Text description generated by the VLM for the edited image.
    minLength: 1
additionalProperties: false