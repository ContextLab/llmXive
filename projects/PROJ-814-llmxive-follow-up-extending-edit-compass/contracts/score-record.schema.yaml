$schema: http://json-schema.org/draft-07/schema#
title: ScoreRecord
description: >-
  JSON Schema for validating ScoreRecord instances generated by the
  llmXive automated science pipeline. Matches the Pydantic model
  defined in src/data-models.py.
type: object
required:
  - instance_id
  - logic_score
  - fidelity_score
  - ssim
  - lpips
  - vllm_description
  - p_value_logic
  - p_value_fidelity
  - beta_logic
  - beta_fidelity
properties:
  instance_id:
    type: string
    description: Unique identifier for the edit instance.
    minLength: 1

  logic_score:
    type: number
    description: >-
      Logic Consistency Score (cosine similarity between instruction
      and VLM-generated description). Range typically [-1, 1], but
      post-processed to [0, 1] in some contexts.
    minimum: -1
    maximum: 1

  fidelity_score:
    type: number
    description: >-
      Weighted combination of SSIM and (1 - LPIPS). Range [0, 1].
    minimum: 0
    maximum: 1

  ssim:
    type: number
    description: Structural Similarity Index Measure between source and edited images.
    minimum: 0
    maximum: 1

  lpips:
    type: number
    description: Learned Perceptual Image Patch Similarity (higher = more different).
    minimum: 0
    maximum: 1

  vllm_description:
    type: string
    description: Natural language description of the edited image generated by the VLM.
    minLength: 1

  p_value_logic:
    type: number
    description: P-value for the logic score correlation/regression coefficient.
    minimum: 0
    maximum: 1

  p_value_fidelity:
    type: number
    description: P-value for the fidelity score correlation/regression coefficient.
    minimum: 0
    maximum: 1

  beta_logic:
    type: number
    description: Standardized regression coefficient (beta) for the logic score.

  beta_fidelity:
    type: number
    description: Standardized regression coefficient (beta) for the fidelity score.

  # Optional fields that may be present depending on analysis depth
  human_judgment_score:
    type: number
    description: Optional human judgment score if available.
    minimum: 0
    maximum: 1

  raw_logic_score:
    type: number
    description: Unprocessed logic score before any normalization.

  raw_fidelity_score:
    type: number
    description: Unprocessed fidelity score before any normalization.

  metadata:
    type: object
    description: Optional metadata dictionary.
    additionalProperties: true

additionalProperties: false