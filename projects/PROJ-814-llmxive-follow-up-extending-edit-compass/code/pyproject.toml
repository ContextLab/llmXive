[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "llmXive follow-up: extending Edit-Compass & EditReward-Compass"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.40.0",
    "sentence-transformers>=2.7.0",
    "torch==2.2.2+cpu",
    "llama-cpp-python>=0.2.60",
    "scikit-image>=0.22.0",
    "lpips>=0.1.4",
    "statsmodels>=0.14.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
