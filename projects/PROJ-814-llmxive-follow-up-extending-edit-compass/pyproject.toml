[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-edit-compass"
version = "0.1.0"
description = "Automated science pipeline for Edit-Compass benchmark extension"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "sentence-transformers",
    "torch==2.2.2+cpu",
    "llama-cpp-python",
    "scikit-image",
    "lpips",
    "statsmodels",
    "numpy",
    "scipy",
    "pydantic",
    "huggingface_hub",
    "pillow",
    "pytest",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pytest",
    "pytest-cov"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
select = ['E', 'F', 'W']
ignore = []
line-length = 88
target-version = 'py311'
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "data"
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "-v --strict-markers"