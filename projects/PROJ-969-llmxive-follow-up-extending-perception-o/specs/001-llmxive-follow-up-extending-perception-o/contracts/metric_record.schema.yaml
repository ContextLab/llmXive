$schema: "http://json-schema.org/draft-07/schema#"
title: MetricRecord
type: object
required:
  - model_name
  - condition
  - prejudice_rate
  - holistic_grounding_rate
  - integration_failure_rate
  - n_valid
  - n_invalid
  - n_ambiguous
properties:
  model_name:
    type: string
    description: "Identifier of the MLLM (matches Table 2 of arXiv:2605.22109)."
  condition:
    type: string
    enum: [baseline, context, noise]
    description: "Experimental condition under which metrics were computed."
  prejudice_rate:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Primary PR per spec FR-018: #(correct rating with invalid grounding) / #(correct rating)."
  prejudice_rate_all:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Supplementary selection-bias check: #(invalid grounding) / #(valid predictions), denominator includes all valid predictions regardless of rating correctness."
  rating_accuracy:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of valid predictions whose rating exactly matches the expert label (context for interpreting the PR denominator)."
  holistic_grounding_rate:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of correct ratings with valid grounding (HR)."
  integration_failure_rate:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of outputs that did not cite any injected context phrase (IR)."
  n_valid:
    type: integer
    minimum: 0
    description: "Number of samples included after excluding invalid JSON or timeouts (FR-010)."
  n_invalid:
    type: integer
    minimum: 0
    description: "Number of excluded samples (invalid output)."
  n_ambiguous:
    type: integer
    minimum: 0
    description: "Number of samples flagged with grounding-uncertainty (FR-011)."
  n_correct:
    type: integer
    minimum: 0
    description: "Number of valid samples with a correct (exact-match) rating; the PR denominator (FR-018)."
  grounding_assessment_method:
    type: string
    description: "Method used to assess grounding validity; always 'semantic_similarity' (calibrated, threshold swept per SC-005); no external LLM judge is used."