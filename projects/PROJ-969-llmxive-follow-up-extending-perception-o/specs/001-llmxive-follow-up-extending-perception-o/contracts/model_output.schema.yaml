$schema: "http://json-schema.org/draft-07/schema#"
title: ModelOutput
type: object
required:
  - model_name
  - video_id
  - condition
  - rating
  - reasoning
  - grounding_score
  - context_cited
  - valid_json
properties:
  model_name:
    type: string
    description: "Name of the MLLM (matches Table 2 of arXiv:2605.22109)."
  video_id:
    type: string
    description: "Identifier of the video sample."
  condition:
    type: string
    enum: [baseline, context, noise]
    description: "Prompting condition."
  rating:
    type: integer
    minimum: 1
    maximum: 5
    description: "Trait rating (1‑5)."
  reasoning:
    type: string
    description: "Free-form justification generated by the model."
  grounding_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Numeric grounding confidence (0‑1)."
  context_cited:
    type: boolean
    description: "True if the reasoning references at least one phrase from the injected context."
  valid_json:
    type: boolean
    description: "True if the model output conforms to the expected JSON schema."
