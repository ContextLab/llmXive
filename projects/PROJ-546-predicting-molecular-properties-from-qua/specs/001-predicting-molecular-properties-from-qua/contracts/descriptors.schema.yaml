$schema: 'http://json-schema.org/draft-07/schema#'
title: Molecular Descriptors Schema
description: Schema for validating the descriptors CSV file.
type: array
items:
  type: object
  properties:
    smiles:
      type: string
      description: SMILES string representing the molecule.
    HOMO_energy:
      type: number
      format: float
      description: HOMO energy in eV.
    LUMO_energy:
      type: number
      format: float
      description: LUMO energy in eV.
    mayer_bond_order:
      type: number
      format: float
      description: Averaged Mayer bond order (dimensionless).
    molecule_id:
      type: string
      description: "Unique identifier for the molecule"
  required:
    - smiles
    - HOMO_energy
    - LUMO_energy
    - mayer_bond_order
    - molecule_id