$schema: http://json-schema.org/draft-07/schema#
title: Sensitivity Report Schema
type: object
properties:
  descriptor:
    type: string
    description: "Feature name"
  importance:
    type: number
    description: "Feature importance score"
  cumulative_importance:
    type: number
    description: "Cumulative importance score"
required:
  - descriptor
  - importance
  - cumulative_importance
additionalProperties: false