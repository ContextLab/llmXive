$schema: "http://json-schema.org/draft-07/schema#"
title: "Experimental Barrier Dataset Schema"
description: "Schema for the raw Zenodo input dataset."
type: "object"
properties:
  molecule_id:
    type: "string"
    description: "Unique identifier for the molecule."
  smiles:
    type: "string"
    description: "Canonical SMILES representation."
  experimental_barrier:
    type: "number"
    description: "Experimental barrier height in kcal/mol."
required:
  - molecule_id
  - smiles
  - experimental_barrier
additionalProperties: false
