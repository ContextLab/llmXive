$schema: http://json-schema.org/draft-07/schema#
title: Experimental Barrier Dataset Schema
type: object
properties:
  molecule_id:
    type: string
    description: "Unique identifier for the molecule"
  smiles:
    type: string
    description: "Canonical SMILES representation"
  experimental_barrier:
    type: number
    description: "Experimental barrier height in kcal/mol (treated as gas-phase proxy)"
required:
  - molecule_id
  - smiles
  - experimental_barrier
additionalProperties: false
