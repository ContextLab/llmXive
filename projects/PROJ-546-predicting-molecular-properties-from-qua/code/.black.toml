# Black configuration for PROJ-546-predicting-molecular-properties-from-qua
# Ensures consistent code formatting across the pipeline

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
  | reports
)/
'''
