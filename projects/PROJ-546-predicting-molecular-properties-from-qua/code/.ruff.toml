[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line-too-long (handled by black)
    "B008", # do-not-perform-function-calls-in-argument-defaults (often needed for dataclasses)
]

[lint.isort]
known-first-party = ["download_data", "evaluate_models", "sensitivity_analysis", "train_models", "generate_descriptors", "track_compute_resources", "utils", "validators", "evaluators"]
