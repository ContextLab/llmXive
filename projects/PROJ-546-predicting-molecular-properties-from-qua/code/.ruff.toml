[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (optional strictness)
]
ignore = [
    "ANN001", # Missing type annotation for function argument (too strict for initial pipeline)
    "ANN201", # Missing return type annotation for public function
    "E501",   # Line too long (handled by black)
]
target-version = "py311"
unfixable = [
    "F401", # Unused imports
]
per-file-ignores = {}

[lint.isort]
known-first-party = ["confound_analysis", "create_directories", "download_data", "evaluate_models", "generate_checksums", "generate_descriptors", "lint_format_config", "missing_dof_analysis", "sensitivity_analysis", "setup_directories", "setup_tests_and_docs", "solvent_hydration_analysis", "track_compute_resources", "train_models", "validate_descriptors", "validate_subset_alignment", "utils", "validators", "outputs", "tests"]
force-sort-within-sections = true
lines-after-imports = 2
