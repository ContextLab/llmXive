# Ruff configuration for PROJ-546
# Enforces PEP 8, removes unused imports, and ensures code quality
target-version = "py311"
line-length = 88

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort (import sorting)
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in ML)
]

[lint.isort]
known-first-party = ["download_data", "generate_descriptors", "train_models", "evaluate_models", "sensitivity_analysis", "validators", "utils", "evaluators"]
force-sort-within-sections = true
