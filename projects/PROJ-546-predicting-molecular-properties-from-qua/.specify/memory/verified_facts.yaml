  quote: "The Central Board of Film Certification (CBFC) did not mandate any visual\
    \ cuts for Stree 2. However, the board requested two audio modifications: the\
    \ removal of a celebrity's name and the muting of a national monument's name.\
    \ After these changes, the film was granted a U/A rating and has a runtime of\
    \ 149 minutes. One improvised scene involved Rajkummar Rao singing \"Calm Down\"\
    \ by Rema and Selena Gomez, which led to the producers paying \u20B925 lakh in\
    \ residuals."
