# Ruff configuration file
# This file extends or overrides settings from pyproject.toml if needed.
# Currently, all settings are in pyproject.toml for simplicity,
# but this file exists to satisfy the task requirement for explicit .ruff.toml.
# If specific overrides are needed for the runner environment, they can be added here.

[lint]
# Ensure we use the same rules as pyproject.toml
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501", "B008", "C901"]

[lint.isort]
known-first-party = ["code", "tests"]

[lint.per-file-ignores]
"tests/*" = ["S101"]

[format]
# Use black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"