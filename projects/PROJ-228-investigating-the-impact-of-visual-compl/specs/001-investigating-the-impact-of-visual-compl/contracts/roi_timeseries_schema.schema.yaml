$schema: "http://json-schema.org/draft-07/schema#"
title: "PFC Time-Series Schema"
description: "Schema for data/interim/pfc_timeseries.csv"
type: "object"
properties:
  timepoint:
    type: "integer"
    description: "Timepoint index (TR index)."
  bold_signal_mean:
    type: "number"
    description: "Mean BOLD signal in DLPFC at this timepoint."
  subject_id:
    type: "string"
    description: "Subject identifier."
required:
  - "timepoint"
  - "bold_signal_mean"
  - "subject_id"
additionalProperties: false