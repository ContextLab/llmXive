$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Result Schema"
description: "Schema for data/processed/results.json"
type: "array"
items:
  type: "object"
  properties:
    subject_id:
      type: "string"
      description: "Subject identifier."
    entropy:
      type: "object"
      properties:
        correlation_coefficient:
          type: "number"
          description: "Pearson's r for entropy."
        p_value:
          type: "number"
          description: "Raw p-value for entropy."
        fdr_corrected_p:
          type: "number"
          description: "FDR-corrected p-value for entropy."
        permutation_p:
          type: "number"
          description: "p-value from permutation test for entropy."
        is_significant:
          type: "boolean"
          description: "True if p < 0.05 after correction."
      required:
        - "correlation_coefficient"
        - "p_value"
        - "fdr_corrected_p"
        - "permutation_p"
        - "is_significant"
    fractal:
      type: "object"
      properties:
        correlation_coefficient:
          type: "number"
          description: "Pearson's r for fractal dimension."
        p_value:
          type: "number"
          description: "Raw p-value for fractal dimension."
        fdr_corrected_p:
          type: "number"
          description: "FDR-corrected p-value for fractal dimension."
        permutation_p:
          type: "number"
          description: "p-value from permutation test for fractal dimension."
        is_significant:
          type: "boolean"
          description: "True if p < 0.05 after correction."
      required:
        - "correlation_coefficient"
        - "p_value"
        - "fdr_corrected_p"
        - "permutation_p"
        - "is_significant"
  required:
    - "subject_id"
    - "entropy"
    - "fractal"
additionalProperties: false