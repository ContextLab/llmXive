[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-visual-complexity-pfc"
version = "0.1.0"
description = "Investigating the Impact of Visual Complexity on Prefrontal Cortex Activity"
requires-python = ">=3.11"
dependencies = [
    "nibabel",
    "numpy",
    "scikit-image",
    "scipy",
    "pandas",
    "statsmodels",
    "nilearn",
    "matplotlib",
    "requests",
    "tqdm",
    "pyfd",
    "flake8",
    "black"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.setuptools]
packages = ["code"]