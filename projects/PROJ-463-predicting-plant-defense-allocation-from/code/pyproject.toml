[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-plant-defense"
version = "0.1.0"
description = "Predicting Plant Defense Allocation from Publicly Available Transcriptomic Data"
requires-python = ">=3.11"
dependencies = [
    "rpy2",
    "biopython",
    "scikit-learn",
    "ete3",
    "pydantic",
    "requests",
    "tqdm",
    "pyyaml",
    "seaborn",
    "matplotlib",
    "pandas",
    "numpy",
    "pytest",
    "pytest-cov",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
# Same as Black
line-length = 88
target-version = "py311"

# Assume Python 3.11
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in pydantic)
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "scripts", "setup_directories"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
addopts = "-v --tb=short"
