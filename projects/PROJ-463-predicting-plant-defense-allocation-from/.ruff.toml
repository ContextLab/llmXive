# This file is a duplicate of the ruff config in pyproject.toml
# for environments that prefer a separate config file.
# It mirrors the settings defined in [tool.ruff] in pyproject.toml.

target-version = "py311"
line-length = 100
src = ["code/src", "code/tests", "code/scripts", "code/setup_directories.py"]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "UP",
    "ANN",
]
ignore = [
    "E501",
    "B008",
    "ANN101",
    "ANN102",
]

[lint.per-file-ignores]
"code/tests/*" = ["ANN", "S101"]
"code/scripts/*" = ["ANN"]

[lint.isort]
known-first-party = ["src", "scripts", "setup_directories"]
force-sort-within-sections = true

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
