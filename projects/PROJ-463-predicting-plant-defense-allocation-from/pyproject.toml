[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-defense-allocation"
version = "0.1.0"
description = "Predicting Plant Defense Allocation from Publicly Available Transcriptomic Data"
requires-python = ">=3.11"
dependencies = [
    "rpy2",
    "biopython",
    "scikit-learn",
    "ete3",
    "pydantic",
    "requests",
    "tqdm",
    "pyyaml",
    "seaborn",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["code/src", "code/tests", "code/scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501", # line-too-long (handled by black)
    "B008", # do-not-perform-function-calls-in-argument-defaults (often needed for config)
]

[tool.ruff.lint.per-file-ignores]
"code/tests/*" = ["S101"] # Allow asserts in tests

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "tests"]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false
