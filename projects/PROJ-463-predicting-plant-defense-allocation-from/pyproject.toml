[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-plant-defense"
version = "0.1.0"
description = "Predicting Plant Defense Allocation from Publicly Available Transcriptomic Data"
requires-python = ">=3.11"
dependencies = [
    "rpy2",
    "biopython",
    "scikit-learn",
    "ete3",
    "pydantic",
    "requests",
    "tqdm",
    "pyyaml",
    "seaborn",
    "matplotlib",
    "numpy",
    "pandas",
    "pytest",
    "tomli",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["code/src", "code/tests", "code/scripts", "code/setup_directories.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (basic)
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in CLI)
    "ANN101", # missing-type-self
    "ANN102", # missing-type-cls
]

[tool.ruff.lint.per-file-ignores]
"code/tests/*" = ["ANN", "S101"] # Allow asserts in tests, skip type annotations for speed
"code/scripts/*" = ["ANN"]       # Scripts often have looser typing requirements

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "setup_directories"]
force-sort-within-sections = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: unit tests",
    "integration: integration tests",
    "real_data: tests requiring real data access",
]
