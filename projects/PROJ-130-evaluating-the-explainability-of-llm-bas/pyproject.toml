[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-eval-bug-fixes"
version = "0.1.0"
description = "Evaluating the Explainability of LLM-Based Bug Fixes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers==4.36.0",
    "datasets==2.16.0",
    "captum==0.7.0",
    "scikit-learn==1.4.0",
    "pandas==2.1.0",
    "numpy==1.26.0",
    "sentence-transformers==2.2.2",
    "radon==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "ruff==0.1.6",
    "black==23.12.1",
    "pre-commit==3.6.0",
]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.venv
    | venv
    | __pycache__
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
