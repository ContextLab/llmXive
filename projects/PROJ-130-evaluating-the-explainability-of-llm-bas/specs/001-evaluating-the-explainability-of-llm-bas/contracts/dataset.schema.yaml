$schema: http://json-schema.org/draft-07/schema#
title: Dataset Schema
description: Schema for the Defects4J dataset entries used in the study.
type: object
required:
  - bug_id
  - file_path
  - test_suite
  - reference_text
properties:
  bug_id:
    type: string
    description: Unique identifier for the bug (e.g., "Lang-1").
  file_path:
    type: string
    description: Path to the source file containing the bug relative to the project root.
  test_suite:
    type: array
    items:
      type: string
    description: List of test class/method names that constitute the test suite for this bug.
  reference_text:
    type: string
    description: The original source code text of the buggy file.
