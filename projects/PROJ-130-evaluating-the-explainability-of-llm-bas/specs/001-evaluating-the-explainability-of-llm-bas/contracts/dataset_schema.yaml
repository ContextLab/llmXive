$schema: http://json-schema.org/draft-07/schema#
title: Defects4J Dataset Schema
description: Schema for the Defects4J dataset records used in the pipeline.
type: object
required:
  - bug_id
  - project
  - file_path
  - test_suite
  - reference_text
properties:
  bug_id:
    type: string
    description: Unique identifier for the bug (e.g., "Lang-1")
    pattern: "^[a-zA-Z]+-\\d+$"
  project:
    type: string
    description: Project name within Defects4J (e.g., "Lang", "Math")
  file_path:
    type: string
    description: Path to the source file containing the bug relative to the project root
  test_suite:
    type: array
    items:
      type: string
    description: List of test class/method identifiers to run for validation
  reference_text:
    type: string
    description: The ground truth code or description of the bug context
additionalProperties: false
