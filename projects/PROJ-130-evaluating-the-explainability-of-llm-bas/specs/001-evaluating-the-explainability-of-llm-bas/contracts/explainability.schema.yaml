$schema: http://json-schema.org/draft-07/schema#
title: Explainability Schema
description: Schema for explainability scores derived from model internals and rationales.
type: object
required:
  - bug_id
  - attention_score
  - saliency_score
  - coherence_score
properties:
  bug_id:
    type: string
    description: Reference to the bug.
  attention_score:
    type: number
    description: Aggregated attention weight score for the patch tokens.
  saliency_score:
    type: number
    description: Integrated Gradients saliency magnitude for the patch tokens.
  coherence_score:
    type: number
    description: Semantic similarity score between the generated rationale and the code change.
