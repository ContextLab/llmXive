$schema: http://json-schema.org/draft-07/schema#
title: Statistical Schema
description: Schema for statistical analysis results.
type: object
required:
  - correlation_coeff
  - auc_roc
  - p_value
properties:
  correlation_coeff:
    type: number
    description: Point-biserial correlation coefficient between explainability scores and correctness.
  auc_roc:
    type: number
    description: Area Under the Receiver Operating Characteristic Curve for the predictive model.
  p_value:
    type: number
    description: P-value from hypothesis testing (e.g., t-test), potentially Bonferroni-corrected.