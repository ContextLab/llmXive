$schema: http://json-schema.org/draft-07/schema#
title: Statistical Analysis Result Schema
description: Schema for the final statistical analysis outputs (Correlations, AUC, P-values).
type: object
required:
  - analysis_id
  - method
  - correlation_coeff
  - auc_roc
  - p_value
  - corrected_p_value
  - confound_controlled
  - analysis_timestamp
properties:
  analysis_id:
    type: string
    description: Unique identifier for this analysis run.
  method:
    type: string
    enum: ["attention", "saliency", "coherence"]
    description: The explainability method being analyzed.
  correlation_coeff:
    type: number
    format: float
    description: Point-biserial correlation coefficient between score and correctness.
  auc_roc:
    type: number
    format: float
    minimum: 0.0
    maximum: 1.0
    description: Area Under the ROC Curve for logistic regression predicting correctness.
  p_value:
    type: number
    format: float
    description: Raw p-value from the statistical test.
  corrected_p_value:
    type: number
    format: float
    description: P-value after Bonferroni correction.
  confound_controlled:
    type: boolean
    description: Whether bug complexity and test suite quality were included as covariates.
  analysis_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the analysis.
additionalProperties: false
