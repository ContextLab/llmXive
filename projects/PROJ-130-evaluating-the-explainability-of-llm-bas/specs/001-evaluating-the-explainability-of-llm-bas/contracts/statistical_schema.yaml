$schema: http://json-schema.org/draft-07/schema#
title: Statistical Result Schema
description: Schema for correlation and regression analysis results.
type: object
required:
  - analysis_id
  - timestamp
properties:
  analysis_id:
    type: string
    description: Unique identifier for this analysis run
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the analysis
  correlations:
    type: object
    description: Point-biserial correlations between scores and correctness
    properties:
      attention_correctness:
        type: number
      saliency_correctness:
        type: number
      coherence_correctness:
        type: number
    required:
      - attention_correctness
      - saliency_correctness
      - coherence_correctness
  logistic_regression:
    type: object
    description: Results of logistic regression modeling
    properties:
      auc_roc:
        type: number
        minimum: 0
        maximum: 1
      coefficients:
        type: object
        additionalProperties:
          type: number
    required:
      - auc_roc
  t_tests:
    type: array
    description: Paired t-test results with Bonferroni correction
    items:
      type: object
      properties:
        comparison:
          type: string
          description: e.g., "attention vs saliency"
        t_statistic:
          type: number
        p_value_raw:
          type: number
        p_value_corrected:
          type: number
          description: Bonferroni corrected p-value
      required:
        - comparison
        - t_statistic
        - p_value_raw
        - p_value_corrected
additionalProperties: false