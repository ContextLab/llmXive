$schema: http://json-schema.org/draft-07/schema#
title: Generated Patch Schema
description: Schema for patches generated by the LLM, including rationale.
type: object
required:
  - patch_id
  - bug_id
  - diff_content
  - rationale_text
  - model_revision
  - generation_timestamp
properties:
  patch_id:
    type: string
    description: Unique identifier for the generated patch.
  bug_id:
    type: string
    description: Reference to the bug this patch attempts to fix.
  diff_content:
    type: string
    description: The unified diff content of the proposed fix.
  rationale_text:
    type: string
    description: Natural language explanation of the fix generated by the model.
  model_revision:
    type: string
    description: Git commit hash or version tag of the LLM used.
  generation_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the patch was generated.
additionalProperties: false
