$schema: http://json-schema.org/draft-07/schema#
title: Patch Schema
description: Schema for generated patches and their rationales.
type: object
required:
  - patch_id
  - bug_id
  - diff_content
  - rationale_text
properties:
  patch_id:
    type: string
    description: Unique identifier for the generated patch
  bug_id:
    type: string
    description: Reference to the associated bug
    pattern: "^[a-zA-Z]+-\\d+$"
  diff_content:
    type: string
    description: The unified diff content representing the code change
  rationale_text:
    type: string
    description: Natural language explanation of the fix generated by the LLM
  model_version:
    type: string
    description: Version of the model used to generate the patch
  generation_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of generation
additionalProperties: false
