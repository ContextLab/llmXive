$schema: http://json-schema.org/draft-07/schema#
title: Patch Schema
description: Schema for generated patches and their rationales.
type: object
required:
  - id
  - bug_id
  - diff_content
  - rationale_text
properties:
  id:
    type: string
    description: Unique identifier for the generated patch.
  bug_id:
    type: string
    description: Reference to the bug this patch addresses.
  diff_content:
    type: string
    description: The unified diff string representing the code changes.
  rationale_text:
    type: string
    description: Natural language explanation of why this patch fixes the bug.
