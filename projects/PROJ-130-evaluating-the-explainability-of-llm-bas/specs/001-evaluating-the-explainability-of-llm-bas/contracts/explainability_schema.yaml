$schema: http://json-schema.org/draft-07/schema#
title: Explainability Score Schema
description: Schema for the computed explainability metrics (Attention, Saliency, Coherence).
type: object
required:
  - explainability_id
  - bug_id
  - patch_id
  - attention_score
  - saliency_score
  - coherence_score
  - computation_timestamp
properties:
  explainability_id:
    type: string
    description: Unique identifier for this explainability record.
  bug_id:
    type: string
    description: Reference to the bug.
  patch_id:
    type: string
    description: Reference to the patch.
  attention_score:
    type: number
    format: float
    description: Aggregated attention weight from the model's last decoder layer.
  saliency_score:
    type: number
    format: float
    description: Summed magnitude of Integrated Gradients saliency.
  coherence_score:
    type: ["number", "null"]
    format: float
    minimum: 0.0
    maximum: 1.0
    description: Cosine similarity between rationale text and code change semantics. Null if rationale is missing.
  computation_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when scores were computed.
additionalProperties: false
