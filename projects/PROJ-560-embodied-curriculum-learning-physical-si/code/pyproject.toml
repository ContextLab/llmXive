[project]
name = "embodied-curriculum-learning"
version = "0.1.0"
description = "Statistical engine for embodied curriculum learning analysis"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "scipy",
    "statsmodels",
    "numpy",
    "pyyaml",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["code/src", "code/tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (black handles this)
    "B008", # do not perform function calls in argument defaults (common in CLI)
]

[tool.ruff.lint.per-file-ignores]
"code/tests/*" = ["S101"] # assert statements allowed in tests

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = true
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"
