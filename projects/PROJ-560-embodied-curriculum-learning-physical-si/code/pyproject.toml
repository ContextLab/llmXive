[project]
name = "embodied-curriculum-learning-physical-si"
version = "0.1.0"
description = "Statistical validation pipeline for embodied curriculum learning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "scipy",
    "statsmodels",
    "numpy",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code/src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.pants.d
  | \.pytype
  | \.ruff_cache
  | \.svn
  | \.tox
  | \.venv
  | \.vscode
  | __pypackages__
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | venv
  | data
  | state
  | tests
)/
'''

[tool.ruff]
# Inherit lint settings from ruff.toml or define inline if preferred
# For this project, we use ruff.toml for lint rules and pyproject.toml for formatting metadata
line-length = 100
target-version = "py39"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"