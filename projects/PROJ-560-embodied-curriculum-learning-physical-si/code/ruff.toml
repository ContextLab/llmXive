# Ruff configuration for PROJ-560-embodied-curriculum-learning-physical-si
[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "I", "W", "UP"]
ignore = []

# Allow autofix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Exclude a few files/directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "data",
    "state",
    "tests"
]

# Same as `format.exclude`
extend-exclude = []

# Per-rule configuration
[lint.per-file-ignores]
# Ignore specific rules in test files if necessary
"code/tests/*" = ["S101"]

[lint.isort]
force-single-line = false
force-sort-within-sections = false
known-first-party = ["src"]
relative-imports-order = "closest-to-furthest"
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[lint.pydocstyle]
convention = "google"
