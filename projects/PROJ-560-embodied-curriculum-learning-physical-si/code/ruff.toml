# Ruff configuration for llmXive Embodied Curriculum Learning Project
# This file is deprecated in favor of pyproject.toml but kept for legacy tool compatibility
# as per T003 requirements to explicitly create ruff.toml.

line-length = 88
target-version = "py39"

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
]

[lint.isort]
known-first-party = ["src"]
force-single-line = true
lines-after-imports = 2