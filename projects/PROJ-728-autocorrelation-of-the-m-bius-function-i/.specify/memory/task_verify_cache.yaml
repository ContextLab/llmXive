T006:
  c: true
  h: 52626c3dfc4e55bb3f69d105476714b3396b00a517cd1a2855b693da7153e44b
  r: "The `code/autocorrelation.py` script implements an FFT\u2011based convolution\
    \ (`_compute_autocorrelation_all_fft`) that returns float64 autocorrelations for\
    \ all lags\u202F1\u202F\u2026\u202F\u230AL/2\u230B, iterates over every entry\
    \ of `data/processed/window_index.csv`, and writes the required columns to `data/processed/autocorrelation_raw.csv`,\
    \ which exists and contains the correct header and data."
  sig: 4b62ec4e7fc556bac1854983829df54e3612be54aa2efbccf1029265d0d78415
T007:
  c: false
  h: 7d5182e605988ab00aa8fdcf62725375ed9830ea26fd7f04cda582d165e8009c
  r: "The `code/permutation.py` only implements a block\u2011permutation generator\
    \ and writes an empty CSV header; it does not keep zero positions fixed, does\
    \ not shuffle only the non\u2011zero signs, does not compute autocorrelations,\
    \ p\u2011values, or confidence bounds, and does not use the required per\u2011\
    window seed (`20231017 + window_id`). Consequently `data/processed/autocorrelation_stats.csv`\
    \ contains no statistical rows and the optional `data/processed/permutation_null.npy`\
    \ is missing. The provided unit tests check block\u2011shuffling properties, not\
    \ the required p\u2011value edge\u2011case handling."
  sig: 626678b513c6499806ff6f9fc80c83f7379ca45b942ce2bce40b9dca99a71485
T008:
  c: false
  h: 9a3a3500b0c47b82bbdba249b7710b016441383a53ba6e1b048a9337f0cdaeae
  r: "The unit\u2011test log shows that `_apply_bh_correction` raises a ValueError\
    \ and that after writing the CSV the `adjusted_p_value` column is absent, causing\
    \ two test failures. Consequently the required column is not added to `autocorrelation_stats.csv`\
    \ and the BH correction is not correctly applied."
  sig: 5006d0a7cfcf468cc16f25cc902b37b40ce389578f198dc5200490ceded7012c
