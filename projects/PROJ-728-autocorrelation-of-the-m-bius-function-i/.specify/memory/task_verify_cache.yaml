    \ over every window in `window_index.csv`, and `data/processed/autocorrelation_raw.csv`\
    \ exists (205 MB) with exactly the required columns (`interval_start, interval_length,\
    \ lag, autocorrelation`). The file size is consistent with the expected ~5.55M\
    \ rows (100 windows \xD7 (500+5000+50000) lags), and the sampled values are plausible\
    \ normalized autocorrelations (small values in [\u22121,1], 12-decimal precision),\
    \ not placeholders."
