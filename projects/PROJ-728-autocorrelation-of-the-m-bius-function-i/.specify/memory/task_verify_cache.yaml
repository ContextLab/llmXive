  r: "Checked `quickstart.md` (contains the `--demo` command) and the execution log\
    \ (shows `python -m code.main --demo` exits 0). However the required demo artifacts\
    \ are not all present at the documented locations: `data/raw/mobius_array.npy`\
    \ is missing (the log saved it to `data/mobius_array.npy`), and `outputs/figures/heatmap_demo.png`\
    \ is not found (the log saved it to `figures/heatmap_demo.png`). These missing\
    \ or mis\u2011placed files mean the verification step fails."
