T002:
  c: true
  h: 82cdf4a73ee5d2572c99a1dbc86bf3776bc104bc86e25e0ea843d8a5cfcbf173
  r: "The `code/sieve.py` module implements a linear\u2011time M\xF6bius sieve, the\
    \ generated `data/raw/mobius_array.npy` file contains an int8 array of length\u202F\
    10\u2077\u202F+\u202F1, and the unit tests in `tests/unit/test_sieve.py` all pass,\
    \ confirming correct values, ternary range, packing round\u2011trip, and checksum\
    \ manifest."
  sig: a23bf6e993282aa696a461e41fe71129038636ea0f21ba22e94d3b56cc379a04
T005:
  c: true
  h: 059836bdf63fd50854daa19221ddfc6cd733b12bacbb1cc17f909bc9d92c29cf
  r: "Checked `data/processed/demo_autocorr.csv` (contains a single row with the autocorrelation\
