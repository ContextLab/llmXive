  r: "The `code/permutation.py` only implements a block\u2011permutation generator\
    \ and writes an empty CSV header; it does not keep zero positions fixed, does\
    \ not shuffle only the non\u2011zero signs, does not compute autocorrelations,\
    \ p\u2011values, or confidence bounds, and does not use the required per\u2011\
    window seed (`20231017 + window_id`). Consequently `data/processed/autocorrelation_stats.csv`\
    \ contains no statistical rows and the optional `data/processed/permutation_null.npy`\
    \ is missing. The provided unit tests check block\u2011shuffling properties, not\
    \ the required p\u2011value edge\u2011case handling."
