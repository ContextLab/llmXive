  r: "`code/sieve.py` implements a correct linear-time M\xF6bius sieve (standard prime-list\
    \ sieve with \u03BC(ip)=0 when p|i, else \u2212\u03BC(i)), and `data/raw/mobius_array.npy`\
    \ exists as a real int8 NumPy array of shape (10000001,) \u2014 matching N=10\u2077\
    \ plus the dummy index 0 \u2014 with plausible ternary byte content. `tests/unit/test_sieve.py`\
    \ covers exactly the required known values (\u03BC(1)=1, \u03BC(2)=\u22121, \u03BC\
    (4)=0, \u03BC(30)=\u22121, \u03BC(3025)=0) and the {\u22121,0,1} membership assertion,\
    \ plus dtype/shape checks."
  sig: be7ff459d1d5a216a522d03e0c80ffd9aa63bb95cb741c034b1abebc28012833
