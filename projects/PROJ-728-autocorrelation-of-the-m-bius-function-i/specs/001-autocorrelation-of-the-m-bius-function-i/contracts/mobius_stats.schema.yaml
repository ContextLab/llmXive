$schema: "http://json-schema.org/draft-07/schema#"
title: "Möbius Autocorrelation Statistics"
description: "Schema for the final CSV containing autocorrelation values, permutation‑based p‑values, confidence intervals, and sensitivity flags."
type: object
properties:
  interval_start:
    type: integer
    minimum: 1
    description: "Start index k of the window."
  interval_length:
    type: integer
    enum: [1000, 10000, 100000]
    description: "Length L of the window."
  lag:
    type: integer
    minimum: 1
    description: "Lag h (1 ≤ h ≤ floor(L/2))."
  autocorrelation:
    type: number
    minimum: -1
    maximum: 1
    description: "Normalized autocorrelation value."
  p_value:
    type: number
    exclusiveMinimum: 0
    maximum: 1
    description: "Two‑sided permutation p‑value (1/501 lattice)."
  adjusted_p_value:
    type: number
    exclusiveMinimum: 0
    maximum: 1
    description: "Benjamini–Hochberg FDR‑adjusted p‑value."
  ci_lower:
    type: number
    minimum: -1
    maximum: 1
    description: "2.5th percentile of the null distribution."
  ci_upper:
    type: number
    minimum: -1
    maximum: 1
    description: "97.5th percentile of the null distribution."
  zero_count:
    type: integer
    minimum: 0
    description: "Number of zero entries in the window."
  sensitivity_flag:
    type: string
    enum: ["stable", "sensitive", "not_applicable"]
    description: "Outcome of the zero‑density sensitivity analysis."
  theoretical_variance:
    type: number
    minimum: 0
    description: "Theoretical variance σ²/L under the random‑sign heuristic."
required:
  - interval_start
  - interval_length
  - lag
  - autocorrelation
  - p_value
  - adjusted_p_value
  - ci_lower
  - ci_upper
  - zero_count
  - sensitivity_flag
  - theoretical_variance