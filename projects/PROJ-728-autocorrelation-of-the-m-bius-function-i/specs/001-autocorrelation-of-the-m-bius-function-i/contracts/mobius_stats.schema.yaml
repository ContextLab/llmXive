$schema: "http://json-schema.org/draft-07/schema#"
title: "Autocorrelation Statistics Schema"
description: "Schema for the autocorrelation_stats.csv output file. The p_value field reflects a two‑sided p‑value derived from a **5,000‑permutation** test."
type: object
properties:
  interval_start:
    type: integer
    description: "Starting index k of the window in the Möbius sequence."
    minimum: 1
  interval_length:
    type: integer
    description: "Length L of the window."
    enum: [1000, 10000, 100000]
  lag:
    type: integer
    description: "Lag h (1 <= h <= L/2)."
    minimum: 1
  autocorrelation:
    type: number
    description: "Observed normalized autocorrelation value."
    minimum: -1.0
    maximum: 1.0
  p_value:
    type: number
    description: "Two-sided p-value from the 5,000‑permutation test."
    minimum: 0.0
    maximum: 1.0
  adjusted_p_value:
    type: number
    description: "Benjamini‑Hochberg adjusted p-value."
    minimum: 0.0
    maximum: 1.0
  ci_lower:
    type: number
    description: "2.5th percentile of the null distribution."
    minimum: -1.0
    maximum: 1.0
  ci_upper:
    type: number
    description: "97.5th percentile of the null distribution."
    minimum: -1.0
    maximum: 1.0
  zero_count:
    type: integer
    description: "Number of zeros in the specific window."
    minimum: 0
  sensitivity_flag:
    type: string
    description: "Status of sensitivity analysis."
    enum: ["stable", "sensitive", "not_applicable"]
  theoretical_variance:
    type: number
    description: "Theoretical variance under the Prime Number Theorem (PNT) assumption: σ²/L where σ² = (6/π²)(1 − 6/π²)."
    minimum: 0.0
required:
  - interval_start
  - interval_length
  - lag
  - autocorrelation
  - p_value
  - adjusted_p_value
  - ci_lower
  - ci_upper
  - zero_count
  - sensitivity_flag
  - theoretical_variance
additionalProperties: false