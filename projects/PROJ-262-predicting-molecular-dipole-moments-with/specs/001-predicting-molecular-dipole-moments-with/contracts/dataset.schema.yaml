$schema: "http://json-schema.org/draft-07/schema#"
title: "QM9 Dataset Schema"
type: "object"
properties:
  mol_id:
    type: "string"
    description: "Unique molecule identifier"
  atoms:
    type: "array"
    items:
      type: "object"
      properties:
        element:
          type: "integer"
          description: "Atomic number"
        x:
          type: "number"
          description: "X coordinate (Angstrom)"
        y:
          type: "number"
          description: "Y coordinate (Angstrom)"
        z:
          type: "number"
          description: "Z coordinate (Angstrom)"
      required:
        - element
        - x
        - y
        - z
  bonds:
    type: "array"
    items:
      type: "object"
      properties:
        atom1:
          type: "integer"
          description: "Index of first atom"
        atom2:
          type: "integer"
          description: "Index of second atom"
        order:
          type: "integer"
          description: "Bond order"
      required:
        - atom1
        - atom2
        - order
  dipole_x:
    type: "number"
    description: "Dipole moment x-component (Debye)"
  dipole_y:
    type: "number"
    description: "Dipole moment y-component (Debye)"
  dipole_z:
    type: "number"
    description: "Dipole moment z-component (Debye)"
  dipole_magnitude:
    type: "number"
    description: "Total dipole moment magnitude (Debye)"
  conformer_id:
    type: "string"
    description: "Conformer identifier"
required:
  - mol_id
  - atoms
  - dipole_magnitude
