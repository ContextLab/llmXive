$schema: http://json-schema.org/draft-07/schema#
title: Feature Set Schema
description: Schema for processed molecular features (2D and 3D)
type: object
properties:
  mol_id:
    type: string
    description: Unique molecule identifier
    minLength: 1
  morgan_fp:
    type: array
    items:
      type: integer
    minItems: 2048
    maxItems: 2048
    description: Morgan fingerprint bits (radius=2, nBits=2048)
  topo_counts:
    type: array
    items:
      type: integer
    minItems: 10
    maxItems: 10
    description: Topological counts (atoms, bonds, etc.)
  atom_types_onehot:
    type: array
    items:
      type: array
      items:
        type: number
    minItems: 1
    description: One-hot encoded atom types
  pos_norm:
    type: array
    items:
      type: array
      items:
        type: number
    minItems: 1
    description: Normalized 3D coordinates (Angstroms)
required:
  - mol_id
  - morgan_fp
  - topo_counts
  - atom_types_onehot
  - pos_norm
additionalProperties: false