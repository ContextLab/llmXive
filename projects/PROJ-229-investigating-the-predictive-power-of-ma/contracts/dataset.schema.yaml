type: object
required:
  - material_id
  - composition
  - elemental_count
  - formation_energy
  - density
  - elemental_features
  - graph_features
properties:
  material_id:
    type: string
    description: Unique identifier for the material (e.g., Materials Project ID)
  composition:
    type: string
    description: Chemical formula representation of the material
  elemental_count:
    type: integer
    description: Number of distinct elements present in the composition
  formation_energy:
    type: number
    description: Formation energy per atom (eV)
  density:
    type: number
    description: Density of the material (g/cm³)
  elemental_features:
    type: array
    items:
      type: number
    description: Vector of elemental-level descriptor values
  graph_features:
    type: array
    items:
      type: number
    description: Vector of graph-based descriptor values
additionalProperties: false
metadata:
  target_field: formation_energy
  decision_rationale: >
    Target field selected based on strongest correlation with available
    measurement data across the curated dataset.