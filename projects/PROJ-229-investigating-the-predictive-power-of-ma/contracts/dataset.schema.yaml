$schema: "http://json-schema.org/draft-07/schema#"
title: Dataset Schema
description: Superset schema for the processed dataset. Includes both `melting_point` and `latent_heat` columns to support dynamic target selection.
type: object
properties:
  material_id:
    type: string
    description: Unique identifier for the material (e.g., Materials Project ID).
  formula:
    type: string
    description: Chemical formula of the compound.
  melting_point:
    type:
      - number
      - "null"
    description: Melting point of the material (K). May be null if not available.
  latent_heat:
    type:
      - number
      - "null"
    description: Latent heat of fusion (J/g). May be null if not available.
  # Additional feature columns can be added here as needed.
required:
  - material_id
  - formula
  - melting_point
  - latent_heat
additionalProperties: false