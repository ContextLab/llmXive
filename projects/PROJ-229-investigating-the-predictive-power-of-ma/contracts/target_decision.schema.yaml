$schema: "http://json-schema.org/draft-07/schema#"
title: "Target Decision Schema"
type: object
properties:
  target:
    type: string
    description: "The selected target variable name, e.g., 'latent_heat' or 'melting_point'."
  coefficient:
    type: number
    description: "Pearson correlation coefficient between the two targets."
  decision_rationale:
    type: string
    description: "Explanation for why the target was selected."
  target_override:
    type: boolean
    description: "Flag indicating if the target was manually overridden."
  fallback_triggered:
    type: boolean
    description: "Indicates whether a fallback to the alternative target was triggered."
required:
  - target
  - coefficient
  - decision_rationale
  - fallback_triggered
additionalProperties: false