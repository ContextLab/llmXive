# Schema for the target decision JSON produced by target_consistency_check
# Ensures the selected target property and the correlation metric are recorded.
type: object
properties:
  selected_target:
    type: string
    description: The property chosen as the predictive target.
    enum:
      - latent_heat
      - melting_point
  pearson_r:
    type: number
    description: Pearson correlation coefficient between the two candidate targets.
  fallback_used:
    type: boolean
    description: Whether a fallback decision was required (e.g., insufficient overlap).
required:
  - selected_target
  - pearson_r
  - fallback_used
additionalProperties: false
