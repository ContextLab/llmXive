$schema: "http://json-schema.org/draft-07/schema#"
title: Target Decision Schema
description: |
  Schema for the `target_decision.json` file generated by the
  target consistency check. It records which target variable was selected
  for downstream modeling and includes metadata about the decision
  process.
type: object
additionalProperties: false
required:
  - chosen_target
  - imputation_rate
  - proxy_correlation
  - fallback_flag
properties:
  chosen_target:
    type: string
    description: |
      The target variable selected for modeling. Must be either
      "melting_point" or "latent_heat".
    enum:
      - melting_point
      - latent_heat
  imputation_rate:
    type: number
    description: |
      Fraction of missing values that were imputed in the selected target
      column (value between 0 and 1).
  proxy_correlation:
    type: number
    description: |
      Pearson correlation coefficient between the primary target and the
      proxy target used for decision making.
  fallback_flag:
    type: boolean
    description: |
      Indicates whether the decision fell back to the proxy target due to
      insufficient data for the primary target.<|endoftext|>