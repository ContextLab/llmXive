$schema: "http://json-schema.org/draft-07/schema#"
type: object
description: Schema for validating target_decision.json produced by the target consistency check.
properties:
  target_variable:
    type: string
    description: Name of the target variable selected for modeling (e.g., "melting_point" or "latent_heat").
  correlation:
    type: number
    description: Pearson correlation coefficient between the candidate target and the primary feature set.
  decision:
    type: string
    description: Decision made based on the correlation threshold.
    enum:
      - melting_point
      - latent_heat
  generated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp indicating when the decision file was generated.
required:
  - target_variable
  - correlation
  - decision
  - generated_at
additionalProperties: false