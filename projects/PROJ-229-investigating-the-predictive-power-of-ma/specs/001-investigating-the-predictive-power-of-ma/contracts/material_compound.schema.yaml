$schema: "http://json-schema.org/draft-07/schema#"
title: "MaterialCompound"
type: object
required:
  - compound_id
  - formula
properties:
  compound_id:
    type: string
    description: "Unique identifier from the PCM dataset"
  formula:
    type: string
    description: "Stoichiometric formula (e.g., 'Sb2Te3')"
  elements:
    type: array
    items:
      type: string
    description: "List of element symbols present in the compound"
  melting_point_K:
    type: number
    nullable: true
    description: "Melting point in Kelvin"
  latent_heat_J_per_g:
    type: number
    nullable: true
    description: "Latent heat of fusion (J/g) – primary target if present"
  heat_capacity_J_per_molK:
    type: number
    nullable: true
    description: "Heat capacity at constant pressure (J/mol·K)"
  cif_path:
    type: string
    nullable: true
    description: "Local path to downloaded CIF file for crystal graph generation"
