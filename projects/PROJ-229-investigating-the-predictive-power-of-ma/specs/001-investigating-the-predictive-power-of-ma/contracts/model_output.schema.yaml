$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Output Schema"
description: "Schema for model outputs, including metrics and symbolic formulas."
type: object
properties:
  model_type:
    type: string
    description: "Type of model (e.g., 'RandomForest', 'PySR')."
  metrics:
    type: object
    description: "Performance metrics."
    properties:
      r_squared:
        type: number
      mean_absolute_error:
        type: number
    required:
      - r_squared
      - mean_absolute_error
  feature_importance:
    type: array
    description: "Ranked list of feature importances."
    items:
      type: object
      properties:
        feature:
          type: string
        importance:
          type: number
      required:
        - feature
        - importance
  symbolic_formula:
    type: ["string", "null"]
    description: "Explicit mathematical formula (if applicable)."
  validation_results:
    type: object
    description: "Results from external validation."
    properties:
      ranking_accuracy:
        type: number
      false_positive_rate:
        type: number
    required:
      - ranking_accuracy
      - false_positive_rate
required:
  - model_type
  - metrics
  - feature_importance
additionalProperties: false