$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Output Schema"
description: "Schema for model training results (e.g., model_results.json)"
type: "object"
properties:
  model_id:
    type: "string"
    format: "uuid"
    description: "Unique ID for the model run"
  model_type:
    type: "string"
    enum:
      - "Random Forest"
      - "Gradient Boosting"
      - "PySR"
    description: "Type of model trained"
  r2_score:
    type: "number"
    description: "Coefficient of determination on validation set"
  mae:
    type: "number"
    description: "Mean Absolute Error"
  feature_importance:
    type: "object"
    description: "Map of feature name to importance score"
    additionalProperties:
      type: "number"
  symbolic_formula:
    type: ["string", "null"]
    description: "Explicit mathematical formula if model is PySR"
  training_timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of training completion"
  status:
    type: "string"
    enum:
      - "success"
      - "timeout"
      - "error"
    description: "Status of the training run"
required:
  - model_id
  - model_type
  - r2_score
  - training_timestamp
  - status
additionalProperties: false
