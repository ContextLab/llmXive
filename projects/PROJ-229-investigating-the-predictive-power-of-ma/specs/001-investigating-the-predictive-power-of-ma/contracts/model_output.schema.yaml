# Model Output Schema for Phase-Change Material Predictive Pipeline
# This schema defines the structure of outputs generated by trained models
# including predictions, feature importances, and symbolic formulas.
# Generated for Project: PROJ-229
# Task: T007

schema_version: "1.0.0"
description: >
  Schema for model outputs including baseline predictions, SHAP analysis,
  and PySR symbolic regression results.

metadata:
  source: "code/models/train_baselines.py, code/models/train_symbolic.py"
  generated_by: "code/models/evaluate.py"
  date_format: "ISO8601"

baseline_model_output:
  description: "Output structure for Random Forest and Gradient Boosting models"
  fields:
    - name: model_type
      type: string
      description: "Type of model (e.g., 'RandomForest', 'GradientBoosting')"
      required: true

    - name: model_id
      type: string
      description: "Unique identifier for this model instance"
      required: true
      example: "rf_seed42_fold0"

    - name: hyperparameters
      type: object
      description: "Dictionary of hyperparameters used for training"
      required: true

    - name: performance_metrics
      type: object
      description: "Evaluation metrics on validation set"
      required: true
      properties:
        r_squared:
          type: float
          description: "R^2 score"
          min_value: -1.0
        mean_absolute_error:
          type: float
          description: "MAE in target units"
        root_mean_squared_error:
          type: float
          description: "RMSE in target units"
        fit_time_seconds:
          type: float
          description: "Time taken to train the model"

    - name: feature_importance
      type: list[object]
      description: "Ranked list of feature importances"
      required: true
      items:
        - name: feature_name
          type: string
        - name: importance_score
          type: float
        - name: rank
          type: integer

    - name: shap_analysis
      type: object
      description: "SHAP values and summary statistics"
      required: false
      nullable: true
      properties:
        mean_abs_shap_values:
          type: list[float]
          description: "Mean absolute SHAP values per feature"
        shap_feature_names:
          type: list[string]
          description: "Corresponding feature names"
        summary_plot_path:
          type: string
          description: "Relative path to saved summary plot image"

    - name: predictions
      type: object
      description: "Predictions on test set"
      required: false
      nullable: true
      properties:
        predicted_values:
          type: list[float]
        true_values:
          type: list[float]
        indices:
          type: list[string]
          description: "Material IDs corresponding to predictions"

symbolic_model_output:
  description: "Output structure for PySR symbolic regression models"
  fields:
    - name: model_type
      type: string
      value: "PySR"

    - name: model_id
      type: string
      description: "Unique identifier for this symbolic model"
      required: true

    - name: training_time_seconds
      type: float
      description: "Total time spent training (must be within budget)"
      required: true

    - name: best_score
      type: float
      description: "Complexity-penalized score of the best expression"
      required: true

    - name: expressions
      type: list[object]
      description: "List of top expressions found"
      required: true
      items:
        - name: rank
          type: integer
          description: "Rank by score (1 is best)"
        - name: expression_string
          type: string
          description: "Mathematical expression as a string"
        - name: score
          type: float
          description: "Loss + complexity penalty score"
        - name: complexity
          type: integer
          description: "Number of operators in the expression"
        - name: r_squared
          type: float
          description: "R^2 on validation set"
        - name: derived_formula_path
          type: string
          description: "Path to LaTeX or text file containing the formula"

    - name: convergence_status
      type: string
      description: "Status of the optimization process"
      required: true
      allowed_values:
        - "converged"
        - "timeout"
        - "early_stopped"
        - "failed"

    - name: limitations
      type: list[string]
      description: "List of limitations or warnings (e.g., R^2 < 0.0)"
      required: false
      nullable: true

validation_output:
  description: "Output structure for external validation results"
  fields:
    - name: validation_set_name
      type: string
      description: "Name of the validation dataset (e.g., 'Literature_PCM_50')"
      required: true

    - name: total_samples
      type: integer
      description: "Number of samples in validation set"
      required: true

    - name: generalization_accuracy
      type: float
      description: "Accuracy of derived rules on top-N PCMs"
      required: true
      min_value: 0.0
      max_value: 1.0

    - name: top_n_count
      type: integer
      description: "The N value used for top-N ranking evaluation"
      required: true

    - name: performance_drop_percent
      type: float
      description: "Percentage drop in performance compared to test set"
      required: true

    - name: sensitivity_analysis
      type: object
      description: "Results of sensitivity analysis on thresholds"
      required: false
      nullable: true
      properties:
        threshold_range:
          type: list[float]
        false_positive_rate:
          type: float
        false_negative_rate:
          type: float
        sensitivity:
          type: float
        specificity:
          type: float

aggregation_report:
  description: "Summary report aggregating all model results"
  fields:
    - name: report_id
      type: string
      required: true

    - name: timestamp
      type: string
      format: "date-time"
      required: true

    - name: model_comparison
      type: object
      description: "Comparison of baseline vs symbolic models"
      required: true
      properties:
        best_baseline_r2:
          type: float
        best_symbolic_r2:
          type: float
        t_test_p_value:
          type: float
          description: "P-value from paired t-test (SC-002)"
        conclusion:
          type: string
          description: "Textual conclusion of the comparison"

    - name: associational_framing_note
      type: string
      description: "Explicit statement that findings are correlational, not causal"
      required: true
      fixed_text: >
        "Critical Methodological Note: All findings in this study are strictly
        associational. No causal claims are made regarding the relationship
        between structural features and phase-change suitability."

    - name: artifacts_generated
      type: list[string]
      description: "List of relative paths to generated files (plots, CSVs, reports)"
      required: true