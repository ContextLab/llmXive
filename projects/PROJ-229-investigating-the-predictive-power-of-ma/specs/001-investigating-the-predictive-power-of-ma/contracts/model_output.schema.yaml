# Model Output Schema Definition
# Defines the structure of model training results and predictions
$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  metadata:
    type: object
    properties:
      model_name:
        type: string
      model_type:
        type: string
      version:
        type: string
      created_at:
        type: string
        format: date-time
      training_dataset:
        type: string
      validation_dataset:
        type: string
      hyperparameters:
        type: object
        additionalProperties: true
    required:
      - model_name
      - model_type
      - version
      - created_at
      - training_dataset
  metrics:
    type: object
    properties:
      r_squared:
        type: number
      mean_absolute_error:
        type: number
      mean_squared_error:
        type: number
      root_mean_squared_error:
        type: number
      training_time_seconds:
        type: number
    required:
      - r_squared
      - mean_absolute_error
      - mean_squared_error
      - root_mean_squared_error
  predictions:
    type: array
    items:
      type: object
      properties:
        material_id:
          type: string
        true_value:
          type: number
        predicted_value:
          type: number
        residual:
          type: number
      required:
        - material_id
        - true_value
        - predicted_value
        - residual
  feature_importance:
    type: array
    items:
      type: object
      properties:
        feature_name:
          type: string
        importance_score:
          type: number
      required:
        - feature_name
        - importance_score
required:
  - metadata
  - metrics
  - predictions
  - feature_importance