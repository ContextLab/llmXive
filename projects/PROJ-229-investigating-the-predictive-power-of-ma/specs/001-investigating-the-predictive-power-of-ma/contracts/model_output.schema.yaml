$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Output Schema"
type: "object"
properties:
  model_type:
    type: "string"
    enum:
      - "RandomForest"
      - "GradientBoosting"
      - "PySR"
      - "Lasso"
      - "SHAP"
    description: "Type of model"
  performance_metrics:
    type: "object"
    description: "Dictionary of performance metrics"
    properties:
      r_squared:
        type: "number"
        description: "R² score"
      mse:
        type: "number"
        description: "Mean Squared Error"
      spearman_correlation:
        type: "number"
        description: "Spearman correlation for validation"
    required:
      - "r_squared"
  feature_importance:
    type: "object"
    description: "Dictionary of feature importance scores (for tree-based models)"
    additionalProperties:
      type: "number"
  symbolic_formula:
    type: ["string", "null"]
    description: "Explicit mathematical formula (for PySR or Lasso). Null if not applicable."
  shap_values:
    type: ["array", "null"]
    description: "SHAP values for feature attribution. Null if not applicable."
    items:
      type: "array"
      items:
        type: "number"
required:
  - "model_type"
  - "performance_metrics"
additionalProperties: false
description: "Schema for model output artifacts, including metrics, feature importance, and symbolic formulas."