$schema: "http://json-schema.org/draft-07/schema#"
title: "Validation Result Schema"
description: "Schema for external validation results (validation_report.json)"
type: "object"
properties:
  validation_id:
    type: "string"
    format: "uuid"
    description: "Unique ID for the validation run"
  dataset_source:
    type: "string"
    description: "Source of the external validation set (e.g., Literature PCMs)"
  rank_accuracy:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Accuracy of ranking top N materials by latent heat (N=10)"
  false_positive_rate:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Rate of false positives in the sensitivity sweep"
  rules_applied:
    type: "array"
    items:
      type: "string"
    description: "List of symbolic rules used for validation"
  sensitivity_sweep_range:
    type: "object"
    description: "Range of thresholds swept"
    properties:
      min_threshold:
        type: "number"
      max_threshold:
        type: "number"
    required:
      - min_threshold
      - max_threshold
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of validation"
required:
  - validation_id
  - dataset_source
  - rank_accuracy
  - false_positive_rate
  - timestamp
additionalProperties: false
