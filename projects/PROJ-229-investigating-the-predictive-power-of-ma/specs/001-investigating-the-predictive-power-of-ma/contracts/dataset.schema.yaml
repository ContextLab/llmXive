$schema: "http://json-schema.org/draft-07/schema#"
title: "Featurized Dataset Schema"
description: "Schema for the processed dataset with elemental and graph-based descriptors."
type: object
properties:
  material_id:
    type: string
    description: "Unique identifier for the material."
  formula:
    type: string
    description: "Chemical formula of the material."
  melting_point:
    type: number
    description: "Melting point in Kelvin."
  latent_heat:
    type: ["number", "null"]
    description: "Latent heat of fusion in J/g (may be null)."
  elemental_descriptors:
    type: object
    description: "Computed elemental features."
    properties:
      atomic_mass_mean:
        type: number
      electronegativity_mean:
        type: number
      radius_mean:
        type: number
      periodic_group_mean:
        type: number
      periodic_period_mean:
        type: number
    required:
      - atomic_mass_mean
      - electronegativity_mean
      - radius_mean
      - periodic_group_mean
      - periodic_period_mean
  graph_descriptors:
    type: object
    description: "Computed graph-based features."
    properties:
      bond_density:
        type: number
      symmetry_operations:
        type: integer
    required:
      - bond_density
      - symmetry_operations
  collinearity_flags:
    type: array
    description: "Flags for definitionally dependent features."
    items:
      type: string
required:
  - material_id
  - formula
  - melting_point
  - elemental_descriptors
  - graph_descriptors
additionalProperties: false