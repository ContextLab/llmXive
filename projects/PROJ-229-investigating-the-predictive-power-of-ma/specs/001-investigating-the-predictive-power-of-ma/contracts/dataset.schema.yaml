$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required: [material_id, composition, latent_heat_J_per_g, melting_point_K, heat_capacity_J_per_mol_K, source]
properties:
  material_id:
    type: string
    description: "Unique identifier for the material (e.g., formula or database ID)."
  composition:
    type: string
    description: "Chemical formula (e.g., 'BaTiO3')."
  latent_heat_J_per_g:
    type: number
    description: "Latent heat of fusion (J/g). May be missing; imputed values are flagged."
  melting_point_K:
    type: number
    description: "Melting temperature in Kelvin."
  heat_capacity_J_per_mol_K:
    type: number
    description: "Heat capacity at constant pressure."
  source:
    type: string
    enum: [literature, computed]
    description: "Origin of the thermodynamic measurements."
  structure_id:
    type: string
    description: "Optional identifier for an associated crystal structure (if available)."
  notes:
    type: string
    description: "Optional free‑form notes (e.g., imputation flag)."
