# Dataset Schema Definition
# Defines the structure of processed datasets used for training and validation
$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  metadata:
    type: object
    properties:
      dataset_name:
        type: string
      version:
        type: string
      created_at:
        type: string
        format: date-time
      source:
        type: string
      total_compounds:
        type: integer
        minimum: 0
      target_column:
        type: string
      features:
        type: array
        items:
          type: string
    required:
      - dataset_name
      - version
      - created_at
      - source
      - total_compounds
      - target_column
      - features
  data:
    type: array
    items:
      type: object
      properties:
        material_id:
          type: string
        formula:
          type: string
        target_value:
          type: number
        features:
          type: object
          additionalProperties: true
      required:
        - material_id
        - formula
        - target_value
        - features
required:
  - metadata
  - data
