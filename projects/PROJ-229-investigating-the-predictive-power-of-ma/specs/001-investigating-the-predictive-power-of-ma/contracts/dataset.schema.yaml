$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema"
description: "Schema for the processed features dataset (features.parquet)"
type: "object"
properties:
  material_id:
    type: "string"
    description: "Unique identifier for the compound (e.g., mp-12345)"
  formula:
    type: "string"
    description: "Chemical formula"
  melting_point:
    type: "number"
    description: "Melting point in Kelvin"
  latent_heat:
    type: ["number", "null"]
    description: "Latent heat in J/g. Can be null if not available."
  space_group:
    type: "string"
    description: "Space group symbol"
  crystal_system:
    type: "string"
    description: "Crystal system (e.g., cubic, hexagonal)"
  elemental_descriptors:
    type: "object"
    description: "Computed elemental properties"
    properties:
      avg_electronegativity:
        type: "number"
      avg_atomic_radius:
        type: "number"
      atomic_mass:
        type: "number"
    required:
      - avg_electronegativity
      - avg_atomic_radius
  graph_features:
    type: "array"
    description: "Flattened graph adjacency or symmetry features"
    items:
      type: "number"
  source:
    type: "string"
    enum:
      - "Materials Project"
      - "NIST"
      - "Literature"
  collinearity_flag:
    type: "boolean"
    description: "True if any predictor has VIF > 5"
required:
  - material_id
  - formula
  - melting_point
  - elemental_descriptors
  - source
additionalProperties: false
