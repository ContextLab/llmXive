$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema for Phase-Change Materials"
type: "object"
properties:
  mp_id:
    type: "string"
    description: "Unique identifier from Materials Project"
  formula:
    type: "string"
    description: "Chemical formula"
  melting_point:
    type: ["number", "null"]
    description: "Melting point in Kelvin"
  heat_capacity:
    type: ["number", "null"]
    description: "Heat capacity at constant pressure (J/mol·K)"
  latent_heat:
    type: ["number", "null"]
    description: "Latent heat of fusion (J/mol). May be null if imputed or unavailable."
  structure:
    type: "object"
    description: "Crystal structure data"
    properties:
      lattice:
        type: "array"
        items:
          type: "number"
      fractional_coordinates:
        type: "array"
        items:
          type: "array"
          items:
            type: "number"
  elemental_descriptors:
    type: "object"
    description: "Dictionary of computed elemental properties"
    additionalProperties:
      type: "number"
  structural_descriptors:
    type: "object"
    description: "Dictionary of computed structural properties"
    additionalProperties:
      type: "number"
required:
  - "mp_id"
  - "formula"
  - "elemental_descriptors"
  - "structural_descriptors"
additionalProperties: false
description: "Schema for the processed dataset containing materials data and computed features. All numeric fields must be finite (no nan/inf). This schema includes both potential target columns (melting_point, latent_heat) to support dynamic target selection."