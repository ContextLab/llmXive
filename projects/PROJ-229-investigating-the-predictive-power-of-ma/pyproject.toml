[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-proj-229"
version = "0.1.0"
description = "Investigating the Predictive Power of Machine Learning for Identifying Novel Phase-Change Materials"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.2.0,<2.0.0",
    "pymatgen>=2023.0.0,<2024.0.0",
    "pysr>=0.12.0,<1.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "requests>=2.31.0,<3.0.0",
    "pyyaml>=6.0,<7.0.0",
    "mp-api>=0.35.0,<1.0.0",
    "datasets>=2.14.0,<3.0.0",
    "psutil>=5.9.0,<6.0.0",
    "pytest>=7.3.0,<8.0.0",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true