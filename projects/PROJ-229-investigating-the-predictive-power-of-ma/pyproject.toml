[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-pcm-project"
version = "0.1.0"
description = "Investigating the Predictive Power of Machine Learning for Identifying Novel Phase-Change Materials"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymatgen",
    "scikit-learn",
    "pysr",
    "shap",
    "pandas",
    "numpy",
    "matplotlib",
    "requests",
    "pyyaml",
    "black",
    "flake8",
    "isort",
    "pytest",
    "psutil"
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["code"]
skip = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist"
]

[tool.flake8]
max-line-length = 88
extend-ignore = "E203, W503"
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "__pycache__"
]
per-file-ignores = [
    "__init__.py:F401"
]
max-complexity = 15
count = true
show-source = true
statistics = true
