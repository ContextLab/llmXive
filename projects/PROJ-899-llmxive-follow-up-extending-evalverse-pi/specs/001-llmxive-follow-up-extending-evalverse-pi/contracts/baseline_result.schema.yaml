$schema: http://json-schema.org/draft-07/schema#
title: Baseline Result Schema
description: Schema for data/processed/baseline_predictions.csv
type: object
properties:
  dimension:
    type: string
    description: "Name of the video dimension"
  predictor_type:
    type: string
    description: "Type of baseline ('mean' or 'shuffled')"
  rmse:
    type: number
    description: "Root Mean Squared Error"
  r2:
    type: number
    description: "R-squared score"
required:
  - dimension
  - predictor_type
  - rmse
  - r2
additionalProperties: false