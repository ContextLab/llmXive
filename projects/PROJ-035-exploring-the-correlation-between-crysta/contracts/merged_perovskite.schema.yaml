$schema: http://json-schema.org/draft-07/schema#
title: Merged Perovskite Dataset Schema
description: Schema for the merged perovskite crystal structure and thermal conductivity dataset.
type: object
properties:
  structure_id:
    type: string
    description: Unique identifier for the crystal structure (e.g., Materials Project ID).
    minLength: 1
  thermal_conductivity:
    type: number
    description: Thermal conductivity value in W/(m·K).
    minimum: 0
  source_reference:
    type: string
    description: Reference for the thermal data (DOI, PMID, or NIST ID).
    pattern: ^(10\\.\\d{4}/.*|10\\.\\d{4}/\\d+|NIST-[A-Z0-9]+)$
  chemistry_class:
    type: string
    description: Classification of the perovskite (oxide, halide, nitride).
    enum:
      - oxide
      - halide
      - nitride
  temperature:
    type: number
    description: Temperature at which thermal conductivity was measured (K).
  tilting_angle:
    type: number
    description: Octahedral tilting angle in degrees.
  bond_length_variance:
    type: number
    description: Variance of bond lengths in the structure.
  tolerance_factor:
    type: number
    description: Goldschmidt tolerance factor.
  unit_cell_volume:
    type: number
    description: Unit cell volume in Å³.
required:
  - structure_id
  - thermal_conductivity
  - source_reference
  - chemistry_class
  - temperature
  - tilting_angle
  - bond_length_variance
  - tolerance_factor
  - unit_cell_volume
additionalProperties: false
