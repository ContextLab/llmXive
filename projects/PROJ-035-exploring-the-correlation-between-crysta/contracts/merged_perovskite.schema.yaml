$schema: http://json-schema.org/draft-07/schema#
title: Merged Perovskite Dataset Schema
description: >
  Schema for the merged perovskite dataset containing crystal structure
  and thermal conductivity data. Used for validation of data ingestion
  and cleaning pipelines (FR-002, FR-010).
type: object
required:
  - structure_id
  - thermal_conductivity
  - source_reference
  - chemistry_class
  - temperature
  - tilting_angle
  - bond_length_variance
  - tolerance_factor
  - unit_cell_volume
properties:
  structure_id:
    type: string
    description: >
      Unique identifier for the crystal structure. Typically the
      Materials Project ID (e.g., mp-1234) or a generated UUID.
    minLength: 1
  thermal_conductivity:
    type: number
    description: >
      Thermal conductivity value in W/(m·K). Must be a non-negative float.
      Normalized to 300K if applicable.
    minimum: 0
  source_reference:
    type: string
    description: >
      Provenance reference for the data point. Must be a valid DOI,
      PMID, or NIST ID (e.g., '10.1038/s41563-020-00892-3', 'NIST-XYZ123').
    pattern: '^(10\.\d{4}/.*|10\.\d{4}/\d+|NIST-[A-Z0-9]+)$'
  chemistry_class:
    type: string
    description: >
      Classification of the perovskite material.
      Allowed values: 'oxide', 'halide', 'nitride'.
    enum:
      - oxide
      - halide
      - nitride
  temperature:
    type: number
    description: >
      Temperature at which the thermal conductivity was measured (in Kelvin).
      Should be close to 300K after normalization.
    minimum: 0
  tilting_angle:
    type: number
    description: >
      Octahedral tilting angle in degrees. Calculated from crystal structure.
      May be null if not calculable for specific structures.
    minimum: 0
  bond_length_variance:
    type: number
    description: >
      Variance of bond lengths within the octahedron. Calculated metric.
      Must be non-negative.
    minimum: 0
  tolerance_factor:
    type: number
    description: >
      Goldschmidt tolerance factor. Dimensionless metric for perovskite stability.
      Typically ranges between 0.8 and 1.1 for stable perovskites.
  unit_cell_volume:
    type: number
    description: >
      Volume of the unit cell in cubic Angstroms (Å³).
      Must be positive.
    minimum: 0
additionalProperties: false