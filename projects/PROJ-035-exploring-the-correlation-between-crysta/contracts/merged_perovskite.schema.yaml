$schema: http://json-schema.org/draft-07/schema#
title: Merged Perovskite Dataset Schema
description: >
  JSON Schema for validating the merged_perovskite.csv dataset.
  This schema ensures data integrity for the correlation analysis between
  crystal structure and thermal conductivity in perovskites.
type: object
required:
  - properties
  - definitions
properties:
  properties:
    type: array
    items:
      type: object
      required:
        - structure_id
        - formula
        - chemistry_class
        - thermal_conductivity
        - temperature
        - source_reference
      properties:
        structure_id:
          type: string
          description: "Unique identifier for the crystal structure (e.g., mp-1234)"
          pattern: "^mp-\\d+$"
        formula:
          type: string
          description: "Chemical formula in standard notation (e.g., SrTiO3)"
          pattern: "^[A-Z][a-z]?\\d*(?:[A-Z][a-z]?\\d*)*$"
        chemistry_class:
          type: string
          description: "Classification of the perovskite type"
          enum:
            - oxide
            - halide
            - nitride
        thermal_conductivity:
          type: number
          description: "Thermal conductivity in W/(m·K)"
          minimum: 0
        temperature:
          type: number
          description: "Measurement temperature in Kelvin"
          minimum: 0
        tolerance_factor:
          type: number
          description: "Goldschmidt tolerance factor"
          minimum: 0
          maximum: 2
        octahedral_tilting:
          type: number
          description: "Average octahedral tilting angle in degrees"
          minimum: 0
          maximum: 90
        bond_length_variance:
          type: number
          description: "Variance of bond lengths in the octahedron"
          minimum: 0
        unit_cell_volume:
          type: number
          description: "Unit cell volume in Å³"
          minimum: 0
        source_reference:
          type: string
          description: "DOI, PMID, or NIST ID of the source"
          pattern: "^(10\\.\\d{4}/.*|10\\.\\d{4}/\\d+|NIST-[A-Z0-9]+)$"
        provenance_status:
          type: string
          enum:
            - valid
            - invalid
            - missing
        normalized_thermal_conductivity:
          type: number
          description: "Thermal conductivity normalized to 300K using Slack formula"
          minimum: 0
        vif_score:
          type: number
          description: "Variance Inflation Factor for this entry's predictors"
          minimum: 1
      additionalProperties: false
  definitions:
    type: object
    properties:
      version:
        type: string
        const: "1.0.0"
      created_at:
        type: string
        format: date-time
      author:
        type: string
        const: "llmXive Pipeline"
      license:
        type: string
        const: "MIT"
    required:
      - version
      - created_at
      - author
      - license