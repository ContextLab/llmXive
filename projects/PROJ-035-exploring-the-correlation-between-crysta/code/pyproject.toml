[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-perovskites"
version = "0.1.0"
description = "Exploring the Correlation Between Crystal Structure and Thermal Conductivity in Perovskites"
requires-python = ">=3.9"
dependencies = [
    "pymatgen==2023.9.1",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.0",
    "statsmodels==0.14.2",
    "matplotlib==3.9.0",
    "seaborn==0.13.2",
    "requests==2.32.3",
    "tqdm==4.66.5",
    "pytest"
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | \.eggs
    | \.egg-info
)/
'''

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"