[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | models
    | docs
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["config", "utils", "seed", "ingestion", "features", "models", "evaluation", "visualization"]
skip = ["data", "models", "docs"]
