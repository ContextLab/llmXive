[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solder-hardness-pipeline"
version = "0.1.0"
description = "Predicting the Impact of Composition on the Vickers Hardness of Solder Alloys"
requires-python = ">=3.9"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | \.eggs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ingestion", "features", "models", "evaluation", "visualization", "utils"]
known_third_party = ["pandas", "numpy", "sklearn", "xgboost", "shap", "matplotlib", "yaml", "requests", "compositional", "pdfplumber", "pytest", "mendeleev", "statsmodels"]
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
