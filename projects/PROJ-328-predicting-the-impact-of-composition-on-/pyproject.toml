[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solder-hardness-pipeline"
version = "0.1.0"
description = "Predicting the impact of composition on the Vickers hardness of solder alloys"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "shap>=0.43.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "compositional>=0.2.0",
    "pdfplumber>=0.9.0",
    "pytest>=7.4.0",
    "flake8>=6.1.0",
    "black>=23.0.0",
    "mendeleev>=0.16.0",
    "statsmodels>=0.14.0",
    "tomli>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["code.*"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
)/
'''

[tool.pytest.ini_options]
testpaths = ["code/tests", "tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.isort]
profile = "black"
line_length = 88