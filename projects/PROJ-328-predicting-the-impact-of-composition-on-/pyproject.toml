[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-solder-hardness"
version = "0.1.0"
description = "Predicting the Impact of Composition on the Vickers Hardness of Solder Alloys"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "scikit-learn",
    "xgboost",
    "shap",
    "numpy",
    "matplotlib",
    "pyyaml",
    "requests",
    "compositional>=0.2.0",
    "pdfplumber",
    "mendeleev",
]
dynamic = ["optional-dependencies"]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "black",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["*"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | data
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests", "code/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["data/", ".venv/"]