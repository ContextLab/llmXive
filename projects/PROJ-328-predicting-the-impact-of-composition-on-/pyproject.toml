[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solder-hardness-pipeline"
version = "0.1.0"
description = "Predicting the Impact of Composition on Vickers Hardness of Solder Alloys"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "scikit-learn",
    "xgboost",
    "shap",
    "numpy",
    "matplotlib",
    "pyyaml",
    "requests",
    "compositional>=0.2.0",
    "pdfplumber",
    "mendeleev",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "black",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.setuptools]
packages = ["code"]
package-dir = {"" = "code"}
include-package-data = true
package-data = {"code" = ["**/*.py"]}
