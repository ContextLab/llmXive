[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solder-hardness-pipeline"
version = "0.1.0"
description = "Predicting the impact of composition on the Vickers hardness of solder alloys"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "scikit-learn",
    "xgboost",
    "shap",
    "numpy",
    "matplotlib",
    "pyyaml",
    "requests",
    "compositional==0.2.0",
    "pdfplumber",
    "pytest",
    "flake8",
    "black",
    "mendeleev",
    "statsmodels",
    "tomli",
    "configparser"
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
