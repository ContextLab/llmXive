[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-solder-hardness"
version = "0.1.0"
description = "Predicting the Impact of Composition on the Vickers Hardness of Solder Alloys"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "scikit-learn",
    "xgboost",
    "shap",
    "numpy",
    "matplotlib",
    "pyyaml",
    "requests",
    "compositional==0.2.0",
    "pdfplumber",
    "mendeleev",
    "statsmodels",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "black",
    "isort",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["code"]
include = ["*"]