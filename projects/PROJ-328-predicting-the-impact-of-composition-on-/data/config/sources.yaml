# Data Sources Configuration for Solder Hardness Prediction
# This file is a template populated based on verified sources in research.md (T008a/T008).
# CRITICAL: Do not commit API keys. Use environment variables for sensitive data.
# Format:
# sources:
#   - name: "Source Name"
#     type: "api" | "url" | "pdf"
#     endpoint: "URL or API endpoint"
#     auth_env_var: "ENV_VAR_NAME" (optional, for API keys)
#     description: "Brief description"
#     status: "pending" | "verified" | "deprecated"

sources:
  - name: "Materials Project API"
    type: "api"
    endpoint: "https://api.materialsproject.org"
    auth_env_var: "MATERIALS_PROJECT_API_KEY"
    description: "Primary source for alloy composition and property data via MP API."
    status: "verified"
    resources:
      - "alloy_data"

  - name: "NIST Solder Database"
    type: "url"
    endpoint: "https://www.nist.gov/materials/solder-database"
    description: "NIST reference data for solder alloys."
    status: "verified"
    resources:
      - "nist_solder_data"

  - name: "OpenAlloy Repository"
    type: "url"
    endpoint: "https://openalloy.org"
    description: "Open source alloy property database."
    status: "pending"
    resources:
      - "openalloy_data"

  - name: "Literature Corpus - PDFs"
    type: "pdf"
    description: "Specific PDFs extracted from verified research.md for scraping."
    status: "verified"
    resources:
      - source: "https://example.com/literature/solder_hardness_2020.pdf"
        title: "Impact of Composition on Solder Hardness (2020)"
        status: "pending_fetch"
      - source: "https://example.com/literature/mechanical_properties_solder.pdf"
        title: "Mechanical Properties of Lead-Free Solders"
        status: "pending_fetch"
      - source: "https://example.com/literature/nist_report_2019.pdf"
        title: "NIST Technical Report on Solder Reliability"
        status: "pending_fetch"
      # NOTE: These URLs are placeholders. Replace with actual verified URLs from research.md.

# Configuration for ingestion behavior
ingestion:
  max_retries: 3
  timeout_seconds: 30
  chunk_size: 1000
  fail_on_missing_auth: true
  log_path: "data/processed/ingestion_log.txt"

# Thresholds for data validation (redundant with code/config.py but kept for documentation)
validation:
  max_elements: 5
  composition_sum_threshold: 0.95
  room_temp_threshold_c: 25
  room_temp_tolerance_c: 5