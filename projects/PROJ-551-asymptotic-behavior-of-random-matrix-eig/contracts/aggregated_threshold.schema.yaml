$schema: "http://json-schema.org/draft-07/schema#"
title: AggregatedThreshold
description: "Schema for aggregated statistics of outlier emergence across multiple runs."
type: object
properties:
  N:
    type: integer
    description: "Matrix dimension."
  k:
    type: integer
    description: "Rank of the perturbation."
  pattern_type:
    type: string
    enum: ["diagonal", "block-sparse", "random-sparse"]
    description: "The structural pattern of the perturbation."
  total_runs:
    type: integer
    minimum: 0
    description: "Total number of runs in the group."
  outlier_count:
    type: integer
    minimum: 0
    description: "Number of runs where an outlier was detected."
  outlier_probability:
    type: number
    minimum: 0
    maximum: 1
    description: "Empirical probability of outlier emergence."
  mean_deviation:
    type: number
    description: "Mean deviation of the top eigenvalue from the bulk edge."
  std_deviation:
    type: number
    description: "Standard deviation of the top eigenvalue."
  theta_c_estimate:
    type: number
    description: "The estimated critical threshold theta_c."
  theta_c_confidence:
    type: object
    properties:
      lower: { type: number }
      upper: { type: number }
    required: [lower, upper]
    description: "Confidence interval for the critical threshold estimate."
required: [N, k, pattern_type, total_runs, outlier_count, outlier_probability, mean_deviation, std_deviation, theta_c_estimate, theta_c_confidence]
