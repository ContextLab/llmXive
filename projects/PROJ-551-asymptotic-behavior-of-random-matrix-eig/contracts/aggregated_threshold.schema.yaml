$schema: http://json-schema.org/draft-07/schema#
title: AggregatedThreshold
description: >
  Aggregated statistics for one (N, k, pattern_type) configuration group.
  Self-contained: no external $ref.
type: object
required:
  - N
  - k
  - pattern_type
  - total_runs
  - outlier_count
  - outlier_probability
  - mean_deviation
  - std_deviation
  - theta_c_estimate
  - theta_c_confidence
properties:
  N:
    type: integer
    minimum: 1
  k:
    type: integer
    minimum: 0
  pattern_type:
    type: string
    enum: [diagonal, block-sparse, random-sparse]
  total_runs:
    type: integer
    minimum: 0
  outlier_count:
    type: integer
    minimum: 0
  outlier_probability:
    type: number
    minimum: 0
    maximum: 1
  mean_deviation:
    type: number
  std_deviation:
    type: number
    minimum: 0
  theta_c_estimate:
    type: number
    description: Estimated critical perturbation norm for outlier emergence.
  theta_c_confidence:
    description: Confidence interval for theta_c (object with lower/upper or a string).
    oneOf:
      - type: object
        properties:
          lower:
            type: number
          upper:
            type: number
      - type: string
  theta_c_statistical:
    type: number
