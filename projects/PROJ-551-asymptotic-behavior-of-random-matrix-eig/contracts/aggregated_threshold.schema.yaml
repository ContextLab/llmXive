$schema: "http://json-schema.org/draft-07/schema#"
$id: "aggregated_threshold.schema.yaml"
title: AggregatedThreshold
description: >
  Aggregated statistics for one (N, k, pattern_type) configuration group:
  outlier counts/probabilities across the theta sweep and the estimated
  critical threshold theta_c with its confidence interval.
type: object
required:
  - N
  - k
  - pattern_type
  - total_runs
  - outlier_count
  - outlier_probability
  - mean_deviation
  - std_deviation
  - theta_c_estimate
  - theta_c_confidence
properties:
  N:
    type: integer
    minimum: 1
  k:
    type: integer
    minimum: 0
  pattern_type:
    type: string
    minLength: 1
  total_runs:
    type: integer
    minimum: 0
  outlier_count:
    type: integer
    minimum: 0
  outlier_probability:
    type: number
    minimum: 0
    maximum: 1
  mean_deviation:
    type: number
  std_deviation:
    type: number
    minimum: 0
  theta_c_estimate:
    type: number
  theta_c_confidence:
    description: >
      Confidence interval for theta_c. Either an object with lower/upper
      bounds or a two-element array.
    oneOf:
      - type: object
        properties:
          lower:
            type: number
          upper:
            type: number
        required:
          - lower
          - upper
        additionalProperties: true
      - type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
additionalProperties: true
