$schema: "http://json-schema.org/draft-07/schema#"
title: EigenvalueResult
description: "Schema for an individual eigenvalue measurement."
type: object
properties:
  run_id:
    type: string
    description: "Unique identifier for the simulation run this eigenvalue belongs to."
  eigenvalue_index:
    type: integer
    description: "The index of the eigenvalue (0 = largest)."
  value:
    type: number
    description: "The computed eigenvalue."
  is_outlier:
    type: boolean
    description: "Whether the eigenvalue is considered an outlier based on the theoretical edge."
  theoretical_bbp:
    type: number
    description: "The theoretical BBP threshold for the given parameters."
  deviation:
    type: number
    description: "The distance from the theoretical bulk edge."
required: [run_id, eigenvalue_index, value, is_outlier, theoretical_bbp, deviation]
