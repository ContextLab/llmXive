$schema: http://json-schema.org/draft-07/schema#
title: EigenvalueResult
description: >
  A single eigenvalue record produced by a simulation run. Self-contained:
  no external $ref.
type: object
required:
  - run_id
  - eigenvalue_index
  - value
  - is_outlier
  - theoretical_bbp
  - deviation
properties:
  run_id:
    type: string
    minLength: 1
  eigenvalue_index:
    type: integer
    minimum: 0
  value:
    type: number
    description: Computed eigenvalue.
  is_outlier:
    type: boolean
    description: True iff value > 2.0 + 0.05 (theoretical semicircle edge + tolerance).
  theoretical_bbp:
    type: number
    description: BBP-predicted outlier location for this perturbation, if any.
  deviation:
    type: number
    description: Deviation of the eigenvalue from the theoretical edge (2.0).
  timestamp:
    type: string
