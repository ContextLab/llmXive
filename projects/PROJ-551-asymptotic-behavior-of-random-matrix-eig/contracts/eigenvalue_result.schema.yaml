$schema: "http://json-schema.org/draft-07/schema#"
$id: "eigenvalue_result.schema.yaml"
title: "EigenvalueResult"
type: object
required:
  - run_id
  - eigenvalue_index
  - value
  - is_outlier
  - theoretical_bbp
  - deviation
properties:
  run_id:
    type: string
  eigenvalue_index:
    type: integer
  value:
    type: number
  is_outlier:
    type: boolean
  theoretical_bbp:
    type: number
  deviation:
    type: number
additionalProperties: false
