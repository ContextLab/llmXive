$schema: "http://json-schema.org/draft-07/schema#"
title: EigenvalueResult
description: >
  Individual eigenvalue measurement from a SimulationRun.  The schema
  captures the value, its index, and whether it is flagged as an outlier.
type: object
required:
  - run_id
  - eigenvalue_index
  - value
  - is_outlier
  - theoretical_bbp
  - deviation
properties:
  run_id:
    type: string
    description: Identifier of the parent SimulationRun.
  eigenvalue_index:
    type: integer
    minimum: 1
    description: 1‑based index of the eigenvalue (largest = 1).
  value:
    type: number
    description: Numeric eigenvalue.
  is_outlier:
    type: boolean
    description: Flag set by the theoretical rule (value > 2.0 + 0.05).
  theoretical_bbp:
    type: number
    description: The perturbation norm theta supplied for the run.
  deviation:
    type: number
    description: Difference between the eigenvalue and the supplied theta.
additionalProperties: true
