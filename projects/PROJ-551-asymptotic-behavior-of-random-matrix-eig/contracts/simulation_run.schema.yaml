$schema: "http://json-schema.org/draft-07/schema#"
title: SimulationRun
type: object
required:
  - run_id
  - timestamp
  - seed
  - N
  - k
  - theta
  - pattern_type
  - support_density
  - computation_time_ms
  - empirical_bulk_edge
  - eigenvalues
properties:
  run_id:
    type: string
    format: uuid
  timestamp:
    type: string
    format: date-time
  seed:
    type: integer
  N:
    type: integer
  k:
    type: integer
  theta:
    type: number
  pattern_type:
    type: string
  support_density:
    type: number
  computation_time_ms:
    type: number
  empirical_bulk_edge:
    type: number
  eigenvalues:
    type: array
    items:
      $ref: "#/definitions/eigenvalue"
additionalProperties: true
definitions:
  eigenvalue:
    type: object
    required:
      - run_id
      - eigenvalue_index
      - value
      - is_outlier
      - theoretical_bbp
      - deviation
    properties:
      run_id:
        type: string
      eigenvalue_index:
        type: integer
      value:
        type: number
      is_outlier:
        type: boolean
      theoretical_bbp:
        type: number
      deviation:
        type: number
