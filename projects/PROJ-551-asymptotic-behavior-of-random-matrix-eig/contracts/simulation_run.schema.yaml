$schema: "http://json-schema.org/draft-07/schema#"
$id: "simulation_run.schema.yaml"
title: "SimulationRun"
type: object
required:
  - run_id
  - timestamp
  - seed
  - N
  - k
  - theta
  - pattern_type
  - support_density
  - computation_time_ms
  - empirical_bulk_edge
  - eigenvalues
properties:
  run_id:
    type: string
  timestamp:
    type: string
    format: date-time
  seed:
    type: integer
  N:
    type: integer
  k:
    type: integer
  theta:
    type: number
  pattern_type:
    type: string
  support_density:
    type:
      - number
      - "null"
  computation_time_ms:
    type: number
  empirical_bulk_edge:
    type: number
  eigenvalues:
    type: array
    items:
      $ref: "eigenvalue_result.schema.yaml#"
additionalProperties: false
