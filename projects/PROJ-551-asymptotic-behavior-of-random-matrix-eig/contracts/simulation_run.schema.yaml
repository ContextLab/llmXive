type: object
properties:
  run_id:
    type: string
    format: uuid
  timestamp:
    type: string
    format: date-time
  seed:
    type: integer
  N:
    type: integer
  k:
    type: integer
  theta:
    type: number
  pattern_type:
    type: string
  support_density:
    type: ["number", "null"]
  computation_time_ms:
    type: number
  empirical_bulk_edge:
    type: number
  eigenvalues:
    type: array
    items:
      $ref: 'eigenvalue_result.schema.yaml'
required: [run_id, timestamp, seed, N, k, theta, pattern_type, computation_time_ms, empirical_bulk_edge, eigenvalues]
