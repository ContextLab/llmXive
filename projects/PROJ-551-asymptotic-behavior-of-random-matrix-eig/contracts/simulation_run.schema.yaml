$schema: "http://json-schema.org/draft-07/schema#"
$id: "simulation_run.schema.yaml"
title: SimulationRun
description: >
  Record of a single simulation run: parameters (N, seed, theta, rank,
  sparsity pattern) and the computed top eigenvalues with outlier flags.
type: object
required:
  - run_id
  - N
  - seed
  - theta
  - eigenvalues
properties:
  run_id:
    type: string
    minLength: 1
  N:
    type: integer
    minimum: 1
  seed:
    type: integer
    minimum: 0
  theta:
    type: number
    minimum: 0
  k:
    type: integer
    minimum: 0
  pattern_type:
    type: string
    enum:
      - diagonal
      - block-sparse
      - random-sparse
      - random sparse
  density:
    type: number
    minimum: 0
    maximum: 1
  timestamp:
    description: ISO-8601 timestamp of the run.
    type: string
  eigenvalues:
    type: array
    items:
      type: number
  is_outlier:
    type: boolean
  top_eigenvalue:
    type: number
  peak_memory_mb:
    type: number
    minimum: 0
  checksum:
    type: string
additionalProperties: true
