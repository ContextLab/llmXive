$schema: http://json-schema.org/draft-07/schema#
title: SimulationRun
description: >
  Record of a single simulation run: parameters (N, seed, theta, rank,
  sparsity pattern) and results (top eigenvalues, outlier flags).
  Self-contained: no external $ref.
type: object
required:
  - run_id
  - timestamp
  - N
  - seed
  - theta
  - k
  - pattern_type
  - eigenvalues
properties:
  run_id:
    type: string
    minLength: 1
  timestamp:
    type: string
    description: ISO-8601 timestamp of the run.
  N:
    type: integer
    minimum: 1
  seed:
    type: integer
  theta:
    type: number
    description: Spectral norm of the perturbation.
  k:
    type: integer
    minimum: 0
    description: Rank of the perturbation.
  pattern_type:
    type: string
    enum: [diagonal, block-sparse, random-sparse]
  support_density:
    type: [number, string]
    description: Support density of the perturbation (optional / may be blank).
  eigenvalues:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - eigenvalue_index
        - value
        - is_outlier
      properties:
        eigenvalue_index:
          type: integer
          minimum: 0
        value:
          type: number
        is_outlier:
          type: boolean
        theoretical_bbp:
          type: number
        deviation:
          type: number
  outlier_rule:
    type: string
    description: Rule used for outlier detection, e.g. "value > 2.0 + 0.05".
  peak_memory_mb:
    type: number
  computation_time_ms:
    type: number
  checksum:
    type: string
