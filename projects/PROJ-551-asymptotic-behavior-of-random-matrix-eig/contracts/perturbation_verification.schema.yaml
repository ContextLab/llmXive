$schema: "http://json-schema.org/draft-07/schema#"
title: PerturbationVerification
description: Verification of the spectral norm theta and sparsity of the perturbation matrix.
type: object
properties:
  requested_theta:
    type: number
    description: The target spectral norm theta.
  measured_norm:
    type: number
    description: The actual L2 norm of the generated perturbation matrix.
  requested_sparsity:
    type: number
    description: The target support density p.
  measured_sparsity:
    type: number
    description: The actual fraction of non-zero entries.
  verification_status:
    type: string
    enum: ["pass", "fail"]
    description: Whether the perturbation meets the structural fidelity constraints.
required: ["requested_theta", "measured_norm", "requested_sparsity", "measured_sparsity", "verification_status"]
