type: object
description: Verification of perturbation norm and sparsity pattern fidelity.
properties:
  requested_theta:
    type: number
    description: The target spectral norm of the perturbation.
  measured_norm:
    type: number
    description: The actual spectral norm computed from the generated matrix.
  requested_sparsity:
    type: number
    description: The target support density p.
  measured_sparsity:
    type: number
    description: The actual fraction of non-zero entries.
  verification_status:
    type: string
    enum: ["pass", "fail"]
    description: Whether the perturbation meets structural fidelity constraints.
required: [requested_theta, measured_norm, requested_sparsity, measured_sparsity, verification_status]
