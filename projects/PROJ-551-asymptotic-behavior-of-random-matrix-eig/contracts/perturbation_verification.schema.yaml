type: object
required:
  - requested_theta
  - actual_norm
  - norm_difference
  - pattern
  - support_density
  - norm_match
properties:
  requested_theta:
    type: number
    description: The θ value requested by the user.
  actual_norm:
    type: number
    description: Spectral norm (2‑norm) of the generated perturbation matrix.
  norm_difference:
    type: number
    description: Absolute difference between actual_norm and requested_theta.
  pattern:
    type: string
    description: Perturbation pattern identifier (e.g., diagonal, block-sparse, random-sparse).
  support_density:
    type: number
    description: Fraction of non‑zero entries in the perturbation matrix (non‑zero count / N²).
  norm_match:
    type: boolean
    description: True if norm_difference ≤ 1e‑6, otherwise False.
