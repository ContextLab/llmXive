# Schema for perturbation_verification.json artifacts
type: object
properties:
  theta_requested:
    type: number
    description: Perturbation norm θ requested in the configuration.
  theta_actual:
    type: number
    description: Spectral norm of the constructed perturbation matrix.
  rank:
    type: integer
    description: Rank k of the perturbation.
  pattern:
    type: string
    description: Pattern type (e.g., diagonal, block-sparse, random-sparse).
  support_density:
    type: number
    description: Fraction of non‑zero entries in the perturbation matrix.
  verification_passed:
    type: boolean
    description: Whether the perturbation meets the requested specifications within tolerance.
required:
  - theta_requested
  - theta_actual
  - rank
  - pattern
  - support_density
  - verification_passed
