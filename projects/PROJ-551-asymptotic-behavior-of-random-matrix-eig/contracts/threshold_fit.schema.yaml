type: object
description: Schema for sigmoid-fit results of the outlier phase transition.
properties:
  theta_c_estimate:
    type: ["number", "null"]
    description: MLE estimate of the critical threshold theta_c.
  theta_c_confidence:
    type: ["number", "null"]
    description: 95% confidence interval half-width.
  a:
    type: ["number", "null"]
    description: Slope parameter of the logistic function.
  b:
    type: ["number", "null"]
    description: Intercept parameter (a * theta_c_estimate).
  fit_status:
    type: string
    enum: ["success", "failed"]
    description: Status of the curve fitting process.
required: [theta_c_estimate, theta_c_confidence, a, b, fit_status]
