# Schema for threshold_fit.json artifacts
type: object
properties:
  theta_c_estimate:
    type: number
    description: Estimated critical perturbation norm θ_c.
  theta_c_confidence:
    type: object
    description: Confidence interval for θ_c.
    properties:
      lower:
        type: number
      upper:
        type: number
    required:
      - lower
      - upper
  a:
    type: number
    description: Logistic slope parameter.
  b:
    type: number
    description: Logistic intercept (b = a * theta_c_estimate).
  fit_status:
    type: string
    description: Fit outcome.
    enum:
      - success
      - failed
required:
  - theta_c_estimate
  - theta_c_confidence
  - a
  - b
  - fit_status
