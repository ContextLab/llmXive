type: object
required:
  - theta_c_estimate
  - theta_c_confidence
  - a
  - b
  - fit_status
properties:
  theta_c_estimate:
    type: number
    description: Estimated critical threshold θ_c from the logistic fit.
    nullable: true
  theta_c_confidence:
    type: object
    description: 95 % confidence interval for θ_c.
    nullable: true
    required:
      - lower
      - upper
    properties:
      lower:
        type: number
      upper:
        type: number
  a:
    type: number
    description: Slope parameter of the logistic model.
    nullable: true
  b:
    type: number
    description: Intercept parameter (b = a * theta_c_estimate) of the logistic model.
    nullable: true
  fit_status:
    type: string
    enum: [success, failed]
    description: Indicates whether the fit converged successfully.