$schema: "http://json-schema.org/draft-07/schema#"
title: EigenvalueResult
type: object
required:
  - run_id
  - eigenvalue_index
  - value
  - is_outlier
  - theoretical_bbp
  - deviation
properties:
  run_id:
    type: string
    format: uuid
  eigenvalue_index:
    type: integer
    minimum: 1
  value:
    type: number
  is_outlier:
    type: boolean
  theoretical_bbp:
    type: number
  deviation:
    type: number
