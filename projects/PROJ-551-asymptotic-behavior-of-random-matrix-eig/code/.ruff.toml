# Ruff configuration file (standalone)
# This file is used for editor integration and local checks.
# Project-wide settings are also defined in pyproject.toml.

target-version = "py311"
line-length = 88
src = ["."]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
]
ignore = [
    "E501",
    "C901",
    "B008",
]

[lint.isort]
known-first-party = ["generators", "analysis", "utils", "data_models"]
force-single-line = true
lines-after-imports = 2
