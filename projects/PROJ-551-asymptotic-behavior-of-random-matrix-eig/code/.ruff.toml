# Ruff configuration file for llmXive Asymptotic Behavior project
# Extends pyproject.toml but defines specific rules for this project
extend = "pyproject.toml"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "S101", # assert allowed in tests (overridden in per-file-ignores)
]

[lint.per-file-ignores]
"tests/*" = ["S101"] # assert allowed in tests
"code/analysis/*" = ["S311"] # Random number generation in analysis is acceptable

[lint.isort]
known-first-party = ["analysis", "generators", "utils", "data_models", "main"]
force-sort-within-sections = true
lines-after-imports = 2

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[lint.pyupgrade]
keep-runtime-typing = false
