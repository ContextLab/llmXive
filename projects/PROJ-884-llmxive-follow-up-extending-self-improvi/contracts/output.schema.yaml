$schema: "http://json-schema.org/draft-07/schema#"
title: "llmXive Experiment Output Schema"
description: >
  JSON Schema defining the structure for experiment logs, analysis results,
  and final reports generated by the llmXive automated science pipeline.
  This schema ensures data integrity and reproducibility across experiments.
type: object
definitions:
  Timestamp:
    type: string
    format: date-time
    description: "ISO 8601 formatted timestamp for the event or log entry."

  UUID:
    type: string
    format: uuid
    description: "Universally Unique Identifier for the experiment run."

  MetricValue:
    oneOf:
      - type: number
      - type: integer
      - type: string
    description: "A flexible metric value which can be numeric or a string representation."

  ComplexityClass:
    type: string
    enum: ["O(1)", "O(log n)", "O(n)", "O(n log n)", "O(n^2)", "O(2^n)", "Unknown"]
    description: "The derived computational complexity class based on scaling analysis."

  FailureReason:
    type: string
    enum: ["PARSE_FAILURE", "CONTRADICTION_DETECTED", "VERIFIER_ERROR", "IMPOSSIBLE_GOAL", "NON_LINEAR_CONSTRAINT", "TIMEOUT", "MEMORY_ERROR"]
    description: "Standardized error codes for failure modes."

  # --- Log Entry Structure (per line or array item in experiment.log) ---
  ExperimentLogEntry:
    type: object
    required:
      - timestamp
      - experiment_id
      - log_type
      - payload
    properties:
      timestamp:
        $ref: "#/definitions/Timestamp"
      experiment_id:
        $ref: "#/definitions/UUID"
      log_type:
        type: string
        enum: ["START", "STEP_FORWARD", "STEP_BACKWARD", "POPULATION_UPDATE", "VERIFICATION", "ERROR", "END"]
        description: "The type of event being logged."
      payload:
        type: object
        description: "Event-specific data."
        properties:
          wall_clock:
            type: number
            description: "Elapsed wall-clock time in seconds."
          resource_usage:
            type: object
            properties:
              cpu_percent:
                type: number
              memory_mb:
                type: number
          step_details:
            type: object
            description: "Details specific to forward/backward steps."
            properties:
              individual_id:
                type: string
              sub_goals:
                type: array
                items:
                  type: string
              llm_tokens:
                type: integer
          error_details:
            type: object
            properties:
              reason:
                $ref: "#/definitions/FailureReason"
              message:
                type: string
          verification_result:
            type: object
            properties:
              is_valid:
                type: boolean
              error_code:
                $ref: "#/definitions/FailureReason"

  # --- Metrics Structure (aggregated per experiment) ---
  ExperimentMetrics:
    type: object
    required:
      - experiment_id
      - start_time
      - end_time
      - total_successes
      - total_failures
      - total_duration_seconds
      - average_step_time_seconds
      - scaling_analysis
    properties:
      experiment_id:
        $ref: "#/definitions/UUID"
      start_time:
        $ref: "#/definitions/Timestamp"
      end_time:
        $ref: "#/definitions/Timestamp"
      total_successes:
        type: integer
        minimum: 0
      total_failures:
        type: integer
        minimum: 0
      total_duration_seconds:
        type: number
        minimum: 0
      average_step_time_seconds:
        type: number
        minimum: 0
      energy_consumption_joules:
        type: number
        minimum: 0
        description: "Estimated energy consumption during the run."
      success_rate:
        type: number
        minimum: 0
        maximum: 1
      failure_breakdown:
        type: object
        additionalProperties:
          type: integer
        description: "Count of failures by reason code."
      scaling_analysis:
        type: object
        properties:
          problem_sizes:
            type: array
            items:
              type: integer
            description: "List of N values tested (e.g., [10, 50, 100])."
          run_times:
            type: array
            items:
              type: number
            description: "Corresponding run times in seconds."
          regression_slope:
            type: number
          complexity_class:
            $ref: "#/definitions/ComplexityClass"
          r_squared:
            type: number

  # --- Statistical Test Results ---
  StatisticalTestResult:
    type: object
    required:
      - test_type
      - p_value
      - significant
    properties:
      test_type:
        type: string
        enum: ["two_proportion_z_test", "tost_equivalence_test", "t_test"]
      null_hypothesis:
        type: string
        description: "Description of the null hypothesis being tested."
      p_value:
        type: number
        minimum: 0
        maximum: 1
      significant:
        type: boolean
      alpha:
        type: number
        description: "Significance level used (default 0.05)."
      test_statistic:
        type: number
        description: "The calculated z-score or t-score."
      confidence_interval:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
        description: "95% confidence interval for the difference in means/proportions."

  # --- Final Report Structure ---
  FinalReport:
    type: object
    required:
      - report_id
      - generated_at
      - experiment_summary
      - statistical_analysis
      - complexity_analysis
      - conclusions
    properties:
      report_id:
        $ref: "#/definitions/UUID"
      generated_at:
        $ref: "#/definitions/Timestamp"
      experiment_summary:
        type: object
        properties:
          symbolic_bes_metrics:
            $ref: "#/definitions/ExperimentMetrics"
          neural_baseline_metrics:
            $ref: "#/definitions/ExperimentMetrics"
      statistical_analysis:
        type: object
        properties:
          success_rate_comparison:
            $ref: "#/definitions/StatisticalTestResult"
          cost_comparison:
            $ref: "#/definitions/StatisticalTestResult"
      complexity_analysis:
        type: object
        properties:
          symbolic_complexity:
            $ref: "#/definitions/ComplexityClass"
          neural_complexity:
            $ref: "#/definitions/ComplexityClass"
      conclusions:
        type: array
        items:
          type: string
        description: "List of key findings and conclusions."

# --- Main Schema Definition for Output Files ---
# Used for: data/processed/experiment.log (as array of ExperimentLogEntry)
# Used for: data/processed/metrics.csv (derived from ExperimentMetrics)
# Used for: data/processed/final_report.md (derived from FinalReport)

oneOf:
  - $ref: "#/definitions/ExperimentLogEntry"
  - $ref: "#/definitions/ExperimentMetrics"
  - $ref: "#/definitions/StatisticalTestResult"
  - $ref: "#/definitions/FinalReport"
description: >
  This schema defines the contract for all output artifacts.
  - Logs are arrays of ExperimentLogEntry.
  - Metrics files contain ExperimentMetrics.
  - Statistical results follow StatisticalTestResult.
  - Final reports follow FinalReport structure.