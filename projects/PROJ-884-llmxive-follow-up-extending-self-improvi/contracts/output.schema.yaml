%YAML 1.2
---
$schema: http://json-schema.org/draft-07/schema#
title: Output Schema for llmXive Automated Science Pipeline
description: |
  Schema for output files generated by the pipeline, specifically
  `data/processed/exclusions.json` and `data/processed/distribution_report.json`.

definitions:
  ExclusionEvent:
    type: object
    required:
      - timestamp
      - event_type
      - reason
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of the exclusion event.
      event_type:
        type: string
        enum:
          - CONTRADICTION_DETECTED
          - PARSE_FAILURE
          - VERIFIER_ERROR
        description: Type of exclusion event.
      reason:
        type: string
        description: Human-readable reason for the exclusion.
      puzzle_id:
        type: ["string", "null"]
        description: ID of the puzzle associated with the event.
      sub_goal:
        type: ["string", "null"]
        description: The sub-goal that caused the exclusion, if applicable.
      details:
        type: ["object", "null"]
        description: Additional structured details about the event.

  ExclusionsFile:
    type: object
    required:
      - exclusion_events
      - total_count
      - generated_at
      - schema_version
    properties:
      exclusion_events:
        type: array
        items:
          $ref: '#/definitions/ExclusionEvent'
        description: List of exclusion events.
      total_count:
        type: integer
        minimum: 0
        description: Total number of exclusion events.
      generated_at:
        type: string
        format: date-time
        description: Timestamp when the file was generated.
      schema_version:
        type: string
        description: Version of the schema used to generate this file.

  DistributionReport:
    type: object
    required:
      - puzzle_types
      - complexity_distribution
      - total_count
      - generated_at
      - schema_version
    properties:
      puzzle_types:
        type: object
        description: Count of puzzles per type (e.g., sudoku, pathfinding).
        additionalProperties:
          type: integer
          minimum: 0
      complexity_distribution:
        type: object
        description: Distribution of puzzles by complexity (e.g., N=10, N=50).
        additionalProperties:
          type: integer
          minimum: 0
      total_count:
        type: integer
        minimum: 0
        description: Total number of puzzles in the report.
      generated_at:
        type: string
        format: date-time
        description: Timestamp when the report was generated.
      schema_version:
        type: string
        description: Version of the schema used.

oneOf:
  - $ref: '#/definitions/ExclusionsFile'
  - $ref: '#/definitions/DistributionReport'
description: |
  This schema defines the structure for both ExclusionsFile and DistributionReport.
  A valid file must match exactly one of these definitions.
