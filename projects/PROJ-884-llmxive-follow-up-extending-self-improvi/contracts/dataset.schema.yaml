$schema: "http://json-schema.org/draft-07/schema#"
title: Logic Puzzle Dataset Schema
description: Schema for logic and arithmetic puzzles generated for the llmXive project.
type: object
required:
  - metadata
  - puzzles
properties:
  metadata:
    type: object
    required:
      - version
      - generated_at
      - generator_version
      - total_count
      - checksum
    properties:
      version:
        type: string
        description: Schema version
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation
      generator_version:
        type: string
        description: Version of the generator script
      total_count:
        type: integer
        description: Total number of puzzles in the dataset
      checksum:
        type: string
        description: SHA-256 checksum of the puzzles array
  puzzles:
    type: array
    items:
      $ref: "#/definitions/PuzzleInstance"
definitions:
  PuzzleInstance:
    type: object
    required:
      - id
      - type
      - difficulty
      - parameters
      - constraints
      - solution_path
      - metadata
    properties:
      id:
        type: string
        description: Unique identifier for the puzzle
      type:
        type: string
        enum:
          - sudoku_variant
          - constrained_pathfinding
          - arithmetic_grid
        description: Type of puzzle
      difficulty:
        type: string
        enum:
          - easy
          - medium
          - hard
        description: Difficulty level
      parameters:
        type: object
        description: Puzzle-specific parameters (e.g., grid size, constraints)
        additionalProperties: true
      constraints:
        type: array
        items:
          type: string
        description: List of textual constraints defining the puzzle
      solution_path:
        type: array
        items:
          type: object
          additionalProperties: true
        description: The correct solution path (steps to solve)
      metadata:
        type: object
        required:
          - complexity_score
          - generation_time_ms
        properties:
          complexity_score:
            type: number
            description: Calculated complexity score
          generation_time_ms:
            type: number
            description: Time taken to generate this puzzle
