$schema: http://json-schema.org/draft-07/schema#
title: Puzzle Instance Schema
description: JSON Schema for validating puzzle instances generated by the dataset pipeline.
type: object
required:
  - constraints
  - initial_state
  - target_state
  - verifier_output
  - metadata
properties:
  constraints:
    type: array
    description: List of constraint strings defining the puzzle rules.
    items:
      type: string
    minItems: 1
  initial_state:
    type: object
    description: The starting configuration of the puzzle.
    additionalProperties: true
  target_state:
    type: object
    description: The goal configuration or condition to satisfy.
    additionalProperties: true
  verifier_output:
    type: object
    description: Output from the deterministic verifier.
    required:
      - valid
      - error_code
    properties:
      valid:
        type: boolean
        description: True if the solution satisfies all constraints.
      error_code:
        type: string
        description: Specific error code if valid is false (e.g., DUPLICATE_ROW, PARSE_FAILURE).
        enum:
          - NONE
          - DUPLICATE_ROW
          - INVALID_PATH
          - CONSTRAINT_VIOLATION
          - PARSE_FAILURE
          - CONTRADICTION_DETECTED
          - VERIFIER_ERROR
  metadata:
    type: object
    description: Provenance and generation metadata.
    required:
      - source_id
      - generation_seed
    properties:
      source_id:
        type: string
        description: Identifier for the source of this puzzle (e.g., 'curated_logic_v1').
      generation_seed:
        type: integer
        description: Random seed used for generation to ensure reproducibility.
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation.
      complexity_metric:
        type: object
        description: Asymptotic complexity metrics derived from the puzzle.
        required:
          - constraint_count
          - variable_domain_size
        properties:
          constraint_count:
            type: integer
            minimum: 0
          variable_domain_size:
            type: integer
            minimum: 1
