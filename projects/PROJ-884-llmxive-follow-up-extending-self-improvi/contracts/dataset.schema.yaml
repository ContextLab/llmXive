$schema: "http://json-schema.org/draft-07/schema#"
title: "Puzzle Instance Dataset Schema"
description: "Schema for the generated logic/arithmetic puzzles dataset as defined in T000d-def."
type: "object"
required:
  - puzzles
properties:
  puzzles:
    type: "array"
    items:
      $ref: "#/$defs/puzzle_instance"
$defs:
  puzzle_instance:
    type: "object"
    required:
      - constraints
      - initial_state
      - target_state
      - verifier_output
      - metadata
    properties:
      constraints:
        type: "array"
        description: "List of constraint strings defining the puzzle."
        items:
          type: "string"
      initial_state:
        type: "object"
        description: "The starting state of the puzzle."
        additionalProperties: true
      target_state:
        type: "object"
        description: "The goal state of the puzzle."
        additionalProperties: true
      verifier_output:
        type: "object"
        description: "Result of the deterministic verifier."
        required:
          - valid
          - error_code
        properties:
          valid:
            type: "boolean"
            description: "Whether the solution is valid."
          error_code:
            type: "string"
            description: "Error code if invalid, or 'OK' if valid."
      metadata:
        type: "object"
        description: "Metadata about the puzzle generation."
        required:
          - source_id
          - generation_seed
        properties:
          source_id:
            type: "string"
            description: "Identifier for the generation source."
          generation_seed:
            oneOf:
              - type: "integer"
              - type: "string"
            description: "Seed used for random generation."
          timestamp:
            type: "string"
            description: "ISO 8601 timestamp of generation."
            format: date-time
id: "contracts/dataset.schema.yaml"
version: "1.0.0"
