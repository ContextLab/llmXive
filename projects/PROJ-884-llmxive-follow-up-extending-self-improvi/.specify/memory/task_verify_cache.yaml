  h: 1232910e5b8b710a402a5ca8e849dbb02d9e1687cbd02a39270a8badbb9a6ed3
  r: "The pytest collection for `test_generator.py` fails with a `JSONDecodeError`\
    \ because `contracts/dataset.schema.yaml` is a YAML file but the test loads it\
    \ with `json.load`. Consequently the generator\u2019s output is never validated\
    \ against the schema. Moreover, `PuzzleGenerator.generate_puzzles` writes a single\
    \ JSON object (with a \u201Cheader\u201D and a \u201Cpuzzles\u201D list) instead\
    \ of the required JSON\u2011Lines (JSONL) format. Both issues prevent the required\
    \ tests from passing and mean the generator does not emit records that conform\
    \ to the contract. The verifier itself logs timings and returns the correct tuple,"
  sig: dba4a8038eeec7f2bab98540cf631eb0de79e5fda8a32a16eafc074555d686af
