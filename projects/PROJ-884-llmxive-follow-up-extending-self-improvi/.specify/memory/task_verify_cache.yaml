T001:
  c: false
  h: 4a42eedca0134b6a3f2618f57eed704ba788b76cb5d953b0ad11db7a6a66adc6
  r: 'The generated puzzles do not conform to `contracts/dataset.schema.yaml`: the
    `verifier_output` object uses the key `"is_valid"` (and returns error codes like
    `"VALID"`), whereas the schema requires a boolean field `"valid"` and error codes
    limited to the enum values listed. Consequently `code/tests/test_generator.py`
    will raise a `jsonschema.ValidationError`, so the required tests do not all pass.
    The verifier output format must be corrected to match the schema (e.g., `{"valid":
    is_valid, "error_code": err_code}` with allowed error codes).'
  sig: 539b8eeaee020aefb533bc4598f392b148e355e170efb4970dddcc6b0067f9b9
