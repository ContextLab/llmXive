type: object
properties:
  seed:
    type: integer
    minimum: 0
    description: Random seed for reproducibility
  permutations:
    type: integer
    minimum: 1
    description: Number of permutations for MMD p-value estimation
  window_size:
    type: integer
    minimum: 1
    description: Size of the sliding window for distribution shift detection
  stride:
    type: integer
    minimum: 1
    description: Stride for the sliding window
  alpha:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: Significance level for statistical tests
  bandwidth_method:
    type: string
    enum: [median, cv, fixed]
    description: Method for estimating Gaussian kernel bandwidth
  min_samples:
    type: integer
    minimum: 1
    description: Minimum number of samples required per window
  tolerance_weeks:
    type: integer
    minimum: 0
    description: Tolerance in weeks for detection delay calculation
required:
  - seed
  - permutations
  - window_size
  - stride
  - alpha
additionalProperties: false
