%YAML 1.1
---
schema_type: object
description: Configuration schema for the distribution shift detection pipeline.
required:
  - seed
  - permutations
  - window_size
  - stride
  - alpha
properties:
  seed:
    type: integer
    minimum: 0
    default: 42
    description: Random seed for reproducibility.
  permutations:
    type: integer
    minimum: 1
    default: 1000
    description: Number of permutations for MMD p-value estimation.
  window_size:
    type: integer
    minimum: 1
    default: 12
    description: Size of the sliding window in weeks.
  stride:
    type: integer
    minimum: 1
    default: 1
    description: Stride for sliding the window.
  alpha:
    type: number
    exclusiveMinimum: 0
    exclusiveMaximum: 1
    default: 0.01
    description: Significance level for statistical tests.
additionalProperties: false
