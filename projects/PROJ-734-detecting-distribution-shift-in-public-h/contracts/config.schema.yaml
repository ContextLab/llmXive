type: object
required:
  - seed
  - permutations
  - window_size
  - stride
  - alpha
  - min_permutations
  - time_budget_minutes
properties:
  seed:
    type: integer
    description: Random seed for reproducibility
  permutations:
    type: integer
    description: Number of permutations for MMD test
  window_size:
    type: integer
    description: Size of the sliding window in weeks
  stride:
    type: integer
    description: Stride for the sliding window
  alpha:
    type: number
    description: Significance level for hypothesis testing
  min_permutations:
    type: integer
    description: Minimum number of permutations to allow
  time_budget_minutes:
    type: number
    description: Total time budget in minutes for the analysis
