# Schema for pipeline output files (flags, baselines, metrics, reports)
# Used by code/contracts.py to validate output integrity
type: object
required:
  - type
  - columns
  - rows
properties:
  type:
    type: string
    enum:
      - flags
      - baselines
      - metrics
      - sensitivity
      - report_metadata
    description: Type of output artifact
  columns:
    type: array
    items:
      type: object
      required:
        - name
        - dtype
      properties:
        name:
          type: string
        dtype:
          type: string
        nullable:
          type: boolean
          default: false
  rows:
    type: integer
    minimum: 0
    description: Number of rows in the output
  validation_rules:
    type: object
    description: Specific validation rules for this output type
    properties:
      flags:
        type: object
        properties:
          required_columns:
            type: array
            items:
              type: string
            enum:
              - week
              - mmd_statistic
              - p_value
              - is_shift
          date_format:
            type: string
            const: "%Y-%m-%d"
      baselines:
        type: object
        properties:
          required_columns:
            type: array
            items:
              type: string
            enum:
              - week
              - method
              - statistic
              - p_value
      metrics:
        type: object
        properties:
          required_columns:
            type: array
            items:
              type: string
            enum:
              - metric_name
              - value
              - configuration
      sensitivity:
        type: object
        properties:
          required_columns:
            type: array
            items:
              type: string
            enum:
              - bandwidth
              - window_size
              - precision
              - recall
              - delay
  generated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of generation
  config_snapshot:
    type: object
    description: Snapshot of config parameters used for this run