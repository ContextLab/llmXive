$schema: http://json-schema.org/draft-07/schema#
title: CDC FluView and Ground Truth Dataset Schema
description: |
  Schema for raw and processed datasets used in distribution shift detection.
  Enforces data integrity for CDC FluView ILI data and Ground Truth Event data.
type: object
properties:
  fluview_ili:
    description: Raw CDC FluView ILI data
    type: object
    properties:
      file_path:
        type: string
        pattern: ^data/raw/fluview_ili\.csv$
      columns:
        type: array
        items:
          type: string
        contains:
          const: "week"
          description: ISO week string (e.g., 2020-01)
        contains:
          const: "ili"
          description: ILI percentage (float)
        contains:
          const: "num_ili"
          description: Number of ILI visits (int)
        contains:
          const: "num_patients"
          description: Total patients seen (int)
      required_columns:
        type: array
        items:
          type: string
        minItems: 4
        contains:
          const: "week"
        contains:
          const: "ili"
      data_integrity:
        type: object
        properties:
          has_missing_weeks:
            type: boolean
            description: Flag indicating presence of missing weeks (NaNs)
          has_constant_segments:
            type: boolean
            description: Flag indicating zero-variance segments
          has_outliers:
            type: boolean
            description: Flag indicating statistical outliers
  ground_truth_events:
    description: Ground truth public health events
    type: object
    properties:
      file_path:
        type: string
        pattern: ^data/raw/ground_truth_events\.csv$
      columns:
        type: array
        items:
          type: string
        contains:
          const: "start_week"
          description: Start week of the event
        contains:
          const: "end_week"
          description: End week of the event
        contains:
          const: "event_name"
          description: Name of the event
      required_columns:
        type: array
        items:
          type: string
        minItems: 3
        contains:
          const: "start_week"
        contains:
          const: "end_week"
        contains:
          const: "event_name"
      source_independence:
        type: object
        properties:
          verified_source:
            type: boolean
            description: Confirmed to be from a verified CDC source, not derived from ILI data
          no_ili_columns:
            type: boolean
            description: Confirmed no ILI-related columns present
required:
  - fluview_ili
  - ground_truth_events
additionalProperties: false
