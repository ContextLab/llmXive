# Dataset Schema for CDC FluView and Ground Truth Events
# Used for data integrity validation during pipeline execution
type: object
required:
  - fluview
  - ground_truth
properties:
  fluview:
    type: object
    description: CDC FluView ILI data schema
    required:
      - file_path
      - columns
      - data_types
    properties:
      file_path:
        type: string
        pattern: "^data/raw/fluview_ili\\.csv$"
        description: Path to the raw FluView ILI CSV file
      columns:
        type: array
        items:
          type: string
        description: Required columns in the dataset
        minItems: 4
        contains:
          const: "week"
      data_types:
        type: object
        description: Expected data types for key columns
        properties:
          week:
            type: string
            enum: ["int", "float", "object"]
          ili:
            type: string
            enum: ["float", "int"]
          num_ili_patients:
            type: string
            enum: ["float", "int"]
          pop_at_risk:
            type: string
            enum: ["float", "int"]
      constraints:
        type: object
        description: Data constraints
        properties:
          week_range:
            type: object
            properties:
              min_week:
                type: integer
              max_week:
                type: integer
          non_negative_ili:
            type: boolean
            const: true
  ground_truth:
    type: object
    description: Ground truth events schema
    required:
      - file_path
      - columns
      - data_types
    properties:
      file_path:
        type: string
        pattern: "^data/raw/ground_truth_events\\.csv$"
        description: Path to the raw ground truth events CSV file
      columns:
        type: array
        items:
          type: string
        description: Required columns
        minItems: 3
        contains:
          const: "start_week"
        contains:
          const: "end_week"
        contains:
          const: "event_name"
      data_types:
        type: object
        description: Expected data types
        properties:
          start_week:
            type: string
            enum: ["int", "float"]
          end_week:
            type: string
            enum: ["int", "float"]
          event_name:
            type: string
            enum: ["object", "string"]
      constraints:
        type: object
        description: Data constraints
        properties:
          start_before_end:
            type: boolean
            const: true
          valid_event_names:
            type: array
            items:
              type: string
            description: List of valid event types
