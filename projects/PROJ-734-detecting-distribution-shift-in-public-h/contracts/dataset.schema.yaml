# Schema for raw and processed dataset files
# Used by code/contracts.py to validate data integrity
type: object
required:
  - columns
  - rows
  - sample_values
properties:
  columns:
    type: array
    items:
      type: object
      required:
        - name
        - dtype
      properties:
        name:
          type: string
          description: Column name
        dtype:
          type: string
          description: Expected data type (e.g., 'float64', 'object', 'int64')
        nullable:
          type: boolean
          default: true
          description: Whether the column allows null values
  rows:
    type: integer
    minimum: 1
    description: Total number of rows in the dataset
  sample_values:
    type: object
    description: Sample values for each column (first row or representative values)
  metadata:
    type: object
    properties:
      source_url:
        type: string
        description: Original URL or source of the data
      retrieval_date:
        type: string
        format: date-time
        description: When the data was retrieved
      sha256:
        type: string
        pattern: '^[a-fA-F0-9]{64}$'
        description: SHA256 hash of the file for integrity verification
