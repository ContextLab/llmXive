access_python: "import pandas as pd\nurl = 'https://raw.githubusercontent.com/alireza-jafari/ILI-Influenza-Dataset/main/ILINet.csv'\n\
  df = pd.read_csv(url)\n# Expected columns: 'epiweek' (int), 'ili' (float), 'outbreak'\
  \ (0/1)\nif 'epiweek' in df.columns:\n    df['week'] = df['epiweek'].apply(lambda\
  \ x: f\"{x//100}-W{x%100:02d}\")\nif 'ili' in df.columns:\n    df['ili_percent']\
  \ = df['ili']\nif 'outbreak' in df.columns:\n    df['outbreak_flag'] = df['outbreak'].astype(bool)\n\
  RECORDS = len(df)\nprint(f\"RECORDS={RECORDS}\")\nfields = [c for c in ['week','ili_percent','outbreak_flag']\
  \ if c in df.columns]\nprint('FIELDS=' + ','.join(fields))"
