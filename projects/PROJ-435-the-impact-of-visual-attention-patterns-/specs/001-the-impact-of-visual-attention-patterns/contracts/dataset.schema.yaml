$schema: "http://json-schema.org/draft-07/schema#"
title: "Merged Dataset Schema"
description: "Schema for the analysis-ready merged dataset."
type: "object"
properties:
  participant_id:
    type: "string"
    description: "Unique identifier for the participant."
  headline_id:
    type: "string"
    description: "Unique identifier for the headline."
  cognitive_reflection_score:
    type: "number"
    description: "Cognitive reflection test score."
  emotional_valence:
    type: "number"
    description: "Emotional valence score (NRC or VADER)."
  source_fixation_duration:
    type: "number"
    description: "Duration of fixation on source attribution ROI in milliseconds."
  belief_rating:
    type: "number"
    description: "Self-reported belief rating (Likert scale)."
  roi_type:
    type: "string"
    description: "Type of ROI (e.g., source_attribution)."
  data_loss_percent:
    type: "number"
    description: "Percentage of data loss for the participant."
required:
  - participant_id
  - headline_id
  - cognitive_reflection_score
  - emotional_valence
  - source_fixation_duration
  - belief_rating
  - roi_type
  - data_loss_percent
additionalProperties: false
