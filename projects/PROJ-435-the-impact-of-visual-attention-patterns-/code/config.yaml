# Environment Configuration and Reproducibility Settings
# This file controls global random seeds and runtime parameters for the pipeline.
# All scripts in code/ should load this file to ensure deterministic execution.

# Reproducibility: Random Seeds
# Setting these ensures that all random operations (numpy, python random, torch if used)
# produce identical results across runs.
random_seeds:
  python: 42
  numpy: 42
  global: 42

# Data Paths (relative to project root)
paths:
  raw_data: "data/raw"
  derived_data: "data/derived"
  processed_data: "data/processed"
  state: "state"
  figures: "figures"
  config: "code/config.yaml"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "state/pipeline.log"

# Analysis Parameters
analysis:
  # Fixation detection thresholds (used by utils/fixation_detection.py)
  ivt_duration_threshold: 60  # milliseconds
  idt_dispersion_threshold: 35  # pixels
  idt_duration_threshold: 100  # milliseconds

  # Data quality thresholds
  max_data_loss_percent: 20  # Exclude participants with >20% data loss

  # Regression settings
  outlier_cap_percentiles: [1, 99]  # Percentiles for outlier capping

# Lexicon Settings (used by utils/valence_calculation.py)
valence:
  primary_lexicon: "NRC"
  fallback_lexicon: "VADER"
  coverage_threshold: 0.50  # Switch if coverage < 50%
