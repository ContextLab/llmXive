random_seed: 42
dataset_url: "https://raw.githubusercontent.com/eye-tracking-datasets/dundee/main/dundee_eye_tracking.parquet"

# Algorithm Configuration
ivt_duration_threshold: 100
idt_dispersion_threshold: 30

# ROI Definitions (Bounding boxes for Dundee dataset)
roi_definitions:
  source_attribution:
    x: 0
    y: 0
    width: 100
    height: 50
  headline_body:
    x: 0
    y: 50
    width: 800
    height: 200

# Optimization Settings (Added/Updated by T047)
optimization:
  enabled: true
  use_parquet: true
  use_caching: true
  parallel_workers: 4
  max_memory_gb: 8
  cache_dir: "state/cache"

# Logging Configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - console
    - file
