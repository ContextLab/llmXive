# Project Configuration
# This file contains all configurable parameters for the eye-tracking analysis pipeline.

# I-VT Fixation Detection Parameters
# Per spec FR-001: Only duration threshold is used.
ivt_duration_threshold: 100  # milliseconds

# Data Quality Thresholds
data_loss_threshold_percent: 20.0

# Reproducibility
random_seed: 42

# ROI Configuration
roi_types:
  - source_attribution
  - other

# ROI Definitions (coordinates in pixels, assuming 1000x1000 screen)
rois:
  source_attribution:
    x_min: 0
    x_max: 200
    y_min: 0
    y_max: 100
  other:
    x_min: 200
    x_max: 1000
    y_min: 0
    y_max: 1000

# Logging Configuration
logging:
  level: INFO
  pipeline_log: logs/pipeline.log
  quality_log: logs/quality.log
  exclusion_log: logs/exclusions.log
