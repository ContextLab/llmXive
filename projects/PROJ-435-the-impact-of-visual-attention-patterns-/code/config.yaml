# Project Configuration
random_seed: 42

# Dataset Source
dataset_url: "https://huggingface.co/datasets/eye-tracking/visual-attention-misleading-headlines/resolve/main/data/eye_tracking_raw.parquet"

# Fixation Detection Parameters
ivt_duration_threshold: 100  # milliseconds
idt_dispersion_threshold: 35 # pixels

# ROI Definitions (matching the dataset schema)
roi_definitions:
  - name: "source_attribution"
    coordinates: [[0.0, 0.0], [1.0, 0.2], [1.0, 0.3], [0.0, 0.3]]
  - name: "headline_body"
    coordinates: [[0.0, 0.4], [1.0, 0.4], [1.0, 0.8], [0.0, 0.8]]

# Logging Configuration
logging_config_path: "code/config/logging_config.yaml"