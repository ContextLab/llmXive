# Project Configuration for Visual Attention Study
# This file controls random seeds and environment parameters for reproducibility.

# Reproducibility Settings
random_seed: 42
numpy_seed: 42
python_seed: 42

# Data Paths (relative to project root)
paths:
  raw_data_dir: "data/raw"
  derived_data_dir: "data/derived"
  processed_data_dir: "data/processed"
  state_dir: "state"
  figures_dir: "figures"

# Fixation Detection Parameters (I-VT / I-DT)
fixation_detection:
  ivt_duration_threshold: 60  # ms, minimum duration for a fixation
  idt_dispersion_threshold: 30  # pixels
  velocity_threshold: 30  # deg/s (secondary check)

# Analysis Parameters
analysis:
  outlier_cap_percentile_low: 1
  outlier_cap_percentile_high: 99
  regression_confidence_level: 0.95

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "state/pipeline.log"
