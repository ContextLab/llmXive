# Ruff configuration for llmXive project
# Enforces PEP 8 compliance and common best practices

[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",  # Line too long (handled by Black)
  "F403",  # 'from module import *' used; unable to detect undefined names
  "N806",  # Variable in function should be lowercase (relaxed for data vars)
]

# Exclude generated or third-party directories
exclude = [
  ".git",
  "__pycache__",
  ".eggs",
  "build",
  "dist",
  "venv",
  ".venv",
]

[lint.per-file-ignores]
# Allow imports in __init__.py files
"*/__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["models", "utils"]
force-single-line = false
lines-after-imports = 2
