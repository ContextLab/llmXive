version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s [%(levelname)s] %(name)s [%(filename)s:%(lineno)d]: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  pipeline_file:
    class: logging.FileHandler
    level: DEBUG
    formatter: detailed
    filename: output/pipeline.log
    encoding: utf-8

  quality_file:
    class: logging.FileHandler
    level: WARNING
    formatter: detailed
    filename: output/quality_issues.log
    encoding: utf-8

  exclusion_file:
    class: logging.FileHandler
    level: WARNING
    formatter: detailed
    filename: output/exclusions.log
    encoding: utf-8

loggers:
  pipeline:
    level: DEBUG
    handlers: [pipeline_file, console]
    propagate: false
  quality:
    level: WARNING
    handlers: [quality_file]
    propagate: false
  exclusion:
    level: WARNING
    handlers: [exclusion_file]
    propagate: false

root:
  level: INFO
  handlers: [console]
