[project]
name = "llmXive-visual-attention-misleading-headlines"
version = "0.1.0"
description = "Research pipeline for analyzing visual attention patterns and susceptibility to misleading headlines"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.0",
    "statsmodels==0.14.2",
    "scipy==1.13.1",
    "nltk==3.8.1",
    "pyarrow==15.0.2",
    "datasets==2.16.1",
    "huggingface_hub==0.23.0",
    "vaderSentiment==3.3.2",
    "shapely==2.0.3",
    "pyyaml==6.0.1",
]

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | build
  | dist
  | data
  | state
  | output
)/
'''
include = '\.pyi?$'

[tool.ruff]
# Select the required set of linting rules
select = ["E", "F", "W", "C90"]
line-length = 88
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "data",
    "state",
    "output",
]