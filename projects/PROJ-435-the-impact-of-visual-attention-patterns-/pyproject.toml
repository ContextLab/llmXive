[project]
name = "llmXive-visual-attention-misleading-headlines"
version = "0.1.0"
description = "Research pipeline for analyzing visual attention patterns and susceptibility to misleading headlines"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "nltk>=3.8.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0",
    "datasets>=2.14.0",
    "huggingface-hub>=0.17.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | build
  | dist
  | data
  | state
  | output
)/
'''
include = '\.pyi?$'