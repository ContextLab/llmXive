[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-fashionchame"
version = "0.1.0"
description = "Automated science pipeline for garment text fidelity analysis"
requires-python = ">=3.11"
dependencies = [
    "torch-cpu",
    "transformers",
    "opencv-python",
    "scikit-learn",
    "scipy",
    "datasets",
    "lpips",
    "pandas",
    "pyyaml",
    "jsonschema",
    "ruff",
    "black",
    "pytest",
    "psutil",
    "Pillow",
    "scikit-image"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
    "pytest-cov"
]

[tool.ruff]
# Ruff configuration for linting
target-version = "py311"
line-length = 88
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"tests/*" = ["ARG", "S101"]  # Allow unused args and assert in tests
"code/scripts/*" = ["T201"]  # Allow print in scripts

[tool.ruff.isort]
known-first-party = ["src", "tests", "scripts"]
force-sort-within-sections = true

[tool.black]
# Black configuration for formatting
target-version = ['py311']
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
