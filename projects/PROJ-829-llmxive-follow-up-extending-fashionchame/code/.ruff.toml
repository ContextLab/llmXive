# Ruff configuration for llmXive project
# This file is a duplicate of settings in pyproject.toml for IDE compatibility
line-length = 88
target-version = "py311"

select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[per-file-ignores]
"__init__.py" = ["F401"]

[isort]
known-first-party = ["src"]
force-sort-within-sections = true
combine-as-imports = true