[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-fashionchame"
version = "0.1.0"
description = "Automated science pipeline for garment-text fidelity research"
requires-python = ">=3.11"
dependencies = [
    "torch-cpu",
    "transformers",
    "opencv-python",
    "scikit-learn",
    "scipy",
    "datasets",
    "lpips",
    "pandas",
    "pyyaml",
    "jsonschema",
    "psutil",
    "ruff",
    "black",
    "pytest",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
