[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-fashionchame"
version = "0.1.0"
description = "Automated science pipeline for FashionChame extension"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "opencv-python>=4.8.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "datasets>=2.14.0",
    "lpips>=0.1.4",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.17.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pytest>=7.4.0",
    "psutil>=5.9.0",
    "Pillow>=10.0.0",
    "scikit-image>=0.21.0"
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "code/data",
]

[tool.ruff.per-file-ignores]
"code/src/__init__.py" = ["F401"]
"code/tests/**/*" = ["F401", "S101"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.ruff.isort]
known-first-party = ["src", "tests"]
force-sort-within-sections = true
case-sensitive = true
lines-between-types = 0
relative-imports-order = "closest-to-furthest"