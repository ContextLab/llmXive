[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-405-plant-disease"
version = "0.1.0"
description = "Predicting Plant Disease Severity from Publicly Available Image Data and Meteorological Records"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "scikit-learn",
    "pandas",
    "numpy",
    "requests",
    "datasets",
    "matplotlib",
    "seaborn",
    "pyyaml",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["code"]
include = ["utils*"]
