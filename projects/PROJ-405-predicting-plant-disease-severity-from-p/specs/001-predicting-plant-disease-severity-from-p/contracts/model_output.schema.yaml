# Model Output Schema for Plant Disease Severity Prediction
# This schema defines the structure of the model output artifacts,
# specifically the results.json file generated by the modeling pipeline.
#
# Corresponds to Task T006c in the project plan.

$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: >
  Schema for the final model output containing baseline metrics, 
  augmented model performance, statistical significance testing, 
  and sensitivity analysis results.

type: object
required:
  - baseline_r2
  - baseline_mae
  - augmented_r2
  - p_value
  - sensitivity_analysis

properties:
  baseline_r2:
    type: number
    description: >
      R-squared (coefficient of determination) of the baseline Random Forest 
      model predicting disease severity from visual features only.
      Calculated on the test set or via Out-of-Fold (OOF) predictions.
    minimum: -1.0
    maximum: 1.0
    example: 0.654
  
  baseline_mae:
    type: number
    description: >
      Mean Absolute Error of the baseline Random Forest model.
      Represents the average absolute difference between predicted 
      and actual disease severity scores.
    minimum: 0.0
    example: 0.125
  
  augmented_r2:
    type: number
    description: >
      R-squared of the augmented Random Forest model that predicts 
      calibrated residuals using weather variables and interaction terms.
      This metric indicates how much of the residual variance is explained 
      by environmental factors.
    minimum: -1.0
    maximum: 1.0
    example: 0.182
  
  p_value:
    type: number
    description: >
      P-value from the paired permutation test comparing the augmented model 
      performance against a null model.
      Generated by shuffling weather features 1000 times and calculating 
      the proportion of null R² differences greater than or equal to the 
      observed R² difference.
      A p-value < 0.05 indicates statistically significant improvement 
      due to weather integration.
    minimum: 0.0
    maximum: 1.0
    example: 0.003
  
  sensitivity_analysis:
    type: object
    description: >
      Results from the sensitivity analysis sweeping classification 
      thresholds around the 90th percentile baseline.
      Includes metrics for different threshold deviations to assess 
      robustness of findings.
    required:
      - threshold_deviations
      - metrics_summary
    properties:
      threshold_deviations:
        type: array
        description: >
          List of absolute deviations from the 90th percentile baseline 
          threshold that were tested.
        items:
          type: number
          example: [0.0, 0.05, 0.1]
      
      metrics_summary:
        type: array
        description: >
          Summary metrics for each threshold deviation, including F1 scores 
          and False Positive Rates.
        items:
          type: object
          required:
            - deviation
            - f1_score
            - false_positive_rate
            - true_positive_rate
          properties:
            deviation:
              type: number
              description: The absolute deviation from the baseline threshold.
              example: 0.05
            f1_score:
              type: number
              description: F1 score at this threshold.
              minimum: 0.0
              maximum: 1.0
              example: 0.782
            false_positive_rate:
              type: number
              description: False Positive Rate at this threshold.
              minimum: 0.0
              maximum: 1.0
              example: 0.125
            true_positive_rate:
              type: number
              description: True Positive Rate (Recall) at this threshold.
              minimum: 0.0
              maximum: 1.0
              example: 0.890
      
      headline_stability:
        type: string
        description: >
          Qualitative assessment of whether the headline findings (e.g., 
          weather impact significance) hold across the swept threshold range.
        enum:
          - stable
          - moderately_stable
          - unstable
        example: stable

  metadata:
    type: object
    description: >
      Additional metadata about the model run for reproducibility.
    properties:
      model_type:
        type: string
        description: Type of models used (e.g., "RandomForest").
        example: "RandomForest"
      baseline_features:
        type: array
        description: List of features used in the baseline model.
        items:
          type: string
        example:
          - "lesion_area_ratio"
          - "necrosis_color_index"
          - "texture_entropy"
      augmented_features:
        type: array
        description: List of features used in the augmented model.
        items:
          type: string
        example:
          - "mean_temp"
          - "mean_humidity"
          - "total_precipitation"
          - "temp_humidity_interaction"
      permutation_iterations:
        type: integer
        description: Number of iterations used in the permutation test.
        minimum: 1
        example: 1000
      random_seed:
        type: integer
        description: Random seed used for reproducibility.
        example: 42
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp when the model was trained.
        example: "2023-10-15T14:32:00Z"
      dataset_version:
        type: string
        description: Version hash or identifier of the input dataset.
        example: "unified_analysis_v1_sha256:abc123..."

additionalProperties: false