[project]
name = "llmXive-proj-255"
version = "0.1.0"
description = "Predicting Avian Vocal Complexity from Environmental Noise Levels"
requires-python = ">=3.9"
dependencies = [
    "librosa==0.10.1",
    "statsmodels==0.14.0",
    "osmnx==1.8.0",
    "geopy==2.4.0",
    "pandas==2.1.0",
    "scikit-learn==1.3.0",
    "matplotlib==3.8.0",
    "seaborn==0.13.0",
    "requests==2.31.0",
    "datasets==2.14.0",
    "pytest==7.4.0",
    "pyyaml==6.0.1",
]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"