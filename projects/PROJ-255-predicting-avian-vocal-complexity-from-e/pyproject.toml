[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-255-avian-vocal-complexity"
version = "0.1.0"
description = "Predicting Avian Vocal Complexity from Environmental Noise Levels"
requires-python = ">=3.9"
dependencies = [
    "librosa==0.10.1",
    "statsmodels==0.14.0",
    "osmnx==1.8.0",
    "geopy==2.4.0",
    "pandas==2.1.0",
    "scikit-learn==1.3.0",
    "matplotlib==3.8.0",
    "seaborn==0.13.0",
    "requests==2.31.0",
    "datasets==2.14.0",
    "pytest==7.4.0",
    "pyyaml==6.0.1",
]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
# Inherits from .ruff.toml for detailed linting rules
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["code"]
include = ["src*", "tests*"]