%YAML 1.1
---
# Schema for Model Output Artifacts
# Used by: src/analysis/modeling.py, src/analysis/report.py, src/analysis/viz.py
# Defines the structure of results generated during User Story 2 (Modeling)

# Primary Model Results: Linear Mixed-Effects Model coefficients and statistics
model_results:
  type: csv
  path: data/processed/model_results.csv
  description: |
    Comprehensive results from the LME model fitting, including fixed effects, 
    random effects variance, and goodness-of-fit statistics.
  columns:
    - name: parameter
      type: string
      description: Name of the model parameter (e.g., 'Intercept', 'noise_level_db')
    - name: estimate
      type: float
      description: Estimated coefficient value
    - name: std_error
      type: float
      description: Standard error of the estimate
    - name: t_value
      type: float
      description: T-statistic for the parameter
    - name: p_value
      type: float
      description: Raw p-value for the parameter
    - name: p_value_fdr
      type: float
      description: FDR-corrected p-value (Benjamini-Hochberg)
    - name: effect_size
      type: float
      description: Cohen's d or similar effect size metric
    - name: confidence_interval_lower
      type: float
      description: Lower bound of 95% confidence interval
    - name: confidence_interval_upper
      type: float
      description: Upper bound of 95% confidence interval
    - name: component
      type: string
      description: Model component ('fixed' or 'random')
      allowed_values: ['fixed', 'random']
    - name: group
      type: string
      description: Grouping factor for random effects (e.g., 'species', 'location')
      nullable: true
  constraints:
    - p_value_fdr must be >= 0 and <= 1
    - estimate and std_error must be finite numbers

# LOSO Cross-Validation Results
loso_results:
  type: csv
  path: data/processed/loso_results.csv
  description: |
    Leave-One-Species-Out cross-validation metrics for each fold.
  columns:
    - name: fold_id
      type: integer
      description: Fold number (0-indexed)
    - name: excluded_species
      type: string
      description: Species ID excluded in this fold
    - name: r_squared
      type: float
      description: R-squared on the held-out species
    - name: rmse
      type: float
      description: Root Mean Squared Error on held-out data
    - name: mae
      type: float
      description: Mean Absolute Error on held-out data
    - name: correlation_r
      type: float
      description: Pearson correlation between predicted and actual
    - name: sample_size
      type: integer
      description: Number of records used in training
    - name: test_size
      type: integer
      description: Number of records in the held-out set
  constraints:
    - r_squared, rmse, mae, correlation_r must be finite
    - sample_size + test_size should equal total dataset size

# Sensitivity Analysis Results
sensitivity_summary:
  type: csv
  path: data/processed/sensitivity_summary.csv
  description: |
    Summary of model stability across different SNR thresholds.
  columns:
    - name: threshold
      type: float
      description: SNR threshold used (in dB)
    - name: sample_size
      type: integer
      description: Number of records retained at this threshold
    - name: correlation_r
      type: float
      description: Pearson correlation between noise and complexity
    - name: variation_percent
      type: float
      description: Percentage variation in effect size relative to baseline (10 dB)
    - name: is_baseline
      type: boolean
      description: Whether this row represents the baseline threshold
  constraints:
    - variation_percent must be >= 0
    - Exactly one row must have is_baseline = true

# False Positive Analysis
false_positive_analysis:
  type: json
  path: data/processed/false_positive_analysis.json
  description: |
    JSON structure containing false positive rate estimates across thresholds.
  structure:
    baseline_threshold: float
    baseline_fpr: float
    threshold_analysis:
      type: array
      items:
        type: object
        properties:
          threshold: float
          fpr_estimate: float
          variation_from_baseline: float
          is_significant: boolean
  constraints:
    - All FPR values must be between 0 and 1

# Power Analysis Report
power_analysis_report:
  type: markdown
  path: data/interim/power_analysis_report.md
  description: |
    Text report containing power analysis results and minimum detectable effect sizes.
  required_sections:
    - "Power Analysis Summary"
    - "Sample Size (N)"
    - "Alpha Level"
    - "Minimum Detectable Effect Size"
    - "Achieved Power"
    - "Assumptions"

# Diagnostic Plots (generated files)
diagnostic_plots:
  type: directory
  path: data/figures/
  description: |
    Directory containing residual diagnostic plots.
  required_files:
    - filename: residual_qq.png
      description: Q-Q plot of residuals
    - filename: residual_vs_fitted.png
      description: Residuals vs. Fitted values plot
    - filename: scatter_regression.png
      description: Scatter plot with regression line and CI
    - filename: heatmap_complexity_noise.png
      description: Regional heatmap of noise vs. complexity

# Final Summary Report
final_report:
  type: markdown
  path: data/processed/report.md
  description: |
    Comprehensive summary report of the entire analysis.
  required_sections:
    - "Executive Summary"
    - "Correlation Analysis"
    - "Model Results"
    - "Power Analysis"
    - "Sensitivity Analysis"
    - "Limitations"
    - "Conclusion"