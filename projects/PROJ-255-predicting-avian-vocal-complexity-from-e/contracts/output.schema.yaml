# Contract: Output Schema for Model Results
# Defines the structure and types of files produced by the modeling pipeline (US2).
# Used for validation of model output artifacts before downstream consumption.
#
# Related Tasks: T007, T022, T024, T025, T026, T027, T028, T030, T031

version: "1.0.0"
schema_type: model_output
description: >
  Schema for model results generated by the avian vocal complexity analysis.
  Includes LME model coefficients, correlation statistics, sensitivity analysis,
  and cross-validation results.

artifacts:
  # T024/T025/T026: Primary Model Results
  - file: data/processed/model_results.csv
    description: >
      Primary output containing Linear Mixed-Effects model coefficients,
      p-values, effect sizes, and FDR-corrected p-values.
    format: csv
    columns:
      - name: metric
        type: string
        description: The vocal complexity metric (e.g., syllable_count, spectral_entropy)
      - name: estimate
        type: float
        description: The fixed effect estimate (slope) for noise_level
      - name: std_error
        type: float
        description: Standard error of the estimate
      - name: z_value
        type: float
        description: Z-statistic (estimate / std_error)
      - name: p_value
        type: float
        description: Raw p-value for the fixed effect
      - name: p_value_fdr
        type: float
        description: Benjamini-Hochberg FDR corrected p-value
      - name: effect_size
        type: float
        description: Calculated effect size (e.g., Cohen's d or partial R2)
      - name: model_r2
        type: float
        description: Marginal R-squared of the LME model
      - name: model_r2_conditional
        type: float
        description: Conditional R-squared of the LME model
    constraints:
      - p_value >= 0.0 and p_value <= 1.0
      - p_value_fdr >= 0.0 and p_value_fdr <= 1.0
      - All numeric columns must not be NaN

  # T025: Correlation Analysis
  - file: data/processed/correlation_analysis.csv
    description: >
      Pearson correlation results between noise levels and complexity metrics.
    format: csv
    columns:
      - name: metric
        type: string
        description: The vocal complexity metric
      - name: correlation_r
        type: float
        description: Pearson correlation coefficient
      - name: p_value
        type: float
        description: P-value for the correlation
      - name: ci_lower
        type: float
        description: Lower bound of 95% confidence interval
      - name: ci_upper
        type: float
        description: Upper bound of 95% confidence interval
      - name: n_samples
        type: integer
        description: Number of samples used in calculation
    constraints:
      - correlation_r between -1.0 and 1.0
      - p_value between 0.0 and 1.0

  # T027: LOSO Cross-Validation Results
  - file: data/processed/loso_results.csv
    description: >
      Results from Leave-One-Species-Out cross-validation.
    format: csv
    columns:
      - name: left_out_species
        type: string
        description: The species ID excluded in this fold
      - name: fold_r2
        type: float
        description: R-squared for this fold
      - name: fold_rmse
        type: float
        description: Root Mean Squared Error for this fold
      - name: fold_mae
        type: float
        description: Mean Absolute Error for this fold
    constraints:
      - fold_r2 between -1.0 and 1.0 (allowing for poor fits)
      - fold_rmse >= 0.0
      - fold_mae >= 0.0

  # T030/T031: Sensitivity Analysis
  - file: data/processed/sensitivity_summary.csv
    description: >
      Summary of sensitivity analysis across different SNR thresholds.
    format: csv
    columns:
      - name: threshold_db
        type: float
        description: The SNR threshold used (e.g., 5.0, 10.0, 15.0)
      - name: sample_size
        type: integer
        description: Number of records retained at this threshold
      - name: correlation_r
        type: float
        description: Correlation coefficient at this threshold
      - name: variation_percent
        type: float
        description: Percentage variation from the baseline (10 dB)
    constraints:
      - sample_size > 0
      - variation_percent >= 0.0

  # T031b: False Positive Analysis
  - file: data/processed/false_positive_analysis.json
    description: >
      JSON object containing false positive rate estimates across thresholds.
    format: json
    structure:
      type: object
      properties:
        baseline_threshold:
          type: number
          description: The baseline SNR threshold (10 dB)
        thresholds:
          type: array
          items:
            type: object
            properties:
              threshold_db:
                type: number
              estimated_fpr:
                type: number
                description: Estimated false positive rate
              fpr_variation:
                type: number
                description: Variation from baseline FPR
      required:
        - baseline_threshold
        - thresholds

  # T028: Diagnostics
  - file: data/figures/residual_diagnostics.png
    description: >
      PNG image containing Q-Q plot and residual vs. fitted plot.
    format: image/png
    constraints:
      - file_size_bytes > 0

  # T029: Power Analysis
  - file: data/interim/power_analysis_report.md
    description: >
      Markdown report detailing power analysis results.
    format: markdown
    constraints:
      - must contain "Minimum Detectable Effect Size"
      - must contain "Power"
      - file_size_bytes > 0

validation_rules:
  - rule: numeric_columns_valid
    description: All numeric columns must be parseable as float/int and not NaN.
    implementation: tests/contract/test_output_schema.py::test_numeric_columns_are_valid
  - rule: schema_compliance
    description: All required columns must be present in each artifact.
    implementation: tests/contract/test_output_schema.py::test_required_columns_present
  - rule: file_existence
    description: All listed artifact files must exist on disk.
    implementation: tests/contract/test_output_schema.py::test_artifacts_exist