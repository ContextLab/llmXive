$schema: http://json-schema.org/draft-07/schema#
title: "Avian Vocal Complexity Dataset"
description: "Schema for the final processed dataset used in LMM analysis."
type: object
properties:
  recording_id:
    type: string
    description: "Unique identifier for the recording."
  species_id:
    type: string
    description: "Xeno-canto species code."
  latitude:
    type: number
    description: "Latitude of recording location."
  longitude:
    type: number
    description: "Longitude of recording location."
  noise_level_db:
    type: number
    description: "Ambient noise level in dB(A)."
  habitat_type:
    type: string
    description: "Land cover class (e.g., Urban, Forest)."
  syllable_count:
    type: integer
    description: "Number of syllables in the vocalization."
  duration_seconds:
    type: number
    description: "Total duration of the recording in seconds."
  frequency_bandwidth_hz:
    type: number
    description: "Frequency bandwidth in Hz (95th - 5th percentile)."
  spectral_entropy:
    type: number
    description: "Spectral entropy of the recording."
  snr_db:
    type: number
    description: "Signal-to-Noise Ratio in dB."
  location_id:
    type: string
    description: "Geohash or region identifier."
required:
  - recording_id
  - species_id
  - noise_level_db
  - habitat_type
  - syllable_count
  - duration_seconds
  - frequency_bandwidth_hz
  - spectral_entropy
  - snr_db
additionalProperties: false