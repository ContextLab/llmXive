# Ruff configuration for PROJ-255
# Linting rules aligned with scientific Python best practices
line-length = 100
target-version = "py39"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line-too-long (handled by formatter)
    "B008", # do-not-perform-function-calls-in-argument-defaults (common in data loading)
]

[lint.isort]
known-first-party = ["src", "tests", "code"]
force-sort-within-sections = true

[lint.per-file-ignores]
"code/__init__.py" = ["F401"]
"src/__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"] # allow assert in tests
