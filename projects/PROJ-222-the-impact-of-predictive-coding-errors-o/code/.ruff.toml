[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (black handles this)
    "B008",  # do not perform function calls in argument defaults (common in data loading)
]

[lint.per-file-ignores]
"code/run_pipeline.py" = ["E402"]  # Ignore import order in main entry point

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
