[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-predictive-coding"
version = "0.1.0"
description = "The Impact of Predictive Coding Errors on Subjective Time Perception"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.0.3",
    "numpy==1.24.3",
    "statsmodels==0.14.0",
    "pingouin==0.5.3",
    "joblib==1.3.2",
    "matplotlib==3.8.0",
    "seaborn==0.13.0",
    "openml==0.14.2",
    "datasets==2.14.0",
    "pyyaml==6.0.1",
    "black==23.12.1",
    "ruff==0.1.9",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (black handles this)
    "B008", # do not perform function calls in argument defaults
]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.isort]
known-first-party = ["analysis", "config", "download", "preprocess", "utils"]
force-sort-within-sections = true
