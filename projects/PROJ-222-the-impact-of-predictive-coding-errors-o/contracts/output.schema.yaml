$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Results Schema"
description: "Schema defining the structure of analysis results for the predictive coding time perception study."
type: object
required:
  - metadata
  - model_results
  - effect_sizes
  - sensitivity_analysis
  - diagnostics
properties:
  metadata:
    type: object
    description: "Metadata about the analysis run."
    required:
      - timestamp
      - dataset_id
      - version
    properties:
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of the analysis run."
      dataset_id:
        type: string
        description: "Identifier of the dataset used for this analysis."
      version:
        type: string
        description: "Version of the analysis pipeline."
      seed:
        type: integer
        description: "Random seed used for reproducibility."

  model_results:
    type: object
    description: "Results from the Linear Mixed-Effects Model (LMM)."
    required:
      - formula
      - convergence_status
      - fixed_effects
      - random_effects
    properties:
      formula:
        type: string
        description: "The formula used for the LMM (e.g., 'Duration ~ Surprisal + (1|Participant_ID)')."
      convergence_status:
        type: boolean
        description: "Whether the model converged successfully."
      convergence_message:
        type: string
        description: "Message from the model fitting procedure regarding convergence."
      fixed_effects:
        type: array
        description: "Results for fixed effects."
        items:
          type: object
          required:
            - term
            - estimate
            - std_error
            - t_statistic
            - p_value
            - ci_lower
            - ci_upper
          properties:
            term:
              type: string
              description: "Name of the predictor term."
            estimate:
              type: number
              description: "Estimated coefficient."
            std_error:
              type: number
              description: "Standard error of the estimate."
            t_statistic:
              type: number
              description: "T-statistic for the term."
            p_value:
              type: number
              description: "P-value for the term."
            ci_lower:
              type: number
              description: "Lower bound of the 95% confidence interval."
            ci_upper:
              type: number
              description: "Upper bound of the 95% confidence interval."
            corrected_p_value:
              type: number
              description: "P-value after multiple comparison correction (if applicable)."
      random_effects:
        type: object
        description: "Variance components for random effects."
        properties:
          participant_id_variance:
            type: number
            description: "Variance of the random intercept for Participant_ID."
          residual_variance:
            type: number
            description: "Residual variance."

  effect_sizes:
    type: object
    description: "Effect size calculations (e.g., Cohen's d)."
    required:
      - surprisal_effect
    properties:
      surprisal_effect:
        type: object
        description: "Effect size for the Surprisal predictor."
        required:
          - cohens_d
          - ci_lower
          - ci_upper
        properties:
          cohens_d:
            type: number
            description: "Cohen's d effect size."
          ci_lower:
            type: number
            description: "Lower bound of the 95% CI for Cohen's d."
          ci_upper:
            type: number
            description: "Upper bound of the 95% CI for Cohen's d."
          method:
            type: string
            description: "Method used for calculation (e.g., 'pingouin')."

  sensitivity_analysis:
    type: object
    description: "Sensitivity analysis results."
    required:
      - mde
      - power
    properties:
      mde:
        type: number
        description: "Minimum Detectable Effect (MDE) for power=0.80."
      power:
        type: number
        description: "Target power used for MDE calculation."
      cutoff_sweep_status:
        type: string
        description: "Status of cutoff-sweeping analysis if performed."
      fwer_control_status:
        type: string
        description: "Status of Family-Wise Error Rate control (e.g., 'controlled', 'not applicable')."

  diagnostics:
    type: object
    description: "Model diagnostics and validation results."
    required:
      - normality_test
      - residual_plot_path
    properties:
      normality_test:
        type: object
        description: "Results of the normality test on residuals."
        required:
          - statistic
          - p_value
          - is_normal
        properties:
          statistic:
            type: number
            description: "Shapiro-Wilk statistic."
          p_value:
            type: number
            description: "P-value from Shapiro-Wilk test."
          is_normal:
            type: boolean
            description: "Whether residuals are considered normal (alpha=0.05)."
      residual_plot_path:
        type: string
        description: "Relative path to the residual diagnostic plot."
      bootstrap_ci_method:
        type: string
        description: "Method used for bootstrap confidence intervals (e.g., 'percentile')."
      bootstrap_n_samples:
        type: integer
        description: "Number of bootstrap samples used."