# Output Schema for Predictive Coding Time Perception Analysis
# Defines the structure of analysis results written to analysis/results.json
# Generated for task T006
type: object
required:
  - analysis_metadata
  - model_results
  - effect_sizes
  - sensitivity_analysis
  - quality_control

properties:
  analysis_metadata:
    type: object
    description: Metadata about the analysis run
    required:
      - timestamp
      - dataset_id
      - version
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the analysis was run
      dataset_id:
        type: string
        description: Identifier of the dataset used (from data/README.md)
      version:
        type: string
        description: Schema version (e.g., "1.0.0")
      seed:
        type: integer
        description: Random seed used for reproducibility

  model_results:
    type: object
    description: Results from the Linear Mixed-Effects Model (LMM)
    required:
      - formula
      - coefficients
      - convergence_status
    properties:
      formula:
        type: string
        description: The R-style formula used for the model
        example: "Duration ~ Surprisal + Sequence_Length + Modality + (1 | Participant_ID)"
      coefficients:
        type: array
        description: List of coefficient results
        items:
          type: object
          required:
            - term
            - estimate
            - std_error
            - p_value
          properties:
            term:
              type: string
              description: Name of the predictor term
            estimate:
              type: number
              description: Estimated coefficient value
            std_error:
              type: number
              description: Standard error of the estimate
            p_value:
              type: number
              minimum: 0
              maximum: 1
              description: P-value for the coefficient
            confidence_interval:
              type: object
              properties:
                lower:
                  type: number
                upper:
                  type: number
              description: 95% Confidence interval bounds
      convergence_status:
        type: string
        enum: ["converged", "failed", "max_iter_reached"]
        description: Status of model convergence
      convergence_rate:
        type: number
        minimum: 0
        maximum: 1
        description: Rate of convergence (proportion of successful fits)
        required_if: multiple_datasets

  effect_sizes:
    type: object
    description: Effect size calculations (Cohen's d) and comparisons
    properties:
      surprisal_effect:
        type: object
        description: Effect size for the main surprisal effect
        properties:
          cohen_d:
            type: number
            description: Cohen's d effect size
          ci_lower:
            type: number
          ci_upper:
            type: number
          p_value:
            type: number
            minimum: 0
            maximum: 1
          corrected_p_value:
            type: number
            description: P-value after multiple comparison correction
            required_if: multiple_tests
      correction_method:
        type: string
        enum: ["bonferroni", "benjamini_hochberg", "none"]
        description: Method used for multiple comparison correction
      num_tests:
        type: integer
        minimum: 1
        description: Number of statistical tests performed

  sensitivity_analysis:
    type: object
    description: Sensitivity analysis results including MDE
    required:
      - mde
      - power
      - alpha
    properties:
      mde:
        type: number
        description: Minimum Detectable Effect size for the given power and alpha
      power:
        type: number
        description: Target statistical power (e.g., 0.80)
        example: 0.80
      alpha:
        type: number
        description: Significance level (e.g., 0.05)
        example: 0.05
      observed_effect:
        type: number
        description: Observed effect size from the data
      is_significant:
        type: boolean
        description: Whether observed effect exceeds MDE
      limitation_reported:
        type: boolean
        description: Flag indicating if limitation was logged when effect < MDE

  quality_control:
    type: object
    description: Quality control and validation metrics
    required:
      - fwer_control_status
      - normality_check
    properties:
      fwer_control_status:
        type: string
        enum: ["controlled", "not_applicable", "failed"]
        description: Status of Family-Wise Error Rate control (α ≤ 0.05)
      normality_check:
        type: object
        description: Normality test results (Shapiro-Wilk)
        properties:
          statistic:
            type: number
          p_value:
            type: number
          is_normal:
            type: boolean
            description: True if p > 0.05 (null hypothesis not rejected)
          test_used:
            type: string
            enum: ["parametric", "non_parametric"]
            description: Which test was ultimately used based on normality
      convergence_rate:
        type: number
        description: Proportion of models that converged successfully
      bootstrap_ci:
        type: boolean
        description: Whether bootstrap confidence intervals were used

additionalProperties: false
description: |
  This schema defines the expected structure of the analysis results file.
  It ensures all required metrics (coefficients, p-values, effect sizes, MDE,
  convergence status) are present for reproducibility and validation.
  Used by T027 to write analysis/results.json.