# Output Schema for Predictive Coding Time Perception Analysis
# This schema defines the structure of analysis results generated by code/analysis.py
# and stored in analysis/results.json
$schema: http://json-schema.org/draft-07/schema#
title: Analysis Results Schema
description: >
  Defines the structure of statistical analysis results including LMM coefficients,
  effect sizes, p-values, confidence intervals, and sensitivity analysis metrics.

type: object
required:
  - metadata
  - model_results
  - effect_sizes
  - sensitivity_analysis
  - quality_control

properties:
  metadata:
    type: object
    description: Metadata about the analysis run
    required:
      - timestamp
      - dataset_id
      - pipeline_version
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of analysis execution
      dataset_id:
        type: string
        description: Identifier of the processed dataset
      pipeline_version:
        type: string
        description: Version of the analysis pipeline used
      config_hash:
        type: string
        description: SHA256 hash of configuration parameters

  model_results:
    type: object
    description: Linear Mixed Effects Model results
    required:
      - formula
      - coefficients
      - convergence_status
      - fwer_control_status
    properties:
      formula:
        type: string
        description: LMM formula used (e.g., "Duration ~ Surprisal + ...")
      convergence_status:
        type: object
        required:
          - converged
          - method
          - message
        properties:
          converged:
            type: boolean
            description: Whether the model converged successfully
          method:
            type: string
            description: Fitting method used (e.g., 'REML', 'ML')
          message:
            type: string
            description: Convergence message or warning
          fallback_used:
            type: boolean
            description: Whether fallback to random-intercept-only model was used
      coefficients:
        type: array
        description: List of coefficient results for each predictor
        items:
          type: object
          required:
            - term
            - estimate
            - std_error
            - t_value
            - p_value
            - ci_lower
            - ci_upper
          properties:
            term:
              type: string
              description: Predictor term name
            estimate:
              type: number
              description: Coefficient estimate
            std_error:
              type: number
              description: Standard error of the estimate
            t_value:
              type: number
              description: T-statistic
            p_value:
              type: number
              minimum: 0
              maximum: 1
              description: Raw p-value
            p_value_adjusted:
              type: number
              minimum: 0
              maximum: 1
              description: Multiple-comparison adjusted p-value
            ci_lower:
              type: number
              description: Lower bound of 95% confidence interval
            ci_upper:
              type: number
              description: Upper bound of 95% confidence interval
            bootstrap_ci:
              type: object
              description: Bootstrap-based confidence interval (if computed)
              properties:
                lower:
                  type: number
                upper:
                  type: number
                n_iterations:
                  type: integer
      fwer_control_status:
        type: object
        description: Family-Wise Error Rate control verification
        required:
          - controlled
          - method
          - alpha
        properties:
          controlled:
            type: boolean
            description: Whether FWER is controlled at alpha level
          method:
            type: string
            description: Correction method used (e.g., 'bonferroni', 'bh')
          alpha:
            type: number
            description: Significance threshold used

  effect_sizes:
    type: object
    description: Effect size calculations (Cohen's d with 95% CI)
    required:
      - comparisons
    properties:
      comparisons:
        type: array
        description: Pairwise comparisons with effect sizes
        items:
          type: object
          required:
            - group1
            - group2
            - cohens_d
            - ci_lower
            - ci_upper
            - p_value
          properties:
            group1:
              type: string
              description: First group label
            group2:
              type: string
              description: Second group label
            cohens_d:
              type: number
              description: Cohen's d effect size
            ci_lower:
              type: number
              description: Lower bound of 95% CI for d
            ci_upper:
              type: number
              description: Upper bound of 95% CI for d
            p_value:
              type: number
              description: P-value for the difference

  sensitivity_analysis:
    type: object
    description: Sensitivity and power analysis results
    required:
      - mde
      - power
      - observed_effect_vs_mde
    properties:
      mde:
        type: number
        description: Minimum Detectable Effect for power=0.80
      power:
        type: number
        description: Target power used for MDE calculation
      alpha:
        type: number
        description: Significance level used
      sample_size:
        type: integer
        description: Effective sample size used for calculation
      observed_effect_vs_mde:
        type: object
        required:
          - observed_effect
          - is_significant
          - limitation_reported
        properties:
          observed_effect:
            type: number
            description: Observed effect size from data
          is_significant:
            type: boolean
            description: Whether observed effect >= MDE
          limitation_reported:
            type: boolean
            description: Whether limitation was flagged if effect < MDE

  quality_control:
    type: object
    description: Quality control checks and diagnostics
    required:
      - normality_check
      - sample_quality
    properties:
      normality_check:
        type: object
        required:
          - test
          - statistic
          - p_value
          - is_normal
        properties:
          test:
            type: string
            description: Test used (e.g., 'shapiro-wilk')
          statistic:
            type: number
            description: Test statistic
          p_value:
            type: number
            description: P-value of normality test
          is_normal:
            type: boolean
            description: Whether residuals pass normality assumption (alpha=0.05)
      sample_quality:
        type: object
        properties:
          total_observations:
            type: integer
          total_participants:
            type: integer
          missing_data_ratio:
            type: number
            minimum: 0
            maximum: 1
            description: Proportion of missing values
          outlier_count:
            type: integer
            description: Number of outliers detected

additionalProperties: false