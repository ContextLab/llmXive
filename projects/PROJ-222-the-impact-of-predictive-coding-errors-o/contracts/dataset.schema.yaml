schema_version: "1.0.0"
description: >
  Schema definition for time-perception datasets used in the predictive coding study.
  Enforces presence of critical columns required for Gate 0 validation and downstream analysis.

required_columns:
  - name: participant_id
    type: string
    description: >
      Unique identifier for the participant. 
      Used for grouping in Linear Mixed Effects models (random intercepts).
      Must not contain NaN values.
  - name: stimulus_sequence
    type: string
    description: >
      Identifier or sequence string representing the order of stimuli presented.
      Used to compute transition probabilities and Markov surprisal.
      Must not contain NaN values.
  - name: duration_estimate
    type: float
    description: >
      The participant's subjective estimate of the duration of the stimulus.
      This is the primary dependent variable for analysis.
      Must be numeric.

optional_columns:
  - name: condition_label
    type: string
    description: >
      Label indicating the experimental condition (e.g., 'predictable', 'random').
      Used for fixed effects in statistical models.
  - name: stimulus_duration
    type: float
    description: >
      The actual physical duration of the stimulus presentation.
  - name: trial_id
    type: integer
    description: >
      Unique identifier for the trial within a participant.
  - name: modality
    type: string
    description: >
      Sensory modality of the stimulus (e.g., 'visual', 'auditory').
  - name: sequence_length
    type: integer
    description: >
      Length of the sequence up to the current trial.
  - name: surprisal
    type: float
    description: >
      Pre-calculated surprisal metric (information content) for the stimulus.
      If present, it must align with the `stimulus_sequence`.

validation_rules:
  - rule: no_missing_required
    severity: error
    message: "Missing one or more required columns: participant_id, stimulus_sequence, duration_estimate"
  - rule: type_check_duration
    severity: error
    message: "Column 'duration_estimate' must be of numeric type (float/int)"
  - rule: no_nan_required
    severity: error
    message: "Required columns must not contain NaN values"

file_format:
  type: csv
  delimiter: ","
  encoding: utf-8
  index: false