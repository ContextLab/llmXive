# llmXive Configuration Defaults
# Generated by T014 and extended for T016

# Number of objectives (N)
n_objectives: [5, 10, 20, 50]

# Window size (k) for Moving-Window Heuristic
# Must be < rollout_group_size
k: 10

# Ratios for k sweep (fraction of rollout_group_size)
k_sweep: [0.01, 0.05, 0.1]

# Random seeds for reproducibility
seeds: [42, 123, 456]

# Noise correlation parameter (rho)
noise_correlation: [0.0, 0.2, 0.5]

# Rollout group size
rollout_group_size: 100

# Memory limit in GB
memory_limit_gb: 7

# Number of CPU cores to use
cpu_cores: 2
