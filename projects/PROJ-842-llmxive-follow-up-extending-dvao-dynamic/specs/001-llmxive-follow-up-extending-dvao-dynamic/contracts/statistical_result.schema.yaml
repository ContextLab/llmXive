$schema: "http://json-schema.org/draft-07/schema#"
title: StatisticalResult
description: Schema for aggregated statistical analysis results.
type: object
required:
  - config_id
  - num_objectives
  - window_ratio
  - regression_slope
  - slope_ci_lower
  - slope_ci_upper
  - t_test_p_value
  - fdr_q_value
  - mean_bias
  - pareto_distance
  - convergence_status
  - noise_distribution_type
  - sample_complexity_ratio
  - coincidence_delta
  - false_positive_rate
  - timestamp
properties:
  config_id:
    type: string
    description: "Unique identifier for the configuration run."
  num_objectives:
    type: integer
    description: "Number of objectives (N) for this run."
    minimum: 1
  window_ratio:
    type: number
    description: "The ratio k / rollout_size used."
    minimum: 0.0
    maximum: 1.0
  regression_slope:
    type: number
    description: "Slope beta from log-log regression of sample count vs N."
  slope_ci_lower:
    type: number
    description: "Lower bound of 95% CI for slope."
  slope_ci_upper:
    type: number
    description: "Upper bound of 95% CI for slope."
  t_test_p_value:
    type: number
    description: "P-value from the one-sample t-test comparing Heuristic vs. Known Variance (sanity check)."
    minimum: 0.0
    maximum: 1.0
  fdr_q_value:
    type: number
    description: "Adjusted p-value from Benjamini-Hochberg FDR."
    minimum: 0.0
    maximum: 1.0
  mean_bias:
    type: number
    description: "Mean difference (Heuristic - Known) variance."
  pareto_distance:
    type: number
    description: "Distance of the final policy from the theoretical Pareto frontier."
    minimum: 0.0
  convergence_status:
    type: string
    enum:
      - "stable"
      - "unstable"
      - "failed"
    description: "Status of the heuristic convergence."
  false_positive_rate:
    type: number
    description: "Rate of false positives in stability detection."
    minimum: 0.0
    maximum: 1.0
  noise_distribution_type:
    type: string
    enum:
      - "gaussian"
      - "heavy_tailed"
      - "sparse"
      - "non_convex"
    description: "Type of noise distribution used in the simulation."
  sample_complexity_ratio:
    type: number
    description: "Ratio of empirical samples used to theoretical lower bound K."
    minimum: 0.0
  coincidence_delta:
    type: integer
    description: "Difference between failure point N and Pareto distance point."
    minimum: 0
  timestamp:
    type: string
    format: date-time
    description: "ISO8601 timestamp of analysis."
additionalProperties: false