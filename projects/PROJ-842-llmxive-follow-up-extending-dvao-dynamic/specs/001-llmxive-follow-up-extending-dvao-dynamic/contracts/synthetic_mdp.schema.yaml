$schema: "http://json-schema.org/draft-07/schema#"
title: "Synthetic MDP Configuration"
description: "Schema for the noise properties and environment configuration generated by synthetic_mdp.py"
type: object
properties:
  experiment_id:
    type: string
    description: "Unique identifier for the environment generation"
  n_objectives:
    type: integer
    description: "Number of objectives N"
    minimum: 1
  target_correlation:
    type: number
    description: "Target correlation coefficient rho"
    minimum: 0
    maximum: 1
  achieved_correlation_matrix:
    type: array
    items:
      type: array
      items:
        type: number
    description: "Actual correlation matrix achieved"
    minItems: 1
  noise_distribution_type:
    type: string
    description: "Type of noise distribution (Gaussian, Heavy-tailed, etc.)"
    enum:
      - "Gaussian"
      - "Heavy-tailed"
      - "Uniform"
  effective_state_space_size:
    type: integer
    description: "Actual state space size used (may be reduced if N > 50)"
    minimum: 1
  seed:
    type: integer
    description: "Random seed used for generation"
required:
  - experiment_id
  - n_objectives
  - achieved_correlation_matrix
  - noise_distribution_type
  - effective_state_space_size
  - seed
additionalProperties: false
