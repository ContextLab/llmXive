$schema: http://json-schema.org/draft-07/schema
type: object
description: Schema for the synthetic multi-objective MDP data.
properties:
  state_space_size:
    type: integer
    description: The size of the state space.
  action_space_size:
    type: integer
    description: The size of the action space.
  num_objectives:
    type: integer
    description: The number of reward objectives.
  reward_functions:
    type: array
    description: A list of reward functions.
    items:
      type: object
      properties:
        weights:
          type: array
          items:
            type: number
            description: Weights for the linear combination of state features.
        bias:
          type: number
          description: Bias term for the reward function.
