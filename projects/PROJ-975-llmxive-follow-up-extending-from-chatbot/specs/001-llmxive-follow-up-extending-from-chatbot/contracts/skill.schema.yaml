$schema: "http://json-schema.org/draft-07/schema#"
title: "Skill Schema"
description: "Schema for synthetic skill definitions with embeddings."
type: "object"
properties:
  skill_id:
    type: "string"
    description: "Unique identifier for the skill."
  name:
    type: "string"
    description: "Python function name."
  code:
    type: "string"
    description: "Python source code of the skill."
  embedding:
    type: "array"
    items:
      type: "number"
    minItems: 768
    maxItems: 768
    description: "768-dimensional embedding vector."
  usage_count:
    type: "integer"
    minimum: 0
    description: "Number of times the skill has been used (runtime metric)."
  last_used:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of last usage."
required:
  - skill_id
  - name
  - code
  - embedding
  - usage_count
  - last_used
additionalProperties: false
