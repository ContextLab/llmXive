$schema: "http://json-schema.org/draft-07/schema#"
title: "Skill Schema"
description: "Schema for Python function skills in the library."
type: "object"
properties:
  skill_id:
    type: "string"
    description: "Unique identifier for the skill (e.g., skill_001)."
  code_snippet:
    type: "string"
    description: "The Python function source code."
  embedding_vector:
    type: "array"
    description: "384-dimensional embedding vector."
    items:
      type: "number"
    minItems: 384
    maxItems: 384
  usage_count:
    type: "integer"
    description: "Runtime counter of how often this skill was used."
    minimum: 0
  last_used_index:
    type: "integer"
    description: "Index of the task where it was last used."
    minimum: -1
required:
  - skill_id
  - code_snippet
  - embedding_vector
  - usage_count
  - last_used_index
additionalProperties: false