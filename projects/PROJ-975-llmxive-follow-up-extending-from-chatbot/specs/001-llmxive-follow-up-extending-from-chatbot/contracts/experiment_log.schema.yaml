$schema: "http://json-schema.org/draft-07/schema#"
title: "Experiment Log Schema"
description: "Schema for the CSV output of the agent execution. Note: JSON schema for CSV is conceptual; this defines the expected columns and types for validation scripts."
type: "object"
properties:
  run_id:
    type: "string"
    description: "Unique identifier for the experiment run configuration."
  task_id:
    type: "string"
    description: "Reference to the task executed."
  library_size:
    type: "integer"
    description: "Size of the skill library used (10, 30, 50, or 100)."
  pruning_enabled:
    type: "boolean"
    description: "Whether the pruning heuristic was active."
  success:
    type: "boolean"
    description: "Whether the task was completed successfully."
  latency_ms:
    type: "number"
    description: "Execution latency in milliseconds."
  tokens_used:
    type: "integer"
    description: "Estimated token count."
  retrieval_precision:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Jaccard similarity between retrieved and ground truth skills."
  retrieval_diversity:
    type: "number"
    description: "Inverse variance of cosine similarities."
  edge_case:
    type: "string"
    description: "Tag for edge cases (e.g., 'missing_skill', 'memory_limit', 'null')."
required:
  - run_id
  - task_id
  - library_size
  - pruning_enabled
  - success
  - latency_ms
  - tokens_used
  - retrieval_precision
  - retrieval_diversity
  - edge_case
additionalProperties: false
