$schema: "http://json-schema.org/draft-07/schema#"
title: "Skill Schema"
type: "object"
properties:
  skill_id:
    type: "string"
    description: "Unique identifier for the skill"
  function_code:
    type: "string"
    description: "Python code snippet for the skill"
  embedding_vector:
    type: "array"
    items:
      type: "number"
    description: "Vector representation of the skill"
  usage_count:
    type: "integer"
    description: "Number of times the skill has been used"
required:
  - skill_id
  - function_code
  - embedding_vector
  - usage_count
