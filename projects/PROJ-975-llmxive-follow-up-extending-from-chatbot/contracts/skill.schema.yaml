$schema: http://json-schema.org/draft-07/schema#
title: Skill Schema
description: Schema for individual skill entries in the skills library.
type: object
required:
  - id
  - name
  - description
  - code
  - embedding_vector
  - similarity_stats
properties:
  id:
    type: string
    description: Unique identifier for the skill (e.g., "skill_001").
  name:
    type: string
    description: Human-readable name of the skill.
  description:
    type: string
    description: Brief description of what the skill does.
  code:
    type: string
    description: The actual Python code implementation as a string.
  embedding_vector:
    type: array
    description: The pre-computed sentence embedding vector for this skill.
    items:
      type: number
  similarity_stats:
    type: object
    description: Statistics about this skill's similarity to others.
    required:
      - mean_similarity
      - min_similarity
      - max_similarity
    properties:
      mean_similarity:
        type: number
        description: Mean cosine similarity to all other skills.
      min_similarity:
        type: number
        description: Minimum cosine similarity to any other skill.
      max_similarity:
        type: number
        description: Maximum cosine similarity to any other skill.
  metadata:
    type: object
    description: Optional metadata fields.
    properties:
      created_at:
        type: string
      version:
        type: string
additionalProperties: false
