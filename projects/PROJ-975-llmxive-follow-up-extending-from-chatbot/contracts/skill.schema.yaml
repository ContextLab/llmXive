$schema: "http://json-schema.org/draft-07/schema#"
title: Skill Schema
type: object
properties:
  skill_id:
    type: string
    description: "Unique identifier for the skill"
  function_code:
    type: string
    description: "The Python source code of the skill function"
  embedding_vector:
    type: array
    description: "384-dimensional embedding vector from all-MiniLM-L6-v2"
    items:
      type: number
    minItems: 384
    maxItems: 384
required:
  - skill_id
  - function_code
  - embedding_vector
