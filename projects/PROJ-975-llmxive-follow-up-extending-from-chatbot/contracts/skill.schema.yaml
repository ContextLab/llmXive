$schema: http://json-schema.org/draft-07/schema#
title: Skill Schema
description: >
  JSON Schema definition for a skill object in the llmXive system.
  A skill represents a reusable Python function with an embedding vector
  for semantic retrieval and metadata for usage tracking.
type: object
required:
  - skill_id
  - function_code
  - embedding_vector
  - usage_count
properties:
  skill_id:
    type: string
    description: Unique identifier for the skill (e.g., 'skill_001').
    pattern: "^skill_[0-9]+$"
    minLength: 1
  function_code:
    type: string
    description: >
      The actual Python source code of the function as a string.
      Must be valid Python syntax.
    minLength: 1
  embedding_vector:
    type: array
    description: >
      The pre-computed embedding vector for semantic similarity search.
      Generated by the sentence-transformers model.
    items:
      type: number
    minItems: 384
    maxItems: 384
  usage_count:
    type: integer
    description: >
      Number of times this skill has been successfully retrieved and executed.
      Used for the pruning heuristic (T028).
    minimum: 0
  metadata:
    type: object
    description: Optional additional metadata for the skill.
    properties:
      created_at:
        type: string
        format: date-time
      source:
        type: string
        description: Origin of the skill definition.
    additionalProperties: true
additionalProperties: false
examples:
  - skill_id: "skill_001"
    function_code: "def add(a, b):\n    return a + b"
    embedding_vector:
      - 0.0123
      - -0.4567
      - 0.8901
      - 0.1234
      - -0.5678
      # ... (384 dimensions total)
    usage_count: 5
    metadata:
      created_at: "2023-10-27T10:00:00Z"
      source: "synthetic_generation"
