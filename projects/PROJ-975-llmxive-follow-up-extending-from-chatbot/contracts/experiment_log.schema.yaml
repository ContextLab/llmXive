type: object
required:
  - task_id
  - skill_id
  - success
  - latency
  - tokens
  - retrieval_precision
  - retrieval_diversity
  - pruning_risk_count
  - library_size
  - pruning_enabled
properties:
  task_id:
    type: string
    description: ID of the task being executed
  skill_id:
    type: string
    description: ID of the skill retrieved
  success:
    type: boolean
    description: Whether the task execution was successful
  latency:
    type: number
    description: Execution latency in seconds
  tokens:
    type: integer
    description: Number of tokens used
  retrieval_precision:
    type: number
    description: Precision of the retrieval (Jaccard similarity)
  retrieval_diversity:
    type: number
    description: Diversity of retrieved skills
  pruning_risk_count:
    type: integer
    description: Count of pruned skills that had high similarity to ground truth
  library_size:
    type: integer
    description: Size of the library at execution time
  pruning_enabled:
    type: boolean
    description: Whether pruning was enabled for this run