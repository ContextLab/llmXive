$schema: http://json-schema.org/draft-07/schema#
title: Experiment Log Entry
description: Schema for a single row in the experiment log CSV (T009c).
type: object
properties:
  task_id:
    type: string
    description: Unique identifier for the task.
  skill_id:
    type: string
    description: Identifier of the skill used or attempted.
  success:
    type: boolean
    description: Whether the task execution was successful.
  latency:
    type: number
    description: Execution latency in seconds.
  tokens:
    type: integer
    description: Number of tokens consumed.
  retrieval_precision:
    type: number
    description: Jaccard similarity between retrieved and ground-truth skills.
  retrieval_diversity:
    type: number
    description: Inverse variance of cosine similarities of retrieved skills.
  pruning_risk_count:
    type: integer
    description: Number of high-similarity skills pruned during this interval.
  library_size:
    type: integer
    description: Current size of the skill library.
  pruning_enabled:
    type: boolean
    description: Whether pruning was active for this run.
  edge_case:
    type: boolean
    description: Flag indicating if an edge case (e.g., maximal overlap) was triggered.
required:
  - task_id
  - skill_id
  - success
  - latency
  - tokens
  - retrieval_precision
  - retrieval_diversity
  - pruning_risk_count
  - library_size
  - pruning_enabled
  - edge_case
additionalProperties: false
