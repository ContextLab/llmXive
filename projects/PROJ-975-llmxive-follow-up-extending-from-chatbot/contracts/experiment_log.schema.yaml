$schema: http://json-schema.org/draft-07/schema#
title: Experiment Log Entry Schema
description: >-
  Schema for a single row in the experiment log CSV.
  Matches the columns defined in code/agent.py and code/logging_config.py.
type: object
required:
  - task_id
  - skill_id
  - success
  - latency
  - tokens
  - retrieval_precision
  - retrieval_diversity
  - pruning_risk_count
  - library_size
  - pruning_enabled
  - edge_case
properties:
  task_id:
    type: string
    description: Unique identifier for the task being executed.
  skill_id:
    type: string
    description: Identifier of the primary skill or skill set used.
  success:
    type: boolean
    description: Whether the task execution succeeded.
  latency:
    type: number
    description: Execution latency in seconds.
  tokens:
    type: integer
    description: Number of tokens consumed during execution.
  retrieval_precision:
    type: number
    format: float
    description: Jaccard similarity between retrieved skills and ground truth.
  retrieval_diversity:
    type: number
    format: float
    description: Inverse of the variance of cosine similarities of retrieved skills.
  pruning_risk_count:
    type: integer
    description: Number of high-similarity skills pruned in the last pruning cycle.
  library_size:
    type: integer
    description: Current size of the active skill library.
  pruning_enabled:
    type: boolean
    description: Whether pruning heuristic is active for this run.
  edge_case:
    type: boolean
    description: Flag indicating if this run hit a maximal overlap or other edge condition.
additionalProperties: false
