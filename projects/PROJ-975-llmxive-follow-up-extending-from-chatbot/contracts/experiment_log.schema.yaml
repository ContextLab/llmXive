$schema: http://json-schema.org/draft-07/schema#
title: Experiment Log Entry Schema
description: Schema for a single log entry in experiment_log.csv (T009c).
type: object
properties:
  task_id:
    type: string
    description: Identifier for the task.
  skill_id:
    type: string
    description: Identifier for the skill used (or primary skill).
  success:
    type: boolean
    description: Whether the task was completed successfully.
  latency:
    type: number
    description: Execution latency in seconds.
  tokens:
    type: integer
    description: Number of tokens used.
  retrieval_precision:
    type: number
    description: Jaccard similarity between retrieved and ground truth skills.
  retrieval_diversity:
    type: number
    description: Inverse variance of similarities of retrieved skills.
  pruning_risk_count:
    type: integer
    description: Count of pruned skills that had high similarity to ground truth.
  library_size:
    type: integer
    description: Current size of the skill library.
  pruning_enabled:
    type: boolean
    description: Whether pruning was active during this run.
required:
  - task_id
  - skill_id
  - success
  - latency
  - tokens
  - retrieval_precision
  - retrieval_diversity
  - pruning_risk_count
  - library_size
  - pruning_enabled
