$schema: "http://json-schema.org/draft-07/schema#"
title: "Experiment Log Schema"
description: "Schema for a single experiment log entry"
type: "object"
required:
  - task_id
  - skill_id
  - success
  - latency
  - tokens
  - retrieval_precision
  - retrieval_diversity
  - pruning_risk_count
  - library_size
  - pruning_enabled
properties:
  task_id:
    type: "string"
    description: "ID of the task executed"
  skill_id:
    type: "string"
    description: "ID of the skill attempted"
  success:
    type: "boolean"
    description: "Whether the task execution succeeded"
  latency:
    type: "number"
    description: "Execution latency in seconds"
  tokens:
    type: "integer"
    description: "Number of tokens used"
  retrieval_precision:
    type: "number"
    description: "Jaccard similarity between retrieved and ground truth"
    minimum: 0.0
    maximum: 1.0
  retrieval_diversity:
    type: "number"
    description: "Inverse variance of cosine similarities to ground truth"
  pruning_risk_count:
    type: "integer"
    description: "Count of high-similarity skills pruned"
    minimum: 0
  library_size:
    type: "integer"
    description: "Current size of the skill library"
    minimum: 1
  pruning_enabled:
    type: "boolean"
    description: "Whether pruning was active for this run"
additionalProperties: false
