$schema: http://json-schema.org/draft-07/schema#
title: Experiment Log Entry
description: Schema for a single row in the experiment log CSV.
type: object
properties:
  run_id:
    type: string
    description: Unique identifier for the experimental run.
  task_id:
    type: string
    description: Unique identifier for the task.
  library_size:
    type: integer
    description: Current size of the skill library.
  pruning_enabled:
    type: boolean
    description: Whether pruning was active for this run.
  success:
    type: boolean
    description: Whether the task execution was successful.
  latency_ms:
    type: number
    description: Execution latency in milliseconds.
  tokens_used:
    type: integer
    description: Number of tokens consumed.
  retrieval_precision:
    type: number
    description: Jaccard similarity between retrieved and ground-truth skills.
  retrieval_diversity:
    type: number
    description: Inverse variance of cosine similarities of retrieved skills.
  edge_case:
    type: string
    description: Description of the edge case triggered (e.g., 'missing_skill', 'maximal_overlap', 'none').
required:
  - run_id
  - task_id
  - library_size
  - pruning_enabled
  - success
  - latency_ms
  - tokens_used
  - retrieval_precision
  - retrieval_diversity
  - edge_case
additionalProperties: false
