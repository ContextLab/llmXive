$schema: http://json-schema.org/draft-07/schema#
title: Experiment Log Schema
description: Schema for the CSV log file recording agent execution metrics per task.
type: object
required:
  - task_id
  - skill_id
  - success
  - latency
  - tokens
  - retrieval_precision
  - retrieval_diversity
  - pruning_risk_count
  - library_size
  - pruning_enabled
properties:
  task_id:
    type: string
    description: The ID of the task being executed.
    pattern: "^task_\\d+$"
  skill_id:
    type: string
    description: The primary skill attempted or the root of the solution path.
    pattern: "^skill_\\d+$"
  success:
    type: boolean
    description: Whether the agent successfully completed the task.
  latency:
    type: number
    description: Time taken to execute the task in seconds (float).
    minimum: 0.0
  tokens:
    type: integer
    description: Number of tokens processed/generated during the task.
    minimum: 0
  retrieval_precision:
    type: number
    description: Jaccard similarity between retrieved skills and ground truth (0.0 to 1.0).
    minimum: 0.0
    maximum: 1.0
  retrieval_diversity:
    type: number
    description: Inverse variance of cosine similarities of retrieved skills vs ground truth.
    minimum: 0.0
  pruning_risk_count:
    type: integer
    description: Count of high-similarity skills removed during the last pruning cycle.
    minimum: 0
  library_size:
    type: integer
    description: The size of the active skill library for this run.
    minimum: 1
  pruning_enabled:
    type: boolean
    description: Whether the safe pruning heuristic was active during this run.
additionalProperties: false
