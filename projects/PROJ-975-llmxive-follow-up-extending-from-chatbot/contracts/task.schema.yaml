$schema: "http://json-schema.org/draft-07/schema#"
title: Task Schema
description: Schema for validating generated task records in tasks.json
type: object
properties:
  task_id:
    type: string
    description: Unique identifier for the task
  description:
    type: string
    description: Human-readable description of the task
  ground_truth_path:
    type: array
    items:
      type: string
    description: Ordered list of skill IDs representing the ground-truth solution path
  complexity:
    type: integer
    minimum: 1
    description: Complexity score of the task
  embedding_vector:
    type: array
    items:
      type: number
    description: Pre-computed embedding vector for the task
  edge_case:
    type: boolean
    default: false
    description: Flag indicating if this task is a maximal overlap edge case
required:
  - task_id
  - description
  - ground_truth_path
  - complexity
  - embedding_vector
additionalProperties: false
