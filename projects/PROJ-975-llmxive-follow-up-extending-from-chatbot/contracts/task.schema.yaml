type: object
required:
  - id
  - description
  - ground_truth_path
properties:
  id:
    type: string
    description: Unique identifier for the task
  description:
    type: string
    description: Natural language description of the task
  ground_truth_path:
    type: array
    description: Ordered list of skill IDs that solve the task
    items:
      type: string
  difficulty:
    type: string
    description: Difficulty level (easy, medium, hard)
  category:
    type: string
    description: Task category
