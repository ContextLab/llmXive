$schema: "http://json-schema.org/draft-07/schema#"
title: "Task Schema"
type: "object"
properties:
  task_id:
    type: "string"
    description: "Unique identifier for the task"
  description:
    type: "string"
    description: "Description of the task"
  ground_truth_path:
    type: "array"
    items:
      type: "string"
    description: "List of skill IDs required to solve the task"
  complexity:
    type: "string"
    enum: ["low", "medium", "high"]
    description: "Complexity level of the task"
  maximal_overlap_detected:
    type: "boolean"
    description: "Flag indicating if maximal overlap was detected during generation"
required:
  - task_id
  - description
  - ground_truth_path
  - complexity
