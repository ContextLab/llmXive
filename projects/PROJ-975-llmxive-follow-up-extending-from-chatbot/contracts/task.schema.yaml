$schema: "http://json-schema.org/draft-07/schema#"
title: "Task Schema"
description: "Schema for a single task entry in tasks.json"
type: "object"
required:
  - task_id
  - description
  - ground_truth_path
  - complexity
properties:
  task_id:
    type: "string"
    description: "Unique identifier for the task"
    pattern: "^T[0-9]+$"
  description:
    type: "string"
    description: "Human-readable description of the task"
  ground_truth_path:
    type: "string"
    description: "Path to the ground truth solution (list of skill IDs)"
    items:
      type: "string"
  complexity:
    type: "integer"
    description: "Complexity score of the task"
    minimum: 1
  metadata:
    type: "object"
    description: "Optional metadata for the task"
    additionalProperties: true
additionalProperties: false
