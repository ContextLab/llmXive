$schema: http://json-schema.org/draft-07/schema#
title: Task Schema
description: >-
  Schema definition for synthetic multi-step tasks in the llmXive pipeline.
  Used to validate the structure of tasks generated by generate_data.py.
type: object
required:
  - task_id
  - description
  - ground_truth_path
  - complexity
properties:
  task_id:
    type: string
    description: Unique identifier for the task (e.g., "T001", "TASK_0001").
    pattern: "^[A-Z0-9_]+$"
  description:
    type: string
    description: Natural language description of the task to be performed.
    minLength: 1
  ground_truth_path:
    type: array
    description: >-
      Ordered list of skill IDs that constitute the correct solution path.
      These are the deterministic actions required to solve the task.
    items:
      type: string
      description: ID of a skill in the skill library.
    minItems: 1
  complexity:
    type: integer
    description: >-
      Complexity score of the task, typically based on the length of the
      ground truth path or number of required transformations.
    minimum: 1
  metadata:
    type: object
    description: Optional additional metadata for the task.
    properties:
      source:
        type: string
      seed_used:
        type: integer
additionalProperties: false
