$schema: http://json-schema.org/draft-07/schema#
title: Tasks Schema
description: Schema for the root of tasks.json generated by generate_data.py
type: object
required:
  - metadata
  - tasks
properties:
  metadata:
    type: object
    description: Generation metadata
    required:
      - overlap_level
      - seed_used
      - total_tasks
      - total_skills
    properties:
      overlap_level:
        type: string
        description: The configured overlap level (Low, Medium, High)
      seed_used:
        type: integer
        description: The random seed used for generation (Seed B for tasks)
      total_tasks:
        type: integer
        description: Total number of tasks generated
      total_skills:
        type: integer
        description: Total number of skills available in the library
      checksum:
        type: string
        description: SHA-256 checksum of the file content for integrity
  tasks:
    type: array
    description: List of generated multi-step tasks
    items:
      type: object
      required:
        - task_id
        - description
        - ground_truth
        - embedding
      properties:
        task_id:
          type: string
          description: Unique identifier for the task (e.g., "task_001")
        description:
          type: string
          description: Natural language description of the task
        ground_truth:
          type: array
          description: Ordered list of skill IDs required to solve the task
          items:
            type: string
        embedding:
          type: array
          description: Float32 vector representation of the task description
          items:
            type: number
          minItems: 384
          maxItems: 384
