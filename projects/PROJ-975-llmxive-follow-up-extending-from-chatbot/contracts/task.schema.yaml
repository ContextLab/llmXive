$schema: "http://json-schema.org/draft-07/schema#"
title: Task Schema
type: object
properties:
  task_id:
    type: string
    description: "Unique identifier for the task"
  description:
    type: string
    description: "Textual description of the task to be solved"
  ground_truth_path:
    type: array
    description: "Ordered list of skill_ids required to solve the task"
    items:
      type: string
required:
  - task_id
  - description
  - ground_truth_path
