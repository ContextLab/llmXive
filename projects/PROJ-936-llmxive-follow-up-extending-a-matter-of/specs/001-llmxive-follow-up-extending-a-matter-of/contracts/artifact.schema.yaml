$schema: "http://json-schema.org/draft-07/schema#"
title: "Artifact Schema for LLM Efficiency‑Reasoning Project"
type: object
description: "Top‑level wrapper for all generated artifacts in the project."
properties:
  artifact_name:
    type: string
    description: "Logical name of the artifact (e.g., 'baseline_execution')."
  version:
    type: string
    description: "Semantic version of the artifact (e.g., 'v1.0.0')."
  created_at:
    type: string
    format: "date-time"
    description: "Timestamp when the artifact was created."
required:
  - artifact_name
  - version
  - created_at
additionalProperties: false