$schema: "http://json-schema.org/draft-07/schema#"
title: "Execution Log Record"
type: object
required:
  - task_id
  - run_id
  - success
  - total_calls
  - total_tokens
  - duration_seconds
  - status
  - timestamp
properties:
  task_id:
    type: string
    description: "Identifier from τⁿ‑Bench."
  run_id:
    type: string
    description: "UUID for this specific agent run."
  success:
    type: boolean
    description: "True if the final answer is correct."
  total_calls:
    type: integer
    minimum: 0
    description: "Number of tool calls issued."
  total_tokens:
    type: integer
    minimum: 0
    description: "Total LLM tokens consumed (prompt + completion)."
  duration_seconds:
    type: number
    minimum: 0
    description: "Wall‑clock runtime."
  status:
    type: string
    enum:
      - "completed"
      - "failed"
      - "timeout"
    description: "Execution status."
  warning_codes:
    type: array
    items:
      type: string
    description: "Optional warnings (e.g., \"OPTIMAL_PATH_MISSING\")."
  timestamp:
    type: string
    format: "date-time"
    description: "UTC completion time."
additionalProperties: false