$schema: "http://json-schema.org/draft-07/schema#"
title: "Execution Log Record"
type: object
required:
  - task_id
  - run_id
  - success
  - total_calls
  - total_tokens
  - duration_seconds
  - status
  - timestamp
properties:
  task_id:
    type: string
  run_id:
    type: string
  success:
    type: boolean
  total_calls:
    type: integer
    minimum: 0
  total_tokens:
    type: integer
    minimum: 0
  duration_seconds:
    type: number
    description: "Number"
  status:
    type: string
    enum:
      - "completed"
      - "failed"
      - "timeout"
  warning_codes:
    type: array
    items:
      type: string
  timestamp:
    type: string
    format: "date-time"
additionalProperties: false