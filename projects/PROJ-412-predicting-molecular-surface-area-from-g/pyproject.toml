[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-molecular-surface-area"
version = "0.1.0"
description = "Predicting Molecular Surface Area from Graph Convolutional Networks"
requires-python = ">=3.9"
dependencies = [
    "rdkit==2023.9.5",
    "pandas==2.1.4",
    "scikit-learn==1.3.2",
    "pyyaml==6.0.1",
    "numpy==1.26.2",
    "pytest==7.4.3",
    "ruff==0.1.6",
    "black==23.11.0",
    "datasets==2.15.0",
    "huggingface_hub==0.19.4",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
)/
'''

[tool.setuptools]
packages = ["code"]