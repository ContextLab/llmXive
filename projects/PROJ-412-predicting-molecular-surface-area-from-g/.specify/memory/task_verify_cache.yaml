    \ via separate index URLs, which does not satisfy the task's requirement that\
    \ the file contain pinned versions of all eleven listed packages. Fix by adding\
    \ both pins (e.g., with `--extra-index-url` directives if needed) directly in\
    \ `code/requirements.txt`."
