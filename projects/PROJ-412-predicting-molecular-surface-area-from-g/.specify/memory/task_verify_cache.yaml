  h: 706e9a834d31800e640903ad43e831d8a57d1871d20340c34627459eecac27db
  r: '`code/config.py` exists and correctly defines `TIME_BUDGET=6.0`, `MAX_RAM_GB=7.0`,
    `RANDOM_SEED=42`, and `SENSITIVITY_THRESHOLDS=[0.01, 0.05, 0.1]`, but the required
    `MAX_MOLECULES: int = 5000` constant is entirely absent from the file. Add `MAX_MOLECULES:
    int = 5000` (the fixed pilot-study cap) to complete the task.'
