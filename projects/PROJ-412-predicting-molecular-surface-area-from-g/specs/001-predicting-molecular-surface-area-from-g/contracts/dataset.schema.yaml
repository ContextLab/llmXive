$schema: "http://json-schema.org/draft-07/schema#"
title: "Molecular Dataset Schema"
description: "Schema for the processed molecular dataset (2D features + 3D SASA)"
type: object
properties:
  smiles:
    type: string
    description: "Canonical SMILES string"
    minLength: 1
  molecular_weight:
    type: number
    description: "Molecular weight in g/mol"
    minimum: 0
  atom_count:
    type: integer
    description: "Number of atoms"
    minimum: 1
  node_features:
    type: array
    description: "Flattened atom feature vectors"
    items:
      type: number
  edge_features:
    type: array
    description: "Flattened bond feature vectors"
    items:
      type: number
  sasa:
    type: number
    description: "Computed 3D Surface Area in Å²"
    minimum: 0
  conformer_params:
    type: string
    description: "JSON string of RDKit conformer generation parameters"
  split:
    type: string
    enum:
      - train
      - test
      - val
    description: "Dataset split assignment"
required:
  - smiles
  - molecular_weight
  - atom_count
  - node_features
  - edge_features
  - sasa
  - conformer_params
  - split
additionalProperties: false
