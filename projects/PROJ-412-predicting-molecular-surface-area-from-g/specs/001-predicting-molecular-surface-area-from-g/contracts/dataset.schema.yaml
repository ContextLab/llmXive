$schema: "http://json-schema.org/draft-07/schema#"
title: "Processed Molecular Dataset Schema"
description: "Schema for data/processed/paired_dataset.parquet"
type: "object"
properties:
  smiles:
    type: "string"
    description: "Canonical SMILES string of the molecule"
  molecular_weight:
    type: "number"
    description: "Molecular weight in g/mol"
  num_atoms:
    type: "integer"
    description: "Number of atoms in the molecule"
  num_bonds:
    type: "integer"
    description: "Number of bonds in the molecule"
  sasa:
    type: "number"
    description: "Solvent Accessible Surface Area in Å² (computed from 3D conformer)"
  atom_features:
    type: "array"
    description: "Flattened list of node features [Atomic Number, Degree, Hybridization, Charge, Aromaticity]"
    items:
      type: "number"
  bond_features:
    type: "array"
    description: "Flattened list of edge features [Bond Type, Conjugated, Ring]"
    items:
      type: "number"
  conformer_failed:
    type: "boolean"
    description: "True if 3D conformer generation failed"
  conformer_params:
    type: "object"
    description: "RDKit parameters used for conformer generation"
    properties:
      numThreads:
        type: "integer"
      maxAttempts:
        type: "integer"
      energyMinSteps:
        type: "integer"
  scaffold_id:
    type: "string"
    description: "Bemis-Murcko scaffold identifier for splitting"
required:
  - smiles
  - sasa
  - num_atoms
  - conformer_failed
  - scaffold_id
additionalProperties: false
