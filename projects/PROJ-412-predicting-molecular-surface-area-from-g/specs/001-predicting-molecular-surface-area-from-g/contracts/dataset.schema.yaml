$schema: "http://json-schema.org/draft-07/schema#"
title: "Molecular Dataset Schema"
description: "Schema for the processed molecular dataset (2D features + 3D surface area)"
type: object
properties:
  smiles:
    type: string
    description: "Canonical SMILES string"
    minLength: 1
  molecular_weight:
    type: number
    description: "Molecular weight in g/mol"
    minimum: 0
  atom_count:
    type: integer
    description: "Number of atoms"
    minimum: 1
  node_features:
    type: array
    description: "Flattened atom feature vectors [atom_type, hybridization, formal_charge]"
    items:
      type: number
  edge_features:
    type: array
    description: "Flattened bond feature vectors [bond_type, conjugated, aromatic]"
    items:
      type: number
  surface_area:
    type: number
    description: "Computed 3D Solvent Accessible Surface Area (SASA) in Å² (target label)"
    minimum: 0
  sasa:
    type: number
    description: "Alias for surface_area (computed 3D SASA in Å²); kept for backward compatibility"
    minimum: 0
  conformer_params:
    type: string
    description: "JSON string of RDKit conformer generation parameters"
  split:
    type: string
    enum:
      - train
      - test
      - val
    description: "Dataset split assignment"
required:
  - smiles
  - molecular_weight
  - atom_count
  - node_features
  - edge_features
  - surface_area
  - conformer_params
  - split
additionalProperties: false
