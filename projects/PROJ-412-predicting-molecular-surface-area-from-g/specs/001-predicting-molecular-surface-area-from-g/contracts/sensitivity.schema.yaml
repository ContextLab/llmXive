$schema: "http://json-schema.org/draft-07/schema#"
title: "Sensitivity Analysis Result"
description: "Schema for sensitivity analysis results across absolute MAE thresholds (0.5, 2.5, 10.0 Å²) as required by spec."
type: "object"
properties:
  threshold:
    type: "number"
    description: "MAE cutoff value in Å² (absolute values: 0.5, 2.5, 10.0)."
    enum:
      - 0.5
      - 2.5
      - 10.0
  gcn_success_rate:
    type: "number"
    description: "Percentage of molecules predicted within the threshold by GCN."
    minimum: 0
    maximum: 100
  adjusted_p_value:
    type: "number"
    description: "Bonferroni-corrected p-value for the difference in success rates."
    minimum: 0
    maximum: 1
required:
  - threshold
  - gcn_success_rate
  - adjusted_p_value
additionalProperties: false