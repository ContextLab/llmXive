$schema: "http://json-schema.org/draft-07/schema#"
title: "Prediction Result Schema"
description: "Schema for model prediction outputs"
type: object
properties:
  smiles:
    type: string
    description: "Canonical SMILES string"
    minLength: 1
  predicted_sasa:
    type: number
    description: "Predicted Surface Area in Å²"
  actual_sasa:
    type: number
    description: "Ground truth Surface Area in Å²"
  error:
    type: number
    description: "Absolute error |predicted - actual|"
    minimum: 0
  model_version:
    type: string
    description: "Git commit hash or model ID"
required:
  - smiles
  - predicted_sasa
  - actual_sasa
  - error
  - model_version
additionalProperties: false
