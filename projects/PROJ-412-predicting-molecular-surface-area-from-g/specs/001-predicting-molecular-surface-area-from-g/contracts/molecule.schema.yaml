$schema: "http://json-schema.org/draft-07/schema#"
title: "Molecule"
description: "Schema for a processed molecule with 2D features and 3D surface area label."
type: object
properties:
  mol_id:
    type: string
    description: "Unique identifier (hash of SMILES)"
  smiles:
    type: string
    description: "Canonical SMILES string"
  molecular_weight:
    type: number
    description: "Calculated molecular weight"
  node_features:
    type: array
    items:
      type: number
    description: "Vector of atom properties"
  edge_features:
    type: array
    items:
      type: number
    description: "Vector of bond properties"
  surface_area_3d:
    type: number
    description: "Computed 3D surface area in Å²"
  conformer_success:
    type: boolean
    description: "Whether 3D conformer generation succeeded"
  excluded_reason:
    type: ["string", "null"]
    description: "Reason for exclusion if applicable (e.g., 'invalid_smiles', 'conformer_failed')"
required:
  - mol_id
  - smiles
  - molecular_weight
  - surface_area_3d
  - conformer_success
additionalProperties: false
