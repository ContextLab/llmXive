[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line-too-long (handled by black)
    "B008", # do-not-perform-function-calls-in-argument-defaults (often needed for logging/setup)
]

[lint.isort]
known-first-party = ["code", "data", "models", "eval", "utils"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[lint.pydocstyle]
convention = "google"