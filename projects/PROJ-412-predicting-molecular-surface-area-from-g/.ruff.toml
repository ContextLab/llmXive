[lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # Line too long (handled by Black)
    "B008", # Do not perform function call in argument defaults (common in ML/data pipelines)
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar` (dataclasses handle this)
]

# Allow autofix for all enabled rules.
fixable = ["ALL"]
unfixable = []

# Exclude a few files/directories that are generated or external.
exclude = [
    ".git",
    "__pycache__",
    "data/raw",
    "data/processed",
    "results",
    "logs",
    "docs",
    "build",
    "dist",
    "*.egg-info",
]

# Assume Python 3.10 (compatible with the project's dependencies).
target-version = "py310"

# Per-file ignores (optional, for specific generated files if needed).
per-file-ignores = {}

[lint.isort]
known-first-party = ["code", "data_models", "eval", "models"]
force-single-line = false
lines-after-imports = 2

[lint.flake8-bugbear]
extend-immutable-calls = [
    "code.config.get_project_root",
    "code.utils.config.get_project_root",
    "code.utils.logging.get_logger",
]

[lint.pydocstyle]
convention = "google"

[format]
# Use Black-compatible formatting.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false