# Ruff configuration for llmXive Molecular SASA Project
# Targeting Python 3.9+ compatibility

line-length = 100
target-version = "py39"
src = ["code", "tests"]

[lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in dataclasses)
    "C901", # Complex function (allow for some data processing logic)
]

[lint.per-file-ignores]
"code/__init__.py" = ["F401"]
"tests/*" = ["S101"] # Allow assertions in tests

[lint.isort]
known-first-party = ["code"]
force-sort-within-sections = true
lines-after-imports = 2

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"