[lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "RUF", # Ruff-specific rules
]
ignore = [
  "E501", # Line too long (handled by Black)
  "B008", # Do not perform function call in argument defaults (common in dataclasses)
  "C408", # Unnecessary dict call (sometimes used for clarity)
  "N806", # Variable in function should be lowercase (strictness adjustment for scientific vars)
]

# Allow autofix for all enabled rules (if `--fix` is provided).
fixable = ["ALL"]
unfixable = []

# Exclude a few files from linting.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "data/raw", # Large data files
]

# Per-file ignores (optional).
per-file-ignores = {}

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Target version (matching project Python version).
target-version = "py310"

[lint.mccabe]
# Flag functions with high complexity.
max-complexity = 12

[lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[lint.isort]
# Force single imports per line.
force-single-line = true
known-first-party = ["code"]
known-local-folder = ["tests"]
split-on-trailing-comma = true

[format]
# Enable preview style formatting.
preview = true
# Quote style (matching Black).
quote-style = "double"
# Indent style (matching Black).
indent-style = "space"
# Skip magic trailing comma.
skip-magic-trailing-comma = false
# Line width (matching Black default).
line-width = 88