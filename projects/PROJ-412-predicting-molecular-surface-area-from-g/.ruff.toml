# Ruff configuration for llmXive Molecular SASA project
# Targeting Python 3.9+ compatibility

target-version = "py39"
line-length = 88

[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in dataclasses)
    "SIM105", # Use `contextlib.suppress` (optional preference)
]

# Allow autofix for all enabled rules (if applicable)
fixable = ["ALL"]
unfixable = []

# Exclude a few specific directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Per-file ignores
per-file-ignores = {}

[lint.isort]
known-first-party = ["code"]
force-sort-within-sections = false
combine-as-imports = true
split-on-trailing-comma = true

[lint.flake8-bugbear]
extend-immutable-calls = ["code.utils.config.get_project_root"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"