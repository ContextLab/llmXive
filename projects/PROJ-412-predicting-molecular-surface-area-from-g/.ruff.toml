# Ruff configuration for llmXive molecular surface area project
# Generated by T003a

# Line length
line-length = 100

# Target Python version
target-version = "py39"

# Enable specific rule sets
[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function call in argument defaults (common in dataclasses)
]

# Per-file ignores
[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["S101"]      # Allow assertions in tests

# Isort configuration
[lint.isort]
known-first-party = ["code", "data", "models", "eval", "utils"]
force-single-line = true
lines-between-types = 1

# Flake8-bugbear configuration
[lint.flake8-bugbear]
extend-immutable-calls = ["code.utils.seed.set_seed"]
