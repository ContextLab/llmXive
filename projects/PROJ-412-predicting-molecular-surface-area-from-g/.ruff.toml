[lint]
# Select specific rules relevant to scientific Python code
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (sorting imports)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modernize syntax)
    "RUF",    # Ruff-specific rules
    "NPY",    # NumPy specific rules
    "PT",     # Pytest style
    "SIM",    # flake8-simplify
]

# Ignore specific rules that are too strict for this project context
ignore = [
    "E501",   # Line too long (handled by Black)
    "B008",   # Do not perform function call in argument defaults (common in ML models)
    "SIM105", # Use `contextlib.suppress` instead of `try`/`except` (verbose for quick checks)
]

# Allow specific patterns
allowed-confusables = ["×"] # Allow multiplication sign in math contexts

[lint.per-file-ignores]
# Ignore specific rules in test files
"tests/**/*.py" = [
    "S101",   # Allow assert in tests
    "PT011",  # Allow pytest.raises without match
]
# Ignore specific rules in scripts that might have unused imports for setup
"scripts/**/*.py" = [
    "F401",   # Unused imports
]

[lint.isort]
known-first-party = ["code", "data", "models", "eval", "utils", "data_models"]
force-sort-within-sections = true
combine-as-imports = true

[format]
# Ruff format settings (compatible with Black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint.pydocstyle]
convention = "google"