# Ruff configuration for llmXive Molecular SASA project
# Target Python version
target-version = "py39"

# Line length (matching Black)
line-length = 100

# Exclude directories
extend-exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "data",
    "results",
    "__pycache__",
    "*.pyc",
]

[lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (selective)
    "S",   # flake8-bandit (security)
    "TID", # flake8-tidy-imports
    "BLE", # flake8-blind-except
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
]

# Ignore specific rules that are too strict or not applicable
ignore = [
    "E501",      # Line too long (handled by Black)
    "ANN001",    # Missing type annotation for function argument (optional for now)
    "ANN201",    # Missing return type annotation for public function (optional for now)
    "ANN202",    # Missing return type annotation for private function (optional for now)
    "S101",      # Use of assert detected (acceptable in tests and data validation)
    "S311",      # Standard pseudo-random generators (acceptable for seeding)
    "B007",      # Loop variable not used (common in enumeration)
    "C408",      # Unnecessary dict/list/tuple call (style preference)
    "SIM105",    # Use contextlib.suppress (preference for explicit try/except)
    "PTH123",    # pathlib.open() (sometimes need built-in open for specific flags)
]

# Per-file ignores
per-file-ignores = { "tests/*" = ["S101", "ANN", "B011"] }

[lint.isort]
known-first-party = ["code"]
known-third-party = [
    "rdkit",
    "pandas",
    "sklearn",
    "scikit_learn",
    "numpy",
    "pytest",
    "torch",
    "torch_geometric",
    "datasets",
    "huggingface_hub",
    "yaml",
    "scipy",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
force-single-line = false
lines-after-imports = 2

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = false

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[format]
# Use double quotes for strings (matching Black default)
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Skip magic trailing comma
skip-magic-trailing-comma = false
# Line ending (auto-detect)
line-ending = "auto"

[lint.pydocstyle]
convention = "numpy"