%YAML 1.2
---
# Schema for Model Output (T005)
# Defines the expected structure for model comparison reports and evaluation artifacts.
# Used by tests/contract/test_model_output.py for validation.
#
# This schema strictly defines the fields required for any model output artifact
# generated by the pipeline (e.g., GCN, Geometry Oracle, Baseline).
#
# Updated to include 'Baseline2D' and 'BaselineGeometry' model types to align
# with the implementation in Phase 4 (T021b, T021c).

type: object
required:
  - model_type
  - metrics
  - hyperparameters
  - timestamp
  - dataset_checksum
properties:
  model_type:
    type: string
    description: The type of model used for prediction.
    enum:
      - GCN
      - GeometryOracle
      - Baseline2D
      - BaselineGeometry
      - RandomForest
      - Baseline3D
  metrics:
    type: object
    description: Performance metrics calculated on the evaluation set.
    required:
      - mae
      - rmse
      - r2
    properties:
      mae:
        type: number
        description: Mean Absolute Error in Angstroms squared (Å²).
      rmse:
        type: number
        description: Root Mean Squared Error in Angstroms squared (Å²).
      r2:
        type: number
        description: Coefficient of determination (R-squared).
      comparison:
        type: object
        description: Optional statistical comparison metrics (used in joint reports).
        properties:
          p_value:
            type: number
            description: P-value from paired t-test comparing against a baseline.
          cohen_d:
            type: number
            description: Effect size (Cohen's d) for the comparison.
          corrected_p_value:
            type: number
            description: Bonferroni or FDR corrected p-value.
          normality_warning:
            type: boolean
            description: Flag indicating if Shapiro-Wilk test failed normality assumption.
  hyperparameters:
    type: object
    description: Dictionary of model hyperparameters used during training.
    additionalProperties: true
    properties:
      learning_rate:
        type: number
      batch_size:
        type: integer
      epochs:
        type: integer
      hidden_channels:
        type: integer
      dropout:
        type: number
      num_layers:
        type: integer
      regularization:
        type: number
      feature_set:
        type: string
        description: Identifier for the feature set used (e.g., 'topological', 'geometric').
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the model was evaluated.
  dataset_checksum:
    type: string
    description: SHA256 checksum of the processed dataset used for training/evaluation.
  split_info:
    type: object
    description: Information about the train/test split used.
    properties:
      train_size:
        type: integer
      test_size:
        type: integer
      split_seed:
        type: integer
      stratification_field:
        type: string
        description: Field used for stratification (e.g., "molecular_weight").
  runtime_info:
    type: object
    description: Optional runtime statistics.
    properties:
      total_seconds:
        type: number
      peak_memory_mb:
        type: number
additionalProperties: false