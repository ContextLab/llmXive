$schema: "http://json-schema.org/draft-07/schema#"
title: "PairedDatasetSchema"
description: "Schema for the final paired dataset used in modeling."
type: "object"
properties:
  metadata:
    type: "object"
    properties:
      source_gse:
        type: "string"
        description: "GEO Series Accession ID"
      source_st:
        type: "string"
        description: "Metabolomics Workbench Study ID"
      pairing_rate:
        type: "number"
        minimum: 0.0
        maximum: 1.0
        description: "Fraction of samples successfully paired (must be >= 0.95)"
      timestamp:
        type: "string"
        format: "date-time"
        description: "ISO 8601 timestamp of data processing"
  data:
    type: "array"
    items:
      type: "object"
      required:
        - "sample_id"
        - "expression_vector"
        - "metabolite_vector"
      properties:
        sample_id:
          type: "string"
          description: "Unique biological sample identifier"
        expression_vector:
          type: "array"
          items:
            type: "number"
          description: "Normalized TPM/FPKM values for selected genes"
        metabolite_vector:
          type: "array"
          items:
            type: "number"
          description: "Log-transformed metabolite concentrations"
    description: "List of paired samples"
required:
  - "metadata"
  - "data"
additionalProperties: false
