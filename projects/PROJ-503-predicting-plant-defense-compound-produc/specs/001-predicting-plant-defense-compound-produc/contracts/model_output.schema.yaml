$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelOutputSchema"
description: "Schema for the model evaluation metrics and artifacts."
type: "object"
properties:
  model_info:
    type: "object"
    properties:
      model_type:
        type: "string"
        const: "RidgeRegression"
      alpha:
        type: "number"
        description: "Ridge regularization parameter"
      cv_folds:
        type: "integer"
        const: 5
    required:
      - "model_type"
      - "alpha"
      - "cv_folds"
  metrics:
    type: "object"
    description: "Metrics per metabolite"
    additionalProperties:
      type: "object"
      properties:
        rmse:
          type: "number"
          description: "Root Mean Squared Error"
        pearson_r:
          type: "number"
          description: "Pearson correlation coefficient"
        p_value_raw:
          type: "number"
          description: "Permutation test p-value (uncorrected)"
        p_value_corrected:
          type: "number"
          description: "Bonferroni corrected p-value"
        is_significant:
          type: "boolean"
          description: "True if p_value_corrected <= 0.05"
      required:
        - "rmse"
        - "pearson_r"
        - "p_value_raw"
        - "p_value_corrected"
        - "is_significant"
  permutation_test:
    type: "object"
    properties:
      iterations:
        type: "integer"
        const: 1000
      method:
        type: "string"
        const: "label_shuffling"
    required:
      - "iterations"
      - "method"
  runtime:
    type: "object"
    properties:
      total_cpu_seconds:
        type: "number"
      max_memory_mb:
        type: "number"
    required:
      - "total_cpu_seconds"
      - "max_memory_mb"
required:
  - "model_info"
  - "metrics"
  - "permutation_test"
  - "runtime"
additionalProperties: false
