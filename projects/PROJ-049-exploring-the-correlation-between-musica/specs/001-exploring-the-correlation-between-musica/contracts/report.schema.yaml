$schema: "http://json-schema.org/draft-07/schema#"
title: "Final Results Report Schema"
type: object
required:
  - summary_statistics
  - significant_findings
  - limitations
properties:
  summary_statistics:
    type: object
    required:
      - total_tests
      - significant_tests
      - required_sample_size
      - actual_sample_size
      - power_note
    properties:
      total_tests:
        type: integer
      significant_tests:
        type: integer
      required_sample_size:
        type: integer
      actual_sample_size:
        type: integer
      power_note:
        type: string
  significant_findings:
    type: array
    items:
      $ref: "./correlation_results.schema.yaml#/items"
  limitations:
    type: string
    description: "Narrative ... constraints"