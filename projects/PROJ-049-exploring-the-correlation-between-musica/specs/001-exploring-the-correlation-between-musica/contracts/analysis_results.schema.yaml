$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Results Schema"
type: "object"
properties:
  trait:
    type: "string"
    description: "One of: openness, conscientiousness, extraversion, agreeableness, neuroticism"
  genre:
    type: "string"
    description: "Standardized genre name"
  correlation_rho:
    type: "number"
    description: "Spearman rank correlation coefficient"
  p_value:
    type: "number"
    description: "Two‑tailed p‑value for the Spearman correlation"
  adjusted_p_value:
    type: "number"
    description: "Bonferroni‑adjusted p‑value"
  is_significant:
    type: "boolean"
    description: "True if adjusted p < 0.001"
  cohens_d:
    type: "number"
    description: "Effect size derived from Spearman rho"
  ci_lower:
    type: "number"
    description: "Lower bound of 95 % confidence interval for Cohen's d"
  ci_upper:
    type: "number"
    description: "Upper bound of 95 % confidence interval for Cohen's d"
  high_correlation_flag:
    type: "boolean"
    description: "True if |ρ| > 0.3"
required:
  - trait
  - genre
  - correlation_rho
  - p_value
  - adjusted_p_value
  - is_significant
  - cohens_d
  - ci_lower
  - ci_upper
  - high_correlation_flag
additionalProperties: false