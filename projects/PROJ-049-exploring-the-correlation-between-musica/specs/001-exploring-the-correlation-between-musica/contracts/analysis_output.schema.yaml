$schema: "http://json-schema.org/draft-07/schema#"
title: "Combined Analysis Output Schema"
type: object
required:
  - correlation_results
  - regression_results
  - diagnostics
properties:
  correlation_results:
    $ref: "./correlation_results.schema.yaml"
  regression_results:
    $ref: "./regression_results.schema.yaml"
  diagnostics:
    type: array
    items:
      type: object
      required:
        - model_trait
        - issue
        - action
      properties:
        model_trait:
          type: string
        issue:
          type: string
        action:
          type: string