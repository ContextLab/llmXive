$schema: "http://json-schema.org/draft-07/schema#"
title: "Raw BFI‑2 and Last.fm Linked Dataset"
type: object
required:
  - user_id
  - lastfm_username
  - openness_score
  - conscientiousness_score
  - extraversion_score
  - agreeableness_score
  - neuroticism_score
  - age
  - gender
  - country
  - listening_history
properties:
  user_id:
    type: string
    description: "Hashed participant identifier."
  lastfm_username:
    type: string
    description: "Username on Last.fm used for linking."
  openness_score:
    type: number
    minimum: 0
    maximum: 100
  conscientiousness_score:
    type: number
    minimum: 0
    maximum: 100
  extraversion_score:
    type: number
    minimum: 0
    maximum: 100
  agreeableness_score:
    type: number
    minimum: 0
    maximum: 100
  neuroticism_score:
    type: number
    minimum: 0
    maximum: 100
  age:
    type: integer
    minimum: 0
  gender:
    type: string
    enum: ["Male", "Female", "Other"]
  country:
    type: string
  listening_history:
    type: object
    description: "Mapping from raw genre tag to total listening minutes for this user."
    additionalProperties:
      type: number
      minimum: 0