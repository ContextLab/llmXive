$schema: "http://json-schema.org/draft-07/schema#"
title: "Raw Combined Dataset Schema"
description: "Schema for the original OpenML dataset that already contains both personality scores and aggregated listening minutes per genre."
type: "object"
properties:
  user_id:
    type: "string"
    description: "Original participant identifier (will be hashed during preprocessing)."
  openness:
    type: "number"
    description: "BFI‑2 Openness score (0‑5)."
  conscientiousness:
    type: "number"
    description: "BFI‑2 Conscientiousness score (0‑5)."
  extraversion:
    type: "number"
    description: "BFI‑2 Extraversion score (0‑5)."
  agreeableness:
    type: "number"
    description: "BFI‑2 Agreeableness score (0‑5)."
  neuroticism:
    type: "number"
    description: "BFI‑2 Neuroticism score (0‑5)."
  age:
    type: "integer"
    description: "Age in years."
  gender:
    type: "string"
    enum: ["Male", "Female", "Other"]
    description: "Self‑reported gender."
  country:
    type: "string"
    description: "Country of residence."
  genre:
    type: "string"
    enum: ["Rock", "Pop", "Hip-Hop", "Classical", "Electronic", "Jazz", "Folk", "Country", "Metal", "Other"]
    description: "Standardized music genre."
  listening_minutes:
    type: "number"
    description: "Aggregated listening minutes for this user in the given genre."
required:
  - user_id
  - openness
  - conscientiousness
  - extraversion
  - agreeableness
  - neuroticism
  - age
  - gender
  - country
  - genre
  - listening_minutes
additionalProperties: false