name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    
    # Resource constraints: CPU-only environment with 7GB RAM limit
    # Note: GitHub Actions runners provide shared CPU/RAM; we enforce limits via resource requests
    # and ensure code is optimized for memory efficiency.
    # Memory limit is enforced at the code level (streaming data) and verified via monitoring.
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found"
            exit 1
          fi

      - name: Run linting
        run: |
          python -m flake8 code/ --max-line-length=127 --ignore=E501,W503
          # Note: Black formatting check can be added here if configured

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run data loader validation (Real Data Check)
        run: |
          python -c "
          from data_loader import fetch_all_datasets
          import sys
          try:
              # This will fail loudly if real data is not available
              # No synthetic fallback allowed
              data = fetch_all_datasets()
              if not data:
                  print('ERROR: No real data fetched', file=sys.stderr)
                  sys.exit(1)
              print('Real data fetch successful')
          except Exception as e:
              print(f'ERROR: Real data fetch failed: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Run extraction pipeline (Sample)
        run: |
          python code/main.py --mode extraction --sample-size 10

      - name: Run matching validation (Sample)
        run: |
          python code/main.py --mode matching --sample-size 10

      - name: Run analysis pipeline (Sample)
        run: |
          python code/main.py --mode analysis --sample-size 10

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: |
            data/processed/
            artifacts/
          retention-days: 7

# Memory limit enforcement note:
# The 7GB RAM limit is a constraint of the runner environment.
# The code must be written to stream data (see data_loader.py) and avoid loading
# full datasets into memory at once. The pipeline steps above run sequentially
# to minimize peak memory usage.
