[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-narrative-perspective"
version = "0.1.0"
description = "Impact of Narrative Perspective on Empathy and Moral Judgement"
requires-python = ">=3.11"
dependencies = [
    "spacy",
    "scikit-learn",
    "pandas",
    "numpy",
    "matplotlib",
    "statsmodels",
    "langdetect",
    "pyyaml",
    "requests",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["config", "data_loader", "extraction", "main", "matching", "models", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
