[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-perspective-empathy"
version = "0.1.0"
description = "Impact of narrative perspective on empathy and moral judgement"
requires-python = ">=3.11"
dependencies = [
    "spacy",
    "scikit-learn",
    "pandas",
    "numpy",
    "matplotlib",
    "statsmodels",
    "langdetect",
    "pyyaml",
    "requests",
    "black",
    "flake8",
    "pytest",
    "pre-commit"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.isort]
profile = "black"
line_length = 88
