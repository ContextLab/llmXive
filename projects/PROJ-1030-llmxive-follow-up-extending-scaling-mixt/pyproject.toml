[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-scaling-mixt"
version = "0.1.0"
description = "llmXive follow-up: extending Scaling Mixture-of-Experts Video Pretraining for Embodied Intelligence"
requires-python = ">=3.11"
dependencies = [
    "torch-cpu",
    "transformers",
    "datasets",
    "pybullet",
    "scikit-learn",
    "opencv-python-headless",
    "monodepth2",
    "shap",
    "huggingface-hub",
    "pytest",
    "ruff",
    "black",
]

[tool.ruff]
# Linter settings
target-version = "py311"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in dataclasses)
    "C901", # too complex (allow for now)
]

[tool.ruff.isort]
known-first-party = ["utils", "models"]
force-sort-within-sections = true

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
