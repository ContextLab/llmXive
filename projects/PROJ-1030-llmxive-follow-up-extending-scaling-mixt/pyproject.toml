[project]
name = "llmxive-follow-up-extending-scaling-mixt"
version = "0.1.0"
description = "Automated science pipeline for video pretraining analysis"
requires-python = ">=3.11"
dependencies = [
    "torch-cpu",
    "transformers",
    "datasets",
    "pybullet",
    "scikit-learn",
    "opencv-python-headless",
    "monodepth2",
    "shap",
    "huggingface-hub",
    "pytest",
    "ruff",
    "black",
    "pre-commit",
    "pandas",
    "numpy",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
