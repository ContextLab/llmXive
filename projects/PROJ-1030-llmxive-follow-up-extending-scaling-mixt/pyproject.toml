[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-scaling-mixt"
version = "0.1.0"
description = "Follow-up research: Extending Scaling Mixture-of-Experts Video Pretraining for Embodied Intelligence"
requires-python = ">=3.11"
dependencies = [
    "torch-cpu",
    "transformers",
    "datasets",
    "pybullet",
    "scikit-learn",
    "opencv-python-headless",
    "monodepth2",
    "shap",
    "huggingface-hub",
    "pytest",
    "ruff",
    "black",
]

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # Allow asserts in tests

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''
