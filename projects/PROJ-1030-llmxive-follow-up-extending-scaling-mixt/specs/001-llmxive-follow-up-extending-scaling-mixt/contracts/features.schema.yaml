$schema: "http://json-schema.org/draft-07/schema#"
type: "object"
description: "Schema for extracted activation patterns (features.npy)"
properties:
  clip_id:
    type: "string"
    description: "Unique identifier for the video clip"
  latent_vector:
    type: "array"
    items:
      type: "number"
    description: "Flattened latent activation vector"
  expert_mask:
    type: "array"
    items:
      type: "integer"
      minimum: 0
      maximum: 1
    description: "Binary mask indicating active experts"
  layer_index:
    type: "integer"
    description: "Index of the DiT layer"
required:
  - clip_id
  - latent_vector
  - expert_mask
  - layer_index
additionalProperties: false