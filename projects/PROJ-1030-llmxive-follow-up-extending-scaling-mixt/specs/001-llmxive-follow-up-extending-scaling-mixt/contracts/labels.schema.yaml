$schema: "http://json-schema.org/draft-07/schema#"
type: "object"
description: "Schema for physical validity labels (labels.csv)"
properties:
  clip_id:
    type: "string"
    description: "Unique identifier for the video clip"
  label:
    type: "string"
    enum:
      - "valid"
      - "invalid"
      - "null"
    description: "Physical validity label"
  confidence:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Confidence score of the depth estimation"
  exclusion_reason:
    type: "string"
    description: "Reason for exclusion if label is null"
  perturbation_type:
    type: "string"
    description: "Type of perturbation applied (e.g., 'gravity_defiance', 'jitter')"
required:
  - clip_id
  - label
  - confidence
  - perturbation_type
additionalProperties: false