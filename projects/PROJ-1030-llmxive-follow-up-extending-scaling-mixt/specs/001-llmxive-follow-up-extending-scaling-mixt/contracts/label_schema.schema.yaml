$schema: "http://json-schema.org/draft-07/schema#"
title: "Physical Label Schema"
description: "Schema for PhysicalLabel data generated by generate_labels.py"
type: "object"
properties:
  clip_id:
    type: "string"
    description: "Unique identifier for the video clip"
  label:
    type: "string"
    enum:
      - "valid"
      - "invalid"
      - "null"
    description: "Physical validity label"
  violation_type:
    type: "string"
    description: "Type of violation if label is invalid"
  simulation_success:
    type: "boolean"
    description: "Whether the physics simulation completed successfully"
  reconstruction_confidence:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Confidence score of the 3D reconstruction"
  kinematic_valid:
    type: "boolean"
    description: "Whether the reconstructed trajectory passed the kinematic consistency check"
required:
  - clip_id
  - label
  - simulation_success
  - reconstruction_confidence
  - kinematic_valid
additionalProperties: false
