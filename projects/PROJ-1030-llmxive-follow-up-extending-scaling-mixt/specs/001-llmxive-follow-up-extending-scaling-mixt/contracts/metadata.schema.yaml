$schema: "http://json-schema.org/draft-07/schema#"
type: "object"
description: "Schema for dataset metadata (metadata.json)"
properties:
  dataset_name:
    type: "string"
    description: "Name of the source dataset"
  total_clips:
    type: "integer"
    description: "Total number of clips processed"
  excluded_count:
    type: "integer"
    description: "Number of excluded samples"
  processing_date:
    type: "string"
    format: "date-time"
    description: "Date and time of processing"
  checksums:
    type: "object"
    description: "Checksums for raw and processed data"
    additionalProperties:
      type: "string"
required:
  - dataset_name
  - total_clips
  - excluded_count
  - processing_date
  - checksums
additionalProperties: false