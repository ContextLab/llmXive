$schema: "http://json-schema.org/draft-07/schema#"
title: "Feature Extraction Schema"
description: "Schema for ActivationPattern data generated by extract_features.py"
type: "object"
properties:
  clip_id:
    type: "string"
    description: "Unique identifier for the video clip"
  latent_vector:
    type: "array"
    description: "Flattened latent vector from DiT/ViT layers"
    items:
      type: "number"
  expert_mask:
    type: "array"
    description: "Binary mask indicating active experts"
    items:
      type: "integer"
      minimum: 0
      maximum: 1
  layer_index:
    type: "integer"
    description: "Index of the DiT/ViT layer"
  extraction_timestamp:
    type: "string"
    format: "date-time"
    description: "Timestamp of extraction"
  chunk_index:
    type: "integer"
    description: "Index of the processing chunk"
required:
  - clip_id
  - latent_vector
  - expert_mask
  - layer_index
  - extraction_timestamp
  - chunk_index
additionalProperties: false
