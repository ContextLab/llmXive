  r: "The `src/data/download.py` file defines `calculate_sha256`, `verify_checksum`,\
    \ and a generic `store_metadata` function, but it never calls these after downloading\
    \ a file nor writes any checksum data to `data/metadata.yaml`. Moreover, the required\
    \ `data/metadata.yaml` file is missing from the repository. The task\u2019s requirement\
    \ to store SHA\u2011256 checksums for raw NetCDF files in that YAML file is therefore\
    \ not satisfied."
