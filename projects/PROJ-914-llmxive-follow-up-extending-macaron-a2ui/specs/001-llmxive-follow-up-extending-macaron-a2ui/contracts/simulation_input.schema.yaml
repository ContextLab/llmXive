$schema: http://json-schema.org/draft-07/schema#
title: Simulation Input Schema
description: |
  Defines the structure of input data for the simulation runner.
  This schema validates the annotated dataset before simulation begins.
  It ensures that all required fields for routing, patience modeling,
  and UI generation are present and correctly typed.
type: object
required:
  - interaction_id
  - query
  - ground_truth_intent
  - complexity_score
  - label
properties:
  interaction_id:
    type: string
    description: Unique identifier for the interaction turn.
    pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$"
  query:
    type: string
    description: The user's natural language query.
    minLength: 1
  ground_truth_intent:
    type: string
    description: The canonical intent label for the query.
  complexity_score:
    type: integer
    description: Complexity score assigned during annotation.
    minimum: 1
    maximum: 5
  label:
    type: string
    description: Human-annotated confidence label.
    enum:
      - High-Confidence
      - Ambiguous
  metadata:
    type: object
    description: Optional metadata fields for the interaction.
    additionalProperties: true
additionalProperties: false
