$schema: http://json-schema.org/draft-07/schema#
title: Simulation Output Schema
description: |
  Defines the structure of output data generated by the simulation runner.
  This schema validates the results of a simulation run, including routing
  decisions, latency measurements, user patience outcomes, and alignment scores.
  It ensures that all metrics required for Pareto analysis and statistical
  testing are captured correctly.
type: object
required:
  - run_id
  - interaction_id
  - routing_decision
  - latency_injected_ms
  - user_patience_s
  - outcome
  - alignment_score
  - metrics
properties:
  run_id:
    type: string
    description: Unique identifier for the simulation run.
    pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$"
  interaction_id:
    type: string
    description: Reference to the input interaction.
  routing_decision:
    type: object
    description: The decision made by the router.
    required:
      - router_type
      - confidence
      - intent_predicted
      - fallback_invoked
    properties:
      router_type:
        type: string
        enum:
          - distilbert_quantized
          - rule_based_fallback
      confidence:
        type: number
        minimum: 0.0
        maximum: 1.0
      intent_predicted:
        type: string
      fallback_invoked:
        type: boolean
  latency_injected_ms:
    type: integer
    description: Simulated network latency in milliseconds.
    minimum: 0
  user_patience_s:
    type: number
    description: Sampled user patience threshold in seconds (exponential decay).
    minimum: 0.0
  outcome:
    type: string
    description: Final outcome of the interaction.
    enum:
      - success
      - abandoned
      - no_match
  generation_time_ms:
    type: integer
    description: Time taken to generate the UI response (if applicable).
    minimum: 0
  total_time_ms:
    type: integer
    description: Total time including latency and generation (or abandonment time).
    minimum: 0
  alignment_score:
    type: number
    description: Calculated alignment score based on the rubric.
    minimum: 0.0
    maximum: 1.0
  metrics:
    type: object
    description: Detailed metrics for the interaction.
    required:
      - intent_match
      - latency_penalty
      - ui_completeness
      - ui_element_count
    properties:
      intent_match:
        type: boolean
      latency_penalty:
        type: number
        minimum: 0.0
        maximum: 1.0
      ui_completeness:
        type: number
        minimum: 0.0
        maximum: 1.0
      ui_element_count:
        type: integer
        minimum: 0
        description: Number of UI elements generated (1, 3, 5, or 10).
      density_level:
        type: integer
        enum:
          - 1
          - 3
          - 5
          - 10
        description: Information density level used for this run.
additionalProperties: false