T006:
  c: false
  h: a5c410ad17d421f6d92e5abd189289df84b588d1087b3f25345851861ee110cd
  r: "The `featurized_data.jsonl` file exists and is non\u2011empty, but its records\
    \ do **not** conform to `contracts/dataset.schema.yaml`: the schema requires a\
    \ `solvent_features` object with fields `viscosity` and `dielectric`, yet the\
    \ produced JSON lines contain `dielectric_constant` instead of `dielectric`. Consequently\
    \ a JSON\u2011Schema validation would fail. The memory profile file is present\
    \ and its `peak_memory_mb` (765.01) satisfies the \u2264\u202F7000\u202FMB limit.\
    \ Fix the featurization output to use the exact field names required by the schema\
    \ (or adjust the schema) so that each line validates."
  sig: 1fd99187a3fa01c86d37db6acfde36917eab56a5c2a6355c36f11777ff0b0736
