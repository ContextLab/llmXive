# Explicit configuration file for Ruff to ensure consistent linting
# This file mirrors settings in pyproject.toml for CLI usage

extend = "pyproject.toml"
line-length = 88
target-version = "py310"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []
fixable = ["ALL"]
unfixable = []

[lint.isort]
known-first-party = ["src", "tests"]
force-sort-within-sections = true
