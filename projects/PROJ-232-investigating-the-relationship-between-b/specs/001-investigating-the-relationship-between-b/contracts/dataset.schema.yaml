$schema: "http://json-schema.org/draft-07/schema#"
title: "Verified HCP Parquet Dataset Schema"
type: "object"
properties:
  subject_id:
    type: "string"
    description: "Unique identifier for the participant (e.g., HCP ID)."
  age:
    type: "integer"
    minimum: 0
    maximum: 120
    description: "Age of the participant in years."
  sex:
    type: "string"
    enum: ["M", "F"]
    description: "Biological sex of the participant."
  fd_mean:
    type: "number"
    minimum: 0
    description: "Mean Framewise Displacement (mm) computed during preprocessing."
  fc_upper_tri:
    type: "array"
    items:
      type: "number"
    description: "Upper‑triangular elements (including diagonal) of the functional connectivity matrix for the network under study, stored as a flat list."
  behavioral_proxy:
    type: "number"
    description: "Optional music‑related behavioral score present in the dataset (e.g., music listening hours)."
required:
  - subject_id
  - age
  - sex
  - fd_mean
  - fc_upper_tri
additionalProperties: false