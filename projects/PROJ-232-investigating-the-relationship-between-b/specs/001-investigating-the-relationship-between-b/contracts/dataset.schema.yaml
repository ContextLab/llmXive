$schema: "http://json-schema.org/draft-07/schema#"
title: "Subject-level input dataset schema"
type: "object"
properties:
  subject_id:
    type: "string"
    description: "Unique participant identifier."
  age:
    type: "integer"
    minimum: 0
    maximum: 120
    description: "Age in years."
  sex:
    type: "string"
    enum: ["M", "F"]
    description: "Sex of the participant."
  fd_mean:
    type: "number"
    minimum: 0
    description: "Mean framewise displacement in mm; rows with fd_mean > 0.5 are excluded."
  mer_score:
    type: "number"
    description: "Music Emotion Rating total score (behavioral outcome). **Note:** The MER instrument should be validated for musical‑emotion perception; current open datasets do not provide validation evidence, which is a limitation of the present analysis."
  fc_upper_tri:
    type: "array"
    items:
      type: "number"
    minItems: 20100
    maxItems: 20100
    description: "Upper‑triangular elements (including diagonal) of the 200x200 functional connectivity matrix."
required:
  - subject_id
  - age
  - sex
  - fd_mean
  - mer_score
  - fc_upper_tri
additionalProperties: false