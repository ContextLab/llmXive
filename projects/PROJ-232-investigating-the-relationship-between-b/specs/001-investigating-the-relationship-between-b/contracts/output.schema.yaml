$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Results Schema"
type: "object"
properties:
  metric_name:
    type: "string"
    description: "Name of the network metric (e.g., 'global_efficiency' or 'dmn_efficiency')."
  correlation_r:
    type: "number"
    minimum: -1
    maximum: 1
    description: "Pearson correlation coefficient between the metric and the behavioral proxy."
  p_value:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Raw two‑tailed p‑value."
  p_value_fdr:
    type: "number"
    minimum: 0
    maximum: 1
    description: "FDR‑adjusted p‑value (Benjamini‑Hochberg)."
  significant:
    type: "boolean"
    description: "True if `p_value_fdr < 0.05`."
  sample_size:
    type: "integer"
    minimum: 1
    description: "Number of subjects included in the correlation test."
  power_achieved:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Achieved statistical power for detecting an effect size of r = 0.20 at α = 0.05."
required:
  - metric_name
  - correlation_r
  - p_value
  - p_value_fdr
  - significant
  - sample_size
  - power_achieved
additionalProperties: false