$schema: "http://json-schema.org/draft-07/schema#"
title: "Data gap report schema"
type: "object"
properties:
  gate_passed:
    type: "boolean"
    description: "False when required variables are missing from all sources."
  missing_variables:
    type: "array"
    items:
      type: "string"
    description: "Required variables not found in any downloaded file."
  per_file_columns:
    type: "object"
    additionalProperties:
      type: "array"
      items:
        type: "string"
    description: "Map of downloaded file name to its actual column names."
  timestamp:
    type: "string"
    description: "ISO-8601 timestamp of the validation run."
required:
  - gate_passed
  - missing_variables
  - per_file_columns
  - timestamp
additionalProperties: false
