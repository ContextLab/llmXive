%YAML 1.2
---
# Schema for analysis outputs
# Validates connectivity matrices, network metrics, and merged datasets
$schema: http://json-schema.org/draft-07/schema#
title: AnalysisOutputSchema
description: >-
  Defines the expected structure for connectivity matrices, graph metrics,
  and final merged datasets used in statistical modeling.

definitions:
  connectivity_matrix:
    type: object
    required:
      - subject_id
      - matrix
      - atlas
      - validation
    properties:
      subject_id:
        type: string
      atlas:
        type: string
        description: "Name of the atlas used (e.g., Schaefer200)"
      matrix:
        type: array
        description: "2D array representing the connectivity matrix"
        items:
          type: array
          items:
            type: number
            minimum: -1.0
            maximum: 1.0
      validation:
        type: object
        required:
          - is_symmetric
          - diagonal_is_one
          - shape
        properties:
          is_symmetric:
            type: boolean
          diagonal_is_one:
            type: boolean
          shape:
            type: array
            items:
              type: integer
            minItems: 2
            maxItems: 2

  network_metrics:
    type: object
    required:
      - subject_id
      - global_efficiency
      - modularity
      - participation_coefficient
      - network_efficiency
      - edge_strengths
    properties:
      subject_id:
        type: string
      global_efficiency:
        type: number
      modularity:
        type: number
      participation_coefficient:
        type: number
      network_efficiency:
        type: object
        description: "Efficiency per network (DMN, Salience, Visual)"
        additionalProperties:
          type: number
      edge_strengths:
        type: array
        description: "List of edge weights (flattened or sparse representation)"
        items:
          type: number

  merged_dataset:
    type: object
    required:
      - subjects
      - features
      - metadata
    properties:
      subjects:
        type: array
        items:
          type: string
      features:
        type: object
        description: "Matrix of features (rows=subjects, cols=features)"
        additionalProperties:
          type: array
          items:
            type: number
      metadata:
        type: object
        properties:
          n_subjects:
            type: integer
          n_features:
            type: integer
          excluded_subjects:
            type: array
            items:
              type: string
            description: "Subjects excluded due to motion or missing data"

type: object
properties:
  connectivity_results:
    type: object
    description: "Output from T013 connectivity analysis"
    additionalProperties: false
    required:
      - matrices
    properties:
      matrices:
        type: array
        items:
          $ref: "#/definitions/connectivity_matrix"

  graph_metrics_results:
    type: object
    description: "Output from T018 graph metrics calculation"
    additionalProperties: false
    required:
      - metrics
    properties:
      metrics:
        type: array
        items:
          $ref: "#/definitions/network_metrics"

  final_dataset:
    type: object
    description: "Output from T021 merge operation"
    additionalProperties: false
    required:
      - data
    properties:
      data:
        $ref: "#/definitions/merged_dataset"

  power_analysis_status:
    type: object
    description: "Output from T025 power gate"
    additionalProperties: false
    required:
      - status
      - achieved_power
    properties:
      status:
        type: string
        enum: ["pass", "fail"]
      achieved_power:
        type: number
        minimum: 0.0
        maximum: 1.0

required:
  - connectivity_results
  - graph_metrics_results
  - final_dataset
  - power_analysis_status
additionalProperties: false