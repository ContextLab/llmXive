$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Output Schema"
description: >
  Schema for validating the output artifacts generated by the analysis pipeline,
  including connectivity matrices, network metrics, and behavioral scores.
  This schema ensures that all outputs conform to expected structures and
  data types before downstream statistical analysis.
type: object
required:
  - connectivity_matrices
  - network_metrics
  - behavioral_scores
  - preprocessing_log
properties:
  connectivity_matrices:
    type: object
    description: "Connectivity matrices for all subjects"
    required:
      - schema_version
      - subjects
    properties:
      schema_version:
        type: string
        description: "Version of the connectivity matrix schema"
        pattern: "^\\d+\\.\\d+\\.\\d+$"
      subjects:
        type: object
        description: "Mapping of subject IDs to their connectivity matrices"
        additionalProperties:
          type: object
          required:
            - matrix
            - atlas
            - validation
          properties:
            matrix:
              type: array
              description: "2D array representing the correlation matrix"
              items:
                type: array
                items:
                  type: number
                  minimum: -1.0
                  maximum: 1.0
              minItems: 1
            atlas:
              type: object
              description: "Atlas information used for extraction"
              required:
                - name
                - parcels
              properties:
                name:
                  type: string
                  description: "Name of the atlas (e.g., 'Schaefer200')"
                parcels:
                  type: integer
                  description: "Number of parcels in the atlas"
                  minimum: 1
            validation:
              type: object
              description: "Validation results for the matrix"
              required:
                - is_symmetric
                - diagonal_is_one
                - range_valid
              properties:
                is_symmetric:
                  type: boolean
                  description: "Whether the matrix is symmetric"
                diagonal_is_one:
                  type: boolean
                  description: "Whether the diagonal elements are 1.0"
                range_valid:
                  type: boolean
                  description: "Whether all elements are in [-1, 1]"
  network_metrics:
    type: object
    description: "Network metrics calculated for each subject"
    required:
      - schema_version
      - subjects
    properties:
      schema_version:
        type: string
        description: "Version of the network metrics schema"
        pattern: "^\\d+\\.\\d+\\.\\d+$"
      subjects:
        type: object
        description: "Mapping of subject IDs to their network metrics"
        additionalProperties:
          type: object
          required:
            - global_efficiency
            - modularity
            - participation_coefficient
            - network_efficiency
            - edge_strengths
          properties:
            global_efficiency:
              type: number
              description: "Global efficiency of the brain network"
              minimum: 0.0
            modularity:
              type: number
              description: "Modularity score of the network"
            participation_coefficient:
              type: number
              description: "Participation coefficient for hub detection"
            network_efficiency:
              type: object
              description: "Efficiency metrics for specific networks"
              additionalProperties:
                type: number
                minimum: 0.0
            edge_strengths:
              type: array
              description: "List of edge-level connectivity strengths"
              items:
                type: number
                minimum: -1.0
                maximum: 1.0
  behavioral_scores:
    type: object
    description: "Behavioral scores for all subjects"
    required:
      - schema_version
      - subjects
    properties:
      schema_version:
        type: string
        description: "Version of the behavioral scores schema"
        pattern: "^\\d+\\.\\d+\\.\\d+$"
      subjects:
        type: object
        description: "Mapping of subject IDs to their behavioral scores"
        additionalProperties:
          type: object
          required:
            - bmrq_total
            - bmrq_subscores
            - demographics
          properties:
            bmrq_total:
              type: number
              description: "Total BMRQ score"
            bmrq_subscores:
              type: object
              description: "Sub-scores for different BMRQ dimensions"
              additionalProperties:
                type: number
            demographics:
              type: object
              description: "Demographic information"
              required:
                - age
                - sex
              properties:
                age:
                  type: integer
                  minimum: 0
                sex:
                  type: string
                  enum:
                    - "male"
                    - "female"
                    - "other"
  preprocessing_log:
    type: object
    description: "Log of preprocessing steps and results"
    required:
      - schema_version
      - runs
    properties:
      schema_version:
        type: string
        description: "Version of the preprocessing log schema"
        pattern: "^\\d+\\.\\d+\\.\\d+$"
      runs:
        type: array
        description: "List of preprocessing runs"
        items:
          type: object
          required:
            - subject_id
            - status
            - fd_score
            - excluded
          properties:
            subject_id:
              type: string
              description: "Subject identifier"
            status:
              type: string
              enum:
                - "success"
                - "failed"
                - "excluded"
              description: "Status of the preprocessing run"
            fd_score:
              type: number
              description: "Framewise Displacement score"
              minimum: 0.0
            excluded:
              type: boolean
              description: "Whether the subject was excluded due to motion"
            error_message:
              type: string
              description: "Error message if status is 'failed'"
  metadata:
    type: object
    description: "Overall metadata for the output"
    required:
      - generated_at
      - pipeline_version
      - total_subjects
      - excluded_subjects
    properties:
      generated_at:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of output generation"
      pipeline_version:
        type: string
        description: "Version of the analysis pipeline"
      total_subjects:
        type: integer
        description: "Total number of subjects processed"
        minimum: 0
      excluded_subjects:
        type: array
        description: "List of excluded subject IDs"
        items:
          type: string
      validation_summary:
        type: object
        description: "Summary of validation results"
        required:
          - connectivity_valid
          - metrics_valid
          - behavioral_valid
        properties:
          connectivity_valid:
            type: boolean
            description: "Whether all connectivity matrices passed validation"
          metrics_valid:
            type: boolean
            description: "Whether all network metrics passed validation"
          behavioral_valid:
            type: boolean
            description: "Whether all behavioral scores passed validation"
additionalProperties: false