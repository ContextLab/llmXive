# Ruff configuration for llmXive project
# Extends settings from pyproject.toml for explicit tooling

target-version = "py311"
line-length = 88

# Enable all recommended rules
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflake
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # Ruff-specific rules
]

# Ignore specific rules that conflict with project style or are too strict
ignore = [
    "E501",  # Line too long (handled by Black)
    "B008",  # Do not perform function calls in argument defaults (common pattern in configs)
    "C901",  # Too complex (enforced during review, not CI)
    "RUF012", # Mutable class attributes (common in dataclasses)
]

exclude = [
    ".git",
    ".tox",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "*.pyc",
    "*.egg-info",
]

[isort]
known-first-party = ["lib", "models", "services", "cli", "tests", "contracts"]
force-to-top = ["os", "sys"]

[per-file-ignores]
"code/__init__.py" = ["F401"]
"code/lib/__init__.py" = ["F401"]
"code/models/__init__.py" = ["F401"]
"code/services/__init__.py" = ["F401"]
"code/cli/__init__.py" = ["F401"]
"code/tests/__init__.py" = ["F401"]
"code/tests/unit/__init__.py" = ["F401"]
"code/tests/contract/__init__.py" = ["F401"]
