# Ruff configuration file (alternative to pyproject.toml)
# This file ensures ruff is explicitly configured even if pyproject.toml is ignored by some tools.
line-length = 88
target-version = "py311"

select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]

ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[per-file-ignores]
"tests/*" = ["S101"] # allow asserts in tests
