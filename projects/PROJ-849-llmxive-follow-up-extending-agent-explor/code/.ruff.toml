# Ruff configuration for llmXive project
# This file is an alias for pyproject.toml settings but allows specific overrides
# if needed. Currently, we rely on pyproject.toml for the main configuration.

extend = "pyproject.toml"

# Specific overrides if necessary
[lint]
# Ensure we catch unused imports and variables
select = ["ALL"]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in __init__
    "ANN",  # flake8-annotations (optional for research code)
    "S101", # Use of assert (allowed in tests)
]

[format]
# Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
