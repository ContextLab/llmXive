# Explicit ruff configuration file for redundancy and IDE support
extend = "pyproject.toml"
line-length = 88
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM"]
ignore = ["E501"]

[lint.isort]
known-first-party = ["lib", "models", "services", "cli", "tests"]
force-single-line = false
lines-after-imports = 2
