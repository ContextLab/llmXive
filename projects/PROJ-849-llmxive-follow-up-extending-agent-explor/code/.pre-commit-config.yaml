repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff-format (black replacement)
  - repo: local
    hooks:
      - id: pytest
        name: Run Tests
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
