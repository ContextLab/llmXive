$schema: "http://json-schema.org/draft-07/schema#"
title: "AnalysisReport"
description: "Schema for the final analysis report including correlation and classification metrics."
type: "object"
properties:
  total_records:
    type: "integer"
    description: "Total number of records processed."
    minimum: 0
  mean_divergence_score:
    type: "number"
    description: "Mean of the divergence scores across all records."
  pearson_correlation:
    type: "number"
    description: "Pearson correlation coefficient between divergence and failure."
  p_value:
    type: "number"
    description: "P-value for the correlation test."
  logistic_regression_accuracy:
    type: "number"
    description: "Accuracy of the logistic regression classifier on the test set."
  logistic_regression_auc_roc:
    type: "number"
    description: "AUC-ROC of the logistic regression classifier."
  model_coefficients:
    type: "object"
    description: "Coefficients of the logistic regression model."
    additionalProperties:
      type: "number"
  execution_time_seconds:
    type: "number"
    description: "Total execution time in seconds."
  memory_peak_gb:
    type: "number"
    description: "Peak memory usage in GB."
  status:
    type: "string"
    description: "Status of the analysis (SUCCESS, TIMEOUT, MEMORY_LIMIT)."
    enum:
      - "SUCCESS"
      - "TIMEOUT"
      - "MEMORY_LIMIT"
      - "ERROR"
required:
  - total_records
  - mean_divergence_score
  - pearson_correlation
  - p_value
  - logistic_regression_accuracy
  - logistic_regression_auc_roc
  - execution_time_seconds
  - memory_peak_gb
  - status
additionalProperties: false
