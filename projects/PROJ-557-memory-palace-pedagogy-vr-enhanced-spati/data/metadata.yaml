dataset:
  id: ds004041
  name: Pupil Labs Reading Dataset
  version: "1.0.0"
  hash: "a1b2c3d4e5f6" # Placeholder, actual hash from T004
  description: |
    Dataset containing eye-tracking data from participants reading abstract and concrete passages.
    Used for calculating Cognitive Load Index (CLI) and simulating adaptive text presentation.
  limitations:
    - "Lacks simplified text for passages (T005c, T021b generates counterfactuals)."
    - "No VR interaction data (fixed spatial mapping)."
    - "Recall scores are behavioral proxies, not direct measures of consolidation mechanisms."
derived_files:
  - data/derived/passage_data.parquet
  - data/derived/counterfactual_text.parquet
  - data/derived/cli_time_series.parquet
  - data/derived/adaptation_labels.parquet