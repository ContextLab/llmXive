$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: |
  Schema for the model evaluation metrics and summary outputs.
  Validates the structure of data/processed/metrics_summary.json.
type: object
required:
  - timestamp
  - models
  - baseline_rmse
  - plots
properties:
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the evaluation was performed.
  models:
    type: object
    description: Metrics for each trained model.
    required:
      - linear_regression
      - random_forest
    properties:
      linear_regression:
        type: object
        required:
          - rmse
          - pearson_r
        properties:
          rmse:
            type: number
            description: Root Mean Squared Error.
          pearson_r:
            type: number
            description: Pearson correlation coefficient.
      random_forest:
        type: object
        required:
          - rmse
          - pearson_r
        properties:
          rmse:
            type: number
            description: Root Mean Squared Error.
          pearson_r:
            type: number
            description: Pearson correlation coefficient.
  baseline_rmse:
    type: number
    description: RMSE of the mean predictor baseline.
  plots:
    type: object
    description: Paths to generated visualization files.
    required:
      - scatter_plot
      - importance_plot
    properties:
      scatter_plot:
        type: string
        description: Relative path to the predicted vs experimental scatter plot.
      importance_plot:
        type: string
        description: Relative path to the feature importance bar chart.
  execution_stats:
    type: object
    description: Optional execution statistics (time, memory).
    properties:
      duration_seconds:
        type: number
      peak_memory_mb:
        type: number
additionalProperties: true