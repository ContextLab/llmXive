$schema: http://json-schema.org/draft-07/schema#
title: Molecule Processed Data Schema
description: Schema for the processed molecule dataset containing descriptors and drug-likeness scores.
type: object
required:
  - properties
  - required
properties:
  type:
    type: string
    const: object
  properties:
    type: object
    additionalProperties: true
    properties:
      smiles:
        type: object
        properties:
          type:
            type: string
            const: string
          description:
            type: string
            const: Canonical SMILES string of the molecule
      experimental_value:
        type: object
        properties:
          type:
            type: string
            enum:
              - number
              - string
          description:
            type: string
            const: Experimental measurement (e.g., IC50, Ki, or transformed value)
      target:
        type: object
        properties:
          type:
            type: string
            const: string
          description:
            type: string
            const: Target protein or assay target name
      mw:
        type: object
        properties:
          type:
            type: string
            const: number
          description:
            type: string
            const: Molecular weight
      logp:
        type: object
        properties:
          type:
            type: string
            const: number
          description:
            type: string
            const: Partition coefficient (logP)
      tpsa:
        type: object
        properties:
          type:
            type: string
            const: number
          description:
            type: string
            const: Topological polar surface area
      hbd:
        type: object
        properties:
          type:
            type: string
            const: integer
          description:
            type: string
            const: Number of hydrogen bond donors
      hba:
        type: object
        properties:
          type:
            type: string
            const: integer
          description:
            type: string
            const: Number of hydrogen bond acceptors
      rotatable_bonds:
        type: object
        properties:
          type:
            type: string
            const: integer
          description:
            type: string
            const: Number of rotatable bonds
      ring_count:
        type: object
        properties:
          type:
            type: string
            const: integer
          description:
            type: string
            const: Number of rings
      mol_weight:
        type: object
        properties:
          type:
            type: string
            const: number
          description:
            type: string
            const: Molecular weight (alias for mw, kept for compatibility)
      log_p:
        type: object
        properties:
          type:
            type: string
            const: number
          description:
            type: string
            const: LogP (alias for logp, kept for compatibility)
  required:
    type: array
    items:
      type: string
    description: List of required fields
additionalProperties: false
