# Ruff configuration for llmXive project
# Extends the settings in pyproject.toml but can be overridden here if needed.
# Currently, we rely on pyproject.toml for simplicity.
line-length = 100
target-version = "py310"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pygments
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[lint.per-file-ignores]
"__init__.py" = ["F401"]
