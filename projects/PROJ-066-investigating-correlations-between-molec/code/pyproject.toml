[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-066"
version = "0.1.0"
description = "Investigating Correlations Between Molecular Descriptors and Drug-Likeness Scores"
requires-python = ">=3.10"
dependencies = [
    "rdkit",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "pyyaml",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = []
target-version = "py310"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
