$schema: "http://json-schema.org/draft-07/schema#"
title: Taxa Correlations Result Schema
description: Schema for the CSV file generated by the correlation step.
type: object
required:
  - taxon_name
  - spearman_rho
  - raw_p
  - bh_adj_p
properties:
  taxon_name:
    type: string
    description: Identifier of the microbial taxon.
  spearman_rho:
    type: number
    description: Spearman rank correlation coefficient between taxon slope and clinical outcome slope.
  raw_p:
    type: number
    minimum: 0
    maximum: 1
    description: Two‑tailed p‑value associated with the Spearman correlation.
  bh_adj_p:
    type: number
    minimum: 0
    maximum: 1
    description: Benjamini‑Hochberg FDR‑adjusted p‑value.