$schema: "http://json-schema.org/draft-07/schema#"
title: Taxa Correlation Results
description: Schema for the CSV file produced by the correlation stage.
type: object
properties:
  taxon_name:
    type: string
  spearman_rho:
    type: number
  raw_p:
    type: number
    minimum: 0
    maximum: 1
  bh_adj_p:
    type: number
    minimum: 0
    maximum: 1
required:
  - taxon_name
  - spearman_rho
  - raw_p
  - bh_adj_p
additionalProperties: false