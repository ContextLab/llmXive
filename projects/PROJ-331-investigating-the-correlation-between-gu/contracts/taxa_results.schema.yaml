$schema: "http://json-schema.org/draft-07/schema#"
title: Taxa Correlation Results
description: |
  Schema for the CSV file `results/taxa_correlations_adj.csv`
  (and the unadjusted `results/taxa_correlations.csv`). Each row
  corresponds to a microbial taxon and contains the Spearman
  correlation between the taxon‑slope and the clinical outcome
  slope, the raw p‑value, and the Benjamini‑Hochberg adjusted
  p‑value.
type: object
properties:
  taxon_name:
    type: string
    description: Name/identifier of the microbial taxon.
  spearman_rho:
    type: number
    description: Spearman rank correlation coefficient.
  raw_p:
    type: number
    minimum: 0
    maximum: 1
    description: Two‑tailed p‑value for the Spearman correlation.
  bh_adj_p:
    type: number
    minimum: 0
    maximum: 1
    description: Benjamini‑Hochberg FDR‑adjusted p‑value.
required:
  - taxon_name
  - spearman_rho
  - raw_p
  - bh_adj_p
additionalProperties: false