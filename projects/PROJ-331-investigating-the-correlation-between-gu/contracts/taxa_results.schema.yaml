# Schema for taxon-based analysis results (T004, T005, T006).
# Validates the structure of result CSVs.
type: object
properties:
  taxon_name:
    type: string
    description: "The identifier of the microbial taxon."
  spearman_rho:
    type: number
    description: "Spearman rank correlation coefficient."
  raw_p:
    type: number
    minimum: 0
    maximum: 1
    description: "Raw p-value from the statistical test."
  bh_adj_p:
    type: number
    minimum: 0
    maximum: 1
    description: "Benjamini-Hochberg adjusted p-value."
  interaction_coef:
    type: number
    description: "Coefficient from the Mixed-Effects model interaction term."
  std_error:
    type: number
    description: "Standard error of the interaction coefficient."
  permutation_p:
    type: number
    minimum: 0
    maximum: 1
    description: "Empirical p-value from the permutation test."
required:
  - taxon_name
