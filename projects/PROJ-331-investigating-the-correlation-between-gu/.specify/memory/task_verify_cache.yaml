T001:
  c: false
  h: 65fd3eeb1d3ed1e10ef90a5dbeaf2c0a11e31a9cdaa259c98565f1a70d4e171b
  r: "The ingest module exists and implements the required checks, but the two raw\
    \ data files (`data/raw/open_asv.csv` and `data/raw/open_clinical.parquet`) are\
    \ missing, so the script cannot exit with status\u202F0 nor log checksums. Additionally,\
    \ the unit\u2011test file `code/tests/test_ingest_preprocessed.py` is absent,\
    \ so test pass evidence is unavailable. Provide valid raw input files containing\
    \ the required columns (including a `preprocessed` column set to\u202FTrue) and\
    \ add the missing test suite."
  sig: 4c79ed0c2177f823f9983f1b4464fece732518072f809db6fdcbb02cd1cefad0
T002:
  c: false
  h: 82803758839ea2ed8a736a31a234ef20976bbdfc04b9ce54a57b464f10ed983d
  r: "The repository contains the preprocessing module and a full test suite, but\
    \ the required output artifacts `data/processed/filtered_samples.parquet` and\
    \ `data/processed/clr_abundances.parquet` are absent. Moreover, the CLR transformation\
    \ is implemented manually instead of using the mandated `scikit\u2011bio` library.\
    \ Both issues prevent the task from being considered fully completed."
  sig: 3e518daacc50aff607217727a015ee3c0dfe73f5b096d39b6e2ab2c4760ab309
T003:
  c: true
  h: 09e0766dedad41d5a5273aef55aa5dee6a45b0ef1bbce724c7674def5e23608e
  r: "Checked `code/src/pipeline/slopes.py` which implements exact\u2011year time\
    \ conversion, per\u2011patient taxon and outcome slope computation, exclusion\
    \ of single\u2011visit patients, and writes the required parquet files, and `code/tests/test_slopes.py`\
    \ which validates all of these behaviours. The implementation satisfies the task\u2019\
    s specifications, and the tests confirm correct handling of two\u2011visit patients,\
    \ year calculations, constant outcomes, and file creation."
  sig: 49069d714f3dd06165557b790852aa7b6e78074f596e68d50171e4db77c66d59
T004:
  c: false
  h: 41d5c3fdbd212103d35f25194f1251745369659fd0f64aefb28b6eee5f04c5eb
  r: "The pipeline writes only `results/taxa_correlations.csv` (unadjusted) and a\
    \ partial file named `partial_spearman_exploratory.csv`; the required `results/taxa_correlations_adj.csv`\
    \ is missing, and the contract schema file `taxa_results.schema.yaml` and the\
    \ test `code/tests/test_correlation_adj.py` are also absent. Consequently the\
    \ task\u2019s specification (covariate\u2011adjusted Spearman output and its validation)\
    \ is not fulfilled."
  sig: 37311e481f98a9a0fbf3ae216e59b47b696f9912ed234bd95dca9db10d8f2ddb
T005:
  c: true
  h: 0917c0a8fff5131ff6184adbb545b8dc4172d92180afee747cbadca06eca359d
  r: "The `code/src/pipeline/mixed_effects.py` script implements the required mixed\u2011\
    effects fitting, zero\u2011variance covariate detection, BH correction, and writes\
    \ `results/mixed_effects_summary.csv` with the correct columns. The accompanying\
    \ `code/tests/test_mixed_effects.py` validates that a synthetic dataset yields\
    \ the expected interaction coefficient and that missing outcome data produces\
    \ an empty results file with only the header. All required artifacts exist, are\
    \ non\u2011empty where appropriate, and their contents meet the task specifications."
  sig: 2e3732fc204855cc2d22d5d230aaa93f45171f30519a6c87c09d0de5913e5134
T006:
  c: true
  h: 824aeff7df9d65f73098f77897fba5d96e842aa61f040c233c97ad6166e77e58
  r: "Checked `code/src/pipeline/permutation.py` \u2013 it seeds NumPy, permutes patient\
    \ IDs while preserving visit order, refits the mixed\u2011effects model per taxon,\
    \ computes empirical p\u2011values, aborts after a 4\u2011hour wall\u2011time\
    \ limit, and writes `results/permutation_pvalues.csv`. The accompanying `code/tests/test_permutation.py`\
    \ validates that the script creates the CSV with the correct columns and that\
    \ all empirical p\u2011values lie in\u202F[0,\u202F1]."
  sig: 641ca81feac29d65462ac88b06c8508552704fc02cca2da4e68edeb37d3ffc32
