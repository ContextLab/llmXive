  c: false
  h: 52721b0eb71b683d24caeda7d092ba27b40d85f0f9a89cfb2ae6b8dad7886ce4
  r: "The `mixed_effects.py` module is present but contains bugs (missing imports\
    \ for `statsmodels.api as sm` and `scipy.stats as stats`) that prevent it from\
    \ running, and the required output file `data/results/mixed_effects_summary.csv`\
    \ is absent. Additionally, the unit tests fail due to missing parquet engine and\
    \ the code errors, so the contract test and synthetic\u2011data verification are\
    \ not satisfied."
