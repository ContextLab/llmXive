T006:
  c: false
  h: 00ca1cd6d44e3514e4c51cae6851a56ac3d8cf1cc1dfcf78fe04b4d29f887cf4
  r: "The `permutation.py` script is present, but the required output file `data/results/permutation_pvalues.csv`\
    \ does not exist, and the provided test `code/tests/test_permutation.py` fails\
    \ (ImportError for missing parquet engine), so the contract test that validates\
    \ the CSV never runs. Moreover, the permutation routine skips the time\u2011year\
    \ and sex encoding steps that the mixed\u2011effects model needs, causing model\
    \ fitting to error out and produce NaN p\u2011values. The task\u2019s core requirements\
    \ (producing a valid CSV of empirical p\u2011values after correctly refitting\
    \ the LME) are therefore not satisfied."
  sig: f28ffb05ce80ce30039bce9e5a7337b63cf711376550175cd02b9b0311bca1c4
