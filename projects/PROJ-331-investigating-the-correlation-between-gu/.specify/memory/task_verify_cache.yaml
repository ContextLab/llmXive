T001:
  c: false
  h: 9b55d93e17be67d4a872d8c41e6659f927d89d3adb913131bd8f2a53918b4f52
  r: "The ingest module and quickstart documentation exist and follow the specification,\
    \ but the required unit tests all fail because the test suite cannot write/read\
    \ Parquet files (missing `pyarrow`/`fastparquet` engine). Consequently the three\
    \ verification cases (valid inputs, missing outcome column, malformed ASV) are\
    \ not demonstrated to work, so the task\u2019s verification criteria are not satisfied.\
    \ The implementation must add the necessary Parquet support (e.g., include `pyarrow`\
    \ in dependencies) or adjust the code/tests to handle the environment, after which\
    \ the tests should pass."
  sig: 1508418ae486522ecda6d431478d1fc92a719291155086f0aa83f775a7b9a1f2
T003:
  c: false
  h: 537a603e7631678e0ec35b843bdfaab4dda7b129bc3410f869938dad1648d8d9
  r: "The `slopes.py` module is present, but the required unit tests are empty (no\
    \ test cases) and the test run reports 0 items collected with a non\u2011zero\
    \ exit code. Additionally, the input file `data/processed/clr_abundances.parquet`\
    \ (and the expected output parquet files) are missing, so the slope computation\
    \ cannot be exercised or verified. The task\u2019s verification criteria are therefore\
    \ not satisfied."
  sig: 6049c8fde57cfaa0f5de4c78da4873ad4f4cc4a25a6f8dcb6d0f343c25fd3697
