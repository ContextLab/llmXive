    \ test is missing. Additionally, the provided `test_permutation.py` does not verify\
    \ the patient\u2011level time\u2011ordering preservation nor the 4\u2011hour wall\u2011\
    time guard, leaving those required behaviours untested. The task therefore lacks\
    \ a complete, validated results artifact."
