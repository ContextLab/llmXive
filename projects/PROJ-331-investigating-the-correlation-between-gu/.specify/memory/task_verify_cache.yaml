T001:
  c: false
  h: 1f9bad2fcaf94b76ab610a8cf703c3c7555308c90c09418df2444053e624ce2f
  r: The task's required input artifacts `data/raw/open_asv.csv` and `data/raw/open_clinical.parquet`
    are both MISSING, so the ingest module cannot actually validate real data, and
    there is no execution record showing `python -m code.src.pipeline.ingest` exiting
    0 and logging SHA-256 checksums of the raw files (the only historical run is the
    unit test, which uses synthetic tmp_path fixtures). The ingest code and tests
    themselves look correct, but the task explicitly requires the real raw files to
    exist and be validated with logged checksums.
  sig: 2e94f1f371efee92d66c30cd70844ee3ffcf02f79721c4b400c5a406381c3bce
T002:
  c: false
  h: 1c604b24c6ce805f451af267011196ffbf5f440a437574a5b1cbbc9a1172c20c
  r: "The required output artifacts `data/processed/filtered_samples.parquet` and\
    \ `data/processed/clr_abundances.parquet` are MISSING \u2014 the pipeline script\
    \ and tests exist, but there is no evidence the preprocessing was ever run on\
    \ real data to produce the deliverables. Additionally, `cap_taxa_by_memory` is\
    \ implemented so that any caller-supplied `max_taxa != 100` silently skips subsampling\
    \ entirely (returning the full taxa list), which contradicts FR-010's requirement\
    \ to cap to the top-100 most abundant taxa when the budget is exceeded; the test\
    \ only exercises this via the private `_cap_impl` helpe"
  sig: c32e62d6f7962cbf2486356be284bd55be567fa40e0469cb4cf7f8d787837679
T003:
  c: true
  h: 09e0766dedad41d5a5273aef55aa5dee6a45b0ef1bbce724c7674def5e23608e
  r: "Checked `code/src/pipeline/slopes.py` which implements exact\u2011year time\
    \ conversion, per\u2011patient taxon and outcome slope computation, exclusion\
    \ of single\u2011visit patients, and writes the required parquet files, and `code/tests/test_slopes.py`\
    \ which validates all of these behaviours. The implementation satisfies the task\u2019\
    s specifications, and the tests confirm correct handling of two\u2011visit patients,\
    \ year calculations, constant outcomes, and file creation."
  sig: 49069d714f3dd06165557b790852aa7b6e78074f596e68d50171e4db77c66d59
T004:
  c: false
  h: 4b496465dcbafb6e9bc2f15498a90f07f98f7cccc3098852da4e5f723a7d589a
  r: "The required output `results/taxa_correlations_adj.csv` is explicitly MISSING,\
    \ and the schema file `taxa_results.schema.yaml` (referenced by the contract test)\
    \ is also absent. While `correlation.py` implements residualization and BH adjustment,\
    \ the adjusted results file was never actually generated \u2014 only the unadjusted\
    \ `taxa_correlations.csv` exists (with a trivial 2-taxon synthetic-looking result),\
    \ and there is no execution evidence that the partial correlation path or the\
    \ tests were ever run. The implementer must run the pipeline with `--partial`\
    \ (or `run_correlation(partial=True)`) against"
  sig: 1f56857c5391a7f1bf7e23ea5639f9ac93a3ca972ee3f23efebad715f5a25ac1
T005:
  c: true
  h: 0917c0a8fff5131ff6184adbb545b8dc4172d92180afee747cbadca06eca359d
  r: "The `code/src/pipeline/mixed_effects.py` script implements the required mixed\u2011\
    effects fitting, zero\u2011variance covariate detection, BH correction, and writes\
    \ `results/mixed_effects_summary.csv` with the correct columns. The accompanying\
    \ `code/tests/test_mixed_effects.py` validates that a synthetic dataset yields\
    \ the expected interaction coefficient and that missing outcome data produces\
    \ an empty results file with only the header. All required artifacts exist, are\
    \ non\u2011empty where appropriate, and their contents meet the task specifications."
  sig: 2e3732fc204855cc2d22d5d230aaa93f45171f30519a6c87c09d0de5913e5134
T007:
  c: false
  h: 6f6538fca76e00df56fa1c057a17265ea9764de6d445a92da2fbd7449a1a72ba
  r: "The repository contains `code/src/pipeline/__main__.py` and a static `results/runtime_log.txt`,\
    \ but the pipeline stages it tries to import (`code.src.pipeline.ingest`, `preprocess`,\
    \ `slopes`, `correlation`, `mixed_effects`, `permutation`) are not present. Consequently\
    \ the test `code/tests/test_runtime_budget.py` would raise an import error and\
    \ never produce a log with the required \u201CPermutation robustness test\u201D\
    \ and \u201CTotal\u201D entries, so the runtime\u2011budget assertions cannot\
    \ be verified. Adding the missing stage modules (or stubs that write to the log)\
    \ is needed for the task to be complete."
  sig: 48fa4f4a22d315569f7ea85b1ea7dfc9d0696414eed4ac2a857bcec3789d414b
