T005:
  c: true
  h: 7e10206c68a821d6f3862f187bd9ebadbdfc898aebbbe2d42290d24338eccda4
  r: "Checked `code/src/pipeline/mixed_effects.py` \u2013 it builds the long\u2011\
    format data, drops zero\u2011variance covariates, fits the specified mixed\u2011\
    effects model per taxon, extracts the interaction coefficient, SE, raw p\u2011\
    value, applies Benjamini\u2011Hochberg correction, and writes `results/mixed_effects_summary.csv`.\
    \ The accompanying `code/tests/test_mixed_effects.py` confirms correct recovery\
    \ of a known interaction on synthetic data and validates the empty\u2011file handling."
  sig: ed6c1b4cac8717d5f1f5ea76b19c312347190cdf4c37b0fb3711e6b2ec73b2c5
T006:
