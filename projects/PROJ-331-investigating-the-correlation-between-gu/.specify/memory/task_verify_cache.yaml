  r: "The required outputs `data/processed/filtered_samples.parquet` and `data/processed/clr_abundances.parquet`\
    \ are MISSING \u2014 the pipeline was never actually run on real data, and there\
    \ is no execution evidence (no test-run logs or run artifacts) that `run_preprocess`\
    \ works end-to-end. Additionally, `cap_taxa_by_memory` is implemented so that\
    \ any caller-supplied `max_taxa != 100` silently skips subsampling entirely, which\
    \ contradicts FR-010's requirement to cap taxa to the given budget (the test merely\
    \ papers over this by calling the private `_cap_impl` directly). The implementer\
    \ must run the prepr"
