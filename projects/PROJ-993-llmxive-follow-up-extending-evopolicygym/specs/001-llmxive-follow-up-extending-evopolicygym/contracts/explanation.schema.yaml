$schema: "http://json-schema.org/draft-07/schema#"
title: "CounterfactualExplanation"
description: "Schema for the output of the counterfactual explanation generator."
type: "object"
properties:
  rule_id:
    type: "string"
    description: "The unique ID of the violated rule from the environment schema."
    pattern: "^RULE-\\d+$"
  reasoning:
    type: "string"
    description: "Natural language explanation of the failure."
    minLength: 1
    maxLength: 1000
  correct_action:
    type: "string"
    description: "The action that would have succeeded."
  token_count:
    type: "integer"
    description: "Number of tokens in the generated text."
    minimum: 1
  is_fallback:
    type: "boolean"
    description: "True if this explanation was generated by the fallback template."
  fallback_reason:
    type: ["string", "null"]
    description: "Reason for fallback (e.g., 'timeout', 'validation_fail') if is_fallback is true."
    enum:
      - "timeout"
      - "validation_fail"
      - "exceeds_token_limit"
      - null
required:
  - "rule_id"
  - "reasoning"
  - "correct_action"
  - "token_count"
  - "is_fallback"
