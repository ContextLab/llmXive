$schema: "http://json-schema.org/draft-07/schema#"
title: "DynamicShiftEnvironment"
description: "Schema for the dynamic shift environment configuration and state."
type: "object"
properties:
  env_id:
    type: "string"
    description: "Unique identifier for the environment instance."
  base_name:
    type: "string"
    description: "Name of the base gymnasium environment (e.g., 'CartPole-v1')."
  shift_step_percentage:
    type: "number"
    description: "Percentage of total budget at which the shift occurs (default 0.5)."
    minimum: 0.0
    maximum: 1.0
  shift_type:
    type: "string"
    description: "Type of shift applied (e.g., 'reward_function', 'transition_dynamics')."
    enum:
      - "reward_function"
      - "transition_dynamics"
      - "both"
  shift_parameters:
    type: "object"
    description: "Parameters defining the new dynamics after the shift."
    additionalProperties: true
  pre_shift_config:
    type: "object"
    description: "Configuration of the environment before the shift."
    additionalProperties: true
  post_shift_config:
    type: "object"
    description: "Configuration of the environment after the shift."
    additionalProperties: true
required:
  - "env_id"
  - "base_name"
  - "shift_step_percentage"
  - "shift_type"
  - "shift_parameters"
