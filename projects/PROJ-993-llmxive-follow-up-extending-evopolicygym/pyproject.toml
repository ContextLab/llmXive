[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-evopolicygym-extension"
version = "0.1.0"
description = "Extension for EvoPolicyGym with dynamic shifts and counterfactuals"
requires-python = ">=3.9"
dependencies = [
    "gymnasium>=0.29.0",
    "transformers>=4.35.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "radon>=6.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "pytest>=7.4.0",
    "torch>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
