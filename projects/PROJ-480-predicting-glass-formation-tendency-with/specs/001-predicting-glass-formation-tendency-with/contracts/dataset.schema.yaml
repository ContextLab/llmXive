$schema: "http://json-schema.org/draft-07/schema#"
title: "CompositionRecord Schema"
description: "Schema for the processed composition dataset with computed descriptors."
type: "object"
properties:
  composition:
    type: "string"
    description: "Chemical formula in Hill notation or standard elemental percentages."
  target_type:
    type: "string"
    enum:
      - "regression"
      - "classification"
    description: "Type of target variable: 'regression' for D_c, 'classification' for binary label."
  target_value:
    type: "number"
    description: "Critical casting thickness (D_c) or binary label (0/1)."
  atomic_size_mismatch:
    type: "number"
    description: "Atomic size mismatch (delta) computed via pymatgen."
  mixing_enthalpy:
    type: "number"
    description: "Mixing enthalpy (Delta H_mix) in kJ/mol."
  electronegativity_diff:
    type: "number"
    description: "Electronegativity difference (Delta chi)."
  entropy_mixing:
    type: "number"
    description: "Entropy of mixing (Delta S_mix) in J/mol-K."
  cooling_rate:
    type: "number"
    description: "Cooling rate (K/s) if available."
  is_valid:
    type: "boolean"
    description: "True if all descriptors were successfully computed."
required:
  - composition
  - target_type
  - target_value
  - atomic_size_mismatch
  - mixing_enthalpy
  - electronegativity_diff
  - is_valid
additionalProperties: false