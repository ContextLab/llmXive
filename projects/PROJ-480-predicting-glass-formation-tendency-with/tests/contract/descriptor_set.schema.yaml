$schema: http://json-schema.org/draft-07/schema#
title: Descriptor Set Schema
description: |
  Schema for the computed atomic descriptors.
  Used to validate intermediate outputs from src/data/descriptors.py.
type: object
required:
  - descriptor_name
  - formula
  - unit
  - description
  - computed_values
properties:
  descriptor_name:
    type: string
    description: Name of the descriptor (e.g., "Atomic Size Mismatch").
  formula:
    type: string
    description: Mathematical formula used for calculation.
  unit:
    type: string
    description: Unit of measurement (e.g., "percent", "kJ/mol").
  description:
    type: string
    description: Physical meaning of the descriptor.
  computed_values:
    type: array
    description: Array of computed values for the dataset.
    items:
      type: number
    minItems: 1
  exclusion_reasons:
    type: array
    description: List of reasons why certain rows were excluded.
    items:
      type: string
additionalProperties: false
