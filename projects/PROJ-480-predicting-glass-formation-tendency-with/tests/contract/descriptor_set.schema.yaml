$schema: http://json-schema.org/draft-07/schema#
title: Descriptor Set Schema
description: Schema for the intermediate descriptor set before final validation.
type: object
required:
  - descriptors
  - metadata
properties:
  metadata:
    type: object
    required:
      - computed_from_doi
      - computation_timestamp
      - excluded_rows
    properties:
      computed_from_doi:
        type: string
        description: Source DOI.
      computation_timestamp:
        type: string
        format: date-time
      excluded_rows:
        type: array
        items:
          type: object
          properties:
            index:
              type: integer
            reason:
              type: string
              enum: [unknown_element, missing_target, unbalanced_composition, invalid_formula]
  descriptors:
    type: array
    items:
      type: object
      required:
        - id
        - composition
        - raw_descriptors
      properties:
        id:
          type: string
          description: Unique identifier for the sample.
        composition:
          type: object
          additionalProperties:
            type: number
        raw_descriptors:
          type: object
          required:
            - delta
            - delta_h_mix
            - delta_chi
          properties:
            delta:
              type: number
              minimum: 0
            delta_h_mix:
              type: number
            delta_chi:
              type: number
        target:
          type: number
          description: Target value if available.
