$schema: http://json-schema.org/draft-07/schema#
title: Model Artifact Schema
description: |
  Schema for the final model artifact and evaluation metrics.
  Aligns with data-model.md for state/model_artifact.json.
type: object
required:
  - model_type
  - metrics
  - diagnostics
  - artifacts
properties:
  model_type:
    type: string
    description: Type of model used (e.g., "XGBoost", "Ridge", "PCA+Ridge").
  metrics:
    type: object
    description: Performance metrics.
    properties:
      r2:
        type: number
      mse:
        type: number
      mae:
        type: number
      auc:
        type: number
      accuracy:
        type: number
      power:
        type: number
        description: Achieved power from post-hoc analysis.
      mdes:
        type: number
        description: Minimum Detectable Effect Size.
    required:
      - r2
  diagnostics:
    type: object
    description: Diagnostic checks for circularity and bias.
    properties:
      vif_max:
        type: number
        description: Maximum Variance Inflation Factor.
      vif_comment:
        type: string
        description: Comment on collinearity status.
      circularity_r2:
        type: number
        description: R² from linear circularity check.
      circularity_status:
        type: string
        enum: ["PASS", "FAIL"]
      permutation_p_value:
        type: number
        description: P-value from permutation test.
      bias_ks_statistic:
        type: number
        description: K-S statistic for selection bias.
      bias_status:
        type: string
        enum: ["PASS", "FAIL"]
    required:
      - vif_max
      - circularity_status
  artifacts:
    type: object
    description: Paths to saved artifacts.
    properties:
      model_path:
        type: string
      report_path:
        type: string
      power_analysis_path:
        type: string
    required:
      - model_path
additionalProperties: true