$schema: http://json-schema.org/draft-07/schema#
title: Clean Dataset Schema
description: Schema for the validated and cleaned dataset produced by the data pipeline.
type: object
required:
  - metadata
  - data
properties:
  metadata:
    type: object
    required:
      - source_doi
      - generated_at
      - checksum
      - row_count
      - feature_columns
      - target_column
      - target_type
    properties:
      source_doi:
        type: string
        description: Zenodo DOI of the source data.
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation.
      checksum:
        type: string
        description: SHA-256 checksum of the raw CSV content.
      row_count:
        type: integer
        minimum: 30
        description: Number of samples after cleaning.
      feature_columns:
        type: array
        items:
          type: string
        description: List of predictor column names.
      target_column:
        type: string
        description: Name of the target variable column.
      target_type:
        type: string
        enum: [regression, classification]
        description: Type of machine learning task.
  data:
    type: array
    items:
      type: object
      required:
        - composition
        - target_value
      properties:
        composition:
          type: object
          additionalProperties:
            type: number
          description: Dictionary of element symbols to atomic fractions.
        target_value:
          type: number
          description: Critical cooling rate (regression) or binary label (classification).
        descriptors:
          type: object
          properties:
            delta:
              type: number
              description: Atomic size mismatch.
            delta_h_mix:
              type: number
              description: Mixing enthalpy.
            delta_chi:
              type: number
              description: Electronegativity difference.
        chemical_family:
          type: string
          description: Derived chemical family label.
