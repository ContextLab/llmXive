$schema: "http://json-schema.org/draft-07/schema#"
title: Glass Formation Dataset Schema
description: Schema for validated glass formation tendency dataset
type: object
required:
  - metadata
  - data

properties:
  metadata:
    type: object
    required:
      - source_doi
      - generated_at
      - checksum
      - row_count
      - feature_columns
      - target_column
      - target_type
    properties:
      source_doi:
        type: string
        pattern: "^10\\.[0-9]{4,}/[0-9a-z\\.]+$"
        description: DOI of the source dataset (e.g., Zenodo)
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of dataset generation
      checksum:
        type: string
        pattern: "^[a-f0-9]{64}$"
        description: SHA-256 checksum of the dataset
      row_count:
        type: integer
        minimum: 30
        description: Total number of rows in the dataset
      feature_columns:
        type: array
        minItems: 1
        items:
          type: string
        description: List of descriptor column names
      target_column:
        type: string
        description: Name of the target variable column
      target_type:
        type: string
        enum:
          - regression
          - classification
        description: Type of prediction task
    
  data:
    type: array
    items:
      type: object
      required:
        - composition
        - target_value
        - descriptors
        - chemical_family
      properties:
        composition:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
          description: Element fractions (must sum to 1)
        target_value:
          type: number
          description: Target value (Dc in mm or binary label)
        descriptors:
          type: object
          required:
            - delta
            - delta_h_mix
            - delta_chi
          properties:
            delta:
              type: number
              description: Atomic size mismatch
            delta_h_mix:
              type: number
              description: Mixing enthalpy
            delta_chi:
              type: number
              description: Electronegativity difference
          additionalProperties: false
        chemical_family:
          type: string
          description: Derived chemical family classification
      additionalProperties: false

additionalProperties: false
