  r: "No directory structure or file list was provided as evidence; the claim that\
    \ the required folders were created cannot be confirmed without tangible artifacts\
    \ showing the presence of `src/data`, `src/models`, `src/reports`, `src/cli`,\
    \ `src/lib`, `tests/contract`, `tests/unit`, `tests/integration`, `data/raw`,\
    \ `data/processed`, `state/`, and `reports/`. The implementer must supply a manifest,\
    \ screenshot, or script output proving that these directories exist and are non\u2011\
    empty."
T002:
  c: true
  h: aaa45e286cdb4980a266d5c25133f0a3d39b1ad747c69d966b4a9823ed70aa1f
  r: "The `pyproject.toml` file (projects/PROJ-480-predicting-glass-formation-tendency-with/pyproject.toml)\
    \ exists, is non\u2011empty, and its `dependencies` list includes all eight required\
    \ packages (`xgboost`, `pymatgen`, `scikit-learn`, `pandas`, `numpy`, `statsmodels`,\
    \ `pyyaml`, `pytest`). The file also specifies Python\u202F3.11 compatibility,\
    \ fulfilling the initialization task."
