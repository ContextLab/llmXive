[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-movie-sentiment-analysis"
version = "0.1.0"
description = "Statistical Analysis of Publicly Available Movie Review Sentiment and Box Office Revenue"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.0.3",
    "numpy==1.24.3",
    "scikit-learn==1.3.0",
    "nltk==3.8.1",
    "scipy==1.11.1",
    "statsmodels==0.14.0",
    "fuzzywuzzy==0.18.0",
    "pytest==7.4.0",
    "pyyaml==6.0.1",
    "python-Levenshtein==0.21.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["code"]
skip = [".git", "__pycache__", ".venv", "venv", "env", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
