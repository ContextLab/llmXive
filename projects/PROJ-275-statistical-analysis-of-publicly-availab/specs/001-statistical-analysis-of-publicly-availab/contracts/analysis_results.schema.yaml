$schema: http://json-schema.org/draft-07/schema#
title: Analysis Results Schema
description: |
  Schema for the output of the Lagged Correlation and Decay Analysis (User Story 2 & 3).
  Contains aggregate statistics per genre, including optimal lag, decay rates, and
  statistical significance metrics.
type: object
required:
  - fields
  - statistical_tests
properties:
  fields:
    type: array
    description: Columns in the final results CSV/Parquet
    items:
      type: object
      required:
        - name
        - type
        - description
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - string
            - float
            - integer
            - boolean
        description:
          type: string
    items:
      - name: genre
        type: string
        description: Genre category
      - name: optimal_lag_weeks
        type: integer
        description: The time lag (in weeks) where sentiment-revenue correlation is maximized
      - name: max_correlation
        type: float
        description: The correlation coefficient at the optimal lag
      - name: lag_ci_lower
        type: float
        description: Lower bound of the 95% Confidence Interval for optimal lag
      - name: lag_ci_upper
        type: float
        description: Upper bound of the 95% Confidence Interval for optimal lag
      - name: decay_slope
        type: float
        description: Linear regression slope of Fisher Z-transformed correlations over 12 weeks
      - name: decay_p_value
        type: float
        description: P-value for the decay slope significance
      - name: n_movies
        type: integer
        description: Number of movies included in this genre's analysis
      - name: correlation_mean
        type: float
        description: Mean correlation across the window
      - name: correlation_std
        type: float
        description: Standard deviation of correlation
  statistical_tests:
    type: array
    description: Summary of statistical tests performed (SC-003 compliance)
    items:
      type: object
      required:
        - test_name
        - null_hypothesis
        - method
        - result_summary
      properties:
        test_name:
          type: string
          description: Name of the test (e.g., 'Mann-Whitney U', 'Bootstrap Lag')
        null_hypothesis:
          type: string
          description: Explicit statement of H0
        method:
          type: string
          description: Statistical method used (e.g., 'scipy.stats.mannwhitneyu')
        result_summary:
          type: string
          description: Brief conclusion (e.g., 'Rejected H0, p < 0.05')
      - test_name: 'Lag Difference Between Genres'
        null_hypothesis: 'The median difference in optimal lag weeks between any two genres is zero.'
        method: 'Mann-Whitney U Test'
        result_summary: 'To be populated by T023'
      - test_name: 'Decay Significance'
        null_hypothesis: 'The sentiment-revenue correlation does not decay over time (slope = 0).'
        method: 'Linear Regression T-test on Fisher Z-transformed correlations'
        result_summary: 'To be populated by T022'
  metadata:
    type: object
    properties:
      generated_at:
        type: string
        format: date-time
      pipeline_version:
        type: string
      data_source:
        type: string
        description: Source datasets used (e.g., 'TMDB5000 + IMDb')
      total_movies_analyzed:
        type: integer