$schema: "http://json-schema.org/draft-07/schema#"
title: "Resource Log Schema"
type: "object"
required:
  - timestamp
  - cpu_percent
  - ram_gb
  - threshold_exceeded
properties:
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp."
  task_id:
    type:
      - "string"
      - "null"
    description: "Current task being executed (or null)."
  cpu_percent:
    type: "number"
    minimum: 0
    maximum: 100
    description: "CPU usage percentage."
  ram_gb:
    type: "number"
    minimum: 0
    description: "RAM usage in GB."
  threshold_exceeded:
    type: "boolean"
    description: "True if limits (low vCPU, 7GB) were breached."
  limit_breach_details:
    type: "string"
    description: "Specific details of the breach (e.g., 'RAM: 7.1GB')."
additionalProperties: false
