$schema: "http://json-schema.org/draft-07/schema#"
title: "EntropyProxy Schema"
description: "Schema for semantic entropy results generated by entropy.py"
type: "object"
properties:
  problem_id:
    type: "string"
    description: "Unique identifier for the problem (e.g., HumanEval/0)"
  num_samples:
    type: "integer"
    description: "Number of samples generated (N=10)"
    minimum: 1
  cluster_ids:
    type: "array"
    items:
      type: "integer"
    description: "Cluster assignment for each sample"
  entropy_value:
    type: "number"
    description: "Shannon entropy over cluster probabilities"
    minimum: 0
  exclusion_reason:
    type: ["string", "null"]
    description: "Reason for exclusion if entropy is undefined (e.g., 'deterministic')"
required:
  - problem_id
  - num_samples
  - cluster_ids
  - entropy_value
additionalProperties: false