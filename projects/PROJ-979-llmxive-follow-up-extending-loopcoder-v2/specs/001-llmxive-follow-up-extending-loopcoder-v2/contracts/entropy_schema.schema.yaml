$schema: "http://json-schema.org/draft-07/schema#"
title: "EntropyProxy"
description: "Schema for semantic entropy extraction results."
type: "object"
properties:
  problem_id:
    type: "string"
    description: "Unique identifier for the problem (e.g., 'HumanEval/0')."
  entropy_value:
    type: "number"
    description: "Shannon entropy value calculated from cluster probabilities."
    minimum: 0
  num_clusters:
    type: "integer"
    description: "Number of distinct semantic clusters found."
    minimum: 1
  exclusion_flag:
    type: "boolean"
    description: "True if the sample was excluded due to undefined entropy."
  metadata:
    type: "object"
    properties:
      n_samples:
        type: "integer"
        description: "Number of samples generated (default 10)."
      temperature:
        type: "number"
        description: "Temperature used for sampling."
    required:
      - n_samples
      - temperature
required:
  - problem_id
  - entropy_value
  - num_clusters
  - exclusion_flag
