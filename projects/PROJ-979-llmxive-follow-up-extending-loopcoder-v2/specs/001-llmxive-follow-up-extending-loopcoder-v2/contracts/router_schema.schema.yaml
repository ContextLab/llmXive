$schema: "http://json-schema.org/draft-07/schema#"
title: "RouterPrediction"
description: "Schema for dynamic router predictions and metrics."
type: "object"
properties:
  problem_id:
    type: "string"
    description: "Unique identifier for the problem."
  predicted_k:
    type: "integer"
    description: "Predicted optimal loop count by the logistic regression model."
    enum:
      - 1
      - 2
      - 3
  probability_k1:
    type: "number"
    description: "Probability that k=1 is sufficient."
    minimum: 0
    maximum: 1
  flops_savings:
    type: "number"
    description: "Estimated FLOPs savings relative to a static k=2 baseline."
required:
  - problem_id
  - predicted_k
  - probability_k1
  - flops_savings
