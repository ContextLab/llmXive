$schema: "http://json-schema.org/draft-07/schema#"
title: "ConvergenceTrajectory Schema"
description: "Schema for convergence trajectory results generated by inference.py"
type: "object"
properties:
  problem_id:
    type: "string"
    description: "Unique identifier for the problem"
  loop_count:
    type: "integer"
    description: "Iteration count k"
    minimum: 1
  is_correct:
    type: "boolean"
    description: "Whether the output matches the reference solution"
  converged:
    type: "boolean"
    description: "True if this is the first correct output"
  censored:
    type: "boolean"
    description: "True if k=k_max and not converged"
required:
  - problem_id
  - loop_count
  - is_correct
  - converged
  - censored
additionalProperties: false