$schema: "http://json-schema.org/draft-07/schema#"
title: "EntropyProxy"
type: object
properties:
  problem_id:
    type: string
    description: "Unique identifier for the problem (e.g., 'HumanEval/0')."
  dataset:
    type: string
    description: "Source dataset name ('HumanEval' or 'MBPP')."
  entropy_value:
    type: number
    description: "Semantic entropy value (Shannon entropy)."
    minimum: 0
  num_clusters:
    type: integer
    description: "Number of unique semantic clusters found."
    minimum: 1
  num_samples:
    type: integer
    description: "A fixed number of samples will be generated."
    const: 10
  excluded:
    type: boolean
    description: "True if the sample was excluded due to undefined entropy."
required:
  - problem_id
  - dataset
  - entropy_value
  - num_clusters
  - num_samples
  - excluded
