$schema: "http://json-schema.org/draft-07/schema#"
title: "ConvergenceTrajectory"
type: object
properties:
  problem_id:
    type: string
    description: "Unique identifier for the problem."
  k:
    type: integer
    description: "Loop count (1, 2, 3, or 4)."
    enum: [1, 2, 3, 4]
  is_correct:
    type: boolean
    description: "Whether the generated code passed unit tests."
  converged_at:
    type: integer
    description: "First k where is_correct is true, or -1 if never."
  is_censored:
    type: boolean
    description: "True if converged_at is -1, indicating k > k_max."
  runtime_ms:
    type: number
    description: "Execution time in milliseconds."
    minimum: 0
required:
  - problem_id
  - k
  - is_correct
  - converged_at
  - is_censored
  - runtime_ms
