$schema: "http://json-schema.org/draft-07/schema#"
title: "Processed Alloy Dataset Schema"
type: "object"
properties:
  alloy_id:
    type: "string"
    description: "Unique identifier from BMG dataset"
  elements:
    type: "string"
    description: "Comma-separated element symbols (e.g., 'Fe,Cr,Ni')"
  compositions:
    type: "array"
    items:
      type: "number"
    description: "Atomic fractions [c1, c2, c3]"
  critical_cooling_rate:
    type: "number"
    description: "Target variable (K/s)"
  mixing_enthalpy:
    type: "number"
    description: "Mixing enthalpy (kJ/mol)"
  atomic_size_mismatch:
    type: "number"
    description: "Atomic size mismatch (dimensionless)"
  electronegativity_variance:
    type: "number"
    description: "Electronegativity variance (dimensionless)"
  source_label:
    type: "string"
    description: "Label from dataset (e.g., 'glass', 'crystal')"
required:
  - "alloy_id"
  - "elements"
  - "compositions"
  - "critical_cooling_rate"
  - "mixing_enthalpy"
  - "atomic_size_mismatch"
  - "electronegativity_variance"
  - "source_label"
additionalProperties: false