$schema: http://json-schema.org/draft-07/schema#
title: AlloyRecord
description: |
  Schema for a single alloy record in the glass-forming region dataset.
  Derived from the matsci/glass-forming-ability dataset and enriched with
  thermodynamic features computed via mendeleev.
type: object
required:
  - composition
  - critical_cooling_rate
  - mixing_enthalpy
  - atomic_size_mismatch
  - electronegativity_variance
  - source_label
properties:
  composition:
    type: object
    description: |
      Dictionary mapping element symbols to their atomic fraction in the alloy.
      Example: {"Fe": 0.6, "B": 0.3, "Si": 0.1}
      Keys are string element symbols (e.g., "Fe", "Cu").
      Values are floats between 0 and 1, summing to approximately 1.0.
    additionalProperties:
      type: number
      minimum: 0
      maximum: 1

  critical_cooling_rate:
    type: number
    description: |
      The critical cooling rate (K/s) required to form a glass.
      Derived directly from the 'critical_cooling_rate' column in the source dataset.
      Must be a positive number.
    minimum: 0

  mixing_enthalpy:
    type: number
    description: |
      The mixing enthalpy (kJ/mol) of the alloy.
      Computed from pairwise enthalpies of mixing and atomic fractions.
      Unit: kJ/mol.
    minimum: -1000
    maximum: 1000

  atomic_size_mismatch:
    type: number
    description: |
      The atomic size mismatch parameter (delta), representing the variance in atomic radii.
      Computed as the standard deviation of atomic radii weighted by composition.
      Unit: dimensionless (often expressed as a percentage in literature, but stored as fraction here).
    minimum: 0
    maximum: 1

  electronegativity_variance:
    type: number
    description: |
      The variance of electronegativity values across the alloy components.
      Computed as the weighted variance of Pauling electronegativity values.
      Unit: dimensionless (Pauling scale).
    minimum: 0
    maximum: 10

  source_label:
    type: string
    description: |
      The source label derived from the dataset metadata.
      Indicates the origin of the specific data point (e.g., "matsci-glass-ability-v1").
      Used for tracking data provenance.
    minLength: 1

  # Optional metadata fields for debugging and traceability
  elements:
    type: array
    description: List of unique element symbols present in the alloy.
    items:
      type: string
    minItems: 3
    maxItems: 3

  n_ternary:
    type: boolean
    description: True if the alloy is strictly ternary (3 elements).
    default: true