title: AlloyRecord Schema
description: |
  Schema for a single alloy record derived from the glass-forming ability dataset.
  Includes raw composition data, target variable, and computed thermodynamic features.
type: object
required:
  - composition
  - critical_cooling_rate
  - mixing_enthalpy
  - atomic_size_mismatch
  - electronegativity_variance
  - source_label
properties:
  composition:
    type: object
    description: |
      Mapping of element symbols to their atomic fractions in the alloy.
      Example: {"Fe": 0.6, "B": 0.3, "Si": 0.1}
      Keys are element symbols (string), values are atomic fractions (float).
      Sum of values should be approximately 1.0.
    additionalProperties:
      type: number
      minimum: 0.0
      maximum: 1.0

  critical_cooling_rate:
    type: number
    description: |
      The critical cooling rate (CCR) in K/s required to form a glass.
      Derived from the 'critical_cooling_rate' column in the source dataset.
      Lower values indicate better glass formers.
    minimum: 0.0

  mixing_enthalpy:
    type: number
    description: |
      The enthalpy of mixing (ΔH_mix) in kJ/mol.
      Computed using the composition-weighted sum of binary pair enthalpies
      from the Miedema model or similar (via mendeleev/external tables).
      Negative values generally favor glass formation.
    unit: kJ/mol

  atomic_size_mismatch:
    type: number
    description: |
      The atomic size mismatch parameter (δ) in percent (%).
      Computed as the standard deviation of atomic radii weighted by composition.
      Higher values (>5-10%) generally favor glass formation by hindering crystallization.
    unit: percent

  electronegativity_variance:
    type: number
    description: |
      The variance of electronegativity values in the alloy.
      Computed as the composition-weighted variance of Pauling electronegativities.
      Moderate values often correlate with stability.
    unit: (Pauling scale)^2

  source_label:
    type: string
    description: |
      Label indicating the source or quality of the data point.
      Derived from dataset metadata (e.g., 'experimental', 'high_throughput', 'review').
      Used for filtering or stratification if necessary.
    enum:
      - experimental
      - computational
      - review
      - unknown

examples:
  - composition:
      Fe: 0.55
      B: 0.25
      Si: 0.20
    critical_cooling_rate: 10.5
    mixing_enthalpy: -12.4
    atomic_size_mismatch: 6.8
    electronegativity_variance: 0.045
    source_label: experimental

additionalProperties: false