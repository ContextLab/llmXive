# Model Output Schema Definitions
# This file defines the JSON/YAML structures for model evaluation outputs.
# Used by code/train.py and code/analyze.py to validate generated artifacts.

ModelMetrics:
  description: "Aggregated metrics from model training and cross-validation"
  type: object
  required:
    - model_type
    - random_state
    - n_folds
    - fold_scores
    - mean_rmse
    - std_rmse
    - test_rmse
    - test_r2
    - timestamp
  properties:
    model_type:
      type: string
      description: "Name of the model algorithm (e.g., 'RandomForestRegressor')"
    random_state:
      type: integer
      description: "Random seed used for reproducibility"
    n_folds:
      type: integer
      description: "Number of cross-validation folds"
    fold_scores:
      type: array
      items:
        type: number
      description: "RMSE scores for each cross-validation fold"
    mean_rmse:
      type: number
      description: "Mean RMSE across all cross-validation folds"
    std_rmse:
      type: number
      description: "Standard deviation of RMSE across folds"
    test_rmse:
      type: number
      description: "RMSE on the held-out test set"
    test_r2:
      type: number
      description: "R-squared coefficient on the held-out test set"
    null_model_rmse:
      type: number
      description: "RMSE of the null model (DummyRegressor mean strategy)"
    p_value:
      type: number
      description: "P-value from t-test comparing RF model vs null model"
    is_significant:
      type: boolean
      description: "True if p-value < 0.05"
    timestamp:
      type: string
      format: date-time
      description: "ISO 8601 timestamp of when metrics were generated"
    feature_names:
      type: array
      items:
        type: string
      description: "List of feature names used in the model"

SensitivityReport:
  description: "Performance metrics across different critical cooling rate thresholds"
  type: object
  required:
    - model_type
    - thresholds
    - results
    - timestamp
  properties:
    model_type:
      type: string
      description: "Name of the model algorithm"
    thresholds:
      type: array
      items:
        type: integer
      description: "List of critical cooling rate thresholds (K/s) evaluated"
    results:
      type: array
      items:
        type: object
        required:
          - threshold
          - metric_type
          - value
          - variance_check
        properties:
          threshold:
            type: integer
            description: "The critical cooling rate threshold (K/s)"
          metric_type:
            type: string
            enum:
              - RMSE
              - F1
            description: "Type of metric calculated (RMSE for continuous, F1 for binarized)"
          value:
            type: number
            description: "The calculated metric value"
          variance_check:
            type: object
            required:
              - passed
              - threshold_variance
            properties:
              passed:
                type: boolean
                description: "True if variance across relevant samples is < 10%"
              threshold_variance:
                type: number
                description: "The calculated variance percentage"
          sample_size:
            type: integer
            description: "Number of samples used for this threshold calculation"
    timestamp:
      type: string
      format: date-time
      description: "ISO 8601 timestamp of when the report was generated"
    stability_verified:
      type: boolean
      description: "True if the model stability test (RMSE difference < 5%) passed"
    collinearity_flagged:
      type: boolean
      description: "True if any feature pairs had correlation > 0.8"