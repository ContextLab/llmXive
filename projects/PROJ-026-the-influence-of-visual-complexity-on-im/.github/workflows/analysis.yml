name: Analysis Pipeline CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('code/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r code/requirements.txt
        pip install pytest

    - name: Run Analysis Pipeline
      id: run_pipeline
      run: |
        cd code
        # Run the main pipeline script
        # Using --null-effect for CI to ensure deterministic, fast execution without external data dependencies
        # The script must complete successfully and write outputs to data/
        start_time=$(date +%s)
        python main.py --null-effect
        end_time=$(date +%s)
        duration=$((end_time - start_time))
        echo "pipeline_duration=$duration" >> $GITHUB_OUTPUT

    - name: Assert Duration < 6 Hours
      run: |
        duration=${{ steps.run_pipeline.outputs.pipeline_duration }}
        max_duration=21600 # 6 hours in seconds
        if [ "$duration" -gt "$max_duration" ]; then
          echo "ERROR: Pipeline took ${duration}s, exceeding the 6h (21600s) limit."
          exit 1
        else
          echo "SUCCESS: Pipeline completed in ${duration}s (limit: ${max_duration}s)."
        fi

    - name: Verify Output Artifacts
      run: |
        # Verify that the pipeline produced the required output files
        # These paths match the project specification
        required_files=(
          "data/processed/complexity_scores.csv"
          "data/processed/aggregated_d_scores.csv"
          "data/processed/counterbalance_assignment.csv"
          "data/results/permutation_results.json"
          "data/results/sensitivity_results.json"
          "figures/analysis_plot.png"
        )

        missing=false
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "Missing required artifact: $file"
            missing=true
          else
            echo "Found artifact: $file"
          fi
        done

        if [ "$missing" = true ]; then
          echo "ERROR: One or more required output files are missing."
          exit 1
        fi

    - name: Upload Results Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: analysis-results
        path: |
          data/results/
          figures/
        retention-days: 30