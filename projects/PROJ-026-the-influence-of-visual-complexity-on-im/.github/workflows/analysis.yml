name: Analysis Pipeline CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# SC-005: Explicitly enforce CPU-only runner
# Using ubuntu-latest which provides CPU-only execution environment
# No GPU acceleration available or required for this statistical analysis pipeline

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    # Enforce 6-hour duration limit as per task requirement
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt
          # Ensure pytest is available for any tests that might be run
          pip install pytest

      - name: Verify project structure
        run: |
          # Check that required directories exist (T001 verification)
          test -d code/data || exit 1
          test -d code/stimuli || exit 1
          test -d code/analysis || exit 1
          test -d code/viz || exit 1
          test -d data/raw/stimuli || exit 1
          test -d data/raw/responses || exit 1
          test -d data/processed || exit 1
          test -d data/results || exit 1
          test -d docs || exit 1
          echo "Project structure verified"

      - name: Run main analysis pipeline
        run: |
          # Run the pipeline in null-effect mode for CI testing
          # This ensures the pipeline executes without requiring real external data
          # Real data runs would require manual trigger with appropriate data mounted
          python code/main.py --null-effect --skip-stimuli
          
          # Verify output files were created
          test -f data/processed/counterbalance_assignment.csv || exit 1
          test -f data/results/permutation_results.json || exit 1
          test -f data/results/sensitivity_results.json || exit 1
          echo "Pipeline completed successfully with expected outputs"

      - name: Verify code quality
        run: |
          # Run basic linting if ruff is available (from requirements.txt)
          if command -v ruff &> /dev/null; then
            ruff check code/ || true
          fi
          echo "Code quality checks completed"

      - name: Upload results artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: |
            data/processed/*.csv
            data/results/*.json
            data/results/*.png
          retention-days: 7