name: Analysis Pipeline CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours limit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt
          pip install pytest

      - name: Run Unit Tests
        working-directory: code
        run: |
          pytest tests/ -v

      - name: Run Full Analysis Pipeline
        working-directory: code
        run: |
          # Run the main pipeline script.
          # We use the --null-effect flag to generate synthetic data for CI
          # to ensure the pipeline runs without needing external real data downloads,
          # while still exercising the full code path (processing, analysis, plotting).
          python main.py --null-effect

      - name: Verify Outputs
        working-directory: code
        run: |
          # Assert that expected output files were created
          test -f ../data/processed/complexity_scores.csv
          test -f ../data/processed/aggregated_d_scores.csv
          test -f ../data/results/permutation_results.json
          test -f ../data/results/sensitivity_results.json
          test -f ../figures/boxplot_d_scores.png
          test -f ../figures/sensitivity_analysis.png
          echo "All expected output files verified."

      - name: Upload Results Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: |
            data/
            figures/
            logs/