$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Results Schema"
description: "Schema for the CSV output of statistical analysis results."
type: "object"
required: ["pair", "metric_type", "r_value", "p_value", "confidence_interval"]
properties:
  pair:
    type: "string"
    description: "Performance variable pair analyzed."
    enum: ["PCE_Jsc", "PCE_VVoc", "Jsc_Voc"]
  metric_type:
    type: "string"
    description: "Statistical method"
    enum: "t"
  enum:
    ...
...
