$schema: "http://json-schema.org/draft-07/schema#"
title: "Unified Dataset Schema"
description: "Schema for the unified CSV containing performance metrics and optional spatial metrics."
type: "object"
required: ["sample_id", "pce", "j_sc", "v_oc"]
properties:
  sample_id:
    type: "string"
    description: "Unique identifier for the sample."
  element:
    type: ["string", "null"]
    description: "Element type for the map (optional; null when no map)."
    enum: ["Pb", "I", "MA", null]
  pce:
    type: "number"
    description: "Power Conversion Efficiency (%)."
    minimum: 0
    maximum: 50
  j_sc:
    type: "number"
    description: "Short‑circuit current density (mA cm⁻²)."
  v_oc:
    type: "number"
    description: "Open‑circuit voltage (V)."
  correlation_length_exp:
    type: ["number", "null"]
    description: "1/e decay distance (nm) from exponential fit."
  correlation_length_gauss:
    type: ["number", "null"]
    description: "1/e decay distance (nm) from Gaussian fit."
  correlation_length_power:
    type: ["number", "null"]
    description: "1/e decay distance (nm) from Hug‑S??"
  low_freq_spectral_power:
    type: ["number", "null"]
    description: "Integrated low‑frequency spectral power (0‑0.1 cycles/pixel)."
  composite_spatial_metric:
    type: ["number", "null"]
    description: "Primary composite spatial ordering metric (average of normalized lengths)."
  mask_percentage:
    type: ["number", "null"]
    description: "Fraction of pixels masked due to defects."
  # Additional covariates (optional) are stored separately but referenced
  temperature:
    type: ["number", "null"]
    description: "Processing temperature (°C)."
  stoichiometry:
    type: ["string", "null"]
    description: "Stoichiometric ratio (e.g., \"\"      \"  "  )."
  **


