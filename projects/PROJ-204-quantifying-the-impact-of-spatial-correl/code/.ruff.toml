# Ruff Configuration for llmXive Project
# Linter and Formatter settings

[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
  "E501", # Line too long (handled by Black)
  "F403", # 'from module import *' used; unable to detect undefined names
]

# Allow autofix for all enabled rules (if applicable)
fixable = ["ALL"]
unfixable = []

# Exclude a few files/directories
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]

per-file-ignores = {}

# Same as Black
line-length = 88

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.isort]
force-single-line = false
force-sort-within-sections = false
known-first-party = ["utils", "data", "preprocess", "analysis", "modeling", "validation", "report"]
force-to-top = []
relative-imports-order = "closest-to-furthest"