[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-opid-routing"
version = "0.1.0"
description = "OPID Critical-First Routing Complexity Analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "llmXive Team"}
]
dependencies = [
    "networkx==3.2.1",
    "numpy==1.26.4",
    "pandas==2.2.1",
    "scipy==1.13.0",
    "pytest==8.1.1",
    "ruff==0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*", "tests*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["code", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.isort]
profile = "black"
line_length = 88