[project]
name = "llmxive-follow-up-extending-opid-on-poli"
version = "0.1.0"
description = "OPID Critical-First Routing Complexity Analysis"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\\.pyi?$'
extend-exclude = '''
/(
    # The following are specific to Black, you probably don't want those.
    build
    | dist
    | .eggs
    | .venv
    | venv
    | __pycache__
)/
'''