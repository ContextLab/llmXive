$schema: "http://json-schema.org/draft-07/schema#"
title: "StateGraph Environment"
description: "Schema for synthetic state-graph environments generated by NetworkX."
type: "object"
required:
  - "metadata"
  - "nodes"
  - "edges"
  - "path"
properties:
  metadata:
    type: "object"
    required:
      - "tier"
      - "seed"
      - "node_count"
      - "path_length"
    properties:
      tier:
        type: "integer"
        enum: [1, 2, 3]
        description: "Complexity tier (1: Deterministic, 2: Stochastic, 3: High-Entropy)"
      seed:
        type: "integer"
        description: "Random seed used for generation"
      node_count:
        type: "integer"
        minimum: 5
        description: "Total number of nodes in the graph"
      path_length:
        type: "integer"
        description: "Length of the ground-truth path"
  nodes:
    type: "array"
    items:
      type: "object"
      required:
        - "id"
        - "attributes"
      properties:
        id:
          type: "string"
          description: "Unique node identifier"
        attributes:
          type: "object"
          properties:
            is_start:
              type: "boolean"
            is_goal:
              type: "boolean"
            reward:
              type: "number"
  edges:
    type: "array"
    items:
      type: "object"
      required:
        - "source"
        - "target"
        - "probability"
      properties:
        source:
          type: "string"
        target:
          type: "string"
        probability:
          type: "number"
          minimum: 0.0
          maximum: 1.0
          description: "Transition probability (1.0 for deterministic)"
  path:
    type: "array"
    items:
      type: "string"
    description: "Ground-truth path from start to goal"