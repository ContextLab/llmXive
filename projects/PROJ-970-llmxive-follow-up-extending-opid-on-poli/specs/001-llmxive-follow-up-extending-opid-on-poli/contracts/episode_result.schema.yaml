$schema: "http://json-schema.org/draft-07/schema#"
title: "EpisodeResult"
description: "Schema for a single simulation episode result in the OPID routing study."
type: "object"
properties:
  episode_id:
    type: "string"
    description: "Unique identifier for the episode (graph_id_threshold_episode_num)."
  graph_id:
    type: "string"
    description: "Foreign key reference to the StateGraph."
  tier:
    type: "integer"
    description: "Complexity tier (1, 2, or 3)."
    minimum: 1
    maximum: 3
  threshold:
    type: "number"
    description: "Routing threshold used (0.0 to 1.0)."
    minimum: 0.0
    maximum: 1.0
  success:
    type: "boolean"
    description: "Whether the agent reached the goal."
  steps_taken:
    type: "integer"
    description: "Number of steps taken to reach goal or max limit."
    minimum: 1
  action_entropy_mean:
    type: "number"
    description: "Mean action entropy over the episode."
    minimum: 0.0
  action_entropy_variance:
    type: "number"
    description: "Raw variance of action entropy over the episode."
    minimum: 0.0
  log_prob_shift:
    type: "number"
    description: "Average log-probability shift from skill injection."
  timestamp:
    type: "string"
    description: "ISO 8601 timestamp of the run."
    format: "date-time"
required:
  - episode_id
  - graph_id
  - tier
  - threshold
  - success
  - steps_taken
  - action_entropy_mean
  - action_entropy_variance
  - log_prob_shift
  - timestamp
additionalProperties: false