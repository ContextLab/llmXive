$schema: "http://json-schema.org/draft-07/schema#"
title: "Episode Result"
description: "Schema for a single simulation episode result."
type: "object"
required:
  - "episode_id"
  - "tier"
  - "threshold"
  - "success"
  - "steps"
  - "action_entropy_variance"
  - "log_prob_shift"
  - "injection_count"
  - "conditional_entropy_variance"
properties:
  episode_id:
    type: "string"
    format: "uuid"
    description: "Unique identifier for the episode"
  tier:
    type: "integer"
    enum: [1, 2, 3]
  threshold:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Routing threshold used (0.0 to 1.0)"
  success:
    type: "boolean"
    description: "True if the agent traversed the ground-truth path"
  steps:
    type: "integer"
    minimum: 0
  action_entropy_variance:
    type: "number"
    description: "Variance of action entropies during the episode"
  log_prob_shift:
    type: "number"
    description: "Cumulative log-probability shift due to skill injection"
  injection_count:
    type: "integer"
    minimum: 0
    description: "Number of times a skill signal was injected"
  conditional_entropy_variance:
    type: "number"
    description: "Variance of action entropy conditional on injection status"