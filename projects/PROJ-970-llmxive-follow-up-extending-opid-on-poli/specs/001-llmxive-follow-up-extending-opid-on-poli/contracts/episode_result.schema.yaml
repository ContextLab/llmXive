$schema: "http://json-schema.org/draft-07/schema#"
title: EpisodeResult
description: "Schema for a single episode result record in the OPID routing analysis."
type: object
required:
  - episode_id
  - graph_id
  - tier
  - threshold
  - success
  - steps_taken
  - action_entropy
  - log_prob_shift
  - timestamp
properties:
  episode_id:
    type: string
    description: "Unique identifier for the episode."
    pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$"
  graph_id:
    type: string
    description: "Reference to the graph used."
    pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$"
  tier:
    type: string
    description: "Complexity tier of the environment."
    enum:
      - "Tier 1"
      - "Tier 2"
      - "Tier 3"
  threshold:
    type: number
    description: "Routing threshold used (0.0 to 1.0)."
    minimum: 0.0
    maximum: 1.0
  success:
    type: boolean
    description: "Whether the agent reached the goal."
  steps_taken:
    type: integer
    description: "Number of steps to complete."
    minimum: 1
  action_entropy:
    type: number
    description: "Mean action entropy for the episode."
    minimum: 0.0
  log_prob_shift:
    type: number
    description: "Mean log-probability shift (advantage)."
  timestamp:
    type: string
    description: "ISO 8601 timestamp of completion."
    format: date-time
additionalProperties: false