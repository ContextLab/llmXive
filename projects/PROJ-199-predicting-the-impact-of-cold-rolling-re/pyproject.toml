[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-project"
version = "0.1.0"
description = "Predicting the Impact of Cold Rolling Reduction on Texture Evolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "orix",
    "scikit-learn",
    "shap",
    "pandas",
    "numpy",
    "pyyaml",
    "requests",
    "pytest",
    "pydantic",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | docs
    | \.eggs
    | \.ipynb_checkpoints
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["analysis", "config", "data", "features", "models", "utils", "setup_linting"]
known_third_party = ["orix", "sklearn", "shap", "pandas", "numpy", "yaml", "requests", "pytest", "pydantic"]
skip = ["data", "docs", ".eggs", "build", "dist"]
