[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-project"
version = "0.1.0"
description = "Automated science pipeline for predicting cold rolling impact on texture evolution"
requires-python = ">=3.9"
dependencies = [
    "orix",
    "scikit-learn",
    "shap",
    "pandas",
    "numpy",
    "pyyaml",
    "requests",
    "pytest",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "black",
    "pre-commit",
    "isort",
    "pytest",
    "pytest-cov",
]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = "\\.pyi?$"
exclude = '''
    (
        \.git
        | \.hg
        | \.mypy_cache
        | \.tox
        | \.venv
        | _build
        | buck-out
        | build
        | dist
        | \.eggs
        | \.egg-info
    )/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_glob = [
    "*/.git/*",
    "*/__pycache__/*",
    "*/.eggs/*",
    "*/build/*",
    "*/dist/*",
    "*/.venv/*",
]