$schema: "http://json-schema.org/draft-07/schema#"
title: "ValidationReport"
description: "Schema for the data validation report generated by code/utils/validation.py"
type: object
properties:
  total_images:
    type: integer
    description: "Total number of image files found in the dataset"
  valid_pairs:
    type: integer
    description: "Number of image-metadata pairs that passed all checks"
  invalid_pairs:
    type: integer
    description: "Number of image-metadata pairs that failed validation"
  invalid_ratio:
    type: number
    description: "Ratio of invalid pairs (invalid_pairs / total_images)"
    minimum: 0
    maximum: 1
  status:
    type: string
    enum:
      - PASS
      - FAIL
    description: "Overall validation status. FAIL if invalid_ratio > 0.01"
  errors:
    type: array
    items:
      type: string
    description: "List of specific error messages encountered during validation"
required:
  - total_images
  - valid_pairs
  - invalid_pairs
  - invalid_ratio
  - status
  - errors
