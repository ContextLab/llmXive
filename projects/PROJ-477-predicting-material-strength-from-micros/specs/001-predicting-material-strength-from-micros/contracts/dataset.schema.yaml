$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Manifest Schema"
description: "Schema for the manifest file mapping image filenames to yield strength values and metadata, including specimen ID for leakage prevention."
type: "object"
properties:
  metadata:
    type: "object"
    properties:
      version:
        type: "string"
        description: "Version of the dataset processing pipeline."
      source_type:
        type: "string"
        description: "Type of data source (e.g., 'synthetic_voronoi_hall_petch')."
      checksum:
        type: "string"
        description: "SHA-256 checksum of the raw dataset file."
      total_samples:
        type: "integer"
        description: "Total number of samples in the dataset."
    required:
      - version
      - source_type
      - checksum
      - total_samples
  samples:
    type: "array"
    items:
      type: "object"
      properties:
        image_id:
          type: "string"
          description: "Unique identifier for the image."
        specimen_id:
          type: "string"
          description: "Unique identifier for the parent specimen (used for splitting)."
        image_path:
          type: "string"
          description: "Relative path to the image file."
        yield_strength:
          type: "number"
          description: "Yield strength in MPa (inherited from specimen)."
        split:
          type: "string"
          enum:
            - train
            - validation
            - test
          description: "Data split assignment."
        width:
          type: "integer"
          description: "Image width in pixels."
        height:
          type: "integer"
          description: "Image height in pixels."
        grain_size:
          type: "number"
          description: "Average grain size for this image."
      required:
        - image_id
        - specimen_id
        - image_path
        - yield_strength
        - split
required:
  - metadata
  - samples