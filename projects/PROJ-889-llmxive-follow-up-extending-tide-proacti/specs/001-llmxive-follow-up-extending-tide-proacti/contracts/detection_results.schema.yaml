$schema: "http://json-schema.org/draft-07/schema#"
title: "Detection Results & Feature Record Schema"
type: object
required:
  - instance_id
  - pipeline
  - origin
  - prediction
  - latency_ms
  - dependency_depth
  - semantic_scope
  - syntactic_complexity
  - ast_depth
  - import_count
  - cyclomatic_complexity
  - sha256
properties:
  instance_id:
    type: string
    description: "Unique identifier for the CodeInstance (e.g., 'real-001' or 'synthetic-042')."
  pipeline:
    type: string
    enum: ["tide_lite", "tide_original"]
    description: "Which pipeline produced the row?"
  origin:
    type: string
    enum: ["real", "synthetic"]
    description: "Origin of the source code instance."
  prediction:
    type: boolean
    description: "Binary outcome of the pipeline (True = positive)."
  latency_ms:
    type: number
    description: "Execution latency in milliseconds."
  dependency_depth:
    type: integer
    minimum: 0
    maximum: 5
    description: "Number of depth levels  ---  …  "
  semantic_scope:
    type: string
    enum: ["local", "cross_module"
    ]
  semantic_scope:
    "???"
    description: "Invalid  "
  syntactic_complexity:
    type: integer
    description: "Complexity  "
  syntactic_complexity:
    type: integer 
    maximum: 9999
  ast_path:
    type: ... 
    ...
  # ... ... ... 
  placeholder ... 
EOF