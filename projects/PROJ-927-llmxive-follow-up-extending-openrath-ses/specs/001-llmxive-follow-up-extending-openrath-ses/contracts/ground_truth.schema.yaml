$schema: "http://json-schema.org/draft-07/schema#"
title: "Ground Truth"
description: "Immutable record of the correct final state and decision path."
type: object
required:
  - workflow_id
  - final_state
  - decision_path
  - tool_outputs
properties:
  workflow_id:
    type: string
    description: "Matches the workflow_id in the definition."
  final_state:
    type: object
    description: "The exact final state of the system (variables, code, etc.)."
    additionalProperties: true
  decision_path:
    type: array
    description: "Ordered list of node_ids executed."
    items:
      type: string
  tool_outputs:
    type: object
    description: "Map of node_id to the exact output of the tool call."
    additionalProperties:
      type: object
      additionalProperties: true
additionalProperties: false