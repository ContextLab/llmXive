[project]
name = "llmxive-follow-up-extending-openrath-ses"
version = "0.1.0"
description = "Session-Centered Runtime State for Agent Systems - llmXive Follow-up"
requires-python = ">=3.11"
dependencies = [
    "pytest==7.4.0",
    "scipy==1.11.0",
    "pandas==2.1.0",
    "numpy==1.24.0",
    "pyyaml==6.0.1",
    "jsonschema==4.19.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"