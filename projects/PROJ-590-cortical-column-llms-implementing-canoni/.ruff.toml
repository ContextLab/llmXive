# Ruff configuration for cortical column LLM project
line-length = 88
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "B008", # Do not perform function call in argument defaults (common in PyTorch)
]

[lint.per-file-ignores]
"tests/*" = ["ARG", "S101"] # Allow unused args and assertions in tests
"scripts/*" = ["T201"]       # Allow print in scripts

[lint.isort]
known-first-party = ["src", "tests"]
force-sort-within-sections = true
