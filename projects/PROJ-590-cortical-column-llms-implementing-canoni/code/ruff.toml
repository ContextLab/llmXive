[lint]
# Enable strict linting rules for the Cortical Column LLM project
# Following project standards for scientific code quality
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "S",    # flake8-bandit (security)
  "T20",  # flake8-print (no print statements)
  "RUF",  # Ruff-specific rules
  "NPY",  # NumPy-specific rules
]

ignore = [
  "E501",  # Line too long (handled by formatter)
  "S101",  # Use of assert detected (assertions are allowed in tests)
  "NPY002", # Replace legacy np.random.* call (using torch for ML)
]

# Per-file ignores
[lint.per-file-ignores]
"tests/*" = [
  "S101", # Allow assertions in tests
  "T201", # Allow print in tests for debugging
]
"scripts/*" = [
  "T201", # Allow print in scripts for logging
]

# Maximum line length (formatter handles this, but good to have as reference)
line-length = 100

# Target Python version
target-version = "py311"

[lint.isort]
# Configuration for import sorting
known-first-party = ["src", "scripts", "tests"]
force-sort-within-sections = true
case-sensitive = true
lines-after-imports = 2

[lint.flake8-bugbear]
# Extend bugbear rules
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[format]
# Use spaces for indentation
indent-style = "space"
quote-style = "double"
line-ending = "auto"

[lint.pydocstyle]
convention = "google"