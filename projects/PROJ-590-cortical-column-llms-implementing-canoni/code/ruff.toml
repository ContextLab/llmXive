[lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "ARG",    # flake8-unused-arguments
  "SIM",    # flake8-simplify
  "TCH",    # flake8-type-checking
  "RUF",    # Ruff-specific rules
]
ignore = [
  "E501",   # Line too long (handled by formatter)
  "B904",   # Within an except clause, raise exceptions with raise ... from ... (sometimes verbose for simple re-raises)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude a few files/directories
extend-exclude = [
  "__pycache__",
  "*.pyc",
  ".venv",
  "venv",
  ".git",
  "data",
  "state",
]

# Per-file ignores
per-file-ignores = {}

# Dummy variable names (e.g., for unused arguments)
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Target Python version
target-version = "py311"

# Rule specific configurations
[lint.pyupgrade]
keep-runtime-typing = true

[lint.isort]
known-first-party = ["src", "scripts", "tests"]
known-third-party = ["torch", "numpy", "scipy", "pytest", "psutil", "matplotlib", "yaml"]
force-sort-within-sections = true
lines-after-imports = 2
combine-as-imports = true

[lint.flake8-unused-arguments]
ignore-variadic-names = true

[lint.flake8-bugbear]
extend-immutable-calls = ["torch.jit.script", "torch.jit.trace"]

[lint.mccabe]
max-complexity = 15

[lint.pep8-naming]
classmethod-decorators = ["classmethod", "torch.no_grad"]

[lint]
# Preview mode for stricter rules
preview = true
