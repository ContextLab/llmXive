[ruff]
# Target Python 3.11 as per project setup (T002)
target-version = "py311"

# Exclude generated or third-party directories
exclude = [
    ".git",
    "__pycache__",
    "data/",
    "state/",
    "venv",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

# Line length consistent with project standards
line-length = 100

# Allow unused variables for specific test cases or unused imports in __init__.py
# but enforce strict rules elsewhere.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[ruff.lint]
# Enable strict rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
    "NPY", # NumPy specific rules
    "PERF",# Performance antipatterns
    "SIM", # Simplification
]

# Ignore specific rules that might be too strict for research code
# e.g., E501 (line too long) is handled by line-length setting, 
# but we might want to ignore specific false positives if needed.
ignore = [
    "E501", # Line too long (handled by line-length config)
    "B904", # Within an `except` clause, raise exceptions with `raise ... from err`
    "UP007", # Use `X | Y` for type annotations (compatibility with older Pydantic/typing if needed)
]

# Specific configuration for flake8-bugbear
[ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
]

# Configuration for isort
[ruff.lint.isort]
known-first-party = ["src", "tests", "scripts", "setup_environment", "setup_project"]
known-third-party = [
    "torch",
    "numpy",
    "scipy",
    "pytest",
    "psutil",
    "yaml",
    "matplotlib",
    "pandas",
]
force-single-line = true
lines-after-imports = 2

# Configuration for Pyflakes
[ruff.lint.pyflakes]
extend-generics = []

# Per-file ignores (e.g., for __init__.py or specific test files)
[ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"] # Allow assert in tests
"src/**/*.py" = ["E402"]   # Allow imports after docstrings if necessary
"scripts/**/*.py" = ["T201"] # Allow print in scripts

[ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[ruff.lint.mccabe]
max-complexity = 15 # Slightly relaxed for complex research logic, but still enforced