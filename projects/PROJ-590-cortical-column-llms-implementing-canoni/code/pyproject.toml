[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortical-column-llms"
version = "0.1.0"
description = "Implementing Canonical Microcircuits for Universal Computation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pytest>=7.3.0",
    "psutil>=5.9.0",
    "ruff>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest-timeout>=2.2.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | state
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src", "tests", "scripts", "setup_environment", "setup_project"]
known_third_party = ["torch", "numpy", "scipy", "pytest", "psutil"]
skip = ["data", "state"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
timeout = 300
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]