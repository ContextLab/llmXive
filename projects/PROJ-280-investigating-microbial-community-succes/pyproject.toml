[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investigating-microbial-community-succes"
version = "0.1.0"
description = "Automated science pipeline for investigating microbial community succession in constructed wetlands"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.0.3",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-bio>=0.5.8",
    "networkx>=3.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.2.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.setuptools]
packages = ["code"]