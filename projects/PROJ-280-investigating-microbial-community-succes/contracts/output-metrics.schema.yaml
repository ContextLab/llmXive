$schema: http://json-schema.org/draft-07/schema#
title: Output Metrics Schema
description: Schema for network and correlation analysis outputs in microbial succession study.
type: object
definitions:
  taxon_correlation:
    type: object
    properties:
      taxon:
        type: string
        description: Taxon identifier
      correlation:
        type: number
        description: Correlation coefficient (e.g., Spearman's rho)
      p_value:
        type: number
        description: P-value of the correlation test
      vif:
        type: number
        description: Variance Inflation Factor (if applicable)
        minimum: 1.0
      ecological_flag:
        type: string
        enum: ["statistically_significant_but_weak", "strong", "none"]
        description: Flag for ecological significance
    required:
      - taxon
      - correlation
      - p_value
properties:
  network_analysis:
    type: object
    description: Network analysis results including modularity and graph stats.
    properties:
      metadata:
        type: object
        properties:
          total_taxa:
            type: integer
          total_edges:
            type: integer
          threshold_applied:
            type: number
          early_stage_modularity:
            type: number
          mature_stage_modularity:
            type: number
          delta_modularity:
            type: number
          under_determined_flag:
            type: boolean
            description: True if n_samples < n_taxa
        required:
          - total_taxa
          - total_edges
          - threshold_applied
      nodes:
        type: array
        items:
          type: string
      edges:
        type: array
        items:
          type: object
          properties:
            source:
              type: string
            target:
              type: string
            correlation:
              type: number
            p_value:
              type: number
            weight:
              type: number
          required:
            - source
            - target
            - correlation
            - p_value
    required:
      - metadata
      - nodes
      - edges
  correlation_results:
    type: object
    description: Taxon-nutrient correlation results.
    properties:
      total_correlations_calculated:
        type: integer
      significant_correlations_count:
        type: integer
      thresholds:
        type: object
        properties:
          abs_r:
            type: number
          p_value:
            type: number
        required:
          - abs_r
          - p_value
      results:
        type: array
        items:
          $ref: "#/definitions/taxon_correlation"
      cross_validation:
        type: object
        properties:
          method:
            type: string
            enum: ["k-fold", "LOO"]
          k:
            type: integer
          mean_r_squared:
            type: number
          std_r_squared:
            type: number
    required:
      - total_correlations_calculated
      - significant_correlations_count
      - thresholds
      - results
required:
  - network_analysis
  - correlation_results
