$schema: "http://json-schema.org/draft-07/schema#"
title: "CRE Schema"
description: "Schema for cis-regulatory element (CRE) data."
type: "object"
properties:
  cre_id:
    type: "string"
    description: "Unique identifier for the CRE."
  chromosome:
    type: "string"
    description: "Chromosome name."
  start:
    type: "integer"
    description: "Start position (0-based)."
  end:
    type: "integer"
    description: "End position."
  strand:
    type: "string"
    enum: ["+", "-"]
    description: "Strand orientation."
  tf:
    type: "string"
    description: "Associated transcription factor(s) (comma-separated)."
  context:
    type: "string"
    enum: ["promoter", "distal"]
    description: "Genomic context."
  peak_signal_control:
    type: "number"
    description: "Normalized RPKM in control condition."
  peak_signal_stress:
    type: "number"
    description: "Normalized RPKM in stress condition."
  delta_peak_signal:
    type: "number"
    description: "Difference in peak signal between stress and control."
  motif_p_value:
    type: "number"
    description: "PWM p-value for motif match (if distal)."
  hic_contact_frequency:
    type: "integer"
    description: "Hi-C contact frequency (if distal)."
  validation_flag:
    type: "string"
    enum: ["valid", "invalid"]
    description: "Validation status (FR-014)."
  collinearity_flag:
    type: "string"
    enum: ["collinear", "ok"]
    description: "Collinearity status (FR-012)."
  weight:
    type: "number"
    description: "Log-transformed motif score or Hi-C frequency (if valid)."
required:
  - cre_id
  - chromosome
  - start
  - end
  - strand
  - tf
  - context
  - peak_signal_control
  - peak_signal_stress
  - delta_peak_signal
  - validation_flag
  - collinearity_flag
additionalProperties: false