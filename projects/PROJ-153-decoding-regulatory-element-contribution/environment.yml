name: yeast-cre-analysis
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core Python environment
  - python=3.10
  - pip
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - pyyaml
  - requests
  - biopython
  
  # Bioinformatics Tools (via Bioconda)
  - fastp
  - bowtie2
  - samtools
  - bedtools
  - deeptools
  - macs3
  
  # R Environment
  - r-base=4.3
  - r-essentials
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-data.table
  - r-biobase
  - r-genomicranges
  - r-lme4
  - r-glmmTMB
  - r-car
  - r-multcomp
  - r-pheatmap
  - r-knitr
  - r-rmarkdown
  - bioconductor-biostrings
  - bioconductor-rsamtools
  - bioconductor-chipseeker
  - bioconductor-annotatr
  
  # System dependencies often needed for bio tools
  - htslib
  - curl
  - wget
  
  # pip packages not available via conda
  - pip:
      - fimo-meme
      - pybedtools
      - pybigwig
      - scikit-learn
      - statsmodels
      - tqdm
