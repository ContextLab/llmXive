$schema: http://json-schema.org/draft-07/schema#
title: AlignedEvent Schema
description: |
  Defines the schema for the unified dataset of solar events and geomagnetic storms.
  This schema validates the output of the alignment pipeline (code/align.py).
  It encompasses the composite structure of SolarFlareEvent, CMEEvent, and GeomagneticStorm
  aligned within a specific time window.

type: object
required:
  - event_id
  - flare_time
  - flare_xray_class
  - cme_speed_km_s
  - cme_width_deg
  - cme_first_seen
  - storm_time
  - storm_dst_min
  - storm_kp_max
  - alignment_window_days
  - is_recurrent
  - data_limitation_flags
properties:
  # --- Identity & Temporal ---
  event_id:
    type: string
    description: Unique identifier for the aligned event (e.g., "2012-07-12-001")
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{3}$"
  
  flare_time:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the GOES X-ray flare onset.
  
  flare_xray_class:
    type: string
    description: GOES X-ray class (e.g., "X1.2", "M5.0", "C1.5").
    pattern: "^[XM][0-9]+(\\.[0-9]+)?$"
  
  flare_flux_w_m2:
    type: number
    description: Peak X-ray flux in W/m² (calculated from class).
    minimum: 0
  
  # --- CME Properties ---
  cme_speed_km_s:
    type: number
    description: CME linear speed in km/s from SOHO/LASCO.
    minimum: 0
    nullable: true
    description_note: "Null if CME not detected or speed unavailable."
  
  cme_width_deg:
    type: number
    description: CME angular width in degrees.
    minimum: 0
    maximum: 360
    nullable: true
  
  cme_first_seen:
    type: string
    format: date-time
    description: Timestamp of the first CME appearance in LASCO C2/C3.
    nullable: true
  
  cme_centrallongitude:
    type: number
    description: Central plane longitude in degrees (-180 to 180).
    minimum: -180
    maximum: 180
    nullable: true
  
  # --- Geomagnetic Storm Properties ---
  storm_time:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the Dst minimum (storm onset/peak).
  
  storm_dst_min:
    type: number
    description: Minimum Dst index value in nT.
    description_note: "Negative values indicate storm intensity."
  
  storm_kp_max:
    type: number
    description: Maximum Kp index within the storm window (0-9).
    minimum: 0
    maximum: 9
  
  # --- Alignment Metadata ---
  alignment_window_days:
    type: integer
    description: Maximum time window (in days) allowed between flare and storm.
    const: 3
  
  lag_hours:
    type: number
    description: Time difference between flare_time and storm_time in hours.
  
  # --- Quality & Flags ---
  is_recurrent:
    type: boolean
    description: Flag indicating if this event is part of a recurrent activity period.
  
  data_limitation_flags:
    type: array
    items:
      type: string
      enum:
        - missing_cme_speed
        - missing_cme_width
        - missing_cme_direction
        - missing_dst
        - missing_kp
        - no_cme_associated
    description: List of flags indicating missing or unavailable data points.
  
  source_provenance:
    type: object
    properties:
      flare_source:
        type: string
        enum: ["GOES"]
      cme_source:
        type: string
        enum: ["SOHO_LASCO", "CDAWeb"]
      storm_source:
        type: string
        enum: ["NOAA_SWPC"]
    required:
      - flare_source
      - cme_source
      - storm_source
