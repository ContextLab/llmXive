$schema: "http://json-schema.org/draft-07/schema#"
title: "Aligned Solar-Geomagnetic Event Schema"
description: "Schema for validating aligned_events.csv records containing solar flare, CME, and geomagnetic storm data."
type: "object"
required:
  - storm_timestamp
  - storm_min_dst
  - flare_timestamp
  - flare_flux_class
  - flare_peak_flux
  - cme_timestamp
  - cme_speed_kmh
  - cme_width_deg
  - cme_direction_deg
  - is_recurrent
  - alignment_window_days
  - flare_missing
  - cme_missing
  - dst_missing
properties:
  storm_timestamp:
    type: "string"
    description: "ISO 8601 timestamp of the geomagnetic storm minimum"
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
  storm_min_dst:
    type: "number"
    description: "Minimum Dst index value (nT) during the storm"
  flare_timestamp:
    type: "string"
    description: "ISO 8601 timestamp of the associated solar flare"
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
  flare_flux_class:
    type: "string"
    description: "GOES X-ray flare class (e.g., 'M5.2', 'X1.0')"
  flare_peak_flux:
    type: "number"
    description: "Peak X-ray flux in W/m²"
  cme_timestamp:
    type: "string"
    description: "ISO 8601 timestamp of the associated CME"
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
  cme_speed_kmh:
    type: "number"
    description: "CME speed in km/h"
  cme_width_deg:
    type: "number"
    description: "CME angular width in degrees"
  cme_direction_deg:
    type: "number"
    description: "CME direction in degrees (0-360)"
  is_recurrent:
    type: "boolean"
    description: "Flag indicating if this is part of a recurrent activity period"
  alignment_window_days:
    type: "number"
    description: "Time difference in days between solar event and storm minimum"
  flare_missing:
    type: "boolean"
    description: "True if no flare could be matched within the window"
  cme_missing:
    type: "boolean"
    description: "True if no CME could be matched within the window"
  dst_missing:
    type: "boolean"
    description: "True if Dst data was missing for this storm"
