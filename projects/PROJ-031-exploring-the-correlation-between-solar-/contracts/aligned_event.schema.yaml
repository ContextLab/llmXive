type: object
required:
  - storm_id
  - storm_time
  - dst_min
  - flare_time
  - flare_class
  - flare_flux
  - cme_time
  - cme_speed
  - cme_width
  - cme_direction
  - alignment_window_days
  - is_recurrent
  - has_missing_predictors
properties:
  storm_id:
    type: string
    description: Unique identifier for the storm event
  storm_time:
    type: string
    format: date-time
    description: Timestamp of the Dst minimum
  dst_min:
    type: number
    description: Minimum Dst value (nT)
  flare_time:
    type: string
    format: date-time
    description: Timestamp of the associated solar flare
  flare_class:
    type: string
    description: GOES flare class (e.g., X1.2, M5.3)
  flare_flux:
    type: number
    description: Peak X-ray flux (W/m^2)
  cme_time:
    type: string
    format: date-time
    description: Timestamp of the associated CME
  cme_speed:
    type: number
    description: CME speed (km/s)
  cme_width:
    type: number
    description: CME angular width (degrees)
  cme_direction:
    type: string
    description: CME direction (e.g., W120, CME)
  alignment_window_days:
    type: integer
    description: Days between flare and storm (<=3)
  is_recurrent:
    type: boolean
    description: Flag indicating recurrent activity
  has_missing_predictors:
    type: boolean
    description: Flag indicating missing solar predictors
