$schema: http://json-schema.org/draft-07/schema#
title: AlignedEvent Schema
description: >-
  Defines the schema for the unified dataset containing solar flare events,
  CME events, and geomagnetic storm data aligned within a 3-day window.
  Includes derived flags for recurrence and missing data.
type: object
required:
  - timestamp
  - flare_flux
  - cme_speed
  - dst_min
  - is_recurrent
properties:
  timestamp:
    type: string
    format: date-time
    description: >-
      The primary timestamp of the event (ISO 8601 format).
      Typically the peak time of the solar flare or the onset of the storm.
  flare_flux:
    type: number
    description: >-
      Peak X-ray flux of the associated solar flare in W/m² (e.g., 1.0e-4).
      May be null if no flare was associated or data is missing.
  cme_speed:
    type: number
    description: >-
      Radial speed of the associated Coronal Mass Ejection (CME) in km/s.
      May be null if no CME was associated or data is missing.
  dst_min:
    type: number
    description: >-
      Minimum Dst index value (nT) observed within the alignment window (≤3 days).
      Negative values indicate geomagnetic storm intensity.
  is_recurrent:
    type: boolean
    description: >-
      Flag indicating if the event occurred during a period of recurrent solar activity.
      True if part of a recurrent stream, False otherwise.
  flare_id:
    type: string
    description: >-
      Optional identifier for the source flare event (e.g., GOES event ID).
  cme_id:
    type: string
    description: >-
      Optional identifier for the source CME event (e.g., LASCO CME catalog ID).
  storm_id:
    type: string
    description: >-
      Optional identifier for the associated geomagnetic storm.
  alignment_window_days:
    type: number
    description: >-
      The time difference in days between the solar event and the geomagnetic minimum.
      Must be ≤ 3.0.
  missing_flare:
    type: boolean
    description: >-
      True if flare_flux is null.
  missing_cme:
    type: boolean
    description: >-
      True if cme_speed is null.
  source_flare:
    type: string
    description: >-
      Source of flare data (e.g., "NOAA SWPC", "GOES").
  source_cme:
    type: string
    description: >-
      Source of CME data (e.g., "CDAWeb SOHO/LASCO").
  source_dst:
    type: string
    description: >-
      Source of Dst data (e.g., "NOAA SWPC").
additionalProperties: false