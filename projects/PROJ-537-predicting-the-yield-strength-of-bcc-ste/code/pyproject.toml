[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-bcc-yield-strength"
version = "0.1.0"
description = "Predicting the Yield Strength of BCC Steels from Compositional Data and DFT"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "scikit-learn",
    "requests",
    "numpy",
    "shap",
    "pyyaml",
    "mp-api",
    "pytest",
    "flake8",
    "black",
    "isort",
    "pytest-cov",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["config", "utils", "ingestion", "modeling", "interpretability"]
skip = [".git", ".venv", "venv", "__pycache__", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
