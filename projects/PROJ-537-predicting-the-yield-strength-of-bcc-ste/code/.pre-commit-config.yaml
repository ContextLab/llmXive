# Pre-commit configuration for llmXive project
# Ensures seed consistency and import validation before commits
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: []

  - repo: local
    hooks:
      - id: verify-seed-usage
        name: Verify Seed Usage
        entry: python code/utils/verify_seed.py
        language: python
        files: \.py$
        pass_filenames: true
        description: |
          Ensures that random seeds are explicitly set in code files.
          Uses the seed value defined in config.py (CONFIG.SEED = 42).

      - id: check-imports
        name: Check Imports
        entry: python code/utils/check_imports.py
        language: python
        files: \.py$
        pass_filenames: true
        description: |
          Analyzes Python files to ensure imports match the defined API surface
          and no unused or invalid imports are present.
