# Output Schema for T032
# Defines the structure of data/results/output.json
type: object
required:
  - r2_composition_only
  - mae_composition_only
  - r2_dft_enhanced
  - mae_dft_enhanced
  - p_value
  - statistical_power
  - pearson_correlation_shear_yield
  - metadata
properties:
  r2_composition_only:
    type: number
    description: R-squared score for the composition-only model
  mae_composition_only:
    type: number
    description: Mean Absolute Error for the composition-only model
  r2_dft_enhanced:
    type: number
    description: R-squared score for the DFT-enhanced model
  mae_dft_enhanced:
    type: number
    description: Mean Absolute Error for the DFT-enhanced model
  p_value:
    type: number
    description: P-value from the paired t-test comparing the two models
  statistical_power:
    type: number
    description: Statistical power (1 - beta) of the t-test
  pearson_correlation_shear_yield:
    type: number
    description: Pearson correlation coefficient between Shear Modulus and Yield Strength
  metadata:
    type: object
    properties:
      project_id:
        type: string
      task_id:
        type: string
      generated_at:
        type: string
      version:
        type: string