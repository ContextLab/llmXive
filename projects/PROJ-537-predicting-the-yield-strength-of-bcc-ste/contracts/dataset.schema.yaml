$schema: http://json-schema.org/draft-07/schema#
title: Merged Yield Strength Dataset Schema
description: Schema for the merged dataset containing experimental yield strength and DFT elastic constants for BCC steels.
type: object
required:
  - properties
  - required
  - type
properties:
  properties:
    type: object
    description: Definition of dataset columns
    properties:
      material_id:
        type: string
        description: Unique identifier for the material
      formula:
        type: string
        description: Chemical formula of the alloy
      composition:
        type: string
        description: Comma-separated element:fraction pairs (e.g., "Fe:0.95,C:0.05")
      yield_strength_MPa:
        type: number
        description: Experimental yield strength in MPa
      yield_strength_uncertainty:
        type: number
        description: Uncertainty flag or value (1.0 if range midpoint used)
      space_group:
        type: integer
        description: Crystallographic space group number (229 for BCC)
      shear_modulus_GPa:
        type: number
        description: DFT-calculated shear modulus in GPa
      bulk_modulus_GPa:
        type: number
        description: DFT-calculated bulk modulus in GPa
      elastic_tensor:
        type: string
        description: String representation of the 6x6 elastic tensor (Voigt notation)
      source_experimental:
        type: string
        description: Source of experimental data (e.g., "MatNavi", "NIST")
      source_dft:
        type: string
        description: Source of DFT data (e.g., "Materials Project")
      provenance_timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of data ingestion
    required:
      - material_id
      - formula
      - composition
      - yield_strength_MPa
      - shear_modulus_GPa
      - space_group
      - source_experimental
      - source_dft
  required:
    - material_id
    - formula
    - composition
    - yield_strength_MPa
    - shear_modulus_GPa
    - space_group
  type: object
