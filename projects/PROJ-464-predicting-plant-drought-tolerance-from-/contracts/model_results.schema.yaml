$schema: "http://json-schema.org/draft-07/schema#"
title: Model Results Schema
description: Schema for the aggregated model results CSV.
type: object
required:
  - model_type
  - predictor
  - coefficient
  - p_value
  - r2
  - adj_p_value
properties:
  model_type:
    type: string
    enum: [MLR, RandomForest, PGLS, PVR]
  predictor:
    type: string
  coefficient:
    type: number
  p_value:
    type: number
    minimum: 0
    maximum: 1
  r2:
    type: number
    minimum: 0
    maximum: 1
  adj_p_value:
    type: number
    minimum: 0
    maximum: 1
additionalProperties: false
