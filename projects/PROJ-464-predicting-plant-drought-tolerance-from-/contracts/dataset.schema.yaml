# Dataset Validation Schema for NPPN Root Phenotyping and TRY Physiological Traits
# This schema defines the expected structure and constraints for input datasets
# used in the plant drought tolerance prediction pipeline.

$schema: "http://json-schema.org/draft-07/schema#"
title: Plant Drought Tolerance Dataset Schema
description: Schema for validating raw and derived datasets before analysis

definitions:
  rsa_metrics:
    type: object
    properties:
      species_id:
        type: string
        description: Unique identifier for the plant species
        pattern: "^[a-zA-Z0-9_-]+$"
      depth:
        type: number
        minimum: 0
        description: Maximum root depth in cm
      branching_density:
        type: number
        minimum: 0
        description: Branch points per unit length
      surface_area:
        type: number
        minimum: 0
        description: Total root surface area in cm²
    required:
      - species_id
      - depth
      - branching_density
      - surface_area
    additionalProperties: false

  physiological_traits:
    type: object
    properties:
      species_id:
        type: string
        description: Unique identifier for the plant species
        pattern: "^[a-zA-Z0-9_-]+$"
      stomatal_conductance:
        type: number
        minimum: 0
        description: Stomatal conductance in mol/m²/s
      photosynthesis:
        type: number
        minimum: 0
        description: Photosynthetic rate in μmol/m²/s
      survival_rate:
        type: number
        minimum: 0
        maximum: 1
        description: Survival rate under drought (optional)
    required:
      - species_id
      - stomatal_conductance
      - photosynthesis
    additionalProperties: false

type: object
properties:
  rsa_metrics_file:
    $ref: "#/definitions/rsa_metrics"
  physiological_traits_file:
    $ref: "#/definitions/physiological_traits"
required:
  - rsa_metrics_file
  - physiological_traits_file
additionalProperties: false

validation_rules:
  - name: no_null_values
    description: All numeric fields must be non-null and non-NaN
    implementation: pandas.notna()
  - name: positive_values
    description: All numeric traits must be strictly positive
    implementation: value > 0
  - name: species_overlap
    description: Species IDs must exist in both datasets
    implementation: set intersection check
  - name: sample_size
    description: Merged dataset must have N >= 55 species
    implementation: len(merged_df) >= 55
