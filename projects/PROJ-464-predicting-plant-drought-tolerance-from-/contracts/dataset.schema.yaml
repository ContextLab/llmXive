$schema: http://json-schema.org/draft-07/schema#
title: Merged Dataset Schema
description: |
  Validates the structure of the merged dataset combining RSA metrics and physiological traits.
  References: FR-001, FR-002
type: object
required:
  - $schema
  - type
  - properties
properties:
  $schema:
    type: string
    const: http://json-schema.org/draft-07/schema#
  type:
    type: string
    const: object
  properties:
    type: object
    required:
      species_id
      depth
      branching_density
      surface_area
      stomatal_conductance
      photosynthesis
    properties:
      species_id:
        type: object
        properties:
          type:
            type: string
            const: string
          description:
            type: string
      depth:
        type: object
        properties:
          type:
            type: string
            const: number
          description:
            type: string
          exclusiveMinimum:
            type: number
            const: 0
      branching_density:
        type: object
        properties:
          type:
            type: string
            const: number
          description:
            type: string
          exclusiveMinimum:
            type: number
            const: 0
      surface_area:
        type: object
        properties:
          type:
            type: string
            const: number
          description:
            type: string
          exclusiveMinimum:
            type: number
            const: 0
      stomatal_conductance:
        type: object
        properties:
          type:
            type: string
            const: number
          description:
            type: string
      photosynthesis:
        type: object
        properties:
          type:
            type: string
            const: number
          description:
            type: string
additionalProperties: false
