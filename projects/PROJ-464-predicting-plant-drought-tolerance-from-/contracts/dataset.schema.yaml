$schema: "http://json-schema.org/draft-07/schema#"
title: Dataset Schema
description: Schema for the raw dataset containing species identifiers and raw trait columns.
type: object
required:
  - species_id
  - species_name
properties:
  species_id:
    type: string
    description: Unique identifier for the species (e.g., TRY accession).
  species_name:
    type: string
    description: Canonical scientific name of the species.
  other_traits:
    type: object
    description: Additional trait fields (free‑form key/value pairs).
    additionalProperties:
      type: [string, number, null]
additionalProperties: false
