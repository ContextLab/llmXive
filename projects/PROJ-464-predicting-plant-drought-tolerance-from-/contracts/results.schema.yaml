$schema: http://json-schema.org/draft-07/schema#
title: Sensitivity Sweep Results Schema
description: |
  Validates sensitivity analysis details.
  References: FR-005, SC-003
type: object
required:
  - $schema
  - type
  - properties
properties:
  $schema:
    type: string
    const: http://json-schema.org/draft-07/schema#
  type:
    type: string
    const: object
  properties:
    type: object
    required:
      threshold
      accuracy
      precision
      recall
      f1_score
      false_positive_rate
      false_negative_rate
    properties:
      threshold:
        type: object
        properties:
          type:
            type: string
            const: number
          minimum:
            type: number
            const: 0
          maximum:
            type: number
            const: 1
      accuracy:
        type: object
        properties:
          type:
            type: string
            const: number
          minimum:
            type: number
            const: 0
          maximum:
            type: number
            const: 1
      precision:
        type: object
        properties:
          type:
            type: string
            const: number
          minimum:
            type: number
            const: 0
          maximum:
            type: number
            const: 1
      recall:
        type: object
        properties:
          type:
            type: string
            const: number
          minimum:
            type: number
            const: 0
          maximum:
            type: number
            const: 1
      f1_score:
        type: object
        properties:
          type:
            type: string
            const: number
          minimum:
            type: number
            const: 0
          maximum:
            type: number
            const: 1
      false_positive_rate:
        type: object
        properties:
          type:
            type: string
            const: number
          minimum:
            type: number
            const: 0
          maximum:
            type: number
            const: 1
      false_negative_rate:
        type: object
        properties:
          type:
            type: string
            const: number
          minimum:
            type: number
            const: 0
          maximum:
            type: number
            const: 1
additionalProperties: false
