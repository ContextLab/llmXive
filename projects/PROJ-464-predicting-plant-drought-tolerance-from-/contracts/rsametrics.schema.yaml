$schema: "http://json-schema.org/draft-07/schema#"
title: RSA Metrics Schema
description: Validates extracted root system architecture traits.
type: object
properties:
  type:
    type: string
    const: "application/json"
  data:
    type: array
    items:
      type: object
      required:
        - species_id
        - depth
        - branching_density
        - surface_area
      properties:
        species_id:
          type: string
          description: Unique species identifier
        depth:
          type: number
          description: Root depth in cm
          minimum: 0
        branching_density:
          type: number
          description: Branching density metric
          minimum: 0
        surface_area:
          type: number
          description: Root surface area in cm^2
          minimum: 0
      additionalProperties: false
required:
  - type
  - data
