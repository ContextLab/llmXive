$schema: "http://json-schema.org/draft-07/schema#"
title: RSA Metrics Schema
description: Schema for the RSA metrics CSV generated by the image‑processing step.
type: object
required:
  - species_id
  - depth
  - branching_density
  - surface_area
properties:
  species_id:
    type: string
    description: Identifier matching the species in the TRY dataset.
  depth:
    type: number
    minimum: 0
    description: Root depth in pixel units.
  branching_density:
    type: number
    minimum: 0
    description: Number of branch points per unit length.
  surface_area:
    type: number
    minimum: 0
    description: Projected root surface area in pixel units.
additionalProperties: false
