# Output Schema for Model Results and Analysis Reports
# This schema defines the expected structure for all generated outputs
# to ensure consistency across the pipeline.

$schema: "http://json-schema.org/draft-07/schema#"
title: Plant Drought Tolerance Output Schema
description: Schema for validating model results and analysis outputs

definitions:
  model_results:
    type: object
    properties:
      model_type:
        type: string
        enum:
          - OLS
          - Ridge
          - Lasso
          - RandomForest
          - PGLS
      predictor:
        type: string
        description: Name of the predictor variable
      coefficient:
        type: number
        description: Estimated coefficient value
      std_error:
        type: number
        description: Standard error of the coefficient
      p_value:
        type: number
        minimum: 0
        maximum: 1
        description: P-value for the coefficient
      adjusted_p_value:
        type: number
        minimum: 0
        maximum: 1
        description: Bonferroni or FDR adjusted p-value
      r_squared:
        type: number
        minimum: 0
        maximum: 1
        description: Model R² value
    required:
      - model_type
      - predictor
      - coefficient
      - p_value
      - r_squared
    additionalProperties: false

  vif_compliance:
    type: object
    properties:
      predictor:
        type: string
        description: Name of the predictor variable
      vif_score:
        type: number
        minimum: 1
        description: Variance Inflation Factor score
      is_collinear:
        type: boolean
        description: True if VIF > 5
      suppression_applied:
        type: boolean
        description: True if independent effect claims were suppressed
    required:
      - predictor
      - vif_score
      - is_collinear
      - suppression_applied
    additionalProperties: false

  sensitivity_results:
    type: object
    properties:
      threshold:
        type: number
        description: Classification threshold value
      accuracy:
        type: number
        minimum: 0
        maximum: 1
      precision:
        type: number
        minimum: 0
        maximum: 1
      recall:
        type: number
        minimum: 0
        maximum: 1
      f1_score:
        type: number
        minimum: 0
        maximum: 1
      false_positive_rate:
        type: number
        minimum: 0
        maximum: 1
      false_negative_rate:
        type: number
        minimum: 0
        maximum: 1
    required:
      - threshold
      - accuracy
      - precision
      - recall
      - f1_score
      - false_positive_rate
      - false_negative_rate
    additionalProperties: false

type: object
properties:
  model_results_file:
    type: array
    items:
      $ref: "#/definitions/model_results"
  vif_compliance_file:
    type: array
    items:
      $ref: "#/definitions/vif_compliance"
  sensitivity_results_file:
    type: array
    items:
      $ref: "#/definitions/sensitivity_results"
  proxy_detection_file:
    type: object
    properties:
      has_proxy:
        type: boolean
      proxy_variable:
        type: string
    required:
      - has_proxy
    additionalProperties: false
required:
  - model_results_file
  - vif_compliance_file
  - sensitivity_results_file
  - proxy_detection_file
additionalProperties: false

validation_rules:
  - name: coefficient_significance
    description: Coefficients with p-value < 0.05 are considered significant
    implementation: p_value < 0.05
  - name: vif_threshold
    description: VIF > 5 indicates problematic multicollinearity
    implementation: vif_score > 5
  - name: model_performance
    description: R² should be between 0 and 1
    implementation: 0 <= r_squared <= 1
  - name: sensitivity_coverage
    description: Sensitivity analysis should cover full threshold range
    implementation: thresholds span 0.0 to 1.0
