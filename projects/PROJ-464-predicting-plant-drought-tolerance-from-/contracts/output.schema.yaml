$schema: "http://json-schema.org/draft-07/schema#"
title: Output Schema
description: Schema for the final report output (markdown) – only structural checks.
type: object
required:
  - report_path
  - sections
properties:
  report_path:
    type: string
    pattern: "^results/reports/.*\\.md$"
  sections:
    type: array
    items:
      type: string
additionalProperties: false
