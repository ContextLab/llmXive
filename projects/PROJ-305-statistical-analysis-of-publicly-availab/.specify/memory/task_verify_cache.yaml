  r: "Checked `src/data/download.py`, `data/raw/vaers_2020_2023.parquet`, and `data/checksums.txt`.\
    \ While the parquet file exists, is non\u2011empty, and its checksum is recorded,\
    \ the download script uses the wrong Hugging\u202FFace identifier (`chrisvoncsefalvay/vaers-outcomes`)\
    \ instead of the required `vaers/vaers2020_2023`. The task explicitly mandates\
    \ loading that exact dataset, so the implementation does not meet the specification.\
    \ The script must be updated to use `datasets.load_dataset(\"vaers/vaers2020_2023\"\
    , split=\"train\")`."
