T003:
  c: false
  h: 318fffd4386daf79fa76598d30b53f0e9e9d81887869d846638cce143285a8fd
  r: "The repository contains `src/data/validate_raw.py` and the unit\u2011test file,\
    \ but the CLI cannot be invoked (`python -m src.data.validate_raw` raises \u201C\
    No module named src.data.validate_raw\u201D) because `src` is not a package (no\
    \ `src/__init__.py`). Consequently the tests fail, no log files are written, and\
    \ the script does not use the `jsonschema` library as required. The task needs\
    \ a proper package layout, correct importable module, use of `jsonschema` for\
    \ schema loading/validation, and passing unit tests."
  sig: 7133951d78a3816efecd3e96e6de36254beee550e8102eab83117da3f8882ad5
