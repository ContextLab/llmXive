# Ruff configuration file
# Extends settings from pyproject.toml but can override here if needed

line-length = 88
target-version = "py311"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex (may be too strict for some cases)
]

[lint.per-file-ignores]
"code/tests/*" = ["S101"]  # Allow assert in tests
"code/setup_project.py" = ["T201"]  # Allow print in setup script
"code/scripts/*" = ["T201"]  # Allow print in scripts

[lint.isort]
known-first-party = ["src", "tests", "scripts", "setup_project"]
force-sort-within-sections = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
