# Ruff configuration for llmXive statistical analysis project
target-version = "py311"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in data pipelines)
]

[lint.per-file-ignores]
"tests/*" = ["S101"] # Allow assertions in tests

[lint.isort]
known-first-party = ["src", "tests", "setup_project"]
force-sort-within-sections = true
