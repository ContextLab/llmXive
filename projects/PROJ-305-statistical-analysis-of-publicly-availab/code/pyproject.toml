[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covid-vaers-analysis"
version = "0.1.0"
description = "Statistical Analysis of Publicly Available COVID-19 Vaccine Adverse Event Reports"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "requests",
    "pyarrow",
    "matplotlib",
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "psutil",
    "tracemalloc"
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
# Target Python version
target-version = "py311"
# Line length
line-length = 88
# Exclude directories
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "data",
    "output",
    "logs",
    "venv"
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in data scripts)
]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "setup_project"]
force-sort-within-sections = true

[tool.black]
# Line length
line-length = 88
# Target Python version
target-version = ["py311"]
# Exclude directories
exclude = '''
/(
    \.git
    | \.tox
    | __pycache__
    | build
    | dist
    | data
    | output
    | logs
    | venv
)/
'''
# Preview style for better compatibility
preview = true
