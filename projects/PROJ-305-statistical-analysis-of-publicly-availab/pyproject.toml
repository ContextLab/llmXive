[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-covid-vaers-analysis"
version = "0.1.0"
description = "Statistical Analysis of Publicly Available COVID-19 Vaccine Adverse Event Reports"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "requests",
    "pyarrow",
    "matplotlib",
    "pytest",
    "pytest-cov",
    "pyyaml",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
# Inherits settings from .ruff.toml but can be overridden here if needed
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-v --cov=code/src --cov-report=term-missing"
