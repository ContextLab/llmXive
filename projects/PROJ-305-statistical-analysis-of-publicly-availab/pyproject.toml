[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py311']
extend-exclude = 'code/'

[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["code/*"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W"]
ignore = []
exclude = ["code/"]
