# Signal Schema for Disproportionality Analysis Outputs
# This schema defines the structure of the output file `output/signals.csv`
# generated by the disproportionality analysis pipeline.
#
# Columns correspond to:
# - soc: System Organ Class code/name
# - ror: Reporting Odds Ratio
# - ror_ci_lower: Lower bound of 95% CI for ROR
# - ror_ci_upper: Upper bound of 95% CI for ROR
# - prr: Proportional Reporting Ratio
# - prr_ci_lower: Lower bound of 95% CI for PRR
# - prr_ci_upper: Upper bound of 95% CI for PRR
# - ic: Information Component
# - ic_ci_lower: Lower bound of 95% CI for IC
# - ic_ci_upper: Upper bound of 95% CI for IC
# - p_adj: Benjamini-Hochberg adjusted p-value
# - signal_flag: Boolean indicating if the 2-out-of-3 rule is met

type: object
properties:
  soc:
    type: string
    description: "System Organ Class identifier or name"
    minLength: 1
  ror:
    type: number
    description: "Reporting Odds Ratio"
    minimum: 0
  ror_ci_lower:
    type: number
    description: "Lower bound of 95% confidence interval for ROR"
  ror_ci_upper:
    type: number
    description: "Upper bound of 95% confidence interval for ROR"
  prr:
    type: number
    description: "Proportional Reporting Ratio"
    minimum: 0
  prr_ci_lower:
    type: number
    description: "Lower bound of 95% confidence interval for PRR"
  prr_ci_upper:
    type: number
    description: "Upper bound of 95% confidence interval for PRR"
  ic:
    type: number
    description: "Information Component"
  ic_ci_lower:
    type: number
    description: "Lower bound of 95% confidence interval for IC"
  ic_ci_upper:
    type: number
    description: "Upper bound of 95% confidence interval for IC"
  p_adj:
    type: number
    description: "Benjamini-Hochberg adjusted p-value"
    minimum: 0
    maximum: 1
  signal_flag:
    type: boolean
    description: "True if the SOC meets the 2-out-of-3 signal criteria (ROR, PRR, IC thresholds)"

required:
  - soc
  - ror
  - ror_ci_lower
  - ror_ci_upper
  - prr
  - prr_ci_lower
  - prr_ci_upper
  - ic
  - ic_ci_lower
  - ic_ci_upper
  - p_adj
  - signal_flag

additionalProperties: false