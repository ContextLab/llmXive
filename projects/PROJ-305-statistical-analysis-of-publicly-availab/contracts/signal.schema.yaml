description: >-
  Schema for the output of the Disproportionality Analysis (User Story 2).
  Defines the structure of signal detection metrics including ROR, PRR, IC,
  confidence intervals, adjusted p-values, and signal flags.
type: object
required:
  - schema_version
  - generated_at
  - signals
properties:
  schema_version:
    type: string
    description: Semantic version of this schema (e.g., "1.0.0")
    const: "1.0.0"
  generated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the signals file was generated
  signals:
    type: array
    description: List of disproportionality metrics per System Organ Class (SOC)
    items:
      type: object
      required:
        - soc_code
        - soc_description
        - case_count
        - control_count
        - total_exposed
        - total_unexposed
        - metrics
        - signal_flags
      properties:
        soc_code:
          type: string
          description: MedDRA System Organ Class code (e.g., "10000001")
        soc_description:
          type: string
          description: Human-readable description of the SOC
        case_count:
          type: integer
          description: Number of reports with this SOC in the COVID-19 (exposed) group
        control_count:
          type: integer
          description: Number of reports with this SOC in the Non-COVID (unexposed) group
        total_exposed:
          type: integer
          description: Total number of reports in the COVID-19 group
        total_unexposed:
          type: integer
          description: Total number of reports in the Non-COVID group
        metrics:
          type: object
          description: Calculated disproportionality metrics
          required:
            - ROR
            - ROR_CI_lower
            - ROR_CI_upper
            - PRR
            - PRR_CI_lower
            - PRR_CI_upper
            - IC
            - IC_CI_lower
            - IC_CI_upper
            - p_value_chi2
            - adjusted_p
          properties:
            ROR:
              type: number
              format: float
              description: Reporting Odds Ratio
            ROR_CI_lower:
              type: number
              format: float
              description: Lower bound of 95% CI for ROR
            ROR_CI_upper:
              type: number
              format: float
              description: Upper bound of 95% CI for ROR
            PRR:
              type: number
              format: float
              description: Proportional Reporting Ratio
            PRR_CI_lower:
              type: number
              format: float
              description: Lower bound of 95% CI for PRR
            PRR_CI_upper:
              type: number
              format: float
              description: Upper bound of 95% CI for PRR
            IC:
              type: number
              format: float
              description: Information Component
            IC_CI_lower:
              type: number
              format: float
              description: Lower bound of 95% CI for IC
            IC_CI_upper:
              type: number
              format: float
              description: Upper bound of 95% CI for IC
            p_value_chi2:
              type: number
              format: float
              description: P-value from Chi-squared test
            adjusted_p:
              type: number
              format: float
              description: Benjamini-Hochberg adjusted p-value
        signal_flags:
          type: object
          description: Flags indicating if metrics meet signal thresholds
          required:
            - is_signal_2_of_3
            - ROR_flag
            - PRR_flag
            - IC_flag
            - background_rate_unknown
          properties:
            is_signal_2_of_3:
              type: boolean
              description: True if at least 2 out of 3 metrics (ROR, PRR, IC) meet thresholds
            ROR_flag:
              type: boolean
              description: True if ROR > 2.0 AND ROR_CI_lower > 1.0
            PRR_flag:
              type: boolean
              description: True if PRR > 1.5 AND PRR_CI_lower > 1.0
            IC_flag:
              type: boolean
              description: True if IC > 0 AND IC_CI_lower > 0
            background_rate_unknown:
              type: boolean
              description: True if SOC code is not found in KNOWN_BACKGROUND_RATES
        notes:
          type: string
          description: Optional notes regarding specific calculations or data issues