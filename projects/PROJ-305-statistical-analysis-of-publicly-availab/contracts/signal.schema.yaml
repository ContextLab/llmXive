%YAML 1.1
---
# Contract: Signal Detection Output Schema
# Defines the structure of output signals from disproportionality analysis.
# Used by T025b to generate output/signals.csv.

type: object
required:
  - soc
  - ror
  - ror_ci_lower
  - ror_ci_upper
  - prr
  - prr_ci_lower
  - prr_ci_upper
  - ic
  - ic_ci_lower
  - ic_ci_upper
  - p_adj
  - signal_flag
  - background_rate_status

properties:
  soc:
    type: string
    description: System Organ Class code or name identifier.
    minLength: 1
    
  ror:
    type: number
    description: Reporting Odds Ratio point estimate.
    minimum: 0
    
  ror_ci_lower:
    type: number
    description: Lower bound of 95% Confidence Interval for ROR.
    
  ror_ci_upper:
    type: number
    description: Upper bound of 95% Confidence Interval for ROR.
    
  prr:
    type: number
    description: Proportional Reporting Ratio point estimate.
    minimum: 0
    
  prr_ci_lower:
    type: number
    description: Lower bound of 95% Confidence Interval for PRR.
    
  prr_ci_upper:
    type: number
    description: Upper bound of 95% Confidence Interval for PRR.
    
  ic:
    type: number
    description: Information Component point estimate.
    
  ic_ci_lower:
    type: number
    description: Lower bound of 95% Confidence Interval for IC.
    
  ic_ci_upper:
    type: number
    description: Upper bound of 95% Confidence Interval for IC.
    
  p_adj:
    type: number
    description: Benjamini-Hochberg adjusted p-value.
    minimum: 0
    maximum: 1
    
  signal_flag:
    type: boolean
    description: True if the SOC meets the 2-out-of-3 signal detection rule.
    
  background_rate_status:
    type: string
    description: Status of external background rate availability.
    enum:
      - UNKNOWN
      - KNOWN
    default: UNKNOWN
    
additionalProperties: false