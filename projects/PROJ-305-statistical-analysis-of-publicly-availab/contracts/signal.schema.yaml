# Signal Detection Output Schema
# Defines the structure for the output of the disproportionality analysis (T028)
# File: output/signals.csv
# Generated by: src/analysis/disproportionality.py

version: "1.0"
description: >
  Schema for statistical signal detection results from VAERS data analysis.
  Contains metrics (ROR, PRR, IC) with confidence intervals and adjusted p-values
  for each System Organ Class (SOC) comparing COVID-19 vs Non-COVID vaccine reports.

columns:
  - name: soc_code
    type: string
    description: System Organ Class code (e.g., '10029205')
    nullable: false
    primary_key: true

  - name: soc_description
    type: string
    description: Human-readable description of the SOC
    nullable: false

  - name: case_count_exposed
    type: integer
    description: Number of reports with this SOC in the COVID-19 vaccine group
    nullable: false
    min: 0

  - name: case_count_unexposed
    type: integer
    description: Number of reports with this SOC in the Non-COVID vaccine group
    nullable: false
    min: 0

  - name: total_exposed
    type: integer
    description: Total number of reports in the COVID-19 vaccine group
    nullable: false
    min: 0

  - name: total_unexposed
    type: integer
    description: Total number of reports in the Non-COVID vaccine group
    nullable: false
    min: 0

  - name: ror
    type: float
    description: Reporting Odds Ratio point estimate
    nullable: false
    format: float64

  - name: ror_ci_lower
    type: float
    description: Lower bound of 95% Confidence Interval for ROR
    nullable: false
    format: float64

  - name: ror_ci_upper
    type: float
    description: Upper bound of 95% Confidence Interval for ROR
    nullable: false
    format: float64

  - name: prr
    type: float
    description: Proportional Reporting Ratio point estimate
    nullable: false
    format: float64

  - name: prr_ci_lower
    type: float
    description: Lower bound of 95% Confidence Interval for PRR
    nullable: false
    format: float64

  - name: prr_ci_upper
    type: float
    description: Upper bound of 95% Confidence Interval for PRR
    nullable: false
    format: float64

  - name: ic
    type: float
    description: Information Component point estimate
    nullable: false
    format: float64

  - name: ic_ci_lower
    type: float
    description: Lower bound of 95% Confidence Interval for IC
    nullable: false
    format: float64

  - name: ic_ci_upper
    type: float
    description: Upper bound of 95% Confidence Interval for IC
    nullable: false
    format: float64

  - name: p_value
    type: float
    description: Raw p-value from Chi-squared test
    nullable: false
    format: float64
    min: 0.0
    max: 1.0

  - name: adjusted_p
    type: float
    description: Benjamini-Hochberg adjusted p-value (FDR corrected)
    nullable: false
    format: float64
    min: 0.0
    max: 1.0

  - name: signal_ror
    type: boolean
    description: True if ROR > 2.0 AND ROR_CI_LOWER > 1.0
    nullable: false

  - name: signal_prr
    type: boolean
    description: True if PRR > 1.5 AND PRR_CI_LOWER > 1.0
    nullable: false

  - name: signal_ic
    type: boolean
    description: True if IC > 0 AND IC_CI_LOWER > 0
    nullable: false

  - name: is_signal
    type: boolean
    description: True if at least 2 of 3 signal criteria are met (2-out-of-3 rule)
    nullable: false

  - name: background_rate_known
    type: boolean
    description: True if SOC code exists in KNOWN_BACKGROUND_RATES config
    nullable: false

  - name: min_reports
    type: integer
    description: Minimum report count threshold used for inclusion (typically 5)
    nullable: false

constraints:
  - name: min_report_threshold
    description: Rows with total reports (case_count_exposed + case_count_unexposed) < 5 should be excluded from analysis
    source: T024

  - name: continuity_correction
    description: All metrics calculated with 0.5 continuity correction for zero cells
    source: T023

  - name: fdr_correction
    description: adjusted_p calculated using Benjamini-Hochberg procedure across all tested SOCs
    source: T025

example_row:
  soc_code: "10029205"
  soc_description: "Nervous system disorders"
  case_count_exposed: 1250
  case_count_unexposed: 450
  total_exposed: 50000
  total_unexposed: 30000
  ror: 1.67
  ror_ci_lower: 1.48
  ror_ci_upper: 1.88
  prr: 1.65
  prr_ci_lower: 1.47
  prr_ci_upper: 1.85
  ic: 0.72
  ic_ci_lower: 0.58
  ic_ci_upper: 0.86
  p_value: 1.2e-15
  adjusted_p: 4.5e-14
  signal_ror: false
  signal_prr: false
  signal_ic: true
  is_signal: false
  background_rate_known: true
  min_reports: 5

file_format:
  format: csv
  delimiter: ","
  encoding: utf-8
  header: true
  index: false

output_location: output/signals.csv
generated_by: src/analysis/disproportionality.py (main function)