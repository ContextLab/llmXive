# Schema for Disproportionality Analysis Signal Output
# Used by src/analysis/signal_output.py to generate output/signals.csv
#
# This schema defines the structure of the signal detection results
# including ROR, PRR, IC metrics, confidence intervals, adjusted p-values,
# and the 2-out-of-3 signal flag.

name: signal_schema
version: "1.0.0"
description: Output structure for statistical signal detection metrics

columns:
  - name: soc
    type: string
    required: true
    description: System Organ Class code (e.g., SOC100001)
    constraints:
      - not_null: true
      - pattern: "^SOC[0-9]+$"

  - name: ror
    type: float
    required: true
    description: Reporting Odds Ratio point estimate
    constraints:
      - finite: true
      - not_null: true

  - name: ror_ci_lower
    type: float
    required: true
    description: Lower bound of 95% confidence interval for ROR
    constraints:
      - finite: true
      - not_null: true

  - name: ror_ci_upper
    type: float
    required: true
    description: Upper bound of 95% confidence interval for ROR
    constraints:
      - finite: true
      - not_null: true

  - name: prr
    type: float
    required: true
    description: Proportional Reporting Ratio point estimate
    constraints:
      - finite: true
      - not_null: true

  - name: prr_ci_lower
    type: float
    required: true
    description: Lower bound of 95% confidence interval for PRR
    constraints:
      - finite: true
      - not_null: true

  - name: prr_ci_upper
    type: float
    required: true
    description: Upper bound of 95% confidence interval for PRR
    constraints:
      - finite: true
      - not_null: true

  - name: ic
    type: float
    required: true
    description: Information Component point estimate
    constraints:
      - finite: true
      - not_null: true

  - name: ic_ci_lower
    type: float
    required: true
    description: Lower bound of 95% confidence interval for IC
    constraints:
      - finite: true
      - not_null: true

  - name: ic_ci_upper
    type: float
    required: true
    description: Upper bound of 95% confidence interval for IC
    constraints:
      - finite: true
      - not_null: true

  - name: p_adj
    type: float
    required: true
    description: Benjamini-Hochberg adjusted p-value
    constraints:
      - finite: true
      - not_null: true
      - min: 0.0
      - max: 1.0

  - name: signal_flag
    type: boolean
    required: true
    description: True if SOC meets 2-out-of-3 rule (ROR, PRR, IC thresholds)
    constraints:
      - not_null: true

# Thresholds for 2-out-of-3 rule (referenced in signal_output.py)
# These must match src/utils/config.py THRESHOLDS
thresholds:
  ror_min: 2.0
  ror_ci_min: 1.0
  prr_min: 1.5
  prr_ci_min: 1.0
  ic_min: 0.0
  ic_ci_min: 0.0

# Validation rules
validation:
  - rule: "All metrics must be finite (no NaN, inf)"
    check: "all columns are finite"
  - rule: "CI bounds must be non-negative for ROR and PRR"
    check: "ror_ci_lower >= 0, prr_ci_lower >= 0"
  - rule: "Adjusted p-values must be in [0, 1]"
    check: "0 <= p_adj <= 1"
  - rule: "Signal flag must be boolean"
    check: "signal_flag in [True, False]"

# Output file path
output_file: "output/signals.csv"
file_format: "csv"
delimiter: ","
index: false