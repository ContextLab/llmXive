version: "1.0.0"
description: "Schema for VAERS dataset after initial validation but before cleaning. Defines required columns for the statistical analysis pipeline."
required_columns:
  - name: VAX_TYPE
    type: string
    description: "Vaccine type administered. Must contain values like 'COVID-19' or other vaccine identifiers. Used to define exposure groups."
    constraints:
      min_length: 1
      allow_null: false
  - name: SOC_CODE
    type: string
    description: "System Organ Class code from MedDRA. Used for grouping adverse events."
    constraints:
      allow_null: false
      # Note: LLT (Lowest Level Term) is an alternative or additional field in raw data,
      # but SOC_CODE is the primary grouping key for this analysis.
  - name: LLT
    type: string
    description: "Lowest Level Term from MedDRA. Optional but required for granular mapping if SOC_CODE is missing."
    constraints:
      allow_null: true
  - name: REPT_DATE
    type: date
    format: "YYYY-MM-DD"
    description: "Date of report submission. Used for temporal analysis and filtering."
    constraints:
      allow_null: false
  - name: AGE
    type: numeric
    description: "Age of the patient at the time of the event."
    constraints:
      allow_null: true
      min_value: 0
      max_value: 120
source: "VAERS Data Files (2020-2023)"
validation_rules:
  - "At least one of SOC_CODE or LLT must be present."
  - "VAX_TYPE must not be empty."
  - "REPT_DATE must be a valid date string."
notes: |
  This schema is used by src/data/validate.py to ensure raw data downloaded in T013
  contains the necessary fields before proceeding to cleaning (T014).
  Columns are case-sensitive as per VAERS CSV headers.