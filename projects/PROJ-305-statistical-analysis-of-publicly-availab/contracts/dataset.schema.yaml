# Dataset Schema for VAERS Data
# This schema defines the required columns and data types for the raw VAERS dataset
# after download and before cleaning.

schema_name: vaers_raw_dataset
version: "1.0"

required_columns:
  - name: VAX_TYPE
    description: Vaccine type administered
    dtype: object
    nullable: false
  - name: SOC_CODE
    description: System Organ Class code (MedDRA)
    dtype: object
    nullable: false
  - name: LLT
    description: Lowest Level Term (MedDRA)
    dtype: object
    nullable: true
  - name: REPT_DATE
    description: Date of report
    dtype: object
    nullable: false
  - name: AGE
    description: Age of patient
    dtype: object
    nullable: true
  - name: VAERS_ID
    description: Unique VAERS report identifier
    dtype: object
    nullable: false
  - name: SEX
    description: Sex of patient
    dtype: object
    nullable: true

constraints:
  min_rows: 1
  max_null_percentage:
    SOC_CODE: 0.0
    VAX_TYPE: 0.0
    REPT_DATE: 0.0
    VAERS_ID: 0.0

validation_rules:
  - rule: no_duplicate_vaers_ids
    description: VAERS_ID must be unique across the dataset
  - rule: valid_date_format
    description: REPT_DATE must be in a parsable date format (YYYY-MM-DD or MM/DD/YYYY)

metadata:
  source: CDC VAERS Public Dataset
  update_frequency: Annual
  contact: vaers@cdc.gov
