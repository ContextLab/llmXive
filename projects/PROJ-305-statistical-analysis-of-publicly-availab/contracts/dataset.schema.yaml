version: "1.0"
description: Schema for raw VAERS dataset validation
required_columns:
  - VAX_TYPE
  - SOC_CODE
  - LLT
  - REPT_DATE
  - AGE
column_definitions:
  VAX_TYPE:
    type: string
    description: Vaccine type administered
    required: true
  SOC_CODE:
    type: string
    description: MedDRA System Organ Class code
    required: true
  LLT:
    type: string
    description: Lowest Level Term for adverse event
    required: true
  REPT_DATE:
    type: string
    description: Date of report submission (YYYY-MM-DD or MM/DD/YYYY)
    required: true
  AGE:
    type: string
    description: Age of the patient (numeric string or 'UNKNOWN')
    required: true
constraints:
  - column: REPT_DATE
    rule: non_empty
  - column: VAX_TYPE
    rule: non_empty
  - column: SOC_CODE
    rule: non_empty
