$schema: "http://json-schema.org/draft-07/schema#"
title: VAERS Dataset Schema
description: Required columns and types for raw VAERS data validation
type: object
required:
  - properties
properties:
  columns:
    type: array
    description: List of required column names in the CSV
    items:
      type: string
    minItems: 4
required_columns:
  - VAX_TYPE
  - SOC_CODE
  - REPT_DATE
  - AGE
note: "The validator checks that the input CSV contains at least these columns."
