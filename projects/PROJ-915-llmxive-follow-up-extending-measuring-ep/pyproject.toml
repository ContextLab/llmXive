[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-measuring-ep"
version = "0.1.0"
description = "Measuring Epistemic Resilience of LLMs Under Misleading Medical Context"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "scikit-learn",
    "statsmodels",
    "sentence-transformers",
    "llama-cpp-python",
    "pandas",
    "numpy",
    "tqdm",
    "biopython",
    "firth-logistic",
    "reference-validator"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | state
)/
'''

[tool.setuptools]
packages = ["code", "code.agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]