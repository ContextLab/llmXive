[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socratic-transformers"
version = "0.1.0"
description = "Socratic Transformers: Dialogue-Based Selection on Belief"
requires-python = ">=3.9"
dependencies = [
    "transformers==4.35.0",
    "peft==0.7.0",
    "bitsandbytes==0.41.0",
    "datasets==2.14.0",
    "scikit-learn==1.3.0",
    "pandas==2.0.0",
    "pytest==7.4.0",
    "tokenizers==0.14.0",
    "nltk==3.8.0",
    "psutil==5.9.0"
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
