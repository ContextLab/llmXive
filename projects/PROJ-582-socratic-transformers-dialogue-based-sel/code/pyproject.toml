[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socratic-transformers"
version = "0.1.0"
description = "Dialogue-Based Selection on Belief: Socratic Transformers Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.42.0",
    "datasets>=2.18.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "tokenizers>=0.15.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "spacy>=3.7.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''
