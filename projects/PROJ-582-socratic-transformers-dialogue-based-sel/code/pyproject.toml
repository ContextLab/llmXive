[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socratic-transformers"
version = "0.1.0"
description = "Dialogue-Based Selection on Belief Research Pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "transformers",
    "peft",
    "bitsandbytes",
    "datasets",
    "scikit-learn",
    "pandas",
    "pytest",
    "tokenizers",
    "nltk",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*"]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'
