# Ruff configuration file for Socratic Transformers project
# This file extends the settings in pyproject.toml for specific overrides
# or can be used as the primary config if pyproject.toml is not preferred.
# Currently, we rely on pyproject.toml for the main config, but this file
# ensures compatibility if tools look specifically for ruff.toml.

[lint]
# Ensure we select the same rules as defined in pyproject.toml for redundancy
select = [
    "E", "W", "F", "I", "C", "B", "UP", "N"
]
ignore = [
    "E501",
    "B008"
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[lint.per-file-ignores]
"tests/*" = ["S101"]
"src/**/__init__.py" = ["F401"]