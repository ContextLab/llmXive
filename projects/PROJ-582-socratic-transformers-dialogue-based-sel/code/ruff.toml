# Ruff configuration for Socratic Transformers project
# Extends settings from pyproject.toml but provides explicit overrides

line-length = 88
target-version = "py39"

exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".eggs",
    "venv",
    ".venv"
]

[lint]
# Enable specific rule sets
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH"   # flake8-use-pathlib
]

# Ignore specific rules that conflict with project style or are too strict
ignore = [
    "E501",  # Line too long (black handles this)
    "W291",  # Trailing whitespace
    "B904",  # Within an except clause, raise exceptions with raise ... from err
    "ARG002" # Unused method argument (sometimes needed for API compatibility)
]

# Per-file ignores
[lint.per-file-ignores]
"tests/*" = ["S101", "ARG001"]  # Allow assert in tests, unused args in fixtures
"src/utils/config.py" = ["ARG001"] # Config often has unused args for extensibility

[lint.isort]
known-first-party = ["src"]
known-third-party = [
    "datasets",
    "nltk",
    "pandas",
    "peft",
    "pytest",
    "scikit_learn",
    "tokenizers",
    "transformers",
    "bitsandbytes",
    "psutil"
]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
force-single-line = false
lines-after-imports = 2

[lint.pydocstyle]
convention = "google"

[lint.flake8-unused-arguments]
ignore-variadic-names = true