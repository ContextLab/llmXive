# Ruff configuration for PROJ-582
# This file is redundant with pyproject.toml but explicitly requested by T003
# to ensure legacy tooling compatibility.

line-length = 100
target-version = "py310"

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[lint.isort]
known-first-party = ["src", "tests"]
force-sort-within-sections = true

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "E501"]
"src/utils/model_loader.py" = ["B028"]
"src/train/train_loop.py" = ["S105", "S106"]