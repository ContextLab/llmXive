# Ruff configuration for Socratic Transformers project
# This file complements pyproject.toml with specific formatting rules

line-length = 88
indent-width = 4
target-version = "py310"

[lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM" # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "W503", # line break before binary operator
]

[lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in init files
"tests/*" = ["S101", "S311"] # Allow assert and random in tests

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint.isort]
known-first-party = ["src", "tests"]
force-sort-within-sections = true