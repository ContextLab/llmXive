# Ruff configuration for Socratic Transformers project
target-version = "py39"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[lint.isort]
known-first-party = ["src", "tests"]
force-to-top = ["src"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "ARG"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"