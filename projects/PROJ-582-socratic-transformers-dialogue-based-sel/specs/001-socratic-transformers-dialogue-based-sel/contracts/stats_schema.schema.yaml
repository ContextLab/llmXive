$schema: "http://json-schema.org/draft-07/schema#"
title: "Statistical Test Output Schema"
description: "Schema for statistical test results (Independent Samples t-test with Bonferroni correction)."
type: object
properties:
  comparison:
    type: string
    description: "Description of the comparison (e.g., 'selection_vs_ablation')."
  t_statistic:
    type: number
    description: "The calculated t-statistic."
  p_value:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "The raw p-value."
  p_value_corrected:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "The Bonferroni-corrected p-value."
  significant:
    type: boolean
    description: "True if the corrected p-value is less than 0.05."
  effect_size_cohen_d:
    type: number
    description: "Cohen's d effect size."
  mdes:
    type: number
    description: "Minimum Detectable Effect Size."
required:
  - comparison
  - t_statistic
  - p_value
  - p_value_corrected
  - significant
  - effect_size_cohen_d
  - mdes
additionalProperties: false