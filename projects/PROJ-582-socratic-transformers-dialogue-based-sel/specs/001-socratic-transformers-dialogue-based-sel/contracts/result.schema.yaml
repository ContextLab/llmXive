$schema: "http://json-schema.org/draft-07/schema#"
title: "Evaluation Result Schema (Deprecated)"
description: "This schema is deprecated. Use evaluation_result.schema.yaml instead."
type: "object"
properties:
  model_condition:
    type: "string"
    enum:
      - "A"
      - "B"
      - "C"
    description: "Training condition (A=Selection, B=Ablation, C=Static)"
  dataset:
    type: "string"
    enum:
      - "gsm8k"
      - "math"
  accuracy:
    type: "number"
    minimum: 0.0
    maximum: 1.0
  num_correct:
    type: "integer"
    minimum: 0
  total_samples:
    type: "integer"
    minimum: 1
  seed:
    type: "integer"
required:
  - "model_condition"
  - "dataset"
  - "accuracy"
  - "num_correct"
  - "total_samples"
  - "seed"