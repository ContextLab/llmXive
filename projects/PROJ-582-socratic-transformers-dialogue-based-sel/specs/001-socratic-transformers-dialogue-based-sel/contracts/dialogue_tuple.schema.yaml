$schema: "http://json-schema.org/draft-07/schema#"
title: "Dialogue Tuple Schema"
description: "Schema for Socratic training data tuples (question, answer, critique, revised_answer). Unified SSoT."
type: "object"
properties:
  sample_id:
    type: "string"
    description: "Unique UUID for the sample."
  condition:
    type: "string"
    enum:
      - "static"
      - "socratic"
      - "ablation"
    description: "Training condition label."
  question:
    type: "string"
    description: "The original problem statement."
  initial_answer:
    type: "string"
    description: "The model's first attempt at the answer."
  critique:
    type: "string"
    description: "Adversarial critique or neutral critique text."
  revised_answer:
    type: "string"
    description: "The final answer after critique (or initial answer if no critique)."
  critique_quality_score:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Quality score of the critique (for Socratic condition)."
  is_degenerate:
    type: "boolean"
    description: "True if the dialogue was truncated due to repetition."
  is_verified:
    type: "boolean"
    description: "True if revised_answer matches ground truth."
  metadata:
    type: "object"
    description: "Additional metadata (seed, threshold, model_version)."
    properties:
      seed:
        type: "integer"
      threshold:
        type: "number"
      model_version:
        type: "string"
      calibration_metrics:
        type: "object"
        description: "Metrics from Phase 0 calibration."
        properties:
          correlation:
            type: "number"
          threshold_used:
            type: "number"
required:
  - "sample_id"
  - "condition"
  - "question"
  - "initial_answer"
  - "revised_answer"
  - "critique"
  - "critique_quality_score"
  - "is_degenerate"
  - "is_verified"
additionalProperties: false