[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-project"
version = "0.1.0"
description = "LLM-driven science pipeline"
dependencies = [
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.30.0",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "statsmodels>=0.14.0",
    "pyyaml>=6.0",
    "datasets>=2.14.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
ignore = []
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
