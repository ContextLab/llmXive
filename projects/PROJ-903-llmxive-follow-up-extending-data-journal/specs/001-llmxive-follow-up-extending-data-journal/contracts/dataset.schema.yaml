$schema: http://json-schema.org/draft-07/schema#
title: Dataset Schema
description: Schema for the input dataset used in the Counterfactual Inspector Agent.
type: object
properties:
  dataset_id:
    type: string
    description: Unique identifier for the dataset (e.g., 'uci_har')
  source_url:
    type: string
    description: Verified URL or loader identifier for the dataset.
    pattern: "^https://|^datasets\\.load_dataset"
  row_count:
    type: integer
    minimum: 1
    description: Number of rows in the dataset.
  numeric_features:
    type: array
    items:
      type: string
    description: List of column names that are numeric.
  missing_value_strategy:
    type: string
    enum: ["mean", "median", "drop"]
    description: Strategy used for handling missing values.
required:
  - dataset_id
  - source_url
  - row_count
  - numeric_features
  - missing_value_strategy
additionalProperties: false
