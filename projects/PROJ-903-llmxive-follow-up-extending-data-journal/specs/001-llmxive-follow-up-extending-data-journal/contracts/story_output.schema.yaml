$schema: http://json-schema.org/draft-07/schema#
title: Integrated Story Output Schema
description: Schema for the final integrated story (US-3).
type: object
properties:
  title:
    type: string
    description: Title of the story.
  baseline_section:
    type: string
    description: The primary narrative generated by the baseline pipeline.
  counterfactual_section:
    type: string
    description: The section detailing alternative perspectives.
  citations:
    type: array
    items:
      type: string
    description: List of verifiable data query citations.
  caution_flags:
    type: array
    items:
      type: string
    description: List of flags (e.g., "Low Power - Interpret with Caution").
  neutrality_score:
    type: number
    minimum: 0
    maximum: 1
    description: Internal metric for neutrality of language.
required:
  - title
  - baseline_section
  - counterfactual_section
  - citations
  - caution_flags
  - neutrality_score
additionalProperties: false
