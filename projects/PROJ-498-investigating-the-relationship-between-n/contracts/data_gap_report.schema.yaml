type: object
properties:
  dataset_id:
    type: ["string", "null"]
    description: "The ID of the dataset found via API search, or null if none found."
  reason:
    type: string
    description: "A human-readable reason for the data gap."
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of when the report was generated."
  fallback_id:
    type: ["string", "null"]
    description: "The ID of the fallback dataset attempted, or null if not applicable."
required:
  - dataset_id
  - reason
  - timestamp
  - fallback_id