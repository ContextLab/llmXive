# Protocol for Sensory Deprivation Simulation Study
# T005: Defines simulation parameters and EXACT machine-readable values for thresholds

# Simulation Parameters
simulation:
  N: 200
  seed: 42
  effect_sizes:
    - "moderate positive"
    - "null"
    - "moderate negative"
  ICC: 0.3

# Threshold Definitions (FR-004 Compliance)
# These exact strings must be used in the 'condition' column
strict_threshold_label: "strict (complete isolation)"
moderate_threshold_label: "moderate (partial sensory reduction)"
partial_threshold_label: "partial (minimal sensory reduction)"

# Data Generation Parameters
data_generation:
  recall_probability_base: 0.5
  bizarreness_range: [1, 7]
  deprivation_intensity_scale: [0.0, 1.0]

# Output Configuration
output:
  processed_dir: "data/processed"
  synthetic_dir: "data/synthetic"
  raw_dir: "data/raw"
