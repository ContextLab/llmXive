# Configuration for stability thresholds
# These values are used to label episodes as stable (1) or unstable (0)
thresholds:
  tipping_angle_threshold: 0.15  # radians (approx 8.6 degrees)
  slippage_distance_threshold: 0.05  # meters (5 cm)

# Simulation parameters
simulation:
  time_step: 0.004166666666666667  # 1/240 seconds
  max_steps: 100
  gravity: -9.81

# Data generation parameters
data_generation:
  num_episodes: 5000
  noise_scale: 1.0

# Sensitivity analysis parameters (for T018)
sensitivity:
  threshold_sweep_range: 0.05  # 5% variation
  num_sweeps: 10
