# Configuration for llmXive Physics Simulation and Stability Labeling
# This file defines deterministic random seed, labeling thresholds,
# and sensitivity‑analysis noise levels (σ in degrees).

# Deterministic random seed for reproducibility
random_seed: 42

# Labeling thresholds
tipping_angle: 15.0          # Degrees: max allowable tilt before tipping
slippage_distance: 0.02     # Meters: max allowable slip before instability

# Sensitivity analysis noise levels (σ) in degrees
sensitivity_noise_levels: [0.0, 0.25, 0.5, 0.75, 1.0]

# Existing simulation parameters (retained for compatibility)
physics_metrics:
  tipping_angle_threshold: 15.0  # Degrees
  slippage_distance_threshold: 0.02  # Meters

simulation:
  gravity: 9.81
  time_step: 0.01
  max_steps_per_episode: 500
  num_episodes: 5000

data_generation:
  object_geometries:
    - "box_small"
    - "box_medium"
    - "box_large"
    - "cylinder_small"
    - "cylinder_large"
    - "sphere_small"
    - "sphere_large"
  noise_amplitude: 0.005  # Meters: Gaussian noise on wrist translation

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  raw_file: "synthetic_episodes.parquet"
  train_file: "train.parquet"
  test_file: "test.parquet"
  checksum_file: "data/checksums.json"
  model_dir: "data/processed"

sensitivity:
  enabled: true
  threshold_variation_percent: 5.0  # ±5% variation for robustness checks