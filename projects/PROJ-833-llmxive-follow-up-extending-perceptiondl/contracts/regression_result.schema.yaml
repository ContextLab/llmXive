$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Result Schema"
description: "Schema for the final regression analysis output containing metrics across region counts."
type: object
required:
  - experiment_id
  - configuration
  - results
properties:
  experiment_id:
    type: string
    description: "Unique identifier for the experimental run."
  configuration:
    type: object
    required:
      - model_name
      - region_bins
      - bonferroni_corrected
    properties:
      model_name:
        type: string
        description: "Name of the model used (e.g., 'PerceptionDLM')."
      region_bins:
        type: array
        items:
          type: integer
        description: "List of region counts tested (e.g., [20, 25, 30...])."
      bonferroni_corrected:
        type: boolean
        description: "Whether Bonferroni correction was applied to significance tests."
      threshold:
        type: number
        description: "Configured threshold for the tipping point analysis."
  results:
    type: array
    description: "Aggregated metrics for each region count bin."
    items:
      type: object
      required:
        - region_count
        - parallel_metrics
        - sequential_metrics
        - statistical_significance
      properties:
        region_count:
          type: integer
        parallel_metrics:
          type: object
          required:
            - mean_coherence
            - std_coherence
            - mean_bleu
            - mean_inference_time
          properties:
            mean_coherence:
              type: number
            std_coherence:
              type: number
            mean_bleu:
              type: number
            mean_inference_time:
              type: number
        sequential_metrics:
          type: object
          required:
            - mean_coherence
            - std_coherence
            - mean_bleu
            - mean_inference_time
          properties:
            mean_coherence:
              type: number
            std_coherence:
              type: number
            mean_bleu:
              type: number
            mean_inference_time:
              type: number
        statistical_significance:
          type: object
          required:
            - p_value
            - is_significant
            - corrected_p_value
          properties:
            p_value:
              type: number
            is_significant:
              type: boolean
            corrected_p_value:
              type: number
              description: "P-value after Bonferroni correction."
        tipping_point_indicator:
          type: boolean
          description: "True if this region count is the identified tipping point."
additionalProperties: false
