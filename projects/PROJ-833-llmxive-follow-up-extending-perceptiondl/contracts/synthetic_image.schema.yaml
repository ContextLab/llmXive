$schema: http://json-schema.org/draft-07/schema#
title: Synthetic Image Annotation Schema
description: >
  Defines the structure for JSON annotation files generated by the synthetic image pipeline.
  Contains metadata about the source image, region counts, and detailed bounding box information
  with derived spatial relations.
type: object
required:
  - metadata
  - regions
properties:
  metadata:
    type: object
    required:
      - source_image_id
      - region_count
      - generation_seed
      - image_dimensions
      - timestamp
    properties:
      source_image_id:
        type: string
        description: Unique identifier of the source image from the dataset
      region_count:
        type: integer
        minimum: 1
        description: Number of non-overlapping regions placed on the image
      generation_seed:
        type: integer
        description: Random seed used for reproducibility
      image_dimensions:
        type: object
        required:
          - width
          - height
        properties:
          width:
            type: integer
            minimum: 1
          height:
            type: integer
            minimum: 1
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation
      source_dataset:
        type: string
        description: Name of the source dataset (e.g., "ParaDLC-Bench", "COCO-Stuff")
      config:
        type: object
        description: Configuration parameters used for this generation run
        properties:
          retry_limit:
            type: integer
          max_attempts:
            type: integer
          min_overlap_threshold:
            type: number
            minimum: 0.0
            maximum: 1.0
  regions:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - bbox
        - centroid
        - spatial_relations
      properties:
        id:
          type: integer
          description: Unique region identifier within this image
        label:
          type: string
          description: Semantic label of the region (from source dataset)
        bbox:
          type: object
          required:
            - x
            - y
            - width
            - height
          properties:
            x:
              type: integer
              description: Top-left x coordinate
            y:
              type: integer
              description: Top-left y coordinate
            width:
              type: integer
              minimum: 1
            height:
              type: integer
              minimum: 1
        centroid:
          type: object
          required:
            - x
            - y
          properties:
            x:
              type: number
              description: Centroid x coordinate
            y:
              type: number
              description: Centroid y coordinate
        spatial_relations:
          type: array
          description: Derived spatial prepositions relative to other regions
          items:
            type: object
            required:
              - target_id
              - relation
            properties:
              target_id:
                type: integer
                description: ID of the target region
              relation:
                type: string
                enum:
                  - left of
                  - right of
                  - above
                  - below
                  - top-left of
                  - top-right of
                  - bottom-left of
                  - bottom-right of
                  - near
                  - far
                description: Spatial preposition describing the relationship
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Confidence score for the region placement
additionalProperties: false
