[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-interoception"
version = "0.1.0"
description = "Impact of Interoceptive Awareness on Emotional Regulation"
requires-python = ">=3.8"
dependencies = [
    "pandas==2.0.3",
    "numpy==1.24.3",
    "scikit-learn==1.3.0",
    "hrv-analysis==1.1.0",
    "pybids==0.16.5",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "jsonschema==4.19.0",
    "statsmodels==0.14.0",
    "scipy==1.11.0"
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.flake8]
max-line-length = 88
extend-ignore = ['E203', 'W503']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
