$schema: http://json-schema.org/draft-07/schema#
title: BIDS events.tsv Schema
description: JSON Schema for validating BIDS events.tsv files.
type: object
properties:
  task:
    type: string
    description: The name of the task.
    enum:
      - Schandry
      - heartbeat
      - TSST
      - rest
      - resting
      - baseline
  onset:
    type: number
    description: The onset time of the event in seconds.
  duration:
    type: number
    description: The duration of the event in seconds.
  value:
    type: number
    description: Optional value associated with the event.
  trial_type:
    type: string
    description: Optional trial type label.
required:
  - task
  - onset
  - duration
