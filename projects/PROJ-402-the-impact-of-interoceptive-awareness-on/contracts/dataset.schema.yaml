$schema: "http://json-schema.org/draft-07/schema#"
title: "BIDS events.tsv schema for interoception/stress tasks"
description: "JSON Schema for validating BIDS events.tsv files in the interoception study."
type: "object"
properties:
  task:
    type: "string"
    description: "The task label for the event."
    enum:
      - "Schandry"
      - "heartbeat"
      - "TSST"
      - "rest"
      - "baseline"
  onset:
    type: "number"
    description: "Time of event onset in seconds."
  duration:
    type: "number"
    description: "Duration of the event in seconds."
  value:
    type: "number"
    description: "Optional value associated with the event (e.g., heart rate)."
  trial_type:
    type: "string"
    description: "Optional trial type classification."
required:
  - "task"
  - "onset"
  - "duration"
