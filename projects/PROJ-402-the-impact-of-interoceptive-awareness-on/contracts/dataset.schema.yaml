$schema: http://json-schema.org/draft-07/schema#
title: BIDS Events TSV Schema
description: Schema for validating BIDS events.tsv files in the interoceptive awareness project.
type: object
properties:
  task:
    type: string
    description: Name of the task. Must be one of the allowed values.
    enum:
      - Schandry
      - heartbeat
      - TSST
      - rest
      - baseline
  onset:
    type: number
    description: Start time of the event in seconds.
    minimum: 0
  duration:
    type: number
    description: Duration of the event in seconds.
    minimum: 0
  value:
    type: number
    description: Optional value associated with the event (e.g., heart rate).
  trial_type:
    type: string
    description: Optional trial type classification.
required:
  - task
  - onset
  - duration
additionalProperties: true
