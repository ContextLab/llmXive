$schema: http://json-schema.org/draft-07/schema#
title: BIDS Events Schema
description: JSON Schema for validating BIDS events.tsv files for the interoceptive awareness project.
type: object
required:
  - task
  - onset
  - duration
properties:
  task:
    type: string
    description: The name of the task during which the event occurred.
    enum:
      - Schandry
      - heartbeat
      - TSST
      - rest
      - baseline
  onset:
    type: number
    description: Time of event onset in seconds.
  duration:
    type: number
    description: Duration of the event in seconds.
  value:
    type: number
    description: Optional value associated with the event (e.g., stimulus intensity).
  trial_type:
    type: string
    description: Optional label for the trial type.
