$schema: "http://json-schema.org/draft-07/schema#"
title: BIDS Events TSV Schema
description: Schema for validating BIDS events.tsv files for interoceptive awareness tasks.
type: object
properties:
  task:
    type: string
    enum:
      - Schandry
      - heartbeat
      - TSST
      - rest
      - resting
      - baseline
    description: The task name as defined in the BIDS dataset.
  onset:
    type: number
    description: Onset time in seconds relative to the start of the task.
  duration:
    type: number
    description: Duration of the event in seconds.
  value:
    type: number
    description: Optional value associated with the event (e.,g., intensity).
  trial_type:
    type: string
    description: Optional label for the specific trial type.
required:
  - task
  - onset
  - duration
