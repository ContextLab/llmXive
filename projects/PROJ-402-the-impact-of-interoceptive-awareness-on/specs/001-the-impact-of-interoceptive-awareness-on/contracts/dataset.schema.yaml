$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Audit Result"
type: "object"
properties:
  dataset_name:
    type: "string"
    description: "Name of the dataset scanned (e.g., WESAD, OpenNeuro)"
  search_terms:
    type: "array"
    items:
      type: "string"
    description: "Keywords searched (e.g., 'Schandry', 'TSST')"
  results:
    type: "array"
    items:
      type: "object"
      properties:
        term:
          type: "string"
        found:
          type: "boolean"
        evidence_path:
          type: "string"
          description: "Path to the file containing the evidence or 'N/A' if not found"
      required:
        - term
        - found
        - evidence_path
required:
  - dataset_name
  - search_terms
  - results