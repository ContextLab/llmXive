[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-interoception-study"
version = "0.1.0"
description = "Impact of Interoceptive Awareness on Emotional Regulation"
requires-python = ">=3.9"
dependencies = [
    "pandas==2.0.3",
    "numpy==1.24.3",
    "scikit-learn==1.3.0",
    "hrv-analysis==1.1.0",
    "pybids==0.16.5",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "jsonschema==4.19.0",
    "statsmodels==0.14.0",
]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.flake8]
max-line-length = 100
extend-ignore = "E203, E501"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]
per-file-ignores = [
    "__init__.py:F401",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools]
packages = ["code", "code.utils", "tests"]
package-dir = {"" = "code"}