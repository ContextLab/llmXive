$schema: "http://json-schema.org/draft-07/schema#"
title: "Evaluation Report Schema"
type: object
required:
  - report_version
  - generated_at
  - runtime_seconds
  - memory_peak_gb
  - tests
  - multiple_comparison_correction
properties:
  report_version:
    type: string
    description: "Semantic version of the report format."
  generated_at:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp of report generation."
  runtime_seconds:
    type: integer
    minimum: 0
    description: "Total wall‑clock time of the entire pipeline."
  memory_peak_gb:
    type: number
    minimum: 0
    description: "Peak RAM usage in gigabytes."
  tests:
    type: object
    required:
      - primary
      - robustness
    properties:
      primary:
        $ref: "#/definitions/test_result"
      robustness:
        $ref: "#/definitions/test_result"
  multiple_comparison_correction:
    type: object
    required:
      - method
      - alpha
      - adjusted_p_values
    properties:
      method:
        type: string
        enum: ["benjamini_hochberg", "bonferroni"]
      alpha:
        type: number
        minimum: 0
        maximum: 1
      adjusted_p_values:
        type: object
        required:
          - primary
          - robustness
        properties:
          primary:
            type: number
            minimum: 0
            maximum: 1
          robustness:
            type: number
            minimum: 0
            maximum: 1
definitions:
  test_result:
    type: object
    required:
      - test_name
      - method
      - p_value
      - effect_size
      - ci_95
      - corrected
    properties:
      test_name:
        type: string
      method:
        type: string
        enum: ["paired_t_test", "wilcoxon"]
      p_value:
        type: number
        minimum: 0
        maximum: 1
      effect_size:
        type: number
        description: "Cohen's d for t‑test or rank‑biserial for Wilcoxon."
      ci_95:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: number
      corrected:
        type: boolean
        description: "True if p‑value has been corrected for multiple comparisons."