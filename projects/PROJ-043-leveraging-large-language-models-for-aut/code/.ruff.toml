# Ruff configuration for llmXive
# Enforces rules E (pycodestyle errors), F (pyflakes), W (pycodestyle warnings), I (isort)

[lint]
# Enable specific rule sets
select = ["E", "F", "W", "I"]

# Ignore specific rules if necessary (add to this list as needed)
ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude a few specific directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 100
target-version = "py311"

[lint.per-file-ignores]
# Ignore specific rules for specific files if needed
"__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["config", "data", "llm", "models", "utils"]
force-sort-within-sections = false
lines-after-imports = 2