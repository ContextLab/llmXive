# Ruff configuration for llm-refactoring-pipeline
# This file extends settings from pyproject.toml for specific overrides if needed,
# but primarily pyproject.toml is the source of truth.

# Enable specific rule sets
# E: pycodestyle errors
# F: Pyflakes
# W: pycodestyle warnings
# I: isort (import sorting)
select = ["E", "F", "W", "I"]

# Ignore specific rules if necessary (add only if justified)
ignore = []

# Line length matching black
line-length = 100

# Target Python version
target-version = "py311"

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "data",
]

# Per-file ignores
[per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in __init__.py for exports

# Isort configuration
[isort]
known-first-party = ["config", "data", "llm", "models", "utils"]
force-sort-within-sections = true
lines-after-imports = 2
