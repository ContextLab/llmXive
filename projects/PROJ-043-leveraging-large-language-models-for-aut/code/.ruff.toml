# Ruff configuration file (redundant with pyproject.toml but explicitly requested by task T003)
# This file ensures ruff picks up settings if run with `--config .ruff.toml`

line-length = 88
target-version = "py311"
src = ["code"]

[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), Warnings (`W`), and isort (`I`).
select = ["E", "F", "W", "I"]
ignore = []

fixable = ["ALL"]
unfixable = []

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "data",
    "paper",
]

[lint.per-file-ignores]
"code/__init__.py" = ["F401"]
"tests/__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["config", "models", "utils", "data", "llm"]
