# Ruff Configuration for LLM Refactoring Research
# This file acts as a local override or extension if needed,
# though primary config is in pyproject.toml.

extend = "pyproject.toml"

[lint]
# Ensure specific rules are active
select = ["E", "F", "W", "I"]

# Ignore specific false positives if necessary (none currently)
ignore = []

[lint.isort]
known-first-party = ["config", "models", "utils", "data", "llm"]

[format]
# Consistent with Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
