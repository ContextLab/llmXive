[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-refactoring"
version = "0.1.0"
description = "Leveraging Large Language Models for Automated Code Refactoring"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.14.0",
    "pydantic>=1.10.0",
    "radon>=6.0.0",
    "pylint>=3.0.0",
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pytest>=7.4.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.setuptools]
packages = ["code", "code.data", "code.llm", "code.models", "code.utils"]

[tool.setuptools.package-dir]
"" = "code"
