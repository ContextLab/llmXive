[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-refactoring-pipeline"
version = "0.1.0"
description = "Automated code refactoring using Large Language Models"
requires-python = ">=3.11"
dependencies = [
    "datasets==2.18.0",
    "transformers==4.38.0",
    "radon==6.0.1",
    "pylint==3.0.3",
    "scikit-learn==1.4.0",
    "statsmodels==0.14.1",
    "pandas==2.2.0",
    "numpy==1.26.4",
    "requests==2.31.0",
    "pydantic==2.6.1",
    "pytest==7.4.4",
    "ruff==0.1.6",
    "black==23.12.1",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
]
ignore = []
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
