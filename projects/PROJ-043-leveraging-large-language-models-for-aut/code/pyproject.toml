[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-refactoring-research"
version = "0.1.0"
description = "Leveraging Large Language Models for Automated Code Refactoring"
requires-python = ">=3.11"
dependencies = [
    "datasets==2.18.0",
    "transformers==4.38.0",
    "radon==6.0.1",
    "pylint==3.0.3",
    "scikit-learn==1.4.0",
    "statsmodels==0.14.1",
    "pandas==2.2.0",
    "numpy==1.26.4",
    "requests==2.31.0",
    "pydantic==2.6.1",
    "pytest==7.4.4",
    "pyyaml==6.0.1",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
