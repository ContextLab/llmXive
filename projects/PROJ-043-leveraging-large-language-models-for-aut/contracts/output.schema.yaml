$schema: "http://json-schema.org/draft-07/schema#"
title: Output Schema
type: object
properties:
  code:
    type: string
    description: Original or refactored code
  hash:
    type: string
    description: SHA256 hash of the code
  loc:
    type: integer
    description: Lines of code
  nesting_depth:
    type: integer
    description: Maximum nesting depth
  param_count:
    type: integer
    description: Number of parameters
  pep8_violations:
    type: integer
    description: Count of PEP-8 violations
  pep8_adherence_score:
    type: number
    description: Normalized PEP-8 adherence score (0-1)
  maintainability_index:
    type: number
    description: Maintainability index
  docstring_present:
    type: boolean
    description: Whether a docstring is present
  delta_complexity:
    type: number
    description: Change in cyclomatic complexity
  delta_pylint:
    type: number
    description: Change in pylint score
  delta_maintainability:
    type: number
    description: Change in maintainability index
required:
  - code
  - hash
