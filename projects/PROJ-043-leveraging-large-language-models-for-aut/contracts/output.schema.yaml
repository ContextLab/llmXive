$schema: "http://json-schema.org/draft-07/schema#"
title: "Raw Metrics Output Schema"
description: "Schema for the output of the static analysis pipeline (User Story 1)."
type: array
items:
  type: object
  required:
    - code
    - hash
    - loc
    - nesting_depth
    - param_count
    - pep8_violations
    - maintainability_index
    - docstring_present
  properties:
    code:
      type: string
      description: "The original Python function source code."
    hash:
      type: string
      description: "SHA-256 hash of the code string for deduplication and caching."
    loc:
      type: integer
      description: "Lines of Code."
      minimum: 0
    nesting_depth:
      type: integer
      description: "Maximum nesting depth of control structures."
      minimum: 0
    param_count:
      type: integer
      description: "Number of parameters in the function signature."
      minimum: 0
    pep8_violations:
      type: integer
      description: "Count of PEP-8 style violations."
      minimum: 0
    maintainability_index:
      type: number
      description: "Maintainability Index score (0-100)."
      minimum: 0
      maximum: 100
    docstring_present:
      type: boolean
      description: "Whether the function has a docstring."
  additionalProperties: false
