$schema: "http://json-schema.org/draft-07/schema#"
title: Config Schema
type: object
properties:
  HF_API_KEY:
    type: ["string", "null"]
    description: Hugging Face API Key
  RANDOM_SEED:
    type: integer
    default: 42
  MAX_ATTEMPTS:
    type: integer
    default: 400
  MIN_VALID_FUNCTIONS:
    type: integer
    default: 100
  TARGET_VALID_FUNCTIONS:
    type: integer
    default: 200
  BATCH_SIZE:
    type: integer
    default: 10
  BASELINE_TOLERANCE:
    type: number
    default: 0.01
required: []
