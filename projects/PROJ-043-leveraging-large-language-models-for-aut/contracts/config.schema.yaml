$schema: "http://json-schema.org/draft-07/schema#"
title: ConfigSchema
description: "Schema for the configuration snapshot used to validate experiment parameters."
type: object
properties:
  hf_api_key:
    type: string
    description: "Hugging Face API key (masked in logs)."
    minLength: 1
  random_seed:
    type: integer
    description: "Random seed for reproducibility."
    default: 42
  max_attempts:
    type: integer
    description: "Maximum number of attempts to fetch valid samples."
    minimum: 1
    default: 50
  min_valid_functions:
    type: integer
    description: "Minimum number of valid functions required to proceed."
    minimum: 100
    default: 100
  batch_size:
    type: integer
    description: "Batch size for LLM processing."
    minimum: 1
    default: 10
  log_level:
    type: string
    description: "Logging level."
    enum: ["DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"]
    default: "INFO"
required:
  - hf_api_key
  - random_seed
  - max_attempts
  - min_valid_functions
  - batch_size
  - log_level
additionalProperties: false
