$schema: http://json-schema.org/draft-07/schema#
title: LLM Refactoring Configuration
description: Configuration schema for the LLM Refactoring Pipeline
type: object
properties:
  hf_api_key:
    type: string
    description: HuggingFace API Key
    pattern: "^hf_"
  random_seed:
    type: integer
    description: Random seed for reproducibility
    minimum: 0
    default: 42
  max_attempts:
    type: integer
    description: Maximum attempts to fetch valid data
    minimum: 1
    default: 400
  min_valid_functions:
    type: integer
    description: Minimum number of valid functions required
    minimum: 1
    default: 100
  batch_size:
    type: integer
    description: Batch size for LLM API calls
    minimum: 1
    maximum: 10
    default: 10
required:
  - hf_api_key
