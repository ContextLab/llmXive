$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  experiment_id:
    type: string
    description: "Unique ID for the experiment run"
  timestamp:
    type: string
    format: date-time
    description: "UTC timestamp of the run"
  datasets:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        spatial_mean:
          type: number
        spatial_std:
          type: number
        non_spatial_mean:
          type: number
        non_spatial_std:
          type: number
        p_value:
          type: number
        effect_size:
          type: number
        ci_lower:
          type: number
        ci_upper:
          type: number
        interference_spatial:
          type: number
        interference_non_spatial:
          type: number
required:
  - experiment_id
  - timestamp
  - datasets
