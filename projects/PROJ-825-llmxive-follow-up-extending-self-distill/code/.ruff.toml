[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = [
  "E501", # Line too long (handled by black)
  "F401", # Unused imports (handled by ruff check --fix or manual review)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude a few specific files/directories
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "data",
  "state",
  "figures",
]

# Per-file ignores
[lint.per-file-ignores]
"code/tests/*" = ["S101"] # Allow asserts in tests

[lint.isort]
known-first-party = ["agents", "environments", "metrics", "utils", "config", "tests"]
force-sort-within-sections = true
combine-as-imports = true
