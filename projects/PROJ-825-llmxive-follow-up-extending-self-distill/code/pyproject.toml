[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-self-distill"
version = "0.1.0"
description = "LLM-Xive follow-up: extending Self-Distilled Agentic Reinforcement Learning"
requires-python = ">=3.9"
dependencies = [
    "transformers>=4.40.0",
    "datasets>=2.14.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "pi",
    "alfworld>=0.3.0",
    "webshop>=0.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.nox
    | \.pants\.d
    | \.ruff_cache
    | \.svn
    | \.tox
    | \.venv
    | __pypackages__
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | venv
    | data
    | state
    | figures
)/
'''

[tool.ruff]
# Same as .ruff.toml but for CLI invocation if needed
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: unit tests",
    "integration: integration tests",
]
