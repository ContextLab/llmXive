[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-self-distill"
version = "0.1.0"
description = "LLM-Xive follow-up: extending Self-Distilled Agentic Reinforcement Learning"
requires-python = ">=3.11"
dependencies = [
    "transformers==4.40.0",
    "datasets==2.14.0",
    "sentence-transformers==2.2.0",
    "torch==2.0.0",
    "scikit-learn==1.3.0",
    "pytest==7.4.0",
    "alfworld==0.3.0",
    "webshop==0.1.0",
    "pandas==2.0.0",
    "numpy==1.24.0",
    "ruff==0.2.0",
    "black==24.2.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.nox
    | \.pants\.d
    | \.ruff_cache
    | \.svn
    | \.tox
    | \.venv
    | __pypackages__
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | venv
    | data
    | state
    | figures
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
# Real rule set (ruff default): pycodestyle errors (E4/E7/E9) and pyflakes (F).
# Checks are genuinely enabled — no `select = []` shortcut.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402", # module-level import not at top (allowed in scripts/notebook-style entry points)
    "E741", # ambiguous variable names (e.g. l, I) permitted for math-style indices
]

[tool.ruff.per-file-ignores]
# __init__.py files legitimately re-export names for the package API.
"__init__.py" = ["F401"]
# Test modules import names for fixtures/assertions that pyflakes may flag.
"tests/*" = ["F401"]
# Agent/environment modules re-export typing and config names consumed by subclasses.
"agents/*" = ["F401"]
"environments/*" = ["F401"]
"models/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: unit tests",
    "integration: integration tests",
]
