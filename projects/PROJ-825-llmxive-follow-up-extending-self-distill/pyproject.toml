[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-research"
version = "0.1.0"
description = "llmXive automated science pipeline research implementation"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40.0",
    "datasets>=2.14.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "pi",
    "alfworld>=0.3.0",
    "webshop>=0.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "black>=24.0.0",
    "pytest>=7.0.0",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = ["code/"]
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | venv
)/
'''

[tool.pypytest]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
