$schema: "http://json-schema.org/draft-07/schema#"
title: TrainingRun
description: Schema for a single step or episode record in a training run.
type: object
properties:
  variant:
    type: string
    description: The agent variant (e.g., grpo, baseline, student-only).
  env:
    type: string
    description: The environment name (e.g., alfworld, webshop).
  seed:
    type: integer
    description: The random seed used for the run.
  step:
    type: integer
    description: The current training step.
  reward:
    type: number
    description: The cumulative reward for the current episode.
  cpu_time_sec:
    type: number
    description: CPU time spent in the current step.
  peak_memory_mb:
    type: number
    description: Peak RSS memory usage in MB.
  run_id:
    type: string
    description: Unique identifier for the training run.
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the log entry.
required:
  - variant
  - env
  - seed
  - step
  - reward
  - cpu_time_sec
  - peak_memory_mb
  - run_id
  - timestamp
