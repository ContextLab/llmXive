{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "title": "TrainingRun",
  "type": "object",
  "properties": {
    "run_id": {
      "type": "string",
      "description": "Unique identifier for the logging run, generated by the logger."
    },
    "timestamp": {
      "type": "string",
      "format": "date-time",
      "description": "ISO‑8601 timestamp when the record was created."
    }
  },
  "required": ["run_id", "timestamp"],
  "additionalProperties": true
}
