# JSON Schema for TrainingRun records
# The schema captures the required metadata injected by the logger
# (run_id and timestamp) and allows optional experiment-specific fields.
$schema: "http://json-schema.org/draft-07/schema#"
title: TrainingRun
type: object
properties:
  run_id:
    type: string
    description: Unique identifier for the logger/run instance.
  timestamp:
    type: string
    format: date-time
    description: ISO‑8601 timestamp when the record was logged.
  variant:
    type: string
    description: Experiment variant (e.g., "student-only", "baseline").
  env:
    type: string
    description: Environment name (e.g., "alfworld").
  seed:
    type: integer
    description: Random seed used for the run.
  step:
    type: integer
    description: Training step index.
  reward:
    type: number
    description: Reward obtained at this step.
  cpu_time_sec:
    type: number
    description: CPU time consumed for the step (seconds).
  peak_memory_mb:
    type: number
    description: Peak RSS memory observed for the step (megabytes).
required:
  - run_id
  - timestamp
additionalProperties: true
