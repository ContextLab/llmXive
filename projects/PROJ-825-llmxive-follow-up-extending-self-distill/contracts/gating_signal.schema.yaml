$schema: "http://json-schema.org/draft-07/schema#"
title: GatingSignal
description: Schema for the gating signal computed at a specific token.
type: object
properties:
  entropy:
    type: number
    description: Token entropy (H_t).
  stability:
    type: number
    description: Context stability (S_t).
  final_score:
    type: number
    description: The final sigmoid gate value (g_t).
  run_id:
    type: string
    description: Unique identifier for the training run.
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the log entry.
required:
  - run_id
  - timestamp
