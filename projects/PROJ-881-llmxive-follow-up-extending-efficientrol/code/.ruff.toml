# Ruff configuration file
# This file extends the settings defined in pyproject.toml
# Specific overrides for the project can be added here

[lint]
# Enable specific rules that might be too verbose in pyproject.toml
select = [
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
]
ignore = [
    "SIM102", # collapsible-if (sometimes reduces readability)
]

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
