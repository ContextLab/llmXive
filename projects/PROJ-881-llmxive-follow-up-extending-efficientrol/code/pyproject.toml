[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "Entropy-Guided Validity Prediction in RL Rollouts"
requires-python = ">=3.10"
dependencies = [
    "transformers==4.40.0",
    "torch==2.3.0",
    "datasets==2.18.0",
    "scikit-learn==1.4.2",
    "pandas==2.2.1",
    "numpy==1.26.4",
    "h5py==3.11.0",
    "pytest==8.1.1",
    "statsmodels==0.14.2",
    "psutil==5.9.8",
    "huggingface_hub==0.22.2",
    "pymer4==0.12.0",
    "minigrid==2.3.1",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # assertions allowed in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
