[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "Entropy-Guided Validity Prediction in RL Rollouts"
requires-python = ">=3.9"
dependencies = [
    "transformers",
    "torch",
    "datasets",
    "scikit-learn",
    "pandas",
    "numpy",
    "h5py",
    "pytest",
    "statsmodels",
    "psutil",
    "huggingface_hub"
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
  | results
  | logs
)/
'''

[tool.ruff]
# Same as Black.
line-length = 88
target-version = "py39"
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "data",
    "results",
    "logs",
    "state"
]

[tool.ruff.lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in dataclasses)
    "SIM105" # Use contextlib.suppress
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # Allow assert in tests

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "tests"]
force-single-line = false
lines-after-imports = 2
