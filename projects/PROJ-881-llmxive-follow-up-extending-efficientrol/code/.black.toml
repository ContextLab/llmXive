# Black Configuration
# Note: Black primarily reads from pyproject.toml, but this file
# ensures settings are available if pyproject.toml is not found
# or for editor plugins that specifically look for .black.toml.

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
)/
'''
# Ensure consistent line endings
force-exclude = false
# Skip magic trailing comma
skip-magic-trailing-comma = false
# Ensure stable sorting
stable = true