# Black configuration file
# This file is read by Black as a fallback if pyproject.toml is not found
# or for specific tooling that prefers dedicated config files.
# Note: Black primarily reads from [tool.black] in pyproject.toml.

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''
# Force the configuration to match pyproject.toml exactly for consistency
# in case a tool loads this file specifically.