$schema: http://json-schema.org/draft-07/schema#
title: Merged Dataset Schema (US1/US2)
description: >
  Schema for the merged dataset produced by T019 (US1) and consumed by T025 (US2).
  This schema defines the structure for records combining token sequences, validity labels,
  and metadata required for entropy-guided validity prediction analysis.
type: object
required:
  - prompt_id
  - task_type
  - sequence_length
  - token_index
  - token
  - validity
  - generation_model
  - ground_truth_source
properties:
  prompt_id:
    type: string
    description: >
      Unique identifier for the prompt/sequence instance.
      Used to join generation outputs with ground truth labels.
      Example: "gsm8k_problem_123" or "minigrid_env_456"
    minLength: 1
  task_type:
    type: string
    description: >
      The source dataset/task type for this record.
      Used for stratification in analysis (T030, T035).
    enum:
      - gsm8k
      - minigrid
  sequence_length:
    type: integer
    description: >
      Total length of the generated sequence for this prompt_id.
      Used for decay analysis (T035) to split short vs long sequences.
    minimum: 1
  token_index:
    type: integer
    description: >
      0-based index of this token within the sequence.
      Used to align tokens with ground truth and entropy profiles.
    minimum: 0
  token:
    type: string
    description: >
      The actual generated token string at this position.
      Used for semantic alignment checks (T001a, T001b).
    minLength: 1
  validity:
    type: boolean
    description: >
      Binary validity label for this token position.
      True if the token matches the ground truth path/solution, False otherwise.
      Determined by T015 logic (exact match for GSM8K, path membership for MiniGrid).
  generation_model:
    type: string
    description: >
      Identifier of the model used for generation (e.g., "Qwen1.5-1.5B", "Qwen1.5-7B-Int4").
      Populated from T012c/T013 model selection results.
    minLength: 1
  ground_truth_source:
    type: string
    description: >
      Reference to the ground truth file used for labeling.
      Typically "data/canonical_ground_truth.jsonl".
    minLength: 1
  timestamp:
    type: string
    format: date-time
    description: >
      ISO 8601 timestamp of when this record was generated/merged.
      For provenance tracking.
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
  metadata:
    type: object
    description: >
      Optional additional metadata fields.
      May include: original_prompt, raw_answer, environment_config, etc.
      Allowed to have additional properties.
    additionalProperties: true
additionalProperties: false
examples:
  - prompt_id: "gsm8k_12345"
    task_type: "gsm8k"
    sequence_length: 42
    token_index: 0
    token: "Let"
    validity: true
    generation_model: "Qwen1.5-1.5B"
    ground_truth_source: "data/canonical_ground_truth.jsonl"
    timestamp: "2024-01-15T10:30:00Z"
    metadata:
      original_prompt: "If John has 5 apples and buys 3 more..."
  - prompt_id: "minigrid_67890"
    task_type: "minigrid"
    sequence_length: 15
    token_index: 3
    token: "move_forward"
    validity: true
    generation_model: "Qwen1.5-7B-Int4"
    ground_truth_source: "data/canonical_ground_truth.jsonl"
    timestamp: "2024-01-15T10:31:00Z"
    metadata:
      environment: "MiniGrid-Empty-5x5-v0"
      goal_state: "agent_at_4,4"