$schema: "http://json-schema.org/draft-07/schema#"
title: "Entropy Profile Schema"
description: "Schema for raw entropy extraction output before merging."
type: "object"
required:
  - "prompt_id"
  - "token_sequence"
  - "entropy_vectors"
properties:
  prompt_id:
    type: "string"
    description: "Unique identifier for the prompt."
  token_sequence:
    type: "array"
    items:
      type: "integer"
    description: "List of token IDs generated."
  entropy_vectors:
    type: "array"
    description: "List of entropy vectors, one per token."
    items:
      type: "array"
      description: "Entropy values for each layer for a single token."
      items:
        type: "number"
additionalProperties: false
