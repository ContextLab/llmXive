$schema: "http://json-schema.org/draft-07/schema#"
title: "EntropyProfile"
description: "Schema for intermediate layer entropy profiles extracted from transformer models."
type: "object"
required:
  - "prompt_id"
  - "token_sequence"
  - "entropy_vectors"
properties:
  prompt_id:
    type: "string"
    description: "Unique identifier for the token sequence."
  token_index:
    type: "integer"
    description: "Position of the token in the sequence."
  layer_entropies:
    type: "object"
    description: "Mapping of layer index to entropy value."
    additionalProperties:
      type: "number"
      minimum: 0
      description: "Shannon entropy value for the layer."
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of extraction."
required:
  - sequence_id
  - token_index
  - layer_entropies
  - timestamp
additionalProperties: false
