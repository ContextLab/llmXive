$schema: "http://json-schema.org/draft-07/schema#"
title: "EntropyProfile"
description: "Schema for intermediate layer entropy data."
type: "object"
properties:
  profile_id:
    type: "string"
    description: "Unique identifier for the profile."
  sequence_id:
    type: "string"
    description: "Foreign key to the parent TokenSequence."
  token_index:
    type: "integer"
    description: "Position of the token in the sequence."
  layer_id:
    type: "integer"
    description: "Transformer layer index."
  entropy_value:
    type: "number"
    description: "Calculated Shannon entropy value."
  validity_label:
    type: "integer"
    enum: [0, 1]
    description: "Validity label inherited from the sequence."
required:
  - profile_id
  - sequence_id
  - token_index
  - layer_id
  - entropy_value
  - validity_label
additionalProperties: false
