$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Record Schema"
description: "Schema for merged dataset records containing entropy and validity labels."
type: "object"
required:
  - "prompt_id"
  - "task_type"
  - "token_index"
  - "layer_index"
  - "entropy_value"
  - "is_valid"
properties:
  prompt_id:
    type: "string"
    description: "Unique identifier for the input prompt."
  task_type:
    type: "string"
    enum:
      - "gsm8k"
      - "minigrid"
    description: "The task category."
  token_index:
    type: "integer"
    minimum: 0
    description: "Index of the token in the sequence."
  layer_index:
    type: "integer"
    minimum: 0
    description: "Index of the transformer layer."
  entropy_value:
    type: "number"
    description: "Shannon entropy value for this layer and token."
  is_valid:
    type: "boolean"
    description: "True if the token matches the **external dataset ground truth**."
  ground_truth_token:
    type: "string"
    description: "The actual token string for reference (from dataset)."
additionalProperties: false
