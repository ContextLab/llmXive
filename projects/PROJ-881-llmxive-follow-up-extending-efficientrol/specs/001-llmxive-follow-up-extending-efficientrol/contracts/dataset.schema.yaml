$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Record Schema"
description: "Schema for merged dataset records containing entropy and validity labels."
type: "object"
required:
  - "prompt_id"
  - "task_type"
  - "token_index"
  - "layer_index"
  - "entropy_value"
  - "is_valid"
properties:
  prompt_id:
    type: "string"
    description: "Unique identifier for the input prompt."
  task_type:
    type: "string"
    enum:
      - "gsm8k"
      - "minigrid"
    description: "The task category."
  token_index:
    type: "integer"
    minimum: 1
    description: "Length of the generated sequence"
  entropy_profiles:
    type: "array"
    items:
      type: "array"
      items:
        type: "number"
    description: "Layer-wise entropy values for each token (captured in same pass)"
required:
  - id
  - task_type
  - prompt
  - ground_truth
  - generated_tokens
  - validity_flags
  - sequence_length
  - entropy_profiles
