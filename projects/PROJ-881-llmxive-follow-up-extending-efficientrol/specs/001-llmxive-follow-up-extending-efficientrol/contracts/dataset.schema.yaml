$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Record Schema"
description: "Schema for merged dataset records containing entropy and validity labels."
type: "object"
required:
  - "prompt_id"
  - "task_type"
  - "token_index"
  - "layer_index"
  - "entropy_value"
  - "is_valid"
properties:
  prompt_id:
    type: "string"
    description: "Unique identifier for the input prompt."
  task_type:
    type: "string"
    enum:
      - "gsm8k"
      - "minigrid"
    description: "The task category."
  token_index:
    type: "integer"
    minimum: 0
    description: "Position of the token in the sequence."
  layer_index:
    type: "integer"
    minimum: 0
    description: "Transformer layer index."
  entropy_value:
    type: "number"
    description: "Calculated Shannon entropy value."
  is_valid:
    type: "integer"
    enum: [0, 1]
    description: "Validity label (1=valid, 0=invalid)."
  sequence_id:
    type: "string"
    description: "Foreign key to the parent TokenSequence."
additionalProperties: false