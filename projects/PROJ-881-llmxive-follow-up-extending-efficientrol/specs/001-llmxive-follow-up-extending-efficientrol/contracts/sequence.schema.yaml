$schema: "http://json-schema.org/draft-07/schema#"
title: "TokenSequence"
description: "Schema for generated token sequences with validity labels."
type: "object"
properties:
  sequence_id:
    type: "string"
    description: "Unique identifier for the sequence."
  task_type:
    type: "string"
    enum:
      - "GSM8K"
      - "MiniGrid"
    description: "Type of task the sequence belongs to."
  prompt:
    type: "string"
    description: "Input prompt text."
  tokens:
    type: "array"
    items:
      type: "integer"
    description: "List of token IDs."
  validity_labels:
    type: "array"
    items:
      type: "boolean"
    description: "Boolean flags indicating if each token matches ground truth."
  ground_truth:
    type: "string"
    description: "Full ground truth string or sequence."
required:
  - sequence_id
  - task_type
  - prompt
  - tokens
  - validity_labels
  - ground_truth
additionalProperties: false
