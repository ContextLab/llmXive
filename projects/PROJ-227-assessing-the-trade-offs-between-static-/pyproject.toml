[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-analysis-tradeoffs"
version = "0.1.0"
description = "Assessing the Trade-offs Between Static and Dynamic Analysis for LLM-Generated Code"
requires-python = ">=3.11"
dependencies = [
    "datasets==2.14.0",
    "pandas==2.0.3",
    "scipy==1.11.0",
    "pytest==7.4.0",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "psutil==5.9.5",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
