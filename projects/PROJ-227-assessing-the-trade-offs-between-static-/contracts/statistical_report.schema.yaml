$schema: http://json-schema.org/draft-07/schema#
title: Statistical Report Schema
description: Schema for the final statistical analysis report.
type: object
required:
  - report_id
  - generated_at
  - metrics
  - correlation_tests
properties:
  report_id:
    type: string
  generated_at:
    type: string
    format: date-time
  methodology_note:
    type: string
    description: Note on deviations from original spec (e.g., SPEC_AMENDMENT_001).
  metrics:
    type: object
    properties:
      issue_detection_rate:
        type: number
        format: float
      pass_rate:
        type: number
        format: float
      precision:
        type: string
        const: "N/A"
      recall:
        type: string
        const: "N/A"
      f1_score:
        type: string
        const: "N/A"
  correlation_tests:
    type: array
    items:
      type: object
      required:
        - test_type
        - coefficient
        - p_value
      properties:
        test_type:
          type: string
          enum: [spearman, chi_squared]
        coefficient:
          type: number
          format: float
        p_value:
          type: number
          format: float
        alpha:
          type: number
          format: float
        corrected:
          type: boolean
          description: Whether Bonferroni correction was applied.
  stratified_results:
    type: object
    description: Results broken down by language stratum.
  sensitivity_analysis:
    type: object
    description: Results for different alpha levels {0.01, 0.05, 0.1}.
