$schema: http://json-schema.org/draft-07/schema#
title: Statistical Report Schema
description: Schema for the final statistical analysis report.
type: object
required:
  - report_id
  - generated_at
  - metrics
  - correlations
  - stratified_results
  - sensitivity_analysis
  - deviation_notes
properties:
  report_id:
    type: string
    description: Unique identifier for the report.
  generated_at:
    type: string
    format: date-time
    description: Timestamp of report generation.
  metrics:
    type: object
    required:
      - issue_detection_rate
      - pass_rate
    properties:
      issue_detection_rate:
        type: number
        minimum: 0
        maximum: 1
        description: Rate of issues detected by static analysis.
      pass_rate:
        type: number
        minimum: 0
        maximum: 1
        description: Rate of passing dynamic tests.
      precision:
        type: string
        const: "N/A"
        description: Explicitly N/A due to lack of security ground truth.
      recall:
        type: string
        const: "N/A"
        description: Explicitly N/A due to lack of security ground truth.
      f1_score:
        type: string
        const: "N/A"
        description: Explicitly N/A due to lack of security ground truth.
  correlations:
    type: object
    required:
      - spearman
      - chi_squared
      - mcnemar
    properties:
      spearman:
        type: object
        required:
          - coefficient
          - p_value
        properties:
          coefficient:
            type: number
          p_value:
            type: number
        description: Spearman's rank correlation results.
      chi_squared:
        type: object
        required:
          - statistic
          - p_value
          - degrees_of_freedom
        properties:
          statistic:
            type: number
          p_value:
            type: number
          degrees_of_freedom:
            type: integer
        description: Chi-squared test results.
      mcnemar:
        type: string
        const: "N/A"
        description: Explicitly N/A due to distinct constructs.
  stratified_results:
    type: object
    description: Results broken down by language stratum.
    additionalProperties:
      type: object
  sensitivity_analysis:
    type: object
    description: Results for different alpha levels.
    properties:
      alpha_0_01:
        type: object
      alpha_0_05:
        type: object
      alpha_0_1:
        type: object
  deviation_notes:
    type: array
    items:
      type: string
    description: Notes on deviations from original spec (e.g., SPEC_AMENDMENT_001).
additionalProperties: false
