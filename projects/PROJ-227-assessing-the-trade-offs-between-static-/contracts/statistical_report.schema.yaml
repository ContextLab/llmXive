$schema: http://json-schema.org/draft-07/schema#
title: Statistical Report Schema
description: Schema for the final statistical analysis report.
type: object
required:
  - report_version
  - generated_at
  - methodology
  - metrics
  - correlations
  - stratified_results
  - sensitivity_analysis
properties:
  report_version:
    type: string
    description: Version of the report format
  generated_at:
    type: string
    format: date-time
    description: Timestamp of report generation
  methodology:
    type: object
    required:
      - static_metric
      - dynamic_metric
      - correlation_test
    properties:
      static_metric:
        type: string
        description: Metric used for static analysis (e.g., "Issue Detection Rate")
      dynamic_metric:
        type: string
        description: Metric used for dynamic analysis (e.g., "Pass Rate")
      correlation_test:
        type: string
        description: Statistical test used (e.g., "Spearman", "Chi-squared")
      deviations:
        type: array
        items:
          type: string
        description: List of deviations from original spec (e.g., "SPEC_AMENDMENT_001")
  metrics:
    type: object
    properties:
      overall_issue_detection_rate:
        type: number
        minimum: 0
        maximum: 1
      overall_pass_rate:
        type: number
        minimum: 0
        maximum: 1
      sample_size:
        type: integer
        minimum: 1
  correlations:
    type: object
    properties:
      spearman:
        type: object
        properties:
          coefficient:
            type: number
          p_value:
            type: number
            minimum: 0
            maximum: 1
          significant:
            type: boolean
      chi_squared:
        type: object
        properties:
          statistic:
            type: number
          p_value:
            type: number
            minimum: 0
            maximum: 1
          degrees_of_freedom:
            type: integer
          significant:
            type: boolean
  stratified_results:
    type: object
    description: Results broken down by language
    additionalProperties:
      type: object
      properties:
        sample_size:
          type: integer
        issue_detection_rate:
          type: number
        pass_rate:
          type: number
        correlation:
          type: object
  sensitivity_analysis:
    type: object
    description: Results for different alpha levels
    properties:
      alpha_levels:
        type: array
        items:
          type: number
        description: List of alpha levels tested (e.g., [0.01, 0.05, 0.1])
      results_by_alpha:
        type: object
        additionalProperties:
          type: object
          properties:
            significant:
              type: boolean
            effect_size:
              type: number
  corrections:
    type: object
    properties:
      bonferroni:
        type: object
        properties:
          adjusted_alpha:
            type: number
          applied_to:
            type: string
            description: Description of what the correction was applied to
