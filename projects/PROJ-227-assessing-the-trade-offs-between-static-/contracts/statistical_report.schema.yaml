$schema: "http://json-schema.org/draft-07/schema#"
title: "Statistical Report Schema"
description: "Schema for final statistical analysis results"
type: object
required:
  - report_id
  - generated_at
  - methodology
  - metrics
properties:
  report_id:
    type: string
    description: "Unique identifier for the report"
  generated_at:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of generation"
  methodology:
    type: string
    description: "Description of statistical methods used"
  metrics:
    type: object
    properties:
      issue_detection_rate:
        type: object
        description: "Static analysis issue detection rates"
      pass_rate:
        type: object
        description: "Dynamic analysis pass rates"
      correlation:
        type: object
        properties:
          method:
            type: string
          coefficient:
            type: number
          p_value:
            type: number
          sample_size:
            type: integer
        description: "Correlation results (e.g., Spearman)"
      chi_squared:
        type: object
        properties:
          statistic:
            type: number
          p_value:
            type: number
          degrees_of_freedom:
            type: integer
        description: "Chi-squared test results"
  stratified_results:
    type: array
    items:
      type: object
      properties:
        stratum:
          type: string
        results:
          type: object
    description: "Results broken down by stratum (language)"
  sensitivity_analysis:
    type: object
    description: "Results for different alpha levels"
  corrections:
    type: object
    properties:
      method:
        type: string
      adjusted_p_values:
        type: array
        items:
          type: number
    description: "Multiple testing corrections applied"
  notes:
    type: string
    description: "Additional notes on methodology or limitations"
additionalProperties: false
