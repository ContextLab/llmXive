$schema: http://json-schema.org/draft-07/schema#
title: Analysis Results Schema
description: Aggregated results from both static and dynamic analysis.
type: object
required:
  - snippet_id
  - static_results
  - dynamic_results
  - correlation
properties:
  snippet_id:
    type: string
    description: Unique identifier for the code snippet
  language:
    type: string
    description: Programming language
  static_results:
    type: object
    properties:
      tool:
        type: string
      issue_count:
        type: integer
        minimum: 0
      issue_density:
        type: number
        minimum: 0
        description: Issues per 100 lines of code
      issues:
        type: array
        items:
          type: object
  dynamic_results:
    type: object
    properties:
      tool:
        type: string
      total_tests:
        type: integer
        minimum: 0
      passed_tests:
        type: integer
        minimum: 0
      failed_tests:
        type: integer
        minimum: 0
      pass_rate:
        type: number
        minimum: 0
        maximum: 1
        description: Ratio of passed tests
      is_untestable:
        type: boolean
        description: True if no tests were found
  correlation:
    type: object
    properties:
      static_issue_detected:
        type: boolean
      dynamic_test_failed:
        type: boolean
      match:
        type: boolean
        description: True if static issue aligns with dynamic failure
