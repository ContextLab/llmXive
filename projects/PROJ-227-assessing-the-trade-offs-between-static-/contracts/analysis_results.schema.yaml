$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Results Schema"
description: "Schema for aggregated analysis results per snippet"
type: object
required:
  - snippet_id
  - language
  - static_issues_count
  - dynamic_pass
  - analysis_timestamp
properties:
  snippet_id:
    type: string
    description: "Unique identifier for the code snippet"
  language:
    type: string
    description: "Programming language"
  static_issues_count:
    type: integer
    minimum: 0
    description: "Number of issues found by static analysis"
  static_severities:
    type: object
    properties:
      low:
        type: integer
      medium:
        type: integer
      high:
        type: integer
      critical:
        type: integer
    description: "Count of issues by severity"
  dynamic_pass:
    type: boolean
    description: "Whether dynamic tests passed"
  dynamic_coverage:
    type: number
    minimum: 0
    maximum: 100
    description: "Test coverage percentage if available"
  analysis_timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of analysis completion"
  tools_used:
    type: array
    items:
      type: string
    description: "List of tools used for this snippet"
additionalProperties: false
