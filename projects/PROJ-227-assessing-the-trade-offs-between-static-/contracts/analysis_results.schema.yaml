$schema: http://json-schema.org/draft-07/schema#
title: Analysis Results Schema
description: Schema for aggregated analysis results per snippet.
type: object
required:
  - dataset_id
  - static_issues_count
  - dynamic_pass
  - static_tool_used
  - dynamic_tool_used
properties:
  dataset_id:
    type: string
    description: Reference to the dataset record.
  static_issues_count:
    type: integer
    minimum: 0
    description: Number of issues found by static analysis.
  dynamic_pass:
    type: boolean
    description: Whether the dynamic tests passed.
  static_tool_used:
    type: string
    description: The static analysis tool that produced results.
  dynamic_tool_used:
    type: string
    description: The dynamic analysis tool that produced results.
  static_issues:
    type: array
    items:
      type: object
    description: Detailed list of static issues.
  dynamic_output:
    type: string
    description: Raw output from dynamic tests.
additionalProperties: false
