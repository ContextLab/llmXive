$schema: http://json-schema.org/draft-07/schema#
title: Dataset Schema
description: Schema for raw dataset files (HumanEval, CodeXGLUE, BigCode)
type: object
required:
  - dataset_id
  - language
  - source_url
  - download_timestamp
  - record_count
  - checksum
  - samples
properties:
  dataset_id:
    type: string
    description: Unique identifier for the dataset (e.g., 'humaneval', 'codexglue_js')
  language:
    type: string
    enum:
      - python
      - javascript
      - java
    description: Programming language of the code snippets
  source_url:
    type: string
    format: uri
    description: Original source URL or HuggingFace dataset ID
  download_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the download
  record_count:
    type: integer
    minimum: 0
    description: Total number of records in the dataset
  checksum:
    type: string
    pattern: '^[a-f0-9]{64}$'
    description: SHA-256 checksum of the file
  samples:
    type: array
    items:
      type: object
      required:
        - task_id
        - code
      properties:
        task_id:
          type: string
          description: Unique task identifier
        code:
          type: string
          description: The code snippet content
        prompt:
          type: string
          description: Optional prompt or description
        test:
          type: string
          description: Optional test cases
        language_specific_fields:
          type: object
          description: Additional fields specific to the dataset/language
additionalProperties: false
