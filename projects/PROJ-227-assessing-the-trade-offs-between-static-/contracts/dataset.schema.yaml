$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema"
description: "Schema for raw dataset metadata and structure"
type: object
required:
  - id
  - source
  - language
  - record_count
  - checksum
  - created_at
properties:
  id:
    type: string
    description: "Unique identifier for the dataset version"
  source:
    type: string
    description: "Source URL or package name (e.g., 'openai/human-eval')"
  language:
    type: string
    description: "Programming language (e.g., 'python', 'javascript', 'java')"
  record_count:
    type: integer
    minimum: 0
    description: "Total number of records in the dataset"
  checksum:
    type: string
    description: "SHA256 checksum of the raw data file"
  created_at:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of creation"
  static_only:
    type: boolean
    default: false
    description: "Flag indicating if dataset is for static-only analysis"
  path:
    type: string
    description: "Relative path to the raw data file"
additionalProperties: false
