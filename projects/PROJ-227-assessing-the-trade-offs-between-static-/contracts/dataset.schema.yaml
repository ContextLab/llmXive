$schema: http://json-schema.org/draft-07/schema#
title: Dataset Schema
description: Schema for raw and processed dataset files in the llmXive pipeline.
type: object
required:
  - metadata
  - records
properties:
  metadata:
    type: object
    required:
      - source
      - language
      - version
      - timestamp
      - record_count
    properties:
      source:
        type: string
        description: Original dataset source (e.g., humaneval, codexglue, the-stack)
      language:
        type: string
        description: Programming language (python, javascript, java)
      version:
        type: string
        description: Dataset version string
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of ingestion
      record_count:
        type: integer
        minimum: 1
        description: Total number of records in the dataset
      checksum:
        type: string
        description: SHA256 checksum of the raw data file
  records:
    type: array
    items:
      type: object
      required:
        - id
        - prompt
      properties:
        id:
          type: string
          description: Unique identifier for the code snippet
        prompt:
          type: string
          description: Code prompt or completion context
        tests:
          type: string
          description: Associated test cases (if available)
        language:
          type: string
          description: Override language for this specific record
        static_only:
          type: boolean
          default: false
          description: Flag indicating if this sample is for static analysis only
