$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Manifest Schema"
description: "Schema for the combined dataset manifest"
type: object
required:
  - version
  - created_at
  - total_records
  - strata
properties:
  version:
    type: string
    description: "Manifest version"
  created_at:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of manifest creation"
  total_records:
    type: integer
    minimum: 0
    description: "Total number of records in the manifest"
  strata:
    type: object
    description: "Counts per language/stratum"
    additionalProperties:
      type: object
      properties:
        count:
          type: integer
        static_only_count:
          type: integer
        dynamic_eligible_count:
          type: integer
  limitation_report:
    type: string
    description: "Optional report on data limitations (e.g., sample size)"
  records:
    type: array
    items:
      type: object
      required:
        - id
        - language
        - source
        - stratum
        - static_only
      properties:
        id:
          type: string
        language:
          type: string
        source:
          type: string
        stratum:
          type: string
        static_only:
          type: boolean
        path:
          type: string
additionalProperties: false
