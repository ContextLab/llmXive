$schema: http://json-schema.org/draft-07/schema#
title: Dataset Manifest Schema
description: Schema for the manifest file tracking all downloaded data.
type: object
required:
  - manifest_version
  - generated_at
  - total_records
  - records
properties:
  manifest_version:
    type: string
    description: Version of the manifest schema.
  generated_at:
    type: string
    format: date-time
    description: Timestamp of manifest generation.
  total_records:
    type: integer
    minimum: 0
    description: Total number of records in the manifest.
  records:
    type: array
    items:
      type: object
      required:
        - id
        - source
        - language
        - stratum
        - static_only
        - file_path
      properties:
        id:
          type: string
        source:
          type: string
        language:
          type: string
        stratum:
          type: string
        static_only:
          type: boolean
        file_path:
          type: string
        checksum:
          type: string
    description: List of record summaries.
additionalProperties: false
