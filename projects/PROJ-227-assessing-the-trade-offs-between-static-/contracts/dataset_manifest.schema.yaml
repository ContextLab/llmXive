$schema: http://json-schema.org/draft-07/schema#
title: Dataset Manifest Schema
description: Manifest tracking all downloaded datasets and their stratification.
type: object
required:
  - version
  - generated_at
  - total_records
  - strata
  - records
properties:
  version:
    type: string
    description: Manifest format version
  generated_at:
    type: string
    format: date-time
    description: Timestamp of manifest generation
  total_records:
    type: integer
    minimum: 1
    description: Total number of records in the manifest
  strata:
    type: object
    description: Counts per language stratum
    additionalProperties:
      type: integer
      minimum: 0
  records:
    type: array
    items:
      type: object
      required:
        - id
        - language
        - source
        - stratum
        - static_only
        - file_path
      properties:
        id:
          type: string
        language:
          type: string
          enum: [python, javascript, java]
        source:
          type: string
          enum: [humaneval, codexglue, the-stack]
        stratum:
          type: string
          description: Stratification label (e.g., "python", "javascript", "java")
        static_only:
          type: boolean
          description: Whether this record is excluded from dynamic analysis
        file_path:
          type: string
          description: Relative path to the raw data file
        checksum:
          type: string
          description: SHA256 checksum of the record data
