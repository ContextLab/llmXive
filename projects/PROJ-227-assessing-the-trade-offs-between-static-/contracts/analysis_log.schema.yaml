$schema: http://json-schema.org/draft-07/schema#
title: Analysis Log Schema
description: Schema for logs generated by static and dynamic analysis tools.
type: object
required:
  - log_id
  - timestamp
  - tool_name
  - tool_version
  - dataset_id
  - status
  - issues
properties:
  log_id:
    type: string
    description: Unique identifier for the log entry.
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the analysis.
  tool_name:
    type: string
    enum:
      - codeql
      - sonarqube
      - pylint
      - eslint
      - pytest
      - jest
      - junit
    description: Name of the analysis tool used.
  tool_version:
    type: string
    description: Version string of the tool.
  dataset_id:
    type: string
    description: Reference to the dataset record analyzed.
  status:
    type: string
    enum:
      - success
      - failure
      - timeout
      - untestable
    description: Outcome status of the analysis.
  issues:
    type: array
    items:
      type: object
      required:
        - type
        - severity
        - message
        - location
      properties:
        type:
          type: string
          description: Type of issue found.
        severity:
          type: string
          enum:
            - critical
            - high
            - medium
            - low
            - info
          description: Severity level of the issue.
        message:
          type: string
          description: Human-readable description of the issue.
        location:
          type: string
          description: Location in the code (line/column or file path).
    description: List of issues detected.
  duration_seconds:
    type: number
    minimum: 0
    description: Duration of the analysis in seconds.
  error_message:
    type: string
    description: Error message if status is failure or timeout.
additionalProperties: false
