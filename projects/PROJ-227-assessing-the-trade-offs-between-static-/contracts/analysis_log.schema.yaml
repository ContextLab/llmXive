$schema: http://json-schema.org/draft-07/schema#
title: Analysis Log Schema
description: Schema for logs generated by static and dynamic analysis tools.
type: object
required:
  - run_id
  - snippet_id
  - tool_name
  - tool_version
  - timestamp
  - status
properties:
  run_id:
    type: string
    description: Unique identifier for the analysis run session.
  snippet_id:
    type: string
    description: Reference to the code snippet being analyzed.
  tool_name:
    type: string
    description: Name of the analysis tool (e.g., CodeQL, SonarQube, Pytest).
  tool_version:
    type: string
    description: Version of the tool used.
  timestamp:
    type: string
    format: date-time
    description: Time of analysis execution.
  status:
    type: string
    enum: [success, failure, timeout, error]
    description: Outcome of the analysis.
  duration_seconds:
    type: number
    description: Time taken for the analysis.
  issues_found:
    type: array
    items:
      type: object
      required:
        - severity
        - message
        - location
      properties:
        severity:
          type: string
          enum: [critical, major, minor, info]
        message:
          type: string
        location:
          type: string
          description: Line number or file path.
  output_raw:
    type: string
    description: Raw stdout/stderr from the tool.
  error_message:
    type: string
    description: Error details if status is failure or error.
