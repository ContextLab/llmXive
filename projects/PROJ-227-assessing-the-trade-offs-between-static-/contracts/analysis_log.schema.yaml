$schema: http://json-schema.org/draft-07/schema#
title: Analysis Log Schema
description: Schema for logs generated by static and dynamic analysis tools.
type: object
required:
  - tool_name
  - version
  - timestamp
  - status
  - results
properties:
  tool_name:
    type: string
    description: Name of the analysis tool (e.g., codeql, sonarqube, pylint, pytest)
  version:
    type: string
    description: Version of the tool used
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp when analysis started
  duration_seconds:
    type: number
    minimum: 0
    description: Duration of the analysis in seconds
  status:
    type: string
    enum: [success, failure, timeout, skipped]
    description: Final status of the analysis run
  resource_usage:
    type: object
    properties:
      cpu_percent:
        type: number
        minimum: 0
        maximum: 100
      ram_mb:
        type: number
        minimum: 0
  snippet_id:
    type: string
    description: ID of the code snippet being analyzed
  language:
    type: string
    description: Language of the snippet
  results:
    type: array
    description: List of issues or test results
    items:
      type: object
      properties:
        type:
          type: string
          enum: [issue, test_pass, test_fail, error]
        severity:
          type: string
          enum: [critical, major, minor, info, unknown]
        message:
          type: string
        location:
          type: object
          properties:
            file:
              type: string
            line:
              type: integer
            column:
              type: integer
        rule_id:
          type: string
          description: Rule ID for static analysis issues
        test_name:
          type: string
          description: Name of the test for dynamic analysis
        duration_ms:
          type: integer
          description: Duration of individual test in ms
  error_message:
    type: string
    description: Error message if status is failure or timeout
