$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Log Schema"
description: "Schema for static and dynamic analysis execution logs"
type: object
required:
  - id
  - language
  - tool
  - timestamp
  - status
properties:
  id:
    type: string
    description: "Unique identifier for the analysis run"
  language:
    type: string
    description: "Programming language analyzed"
  tool:
    type: string
    description: "Name of the analysis tool (e.g., 'CodeQL', 'PyLint', 'pytest')"
  version:
    type: string
    description: "Version of the tool used"
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of execution"
  status:
    type: string
    enum:
      - success
      - failure
      - timeout
      - skipped
    description: "Execution status"
  duration_seconds:
    type: number
    minimum: 0
    description: "Execution duration in seconds"
  issues:
    type: array
    items:
      type: object
      required:
        - severity
        - rule_id
        - message
        - location
      properties:
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
          description: "Severity level of the issue"
        rule_id:
          type: string
          description: "Identifier of the rule that triggered the issue"
        message:
          type: string
          description: "Description of the issue"
        location:
          type: string
          description: "File path and line number (e.g., 'file.py:42')"
  output_path:
    type: string
    description: "Path to detailed output file if available"
  error_message:
    type: string
    description: "Error message if status is failure or timeout"
additionalProperties: false
