$schema: http://json-schema.org/draft-07/schema#
title: Tool Version Schema
description: Schema for recording tool versions used in the analysis.
type: object
required:
  - tools
properties:
  tools:
    type: array
    items:
      type: object
      required:
        - name
        - version
        - timestamp
      properties:
        name:
          type: string
          description: Name of the tool (e.g., codeql, sonarqube, pylint)
        version:
          type: string
          description: Semantic version string of the tool
        timestamp:
          type: string
          format: date-time
          description: Timestamp when version was recorded
        platform:
          type: string
          description: OS platform where tool was run
        hash:
          type: string
          description: Hash of the tool binary or container image
