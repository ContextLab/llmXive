$schema: "http://json-schema.org/draft-07/schema#"
title: "Tool Version Schema"
description: "Schema for recording tool versions used in analysis"
type: object
required:
  - tool_name
  - version
  - installation_date
properties:
  tool_name:
    type: string
    description: "Name of the tool (e.g., 'CodeQL', 'SonarQube')"
  version:
    type: string
    description: "Version string of the tool"
  installation_date:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of installation"
  path:
    type: string
    description: "Path to the tool executable"
  environment:
    type: object
    description: "Environment variables relevant to the tool"
  checksum:
    type: string
    description: "Checksum of the tool binary if available"
additionalProperties: false
