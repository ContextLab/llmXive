[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-alloy-design"
version = "0.1.0"
description = "Multi-Property Trade-Offs in Alloy Design Using Public Compositional Data"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.0.0",
    "scikit-learn==1.3.0",
    "numpy==1.24.0",
    "scipy==1.11.0",
    "deap==1.4.1",
    "matplotlib==3.7.0",
    "seaborn==0.12.0",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "pyarrow==12.0.0",
    "pymatgen==2023.9.25",
    "mendeleev==0.16.0",
    "python-dotenv==1.0.0",
    "datasets==2.14.0",
    "pydantic==2.3.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (black handles this)
    "B008",  # do not perform function calls in argument defaults
    "C408",  # unnecessary dict call
]

[tool.ruff.isort]
known-first-party = ["code"]
known-third-party = [
    "datasets",
    "deap",
    "mendeleev",
    "matplotlib",
    "numpy",
    "pandas",
    "pydantic",
    "pymatgen",
    "scipy",
    "scikit-learn",
    "seaborn",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"code/main.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[project.optional-dependencies]
dev = [
    "ruff==0.1.0",
    "black==23.9.0",
    "pytest==7.4.0",
    "pytest-cov==4.1.0",
]