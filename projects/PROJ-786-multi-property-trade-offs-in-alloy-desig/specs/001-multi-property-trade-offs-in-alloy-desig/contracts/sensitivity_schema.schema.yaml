$schema: "http://json-schema.org/draft-07/schema#"
title: "Sensitivity Analysis Schema"
description: "Schema for sensitivity_analysis.csv"
type: object
properties:
  threshold:
    type: number
    description: "Correlation threshold used"
    minimum: 0.1
    maximum: 0.9
  robustness_score:
    type: number
    description: "Stability metric (0.0 to 1.0)"
    minimum: 0
    maximum: 1
required:
  - threshold
  - robustness_score
additionalProperties: false