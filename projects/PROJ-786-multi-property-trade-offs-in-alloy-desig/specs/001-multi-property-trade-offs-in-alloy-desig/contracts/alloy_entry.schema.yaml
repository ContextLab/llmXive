$schema: "http://json-schema.org/draft-07/schema#"
title: "AlloyEntry"
description: "Schema for encoded alloy compositions and properties."
type: "object"
properties:
  composition:
    type: "string"
    description: "Chemical formula (e.g., 'Fe0.8Ni0.2')"
  bulk_modulus:
    type: "number"
    description: "Bulk Modulus in GPa"
    minimum: 0
  shear_modulus:
    type: "number"
    description: "Shear Modulus in GPa"
    minimum: 0
  elements:
    type: "array"
    items:
      type: "string"
    description: "List of constituent elements"
  ilr_features:
    type: "array"
    items:
      type: "number"
    description: "Isometric log-ratio transformed features"
  periodic_desc:
    type: "array"
    items:
      type: "number"
    description: "Weighted periodic descriptors"
  system_group:
    type: "string"
    description: "Primary constituent group (e.g., 'Fe-Ni')"
  valid:
    type: "boolean"
    description: "Filter status"
required:
  - composition
  - bulk_modulus
  - shear_modulus
  - elements
  - ilr_features
  - periodic_desc
  - system_group
  - valid
additionalProperties: false