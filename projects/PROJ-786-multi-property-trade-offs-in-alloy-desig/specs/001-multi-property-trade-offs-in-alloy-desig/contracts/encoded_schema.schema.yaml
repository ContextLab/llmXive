$schema: "http://json-schema.org/draft-07/schema#"
title: "Encoded Alloys Schema"
description: "Schema for the processed encoded_alloys.csv"
type: object
properties:
  composition_id:
    type: string
    description: "Unique hash of the composition"
  composition:
    type: string
  bulk_modulus:
    type: number
    minimum: 0
  shear_modulus:
    type: number
    minimum: 0
  avg_atomic_radius:
    type: number
  std_atomic_radius:
    type: number
  avg_electronegativity:
    type: number
  std_electronegativity:
    type: number
  num_elements:
    type: integer
    minimum: 1
  ilr_1:
    type: number
  ilr_2:
    type: number
  ilr_3:
    type: number
    # ... additional ilr features as needed
required:
  - composition_id
  - composition
  - bulk_modulus
  - shear_modulus
  - avg_atomic_radius
  - std_atomic_radius
  - avg_electronegativity
  - std_electronegativity
  - num_elements
additionalProperties: true