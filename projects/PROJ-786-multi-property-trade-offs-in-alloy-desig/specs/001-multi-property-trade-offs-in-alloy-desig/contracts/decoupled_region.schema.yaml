$schema: "http://json-schema.org/draft-07/schema#"
title: "DecoupledRegion"
description: "Schema for identified compositional clusters with low property correlation."
type: "object"
properties:
  cluster_id:
    type: "integer"
    description: "Unique ID for the cluster."
  correlation_coefficient:
    type: "number"
    description: "Pearson correlation between Bulk and Shear moduli in this cluster. Value must be between -1 and 1."
    minimum: -1
    maximum: 1
  null_correlation_mean:
    type: "number"
    description: "Mean correlation from 1000 permutations of shuffled composition assignments within the cluster."
  p_value:
    type: "number"
    description: "P-value from local permutation test (proportion of shuffled correlations < observed)."
    minimum: 0
    maximum: 1
  point_count:
    type: "integer"
    description: "Number of data points in the cluster."
    minimum: 1
  uncertainty_variance:
    type: "number"
    description: "Average prediction variance for points in this cluster."
    minimum: 0
  is_significant:
    type: "boolean"
    description: "True if p_value < 0.05 AND local correlation < global correlation - 0.2."
  representative_composition:
    type: "object"
    description: "Centroid composition of the cluster."
    additionalProperties:
      type: "number"
required:
  - cluster_id
  - correlation_coefficient
  - null_correlation_mean
  - p_value
  - point_count
  - uncertainty_variance
  - is_significant
  - representative_composition
additionalProperties: false