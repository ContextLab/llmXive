$schema: "http://json-schema.org/draft-07/schema#"
title: "Execution Trace Schema"
description: "Schema for synthetic multi-turn revision sessions generated by the MemSlides schema logic."
type: "object"
required:
  - "session_id"
  - "turns"
  - "final_state"
properties:
  session_id:
    type: "string"
    description: "Unique identifier for the session."
  turns:
    type: "array"
    description: "List of tool execution steps."
    items:
      type: "object"
      required:
        - "tool"
        - "args"
        - "timestamp"
      properties:
        tool:
          type: "string"
          description: "Tool name (e.g., 'insert_chart')."
        args:
          type: "object"
          description: "Tool arguments (key-value pairs)."
          additionalProperties: true
        timestamp:
          type: "integer"
          description: "Unix timestamp of the turn."
  final_state:
    type: "object"
    description: "Ground-truth slide state representation."
    additionalProperties: true
additionalProperties: false