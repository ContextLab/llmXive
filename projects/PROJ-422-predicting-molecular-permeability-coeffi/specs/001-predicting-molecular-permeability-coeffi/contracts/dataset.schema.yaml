$schema: "http://json-schema.org/draft-07/schema#"
title: "Processed Molecule Dataset"
type: object
properties:
  smiles:
    type: string
    description: "SMILES string of the molecule"
  mol_valid:
    type: boolean
    description: "Whether the SMILES was successfully parsed"
  mw:
    type: number
    description: "Molecular Weight"
  logp:
    type: number
    description: "Calculated LogP"
  tpsa:
    type: number
    description: "Topological Polar Surface Area"
  hba:
    type: integer
    description: "Number of Hydrogen Bond Acceptors"
  hbd:
    type: integer
    description: "Number of Hydrogen Bond Donors"
  rotatable_bonds:
    type: integer
    description: "Number of Rotatable Bonds"
  target:
    type:
      - number
      - "null"
    description: "Experimental permeability coefficient if available; null otherwise"
  polymer_type:
    type:
      - string
      - "null"
    description: "Polymer type for stratification (optional)"
  polymer_type_onehot:
    type: object
    description: "One‑hot encoding of polymer type (key = type, value = 0 or 1)"
    additionalProperties:
      type: integer
      enum: [0,1]
required:
  - smiles
  - mol_valid
  - mw
  - logp
  - tpsa
  - hba
  - hbd
  - rotatable_bonds
  - target
  - polymer_type_onehot
additionalProperties: false