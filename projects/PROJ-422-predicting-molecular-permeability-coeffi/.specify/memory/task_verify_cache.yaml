  r: "The `code/data/split.py` script exists, reads the processed Parquet file, drops\
    \ rows with null targets, handles \u22645\u2011row leave\u2011one\u2011out splits,\
    \ and writes both CSV and Parquet files. However, it does **not** enforce the\
    \ required \u22645\u202Fpercentage\u2011point class distribution difference for\
    \ polymer\u2011type stratification, nor does it provide the `stratified_split`\
    \ / `execute_split` APIs that the unit tests expect (as shown by multiple failures\
    \ in `tests/unit/test_split.py`). Consequently the stratification constraint verification\
    \ and the unit\u2011test suite are not satisfied."
