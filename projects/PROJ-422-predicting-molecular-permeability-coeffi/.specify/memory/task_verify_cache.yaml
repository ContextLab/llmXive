  r: "Checked `code/data/download.py` which streams or falls back to a local CSV,\
    \ writes the file to `data/raw/permeability_data.csv`, and creates `data/raw/checksums.json`\
    \ with a SHA\u2011256 entry. The provided `tests/unit/test_download.py` runs the\
