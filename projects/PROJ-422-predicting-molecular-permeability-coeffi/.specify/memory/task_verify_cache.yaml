  r: "The `code/data/check_permeability.py` script exists, loads the verified datasets\
    \ list, correctly detects a `permeability` column, writes the chosen identifier\
    \ to `config/selected_dataset.yaml`, and returns the appropriate exit codes. The\
    \ unit tests `tests/unit/test_check_permeability.py` exercise both success and\
    \ failure paths using temporary CSVs and confirm the script\u2019s behavior, and\
    \ they pass given the provided implementation."
  sig: 111b3f86e1449dc69f2281e7359a632d392ef76a74d4da52764e25f70ed93346
T001:
  c: false
  h: 6b6522950bed5632ee250a418dde5733e7bff8c6cf7350d37c0f6642bfb59bfa
  r: The `code/data/download.py` script is present and attempts streaming, but the
    required output artifacts (`data/raw/` directory with the CSV file and `data/raw/checksums.json`)
    are missing, and there is no evidence that `tests/unit/test_download.py` was executed
    successfully. The task is incomplete until the script is run to produce those
    files and the test passes.
  sig: fece2d07856b20c8904e1cc97df2c450a2f0ac8a5f8d3592d876663bff846f28
T002:
  c: false
  h: e511016fc685aa3fa4d62260a219c8143a5a9d5d085cc87f954d5d5fd59de234
  r: "The `MoleculeProcessor.process` method writes the output files but then applies\
    \ the retention guard using the raw input row count, causing a `SystemExit` for\
    \ the provided sample dataframe (3 valid SMILES out of 5 \u2192 60\u202F%\u202F\
    <\u202F95\u202F%). The unit test expects the method to complete without raising,\
    \ so the guard logic does not meet the test\u2019s requirements. Adjust the retention\
    \ calculation or threshold to satisfy the test."
  sig: 826fbff4c7b6cc141473bdbfc94fa16af1b23f3cd27fae05d2b402e3dc450f18
