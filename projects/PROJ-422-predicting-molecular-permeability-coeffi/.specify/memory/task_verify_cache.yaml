  r: "Checked `code/data/preprocess.py` implementation, the generated `data/processed/processed_data.csv`\
    \ and `.parquet` files, and the unit tests `tests/unit/test_preprocess.py`. The\
    \ processor parses SMILES, computes the required descriptors, builds the graph\
    \ JSON, writes both output files before the retention guard, drops rows with missing\
    \ targets, and raises a non\u2011zero `SystemExit` when the valid\u2011molecule\
    \ fraction is below 95\u202F%, satisfying all test assertions."
  sig: c0f9d39f775baa6689ee71d8df747e1610a2ed89c93e72785940a54a91d1e10a
T003:
  c: false
  h: 226bf5b97dae9dc503143a33e9b461221b49c1a6d290d0ca0a5945697d793b77
  r: "The repository contains `code/data/split.py` which implements the required split\
    \ logic, and a `data/processed/train.parquet` file, but there is no evidence of\
    \ the complementary `test.parquet`, `train.csv`, or `test.csv` files being created.\
    \ Moreover, no data (e.g., row counts) is provided to confirm the 0.75\u20110.85\
    \ train\u2011to\u2011test ratio or the \u22645\u202Fpp stratification constraint,\
    \ so the integration test\u2019s verification criteria cannot be satisfied. The\
    \ missing split artefacts and lack of ratio/stratification evidence must be addressed."
  sig: 1f5a1846098fefdb5987937698b7c2f6c2a0d204edb2568fd3451c4374e2ff28
T005:
  c: false
  h: 4932e85b9a87ab2bf45944233696a1915e9973108682bbfc0fda11118fd09008
  r: "The `code/models/rf.py` script correctly trains a `RandomForestRegressor` with\
    \ the required hyper\u2011parameters on the six descriptor columns and writes\
    \ `code/models/rf.pkl`, and the pickle file is present. However, the unit test\
    \ `test_rf_training` also expects a `results/training_log.json` file containing\
    \ a `total_hours` field (and\u202F<\u202F6\u202Fhours), which is not present in\
    \ the artifacts. This missing log causes the test to fail, so the task is not\
    \ fully satisfied."
  sig: 1e09d9bbbe56ea6d409c01e3aa937c912dfb5770caa2ed65275b2371b1d3954c
T014:
  c: false
  h: 8756fc88b279074f495af95602beabf2abcbde9fa81b14eece69ec346aac24dd
  r: "The `tests/unit/test_models.py::test_gnn_training_pipeline` test is present,\
    \ but the CI log shows it fails with a `ValueError: Expected more than 1 value\
    \ per channel when training, got input size torch.Size([1, 64])`. Consequently\
    \ the GNN training pipeline does not complete, no checkpoint is created, and the\
    \ wall\u2011time guard is never reached. The task requires this test to pass within\
    \ 3600\u202Fs, which is not satisfied. Fix the batch\u2011norm handling (or otherwise\
    \ ensure the training step works on the tiny dataset) and ensure the checkpoint\
    \ files are written."
  sig: c38bc092dacffbb324439947cd337221b5f6aa08c75c7abe22628dc035f9b08b
