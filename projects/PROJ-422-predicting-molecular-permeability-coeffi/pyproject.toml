[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predicting-molecular-permeability-coeffi"
version = "0.1.0"
description = "Predicting Molecular Permeability Coefficients Using Graph Neural Networks"
requires-python = ">=3.11"
dependencies = [
    "rdkit",
    "torch",
    "torch-geometric",
    "scikit-learn",
    "shap",
    "gnnexplainer",
    "pandas",
    "datasets",
    "statsmodels",
    "requests",
    "scipy",
    "numpy",
    "matplotlib",
    "seaborn",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.isort]
known-first-party = ["data", "models", "analysis", "utils", "setup_directories", "setup_linting"]
known-third-party = ["rdkit", "torch", "pandas", "numpy", "scipy", "sklearn", "shap", "statsmodels", "requests", "matplotlib", "seaborn"]
