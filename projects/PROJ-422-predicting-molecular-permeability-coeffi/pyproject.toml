[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-permeability-gnn"
version = "0.1.0"
description = "Predicting Molecular Permeability Coefficients Using Graph Neural Networks"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "rdkit>=2023.3.0",
    "shap>=0.42.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "huggingface-hub>=0.16.0",
    "datasets>=2.14.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | venv
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by black)
    "N806", # Variable in function should be lowercase (sometimes needed for ML)
    "N815", # Variable in class scope should not be mixedCase
]
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # Allow asserts in tests

[tool.setuptools.packages.find]
where = ["code"]
include = ["data*", "models*", "analysis*", "utils*", "setup*"]
