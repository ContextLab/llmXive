# Standalone ruff configuration (fallback if pyproject.toml is not used)
line-length = 100
target-version = "py311"

[lint]
select = [
    "E", "W", "F", "I", "C", "B", "UP"
]
ignore = [
    "E501",
    "B008",
    "C901"
]

[lint.isort]
known-first-party = ["data", "models", "analysis", "utils"]
force-sort-within-sections = true
