# Dataset Schema for Poll Aggregation Pipeline
# Defines the structure and validation rules for the harmonized poll data
# Used by src/data/harmonize.py to validate input and output formats
$schema: http://json-schema.org/draft-07/schema#
title: PollDatasetSchema
description: Schema for the harmonized election poll dataset
type: object
required:
  - fields
  - validation_rules
properties:
  fields:
    type: object
    properties:
      date:
        type: object
        description: Date of the poll (ISO 8601 format YYYY-MM-DD)
        required:
          - type
          - format
        properties:
          type:
            const: string
          format:
            const: date
          description:
            const: "Date the poll was conducted (ISO 8601)"
      pollster:
        type: object
        description: Name of the polling organization
        required:
          - type
        properties:
          type:
            const: string
          minLength:
            const: 1
      candidate:
        type: object
        description: Name of the candidate being polled
        required:
          - type
        properties:
          type:
            const: string
          minLength:
            const: 1
      state:
        type: object
        description: US State code (e.g., 'US' for national, 'CA' for California)
        required:
          - type
          - pattern
        properties:
          type:
            const: string
          pattern:
            const: "^[A-Z]{2}$"
      vote_share:
        type: object
        description: Percentage of vote share for the candidate (0-100)
        required:
          - type
          - minimum
          - maximum
        properties:
          type:
            const: number
          minimum:
            const: 0
          maximum:
            const: 100
      sample_size:
        type: object
        description: Number of respondents in the poll
        required:
          - type
          - minimum
        properties:
          type:
            const: integer
          minimum:
            const: 1
      mode:
        type: object
        description: Polling mode (e.g., 'Live Phone', 'Online', 'Mixed')
        required:
          - type
        properties:
          type:
            const: string
          minLength:
            const: 1
      party:
        type: object
        description: Political party affiliation of the candidate
        required:
          - type
        properties:
          type:
            const: string
          enum:
            - Democrat
            - Republican
            - Independent
            - Other
      historical_rmse:
        type: object
        description: Historical Root Mean Square Error for this pollster (calculated in src/data/weights.py)
        required:
          - type
          - minimum
        properties:
          type:
            const: number
          minimum:
            const: 0
      week_bin:
        type: object
        description: Week number binning the poll (for temporal aggregation)
        required:
          - type
          - minimum
        properties:
          type:
            const: integer
          minimum:
            const: 1
    required:
      - date
      - pollster
      - vote_share
      - sample_size
  validation_rules:
    type: object
    description: Business logic validation rules enforced during harmonization
    properties:
      unique_pollster_date:
        type: object
        description: No duplicate dates allowed per pollster
        required:
          - rule
          - severity
        properties:
          rule:
            const: "unique_per_pollster"
          severity:
            const: error
      min_poll_count:
        type: object
        description: Minimum global poll count requirement
        required:
          - threshold
          - severity
        properties:
          threshold:
            const: 500
          severity:
            const: error
          description:
            const: "Global poll count must be >= 500"
      min_recent_polls:
        type: object
        description: Minimum polls in 30 days before election
        required:
          - threshold
          - window_days
          - severity
        properties:
          threshold:
            const: 5
          window_days:
            const: 30
          severity:
            const: warning
      min_cycles:
        type: object
        description: Minimum distinct election cycles required
        required:
          - threshold
          - severity
        properties:
          threshold:
            const: 3
          severity:
            const: warning
      vote_share_range:
        type: object
        description: Vote share must be within valid percentage range
        required:
          - min
          - max
          - severity
        properties:
          min:
            const: 0
          max:
            const: 100
          severity:
            const: error
metadata:
  version: "1.0.0"
  source: "specs/001-statistical-poll-aggregation/contracts/dataset.schema.yaml"
  created_by: "T007 Implementation"
