# Dataset Schema for Poll Aggregation Pipeline
# Defines the expected structure for the harmonized poll data (data/processed/poll_data_cleaned.csv)
# Used for validation before downstream processing (weights, models)

$schema: http://json-schema.org/draft-07/schema#
title: PollAggregationDataset
description: Harmonized election poll data with calculated weights and dates

type: object
properties:
  metadata:
    type: object
    properties:
      source:
        type: string
        description: Data source identifier (e.g., 'fivethirtyeight')
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of data generation
      version:
        type: string
        description: Schema version
      record_count:
        type: integer
        minimum: 0
        description: Total number of records in the dataset
    required:
      - source
      - generated_at
      - version
      - record_count
    
  columns:
    type: array
    description: Expected column definitions in the dataset
    items:
      type: object
      properties:
        name:
          type: string
        dtype:
          type: string
          enum: [int64, float64, object, datetime64[ns]]
        description:
          type: string
      required:
        - name
        - dtype
        - description
        
  validation_rules:
    type: object
    properties:
      required_columns:
        type: array
        items:
          type: string
        description: List of columns that must be present
      date_format:
        type: string
        description: Expected date format (ISO 8601)
      min_polls_per_cycle:
        type: integer
        minimum: 3
        description: Minimum distinct cycles required
      min_recent_polls:
        type: integer
        minimum: 5
        description: Minimum polls in 30 days preceding election
      max_duplicate_dates_per_pollster:
        type: integer
        maximum: 1
        description: Maximum allowed duplicate dates per pollster (0 means no dups)
        
required:
  - metadata
  - columns
  - validation_rules
