# Forecast Schema for Poll Aggregation Pipeline
# Defines the expected structure for forecast outputs (frequentist and Bayesian)

$schema: http://json-schema.org/draft-07/schema#
title: PollAggregationForecast
description: Forecast results from frequentist and Bayesian models

type: object
properties:
  metadata:
    type: object
    properties:
      model_type:
        type: string
        enum: [frequentist_simple, frequentist_weighted, bayesian_random_walk]
        description: Type of model used for forecasting
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of forecast generation
      input_data_hash:
        type: string
        pattern: '^[a-f0-9]{64}$'
        description: SHA-256 hash of the input dataset
      forecast_horizon:
        type: string
        description: Description of the forecast horizon (e.g., 'Election Day')
    required:
      - model_type
      - generated_at
      - input_data_hash
      - forecast_horizon
      
  columns:
    type: array
    description: Expected columns in the forecast output
    items:
      type: object
      properties:
        name:
          type: string
        dtype:
          type: string
          enum: [int64, float64, object, datetime64[ns], bool]
        description:
          type: string
      required:
        - name
        - dtype
        - description
        
  forecast_metrics:
    type: object
    properties:
      rmse:
        type: number
        minimum: 0
        description: Root Mean Squared Error
      mae:
        type: number
        minimum: 0
        description: Mean Absolute Error
      coverage_rate:
        type: number
        minimum: 0
        maximum: 1
        description: Proportion of true values falling within confidence/credible intervals
      r_hat:
        type: number
        minimum: 1.0
        description: R-hat convergence statistic (Bayesian only, optional)
        nullable: true
    required:
      - rmse
      - mae
      
  validation_rules:
    type: object
    properties:
      required_columns:
        type: array
        items:
          type: string
        description: List of columns that must be present (varies by model type)
      vote_share_range:
        type: object
        properties:
          min:
            type: number
            minimum: 0
            maximum: 100
          max:
            type: number
            minimum: 0
            maximum: 100
        description: Valid range for vote share predictions
      confidence_interval_level:
        type: number
        description: Confidence/Credible interval level (e.g., 0.95)
        
required:
  - metadata
  - columns
  - forecast_metrics
  - validation_rules