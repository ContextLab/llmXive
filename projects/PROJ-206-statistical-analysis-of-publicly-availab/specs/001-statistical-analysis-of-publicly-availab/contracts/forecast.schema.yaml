$schema: http://json-schema.org/draft-07/schema#
title: Forecast Dataset Schema
description: >
  Schema for the aggregated forecast outputs produced by the frequentist and Bayesian models.
  This schema ensures consistency in reporting point estimates, uncertainty intervals, and
  model metadata.

type: object
required:
  - week_bin
  - model_type
  - candidate
  - state
  - forecast_value
  - lower_bound
  - upper_bound
  - prediction_date

properties:
  week_bin:
    type: string
    format: date
    description: "Start date of the weekly bin for which the forecast was made."
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  
  model_type:
    type: string
    enum:
      - "simple_average"
      - "weighted_average"
      - "bayesian_random_walk"
    description: "The forecasting model used to generate the prediction."
  
  candidate:
    type: string
    minLength: 1
    description: "Name of the candidate."
  
  state:
    type: string
    description: "US State code or 'US' for national."
    minLength: 1
    maxLength: 2
  
  forecast_value:
    type: number
    description: "Point forecast (percentage vote share)."
  
  lower_bound:
    type: number
    description: "Lower bound of the confidence/credible interval (e.g., 2.5% for 95% CI)."
  
  upper_bound:
    type: number
    description: "Upper bound of the confidence/credible interval (e.g., 97.5% for 95% CI)."
  
  prediction_date:
    type: string
    format: date
    description: "Date the forecast was generated (execution timestamp)."
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  
  method_details:
    type: object
    description: "Optional metadata specific to the model (e.g., R-hat, effective samples)."
    properties:
      r_hat:
        type: number
        minimum: 1.0
        description: "R-hat convergence statistic (Bayesian models only)."
      effective_samples:
        type: integer
        minimum: 0
        description: "Number of effective samples (Bayesian models only)."
      weight_normalization:
        type: string
        description: "Description of weight normalization (Frequentist models only)."
  
  actual_outcome:
    type: number
    nullable: true
    description: "Actual election result if available (for post-election evaluation)."

additionalProperties: false