$schema: "http://json-schema.org/draft-07/schema#"
title: "Aligned Catalyst Dataset Schema"
description: "Schema for the unified, imputed, and scaled dataset used in model training. Note: experimental_tof is optional and null in DFT-only scope."
type: "object"
properties:
  entry_id:
    type: "string"
    description: "Unique identifier for the catalyst entry, generated by hashing composition + surface_facet."
  composition:
    type: "string"
    description: "Chemical formula of the catalyst."
  surface_facet:
    type: "string"
    description: "Crystallographic surface facet (e.g., '111')."
  synthesis_condition:
    type: "string"
    description: "Description of synthesis method."
  d_band_center:
    type: "number"
    description: "d-band center energy in eV."
  p_band_center:
    type: "number"
    description: "p-band center energy in eV."
  bader_charges:
    type: "number"
    description: "Bader charge in e."
  activation_barrier:
    type: "number"
    description: "Activation energy barrier in eV."
  reaction_energy:
    type: "number"
    description: "Reaction energy in eV."
  experimental_tof:
    type: ["number", "null"]
    description: "Experimental turnover frequency in s^-1. Null in DFT-only scope."
  is_imputed:
    type: "boolean"
    description: "True if any descriptor was imputed via k-NN."
  is_excluded:
    type: "boolean"
    description: "True if the entry was excluded from training (e.g., insufficient neighbors)."
required:
  - entry_id
  - composition
  - surface_facet
  - d_band_center
  - activation_barrier
additionalProperties: false
