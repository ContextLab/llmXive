$schema: "http://json-schema.org/draft-07/schema#"
title: "Feature Importance Schema"
description: "Schema for SHAP-based feature importance rankings."
type: "object"
properties:
  descriptor_name:
    type: "string"
    description: "Name of the descriptor."
  mean_absolute_shap_value:
    type: "number"
    description: "Mean absolute SHAP value."
  rank:
    type: "integer"
    minimum: 1
    description: "Rank of the descriptor (1 = most important)."
required:
  - descriptor_name
  - mean_absolute_shap_value
  - rank
additionalProperties: false
