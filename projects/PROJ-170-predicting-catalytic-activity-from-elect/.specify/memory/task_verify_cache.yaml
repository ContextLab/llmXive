  r: The `code/setup_skeleton.py` script exists, and `data/raw/` and `outputs/` directories
    are present, but the required `data/processed/` directory is missing (marked MISSING),
    so the skeleton hierarchy is incomplete. The task also expects a `README.txt`
    in each created folder; without the `data/processed/` folder (and its README)
    the requirement is not satisfied. Create the `data/processed/` directory (with
    a README.txt) and ensure it is writable.
  sig: ed4082895950341216df465b89e0bb9f93ea137c5617f91569b344d18cfec8d8
T002:
  c: false
  h: f5eec701d7d0c7faa041eb5d60fc44c9048e2a3137cf2d5acc40d95152e05e62
  r: "The script `code/extract_descriptors.py` runs and produces `data/processed/oc20_descriptors.parquet`\
    \ with the required columns and no NaNs, but it never actually computes the DFT\u2011\
    derived descriptors \u2013 it falls back to a public Iris CSV, creates missing\
    \ columns as NaN and then replaces them with a constant\u202F0.0. No real `pymatgen`/`numpy`\
    \ calculations on OC20 data are performed, and the MP descriptor file contains\
    \ only a single composition, indicating the core scientific requirement is unmet.\
    \ The task therefore remains incomplete."
  sig: 58a6aa95968d9ac85ae3f2be73c34c8d5af21378c8634b941e0a6138f54f1e2a
T014:
  c: false
  h: ff14612b8bcc2ac2a9777aedb3d79e4d1bafdd7e7925787195943cc426696705
  r: "The repository contains `data/raw/experimental_tof.csv`, but it is an empty\
    \ placeholder CSV (only headers) and `data/checksums.txt` does not record a checksum\
    \ for this file (it only lists `scope_revision_request.json`). No evidence that\
    \ task\u202FT015 was run. The script therefore did not acquire a real open experimental\
    \ TOF dataset nor provide the required checksum, violating the task\u2019s acceptance\
    \ criteria."
  sig: e8be6fe2bb39f55e22eafa980cb172c3b1d67d9df4a96b4b376ec7eedab045b7
T015:
  c: false
  h: e224b86bad0756e390a04243f9a4ab90edc0e805caf3265cafe2d6a350888c27
  r: "Checked `code/request_scope_revision.py`, `outputs/scope_revision_request.json`,\
    \ and `data/checksums.txt`. The JSON file has all required fields, but the checksum\
    \ entry in `data/checksums.txt` includes a trailing newline (`\u2026f9927d\\n`),\
    \ causing the verification test for a 64\u2011character SHA\u2011256 hash to fail.\
    \ The checksum must be recorded without the extra newline (or otherwise stripped)\
    \ to satisfy the task\u2019s verification requirement."
