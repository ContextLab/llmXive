T102:
  c: false
  h: b7c7499dd168f82508a4256343673a311caeeb11508cf2815253c6be54bd8d27
  r: "The repository contains `code/download_data.py`, but it only downloads an OC20\
    \ streaming dataset to an HDF5 file (`oc20_sample.h5`), does not produce the required\
    \ `data/raw/oc20_sample.parquet`, and lacks any logic for fetching Materials Project\
    \ descriptors or the 2025 CO\u2082 hydrogenation study CSV. Moreover, the three\
    \ required data files (`data/raw/oc20_sample.parquet`, `data/raw/mp_descriptors.json`,\
    \ `data/raw/experimental_tof.csv`) and the integration test `tests/integration/test_download.py`\
    \ are all missing. The script also does not record the HF dataset revision hash\
    \ or enforce failure\u2011on\u2011f"
  sig: 5d444eb30d8e33d7c993a4dafc042ee4c403ba2811219abc7d04e337f830acb3
T103:
  c: false
  h: c5448939674c7d76a35b9c426e26d085f4d5165a5c5d568703bd193144dded17
  r: "The required `data/processed/unified_dataset.parquet` file is missing, and `outputs/alignment_metrics.json`\
    \ is a placeholder that lacks a proper `alignment_rate` field and is malformed\
    \ (JSON decode error). Consequently the script does not generate the unified dataset\
    \ with \u2265\u202F500 entries nor the correct alignment metrics."
  sig: b1f5efbf3961dfdd278d653cf0416f7d2d8f1255dee86a387a6c15b074b0a3f3
T104:
  c: false
