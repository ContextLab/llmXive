    \ for insufficient neighbors and the scaling test does not achieve unit variance).\
    \ These missing/incorrect artifacts mean the required vocabulary, imputation flagging,\
    \ scaling, and schema\u2011compliant output were not produced."
  sig: 3f50797be4f921268112d0560ef94968c4987f6a14643f17e62958955d3f48ba
