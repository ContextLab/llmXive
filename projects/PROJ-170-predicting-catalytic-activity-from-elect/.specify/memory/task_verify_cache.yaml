T107:
  c: false
  h: c8ac281759655b48b7b41bac1893960e50d5f5c6cbdbef765b23c86d1413e189
  r: "The integration test file exists, and `outputs/feasibility_verification.json`\
    \ meets the SC\u2011004 schema, but the pytest run logged in `code/.tasks/T107.tests_integration_test_sensitivity.py.log`\
    \ shows three failures: (1) `code/train.py` aborts because `data/processed/aligned_dataset.csv`\
    \ is missing, causing the seed\u2011stability test to fail; (2) the edge\u2011\
    case test for missing\u2011neighbor exclusion also fails for the same missing\
    \ dataset; (3) the non\u2011normal\u2011error test fails because `outputs/metrics.json`\
    \ is not created. Since the full test suite does not pass, the task requirements\
    \ are not satisfied."
