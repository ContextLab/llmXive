[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-catalyst-prediction"
version = "0.1.0"
description = "Predicting Catalytic Activity from Electronic Structure and Reaction Path Features"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "llmXive Research Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pandas==2.0.3",
    "numpy==1.24.3",
    "scikit-learn==1.3.0",
    "xgboost==1.7.6",
    "shap==0.42.1",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "rdkit==2023.3.1",
    "huggingface_hub==0.16.4"
]

[project.optional-dependencies]
dev = [
    "black==23.7.0",
    "ruff==0.0.285",
    "pytest==7.4.0",
    "pytest-cov==4.1.0"
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | outputs
    | state
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["code"]
skip = [".git", "data", "outputs", "state"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
# Note: Actual Ruff config is in .ruff.toml for cleaner separation
# This section can be used for tool-specific overrides if needed
