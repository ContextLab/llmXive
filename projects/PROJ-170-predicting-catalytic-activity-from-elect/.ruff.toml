# Ruff configuration for llmXive project
# Rules: E (pycodestyle errors), F (Pyflakes), W (pycodestyle warnings), I (isort)

select = ["E", "F", "W", "I"]

# Ignore specific rules if needed (add here if project requires exceptions)
ignore = []

# Line length for formatting checks
line-length = 88

# Target Python version
target-version = "py310"

# Exclude directories
exclude = [
    ".git",
    "__pycache__",
    ".ruff_cache",
    "build",
    "dist",
    "venv",
    ".venv",
    "data",
    "outputs",
    "state"
]

# Per-file ignores (if any specific files need exceptions)
[per-file-ignores]

# Allow longer lines in specific contexts if needed
[lint]
# Enable specific rule fixes automatically
fixable = ["ALL"]
unfixable = []
