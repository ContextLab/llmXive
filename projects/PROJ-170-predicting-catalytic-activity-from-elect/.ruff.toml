# Ruff configuration for llmXive catalytic activity project
# Enforces rules: E (pycodestyle), F (Pyflakes), W (pycodestyle warnings), I (isort)

line-length = 88
target-version = "py311"

[lint]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "W", # pycodestyle warnings
    "I", # isort
]
ignore = [
    "E501", # Line too long (handled by black)
]

[lint.isort]
known-first-party = ["code"]
force-sort-within-sections = false
lines-after-imports = 2
combine-as-imports = true
split-on-trailing-comma = false

[lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in __init__.py for package exposure