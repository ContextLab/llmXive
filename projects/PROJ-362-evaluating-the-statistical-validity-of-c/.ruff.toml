# Ruff configuration file (alternative location if pyproject.toml is not used)
# This file is provided for environments that prefer a dedicated config file.
# Primary configuration is in pyproject.toml under [tool.ruff].

target-version = "py310"
line-length = 88

select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]

ignore = [
    "E501",
]

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]
