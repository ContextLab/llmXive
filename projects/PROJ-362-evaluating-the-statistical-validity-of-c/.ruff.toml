# Ruff configuration file
# Extends settings from pyproject.toml if needed, or stands alone
# This file ensures ruff can be run explicitly via `ruff check .`

extend = "pyproject.toml"

# Specific overrides for this project if needed
# Example: ignore specific rules for specific directories
# [tool.ruff]
# ignore = []

# Ensure output is compatible with CI
output-format = "full"