$schema: "http://json-schema.org/draft-07/schema#"
title: "Results Summary Schema"
description: "Schema for final analysis results"
type: object
properties:
  query_id:
    type: integer
    description: "Query identifier"
  metric_name:
    type: string
    description: "Metric name"
  observed_score:
    type: number
    description: "Original metric score"
  p_value_raw:
    type: number
    description: "Raw permutation p-value"
  p_value_corrected:
    type: number
    description: "BH-corrected p-value"
  is_significant:
    type: boolean
    description: "Significant after correction"
  mdes_value:
    type: number
    description: "Minimum Detectable Effect Size"
  alpha_sweep_count:
    type: integer
    description: "Count of alpha thresholds where significance changed"
  statistical_interpretation:
    type: string
    description: "Explicit framing text (associational, not causal)"
required:
  - query_id
  - metric_name
  - observed_score
  - p_value_raw
  - p_value_corrected
  - is_significant
  - statistical_interpretation
additionalProperties: false
