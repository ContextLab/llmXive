  \  raise RuntimeError(f\"No qrels found for dataset {dataset_name}\")\n\n# Extract\
  \ field names from the first record\nfirst_record = qrels[0]\nif hasattr(first_record,\
  \ \"_fields\"):\n    field_names = \",\".join(first_record._fields)\nelse:\n   \
  \ field_names = \",\".join(first_record.__dict__.keys())\n\nprint(f\"RECORDS={record_count}\"\
  )\nprint(f\"FIELDS={field_names}\")"
