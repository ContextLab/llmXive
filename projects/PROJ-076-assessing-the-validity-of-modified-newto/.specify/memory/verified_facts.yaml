'|dynamic milgrom modified newtonian proposed':
  quote: MOND was developed in 1982 and presented in 1983 by Israeli physicist Mordehai
    Milgrom. Milgrom noted that galaxy rotation curve data, which seemed to show that
    galaxies contain more matter than is observed, could also be explained if the
    gravitational force experienced by a star in the outer regions of a galaxy decays
    more slowly than predicted by Newton's law of gravity. MOND modifies Newton's
    laws for extremely small accelerations, which are common in galaxies and galaxy
    clusters. This provides a good fit to galaxy rotation curve data while leaving
    the dynamics of the Solar System with its strong gravitational field intact. However,
    the theory predicts that the gravitational field of the galaxy could influence
    the orbits of Kuiper Belt objects through the external field effect, which is
    unique to MOND.
  source_id: Modified Newtonian dynamics
  url: https://en.wikipedia.org/wiki/Modified_Newtonian_dynamics
  value: '1983'
