$schema: http://json-schema.org/draft-07/schema#
title: Galaxy Rotation Curve Dataset Schema
description: Schema for validated galaxy rotation curve data from SPARC.
type: object
required:
  - galaxies
properties:
  galaxies:
    type: array
    description: List of galaxy objects containing rotation curve data.
    items:
      type: object
      required:
        - name
        - inclination
        - inclination_uncertainty
        - distance
        - distance_uncertainty
        - mass_to_light_ratio
        - rotation_curve
      properties:
        name:
          type: string
          description: Galaxy identifier (e.g., NGC number).
        inclination:
          type: number
          description: Inclination angle in degrees.
        inclination_uncertainty:
          type: number
          description: Uncertainty in inclination angle in degrees.
        distance:
          type: number
          description: Distance to galaxy in Mpc.
        distance_uncertainty:
          type: number
          description: Uncertainty in distance in Mpc.
        mass_to_light_ratio:
          type: number
          description: Mass-to-light ratio in solar units.
        rotation_curve:
          type: array
          description: Array of rotation curve points.
          items:
            type: object
            required:
              - radius
              - velocity
              - velocity_uncertainty
            properties:
              radius:
                type: number
                description: Radial distance in kpc.
              velocity:
                type: number
                description: Rotational velocity in km/s.
              velocity_uncertainty:
                type: number
                description: Uncertainty in velocity in km/s.
