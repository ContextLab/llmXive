required_columns:
  - galaxy_name
  - radial_distance
  - velocity
  - uncertainty
  - inclination

column_types:
  galaxy_name: str
  radial_distance: float
  velocity: float
  uncertainty: float
  inclination: float

constraints:
  radial_distance:
    min: 0.0
  velocity:
    min: 0.0
  uncertainty:
    min: 0.0
  inclination:
    min: 0.0
    max: 90.0

description: |
  Schema for galaxy rotation curve data.
  Used to validate the output of the preprocessing pipeline.