$schema: "http://json-schema.org/draft-07/schema#"
title: "SPARC Galaxy Rotation Curve Dataset"
description: "Schema for the filtered galaxy rotation‑curve CSV produced by T015."
type: "object"
properties:
  galaxy:
    type: "string"
  r:
    type: "number"
  v:
    type: "number"
  v_err:
    type: "number"
  inclination:
    type: "number"
  inclination_err:
    type: "number"
required:
  - galaxy
  - r
  - v
  - v_err
  - inclination
  - inclination_err
additionalProperties: false
