# Schema for parsed galaxy rotation curve data
# Generated for PROJ-076: Assessing the Validity of Modified Newtonian Dynamics
# References: FR-002 (Data Parsing), FR-003 (Quality Filtering)
#
# This schema defines the structure of the `data/processed/filtered_galaxies.csv`
# and the internal DataFrame used during the preprocessing pipeline.
#
# All numeric fields are expected to be floating point numbers.
# Missing values should be represented as NaN.

$schema: http://json-schema.org/draft-07/schema#
title: GalaxyRotationCurveSchema
description: >
  Schema for galaxy rotation curve data derived from SPARC dataset.
  Includes radial distance, observed velocity, uncertainties, and metadata
  required for quality filtering (inclination, point count).

type: object
properties:
  galaxy_id:
    type: string
    description: >
      Unique identifier for the galaxy. Derived from the SPARC galaxy name
      (e.g., "NGC0001", "U3001").
    minLength: 1

  r:
    type: array
    items:
      type: number
    description: >
      Radial distance from the galaxy center (kpc).
      Must have at least 15 data points after filtering.
    minItems: 15

  v_obs:
    type: array
    items:
      type: number
    description: >
      Observed rotational velocity (km/s).
      Must correspond 1:1 with the `r` array.
    minItems: 15

  v_err:
    type: array
    items:
      type: number
    description: >
      Uncertainty in observed velocity (km/s).
      Must correspond 1:1 with the `r` and `v_obs` arrays.
    minItems: 15

  inclination:
    type: number
    description: >
      Galaxy inclination angle in degrees.
      Used for velocity correction: v_rot = v_obs / sin(inclination).
    minimum: 0
    maximum: 90

  inclination_err:
    type: number
    description: >
      Uncertainty in inclination angle in degrees.
      Quality filter requires this to be < 10.0 degrees.
    minimum: 0
    maximum: 90

  mass_to_light_ratio:
    type: number
    description: >
      Stellar mass-to-light ratio (M/L) in solar units.
      May be None or NaN if not available for a specific band.
    nullable: true

  distance:
    type: number
    description: >
      Distance to the galaxy (Mpc).
      Used for scale calculations.
    minimum: 0

  source_file:
    type: string
    description: >
      Original filename from the SPARC dataset (e.g., "NGC0001/NGC0001_RotCurve.dat").
    minLength: 1

  n_points:
    type: integer
    description: >
      Total number of data points in the rotation curve.
      Quality filter requires n_points >= 15.
    minimum: 15

required:
  - galaxy_id
  - r
  - v_obs
  - v_err
  - inclination
  - inclination_err
  - n_points
  - source_file

additionalProperties: true

# Validation constraints applied during preprocessing (code/preprocess.py)
# 1. inclination_err < 10.0
# 2. n_points >= 15
# 3. All velocity and radius values must be positive
# 4. Arrays must be of equal length