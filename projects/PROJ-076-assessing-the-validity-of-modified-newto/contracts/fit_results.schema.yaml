$schema: http://json-schema.org/draft-07/schema#
title: Fit Results Schema
description: >
  Schema for model fit outputs generated by the fitting engine (T023) and
  metric calculator (T024). Defines the structure for `results/fit_summary.csv`
  and intermediate fit result dictionaries.
  Complies with FR-007 (Goodness-of-Fit Metrics) and FR-009 (Residual Analysis).

type: object
required:
  - galaxy_id
  - model_type
  - parameters
  - metrics
  - fit_status
  - timestamp

properties:
  galaxy_id:
    type: string
    description: Unique identifier for the galaxy (e.g., "NGC-3198").
    minLength: 1

  model_type:
    type: string
    description: The type of model fitted.
    enum:
      - mond_simple
      - nfw

  parameters:
    type: object
    description: Best-fit parameters returned by the optimizer.
    properties:
      M_L:
        type: number
        description: Mass-to-light ratio (solar units). Used in both MOND and NFW baryonic scaling.
        minimum: 0
      a_0:
        type: number
        description: MOND acceleration constant (m/s^2). Only present for MOND models.
        minimum: 0
      c:
        type: number
        description: Concentration parameter. Only present for NFW models.
        minimum: 0
      r_s:
        type: number
        description: Scale radius (kpc). Only present for NFW models.
        minimum: 0
      v_max:
        type: number
        description: Maximum rotation velocity (km/s).
        minimum: 0
      cov_matrix:
        type: array
        description: Covariance matrix of the fitted parameters.
        items:
          type: array
          items:
            type: number

    required:
      - M_L
      - v_max

  metrics:
    type: object
    description: Goodness-of-fit metrics computed from the residuals.
    properties:
      reduced_chi2:
        type: number
        description: Reduced chi-squared statistic (chi2 / degrees_of_freedom).
      chi2:
        type: number
        description: Total chi-squared value.
      dof:
        type: integer
        description: Degrees of freedom (N_points - N_parameters).
      aic:
        type: number
        description: Akaike Information Criterion.
      bic:
        type: number
        description: Bayesian Information Criterion.
      log_likelihood:
        type: number
        description: Log-likelihood of the fit.

    required:
      - reduced_chi2
      - chi2
      - dof
      - aic
      - bic
      - log_likelihood

  residuals:
    type: object
    description: Summary statistics of the residuals (observed - predicted).
    properties:
      mean:
        type: number
      median:
        type: number
      std:
        type: number
      max_abs:
        type: number
      rmse:
        type: number
      n_points:
        type: integer

    required:
      - mean
      - median
      - std
      - max_abs
      - rmse
      - n_points

  fit_status:
    type: object
    description: Status information from the optimization routine.
    properties:
      success:
        type: boolean
        description: Whether the optimizer converged successfully.
      message:
        type: string
        description: Message from the optimizer.
      nfev:
        type: integer
        description: Number of function evaluations.
      njev:
        type: integer
        description: Number of Jacobian evaluations.

    required:
      - success
      - message

  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the fit was performed.

additionalProperties: false