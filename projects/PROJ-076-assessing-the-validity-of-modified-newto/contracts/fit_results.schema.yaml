%YAML 1.2
---
title: Model Fit Results Schema
description: |
  Schema for results generated by fitting MOND and NFW models to galaxy rotation curves.
  Includes parameters, goodness-of-fit metrics, and metadata.
type: object
required:
  - galaxy_id
  - model_name
  - parameters
  - metrics
  - fit_timestamp
properties:
  galaxy_id:
    type: string
    description: Unique identifier for the galaxy
  model_name:
    type: string
    description: Name of the model used (e.g., 'mond_simple', 'nfw')
  parameters:
    type: object
    description: Fitted model parameters
    properties:
      ml_ratio:
        type: number
        description: Mass-to-light ratio (for MOND)
      scale_radius:
        type: number
        description: Scale radius in kpc (for NFW)
      concentration:
        type: number
        description: Concentration parameter (for NFW)
      v_max:
        type: number
        description: Maximum velocity in km/s
      chi2:
        type: number
        description: Raw chi-squared value
      ndof:
        type: integer
        description: Number of degrees of freedom
  metrics:
    type: object
    description: Goodness-of-fit metrics
    required:
      - reduced_chi2
      - aic
      - bic
    properties:
      reduced_chi2:
        type: number
        description: Reduced chi-squared (chi2 / ndof)
      aic:
        type: number
        description: Akaike Information Criterion
      bic:
        type: number
        description: Bayesian Information Criterion
      covariance_diagonal:
        type: array
        description: Diagonal of the covariance matrix (parameter uncertainties squared)
        items:
          type: number
  fit_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the fit execution
  convergence_status:
    type: string
    description: Status of the optimization routine
    enum: [converged, max_iter_reached, failed]
  message:
    type: string
    description: Optional message from the optimizer
additionalProperties: false
examples:
  - galaxy_id: "NGC2403"
    model_name: "mond_simple"
    parameters:
      ml_ratio: 0.85
      chi2: 45.2
      ndof: 40
    metrics:
      reduced_chi2: 1.13
      aic: 52.4
      bic: 58.1
      covariance_diagonal: [0.005, 0.002]
    fit_timestamp: "2023-10-27T10:00:00Z"
    convergence_status: "converged"
    message: "Optimization terminated successfully"