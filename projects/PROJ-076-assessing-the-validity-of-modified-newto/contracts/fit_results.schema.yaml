$schema: "http://json-schema.org/draft-07/schema#"
title: "Fit Results Schema"
description: "Schema for the CSV generated by the fitting engine (T025)."
type: "object"
properties:
  galaxy_id:
    type: "string"
  model_type:
    type: "string"
    enum: ["mond", "nfw"]
  success:
    type: "boolean"
  message:
    type: "string"
  M/L_value:
    type: ["number", "null"]
  M/L_error:
    type: ["number", "null"]
  r_s_value:
    type: ["number", "null"]
  r_s_error:
    type: ["number", "null"]
  reduced_chi2:
    type: ["number", "null"]
  AIC:
    type: ["number", "null"]
  BIC:
    type: ["number", "null"]
required:
  - galaxy_id
  - model_type
  - success
  - message
additionalProperties: true
