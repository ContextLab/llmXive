# Pre-commit configuration to enforce linting and formatting
# Task: T003 - Configure linting (ruff) and formatting (black)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # Note: ruff-format replaces black, but we keep black hook for compatibility
        # if the team prefers explicit black usage, or remove this and use only ruff-format
        # Here we use ruff for linting and black for formatting as per task description
        # to ensure both are run. If ruff-format is preferred, remove the black hook above.
        # For this implementation, we rely on the black hook above for formatting
        # and ruff here for linting.
        args: [--fix, --exit-non-zero-on-fix]
