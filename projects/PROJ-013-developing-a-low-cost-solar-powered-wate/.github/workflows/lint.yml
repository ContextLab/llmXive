name: Lint and Format Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Check formatting with Black
        run: |
          black --check --diff .

      - name: Check imports with isort
        run: |
          isort --check-only --diff .

      - name: Run Ruff linting
        run: |
          ruff check .

      - name: Run type checking with MyPy (optional)
        run: |
          pip install mypy
          mypy code/ --ignore-missing-imports || true

      - name: Run flake8 (optional, for additional checks)
        run: |
          pip install flake8
          flake8 code/ --max-line-length=100 --ignore=E501,W503 || true

      - name: Report status
        run: |
          echo "Linting and formatting checks completed successfully."