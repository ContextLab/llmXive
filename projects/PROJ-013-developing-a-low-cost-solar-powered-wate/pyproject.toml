[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-purification-tradeoff"
version = "0.1.0"
description = "Low-cost solar-powered water purification trade-off analysis"
requires-python = ">=3.11"
dependencies = [
    "scipy",
    "numpy",
    "pandas",
    "matplotlib",
    "requests",
    "beautifulsoup4",
    "pyyaml",
    "pytest",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.ruff]
# Target Python version
target-version = "py311"

# Line length for linting
line-length = 88

# Enable specific rule sets
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
]

# Ignore specific rules if needed
ignore = [
    "E501",  # Line too long (handled by Black)
    "B008",  # Do not perform function call in argument defaults (common in data classes)
]

# Per-file ignores
[tool.ruff.per-file-ignores]
"tests/*" = ["ARG", "S101"]  # Allow unused args and assert in tests

[tool.ruff.isort]
known-first-party = ["code"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
