$schema: "http://json-schema.org/draft-07/schema#"
title: AnalysisResult
description: >-
  Summary statistics and statistical test results from the GLMM analysis.
type: object
required:
  - threshold
  - accuracy_mean
  - latency_mean
  - p_value_interaction
properties:
  threshold:
    type: number
    description: The BLEU threshold used for this sensitivity subset (if applicable).
    default: null
  accuracy_mean:
    type: number
    description: Mean accuracy for the analyzed subset.
    minimum: 0
    maximum: 1
  latency_mean:
    type: number
    description: Mean latency in milliseconds for the analyzed subset.
    minimum: 0
  p_value_interaction:
    type: number
    description: P-value for the condition * complexity interaction term in the GLMM.
    minimum: 0
    maximum: 1
  f_statistic:
    type: number
    description: F-statistic for the interaction term.
    minimum: 0
  model_type:
    type: string
    description: Type of model used (e.g., 'GLMM-Binomial').
    default: "GLMM-Binomial"
  limitation_note:
    type: string
    description: >-
      Mandatory note regarding BLEU similarity limitations as per FR-009.
    minLength: 1
additionalProperties: false