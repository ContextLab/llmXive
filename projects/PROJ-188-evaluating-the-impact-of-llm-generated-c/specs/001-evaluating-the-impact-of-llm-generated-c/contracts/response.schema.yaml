$schema: "http://json-schema.org/draft-07/schema#"
title: Response
description: >-
  Represents a single participant response to a survey item.
  Includes answer correctness, latency, and metadata.
type: object
required:
  - participant_id
  - condition
  - snippet_id
  - answer
  - latency_ms
  - timestamp
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant.
    minLength: 1
  condition:
    type: string
    description: The experimental condition under which the response was recorded.
    enum:
      - code_only
      - code_llm
      - code_docstring
  snippet_id:
    type: string
    description: Reference to the Snippet entity.
    minLength: 1
  answer:
    type: boolean
    description: Whether the participant's answer was correct.
  latency_ms:
    type: integer
    description: Time taken to answer in milliseconds.
    minimum: 0
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the response.
  missing_count:
    type: integer
    description: >-
      Count of unanswered questions for this participant at the time of this record.
      Used for aggregation and filtering; removed from final clean dataset.
    minimum: 0
    x-usage-note: "Temporary field for participant-level aggregation; dropped in responses_clean.csv."
additionalProperties: false
