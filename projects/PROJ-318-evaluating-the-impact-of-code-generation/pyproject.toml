[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-evaluation"
version = "0.1.0"
description = "Evaluating the impact of code generation models on code documentation completeness"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "transformers==4.35.0",
    "torch==2.1.0",
    "bitsandbytes==0.41.0",
    "sentence-transformers==2.2.2",
    "docstring_parser==0.16",
    "scipy==1.11.0",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "pytest==7.4.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*", "tests*"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"