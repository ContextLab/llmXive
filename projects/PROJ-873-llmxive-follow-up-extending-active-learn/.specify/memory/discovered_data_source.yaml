access_python: "import os\nfrom beir import util\nfrom beir.datasets.data_loader import\
  \ GenericDataLoader\n\n# Define dataset and download location\ndataset = \"scifact\"\
  \nurl = f\"https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/{dataset}.zip\"\
  \nout_dir = \"beir_data\"\n\n# Download and unzip the dataset\ndata_path = util.download_and_unzip(url,\
  \ out_dir)\n\n# Load the full corpus, queries, and qrels for the test split\ncorpus,\
  \ queries, qrels = GenericDataLoader(data_path).load(split=\"test\")\n\nrecords\
  \ = []\nfor qid, doc_dict in qrels.items():\n    # BEIR may store query as a plain\
  \ string or as a dict with a \"text\" field\n    query_entry = queries[qid]\n  \
  \  query_text = query_entry[\"text\"] if isinstance(query_entry, dict) else str(query_entry)\n\
  \n    for doc_id, rel in doc_dict.items():\n        # Corpus entries can be dicts\
  \ with \"text\" (and optionally \"title\") or plain strings\n        doc_entry =\
  \ corpus[doc_id]\n        doc_text = (\n            doc_entry[\"text\"]\n      \
  \      if isinstance(doc_entry, dict) and \"text\" in doc_entry\n            else\
  \ str(doc_entry)\n        )\n        records.append(\n            {\n          \
  \      \"query_id\": qid,\n                \"query_text\": query_text,\n       \
  \         \"doc_id\": doc_id,\n                \"doc_text\": doc_text,\n       \
  \         \"relevance_label\": rel,\n                \"split\": \"test\",\n    \
  \        }\n        )\n\nif not records:\n    raise RuntimeError(\"No records loaded;\
  \ dataset may be empty or split name incorrect.\")\n\nprint(f\"RECORDS={len(records)}\"\
  )\nprint(\"FIELDS=query_id,query_text,doc_id,doc_text,relevance_label,split\")"
