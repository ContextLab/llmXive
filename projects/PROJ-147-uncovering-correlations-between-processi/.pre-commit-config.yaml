# Pre-commit configuration for the rolled-metals texture pipeline.
# Configures linting (ruff) and formatting (black) tools.
# Install with:  pre-commit install
# Run manually:  pre-commit run --all-files

repos:
  # General hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024'] # Limit files to 1 MB

  # Formatting: black (line length 100)
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=100]

  # Linting: ruff (flake8-compatible rules, auto-fix enabled)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]