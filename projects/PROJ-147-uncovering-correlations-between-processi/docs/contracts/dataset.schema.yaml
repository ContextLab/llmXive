version: 1.0
description: "Schema for the combined processed dataset containing processing parameters and texture coefficients."
columns:
  sample_id: 
    type: string
    description: "Unique identifier for the sample"
  alloy_family: 
    type: string
    description: "Alloy classification (e.g., Al, Cu, Steel)"
  rolling_speed: 
    type: float
    unit: "m/s"
    description: "Rolling speed"
  temperature: 
    type: float
    unit: "deg C"
    description: "Rolling temperature"
  reduction_ratio: 
    type: float
    unit: "percent"
    description: "Reduction ratio"
  odf_100: 
    type: float
    unit: "MRD"
    description: "Peak ODF intensity for {100} plane"
  odf_110: 
    type: float
    unit: "MRD"
    description: "Peak ODF intensity for {110} plane"
  odf_111: 
    type: float
    unit: "MRD"
    description: "Peak ODF intensity for {111} plane"
