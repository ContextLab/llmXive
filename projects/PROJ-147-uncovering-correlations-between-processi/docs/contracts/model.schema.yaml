version: 1.0
description: "Schema for the trained model metadata."
fields:
  model_type: 
    type: string
    example: "RandomForestRegressor"
  hyperparameters:
    type: object
    properties:
      n_estimators: {type: integer}
      max_depth: {type: integer}
      random_state: {type: integer}
  training_date: 
    type: string
    format: "date-time"
  version: 
    type: string
