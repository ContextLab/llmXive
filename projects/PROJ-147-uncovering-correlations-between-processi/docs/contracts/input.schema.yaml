# Input Data Schema for Raw Data Ingestion
# Defines the expected structure of raw input data before processing.
# Used by: code/data/loader.py, code/data/processor.py
$schema: http://json-schema.org/draft-07/schema#
title: RawInputDataSchema
description: |
  Schema for raw input data ingested from external sources (Materials Project,
  NIST) or synthetic generators before preprocessing.
type: object
required:
  - raw_data
properties:
  raw_data:
    type: array
    items:
      $ref: "#/definitions/raw_record"
    minItems: 1
definitions:
  raw_record:
    type: object
    required:
      - record_id
      - alloy_composition
      - processing_params
      - texture_measurements
    properties:
      record_id:
        type: string
        description: Unique identifier for the raw record
      alloy_composition:
        type: object
        required:
          - family
          - elements
        properties:
          family:
            type: string
            description: Alloy family name
          elements:
            type: object
            additionalProperties:
              type: number
            description: Composition in weight percent (e.g., {"Al": 95, "Mg": 5})
      processing_params:
        type: object
        properties:
          temperature:
            type: number
            description: Processing temperature (K)
          reduction:
            type: number
            description: Reduction ratio
          strain_rate:
            type: number
            description: Strain rate (1/s)
          annealing:
            type: object
            properties:
              temp:
                type: number
              time:
                type: number
      texture_measurements:
        type: object
        properties:
          odf_values:
            type: array
            items:
              type: number
            description: Raw ODF intensity values
          planes:
            type: array
            items:
              type: string
            description: Corresponding Miller indices (e.g., "{100}")
      metadata:
        type: object
        properties:
          source:
            type: string
            description: Original data source (e.g., "NIST", "Synthetic")
          timestamp:
            type: string
            format: date-time
          quality_flags:
            type: array
            items:
              type: string
            description: Quality flags or warnings
