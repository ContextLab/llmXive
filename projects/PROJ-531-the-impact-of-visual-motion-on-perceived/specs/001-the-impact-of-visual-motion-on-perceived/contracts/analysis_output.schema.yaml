type: object
description: "Schema for the model_metrics.json artifact produced by the statistical modeling pipeline. Includes regression results, random‑forest importance, cross‑validation metrics, VIF scores, and sensitivity analysis outcomes."
required:
  - metadata
  - ols_results
  - ridge_results
  - random_forest_results
  - sensitivity_analysis
  - correlations
  - warnings
properties:
  metadata:
    type: object
    description: Provenance and configuration information.
    required:
      - timestamp
      - n_samples
      - model_types
      - correction_method
      - data_source
      - sc001_pass
      - vif_pass
      - power_pass
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO‑8601 timestamp of generation.
      n_samples:
        type: integer
        description: Number of complete observations used.
      model_types:
        type: array
        items:
          type: string
        description: List of fitted models (e.g., ["OLS","Ridge","RandomForest"]).
      correction_method:
        type: string
        description: Multiple‑comparison method applied ("bonferroni" or "benjamini‑hochberg").
      data_source:
        type: string
        description: Identifier of the input data ("real" or "synthetic").
      sc001_pass:
        type: boolean
        description: True if ≥ 100 complete observations after preprocessing.
      vif_pass:
        type: boolean
        description: True if all VIF values < 5.
      power_pass:
        type: boolean
        description: True if achieved statistical power ≥ 0.80.
  ols_results:
    type: object
    description: Results from the ordinary least squares regression.
    required:
      - coefficients
      - p_values
      - p_values_corrected
      - standard_errors
      - cv_metrics
    properties:
      coefficients:
        type: object
        additionalProperties:
          type: number
        description: Feature → coefficient.
      p_values:
        type: object
        additionalProperties:
          type: number
        description: Raw p‑values per feature.
      p_values_corrected:
        type: object
        additionalProperties:
          type: number
        description: Corrected p‑values.
      standard_errors:
        type: object
        additionalProperties:
          type: number
        description: Standard errors per coefficient.
      cv_metrics:
        type: object
        required:
          - r2_mean
          - r2_std
          - rmse_mean
        properties:
          r2_mean:
            type: number
            description: Mean R² across 5 folds.
          r2_std:
            type: number
            description: Standard deviation of R².
          rmse_mean:
            type: number
            description: Mean RMSE across folds.
      formula:
        type: string
        description: Model formula string.
  ridge_results:
    type: object
    description: Results from the Ridge regression model.
    required:
      - alpha
      - coefficients
      - cv_metrics
    properties:
      alpha:
        type: number
        description: Regularization strength.
      coefficients:
        type: object
        additionalProperties:
          type: number
        description: Feature → Ridge coefficient.
      cv_metrics:
        type: object
        required:
          - r2_mean
          - r2_std
        properties:
          r2_mean:
            type: number
          r2_std:
            type: number
  random_forest_results:
    type: object
    description: Results from the Random Forest model.
    required:
      - max_depth
      - n_estimators
      - feature_importance
      - cv_metrics
    properties:
      max_depth:
        type: integer
        nullable: true
        description: Tree depth limit (null = unlimited).
      n_estimators:
        type: integer
        description: Number of trees.
      feature_importance:
        type: object
        additionalProperties:
          type: number
        description: Normalized importance scores.
      cv_metrics:
        type: object
        required:
          - r2_mean
          - r2_std
          - rmse_mean
        properties:
          r2_mean:
            type: number
          r2_std:
            type: number
          rmse_mean:
            type: number
  sensitivity_analysis:
    type: object
    description: Results from the coefficient‑threshold sensitivity sweep (FR‑010).
    required:
      - thresholds
      - significance_rates
      - p_value_variance
    properties:
      thresholds:
        type: array
        items:
          type: number
        description: Tested coefficient magnitude thresholds.
      significance_rates:
        type: array
        items:
          type: number
        description: Fraction of bootstrap samples with p < 0.05 per threshold.
      p_value_variance:
        type: number
        description: Variance of p‑values across bootstraps.
  correlations:
    type: object
    description: Correlation diagnostics (multicollinearity, predictor‑outcome links).
    properties:
      motion_features_vs_agency:
        type: object
        additionalProperties:
          type: number
        description: Pearson r for each motion feature vs. agency.
      trigger_vs_agency:
        type: number
        description: Correlation between user_response_trigger and agency (must be < 0.05).
      feature_matrix:
        type: array
        items:
          type: array
          items:
            type: number
        description: Full predictor correlation matrix (optional).
  warnings:
    type: array
    items:
      type: string
    description: List of runtime warnings (e.g., high VIF, low variance, lead‑time omitted).
