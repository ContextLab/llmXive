type: object
description: >
  Schema for the model_metrics.json artifact produced by the statistical
  modeling pipeline (T026). This file contains the aggregated results from
  OLS, Ridge, and Random Forest models, including coefficients, p-values,
  feature importance, and cross-validation metrics.
required:
  - metadata
  - ols_results
  - ridge_results
  - random_forest_results
  - sensitivity_analysis
  - correlations
properties:
  metadata:
    type: object
    description: Provenance and configuration information.
    required:
      - timestamp
      - n_samples
      - model_types
      - correction_method
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the metrics were generated.
      n_samples:
        type: integer
        description: Number of samples used in the final analysis.
      model_types:
        type: array
        items:
          type: string
        description: List of models fitted (e.g., ["OLS", "Ridge", "RandomForest"]).
      correction_method:
        type: string
        description: Method used for multiple-comparison correction (e.g., "bonferroni", "bh").
      data_source:
        type: string
        description: Path or identifier of the input data (e.g., "synthetic", "data/raw/synthetic_data.csv").

  ols_results:
    type: object
    description: Results from the Multiple Linear Regression (OLS) model.
    required:
      - coefficients
      - p_values
      - p_values_corrected
      - standard_errors
      - cv_metrics
    properties:
      coefficients:
        type: object
        additionalProperties:
          type: number
        description: Mapping of feature names to unstandardized regression coefficients.
      p_values:
        type: object
        additionalProperties:
          type: number
        description: Raw p-values for each coefficient.
      p_values_corrected:
        type: object
        additionalProperties:
          type: number
        description: Multiple-comparison corrected p-values (Bonferroni or BH).
      standard_errors:
        type: object
        additionalProperties:
          type: number
        description: Standard errors for each coefficient.
      cv_metrics:
        type: object
        required:
          - r2_mean
          - r2_std
          - rmse_mean
        properties:
          r2_mean:
            type: number
            description: Mean R² score from k-fold cross-validation.
          r2_std:
            type: number
            description: Standard deviation of R² scores.
          rmse_mean:
            type: number
            description: Mean Root Mean Squared Error from k-fold cross-validation.
      formula:
        type: string
        description: The formula string used for the OLS model.

  ridge_results:
    type: object
    description: Results from the Ridge Regression model (robustness check).
    required:
      - alpha
      - coefficients
      - cv_metrics
    properties:
      alpha:
        type: number
        description: Regularization strength parameter.
      coefficients:
        type: object
        additionalProperties:
          type: number
        description: Mapping of feature names to Ridge coefficients.
      cv_metrics:
        type: object
        required:
          - r2_mean
          - r2_std
        properties:
          r2_mean:
            type: number
          r2_std:
            type: number

  random_forest_results:
    type: object
    description: Results from the Random Forest model.
    required:
      - feature_importance
      - cv_metrics
    properties:
      max_depth:
        type: integer
        nullable: true
        description: Maximum depth of the trees (null if unlimited).
      n_estimators:
        type: integer
        description: Number of trees in the forest.
      feature_importance:
        type: object
        additionalProperties:
          type: number
        description: Mapping of feature names to importance scores (sum to 1.0).
      cv_metrics:
        type: object
        required:
          - r2_mean
          - r2_std
          - rmse_mean
        properties:
          r2_mean:
            type: number
          r2_std:
            type: number
          rmse_mean:
            type: number

  sensitivity_analysis:
    type: object
    description: Results from the threshold sweep sensitivity analysis (FR-010).
    required:
      - thresholds
      - significance_rates
      - p_value_variance
    properties:
      thresholds:
        type: array
        items:
          type: number
        description: List of coefficient magnitude thresholds tested (e.g., [0.01, 0.05, 0.1]).
      significance_rates:
        type: array
        items:
          type: number
        description: Fraction of bootstrap samples where p < 0.05 for each threshold.
      p_value_variance:
        type: number
        description: Variance of p-values across bootstrap samples.

  correlations:
    type: object
    description: Correlation matrix of predictors and target to check for multicollinearity and relationships.
    properties:
      motion_features_vs_agency:
        type: object
        additionalProperties:
          type: number
        description: Pearson correlation of each motion feature with agency_score.
      trigger_vs_agency:
        type: number
        description: Pearson correlation between user_response_trigger and agency_score (must be < 0.05).
      feature_matrix:
        type: array
        items:
          type: array
          items:
            type: number
        description: Full correlation matrix of motion features (optional, for diagnostics).

  warnings:
    type: array
    items:
      type: string
    description: List of warnings generated during analysis (e.g., "High VIF detected", "Small sample size").