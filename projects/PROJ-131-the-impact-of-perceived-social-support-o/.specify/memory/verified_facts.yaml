'|contain gad item scale':
  quote: In addition to the PHQ, a nine-item version to assess symptoms of depression,
    a seven-item version to assess symptoms of anxiety (GAD-7) and a 15-item version
    to detect somatic symptoms (PHQ-15), have been developed and validated. The PHQ-9,
    GAD-7, and the PHQ-15 were combined to create the PHQ-somatic, anxiety, depressive
    symptoms (PHQ-SADS) and includes questions regarding panic attacks (after the
    GAD-7 section). Though less commonly used, there are also brief versions of the
    PHQ-9 and GAD-7 that may be useful as screening tools in some settings. In recent
    years, the PHQ-9 has been validated for use in adolescents, and a version for
    adolescents was also developed and validated (PHQ-A). Although these tests were
    originally designed as self-report inventories they can also be administered by
    trained health care practitioners.
  source_id: Patient Health Questionnaire
  url: https://en.wikipedia.org/wiki/Patient_Health_Questionnaire
  value: '7'
