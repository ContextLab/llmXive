# Scoring Scales Configuration
# Values derived from official instrument documentation:
# 1. CES-D: Radloff, L. S. (n.d.). The CES-D Scale: A self-report depression scale for research in the general population.
# 2. GAD-7: Spitzer, R. L., et al. (2006). A Brief Measure for Assessing Generalized Anxiety Disorder.
# 3. PCL-5: Weathers, F. W., et al. (2013). The PTSD Checklist for DSM-5 (PCL-5).
#
# NOTE: The dataset provides aggregate scores, not raw items.
# This configuration defines the mapping from dataset columns to canonical variable names
# and the scoring type used by the analysis pipeline.

CES-D:
  variable: 'depression' # Mapped from spec's Data Dictionary
  type: 'aggregate_score'
  source_citation: "Radloff, L. S. (1977). The CES-D Scale: A self-report depression scale for research in the general population. Applied Psychological Measurement, 1(3), 385-401."

GAD-7:
  variable: 'anxiety' # Mapped from spec's Data Dictionary
  type: 'aggregate_score'
  source_citation: "Spitzer, R. L., Kroenke, K., Williams, J. B., & Löwe, B. (2006). A brief measure for assessing generalized anxiety disorder: the GAD-7. Archives of internal medicine, 166(10), 1092-1097."

PCL-5:
  variable: 'ptsd' # Mapped from spec's Data Dictionary
  type: 'aggregate_score'
  source_citation: "Weathers, F. W., Litz, B. T., Keane, T. M., Palmieri, P. A., Marx, B. P., & Schnurr, P. P. (2013). The PTSD Checklist for DSM-5 (PCL-5). Scale available from the National Center for PTSD at www.ptsd.va.gov."
