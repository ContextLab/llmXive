# Scoring Scales Configuration
# Values derived from official instrument documentation:
# 1. CES-D: Radloff, L. S. (n.d.). The CES-D Scale: A self-report depression scale for research in the general population.
# 2. GAD: Spitzer, R. L., et al. (2006). A Brief Measure for Assessing Generalized Anxiety Disorder.
# 3. PCL: Weathers, F. W., et al. (2013). The PTSD Checklist for DSM-5 (PCL-5).
#
# NOTE: The dataset may provide aggregate scores directly. If raw items are missing, use the aggregate columns.
# If raw items are missing, verify that the provided aggregate scores match the standard algorithm (e.g., by comparing a sample).
#
# The 'type' field indicates whether the code should sum raw items ('raw_items') or use pre-calculated columns ('aggregate_score').
# The 'variable' key must match the column name in the analysis cohort (e.g., 'depression', 'anxiety', 'ptsd').

CES-D:
  variable: 'depression'
  type: 'raw_items'
  # Standard CES-D scoring: Sum of 20 items (0-3 each).
  # If raw items are present, columns are expected to be named 'cesd_item_1' through 'cesd_item_20'.
  # If 'type' is 'aggregate_score', the code expects a single column 'depression' with the pre-summed value.
  raw_item_prefix: 'cesd_item_'
  item_count: 20
  range: [0, 60]

GAD-7:
  variable: 'anxiety'
  type: 'raw_items'
  # Standard GAD-7 scoring: Sum of 7 items (0-3 each).
  # If raw items are present, columns are expected to be named 'gad7_item_1' through 'gad7_item_7'.
  raw_item_prefix: 'gad7_item_'
  item_count: 7
  range: [0, 21]

PCL-5:
  variable: 'ptsd'
  type: 'raw_items'
  # Standard PCL-5 scoring: Sum of 20 items (0-4 each).
  # If raw items are present, columns are expected to be named 'pcl5_item_1' through 'pcl5_item_20'.
  raw_item_prefix: 'pcl5_item_'
  item_count: 20
  range: [0, 80]
