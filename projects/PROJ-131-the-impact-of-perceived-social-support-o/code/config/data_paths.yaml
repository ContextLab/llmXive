# Environment Configuration for Data Paths
# Defines all directory paths relative to the project root.
# Used by ingestion, preprocessing, and analysis modules to locate inputs/outputs.
paths:
  root: "."
  data:
    raw: "data/raw"
    processed: "data/processed"
    results: "data/results"
    figures: "figures"
  code:
    config: "code/config"
    scripts: "code/scripts"
  logs:
    pipeline: "data/results/pipeline_run.log"
    ingestion: "data/results/ingestion.log"
    preprocessing: "data/results/preprocessing.log"
    analysis: "data/results/analysis.log"

# Specific file paths for critical artifacts
artifacts:
  cohort: "data/results/analysis_cohort.csv"
  regression_results: "data/results/regression_results.csv"
  sensitivity_results: "data/results/sensitivity_analysis.csv"
  validation_report: "data/results/validation_report.json"
  platform_status: "data/results/platform_status.json"
  reproducibility_audit: "data/results/reproducibility_audit.json"
  performance_report: "data/results/performance_report.json"
  data_lineage: "data/results/data_lineage_report.md"
  regression_summary: "data/results/regression_summary.md"