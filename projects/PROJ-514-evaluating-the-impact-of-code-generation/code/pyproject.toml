[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-evaluating-code-generation-impact"
version = "0.1.0"
description = "Automated science pipeline for evaluating code generation impact on code smell frequency"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests==2.31.0",
    "GitPython==3.1.40",
    "pandas==2.2.1",
    "scipy==1.13.0",
    "matplotlib==3.9.0",
    "pyyaml==6.0.1",
    "pytest==8.2.0",
    "ruff==0.4.8",
    "black==24.4.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.4.8",
    "black==24.4.2",
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
]

[tool.ruff]
# Enable specific rule sets: E (pycodestyle), F (Pyflakes), W (warning)
# Also enable I (isort) for import sorting and C4 (flake8-comprehensions)
select = ["E", "F", "W", "I", "C4"]
ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude a few specific directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Per-rule configuration
[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

# Line length (Black compatibility)
line-length = 88

# Target version (Python 3.9+)
target-version = "py39"

[tool.ruff.isort]
known-first-party = ["utils", "01_data_collection", "02_static_analysis", "03_statistical_analysis", "04_reporting"]
force-sort-within-sections = true

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.nox
    | \.pants\.d
    | \.ruff_cache
    | \.svn
    | \.tox
    | \.venv
    | __pypackages__
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | venv
)/
'''
force-exclude = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "contract: Contract tests defining interfaces",
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Marks tests as slow (deselect with '-m \"not slow\"')",
]
