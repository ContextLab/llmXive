[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-code-smell-study"
version = "0.1.0"
description = "Evaluating the impact of code generation on code smell frequency"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests==2.31.0",
    "GitPython==3.1.40",
    "pandas==2.2.1",
    "scipy==1.13.0",
    "matplotlib==3.9.0",
    "pyyaml==6.0.1",
    "pytest==8.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.4.8",
    "black==24.4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.ruff]
# Enable pycodestyle (`E`), Pyflakes (`F`), and Warnings (`W`)
select = ["E", "F", "W"]
ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude specific directories
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

# Same rules as Black
line-length = 88
indent-width = 4

# Assume Python 3.9
target-version = "py39"

[tool.ruff.per-file-ignores]
# Ignore unused imports in __init__.py files
"__init__.py" = ["F401"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.tox
    | __pycache__
    | build
    | dist
    | \.egg-info
)/
'''
skip-string-normalization = false
required-version = "24.4.2"
