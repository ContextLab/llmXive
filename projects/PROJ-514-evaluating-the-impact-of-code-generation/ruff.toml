# Ruff configuration for llmXive project
target-version = "py39"
line-length = 100
indent-width = 4

[lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

# Allow autofix for all enabled rules (when `--fix` is provided).
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "M", "N", "O", "P", "Q", "R", "S", "T", "U", "V", "W", "X", "Y", "Z"]
unfixable = []

# Exclude a few files and directories from linting.
extend-exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "venv",
    "data",
    "reports",
    "build",
    "dist",
]

[lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests

[lint.isort]
known-first-party = ["utils", "01_data_collection", "02_static_analysis", "03_statistical_analysis", "04_reporting"]
force-sort-within-sections = true
combine-as-imports = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"