[project]
name = "llmXive-code-smell-study"
version = "0.1.0"
description = "Evaluating the impact of code generation on code smell frequency"
requires-python = ">=3.9"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | data
  | reports
)/
'''