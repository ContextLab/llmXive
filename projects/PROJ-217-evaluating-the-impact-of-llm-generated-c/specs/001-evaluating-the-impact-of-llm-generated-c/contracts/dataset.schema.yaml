$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Record Schema"
description: "Schema for each record in the merged analysis dataset."
type: object
required:
  - snippet_id
  - condition
  - code
  - human_comment
  - llm_comment
  - no_comment
  - BLEU
  - ROUGE_L
  - Semantic_Similarity
  - completion_time_sec
  - accuracy
  - subjective_helpfulness
properties:
  snippet_id:
    type: string
    description: "Unique identifier for the code snippet (UUID)."
  condition:
    type: string
    enum: ["llm", "human", "none"]
    description: "Experimental condition."
  code:
    type: string
    description: "Original Python code snippet."
  human_comment:
    type: string
    description: "Original docstring from CodeSearchNet."
  llm_comment:
    type: string
    description: "Comment generated by CodeLlama‑7B."
  no_comment:
    type: string
    description: "Empty string representing the no‑comment baseline."
  BLEU:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "BLEU score normalized to [0,1]."
  ROUGE_L:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "ROUGE‑L score normalized to [0,1]."
  Semantic_Similarity:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Cosine similarity between comment and docstring embeddings."
  completion_time_sec:
    type: number
    minimum: 0.0
    description: "Time (seconds) a participant took to complete the task."
  accuracy:
    type: integer
    enum: [0, 1]
    description: "Binary correctness of the participant's solution."
  subjective_helpfulness:
    type: integer
    minimum: 1
    maximum: 5
    description: "Likert rating of how helpful the comment was (1‑5)."
