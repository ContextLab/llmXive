$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Record Schema"
description: "Schema for each record in the merged analysis dataset."
type: object
required:
  - snippet_id
  - condition
  - code
  - human_comment
  - llm_comment
  - no_comment
  - BLEU_vs_source
  - BLEU_vs_human
  - ROUGE_L_vs_source
  - ROUGE_L_vs_human
  - Semantic_Similarity_vs_source
  - Semantic_Similarity_vs_human
  - completion_time_sec
  - accuracy
  - subjective_helpfulness
properties:
  snippet_id:
    type: string
    description: "Unique identifier for the code snippet (UUID)."
  condition:
    type: string
    enum: ["llm", "human", "none"]
    description: "Experimental condition."
  code:
    type: string
    description: "Original Python code snippet."
  human_comment:
    type: string
    description: "Original docstring from CodeSearchNet."
  llm_comment:
    type: string
    description: "Comment generated by CodeLlama-7B."
  no_comment:
    type: string
    description: "Empty string representing the no-comment baseline."
  BLEU_vs_source:
    type: ["number", "null"]
    description: "BLEU score (0‑1) comparing the comment to the source code; null for no-comment rows."
  BLEU_vs_human:
    type: ["number", "null"]
    description: "BLEU score (0‑1) comparing the comment to the human docstring; null for no-comment rows."
  ROUGE_L_vs_source:
    type: ["number", "null"]
    description: "ROUGE‑L score (0‑1) comparing the comment to the source code; null for no-comment rows."
  ROUGE_L_vs_human:
    type: ["number", "null"]
    description: "ROUGE‑L score (0‑1) comparing the comment to the human docstring; null for no-comment rows."
  Semantic_Similarity_vs_source:
    type: ["number", "null"]
    description: "Cosine similarity (0‑1) between comment embedding and source code embedding; null for no-comment rows."
  Semantic_Similarity_vs_human:
    type: ["number", "null"]
    description: "Cosine similarity (0‑1) between comment embedding and human docstring embedding; null for no-comment rows."
  completion_time_sec:
    type: number
    minimum: 0.0
    description: "Time in seconds a participant took to complete the task."
  accuracy:
    type: integer
    enum: [0, 1]
    description: "Binary correctness of the participant's solution."
  subjective_helpfulness:
    type: integer
    minimum: 1
    maximum: 5
    description: "Likert rating of how helpful the comment was (1‑5)."

