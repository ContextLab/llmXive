[metadata]
name = llmxive-code-complexity
version = 0.1.0
description = Investigating the Impact of Code Complexity on LLM Code Understanding
author = llmXive Research Team
python_requires = >=3.11

[options]
packages = find:
install_requires =
    radon==6.0.1
    datasets==2.18.0
    transformers==4.38.2
    scikit-learn==1.4.1.post1
    statsmodels==0.14.1
    scipy==1.12.0
    seaborn==0.13.2
    matplotlib==3.8.3
    llama-cpp-python==0.2.56
    numpy==1.26.4
    pandas==2.2.1
    python-dotenv==1.0.1
    tqdm==4.66.2

[options.packages.find]
where = code
