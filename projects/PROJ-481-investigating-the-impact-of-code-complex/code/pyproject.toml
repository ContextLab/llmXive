[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-code-complexity"
version = "0.1.0"
description = "Investigating the Impact of Code Complexity on LLM Code Understanding"
requires-python = ">=3.11"
dependencies = [
    "radon",
    "transformers",
    "datasets",
    "scikit-learn",
    "statsmodels",
    "seaborn",
    "llama-cpp-python",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in CLI scripts)
]
exclude = [
    ".git",
    ".tox",
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.isort]
known-first-party = ["utils", "tests"]
force-sort-within-sections = true

[tool.ruff.per-file-ignores]
# Allow unused imports in __init__.py for re-exports
"code/__init__.py" = ["F401"]
"code/utils/__init__.py" = ["F401"]
"code/tests/__init__.py" = ["F401"]
