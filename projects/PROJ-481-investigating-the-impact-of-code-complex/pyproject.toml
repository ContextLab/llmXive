[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-code-complexity"
version = "0.1.0"
description = "Investigating the Impact of Code Complexity on LLM Code Understanding"
requires-python = ">=3.11"
dependencies = [
    "radon",
    "transformers",
    "datasets",
    "scikit-learn",
    "statsmodels",
    "seaborn",
    "llama-cpp-python"
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
