  r: Checked `code/web/tasks/sart_ospan.py` and the integration test `tests/integration/test_task_delivery.py`.
    The module raises a `ValueError` on import because the required configuration
    file (`code/config/study_config.yaml`) is missing or lacks the required `tasks`
    mapping, causing the test suite to error out before any CSV files are created.
    Adding a proper config (or handling its absence) is needed for the task to be
    considered complete.
