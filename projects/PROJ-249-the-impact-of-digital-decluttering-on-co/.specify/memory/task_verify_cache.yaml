  r: The Flask app `code/recruitment/app.py` is present, but it raises a `NameError`
    because `json` is not imported, causing the integration test to return a 500 error
    instead of the required 201. Consequently the endpoint does not successfully write
    a participant row, and the test verification fails. Adding `import json` (and
    any other needed fixes) is required for the task to be satisfied.
