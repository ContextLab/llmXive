{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "title": "MeasurementRecord",
  "type": "object",
  "properties": {
    "id": {
      "type": "string",
      "description": "Unique record identifier."
    },
    "participant_id": {
      "type": "string",
      "pattern": "^P\\d{3}$",
      "description": "Pseudonymous participant identifier."
    },
    "metric_type": {
      "type": "string",
      "description": "Type of metric recorded."
    },
    "value": {
      "type": "number",
      "description": "Measured value."
    },
    "timestamp": {
      "type": "string",
      "format": "date-time",
      "description": "ISO 8601 timestamp of the measurement."
    },
    "session_type": {
      "type": "string",
      "enum": ["baseline", "post_intervention"],
      "description": "Which session the measurement belongs to."
    },
    "trial_data": {
      "type": "object",
      "description": "Optional trial‑level data for cognitive tasks.",
      "properties": {
        "response_times": {
          "type": "array",
          "items": { "type": "number" }
        },
        "accuracies": {
          "type": "array",
          "items": { "type": "boolean" }
        }
      },
      "additionalProperties": false
    }
  },
  "required": [
    "id",
    "participant_id",
    "metric_type",
    "value",
    "timestamp",
    "session_type"
  ],
  "additionalProperties": false
}
