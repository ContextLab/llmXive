{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "title": "MeasurementRecord Schema",
  "type": "object",
  "definitions": {
    "MeasurementRecord": {
      "type": "object",
      "required": [
        "id",
        "participant_id",
        "metric_type",
        "value",
        "timestamp",
        "session_type"
      ],
      "properties": {
        "id": {
          "type": "string"
        },
        "participant_id": {
          "type": "string",
          "pattern": "^P\\d{3}$"
        },
        "metric_type": {
          "type": "string",
          "enum": [
            "pss10_total",
            "panas_positive",
            "panas_negative"
          ]
        },
        "value": {
          "type": "number"
        },
        "timestamp": {
          "type": "string",
          "format": "date-time"
        },
        "session_type": {
          "type": "string",
          "enum": [
            "baseline",
            "post"
          ]
        }
      },
      "additionalProperties": false
    }
  }
}