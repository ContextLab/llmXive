T003:
  c: false
  h: cdf05d127e00ecfa6be49086b05172f20d21e3d83fe11481819e789c19d89935
  r: "The `src/data/counterfactual.py` script does not meet several core requirements:\
    \ it falls back to a synthetic patch when `data/patches/` is missing (the directory\
    \ is absent), it uses optical\u2011flow vectors instead of a ResNet\u201118 feature\
    \ for the \u2265\u202F0.9 cosine\u2011similarity check, and it never writes any\
    \ counterfactual video files (the `data/counterfactuals/videos/` directory is\
    \ missing). Consequently the unit test `tests/test_counterfactual_generation.py`\
    \ fails during dataset loading (fallback video download SSL error) and no rows\
    \ are recorded in the output `metadata.csv`. These issues must be fixed "
  sig: e2da7b47da04d955111f13b47d332022ef8d06894ac637870ae75fea6684a944
T004:
  c: false
  h: 6e24246d5ba0307218ff22335da7fac587a15a41d96bffd5b920357c46fb8459
  r: "The provided `src/data/optical_flow_precompute.py` only creates a placeholder\
    \ directory and never iterates over `data/videos/orig/*.mp4`, computes Farneback\
    \ flow, or writes `.npy` files; consequently `data/flow/orig/` remains empty and\
    \ `data/checksums/manifest.csv` is a zero\u2011byte file. The test suite also\
    \ fails (checksum mismatch and missing expected files). The task\u2019s core functionality\
    \ is therefore missing."
  sig: 8e7cc00e1ae679656781f40f91955af8fc92fca27e0d98f409d26f6f35046437
