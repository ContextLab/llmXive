$schema: "http://json-schema.org/draft-07/schema#"
title: "Feature Matrix Schema"
description: "Schema for the features.csv file containing code metrics and bug labels."
type: "object"
properties:
  project_id:
    type: "string"
    description: "Identifier of the Defects4J project (e.g., 'Chart-1')."
  file_path:
    type: "string"
    description: "Relative path to the Java source file."
  cyclomatic_complexity:
    type: "number"
    description: "Cyclomatic Complexity metric."
    minimum: 1
  halstead_volume:
    type: "number"
    description: "Halstead Volume metric."
    minimum: 0
  lines_of_code:
    type: "integer"
    description: "Lines of Code metric."
    minimum: 1
  is_buggy:
    type: "integer"
    description: "Binary label: 1 if buggy, 0 if clean."
    enum:
      - 0
      - 1
required:
  - project_id
  - file_path
  - cyclomatic_complexity
  - halstead_volume
  - lines_of_code
  - is_buggy
additionalProperties: false
