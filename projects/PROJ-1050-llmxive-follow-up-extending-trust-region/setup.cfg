[metadata]
name = llmxive-topd-extension
version = 0.1.0
description = Extending Trust Region Policy Distillation for Reasoning Collapse Analysis
author = llmXive Research Team
python_requires = >=3.9

[options]
packages = find:
package_dir =
    = code
install_requires =
    numpy
    scipy
    pandas
    matplotlib
    pytest
    statsmodels

[options.packages.find]
where = code

[flake8]
max-line-length = 88
extend-ignore = E203, E501
exclude =
    .git,
    __pycache__,
    .eggs,
    build,
    dist
per-file-ignores =
    __init__.py: F401

[isort]
profile = black
line_length = 88
