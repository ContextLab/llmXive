$schema: "http://json-schema.org/draft-07/schema#"
title: "Training Episode Log Schema"
description: "Schema for raw training episode logs generated by the TOP-D training loop."
type: "object"
required:
  - episode_id
  - run_id
  - alpha
  - student_horizon
  - teacher_depth
  - steps_executed
  - effective_depth
  - is_solved
  - is_censored
  - is_collapse
properties:
  episode_id:
    type: "string"
    description: "Unique identifier for the episode (UUID)."
  run_id:
    type: "string"
    description: "Identifier for the experimental configuration (e.g., alpha_0.5_horizon_4)."
  alpha:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Interpolation coefficient used in TOP-D."
  student_horizon:
    type: "integer"
    minimum: 1
    description: "Maximum reasoning steps allowed for the student."
  teacher_depth:
    type: "integer"
    minimum: 1
    description: "Target solution depth of the problem."
  steps_executed:
    type: "integer"
    minimum: 0
    description: "Number of steps the student took before stopping."
  effective_depth:
    type: "integer"
    minimum: 0
    description: "Calculated depth of the solution found (capped at student_horizon)."
  is_solved:
    type: "boolean"
    description: "Whether the student found a valid solution."
  is_censored:
    type: "boolean"
    description: "True if effective_depth == student_horizon (mechanically truncated)."
  is_collapse:
    type: "boolean"
    description: "True if effective_depth <= 0.5 * teacher_depth AND is_solved is true."
  loss_trace:
    type: "array"
    items:
      type: "number"
    description: "List of loss values recorded during the episode."
  final_loss:
    type: "number"
    description: "The final loss value of the episode."
additionalProperties: false