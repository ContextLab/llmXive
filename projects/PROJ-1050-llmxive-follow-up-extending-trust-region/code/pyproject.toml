[project]
name = "topd-extension"
version = "0.1.0"
description = "llmXive follow-up: extending Trust Region Policy Distillation"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["env/*.py", "student/*.py", "experiments/*.py", "analysis/*.py", "utils/*.py", "tests/**/*.py"]
exclude = ["venv", "data", "docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by black
]

[tool.ruff.lint.isort]
known-first-party = ["env", "student", "experiments", "analysis", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''(
    /(
        venv
        | data
        | docs
    )/
)'''
