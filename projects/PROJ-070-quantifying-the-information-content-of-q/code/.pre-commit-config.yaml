repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: local
    hooks:
      - id: check-data
        name: Check data directory integrity
        entry: bash -c 'test ! -d data || echo "Data directory exists, skipping format checks on it"'
        language: system
        pass_filenames: false
        always_run: true