[tool.ruff]
# Target Python version
target-version = "py311"

# Line length consistent with Black
line-length = 88

# Exclude generated or large files
exclude = [
    ".git",
    "__pycache__",
    "data",
    "build",
    "dist",
    ".eggs",
    "*.egg-info"
]

[tool.ruff.lint]
# Enable a broad set of rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501", # Line too long (handled by Black)
    "B008", # Do not perform function call in argument defaults (common in data loading)
]

# Per-file ignores if necessary
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # Allow asserts in tests

[tool.ruff.lint.isort]
known-first-party = ["config", "data_loader", "logging_config", "metrics", "statistics", "viz", "utils", "models", "validators", "null_models"]
