[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantifying-entanglement-info"
version = "0.1.0"
description = "Quantifying the Information Content of Quantum Entanglement in Many-Body Systems"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "h5py>=3.10.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "tenpy>=1.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "black>=24.3.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
# Inherit settings from code/ruff.toml if preferred, or define here
# For simplicity in this project structure, we point to the config file
extend = "ruff.toml"

[tool.black]
extend = ".black.toml"
