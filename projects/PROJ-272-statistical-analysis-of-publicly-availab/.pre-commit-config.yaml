repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.11
        args: ["--line-length", "88"]

  - repo: https://github.com/yannickk1/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        additional_dependencies: ["detect-secrets[all]"]
        name: Detect secrets
        description: Detects high entropy strings that are likely to be secrets.
        entry: detect-secrets scan
        language: python
        pass_filenames: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]

  - repo: local
    hooks:
      - id: check-requirements
        name: Check requirements.txt consistency
        entry: bash -c 'python -c "import pip; print(pip.__version__)"'
        language: system
        pass_filenames: false
        description: Ensures pip is available for dependency checks