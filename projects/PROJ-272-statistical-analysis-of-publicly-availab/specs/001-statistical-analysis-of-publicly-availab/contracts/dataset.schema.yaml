$schema: http://json-schema.org/draft-07/schema#
title: Cognitive Decline Dataset Schema
description: >
  JSON Schema for the cleaned and processed ADReSS dataset.
  Defines the structure for participant records including ID, cognitive status label,
  and cleaned text transcript.
type: object
required:
  - participant_id
  - label
  - text
properties:
  participant_id:
    type: string
    description: >
      Unique identifier for the participant.
      Format typically follows ADReSS naming conventions (e.g., P001, P002).
    pattern: '^P\\d{3}$'
    examples:
      - "P001"
      - "P123"
  label:
    type: string
    description: >
      Cognitive status label derived from the dataset metadata.
      Valid values are restricted to the expected classes.
    enum:
      - Control
      - MCI
      - AD
    examples:
      - "Control"
      - "MCI"
      - "AD"
  text:
    type: string
    description: >
      The cleaned, normalized text transcript of the participant's speech.
      Non-verbal annotations (<laughter>, <pause>) have been removed.
      UTF-8 normalized.
    minLength: 50
    examples:
      - "The patient described a scene from the cookie jar picture..."
additionalProperties: false
