$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema"
description: "Schema for the cleaned and processed dataset."
type: object
properties:
  participant_id:
    type: string
    description: "Unique identifier for the participant."
  label:
    type: string
    description: "Cognitive status label (Control, MCI, AD)."
  text:
    type: string
    description: "Cleaned transcript text (empty string when raw text unavailable)."
  age:
    type:
      - integer
      - "null"
    description: "Age in years (optional)."
  education:
    type:
      - integer
      - "null"
    description: "Years of formal education (optional)."
  embedding_path:
    type: string
    description: "Relative path to the participant's embedding file."
  sentence_count:
    type: integer
    description: "Number of sentences (derived from embeddings) used as a covariate."
required:
  - participant_id
  - label
  - text
  - embedding_path
  - sentence_count