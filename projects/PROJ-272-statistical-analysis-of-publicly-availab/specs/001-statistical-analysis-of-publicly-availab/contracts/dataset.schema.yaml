$schema: http://json-schema.org/draft-07/schema#
title: ADReSS Cognitive Decline Dataset Schema
description: >
  JSON Schema defining the structure of the cleaned ADReSS dataset
  used for statistical analysis of cognitive decline.
type: object
required:
  - participant_id
  - label
  - text
properties:
  participant_id:
    type: string
    description: >
      Unique identifier for the participant. 
      Format: "sub-<id>" or raw ID from ADReSS corpus.
    pattern: "^[a-zA-Z0-9_-]+$"
    minLength: 1
  label:
    type: string
    description: >
      Cognitive status label derived from the dataset.
      Valid values are strictly defined to ensure consistency.
    enum:
      - Control
      - MCI
      - AD
  text:
    type: string
    description: >
      Cleaned transcript text associated with the participant.
      Must be UTF-8 encoded, with non-verbal annotations removed.
      Minimum length enforced by preprocessing logic (>= 50 words).
    minLength: 50
  metadata:
    type: object
    description: Optional metadata fields (e.g., source file, timestamp).
    properties:
      source_file:
        type: string
      processed_at:
        type: string
        format: date-time
additionalProperties: false
