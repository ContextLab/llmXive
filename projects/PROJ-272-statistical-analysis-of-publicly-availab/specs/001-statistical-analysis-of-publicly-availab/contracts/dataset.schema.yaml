$schema: http://json-schema.org/draft-07/schema#
title: ADReSS Cleaned Dataset Schema
description: >-
  Schema for the intermediate cleaned dataset derived from the ADReSS Challenge.
  Contains participant metadata, cognitive status labels, and preprocessed text.
  Used as input for feature extraction (User Story 2).
type: object
required:
  - participant_id
  - label
  - text
properties:
  participant_id:
    type: string
    description: >-
      Unique identifier for the participant. 
      Derived from the original filename (e.g., "p001", "c001").
    pattern: "^[pc]\\d{3,}$"
    examples:
      - "p001"
      - "c042"
  label:
    type: string
    description: >-
      Cognitive status classification.
      Must be one of the validated classes.
    enum:
      - Control
      - MCI
      - AD
    examples:
      - "Control"
      - "MCI"
      - "AD"
  text:
    type: string
    description: >-
      The cleaned transcript text.
      - Non-verbal annotations (e.g., <laughter>, <pause>) removed.
      - Normalized to UTF-8.
      - Whitespace normalized (single spaces between words).
      - Minimum length enforced (>= 50 words).
    minLength: 50
    examples:
      - "The patient described the picture by saying that the man is fishing..."
additionalProperties: false
