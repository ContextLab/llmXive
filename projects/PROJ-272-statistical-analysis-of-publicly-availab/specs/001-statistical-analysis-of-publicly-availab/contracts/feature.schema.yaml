$schema: http://json-schema.org/draft-07/schema#
title: Linguistic Feature Matrix Schema
description: >
  JSON Schema for the extracted linguistic feature matrix used in statistical analysis.
  Includes lexical, syntactic, and semantic features derived from the cleaned text.
type: object
required:
  - participant_id
  - label
  - features
properties:
  participant_id:
    type: string
    description: Unique identifier matching the source dataset.
    pattern: '^P\\d{3}$'
  label:
    type: string
    description: Cognitive status label.
    enum:
      - Control
      - MCI
      - AD
  features:
    type: object
    description: >
      Dictionary of computed linguistic features.
      All numeric values are floats.
    properties:
      # Lexical Features
      ttr:
        type: number
        description: Type-Token Ratio (lexical diversity).
        minimum: 0.0
        maximum: 1.0
      mtld:
        type: number
        description: Measure of Textual Lexical Diversity.
        minimum: 0.0
      noun_ratio:
        type: number
        description: Ratio of nouns to total words.
        minimum: 0.0
        maximum: 1.0
      verb_ratio:
        type: number
        description: Ratio of verbs to total words.
        minimum: 0.0
        maximum: 1.0
      # Syntactic Features
      mean_clause_length:
        type: number
        description: Average number of words per clause.
        minimum: 0.0
      t_unit_count:
        type: integer
        description: Count of T-units in the transcript.
        minimum: 0
      # Semantic Features
      embedding_mean_similarity:
        type: number
        description: Mean cosine similarity of sentence embeddings (semantic coherence).
        minimum: -1.0
        maximum: 1.0
      embedding_std_similarity:
        type: number
        description: Standard deviation of sentence embedding similarities.
        minimum: 0.0
    required:
      - ttr
      - mtld
      - noun_ratio
      - verb_ratio
      - mean_clause_length
      - t_unit_count
      - embedding_mean_similarity
      - embedding_std_similarity
    additionalProperties: false
additionalProperties: false