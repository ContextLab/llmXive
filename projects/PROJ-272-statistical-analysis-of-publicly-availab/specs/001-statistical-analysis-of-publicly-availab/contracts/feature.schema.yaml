$schema: http://json-schema.org/draft-07/schema#
title: Feature Schema
description: Schema for the extracted linguistic features.
type: object
properties:
  participant_id:
    type: string
  label:
    type: string
  ttr:
    type: number
  mtld:
    type: number
  noun_verb_ratio:
    type: number
  mean_clause_length:
    type: number
  t_unit_count:
    type: integer
  sentence_embedding_cosine_similarity:
    type: number
required:
  - participant_id
  - label
  - ttr
  - mtld
  - noun_verb_ratio
  - mean_clause_length
  - t_unit_count
  - sentence_embedding_cosine_similarity