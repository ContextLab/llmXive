$schema: http://json-schema.org/draft-07/schema#
title: Linguistic Feature Matrix Schema
description: >
  JSON Schema defining the structure of the extracted feature matrix
  used for statistical hypothesis testing and modeling.
type: object
required:
  - participant_id
  - label
  - TTR
  - MTLD
  - Noun_Verb_Ratio
  - Mean_Clause_Length
  - T_Unit_Count
  - Sentence_Embedding_Cosine_Similarity
properties:
  participant_id:
    type: string
    description: >
      Unique identifier linking this record to the dataset schema.
    pattern: "^[a-zA-Z0-9_-]+$"
    minLength: 1
  label:
    type: string
    description: Cognitive status label.
    enum:
      - Control
      - MCI
      - AD
  TTR:
    type: number
    description: Type-Token Ratio (lexical diversity).
    minimum: 0
    maximum: 1
  MTLD:
    type: number
    description: Measure of Textual Lexical Diversity.
    minimum: 0
  Noun_Verb_Ratio:
    type: number
    description: Ratio of nouns to verbs in the transcript.
    minimum: 0
  Mean_Clause_Length:
    type: number
    description: Average number of words per clause (syntactic complexity).
    minimum: 0
  T_Unit_Count:
    type: integer
    description: Count of T-units in the transcript.
    minimum: 0
  Sentence_Embedding_Cosine_Similarity:
    type: number
    description: >
      Mean cosine similarity of sentence embeddings within the transcript
      (semantic coherence/self-similarity).
    minimum: -1
    maximum: 1
additionalProperties: false