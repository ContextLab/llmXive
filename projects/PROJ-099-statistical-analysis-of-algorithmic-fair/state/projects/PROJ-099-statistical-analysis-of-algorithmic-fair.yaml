constraints:
  - FR-008: Findings are associational only; no causal claims are made.
  - FR-005: No exclusions in correlation analysis.
  - FR-006: Fixed-effects regression with dataset and model as categorical covariates.
  - FR-009: Use "metric selection guidance" terminology.
  - Constitution Principle III: No in-place modification of raw data.
  - Constitution Principle VII: Link base-rate difference to demographic parity difference.