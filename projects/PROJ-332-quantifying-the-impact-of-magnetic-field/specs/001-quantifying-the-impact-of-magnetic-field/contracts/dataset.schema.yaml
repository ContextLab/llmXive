$schema: "http://json-schema.org/draft-07/schema#"
title: "DIII-D Discharge Dataset"
type: "object"
properties:
  discharge_id:
    type: "integer"
    description: "Unique DIII-D discharge number"
  island_width:
    type: "number"
    description: "Pre-calculated magnetic island width in meters"
    minimum: 0
  chirikov_parameter:
    type: "number"
    description: "Chirikov stochasticity parameter (normalized)"
    minimum: 0
  q_profile_range:
    type: "number"
    description: "Range of q-profile (max - min)"
    minimum: 0
  q_separation_min:
    type: "number"
    description: "Minimum separation between rational q-values"
    minimum: 0
  tau_e:
    type: "number"
    description: "Energy confinement time in seconds"
    minimum: 0
  confinement_mode:
    type: "string"
    enum:
      - "L-mode"
      - "H-mode"
      - "unknown"
    description: "Plasma confinement mode"
  minor_radius:
    type: "number"
    description: "Plasma minor radius in meters"
    minimum: 0
required:
  - discharge_id
  - island_width
  - chirikov_parameter
  - q_profile_range
  - q_separation_min
  - tau_e
  - confinement_mode
  - minor_radius
additionalProperties: false