$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Analysis Results"
type: "object"
properties:
  metric_name:
    type: "string"
    description: "Name of the topological metric analyzed"
  mode:
    type: "string"
    description: "Confinement mode analyzed (e.g., 'all', 'L-mode', 'H-mode')"
  spearman_r:
    type: "number"
    description: "Spearman correlation coefficient"
    minimum: -1
    maximum: 1
  spearman_p:
    type: "number"
    description: "Spearman p-value"
    minimum: 0
    maximum: 1
  posterior_median_r:
    type: "number"
    description: "Posterior median of the correlation coefficient"
    minimum: -1
    maximum: 1
  ci_lower:
    type: "number"
    description: "Lower bound of the 95% Credible Interval"
    minimum: -1
    maximum: 1
  ci_upper:
    type: "number"
    description: "Upper bound of the 95% Credible Interval"
    minimum: -1
    maximum: 1
  power:
    type: "number"
    description: "Statistical power to detect |r| = 0.5"
    minimum: 0
    maximum: 1
  hypothesis_status:
    type: "string"
    enum:
      - "supported"
      - "inconclusive"
      - "not supported"
    description: "Status of the hypothesis test"
required:
  - metric_name
  - mode
  - spearman_r
  - spearman_p
  - posterior_median_r
  - ci_lower
  - ci_upper
  - power
  - hypothesis_status
additionalProperties: false