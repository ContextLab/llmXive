$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Output Schema"
description: "Schema for the summary report containing correlation results and hypothesis status."
type: object
properties:
  analysis_summary:
    type: object
    properties:
      total_discharges_analyzed:
        type: integer
        description: "Number of valid discharges included in the analysis."
      stratification_warning:
        type: [string, "null"]
        description: "Warning message if stratification was skipped due to low sample size."
      power_analysis:
        type: object
        properties:
          target_effect_size:
            type: number
            description: "Target correlation magnitude (|r|) for power calculation."
          calculated_power:
            type: number
            description: "Estimated statistical power (0.0 to 1.0)."
          power_status:
            type: string
            enum: ["sufficient", "low"]
            description: "Status based on whether power >= 0.20."
        required:
          - target_effect_size
          - calculated_power
          - power_status
    required:
      - total_discharges_analyzed
      - power_analysis
  correlation_results:
    type: array
    items:
      type: object
      properties:
        metric_name:
          type: string
          enum: ["island_width", "resonant_surface_density"]
          description: "Name of the topological metric."
        correlation:
          type: number
          description: "Spearman rank correlation coefficient."
        p_value:
          type: number
          description: "Two-tailed p-value."
        ci_lower:
          type: number
          description: "Lower bound of 95% confidence interval."
        ci_upper:
          type: number
          description: "Upper bound of 95% confidence interval."
        hypothesis_status:
          type: string
          enum: ["supported", "inconclusive", "not_supported"]
          description: "Result of the hypothesis test."
      required:
        - metric_name
        - correlation
        - p_value
        - ci_lower
        - ci_upper
        - hypothesis_status
required:
  - analysis_summary
  - correlation_results
additionalProperties: false
