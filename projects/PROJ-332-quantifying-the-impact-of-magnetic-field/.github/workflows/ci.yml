name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    fail-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 code/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 code/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Format check with black
        run: |
          black --check --line-length 88 code/

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short

      - name: Run data retrieval integration test
        run: |
          python code/main.py --discharges 12345 --test-mode retrieval
        continue-on-error: true

      - name: Run analysis integration test
        run: |
          python code/main.py --discharges 12345 --test-mode analysis
        continue-on-error: true