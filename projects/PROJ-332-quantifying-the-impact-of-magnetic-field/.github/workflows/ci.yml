name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    # Global timeout for the job to ensure immediate abort on violation
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure MDSplus dependencies are available if needed
          # pip install mdsobjects-python

      - name: Run Linting
        run: |
          flake8 code/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 code/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Tests
        run: |
          pytest tests/ -v

      - name: Run Pipeline with Timeout
        # Explicitly set a timeout for the script execution within the job
        # This ensures the script itself enforces the limit, backed by the job timeout
        timeout-minutes: 55 
        run: |
          # Run the main pipeline with explicit timeout argument
          # The code/main.py also enforces this via the timeout_guard decorator
          python code/main.py --discharges "167001,167002,167003,167004,167005" \
            --timeout 3000 \
            --memory-limit 6000 \
            --output-dir data/processed
        # If the script exceeds 55 minutes, GitHub will kill the runner immediately

      - name: Verify Outputs
        run: |
          if [ ! -f "data/processed/unified_analysis.csv" ]; then
            echo "Error: Output file data/processed/unified_analysis.csv not found"
            exit 1
          fi
          echo "Output verification passed."
