# Schema for the unified analysis dataset (input to analysis phase)
# Generated for project PROJ-332
type: object
required:
  - discharge_id
  - island_width
  - tau_e
  - confinement_mode
  - h98y2
  - q_min
  - q_max
properties:
  discharge_id:
    type: integer
    description: Unique DIII-D discharge identifier
  island_width:
    type: number
    description: Magnetic island width in meters (pre-calculated or derived)
  tau_e:
    type: number
    description: Energy confinement time in seconds
  confinement_mode:
    type: string
    description: Confinement mode classification (L-mode or H-mode)
    enum:
      - L-mode
      - H-mode
  h98y2:
    type: number
    description: H-factor relative to ITER98(y,2) scaling
  q_min:
    type: number
    description: Minimum safety factor value in the plasma
  q_max:
    type: number
    description: Maximum safety factor value in the plasma
additionalProperties: false
