$schema: http://json-schema.org/draft-07/schema#
title: Processed Output Schema
description: Schema for the unified analysis-ready dataset.
type: object
required:
  - columns
  - data
properties:
  columns:
    type: array
    items:
      type: string
    description: List of column names in the output DataFrame.
    minItems: 6
  data:
    type: array
    items:
      type: object
      required:
        - discharge_id
        - island_width
        - tau_e
        - confinement_mode
      properties:
        discharge_id:
          type: integer
          description: Unique identifier for the DIII-D discharge.
        island_width:
          type: number
          description: Calculated or retrieved island width in meters.
        tau_e:
          type: number
          description: Energy confinement time in seconds.
        te_profile:
          type: string
          description: Placeholder or path to electron temperature profile data.
        ne_profile:
          type: string
          description: Placeholder or path to electron density profile data.
        confinement_mode:
          type: string
          enum:
            - L-mode
            - H-mode
          description: Confinement mode determined by H98y2 factor.
        h98y2:
          type: number
          description: H-mode confinement enhancement factor.
        resonant_surface_density:
          type: number
          description: Calculated density of rational surfaces (optional).
  validation_status:
    type: string
    enum:
      - passed
      - failed
    description: Result of schema validation.
  validation_errors:
    type: array
    items:
      type: string
    description: List of validation error messages if failed.
