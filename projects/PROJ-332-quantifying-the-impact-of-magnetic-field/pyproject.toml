[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-quantifying-topology"
version = "0.1.0"
description = "Quantifying the Impact of Magnetic Field Topology on Plasma Confinement"
requires-python = ">=3.9"
dependencies = [
    "scipy",
    "numpy",
    "matplotlib",
    "pandas",
    "pytest",
    "requests",
    "pyyaml",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"