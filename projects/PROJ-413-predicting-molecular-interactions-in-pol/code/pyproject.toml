[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mol-interaction-gnn"
version = "0.1.0"
description = "Predicting Molecular Interactions in Polymer Composites with Graph Neural Networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "rdkit>=2023.9.1",
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
    "statsmodels>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=6.0.0",
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]
