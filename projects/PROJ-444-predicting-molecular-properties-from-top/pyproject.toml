[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-proj-444"
version = "0.1.0"
description = "Predicting Molecular Properties from Topological Data Analysis"
requires-python = ">=3.11"
dependencies = [
    "rdkit",
    "gudhi",
    "dionysus2",
    "scikit-learn",
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "requests",
    "pytest",
    "memory-profiler",
    "statsmodels"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe (complexity)
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "W191", # indentation contains tabs
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"] # Ignore unused imports in init files

[tool.ruff.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"