# Dataset schema for ESOL raw data
# Required columns: molecule_id (string), smiles (string), logP (numeric)
type: object
required:
  - molecule_id
  - smiles
  - logP
properties:
  molecule_id:
    type: string
    description: Unique identifier for each molecule (string representation of row index)
  smiles:
    type: string
    description: SMILES representation of the molecule
  logP:
    type: number
    description: Predicted octanol‑water partition coefficient (logP)
