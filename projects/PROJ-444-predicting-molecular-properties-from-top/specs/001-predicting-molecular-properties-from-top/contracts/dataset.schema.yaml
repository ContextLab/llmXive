# JSON Schema for the ESOL dataset used in the project
# Defines the required columns and their data types.
type: object
required:
  - molecule_id
  - smiles
  - logP
properties:
  molecule_id:
    type: string
    description: Unique identifier for each molecule (stringified row index).
  smiles:
    type: string
    description: SMILES representation of the molecule.
  logP:
    type: number
    description: Log‑partition coefficient (logP) value.