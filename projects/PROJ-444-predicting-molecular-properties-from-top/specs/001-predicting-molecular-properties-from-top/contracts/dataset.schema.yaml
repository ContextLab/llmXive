$schema: http://json-schema.org/draft-07/schema#
title: Molecular Dataset Schema
description: Schema for the raw molecular dataset (ESOL)
type: object
properties:
  smiles:
    type: string
    description: SMILES representation of the molecule
  logP:
    type: number
    description: Experimental logP value (octanol-water partition coefficient)
required:
  - smiles
  - logP
