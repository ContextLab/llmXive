$schema: http://json-schema.org/draft-07/schema#
title: TDA Feature Matrix Schema
description: Schema for the topological feature matrix generated by 02_tda_computation.py. Each row represents a molecule with its topological features and ground-truth target value.
type: object
properties:
  molecule_id:
    type: string
    description: "Unique identifier for the molecule (canonical SMILES, must be string type)"
  features:
    type: array
    description: Flattened persistence image values
    items:
      type: number
  feature_names:
    type: array
    description: Names for each feature dimension
    items:
      type: string
  target_property:
    type: string
    description: "The property being predicted (e.g., logP)"
  target_value:
    type: number
    description: "Ground-truth value for the target property (experimental measurement)"
required:
  - molecule_id
  - features
  - feature_names
  - target_property
  - target_value