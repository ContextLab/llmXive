$schema: "http://json-schema.org/draft-07/schema#"
type: object
required:
  - molecule_id
  - target_property
  - target_value
properties:
  molecule_id:
    type: string
  target_property:
    type: string
    enum: ["logP"]
  target_value:
    type: number
  pixel_0:
    type: number
  pixel_1:
    type: number
  patternProperties:
    "^pixel_\\d+$":
      type: number
additionalProperties: true
