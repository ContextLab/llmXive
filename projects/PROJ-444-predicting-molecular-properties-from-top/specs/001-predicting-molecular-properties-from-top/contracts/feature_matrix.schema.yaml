# Feature Matrix Schema for TDA Pipeline
# Defines the contract for data/processed/tda_features.csv
# Version: 1.0.0
# Last Updated: 2023-10-27

required:
  - molecule_id
  - features
  - feature_names
  - target_property
  - target_value

types:
  molecule_id: string
  features: list of numbers (float)
  feature_names: list of strings
  target_property: string
  target_value: number (float)

constraints:
  features_length: 100
  feature_names_length: 100
  no_nan: true
  no_null: true

description: |
  This schema validates the TDA feature matrix generated by the pipeline.
  The 'features' column contains the flattened persistence image (10x10 grid = 100 values).
  The 'feature_names' column contains the corresponding names for each feature index.
  The 'target_property' is always "logP" for this study.
  The 'target_value' is the experimental logP value from the ESOL dataset.
