# Contract for a single topological feature-matrix record (T003 / FR-002).
# Each record describes one molecule's vectorized persistence image
# together with the target property it is paired with.
type: object
required:
  - molecule_id
  - features
  - feature_names
  - target_property
  - target_value
properties:
  molecule_id:
    type: string
    description: Unique molecule identifier (always treated as a string).
  features:
    type: array
    description: Flattened persistence image values (10x10 = 100 floats).
    items:
      type: number
    minItems: 100
    maxItems: 100
  feature_names:
    type: array
    description: Names of the feature entries (pixel_0 ... pixel_99).
    items:
      type: string
    minItems: 100
    maxItems: 100
  target_property:
    type: string
    description: Name of the predicted physicochemical property (e.g. "logP").
    enum:
      - logP
  target_value:
    type: number
    description: Experimental value of the target property for this molecule.
