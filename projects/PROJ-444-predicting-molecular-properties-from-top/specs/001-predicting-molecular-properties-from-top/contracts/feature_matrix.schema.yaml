$schema: http://json-schema.org/draft-07/schema#
title: TDA Feature Matrix Schema
description: Schema for the TDA feature matrix generated by 02_tda_computation.py
type: object
properties:
  molecule_id:
    type: string
    description: Unique identifier for the molecule (SMILES string or hash)
  features:
    type: array
    description: Array of topological features (persistence image values)
    items:
      type: number
  feature_names:
    type: array
    description: Names corresponding to each feature in the features array
    items:
      type: string
  target_property:
    type: string
    description: The property being predicted (e.g., "logP")
  target_value:
    type: number
    description: The ground truth value for the target property
required:
  - molecule_id
  - features
  - feature_names
  - target_property
  - target_value
