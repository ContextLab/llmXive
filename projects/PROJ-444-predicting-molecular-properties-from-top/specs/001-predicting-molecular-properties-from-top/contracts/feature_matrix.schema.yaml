$schema: "http://json-schema.org/draft-07/schema#"
type: object
required:
  - molecule_id
  - target_property
  - target_value
properties:
  molecule_id:
    type: string
  target_property:
    type: string
    enum: ["logP"]
  target_value:
    type: number
  # Dynamically allow any number of pixel columns named pixel_0, pixel_1, …
  pixel_0:
    type: number
  pixel_1:
    type: number
  # Use patternProperties to capture all pixel_* columns
  patternProperties:
    "^pixel_\\d+$":
      type: number
additionalProperties: true