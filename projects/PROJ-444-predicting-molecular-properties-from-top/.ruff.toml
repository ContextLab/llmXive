# Ruff configuration file
# This file is an alternative to pyproject.toml configuration

target-version = "py311"
line-length = 88

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]
exclude = [
    ".git",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    ".venv",
]

[lint.per-file-ignores]
"code/utils/*" = ["F401"]
"tests/*" = ["F401", "E501"]
