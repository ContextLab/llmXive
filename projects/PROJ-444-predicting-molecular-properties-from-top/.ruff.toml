[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "ARG", # flake8-unused-arguments
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line-too-long (handled by black)
  "B008", # do-not-perform-function-calls-in-argument-defaults (rdkit often uses this)
]
target-version = "py311"

[lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]
