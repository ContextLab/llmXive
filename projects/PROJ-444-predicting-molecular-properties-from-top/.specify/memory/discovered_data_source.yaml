access_python: "import pubchempy as pcp\n# Retrieve a sample of 100 compounds containing\
  \ carbon (SMILES \"C\")\ncompounds = pcp.get_compounds('C', namespace='smiles',\
  \ listkey_count=100)\nrecords = []\nfor c in compounds:\n    # canonical_smiles\
  \ is a standard SMILES representation\n    smiles = getattr(c, 'canonical_smiles',\
  \ None)\n    if smiles is None:\n        smiles = getattr(c, 'isomeric_smiles',\
  \ None)\n    records.append({'cid': c.cid, 'smiles': smiles})\nprint(f\"RECORDS={len(records)}\"\
  )\nprint(\"FIELDS=cid,smiles\")"
