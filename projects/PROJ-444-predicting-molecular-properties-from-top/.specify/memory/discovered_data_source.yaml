access_python: "import pubchempy as pcp\n# Retrieve a sample of 200 compounds matching\
  \ the SMILES pattern 'C' (any carbon-containing molecule)\ncompounds = pcp.get_compounds('C',\
  \ namespace='smiles', listkey_count=200)\nrecords = []\nfor c in compounds:\n  \
  \  # Prefer isomeric SMILES; fallback to canonical SMILES if needed\n    smiles\
  \ = getattr(c, 'isomeric_smiles', None) or getattr(c, 'canonical_smiles', None)\n\
  \    if smiles is None:\n        continue\n    records.append({'cid': c.cid, 'smiles':\
  \ smiles})\nprint(f\"RECORDS={len(records)}\")\nprint(\"FIELDS=cid,smiles\")"
