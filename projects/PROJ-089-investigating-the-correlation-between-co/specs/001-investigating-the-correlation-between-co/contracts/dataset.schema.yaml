$schema: "http://json-schema.org/draft-07/schema#"
title: "Unified Metrics Dataset Schema"
description: "Schema for the unified file metrics dataset containing raw churn and debt metrics"
type: "object"
properties:
  repo_id:
    type: "string"
    description: "Unique repository identifier (owner/repo format)"
  file_path:
    type: "string"
    description: "Path of the file within the repository"
  language:
    type: "string"
    enum:
      - "Python"
      - "Java"
      - "JavaScript"
      - "TypeScript"
      - "Go"
      - "Rust"
    description: "Programming language of the file"
  total_lines_changed:
    type: "integer"
    minimum: 0
    description: "Total lines changed in the last 2 years (raw metric)"
  avg_loc:
    type: "number"
    minimum: 1
    description: "Average Lines of Code for the file"
  debt_score:
    type: "number"
    description: "Z-Score normalized debt score"
  z_cc:
    type: "number"
    nullable: true
    description: "Z-Score of Cyclomatic Complexity"
  z_mi:
    type: "number"
    nullable: true
    description: "Z-Score of Maintainability Index"
  commit_count:
    type: "integer"
    minimum: 0
    description: "Number of commits touching the file in last 2 years"
  contributor_count:
    type: "integer"
    minimum: 0
    description: "Number of unique contributors"
required:
  - "repo_id"
  - "file_path"
  - "language"
  - "total_lines_changed"
  - "avg_loc"
  - "debt_score"
  - "commit_count"
additionalProperties: false
