$schema: "http://json-schema.org/draft-07/schema#"
title: "TrajectoryLog"
description: "A record of the complete sequence of Planner, Generator, and Critic steps for a single benchmark sample."
type: object
properties:
  sample_id:
    type: string
    description: "Unique identifier for the benchmark sample."
  prompt:
    type: string
    description: "Original natural language prompt (caption)."
  ground_truth:
    type: object
    description: "Human-Annotated Scene Graph (from Visual Genome/GQA). Independent ground truth for evaluation."
    additionalProperties: true
  simulator_input:
    type: object
    description: "The SceneDescription JSON (Perfect or Noisy) generated by the simulator."
    additionalProperties: true
  steps:
    type: array
    description: "List of steps (Planner, Generator, Critic) with their outputs and scores."
    items:
      type: object
      properties:
        agent:
          type: string
          enum:
            - "Planner"
            - "Generator"
            - "Critic"
          description: "Agent that performed the step."
        input:
          type: object
          description: "Input to the agent."
          additionalProperties: true
        output:
          type: object
          description: "Output from the agent."
          additionalProperties: true
        score:
          type: number
          description: "Intermediate score (if applicable)."
  final_reasoning_score:
    type: number
    description: "F1-score (or Graph Edit Distance) between Generator Output and ground_truth."
  ablation_flag:
    type: boolean
    description: "Boolean indicating if this was a 'No-Critic' run."
  actual_generator_error_rate:
    type: number
    description: "Measured deviation between Generator Output and ground_truth (for stratification)."
required:
  - sample_id
  - prompt
  - ground_truth
  - steps
  - final_reasoning_score