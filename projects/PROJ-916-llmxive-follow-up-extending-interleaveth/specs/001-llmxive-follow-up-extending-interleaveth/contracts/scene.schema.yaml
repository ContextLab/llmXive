$schema: "http://json-schema.org/draft-07/schema#"
title: "SceneDescription"
description: "A structured JSON object representing a visual scene, generated by the text-based simulator."
type: object
properties:
  objects:
    type: array
    description: "List of objects in the scene."
    items:
      type: object
      properties:
        type:
          type: string
          description: "Object type (e.g., 'cube', 'sphere')."
        color:
          type: string
          description: "Object color (e.g., 'red', 'blue')."
        shape:
          type: string
          description: "Object shape (if distinct from type)."
      required:
        - type
        - color
  relationships:
    type: array
    description: "List of spatial/semantic relationships between objects."
    items:
      type: object
      properties:
        source:
          type: string
          description: "Source object ID or type."
        target:
          type: string
          description: "Target object ID or type."
        relation:
          type: string
          description: "Relationship type (e.g., 'on', 'under', 'next to')."
      required:
        - source
        - target
        - relation
  attributes:
    type: object
    description: "Global attributes of the scene."
    properties:
      lighting:
        type: string
        description: "Lighting condition (e.g., 'bright', 'dim')."
      background:
        type: string
        description: "Background description."
  metadata:
    type: object
    description: "Simulation metadata."
    properties:
      mode:
        type: string
        enum:
          - "perfect"
          - "noisy"
        description: "Simulation mode."
      error_rate:
        type: number
        description: "Target or actual error rate for noisy mode."
      timestamp:
        type: string
        format: date-time
        description: "Generation timestamp."
required:
  - objects
  - relationships
  - metadata