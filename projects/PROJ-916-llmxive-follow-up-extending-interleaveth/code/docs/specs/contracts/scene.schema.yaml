$schema: http://json-schema.org/draft-07/schema#
title: SceneGraph
description: Schema for structured scene descriptions

type: object
properties:
  objects:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        attributes:
          type: array
          items:
            type: string
      required:
        - id
        - label
  relationships:
    type: array
    items:
      type: object
      properties:
        source_id:
          type: string
        target_id:
          type: string
        label:
          type: string
      required:
        - source_id
        - target_id
        - label
  attributes:
    type: object
    additionalProperties: true

required:
  - objects
  - relationships
  - attributes
