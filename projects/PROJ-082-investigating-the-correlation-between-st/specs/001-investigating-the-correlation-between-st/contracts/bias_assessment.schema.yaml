$schema: "http://json-schema.org/draft-07/schema#"
title: "BiasAssessment"
description: "Schema for publication bias assessment results."
type: "object"
properties:
  egger_intercept:
    type: "number"
    description: "Intercept of Egger's regression."
  egger_p_value:
    type: "number"
    description: "P-value of Egger's test."
    minimum: 0.0
    maximum: 1.0
  test_skipped:
    type: "boolean"
    description: "True if N < 10."
  skip_reason:
    type: "string"
    description: "Reason for skipping."
  low_power_warning:
    type: "boolean"
    description: "True if 10 <= N < 20."
  funnel_plot_path:
    type: "string"
    description: "Path to generated PNG."
required:
  - test_skipped
  - funnel_plot_path
additionalProperties: false