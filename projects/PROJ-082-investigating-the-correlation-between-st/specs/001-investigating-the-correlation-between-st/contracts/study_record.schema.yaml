$schema: http://json-schema.org/draft-07/schema#
title: StudyRecord
description: Schema for a single study entry in the meta-analysis dataset.
type: object
properties:
  author_year:
    type: string
    description: "Unique identifier combining author and year (e.g., 'Smith2023')."
  tract_name:
    type: string
    description: "Name of the brain tract (e.g., 'Arcuate Fasciculus')."
  metric_type:
    type: string
    description: "Type of dMRI metric (e.g., 'FA', 'MD')."
  effect_size:
    type: number
    description: "Correlation coefficient (r) or converted effect size."
    minimum: -1
    maximum: 1
  sample_size:
    type: integer
    description: "Number of participants in the study."
    minimum: 1
required:
  - author_year
  - tract_name
  - metric_type
  - effect_size
  - sample_size
additionalProperties: false
