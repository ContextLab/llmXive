$schema: "http://json-schema.org/draft-07/schema#"
title: "StudyRecord Schema"
description: "Schema for input study data (CSV/JSON) containing dMRI and music preference correlations."
type: "object"
properties:
  author:
    type: "string"
    description: "Primary author surname."
  year:
    type: "integer"
    description: "Publication year."
  tract_name:
    type: "string"
    description: "Name of the white matter tract (e.g., Arcuate Fasciculus)."
  metric_type:
    type: "string"
    enum: ["FA", "MD", "RD", "AD"]
    description: "Diffusion MRI metric type."
  stat_type:
    type: "string"
    enum: ["r", "t", "F", "p"]
    description: "Reported statistic type."
  stat_value:
    type: "number"
    description: "The reported statistical value."
  sample_size:
    type: "integer"
    description: "Total sample size (N) for the study."
  notes:
    type: ["string", "null"]
    description: "Optional notes or context."
required:
  - "author"
  - "year"
  - "tract_name"
  - "metric_type"
  - "stat_type"
  - "stat_value"
  - "sample_size"
additionalProperties: false