$schema: "http://json-schema.org/draft-07/schema#"
title: "MetaAnalysisResult"
description: "Schema for the aggregated meta-analysis results."
type: "object"
properties:
  pooled_r:
    type: "number"
    description: "Weighted mean effect size."
    minimum: -1.0
    maximum: 1.0
  ci_lower:
    type: "number"
    description: "Lower bound of 95% CI."
  ci_upper:
    type: "number"
    description: "Upper bound of 95% CI."
  i_squared:
    type: "number"
    description: "Heterogeneity statistic (I^2)."
    minimum: 0.0
    maximum: 100.0
  q_statistic:
    type: "number"
    description: "Cochran's Q statistic."
    minimum: 0.0
  k:
    type: "integer"
    description: "Number of studies included."
    minimum: 1
  method:
    type: "string"
    description: "Model used."
    enum: ["RandomEffects", "FixedEffects", "MLM"]
  status:
    type: "string"
    description: "Execution status."
    enum: ["Success", "ConvergenceWarning", "Fallback"]
required:
  - pooled_r
  - ci_lower
  - ci_upper
  - i_squared
  - k
  - method
  - status
additionalProperties: false