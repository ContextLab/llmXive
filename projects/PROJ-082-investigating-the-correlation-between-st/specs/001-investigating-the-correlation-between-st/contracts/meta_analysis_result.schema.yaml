$schema: http://json-schema.org/draft-07/schema#
title: MetaAnalysisResult
description: Schema for the aggregated meta-analysis output.
type: object
properties:
  pooled_effect_size:
    type: number
    description: "Weighted mean correlation coefficient."
  ci_lower:
    type: number
    description: "Lower bound of the 95% confidence interval."
  ci_upper:
    type: number
    description: "Upper bound of the 95% confidence interval."
  heterogeneity_i2:
    type: number
    description: "I² statistic for heterogeneity (0-100%)."
  publication_bias_p:
    type: ["number", "null"]
    description: "P-value from Egger's regression test. Null if N < 10."
  study_count:
    type: integer
    description: "Total number of unique studies included."
  synthesis_mode:
    type: string
    enum:
      - quantitative
      - narrative
    description: "Mode of synthesis based on study count."
  bonferroni_threshold:
    type: ["number", "null"]
    description: "Adjusted significance threshold if applied. Null if not applicable."
  tract_count:
    type: integer
    description: "Number of distinct tracts (k) included in the analysis."
required:
  - pooled_effect_size
  - ci_lower
  - ci_upper
  - heterogeneity_i2
  - study_count
  - synthesis_mode
  - tract_count
additionalProperties: false