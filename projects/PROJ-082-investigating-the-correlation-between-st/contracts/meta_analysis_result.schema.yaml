$schema: http://json-schema.org/draft-07/schema#
title: Meta-Analysis Result Schema
description: Schema for pooled effect, confidence intervals, heterogeneity, and bias metrics from the meta-analysis pipeline.
type: object
required:
  - pooled_effect_size
  - confidence_interval
  - heterogeneity_metrics
  - bias_assessment
  - model_type
  - n_studies
properties:
  pooled_effect_size:
    type: object
    description: The pooled correlation coefficient (r) and its Fisher's z transformed value.
    required:
      - r
      - z
    properties:
      r:
        type: number
        description: The pooled correlation coefficient (back-transformed from z).
      z:
        type: number
        description: The pooled Fisher's z transformed value.
      se:
        type: number
        description: Standard error of the pooled z.
      ci_lower_z:
        type: number
        description: Lower bound of the confidence interval in z-space.
      ci_upper_z:
        type: number
        description: Upper bound of the confidence interval in z-space.

  confidence_interval:
    type: object
    description: The confidence interval for the pooled effect in r-space.
    required:
      - level
      - lower
      - upper
    properties:
      level:
        type: number
        description: Confidence level (e.g., 0.95).
      lower:
        type: number
        description: Lower bound of the CI in r-space.
      upper:
        type: number
        description: Upper bound of the CI in r-space.

  heterogeneity_metrics:
    type: object
    description: Metrics quantifying heterogeneity across studies.
    required:
      - i_squared
      - tau_squared
      - q_statistic
      - q_p_value
    properties:
      i_squared:
        type: number
        description: I² statistic (percentage of total variation due to heterogeneity).
      tau_squared:
        type: number
        description: Between-study variance (Tau²).
      q_statistic:
        type: number
        description: Cochran's Q statistic.
      q_p_value:
        type: number
        description: P-value for Cochran's Q test.
      interpretation:
        type: string
        description: Qualitative interpretation of heterogeneity (e.g., "Low", "Moderate", "High").

  bias_assessment:
    type: object
    description: Results from publication bias tests (e.g., Egger's regression).
    required:
      - egger_test
    properties:
      egger_test:
        type: object
        description: Egger's regression test results.
        properties:
          intercept:
            type: number
            description: Intercept of the Egger's regression.
          p_value:
            type: number
            description: P-value for the intercept (significance of asymmetry).
          t_statistic:
            type: number
            description: T-statistic for the intercept.
          skipped:
            type: boolean
            description: Whether the test was skipped (e.g., N < 10).
          reason:
            type: string
            description: Reason for skipping if applicable.

  model_type:
    type: string
    description: Type of meta-analysis model used.
    enum:
      - fixed_effects
      - random_effects

  n_studies:
    type: integer
    description: Number of studies included in the analysis.

  n_valid_pairs:
    type: integer
    description: Number of studies with valid (r, n) pairs.

  k_tracts:
    type: integer
    description: Number of distinct tracts analyzed (for correction context).

  correction_applied:
    type: object
    description: Details on multiple comparisons correction if applied.
    properties:
      bonferroni_applied:
        type: boolean
      alpha_adjusted:
        type: number
      p_adjusted:
        type: array
        items:
          type: number
        description: List of adjusted p-values.

  hartung_knapp_adjusted:
    type: boolean
    description: Whether Hartung-Knapp adjustment was applied.

  meta_status:
    type: string
    description: Status of the meta-analysis execution.
    enum:
      - completed
      - skipped
      - failed

  skip_reason:
    type: string
    description: Reason for skipping if meta_status is 'skipped'.

  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the analysis was run.