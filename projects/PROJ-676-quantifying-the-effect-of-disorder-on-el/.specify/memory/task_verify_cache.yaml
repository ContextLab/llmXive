  r: "The Hamiltonian generator and storage utilities exist, but the required provenance\
    \ and checksum artifacts are not present as specified: `data/metadata/checksums.json`\
    \ is missing, and `data/metadata/provenance.json` contains only a JSON schema\
    \ rather than actual provenance entries logged by the code. No unit\u2011test\
    \ files are provided to demonstrate seed reproducibility, disorder bounds, or\
    \ open\u2011boundary structure. These omissions mean the task\u2019s storage\u2011\
    with\u2011provenance requirement is not satisfied."
