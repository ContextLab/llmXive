# Output Schema for Model Results
fields:
  model_type:
    type: string
    required: true
    description: Type of model (e.g., RandomForest, SVM)
  hyperparameters:
    type: dict
    required: true
    description: Hyperparameters used for the model
  metrics:
    type: dict
    required: true
    description: Performance metrics
    keys:
      R2: float
      RMSE: float
      MAE: float
  split_ratios:
    type: dict
    required: true
    description: Train/Val/Test split ratios
    keys:
      train: float
      val: float
      test: float
