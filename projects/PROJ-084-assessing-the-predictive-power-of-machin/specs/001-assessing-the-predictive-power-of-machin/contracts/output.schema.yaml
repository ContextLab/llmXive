# Output Schema Validation Contracts
# Defines the expected structure and constraints for all model output artifacts
# used in the llmXive automated science pipeline.
#
# Version: 1.0.0
# Last Updated: 2024-01-15

schema_version: "1.0.0"
description: "Schema for ML model output artifacts (predictions, metrics, reports)"

artifacts:
  # ------------------------------------------------------------------------
  # 1. Final Report (data/results/final_report.json)
  # ------------------------------------------------------------------------
  final_report:
    file_path: "data/results/final_report.json"
    format: "json"
    required_keys:
      - metadata
      - split_ratios
      - model_performance
      - success_criteria_checks
      - feature_importance_summary
      - sc003_substructure_frequency

    metadata:
      type: object
      required:
        - project_id
        - pipeline_version
        - timestamp
        - dataset_source
        - random_seed
      properties:
        project_id:
          type: string
          pattern: "^PROJ-\\d+-[a-z-]+$"
          description: "Project identifier"
        pipeline_version:
          type: string
          description: "Version of the processing pipeline"
        timestamp:
          type: string
          format: "date-time"
          description: "ISO 8601 timestamp of report generation"
        dataset_source:
          type: string
          description: "Source of the dataset (e.g., DOI, URL)"
        random_seed:
          type: integer
          description: "Random seed used for reproducibility"

    split_ratios:
      type: object
      required:
        - train
        - validation
        - test
      properties:
        train:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: "Fraction of data in training set"
        validation:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: "Fraction of data in validation set"
        test:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: "Fraction of data in test set"

    model_performance:
      type: object
      required:
        - random_forest
        - svm
      properties:
        random_forest:
          type: object
          required:
            - r2_score
            - rmse
            - mae
            - hyperparameters
          properties:
            r2_score:
              type: number
              description: "R-squared score on test set"
            rmse:
              type: number
              minimum: 0.0
              description: "Root Mean Squared Error"
            mae:
              type: number
              minimum: 0.0
              description: "Mean Absolute Error"
            hyperparameters:
              type: object
              description: "Best hyperparameters from grid search"

        svm:
          type: object
          required:
            - r2_score
            - rmse
            - mae
            - hyperparameters
          properties:
            r2_score:
              type: number
              description: "R-squared score on test set"
            rmse:
              type: number
              minimum: 0.0
              description: "Root Mean Squared Error"
            mae:
              type: number
              minimum: 0.0
              description: "Mean Absolute Error"
            hyperparameters:
              type: object
              description: "Best hyperparameters from grid search"

    success_criteria_checks:
      type: object
      required:
        - sc001_r2_threshold
        - sc002_generalization_gap
        - sc003_substructure_frequency
        - sc005_exclusion_fraction
      properties:
        sc001_r2_threshold:
          type: object
          required:
            - threshold
            - achieved
            - value
          properties:
            threshold:
              type: number
              const: 0.40
            achieved:
              type: boolean
            value:
              type: number

        sc002_generalization_gap:
          type: object
          required:
            - threshold
            - achieved
            - value
          properties:
            threshold:
              type: number
              const: 0.10
            achieved:
              type: boolean
            value:
              type: number

        sc003_substructure_frequency:
          type: object
          required:
            - threshold
            - achieved
            - value
          properties:
            threshold:
              type: number
              const: 0.80
            achieved:
              type: boolean
            value:
              type: number

        sc005_exclusion_fraction:
          type: object
          required:
            - measured_value
            - description
          properties:
            measured_value:
              type: number
              minimum: 0.0
              maximum: 1.0
            description:
              type: string

    feature_importance_summary:
      type: object
      required:
        - top_features
        - total_features
      properties:
        top_features:
          type: array
          minItems: 10
          items:
            type: object
            required:
              - bit_index
              - importance_score
              - substructure_smiles
              - reaction_center_description
            properties:
              bit_index:
                type: integer
                minimum: 0
              importance_score:
                type: number
                minimum: 0.0
              substructure_smiles:
                type: string
              reaction_center_description:
                type: string
        total_features:
          type: integer
          minimum: 1

  # ------------------------------------------------------------------------
  # 2. Data Quality Report (data/results/data_quality_report.json)
  # ------------------------------------------------------------------------
  data_quality_report:
    file_path: "data/results/data_quality_report.json"
    format: "json"
    required_keys:
      - total_input_records
      - valid_records
      - excluded_records
      - exclusion_reasons
      - yield_distribution

    total_input_records:
      type: integer
      minimum: 0

    valid_records:
      type: integer
      minimum: 0

    excluded_records:
      type: integer
      minimum: 0

    exclusion_reasons:
      type: object
      description: "Count of records excluded for each reason"
      additionalProperties:
        type: integer
        minimum: 0

    yield_distribution:
      type: object
      required:
        - min
        - max
        - mean
        - median
        - std
      properties:
        min:
          type: number
        max:
          type: number
        mean:
          type: number
        median:
          type: number
        std:
          type: number

  # ------------------------------------------------------------------------
  # 3. Split Indices (data/processed/split_indices.parquet)
  # ------------------------------------------------------------------------
  split_indices:
    file_path: "data/processed/split_indices.parquet"
    format: "parquet"
    columns:
      - index:
          type: integer
          description: "Original row index"
      - split:
          type: string
          enum:
            - train
            - validation
            - test
          description: "Split assignment"
      - scaffold_group:
          type: string
          description: "Murcko scaffold group identifier"
      - reaction_class:
          type: string
          description: "Reaction class label"

  # ------------------------------------------------------------------------
  # 4. Validation Set (data/processed/validation_set.parquet)
  # ------------------------------------------------------------------------
  validation_set:
    file_path: "data/processed/validation_set.parquet"
    format: "parquet"
    description: "Held-out validation set for hyperparameter tuning and SC-003 checks"
    columns:
      - reaction_smiles:
          type: string
          description: "Standardized reaction SMILES"
      - yield:
          type: number
          description: "Reaction yield"
      - ecfp4:
          type: binary
          description: "ECFP4 fingerprint vector"
      - maccs:
          type: binary
          description: "MACCS fingerprint vector"
      - scaffold_group:
          type: string
      - reaction_class:
          type: string

  # ------------------------------------------------------------------------
  # 5. Best Models (data/results/best_models/)
  # ------------------------------------------------------------------------
  best_models:
    directory: "data/results/best_models/"
    format: "pickle"
    files:
      - random_forest.pkl:
          description: "Trained Random Forest model"
          required_columns:
            - model_object
            - best_params
            - training_metrics
      - svm.pkl:
          description: "Trained SVM model"
          required_columns:
            - model_object
            - best_params
            - training_metrics

validation_rules:
  # Ensure split ratios sum to 1.0
  - rule: "split_ratios.train + split_ratios.validation + split_ratios.test == 1.0"
    message: "Split ratios must sum to 1.0"

  # Ensure R2 is within valid range
  - rule: "model_performance.random_forest.r2_score >= -1.0 and model_performance.random_forest.r2_score <= 1.0"
    message: "R2 score must be between -1 and 1"

  # Ensure substructure frequency is calculated correctly
  - rule: "success_criteria_checks.sc003_substructure_frequency.value >= 0.0 and success_criteria_checks.sc003_substructure_frequency.value <= 1.0"
    message: "Substructure frequency must be between 0 and 1"

  # Ensure exclusion reasons are consistent
  - rule: "sum(exclusion_reasons.values()) == excluded_records"
    message: "Sum of exclusion reasons must equal total excluded records"