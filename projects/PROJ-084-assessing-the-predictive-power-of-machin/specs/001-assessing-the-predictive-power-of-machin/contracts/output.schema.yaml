model_type:
  type: string
  description: The type of model trained (e.g., 'RandomForest', 'SVM')
hyperparameters:
  type: dict
  description: Dictionary of the best hyperparameters found during tuning
metrics:
  type: dict
  description: Performance metrics on the test set
  required:
    - R2
    - RMSE
    - MAE
  properties:
    R2:
      type: float
      description: Coefficient of determination
    RMSE:
      type: float
      description: Root Mean Squared Error
    MAE:
      type: float
      description: Mean Absolute Error
split_ratios:
  type: dict
  description: Ratios used for train/val/test splits
  properties:
    train:
      type: float
    val:
      type: float
    test:
      type: float
