# Dataset Schema Contract for USPTO Reaction Outcome Prediction
# This schema defines the required structure for the processed dataset
# used in the machine learning pipeline.
#
# Expected columns and types for `data/processed/cleaned_reactions.parquet`

schema_version: "1.0"
description: "Schema for the cleaned and fingerprinted USPTO reaction dataset"

columns:
  - name: reaction_id
    type: string
    description: "Unique identifier for the reaction (e.g., USPTO ID)"
    nullable: false
    unique: true

  - name: reactants_smiles
    type: string
    description: "Standardized SMILES string for reactants (salt-free)"
    nullable: false
    pattern: "^[C-N-OPSHFGIVWYc-n-ospfhgivyw\\[\\]\\(\\)\\/\\\\=#@]+$"

  - name: reagents_smiles
    type: string
    description: "Standardized SMILES string for reagents"
    nullable: true

  - name: product_smiles
    type: string
    description: "Standardized SMILES string for the product"
    nullable: false

  - name: reaction_class
    type: string
    description: "Reaction class label (e.g., 'Coupling', 'Substitution', 'Addition')"
    nullable: false
    allowed_values:
      - "Coupling"
      - "Substitution"
      - "Addition"
      - "Elimination"
      - "Rearrangement"
      - "Oxidation"
      - "Reduction"
      - "Other"

  - name: yield_percent
    type: float64
    description: "Reaction yield as a percentage (0-100)"
    nullable: false
    min_value: 0.0
    max_value: 100.0

  - name: ecfp4_fingerprint
    type: binary
    description: "ECFP4 fingerprint (2048 bits) as binary blob or list of integers"
    nullable: false
    fingerprint_type: "ECFP4"
    dimension: 2048

  - name: maccs_fingerprint
    type: binary
    description: "MACCS keys fingerprint (167 bits) as binary blob or list of integers"
    nullable: false
    fingerprint_type: "MACCS"
    dimension: 167

  - name: scaffold_id
    type: string
    description: "Murcko scaffold identifier for grouping"
    nullable: true

  - name: split_group
    type: string
    description: "Data split assignment: 'train', 'val', or 'test'"
    nullable: true
    allowed_values:
      - "train"
      - "val"
      - "test"

constraints:
  - name: no_null_yields
    description: "Yield values must be present for all reactions used in training"
    check: "yield_percent is not null"

  - name: valid_fingerprints
    description: "Fingerprints must match expected dimensions"
    check: "len(ecfp4_fingerprint) == 2048 AND len(maccs_fingerprint) == 167"

  - name: valid_reaction_classes
    description: "Reaction classes must be from the allowed set"
    check: "reaction_class in allowed_values"

metadata:
  source: "USPTO Dataset (DOI: 10.1021/acs.jcim.5b00246)"
  preprocessing_version: "1.0"
  generated_by: "code/preprocessing/ingest.py"
  timestamp_format: "ISO8601"
