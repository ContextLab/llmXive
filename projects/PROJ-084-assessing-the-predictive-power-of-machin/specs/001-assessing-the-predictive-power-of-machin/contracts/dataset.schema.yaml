version: 1.0.0
description: >
  Schema definition for the processed USPTO reaction dataset.
  Used by code/utils/validators.py to enforce data integrity before modeling.
fields:
  - name: smiles
    type: string
    constraints:
      nullable: false
      description: "Canonical SMILES string of the reaction or product"
  - name: yield
    type: float
    constraints:
      nullable: false
      minimum: 0.0
      maximum: 100.0
      description: "Reaction yield percentage (0.0 to 100.0)"
  - name: reaction_class
    type: string
    constraints:
      nullable: false
      description: "Categorical label for the reaction type (e.g., 'Suzuki', 'Heck')"
  - name: fingerprint_ecfp
    type: list
    item_type: integer
    constraints:
      nullable: false
      length: 2048
      description: "ECFP4 fingerprint vector (2048 bits)"
  - name: fingerprint_maccs
    type: list
    item_type: integer
    constraints:
      nullable: false
      length: 167
      description: "MACCS keys fingerprint vector (167 bits)"