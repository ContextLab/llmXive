fields:
  - name: smiles
    type: string
    constraints:
      non_null: true
      min_length: 1
  - name: yield
    type: float
    constraints:
      min: 0.0
      max: 100.0
  - name: reaction_class
    type: string
    constraints:
      non_null: true
  - name: fingerprint_ecfp
    type: list
    item_type: int
    constraints:
      length: 2048
  - name: fingerprint_maccs
    type: list
    item_type: int
    constraints:
      length: 167
