fields:
  smiles:
    type: string
    required: true
    description: SMILES string of the reaction
    constraints:
      non_null: true
  yield_pct:
    type: float
    required: true
    description: Yield percentage
    constraints:
      min: 0.0
      max: 100.0
  reaction_class:
    type: string
    required: true
    description: Reaction class label
  fingerprint_ecfp:
    type: list
    required: true
    description: ECFP fingerprint bits
    constraints:
      item_type: int
      length: 2048
  fingerprint_maccs:
    type: list
    required: true
    description: MACCS fingerprint bits
    constraints:
      item_type: int
      length: 167
