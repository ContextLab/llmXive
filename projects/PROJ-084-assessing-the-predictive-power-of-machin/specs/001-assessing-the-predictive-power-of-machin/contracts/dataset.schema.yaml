type: object
properties:
  smiles:
    type: string
    minLength: 1
  yield:
    type: number
    minimum: 0.0
    maximum: 100.0
  reaction_class:
    type: string
    minLength: 1
  fingerprint_ecfp:
    type: array
    items:
      type: boolean
    description: "ECFP fingerprint vector (binary bits: true/false)"
  fingerprint_maccs:
    type: array
    items:
      type: boolean
    description: "MACCS key fingerprint (binary bits: true/false)"
required:
  - smiles
  - yield
  - reaction_class
  - fingerprint_ecfp
  - fingerprint_maccs
