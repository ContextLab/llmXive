# Dataset Schema Validation Contract
# This file defines the expected schema for the cleaned reaction dataset
# used in the USPTO machine learning predictive power assessment.
#
# Validated by: code/utils/schema_validator.py
# Referenced by: T011 (Contract Test), T017 (Ingestion Pipeline)

version: "1.0"
schema_type: "dataset"
description: >
  Schema for the cleaned and processed USPTO reaction dataset.
  Contains standardized SMILES, parsed yields, and fingerprint vectors.

required_columns:
  - name: "reaction_id"
    type: "string"
    description: "Unique identifier for the reaction (e.g., from original dataset)"
    constraints:
      - "non-null"
      - "unique"

  - name: "smiles_reactants"
    type: "string"
    description: "Standardized SMILES string for reactants (salt-free)"
    constraints:
      - "non-null"
      - "valid_smiles"

  - name: "smiles_reagents"
    type: "string"
    description: "Standardized SMILES string for reagents (salt-free)"
    constraints:
      - "non-null"
      - "valid_smiles"

  - name: "smiles_product"
    type: "string"
    description: "Standardized SMILES string for product"
    constraints:
      - "non-null"
      - "valid_smiles"

  - name: "yield_value"
    type: "float"
    description: "Parsed reaction yield as a percentage (0.0 - 100.0)"
    constraints:
      - "non-null"
      - "range: [0.0, 100.0]"

  - name: "reaction_class"
    type: "string"
    description: "Reaction class label (e.g., 'amide_formation', 'suzuki')"
    constraints:
      - "non-null"
      - "from_predefined_list"

  - name: "ecfp4_fingerprint"
    type: "array"
    description: "ECFP4 fingerprint vector (2048 bits)"
    constraints:
      - "non-null"
      - "length: 2048"
      - "dtype: uint8"
      - "values: [0, 1]"

  - name: "maccs_fingerprint"
    type: "array"
    description: "MACCS keys fingerprint vector (167 bits)"
    constraints:
      - "non-null"
      - "length: 167"
      - "dtype: uint8"
      - "values: [0, 1]"

  - name: "scaffold_group"
    type: "string"
    description: "Murcko scaffold grouping key"
    constraints:
      - "nullable"
      - "valid_scaffold_key"

  - name: "exclusion_reason"
    type: "string"
    description: "Reason for exclusion if record was filtered (null if kept)"
    constraints:
      - "nullable"

optional_columns:
  - name: "original_yield_raw"
    type: "string"
    description: "Original raw yield string before parsing (for auditing)"

  - name: "processing_timestamp"
    type: "string"
    description: "ISO 8601 timestamp of when the record was processed"

validation_rules:
  fingerprint_dimensions:
    ecfp4: 2048
    maccs: 167

  yield_range:
    min: 0.0
    max: 100.0

  required_reaction_parts:
    - "reactants"
    - "product"

file_format:
  primary: "parquet"
  supported:
    - "parquet"
    - "csv"

metadata:
  source: "USPTO"
  processing_pipeline: "code/preprocessing/ingest.py"
  created_by: "T007"