# Dataset Schema Validation Contract
# Defines the expected structure, types, and constraints for the cleaned reaction dataset
# used throughout the ML predictive power assessment pipeline.
#
# This schema enforces:
# - Required columns and their data types
# - Fingerprint dimensionality constraints (ECFP4=2048, MACCS=167)
# - Yield value ranges and formats
# - SMILES string validity requirements
# - Reaction class categorization

schema_version: "1.0"
dataset_name: "cleaned_reactions"
description: "Schema for USPTO-derived reaction dataset with fingerprints and metadata"

required_columns:
  - name: "smiles"
    type: "string"
    description: "Standardized SMILES string for the reaction"
    constraints:
      - not_null: true
      - valid_smiles: true
      - min_length: 10

  - name: "yield"
    type: "float"
    description: "Reaction yield percentage (0-100)"
    constraints:
      - not_null: true
      - min_value: 0.0
      - max_value: 100.0

  - name: "reaction_class"
    type: "string"
    description: "Categorization of the reaction type"
    constraints:
      - not_null: true
      - allowed_values:
          - "substitution"
          - "elimination"
          - "addition"
          - "oxidation"
          - "reduction"
          - "cross_coupling"
          - "cycloaddition"
          - "other"

  - name: "ecfp4_fingerprint"
    type: "list"
    description: "ECFP4 fingerprint vector (2048 bits)"
    constraints:
      - not_null: true
      - length: 2048
      - element_type: "integer"
      - allowed_values: [0, 1]

  - name: "maccs_fingerprint"
    type: "list"
    description: "MACCS keys fingerprint vector (167 bits)"
    constraints:
      - not_null: true
      - length: 167
      - element_type: "integer"
      - allowed_values: [0, 1]

  - name: "scaffold_group"
    type: "string"
    description: "Murcko scaffold grouping key for scaffold-aware splitting"
    constraints:
      - not_null: false  # Optional for initial ingestion, required for modeling
      - min_length: 1

  - name: "source_id"
    type: "string"
    description: "Original reaction identifier from USPTO"
    constraints:
      - not_null: true
      - unique: true

optional_columns:
  - name: "reactants_smiles"
    type: "string"
    description: "SMILES of reactants separated by '.'"
  
  - name: "product_smiles"
    type: "string"
    description: "SMILES of the main product"
  
  - name: "reagents_smiles"
    type: "string"
    description: "SMILES of reagents separated by '.'"
  
  - name: "yield_range_min"
    type: "float"
    description: "Lower bound if yield was reported as a range"
  
  - name: "yield_range_max"
    type: "float"
    description: "Upper bound if yield was reported as a range"
  
  - name: "exclusion_reason"
    type: "string"
    description: "Reason for exclusion if record was filtered out"

validation_rules:
  - rule: "fingerprint_consistency"
    description: "Ensure fingerprint lengths match expected dimensions"
    implementation: "validate_fingerprint_dimensions"
  
  - rule: "yield_validity"
    description: "Yield must be within 0-100 range"
    implementation: "validate_column_schema"
  
  - rule: "smiles_validity"
    description: "SMILES strings must be parseable by RDKit"
    implementation: "validate_record_content"
  
  - rule: "reaction_class_consistency"
    description: "Reaction class must be one of the allowed values"
    implementation: "validate_column_schema"

metadata:
  generated_by: "T007"
  validation_tool: "utils.schema_validator"
  expected_format: "parquet"
  created_date: "2024"