# Dataset Schema for USPTO Reaction Data
# Fields: smiles, yield, reaction_class, fingerprint_ecfp, fingerprint_maccs
fields:
  smiles:
    type: string
    required: true
    description: Canonical SMILES string of the reaction
  yield:
    type: float
    required: true
    min: 0.0
    max: 100.0
    description: Reaction yield percentage
  reaction_class:
    type: string
    required: true
    description: Classification of the reaction type
  fingerprint_ecfp:
    type: list
    required: true
    item_type: integer
    length: 2048
    description: ECFP4 fingerprint (2048 bits)
  fingerprint_maccs:
    type: list
    required: true
    item_type: integer
    length: 167
    description: MACCS fingerprint (167 bits)

validation_rules:
  no_nulls: true
  fingerprint_binary: true
  yield_range: [0.0, 100.0]
