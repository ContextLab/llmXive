[metadata]
name = llmxive-uspto-yield
version = 0.1.0
description = Assessing the Predictive Power of Machine Learning for Organic Reaction Outcomes
long_description = file: README.md
long_description_content_type = text/markdown
author = llmXive Research Team
license = MIT
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
python_requires = >=3.11
install_requires =
    pandas
    scikit-learn
    rdkit
    pyyaml
    pytest
    datasets
    pydantic
    jsonschema
packages = find:
package_dir =
    = code

[options.packages.find]
where = code

[options.entry_points]
console_scripts =
    uspto-yield-download = preprocessing.download:main
    uspto-yield-ingest = preprocessing.ingest:main
    uspto-yield-train = modeling.train:main
    uspto-yield-eval = modeling.evaluate:main

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info

[isort]
profile = black
line_length = 88
skip = .git,__pycache__,build,dist,.eggs,*.egg-info
known_third_party = datasets,pandas,pytest,rdkit,scikit_learn,yaml,pydantic,jsonschema,numpy
known_first_party = config,utils,preprocessing,modeling

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
disallow_untyped_defs = False