[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-084"
version = "0.1.0"
description = "Assessing the Predictive Power of Machine Learning for Organic Reaction Outcomes"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "rdkit",
    "pyyaml",
    "pytest",
    "ruff",
    "black",
]

[tool.ruff]
# Target Python version
target-version = "py311"

# Line length for formatting
line-length = 88

# Enable specific lint rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]

# Ignore specific rules if needed
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in ML)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
# Line length
line-length = 88
# Target version
target-version = ["py311"]
# Exclude common directories
extend-exclude = '''
(
    __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | data
)
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
]