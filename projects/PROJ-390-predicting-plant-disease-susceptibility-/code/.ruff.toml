# Ruff configuration
line-length = 88
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "C", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
target-version = "py311"

[lint.isort]
known-first-party = ["src", "tests", "utils"]
force-single-line = true

[lint.pyupgrade]
keep-runtime-typing = false

[lint.extend-per-file-ignores]
"tests/*" = ["S101"]
"code/src/utils/config.py" = ["E501"]