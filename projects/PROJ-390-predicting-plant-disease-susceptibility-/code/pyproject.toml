[project]
name = "plant-disease-susceptibility"
version = "0.1.0"
description = "Predicting plant disease susceptibility from genomic and environmental data"
requires-python = ">=3.11"
dependencies = [
    "pysam>=0.21.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "h5py>=3.9.0",
    "matplotlib>=3.7.0",
    "statsmodels>=0.14.0",
    "geopy>=2.4.0",
    "pyyaml>=6.0.1",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
    "datasets>=2.14.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = "\\.pyi?$"
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "UP",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = ["S101"]
"code/src/utils/config.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "utils"]
force-single-line = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
