$schema: http://json-schema.org/draft-07/schema#
title: Feature Matrix Schema
description: >
  Schema for the integrated feature matrix containing genomic variant frequencies
  and environmental metadata. Generated by the ingestion pipeline (T014).
type: object
required:
  - columns
  - data
properties:
  columns:
    type: array
    description: List of column names defining the feature space.
    items:
      type: string
    minItems: 3
    contains:
      const: "disease_susceptibility"
  data:
    type: array
    description: Row-wise data where each row represents a sample.
    items:
      type: object
      additionalProperties: true
      required:
        - sample_id
        - species
        - disease_susceptibility
  metadata:
    type: object
    description: Optional metadata about the generation of this file.
    properties:
      generated_by:
        type: string
      source_files:
        type: array
        items:
          type: string
      imputation_method:
        type: string
        enum: ["knn", "none"]
      row_count:
        type: integer
        minimum: 0
additionalProperties: false