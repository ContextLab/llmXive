$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: >
  Schema for model performance metrics and evaluation results.
  Generated by the modeling pipeline (T021).
type: object
required:
  - model_name
  - metrics
  - hyperparameters
properties:
  model_name:
    type: string
    enum: ["RandomForest", "SVM"]
  metrics:
    type: object
    required:
      - auc_roc
      - precision
      - recall
      - f1_score
    properties:
      auc_roc:
        type: number
        minimum: 0
        maximum: 1
      auc_pr:
        type: number
        minimum: 0
        maximum: 1
      precision:
        type: number
        minimum: 0
        maximum: 1
      recall:
        type: number
        minimum: 0
        maximum: 1
      f1_score:
        type: number
        minimum: 0
        maximum: 1
      accuracy:
        type: number
        minimum: 0
        maximum: 1
    additionalProperties: false
  hyperparameters:
    type: object
    description: The best hyperparameters found during grid search.
    additionalProperties: true
  feature_importance:
    type: array
    description: List of features with their importance scores.
    items:
      type: object
      required:
        - feature_name
        - importance_score
      properties:
        feature_name:
          type: string
        importance_score:
          type: number
          minimum: 0
  train_test_split:
    type: object
    properties:
      train_size:
        type: integer
      test_size:
        type: integer
      validation_size:
        type: integer
additionalProperties: false