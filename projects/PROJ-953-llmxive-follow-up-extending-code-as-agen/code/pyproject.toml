[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-harness"
version = "0.1.0"
description = "llmXive automated science pipeline for code-as-agent harness"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.14.0",
    "tree-sitter>=0.21.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "networkx>=3.1.0",
    "radon>=6.0.0",
    "pytest>=7.4.0",
    "jsonschema>=4.19.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
