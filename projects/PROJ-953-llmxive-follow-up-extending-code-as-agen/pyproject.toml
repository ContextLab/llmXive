[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive"
version = "0.1.0"
description = "Automated science pipeline for code-as-agent research"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "tree-sitter",
    "scikit-learn",
    "pandas",
    "networkx",
    "radon",
    "pytest",
    "jsonschema",
    "pyyaml",
    "black",
    "ruff"
]

[tool.black]
# Black formatting configuration
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
  | models
)/
'''

[tool.ruff]
# Ruff linting configuration (mirrors .ruff.toml for single-file config option)
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "data",
    "models"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["scripts"]
force-single-line = false
order-by-type = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
