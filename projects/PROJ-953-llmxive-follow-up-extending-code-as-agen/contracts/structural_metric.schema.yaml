# Structural Metric Schema
# This schema defines the structure for structural metric artifacts.
# It enforces that 'lines_of_code' (and other fallback metrics) are required,
# while 'semantic_complexity_score' is optional (used when semantic nodes are present).
type: object
properties:
  task_id:
    type: string
    description: Unique identifier for the task
  dependency_depth:
    type: integer
    description: Maximum depth of the dependency graph
  cyclomatic_complexity:
    type: integer
    description: Cyclomatic complexity metric (McCabe)
  semantic_complexity_score:
    type: number
    format: float
    description: Semantic complexity score derived from AST nodes. Optional; may be null if semantic analysis fails.
  lines_of_code:
    type: integer
    description: Lines of code (fallback metric). REQUIRED when semantic nodes are missing.
  node_count:
    type: integer
    description: Total number of AST nodes (optional)
  function_count:
    type: integer
    description: Number of functions detected (optional)
required:
  - task_id
  - dependency_depth
  - cyclomatic_complexity
  - lines_of_code
additionalProperties: true
