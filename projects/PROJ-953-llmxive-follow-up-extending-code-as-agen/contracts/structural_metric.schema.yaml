$schema: "http://json-schema.org/draft-07/schema#"
title: Structural Metric Schema
description: Schema for validating structural metric data artifacts
type: object
required:
  - task_id
  - metrics
properties:
  task_id:
    type: string
    description: Unique identifier for the task
  metrics:
    type: object
    required:
      - dependency_depth
      - cyclomatic_complexity
      - lines_of_code
    properties:
      dependency_depth:
        type: number
        description: Maximum depth of the dependency graph
      cyclomatic_complexity:
        type: integer
        description: Cyclomatic complexity of the code
      semantic_complexity_score:
        type: number
        description: Semantic complexity score (optional, may be null if fallback used)
        nullable: true
      lines_of_code:
        type: integer
        description: Number of lines of code (fallback metric)
      fallback_used:
        type: boolean
        description: Indicates if fallback metrics were used instead of semantic analysis
additionalProperties: false
