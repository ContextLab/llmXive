$schema: "http://json-schema.org/draft-07/schema#"
title: "StructuralMetric"
type: object
properties:
  task_id:
    type: string
  dependency_depth:
    type: integer
  cyclomatic_complexity:
    type: integer
  semantic_complexity_score:
    type: number
  lines_of_code:
    type: integer
required:
  - task_id
  - dependency_depth
  - cyclomatic_complexity
if:
  properties:
    semantic_complexity_score:
      type: number
  required: ["semantic_complexity_score"]
then:
  # When semantic_complexity_score is present, lines_of_code is optional
  # No additional required fields
  {}
else:
  required: ["lines_of_code"]
