$schema: "http://json-schema.org/draft-07/schema#"
title: Model Outcome Schema
description: Schema for validating model outcome data artifacts
type: object
required:
  - model_id
  - outcome_type
  - results
properties:
  model_id:
    type: string
    description: Unique identifier for the model
  outcome_type:
    type: string
    description: Type of outcome (e.g., "prediction", "threshold_analysis")
  results:
    type: object
    description: The model outcome results
    properties:
      accuracy:
        type: number
        minimum: 0
        maximum: 1
      precision:
        type: number
        minimum: 0
        maximum: 1
      recall:
        type: number
        minimum: 0
        maximum: 1
      f1_score:
        type: number
        minimum: 0
        maximum: 1
      false_negative_rate:
        type: number
        minimum: 0
        maximum: 1
      threshold:
        type: number
      is_safe:
        type: boolean
  metadata:
    type: object
    description: Optional metadata
    properties:
      trained_at:
        type: string
        format: date-time
      dataset_version:
        type: string
      hyperparameters:
        type: object
additionalProperties: true
