$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Outcome Schema"
description: "Schema for validating model training outcomes and threshold analysis results."
type: object
required:
  - model_type
  - thresholds
  - correlation_coefficient
  - is_safe
properties:
  model_type:
    type: string
    enum:
      - logistic_regression
      - random_forest
    description: "Type of model trained."
  thresholds:
    type: object
    description: "False negative rates for each tested threshold."
    required:
      - 0.01
      - 0.05
      - 0.1
    properties:
      0.01:
        type: number
        minimum: 0
        maximum: 1
        description: "FNR at threshold 0.01."
      0.05:
        type: number
        minimum: 0
        maximum: 1
        description: "FNR at threshold 0.05."
      0.1:
        type: number
        minimum: 0
        maximum: 1
        description: "FNR at threshold 0.1."
    additionalProperties: false
  minimum_achievable_fnr:
    type: number
    minimum: 0
    maximum: 1
    description: "Minimum achievable FNR if target is not met."
  target_fnr:
    type: number
    minimum: 0
    maximum: 1
    description: "Target FNR constraint (0.001 for 0.1%)."
    default: 0.001
  is_safe:
    type: boolean
    description: "Whether the model meets the safety constraint (FNR ≤ 0.1%)."
  correlation_coefficient:
    type: number
    description: "Correlation coefficient between structural features and execution necessity."
  training_timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of model training."
  random_seed:
    type: integer
    description: "Random seed used for reproducibility."
  model_artifact_path:
    type: string
    description: "Path to the saved model artifact."
  note:
    type: string
    description: "Additional notes, e.g., 'Results are associational, not causal'."
additionalProperties: false