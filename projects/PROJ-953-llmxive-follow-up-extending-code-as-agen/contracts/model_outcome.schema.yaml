$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelOutcome"
type: object
properties:
  task_id:
    type: string
  dynamic_execution_outcome:
    type: string
    enum:
      - Pass
      - Fail
      - "Timeout/Fail"
  predicted:
    type: string
    enum:
      - Static_Safe
      - Dynamic_Needed
required:
  - task_id
  - dynamic_execution_outcome