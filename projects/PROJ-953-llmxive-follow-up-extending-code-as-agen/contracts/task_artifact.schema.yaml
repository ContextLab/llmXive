$schema: http://json-schema.org/draft-07/schema#
title: Task Artifact Schema
description: Schema for validating task artifacts generated by the llmXive pipeline.
type: object
required:
  - task_id
  - status
  - created_at
properties:
  task_id:
    type: string
    description: Unique identifier for the task (e.g., T001).
    pattern: "^T\\d{3}$"
  status:
    type: string
    enum:
      - pending
      - in_progress
      - completed
      - failed
      - atomize
    description: Current status of the task.
  created_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of creation.
  updated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of last update.
  artifacts:
    type: array
    description: List of artifacts produced by the task.
    items:
      type: object
      required:
        - path
        - type
      properties:
        path:
          type: string
          description: Relative path to the artifact.
        type:
          type: string
          enum:
            - code
            - data
            - config
            - report
            - model
          description: Type of the artifact.
        checksum:
          type: string
          description: SHA-256 checksum of the artifact content.
        size_bytes:
          type: integer
          minimum: 0
          description: Size of the artifact in bytes.
  metadata:
    type: object
    description: Additional metadata about the task execution.
    properties:
      duration_seconds:
        type: number
        minimum: 0
      error_message:
        type: string
      retry_count:
        type: integer
        minimum: 0
additionalProperties: false
