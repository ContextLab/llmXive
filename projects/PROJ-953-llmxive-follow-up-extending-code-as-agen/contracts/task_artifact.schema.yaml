$schema: "http://json-schema.org/draft-07/schema#"
title: Task Artifact Schema
description: Schema for validating task artifact data
type: object
required:
  - task_id
  - artifact_type
  - content
properties:
  task_id:
    type: string
    description: Unique identifier for the task
  artifact_type:
    type: string
    description: Type of artifact (e.g., "ground_truth", "features", "model")
  content:
    type: object
    description: The actual artifact content
  metadata:
    type: object
    description: Optional metadata about the artifact
    properties:
      created_at:
        type: string
        format: date-time
      source:
        type: string
      version:
        type: string
additionalProperties: true
