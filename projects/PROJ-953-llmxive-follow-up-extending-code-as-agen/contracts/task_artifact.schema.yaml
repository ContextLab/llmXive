$schema: "http://json-schema.org/draft-07/schema#"
title: "Task Artifact Schema"
description: "Schema for validating task artifacts generated by the llmXive pipeline."
type: object
required:
  - task_id
  - status
  - created_at
  - artifacts
properties:
  task_id:
    type: string
    description: "Unique identifier for the task (e.g., T004)."
    pattern: "^T\\d{3}$"
  status:
    type: string
    enum:
      - pending
      - in_progress
      - completed
      - failed
      - atomize
    description: "Current status of the task."
  created_at:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of artifact creation."
  updated_at:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of last update."
  description:
    type: string
    description: "Optional description of the task."
  artifacts:
    type: array
    description: "List of artifacts produced by the task."
    items:
      type: object
      required:
        - path
        - type
      properties:
        path:
          type: string
          description: "Relative path to the artifact within the project."
        type:
          type: string
          enum:
            - code
            - data
            - test
            - config
            - documentation
          description: "Type of the artifact."
        checksum:
          type: string
          description: "SHA-256 checksum of the artifact content."
        size_bytes:
          type: integer
          minimum: 0
          description: "Size of the artifact in bytes."
  metadata:
    type: object
    description: "Additional metadata associated with the task."
    additionalProperties: true
additionalProperties: false
