$schema: "http://json-schema.org/draft-07/schema#"
title: "UQMethodSchema"
description: "Schema for the registry of each UQ method used in the pipeline."
type: object
properties:
  method_id:
    type: string
    enum:
      - "gpr"
      - "mc_dropout"
      - "deep_ensemble"
      - "conformal"
    description: "Identifier of the UQ method."
  baseline_model:
    type: string
    description: "Underlying predictive model (e.g., 'xgboost', 'mlp', 'gpr')."
  hyperparams:
    type: object
    description: "JSON‑serialisable hyperparameter dictionary."
  n_iterations:
    type: integer
    description: "Number of MC passes or ensemble members."
  status:
    type: string
    enum:
      - "success"
      - "failed"
      - "skipped"
    description: "Training/inference outcome."
  error_msg:
    type: string
    description: "Error message if status == 'failed'."
required:
  - method_id
  - baseline_model
  - hyperparams
  - n_iterations
  - status
additionalProperties: false
