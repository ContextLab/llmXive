$schema: "http://json-schema.org/draft-07/schema#"
title: "EvaluationMetricSchema"
description: "Schema for scalar evaluation metrics (Calibration Error, Sharpness, Coverage Error)."
type: object
properties:
  dataset_id:
    type: string
    description: "Foreign key to MaterialsDataset."
  method_id:
    type: string
    enum:
      - "gpr"
      - "mc_dropout"
      - "deep_ensemble"
      - "conformal"
      - "deterministic_mlp"
    description: "UQ method identifier."
  metric_type:
    type: string
    enum:
      - "calibration_error"
      - "sharpness"
      - "coverage_error"
    description: "Type of metric."
  value:
    type: number
    description: "Calculated metric value."
  nominal_coverage:
    type: number
    minimum: 0
    maximum: 1
    description: "Target coverage level (only for interval metrics)."
  timestamp:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp of metric computation."
required:
  - dataset_id
  - method_id
  - metric_type
  - value
  - timestamp
additionalProperties: false