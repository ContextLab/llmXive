# Data contract: per_sample_errors.csv
# Defines the schema for sample-level predictions and errors produced
# by the UQ pipeline (tasks T003/T004). Each row is one test sample
# evaluated by one UQ method on one dataset.
name: per_sample_errors
description: >
  Sample-level predictions, prediction intervals, ground-truth values,
  and absolute errors for every (dataset, method) combination evaluated
  by the uncertainty-quantification pipeline.
format: csv
path: data/results/per_sample_errors.csv
columns:
  - name: sample_id
    dtype: string
    description: Unique identifier of the test sample.
    required: true
  - name: dataset
    dtype: string
    description: >
      Dataset identifier. Allowed values: band_gap, thermal_conductivity,
      formation_energy (per spec.md SC-005).
    required: true
    allowed_values:
      - band_gap
      - thermal_conductivity
      - formation_energy
  - name: method
    dtype: string
    description: UQ method identifier.
    required: true
    allowed_values:
      - gpr
      - mc_dropout
      - deep_ensemble
      - conformal
  - name: prediction
    dtype: float
    description: Point prediction of the model for this sample.
    required: true
  - name: lower_bound
    dtype: float
    description: Lower bound of the prediction interval.
    required: true
  - name: upper_bound
    dtype: float
    description: Upper bound of the prediction interval.
    required: true
  - name: ground_truth
    dtype: float
    description: Measured (true) property value for this sample.
    required: true
  - name: abs_error
    dtype: float
    description: Absolute error, abs(prediction - ground_truth).
    required: true
constraints:
  - "lower_bound <= upper_bound for every row"
  - "abs_error == abs(prediction - ground_truth)"
  - "one row per (dataset, method, sample_id); no duplicates"
  - "all values finite (no NaN/Inf)"
primary_key: [dataset, method, sample_id]
