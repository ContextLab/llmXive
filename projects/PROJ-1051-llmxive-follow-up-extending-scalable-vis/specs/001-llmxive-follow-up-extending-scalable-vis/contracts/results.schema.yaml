$schema: "http://json-schema.org/draft-07/schema#"
title: DownstreamResults
type: object
required:
  - dataset_url
  - dataset_sha256
  - n_valid_rows
  - seeds
  - seed_count
  - distillation_sanity_check
  - label_semantics
  - leakage_check
  - structural_target_degeneracy
  - downstream
  - ablation_incremental_value
  - random_latent_control
  - independence_descriptive
  - resources
  - framing
  - scope_limitation
properties:
  dataset_url:
    type: string
    description: "Verified source URL of the input parquet."
  dataset_sha256:
    type: string
    description: "SHA-256 checksum of the raw parquet."
  n_valid_rows:
    type: integer
    description: "Count of schema-valid rows after preprocessing."
  seeds:
    type: array
    items:
      type: integer
    minItems: 2
  seed_count:
    type: integer
    description: "Number of random seeds used in the experiment (fixed to a modest number of seeds)."
  distillation_sanity_check:
    type: object
    description: "SC-001 downgraded to a sanity/feasibility check. The target is deterministic, so MSE convergence is near-tautological and is NOT hypothesis evidence."
    required:
      - mse_val_mean
      - mse_random_init_mean
      - p_value
      - test_name
      - alpha
      - is_sanity_check_only
    properties:
      mse_val_mean:
        type: number
      mse_random_init_mean:
        type: number
      p_value:
        type: number
      test_name:
        type: string
        description: "paired t-test or wilcoxon (Shapiro-Wilk decided)."
      alpha:
        type: number
        description: "Bonferroni-corrected alpha (0.025); stricter than and consistent with SC-003's 0.05."
      is_sanity_check_only:
        type: boolean
        const: true
      val_train_loss_ratio:
        type: number
        description: "Overfitting check; threshold 2.0 (SC-007)."
  label_semantics:
    type: object
    description: "Recorded construction of the downstream label."
    required:
      - label_column
      - description
      - source_columns
    properties:
      label_column:
        type: string
      description:
        type: string
      source_columns:
        type: array
        items:
          type: string
  leakage_check:
    type: object
    description: "Pre-registered gate: correlation between the label and surface text-similarity features of the input text."
    required:
      - label_text_similarity_correlation
      - is_trivial_function_of_text
    properties:
      label_text_similarity_correlation:
        type: number
      is_trivial_function_of_text:
        type: boolean
      threshold:
        type: number
        description: "Correlation threshold above which the label is deemed trivial/leaky (set to 0.8)."
  structural_target_degeneracy:
    type: object
    description: "Non-degeneracy gate on the structural feature matrix."
    required:
      - passed
      - fallback_used
      - min_feature_variance
      - n_near_constant_features
    properties:
      passed:
        type: boolean
      fallback_used:
        type: boolean
        description: "True if newline-free features were used because line-structure features were degenerate."
      min_feature_variance:
        type: number
      n_near_constant_features:
        type: integer
  downstream:
    type: object
    description: "Primary hypothesis: augmented vs per-seed re-trained text-only baseline; pairing unit is the seed."
    required:
      - metric_name
      - baseline_mean
      - augmented_mean
      - delta
      - p_value
      - test_name
      - alpha
      - interpretable
    properties:
      metric_name:
        type: string
      baseline_mean:
        type: number
      augmented_mean:
        type: number
      delta:
        type: number
        description: "augmented minus baseline; negative deltas reported with p-value (null result)."
      p_value:
        type: number
      test_name:
        type: string
      alpha:
        type: number
        description: "Bonferroni-corrected alpha (0.025); stricter than and consistent with SC-003's 0.05."
      interpretable:
        type: boolean
        description: "False if leakage check flagged the label as a trivial function of the input text."
  ablation_incremental_value:
    type: object
    description: "FR-008 reframed: incremental predictive value of the latent over the baseline text embedding."
    required:
      - latent_only_mean
      - p_value_vs_baseline
      - independence_claim_supportable
    properties:
      latent_only_mean:
        type: number
      p_value_vs_baseline:
        type: number
      independence_claim_supportable:
        type: boolean
        const: false
  random_latent_control:
    type: object
    description: "Control experiment: random‑latent model vs text‑only baseline to assess collinearity effects."
    required:
      - random_latent_mean
      - p_value_vs_baseline
    properties:
      random_latent_mean:
        type: number
      p_value_vs_baseline:
        type: number
  independence_descriptive:
    type: object
    description: "Descriptive collinearity only; confounded by construction."
    required:
      - mutual_information_bits
      - pearson_r
    properties:
      mutual_information_bits:
        type: number
      pearson_r:
        type: number
  resources:
    type: object
    required:
      - peak_ram_gb
      - runtime_seconds
    properties:
      peak_ram_gb:
        type: number
        description: "Must be <= 7 (SC-004)."
      runtime_seconds:
        type: number
        description: "Must be <= 21600 (SC-005)."
  framing:
    type: string
    const: "associational"
    description: "All findings framed as associational; no causal claims (FR-006)."
  scope_limitation:
    type: string
    description: "Statement that visual‑encoder latents were infeasible (no verified image+layout dataset), structural text features were used instead, and FR-008's independence claim is not executable in this design."

