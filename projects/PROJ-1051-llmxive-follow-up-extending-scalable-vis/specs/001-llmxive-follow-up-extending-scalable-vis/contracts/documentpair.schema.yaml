$schema: "http://json-schema.org/draft-07/schema#"
title: DocumentPair
type: object
required:
  - doc_id
  - text
  - label
  - source_url
  - row_index
properties:
  doc_id:
    type: string
    description: "Unique identifier for the corpus row."
  text:
    type: string
    description: "Plain text content of the document (non-empty)."
    minLength: 1
  label:
    type: number
    description: "Overlap / CPU-score label used for downstream evaluation."
  source_url:
    type: string
    description: "Canonical verified dataset URL the row was downloaded from."
  row_index:
    type: integer
    description: "Original row index in the raw parquet."
  structural_latent:
    type: array
    description: "Optional deterministic structural feature vector (distillation target). Dimension D is fixed by the extractor and recorded in provenance.json."
    minItems: 1
    items:
      type: number
