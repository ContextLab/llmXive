$schema: "http://json-schema.org/draft-07/schema#"
title: DocumentPair
type: object
required:
  - doc_id
  - plain_text
  - layout_annotations
  - image_path
  - source
properties:
  doc_id:
    type: string
    description: "Unique identifier for the page."
  plain_text:
    type: string
    description: "Plain text extracted from the page."
  layout_annotations:
    type: array
    description: "List of bounding‑box annotations."
    items:
      type: object
      required:
        - type
        - x0
        - y0
        - x1
        - y1
      properties:
        type:
          type: string
          enum: [text_block, table]
          description: "Element type."
        x0:
          type: number
          description: "Normalized left coordinate."
        y0:
          type: number
          description: "Normalized top coordinate."
        x1:
          type: number
          description: "Normalized right coordinate."
        y1:
          type: number
          description: "Normalized bottom coordinate."
  image_path:
    type: string
    description: "Filesystem path to the raw scanned image (PNG/JPEG)."
  source:
    type: string
    enum: [real]
    description: "Provenance of the document (always real in this project)."
  visual_latent:
    type: array
    description: "Optional 512‑dimensional latent vector from frozen visual encoder."
    minItems: 512
    maxItems: 512
    items:
      type: number
