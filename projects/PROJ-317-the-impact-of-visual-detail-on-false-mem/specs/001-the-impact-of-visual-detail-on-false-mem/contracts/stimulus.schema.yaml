$schema: "http://json-schema.org/draft-07/schema#"
title: "Stimulus Metadata Schema"
description: "Schema for stimulus metadata files generated by code/stimuli/generator.py"
type: "object"
properties:
  image_id:
    type: "string"
    description: "Unique identifier for the stimulus"
  baseline_path:
    type: "string"
    description: "Relative path to the baseline image file"
  enhanced_path:
    type: "string"
    description: "Relative path to the enhanced detail image file"
  reduced_path:
    type: "string"
    description: "Relative path to the reduced detail image file"
  complexity_score:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Quantified complexity score of the baseline image (derived from edge density/texture)"
  manipulation_params:
    type: "object"
    properties:
      objects_added:
        type: "integer"
        minimum: 0
        description: "Number of objects added for enhanced condition"
      objects_removed:
        type: "integer"
        minimum: 0
        description: "Number of objects removed for reduced condition"
      semantic_relationship:
        type: "string"
        description: "Semantic relationship used for compositing (e.g., 'cup_on_table')"
      texture_settings:
        type: "object"
        properties:
          blur_radius:
            type: "number"
            description: "Blur radius for reduced detail"
          contrast_boost:
            type: "number"
            description: "Contrast adjustment for enhanced detail"
    required:
      - objects_added
      - objects_removed
  created_at:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of creation"
  script_version:
    type: "string"
    description: "Git commit hash or version of the generator script"
  checksum:
    type: "string"
    pattern: "^[a-f0-9]{64}$"
    description: "SHA-256 checksum of the file content"
required:
  - image_id
  - baseline_path
  - enhanced_path
  - reduced_path
  - complexity_score
  - manipulation_params
  - created_at
  - script_version
  - checksum
additionalProperties: false