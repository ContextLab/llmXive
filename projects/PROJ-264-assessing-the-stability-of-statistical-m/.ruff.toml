[lint]
# Enable all standard rules
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

# Ignore specific rules if needed (e.g., line length is handled by formatter)
ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude specific directories
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]

# Per-file ignores
per-file-ignores = {}

# Line length (should match Black's default of 88)
line-length = 88

# Target Python version
target-version = "py311"

# Allow unused variables in specific contexts (e.g., function arguments)
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Format settings
line-length = 88
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
target-version = "py311"