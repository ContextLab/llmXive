$schema: "http://json-schema.org/draft-07/schema#"
title: "EvaluationRun"
description: "Schema for a single cross-validation evaluation run (accuracy and F1)."
type: "object"
properties:
  dataset_id:
    type: "string"
    description: "Unique identifier for the dataset."
  model_name:
    type: "string"
    enum: ["LogisticRegression", "RandomForest", "LinearSVM"]
    description: "Name of the model used."
  fold_id:
    type: "integer"
    minimum: 0
    maximum: 9
    description: "Fold index (0-9)."
  repeat_id:
    type: "integer"
    minimum: 0
    maximum: 9
    description: "Repeat index (0-9)."
  accuracy:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Accuracy score for this fold."
  f1_score:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "F1 score for this fold."
required:
  - dataset_id
  - model_name
  - fold_id
  - repeat_id
  - accuracy
  - f1_score
additionalProperties: false
