$schema: "http://json-schema.org/draft-07/schema#"
title: "CorrelationResult"
description: "Pearson correlation results between log-transformed stability metrics and log-transformed dataset properties."
type: "object"
properties:
  metric_name:
    type: "string"
    enum: ["log_cv_accuracy", "log_cv_f1"]
    description: "The log-transformed stability metric being correlated."
  property_name:
    type: "string"
    enum: ["log_n_samples", "log_n_features"]
    description: "The log-transformed dataset property being correlated."
  correlation_coefficient:
    type: "number"
    description: "Pearson r value on log-transformed data."
  p_value:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Raw p-value."
  adjusted_p_value:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Benjamini-Hochberg adjusted p-value."
  method:
    type: "string"
    const: "Pearson"
    description: "Correlation method used."
  log_transformed:
    type: "boolean"
    const: true
    description: "Whether log-log transformation was applied."
required:
  - metric_name
  - property_name
  - correlation_coefficient
  - p_value
  - adjusted_p_value
  - method
  - log_transformed
additionalProperties: false
