$schema: "http://json-schema.org/draft-07/schema#"
title: "StabilityMetric"
description: "Aggregated stability metrics (mean, std, CV) for a dataset-model pair."
type: "object"
properties:
  dataset_id:
    type: "string"
    description: "Unique identifier for the dataset."
  model_name:
    type: "string"
    enum: ["LogisticRegression", "RandomForest", "LinearSVM"]
    description: "Name of the model used."
  mean_accuracy:
    type: "number"
    description: "Mean accuracy across 100 repeats."
  std_accuracy:
    type: "number"
    minimum: 0.0
    description: "Standard deviation of accuracy."
  cv_accuracy:
    type: "number"
    minimum: 0.0
    description: "Coefficient of Variation for accuracy (std/mean)."
  mean_f1:
    type: "number"
    description: "Mean F1 score across 100 repeats."
  std_f1:
    type: "number"
    minimum: 0.0
    description: "Standard deviation of F1 score."
  cv_f1:
    type: "number"
    minimum: 0.0
    description: "Coefficient of Variation for F1 score."
  n_evals:
    type: "integer"
    minimum: 1
    maximum: 100
    description: "Number of valid evaluations (should be 100)."
required:
  - dataset_id
  - model_name
  - mean_accuracy
  - std_accuracy
  - cv_accuracy
  - mean_f1
  - std_f1
  - cv_f1
  - n_evals
additionalProperties: false
