$schema: "http://json-schema.org/draft-07/schema#"
title: "Permutation Results Schema"
description: "Schema for results/permutation_results.csv containing results of permutation tests comparing model variances."
type: "object"
properties:
  dataset_id:
    type: "string"
    description: "Unique identifier for the dataset."
  comparison_pair:
    type: "string"
    enum:
      - "LR_vs_RF"
      - "LR_vs_SVM"
      - "RF_vs_SVM"
    description: "The pair of models being compared."
  metric_type:
    type: "string"
    enum:
      - "accuracy"
      - "f1"
    description: "The metric for which variance is being compared."
  test_statistic:
    type: "number"
    description: "Observed difference in variances."
  p_value:
    type: "number"
    description: "Raw p-value from the permutation test."
  p_value_adjusted:
    type: "number"
    description: "Holm-Bonferroni adjusted p-value."
  significant:
    type: "boolean"
    description: "True if adjusted p-value < 0.05."
required:
  - "dataset_id"
  - "comparison_pair"
  - "metric_type"
  - "test_statistic"
  - "p_value"
  - "p_value_adjusted"
  - "significant"
additionalProperties: false