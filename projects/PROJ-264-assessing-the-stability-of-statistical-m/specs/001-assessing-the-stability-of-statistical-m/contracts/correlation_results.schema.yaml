$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Results Schema"
description: "Schema for Pearson correlation results between log-transformed stability metrics and log-transformed dataset properties."
type: "object"
properties:
  dataset_property:
    type: "string"
    description: "The log-transformed dataset property being correlated."
    enum:
      - "log_n_samples"
      - "log_n_features"
  metric_type:
    type: "string"
    description: "The log-transformed stability metric being analyzed."
    enum:
      - "log_cv_accuracy"
      - "log_cv_f1"
  correlation_coefficient:
    type: "number"
    description: "Pearson correlation coefficient (r) on log-transformed data."
  p_value:
    type: "number"
    description: "Raw p-value for the correlation test."
  p_value_adjusted:
    type: "number"
    description: "Benjamini-Hochberg corrected p-value."
  significant:
    type: "boolean"
    description: "True if p_value_adjusted < 0.05."
required:
  - "dataset_property"
  - "metric_type"
  - "correlation_coefficient"
  - "p_value"
  - "p_value_adjusted"
  - "significant"
additionalProperties: false
