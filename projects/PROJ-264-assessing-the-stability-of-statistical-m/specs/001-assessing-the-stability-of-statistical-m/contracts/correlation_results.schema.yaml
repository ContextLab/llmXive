$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Results Schema"
description: "Schema for results/correlation_results.csv containing log-log regression results between stability metrics and dataset properties."
type: "object"
properties:
  dataset_property:
    type: "string"
    enum:
      - "log_n_samples"
      - "log_n_features"
    description: "The dataset property being correlated (log-transformed)."
  metric_type:
    type: "string"
    enum:
      - "log_cv_accuracy"
      - "log_cv_f1"
    description: "The stability metric being correlated (log-transformed)."
  slope:
    type: "number"
    description: "Slope coefficient (beta_1) from the log-log regression."
  p_value:
    type: "number"
    description: "Raw p-value for the slope coefficient."
  p_value_adjusted:
    type: "number"
    description: "Holm-Bonferroni adjusted p-value."
  significant:
    type: "boolean"
    description: "True if adjusted p-value < 0.05."
  hypothesis_tested:
    type: "string"
    description: "The null hypothesis tested (e.g., 'H0: beta1 = -0.5')."
required:
  - "dataset_property"
  - "metric_type"
  - "slope"
  - "p_value"
  - "p_value_adjusted"
  - "significant"
  - "hypothesis_tested"
additionalProperties: false