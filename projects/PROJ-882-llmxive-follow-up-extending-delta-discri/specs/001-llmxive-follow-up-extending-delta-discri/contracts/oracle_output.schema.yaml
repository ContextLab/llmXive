$schema: "http://json-schema.org/draft-07/schema#"
title: "DelTA Oracle Output"
description: "Schema for the ground-truth DelTA coefficients generated by the oracle."
type: "object"
properties:
  example_id:
    type: "string"
    description: "Unique identifier for the GSM8K example."
  model_used:
    type: "string"
    description: "The specific model used for this oracle run (e.g., Llama-3-8B or Llama-3-1B)."
  tokens:
    type: "array"
    description: "List of token-level coefficients."
    items:
      type: "object"
      properties:
        token_id:
          type: "integer"
          description: "Token index in the sequence."
        token_text:
          type: "string"
          description: "The actual token text."
        delta_coefficient:
          type: "number"
          description: "The discriminative weight derived from backpropagation."
          minimum: -1000000
          maximum: 1000000
      required:
        - token_id
        - token_text
        - delta_coefficient
required:
  - example_id
  - model_used
  - tokens
additionalProperties: false