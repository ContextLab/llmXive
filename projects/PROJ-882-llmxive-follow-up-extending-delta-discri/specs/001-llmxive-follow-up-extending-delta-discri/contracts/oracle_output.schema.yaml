$schema: "http://json-schema.org/draft-07/schema#"
title: "DelTA Oracle Output Schema (Nested Summary)"
description: "Schema for the aggregated summary report of the Oracle run (metadata + examples)."
type: "object"
properties:
  metadata:
    type: "object"
    properties:
      model_name:
        type: "string"
        description: "Name of the oracle model used (e.g., 'Llama-3-1B')."
      dataset_name:
        type: "string"
        description: "Name of the dataset (e.g., 'gsm8k')."
      seed:
        type: "integer"
        description: "Random seed used for stratification."
      variance_threshold:
        type: "number"
        description: "Minimum required variance for coefficients."
      variance_actual:
        type: "number"
        description: "Actual variance of the computed coefficients."
  examples:
    type: "array"
    items:
      type: "object"
      properties:
        example_id:
          type: "integer"
          description: "Unique identifier for the example."
        token_data:
          type: "array"
          description: "List of token-level DelTA coefficients."
          items:
            type: "object"
            properties:
              token_index:
                type: "integer"
                description: "Position of the token in the prompt."
              token_text:
                type: "string"
                description: "The token string."
              delta_coefficient:
                type: "number"
                description: "The computed DelTA weight."
              status:
                type: "string"
                enum: ["success", "failed"]
                description: "Status of the gradient computation."
            required:
              - token_index
              - token_text
              - delta_coefficient
              - status
      required:
        - example_id
        - token_data
required:
  - metadata
  - examples
