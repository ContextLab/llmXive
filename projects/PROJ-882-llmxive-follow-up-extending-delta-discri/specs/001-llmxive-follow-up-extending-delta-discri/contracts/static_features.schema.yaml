$schema: "http://json-schema.org/draft-07/schema#"
title: "Static Features Schema"
description: "Schema for static input features extracted for each token."
type: "object"
properties:
  example_id:
    type: "string"
    description: "Unique identifier for the GSM8K example."
  token_id:
    type: "integer"
    description: "Position of the token in the sequence."
  ngram_features:
    type: "array"
    items:
      type: "number"
    description: "Vector of n-gram statistics (counts)."
  pos_features:
    type: "array"
    items:
      type: "integer"
    description: "Part-of-speech tag representation."
  semantic_similarity:
    type: "number"
    description: "Cosine similarity to OpenMathInstruct-1 reference patterns."
  context_window:
    type: "string"
    description: "Text of the ±2 token context window."
  delta_coefficient:
    type: "number"
    description: "Target variable (copied from oracle) for regression."
required:
  - example_id
  - token_id
  - ngram_features
  - pos_features
  - semantic_similarity
  - context_window
  - delta_coefficient
