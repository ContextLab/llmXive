$schema: "http://json-schema.org/draft-07/schema#"
title: "Static Feature Vector"
description: "Schema for the static input features used to predict DelTA coefficients."
type: "object"
properties:
  example_id:
    type: "string"
    description: "Unique identifier for the GSM8K example."
  token_id:
    type: "integer"
    description: "Token index."
  ngram_1_count:
    type: "number"
    description: "Normalized count of 1-gram features in the sliding window."
  ngram_2_count:
    type: "number"
    description: "Normalized count of 2-gram features in the sliding window."
  ngram_3_count:
    type: "number"
    description: "Normalized count of 3-gram features in the sliding window."
  pos_tag:
    type: "string"
    description: "Part-of-speech tag."
  semantic_similarity:
    type: "number"
    description: "Cosine similarity to reference GSM8K patterns (computed via MiniLM)."
    minimum: -1.0
    maximum: 1.0
  feature_vector:
    type: "array"
    description: "Dense vector representation for model input."
    items:
      type: "number"
required:
  - example_id
  - token_id
  - ngram_1_count
  - ngram_2_count
  - ngram_3_count
  - pos_tag
  - semantic_similarity
  - feature_vector
additionalProperties: false
