$schema: "http://json-schema.org/draft-07/schema#"
title: "DelTA Oracle Coefficients Schema"
description: "Schema for ground-truth DelTA coefficients generated by the oracle model."
type: "object"
properties:
  example_id:
    type: "string"
    description: "Unique identifier for the GSM8K example."
  tokens:
    type: "array"
    description: "List of token-level coefficients."
    items:
      type: "object"
      properties:
        token_id:
          type: "integer"
          description: "Position of the token in the sequence."
        token_text:
          type: "string"
          description: "The text of the token."
        delta_coefficient:
          type: "number"
          description: "The ground-truth DelTA coefficient for this token."
      required:
        - token_id
        - token_text
        - delta_coefficient
  metadata:
    type: "object"
    properties:
      model_version:
        type: "string"
        description: "Version of the Llama-3-8B model used."
      seed:
        type: "integer"
        description: "Random seed used for generation."
      variance_check:
        type: "string"
        description: "Result of the variance check (e.g., 'PASS', 'FAIL')."
    required:
      - model_version
      - seed
      - variance_check
required:
  - example_id
  - tokens
  - metadata
