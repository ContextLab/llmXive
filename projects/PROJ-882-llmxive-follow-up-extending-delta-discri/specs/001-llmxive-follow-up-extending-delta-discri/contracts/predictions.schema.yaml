$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Predictions (Static)"
description: "Schema for the output of the static predictor model."
type: "object"
properties:
  example_id:
    type: "string"
    description: "Unique identifier for the GSM8K example."
  predictions:
    type: "array"
    description: "List of token-level predictions."
    items:
      type: "object"
      properties:
        token_id:
          type: "integer"
        predicted_delta:
          type: "number"
          description: "Predicted DelTA coefficient."
        true_delta:
          type: "number"
          description: "Ground truth DelTA coefficient for comparison."
      required:
        - token_id
        - predicted_delta
        - true_delta
required:
  - example_id
  - predictions
additionalProperties: false
