$schema: "http://json-schema.org/draft-07/schema#"
title: "DelTA Oracle Coefficients Schema"
description: "Schema for ground-truth DelTA coefficients generated by the oracle model."
type: "object"
properties:
  metadata:
    type: "object"
    properties:
      model_name:
        type: "string"
        description: "Name of the LLM used for oracle generation (e.g., Llama-3-1B)"
      dataset_source:
        type: "string"
        description: "URL of the GSM8K dataset used"
      seed:
        type: "integer"
        description: "Random seed used for sampling"
      variance:
        type: "number"
        description: "Variance of the coefficients; must be > 1e-9"
      total_examples:
        type: "integer"
        description: "Number of examples processed"
  coefficients:
    type: "array"
    description: "List of token-level coefficients"
    items:
      type: "object"
      properties:
        example_id:
          type: "string"
          description: "Unique ID of the GSM8K example"
        token_index:
          type: "integer"
          description: "Position of the token in the solution"
        token_text:
          type: "string"
          description: "The token string"
        coefficient:
          type: "number"
          description: "The DelTA coefficient value"
      required:
        - "example_id"
        - "token_index"
        - "token_text"
        - "coefficient"
    minItems: 1
required:
  - "metadata"
  - "coefficients"
