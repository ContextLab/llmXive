# contracts/data-schema.yaml
# Defines the expected schema for processed data artifacts.

name: perovskite_features
version: "1.0"
description: "Schema for the processed perovskite stability dataset."

columns:
  material_id:
    type: string
    nullable: false
    description: "Unique identifier from Materials Project."
  formula:
    type: string
    nullable: false
    description: "Chemical formula (e.g., ABX3)."
  space_group:
    type: integer
    nullable: false
    description: "Space group number."
  decomposition_energy:
    type: float
    nullable: false
    description: "Decomposition energy per atom (eV/atom)."
  tolerance_factor:
    type: float
    nullable: false
    description: "Goldschmidt tolerance factor."
  octahedral_factor:
    type: float
    nullable: false
    description: "Octahedral factor."
  ionic_radius_mismatch:
    type: float
    nullable: false
    description: "Calculated ionic radius mismatch."
  electronegativity_diff:
    type: float
    nullable: false
    description: "Electronegativity difference."

target_column: decomposition_energy
features:
  - tolerance_factor
  - octahedral_factor
  - ionic_radius_mismatch
  - electronegativity_diff
