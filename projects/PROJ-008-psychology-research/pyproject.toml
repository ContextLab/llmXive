[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychology-research"
version = "0.1.0"
description = "Mindfulness Components and Delivery Formats in ASD Social Skills Meta-Analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.0.0",
    "scikit-learn==1.3.0",
    "statsmodels==0.14.0",
    "matplotlib==3.7.0",
    "requests==2.31.0",
    "pyyaml==6.0",
    "pytest==7.4.0",
    "bayesmeta==0.1.0",
    "pdfplumber==0.10.0",
    "pydantic==2.5.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.1.6",
    "black==23.11.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
# Configuration is also defined in .ruff.toml for explicitness in the repo
# This section mirrors .ruff.toml for single-file configuration capability if needed
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP", "N", "RUF"]
ignore = ["E501", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["code"]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
