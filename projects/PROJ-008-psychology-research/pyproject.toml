[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-008-psychology-research"
version = "0.1.0"
description = "Mindfulness Components and Delivery Formats in ASD Social Skills Meta-Analysis"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.0.0",
    "scikit-learn==1.3.0",
    "statsmodels==0.14.0",
    "matplotlib==3.7.0",
    "requests==2.31.0",
    "pyyaml==6.0",
    "pytest==7.4.0",
    "bayesmeta==0.1.0",
    "pdfplumber==0.10.0",
    "pydantic==2.0.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",
    "F",
    "W",
    "I",
]
ignore = []
fixable = ["ALL"]
unfixable = []
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
]