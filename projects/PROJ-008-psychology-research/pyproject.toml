[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindfulness-asd-meta-analysis"
version = "0.1.0"
description = "Meta-analysis of mindfulness interventions for social skills in ASD"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "requests",
    "pyyaml",
    "pytest",
    "bayesmeta",
    "pdfplumber",
    "pytesseract",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
]

[tool.ruff]
# Target Python 3.11
target-version = "py311"
# Exclude generated files and virtual environments
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]
# Line length consistent with Black
line-length = 88

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # Line too long (handled by Black)
    "B008", # Do not perform function call in argument defaults (common in Pydantic/pytest)
]

[tool.ruff.lint.isort]
known-first-party = ["code", "tests", "specs"]
force-sort-within-sections = true

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | build
    | dist
    | \.egg-info
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
]
