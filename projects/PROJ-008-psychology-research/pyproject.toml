[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-008-psychology-research"
version = "0.1.0"
description = "Mindfulness Components and Delivery Formats in ASD Social Skills Meta-Analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Research Team", email = "research@example.com"}
]
dependencies = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
    "bayesmeta>=0.1.0",
    "pdfplumber>=0.10.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
# Ruff configuration is also defined in .ruff.toml, but these settings
# ensure consistency if ruff is invoked via pyproject.toml
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "PIE", "RET", "SIM"]
ignore = ["E501", "E741"]

[tool.ruff.isort]
force-single-line = true
force-sort-within-sections = true
known-first-party = ["code"]