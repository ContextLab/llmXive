$schema: "http://json-schema.org/draft-07/schema#"
title: "Effect Size Schema"
type: "object"
required:
  - "study_id"
  - "hedges_g"
  - "se"
  - "ci_lower"
  - "ci_upper"
  - "component_tag"
  - "format_tag"
  - "domain_tag"
properties:
  study_id:
    type: "string"
  hedges_g:
    type: "number"
  se:
    type: "number"
    minimum: 0
  ci_lower:
    type: "number"
  ci_upper:
    type: "number"
  n_treatment:
    type: "integer"
    minimum: 1
  n_control:
    type: "integer"
    minimum: 1
  component_tag:
    type: "string"
    enum: ["breathing", "body_scan", "mindful_movement", "combined"]
  format_tag:
    type: "string"
    enum: ["caregiver_mediated", "child_led", "hybrid"]
  domain_tag:
    type: "string"
    enum: ["communication", "peer_interaction", "emotional_regulation", "adaptive_behavior"]
additionalProperties: false
