# Schema contract for effect_sizes.csv
# Generated per T007
type: object
required:
  - study_id
  - hedges_g
  - se
  - ci_lower
  - ci_upper
  - n_treatment
  - n_control
  - component
  - format
  - domain
properties:
  study_id:
    type: string
    pattern: "^(clinicaltrials\\.gov|osf\\.io)_[A-Za-z0-9]+$"
  hedges_g:
    type: number
  se:
    type: number
    minimum: 0
  ci_lower:
    type: number
  ci_upper:
    type: number
  n_treatment:
    type: integer
    minimum: 1
  n_control:
    type: integer
    minimum: 1
  component:
    type: string
    enum:
      - breathing
      - body_scan
      - mindful_movement
      - combined
  format:
    type: string
    enum:
      - individual
      - group
      - parent_mediated
      - hybrid
  domain:
    type: string
    enum:
      - communication
      - peer_interaction
      - social_reciprocity
      - emotional_regulation
      - adaptive_behavior
additionalProperties: false
