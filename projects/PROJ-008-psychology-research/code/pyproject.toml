[project]
name = "llmxive-psychology-research"
version = "0.1.0"
description = "Meta-analysis of mindfulness interventions for ASD social skills"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.0",
    "matplotlib==3.8.4",
    "scikit-learn==1.5.0",
    "statsmodels==0.14.2",
    "requests==2.32.3",
    "pyyaml==6.0.1",
    "pytest==8.2.2",
    "bayesmeta==2.0.0",
    "pdfplumber==0.10.4",
    "pytesseract==0.3.10",
    "pydantic==2.7.1",
    "ruff==0.4.2",
    "black==24.3.0",
]

[tool.ruff]
# Inherit settings from code/.ruff.toml if we want a single source of truth,
# but explicit config here ensures CI works without relative path issues.
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["code", "tests"]
force-sort-within-sections = true

[tool.black]
line-length = 88
target-version = ['py311']
include = '\\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"