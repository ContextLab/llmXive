line-length = 88
target-version = "py311"

select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
]

ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude a few specific directories that are not part of the project
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
]

# Per-file ignores (if needed in the future)
# per-file-ignores = {}
