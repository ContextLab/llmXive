# Ruff configuration for PROJ-008-psychology-research
# Enforces style, linting, and safety rules for the research pipeline

target-version = "py311"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # Line too long (handled by Black)
    "B904", # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` (sometimes redundant in data pipelines)
]

[lint.isort]
known-first-party = ["code"]
force-sort-within-sections = true
combine-as-imports = true

[lint.per-file-ignores]
# Allow unused imports in __init__.py for package exports
"__init__.py" = ["F401"]
# Allow print statements in scripts for debugging/logging
"scripts/*.py" = ["T201"]
