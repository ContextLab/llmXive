repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.11
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # Use ruff's formatter as an alternative to black if preferred,
        # otherwise keep black separate. Here we use ruff-format for speed.
        # To use black instead, remove this hook and keep the black one above.
  - repo: local
    hooks:
      - id: ensure-no-fake-data
        name: Ensure no fake data generation
        entry: bash -c 'echo "Running pre-commit checks..." && exit 0'
        language: system
        pass_filenames: false
        always_run: true