$schema: http://json-schema.org/draft-07/schema#
title: EffectSize
description: >-
  Schema for calculated effect sizes (Hedges' g) derived from study data.
  Used for meta-analysis and subgroup comparisons.
  Derived from T007c requirements.
type: object
required:
  - study_id
  - hedges_g
  - se
  - ci_lower
  - ci_upper
  - n_treatment
  - n_control
properties:
  study_id:
    type: string
    description: Unique identifier referencing the source study record.
  hedges_g:
    type: number
    format: float
    description: Hedges' g effect size with small-sample correction.
  se:
    type: number
    format: float
    description: Standard error of the effect size.
  ci_lower:
    type: number
    format: float
    description: Lower bound of the confidence interval.
  ci_upper:
    type: number
    format: float
    description: Upper bound of the confidence interval.
  n_treatment:
    type: integer
    description: Number of participants in the treatment group.
  n_control:
    type: integer
    description: Number of participants in the control group.
additionalProperties: false