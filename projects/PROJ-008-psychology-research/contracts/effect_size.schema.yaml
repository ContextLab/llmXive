$schema: http://json-schema.org/draft-07/schema#
title: Effect Size Schema
description: |
  Schema for calculated Hedges' g effect sizes derived from cleaned studies.
  Used for meta-analysis and subgroup comparisons.
type: object
required:
  - study_id
  - hedges_g
  - se
  - ci_lower
  - ci_upper
  - n_treatment
  - n_control
properties:
  study_id:
    type: string
    description: Reference to the parent study ID
    minLength: 1
  hedges_g:
    type: number
    description: Hedges' g effect size with small-sample correction
    nullable: false
  se:
    type: number
    description: Standard error of the effect size
    nullable: false
    minimum: 0
  ci_lower:
    type: number
    description: Lower bound of the 95% confidence interval
    nullable: false
  ci_upper:
    type: number
    description: Upper bound of the 95% confidence interval
    nullable: false
  n_treatment:
    type: integer
    description: Sample size of the treatment group
    minimum: 1
  n_control:
    type: integer
    description: Sample size of the control group
    minimum: 1
additionalProperties: false
