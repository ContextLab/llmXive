$schema: "http://json-schema.org/draft-07/schema#"
title: Effect Size
description: JSON Schema for effect size calculations (Hedges' g) derived from study data.
type: object
required:
  - study_id
  - hedges_g
  - se
  - ci_lower
  - ci_upper
  - n_treatment
  - n_control
properties:
  study_id:
    type: string
    description: Unique identifier for the study, matching the ID in cleaned_studies.csv.
  hedges_g:
    type: number
    description: Hedges' g effect size with small-sample correction.
  se:
    type: number
    description: Standard error of the Hedges' g estimate.
  ci_lower:
    type: number
    description: Lower bound of the 95% confidence interval for Hedges' g.
  ci_upper:
    type: number
    description: Upper bound of the 95% confidence interval for Hedges' g.
  n_treatment:
    type: integer
    minimum: 1
    description: Number of participants in the treatment/intervention group.
  n_control:
    type: integer
    minimum: 1
    description: Number of participants in the control group.
  rater_blinding_status:
    type: string
    enum:
      - blinded
      - unblinded
      - unknown
    description: Blinding status of the outcome rater. Used to assess potential bias in effect size estimation.