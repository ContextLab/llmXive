$schema: http://json-schema.org/draft-07/schema#
title: Effect Size Schema
description: >
  Schema for calculated Hedges' g effect sizes and associated statistics
  derived from cleaned study data.
  Enforced by code/analysis/effect_sizes.py and validated by tests/contract/test_effect_size_schema.py.
type: object
required:
  - study_id
  - registry_source
  - hedges_g
  - var_hedges_g
  - ci_lower_95
  - ci_upper_95
  - intervention_components
  - delivery_format
  - social_skill_domain
properties:
  study_id:
    type: string
    description: Reference to the source study_id from cleaned_studies.csv
    pattern: "^(NCT[0-9]{8}|osf.io/[a-z0-9]+)$"
  registry_source:
    type: string
    enum:
      - ClinicalTrials.gov
      - OSF
    description: Source registry
  hedges_g:
    type: number
    description: Calculated Hedges' g effect size with small-sample correction
  var_hedges_g:
    type: number
    exclusiveMinimum: 0
    description: Variance of Hedges' g
  ci_lower_95:
    type: number
    description: Lower bound of 95% confidence interval
  ci_upper_95:
    type: number
    description: Upper bound of 95% confidence interval
  intervention_components:
    type: array
    items:
      type: string
      enum:
        - mindfulness_breathing
        - body_scan
        - mindful_movement
        - loving_kindness
        - acceptance
        - emotion_regulation
        - cognitive_restructuring
        - other
    description: Intervention components for subgroup analysis
  delivery_format:
    type: string
    enum:
      - individual
      - group
      - school_based
      - home_based
      - hybrid
    description: Delivery format for subgroup analysis
  social_skill_domain:
    type: string
    enum:
      - communication
      - social_perception
      - emotional_recognition
      - peer_interaction
      - general
    description: Social skill domain for subgroup analysis
additionalProperties: false