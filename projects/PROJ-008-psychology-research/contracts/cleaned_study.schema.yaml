$schema: http://json-schema.org/draft-07/schema#
title: Cleaned Study Schema
description: >
  Schema for validated study records extracted from ClinicalTrials.gov and OSF,
  filtered for ASD population (age 6-12) and social skill outcomes.
  Enforced by code/data/cleaner.py and validated by tests/contract/test_cleaned_study_schema.py.
type: object
required:
  - study_id
  - registry_source
  - title
  - age_range_min
  - age_range_max
  - asd_diagnosis_confirmed
  - intervention_components
  - delivery_format
  - social_skill_domain
  - n_total
  - n_treatment
  - n_control
  - mean_pre_treatment
  - sd_pre_treatment
  - mean_post_treatment
  - sd_post_treatment
  - follow_up_months
properties:
  study_id:
    type: string
    description: Unique identifier (e.g., NCT number or OSF DOI)
    pattern: "^(NCT[0-9]{8}|osf.io/[a-z0-9]+)$"
  registry_source:
    type: string
    enum:
      - ClinicalTrials.gov
      - OSF
    description: Source registry
  title:
    type: string
    minLength: 1
    description: Study title
  age_range_min:
    type: integer
    minimum: 6
    maximum: 12
    description: Minimum age of participants
  age_range_max:
    type: integer
    minimum: 6
    maximum: 12
    description: Maximum age of participants
  asd_diagnosis_confirmed:
    type: boolean
    description: Whether ASD diagnosis was confirmed via standard criteria (e.g., ADOS-2)
  intervention_components:
    type: array
    items:
      type: string
      enum:
        - mindfulness_breathing
        - body_scan
        - mindful_movement
        - loving_kindness
        - acceptance
        - emotion_regulation
        - cognitive_restructuring
        - other
    description: List of mindfulness components present in the intervention
  delivery_format:
    type: string
    enum:
      - individual
      - group
      - school_based
      - home_based
      - hybrid
    description: Format of intervention delivery
  social_skill_domain:
    type: string
    enum:
      - communication
      - social_perception
      - emotional_recognition
      - peer_interaction
      - general
    description: Primary social skill domain targeted
  n_total:
    type: integer
    minimum: 2
    description: Total sample size
  n_treatment:
    type: integer
    minimum: 1
    description: Number of participants in treatment group
  n_control:
    type: integer
    minimum: 1
    description: Number of participants in control group
  mean_pre_treatment:
    type: number
    description: Mean outcome score pre-intervention (treatment group)
  sd_pre_treatment:
    type: number
    exclusiveMinimum: 0
    description: Standard deviation pre-intervention (treatment group)
  mean_post_treatment:
    type: number
    description: Mean outcome score post-intervention (treatment group)
  sd_post_treatment:
    type: number
    exclusiveMinimum: 0
    description: Standard deviation post-intervention (treatment group)
  follow_up_months:
    type: integer
    minimum: 0
    description: Follow-up duration in months (0 if no follow-up)
additionalProperties: false
