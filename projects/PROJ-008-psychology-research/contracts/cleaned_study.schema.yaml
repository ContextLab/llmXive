$schema: http://json-schema.org/draft-07/schema#
title: Cleaned Study Schema
description: |
  Schema for validated study records extracted from ClinicalTrials.gov and OSF.
  Enforces Constitution Principle VII (Delivery Format) and FR-010 (Social Skill Domain).
type: object
required:
  - id
  - title
  - registry
  - age_range
  - diagnosis
  - outcomes
  - intervention_components
  - delivery_format
  - social_skill_domain
properties:
  id:
    type: string
    description: Unique identifier for the study (e.g., NCT number or OSF ID)
    minLength: 1
  title:
    type: string
    description: Full title of the study
    minLength: 1
  registry:
    type: string
    description: Source registry
    enum:
      - ClinicalTrials.gov
      - OSF
  age_range:
    type: string
    description: Age range of participants (e.g., "8-12")
    pattern: "^\\d+-\\d+$"
  diagnosis:
    type: string
    description: Diagnostic criteria used (e.g., DSM-5, ADOS-2)
    minLength: 1
  outcomes:
    type: array
    description: List of social skill outcome measures used
    items:
      type: string
      minLength: 1
  intervention_components:
    type: array
    description: Detected mindfulness components (e.g., 'breathing', 'body scan')
    items:
      type: string
      minLength: 1
  delivery_format:
    type: string
    description: Format of intervention delivery per Constitution Principle VII
    enum:
      - caregiver-mediated
      - child-led
      - mixed
      - not-reported
  follow_up:
    type: string
    description: Follow-up duration (e.g., "3 months", "6 months")
    nullable: true
  abstract_text:
    type: string
    description: Extracted abstract text for validation fallback
    nullable: true
  social_skill_domain:
    type: string
    description: Primary social skill domain targeted
    enum:
      - communication
      - peer interaction
      - emotional regulation
      - mixed
additionalProperties: false
