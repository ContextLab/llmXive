$schema: "http://json-schema.org/draft-07/schema#"
title: "Cleaned Study Schema for ASD Mindfulness Meta-Analysis"
description: "JSON Schema (Draft 7) defining the structure of cleaned study records extracted from ClinicalTrials.gov and OSF."
type: object
required:
  - id
  - title
  - registry
  - age_range
  - diagnosis
  - outcomes
  - intervention_components
  - delivery_format
  - social_skill_domain
properties:
  id:
    type: string
    description: "Unique identifier for the study (e.g., NCT number or OSF ID)"
  title:
    type: string
    description: "Official title of the study"
  registry:
    type: string
    enum: ["ClinicalTrials.gov", "OSF"]
    description: "Source registry where the study was registered"
  age_range:
    type: object
    description: "Age range of participants in the study"
    required:
      - min
      - max
    properties:
      min:
        type: integer
        minimum: 6
        description: "Minimum age of participants (inclusive)"
      max:
        type: integer
        maximum: 12
        description: "Maximum age of participants (inclusive)"
  diagnosis:
    type: string
    const: "ASD"
    description: "Primary diagnosis of participants (Autism Spectrum Disorder)"
  outcomes:
    type: array
    items:
      type: string
    description: "List of outcome measures assessed in the study"
  intervention_components:
    type: array
    items:
      type: string
      enum: ["breathing", "body scan", "mindful movement", "mindful eating", "none"]
    description: "Specific mindfulness components included in the intervention"
  delivery_format:
    type: string
    enum: ["caregiver-mediated", "child-led", "mixed", "not-reported"]
    description: "Format of intervention delivery"
  follow_up:
    type: string
    nullable: true
    description: "Duration of follow-up assessment (e.g., '3 months', '6 months')"
  abstract_text:
    type: string
    nullable: true
    description: "Abstract text of the study, if available"
  social_skill_domain:
    type: string
    enum: ["communication", "peer interaction", "emotional regulation", "mixed", "other"]
    description: "Primary social skill domain targeted by the intervention"
  blinded_assessment_flag:
    type: boolean
    description: "True if outcome assessment was blinded to intervention status"
  rater_type:
    type: string
    enum: ["blinded", "unblinded", "mixed"]
    description: "Type of rater used for primary outcome"