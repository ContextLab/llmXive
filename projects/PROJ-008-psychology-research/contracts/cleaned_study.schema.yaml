$schema: http://json-schema.org/draft-07/schema#
title: Cleaned Study
description: |
  Schema for cleaned study records extracted from ClinicalTrials.gov and OSF.
  Validated against inclusion criteria: ASD diagnosis, age 6-12, social skill outcomes.
  This schema supports FR-007 (Data Integrity) and Constitution Principle VI.
type: object
required:
  - id
  - title
  - registry
  - age_range
  - diagnosis
  - outcomes
  - intervention_components
  - delivery_format
  - follow_up
  - assessor_blinding
properties:
  id:
    type: string
    description: Unique identifier for the study (e.g., NCT number or OSF ID)
  title:
    type: string
    description: Official title of the study
  registry:
    type: string
    enum:
      - ClinicalTrials.gov
      - OSF
    description: Source registry where the study was registered
  age_range:
    type: string
    description: Age range of participants (e.g., "6-12", "8-10")
  diagnosis:
    type: string
    description: Primary diagnosis (must be ASD or Autism Spectrum Disorder)
  outcomes:
    type: array
    items:
      type: string
    description: List of measured social skill outcomes
  intervention_components:
    type: array
    items:
      type: string
    description: List of mindfulness components present in the intervention
  delivery_format:
    type: string
    enum:
      - individual
      - group
      - hybrid
      - online
      - not-reported
    description: Format of intervention delivery
  follow_up:
    type: string
    description: Follow-up duration (e.g., "3-month", "6-month", "none")
  abstract_text:
    type: string
    nullable: true
    description: Extracted abstract text (optional, from PDF if metadata insufficient)
  assessor_blinding:
    type: string
    enum:
      - single-blind
      - double-blind
      - unblinded
      - not-reported
    description: |
      Blinding status of the study assessors.
      Required for T022 and T023 (Blinded Assessment Extraction and Validation).
      Values:
        - single-blind: Assessors unaware of group assignment
        - double-blind: Both participants and assessors unaware
        - unblinded: No blinding performed
        - not-reported: Blinding status not mentioned in registry data
additionalProperties: false