$schema: "http://json-schema.org/draft-07/schema#"
type: object
required:
  - id
  - title
  - registry
  - age_range
  - diagnosis
  - outcomes
  - intervention_components
  - delivery_format
  - social_skill_domain
properties:
  id:
    type: string
    description: "Unique identifier for the study"
  title:
    type: string
    description: "Title of the study"
  registry:
    type: string
    enum: ["ClinicalTrials.gov", "OSF"]
    description: "Source registry of the study"
  age_range:
    type: object
    required:
      - min
      - max
    properties:
      min:
        type: integer
        minimum: 6
        description: "Minimum age of participants"
      max:
        type: integer
        maximum: 12
        description: "Maximum age of participants"
  diagnosis:
    type: string
    const: "ASD"
    description: "Diagnosis of participants (Autism Spectrum Disorder)"
  outcomes:
    type: array
    items:
      type: string
    description: "List of outcome measures reported"
  intervention_components:
    type: array
    items:
      type: string
      enum: ["breathing", "body scan", "mindful movement", "mindful eating", "none"]
    description: "Mindfulness intervention components present in the study"
  delivery_format:
    type: string
    enum: ["caregiver-mediated", "child-led", "mixed", "not-reported"]
    description: "Format of intervention delivery"
  follow_up:
    type: string
    nullable: true
    description: "Follow-up duration string (e.g., '3 months')"
  abstract_text:
    type: string
    nullable: true
    description: "Full text of the study abstract"
  social_skill_domain:
    type: string
    enum: ["communication", "peer interaction", "emotional regulation", "mixed", "other"]
    description: "Primary social skill domain targeted"
  domain_notes:
    type: string
    nullable: true
    description: "Unmatched domain descriptions captured when no keyword match found"
  blinded_assessment_flag:
    type: boolean
    description: "True if outcome assessment was blinded to intervention status"
  rater_type:
    type: string
    enum: ["blinded", "unblinded", "mixed"]
    description: "Type of rater used for primary outcome"