[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-lens-rethink"
version = "0.1.0"
description = "Follow-up research extending 'Lens: Rethinking Training Efficiency for Foundational Text-to-Image Mo'"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "xgboost",
    "scikit-learn",
    "transformers",
    "spacy",
    "datasets",
    "pandas",
    "numpy",
    "pydantic",
    "jsonschema",
    "torch",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | venv
    | data
    | results
    | archive
)/
'''

[tool.ruff]
# This section is redundant if .ruff.toml exists, but kept for compatibility
# if a user runs `ruff check` without a config file in the current directory.
# The .ruff.toml file takes precedence.

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]
exclude = ["code.tests*"]