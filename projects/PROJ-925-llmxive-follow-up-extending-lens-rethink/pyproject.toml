[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-lens-followup"
version = "0.1.0"
description = "Extended Lens: Rethinking Training Efficiency for Foundational Text-to-Image Models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "xgboost",
    "scikit-learn",
    "transformers",
    "spacy",
    "datasets",
    "pandas",
    "numpy",
    "pydantic",
    "jsonschema",
    "torch",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''
skip-magic-trailing-comma = false

[tool.ruff]
# Inherits from .ruff.toml but provides project-level defaults
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools]
packages = ["code", "code.utils", "code.models", "code.data", "code.tests", "code.tests.contract"]
