[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-lens-rethink"
version = "0.1.0"
description = "Extending Lens: Rethinking Training Efficiency for Foundational Text-to-Image Mo"
requires-python = ">=3.9"
dependencies = [
    "xgboost",
    "scikit-learn",
    "transformers",
    "spacy",
    "datasets",
    "pandas",
    "numpy",
    "pydantic",
    "jsonschema",
    "torch",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    "__pycache__",
    "*.pyc",
    ".git",
    ".venv",
    "venv",
    "env",
    ".mypy_cache",
    ".tox",
    "build",
    "dist",
    "data",
    "results",
    "archive",
    "state"
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # complex structure (allow for now in research code)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"code/data/download.py" = ["B028"] # stacklevel in logging (optional)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
