[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-lens-rethink"
version = "0.1.0"
description = "Follow-up study extending 'Lens: Rethinking Training Efficiency for Foundational Text-to-Image Mo'"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "xgboost",
    "scikit-learn",
    "transformers",
    "spacy",
    "datasets",
    "pandas",
    "numpy",
    "pydantic",
    "jsonschema",
    "torch",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
    "pytest-cov",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "E731",
    "B008",
]
fixable = ["ALL"]
unfixable = []
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".mypy_cache",
    ".nox", ".pants.d", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv",
    "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "venv",
]

[tool.ruff.isort]
known-first-party = ["code", "tests", "specs"]
force-sort-within-sections = false
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
