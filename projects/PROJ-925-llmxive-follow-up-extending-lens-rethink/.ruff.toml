# Ruff configuration for llmXive follow-up project
# Enforces PEP 8 compliance and project-specific rules

[lint]
# Enable pycodestyle (E), Pyflakes (F), and isort (I) rules
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # Line too long (handled by Black)
    "E731",  # Do not assign a lambda expression, use a def
    "B008",  # Do not perform function call in argument defaults (common in Pydantic)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude a few specific directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Per-file ignores
per-file-ignores = {}

# Assume Python 3.11
target-version = "py311"

[lint.isort]
known-first-party = ["code", "tests", "specs"]
force-sort-within-sections = false
lines-after-imports = 2
