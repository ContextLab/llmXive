# Ruff configuration for llmXive project
# Enforces PEP 8 compliance, security checks, and project-specific rules

[lint]
# Enable all relevant rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
    "T20",    # flake8-print (forbid print statements in production)
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "N",      # pep8-naming
]

# Ignore specific rules that are too strict for this research context
ignore = [
    "E501",   # line-too-long (handled by black)
    "B008",   # do not perform function calls in argument defaults (common in dataclasses)
    "ARG001", # unused-arguments (needed for interface compatibility)
    "N806",   # variable-in-class-scope (research code flexibility)
]

# Allow print statements only in tests
allowed-confusables = []

[lint.per-file-ignores]
"code/tests/*" = ["T201"]  # Allow print in tests
"code/data/download.py" = ["T201"]  # Allow print for download progress
"code/setup_project.py" = ["T201"]  # Allow print for setup messages

[lint.isort]
known-first-party = ["code", "utils", "models", "data", "tests"]
force-single-line = true
lines-between-types = 1

[format]
# Black-compatible formatting
line-length = 88
indent-width = 4
quote-style = "double"
skip-magic-trailing-comma = false
