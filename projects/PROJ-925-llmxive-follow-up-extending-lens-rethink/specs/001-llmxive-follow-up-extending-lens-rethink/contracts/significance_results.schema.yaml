$schema: http://json-schema.org/draft-07/schema#
title: Significance Results Schema
description: Schema for the output of permutation tests and Benjamini-Hochberg correction.
type: object
required:
  - feature_name
  - raw_p_value
  - adjusted_p_value
  - is_significant
  - permutation_count
properties:
  feature_name:
    type: string
    description: Name of the feature being tested.
  raw_p_value:
    type: number
    description: Unadjusted p-value from permutation test.
    minimum: 0.0
    maximum: 1.0
  adjusted_p_value:
    type: number
    description: Benjamini-Hochberg adjusted p-value.
    minimum: 0.0
    maximum: 1.0
  is_significant:
    type: boolean
    description: Whether the feature is significant at alpha=0.05.
  permutation_count:
    type: integer
    description: Number of permutations run (should be 1000).
    minimum: 100
  mean_rank:
    type: number
    description: Mean rank across sensitivity analysis (optional).
  std_dev_rank:
    type: number
    description: Standard deviation of rank across sensitivity analysis (optional).
additionalProperties: false
