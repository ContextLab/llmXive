$schema: "http://json-schema.org/draft-07/schema#"
title: "Significance Results Schema"
description: "Schema for the sensitivity analysis and permutation test results."
type: object
properties:
  features:
    type: array
    items:
      type: object
      properties:
        feature_name:
          type: string
          description: "Name of the linguistic feature."
        importance_score:
          type: number
          description: "Mean permutation importance."
        p_value:
          type: number
          description: "Adjusted p-value (Benjamini-Yekutieli)."
        mean_rank:
          type: number
          description: "Mean rank across significance threshold sweeps."
        std_dev_rank:
          type: number
          description: "Standard deviation of rank across sweeps."
      required:
        - feature_name
        - importance_score
        - p_value
        - mean_rank
        - std_dev_rank
  metadata:
    type: object
    properties:
      n_permutations:
        type: integer
        description: "Number of permutations used (default 1000)."
      fdr_threshold:
        type: number
        description: "FDR threshold used (default 0.05)."
      correction_method:
        type: string
        description: "Correction method used (e.g., 'benjamini-yekutieli')."
      threshold_sweep:
        type: array
        items:
          type: number
        description: "List of thresholds swept (e.g., [0.01, 0.05, 0.1])."
      noise_robustness:
        type: object
        description: "Results of noise injection robustness checks."
required:
  - features
  - metadata
additionalProperties: false