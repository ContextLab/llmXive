$schema: http://json-schema.org/draft-07/schema#
title: Significance Results Schema
description: >
  Schema for the output of the permutation importance and Benjamini-Hochberg correction.
type: object
required:
  - type
  - properties
properties:
  type:
    type: string
    const: object
  properties:
    type: object
    required:
      - feature_name
      - importance_score
      - p_value
      - is_significant
    properties:
      feature_name:
        type: string
      importance_score:
        type: number
      p_value:
        type: number
      is_significant:
        type: boolean
additionalProperties: false
