$schema: http://json-schema.org/draft-07/schema#
title: Significance Results Schema
description: Schema for permutation test results and stability metrics.
type: object
properties:
  feature_name:
    type: string
    description: "Name of the linguistic feature."
  importance_score:
    type: number
    description: "Mean decrease in performance when feature is shuffled."
  p_value:
    type: number
    description: "Adjusted p-value from Benjamini-Hochberg procedure."
  is_significant:
    type: boolean
    description: "True if p_value <= 0.05."
  mean_rank:
    type: number
    description: "Mean rank of the feature across sensitivity sweeps (thresholds 0.01, 0.05, 0.1)."
  std_dev_rank:
    type: number
    description: "Standard deviation of rank across sensitivity sweeps."
required:
  - feature_name
  - importance_score
  - p_value
  - is_significant
  - mean_rank
  - std_dev_rank
additionalProperties: false
