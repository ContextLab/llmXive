$schema: http://json-schema.org/draft-07/schema#
title: Significance Results Schema
description: Schema for the output of permutation tests and feature importance ranking.
type: object
required:
  - features
  - p_values
  - is_significant
  - method
  - n_iterations
  - alpha
properties:
  features:
    type: array
    items:
      type: string
    description: List of feature names in order.
  p_values:
    type: array
    items:
      type: number
      minimum: 0
      maximum: 1
    description: P-values for each feature.
  is_significant:
    type: array
    items:
      type: boolean
    description: Boolean flag indicating significance after BH correction.
  method:
    type: string
    description: Name of the correction method used (e.g., Benjamini-Hochberg).
  n_iterations:
    type: integer
    minimum: 1
    description: Number of permutation iterations.
  alpha:
    type: number
    minimum: 0
    maximum: 1
    description: Significance threshold.
  stability_metrics:
    type: object
    description: Optional metrics for seed/threshold sensitivity.
    properties:
      alpha_sweep_results:
        type: object
      seed_sweep_results:
        type: object
