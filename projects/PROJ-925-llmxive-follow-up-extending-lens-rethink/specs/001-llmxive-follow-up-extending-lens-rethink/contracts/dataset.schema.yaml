$schema: http://json-schema.org/draft-07/schema#
title: Pick-a-Pic Dataset Schema
description: Schema for the raw pick-a-pic dataset used in the llmXive pipeline.
type: object
required:
  - columns
properties:
  columns:
    type: array
    description: List of required column names in the dataset.
    items:
      type: string
    contains:
      const: human_rating
    contains:
      const: clip_score
    contains:
      const: prompt
additionalProperties: true
