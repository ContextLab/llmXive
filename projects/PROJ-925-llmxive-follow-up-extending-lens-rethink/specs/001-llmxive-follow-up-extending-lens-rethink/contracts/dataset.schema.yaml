$schema: "http://json-schema.org/draft-07/schema#"
title: "Pick-a-Pic Dataset Schema"
description: "Schema for the raw input dataset (pick-a-pic). Validates required columns and types."
type: object
properties:
  caption_id:
    type: string
    description: "Unique identifier for the caption."
  caption_text:
    type: string
    description: "The raw text of the caption."
  clip_score:
    type: number
    description: "Pre-computed CLIP similarity score."
  human_rating:
    type: number
    description: "Human preference rating. Must not be null for training."
required:
  - caption_id
  - caption_text
  - clip_score
  - human_rating
additionalProperties: true