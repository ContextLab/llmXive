$schema: http://json-schema.org/draft-07/schema#
title: Pick-a-Pic Dataset Schema
description: Schema for the raw input dataset from pick-a-pic (including generated scores).
type: object
properties:
  caption_id:
    type: string
    description: "Unique identifier for the caption record."
  caption:
    type: string
    description: "The raw text caption."
  clip_score:
    type: number
    description: "Pre-computed CLIP similarity score (generated in Phase 0 if missing)."
  human_rating:
    type: number
    description: "Human preference rating (derived from binary preference in Phase 0 if missing). Must be present for training."
required:
  - caption_id
  - caption
  - clip_score
  - human_rating
additionalProperties: false
