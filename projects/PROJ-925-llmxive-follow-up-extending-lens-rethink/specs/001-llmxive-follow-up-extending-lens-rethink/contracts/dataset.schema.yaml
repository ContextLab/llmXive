$schema: http://json-schema.org/draft-07/schema#
title: Pick-a-Pic Dataset Schema
description: Schema for the raw Pick-a-Pic dataset columns required for analysis.
type: object
required:
  - caption
  - human_rating
  - image_id
properties:
  caption:
    type: string
    description: The text caption associated with the image.
    minLength: 1
  human_rating:
    type: number
    description: Human preference rating score.
    minimum: 0.0
    maximum: 1.0
  image_id:
    type: string
    description: Unique identifier for the image.
  prompt:
    type: string
    description: The original prompt used to generate the image (optional).
  negative_prompt:
    type: string
    description: Negative prompt used (optional).
  model_id:
    type: string
    description: Model identifier used for generation (optional).
additionalProperties: true
