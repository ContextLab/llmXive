$schema: "http://json-schema.org/draft-07/schema#"
title: "Raw Dataset Schema"
description: "Schema for the raw input data from pick-a-pic or similar sources."
type: object
properties:
  caption_id:
    type: string
    description: "Unique identifier for the caption."
  caption_text:
    type: string
    description: "The raw text of the caption."
  clip_score:
    type: number
    description: "Raw CLIP similarity score."
    minimum: 0
    maximum: 1
  human_rating:
    type:
      - number
      - "null"
    description: "Human preference rating. Can be null."
  image_url:
    type: string
    format: uri
    description: "URL to the generated image."
required:
  - caption_id
  - caption_text
  - clip_score
additionalProperties: false