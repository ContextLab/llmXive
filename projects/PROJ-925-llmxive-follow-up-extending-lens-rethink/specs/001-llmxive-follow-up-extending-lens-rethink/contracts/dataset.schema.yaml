$schema: http://json-schema.org/draft-07/schema#
title: Pick-a-Pic Dataset Schema
description: >
  Schema for the raw Pick-a-Pic dataset used in the llmXive project.
  Validates the presence of required columns: human_rating, caption, image_id.
type: object
required:
  - columns
properties:
  columns:
    type: array
    items:
      type: string
    contains:
      const: human_rating
    contains:
      const: caption
    contains:
      const: image_id
additionalProperties: true
errorMessage: "Missing required dataset or column: pick-a-pic/human_rating"
