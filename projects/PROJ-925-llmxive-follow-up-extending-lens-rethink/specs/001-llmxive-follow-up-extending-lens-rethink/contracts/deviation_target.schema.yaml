$schema: "http://json-schema.org/draft-07/schema#"
title: "Deviation Target Schema"
description: "Schema for the calculated alignment deviation score."
type: object
properties:
  caption_id:
    type: string
    description: "Foreign key to the raw caption."
  normalized_clip_score:
    type: number
    description: "CLIP score normalized to [0, 1]."
    minimum: 0
    maximum: 1
  normalized_human_rating:
    type: number
    description: "Human rating normalized to [0, 1]."
    minimum: 0
    maximum: 1
  deviation_score:
    type: number
    description: "Absolute difference between normalized scores."
    minimum: 0
    maximum: 1
  exclusion_reason:
    type:
      - string
      - "null"
    description: "Reason for exclusion if the sample was dropped (e.g., 'missing_human_rating')."
required:
  - caption_id
  - normalized_clip_score
  - normalized_human_rating
  - deviation_score
additionalProperties: false