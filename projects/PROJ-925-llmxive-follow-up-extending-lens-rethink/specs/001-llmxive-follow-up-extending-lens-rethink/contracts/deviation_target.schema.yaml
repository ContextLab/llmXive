$schema: http://json-schema.org/draft-07/schema#
title: Deviation Target Schema
description: Schema for the calculated deviation target variable Y = |CLIP - Human|.
type: object
required:
  - image_id
  - clip_score
  - human_rating
  - deviation_score
properties:
  image_id:
    type: string
    description: Reference to the original image ID.
  clip_score:
    type: number
    description: Normalized CLIP score (Z-score or INT transformed).
  human_rating:
    type: number
    description: Normalized human rating (Z-score or INT transformed).
  deviation_score:
    type: number
    description: Absolute difference |CLIP - Human|.
    minimum: 0.0
additionalProperties: false
