$schema: http://json-schema.org/draft-07/schema#
title: Deviation Target Schema
description: Schema for the calculated alignment deviation score (Y).
type: object
required:
  - caption_id
  - clip_score_normalized
  - human_rating_normalized
  - deviation_score
properties:
  caption_id:
    type: string
    description: Unique identifier for the caption.
  clip_score_normalized:
    type: number
    description: Z-score or INT normalized CLIP score.
  human_rating_normalized:
    type: number
    description: Z-score or INT normalized human rating.
  deviation_score:
    type: number
    description: Absolute difference |CLIP - Human|.
    minimum: 0
