$schema: http://json-schema.org/draft-07/schema#
title: Deviation Target Schema
description: >
  Schema for the calculated alignment deviation target (Y).
  Y = | CLIP_Score - Human_Rating | (normalized).
type: object
required:
  - type
  - properties
properties:
  type:
    type: string
    const: object
  properties:
    type: object
    required:
      - caption_id
      - deviation_score
    properties:
      caption_id:
        type: string
      deviation_score:
        type: number
        description: Absolute difference between normalized CLIP and Human Rating
additionalProperties: false
