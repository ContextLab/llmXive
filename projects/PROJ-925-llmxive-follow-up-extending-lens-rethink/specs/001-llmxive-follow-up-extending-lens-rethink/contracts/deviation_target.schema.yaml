$schema: http://json-schema.org/draft-07/schema#
title: Deviation Target Schema
description: Schema for the calculated alignment deviation score.
type: object
properties:
  caption_id:
    type: string
    description: "Reference to the original caption ID."
  deviation_score:
    type: number
    description: "Absolute difference between Z-scored CLIP and Human Rating. May be discrete if human_rating is binary. Distribution is bounded and non-Gaussian."
  is_learnable:
    type: boolean
    description: "Flag indicating if the target has non-zero variance."
required:
  - caption_id
  - deviation_score
  - is_learnable
additionalProperties: false
