$schema: http://json-schema.org/draft-07/schema#
title: Linguistic Feature Vector Schema
description: Schema for the extracted linguistic features from captions.
type: object
required:
  - caption_id
  - linguistic_uncertainty_proxy
  - syntactic_depth
  - noun_phrase_density
  - token_diversity
properties:
  caption_id:
    type: string
    description: Unique identifier for the caption.
  linguistic_uncertainty_proxy:
    type: number
    description: Natural log of perplexity from BERT.
    minimum: 0
  syntactic_depth:
    type: integer
    description: Depth of the dependency tree.
    minimum: 0
  noun_phrase_density:
    type: number
    description: Ratio of noun phrases to total tokens.
    minimum: 0
    maximum: 1
  token_diversity:
    type: number
    description: Type-token ratio.
    minimum: 0
    maximum: 1