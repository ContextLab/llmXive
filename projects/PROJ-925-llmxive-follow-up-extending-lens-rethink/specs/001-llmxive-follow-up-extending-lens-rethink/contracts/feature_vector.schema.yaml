$schema: http://json-schema.org/draft-07/schema#
title: Linguistic Feature Vector Schema
description: Schema for the extracted linguistic features (text-only).
type: object
properties:
  caption_id:
    type: string
    description: "Reference to the original caption ID."
  uncertainty_proxy:
    type: number
    description: "Natural log of perplexity (ln(perplexity))."
  syntactic_depth:
    type: integer
    description: "Maximum depth of the dependency parse tree."
  noun_phrase_density:
    type: number
    description: "Ratio of distinct noun phrases to total tokens."
  token_count:
    type: integer
    description: "Total number of tokens in the caption."
  distinct_np_count:
    type: integer
    description: "Count of distinct noun phrases or named entities."
  token_diversity:
    type: number
    description: "Type-token ratio (vocabulary diversity)."
required:
  - caption_id
  - uncertainty_proxy
  - syntactic_depth
  - noun_phrase_density
  - token_count
  - distinct_np_count
  - token_diversity
additionalProperties: false
