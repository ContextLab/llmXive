$schema: "http://json-schema.org/draft-07/schema#"
title: "Linguistic Feature Vector Schema"
description: "Schema for the output of features.py. Contains only text-derived features."
type: object
properties:
  caption_id:
    type: string
    description: "Reference to the original caption."
  linguistic_uncertainty_proxy:
    type: number
    description: "Natural log of perplexity (ln(perplexity))."
  syntactic_depth:
    type: integer
    description: "Maximum depth of the dependency parse tree."
  noun_phrase_density:
    type: number
    description: "Count of noun phrases divided by caption length."
  caption_length_tokens:
    type: integer
    description: "Number of tokens in the caption."
  textual_complexity:
    type: integer
    description: "Count of distinct noun phrases or named entities."
  lexical_diversity:
    type: number
    description: "Type-Token Ratio (unique tokens / total tokens)."
  syntactic_variety:
    type: integer
    description: "Count of unique dependency relations in the parse tree."
required:
  - caption_id
  - linguistic_uncertainty_proxy
  - syntactic_depth
  - noun_phrase_density
  - caption_length_tokens
  - textual_complexity
  - lexical_diversity
  - syntactic_variety
additionalProperties: false