$schema: http://json-schema.org/draft-07/schema#
title: Linguistic Feature Vector Schema
description: >
  Schema for the extracted linguistic feature vectors.
  Validated by T018a against the output of T017.
type: object
required:
  - type
  - properties
properties:
  type:
    type: string
    const: object
  properties:
    type: object
    required:
      - caption_id
      - linguistic_uncertainty_proxy
      - syntactic_depth
      - noun_phrase_density
      - token_diversity
    properties:
      caption_id:
        type: string
      linguistic_uncertainty_proxy:
        type: number
        description: ln(perplexity) from BERT
      syntactic_depth:
        type: integer
        description: Max depth of dependency tree
      noun_phrase_density:
        type: number
        description: Ratio of noun phrases to tokens
      token_diversity:
        type: number
        description: Unique tokens / total tokens
additionalProperties: false
