$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Metrics Schema"
description: "Schema for model performance metrics and statistical tests."
type: "object"
properties:
  model_id:
    type: "string"
    description: "Unique identifier for the model artifact"
  species:
    type: "string"
    description: "Target species name"
  algorithm:
    type: "string"
    enum: ["RF", "Bioclim", "MaxEnt"]
    description: "Algorithm used for training"
  test_set_period:
    type: "string"
    description: "Time period of the test set (e.g., '2005-2020')"
  auc:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Area Under the ROC Curve"
  tss:
    type: "number"
    minimum: -1
    maximum: 1
    description: "True Skill Statistic"
  threshold:
    type: "number"
    description: "Probability threshold used for TSS calculation"
  sample_size:
    type: "integer"
    minimum: 0
    description: "Number of records in the test set"
  status:
    type: "string"
    enum: ["PASS", "INSUFFICIENT_DATA"]
    description: "Status flag based on sample size sufficiency"
  delta_auc:
    type: "number"
    description: "Difference in AUC between historical and future projection"
  calibration_brier:
    type: "number"
    description: "Brier score on recent test set"
  mop_proportion:
    type: "number"
    description: "Proportion of future pixels within analogous climate space (MESS)"
  composite_stability:
    type: "number"
    description: "Weighted combination of calibrated AUC change and MOP proportion"
  p_value:
    type: "number"
    minimum: 0
    maximum: 1
    description: "P-value from hierarchical bootstrap (FR-018)"
  effect_size:
    type: "number"
    description: "Effect size (Cohen's h = 0.50, source verified)"
  corrected_p_value:
    type: "number"
    minimum: 0
    maximum: 1
    description: "P-value after Benjamini-Hochberg correction (FR-009)"
required:
  - model_id
  - species
  - algorithm
  - test_set_period
  - auc
  - tss
  - threshold
  - sample_size
  - status
additionalProperties: false
