$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Metrics Schema"
description: "Schema for aggregated model performance metrics."
type: "object"
properties:
  species:
    type: "string"
    description: "Scientific name of the species."
  algorithm:
    type: "string"
    enum:
      - "RandomForest"
      - "Bioclim"
      - "TargetGroupLogisticRegression"
    description: "Algorithm used."
  train_period:
    type: "string"
    enum:
      - "1970-2000"
      - "2005-2020"
    description: "Training period of the model."
  data_sufficiency:
    type: "boolean"
    description: "True if records >= min_required_count, False otherwise."
  metrics:
    type: "object"
    properties:
      AUC:
        type: "number"
        minimum: 0
        maximum: 1
        description: "Area Under Curve."
      TSS:
        type: "number"
        minimum: -1
        maximum: 1
        description: "True Skill Statistic."
    required:
      - AUC
      - TSS
  cv_folds:
    type: "integer"
    minimum: 1
    description: "Number of spatial blocks used."
required:
  - species
  - algorithm
  - train_period
  - data_sufficiency
  - metrics
  - cv_folds
additionalProperties: false