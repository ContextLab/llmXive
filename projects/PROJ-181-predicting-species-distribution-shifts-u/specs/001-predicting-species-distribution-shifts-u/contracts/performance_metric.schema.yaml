$schema: "http://json-schema.org/draft-07/schema#"
title: "Performance Metric Schema"
description: "Schema for model evaluation metrics."
type: "object"
properties:
  modelID:
    type: "string"
    description: "Reference to model artifact"
  metricName:
    type: "string"
    description: "Metric name (e.g., 'AUC', 'TSS')"
  value:
    type: "number"
    description: "Metric value"
  confidenceInterval:
    type: "string"
    description: "Confidence interval (e.g., “a conventional high‑confidence interval, such as a standard confidence level, spanning a high‑probability range”)"
  pValue:
    type: "number"
    description: "P-value from statistical test"
  effectSize:
    type: "number"
    description: "Effect size (Cohen's h)"
required:
  - modelID
  - metricName
  - value
  - confidenceInterval
  - pValue
  - effectSize
additionalProperties: false
