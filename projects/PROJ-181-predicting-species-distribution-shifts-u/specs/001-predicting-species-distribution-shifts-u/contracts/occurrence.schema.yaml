$schema: "http://json-schema.org/draft-07/schema#"
title: "Occurrence Record Schema"
description: "Schema for validated GBIF occurrence records after preprocessing."
type: "object"
properties:
  gbif_key:
    type: "string"
    description: "Unique GBIF occurrence identifier."
  scientific_name:
    type: "string"
    description: "Scientific name of the species."
  decimalLatitude:
    type: "number"
    minimum: -90
    maximum: 90
    description: "Latitude in WGS84."
  decimalLongitude:
    type: "number"
    minimum: -180
    maximum: 180
    description: "Longitude in WGS84."
  year:
    type: "integer"
    minimum: 1970
    description: "Year of observation."
  month:
    type: "integer"
    minimum: 1
    maximum: 12
    description: "Month of observation."
  source:
    type: "string"
    enum:
      - "GBIF"
      - "eBird"
    description: "Data source."
  download_timestamp:
    type: "string"
    format: "date-time"
    description: "Timestamp of data download."
  dataset_name:
    type: "string"
    description: "Original dataset name from GBIF (Constitution Principle VI)."
required:
  - gbif_key
  - scientific_name
  - decimalLatitude
  - decimalLongitude
  - year
  - month
  - source
  - download_timestamp
  - dataset_name
additionalProperties: false