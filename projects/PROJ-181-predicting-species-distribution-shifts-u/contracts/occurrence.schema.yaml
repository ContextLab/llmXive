$schema: http://json-schema.org/draft-07/schema#
title: Species Occurrence Record Schema
description: Schema for validating occurrence records (raw and processed) including metadata requirements from Constitution Principle VI.
type: object
required:
  - species
  - decimalLatitude
  - decimalLongitude
  - year
  - source_identifier
  - download_timestamp
  - original_dataset_name
properties:
  species:
    type: string
    description: Scientific name of the species
    minLength: 1
  decimalLatitude:
    type: number
    description: Latitude in decimal degrees (WGS84)
    minimum: -90
    maximum: 90
  decimalLongitude:
    type: number
    description: Longitude in decimal degrees (WGS84)
    minimum: -180
    maximum: 180
  year:
    type: integer
    description: Year of occurrence
    minimum: 1900
    maximum: 2099
  month:
    type: integer
    description: Month of occurrence (optional)
    minimum: 1
    maximum: 12
  day:
    type: integer
    description: Day of occurrence (optional)
    minimum: 1
    maximum: 31
  basisOfRecord:
    type: string
    description: Basis of record (e.g., 'HUMAN_OBSERVATION', 'OBSERVATION')
  individualCount:
    type: integer
    description: Number of individuals observed (optional)
    minimum: 1
  sex:
    type: string
    description: Sex of the individual (optional)
  lifeStage:
    type: string
    description: Life stage (optional)
  coordinateUncertaintyInMeters:
    type: number
    description: Coordinate uncertainty in meters (optional)
    minimum: 0
  source_identifier:
    type: string
    description: Unique identifier for the source record (Constitution Principle VI)
    minLength: 1
  download_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the data was downloaded (Constitution Principle VI)
  original_dataset_name:
    type: string
    description: Name of the original dataset from which the record was sourced (Constitution Principle VI)
    minLength: 1
  bias_weight:
    type: number
    description: Calculated bias weight from effort data (optional, for processed data)
    minimum: 0.0
  climate_1970_2000_bio1:
    type: number
    description: Extracted climate variable BIO1 (Annual Mean Temperature) for 1970-2000 (optional)
  climate_1970_2000_bio12:
    type: number
    description: Extracted climate variable BIO12 (Annual Precipitation) for 1970-2000 (optional)
  # Additional climate variables can be added as needed
additionalProperties: true