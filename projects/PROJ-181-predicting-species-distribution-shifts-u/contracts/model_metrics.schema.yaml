$schema: http://json-schema.org/draft-07/schema#
title: Model Metrics Schema
description: |
  JSON Schema for validating model performance metrics files (e.g., training_metrics.csv converted to JSON, 
  baseline_performance.csv, bias_null_metrics.csv).
type: object
required:
  - metrics
properties:
  metrics:
    type: array
    description: List of metric records, one per model/species/algorithm combination.
    items:
      type: object
      required:
        - species
        - algorithm
        - auc
        - tss
      properties:
        species:
          type: string
          description: Scientific name of the species.
        algorithm:
          type: string
          description: Name of the algorithm used (e.g., 'random_forest', 'bioclim', 'logistic_regression').
        auc:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Area Under the Receiver Operating Characteristic Curve.
        tss:
          type: number
          minimum: -1.0
          maximum: 1.0
          description: True Skill Statistic.
        threshold:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Suitability threshold used for binary classification (optional).
        sample_size:
          type: integer
          minimum: 1
          description: Number of occurrence records used for training/evaluation.
        spatial_block:
          type: string
          description: Identifier for the spatial block fold used (if applicable).
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the metric was calculated.
        notes:
          type: string
          description: Optional notes about the metric calculation.
additionalProperties: false
