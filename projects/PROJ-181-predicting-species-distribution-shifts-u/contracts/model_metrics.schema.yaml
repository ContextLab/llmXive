$schema: http://json-schema.org/draft-07/schema#
title: Model Performance Metrics Schema
description: Schema for validating model evaluation metrics (AUC, TSS, etc.) produced by the SDM pipeline.
type: object
required:
  - species
  - algorithm
  - auc
  - tss
  - timestamp
  - data_source
properties:
  species:
    type: string
    description: Scientific name of the species (e.g., 'Zenaida macroura')
    minLength: 1
  algorithm:
    type: string
    description: Name of the modeling algorithm used
    enum:
      - RandomForest
      - Bioclim
      - LogisticRegression
      - Baseline
      - BiasNull
  auc:
    type: number
    description: Area Under the ROC Curve
    minimum: 0.0
    maximum: 1.0
  tss:
    type: number
    description: True Skill Statistic
    minimum: -1.0
    maximum: 1.0
  threshold:
    type: number
    description: Suitability threshold used for TSS calculation (optional)
    minimum: 0.0
    maximum: 1.0
  n_train:
    type: integer
    description: Number of training samples
    minimum: 0
  n_test:
    type: integer
    description: Number of test samples
    minimum: 0
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the metrics were calculated
  data_source:
    type: string
    description: Path or identifier of the dataset used for evaluation
  notes:
    type: string
    description: Optional notes or warnings (e.g., 'INSUFFICIENT_DATA')
additionalProperties: false
