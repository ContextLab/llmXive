$schema: http://json-schema.org/draft-07/schema#
title: Model Metrics Schema
description: JSON Schema for validating species distribution model performance metrics (AUC, TSS, etc.)
type: object
required:
  - species
  - algorithm
  - metrics
  - timestamp
  - fold_id
properties:
  species:
    type: string
    description: Scientific name of the species (e.g., 'Turdus migratorius')
    minLength: 1
  algorithm:
    type: string
    description: Model algorithm used
    enum:
      - random_forest
      - bioclim
      - logistic_regression_pb
  metrics:
    type: object
    required:
      - auc
      - tss
    properties:
      auc:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Area Under the Receiver Operating Characteristic Curve
      tss:
        type: number
        minimum: -1.0
        maximum: 1.0
        description: True Skill Statistic
      sensitivity:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Sensitivity (True Positive Rate)
      specificity:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Specificity (True Negative Rate)
      kappa:
        type: number
        minimum: -1.0
        maximum: 1.0
        description: Cohen's Kappa coefficient
  fold_id:
    type: integer
    description: Spatial block fold identifier
    minimum: 0
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of metric calculation
  config_snapshot:
    type: object
    description: Snapshot of hyperparameters used for this fold
    additionalProperties: true
  notes:
    type: string
    description: Optional notes or warnings about the metric calculation
additionalProperties: false
