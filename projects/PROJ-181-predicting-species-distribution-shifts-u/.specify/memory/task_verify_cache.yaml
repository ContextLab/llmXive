T001:
  c: false
  h: 72ce84de92f13088b57d889ffd696f6b71bc4d2c192953831f7224bc92663996
  r: "The required root-level `.flake8` was not confirmed at the project root (a `.flake8`\
    \ appears only inside `code/`), and the directories `logs/` and `metrics/` \u2014\
    \ explicitly required with `.gitkeep` files \u2014 are absent from the collected\
    \ evidence entirely. Additionally, `data/manifest.json` contains obviously fabricated\
    \ placeholder checksums (e.g., `a1b2c3d4e5f6...`) and file sizes for datasets\
    \ that don't exist, which is not part of this scaffold task and should not have\
    \ been generated. Fix: create root `.flake8`, create `logs/` and `metrics/` with\
    \ `.gitkeep`, and remove the fabricated manifest."
  sig: 61158b2698b7ceca0dabe96dbd71abcfeb7568fdc5f91e007f68d612efbe023f
T002:
  c: true
  h: 3e187be207ae5d7f8de8abfd65104c30f32f56089ec4fce2763935722e5e222a
  r: "Checked `code/config.py` (3188\u202Fbytes) which defines directory path constants,\
    \ a `SPECIES_LIST`, `THINNING_DISTANCE_KM`, a random seed (`RND_SEED = 42`), and\
    \ sets `N_JOBS = 2` as required. All requested global constants are present and\
    \ correctly set."
  sig: a356d187b54eab76423cee941bd3291105ae148f4a0f0b3bb03906ccb0104e86
T003:
  c: false
  h: 6cd20ca29aee60eb4f3363a8912627bc67f30cbee439aa51c11a2438ad9967ed
  r: "The logging initialization is evidenced by a successful run of `init_logging.py`\
    \ and a correctly\u2011formatted log line, and the `logs/` directory exists. However,\
    \ `logs/preprocess_counts.yaml` only contains placeholder example values and a\
    \ comment stating it is a placeholder, not an actual schema definition; thus the\
    \ required YAML schema is not genuinely provided. The task needs a real schema\
    \ (e.g., key definitions, types) rather than stub data."
  sig: 3667f44f48dc475ede6640448bc52ce1077ce9a95431b94faccd0aa963b0e46c
T004:
  c: false
  h: 40bfec2dcd0a21768afd9363a51703eae5fcff5d0203c050d01f1cfa32a2c0f4
  r: "The provided `code/download.py` defines helper functions but lacks a runnable\
    \ entry point that performs the six required download steps, creates the specified\
    \ CSV files and raster directories, and exits with code\u202F1 when any expected\
    \ file is missing. Consequently the expected output artifacts (`data/raw/occurrence_1970_2000.csv`,\
    \ `data/raw/occurrence_2005_2020.csv`, `data/raw/climate_historical/`, `data/raw/climate_recent/`,\
    \ `data/raw/climate_future/`) are absent. The script therefore does not satisfy\
    \ the task\u2019s functional requirements."
T010:
  c: false
  h: b9467b5219cb4420ec97ac1c45b70ba7557a15714e5524bb42d8e8716661d656
  r: "The `code/download.py` script streams raster downloads and records entries in\
    \ `data/manifest.json`, satisfying the manifest\u2011update requirement. However,\
    \ it never verifies the downloaded file\u2019s SHA\u2011256 against a known value\
    \ (or file size) nor aborts on a mismatch, so the checksum\u2011validation step\
    \ is missing. The next implementer must add post\u2011download checksum comparison\
    \ and error handling."
T011:
  c: false
  h: ba3d9469e459f111efca86f55fd7523fab65fd9254d12df11d8f62a15f00a164
  r: "The required output file `data/raw/occurrence_2005_2020.csv` does not exist,\
    \ and the provided `code/download.py` is truncated and lacks a working dynamic\
    \ pagination loop (offset is never updated). Consequently the task\u2019s core\
    \ requirement\u2014fetching records for 2005\u20112020 and saving them with the\
    \ required metadata columns\u2014is not satisfied."
T015:
  c: false
  h: d408e318bcadc58ab6273f813f47b2b6310fb7666391954fd4e4dc6630ff7a20
  r: "The provided `code/download.py` only contains a GBIF occurrence\u2011fetching\
    \ function and lacks any implementation for downloading the 19 WorldClim historical\
    \ rasters or the CMIP6 SSP2\u20114.5 future rasters, saving them to the required\
    \ directories, validating their presence, or exiting with code\u202F1 on missing\
    \ files. No climate raster files are present in the repository."
