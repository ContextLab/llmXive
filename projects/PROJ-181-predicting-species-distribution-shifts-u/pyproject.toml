[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-species-distribution"
version = "0.1.0"
description = "Predicting species distribution shifts using historical occurrence records and climate data"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn==1.5.0",
    "geopandas==0.14.2",
    "rasterio==1.3.9",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "requests==2.32.3",
    "matplotlib==3.9.0",
    "seaborn==0.13.2",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | venv
    | \.egg
)/
'''

[tool.isort]
profile = "black"
line_length = 100
