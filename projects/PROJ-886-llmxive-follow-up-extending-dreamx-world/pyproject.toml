[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamx-lite-geometric-priors"
version = "0.1.0"
description = "DreamX-Lite: Geometric Priors for 3D Consistency"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "colmap",
    "scipy",
    "pandas",
    "numpy",
    "opencv-python",
    "scikit-learn",
    "ruff",
    "black",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py310"
line-length = 88
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]