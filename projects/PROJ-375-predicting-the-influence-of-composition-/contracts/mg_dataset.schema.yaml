type: object
properties:
  composition:
    type: string
    description: Chemical formula of the metallic glass (e.g., Zr50Cu40Al10)
  cte:
    type: number
    description: Coefficient of Thermal Expansion (1/K)
  weighted_mean_atomic_radius:
    type: number
    description: Weighted mean atomic radius in picometers
  electronegativity_variance:
    type: number
    description: Variance of electronegativity based on atomic fractions
  vec:
    type: number
    description: Valence Electron Concentration
  atomic_size_mismatch:
    type: number
    description: Atomic size mismatch parameter (delta)
  amorphous_state_flag:
    type: integer
    enum: [0, 1]
    description: Flag indicating amorphous state (1) or crystalline (0)
  alloy_family:
    type: string
    enum: ["Zr", "Pd", "Fe", "Other"]
    description: Primary alloying element family
  source:
    type: string
    description: Data source identifier (MP, AFLOW, ZENODO)
required:
  - composition
  - cte
  - weighted_mean_atomic_radius
  - electronegativity_variance
  - vec
  - atomic_size_mismatch
  - amorphous_state_flag
  - alloy_family
  - source
