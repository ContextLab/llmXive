$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Model Output Metadata"
type: object
required:
  - model_type
  - file_path
  - training_timestamp
  - hyperparameters
properties:
  model_type:
    type: string
    description: "Identifier of the model type, e.g., 'linear_regression' or 'random_forest'."
  file_path:
    type: string
    description: "Relative path to the serialized model file (e.g., 'models/random_forest.pkl')."
  training_timestamp:
    type: string
    format: date-time
    description: "ISO-8601 timestamp of when the model was trained."
  hyperparameters:
    type: object
    description: "Dictionary of hyperparameter names and values used for training."
    additionalProperties:
      type:
        - string
        - number
        - boolean
        - "null"
additionalProperties: false
