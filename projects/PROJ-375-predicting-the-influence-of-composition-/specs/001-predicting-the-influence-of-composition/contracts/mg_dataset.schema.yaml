$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Metallic Glass Processed Dataset"
type: object
required:
  - material_id
  - composition
  - cte
  - weighted_mean_atomic_radius
  - electronegativity_variance
  - vec
  - atomic_size_coefficient_of_variation
  - source_method
  - checksum
properties:
  material_id:
    type: string
    description: "Unique Materials Project identifier, e.g., 'mp-12345'."
  composition:
    type: string
    description: "Stoichiometric formula, e.g., 'Zr50Cu40Al10'."
  cte:
    type: number
    description: "Coefficient of thermal expansion (1/K)."
  weighted_mean_atomic_radius:
    type: number
    description: "Weighted mean atomic radius (pm)."
  electronegativity_variance:
    type: number
    description: "Weighted variance of Pauling electronegativity."
  vec:
    type: number
    description: "Valence electron concentration (e⁻/atom)."
  atomic_size_coefficient_of_variation:
    type: number
    description: "Standard deviation of atomic radii divided by the weighted mean radius (σ/μ)."
  source_method:
    type: string
    enum: ["DFT", "Experimental"]
    description: "Method used to obtain the CTE value."
  checksum:
    type: string
    description: "SHA-256 checksum of the raw JSON record."
  vif_score:
    type: number
    description: "Variance Inflation Factor for the descriptor (if computed)."
  thermal_history_flag:
    type: boolean
    description: "True if non-standard thermal-history metadata is present."
  alloy_family:
    type: string
    description: "Sorted, comma-separated list of constituent element symbols; used for GroupKFold."
additionalProperties: false
