$schema: "http://json-schema.org/draft-07/schema#"
title: "MetallicGlassDataset"
description: "Schema for the metallic glass composition and CTE dataset."
type: "object"
properties:
  composition:
    type: "string"
    description: "Chemical formula string (e.g., Zr50Cu40Al10)."
  cte:
    type: "number"
    description: "Coefficient of Thermal Expansion (1/K)."
  atomic_radius_mean:
    type: "number"
    description: "Weighted mean atomic radius."
  electronegativity_var:
    type: "number"
    description: "Variance of electronegativity."
  vec:
    type: "number"
    description: "Valence Electron Concentration."
  size_mismatch:
    type: "number"
    description: "Atomic size mismatch parameter (original)."
  size_mismatch_resid:
    type: "number"
    description: "Orthogonalized atomic size mismatch (residualized against atomic_radius_mean)."
  alloy_family:
    type: "string"
    description: "Alloy family classification (e.g., Zr-based)."
  source:
    type: "string"
    description: "Source of the data (e.g., zenodo, materials_project)."
  is_amorphous:
    type: "boolean"
    description: "Flag indicating if the material is amorphous."
  vif_score:
    type: "number"
    description: "Variance Inflation Factor score for collinearity check (optional)."
  stability_score:
    type: "number"
    description: "Stability score from bootstrapping (optional)."
required:
  - composition
  - cte
  - atomic_radius_mean
  - electronegativity_var
  - vec
  - size_mismatch
  - size_mismatch_resid
  - alloy_family
  - source
  - is_amorphous
additionalProperties: false
