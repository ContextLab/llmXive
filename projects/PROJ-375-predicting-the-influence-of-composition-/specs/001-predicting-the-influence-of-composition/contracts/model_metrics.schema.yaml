$schema: "https://json-schema.org/draft/2020-12/schema"
title: "ModelPerformance Metrics"
type: object
required:
  - model_type
  - r2_test
  - mae_test
  - rmse_test
  - p_value
  - null_result_flag
  - runtime_seconds
  - memory_peak_mb
properties:
  model_type:
    type: string
    description: "One of 'linear_regression', 'random_forest', or 'baseline_linear'."
  r2_test:
    type: number
    description: "Coefficient of determination on the held-out test set."
  mae_test:
    type: number
    description: "Mean Absolute Error (K⁻¹) on the test set."
  rmse_test:
    type: number
    description: "Root Mean Squared Error (K⁻¹) on the test set."
  p_value:
    type:
      - number
      - "null"
    description: "Two-sided permutation-test p-value; null if R² < 0.3."
  null_result_flag:
    type: boolean
    description: "True if the observed R² is below the significance threshold (R² < 0.3)."
  runtime_seconds:
    type: number
    description: "Wall-clock time spent during training and evaluation."
  memory_peak_mb:
    type: number
    description: "Peak memory usage in megabytes."
additionalProperties: false
