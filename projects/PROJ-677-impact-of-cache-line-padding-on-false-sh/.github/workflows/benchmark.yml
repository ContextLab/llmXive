name: Benchmark Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        cd projects/PROJ-677-impact-of-cache-line-padding-on-false-sh/code/analysis
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up C++17 environment
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake

    - name: Run Hardware Detection
      run: |
        cd projects/PROJ-677-impact-of-cache-line-padding-on-false-sh
        python code/analysis/hardware_detect.py

    - name: Build Benchmark
      run: |
        cd projects/PROJ-677-impact-of-cache-line-padding-on-false-sh/code/scripts
        bash build.sh

    - name: Run Benchmarks
      run: |
        cd projects/PROJ-677-impact-of-cache-line-padding-on-false-sh/code/scripts
        bash run_benchmarks.sh

    - name: Validate Raw Data
      run: |
        cd projects/PROJ-677-impact-of-cache-line-padding-on-false-sh
        python code/analysis/validate_raw_data.py

    - name: Run Analysis
      run: |
        cd projects/PROJ-677-impact-of-cache-line-padding-on-false-sh
        python code/analysis/run_analysis.py

    - name: Verify Results
      run: |
        cd projects/PROJ-677-impact-of-cache-line-padding-on-false-sh
        python code/analysis/verify_results.py

    - name: Update Checksums
      run: |
        cd projects/PROJ-677-impact-of-cache-line-padding-on-false-sh
        python code/analysis/update_checksums.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          projects/PROJ-677-impact-of-cache-line-padding-on-false-sh/data/
          projects/PROJ-677-impact-of-cache-line-padding-on-false-sh/state/
          projects/PROJ-677-impact-of-cache-line-padding-on-false-sh/figures/