name: Benchmark Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r projects/PROJ-677-impact-of-cache-line-padding-false-sh/code/analysis/requirements.txt
          pip install -r projects/PROJ-677-impact-of-cache-line-padding-false-sh/code/scripts/requirements.txt || true

      - name: Install C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Set CPU Governor (Performance Mode)
        run: |
          if command -v sudo &> /dev/null; then
            sudo cpupower frequency-set -g performance || true
            echo "Performance mode set (or skipped if not supported)"
          else
            echo "Warning: sudo not available, skipping CPU governor change"
          fi

      - name: Build Benchmark Binaries
        run: |
          cd projects/PROJ-677-impact-of-cache-line-padding-false-sh/code/scripts
          chmod +x build.sh
          ./build.sh

      - name: Run Benchmarks
        run: |
          cd projects/PROJ-677-impact-of-cache-line-padding-false-sh/code/scripts
          chmod +x run_benchmarks.sh
          ./run_benchmarks.sh

      - name: Run Analysis
        run: |
          cd projects/PROJ-677-impact-of-cache-line-padding-false-sh/code/analysis
          python run_analysis.py

      - name: Verify Results
        run: |
          cd projects/PROJ-677-impact-of-cache-line-padding-false-sh/code/analysis
          python verify_results.py

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            projects/PROJ-677-impact-of-cache-line-padding-false-sh/data/
            projects/PROJ-677-impact-of-cache-line-padding-false-sh/state/
            projects/PROJ-677-impact-of-cache-line-padding-false-sh/figures/
          if-no-files-found: warn