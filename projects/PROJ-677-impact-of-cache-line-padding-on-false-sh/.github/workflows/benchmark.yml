name: Benchmark Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scipy matplotlib pydantic pyyaml

      - name: Install C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ cmake

      - name: Configure CPU Governor (Best Effort)
        run: |
          # Attempt to set performance governor; ignore failure in CI if permissions denied
          if command -v cpupower &> /dev/null; then
            sudo cpupower frequency-set -g performance || true
          else
            # Fallback: try direct sysfs if available and writable
            if [ -w /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]; then
              echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor || true
            fi
          fi

      - name: Build Benchmark
        working-directory: projects/PROJ-677-impact-of-cache-line-padding-false-sh
        run: |
          chmod +x code/scripts/build.sh
          code/scripts/build.sh

      - name: Run Benchmarks
        working-directory: projects/PROJ-677-impact-of-cache-line-padding-false-sh
        run: |
          chmod +x code/scripts/run_benchmarks.sh
          code/scripts/run_benchmarks.sh

      - name: Run Analysis
        working-directory: projects/PROJ-677-impact-of-cache-line-padding-false-sh
        run: |
          python code/analysis/run_analysis.py

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            projects/PROJ-677-impact-of-cache-line-padding-false-sh/data/**/*.csv
            projects/PROJ-677-impact-of-cache-line-padding-false-sh/figures/*.png
            projects/PROJ-677-impact-of-cache-line-padding-false-sh/state/artifacts/checksums.json