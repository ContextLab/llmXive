$schema: http://json-schema.org/draft-07/schema#
title: AggregatedResult
description: Schema for aggregated benchmark results across multiple runs.
type: object
properties:
  thread_count:
    type: integer
    description: Number of worker threads
    minimum: 1
    maximum: 8
  configuration:
    type: string
    description: Counter configuration
    enum:
      - packed
      - padded
  mean_throughput_ops_per_sec:
    type: number
    description: Mean operations per second
    minimum: 0
  std_throughput_ops_per_sec:
    type: number
    description: Standard deviation of throughput
    minimum: 0
  n_runs:
    type: integer
    description: Number of runs aggregated
    minimum: 5
  ci_lower_95:
    type: number
    description: 95% CI lower bound
  ci_upper_95:
    type: number
    description: 95% CI upper bound
required:
  - thread_count
  - configuration
  - mean_throughput_ops_per_sec
  - std_throughput_ops_per_sec
  - n_runs
  - ci_lower_95
  - ci_upper_95
additionalProperties: false