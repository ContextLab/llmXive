$schema: http://json-schema.org/draft-07/schema#
title: BenchmarkRun
description: Schema for a single benchmark run result.
type: object
properties:
  thread_count:
    type: integer
    description: Number of worker threads (1, 2, 4, 8)
    minimum: 1
    maximum: 8
  configuration:
    type: string
    description: Counter configuration
    enum:
      - packed
      - padded
  iteration_count:
    type: integer
    description: Number of atomic increments per thread
    minimum: 1
  wall_clock_time_ms:
    type: number
    description: Wall-clock time in milliseconds
    minimum: 0
  run_id:
    type: string
    description: Unique identifier for the run
    minLength: 1
  timestamp:
    type: string
    format: date-time
    description: Execution timestamp
required:
  - thread_count
  - configuration
  - iteration_count
  - wall_clock_time_ms
  - run_id
  - timestamp
additionalProperties: false