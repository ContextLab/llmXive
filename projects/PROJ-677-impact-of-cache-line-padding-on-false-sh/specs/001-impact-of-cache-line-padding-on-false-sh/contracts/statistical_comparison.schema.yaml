$schema: http://json-schema.org/draft-07/schema#
title: StatisticalComparison
description: Schema for statistical comparison between packed and padded configurations.
type: object
properties:
  thread_count:
    type: integer
    description: Thread count for comparison
    minimum: 1
    maximum: 8
  t_statistic:
    type: number
    description: T-statistic from two-sample t-test
  p_value_raw:
    type: number
    description: Raw p-value
    minimum: 0
    maximum: 1
  p_value_fdr:
    type: number
    description: Benjamini-Hochberg FDR-adjusted p-value
    minimum: 0
    maximum: 1
  cohen_d:
    type: number
    description: Effect size (Cohen's d)
  significant_fdr:
    type: boolean
    description: True if p_value_fdr ≤ 0.05
required:
  - thread_count
  - t_statistic
  - p_value_raw
  - p_value_fdr
  - cohen_d
  - significant_fdr
additionalProperties: false