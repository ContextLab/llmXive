$schema: "http://json-schema.org/draft-07/schema#"
title: "StabilityResult"
description: "Schema for the aggregated stability results (SD of coefficients) per tier."
type: "object"
required:
  - "dataset"
  - "tier"
  - "n_subsets"
  - "coefficient_sd"
  - "convergence_check"
properties:
  dataset:
    type: "string"
    description: "Dataset identifier."
  tier:
    type: "integer"
    description: "Sample size tier percentage (10, 25, 50, 75, 90)."
  n_subsets:
    type: "integer"
    description: "Number of subsets generated (must be sufficient to ensure statistical robustness)."
  coefficient_sd:
    type: "object"
    description: "Map of predictor names to their empirical standard deviation."
    additionalProperties:
      type: "number"
  convergence_check:
    type: "object"
    required:
      - "se_of_sd"
      - "ratio"
      - "passed"
    properties:
      se_of_sd:
        type: "number"
        description: "Standard Error of the Standard Deviation."
      ratio:
        type: "number"
        description: "Ratio of SE to SD (must be < 0.07)."
      passed:
        type: "boolean"
        description: "True if ratio < 0.07."
additionalProperties: false