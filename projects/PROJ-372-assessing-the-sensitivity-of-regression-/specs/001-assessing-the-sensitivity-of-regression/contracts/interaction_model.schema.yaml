$schema: "http://json-schema.org/draft-07/schema#"
title: "InteractionModel"
description: "Schema for the meta-analysis regression results (Mixed-Effects)."
type: "object"
required:
  - dataset_id
  - model_type
  - model_formula
  - fixed_effects
  - fixed_effects_p_values
  - random_effects_variance
  - r_squared_marginal
  - r_squared_conditional
properties:
  dataset_id:
    type: "string"
    description: "Unique identifier for the dataset."
  model_type:
    type: "string"
    enum:
      - "MixedEffects"
    description: "Type of model used."
  model_formula:
    type: "string"
    description: "String representation of the regression formula."
  fixed_effects:
    type: "object"
    additionalProperties:
      type: "number"
    description: "Regression coefficients for the fixed effects."
  fixed_effects_p_values:
    type: "object"
    additionalProperties:
      type: "number"
      minimum: 0
      maximum: 1
    description: "P-values for each fixed effect coefficient."
  random_effects_variance:
    type: "number"
    minimum: 0
    description: "Variance of the random intercepts."
  r_squared_marginal:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Marginal R-squared (fixed effects only)."
  r_squared_conditional:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Conditional R-squared (fixed + random effects)."
additionalProperties: false