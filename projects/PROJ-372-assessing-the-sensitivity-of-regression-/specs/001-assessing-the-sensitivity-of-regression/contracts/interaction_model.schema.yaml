$schema: "http://json-schema.org/draft-07/schema#"
title: "InteractionModel"
description: "Schema for the meta-analysis regression results."
type: "object"
required:
  - "model_formula"
  - "dataset"
  - "predictor"
  - "coefficients"
  - "p_values"
properties:
  model_formula:
    type: "string"
    description: "R-style formula string used for the regression."
  dataset:
    type: "string"
    description: "Dataset identifier."
  predictor:
    type: "string"
    description: "Specific predictor variable being analyzed."
  r_squared:
    type: "number"
    description: "R-squared value of the meta-regression."
  coefficients:
    type: "object"
    description: "Regression coefficients."
    properties:
      intercept:
        type: "number"
      condition_number:
        type: "number"
      bp_p:
        type: "number"
      cooks_d:
        type: "number"
      interaction:
        type: "number"
    required:
      - "intercept"
      - "condition_number"
      - "bp_p"
      - "cooks_d"
      - "interaction"
  p_values:
    type: "object"
    description: "P-values for the regression coefficients."
    properties:
      condition_number:
        type: "number"
      bp_p:
        type: "number"
      cooks_d:
        type: "number"
      interaction:
        type: "number"
    required:
      - "condition_number"
      - "bp_p"
      - "cooks_d"
      - "interaction"
  interpretation:
    type: "string"
    description: "Human-readable interpretation of the results (effect sizes, not significance)."
