$schema: "http://json-schema.org/draft-07/schema#"
title: "DatasetProfile"
description: "Schema for the OLS assumption violation profile of a dataset."
type: "object"
required:
  - dataset_id
  - source_url
  - n_rows
  - n_cols
  - condition_number
  - bp_statistic
  - bp_p_value
  - max_cooks_distance
  - severity_heteroscedasticity
  - severity_outliers
  - severity_multicollinearity
properties:
  dataset_id:
    type: "string"
    description: "Unique identifier for the dataset."
  source_url:
    type: "string"
    format: "uri"
    description: "Verified URL of the dataset source."
  n_rows:
    type: "integer"
    minimum: 1
    description: "Number of rows after cleaning."
  n_cols:
    type: "integer"
    minimum: 1
    description: "Number of numerical columns used."
  condition_number:
    type: "number"
    description: "Condition Number of the design matrix."
  bp_statistic:
    type: "number"
    description: "Breusch-Pagan test statistic."
  bp_p_value:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Breusch-Pagan test p-value."
  max_cooks_distance:
    type: "number"
    minimum: 0
    description: "Maximum Cook's Distance in the dataset."
  severity_heteroscedasticity:
    type: "string"
    enum:
      - "Low"
      - "Medium"
      - "High"
    description: "Severity classification for heteroscedasticity."
  severity_outliers:
    type: "string"
    enum:
      - "Low"
      - "Medium"
      - "High"
    description: "Severity classification for outliers."
  severity_multicollinearity:
    type: "string"
    enum:
      - "Low"
      - "Medium"
      - "High"
    description: "Severity classification for multicollinearity."
additionalProperties: false