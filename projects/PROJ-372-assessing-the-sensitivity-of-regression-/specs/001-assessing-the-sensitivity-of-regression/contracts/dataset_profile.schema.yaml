$schema: "http://json-schema.org/draft-07/schema#"
title: "DatasetProfile"
description: "Schema for the OLS assumption violation profile of a dataset (aggregated from subsets)."
type: "object"
required:
  - "dataset_name"
  - "source_url"
  - "n_rows"
  - "n_cols"
  - "timestamp"
properties:
  dataset_name:
    type: "string"
    description: "Identifier of the dataset."
  source_url:
    type: "string"
    description: "Verified URL of the dataset source."
  n_rows:
    type: "integer"
    description: "Number of rows in the full dataset."
  n_cols:
    type: "integer"
    description: "Number of columns in the full dataset."
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of the profile generation."
additionalProperties: false