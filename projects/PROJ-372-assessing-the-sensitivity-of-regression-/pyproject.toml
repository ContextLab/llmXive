[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-sensitivity-study"
version = "0.1.0"
description = "Assessing the sensitivity of regression coefficients to dataset subset selection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
    "datasets>=2.14",
    "pytest>=7.4",
    "linearmodels>=4.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*"]

# Ruff Configuration (Linting)
[tool.ruff]
# Target Python version
target-version = "py39"
# Line length for formatting and linting
line-length = 88
# Exclude directories
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "data",
    "artifacts",
]

[tool.ruff.lint]
# Enable specific rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in dataclasses)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "sklearn",
    "yaml",
    "datasets",
    "pytest",
    "linearmodels",
]
force-sort-within-sections = true

# Black Configuration (Formatting)
[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.tox
  | __pycache__
  | build
  | dist
  | venv
  | .venv
  | data
  | artifacts
)/
'''

# Pytest Configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

# Coverage Configuration
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]