[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-sensitivity-regression"
version = "0.1.0"
description = "Assessing the sensitivity of regression coefficients to dataset subset selection"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
    "datasets>=2.14",
    "pytest>=7.4",
    "matplotlib>=3.7",
    "ruff>=0.1.0",
    "black>=23.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
# Linting rules configured in .ruff.toml, but enabling basic selection here if needed
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "SIM", "TCH", "PL"]
ignore = []
target-version = "py311"
line-length = 88

[tool.setuptools]
packages = ["src", "src.ingestion", "src.resampling", "src.analysis", "src.utils"]