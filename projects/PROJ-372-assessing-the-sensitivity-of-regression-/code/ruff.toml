[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = [
  "E501",  # Line too long (handled by black)
  "B008",  # Do not perform function call in argument (often needed for defaults)
]
# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude a few common directories
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]

# Per-file-ignores
per-file-ignores = { "tests/*" = ["S101"] }

# Assume Python 3.9+
target-version = "py39"

# Isort configuration
[lint.isort]
known-first-party = ["src", "tests"]
force-sort-within-sections = true
