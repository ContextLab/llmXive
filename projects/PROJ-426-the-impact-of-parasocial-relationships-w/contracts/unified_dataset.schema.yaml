$schema: http://json-schema.org/draft-07/schema#
title: Unified Dataset Schema
description: |
  Schema for the matched user data combining loneliness survey scores,
  AI usage metrics, and attachment style proxies.
  Used to validate data integrity before modeling.
type: object
required:
  - user_id
  - loneliness_score
  - usage_frequency
  - session_duration
  - attachment_anxiety_score
  - attachment_avoidance_score
  - age
properties:
  user_id:
    type: string
    description: SHA-256 hashed username for anonymized linkage.
    minLength: 1

  loneliness_score:
    type: number
    description: |
      Standardized loneliness score from the Reddit Loneliness Longitudinal Dataset.
      Higher values indicate greater loneliness.
    minimum: -10.0
    maximum: 10.0

  usage_frequency:
    type: number
    description: |
      Number of AI interaction events (posts/comments) per week.
      Calculated over the survey window.
    minimum: 0

  session_duration:
    type: number
    description: |
      Total duration of AI interaction sessions in hours per week.
      Capped at 24 hours per week for sanity.
    minimum: 0.0
    maximum: 24.0

  attachment_anxiety_score:
    type: number
    description: |
      Normalized score derived from ECAR Lexicon anxiety keywords in baseline posts.
      Higher values indicate higher attachment anxiety.
    minimum: 0.0
    maximum: 1.0

  attachment_avoidance_score:
    type: number
    description: |
      Normalized score derived from ECAR Lexicon avoidance keywords in baseline posts.
      Higher values indicate higher attachment avoidance.
    minimum: 0.0
    maximum: 1.0

  age:
    type: integer
    description: |
      Age of the user at the time of the survey.
      May be null if not reported in the source dataset.
    minimum: 13
    maximum: 120
    nullable: true

additionalProperties: false
