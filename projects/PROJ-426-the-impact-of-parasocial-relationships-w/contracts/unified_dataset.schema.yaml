%YAML 1.2
---
# Unified Dataset Schema
# Defines the structure for the matched user data used in analysis.
# Generated for PROJ-426: The Impact of Parasocial Relationships with AI Companions on Loneliness
# Task: T004

type: object
required:
  - user_id
  - loneliness_score
  - usage_frequency
  - session_duration
  - attachment_anxiety_score
  - attachment_avoidance_score
  - age
additionalProperties: false

properties:
  user_id:
    type: string
    description: "Anonymized SHA-256 hash of the username, used as the unique identifier."
    pattern: "^[a-f0-9]{64}$"

  loneliness_score:
    type: number
    format: float
    description: "Standardized loneliness score from the Reddit Loneliness Longitudinal Dataset."
    minimum: 0.0
    maximum: 100.0
    # Note: Values are typically normalized to a 0-100 scale or z-scored depending on the specific survey wave.
    # The schema expects the final processed float value.

  usage_frequency:
    type: number
    format: float
    description: "Aggregated count of AI interaction events (posts/comments) within the defined time window."
    minimum: 0.0

  session_duration:
    type: number
    format: float
    description: "Total time duration (in hours) between the first and last activity in the 7-day analysis window. Capped at 24h per day logic if applicable, or total hours."
    minimum: 0.0
    maximum: 168.0 # Max possible in a week

  attachment_anxiety_score:
    type: number
    format: float
    description: "Calculated attachment anxiety proxy score derived from the ECAR Lexicon applied to baseline posts."
    minimum: 0.0
    maximum: 1.0
    # Normalized to 0-1 range based on keyword density/weight.

  attachment_avoidance_score:
    type: number
    format: float
    description: "Calculated attachment avoidance proxy score derived from the ECAR Lexicon applied to baseline posts."
    minimum: 0.0
    maximum: 1.0
    # Normalized to 0-1 range based on keyword density/weight.

  age:
    type: integer
    description: "Age of the user at the time of the survey."
    minimum: 18
    maximum: 100
    # Note: If age is missing in source, this field might be null in the raw data, but the schema expects integer for valid records.
    # If nulls are allowed in the final parquet, this type definition would need `type: [integer, 'null']` in a strict JSON schema,
    # but in YAML for Pydantic/Pandas validation, we define the target type.
    # Assuming valid records for analysis require age, or we handle nulls explicitly in code.
    # For this schema definition, we define the expected type for valid analysis rows.
    # If nulls are permitted in the dataset, the validation logic should handle it, but the schema describes the ideal structure.
    # Let's assume nulls are possible for age in the raw match, but the schema defines the column type.
    # However, standard YAML schema for mixed types is tricky. We define the primary type.
    # If the code allows nulls, the validator must be configured to accept nulls for this field.
    # Based on T028 (Subgroup analysis), age is expected to be present for filtering.
    # We will define it as integer, assuming the pipeline filters or imputes, or the schema allows nulls in the specific validator implementation.
    # To be safe for a general schema definition:
    # We will list it as integer. If the data allows null, the validator (T007) must be configured to allow nulls for this specific field.

  # Optional metadata fields (if required by downstream tasks)
  survey_timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of the survey administration."
    required: false

  data_source:
    type: string
    description: "Source identifier for the loneliness data wave."
    enum:
      - "reddit_loneliness_longitudinal"
    required: false

metadata:
  version: "1.0"
  created_by: "T004"
  project: "PROJ-426"
  description: "Schema for the unified dataset containing matched user data from loneliness surveys and AI usage logs."