$schema: http://json-schema.org/draft-07/schema#
title: Unified Dataset Schema
description: >
  Schema for the matched user data combining loneliness survey responses
  and AI interaction metrics. Used for validation and modeling.
type: object
required:
  - user_id
  - loneliness_score
  - usage_frequency
  - session_duration
  - attachment_anxiety_score
  - attachment_avoidance_score
  - age
properties:
  user_id:
    type: string
    description: >
      Cryptographic hash of the original username (SHA-256, lowercase hex).
      Used to anonymize PII while maintaining deterministic linkage.
    pattern: "^[a-f0-9]{64}$"
  
  loneliness_score:
    type: number
    description: >
      Standardized loneliness score from the survey instrument.
      Typically ranges from 0 to 100 or standardized Z-scores.
    minimum: -100.0
    maximum: 200.0
  
  usage_frequency:
    type: number
    description: >
      Count of AI interactions (posts/comments) by the user within the
      defined analysis window (e.g., per week or per survey period).
    minimum: 0
  
  session_duration:
    type: number
    description: >
      Total duration (in seconds) of consecutive activity sessions
      within the analysis window. Calculated as time difference between
      first and last activity in a 7-day window.
    minimum: 0
  
  attachment_anxiety_score:
    type: number
    description: >
      Normalized attachment anxiety proxy score derived from ECAR lexicon
      keyword analysis of baseline posts. Range typically [0.0, 1.0].
    minimum: 0.0
    maximum: 1.0
  
  attachment_avoidance_score:
    type: number
    description: >
      Normalized attachment avoidance proxy score derived from ECAR lexicon
      keyword analysis of baseline posts. Range typically [0.0, 1.0].
    minimum: 0.0
    maximum: 1.0
  
  age:
    type: integer
    description: >
      Self-reported age of the user at the time of the survey.
      May be null if not provided in the source data.
    minimum: 0
    maximum: 120
  
  timestamp:
    type: string
    format: date-time
    description: >
      ISO 8601 timestamp of the survey response or data aggregation point.
      Used for longitudinal ordering.
  
  survey_period:
    type: string
    description: >
      Identifier for the specific longitudinal survey wave/period.
      Used to track changes over time.
  
  missing_attachment_flag:
    type: boolean
    description: >
      Flag indicating if attachment scores are missing (default 0.0 assigned).
      True if no baseline posts were found for the user.
additionalProperties: false