$schema: "http://json-schema.org/draft-07/schema#"
title: "MatchedUsersDataset"
description: "Schema for the unified analysis‑ready dataset containing matched users and longitudinal records."
type: object
properties:
  user_id:
    type: string
    description: "SHA-256 hash of the Reddit username."
    pattern: "^[a-f0-9]{64}$"
  age:
    type: integer
    description: "Self‑reported age."
    minimum: 0
  gender:
    type: string
    description: "Self‑reported gender."
  attachment_anxiety_score:
    type: number
    description: "Normalized frequency of anxiety terms from ECAR Lexicon."
    minimum: 0.0
    maximum: 1.0
  attachment_avoidance_score:
    type: number
    description: "Normalized frequency of avoidance terms from ECAR Lexicon."
    minimum: 0.0
    maximum: 1.0
  records:
    type: array
    description: "List of longitudinal observations for this user."
    items:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: "Date of the survey."
        loneliness_score:
          type: number
          description: "UCLA Loneliness Scale score."
        prev_loneliness_score:
          type: number
          description: "Loneliness score from the previous week (lagged outcome)."
        usage_frequency:
          type: number
          description: "Count of AI interactions in the preceding week."
        session_duration:
          type: number
          description: "Total duration of AI interactions in the preceding week (minutes)."
        attachment_anxiety_score:
          type: number
          description: "Anxiety subscale from ECAR Lexicon (copied from UserProfile)."
        attachment_avoidance_score:
          type: number
          description: "Avoidance subscale from ECAR Lexicon (copied from UserProfile)."
        overall_reddit_activity:
          type: integer
          description: "Total Reddit submissions/comments by the user in the same week."
        baseline_mental_health_score:
          type: number
          description: "Baseline mental‑health metric from the survey (e.g., PHQ‑9)."
        ses_index:
          type: number
          description: "Socio‑economic status index derived from survey items."
      required:
        - timestamp
        - loneliness_score
        - prev_loneliness_score
        - usage_frequency
        - session_duration
        - attachment_anxiety_score
        - attachment_avoidance_score
        - overall_reddit_activity
        - baseline_mental_health_score
        - ses_index
    minItems: 1
required:
  - user_id
  - age
  - gender
  - attachment_anxiety_score
  - attachment_avoidance_score
  - records
additionalProperties: false