$schema: http://json-schema.org/draft-07/schema#
title: "Agentic Abstention: Output Schema for Model Metrics and Simulation Logs"
description: >
  Defines the schema for all output artifacts generated by the meta-critic model training
  and simulation evaluation pipeline. This ensures consistency in metrics reporting,
  simulation logs, and statistical validation results.
type: object
required:
  - metadata
  - model_metrics
  - simulation_logs
  - statistical_validation
properties:
  metadata:
    type: object
    description: "Run metadata for reproducibility and tracking"
    required:
      - run_id
      - timestamp
      - config_snapshot
      - dataset_version
    properties:
      run_id:
        type: string
        description: "Unique identifier for this execution run"
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of the run start"
      config_snapshot:
        type: object
        description: "Snapshot of configuration parameters used (seeds, hyperparameters)"
      dataset_version:
        type: string
        description: "Version or hash of the dataset used for evaluation"

  model_metrics:
    type: object
    description: "Performance metrics of the trained Meta-Critic model"
    required:
      - classification_metrics
      - token_efficiency
      - latency_metrics
    properties:
      classification_metrics:
        type: object
        description: "Standard classification metrics for abstention prediction"
        required:
          - accuracy
          - precision
          - recall
          - f1_score
          - timely_abstention_recall
        properties:
          accuracy:
            type: number
            minimum: 0.0
            maximum: 1.0
          precision:
            type: number
            minimum: 0.0
            maximum: 1.0
          recall:
            type: number
            minimum: 0.0
            maximum: 1.0
          f1_score:
            type: number
            minimum: 0.0
            maximum: 1.0
          timely_abstention_recall:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: "Recall for correctly identifying tasks that should have been abstained"

      token_efficiency:
        type: object
        description: "Token consumption metrics compared to baseline"
        required:
          - avg_tokens_meta_critic
          - avg_tokens_baseline
          - token_reduction_percentage
          - effect_size_cohen_d
        properties:
          avg_tokens_meta_critic:
            type: number
            minimum: 0
            description: "Average tokens used by Meta-Critic guided agent"
          avg_tokens_baseline:
            type: number
            minimum: 0
            description: "Average tokens used by Full-Context baseline agent"
          token_reduction_percentage:
            type: number
            minimum: 0
            description: "Percentage reduction in token usage vs baseline"
          effect_size_cohen_d:
            type: number
            description: "Cohen's d effect size for token consumption difference"

      latency_metrics:
        type: object
        description: "Wall-clock latency measurements"
        required:
          - avg_latency_meta_critic
          - avg_latency_baseline
        properties:
          avg_latency_meta_critic:
            type: number
            minimum: 0
            description: "Average wall-clock time (seconds) per task with Meta-Critic"
          avg_latency_baseline:
            type: number
            minimum: 0
            description: "Average wall-clock time (seconds) per task for baseline"

  simulation_logs:
    type: array
    description: "Detailed logs of individual simulation episodes"
    items:
      type: object
      required:
        - episode_id
        - task_id
        - agent_type
        - total_turns
        - total_tokens
        - abstention_triggered
        - abstention_turn
        - ground_truth_label
        - prediction_label
        - final_outcome
      properties:
        episode_id:
          type: string
        task_id:
          type: string
          description: "Identifier from the original benchmark dataset"
        agent_type:
          type: string
          enum:
            - meta_critic
            - full_context_baseline
        total_turns:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        abstention_triggered:
          type: boolean
          description: "Whether the Meta-Critic triggered an abstention"
        abstention_turn:
          type: integer
          minimum: -1
          description: "Turn number where abstention occurred (-1 if none)"
        ground_truth_label:
          type: integer
          enum:
            - 0
            - 1
          description: "Oracle label: 0=Solvable, 1=Impossible (requires abstention)"
        prediction_label:
          type: integer
          enum:
            - 0
            - 1
          description: "Meta-Critic prediction: 0=Continue, 1=Abstain"
        final_outcome:
          type: string
          enum:
            - success
            - failure
            - abstained_correctly
            - abstained_incorrectly
            - continued_success
            - continued_failure

  statistical_validation:
    type: object
    description: "Results of statistical significance testing"
    required:
      - token_consumption_test
      - survival_analysis
      - threshold_sensitivity
    properties:
      token_consumption_test:
        type: object
        description: "Results of Kolmogorov-Smirnov or Mann-Whitney U test"
        required:
          - test_type
          - statistic
          - p_value
          - null_hypothesis_rejected
        properties:
          test_type:
            type: string
            enum:
              - ks_test
              - mann_whitney_u
          statistic:
            type: number
          p_value:
            type: number
            minimum: 0.0
            maximum: 1.0
          null_hypothesis_rejected:
            type: boolean
            description: "True if p < 0.05"

      survival_analysis:
        type: object
        description: "Survival analysis results for task completion time"
        required:
          - median_survival_time_meta_critic
          - median_survival_time_baseline
          - log_rank_p_value
        properties:
          median_survival_time_meta_critic:
            type: number
          median_survival_time_baseline:
            type: number
          log_rank_p_value:
            type: number

      threshold_sensitivity:
        type: array
        description: "Metrics across different decision thresholds"
        items:
          type: object
          required:
            - threshold
            - false_positive_rate
            - false_negative_rate
            - f1_score
          properties:
            threshold:
              type: number
              minimum: 0.0
              maximum: 1.0
            false_positive_rate:
              type: number
            false_negative_rate:
              type: number
            f1_score:
              type: number