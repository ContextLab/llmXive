# Schema for model metrics and simulation logs
# Used to validate outputs from:
# - code/models/train_meta_critic.py (training metrics)
# - code/simulation/simulation_framework.py (simulation logs)
# - code/analysis/statistical_tests.py (statistical results)
# - code/models/evaluate.py (evaluation metrics)

$schema: http://json-schema.org/draft-07/schema#
title: Output Schema for Meta-Critic Pipeline
type: object
required:
  - metadata
  - metrics
properties:
  metadata:
    type: object
    description: Metadata about the run
    required:
      - run_id
      - timestamp
      - config_hash
      - seed
    properties:
      run_id:
        type: string
        description: Unique identifier for the run
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of the run
      config_hash:
        type: string
        description: SHA256 hash of the configuration used
      seed:
        type: integer
        description: Random seed used for reproducibility
      version:
        type: string
        description: Pipeline version
      task_id:
        type: string
        description: Task ID (e.g., T005)
      user_story:
        type: string
        description: Associated user story (e.g., US2)
  
  metrics:
    type: object
    description: Performance metrics
    properties:
      # Training metrics (from train_meta_critic.py)
      training:
        type: object
        properties:
          accuracy:
            type: number
            minimum: 0
            maximum: 1
          precision:
            type: number
            minimum: 0
            maximum: 1
          recall:
            type: number
            minimum: 0
            maximum: 1
          f1_score:
            type: number
            minimum: 0
            maximum: 1
          auc_roc:
            type: number
            minimum: 0
            maximum: 1
          timeliness_recall:
            type: number
            minimum: 0
            maximum: 1
            description: Recall of timely abstentions
          training_time_seconds:
            type: number
            minimum: 0
          num_samples:
            type: integer
            minimum: 0
          num_features:
            type: integer
            minimum: 0
      
      # Simulation metrics (from simulation_framework.py, evaluate.py)
      simulation:
        type: object
        properties:
          total_turns:
            type: integer
            minimum: 0
          abstention_turns:
            type: integer
            minimum: 0
          total_tokens_used:
            type: integer
            minimum: 0
          avg_tokens_per_turn:
            type: number
            minimum: 0
          abstention_rate:
            type: number
            minimum: 0
            maximum: 1
          success_rate:
            type: number
            minimum: 0
            maximum: 1
          token_reduction_percentage:
            type: number
            description: Percentage reduction vs baseline
          latency_seconds:
            type: number
            minimum: 0
      
      # Baseline comparison metrics (from baseline_comparison.json)
      baseline_comparison:
        type: object
        properties:
          baseline_tokens:
            type: integer
            minimum: 0
          meta_critic_tokens:
            type: integer
            minimum: 0
          token_reduction_absolute:
            type: integer
          token_reduction_percentage:
            type: number
          cohen_d:
            type: number
            description: Effect size
          p_value:
            type: number
            minimum: 0
            maximum: 1
          is_significant:
            type: boolean
      
      # Statistical test results (from statistical_tests.py)
      statistical_tests:
        type: object
        properties:
          mann_whitney_u:
            type: object
            properties:
              statistic:
                type: number
              p_value:
                type: number
              is_significant:
                type: boolean
          kolmogorov_smirnov:
            type: object
            properties:
              statistic:
                type: number
              p_value:
                type: number
              is_significant:
                type: boolean
          survival_analysis:
            type: object
            properties:
              median_survival_time_baseline:
                type: number
              median_survival_time_meta_critic:
                type: number
              logrank_p_value:
                type: number
                minimum: 0
                maximum: 1
          vif_scores:
            type: object
            additionalProperties:
              type: number
            description: Variance Inflation Factor scores for predictors
  
  simulation_logs:
    type: array
    description: Detailed logs from simulation runs
    items:
      type: object
      required:
        - turn_number
        - timestamp
        - state_features
        - action
        - tokens_used
      properties:
        turn_number:
          type: integer
          minimum: 0
        timestamp:
          type: string
          format: date-time
        state_features:
          type: object
          description: Feature vector at this turn
          properties:
            search_count:
              type: integer
            error_frequency:
              type: number
            token_usage:
              type: integer
            turn_number:
              type: integer
            embedding_distance:
              type: number
        action:
          type: string
          enum:
            - continue
            - abstain
            - solve
        tokens_used:
          type: integer
          minimum: 0
        latency_ms:
          type: number
          minimum: 0
        abstention_triggered:
          type: boolean
        confidence_score:
          type: number
          minimum: 0
          maximum: 1
  
  validation:
    type: object
    description: Validation results
    properties:
      schema_compliance:
        type: boolean
      missing_fields:
        type: array
        items:
          type: string
      warnings:
        type: array
        items:
          type: string
      errors:
        type: array
        items:
          type: string

# Additional constraints
additionalProperties: true