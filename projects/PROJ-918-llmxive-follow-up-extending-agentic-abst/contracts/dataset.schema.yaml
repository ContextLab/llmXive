$schema: http://json-schema.org/draft-07/schema#
title: Agentic Abstention Dataset Schema
description: |
  Schema for the processed dataset used to train and evaluate the Meta-Critic model.
  CRITICAL: This schema explicitly EXCLUDES full semantic context text columns to prevent
  the model from trivially solving the task via text matching and to enforce prediction
  based on agent state dynamics (tokens, turns, errors, etc.).
type: object
additionalProperties: false
properties:
  # Primary Key / Identifier
  task_id:
    type: string
    description: Unique identifier for the task instance
    minLength: 1

  # Agent State Features (Numeric/Categorical)
  turn_number:
    type: integer
    description: Current interaction turn number
    minimum: 1

  search_count:
    type: integer
    description: Number of search actions taken in the trajectory
    minimum: 0

  error_frequency:
    type: number
    description: Frequency of errors encountered (errors per turn)
    minimum: 0.0
    maximum: 1.0

  token_usage:
    type: integer
    description: Cumulative token usage up to this state
    minimum: 0

  embedding_distance:
    type: number
    description: |
      Scalar distance between the current query and the retrieved context
      embeddings (computed via sentence-transformers).
    minimum: 0.0

  # Target Variable
  abstention_label:
    type: integer
    description: |
      Ground truth label indicating if the agent SHOULD have abstained at this state.
      1 = Abstain (task is impossible or futile at this state)
      0 = Continue (task is solvable)
    enum: [0, 1]

  # Metadata (Non-semantic)
  dataset_source:
    type: string
    description: Source of the benchmark data (e.g., 'agentic-abstention-benchmark')

  # Explicit Exclusion Rule
  # The following column names are FORBIDDEN in any file conforming to this schema:
  # - context_text
  # - full_context
  # - prompt_text
  # - query_text
  # - semantic_content
  # - raw_trajectory
  #
  # Validation logic must reject any record containing these keys.
required:
  - task_id
  - turn_number
  - search_count
  - error_frequency
  - token_usage
  - embedding_distance
  - abstention_label
  - dataset_source