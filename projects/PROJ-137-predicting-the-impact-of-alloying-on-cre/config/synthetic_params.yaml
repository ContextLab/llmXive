# Parameters for Synthetic Data Generation (T016)
# Used when real data is unavailable or for stress testing

arrhenius:
  activation_energy: 250000 # J/mol
  gas_constant: 8.314
  pre_exponential: 1.0e-10

power_law:
  stress_exponent: 5.0
  shear_modulus: 80000 # MPa

statistical_targets:
  ks_distance_max: 0.05
  mean_mismatch_pct: 0.10
  sd_mismatch_pct: 0.10

generation:
  n_samples: 1000
  noise_level: 0.05
  seed: 42
