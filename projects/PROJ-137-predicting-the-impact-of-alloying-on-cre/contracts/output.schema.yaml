$schema: http://json-schema.org/draft-07/schema#
title: ModelEvaluationReport
description: >
  Schema for the final model evaluation report generated by the pipeline.
  This report contains the comparative performance metrics of the Thermodynamic
  GBR vs. Composition-Only GBR models, statistical test results, and feature
  importance analysis.
type: object
required:
  - metadata
  - dataset_info
  - model_comparison
  - statistical_significance
  - feature_importance
  - physics_consistency
properties:
  metadata:
    type: object
    description: Execution metadata and provenance.
    required:
      - timestamp
      - pipeline_version
      - random_seed
      - python_version
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of report generation.
      pipeline_version:
        type: string
        description: Version tag of the pipeline code (e.g., from git commit).
      random_seed:
        type: integer
        description: Random seed used for the experiment.
      python_version:
        type: string
        description: Python version used for execution.
      config_hash:
        type: string
        description: SHA256 hash of the configuration files used.

  dataset_info:
    type: object
    description: Information about the dataset used for training and evaluation.
    required:
      - source
      - total_samples
      - train_samples
      - test_samples
      - features_used
      - target_name
    properties:
      source:
        type: string
        enum: [NIMS, Synthetic, Hybrid]
        description: Source of the data.
      total_samples:
        type: integer
        minimum: 1
        description: Total number of alloy samples in the dataset.
      train_samples:
        type: integer
        description: Number of samples in the training set (aggregated across CV folds).
      test_samples:
        type: integer
        description: Number of samples in the test set (aggregated across CV folds).
      features_used:
        type: array
        items:
          type: string
        description: List of feature names used in the final model.
      target_name:
        type: string
        description: Name of the target variable (e.g., "rupture_time").
      exclusion_log:
        type: object
        description: Summary of excluded rows during preprocessing.
        properties:
          missing_thermo:
            type: integer
            description: Count of rows excluded due to missing thermodynamic data.
          missing_target:
            type: integer
            description: Count of rows excluded due to missing target values.
          total_excluded:
            type: integer
            description: Total number of excluded rows.

  model_comparison:
    type: object
    description: Comparative performance metrics between the two models.
    required:
      - thermodynamic_model
      - composition_only_model
      - delta_r2
      - delta_rmse
    properties:
      thermodynamic_model:
        type: object
        description: Metrics for the model using composition + thermodynamic descriptors.
        required:
          - r2_mean
          - r2_std
          - rmse_mean
          - rmse_std
        properties:
          r2_mean:
            type: number
            description: Mean R² score from cross-validation.
          r2_std:
            type: number
            description: Standard deviation of R² score.
          rmse_mean:
            type: number
            description: Mean RMSE from cross-validation.
          rmse_std:
            type: number
            description: Standard deviation of RMSE.
          best_params:
            type: object
            description: Best hyperparameters found via GridSearch.

      composition_only_model:
        type: object
        description: Metrics for the model using composition only.
        required:
          - r2_mean
          - r2_std
          - rmse_mean
          - rmse_std
        properties:
          r2_mean:
            type: number
            description: Mean R² score from cross-validation.
          r2_std:
            type: number
            description: Standard deviation of R² score.
          rmse_mean:
            type: number
            description: Mean RMSE from cross-validation.
          rmse_std:
            type: number
            description: Standard deviation of RMSE.
          best_params:
            type: object
            description: Best hyperparameters found via GridSearch.

      delta_r2:
        type: number
        description: Difference in mean R² (Thermodynamic - Composition-Only).
      delta_rmse:
        type: number
        description: Difference in mean RMSE (Thermodynamic - Composition-Only).

  statistical_significance:
    type: object
    description: Results of the statistical significance tests.
    required:
      - test_type
      - p_value
      - confidence_interval
      - conclusion
    properties:
      test_type:
        type: string
        enum: [Permutation_Test, Bootstrap_CI]
        description: Type of statistical test performed based on dataset size.
      p_value:
        type: number
        minimum: 0
        maximum: 1
        description: P-value from the permutation test (if applicable).
      confidence_interval:
        type: object
        description: 95% Confidence Interval for the delta in performance.
        required:
          - lower
          - upper
          - method
        properties:
          lower:
            type: number
            description: Lower bound of the CI.
          upper:
            type: number
            description: Upper bound of the CI.
          method:
            type: string
            description: Method used for CI calculation (e.g., "Percentile", "BCa").
      sensitivity_analysis:
        type: array
        description: Results of sensitivity analysis on cutoffs (if permutation test).
        items:
          type: object
          properties:
            cutoff:
              type: number
            p_value:
              type: number
      conclusion:
        type: string
        description: Human-readable conclusion (e.g., "Significant improvement", "No significant difference").

  feature_importance:
    type: object
    description: SHAP-based feature importance analysis.
    required:
      - top_features
      - direction
    properties:
      top_features:
        type: array
        description: List of top 5 most important features.
        items:
          type: object
          required:
            - name
            - mean_abs_shap
          properties:
            name:
              type: string
              description: Feature name.
            mean_abs_shap:
              type: number
              description: Mean absolute SHAP value.
            shap_range:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
              description: [min_shap, max_shap] observed range.
      direction:
        type: object
        description: Direction of influence for top features.
        additionalProperties:
          type: string
          enum: [positive, negative, mixed]
          description: Correlation direction with the target.

  physics_consistency:
    type: object
    description: Validation of physics consistency checks (if synthetic data was used).
    properties:
      passed:
        type: boolean
        description: Whether the physics consistency check passed.
      ks_distance:
        type: number
        description: Kolmogorov-Smirnov distance for distribution matching.
      mean_error_pct:
        type: number
        description: Percentage error in mean target value.
      std_error_pct:
        type: number
        description: Percentage error in standard deviation of target value.