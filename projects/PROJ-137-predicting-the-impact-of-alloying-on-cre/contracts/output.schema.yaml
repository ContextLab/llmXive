$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Evaluation Report Schema"
description: >
  Schema for the JSON/YAML report generated by the model evaluation pipeline
  (src/models/main_eval.py). This schema validates the statistical comparison
  between the Thermodynamic GBR and Composition-Only GBR models.
type: object
required:
  - metadata
  - dataset_info
  - model_comparison
  - statistical_test
  - feature_importance
properties:
  metadata:
    type: object
    description: "Run metadata and configuration"
    required:
      - timestamp
      - pipeline_version
      - seed
    properties:
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of report generation"
      pipeline_version:
        type: string
        description: "Git commit hash or version tag"
      seed:
        type: integer
        description: "Random seed used for reproducibility"
      config_file:
        type: string
        description: "Path to the configuration file used"

  dataset_info:
    type: object
    description: "Information about the dataset used for training and evaluation"
    required:
      - source
      - n_samples
      - n_features_thermo
      - n_features_comp_only
      - feature_names
    properties:
      source:
        type: string
        description: "Source of the data (e.g., 'synthetic', 'NIMS', 'Materials Project')"
      n_samples:
        type: integer
        minimum: 1
        description: "Total number of samples used in the final intersection"
      n_features_thermo:
        type: integer
        minimum: 1
        description: "Number of features for the Thermodynamic model"
      n_features_comp_only:
        type: integer
        minimum: 1
        description: "Number of features for the Composition-Only model"
      feature_names:
        type: array
        items:
          type: string
        description: "List of feature names used in the models"
      split_info:
        type: object
        description: "Details about the data splitting strategy"
        required:
          - outer_folds
          - inner_folds
          - stratification
        properties:
          outer_folds:
            type: integer
            description: "Number of outer CV folds"
          inner_folds:
            type: integer
            description: "Number of inner CV folds for hyperparameter tuning"
          stratification:
            type: boolean
            description: "Whether stratification was applied (based on temperature ranges)"

  model_comparison:
    type: object
    description: "Performance comparison between the two models"
    required:
      - thermodynamic_gbr
      - composition_only_gbr
      - delta_r2
      - delta_rmse
    properties:
      thermodynamic_gbr:
        type: object
        required:
          - mean_r2
          - std_r2
          - mean_rmse
          - std_rmse
          - best_params
        properties:
          mean_r2:
            type: number
            description: "Mean R² score from outer CV"
          std_r2:
            type: number
            description: "Standard deviation of R² score"
          mean_rmse:
            type: number
            description: "Mean RMSE from outer CV"
          std_rmse:
            type: number
            description: "Standard deviation of RMSE"
          best_params:
            type: object
            description: "Best hyperparameters found in inner CV"

      composition_only_gbr:
        type: object
        required:
          - mean_r2
          - std_r2
          - mean_rmse
          - std_rmse
          - best_params
        properties:
          mean_r2:
            type: number
            description: "Mean R² score from outer CV"
          std_r2:
            type: number
            description: "Standard deviation of R² score"
          mean_rmse:
            type: number
            description: "Mean RMSE from outer CV"
          std_rmse:
            type: number
            description: "Standard deviation of RMSE"
          best_params:
            type: object
            description: "Best hyperparameters found in inner CV"

      delta_r2:
        type: number
        description: "Difference in mean R² (Thermodynamic - Composition Only)"
      delta_rmse:
        type: number
        description: "Difference in mean RMSE (Thermodynamic - Composition Only)"

  statistical_test:
    type: object
    description: "Results of the statistical significance test"
    required:
      - test_type
      - p_value
      - significant_at_005
      - confidence_interval
    properties:
      test_type:
        type: string
        enum:
          - permutation_test
          - bootstrap_ci
        description: "Type of statistical test performed based on sample size"
      n_permutations:
        type: integer
        description: "Number of permutations used (if permutation test)"
      p_value:
        type: number
        minimum: 0
        maximum: 1
        description: "Two-sided p-value from the statistical test"
      significant_at_005:
        type: boolean
        description: "Whether the result is significant at alpha=0.05"
      confidence_interval:
        type: object
        description: "95% Confidence Interval for the difference in performance"
        required:
          - lower
          - upper
          - method
        properties:
          lower:
            type: number
          upper:
            type: number
          method:
            type: string
            description: "Method used for CI (e.g., 'percentile', 'bc')"
      sensitivity_analysis:
        type: object
        description: "Sensitivity analysis results for different cutoffs"
        properties:
          cutoffs_tested:
            type: array
            items:
              type: number
            description: "List of cutoffs tested"
          p_values:
            type: array
            items:
              type: number
            description: "Corresponding p-values for each cutoff"

  feature_importance:
    type: object
    description: "SHAP-based feature importance analysis"
    required:
      - method
      - top_features
    properties:
      method:
        type: string
        description: "Method used (e.g., 'TreeExplainer')"
      top_features:
        type: array
        items:
          type: object
          required:
            - name
            - mean_abs_shap
            - direction
          properties:
            name:
              type: string
              description: "Feature name"
            mean_abs_shap:
              type: number
              description: "Mean absolute SHAP value"
            direction:
              type: string
              enum:
                - positive
                - negative
                - mixed
              description: "Overall direction of influence"
        description: "List of top 5-10 most important features"

  artifacts:
    type: object
    description: "Paths to generated artifacts"
    properties:
      report_path:
        type: string
        description: "Path to this report file"
      shap_plot_path:
        type: string
        description: "Path to the SHAP summary plot (PNG)"
      model_paths:
        type: object
        description: "Paths to saved model pickles"
        properties:
          thermodynamic_gbr:
            type: string
          composition_only_gbr:
            type: string