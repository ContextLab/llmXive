$schema: http://json-schema.org/draft-07/schema#
title: Model Evaluation Report Schema
description: |
  JSON Schema for validating the model evaluation report generated by
  src/models/main_eval.py and src/reports/generate_report.py.
  This schema ensures consistency in statistical test results, model metrics,
  and SHAP feature importance outputs.
type: object
required:
  - metadata
  - dataset_info
  - model_comparison
  - statistical_significance
  - feature_importance
  - runtime_info
properties:
  metadata:
    type: object
    description: Run metadata and configuration
    required:
      - timestamp
      - random_seed
      - pipeline_version
      - data_source
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of the report generation
      random_seed:
        type: integer
        description: Random seed used for reproducibility
      pipeline_version:
        type: string
        description: Version identifier of the pipeline
      data_source:
        type: string
        enum: [nims, synthetic, hybrid]
        description: Source of the dataset used
      config_file:
        type: string
        description: Path to the configuration file used

  dataset_info:
    type: object
    description: Information about the dataset used for training and evaluation
    required:
      - total_rows
      - valid_rows
      - excluded_rows
      - feature_count
      - target_name
    properties:
      total_rows:
        type: integer
        minimum: 0
        description: Total number of rows in the raw dataset
      valid_rows:
        type: integer
        minimum: 0
        description: Number of rows after preprocessing and exclusion
      excluded_rows:
        type: integer
        minimum: 0
        description: Number of rows excluded due to missing data
      exclusion_reasons:
        type: object
        description: Breakdown of exclusion reasons
        properties:
          missing_thermodynamic:
            type: integer
          missing_creep_data:
            type: integer
          other:
            type: integer
      feature_count:
        type: integer
        minimum: 1
        description: Number of features used in the final model
      target_name:
        type: string
        enum: [rupture_time, log_rupture_time]
        description: Name of the target variable

  model_comparison:
    type: object
    description: Comparison metrics between Thermodynamic and Composition-Only models
    required:
      - thermodynamic_model
      - composition_only_model
      - r2_delta
      - rmse_delta
    properties:
      thermodynamic_model:
        type: object
        description: Performance metrics for the Thermodynamic GBR model
        required:
          - r2_mean
          - r2_std
          - rmse_mean
          - rmse_std
          - best_params
        properties:
          r2_mean:
            type: number
            description: Mean R² score from nested cross-validation
          r2_std:
            type: number
            description: Standard deviation of R² scores
          rmse_mean:
            type: number
            description: Mean RMSE score from nested cross-validation
          rmse_std:
            type: number
            description: Standard deviation of RMSE scores
          best_params:
            type: object
            description: Best hyperparameters found during grid search
            additionalProperties: true

      composition_only_model:
        type: object
        description: Performance metrics for the Composition-Only GBR model
        required:
          - r2_mean
          - r2_std
          - rmse_mean
          - rmse_std
          - best_params
        properties:
          r2_mean:
            type: number
            description: Mean R² score from nested cross-validation
          r2_std:
            type: number
            description: Standard deviation of R² scores
          rmse_mean:
            type: number
            description: Mean RMSE score from nested cross-validation
          rmse_std:
            type: number
            description: Standard deviation of RMSE scores
          best_params:
            type: object
            description: Best hyperparameters found during grid search
            additionalProperties: true

      r2_delta:
        type: number
        description: Difference in mean R² (Thermodynamic - Composition-Only)
      rmse_delta:
        type: number
        description: Difference in mean RMSE (Thermodynamic - Composition-Only)

  statistical_significance:
    type: object
    description: Results of statistical significance testing
    required:
      - test_method
      - p_value
      - confidence_interval
      - significance_level
      - conclusion
    properties:
      test_method:
        type: string
        enum: [permutation_test, bootstrap_ci]
        description: Method used for statistical testing
      test_details:
        type: object
        description: Specific details of the test performed
        properties:
          n_permutations:
            type: integer
            description: Number of permutations (if permutation test)
          n_bootstrap:
            type: integer
            description: Number of bootstrap samples (if bootstrap)
          stratification:
            type: string
            description: Stratification method used
          sample_size:
            type: integer
            description: Number of samples used in the test
      p_value:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: P-value from the statistical test
      confidence_interval:
        type: object
        description: 95% Confidence Interval for the performance difference
        required:
          - lower_bound
          - upper_bound
          - level
        properties:
          lower_bound:
            type: number
          upper_bound:
            type: number
          level:
            type: number
            enum: [0.95]
      significance_level:
        type: number
        default: 0.05
        description: Alpha level used for significance testing
      conclusion:
        type: string
        enum: [significant, not_significant, inconclusive]
        description: Conclusion of the statistical test

  feature_importance:
    type: object
    description: SHAP-based feature importance analysis
    required:
      - method
      - top_features
      - summary_plot_path
    properties:
      method:
        type: string
        enum: [shap_tree_explainer]
        description: Method used for feature importance
      top_features:
        type: array
        description: Top 10 features by mean absolute SHAP value
        items:
          type: object
          required:
            - feature_name
            - mean_abs_shap
            - direction
          properties:
            feature_name:
              type: string
            mean_abs_shap:
              type: number
            direction:
              type: string
              enum: [positive, negative, mixed]
              description: Direction of influence on the target
            shap_std:
              type: number
              description: Standard deviation of SHAP values
      summary_plot_path:
        type: string
        description: Relative path to the saved SHAP summary plot (PNG)

  runtime_info:
    type: object
    description: Execution time and resource usage
    required:
      - total_duration_seconds
      - training_duration_seconds
      - evaluation_duration_seconds
    properties:
      total_duration_seconds:
        type: number
        description: Total pipeline execution time in seconds
      training_duration_seconds:
        type: number
        description: Time spent on model training and CV
      evaluation_duration_seconds:
        type: number
        description: Time spent on statistical testing and SHAP analysis
      memory_peak_mb:
        type: number
        description: Peak memory usage in MB (if available)