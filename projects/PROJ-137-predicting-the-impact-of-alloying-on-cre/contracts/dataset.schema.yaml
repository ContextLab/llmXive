required_columns:
  - alloy_id
  - composition_str
  - temperature
  - stress
  - rupture_time
  - mixing_enthalpy
  - radius_mismatch

column_types:
  alloy_id: string
  composition_str: string
  temperature: numeric
  stress: numeric
  rupture_time: numeric
  mixing_enthalpy: numeric
  radius_mismatch: numeric

constraints:
  temperature:
    min: 0
  stress:
    min: 0
  rupture_time:
    min: 0