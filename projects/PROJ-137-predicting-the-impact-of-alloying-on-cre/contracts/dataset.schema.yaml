$schema: http://json-schema.org/draft-07/schema#
title: Alloy Creep Dataset Schema
description: |
  Schema for the processed alloy creep dataset.
  Validates the output of the data preprocessing pipeline (T015-T019).
  Ensures consistency for downstream modeling tasks.
type: object
required:
  - alloy_id
  - composition_str
  - temperature
  - stress
  - rupture_time
  - mixing_enthalpy
  - radius_mismatch
properties:
  alloy_id:
    type: string
    description: Unique identifier for the alloy sample.
    pattern: "^ALY-[0-9]{4,}$"
  composition_str:
    type: string
    description: |
      Comma-separated string of elements and their atomic fractions.
      Format: "Element1:frac1,Element2:frac2" (e.g., "Cr:0.15,Ni:0.85").
      Elements must be sorted alphabetically.
      Fractions must be between 0 and 1 and sum to ~1.0.
    minLength: 1
  temperature:
    type: number
    description: Temperature in Kelvin.
    minimum: 0
    exclusiveMinimum: true
  stress:
    type: number
    description: Applied stress in MPa.
    minimum: 0
    exclusiveMinimum: true
  rupture_time:
    type: number
    description: Time to rupture in hours.
    minimum: 0
    exclusiveMinimum: true
  mixing_enthalpy:
    type: number
    description: Mixing enthalpy in kJ/mol.
    # No strict bounds as values can vary widely by alloy system
  radius_mismatch:
    type: number
    description: Atomic radius mismatch in percent.
    minimum: 0
additionalProperties: false
examples:
  - alloy_id: "ALY-1001"
    composition_str: "Al:0.1,Cr:0.2,Ni:0.7"
    temperature: 1000.0
    stress: 150.0
    rupture_time: 5000.0
    mixing_enthalpy: -12.5
    radius_mismatch: 4.2