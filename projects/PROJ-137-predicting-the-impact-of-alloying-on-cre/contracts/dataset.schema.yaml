# Schema for the processed creep dataset
# Used for validation in src/utils/validators.py

type: object
properties:
  alloy_id:
    type: string
    description: Unique identifier for the alloy
  composition_str:
    type: string
    description: Normalized composition string (e.g., "Ni:0.8,Cr:0.2")
  temperature:
    type: number
    minimum: 0
    description: Temperature in Kelvin
  stress:
    type: number
    minimum: 0
    description: Applied stress in MPa
  rupture_time:
    type: number
    minimum: 0
    description: Time to rupture in hours
  mixing_enthalpy:
    type: number
    description: Mixing enthalpy from Materials Project (kJ/mol)
  radius_mismatch:
    type: number
    description: Atomic radius mismatch (%)
  atomic_fraction_ni:
    type: number
    minimum: 0
    maximum: 1
    description: Atomic fraction of Nickel (example element)
  atomic_fraction_cr:
    type: number
    minimum: 0
    maximum: 1
    description: Atomic fraction of Chromium (example element)
  # Additional elements can be added as needed

required:
  - alloy_id
  - composition_str
  - temperature
  - stress
  - rupture_time
  - mixing_enthalpy
  - radius_mismatch
