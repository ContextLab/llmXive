name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with ruff
      run: |
        # Assuming ruff is installed from requirements.txt
        # If not, uncomment the line below to install it specifically
        # pip install ruff
        ruff check .

    - name: Format check with black
      run: |
        # Assuming black is installed from requirements.txt
        # If not, uncomment the line below to install it specifically
        # pip install black
        black --check .

    - name: Test with pytest
      run: |
        pytest -v --tb=short

    - name: Run integration pipeline (CPU only)
      run: |
        # Ensure no GPU usage is forced
        export CUDA_VISIBLE_DEVICES=""
        python tests/integration/test_runtime.py
      env:
        # Explicitly disable any potential GPU acceleration flags if present
        PYTORCH_CUDA_ALLOC_CONF: ""
        TF_FORCE_GPU_ALLOW_GROWTH: "false"