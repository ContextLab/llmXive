name: CI - CPU Only

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check .

    - name: Format check with black
      run: |
        pip install black
        black --check .

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Run data pipeline (dry run / synthetic check)
      run: |
        # Ensure the pipeline can run without hanging on external APIs
        # Uses synthetic data path if real data fetch fails (as per design)
        python src/data/pipeline.py --mode synthetic || true

    - name: Run model training (small subset check)
      run: |
        # Quick sanity check of training pipeline
        python src/models/main_eval.py --quick-check || true
