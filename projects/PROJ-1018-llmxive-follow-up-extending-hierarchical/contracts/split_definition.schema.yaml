$schema: "http://json-schema.org/draft-07/schema#"
title: SplitDefinition
type: object
additionalProperties: false
required:
  - validation_ids
  - test_ids
  - checksum
properties:
  validation_ids:
    type: array
    items:
      type: string
  test_ids:
    type: array
    items:
      type: string
  checksum:
    type: string
description: |
  JSON schema for the split definition file produced by the PG‑19
  streaming loader. It contains deterministic validation and test
  document ID lists together with a SHA‑256 checksum of all IDs.