  r: "The provided `src/extraction.py` never writes per\u2011document raw score tensors\
    \ to `data/interim/raw_scores/` and its `DynamicHiLSWrapper` does not actually\
    \ load a HiLS checkpoint or enforce CUDA\u2011only execution. `src/aggregation.py`\
    \ expects `.pt` files that do not exist, and its output JSON lacks the required\
    \ `checksum` field. Moreover, `tests/test_extraction.py` fails during import because\
    \ the `datasets` dependency cannot be loaded (pyarrow version mismatch), so the\
    \ end\u2011to\u2011end extraction test never runs. The essential artifacts and\
    \ behaviors required by the task are missing."
