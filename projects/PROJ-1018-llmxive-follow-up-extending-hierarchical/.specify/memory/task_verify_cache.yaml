  r: The `src/config.py` and `src/data_loader.py` files exist and mostly meet the
    spec, but the required output file `data/interim/filtered_pg19.json` is missing,
    and there is no evidence that it was written, validated against `contracts/split_definition.schema.yaml`,
    or that exclusion logging was performed as required. The task therefore remains
    incomplete.
