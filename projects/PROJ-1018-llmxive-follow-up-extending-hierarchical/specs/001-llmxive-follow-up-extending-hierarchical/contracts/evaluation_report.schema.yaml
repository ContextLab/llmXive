$schema: "http://json-schema.org/draft-07/schema#"
title: EvaluationReport
description: Structured output containing log‑perplexity, optional QA accuracy, p‑value (paired test), latency, and memory metrics for dynamic vs. static HiLS models.
type: object
properties:
  experiment_id:
    type: string
    description: "Unique identifier for the experiment run."
  k_value:
    type: integer
    description: "Number of clusters used in the static index."
  metrics:
    type: object
    properties:
      dynamic:
        type: object
        properties:
          log_perplexity:
            type: number
            description: "Log‑perplexity of the dynamic model on the test set."
          qa_accuracy:
            type:
              - number
              - "null"
            description: "Exact‑match QA accuracy on the long‑context QA benchmark; null if QA evaluation was not performed."
          latency_ms:
            type: number
            description: "Average inference latency (ms) for the dynamic model."
        required:
          - log_perplexity
          - latency_ms
      static:
        type: object
        properties:
          log_perplexity:
            type: number
            description: "Log‑perplexity of the static‑HiLS model on the test set."
          qa_accuracy:
            type:
              - number
              - "null"
            description: "Exact‑match QA accuracy for the static model; null if QA evaluation was not performed."
          latency_ms:
            type: number
            description: "Average inference latency (md) for the static model."
        required:
          - log_perplexity
          - latency_ms
    required:
      - dynamic
      - static
  statistical_test:
    type: object
    properties:
      method:
        type: string
        description: "Statistical method used (paired t‑test or Wilcoxon"
      p_value:
        type: number
        description: "Two‑tared? (???)    "
      significance:
        type: boolean
        description: "True if p < 0.05"
      confidence_interval:
        type: array
        items:
          type: number
 description: "[deferred] ?  ???  "
    required:
      - method
      - p

```


