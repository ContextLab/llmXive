$schema: "http://json-schema.org/draft-07/schema#"
title: StaticIndex
description: Static lookup table containing cluster centroids and chunk‑to‑cluster mappings.
type: object
properties:
  k:
    type: integer
    description: "Number of clusters (K)."
  centroids:
    type: array
    items:
      type: array
      items:
        type: number
    description: "Centroid vectors in PCA space."
  chunk_to_cluster_map:
    type: object
    additionalProperties:
      type: integer
    description: "Mapping from chunk identifier (document_id:chunk_id) to cluster ID."
  validation_checksum:
    type: string
    description: "SHA‑256 checksum of the validation relevance‑profile file used for clustering."
  created_at:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp of index creation."
  seed:
    type: integer
    description: "Random seed used for K‑Means initialization."
  pca_components:
    type: integer
    description: "Number of PCA components retained before clustering."
  distance_metric:
    type: string
    description: "Distance metric employed by K‑Means (e.g., 'cosine')."
required:
  - k
  - centroids
  - chunk_to_cluster_map
  - validation_checksum
  - created_at
  - seed
  - pca_components
  - distance_metric
additionalProperties: false