[metadata]
name = agriculture-optimization
version = 0.1.0

[options]
packages = find:
python_requires = >=3.9
install_requires =
    pandas>=2.0.0
    numpy>=1.24.0
    pydantic>=2.0.0
    pyyaml>=6.0
    requests>=2.31.0
    statsmodels>=0.14.0
    scikit-learn>=1.3.0
    geopandas>=0.13.0
    rasterio>=1.3.0
    shapely>=2.0.0
    matplotlib>=3.7.0
    reportlab>=4.0.0

[options.extras_require]
dev =
    black>=23.0.0
    flake8>=6.0.0
    isort>=5.12.0
    pytest>=7.0.0
    pytest-cov>=4.0.0
    mypy>=1.0.0

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,build,dist,.venv,env,.eggs,*.egg-info
per-file-ignores = __init__.py:F401
