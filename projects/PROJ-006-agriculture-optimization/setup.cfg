[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    .venv,
    build,
    dist,
    .eggs,
    *.egg-info,
    data/,
    state/

[isort]
profile = black
line_length = 88
known_first_party = src,tests,scripts
skip = .git,.venv,build,dist

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True

[coverage:run]
source = src
branch = True

[coverage:report]
show_missing = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

[metadata]
name = llmxive-agriculture-optimization
version = 0.1.0
