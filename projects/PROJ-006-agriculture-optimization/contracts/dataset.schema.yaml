# Dataset Schema Contract for Climate-Smart Agriculture Analysis
# Project: PROJ-006-agriculture-optimization
# Task: T007
# Description: Defines the expected columns and data types for the analysis-ready dataset
#              produced by the ingestion and feature engineering pipeline.
#
# This schema is validated by:
#   1. src/cli/validate.py (runtime validation)
#   2. tests/contract/test_dataset_schema.py (contract tests)
#   3. src/config/schemas.py (Pydantic model: AnalysisDatasetRecord)
#
# Source Data Provenance:
#   - Household Survey Data: World Bank LSMS-ISA (Malawi, Tanzania, etc.)
#   - Remote Sensing Data: Copernicus Sentinel-2 L2A (S2MSI2A)
#   - Derived Features: Calculated via src/data/processing/feature_engineering.py

version: "1.0.0"
last_updated: "2026-04-30"
validation_mode: strict  # Fail on missing columns or type mismatches

required_columns:
  # Unique Identifier
  - name: household_id
    type: string
    description: Unique identifier for the household
    nullable: false
    constraints:
      - not_empty
      - pattern: "^HH[0-9]{6}$"  # Example: HH000123

  # Geographic Identifiers
  - name: village_id
    type: string
    description: Aggregated village identifier for clustering robust standard errors
    nullable: false
    constraints:
      - not_empty

  - name: country
    type: string
    description: Country code (ISO 3166-1 alpha-3)
    nullable: false
    allowed_values:
      - MWI
      - TZA
      - UGA
      - ETH

  - name: latitude
    type: float
    description: Household latitude (WGS84)
    nullable: false
    constraints:
      - min: -90.0
      - max: 90.0

  - name: longitude
    type: float
    description: Household longitude (WGS84)
    nullable: false
    constraints:
      - min: -180.0
      - max: 180.0

  # Primary Outcome Variables
  - name: CSA_Index
    type: float
    description: Composite index of Climate-Smart Agriculture practice adoption
                 (Sum of binary practice indicators, normalized 0-1)
    nullable: false
    constraints:
      - min: 0.0
      - max: 1.0

  - name: Stability_Score
    type: float
    description: Yield stability score (1 / Coefficient of Variation of NDVI time-series)
    nullable: false
    constraints:
      - min: 0.0
      - max: 10.0  # Heuristic upper bound

  - name: HFIAS
    type: float
    description: Household Food Insecurity Access Scale (0-27, higher = more insecure)
    nullable: false
    constraints:
      - min: 0.0
      - max: 27.0

  # Financial Access Controls
  - name: finance_access
    type: integer
    description: Binary indicator for access to formal financial services (0=No, 1=Yes)
    nullable: false
    allowed_values:
      - 0
      - 1

  - name: credit_history
    type: integer
    description: Binary indicator for past credit usage (0=No, 1=Yes)
    nullable: true

  # Socio-Economic Controls
  - name: land_size_ha
    type: float
    description: Total land size in hectares
    nullable: false
    constraints:
      - min: 0.0

  - name: education_years
    type: float
    description: Highest education level of household head in years
    nullable: true

  - name: household_size
    type: integer
    description: Number of household members
    nullable: false
    constraints:
      - min: 1

  # Agricultural Practice Indicators (Binary)
  - name: practice_conservation_tillage
    type: integer
    description: Binary indicator for conservation tillage adoption (0/1)
    nullable: true

  - name: practice_agroforestry
    type: integer
    description: Binary indicator for agroforestry adoption (0/1)
    nullable: true

  - name: practice_drought_resistant_varieties
    type: integer
    description: Binary indicator for drought-resistant seed adoption (0/1)
    nullable: true

  - name: practice_irrigation
    type: integer
    description: Binary indicator for irrigation use (0/1)
    nullable: true

  # Remote Sensing Features
  - name: ndvi_mean
    type: float
    description: Mean NDVI value over the growing season
    nullable: false
    constraints:
      - min: -1.0
      - max: 1.0

  - name: ndvi_cv
    type: float
    description: Coefficient of Variation of NDVI (used to derive Stability_Score)
    nullable: false
    constraints:
      - min: 0.0

  - name: cloud_cover_fraction
    type: float
    description: Average cloud cover fraction for the satellite pixels used
    nullable: false
    constraints:
      - min: 0.0
      - max: 1.0

  # Metadata
  - name: survey_year
    type: integer
    description: Year of the survey data collection
    nullable: false
    constraints:
      - min: 2010
      - max: 2026

  - name: data_source
    type: string
    description: Source of the record (e.g., "LSMS-ISA", "Synthetic")
    nullable: false

optional_columns:
  - name: extension_visits
    type: integer
    description: Number of extension worker visits in the last year

  - name: fertilizer_cost_usd
    type: float
    description: Total expenditure on fertilizer in USD

  - name: yield_tons_per_ha
    type: float
    description: Reported crop yield (if available)

validation_rules:
  # Cross-field validation rules
  - rule: "CSA_Index must be non-negative"
    condition: "CSA_Index >= 0.0"
    severity: error

  - rule: "Stability_Score must be positive"
    condition: "Stability_Score > 0.0"
    severity: error

  - rule: "HFIAS must be within valid range"
    condition: "0 <= HFIAS <= 27"
    severity: error

  - rule: "land_size must be positive"
    condition: "land_size_ha > 0"
    severity: error

notes:
  - "This schema enforces strict types to ensure compatibility with statsmodels clustering."
  - "Null values in optional columns are permitted, but required columns must be populated."
  - "The 'village_id' field is critical for T025 (Cluster-Robust Standard Errors)."