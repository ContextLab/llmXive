$schema: http://json-schema.org/draft-07/schema#
title: Analysis Dataset Schema
description: >
  Schema defining the expected structure of the analysis-ready dataset
  produced by the ingestion and feature engineering pipeline (US1).
  This schema is used for validation of `data/processed/analysis_dataset.csv`.
type: object
required:
  - household_id
  - CSA_Index
  - Stability_Score
  - HFIAS
  - village_id
  - country
  - latitude
  - longitude
  - land_size
  - education
  - finance_access
  - survey_year
properties:
  household_id:
    type: string
    description: Unique identifier for the household
    minLength: 1
  village_id:
    type: string
    description: Unique identifier for the village (used for clustering)
    minLength: 1
  country:
    type: string
    enum:
      - Malawi
      - Tanzania
    description: Country of origin
  latitude:
    type: number
    description: Latitude coordinate
    minimum: -90
    maximum: 90
  longitude:
    type: number
    description: Longitude coordinate
    minimum: -180
    maximum: 180
  survey_year:
    type: integer
    description: Year of the survey
    minimum: 2000
  land_size:
    type: number
    description: Land size in hectares
    minimum: 0
  education:
    type: number
    description: Years of education of the household head
    minimum: 0
  finance_access:
    type: boolean
    description: Binary indicator for financial access
  CSA_Index:
    type: number
    description: Composite Climate-Smart Agriculture Index (sum of practice indicators)
    minimum: 0
  Stability_Score:
    type: number
    description: Yield stability score (1 / CV of NDVI time-series)
    minimum: 0
  HFIAS:
    type: number
    description: Household Food Insecurity Access Scale
    minimum: 0
    maximum: 36
  practice_drought_resistant:
    type: boolean
    description: Binary indicator for adoption of drought-resistant crops
  practice_conservation_tillage:
    type: boolean
    description: Binary indicator for conservation tillage adoption
  practice_irrigation:
    type: boolean
    description: Binary indicator for irrigation access
  practice_agroforestry:
    type: boolean
    description: Binary indicator for agroforestry adoption
  extension_visits:
    type: integer
    description: Number of extension service visits in the last year
    minimum: 0
  ndvi_mean:
    type: number
    description: Mean NDVI during growing season
    minimum: -1
    maximum: 1
  ndvi_cv:
    type: number
    description: Coefficient of variation of NDVI time-series
    minimum: 0
additionalProperties: false
