# Dataset Schema Contract for Climate-Smart Agriculture Analysis
# Project: PROJ-006-agriculture-optimization
# Task: T007
#
# This schema defines the expected structure and constraints for the
# analysis-ready dataset generated by the ingestion pipeline (T015-T022).
# It is used by src/cli/validate.py and tests to enforce data integrity.

schema_version: "1.0.0"
description: >
  Analysis-ready dataset containing household-level agricultural data,
  climate-smart practice indices, yield stability scores, and food security
  metrics derived from LSMS-ISA and Sentinel-2 data.

file_format:
  type: csv
  delimiter: ","
  encoding: "utf-8"
  header: true

required_columns:
  - name: household_id
    type: string
    description: Unique identifier for the household
    constraints:
      - not_null: true
      - unique: true
      - pattern: "^HH_[A-Z]{2}_\\d{4,}$"
        error_message: "Format must be HH_[CountryCode]_[SequentialID]"

  - name: country
    type: string
    description: Country code where household is located
    constraints:
      - not_null: true
      - allowed_values: ["MW", "TZ"]
        error_message: "Only Malawi (MW) and Tanzania (TZ) are supported"

  - name: region
    type: string
    description: Administrative region/district name
    constraints:
      - not_null: true

  - name: village_id
    type: string
    description: Unique village identifier for aggregation fallback
    constraints:
      - not_null: true

  - name: latitude
    type: float
    description: Latitude of household plot center
    constraints:
      - not_null: true
      - range: [-34.0, 35.0]
        error_message: "Latitude must be within African bounds"

  - name: longitude
    type: float
    description: Longitude of household plot center
    constraints:
      - not_null: true
      - range: [-20.0, 55.0]
        error_message: "Longitude must be within African bounds"

  - name: survey_year
    type: integer
    description: Year of the household survey
    constraints:
      - not_null: true
      - range: [2010, 2025]

  - name: CSA_Index
    type: float
    description: Composite index of Climate-Smart Agriculture practice adoption
    constraints:
      - not_null: true
      - range: [0.0, 1.0]
        error_message: "Index must be normalized between 0 and 1"
      - min_value: 0.0
      - max_value: 1.0

  - name: Stability_Score
    type: float
    description: Yield stability score (inverse of coefficient of variation)
    constraints:
      - not_null: true
      - min_value: 0.0
        error_message: "Stability score must be non-negative"

  - name: HFIAS
    type: float
    description: Household Food Insecurity Access Scale score
    constraints:
      - not_null: true
      - min_value: 0.0
      - max_value: 27.0
        error_message: "HFIAS ranges from 0 (secure) to 27 (severely insecure)"

  - name: financial_access_score
    type: float
    description: Composite score of financial access (credit, insurance, savings)
    constraints:
      - not_null: true
      - range: [0.0, 1.0]

  - name: plot_area_hectares
    type: float
    description: Total cultivated plot area in hectares
    constraints:
      - not_null: true
      - min_value: 0.0

  - name: crop_diversity_index
    type: float
    description: Simpson's diversity index of crops grown
    constraints:
      - not_null: true
      - range: [0.0, 1.0]

  - name: mean_ndvi
    type: float
    description: Mean Normalized Difference Vegetation Index over growing season
    constraints:
      - not_null: false
      - range: [-1.0, 1.0]
        error_message: "NDVI must be within physical bounds"

  - name: ndvi_cv
    type: float
    description: Coefficient of variation of NDVI (used for Stability_Score calc)
    constraints:
      - not_null: false
      - min_value: 0.0

  - name: cloud_cover_pct
    type: float
    description: Average cloud cover percentage for satellite imagery
    constraints:
      - not_null: false
      - range: [0.0, 100.0]

  - name: growing_season_months
    type: string
    description: Comma-separated list of months constituting the growing season
    constraints:
      - not_null: true
      - pattern: "^[0-9]{2}(,[0-9]{2})*$"

optional_columns:
  - name: household_size
    type: integer
    description: Number of household members
    constraints:
      - min_value: 1

  - name: dependency_ratio
    type: float
    description: Ratio of dependents to working-age members

  - name: education_years
    type: float
    description: Average years of education for household head

  - name: extension_visits
    type: integer
    description: Number of agricultural extension officer visits per year

metadata_columns:
  - name: ingestion_timestamp
    type: datetime
    description: ISO 8601 timestamp of data ingestion
    format: "YYYY-MM-DDTHH:MM:SSZ"

  - name: source_data_hash
    type: string
    description: SHA-256 hash of the raw source files used for this record

validation_rules:
  - name: spatial_consistency
    description: "Latitude/Longitude must correspond to the declared country"
    logic: >
      IF country == 'MW' THEN latitude in [-16.5, -10.0] AND longitude in [32.5, 35.9]
      IF country == 'TZ' THEN latitude in [-11.8, -1.0] AND longitude in [29.3, 40.4]

  - name: stability_calculation
    description: "Stability_Score must be consistent with NDVI_CV if both present"
    logic: >
      IF ndvi_cv > 0 AND Stability_Score > 0 THEN
        abs(Stability_Score - (1 / ndvi_cv)) < 0.01

  - name: sample_size_requirement
    description: "Dataset must contain at least 300 valid records after filtering"
    logic: "count(household_id) >= 300"

notes:
  - "This schema is enforced by src/cli/validate.py during ingestion"
  - "Records failing validation are logged to data/logs/ingestion_errors.log"
  - "Village-level aggregation (T021) must preserve all required column types"
  - "Missing values in optional columns are acceptable; required columns must be populated"
  - "CSA_Index and Stability_Score are the primary dependent variables for analysis"