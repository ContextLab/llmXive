# Dataset Schema for Climate-Smart Agriculture Analysis
# Generated for PROJ-006-agriculture-optimization
# Validates against T010 synthetic generator and T015 survey collector output

type: object
required:
  - household_id
  - latitude
  - longitude
  - land_size
  - education_level
  - finance_access
  - practice_mixed_farming
  - practice_terracing
  - practice_conservation_tillage
  - practice_agroforestry
  - extension_visits
  - hlias
  - CSA_Index
  - Stability_Score
  - HFIAS
  - village_id

properties:
  household_id:
    type: integer
    description: Unique identifier for the household

  latitude:
    type: number
    format: float
    description: Latitude coordinate (WGS84)

  longitude:
    type: number
    format: float
    description: Longitude coordinate (WGS84)

  land_size:
    type: number
    format: float
    description: Land size in hectares (continuous variable)

  education_level:
    type: integer
    description: Education level (ordinal integer, e.g., 0-16 years)

  finance_access:
    type: boolean
    description: Binary indicator for financial access

  practice_mixed_farming:
    type: boolean
    description: Binary indicator for mixed farming practice

  practice_terracing:
    type: boolean
    description: Binary indicator for terracing practice

  practice_conservation_tillage:
    type: boolean
    description: Binary indicator for conservation tillage practice

  practice_agroforestry:
    type: boolean
    description: Binary indicator for agroforestry practice

  extension_visits:
    type: integer
    description: Number of extension service visits

  hlias:
    type: integer
    description: Household Food Insecurity Access Scale (raw count)

  CSA_Index:
    type: number
    format: float
    description: Composite Climate-Smart Agriculture Index (0.0 - 4.0)

  Stability_Score:
    type: number
    format: float
    description: Yield stability score (inverse of NDVI CV)

  HFIAS:
    type: number
    format: float
    description: Household Food Insecurity Access Scale (continuous score)

  village_id:
    type: string
    description: Derived village identifier based on spatial grid
