$schema: http://json-schema.org/draft-07/schema#
title: Climate-Smart Agriculture Analysis Dataset Schema
description: >
  Schema defining the expected columns and types for the analysis-ready dataset
  derived from LSMS-ISA survey data and Sentinel-2 remote sensing imagery.
  This schema is used by src/data/processing/feature_engineering.py and
  src/cli/validate.py to ensure data integrity before regression analysis.
type: object
required:
  - household_id
  - country
  - region
  - latitude
  - longitude
  - CSA_Index
  - Stability_Score
  - HFIAS
  - finance_access
  - land_size
  - education
  - village_id
  - survey_year
properties:
  household_id:
    type: string
    description: Unique identifier for the household (LSMS-ISA ID)
  country:
    type: string
    enum: [Malawi, Tanzania]
    description: Country of survey origin
  region:
    type: string
    description: Administrative region name
  latitude:
    type: number
    minimum: -90
    maximum: 90
    description: Fuzzed latitude coordinate (1km buffer applied)
  longitude:
    type: number
    minimum: -180
    maximum: 180
    description: Fuzzed longitude coordinate (1km buffer applied)
  CSA_Index:
    type: number
    minimum: 0
    description: >
      Composite index of Climate-Smart Agriculture practices adopted.
      Sum of binary indicators: practice_mixed_farming, practice_terracing,
      practice_conservation_tillage, practice_agroforestry.
  Stability_Score:
    type: number
    minimum: 0
    description: >
      Yield stability metric derived from NDVI time-series coefficient of variation.
      Calculated as 1 / CV(NDVI) during growing season.
  HFIAS:
    type: number
    minimum: 0
    description: Household Food Insecurity Access Scale score.
  finance_access:
    type: boolean
    description: Binary indicator for access to financial services.
  land_size:
    type: number
    minimum: 0
    description: Total land size in hectares.
  education:
    type: number
    minimum: 0
    description: Highest years of formal education for household head.
  village_id:
    type: string
    description: Village cluster identifier for hierarchical modeling.
  survey_year:
    type: integer
    minimum: 2010
    maximum: 2030
    description: Year of the survey wave.
  practice_mixed_farming:
    type: boolean
    description: Binary indicator for mixed farming adoption.
  practice_terracing:
    type: boolean
    description: Binary indicator for terracing adoption.
  practice_conservation_tillage:
    type: boolean
    description: Binary indicator for conservation tillage adoption.
  practice_agroforestry:
    type: boolean
    description: Binary indicator for agroforestry adoption.
  extension_visits:
    type: integer
    minimum: 0
    description: Number of agricultural extension visits in the last 12 months.
  ndvi_mean:
    type: number
    minimum: -1
    maximum: 1
    description: Mean NDVI value within the 1km buffer during growing season.
  ndvi_std:
    type: number
    minimum: 0
    description: Standard deviation of NDVI within the 1km buffer.
additionalProperties: false
