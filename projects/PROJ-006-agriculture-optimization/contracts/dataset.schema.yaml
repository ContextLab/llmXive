type: object
properties:
  household_id:
    type: integer
    description: Unique identifier for the household
  latitude:
    type: number
    format: float
    description: Latitude coordinate of the household
  longitude:
    type: number
    format: float
    description: Longitude coordinate of the household
  land_size:
    type: number
    format: float
    description: Size of land owned or cultivated by the household (hectares)
  education_level:
    type: integer
    description: Education level of the household head (ordinal scale)
  finance_access:
    type: boolean
    description: Whether the household has access to financial services
  practice_mixed_farming:
    type: boolean
    description: Whether the household practices mixed farming
  practice_terracing:
    type: boolean
    description: Whether the household practices terracing
  practice_conservation_tillage:
    type: boolean
    description: Whether the household practices conservation tillage
  practice_agroforestry:
    type: boolean
    description: Whether the household practices agroforestry
  extension_visits:
    type: integer
    description: Number of agricultural extension visits received
  hlias:
    type: integer
    description: Household Livelihood Asset Index Score (raw)
  CSA_Index:
    type: number
    format: float
    description: Composite Climate-Smart Agriculture adoption index
  Stability_Score:
    type: number
    format: float
    description: Yield stability score derived from NDVI time-series
  HFIAS:
    type: number
    format: float
    description: Household Food Insecurity Access Scale score
  village_id:
    type: string
    description: Derived village identifier based on spatial grid
required:
  - household_id
  - latitude
  - longitude
  - land_size
  - education_level
  - finance_access
  - practice_mixed_farming
  - practice_terracing
  - practice_conservation_tillage
  - practice_agroforestry
  - extension_visits
  - hlias
  - CSA_Index
  - Stability_Score
  - HFIAS
  - village_id
