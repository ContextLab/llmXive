columns:
  household_id:
    type: integer
    description: Unique identifier for the household
  latitude:
    type: float
    description: Latitude coordinate of the household
  longitude:
    type: float
    description: Longitude coordinate of the household
  land_size:
    type: float
    description: Size of land owned/managed by the household in hectares
  education_level:
    type: integer
    description: Education level of the household head (1=primary, 2=secondary, 3=tertiary)
  finance_access:
    type: boolean
    description: Whether the household has access to formal financial services
  practice_mixed_farming:
    type: boolean
    description: Whether the household practices mixed farming
  practice_terracing:
    type: boolean
    description: Whether the household practices terracing
  practice_conservation_tillage:
    type: boolean
    description: Whether the household practices conservation tillage
  practice_agroforestry:
    type: boolean
    description: Whether the household practices agroforestry
  extension_visits:
    type: integer
    description: Number of agricultural extension visits in the last year
  hlias:
    type: integer
    description: Household Food Insecurity Access Scale score
  CSA_Index:
    type: float
    description: Composite index of Climate-Smart Agriculture practices adopted
  Stability_Score:
    type: float
    description: Yield stability score derived from NDVI time-series variability
  HFIAS:
    type: float
    description: Household Food Insecurity Access Scale continuous score
  village_id:
    type: string
    description: Derived village identifier based on spatial clustering
