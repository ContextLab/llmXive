$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Output Schema"
description: "Schema defining the structure of regression analysis results for Climate-Smart Agriculture impact evaluation."
type: object
required:
  - model_type
  - adjusted_alpha
  - bonferroni_corrected_p_values
  - coefficients
  - vif_scores
  - collinearity_warning
  - metadata
properties:
  model_type:
    type: string
    description: "Type of model used (e.g., 'aggregated' or 'clustered_by_village_id')"
    enum:
      - "aggregated"
      - "clustered"
  adjusted_alpha:
    type: number
    description: "The significance level used after Bonferroni correction."
    minimum: 0
    maximum: 1
  bonferroni_corrected_p_values:
    type: object
    description: "Dictionary mapping variable names to their Bonferroni-corrected p-values."
    additionalProperties:
      type: number
      minimum: 0
      maximum: 1
  coefficients:
    type: object
    description: "Dictionary mapping variable names to their estimated regression coefficients."
    additionalProperties:
      type: number
  vif_scores:
    type: object
    description: "Dictionary mapping variable names to their Variance Inflation Factor scores."
    additionalProperties:
      type: number
      minimum: 1
  collinearity_warning:
    type: boolean
    description: "True if any VIF score exceeds the threshold (5), indicating potential collinearity."
  metadata:
    type: object
    description: "Additional metadata about the analysis run."
    required:
      - timestamp
      - n_observations
      - n_features
      - source_dataset
    properties:
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of when the analysis was run."
      n_observations:
        type: integer
        description: "Number of observations used in the regression."
        minimum: 0
      n_features:
        type: integer
        description: "Number of predictor variables used."
        minimum: 0
      source_dataset:
        type: string
        description: "Path or identifier of the source dataset used."
      model_formula:
        type: string
        description: "The statsmodels formula string used for the regression."
additionalProperties: false
