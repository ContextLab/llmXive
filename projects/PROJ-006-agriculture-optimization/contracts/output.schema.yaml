# Regression Output Schema
# Defines the structure of data produced by src/analysis/run_regression.py
# Used for validation by src/cli/validate.py and tests/contract/test_regression_output.py

type: object
required:
  - metadata
  - models
  - diagnostics
properties:
  metadata:
    type: object
    description: Execution context and parameters
    required:
      - timestamp
      - script_version
      - input_dataset_path
      - cloud_cover_threshold
      - sample_size
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of execution
      script_version:
        type: string
        description: Version of the analysis script (e.g., git hash)
      input_dataset_path:
        type: string
        description: Relative path to the input analysis dataset
      cloud_cover_threshold:
        type: number
        description: Cloud cover threshold used for NDVI filtering
      sample_size:
        type: integer
        description: Number of records used in the regression

  models:
    type: object
    description: Regression results for each dependent variable
    required:
      - stability_model
      - food_security_model
    properties:
      stability_model:
        type: object
        description: Model 1: Yield Stability (Dependent: Stability_Score)
        required:
          - formula
          - family
          - coefficients
          - standard_errors
          - p_values
          - r_squared
          - adj_r_squared
          - f_statistic
          - f_p_value
          - cluster_variable
        properties:
          formula:
            type: string
            description: Patsy formula string used
          family:
            type: string
            description: Statistical family (e.g., 'Gaussian')
          coefficients:
            type: object
            additionalProperties:
              type: number
            description: Estimated beta coefficients
          standard_errors:
            type: object
            additionalProperties:
              type: number
            description: Cluster-robust standard errors
          p_values:
            type: object
            additionalProperties:
              type: number
            description: P-values for coefficients
          r_squared:
            type: number
            description: R-squared value
          adj_r_squared:
            type: number
            description: Adjusted R-squared value
          f_statistic:
            type: number
            description: F-statistic for overall model significance
          f_p_value:
            type: number
            description: P-value for F-statistic
          cluster_variable:
            type: string
            description: Variable used for clustering (e.g., 'village_id')
          bonferroni_adjusted:
            type: boolean
            description: Whether Bonferroni correction was applied
          bonferroni_alpha:
            type: number
            description: Adjusted alpha threshold (e.g., 0.0167)
      
      food_security_model:
        type: object
        description: Model 2: Food Security (Dependent: HFIAS)
        required:
          - formula
          - family
          - coefficients
          - standard_errors
          - p_values
          - r_squared
          - adj_r_squared
          - f_statistic
          - f_p_value
          - cluster_variable
        properties:
          # Same structure as stability_model
          formula:
            type: string
          family:
            type: string
          coefficients:
            type: object
            additionalProperties:
              type: number
          standard_errors:
            type: object
            additionalProperties:
              type: number
          p_values:
            type: object
            additionalProperties:
              type: number
          r_squared:
            type: number
          adj_r_squared:
            type: number
          f_statistic:
            type: number
          f_p_value:
            type: number
          cluster_variable:
            type: string
          bonferroni_adjusted:
            type: boolean
          bonferroni_alpha:
            type: number

  diagnostics:
    type: object
    description: Model health and collinearity diagnostics
    required:
      - vif_scores
      - multicollinearity_flags
    properties:
      vif_scores:
        type: object
        description: Variance Inflation Factor for each predictor
        additionalProperties:
          type: number
        minProperties: 1
      multicollinearity_flags:
        type: object
        description: Flags for predictors with VIF > threshold
        additionalProperties:
          type: boolean
        description: True indicates VIF > 5 (threshold defined in constants.py)
      warnings:
        type: array
        items:
          type: string
        description: List of non-critical warnings generated during execution
      errors:
        type: array
        items:
          type: string
        description: List of critical errors (if any)