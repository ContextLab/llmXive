$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Output Schema"
description: |
  Defines the expected structure of regression analysis results produced by
  src/analysis/run_regression.py. This schema validates coefficients, p-values,
  VIF scores, and diagnostic metadata for both Model 1 (Yield Stability) and
  Model 2 (Food Security).
type: object
required:
  - metadata
  - models
  - diagnostics
properties:
  metadata:
    type: object
    description: "Execution and configuration metadata"
    required:
      - timestamp
      - script_version
      - cloud_cover_threshold
      - sample_size
      - clustering_variable
    properties:
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of when the analysis was run"
      script_version:
        type: string
        description: "Version identifier of the analysis script"
      cloud_cover_threshold:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Cloud cover threshold used for satellite data filtering"
      sample_size:
        type: integer
        minimum: 1
        description: "Number of observations used in the regression"
      clustering_variable:
        type: string
        description: "Variable name used for clustering standard errors (e.g., village_id)"
      bonferroni_alpha:
        type: number
        description: "Bonferroni-corrected significance threshold (default: 0.0167)"
      model_formula_1:
        type: string
        description: "R-style formula string for Model 1"
      model_formula_2:
        type: string
        description: "R-style formula string for Model 2"

  models:
    type: object
    description: "Regression results for each dependent variable"
    required:
      - model_1_stability
      - model_2_food_security
    properties:
      model_1_stability:
        type: object
        description: "Results for Model 1: Stability_Score ~ CSA_Index + Controls"
        required:
          - dependent_variable
          - coefficients
          - summary
          - vif_scores
        properties:
          dependent_variable:
            type: string
            const: "Stability_Score"
          coefficients:
            type: array
            description: "List of coefficient estimates with statistics"
            items:
              type: object
              required:
                - term
                - estimate
                - std_error
                - t_stat
                - p_value
                - p_value_bonferroni
                - significant
              properties:
                term:
                  type: string
                  description: "Variable name (e.g., Intercept, CSA_Index, HFIAS)"
                estimate:
                  type: number
                  description: "Estimated coefficient value"
                std_error:
                  type: number
                  description: "Cluster-robust standard error"
                t_stat:
                  type: number
                  description: "T-statistic"
                p_value:
                  type: number
                  minimum: 0.0
                  maximum: 1.0
                  description: "Raw p-value"
                p_value_bonferroni:
                  type: number
                  minimum: 0.0
                  maximum: 1.0
                  description: "Bonferroni-adjusted p-value"
                significant:
                  type: boolean
                  description: "True if p_value_bonferroni < alpha_threshold"
          summary:
            type: object
            description: "Model-level summary statistics"
            required:
              - r_squared
              - adj_r_squared
              - f_statistic
              - f_p_value
              - n_obs
              - n_clusters
            properties:
              r_squared:
                type: number
                minimum: 0.0
                maximum: 1.0
              adj_r_squared:
                type: number
                minimum: 0.0
                maximum: 1.0
              f_statistic:
                type: number
              f_p_value:
                type: number
              n_obs:
                type: integer
                minimum: 1
              n_clusters:
                type: integer
                minimum: 1
          vif_scores:
            type: object
            description: "Variance Inflation Factor scores for all predictors"
            additionalProperties:
              type: number
              minimum: 1.0
              description: "VIF score for each predictor variable"

      model_2_food_security:
        type: object
        description: "Results for Model 2: HFIAS ~ CSA_Index + Controls"
        required:
          - dependent_variable
          - coefficients
          - summary
          - vif_scores
        properties:
          dependent_variable:
            type: string
            const: "HFIAS"
          coefficients:
            type: array
            items:
              type: object
              required:
                - term
                - estimate
                - std_error
                - t_stat
                - p_value
                - p_value_bonferroni
                - significant
              properties:
                term:
                  type: string
                estimate:
                  type: number
                std_error:
                  type: number
                t_stat:
                  type: number
                p_value:
                  type: number
                p_value_bonferroni:
                  type: number
                significant:
                  type: boolean
          summary:
            type: object
            required:
              - r_squared
              - adj_r_squared
              - f_statistic
              - f_p_value
              - n_obs
              - n_clusters
            properties:
              r_squared:
                type: number
              adj_r_squared:
                type: number
              f_statistic:
                type: number
              f_p_value:
                type: number
              n_obs:
                type: integer
              n_clusters:
                type: integer
          vif_scores:
            type: object
            additionalProperties:
              type: number

  diagnostics:
    type: object
    description: "Collinearity and robustness diagnostics"
    required:
      - multicollinearity_check
      - heteroskedasticity_check
    properties:
      multicollinearity_check:
        type: object
        required:
          - max_vif
          - flagged_variables
        properties:
          max_vif:
            type: number
            description: "Maximum VIF score across all predictors"
          flagged_variables:
            type: array
            description: "Variables with VIF > 5"
            items:
              type: string
      heteroskedasticity_check:
        type: object
        description: "Results of heteroskedasticity tests (e.g., Breusch-Pagan)"
        properties:
          test_name:
            type: string
          statistic:
            type: number
          p_value:
            type: number
          conclusion:
            type: string
            description: "Interpretation of the test result"

additionalProperties: false