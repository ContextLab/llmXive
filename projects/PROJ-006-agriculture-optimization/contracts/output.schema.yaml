# Regression Output Schema for PROJ-006
# Defines the structure of data produced by src/analysis/run_regression.py
# Used for validation against pydantic/jsonschema and CI checks.

type: object
required:
  - model_1_stability
  - model_2_food_security
  - vif_scores
  - metadata
properties:
  model_1_stability:
    type: object
    description: Regression results for Stability_Score ~ CSA_Index + controls
    required:
      - coefficients
      - p_values
      - standard_errors
      - model_type
    properties:
      coefficients:
        type: object
        description: Mapping of feature name to coefficient value
        additionalProperties:
          type: number
      p_values:
        type: object
        description: Bonferroni-corrected p-values
        additionalProperties:
          type: number
      standard_errors:
        type: object
        description: Standard errors (Huber-White or Cluster-Robust)
        additionalProperties:
          type: number
      model_type:
        type: string
        enum: ["clustered", "aggregated_robust"]
        description: Type of standard error correction applied
      adj_r_squared:
        type: number
        description: Adjusted R-squared value
      collinearity_warning:
        type: boolean
        description: True if any VIF > 5 detected

  model_2_food_security:
    type: object
    description: Regression results for HFIAS ~ CSA_Index + controls
    required:
      - coefficients
      - p_values
      - standard_errors
      - model_type
    properties:
      coefficients:
        type: object
        additionalProperties:
          type: number
      p_values:
        type: object
        additionalProperties:
          type: number
      standard_errors:
        type: object
        additionalProperties:
          type: number
      model_type:
        type: string
        enum: ["clustered", "aggregated_robust"]
      adj_r_squared:
        type: number
      collinearity_warning:
        type: boolean

  vif_scores:
    type: object
    description: Variance Inflation Factor for all predictors
    additionalProperties:
      type: number
    description: Key is feature name, value is VIF score.
    # Note: VIFs are calculated on the design matrix including all predictors.

  metadata:
    type: object
    required:
      - generated_at
      - n_observations
      - n_predictors
      - alpha_threshold
      - bonferroni_adjusted_alpha
    properties:
      generated_at:
        type: string
        format: date-time
      n_observations:
        type: integer
        minimum: 1
      n_predictors:
        type: integer
        minimum: 1
      alpha_threshold:
        type: number
        description: Original significance level (e.g., 0.05)
      bonferroni_adjusted_alpha:
        type: number
        description: Corrected significance level (alpha / num_tests)
      cluster_variable:
        type: string
        nullable: true
        description: Name of variable used for clustering (e.g., 'village_id'), null if aggregated.
