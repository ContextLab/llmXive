# Schema for regression analysis output
# Defines the structure of data/processed/regression_results.json
type: object
required:
  - model_name
  - adjusted_alpha
  - bonferroni_corrected_p_values
  - coefficients
  - vif_scores
  - sample_size
  - clustering_variable
  - generated_at
properties:
  model_name:
    type: string
    description: Name of the dependent variable (e.g., "Stability_Score", "HFIAS")
  adjusted_alpha:
    type: number
    description: Significance threshold after Bonferroni correction
  bonferroni_corrected_p_values:
    type: object
    description: Map of predictor names to their Bonferroni-corrected p-values
    additionalProperties:
      type: number
  coefficients:
    type: object
    description: Map of predictor names to their regression coefficients
    additionalProperties:
      type: number
  vif_scores:
    type: object
    description: Variance Inflation Factor scores for multicollinearity check
    additionalProperties:
      type: number
  sample_size:
    type: integer
    description: Number of observations used in the regression
  clustering_variable:
    type: string
    description: Variable used for cluster-robust standard errors (e.g., "village_id")
  generated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of generation
additionalProperties: false
