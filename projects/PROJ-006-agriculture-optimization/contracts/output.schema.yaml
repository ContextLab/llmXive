%YAML 1.2
---
# Contract for Regression Output Structure
# Task: T008 - Define the schema for statistical analysis results
# This file defines the expected structure of `data/processed/regression_results.json`
# produced by `src/analysis/run_regression.py`.
#
# Validation is enforced by `src/cli/validate.py` via `validate_json_artifact`.
# The schema aligns with `src/config/schemas.py` (RegressionOutput, SensitivityResult).

type: object
required:
  - metadata
  - models
  - diagnostics
  - sensitivity

properties:
  metadata:
    type: object
    description: "Provenance and execution context"
    required:
      - timestamp
      - pipeline_version
      - data_source_hash
      - parameters
    properties:
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of execution"
      pipeline_version:
        type: string
        description: "Git commit hash or version tag of the pipeline code"
      data_source_hash:
        type: string
        description: "SHA-256 checksum of the input `analysis_dataset.csv`"
      parameters:
        type: object
        description: "Hyperparameters and flags used during execution"
        properties:
          robust_se:
            type: boolean
            description: "Whether Huber-White robust standard errors were used"
          bonferroni_alpha:
            type: number
            format: float
            description: "Adjusted significance threshold (e.g., 0.0167)"
          cloud_thresholds:
            type: array
            items:
              type: number
              format: float
            description: "List of cloud cover thresholds swept in sensitivity"

  models:
    type: object
    description: "Results for each regression model fitted"
    required:
      - model_1_stability
      - model_2_food_security
    properties:
      model_1_stability:
        type: object
        description: "Regression: Stability_Score ~ CSA_Index + HFIAS + Controls"
        required:
          - formula
          - fit_stats
          - coefficients
        properties:
          formula:
            type: string
            description: "R-style formula string used"
          fit_stats:
            type: object
            required:
              - rsquared
              - rsquared_adj
              - f_statistic
              - f_pvalue
              - n_obs
            properties:
              rsquared:
                type: number
                format: float
              rsquared_adj:
                type: number
                format: float
              f_statistic:
                type: number
                format: float
              f_pvalue:
                type: number
                format: float
              n_obs:
                type: integer
          coefficients:
            type: array
            description: "List of variable coefficients and stats"
            items:
              type: object
              required:
                - term
                - coef
                - std_err
                - pvalue
                - pvalue_adj
                - vif
              properties:
                term:
                  type: string
                  description: "Variable name (e.g., 'CSA_Index', 'HFIAS')"
                coef:
                  type: number
                  format: float
                  description: "Estimated coefficient"
                std_err:
                  type: number
                  format: float
                  description: "Robust standard error"
                pvalue:
                  type: number
                  format: float
                  description: "Raw p-value"
                pvalue_adj:
                  type: number
                  format: float
                  description: "Bonferroni-adjusted p-value"
                vif:
                  type: number
                  format: float
                  description: "Variance Inflation Factor"

      model_2_food_security:
        type: object
        description: "Regression: HFIAS ~ CSA_Index + Controls"
        required:
          - formula
          - fit_stats
          - coefficients
        properties:
          formula:
            type: string
          fit_stats:
            type: object
            required:
              - rsquared
              - rsquared_adj
              - f_statistic
              - f_pvalue
              - n_obs
            properties:
              rsquared:
                type: number
                format: float
              rsquared_adj:
                type: number
                format: float
              f_statistic:
                type: number
                format: float
              f_pvalue:
                type: number
                format: float
              n_obs:
                type: integer
          coefficients:
            type: array
            items:
              type: object
              required:
                - term
                - coef
                - std_err
                - pvalue
                - pvalue_adj
                - vif
              properties:
                term:
                  type: string
                coef:
                  type: number
                  format: float
                std_err:
                  type: number
                  format: float
                pvalue:
                  type: number
                  format: float
                pvalue_adj:
                  type: number
                  format: float
                vif:
                  type: number
                  format: float

  diagnostics:
    type: object
    description: "Collinearity and model health diagnostics"
    required:
      - max_vif
      - condition_number
      - heteroskedasticity_test
    properties:
      max_vif:
        type: number
        format: float
        description: "Maximum VIF across all predictors in both models"
      condition_number:
        type: number
        format: float
        description: "Condition number of the design matrix"
      heteroskedasticity_test:
        type: object
        description: "Breusch-Pagan or White test results"
        properties:
          statistic:
            type: number
            format: float
          pvalue:
            type: number
            format: float
          rejected_null:
            type: boolean
            description: "True if heteroskedasticity is detected"

  sensitivity:
    type: array
    description: "Results from sensitivity analysis across cloud cover thresholds"
    items:
      type: object
      required:
        - cloud_threshold
        - model_1_csa_coef
        - model_1_csa_pvalue
        - model_2_csa_coef
        - model_2_csa_pvalue
      properties:
        cloud_threshold:
          type: number
          format: float
          description: "Cloud cover threshold used (e.g., 0.6, 0.7)"
        model_1_csa_coef:
          type: number
          format: float
          description: "CSA_Index coefficient in Stability model"
        model_1_csa_pvalue:
          type: number
          format: float
        model_2_csa_coef:
          type: number
          format: float
          description: "CSA_Index coefficient in Food Security model"
        model_2_csa_pvalue:
          type: number
          format: float
additionalProperties: false
