version: "1.0"
description: "Schema for regression analysis output artifacts"
type: object
required:
  - metadata
  - models
  - diagnostics
  - sensitivity
properties:
  metadata:
    type: object
    required:
      - timestamp
      - dataset_version
      - model_selection_method
      - bonferroni_alpha
    properties:
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of analysis execution"
      dataset_version:
        type: string
        description: "Hash or version identifier of the input dataset"
      model_selection_method:
        type: string
        enum: ["aggregated", "clustered"]
        description: "Method used for standard error calculation"
      bonferroni_alpha:
        type: number
        description: "Adjusted alpha threshold (0.05 / num_tests)"
      total_tests:
        type: integer
        description: "Number of hypothesis tests performed"
  models:
    type: object
    required:
      - model_1_stability
      - model_2_food_security
    properties:
      model_1_stability:
        type: object
        description: "Results for Yield Stability model (Stability_Score ~ ...)"
        required:
          - coefficients
          - p_values
          - std_errors
          - r_squared
          - adj_r_squared
        properties:
          coefficients:
            type: object
            additionalProperties:
              type: number
            description: "Regression coefficients (beta)"
          p_values:
            type: object
            additionalProperties:
              type: number
            description: "Raw p-values"
          bonferroni_p_values:
            type: object
            additionalProperties:
              type: number
            description: "Bonferroni-adjusted p-values"
          std_errors:
            type: object
            additionalProperties:
              type: number
            description: "Robust standard errors (HC3 or Cluster-Robust)"
          r_squared:
            type: number
            description: "Coefficient of determination"
          adj_r_squared:
            type: number
            description: "Adjusted R-squared"
          f_statistic:
            type: number
            description: "F-statistic for overall model significance"
          f_p_value:
            type: number
            description: "P-value for F-statistic"
      model_2_food_security:
        type: object
        description: "Results for Food Security model (HFIAS ~ ...)"
        required:
          - coefficients
          - p_values
          - std_errors
          - r_squared
          - adj_r_squared
        properties:
          coefficients:
            type: object
            additionalProperties:
              type: number
            description: "Regression coefficients (beta)"
          p_values:
            type: object
            additionalProperties:
              type: number
            description: "Raw p-values"
          bonferroni_p_values:
            type: object
            additionalProperties:
              type: number
            description: "Bonferroni-adjusted p-values"
          std_errors:
            type: object
            additionalProperties:
              type: number
            description: "Robust standard errors (HC3 or Cluster-Robust)"
          r_squared:
            type: number
            description: "Coefficient of determination"
          adj_r_squared:
            type: number
            description: "Adjusted R-squared"
          f_statistic:
            type: number
            description: "F-statistic for overall model significance"
          f_p_value:
            type: number
            description: "P-value for F-statistic"
  diagnostics:
    type: object
    required:
      - vif_scores
      - collinearity_warnings
    properties:
      vif_scores:
        type: object
        description: "Variance Inflation Factor for each predictor across models"
        properties:
          model_1_stability:
            type: object
            additionalProperties:
              type: number
            description: "VIF scores for Model 1 predictors"
          model_2_food_security:
            type: object
            additionalProperties:
              type: number
            description: "VIF scores for Model 2 predictors"
      collinearity_warnings:
        type: array
        items:
          type: string
        description: "List of warnings regarding high VIF (> 5)"
      heteroskedasticity_test:
        type: object
        properties:
          stat:
            type: number
          p_value:
            type: number
          description:
            type: string
  sensitivity:
    type: array
    items:
      type: object
      required:
        - threshold
        - model
        - coefficient_csa_index
        - p_value
        - std_err
    description: "Results of sensitivity analysis across cloud cover thresholds"
additionalProperties: false
