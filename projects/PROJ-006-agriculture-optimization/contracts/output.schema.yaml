type: object
required:
  - coefficients
  - p_values
  - vif_scores
  - model_type
  - collinearity_warning
  - aggregation_warning
properties:
  coefficients:
    type: object
    description: Dictionary mapping variable names to their regression coefficients
    additionalProperties:
      type: number
  p_values:
    type: object
    description: Dictionary mapping variable names to their p-values
    additionalProperties:
      type: number
      minimum: 0
      maximum: 1
  vif_scores:
    type: object
    description: Dictionary mapping variable names to their Variance Inflation Factor scores
    additionalProperties:
      type: number
      minimum: 1
  model_type:
    type: string
    description: Type of regression model used (e.g., 'aggregated', 'clustered', 'ols')
    enum:
      - aggregated
      - clustered
      - ols
      - robust
  collinearity_warning:
    type: boolean
    description: Flag indicating if multicollinearity was detected (any VIF > 5)
  aggregation_warning:
    type: boolean
    description: Flag indicating if data was aggregated to village level due to low linkage
  adjusted_alpha:
    type: number
    description: Bonferroni-adjusted significance threshold
    minimum: 0
    maximum: 1
  bonferroni_corrected_p_values:
    type: object
    description: Dictionary of p-values adjusted for multiple comparisons
    additionalProperties:
      type: number
      minimum: 0
      maximum: 1
  model_summary:
    type: object
    description: Optional summary statistics for the model
    properties:
      r_squared:
        type: number
      adj_r_squared:
        type: number
      n_observations:
        type: integer
        minimum: 1
  execution_metadata:
    type: object
    description: Metadata about the execution environment
    properties:
      timestamp:
        type: string
        format: date-time
      python_version:
        type: string
      statsmodels_version:
        type: string
