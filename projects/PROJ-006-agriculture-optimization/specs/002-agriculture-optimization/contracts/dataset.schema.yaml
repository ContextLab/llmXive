$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Dataset Schema"
description: "Schema for the processed analysis dataset used in regression models."
type: object
properties:
  household_id:
    type: string
    description: "Unique identifier for the household."
  village_id:
    type: string
    description: "Village identifier for aggregation."
  CSA_Index:
    type: number
    description: "Composite score of CSA practice adoption."
  Stability_Score:
    type: number
    description: "Inverse of NDVI Coefficient of Variation (1/CV)."
  HFIAS:
    type: number
    description: "Household Food Insecurity Access Scale score."
  Access_to_Finance:
    type: number
    description: "Binary or continuous measure of financial access."
  Land_Size:
    type: number
    description: "Land size in hectares."
  Education_Level:
    type: integer
    description: "Years of education."
  Rainfall_Anomaly:
    type: number
    description: "Deviation from mean rainfall."
  Cloud_Cover_Mean:
    type: number
    description: "Average cloud cover for the pixel."
  is_synthetic:
    type: boolean
    description: "Flag indicating if data is synthetic."
required:
  - household_id
  - village_id
  - CSA_Index
  - Stability_Score
  - HFIAS
  - Access_to_Finance
  - is_synthetic
additionalProperties: false