name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Linting
        run: |
          black --check code/
          flake8 code/
          isort --check code/

      - name: Run Unit Tests
        run: |
          pytest code/tests/unit/ -v

      - name: Run Contract Tests
        run: |
          pytest code/tests/contract/ -v

      - name: Run Integration Tests (Synthetic Fallback)
        env:
          CI: "true"
          # Mock credentials for CI if real data is not available
          # In a real scenario, these might be injected via secrets
          # For this test, we rely on the synthetic generator fallback
          CDS_USERNAME: "ci-mock-user"
          CDS_PASSWORD: "ci-mock-pass"
        run: |
          python code/src/cli/run_pipeline.py --dry-run

      - name: Verify Artifacts
        run: |
          python code/scripts/validate_dataset_schema.py
          python code/scripts/validate_regression_schema.py