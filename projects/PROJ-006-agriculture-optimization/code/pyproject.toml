[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-agriculture-optimization"
version = "0.1.0"
description = "Climate-Smart Agricultural Practices Analysis Pipeline"
requires-python = ">=3.9"
dependencies = []

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | \.eggs
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src", "scripts", "tests", "contracts", "data"]
skip = [".git", ".eggs", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
