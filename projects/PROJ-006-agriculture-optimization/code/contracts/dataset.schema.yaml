# Dataset Schema Contract for Agricultural Optimization Study
# Defines the expected structure for data/raw/structural_validation_data.csv and analysis datasets
type: object
properties:
  household_id:
    type: integer
    description: Unique identifier for the household
  latitude:
    type: number
    format: float
    description: Latitude coordinate
  longitude:
    type: number
    format: float
    description: Longitude coordinate
  land_size:
    type: number
    format: float
    description: Size of land in hectares
  education_level:
    type: integer
    description: Years of education
  finance_access:
    type: boolean
    description: Whether the household has access to finance
  practice_mixed_farming:
    type: boolean
    description: Adoption of mixed farming
  practice_terracing:
    type: boolean
    description: Adoption of terracing
  practice_conservation_tillage:
    type: boolean
    description: Adoption of conservation tillage
  practice_agroforestry:
    type: boolean
    description: Adoption of agroforestry
  extension_visits:
    type: integer
    description: Number of extension service visits
  hlias:
    type: integer
    description: Household Food Insecurity Access Scale score
  HFIAS:
    type: number
    format: float
    description: Household Food Insecurity Access Scale score (float version)
  CSA_Index:
    type: number
    format: float
    description: Composite Climate-Smart Agriculture index
  Stability_Score:
    type: number
    format: float
    description: Yield stability score (derived from NDVI)
  village_id:
    type: string
    description: Derived village identifier based on grid resolution
required:
  - household_id
  - latitude
  - longitude
  - land_size
  - education_level
  - finance_access
  - practice_mixed_farming
  - practice_terracing
  - practice_conservation_tillage
  - practice_agroforestry
  - extension_visits
  - hlias
  - CSA_Index
  - Stability_Score
  - village_id
