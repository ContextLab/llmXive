# Output Schema Contract for Regression Results
# Defines the expected structure for data/processed/regression_results.json
type: object
properties:
  coefficients:
    type: object
    description: Regression coefficients for each model
    additionalProperties:
      type: object
      additionalProperties:
        type: number
  p_values:
    type: object
    description: P-values for coefficients
    additionalProperties:
      type: object
      additionalProperties:
        type: number
  vif_scores:
    type: object
    description: Variance Inflation Factor scores
    additionalProperties:
      type: number
  model_type:
    type: string
    enum: [aggregated, clustered]
    description: Type of model estimation used
  collinearity_warning:
    type: boolean
    description: Flag if collinearity detected (VIF > 5)
  aggregation_warning:
    type: boolean
    description: Flag if data was aggregated due to low linkage
required:
  - coefficients
  - p_values
  - vif_scores
  - model_type
  - collinearity_warning
  - aggregation_warning