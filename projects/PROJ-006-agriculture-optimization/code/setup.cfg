[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    venv,
    .venv
per-file-ignores =
    __init__.py:F401
max-complexity = 10

[isort]
profile = black
line_length = 88
skip = venv,.venv,build,dist
known_first_party = src,tests,scripts
default_section = THIRDPARTY
