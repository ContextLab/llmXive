name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pipeline (Dry Run with Synthetic Fallback)
      env:
        CI: "true"
      run: |
        python src/cli/run_pipeline.py --dry-run

    - name: Validate Dataset Schema
      run: |
        python scripts/validate_dataset_schema.py

    - name: Validate Regression Schema
      run: |
        python scripts/validate_regression_schema.py

    - name: Run Unit Tests
      run: |
        pytest tests/unit/ -v

    - name: Run Contract Tests
      run: |
        pytest tests/contract/ -v

    - name: Run Integration Tests
      run: |
        pytest tests/integration/ -v