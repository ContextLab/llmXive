name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Verify project structure
      run: |
        python -c "import os; assert os.path.isdir('src'), 'src directory missing'; assert os.path.isdir('data'), 'data directory missing'; assert os.path.isdir('data/raw'), 'data/raw directory missing'; assert os.path.isdir('data/processed'), 'data/processed directory missing'"

    - name: Run pipeline with synthetic fallback (CI mode)
      run: |
        export CI=true
        python src/cli/run_pipeline.py --dry-run

    - name: Validate synthetic data generation
      run: |
        export CI=true
        python src/cli/run_pipeline.py
        # Verify that data/processed/analysis_dataset.csv was created
        if [ ! -f data/processed/analysis_dataset.csv ]; then
          echo "Error: analysis_dataset.csv was not generated"
          exit 1
        fi
        echo "Synthetic data generation successful."

    - name: Run unit tests
      run: |
        python -m pytest tests/unit/ -v

    - name: Run contract tests
      run: |
        python -m pytest tests/contract/ -v

    - name: Run integration tests
      run: |
        python -m pytest tests/integration/ -v
