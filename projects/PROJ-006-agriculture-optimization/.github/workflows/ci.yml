name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Ensure pytest and other test deps are available if not in requirements.txt
        pip install pytest

    - name: Run Pipeline in Dry-Run Mode (CI=true)
      env:
        CI: "true"
      run: |
        python src/cli/run_pipeline.py --dry-run

    - name: Validate Dataset Schema (if data generated)
      run: |
        if [ -f data/processed/analysis_dataset.csv ]; then
          python src/cli/validate.py --schema-type dataset data/processed/analysis_dataset.csv
        else
          echo "No analysis dataset generated, skipping schema validation."
        fi

    - name: Run Unit Tests
      run: |
        pytest tests/unit/ -v || true

    - name: Run Contract Tests
      run: |
        pytest tests/contract/ -v || true

    - name: Run Integration Tests
      run: |
        pytest tests/integration/ -v || true