name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping dependency installation"
          fi

      - name: Run Pipeline with Synthetic Fallback (CI Mode)
        env:
          CI: "true"
        run: |
          # The CI=true environment variable triggers the automatic synthetic data generation
          # in src/cli/run_pipeline.py if real data is missing, as per T010a and T010b.
          python code/src/cli/run_pipeline.py --dry-run

      - name: Verify Synthetic Data Generation
        run: |
          # Verify that the synthetic data generator was invoked and produced output
          if [ -f "data/processed/analysis_dataset.csv" ]; then
            echo "SUCCESS: Analysis dataset generated."
            wc -l "data/processed/analysis_dataset.csv"
          else
            echo "ERROR: Analysis dataset was not generated."
            exit 1
          fi

      - name: Run Unit Tests
        run: |
          python -m pytest code/tests/unit/ -v

      - name: Run Contract Tests
        run: |
          python -m pytest code/tests/contract/ -v

      - name: Run Integration Tests
        run: |
          python -m pytest code/tests/integration/ -v