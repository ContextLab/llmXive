# Schema for the cleaned dataset used in the Global Signal as a Marker of Mind-Wandering project.
# This schema defines the required columns and their expected data types.
# It is used by code/ingestion.py to validate the dataset before processing.

columns:
  - name: Subject_ID
    type: string
    description: Unique identifier for the subject
    required: true
    
  - name: global_signal
    type: float
    description: Mean global signal time series for the subject (averaged across runs)
    required: true
    
  - name: global_signal_sd
    type: float
    description: Standard deviation of the global signal for the subject
    required: true
    
  - name: MWQ_Score
    type: integer
    description: Mind-Wandering Questionnaire total score
    required: true
    
  - name: Age
    type: integer
    description: Subject age in years
    required: true
    
  - name: Sex
    type: string
    description: Subject sex (e.g., 'M', 'F')
    required: true
    
  - name: Mean_FD
    type: float
    description: Mean Framewise Displacement (motion metric)
    required: true
    
  - name: Mean_DVARS
    type: float
    description: Mean DVARS (rate of change of BOLD signal)
    required: true
