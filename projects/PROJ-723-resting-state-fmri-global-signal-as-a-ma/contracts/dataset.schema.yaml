# Dataset Schema for Resting-State fMRI Global Signal Analysis
# This schema defines the required columns and data types for the cleaned dataset
# Used by T010 for validation before downstream processing
type: object
properties:
  Subject_ID:
    type: integer
    nullable: false
    description: Unique identifier for the subject
  global_signal:
    type: number
    nullable: true
    description: Global signal mean time series (optional, for reference)
  global_signal_sd:
    type: number
    nullable: false
    description: Standard deviation of the global signal per subject
  MWQ_Score:
    type: number
    nullable: false
    description: Mind-Wandering Questionnaire total score
  Age:
    type: integer
    nullable: false
    description: Subject age in years
  Sex:
    type: string
    nullable: false
    enum: ["M", "F"]
    description: Biological sex
  Mean_FD:
    type: number
    nullable: false
    description: Mean framewise displacement in mm
  Mean_DVARS:
    type: number
    nullable: false
    description: Mean DVARS (temporal derivative of RMS variance)
required:
  - Subject_ID
  - global_signal_sd
  - MWQ_Score
  - Age
  - Sex
  - Mean_FD
  - Mean_DVARS
additionalProperties: true
