version: "1.0"
description: Schema for the processed fMRI/MWQ dataset used in User Story 1.
required_columns:
  - Subject_ID
  - Global_Signal_SD
  - MWQ_Score
  - Age
  - Sex
  - Mean_FD
  - Mean_DVARS
column_types:
  Subject_ID: string
  Global_Signal_SD: float
  MWQ_Score: float
  Age: integer
  Sex: string
  Mean_FD: float
  Mean_DVARS: float
constraints:
  - column: Subject_ID
    unique: true
    nullable: false
  - column: Global_Signal_SD
    min: 0
    nullable: false
  - column: MWQ_Score
    min: 0
    nullable: false
  - column: Mean_FD
    min: 0
    nullable: false
  - column: Mean_DVARS
    min: 0
    nullable: false
