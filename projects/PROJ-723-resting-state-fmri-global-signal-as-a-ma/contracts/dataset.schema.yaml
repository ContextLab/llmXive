# Schema definition for the Resting-State fMRI Global Signal dataset
# This file defines the required columns and types for the processed data.
# The ingestion pipeline will validate against this schema before proceeding.
version: "1.0"
description: "Schema for HCP fMRI and MWQ joined dataset"
required_columns:
  - name: global_signal
    type: numeric
    description: "Voxel-wise mean time series (global signal) per run"
  - name: global_signal_sd
    type: numeric
    description: "Standard deviation of the global signal per run, averaged across runs"
  - name: subject_id
    type: string
    description: "Unique subject identifier"
  - name: mwq_score
    type: numeric
    description: "Mind-Wandering Questionnaire total score"
  - name: age
    type: numeric
    description: "Subject age in years"
  - name: sex
    type: string
    description: "Subject sex (M/F)"
  - name: fd
    type: numeric
    description: "Mean Framewise Displacement (motion metric)"
  - name: dvars
    type: numeric
    description: "Mean DVARS (temporal derivative of fMRI signal)"

constraints:
  global_signal_sd:
    min: 0
  fd:
    min: 0
  dvars:
    min: 0
  age:
    min: 18
    max: 100