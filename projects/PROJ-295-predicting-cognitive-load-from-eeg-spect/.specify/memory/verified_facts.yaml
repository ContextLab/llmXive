'|alpha':
  quote: "Alpha waves, or the alpha rhythm, are neural oscillations in the frequency\
    \ range of 8\u201312 Hz likely originating from the synchronous and coherent (in\
    \ phase or constructive) neocortical neuronal electrical activity possibly involving\
    \ thalamic pacemaker cells. Historically, they are also called \"Berger's waves\"\
    \ after Hans Berger, who first described them when he invented the EEG in 1924."
  source_id: Alpha wave
  url: https://en.wikipedia.org/wiki/Alpha_wave
  value: "8\u201312 Hz"
