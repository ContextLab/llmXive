'|theta':
  quote: "A healthy human EEG will show certain patterns of activity that correlate\
    \ with how awake a person is. The range of frequencies one observes are between\
    \ 1 and 30 Hz, and amplitudes will vary between 20 and 100 \u03BCV. The observed\
    \ frequencies are subdivided into various groups: alpha (8\u201313 Hz), beta (13\u2013\
    30 Hz), delta (0.5\u20134 Hz), and theta (4\u20137 Hz). Alpha waves are observed\
    \ when a person is in a state of relaxed wakefulness and are mostly prominent\
    \ over the parietal and occipital sites. During intense mental activity, beta\
    \ waves are more prominent in frontal areas as well as other regions. If a relaxed\
    \ person is told to open their eyes, one observes alpha activity decreasing and\
    \ an increase in beta activity. Theta and delta waves are not generally seen in\
    \ wakefulness \u2013 if they are, it is a sign of brain dysfunction."
  source_id: Electroencephalography
  url: https://en.wikipedia.org/wiki/Electroencephalography
  value: "4\u20137 Hz"
