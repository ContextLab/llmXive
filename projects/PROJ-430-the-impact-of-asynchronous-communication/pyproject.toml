[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-async-impact"
version = "0.1.0"
description = "Analysis of asynchronous communication delays on team cohesion"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "nltk",
    "requests",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "langdetect",
    "networkx",
    "ruff",
    "black"
]

[tool.ruff]
# Target Python version
target-version = "py311"
# Line length for formatting and linting
line-length = 88
# Exclude common directories
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "data",
    "figures"
]

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), and isort (I)
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]
ignore = [
    "E501", # Line too long (handled by black)
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107"  # Missing docstring in __init__
]

[tool.ruff.lint.isort]
known-first-party = ["config", "metrics", "models", "sentiment", "utils"]
force-sort-within-sections = true

[tool.black]
# Line length must match ruff
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.tox
    | __pycache__
    | build
    | dist
    | venv
    | .venv
    | data
    | figures
)/
'''
