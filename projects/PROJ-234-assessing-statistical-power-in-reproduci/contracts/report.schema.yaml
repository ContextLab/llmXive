$schema: http://json-schema.org/draft-07/schema#
title: Audit Report Schema
description: Schema for the final audit report JSON structure generated by the pipeline.
type: object
required:
  - report_metadata
  - dataset_ingestion_summary
  - extraction_statistics
  - observed_power_results
  - mdes_results
  - success_metrics
  - disclaimer
properties:
  report_metadata:
    type: object
    required:
      - generated_at
      - pipeline_version
      - total_datasets_analyzed
    properties:
      generated_at:
        type: string
        format: date-time
      pipeline_version:
        type: string
      total_datasets_analyzed:
        type: integer
        minimum: 0
  dataset_ingestion_summary:
    type: object
    required:
      - total_fetched
      - total_filtered
      - type_distribution
    properties:
      total_fetched:
        type: integer
      total_filtered:
        type: integer
      type_distribution:
        type: object
        additionalProperties:
          type: integer
  extraction_statistics:
    type: object
    required:
      - success_rate
      - failure_reasons
      - sensitivity_delta
    properties:
      success_rate:
        type: number
        minimum: 0.0
        maximum: 1.0
      failure_reasons:
        type: object
        properties:
          paywalled:
            type: integer
          unparseable:
            type: integer
          insufficient_data:
            type: integer
          skipped_pre_fetch:
            type: integer
        additionalProperties:
          type: integer
      sensitivity_delta:
        type: object
        required:
          - full_text_rate
          - combined_rate
          - delta
        properties:
          full_text_rate:
            type: number
          combined_rate:
            type: number
          delta:
            type: number
  observed_power_results:
    type: object
    required:
      - histogram_path
      - fraction_below_threshold
    properties:
      histogram_path:
        type: string
      fraction_below_threshold:
        type: number
        minimum: 0.0
        maximum: 1.0
      count_below_threshold:
        type: integer
      total_count:
        type: integer
  mdes_results:
    type: object
    required:
      - histogram_path
      - summary_statistics
    properties:
      histogram_path:
        type: string
      summary_statistics:
        type: object
        required:
          - median
          - iqr
          - min
          - max
        properties:
          median:
            type: number
          iqr:
            type: number
          min:
            type: number
          max:
            type: number
  success_metrics:
    type: object
    required:
      - observed_power_below_threshold
      - mdes_above_threshold
    properties:
      observed_power_below_threshold:
        type: number
        minimum: 0.0
        maximum: 1.0
      mdes_above_threshold:
        type: number
        minimum: 0.0
        maximum: 1.0
  disclaimer:
    type: string
    minLength: 1
