$schema: http://json-schema.org/draft-07/schema#
title: Audit Report
description: Final audit report structure for statistical power assessment.
type: object
required:
  - overview
  - dataset_ingestion_summary
  - extraction_statistics
  - observed_power_results
  - mdes_results
  - disclaimer
properties:
  overview:
    type: object
    properties:
      title:
        type: string
      generated_at:
        type: string
        format: date-time
      pipeline_version:
        type: string
    required:
      - title
      - generated_at
  dataset_ingestion_summary:
    type: object
    properties:
      total_fetched:
        type: integer
      filtered_count:
        type: integer
      unique_ids:
        type: integer
      type_distribution:
        type: object
        additionalProperties:
          type: integer
  extraction_statistics:
    type: object
    properties:
      success_rate:
        type: number
        minimum: 0
        maximum: 1
      failure_reasons:
        type: object
        properties:
          paywalled:
            type: integer
          unparseable:
            type: integer
          insufficient_data:
            type: integer
      sensitivity_delta:
        type: object
        properties:
          full_text_rate:
            type: number
          combined_rate:
            type: number
          delta:
            type: number
  observed_power_results:
    type: object
    properties:
      total_analyzed:
        type: integer
      fraction_below_threshold:
        type: number
        minimum: 0
        maximum: 1
      threshold:
        type: number
      histogram_path:
        type: string
  mdes_results:
    type: object
    properties:
      total_analyzed:
        type: integer
      fraction_above_threshold:
        type: number
        minimum: 0
        maximum: 1
      threshold:
        type: number
      summary_statistics:
        type: object
        properties:
          median:
            type: number
          iqr:
            type: number
      histogram_path:
        type: string
  disclaimer:
    type: string
additionalProperties: false
