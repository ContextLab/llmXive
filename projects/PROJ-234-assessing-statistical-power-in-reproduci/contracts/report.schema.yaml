$schema: http://json-schema.org/draft-07/schema#
title: Final Audit Report Schema
description: Defines the structure of the final statistical power audit report generated by the pipeline.
type: object
required:
  - report_metadata
  - dataset_ingestion_summary
  - extraction_statistics
  - observed_power_results
  - mdes_results
  - success_metrics
  - disclaimer
properties:
  report_metadata:
    type: object
    description: Metadata about the report generation.
    required:
      - generated_at
      - pipeline_version
      - source_datasets_count
    properties:
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of report generation.
      pipeline_version:
        type: string
        description: Version identifier of the pipeline used.
      source_datasets_count:
        type: integer
        description: Number of datasets included in the analysis.

  dataset_ingestion_summary:
    type: object
    description: Summary of the dataset ingestion phase.
    required:
      - total_fetched
      - total_filtered
      - type_distribution
    properties:
      total_fetched:
        type: integer
        description: Total number of datasets fetched from OpenML.
      total_filtered:
        type: integer
        description: Number of datasets remaining after filtering for publication links or task IDs.
      type_distribution:
        type: object
        description: Distribution of dataset types (binary vs multiclass).
        properties:
          binary:
            type: integer
          multiclass:
            type: integer

  extraction_statistics:
    type: object
    description: Statistics regarding the extraction of statistical parameters.
    required:
      - success_rate
      - failure_reasons
    properties:
      success_rate:
        type: number
        format: float
        description: Ratio of successfully parsed publications.
      failure_reasons:
        type: object
        description: Counts of different failure reasons.
        properties:
          paywalled:
            type: integer
          unparseable:
            type: integer
          insufficient_data:
            type: integer
          abstract_only:
            type: integer
      sensitivity_delta:
        type: object
        description: Delta between full-text and combined success rates.
        properties:
          full_text_rate:
            type: number
          combined_rate:
            type: number
          delta:
            type: number

  observed_power_results:
    type: object
    description: Summary of observed power analysis.
    required:
      - histogram_path
      - fraction_below_threshold
    properties:
      histogram_path:
        type: string
        description: Relative path to the power histogram image file.
      fraction_below_threshold:
        type: number
        format: float
        description: Fraction of studies with observed power < 0.8.
      threshold:
        type: number
        default: 0.8
        description: The power threshold used for the calculation.

  mdes_results:
    type: object
    description: Summary of Minimum Detectable Effect Size analysis.
    required:
      - histogram_path
      - summary_statistics
    properties:
      histogram_path:
        type: string
        description: Relative path to the MDES histogram image file.
      summary_statistics:
        type: object
        description: Statistical summary of MDES values.
        properties:
          median:
            type: number
          iqr:
            type: number
          min:
            type: number
          max:
            type: number
      fraction_above_threshold:
        type: number
        format: float
        description: Fraction of studies with MDES > 0.2.
      threshold:
        type: number
        default: 0.2
        description: The MDES threshold used for the calculation.

  success_metrics:
    type: object
    description: Aggregated success metrics for the audit.
    properties:
      observed_power_below_threshold:
        type: number
        format: float
      mdes_above_threshold:
        type: number
        format: float

  disclaimer:
    type: string
    description: Mandatory disclaimer text regarding observed power.
    const: |
      **Disclaimer:** Observed power is a monotone function of the p‑value and should not be used for post‑hoc validation (Hoenig & Heisey).

      The research question is to determine whether observed power is appropriate for post‑hoc validation. The method involves a theoretical analysis of the monotonic relationship between observed power and p‑values.