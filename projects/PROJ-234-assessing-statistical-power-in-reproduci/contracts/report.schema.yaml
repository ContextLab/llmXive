$schema: http://json-schema.org/draft-07/schema#
title: Audit Report Schema
description: >
  Defines the structure of the final audit report (JSON representation)
  generated by the statistical power assessment pipeline. This schema is
  used by contract tests to validate the integrity of the report data
  before markdown generation.
type: object
required:
  - report_metadata
  - ingestion_summary
  - extraction_statistics
  - power_results
  - mdes_results
  - success_metrics
  - disclaimer
properties:
  report_metadata:
    type: object
    description: Metadata about the report generation.
    required:
      - generated_at
      - pipeline_version
      - dataset_count
    properties:
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of report generation.
      pipeline_version:
        type: string
        description: Version identifier of the pipeline used.
      dataset_count:
        type: integer
        minimum: 0
        description: Total number of datasets analyzed in this report.

  ingestion_summary:
    type: object
    description: Summary of the dataset ingestion phase (US1).
    required:
      - total_fetched
      - filtered_count
      - type_distribution
    properties:
      total_fetched:
        type: integer
        minimum: 0
        description: Total number of datasets fetched from OpenML.
      filtered_count:
        type: integer
        minimum: 0
        description: Number of datasets remaining after filtering for publication links or task IDs.
      type_distribution:
        type: object
        description: Count of binary vs multiclass datasets.
        required:
          - binary
          - multiclass
        properties:
          binary:
            type: integer
            minimum: 0
          multiclass:
            type: integer
            minimum: 0

  extraction_statistics:
    type: object
    description: Statistics from the publication parsing phase (US2).
    required:
      - success_rate
      - failure_reasons
      - sensitivity_delta
    properties:
      success_rate:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Fraction of datasets where parameters were successfully extracted.
      failure_reasons:
        type: object
        description: Counts of various failure modes.
        properties:
          paywalled:
            type: integer
            minimum: 0
          unparseable:
            type: integer
            minimum: 0
          insufficient_data:
            type: integer
            minimum: 0
          fetch_error:
            type: integer
            minimum: 0
      sensitivity_delta:
        type: object
        description: Comparison of full-text vs combined (text+abstract) success rates.
        required:
          - full_text_rate
          - combined_rate
          - delta
        properties:
          full_text_rate:
            type: number
          combined_rate:
            type: number
          delta:
            type: number

  power_results:
    type: object
    description: Results of the power analysis (US3).
    required:
      - total_analyzed
      - below_threshold_count
      - histogram_bins
      - histogram_edges
    properties:
      total_analyzed:
        type: integer
        minimum: 0
      below_threshold_count:
        type: integer
        minimum: 0
        description: Count of studies with observed power < 0.8.
      histogram_bins:
        type: array
        items:
          type: number
        description: Bin counts for the power histogram.
      histogram_edges:
        type: array
        items:
          type: number
        description: Bin edges for the power histogram.

  mdes_results:
    type: object
    description: Results of the MDES analysis (US3).
    required:
      - median
      - iqr
      - histogram_bins
      - histogram_edges
    properties:
      median:
        type: number
      iqr:
        type: object
        required:
          - q1
          - q3
        properties:
          q1:
            type: number
          q3:
            type: number
      histogram_bins:
        type: array
        items:
          type: number
      histogram_edges:
        type: array
        items:
          type: number

  success_metrics:
    type: object
    description: Key success indicators derived from the analysis.
    required:
      - observed_power_below_threshold
      - mdes_above_threshold
    properties:
      observed_power_below_threshold:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Fraction of studies with observed power < 0.8.
      mdes_above_threshold:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Fraction of studies with MDES > 0.2.

  disclaimer:
    type: string
    description: Mandatory disclaimer text regarding observed power limitations.
    minLength: 50
additionalProperties: false