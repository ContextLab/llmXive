$schema: http://json-schema.org/draft-07/schema#
title: OpenML Dataset Metadata
description: Schema for filtered OpenML classification dataset metadata.
type: array
items:
  type: object
  required:
    - dataset_id
    - name
    - version
    - task_type
    - download_count
  properties:
    dataset_id:
      type: integer
      description: Unique OpenML dataset identifier.
    name:
      type: string
      description: Human-readable name of the dataset.
    version:
      type: integer
      description: Version number of the dataset.
    task_type:
      type: string
      enum:
        - Binary Classification
        - Multiclass Classification
        - Regression
        - Clustering
      description: Type of machine learning task.
    download_count:
      type: integer
      minimum: 0
      description: Number of times the dataset has been downloaded.
    publication_link:
      type: ["string", "null"]
      format: uri
      description: URL to the publication describing the dataset, or null if none.
    task_id:
      type: ["integer", "null"]
      description: Associated OpenML task ID, or null if none.
    upload_date:
      type: ["string", "null"]
      format: date-time
      description: Date the dataset was uploaded.
    number_of_instances:
      type: ["integer", "null"]
      description: Number of rows in the dataset.
    number_of_features:
      type: ["integer", "null"]
      description: Number of columns/features in the dataset.
    number_of_classes:
      type: ["integer", "null"]
      description: Number of classes (for classification tasks).
    status:
      type: string
      enum:
        - active
        - inactive
      description: Current status of the dataset on OpenML.
  additionalProperties: false
