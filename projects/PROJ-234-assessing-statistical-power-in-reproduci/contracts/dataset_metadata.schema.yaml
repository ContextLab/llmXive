$schema: http://json-schema.org/draft-07/schema#
title: Dataset Metadata
description: Schema for filtered OpenML dataset metadata entries.
type: object
required:
  - dataset_id
  - name
  - download_count
  - task_type
properties:
  dataset_id:
    type: integer
    description: Unique identifier for the dataset on OpenML.
  name:
    type: string
    description: Human-readable name of the dataset.
  version:
    type: integer
    description: Version number of the dataset.
  upload_date:
    type: string
    format: date-time
    description: Date the dataset was uploaded.
  task_type:
    type: string
    description: Type of task (e.g., "Supervised Classification").
  number_of_instances:
    type: integer
    description: Number of rows in the dataset.
  number_of_features:
    type: integer
    description: Number of columns/features.
  number_of_classes:
    type: integer
    description: Number of classes (for classification tasks).
  number_of_missing_values:
    type: integer
    description: Count of missing values.
  download_count:
    type: integer
    description: Number of times the dataset has been downloaded.
  download_url:
    type: string
    format: uri
    description: URL to download the dataset.
  publication_link:
    type: ["string", "null"]
    format: uri
    description: Link to the publication describing the dataset, or null if none.
  task_id:
    type: ["integer", "null"]
    description: Associated OpenML task ID, or null if none.
  status:
    type: string
    description: Status of the dataset (e.g., "active").
  md5_checksum:
    type: string
    description: MD5 checksum of the dataset file.
  license:
    type: string
    description: License under which the dataset is distributed.
  citation:
    type: string
    description: Citation string for the dataset.
  tag:
    type: array
    items:
      type: string
    description: Tags associated with the dataset.
  additional_info:
    type: object
    description: Additional metadata not covered by standard fields.
additionalProperties: true
