$schema: http://json-schema.org/draft-07/schema#
title: OpenML Dataset Metadata
description: Schema for filtered OpenML dataset metadata entries.
type: object
properties:
  dataset_id:
    type: integer
    description: Unique identifier for the dataset in OpenML.
  name:
    type: string
    description: Human-readable name of the dataset.
  version:
    type: string
    description: Version string of the dataset.
  download_count:
    type: integer
    description: Number of times the dataset has been downloaded.
  publication_link:
    type: ["string", "null"]
    description: URL to the publication describing the dataset.
  task_id:
    type: ["integer", "null"]
    description: ID of a related OpenML task.
  NumberOfClasses:
    type: ["integer", "null"]
    description: Number of classes for classification tasks.
  NumberOfFeatures:
    type: ["integer", "null"]
    description: Number of features in the dataset.
  NumberOfInstances:
    type: ["integer", "null"]
    description: Number of instances (rows) in the dataset.
  Upload_Date:
    type: ["string", "null"]
    description: Date the dataset was uploaded.
  md5_hash:
    type: ["string", "null"]
    description: MD5 hash of the dataset file.
required:
  - dataset_id
  - name
  - download_count
additionalProperties: true
