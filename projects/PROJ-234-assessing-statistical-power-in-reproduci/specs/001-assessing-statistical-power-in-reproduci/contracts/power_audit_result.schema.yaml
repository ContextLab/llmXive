$schema: "http://json-schema.org/draft-07/schema#"
title: "PowerAuditResult"
description: "Schema for the final calculated observed power audit results."
type: "object"
properties:
  dataset_id:
    type: "integer"
    description: "FK to DatasetMetadata."
  observed_power:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Observed statistical power calculated from extracted parameters."
  target_power:
    type: "number"
    description: "Power level used for a priori checks (default 0.8)."
  threshold_met:
    type: "boolean"
    description: "True if observed power ≥ target_power (adequate power)."
  status:
    type: "string"
    enum:
      - "success"
      - "paywalled"
      - "unparseable"
      - "skipped"
    description: "Status of the calculation."
  alpha:
    type: "number"
    description: "Significance level used (default 0.05)."
  test_type:
    type: "string"
    enum:
      - "t-test"
      - "anova"
      - "logistic"
    description: "Type of statistical test performed."
  weighted_power:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Power value after applying quintile weighting (optional)."
required:
  - "dataset_id"
  - "observed_power"
  - "target_power"
  - "threshold_met"
  - "status"
  - "alpha"
  - "test_type"
additionalProperties: false