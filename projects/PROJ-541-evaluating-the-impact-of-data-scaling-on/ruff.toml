# Ruff lint configuration.
# The rule set is intentionally minimal and syntax/undefined-name
# focused so that the existing (partially legacy) codebase passes
# `ruff check .` from the repository root. Stricter rule sets can be
# enabled incrementally as modules are refactored.
line-length = 88
target-version = "py311"
select = ["E9", "F63", "F7", "F82"]
ignore = []
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "data",
  "results",
  "logs",
  "specs",
]
