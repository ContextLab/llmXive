  h: 190e7f1c6f600d14dd01c00f5f245f7ba6e3c6e41f8a6492376d2296de35bdae
  r: "The required raw archive `data/raw/2022/On_Time_Reporting_CSV.zip` is missing,\
    \ and `data/README.md` (which should contain the checksum) is also absent. The\
    \ provided `code/data_loader.py` attempts to download from a URL that returns\
    \ 404, causing the test `test_download_creates_zip` to fail and no zip file is\
    \ created. Consequently the task\u2019s core requirement\u2014streaming download\
    \ of the full\u2011year 2022 CSV and storing it as a ZIP archive\u2014is not satisfied."
  sig: 7d13af9b980d584df34205af669870759d427ef436975a7122dd268ba3a65b80
