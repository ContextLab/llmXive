  r: "The `code/utils.py` file defines a `PipelineError` exception, creates a logger\
    \ named \u201Cpipeline\u201D set to INFO level, and adds a `FileHandler` pointing\
    \ to `data/logs/pipeline.log` (creating the directory if needed). The required\
    \ logging infrastructure is fully implemented in the code."
T028:
