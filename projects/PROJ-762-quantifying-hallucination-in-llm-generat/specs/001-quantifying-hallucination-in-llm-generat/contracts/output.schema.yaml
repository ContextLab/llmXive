$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Output Schema"
description: "Schema for the final analysis report containing statistical results."
type: "object"
properties:
  correlation_token_length:
    type: "number"
    description: "Spearman correlation coefficient between token count and hallucination index."
  correlation_naming:
    type: "number"
    description: "Spearman correlation coefficient between naming style and hallucination index."
  correlation_complexity:
    type: "number"
    description: "Spearman correlation coefficient between cyclomatic complexity and hallucination index."
  p_value_raw:
    type: "array"
    items:
      type: "number"
    description: "List of raw p-values for the three correlations."
  p_value_adjusted:
    type: "array"
    items:
      type: "number"
    description: "List of Bonferroni-adjusted p-values."
  regression_coefficients:
    type: "object"
    description: "Dictionary of coefficients from the multiple linear regression model."
    additionalProperties:
      type: "number"
  sensitivity_data:
    type: "array"
    items:
      type: "object"
      properties:
        threshold:
          type: "number"
        rate:
          type: "number"
          description: "High hallucination rate at the given threshold."
      required:
        - threshold
        - rate
  manual_validation_correlation:
    type: "number"
    description: "Correlation between automated index and manual score."
  disclaimer:
    type: "string"
    description: "Disclaimer stating that findings are associational, not causal."
    const: "correlation observed"
required:
  - correlation_token_length
  - correlation_naming
  - correlation_complexity
  - p_value_raw
  - p_value_adjusted
  - regression_coefficients
  - sensitivity_data
  - manual_validation_correlation
  - disclaimer
additionalProperties: false
