$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Record Schema"
description: "Schema for the processed function records in data/processed/records.csv"
type: object
properties:
  id:
    type: string
    description: "Unique identifier for the function record"
  source_code:
    type: string
    description: "Raw Python source code"
  reference_docstring:
    type: string
    description: "Original docstring (may be empty)"
  func_name:
    type: string
    description: "Function name"
  token_count_source:
    type: integer
    description: "Token count of source code"
  token_count_gen:
    type: integer
    description: "Token count of generated description"
  naming_style:
    type: string
    description: "Naming style: snake_case, camelCase, or other"
  cyclomatic_complexity:
    type: number
    description: "Cyclomatic complexity score (NaN if parsing failed)"
  identifier_entropy:
    type: number
    description: "Shannon entropy of identifier tokens"
  generated_description_codegen:
    type: string
    description: "Description generated by codegen-350M"
  generated_description_starcoder:
    type: string
    description: "Description generated by starcoderbase-1b"
  entity_f1_codegen:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Entity‑overlap F1 for codegen model"
  entity_f1_starcoder:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Entity‑overlap F1 for starcoder model"
  precision_hallucination_codegen:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Precision component (invented entities) for codegen"
  recall_omission_codegen:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Recall component (missing entities) for codegen"
  semantic_similarity_codegen:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "SBERT cosine similarity (codegen) scaled to [0,1]"
  semantic_similarity_starcoder:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "SBERT cosine similarity (starcoder) scaled to [0,1]"
  hallucination_index_codegen:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Composite HallucinationIndex for codegen"
  hallucination_index_starcoder:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Composite HallucinationIndex for starcoder"
  generation_id_codegen:
    type: string
    description: "UUID for the codegen generation event"
  generation_id_starcoder:
    type: string
    description: "UUID for the starcoder generation event"
  empty_output_codegen:
    type: boolean
    description: "True if codegen returned empty output"
  empty_output_starcoder:
    type: boolean
    description: "True if starcoder returned empty output"
  missing_docstring:
    type: boolean
    description: "True if reference docstring was missing"
  radon_parse_failure:
    type: boolean
    description: "True if Radon could not compute complexity"
required:
  - id
  - source_code
  - func_name
  - token_count_source
  - token_count_gen
  - naming_style
  - cyclomatic_complexity
  - identifier_entropy
  - generated_description_codegen
  - generated_description_starcoder
  - entity_f1_codegen
  - entity_f1_starcoder
  - precision_hallucination_codegen
  - recall_omission_codegen
  - semantic_similarity_codegen
  - semantic_similarity_starcoder
  - hallucination_index_codegen
  - hallucination_index_starcoder
  - generation_id_codegen
  - generation_id_starcoder
additionalProperties: false
