$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema"
description: "Schema for the processed dataset containing function records and generated descriptions."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier for the function record."
  source_code:
    type: "string"
    description: "Raw Python source code."
  reference_docstring:
    type: "string"
    description: "Original docstring from the dataset."
  function_name:
    type: "string"
    description: "Name of the function."
  token_count_source:
    type: "integer"
    description: "Number of tokens in the source code."
  naming_style:
    type: "string"
    enum:
      - "snake_case"
      - "camelCase"
      - "other"
    description: "Categorization of the function naming style."
  cyclomatic_complexity:
    type: "number"
    description: "Cyclomatic complexity calculated by radon."
  generated_description_codegen:
    type: "string"
    description: "One-sentence description generated by codegen-350M."
  generated_description_starcoder:
    type: "string"
    description: "One-sentence description generated by starcoderbase-1b."
  token_count_gen:
    type: "integer"
    description: "Number of tokens in the generated description."
required:
  - id
  - source_code
  - function_name
  - naming_style
  - cyclomatic_complexity
  - generated_description_codegen
  - generated_description_starcoder
  - token_count_gen
additionalProperties: false
