$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Record Schema"
description: "Schema for the processed function records in data/processed/records.csv"
type: object
properties:
  id:
    type: string
    description: "Unique identifier for the function record"
  source_code:
    type: string
    description: "Raw Python source code"
  reference_docstring:
    type: string
    description: "Original docstring or empty string"
  func_name:
    type: string
    description: "Name of the function"
  token_count_source:
    type: integer
    description: "Token count of source code"
  token_count_gen:
    type: integer
    description: "Token count of generated description"
  naming_style:
    type: string
    description: "Naming style: snake_case, camelCase, or other"
  cyclomatic_complexity:
    type: number
    description: "Cyclomatic complexity score"
  generated_description_codegen:
    type: string
    description: "Description generated by codegen-350M"
  generated_description_starcoder:
    type: string
    description: "Description generated by starcoderbase-1b"
  entity_f1_codegen:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Entity-overlap F1 score for codegen model"
  entity_f1_starcoder:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Entity-overlap F1 score for starcoder model"
  precision_hallucination_codegen:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Precision component of F1 (invented entities) for codegen"
  recall_omission_codegen:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Recall component of F1 (missing entities) for codegen"
required:
  - id
  - source_code
  - func_name
  - entity_f1_codegen
  - entity_f1_starcoder