[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-planbench-xl"
version = "0.1.0"
description = "Extending PlanBench-XL: Evaluating Long-Horizon Planning of LLM Tool-Use Agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "datasets==2.14.0",
    "transformers==4.35.0",
    "torch==2.1.0",
    "scikit-learn==1.3.0",
    "pandas==2.1.0",
    "pytest==7.4.0",
    "requests==2.31.0",
    "flake8==6.1.0",
    "black==23.11.0",
    "isort==5.12.0",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["agents", "analysis", "dataset", "utils"]
skip = [".git", "venv", ".venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
