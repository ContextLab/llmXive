[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-planbench-xl"
version = "0.1.0"
description = "Extending PlanBench-XL for LLM Tool-Use Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets==2.14.0",
    "transformers==4.35.0",
    "torch==2.1.0",
    "scikit-learn==1.3.0",
    "pandas==2.1.0",
    "pytest==7.4.0",
    "requests==2.31.0",
    "scipy==1.11.0",
    "bitsandbytes==0.41.0"
]

[project.optional-dependencies]
dev = [
    "flake8==6.1.0",
    "black==23.12.1",
    "isort==5.13.2",
    "mypy==1.8.0",
    "pre-commit==3.6.0"
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | __pycache__
)/
'''
skip-string-normalization = false
skip-magic-trailing-comma = false

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["agents", "analysis", "dataset", "utils"]
skip_glob = ["data/*", "venv/*", "__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
