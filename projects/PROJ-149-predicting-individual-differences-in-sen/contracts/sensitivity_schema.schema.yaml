# Contract definition for sensitivity_report.csv
# Generated by T026 implementation
schema_name: sensitivity_report
version: "1.0"
description: "Sensitivity analysis results mapping p-value thresholds to significant correlation counts."

file_path: data/processed/sensitivity_report.csv
delimiter: ","

columns:
  - name: threshold
    type: float
    description: "The p-value threshold used for significance testing."
    constraints:
      min: 0.01
      max: 0.10
      step: 0.01
  - name: significant_count
    type: integer
    description: "Number of correlations with p-value <= threshold."
    constraints:
      min: 0
      max: 100 # Reasonable upper bound for this study

validation_rules:
  - rule: non_decreasing
    description: "significant_count should generally be non-decreasing as threshold increases."
    check: "df['significant_count'].diff().dropna().min() >= -1" # Allow small fluctuations due to rounding

notes: |
  This schema validates the output of code/10_sensitivity_analysis.py (T026).
  It ensures that the sensitivity sweep covers the range [0.01, 0.10] and produces valid counts.