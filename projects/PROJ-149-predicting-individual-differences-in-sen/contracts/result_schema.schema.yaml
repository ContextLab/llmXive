# Contract definitions for T035b validation
# These schemas define the expected structure of output files generated by the pipeline.

model_results:
  type: object
  required:
    - adjusted_r2
    - optimal_lambda
    - rmse
    - test_r2
    - test_rmse
    - post_hoc_power_analysis
  properties:
    adjusted_r2:
      type: number
      description: Adjusted R-squared of the model
    optimal_lambda:
      type: number
      description: Optimal lambda for LASSO regularization
    rmse:
      type: number
      description: Root Mean Squared Error on training set
    test_r2:
      type: number
      description: R-squared on test set
    test_rmse:
      type: number
      description: RMSE on test set
    post_hoc_power_analysis:
      type: object
      required:
        - required_n
        - power
        - effect_size
      properties:
        required_n:
          type: integer
          description: Required sample size for 80% power
        power:
          type: number
          description: Achieved power
        effect_size:
          type: number
          description: Effect size (f-squared)

correlations_corrected:
  type: csv
  required_columns:
    - band
    - r_value
    - p_value
    - n
    - significant
  constraints:
    band:
      type: string
      enum: [delta, theta, alpha, low_beta, high_beta, gamma]
    r_value:
      type: number
      range: [-1.0, 1.0]
    p_value:
      type: number
      range: [0.0, 1.0]
    n:
      type: integer
      minimum: 1
    significant:
      type: boolean

non_linear_comparison:
  type: object
  required:
    - linear_adjusted_r2
    - non_linear_adjusted_r2
    - f_statistic
    - p_value
    - significant_at_0p05
    - interpretation
  properties:
    linear_adjusted_r2:
      type: number
    non_linear_adjusted_r2:
      type: number
    f_statistic:
      type: number
    p_value:
      type: number
    significant_at_0p05:
      type: boolean
    interpretation:
      type: string
      minLength: 1

permutation_results:
  type: object
  required:
    - observed_r2
    - p_value
    - null_distribution_path
  properties:
    observed_r2:
      type: number
    p_value:
      type: number
      range: [0.0, 1.0]
    null_distribution_path:
      type: string
      description: Path to the .npy file containing null distribution
