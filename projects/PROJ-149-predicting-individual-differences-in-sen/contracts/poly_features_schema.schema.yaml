$schema: "http://json-schema.org/draft-07/schema#"
title: Polynomial Features Schema
description: Schema for data/interim/poly_features.csv generated by T024a
type: object
required:
  - participant_id
  - median_rt
  - delta_rel
  - theta_rel
  - alpha_rel
  - low_beta_rel
  - high_beta_rel
  - gamma_rel
  - alpha_rel_sq
  - low_beta_rel_sq
  - high_beta_rel_sq
  - alpha_rel_low_beta_rel_interaction
  - alpha_rel_high_beta_rel_interaction
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant
  median_rt:
    type: number
    description: Median reaction time in milliseconds
  delta_rel:
    type: number
    description: Relative delta power
  theta_rel:
    type: number
    description: Relative theta power
  alpha_rel:
    type: number
    description: Relative alpha power
  low_beta_rel:
    type: number
    description: Relative low beta power
  high_beta_rel:
    type: number
    description: Relative high beta power
  gamma_rel:
    type: number
    description: Relative gamma power
  alpha_rel_sq:
    type: number
    description: Squared alpha power (polynomial term)
  low_beta_rel_sq:
    type: number
    description: Squared low beta power (polynomial term)
  high_beta_rel_sq:
    type: number
    description: Squared high beta power (polynomial term)
  alpha_rel_low_beta_rel_interaction:
    type: number
    description: Interaction term between alpha and low beta
  alpha_rel_high_beta_rel_interaction:
    type: number
    description: Interaction term between alpha and high beta
additionalProperties: true