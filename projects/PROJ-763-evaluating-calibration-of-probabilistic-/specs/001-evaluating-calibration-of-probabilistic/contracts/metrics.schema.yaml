$schema: https://json-schema.org/draft/2020-12/schema
title: Metrics Schema for Statistical Tests
description: Schema for Diebold-Mariano test results and sensitivity analysis
type: object
properties:
  diebold_mariano_results:
    type: array
    items:
      type: object
      properties:
        comparison:
          type: string
          enum:
            - baseline_vs_isotonic
            - isotonic_vs_bayesian
          description: Comparison pair
        lead_time:
          type: integer
          description: Lead time for this test
        variable:
          type: string
          description: Variable name
        test_method:
          type: string
          enum:
            - DM-HAC
            - Block Bootstrap
          description: Selected test method
        p_value:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: P-value from test
        alternative:
          type: string
          enum:
            - Method A > Method B
          description: One-sided alternative hypothesis
        normality_test_p:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Shapiro-Wilk p-value for normality check
      required:
        - comparison
        - lead_time
        - variable
        - test_method
        - p_value
        - alternative
        - normality_test_p
  sensitivity_analysis:
    type: array
    items:
      type: object
      properties:
        split_ratio:
          type: string
          enum:
            - 70/30
            - 60/40
            - 80/20
          description: Validation split ratio
        metric_name:
          type: string
          enum:
            - Brier
            - CRPS
          description: Name of metric
        lead_time:
          type: integer
          description: Lead time for this metric
        variable:
          type: string
          description: Variable name
        method:
          type: string
          enum:
            - isotonic
            - bayesian
          description: Method used
        value:
          type: number
          description: Computed metric value
        confidence_interval:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: 95% CI (lower, upper)
        relative_difference:
          type: number
          description: Relative difference from 70/30 baseline
      required:
        - split_ratio
        - metric_name
        - lead_time
        - variable
        - method
        - value
        - confidence_interval
        - relative_difference
  prior_sensitivity_log:
    type: array
    items:
      type: object
      properties:
        prior_type:
          type: string
          enum:
            - physics_informed
            - flat
            - weak
            - medium
            - strong
          description: Type of prior used
        prior_parameters:
          type: object
          description: Parameters of the prior (mean, std, variance)
        metric_name:
          type: string
          enum:
            - Brier
            - CRPS
          description: Name of metric
        lead_time:
          type: integer
          description: Lead time for this metric
        variable:
          type: string
          description: Variable name
        value:
          type: number
          description: Computed metric value
        difference_from_flat:
          type: number
          description: Difference from flat prior Brier score (for physics_informed)
      required:
        - prior_type
        - metric_name
        - lead_time
        - variable
        - value
required:
  - diebold_mariano_results
  - sensitivity_analysis
  - prior_sensitivity_log