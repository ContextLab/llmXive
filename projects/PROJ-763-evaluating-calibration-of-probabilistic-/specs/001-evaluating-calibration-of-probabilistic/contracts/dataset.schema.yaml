$schema: http://json-schema.org/draft-07/schema#
title: Aligned Weather Forecast Dataset
description: Schema for the aligned forecast and observation records used in calibration analysis.
type: object
properties:
  grid_id:
    type: integer
    description: Unique identifier for the geographic grid point.
  lead_time:
    type: integer
    description: Forecast lead time in hours.
    minimum: 0
  forecast_date:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the forecast issuance.
  probability_value:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: Forecast probability of the event (0.0 to 1.0).
  raw_ensemble_mean:
    type: number
    description: Mean of the raw ensemble members.
  observation_date:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the observation.
  event_occurred:
    type: integer
    enum: [0, 1]
    description: Binary indicator if the event occurred.
  event_value:
    type: number
    description: Continuous value of the event (e.g., precipitation amount).
required:
  - grid_id
  - lead_time
  - forecast_date
  - probability_value
  - observation_date
  - event_occurred
additionalProperties: false