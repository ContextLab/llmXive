$schema: "http://json-schema.org/draft-07/schema#"
title: "Aligned Weather Forecast Dataset"
type: "object"
properties:
  grid_id:
    type: "integer"
    description: "Unique identifier for the grid point."
  lead_time:
    type: "integer"
    description: "Forecast lead time (hours or days)."
  forecast_date:
    type: "string"
    format: "date-time"
    description: "Date and time the forecast was issued."
  probability_value:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Continuous probability of the event occurring. CRITICAL: Must exist for Brier/CRPS."
  event_occurred:
    type: "integer"
    description: "Binary indicator (0 or 1) of whether the event occurred."
  method:
    type: "string"
    enum:
      - "raw"
      - "isotonic"
      - "bayesian"
    description: "Recalibration method used."
  calibrated_probability:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Recalibrated probability value."
required:
  - "grid_id"
  - "lead_time"
  - "forecast_date"
  - "probability_value"
  - "event_occurred"
  - "method"
  - "calibrated_probability"
