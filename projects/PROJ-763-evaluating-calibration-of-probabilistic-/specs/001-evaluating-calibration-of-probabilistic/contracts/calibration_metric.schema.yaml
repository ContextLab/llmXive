$schema: "http://json-schema.org/draft-07/schema#"
title: "Calibration Metric"
description: "Represents a computed statistic."
type: "object"
properties:
  metric_name:
    type: "string"
    enum:
      - "Brier"
      - "CRPS"
      - "PIT_KS"
    description: "Name of the metric (e.g., 'Brier', 'CRPS', 'PIT_KS')."
  lead_time:
    type: "integer"
    description: "Lead time for which the metric was computed."
  variable:
    type: "string"
    enum:
      - "precipitation"
      - "temperature"
    description: "Variable name (e.g., 'precipitation', 'temperature')."
  method:
    type: "string"
    enum:
      - "raw"
      - "isotonic"
      - "bayesian"
    description: "Method used (e.g., 'raw', 'isotonic', 'bayesian')."
  value:
    type: "number"
    description: "The computed metric value."
  confidence_interval:
    type: "string"
    description: "JSON string representing the 95% CI (e.g., '[0.1, 0.2]')."
required:
  - metric_name
  - lead_time
  - variable
  - method
  - value
additionalProperties: false
