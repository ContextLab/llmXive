$schema: http://json-schema.org/draft-07/schema#
title: Calibration Metric Results
description: Schema for output CSV files containing calibration metrics (Brier, CRPS, etc.).
type: object
properties:
  metric_name:
    type: string
    enum: ["Brier", "CRPS", "PIT_KS", "Reliability_Slope"]
    description: Name of the metric.
  lead_time:
    type: integer
    description: Lead time in hours.
  method:
    type: string
    enum: ["raw", "isotonic", "bayesian"]
    description: Method used for the forecast.
  variable:
    type: string
    enum: ["precipitation", "temperature"]
    description: Target variable.
  value:
    type: number
    description: Computed metric value.
  confidence_interval:
    type: string
    description: String representation of the 95% confidence interval (e.g., "(0.12, 0.15)").
  convergence_status:
    type: string
    enum: ["Converged", "Unconverged", "N/A"]
    description: Convergence status for Bayesian methods; N/A for others.
required:
  - metric_name
  - lead_time
  - method
  - variable
  - value
  - convergence_status
additionalProperties: false