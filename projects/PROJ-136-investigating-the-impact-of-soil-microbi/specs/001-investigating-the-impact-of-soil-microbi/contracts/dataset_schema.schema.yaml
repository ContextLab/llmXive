$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema for Soil Microbiome Analysis"
type: "object"
properties:
  sample_id:
    type: "string"
    description: "Unique identifier for the soil sample."
  gps_lat:
    type: "number"
    description: "Latitude of the sample location."
  gps_lon:
    type: "number"
    description: "Longitude of the sample location."
  plant_species:
    type: "string"
    description: "Name of the plant species associated with the sample."
  soil_type:
    type: "string"
    description: "Classification of the soil type."
  sequencing_depth:
    type: "integer"
    description: "Total number of reads in the sample."
  alpha_shannon:
    type: "number"
    description: "Shannon diversity index."
  alpha_simpson:
    type: "number"
    description: "Simpson diversity index."
  alpha_faith_pd:
    type: "number"
    description: "Faith's Phylogenetic Diversity."
  disease_incidence:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Proportion of disease incidence (0.0 to 1.0)."
  missing_variables:
    type: "array"
    items:
      type: "string"
    description: "List of variables that could not be matched from source data."
required:
  - sample_id
  - gps_lat
  - gps_lon
  - plant_species
  - sequencing_depth
  - alpha_shannon
  - alpha_simpson
  - alpha_faith_pd
  - missing_variables
additionalProperties: false