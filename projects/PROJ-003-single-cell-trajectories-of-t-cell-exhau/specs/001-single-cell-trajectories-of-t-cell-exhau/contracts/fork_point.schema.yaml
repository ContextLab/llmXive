$schema: "http://json-schema.org/draft-07/schema#"
title: "Fork‑Point Gene Schema"
description: "Schema for fork‑point gene results (CSV/JSON) produced by the forkpoint step."
type: "object"
properties:
  branch_id:
    type: "string"
    description: "Identifier for the fork‑point (e.g., fp_001)."
  divergence_score:
    type: "number"
    description: "Observed divergence metric for the branch."
  null_mean:
    type: "number"
    description: "Mean of the rotation‑based null distribution."
  null_std:
    type: "number"
    description: "Standard deviation of the rotation‑based null distribution."
  p_value:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Permutation‑derived p‑value for the branch."
  genes:
    type: "array"
    description: "List of genes associated with the fork‑point."
    items:
      type: "object"
      properties:
        gene_symbol:
          type: "string"
        timing_rank:
          type: "integer"
          minimum: 1
        expression_level:
          type: "number"
        differential_timing:
          type: "number"
      required:
        - gene_symbol
        - timing_rank
additionalProperties: false
required:
  - branch_id
  - divergence_score
  - null_mean
  - null_std
  - p_value
  - genes