$schema: "http://json-schema.org/draft-07/schema#"
type: "object"
title: "Fork-Point Gene Schema"
description: "Schema for fork-point gene results (CSV/JSON) produced by the forkpoint step."
properties:
  branch_id:
    type: "string"
    description: "Identifier for the fork-point (e.g., fp_001)."
  divergence_score:
    type: "number"
    description: "Observed divergence metric for the branch."
  null_mean:
    type: "number"
    description: "Mean of the permutation null distribution."
  null_std:
    type: "number"
    description: "Standard deviation of the permutation null distribution."
  p_value:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Permutation-derived p-value for the branch (significant if < 0.01)."
  confidence:
    type: "string"
    enum: ["high", "low"]
    description: "low_confidence branches (divergence < 1.5 SD above null) are excluded from the ranked gene list."
  genes:
    type: "array"
    description: "List of genes associated with the fork-point."
    items:
      type: "object"
      properties:
        gene_symbol:
          type: "string"
        timing_rank:
          type: "integer"
          minimum: 1
        expression_level:
          type: "number"
        differential_timing:
          type: "number"
          description: "Pseudotime-unit difference between early and late branches (must be > 0.1 for inclusion)."
      required:
        - gene_symbol
        - timing_rank
      additionalProperties: false
required:
  - branch_id
  - divergence_score
  - null_mean
  - null_std
  - p_value
  - confidence
  - genes
additionalProperties: false
