$schema: "http://json-schema.org/draft-07/schema#"
type: "object"
title: "Trajectory Schema"
description: "Schema for RNA velocity and pseudotime trajectory artifacts."
properties:
  dataset_id:
    type: "string"
    description: "Identifier of the source dataset."
  pseudotime_path:
    type: "string"
    description: "Path to the file containing per‑cell pseudotime values."
  velocity_graph_path:
    type: "string"
    description: "Path to the velocity graph (e.g., .h5ad)."
  alignment_status:
    type: "string"
    enum: ["success", "failed", "partial"]
    description: "Result of the Markov‑chain alignment step."
  fork_points:
    type: "array"
    description: "List of fork‑point objects identified in this trajectory."
    items:
      $ref: "#/definitions/fork_point"
required:
  - dataset_id
  - pseudotime_path
  - velocity_graph_path
  - alignment_status
additionalProperties: false
definitions:
  fork_point:
    type: "object"
    properties:
      branch_id:
        type: "string"
        description: "Identifier for the fork‑point (e.g., fp_001)."
      divergence_score:
        type: "number"
        description: "Observed divergence metric."
      null_mean:
        type: "number"
        description: "Mean of the null distribution."
      null_std:
        type: "number"
        description: "Standard deviation of the same."
      genes:
        type: "array"
        items:
          $ref: "#/definitions/fork_point_gene"
    required:
      - branch_id
      - divergence_score
      - null_mean
      - null_std
      - genes
    additionalProperties: false
  fork_point_gene:
    type: "object"
    properties:
      gene_symbol:
        type: "string"
      timing_rank:
        type: "number"
      expression_level:
        type: "string"
      description:
        description: ""
    additionalProperties: false