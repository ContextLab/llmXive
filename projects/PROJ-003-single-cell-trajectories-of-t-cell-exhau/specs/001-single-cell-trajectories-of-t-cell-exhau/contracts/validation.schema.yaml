$schema: "http://json-schema.org/draft-07/schema#"
type: "object"
title: "Validation Result Schema"
description: "Schema for bootstrap validation and enrichment analysis results."
properties:
  enrichment_pvalue:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Benjamini‑Hochberg corrected p‑value for enrichment of fork‑point genes against therapy‑response signatures."
  bootstrap_iterations:
    type: "number"
    minimum: 1
    description: "Number of bootstrap resamples performed."
  confidence_interval:
    type: "array"
    items:
      type: "number"
      minimum: 0
      maximum: 1
    description: "95 % confidence interval for the enrichment metric."
  cross_dataset_correlation:
    type: "number"
    description: "Spearman correlation of fork‑point gene rankings between datasets."
  significance_level:
    type: "boolean"
    description: "Indicates whether the enrichment result meets the significance threshold (p < 0.01)."
  discovery_dataset_ids:
    type: "array"
    items:
      type: "string"
    description: "Identifiers of the datasets where the fork‑point genes were discovered."
  validation_dataset_id:
    type: "string"
    description: "Identifier of the dataset used for validation (e.g., GSE138852)."
required:
  - enrichment_pvalue
  - bootstrap_iterations
  - confidence_interval
  - cross_dataset_correlation
  - significance_level
  - discovery_dataset_ids
  - validation_dataset_id
additionalProperties: false