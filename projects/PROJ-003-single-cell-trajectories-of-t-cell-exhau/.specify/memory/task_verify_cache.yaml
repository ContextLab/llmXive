T003:
  c: false
  h: 391c24288b0692d6d2cec48213d536dfe9cf6b1e47917ec78951547eb0d564b2
  r: "The artifacts exist, but the actual execution log shows the QC filter never\
    \ functioned on real data: for GSE127465 the run reported \"No mitochondrial genes\
    \ detected; setting percent.mt to 0\" and \"Cells before QC: 41861, after QC:\
    \ 41861\" \u2014 zero cells filtered, because the .mtx loader only reads `genes.tsv`/`barcodes.tsv`\
    \ if present and otherwise leaves generic var names, so the `MT-` pattern never\
    \ matches. Additionally, `tests/unit/test_preprocess.py` imports `python_preprocess`\
    \ but never calls it; both tests re-implement the filtering logic inline on synthetic\
    \ AnnData objects, so they verify n"
  sig: abc0b5d2c8a9486151961f69b0e6664c31849c6b33c231717f821dc0693d1514
T004:
