  r: "The required output `data/results/velocity_graph.h5ad` is MISSING \u2014 only\
    \ `code/velocity.py` exists, and there is no execution evidence (logs, test run\
    \ output) that the script was ever run or that it completes within 45 minutes\
    \ on CPU. Additionally, the integration test is weak: it skips when input data\
    \ is absent and its pseudotime/field checks are effectively no-ops (`pass` on\
    \ missing pseudotime), so it does not genuinely verify the required `velocity`,\
    \ `pseudotime`, `spliced`, and `unspliced` fields."
