[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcell-trajectory-analysis"
version = "0.1.0"
description = "Single-cell trajectories of T-cell exhaustion analysis pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scvelo>=0.2.5",
    "scanpy>=1.9.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "requests>=2.28.0",
    "wget>=3.2",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.ruff]
# Inherit settings from .ruff.toml if present, otherwise define inline
line-length = 88
target-version = "py39"
src = ["code", "tests"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
