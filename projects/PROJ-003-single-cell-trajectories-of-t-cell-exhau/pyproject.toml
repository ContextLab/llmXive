[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "data", "logs"]

[tool.ruff.lint]
# Default rule set: pyflakes + pycodestyle errors that matter.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Existing scaffolding modules keep their imports (some are used only
# by downstream tasks); unused-import removal is deferred to those tasks.
"code/*.py" = ["F401"]
"tests/*.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = ".venv|venv|data|logs"
