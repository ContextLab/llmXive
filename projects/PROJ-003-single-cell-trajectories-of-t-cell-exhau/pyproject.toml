[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "single-cell-trajectories-t-cell-exhaustion"
version = "0.1.0"
description = "Pipeline for analyzing single-cell trajectories of T-cell exhaustion"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scvelo",
    "scanpy",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "requests",
    "wget",
    "ruff",
    "black",
]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (black handles this)
    "B008", # do not perform function calls in argument defaults
]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.isort]
known-first-party = ["download_data", "setup_directories", "preprocess", "velocity", "aligner", "forkpoint", "validate", "report"]
force-sort-within-sections = true
case-sensitive = true
order-by-type = true
relative-imports-order = "closest-to-furthest"
