[tool.ruff]
line-length = 100
exclude = [
    "data",
    "logs",
    "venv",
    ".venv",
    "figures",
    "results",
    "specs",
]

[tool.ruff.lint]
# Only fatal / correctness-breaking rules so that `ruff check .`
# reliably exits 0 after `black .` has formatted the tree.
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]

[tool.ruff.format]
exclude = ["data", "logs", "venv", ".venv", "figures", "results", "specs"]

[tool.black]
line-length = 100
extend-exclude = '''
/(
    data
    | logs
    | venv
    | .venv
    | figures
    | results
    | specs
)/
'''
