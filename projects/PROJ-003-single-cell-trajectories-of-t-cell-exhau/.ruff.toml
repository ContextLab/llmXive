[tool.ruff]
# Maximum line length
line-length = 100
# Target Python version
target-version = "py311"
# Enable selected linting rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "C90", # McCabe complexity
    "I",   # import sorting
    "N",   # naming conventions
]
# Ignore specific rules if needed
ignore = []
