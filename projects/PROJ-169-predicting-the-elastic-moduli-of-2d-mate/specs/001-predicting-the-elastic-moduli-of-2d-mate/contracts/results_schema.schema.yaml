$schema: "http://json-schema.org/draft-07/schema#"
title: "Generalization Metrics Schema"
description: "Schema for data/results/generalization_metrics.json"
type: "object"
properties:
  mape_young:
    type: "number"
    description: "Mean Absolute Percentage Error for Young's modulus"
  mape_shear:
    type: "number"
    description: "Mean Absolute Percentage Error for Shear modulus"
  mape_poisson:
    type: "number"
    description: "Mean Absolute Percentage Error for Poisson's ratio"
  overall_mape:
    type: "number"
    description: "Weighted average MAPE"
  mape_ci_lower:
    type: "number"
    description: "95% Confidence Interval Lower Bound for MAPE"
  mape_ci_upper:
    type: "number"
    description: "95% Confidence Interval Upper Bound for MAPE"
  rmse_young:
    type: "number"
    description: "Root Mean Squared Error for Young's modulus"
  threshold:
    type: "number"
    description: "Success threshold (e.g., 0.15)"
  status:
    type: "string"
    enum:
      - "PASS"
      - "FAIL"
    description: "Evaluation status based on threshold"
  test_families:
    type: "array"
    description: "List of chemical families in the test set"
    items:
      type: "string"
  message:
    type: "string"
    description: "Error message if status is FAIL"
required:
  - mape_young
  - mape_shear
  - mape_poisson
  - overall_mape
  - mape_ci_lower
  - mape_ci_upper
  - rmse_young
  - threshold
  - status
  - test_families
  - message
additionalProperties: false