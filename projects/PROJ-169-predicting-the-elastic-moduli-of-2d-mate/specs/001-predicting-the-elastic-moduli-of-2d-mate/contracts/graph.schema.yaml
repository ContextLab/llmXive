$schema: "http://json-schema.org/draft-07/schema#"
title: "Material Graph Data Schema"
description: "Schema for the PyTorch Geometric graph data representing a single material."
type: "object"
properties:
  x:
    type: "array"
    description: "Node feature matrix \([N_{\text{nodes}}, F]\) where \(F\) denotes the dimensionality of the node features."
    items:
      type: "array"
      minItems: 5
      maxItems: 5
      items:
        type: "number"
  edge_index:
    type: "array"
    description: "Edge index tensor [C, N_edges], where C denotes the connectivity dimension encoding source‑target node pairs."
    items:
      type: "array"
      items:
        type: "integer"
        minimum: 0
  edge_attr:
    type: "array"
    description: "Edge feature matrix \[N_edges, k\] (where k denotes the dimensionality of the edge feature vector)."
    items:
      type: "array"
      minItems: 2
      maxItems: 2
      items:
        type: "number"
  y:
    type: "array"
    description: "Target vector [Young's, Shear, Poisson's]"
    items:
      type: "number"
    minItems: 3
    maxItems: 3
  material_id:
    type: "string"
    description: "Material ID associated with the graph"
required:
  - x
  - edge_index
  - edge_attr
  - y
  - material_id
additionalProperties: false