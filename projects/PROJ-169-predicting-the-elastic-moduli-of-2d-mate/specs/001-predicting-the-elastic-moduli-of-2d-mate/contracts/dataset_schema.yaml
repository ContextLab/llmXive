$schema: "http://json-schema.org/draft-07/schema#"
title: "Processed Graph Dataset Schema"
description: "Row schema for data/processed/graphs_v1.parquet"
type: "object"
properties:
  material_id:
    type: "string"
  num_nodes:
    type: "integer"
    minimum: 1
  num_edges:
    type: "integer"
    minimum: 0
  node_features:
    type: "array"
    items:
      type: "array"
      items:
        type: "number"
  edge_index:
    type: "array"
    items:
      type: "array"
      items:
        type: "integer"
        minimum: 0
  edge_features:
    type: "array"
    items:
      type: "array"
      items:
        type: "number"
  target_young:
    type: "number"
    description: "Young's modulus (GPa), strictly positive for MAPE eligibility."
  target_shear:
    type: "number"
    description: "Shear modulus (GPa), strictly positive for MAPE eligibility."
  target_poisson:
    type: "number"
    description: "Poisson's ratio (dimensionless, may be zero or negative)."
  family:
    type: "string"
    description: "Chemical family = space group + stoichiometry class."
required:
  - material_id
  - num_nodes
  - num_edges
  - node_features
  - edge_index
  - edge_features
  - target_young
  - target_shear
  - target_poisson
  - family
additionalProperties: false
