$schema: "http://json-schema.org/draft-07/schema#"
title: "Split Validation Schema"
description: "Schema for data/results/split_validation.json produced by T017b"
type: "object"
properties:
  status:
    type: "string"
    enum:
      - "PASS"
      - "FAIL"
    description: "Validation status of the inter-family split"
  train_count:
    type: "integer"
    description: "Number of training materials"
  val_count:
    type: "integer"
    description: "Number of validation materials"
  test_count:
    type: "integer"
    description: "Number of test materials"
  train_families:
    type: "array"
    items:
      type: "string"
    description: "Chemical families in the training set"
  test_families:
    type: "array"
    items:
      type: "string"
    description: "Chemical families held out for testing"
  leakage_check:
    type: "boolean"
    description: "True if no family appears in more than one split"
  split_seed:
    type: "integer"
    description: "Pinned random seed used for the split"
  message:
    type: "string"
    description: "Error message if status is FAIL"
required:
  - status
  - train_count
  - val_count
  - test_count
  - train_families
  - test_families
  - leakage_check
  - split_seed
  - message
additionalProperties: false
