[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predict-root-architecture"
version = "0.1.0"
description = "Predicting Plant Root Architecture from Soil Nutrient Availability"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "scikit-learn",
    "statsmodels",
    "seaborn",
    "matplotlib",
    "pyyaml",
    "geopandas",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | \.eggs
  | \.egg-info
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["config", "data_ingestion", "logging_integration", "modeling", "models", "preprocessing", "reporting", "sensitivity_analysis", "setup_project", "spec_deviation_handler", "visualization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"