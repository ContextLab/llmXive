$schema: "http://json-schema.org/draft-07/schema#"
title: "MergedDataset"
description: "Schema for the cleaned and merged root phenotype and soil nutrient dataset."
type: "object"
properties:
  species:
    type: "string"
    description: "Scientific name of the plant species."
  root_length:
    type: "number"
    description: "Log-transformed total root length."
  branching_density:
    type: "number"
    description: "Log-transformed branching density."
  surface_area:
    type: "number"
    description: "Log-transformed root surface area."
  phosphorus:
    type: "number"
    description: "Z-scored phosphorus concentration. May be null if data unavailable."
  nitrogen:
    type: "number"
    description: "Z-scored nitrogen concentration. May be null if data unavailable."
  data_source_type:
    type: "string"
    description: "Type of data source (observational/experimental)."
required:
  - species
  - root_length
  - branching_density
  - surface_area
  - data_source_type
additionalProperties: false
