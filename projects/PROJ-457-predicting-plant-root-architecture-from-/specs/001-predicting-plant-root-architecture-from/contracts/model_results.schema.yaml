$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelResults"
description: "Schema for the output of the LMM and Random Forest modeling phase."
type: "object"
properties:
  lmm_results:
    type: "object"
    properties:
      adjusted_r_squared:
        type: "number"
        description: "Adjusted R-squared value for the LMM."
      rmse:
        type: "number"
        description: "Root Mean Squared Error."
      coefficients:
        type: "object"
        description: "Mapping predictor → {coefficient, p_value, corrected_p_value}."
        additionalProperties:
          type: "object"
          properties:
            coefficient:
              type: "number"
            p_value:
              type: "number"
            corrected_p_value:
              type: "number"
          required:
            - coefficient
            - p_value
            - corrected_p_value
      p_values:
        type: "object"
        description: "Mapping predictor → p-value (redundant for convenience)."
        additionalProperties:
          type: "number"
    required:
      - adjusted_r_squared
      - rmse
      - coefficients
      - p_values
  rf_results:
    type: "object"
    properties:
      r_squared:
        type: "number"
        description: "R-squared value for the Random Forest."
      rmse:
        type: "number"
        description: "Root Mean Squared Error."
    required:
      - r_squared
      - rmse
  cv_metrics:
    type: "object"
    properties:
      mean_out_of_sample_r2:
        type: "number"
        description: "Mean R-squared from species‑stratified cross‑validation."
    required:
      - mean_out_of_sample_r2
  success_criteria:
    type: "object"
    properties:
      sc_002_met:
        type: "boolean"
        description: "True if LMM R² is within 5 % of RF R² (SC‑002)."
      sc_003_met:
        type: "boolean"
        description: "True if nutrient coefficient p-values < 0.04 after correction (SC‑003)."
      sc_006_met:
        type: "boolean"
        description: "True if sensitivity analysis confirms biological plausibility (SC‑006)."
      power_achieved:
        type: "number"
        description: "Achieved statistical power for detecting a medium effect size."
    required:
      - sc_002_met
      - sc_003_met
      - sc_006_met
      - power_achieved
required:
  - lmm_results
  - rf_results
  - cv_metrics
  - success_criteria
additionalProperties: false