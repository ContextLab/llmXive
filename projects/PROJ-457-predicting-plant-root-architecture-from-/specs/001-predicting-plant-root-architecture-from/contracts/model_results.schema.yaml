$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelResults"
description: "Schema for the output of the LMM and Random Forest modeling phase."
type: "object"
properties:
  lmm_results:
    type: "object"
    properties:
      adjusted_r_squared:
        type: "number"
        description: "Adjusted R-squared value for the LMM."
      rmse:
        type: "number"
        description: "Root Mean Squared Error."
      coefficients:
        type: "object"
        description: "Map of predictor names to their coefficients and p-values."
      p_values:
        type: "object"
        description: "Map of predictor names to their p-values."
  rf_results:
    type: "object"
    properties:
      r_squared:
        type: "number"
        description: "R-squared value for the Random Forest."
      rmse:
        type: "number"
        description: "Root Mean Squared Error."
  cv_metrics:
    type: "object"
    properties:
      mean_out_of_sample_r2:
        type: "number"
        description: "Mean R-squared from species-stratified CV."
  success_criteria:
    type: "object"
    properties:
      sc_002_met:
        type: "boolean"
        description: "True if LMM R2 is within 5% of RF R2."
      sc_003_met:
        type: "boolean"
        description: "True if p-values < 0.05."
required:
  - lmm_results
  - rf_results
  - cv_metrics
  - success_criteria
additionalProperties: false
