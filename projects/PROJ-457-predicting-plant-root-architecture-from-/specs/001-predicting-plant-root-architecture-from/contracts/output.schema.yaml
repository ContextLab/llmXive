$schema: "http://json-schema.org/draft-07/schema#"
title: "FinalReportOutput"
description: "Schema for the final report artifacts and summary metrics."
type: "object"
properties:
  report_file:
    type: "string"
    description: "Path to the generated PDF report."
  plots:
    type: "array"
    items:
      type: "string"
    description: "List of paths to generated PNG plots."
  total_plot_size_mb:
    type: "number"
    description: "Total size of plot files in MB (must be ≤ 100)."
  associational_statement:
    type: "string"
    description: "Explicit statement confirming findings are associational, not causal."
  deviations:
    type: "array"
    items:
      type: "string"
    description: "Logged deviation messages (e.g., merged dataset unavailable, imputation decisions)."
  success_criteria:
    type: "object"
    properties:
      sc_001_met:
        type: "boolean"
        description: "True if proportion of merged datasets meets SC‑001; null if not measurable."
      sc_002_met:
        type: "boolean"
        description: "True if LMM R² within 5 % of RF R² (SC‑002)."
      sc_003_met:
        type: "boolean"
        description: "True if nutrient coefficients significant (SC‑003)."
      sc_004_met:
        type: "boolean"
        description: "True if total plot size ≤ 100 MB (SC‑004)."
      sc_005_met:
        type: "boolean"
        description: "True if ​ ​  species exclusion count record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record record re