$schema: "http://json-schema.org/draft-07/schema#"
title: Merged Plant Phenotype and Nutrient Dataset
description: >-
  Schema for the merged dataset containing root phenotype measurements
  and soil nutrient availability (Phosphorus and Nitrogen).
  This dataset is the result of the ingestion and preprocessing pipeline (US1).
type: object
required:
  - properties
  - required
  - type
properties:
  type:
    type: string
    const: object
  required:
    type: array
    items:
      type: string
    minItems: 6
    contains:
      - "species"
      - "root_length"
      - "branching_density"
      - "surface_area"
      - "phosphorus"
      - "nitrogen"
  properties:
    type: object
    properties:
      species:
        type: object
        description: Scientific name of the plant species
        properties:
          type:
            type: string
            const: string
          description:
            type: string
        required:
          - type
      root_length:
        type: object
        description: Total root length (cm)
        properties:
          type:
            type: string
            const: number
          description:
            type: string
        required:
          - type
      branching_density:
        type: object
        description: Number of root branches per unit length
        properties:
          type:
            type: string
            const: number
          description:
            type: string
        required:
          - type
      surface_area:
        type: object
        description: Total root surface area (cm²)
        properties:
          type:
            type: string
            const: number
          description:
            type: string
        required:
          - type
      phosphorus:
        type: object
        description: Soil Phosphorus availability (mg/kg)
        properties:
          type:
            type: string
            const: number
          description:
            type: string
        required:
          - type
      nitrogen:
        type: object
        description: Soil Nitrogen availability (mg/kg)
        properties:
          type:
            type: string
            const: number
          description:
            type: string
        required:
          - type
additionalProperties: false
