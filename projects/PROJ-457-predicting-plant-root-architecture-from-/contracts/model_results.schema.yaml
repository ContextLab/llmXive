$schema: http://json-schema.org/draft-07/schema#
title: Model Results Schema
description: Schema for validating the output of the modeling pipeline (LMM and Random Forest).
type: object
required:
  - lmm
  - random_forest
  - cross_validation
  - success_criteria

properties:
  lmm:
    type: object
    description: Linear Mixed-Effects Model results
    required:
      - adjusted_r_squared
      - p_values
      - coefficients
      - f_statistic
      - f_test_p_value
    properties:
      adjusted_r_squared:
        type: number
        description: Adjusted R-squared value for the LMM
      p_values:
        type: object
        description: Dictionary of p-values for fixed effects coefficients
        additionalProperties:
          type: number
          minimum: 0.0
          maximum: 1.0
      coefficients:
        type: object
        description: Dictionary of fixed effects coefficients
        additionalProperties:
          type: number
      f_statistic:
        type: number
        description: F-statistic for overall model significance
      f_test_p_value:
        type: number
        description: P-value for the F-test
        minimum: 0.0
        maximum: 1.0

  random_forest:
    type: object
    description: Random Forest baseline results
    required:
      - r_squared
      - rmse
      - feature_importances
    properties:
      r_squared:
        type: number
        description: R-squared value for the Random Forest model
      rmse:
        type: number
        description: Root Mean Squared Error
        minimum: 0.0
      feature_importances:
        type: object
        description: Dictionary of feature importances
        additionalProperties:
          type: number
          minimum: 0.0

  cross_validation:
    type: object
    description: Cross-validation results (species-level stratified)
    required:
      - lmm_mean_r2
      - lmm_std_r2
      - rf_mean_r2
      - rf_std_r2
    properties:
      lmm_mean_r2:
        type: number
        description: Mean R-squared across folds for LMM
      lmm_std_r2:
        type: number
        description: Standard deviation of R-squared across folds for LMM
      rf_mean_r2:
        type: number
        description: Mean R-squared across folds for Random Forest
      rf_std_r2:
        type: number
        description: Standard deviation of R-squared across folds for Random Forest

  success_criteria:
    type: object
    description: Success criteria evaluation
    required:
      - sc002_met
      - r2_difference
    properties:
      sc002_met:
        type: boolean
        description: True if |LMM R2 - RF R2| <= 0.05
      r2_difference:
        type: number
        description: Absolute difference between LMM and RF R-squared

additionalProperties: false
