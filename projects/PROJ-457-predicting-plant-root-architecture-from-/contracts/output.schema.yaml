$schema: http://json-schema.org/draft-07/schema#
title: Final Report Schema
description: Schema for the final research report artifact generated by the pipeline.
type: object
required:
  - report_metadata
  - executive_summary
  - methods_summary
  - results
  - deviations
  - limitations
  - appendices
properties:
  report_metadata:
    type: object
    required:
      - generated_at
      - version
      - pipeline_run_id
    properties:
      generated_at:
        type: string
        format: date-time
      version:
        type: string
      pipeline_run_id:
        type: string
      data_source:
        type: string
      model_type:
        type: string

  executive_summary:
    type: object
    required:
      - main_finding
      - statistical_significance
      - biological_plausibility
    properties:
      main_finding:
        type: string
      statistical_significance:
        type: string
      biological_plausibility:
        type: string
      key_metrics:
        type: object
        properties:
          lmm_r2:
            type: number
          rf_r2:
            type: number
          r2_difference:
            type: number
          sc002_met:
            type: boolean

  methods_summary:
    type: object
    required:
      - data_ingestion
      - preprocessing
      - modeling
    properties:
      data_ingestion:
        type: string
      preprocessing:
        type: string
      modeling:
        type: string
      validation_strategy:
        type: string

  results:
    type: object
    required:
      - model_performance
      - coefficient_analysis
      - sensitivity_analysis
    properties:
      model_performance:
        type: object
        properties:
          lmm:
            type: object
            properties:
              adjusted_r_squared:
                type: number
              rmse:
                type: number
              p_values:
                type: array
                items:
                  type: number
          rf:
            type: object
            properties:
              r_squared:
                type: number
              rmse:
                type: number
      coefficient_analysis:
        type: object
        properties:
          phosphorus:
            type: object
            properties:
              coefficient:
                type: number
              p_value:
                type: number
              literature_range:
                type: array
                items:
                  type: number
              within_range:
                type: boolean
          nitrogen:
            type: object
            properties:
              coefficient:
                type: number
              p_value:
                type: number
              literature_range:
                type: array
                items:
                  type: number
              within_range:
                type: boolean
      sensitivity_analysis:
        type: object
        properties:
          percent_deviation:
            type: number
          literature_overlap:
            type: boolean
          confidence_interval:
            type: array
            items:
              type: number

  deviations:
    type: array
    items:
      type: object
      required:
        - id
        - description
        - reason
      properties:
        id:
          type: string
        description:
          type: string
        reason:
          type: string
        affected_fr_ids:
          type: array
          items:
            type: string

  limitations:
    type: array
    items:
      type: string

  appendices:
    type: object
    properties:
      figures:
        type: array
        items:
          type: string
      data_quality_reports:
        type: array
        items:
          type: string
      literature_sources:
        type: array
        items:
          type: string
