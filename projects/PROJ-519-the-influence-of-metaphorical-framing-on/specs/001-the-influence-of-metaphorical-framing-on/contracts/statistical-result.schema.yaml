$schema: http://json-schema.org/draft-07/schema#
title: Statistical Result Schema
description: |
  Schema for aggregated statistical results from ANOVA, regression, and visualization generation.
  Ensures reproducibility and structured reporting of scientific findings.
type: object
required:
  - analysis_id
  - analysis_type
  - timestamp
  - parameters
  - results
properties:
  analysis_id:
    type: string
    description: Unique identifier for the analysis run.
    pattern: "^[A-Z0-9]{8}-[0-9]{4}$"
  analysis_type:
    type: string
    enum:
      - anova_experimental
      - regression_discourse
      - pairwise_comparison
    description: Type of statistical analysis performed.
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the analysis was completed.
  parameters:
    type: object
    description: Configuration parameters used for the analysis.
    properties:
      alpha:
        type: number
        minimum: 0
        maximum: 1
        description: Significance level (alpha).
      bonferroni_adjusted:
        type: boolean
        description: Whether Bonferroni correction was applied.
      model_formula:
        type: string
        description: Statistical model formula (e.g., for regression).
      robust_se:
        type: boolean
        description: Whether robust standard errors (Huber-White) were used.
  results:
    type: object
    description: The core statistical findings.
    properties:
      # For ANOVA
      f_statistic:
        type: number
        description: F-statistic value (for ANOVA).
      p_value:
        type: number
        minimum: 0
        description: P-value associated with the test statistic.
      degrees_of_freedom:
        type: object
        properties:
          model:
            type: integer
          residual:
            type: integer
      # For Regression
      coefficients:
        type: array
        items:
          type: object
          required:
            - term
            - estimate
            - std_err
            - p_value
          properties:
            term:
              type: string
            estimate:
              type: number
            std_err:
              type: number
            p_value:
              type: number
        description: List of regression coefficients.
      r_squared:
        type: number
        minimum: 0
        maximum: 1
        description: R-squared value for regression models.
      vif_flag:
        type: string
        enum:
          - LOW
          - HIGH
        description: Variance Inflation Factor flag indicating multicollinearity.
      pairwise_comparisons:
        type: array
        items:
          type: object
          required:
            - group1
            - group2
            - p_value
            - significant
          properties:
            group1:
              type: string
            group2:
              type: string
            p_value:
              type: number
            significant:
              type: boolean
        description: Results of pairwise comparisons with corrections.
  data_checksum:
    type: string
    description: SHA-256 checksum of the input data file used for this analysis.
  output_files:
    type: array
    items:
      type: string
    description: List of output file paths generated by this analysis.