$schema: http://json-schema.org/draft-07/schema#
title: Experimental Data Schema
description: >
  Schema for raw and processed experimental data resulting from the vignette exposure study.
  Captures participant assignment, vignette exposure, and survey responses.
type: object
required:
  - participant_id
  - condition
  - vignette_version
  - timestamp
  - responses
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant (UUID).
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
  condition:
    type: string
    description: The experimental condition assigned to the participant.
    enum:
      - battle
      - journey
      - medical
  vignette_version:
    type: string
    description: Identifier for the specific vignette text version used.
    minLength: 1
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the session completion.
  attention_check:
    type: boolean
    description: Whether the participant passed the attention check question.
  identical_response_flag:
    type: boolean
    description: Flag indicating if all Likert responses were identical (potential bot/low effort).
  responses:
    type: object
    description: Raw survey responses.
    required:
      - cami_stigma
      - cami_help_seeking
      - likert_help_intent
    properties:
      cami_stigma:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 5
        description: Array of CAMI stigma subscale item scores.
      cami_help_seeking:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 5
        description: Array of CAMI help-seeking subscale item scores.
      likert_help_intent:
        type: integer
        minimum: 1
        maximum: 7
        description: 7-point Likert scale for help-seeking intent.
      demographic_age:
        type: integer
        minimum: 18
        description: Participant age (optional).
      demographic_gender:
        type: string
        description: Participant gender (optional).
additionalProperties: false
