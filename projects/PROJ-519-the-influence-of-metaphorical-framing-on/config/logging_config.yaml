# Logging Configuration
log_level: INFO
log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
handlers:
  console:
    level: INFO
    format: "%(levelname)s: %(message)s"
  file:
    level: DEBUG
    filename: logs/project.log
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
