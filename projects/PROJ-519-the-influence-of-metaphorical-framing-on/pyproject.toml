[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaphor-framing-attitudes"
version = "0.1.0"
description = "The Influence of Metaphorical Framing on Attitudes Towards Mental Health Treatment"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.1.0",
    "numpy==1.24.3",
    "scipy==1.11.4",
    "statsmodels==0.14.0",
    "scikit-learn==1.3.2",
    "vaderSentiment==3.3.2",
    "seaborn==0.13.0",
    "matplotlib==3.8.0",
    "pytest==7.4.2",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (black handles this)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # Allow assert in tests

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
