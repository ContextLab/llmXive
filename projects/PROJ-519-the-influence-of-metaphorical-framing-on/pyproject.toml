[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metaphor-framing-attitudes"
version = "0.1.0"
description = "Influence of metaphorical framing on attitudes towards mental health treatment"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.1.0",
    "numpy==1.24.3",
    "scipy==1.11.4",
    "statsmodels==0.14.0",
    "scikit-learn==1.3.2",
    "vaderSentiment==3.3.2",
    "seaborn==0.13.0",
    "matplotlib==3.8.0",
    "pytest==7.4.2",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (black handles this)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["src"]
force-single-line = false
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
