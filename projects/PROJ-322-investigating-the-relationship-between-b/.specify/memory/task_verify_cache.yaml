T007:
  c: false
  h: 0c2da6008aca9626c8a9a7eeaafb2ff8bda498f5ef7db67ff7cd4f0db0ce10d2
  r: "The `code/memory_monitor.py` file exists and defines `get_current_ram_gb()`\
    \ and `is_limit_exceeded()`, but `get_current_ram_gb()` references `sys.platform`\
    \ without importing `sys`. This causes a `NameError`, which is caught and makes\
    \ the function return\u202F0.0\u202FGB, so the limit is never correctly detected\
    \ or enforced. The utility therefore does not genuinely enforce the \u22646\u202F\
    GB RAM constraint."
  sig: 2aab1083082d181c70514b4a1e0dc7dcc7a7d6d2ade52db2e8b107d4a717c0ba
T008a:
  c: false
  h: 17ee5dc50fce3d67edb26be8d951b06753a8460f3a5c8bf5fc27f86b0c6349b6
  r: 'The file `code/synthetic_data.py` exists, but it cannot run: it constructs `Subject`
    objects with fields (`time_point`, `cognitive_score`) that are not defined in
    `entities.Subject` (which requires a `group` field). This mismatch will raise
    a `TypeError` and prevents the synthetic data generator from producing any output,
    so the requirement for a functional, seeded synthetic data generator is not met.'
