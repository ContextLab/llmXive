$schema: http://json-schema.org/draft-07/schema#
title: Analysis Result Schema
description: Schema for validating the LMM analysis results output by T025.
type: object
required:
  - model_summary
  - fixed_effects
  - random_effects
  - interaction_significant
  - post_hoc_results
  - metadata
properties:
  model_summary:
    type: object
    description: Summary statistics of the fitted model.
    properties:
      log_likelihood:
        type: number
      aic:
        type: number
      bic:
        type: number
    required:
      - log_likelihood
      - aic
      - bic
  fixed_effects:
    type: array
    description: List of fixed effect estimates with statistics.
    items:
      type: object
      required:
        - term
        - estimate
        - std_err
        - t_statistic
        - p_value
        - dof
      properties:
        term:
          type: string
        estimate:
          type: number
        std_err:
          type: number
        t_statistic:
          type: number
        p_value:
          type: number
        dof:
          type: number
  random_effects:
    type: object
    description: Variance components for random effects.
    properties:
      participant:
        type: number
        description: Variance of the random intercept for participants.
      stimulus:
        type: number
        description: Variance of the random intercept for stimuli.
      residual:
        type: number
        description: Residual variance.
    required:
      - participant
      - stimulus
      - residual
  interaction_significant:
    type: boolean
    description: Whether the interaction term was statistically significant (p < 0.05).
  post_hoc_results:
    type: array
    description: Tukey-corrected pairwise comparisons (empty if interaction not significant).
    items:
      type: object
      required:
        - comparison
        - estimate
        - p_value
        - adjusted_p_value
        - significant
      properties:
        comparison:
          type: string
        estimate:
          type: number
        p_value:
          type: number
        adjusted_p_value:
          type: number
        significant:
          type: boolean
  metadata:
    type: object
    description: Metadata about the analysis run.
    properties:
      n_participants:
        type: integer
      n_stimuli:
        type: integer
      n_observations:
        type: integer
      seed:
        type: integer
    required:
      - n_participants
      - n_stimuli
      - n_observations
      - seed
additionalProperties: false
