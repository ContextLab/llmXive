$schema: http://json-schema.org/draft-07/schema#
title: AnalysisResult
description: Schema for the final aggregated analysis results.
type: object
required:
  - fixed_effects
  - random_effects
  - model_fit
  - post_hoc_results
properties:
  fixed_effects:
    type: array
    items:
      type: object
      properties:
        term:
          type: string
        estimate:
          type: number
        p_value:
          type: number
  random_effects:
    type: object
    properties:
      participant_variance:
        type: number
      stimulus_variance:
        type: number
      residual_variance:
        type: number
  model_fit:
    type: object
    properties:
      aic:
        type: number
      bic:
        type: number
      log_likelihood:
        type: number
  post_hoc_results:
    type: array
    items:
      type: object
      properties:
        comparison:
          type: string
        estimate:
          type: number
        p_value:
          type: number
        significant:
          type: boolean
