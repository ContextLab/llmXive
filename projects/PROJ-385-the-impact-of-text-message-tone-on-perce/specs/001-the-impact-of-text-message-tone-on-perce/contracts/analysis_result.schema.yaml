# Analysis Result Schema Definition
# Defines the structure for the output of the LMM analysis.
# Verified against T006 requirements.

type: object
required:
  - model_id
  - fixed_effects
  - random_effects
  - p_values
  - exclusion_summary
properties:
  model_id:
    type: string
    description: Unique identifier for the analysis run
    pattern: "^M[0-9]{3}$"
  fixed_effects:
    type: object
    description: Estimates for fixed effect coefficients
    properties:
      intercept:
        type: number
      relationship_friend:
        type: number
      cue_intensity:
        type: number
      interaction:
        type: number
  random_effects:
    type: object
    description: Variance components for random effects
    properties:
      participant_variance:
        type: number
      stimulus_variance:
        type: number
      residual_variance:
        type: number
  p_values:
    type: object
    description: P-values for fixed effects
    properties:
      relationship_friend:
        type: number
      cue_intensity:
        type: number
      interaction:
        type: number
  exclusion_summary:
    type: object
    description: Summary of excluded participants
    properties:
      total_excluded:
        type: integer
      reasons:
        type: object
        additionalProperties:
          type: integer
  post_hoc:
    type: array
    description: Tukey-corrected pairwise comparisons (optional)
    items:
      type: object
      properties:
        comparison:
          type: string
        estimate:
          type: number
        p_value:
          type: number
        significant:
          type: boolean
