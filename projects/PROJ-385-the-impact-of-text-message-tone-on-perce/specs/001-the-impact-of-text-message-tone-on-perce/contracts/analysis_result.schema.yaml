$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Result Schema"
description: "Schema for the output of the LMM analysis pipeline."
type: "object"
required:
  - model_summary
  - fixed_effects
  - random_effects
  - interaction_p_value
  - tukey_post_hoc
  - metadata
properties:
  model_summary:
    type: "object"
    description: "High-level model fit statistics."
    properties:
      log_likelihood:
        type: "number"
      aic:
        type: "number"
      bic:
        type: "number"
    required:
      - log_likelihood
      - aic
      - bic
  fixed_effects:
    type: "array"
    description: "List of fixed effect coefficients and stats."
    items:
      type: "object"
      required:
        - term
        - estimate
        - std_error
        - t_value
        - p_value
      properties:
        term:
          type: "string"
        estimate:
          type: "number"
        std_error:
          type: "number"
        t_value:
          type: "number"
        p_value:
          type: "number"
  random_effects:
    type: "object"
    description: "Variance components for random intercepts."
    required:
      - participant_variance
      - stimulus_variance
      - residual_variance
    properties:
      participant_variance:
        type: "number"
      stimulus_variance:
        type: "number"
      residual_variance:
        type: "number"
  interaction_p_value:
    type: "number"
    description: "P-value for the interaction term (Relationship x CueIntensity)."
  tukey_post_hoc:
    type: "array"
    description: "Pairwise comparisons with Tukey correction."
    items:
      type: "object"
      required:
        - comparison
        - estimate
        - p_value
        - significant
      properties:
        comparison:
          type: "string"
        estimate:
          type: "number"
        p_value:
          type: "number"
        significant:
          type: "boolean"
  metadata:
    type: "object"
    description: "Run metadata."
    required:
      - seed
      - n_observations
      - n_participants
      - n_stimuli
    properties:
      seed:
        type: "integer"
      n_observations:
        type: "integer"
      n_participants:
        type: "integer"
      n_stimuli:
        type: "integer"
      timestamp:
        type: "string"
        format: "date-time"
additionalProperties: false
