$schema: "http://json-schema.org/draft-07/schema#"
title: Analysis Result Schema
description: Schema for the final aggregated analysis results JSON.
type: object
required:
  - model_summary
  - post_hoc_results
  - exclusion_summary
  - sensitivity_analysis
properties:
  model_summary:
    type: object
    description: The LMM fixed effects summary table.
    additionalProperties: true
  post_hoc_results:
    type: array
    description: Tukey HSD post-hoc test results.
    items:
      type: object
      additionalProperties: true
  exclusion_summary:
    type: object
    description: Summary of excluded participants (e.g., straight-lining).
    properties:
      total_excluded:
        type: integer
      reasons:
        type: object
  sensitivity_analysis:
    type: array
    description: Results from sensitivity analyses using different cue weighting schemes.
    items:
      type: object
      properties:
        scheme:
          type: string
        stability_score:
          type: number
        interaction_beta:
          type: number
