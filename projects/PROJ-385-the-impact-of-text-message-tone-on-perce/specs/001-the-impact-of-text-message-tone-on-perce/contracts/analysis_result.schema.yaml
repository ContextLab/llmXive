$schema: "http://json-schema.org/draft-07/schema#"
title: Analysis Result Schema
description: Schema for the output of the LMM and sensitivity analysis.
type: object
required:
  - model_name
  - fixed_effects
  - interaction_p_value
  - sensitivity_results
properties:
  model_name:
    type: string
    description: "Name of the model variant (e.g., 'Primary', 'Emoji_Dominant')."
  fixed_effects:
    type: array
    items:
      type: object
      properties:
        term:
          type: string
        estimate:
          type: number
        p_value:
          type: number
  interaction_p_value:
    type: number
    description: "P-value for the Relationship x CueIntensity interaction term."
  sensitivity_results:
    type: object
    description: "Results of sensitivity analysis across different cue intensity definitions."
    properties:
      stability_direction:
        type: string
        description: "Whether the interaction effect direction remained consistent."
      stability_significance:
        type: string
        description: "Whether the interaction effect remained significant across variants."
      aic_comparison:
        type: object
        description: "AIC/BIC comparison between individual and aggregated models."
        properties:
          best_model:
            type: string
          delta_aic:
            type: number