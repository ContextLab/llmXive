$schema: http://json-schema.org/draft-07/schema#
title: AnalysisReady
description: Schema for the cleaned dataset ready for LMM fitting.
type: object
required:
  - participant_id
  - stimulus_id
  - relationship_type
  - rating
  - cue_intensity
  - scenario_id
properties:
  participant_id:
    type: string
    pattern: "^[a-f0-9]{64}$"
    description: Anonymized participant identifier.
  stimulus_id:
    type: string
    pattern: "^S\\d{4}$"
    description: Stimulus identifier.
  relationship_type:
    type: string
    enum:
      - friend
      - acquaintance
    description: Relationship context.
  rating:
    type: number
    minimum: 1
    maximum: 7
    description: Support rating.
  cue_intensity:
    type: string
    enum:
      - low
      - medium
      - high
    description: Cue intensity level.
  scenario_id:
    type: string
    description: Base scenario identifier.
