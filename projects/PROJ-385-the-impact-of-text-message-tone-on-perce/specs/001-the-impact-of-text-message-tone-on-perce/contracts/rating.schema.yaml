$schema: "http://json-schema.org/draft-07/schema#"
title: Rating Schema
description: Schema for participant ratings (data/raw/real_ratings.csv)
type: object
properties:
  prolific_id:
    type: string
    description: Participant's Prolific ID (will be hashed later)
  stimulus_id:
    type: string
    description: Reference to the stimulus being rated
  relationship_type:
    type: string
    enum: ["friend", "acquaintance"]
    description: The relationship context for this rating
  rating:
    type: number
    minimum: 1.0
    maximum: 7.0
    description: Perceived emotional support rating (1-7 scale)
  timestamp:
    type: string
    format: date-time
    description: When the rating was submitted
required:
  - prolific_id
  - stimulus_id
  - relationship_type
  - rating
  - timestamp
additionalProperties: false
