# Rating Schema Definition
# Defines the structure for human ratings of emotional support.
# Verified against T006 requirements.

type: object
required:
  - participant_id
  - stimulus_id
  - relationship
  - rating
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant (e.g., Prolific ID)
    pattern: "^P[A-Z0-9]{8}$"
  stimulus_id:
    type: string
    description: Reference to the stimulus being rated
    pattern: "^S[0-9]{3}$"
  relationship:
    type: string
    description: The relationship context of the message
    enum:
      - "friend"
      - "acquaintance"
  rating:
    type: integer
    description: Perceived emotional support rating on a 1-7 Likert scale
    minimum: 1
    maximum: 7
