$schema: "http://json-schema.org/draft-07/schema#"
title: "Rating Schema"
description: "Schema for human or simulated ratings of stimuli."
type: "object"
required:
  - participant_id
  - stimulus_id
  - rating
  - relationship_context
  - timestamp
properties:
  participant_id:
    type: "string"
    description: "Unique identifier for the participant (e.g., 'P-12345678')."
    pattern: "^P-\\d{8}$"
  stimulus_id:
    type: "string"
    description: "Reference to the stimulus being rated."
    pattern: "^S\\d{4}$"
  rating:
    type: "integer"
    description: "Likert scale rating of perceived emotional support."
    minimum: 1
    maximum: 7
  relationship_context:
    type: "string"
    description: "The relationship context assigned for this rating."
    enum: ["friend", "acquaintance"]
  timestamp:
    type: "string"
    format: "date-time"
    description: "Timestamp of the rating (ISO 8601)."
  mode:
    type: "string"
    description: "Indicates if data is real or simulated."
    enum: ["real", "simulation"]
additionalProperties: false
