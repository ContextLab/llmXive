$schema: "http://json-schema.org/draft-07/schema#"
title: Rating Schema
description: Schema for the participant ratings dataset.
type: object
required:
  - participant_id
  - stimulus_id
  - relationship_type
  - rating
  - timestamp
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant (Prolific ID or hashed).
    pattern: "^[P][A-Z0-9]{6,}$|^HASH[A-Z0-9]{64}$"
  stimulus_id:
    type: string
    description: Reference to the stimulus being rated.
    pattern: "^STIM\\d+$"
  relationship_type:
    type: string
    description: The relationship context of the message.
    enum:
      - friend
      - acquaintance
  rating:
    type: number
    description: The perceived emotional support rating (e.g., 1-7 Likert scale).
    minimum: 1
    maximum: 7
  timestamp:
    type: string
    description: ISO 8601 timestamp of when the rating was submitted.
    format: date-time
