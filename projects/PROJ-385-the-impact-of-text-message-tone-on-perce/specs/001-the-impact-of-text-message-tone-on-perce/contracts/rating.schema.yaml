$schema: http://json-schema.org/draft-07/schema#
title: Rating Schema
description: Schema for validating the human rating dataset (mock or real) generated by T014/T015.
type: object
required:
  - participant_id
  - stimulus_id
  - relationship_context
  - support_rating
  - timestamp
properties:
  participant_id:
    type: string
    description: Unique identifier for the participant (e.g., Prolific ID hash or 'MOCK_P_XXXX').
    minLength: 1
  stimulus_id:
    type: string
    description: Reference to the stimulus being rated.
    pattern: "^STIM_[0-9]{4}$"
  relationship_context:
    type: string
    description: The relationship context presented to the participant for this rating.
    enum:
      - friend
      - acquaintance
  support_rating:
    type: integer
    description: Likert scale rating of perceived emotional support (1-7).
    minimum: 1
    maximum: 7
  timestamp:
    type: string
    description: ISO 8601 timestamp of when the rating was submitted.
    format: date-time
additionalProperties: false
