$schema: http://json-schema.org/draft-07/schema#
title: Rating
description: Schema for a participant's rating of a stimulus.
type: object
required:
  - participant_id
  - stimulus_id
  - relationship_type
  - rating
  - timestamp
  - prolific_id
properties:
  participant_id:
    type: string
    pattern: "^[a-f0-9]{64}$"
    description: SHA-256 hash of the Prolific ID (anonymized).
  stimulus_id:
    type: string
    pattern: "^S\\d{4}$"
    description: Reference to the stimulus being rated.
  relationship_type:
    type: string
    enum:
      - friend
      - acquaintance
    description: The relationship context in which the rating was given.
  rating:
    type: number
    minimum: 1
    maximum: 7
    description: Perceived emotional support rating (1-7 Likert scale).
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the rating.
  prolific_id:
    type: string
    pattern: "^\\w+$"
    description: Original Prolific ID (before anonymization, used for consent matching).
