$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Rating Schema"
type: "object"
required:
  - "participant_id"
  - "stimulus_id"
  - "relationship_type"
  - "rating"
  - "timestamp"
properties:
  participant_id:
    type: "string"
    description: "Anonymized Prolific participant identifier."
  stimulus_id:
    type: "string"
    description: "Reference to the stimulus being rated."
  relationship_type:
    type: "string"
    enum: ["friend", "acquaintance"]
    description: "Relational context assigned to the trial."
  rating:
    type: "integer"
    minimum: 1
    maximum: 7
    description: "7‑point Likert rating of perceived emotional support."
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO‑8601 timestamp of the rating submission."
