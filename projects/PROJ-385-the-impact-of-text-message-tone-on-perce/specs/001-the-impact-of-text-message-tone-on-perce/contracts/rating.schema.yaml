$schema: "http://json-schema.org/draft-07/schema#"
title: Rating Schema
description: Schema for human ratings of perceived emotional support.
type: object
required:
  - rating_id
  - stimulus_id
  - participant_id
  - relationship_context
  - score
properties:
  rating_id:
    type: string
    description: "Unique identifier for the rating record."
  stimulus_id:
    type: string
    description: "Foreign key referencing the stimulus."
  participant_id:
    type: string
    description: "Anonymized participant identifier (e.g., P_001)."
  relationship_context:
    type: string
    description: "The relational context for this rating."
    enum:
      - "Friend"
      - "Acquaintance"
  score:
    type: integer
    description: "Perceived emotional support rating on a 7-point Likert scale."
    minimum: 1
    maximum: 7