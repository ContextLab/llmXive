$schema: http://json-schema.org/draft-07/schema#
title: LMMSummary
description: Schema for the Linear Mixed Model summary statistics.
type: object
required:
  - fixed_effect
  - estimate
  - stderr
  - z_value
  - p_value
properties:
  fixed_effect:
    type: string
    description: Name of the fixed effect (e.g., "cue_intensity", "relationship_type").
  estimate:
    type: number
    description: Coefficient estimate.
  stderr:
    type: number
    description: Standard error of the estimate.
  z_value:
    type: number
    description: Wald Z-statistic.
  p_value:
    type: number
    minimum: 0
    maximum: 1
    description: P-value associated with the Z-statistic.
