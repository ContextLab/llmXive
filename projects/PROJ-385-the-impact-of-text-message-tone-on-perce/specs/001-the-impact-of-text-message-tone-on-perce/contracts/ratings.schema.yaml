$schema: http://json-schema.org/draft-07/schema#
title: Ratings Schema
description: Schema for real human ratings collected via Prolific (data/raw/real_ratings.csv)
type: object
properties:
  rating_id:
    type: string
    description: "Unique identifier for the rating"
    pattern: "^R[0-9]{4}$"
  participant_id:
    type: string
    description: "Anonymized Prolific ID"
    pattern: "^[a-zA-Z0-9]{10,}$"
  stimulus_id:
    type: string
    description: "Reference to the stimulus"
    pattern: "^S[0-9]{3}$"
  relationship_context:
    type: string
    description: "Context of the relationship"
    enum:
      - "Close Friend"
      - "Acquaintance"
  rating_score:
    type: integer
    description: "Perceived emotional support rating (1-7)"
    minimum: 1
    maximum: 7
  timestamp:
    type: string
    description: "ISO 8601 timestamp of submission"
    format: date-time
  exclusion_flag:
    type: boolean
    description: "Flag for data exclusion (e.g., straight-lining)"
    default: false
required:
  - rating_id
  - participant_id
  - stimulus_id
  - relationship_context
  - rating_score
  - timestamp
  - exclusion_flag
additionalProperties: false