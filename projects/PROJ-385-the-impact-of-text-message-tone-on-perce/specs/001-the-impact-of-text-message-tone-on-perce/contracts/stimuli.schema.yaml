$schema: http://json-schema.org/draft-07/schema#
title: Stimuli Schema
description: Schema for the generated text message stimuli (data/raw/stimuli.csv)
type: object
properties:
  stimulus_id:
    type: string
    description: "Unique identifier for the stimulus (e.g., S001)"
    pattern: "^S[0-9]{3}$"
  base_scenario:
    type: string
    description: "The core message scenario"
    minLength: 1
  emoji_count:
    type: integer
    description: "Number of emojis used (0, 1, or 2)"
    enum:
      - 0
      - 1
      - 2
  punctuation_pattern:
    type: string
    description: "Punctuation style"
    enum:
      - "Standard"
      - "Excessive"
  length_category:
    type: string
    description: "Message length category"
    enum:
      - "Short"
      - "Long"
  full_text:
    type: string
    description: "The complete generated text message"
    minLength: 1
  cue_intensity_score:
    type: number
    description: "Calculated intensity score (0.0 to 1.0)"
    minimum: 0.0
    maximum: 1.0
required:
  - stimulus_id
  - base_scenario
  - emoji_count
  - punctuation_pattern
  - length_category
  - full_text
  - cue_intensity_score
additionalProperties: false