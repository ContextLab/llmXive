$schema: "http://json-schema.org/draft-07/schema#"
title: "Stimulus Schema"
description: "Schema for text message stimuli generated by the pipeline."
type: "object"
required:
  - stimulus_id
  - text
  - base_scenario
  - emoji_count
  - punctuation_count
  - length
  - cue_intensity
  - relationship_context
properties:
  stimulus_id:
    type: "string"
    description: "Unique identifier for the stimulus (e.g., 'S0001')."
    pattern: "^S\\d{4}$"
  text:
    type: "string"
    description: "The actual text message content."
    minLength: 1
  base_scenario:
    type: "string"
    description: "The base scenario identifier this stimulus is derived from."
  emoji_count:
    type: "integer"
    description: "Number of emojis in the text."
    minimum: 0
  punctuation_count:
    type: "integer"
    description: "Number of exclamation/question marks in the text."
    minimum: 0
  length:
    type: "integer"
    description: "Character length of the text."
    minimum: 1
  cue_intensity:
    type: "string"
    description: "Operationalized cue intensity level."
    enum: ["low", "medium", "high"]
  relationship_context:
    type: "string"
    description: "The relationship context associated with the stimulus."
    enum: ["friend", "acquaintance"]
  generated_at:
    type: "string"
    format: "date-time"
    description: "Timestamp of generation (ISO 8601)."
additionalProperties: false
