$schema: "http://json-schema.org/draft-07/schema#"
title: Stimulus Schema
description: Schema for the stimuli dataset used in the text message tone analysis.
type: object
required:
  - stimulus_id
  - text
  - emoji_count
  - punctuation_type
  - length_category
  - scenario_id
  - cue_intensity
properties:
  stimulus_id:
    type: string
    description: Unique identifier for the stimulus.
    pattern: "^STIM\\d+$"
  text:
    type: string
    description: The actual text message content.
    minLength: 1
  emoji_count:
    type: integer
    description: Number of emojis in the message.
    minimum: 0
  punctuation_type:
    type: string
    description: Type of punctuation used.
    enum:
      - Standard
      - Excessive
  length_category:
    type: string
    description: Length category of the message in words.
    enum:
      - short
      - long
  scenario_id:
    type: string
    description: ID of the base scenario this stimulus is derived from.
    pattern: "^SCEN\\d+$"
  cue_intensity:
    type: number
    description: Calculated cue intensity score based on weighting scheme.
    minimum: 0.0
    maximum: 1.0
