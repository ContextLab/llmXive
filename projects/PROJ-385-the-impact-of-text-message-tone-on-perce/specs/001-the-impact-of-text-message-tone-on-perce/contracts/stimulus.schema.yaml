$schema: http://json-schema.org/draft-07/schema#
title: Stimulus
description: Schema for a single text message stimulus used in the experiment.
type: object
required:
  - stimulus_id
  - text_content
  - base_scenario
  - emoji_count
  - punctuation_count
  - length
  - cue_intensity
  - relationship_context
properties:
  stimulus_id:
    type: string
    pattern: "^S\\d{4}$"
    description: Unique identifier for the stimulus (e.g., S0001).
  text_content:
    type: string
    minLength: 1
    description: The actual text message content.
  base_scenario:
    type: string
    enum:
      - academic_stress
      - social_conflict
      - work_pressure
      - family_concern
    description: The underlying scenario category.
  emoji_count:
    type: integer
    minimum: 0
    description: Number of emojis in the message.
  punctuation_count:
    type: integer
    minimum: 0
    description: Number of punctuation marks (exclamation/question) in the message.
  length:
    type: integer
    minimum: 1
    description: Character length of the message.
  cue_intensity:
    type: string
    enum:
      - low
      - medium
      - high
    description: Calculated intensity based on cue weighting scheme.
  relationship_context:
    type: string
    enum:
      - friend
      - acquaintance
    description: The relationship context for this stimulus instance.
