$schema: "http://json-schema.org/draft-07/schema#"
title: Stimulus Schema
description: Schema for the stimulus definition file (data/raw/stimuli.csv)
type: object
properties:
  id:
    type: string
    description: Unique identifier for the stimulus
  text:
    type: string
    description: The actual text message content
  emoji_count:
    type: integer
    minimum: 0
    description: Number of emojis in the text
  punctuation_type:
    type: string
    enum: ["none", "period", "exclamation", "question", "mixed"]
    description: Type of punctuation used
  length_category:
    type: string
    enum: ["short", "medium", "long"]
    description: Categorized length of the message
  scenario_id:
    type: string
    description: Identifier for the scenario context
  cue_intensity:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: Calculated cue intensity score
required:
  - id
  - text
  - emoji_count
  - punctuation_type
  - length_category
  - scenario_id
  - cue_intensity
additionalProperties: false
