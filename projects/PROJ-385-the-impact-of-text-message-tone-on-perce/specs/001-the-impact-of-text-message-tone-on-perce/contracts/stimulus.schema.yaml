$schema: "http://json-schema.org/draft-07/schema#"
title: Stimulus Schema
description: Schema for a single generated text message stimulus.
type: object
required:
  - stimulus_id
  - base_scenario
  - emoji_level
  - punctuation_level
  - length_level
  - cue_intensity
properties:
  stimulus_id:
    type: string
    description: "Unique identifier for the stimulus (e.g., stim_001)."
  base_scenario:
    type: string
    description: "The core message text before paralinguistic modification."
  emoji_level:
    type: integer
    description: "Level of emoji usage (0=none, 1=moderate, 2=high)."
    minimum: 0
    maximum: 2
  punctuation_level:
    type: string
    description: "Punctuation intensity level."
    enum:
      - "Low"
      - "High"
  length_level:
    type: string
    description: "Message length category."
    enum:
      - "Short"
      - "Long"
  cue_intensity:
    type: string
    description: "Derived categorical intensity (Low, Medium, High) based on feature combination."
    enum:
      - "Low"
      - "Medium"
      - "High"