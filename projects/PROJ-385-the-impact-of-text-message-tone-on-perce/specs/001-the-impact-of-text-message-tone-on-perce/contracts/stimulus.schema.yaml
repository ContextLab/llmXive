# Stimulus Schema Definition
# Defines the structure for text message stimuli used in the study.
# Verified against T006 requirements.

type: object
required:
  - id
  - text
  - emoji_count
  - punctuation_type
  - length_category
properties:
  id:
    type: string
    description: Unique identifier for the stimulus (e.g., 'S001')
    pattern: "^S[0-9]{3}$"
  text:
    type: string
    description: The actual text message content
    minLength: 1
  emoji_count:
    type: integer
    description: Number of emojis in the text
    minimum: 0
  punctuation_type:
    type: string
    description: The primary punctuation mark used (e.g., '.', '!', '?', '...')
    enum:
      - "."
      - "!"
      - "?"
      - "..."
      - ","
      - "-"
  length_category:
    type: string
    description: Categorization of message length
    enum:
      - "short"
      - "medium"
      - "long"
