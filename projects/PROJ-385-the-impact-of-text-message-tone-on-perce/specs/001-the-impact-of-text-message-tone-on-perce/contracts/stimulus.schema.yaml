$schema: http://json-schema.org/draft-07/schema#
title: Stimulus Schema
description: Schema for validating the text message stimuli dataset generated by T013.
type: object
required:
  - stimulus_id
  - text
  - base_scenario_id
  - emoji_count
  - punctuation_count
  - length
  - cue_intensity
  - relationship_context
properties:
  stimulus_id:
    type: string
    description: Unique identifier for the stimulus (e.g., 'STIM_0001').
    pattern: "^STIM_[0-9]{4}$"
  text:
    type: string
    description: The actual text message content.
    minLength: 1
  base_scenario_id:
    type: string
    description: Identifier for the base scenario this stimulus is derived from.
    pattern: "^SCENARIO_[0-9]{3}$"
  emoji_count:
    type: integer
    description: Number of emojis present in the text.
    minimum: 0
  punctuation_count:
    type: integer
    description: Number of punctuation marks (specifically exclamation/question marks) used to denote intensity.
    minimum: 0
  length:
    type: integer
    description: Character count of the text message.
    minimum: 1
  cue_intensity:
    type: string
    description: Categorical label for the cue intensity level.
    enum:
      - low
      - medium
      - high
  relationship_context:
    type: string
    description: The relationship context for this stimulus (fixed per scenario).
    enum:
      - friend
      - acquaintance
additionalProperties: false
