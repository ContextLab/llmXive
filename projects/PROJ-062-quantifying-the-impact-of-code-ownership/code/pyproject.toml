[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantifying-code-ownership"
version = "0.1.0"
description = "Automated science pipeline for quantifying code ownership impact"
requires-python = ">=3.11"
dependencies = [
    "GitPython",
    "scikit-learn",
    "scipy",
    "pandas",
    "numpy",
    "radon",
    "matplotlib",
    "pyyaml",
    "requests",
    "psutil"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["data/*", ".git/*"]
