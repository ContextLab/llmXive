$schema: "http://json-schema.org/draft-07/schema#"
title: "Precision Parameters Schema"
description: "Per‑subject precision‑weighting λ estimates from the Müller‑Lyer predictive‑coding model."
type: object
properties:
  subject_id:
    type: string
    description: "Participant identifier."
  lambda:
    type: number
    minimum: 0.01
    maximum: 10.0
    description: "Estimated precision‑weighting parameter."
  log_likelihood:
    type: number
    description: "Final log‑likelihood of the subject‑level fit."
  aic:
    type: number
    description: "Akaike Information Criterion for the subject fit."
  bic:
    type: number
    description: "Bayesian Information Criterion for the subject fit."
required:
  - subject_id
  - lambda
  - log_likelihood
  - aic
  - bic
additionalProperties: false
