$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Results Schema"
description: "JSON summary of the primary λ‑β correlation analysis."
type: object
properties:
  r:
    type: number
    description: "Pearson correlation coefficient."
  p_value:
    type: number
    description: "Two‑tailed p‑value for the correlation."
  ci_lower:
    type: number
    description: "Lower bound of the 95 % bootstrap confidence interval."
  ci_upper:
    type: number
    description: "Upper bound of the 95 % bootstrap confidence interval."
  n_subjects:
    type: integer
    minimum: 1
    description: "Number of subjects included in the correlation."
required:
  - r
  - p_value
  - ci_lower
  - ci_upper
  - n_subjects
additionalProperties: false
