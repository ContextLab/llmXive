[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predicting-molecular-surface-charge-dist"
version = "0.1.0"
description = "Predicting Molecular Surface Charge Distribution from Quantum Chemical Calculations"
requires-python = ">=3.11"
dependencies = [
    "torch==2.1.0",
    "torch-geometric==2.4.0",
    "rdkit==2023.9.1",
    "datasets==2.14.0",
    "pandas==2.1.0",
    "numpy==1.24.0",
    "scikit-learn==1.3.0",
]

[tool.ruff]
# Line length configuration
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by formatter/black)
    "B008", # Do not perform function call in argument defaults (common in dataclasses)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # Allow asserts in tests

[tool.black]
# Line length configuration
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"