$schema: "http://json-schema.org/draft-07/schema#"
title: "Molecule Schema"
description: "Schema for a single molecule in the QM9 dataset with ESP-derived charges."
type: "object"
properties:
  molecule_id:
    type: "string"
    description: "Unique identifier for the molecule."
  atomic_numbers:
    type: "array"
    items:
      type: "integer"
    description: "List of atomic numbers for each atom."
  coordinates:
    type: "array"
    items:
      type: "array"
      items:
        type: "number"
    minItems: 2
    description: "3D coordinates (x, y, z) for each atom. Normalized to center of mass."
  connectivity:
    type: "array"
    items:
      type: "array"
      items:
        type: "integer"
    description: "Adjacency matrix or edge list representing bond connectivity."
  charges:
    type: "array"
    items:
      type: "number"
    description: "Ground truth ESP-derived partial charges (Merz-Kollman)."
  scaffold_id:
    type: "integer"
    description: "Identifier for the Bemis-Murcko scaffold."
  split:
    type: "string"
    enum:
      - "train"
      - "val"
      - "test"
    description: "Data split assignment."
required:
  - molecule_id
  - atomic_numbers
  - coordinates
  - connectivity
  - charges
  - scaffold_id
  - split
additionalProperties: false
