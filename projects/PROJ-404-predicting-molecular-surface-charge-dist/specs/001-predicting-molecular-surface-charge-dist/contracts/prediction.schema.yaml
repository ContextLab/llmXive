$schema: "http://json-schema.org/draft-07/schema#"
title: "PredictionSchema"
description: "Schema for model predictions and evaluation metrics."
type: "object"
properties:
  experiment_id:
    type: "string"
    description: "Unique identifier for the experiment run."
  model_type:
    type: "string"
    enum:
      - "3D-GNN"
      - "2D-GNN"
    description: "Type of model used."
  metrics:
    type: "object"
    properties:
      mae:
        type: "number"
        description: "Mean Absolute Error."
      rmse:
        type: "number"
        description: "Root Mean Squared Error."
      pearson_r:
        type: "number"
        description: "Pearson correlation coefficient."
    required:
      - "mae"
      - "rmse"
      - "pearson_r"
  samples_processed:
    type: "integer"
    description: "Number of molecules in the test set."
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO8601 timestamp of the run."
required:
  - "experiment_id"
  - "model_type"
  - "metrics"
  - "samples_processed"
  - "timestamp"
additionalProperties: false