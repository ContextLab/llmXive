$schema: "http://json-schema.org/draft-07/schema#"
title: "Simulation Trajectory Schema"
description: "Schema for raw simulation logs generated by the MDP environment."
type: "object"
properties:
  state_id:
    type: "integer"
    description: "Unique identifier for the step within an episode."
  full_state:
    type: "string"
    description: "Serialized complete state (O, H)."
  student_observation:
    type: "string"
    description: "Serialized observable state (O) only."
  teacher_observation:
    type: "string"
    description: "Serialized teacher state (O, H)."
  privileged_variable:
    type: ["string", "integer"]
    description: "The specific hidden variable H."
  action:
    type: "integer"
    description: "Action taken (0-3)."
  reward:
    type: "number"
    description: "Immediate reward."
  next_state:
    type: "string"
    description: "Resulting state."
  done:
    type: "boolean"
    description: "Episode termination flag."
  seed:
    type: "integer"
    description: "Random seed for the episode."
  regime:
    type: "string"
    enum: ["uniform", "dopd", "randomized_weight"]
    description: "Training regime used."
  teacher_advantage:
    type: "number"
    description: "Calculated advantage gap for DOPD."
  distillation_weight:
    type: "number"
    description: "Weight w used in DOPD (1.0 for Uniform)."
required:
  - state_id
  - full_state
  - student_observation
  - teacher_observation
  - privileged_variable
  - action
  - reward
  - next_state
  - done
  - seed
  - regime
  - teacher_advantage
  - distillation_weight
additionalProperties: false