  \ API\n        next_obs, reward, terminated, truncated, info = step_result\n   \
  \     done = terminated or truncated\n    else:  # classic gym API\n        next_obs,\
  \ reward, done, info = step_result\n        terminated = done\n        truncated\
  \ = False\n    # Record transition details\n    records.append({\n        \"full_state_vector\"\
