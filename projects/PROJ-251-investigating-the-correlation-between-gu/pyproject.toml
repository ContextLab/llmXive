[tool.black]
line-length = 88
target-version = ['py311']
include = '\\.pyi?$'
exclude = '''
/(
    \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[project]
name = "investigating-gut-microbiome-influenza"
version = "0.1.0"
description = "Investigating the Correlation Between Gut Microbiome Composition and Immune Response to Influenza Vaccination"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "biom-format>=2.1.14",
    "sra-tools>=3.0.0",
    "qiime2>=2023.7.0",
    "dada2>=1.28.0",
    "python-dotenv>=1.0.0",
    "statsmodels>=0.14.0",
    "jsonschema>=4.17.0",
    "psutil>=5.9.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pytest>=7.0.0",
]