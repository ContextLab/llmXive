# Extends the configuration in pyproject.toml for specific file overrides if needed
# or can be used as a standalone config if pyproject.toml is not preferred.
# Currently, we rely on pyproject.toml for the main configuration.
# This file ensures ruff looks for config in the root if pyproject.toml is missing.

extend = "pyproject.toml"

[lint]
# Additional project-specific ignores can be added here
ignore = []

[lint.per-file-ignores]
# Allow unused imports in test files for setup purposes
"code/tests/*.py" = ["F401"]
"code/utils/__init__.py" = ["F401"]
