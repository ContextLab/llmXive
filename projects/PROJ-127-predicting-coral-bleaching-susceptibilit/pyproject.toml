[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-coral-bleaching"
version = "0.1.0"
description = "Predicting Coral Bleaching Susceptibility from Environmental Data (llmXive PROJ-127)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "llmXive PROJ-127 contributors" },
]
requires-python = ">=3.11"
keywords = ["coral", "bleaching", "machine-learning", "xgboost", "remote-sensing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "xgboost",
    "scikit-learn",
    "pandas",
    "geopandas",
    "rasterio",
    "numpy",
    "requests",
    "pyyaml",
    "pytest",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
]

[project.scripts]
coral-pipeline = "code.main:main"

[tool.setuptools]
packages = ["code"]

# NOTE: Ruff configuration lives exclusively in ruff.toml (created in T002A).
# It is intentionally NOT duplicated here: ruff refuses to run when both
# ruff.toml and [tool.ruff] in pyproject.toml are present.

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/build/
^/dist/
^/venv/
^/.venv/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"