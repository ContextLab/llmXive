[lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (handled by black)
  "B008", # do not perform function calls in argument defaults
]
exclude = [
  ".git",
  "__pycache__",
  "data",
]

[lint.isort]
known-first-party = ["config", "data_gap_report", "evaluate", "features", "ingest", "main", "map", "setup_project", "train"]
