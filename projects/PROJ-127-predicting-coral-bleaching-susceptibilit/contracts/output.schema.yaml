$schema: "http://json-schema.org/draft-07/schema#"
title: Model Output Artifacts Schema
description: >
  Schema defining the structure of all model output artifacts generated by the pipeline.
  Includes risk maps, performance metrics, and feature importance results.
type: object
required:
  - risk_map
  - metrics
  - feature_importance
  - threshold_analysis
properties:
  risk_map:
    type: object
    description: Metadata for the generated bleaching risk GeoTIFF
    required:
      - path
      - format
      - crs
      - resolution
      - value_range
    properties:
      path:
        type: string
        description: Relative path to the GeoTIFF file
      format:
        type: string
        const: "GTiff"
      crs:
        type: string
        description: Coordinate Reference System (e.g., EPSG:4326)
      resolution:
        type: object
        properties:
          x:
            type: number
          y:
            type: number
        description: Spatial resolution in degrees/meters
      value_range:
        type: object
        properties:
          min:
            type: number
            const: 0.0
          max:
            type: number
            const: 1.0
        description: Probability range [0, 1]
      bands:
        type: array
        items:
          type: object
          properties:
            band_number:
              type: integer
            description:
              type: string
            nodata_value:
              type: number
              nullable: true
  metrics:
    type: object
    description: Model performance metrics
    required:
      - roc_auc
      - auprc
      - spatial_generalization
    properties:
      roc_auc:
        type: ["number", "null"]
        minimum: 0.0
        maximum: 1.0
        description: ROC-AUC score on held-out geographic test set
      auprc:
        type: ["number", "null"]
        minimum: 0.0
        maximum: 1.0
        description: Area Under Precision-Recall Curve
      spatial_generalization:
        type: object
        description: Performance breakdown by region
        properties:
          train_region:
            type: string
          test_region:
            type: string
          delta:
            type: number
            description: Performance drop between train and test
      threshold_sensitivity:
        type: object
        properties:
          thresholds:
            type: array
            items:
              type: number
            description: List of thresholds tested
          fp_rates:
            type: array
            items:
              type: number
          fn_rates:
            type: array
            items:
              type: number
  feature_importance:
    type: object
    description: Feature importance analysis results
    required:
      - permutation_count
      - ranking
      - p_values_fdr
    properties:
      permutation_count:
        type: integer
        minimum: 1
        description: Number of permutations used (N)
      convergence_reached:
        type: boolean
        description: Whether convergence criteria were met
      ranking:
        type: array
        description: List of features ranked by importance
        items:
          type: object
          properties:
            rank:
              type: integer
            feature:
              type: string
            importance_score:
              type: number
      p_values_fdr:
        type: object
        description: Benjamini-Hochberg corrected p-values
        additionalProperties:
          type: number
          minimum: 0.0
          maximum: 1.0
      bootstrap_stability:
        type: object
        properties:
          resamples:
            type: integer
          top_3_stability_scores:
            type: array
            items:
              type: number
            description: Stability scores for top 3 features
  dominant_drivers:
    type: array
    description: Top 10 high-risk pixels with dominant drivers identified via SHAP
    items:
      type: object
      properties:
        pixel_id:
          type: string
        location:
          type: object
          properties:
            lat:
              type: number
            lon:
              type: number
        predicted_probability:
          type: number
          minimum: 0.0
          maximum: 1.0
        dominant_driver:
          type: string
        shap_value:
          type: number
  metadata:
    type: object
    properties:
      generated_at:
        type: string
        format: date-time
      model_version:
        type: string
      pipeline_version:
        type: string
      config_hash:
        type: string
        description: Hash of the configuration used for reproducibility