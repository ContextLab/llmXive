$schema: "http://json-schema.org/draft-07/schema#"
title: Reef Species Unified Dataset Schema
description: >
  Schema for the unified reef-species dataset generated by the ingestion pipeline (T014).
  Contains aligned environmental and trait features at 5-km grid resolution.
type: object
required:
  - columns
  - data_types
  - constraints
properties:
  columns:
    type: array
    description: List of column definitions
    items:
      type: object
      required:
        - name
        - type
        - description
      properties:
        name:
          type: string
          description: Column name
        type:
          type: string
          enum:
            - integer
            - float
            - string
            - boolean
            - datetime
            - geometry
          description: Data type
        description:
          type: string
          description: Human-readable description of the column
        nullable:
          type: boolean
          default: false
          description: Whether the column can contain null values
        unit:
          type: string
          description: Physical unit if applicable (e.g., 'Celsius', 'days')
        source:
          type: string
          description: Original data source (e.g., 'NOAA', 'Coral Trait DB')
  data_types:
    type: object
    description: Mapping of column names to their inferred Python/pandas types
    additionalProperties:
      type: string
  constraints:
    type: object
    description: Data quality constraints
    properties:
      row_count:
        type: integer
        minimum: 1
        description: Expected minimum number of rows
      critical_columns_non_null:
        type: array
        items:
          type: string
        description: Columns that must not contain null values
      value_ranges:
        type: object
        description: Valid value ranges for numeric columns
        additionalProperties:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
            unit:
              type: string
  metadata:
    type: object
    description: Dataset metadata
    properties:
      generated_at:
        type: string
        format: date-time
      version:
        type: string
      grid_resolution_km:
        type: integer
        enum: [5]
      sources:
        type: array
        items:
          type: string

example:
  columns:
    - name: reef_id
      type: string
      description: Unique identifier for the reef location
      nullable: false
    - name: species_id
      type: string
      description: Unique identifier for the coral species
      nullable: false
    - name: sst_mean
      type: float
      description: Mean Sea Surface Temperature
      unit: Celsius
      source: NOAA
      nullable: false
    - name: dhw_max
      type: float
      description: Maximum Degree Heating Weeks
      unit: degree-weeks
      source: NOAA
      nullable: false
    - name: thermal_tolerance
      type: float
      description: Species thermal tolerance threshold
      unit: Celsius
      source: Coral Trait DB
      nullable: false
    - name: bleaching_label
      type: integer
      description: Binary label for bleaching event (0=No, 1=Yes)
      nullable: false
    - name: trait_missing_flag
      type: boolean
      description: Flag indicating if trait data was missing
      nullable: false
  critical_columns_non_null:
    - sst_mean
    - dhw_max
    - thermal_tolerance
    - bleaching_label
  grid_resolution_km: 5
