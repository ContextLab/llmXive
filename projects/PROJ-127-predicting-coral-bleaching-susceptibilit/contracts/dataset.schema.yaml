$schema: http://json-schema.org/draft-07/schema#
title: Reef Species Unified Dataset
description: >-
  Schema for the unified reef-species dataset generated by the ingestion
  and feature engineering pipeline (Task T007, T008, T010). Contains aligned
  environmental data (SST, DHW) and coral trait data (thermal tolerance).
type: object
required:
  - fields
  - row_count
  - data_quality
properties:
  fields:
    type: array
    description: List of columns in the dataset with their types and descriptions.
    items:
      type: object
      required:
        - name
        - type
        - description
      properties:
        name:
          type: string
          description: Column name in the CSV.
        type:
          type: string
          enum:
            - integer
            - float
            - string
            - boolean
            - date
          description: Data type of the column.
        description:
          type: string
          description: Human-readable description of the column.
        source:
          type: string
          description: Origin of the data (e.g., 'NOAA', 'Coral Trait DB', 'Derived').
          nullable: true
        nullable:
          type: boolean
          default: false
          description: Whether the field allows null values.
  row_count:
    type: integer
    minimum: 0
    description: Total number of rows in the dataset.
  data_quality:
    type: object
    description: Summary of data quality checks performed.
    properties:
      null_counts:
        type: object
        description: Map of column names to null counts.
        additionalProperties:
          type: integer
      imputation_applied:
        type: boolean
        description: Whether imputation was performed on missing values.
      vif_filtering_applied:
        type: boolean
        description: Whether high-VIF features were removed.
      trait_missing_flag_count:
        type: integer
        description: Number of rows where trait data was missing.
examples:
  - fields:
      - name: reef_id
        type: string
        description: Unique identifier for the reef location.
        source: "UNEP"
        nullable: false
      - name: species_id
        type: string
        description: Unique identifier for the coral species.
        source: "Coral Trait DB"
        nullable: false
      - name: sst_mean
        type: float
        description: 30-day rolling mean Sea Surface Temperature.
        source: "NOAA"
        nullable: false
      - name: dhw
        type: float
        description: Degree Heating Weeks.
        source: "NOAA"
        nullable: false
      - name: thermal_tolerance
        type: float
        description: Species-specific thermal tolerance threshold.
        source: "Coral Trait DB"
        nullable: false
      - name: bleaching_label
        type: integer
        description: Binary label: 1 if bleaching event observed, 0 otherwise.
        source: "ReefBase"
        nullable: false
      - name: dhw_tolerance_interaction
        type: float
        description: Interaction term: DHW * thermal_tolerance.
        source: "Derived"
        nullable: false
      - name: trait_missing_flag
        type: boolean
        description: Flag indicating if species trait data was missing.
        source: "Derived"
        nullable: false
    row_count: 125000
    data_quality:
      null_counts:
        sst_mean: 0
        dhw: 0
        thermal_tolerance: 0
        bleaching_label: 0
      imputation_applied: true
      vif_filtering_applied: true
      trait_missing_flag_count: 450
