# Output Schema Definition for Ecotourism Regeneration Study
# Generated for Task T006c
# This schema defines the structure for the final analysis outputs,
# including recovery trajectories, model results, and sensitivity analysis.

pydantic_model: OutputSchema
fields:
  # --- Metadata ---
  study_id:
    type: str
    description: Unique identifier for the study run
    required: true
  run_timestamp:
    type: str
    format: date-time
    description: ISO 8601 timestamp of the analysis run
    required: true
  data_version:
    type: str
    description: Version tag of the input data used
    required: true

  # --- Site Summary Statistics ---
  total_sites_analyzed:
    type: int
    description: Total number of site pairs included in the final analysis
    required: true
  deforestation_events_detected:
    type: int
    description: Count of sites with confirmed deforestation events
    required: true
  average_recovery_slope:
    type: float
    description: Mean slope of recovery trajectories across all sites
    required: false
    nullable: true

  # --- Recovery Trajectories (List of per-site results) ---
  recovery_trajectories:
    type: list
    item_type: RecoveryTrajectorySchema
    description: Detailed trajectory parameters for each detected event
    required: true

  # --- Model Results (Linear Mixed Effects) ---
  model_results:
    type: object
    item_type: ModelResultSchema
    description: Summary of the LMM fixed effects and statistics
    required: true

  # --- Sensitivity Analysis ---
  sensitivity_analysis:
    type: list
    item_type: SensitivityResultSchema
    description: Results from sensitivity sweeps on thresholds and proxies
    required: true

  # --- Data Quality Flags ---
  data_quality_flags:
    type: object
    description: Pass/fail status for various data quality checks
    required: true
    properties:
      cloud_coverage_ok:
        type: boolean
        description: True if <10% average cloud coverage across all scenes
      revenue_data_complete:
        type: boolean
        description: True if revenue data exists for >80% of sites
      model_convergence_ok:
        type: boolean
        description: True if all models converged successfully

# Nested Schema: Recovery Trajectory
pydantic_model: RecoveryTrajectorySchema
fields:
  site_pair_id:
    type: str
    description: Unique ID for the site pair (e.g., "pair_001")
    required: true
  biome:
    type: str
    description: Biome classification of the site
    required: true
  deforestation_start_year:
    type: int
    description: Year the deforestation event began
    required: true
  deforestation_severity:
    type: float
    description: Magnitude of NDVI drop (e.g., 0.35)
    required: true
  recovery_model_type:
    type: str
    enum: [logistic, gompertz, linear_fallback]
    description: Type of model used for fitting the recovery phase
    required: true
  recovery_slope:
    type: float
    description: Rate of NDVI recovery per year
    required: true
  r_squared:
    type: float
    description: R-squared value of the fitted model
    required: true
  estimated_full_recovery_years:
    type: float
    description: Projected years to reach 95% of pre-deforestation NDVI
    required: false
    nullable: true

# Nested Schema: Model Result (LMM)
pydantic_model: ModelResultSchema
fields:
  variable_name:
    type: str
    description: Name of the predictor variable (e.g., "revenue_tier", "precipitation")
    required: true
  coefficient:
    type: float
    description: Estimated coefficient from the mixed-effects model
    required: true
  std_error:
    type: float
    description: Standard error of the coefficient
    required: true
  t_value:
    type: float
    description: T-statistic for the coefficient
    required: true
  p_value:
    type: float
    description: P-value for the coefficient
    required: true
  confidence_interval_95:
    type: list
    item_type: float
    description: 95% Confidence Interval [lower, upper]
    required: true

# Nested Schema: Sensitivity Result
pydantic_model: SensitivityResultSchema
fields:
  scenario_name:
    type: str
    description: Name of the sensitivity scenario (e.g., "high_revenue_threshold")
    required: true
  parameter_varied:
    type: str
    description: The parameter that was swept (e.g., "revenue_threshold")
    required: true
  parameter_value:
    type: float
    description: The specific value used in this scenario
    required: true
  metric_name:
    type: str
    description: Metric being compared (e.g., "slope_coefficient", "p_value")
    required: true
  metric_value:
    type: float
    description: The resulting value of the metric in this scenario
    required: true
  deviation_from_baseline:
    type: float
    description: Difference from the baseline model result
    required: true
