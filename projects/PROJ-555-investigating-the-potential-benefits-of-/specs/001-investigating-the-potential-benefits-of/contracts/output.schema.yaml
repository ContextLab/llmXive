# Output Schema Definition for Ecotourism Regeneration Analysis
# This schema defines the structure for the final analysis outputs,
# including recovery trajectories, statistical model results, and sensitivity analysis.
# Used by code/utils/schema_loader.py to generate Pydantic models.

output:
  title: "EcotourismRegenerationOutput"
  description: "Consolidated output schema for the final analysis report and intermediate artifacts."
  type: object
  properties:
    metadata:
      type: object
      description: "Run metadata and provenance"
      properties:
        run_id:
          type: string
          description: "Unique identifier for the analysis run"
        timestamp:
          type: string
          format: date-time
          description: "ISO 8601 timestamp of the analysis execution"
        version:
          type: string
          description: "Pipeline version used for this run"
        data_sources:
          type: array
          items:
            type: string
          description: "List of data sources used (e.g., Landsat, CHIRPS)"
        parameters:
          type: object
          description: "Key parameters used in the analysis (thresholds, model choices)"
          additionalProperties: true

    recovery_trajectories:
      type: array
      description: "List of recovery trajectory results for each site pair"
      items:
        type: object
        properties:
          site_id:
            type: string
            description: "Unique identifier for the site"
          pair_id:
            type: string
            description: "Identifier for the paired site group"
          deforestation_event:
            type: object
            description: "Details of the detected deforestation event"
            properties:
              start_date:
                type: string
                format: date
              end_date:
                type: string
                format: date
              severity:
                type: number
                format: float
                description: "Magnitude of NDVI drop"
          trajectory_model:
            type: string
            description: "Model type used (e.g., 'logistic', 'gompertz', 'linear_fallback')"
          parameters:
            type: object
            description: "Fitted model parameters"
            additionalProperties: true
          fit_metrics:
            type: object
            description: "Goodness of fit metrics"
            properties:
              r_squared:
                type: number
                format: float
              rmse:
                type: number
                format: float
          recovery_rate:
            type: number
            format: float
            description: "Calculated slope or rate of recovery"
          status:
            type: string
            enum: ["complete", "incomplete", "excluded"]
            description: "Recovery status classification"

    statistical_model_results:
      type: object
      description: "Results from the Linear Mixed-Effects Model (LMM)"
      properties:
        model_formula:
          type: string
          description: "R-style formula used for the model"
        fixed_effects:
          type: array
          description: "Fixed effect coefficients and statistics"
          items:
            type: object
            properties:
              term:
                type: string
              estimate:
                type: number
                format: float
              std_error:
                type: number
                format: float
              statistic:
                type: number
                format: float
              p_value:
                type: number
                format: float
              p_value_adjusted:
                type: number
                format: float
                description: "Bonferroni or Holm corrected p-value"
        random_effects:
          type: object
          description: "Random effect variance components"
          properties:
            group:
              type: string
            variance:
              type: number
            std_dev:
              type: number
        model_fit:
          type: object
          properties:
            aic:
              type: number
            bic:
              type: number
            log_likelihood:
              type: number

    sensitivity_analysis:
      type: array
      description: "Results from sensitivity analysis across different thresholds and proxies"
      items:
        type: object
        properties:
          scenario_id:
            type: string
            description: "Identifier for the scenario (e.g., 'high_revenue', 'visitor_proxy')"
          threshold_value:
            type: number
            format: float
            description: "The specific threshold value tested"
          metric:
            type: string
            description: "Metric being compared (e.g., 'revenue', 'visitor_count')"
          coefficient:
            type: number
            format: float
            description: "Main effect coefficient for this scenario"
          p_value:
            type: number
            format: float
          sensitivity_flag:
            type: boolean
            description: "True if result is sensitive to this parameter change"

    data_quality_report:
      type: object
      description: "Summary of data quality checks and flags"
      properties:
        total_sites:
          type: integer
        sites_with_deforestation:
          type: integer
        sites_with_recovery_data:
          type: integer
        missing_data_flags:
          type: array
          items:
            type: string
          description: "List of specific data gaps or issues encountered"
        pass_fail_status:
          type: string
          enum: ["PASS", "FAIL", "WARNING"]
          description: "Overall data quality status"

  required:
    - metadata
    - recovery_trajectories
    - statistical_model_results
    - sensitivity_analysis
    - data_quality_report