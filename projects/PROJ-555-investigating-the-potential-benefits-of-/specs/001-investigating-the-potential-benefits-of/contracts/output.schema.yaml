# Output Schema Definition for Ecotourism Regeneration Study
# This schema defines the structure of the final analytical outputs
# generated by the pipeline (recovery trajectories, model results, reports).
#
# Used by: code/utils/schema_loader.py to generate Pydantic models
# Referenced by: T028 (recovery_trajectories), T033 (modeling), T035 (report)

pydantic_model_name: OutputRecord

fields:
  # Primary Key
  - name: site_id
    type: str
    description: Unique identifier for the site (e.g., 'SITE_001')
    required: true

  - name: pair_id
    type: str
    description: Identifier linking the ecotourism site to its control pair
    required: true

  # Deforestation Event Details (from T023/T024)
  - name: deforestation_detected
    type: bool
    description: True if a sustained NDVI drop >= 0.30 over 2 years was detected
    required: true

  - name: deforestation_start_date
    type: date
    description: The date when the deforestation event began (if detected)
    required: false
    nullable: true

  - name: deforestation_severity
    type: float
    description: Magnitude of NDVI drop (0.0 to 1.0)
    required: false
    nullable: true
    ge: 0.0
    le: 1.0

  # Recovery Trajectory Parameters (from T025/T026/T028)
  - name: recovery_model_type
    type: str
    description: Type of model used: 'logistic', 'gompertz', or 'linear_fallback'
    required: true
    enum:
      - logistic
      - gompertz
      - linear_fallback

  - name: recovery_start_date
    type: date
    description: Start date of the recovery phase analysis
    required: true

  - name: recovery_end_date
    type: date
    description: End date of the recovery phase analysis
    required: true

  - name: asymptote
    type: float
    description: Estimated asymptotic NDVI value (carrying capacity)
    required: false
    nullable: true
    ge: 0.0
    le: 1.0

  - name: growth_rate
    type: float
    description: Estimated growth rate parameter (k)
    required: false
    nullable: true

  - name: inflection_point
    type: float
    description: Time of maximum growth rate (days from start)
    required: false
    nullable: true

  - name: r_squared
    type: float
    description: Coefficient of determination for the fitted model
    required: true
    ge: 0.0
    le: 1.0

  - name: linear_slope
    type: float
    description: Annual NDVI change rate (used if non-linear fit failed)
    required: false
    nullable: true

  # Ecotourism Metrics (from T018)
  - name: revenue_per_visitor
    type: float
    description: Average revenue per visitor (USD)
    required: false
    nullable: true

  - name: visitor_count
    type: int
    description: Total visitor count for the study period
    required: false
    nullable: true
    ge: 0

  - name: ecotourism_intensity
    type: str
    description: Categorized intensity based on thresholds: 'low', 'medium', 'high'
    required: true
    enum:
      - low
      - medium
      - high

  # Statistical Model Results (from T033 - Mixed Effects)
  - name: lme_coefficient
    type: float
    description: Coefficient for ecotourism intensity in the LMM
    required: false
    nullable: true

  - name: lme_p_value
    type: float
    description: P-value for the ecotourism coefficient
    required: false
    nullable: true
    ge: 0.0
    le: 1.0

  - name: lme_confidence_interval_lower
    type: float
    description: Lower bound of 95% CI for the coefficient
    required: false
    nullable: true

  - name: lme_confidence_interval_upper
    type: float
    description: Upper bound of 95% CI for the coefficient
    required: false
    nullable: true

  # Metadata
  - name: data_quality_flag
    type: str
    description: 'PASS' if data gaps < 50%, 'FAIL' otherwise
    required: true
    enum:
      - PASS
      - FAIL

  - name: processed_at
    type: str
    description: ISO 8601 timestamp of processing
    required: true

  - name: model_version
    type: str
    description: Version string of the processing pipeline
    required: true