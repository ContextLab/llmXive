# Pydantic-compatible schema definitions for project outputs
# Matches Plan.md contracts section and FR-004/FR-006 requirements

pydantic_models:
  FinalReport:
    description: >
      Per FR-006: Final regression and sensitivity report structure.
      Contains regression coefficients, sensitivity analysis results, and data quality flags.
    fields:
      regression_coefficients:
        type: dict
        description: Dictionary mapping variable names to coefficient values and stats.
        example: {"ecotourism_effect": 0.45, "precipitation": 0.12}
      sensitivity_analysis:
        type: list
        description: List of sensitivity analysis results across thresholds and proxies.
        items:
          type: object
          fields:
            threshold:
              type: float
              description: The threshold value used for this sensitivity sweep.
            proxy_variable:
              type: str
              description: The proxy variable used (e.g., 'revenue_usd', 'visitor_count').
            effect_size:
              type: float
              description: The calculated effect size for this configuration.
            p_value:
              type: float
              description: Raw p-value from the statistical test.
            corrected_p_value:
              type: float
              description: P-value after Bonferroni/Holm correction.
      data_quality_flags:
        type: list
        description: List of strings indicating data quality issues or flags.
        items:
          type: string
        example: ["missing_climate_data_site_42", "low_r_squared_recovery"]

  SensitivityArtifact:
    description: >
      Per FR-004: Raw sensitivity sweep data artifact.
      Contains detailed metrics for every point in the sensitivity analysis.
    fields:
      threshold:
        type: float
        description: The threshold value applied.
      proxy_variable:
        type: str
        description: The proxy variable used (e.g., 'revenue_usd', 'visitor_count').
      model_params:
        type: dict
        description: Dictionary of model parameters for this specific run.
        example: {"random_effect_variance": 0.05, "residual_variance": 0.12}
      metrics:
        type: dict
        description: Dictionary of performance metrics (R2, AIC, BIC, etc.).
        example: {"r_squared": 0.85, "aic": 120.5, "convergence": true}

# Note: This file serves as the schema definition.
# Actual Pydantic models are generated dynamically by code/utils/schema_loader.py
# using these specifications.