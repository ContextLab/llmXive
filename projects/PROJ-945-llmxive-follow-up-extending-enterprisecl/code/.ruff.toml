# This file configures Ruff for the llmXive project.
# It mirrors settings in pyproject.toml for IDE compatibility.

line-length = 88
target-version = "py39"
src = ["code/src", "code/tests"]

exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "data",
]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
]
ignore = [
    "E501",
    "B008",
]

[lint.per-file-ignores]
"code/tests/*" = ["S101"]

[lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true
