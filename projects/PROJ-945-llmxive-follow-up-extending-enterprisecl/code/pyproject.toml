[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-enterprisecrclawbench"
version = "0.1.0"
description = "EnterpriseClawBench extension for llmXive pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch-cpu",
    "transformers",
    "scikit-learn",
    "pandas",
    "networkx",
    "statsmodels",
    "pytest",
    "ruff",
    "black",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["code/src", "code/tests"]
exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "data",
    "code/setup_project_structure.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex (handled by separate check if needed)
]

[tool.ruff.lint.per-file-ignores]
"code/tests/*" = ["S101"] # Allow asserts in tests

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true
