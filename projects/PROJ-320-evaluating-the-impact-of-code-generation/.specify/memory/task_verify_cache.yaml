  r: "The `code/analysis/complexity.py` script never retrieves full source files nor\
    \ builds a control\u2011flow graph with\u202Fnetworkx as required; it only fetches\
    \ the diff and computes complexity from the added lines (or falls back to a simple\
    \ added\u202F+\u202Fremoved count). Consequently the produced `complexity_scores.csv`\
    \ contains only `loc=0` and `complexity_score=1` for every PR, showing that the\
    \ full\u2011analysis path was never exercised, violating the task specification."
