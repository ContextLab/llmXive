  r: "The `fetch_github.py` script exists and implements pagination, back\u2011off,\
    \ JSONL writing, and checksum generation, but after execution it produced only\
    \ one JSONL file (`psf_requests_prs.jsonl`) with 200 PRs and **0** `llm`\u2011\
    labelled rows. The script stopped at the 200\u2011PR cap instead of continuing\
    \ to the next repository to reach the required minimum of 10 `llm` PRs, and the\
    \ generated `data/raw/fetch_stats.json` does not record the successful run (it\
    \ shows empty stats). Consequently the verification condition \u201Cat least 10\
    \ rows are labelled `llm` (or the fallback list is exhausted)\u201D is not satisfied"
