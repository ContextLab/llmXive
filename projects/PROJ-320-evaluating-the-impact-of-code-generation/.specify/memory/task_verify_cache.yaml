  h: c470e3be292eb46051fe4220cde69b33579de822acde7e950411b1753872080f
  r: "The `manual_validation.py` script is present and includes sample\u2011size calculation\
    \ and stratified sampling, but the `execute_human_judgment_checklist` function\
