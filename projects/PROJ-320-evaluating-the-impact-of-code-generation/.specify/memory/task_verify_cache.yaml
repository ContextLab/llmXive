  r: "The classification script cannot be imported because it tries `from data.entropy_detector\
    \ import compute_entropy` while the detector lives at `code/data/entropy_detector.py`,\
    \ causing a `ModuleNotFoundError` (see unit\u2011test log). Moreover, the generated\
    \ CSV includes extra columns (`confidence_score`, `flagged_for_audit`, `review_cycles`,\
    \ `entropy_score`) that are not defined in `pr_schema.schema.yaml`, so the file\
    \ would not validate against the schema. Fix the import path and ensure the CSV\
    \ contains only the fields listed in the schema (or update the schema accordingly)."
