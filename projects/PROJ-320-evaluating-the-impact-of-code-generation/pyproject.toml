[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-research"
version = "0.1.0"
description = "Automated science pipeline for evaluating LLM code generation impact"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "scipy",
    "networkx",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "statsmodels",
    "pytest",
    "pycodestyle",
    "ruff",
    "black",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.venv
    | venv
    | __pycache__
)/
'''

[tool.ruff]
# Same as Black's default line length
line-length = 100
target-version = "py311"

# Exclude common build artifacts and caches
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".venv",
    "venv",
    "__pycache__",
    "data",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501", # Line too long (handled by black)
    "F403", # 'from module import *' used; unable to detect undefined names
]

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in test files if necessary
"tests/**/*.py" = ["E501"]
# Allow imports in __init__.py without unused warnings
"code/**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
