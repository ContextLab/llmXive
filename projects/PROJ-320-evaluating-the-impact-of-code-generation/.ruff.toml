# Ruff configuration file
# This file is redundant with pyproject.toml but provided for IDE compatibility
line-length = 88
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501", "B008", "C901"]

[lint.isort]
known-first-party = ["utils", "data", "analysis", "audit"]
force-sort-within-sections = true
