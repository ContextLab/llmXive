$schema: "http://json-schema.org/draft-07/schema#"
title: "Statistical Result Schema"
description: "Schema for the output of hypothesis tests (Mann-Whitney U primary, t-test sensitivity)."
type: "object"
properties:
  metric_name:
    type: "string"
    description: "Name of the metric tested (e.g., 'comment_density')"
  group_a_mean:
    type: "number"
    description: "Mean value for the LLM group"
  group_b_mean:
    type: "number"
    description: "Mean value for the Human group"
  u_statistic:
    type: "number"
    description: "Calculated Mann-Whitney U statistic (Primary)"
  t_statistic:
    type: "number"
    description: "Calculated t-statistic (Sensitivity only)"
  p_value_u:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Calculated p-value for Mann-Whitney U"
  p_value_t:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Calculated p-value for t-test (Sensitivity)"
  effect_size_u:
    type: "number"
    description: "Rank-biserial correlation (Primary)"
  effect_size_t:
    type: "number"
    description: "Cohen's d (Sensitivity)"
  is_significant_u:
    type: "boolean"
    description: "True if p_value_u < 0.05"
  is_significant_t:
    type: "boolean"
    description: "True if p_value_t < 0.05"
  sample_size_a:
    type: "integer"
    minimum: 1
    description: "Sample size for LLM group"
  sample_size_b:
    type: "integer"
    minimum: 1
    description: "Sample size for Human group"
required:
  - metric_name
  - group_a_mean
  - group_b_mean
  - u_statistic
  - p_value_u
  - effect_size_u
  - is_significant_u
  - sample_size_a
  - sample_size_b
additionalProperties: false
