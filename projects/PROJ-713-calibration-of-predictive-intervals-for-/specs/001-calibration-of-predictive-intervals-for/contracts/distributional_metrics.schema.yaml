$schema: "http://json-schema.org/draft-07/schema#"
title: "Distributional Metrics Schema"
type: "object"
description: "Schema for results/distributional_metrics.csv containing PIT and CRPS metrics."
properties:
  series_id:
    type: "string"
    description: "Unique identifier for the time series."
  model:
    type: "string"
    description: "Model name (ARIMA, Prophet, LSTM)."
    enum:
      - "ARIMA"
      - "Prophet"
      - "LSTM"
  pit_p_value:
    type: "number"
    description: "P-value from Ljung-Box test for PIT uniformity."
    minimum: 0.0
    maximum: 1.0
  crps_score:
    type: "number"
    description: "Continuous Ranked Probability Score."
    minimum: 0.0
required:
  - "series_id"
  - "model"
  - "pit_p_value"
  - "crps_score"
additionalProperties: false