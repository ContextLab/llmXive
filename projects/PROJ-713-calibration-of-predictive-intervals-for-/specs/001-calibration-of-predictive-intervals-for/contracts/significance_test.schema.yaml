$schema: "http://json-schema.org/draft-07/schema#"
title: "Significance Test Schema"
type: "object"
description: "Schema for results/significance_test.csv containing bootstrap test results."
properties:
  model_a:
    type: "string"
    description: "First model in the comparison."
  model_b:
    type: "string"
    description: "Second model in the comparison."
  metric:
    type: "string"
    description: "Metric being compared (e.g., coverage_deviation)."
  p_value:
    type: "number"
    description: "P-value from the paired bootstrap test."
    minimum: 0.0
    maximum: 1.0
  is_significant:
    type: "boolean"
    description: "True if p_value < 0.05."
required:
  - "model_a"
  - "model_b"
  - "metric"
  - "p_value"
  - "is_significant"
additionalProperties: false