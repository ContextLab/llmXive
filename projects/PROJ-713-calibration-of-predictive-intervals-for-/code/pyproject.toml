[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-calibration"
version = "0.1.0"
description = "Calibration of Predictive Intervals for Time-Series Forecasts"
requires-python = ">=3.11"
dependencies = [
    "statsmodels",
    "prophet",
    "torch",
    "properscoring",
    "scikit-learn",
    "scipy",
    "pandas",
    "numpy",
    "matplotlib",
    "flake8",
    "black",
    "isort",
    "pre-commit"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | \.eggs
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = [".git", ".venv", "env", "venv", "build", "dist", ".eggs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
