[metadata]
name = predictive-interval-calibration
version = 0.1.0
description = Calibration of predictive intervals for time-series forecasts
author = llmXive Research Team
license = MIT

[options]
packages = find:
python_requires = >=3.11
install_requires =
    pandas>=2.1.0
    numpy>=1.26.0
    statsmodels>=0.14.0
    prophet>=1.1.0
    torch>=2.1.0
    properscoring>=0.1
    scikit-learn>=1.3.0
    scipy>=1.11.0
    matplotlib>=3.8.0
    tqdm>=4.66.0
    pyyaml>=6.0

[options.packages.find]
where = .
exclude =
    tests*

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    venv,
    env,
    .eggs,
    *.egg-info,
per-file-ignores =
    */__init__.py: F401
    tests/*: F401

[isort]
profile = black
line_length = 100
skip = .venv,venv,env
