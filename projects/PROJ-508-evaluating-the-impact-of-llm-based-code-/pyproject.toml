[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-xive-evaluation"
version = "0.1.0"
description = "Evaluating the Impact of LLM-Based Code Completion on Developer Cognitive Load"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "requests",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "scipy",
    "ruff",
    "black",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
include = ["code/**/*.py", "tests/**/*.py"]
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "data",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"code/__init__.py" = ["F401"]
"code/utils/__init__.py" = ["F401"]
"tests/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["code", "tests"]
known-third-party = ["pandas", "numpy", "requests", "sklearn", "statsmodels", "matplotlib", "seaborn", "yaml", "scipy"]
force-sort-within-sections = true