$schema: "http://json-schema.org/draft-07/schema#"
title: "PairOutcome"
type: object
required:
  - pair_id
  - vulnerability_type
  - human_flag
  - llm_flag
properties:
  pair_id:
    type: string
    description: "Identifier linking the human and LLM CodeSample (functionality_id)."
  vulnerability_type:
    type: string
    description: "OWASP Top 10 category."
  human_flag:
    type: boolean
    description: "True if vulnerability detected in human code."
  llm_flag:
    type: boolean
    description: "True if vulnerability detected in LLM code."
