$schema: "http://json-schema.org/draft-07/schema#"
title: "SimulatedWaveform"
description: "Schema for ground‑truth and quantized gravitational wave signals."
type: "object"
properties:
  waveform_id:
    type: "string"
    description: "Unique UUID for the waveform."
  params:
    type: "object"
    properties:
      mass_1:
        type: "number"
        description: "Primary mass in solar masses (10‑50)."
      mass_2:
        type: "number"
        description: "Secondary mass in solar masses (10‑50)."
      spin_1z:
        type: "number"
        description: "Primary spin component ([-0.9, 0.9])."
      spin_2z:
        type: "number"
        description: "Secondary spin component ([-0.9, 0.9])."
      luminosity_distance:
        type: "number"
        description: "Luminosity distance in Mpc (100‑1000)."
    required: ["mass_1", "mass_2", "luminosity_distance"]
  snr:
    type: "number"
    description: "Injected Signal‑to‑Noise Ratio."
  sampling_rate:
    type: "number"
    description: "Sampling rate in Hz"
    minimum: 0
  duration:
    type: "number"
    description: "Signal duration in seconds"
    minimum: 0
  bit_depth:
    type: "integer"
    description: "Bit depth of quantization (0 for float64 baseline, otherwise 1‑16)."
  fsr:
    type: "number"
    description: "Fixed full‑scale range used for quantization."
  step_size:
    type: "number"
    description: "Amplitude resolution of the quantizer."
  data_type:
    type: "string"
    enum: ["float64", "quantized"]
    description: "Indicates whether the waveform is baseline or quantized."
required: ["waveform_id", "params", "snr", "sampling_rate", "duration", "bit_depth", "fsr", "step_size", "data_type"]