$schema: "http://json-schema.org/draft-07/schema#"
title: "SimulatedWaveform"
description: "Schema for ground‑truth and quantized gravitational wave signals."
type: "object"
properties:
  waveform_id:
    type: "string"
    description: "Unique UUID for the waveform."
  params:
    type: "object"
    properties:
      mass_1:
        type: "number"
        description: "Primary mass in solar masses (10‑50)."
      mass_2:
        type: "number"
        description: "Secondary mass in solar masses (10‑50)."
      spin_1z:
        type: "number"
        description: "Primary spin component ([-0.9, 0.9])."
      spin_2z:
        type: "number"
        description: "Secondary spin component ([-0.5, 0.5])."
    required: ["mass_1", "mass_2", "spin_1z", "spin_2z"]
  snr:
    type: "number"
    description: "Injected Signal‑to‑Noise Ratio."
  sampling_rate:
    type: "number"
    description: "Sampling rate in Hz."
  duration:
    type: "number"
    description: "Signal duration in seconds."
  data_type:
    type: "string"
    enum: ["float64", "quantized"]
    description: "Indicates whether this entry is a baseline (float64) or a quantized signal."
required: ["waveform_id", "params", "snr", "sampling_rate", "duration", "data_type"]