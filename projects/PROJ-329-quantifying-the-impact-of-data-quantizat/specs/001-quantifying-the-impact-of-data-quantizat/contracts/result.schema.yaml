$schema: "http://json-schema.org/draft-07/schema#"
title: "ParameterEstimationResult"
description: "Schema for inference results and error metrics."
type: "object"
properties:
  waveform_id:
    type: "string"
    description: "Reference to the source waveform."
  bit_depth:
    type: ["integer", "null"]
    description: "Bit depth used for this signal (null for float64 baseline)."
  inference_method:
    type: "string"
    enum: ["MCMC", "Fisher", "Hybrid"]
    description: "Method used for parameter estimation (plan uses MCMC uniformly across all SNR ranges)."
  mean_params:
    type: "object"
    properties:
      chirp_mass:
        type: "number"
      spin:
        type: "number"
      distance:
        type: "number"
    required: ["chirp_mass", "distance"]
  mse:
    type: "object"
    properties:
      chirp_mass:
        type: "number"
        description: "Mean Squared Error for chirp mass."
      spin:
        type: "number"
        description: "Mean Squared Error for spin."
      distance:
        type: "number"
        description: "Mean Squared Error for luminosity distance."
    required: ["chirp_mass", "distance"]
  convergence_status:
    type: "string"
    enum: ["success", "failed", "non-detection"]
    description: "Status of the inference run."
  snr:
    type: "number"
    description: "SNR of the injected signal."
  delta:
    type: "object"
    description: "Per-parameter quantization-induced bias (Δ_k = E_quant,k − E_inst,k)."
    properties:
      chirp_mass:
        type: "number"
      spin:
        type: "number"
      distance:
        type: "number"
required: ["waveform_id", "bit_depth", "mean_params", "mse", "convergence_status", "snr", "delta"]