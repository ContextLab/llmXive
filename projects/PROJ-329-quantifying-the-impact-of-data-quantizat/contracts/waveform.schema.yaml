$schema: http://json-schema.org/draft-07/schema#
title: Gravitational Waveform Quantization Dataset Schema
description: |
  Schema for the pilot dataset containing quantized gravitational waveforms.
  Generated by src/data_generation.py and stored in data/processed/.
  Covers binary black hole (BBH) mergers with IMRPhenomPv2 waveforms,
  injected into LIGO O3 noise, and quantized at various bit depths.
type: object
required:
  - metadata
  - waveforms
properties:
  metadata:
    type: object
    description: Global dataset metadata
    required:
      - version
      - generated_at
      - seed
      - generator_script
      - bit_depths
      - snr_bins
      - total_signals
    properties:
      version:
        type: string
        description: Schema version (e.g., "1.0.0")
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation
      seed:
        type: integer
        description: Random seed used for reproducibility
      generator_script:
        type: string
        description: Path to the script that generated this dataset
      bit_depths:
        type: array
        items:
          type: integer
        description: List of bit depths used (e.g., [1, 8, 10, 12, 14, 16])
      snr_bins:
        type: array
        items:
          type: object
          properties:
            label:
              type: string
            min:
              type: number
            max:
              type: number
        description: SNR stratification bins
      total_signals:
        type: integer
        description: Total number of signals in the dataset
  waveforms:
    type: array
    description: Array of waveform records
    items:
      type: object
      required:
        - signal_id
        - injection_params
        - quantization_params
        - snr_metrics
        - data_pointers
      properties:
        signal_id:
          type: string
          description: Unique identifier for this signal (e.g., "sig_0001")
        injection_params:
          type: object
          description: Ground truth injection parameters
          required:
            - chirp_mass
            - mass_ratio
            - spin_1
            - spin_2
            - distance_mpc
            - true_snr
            - snr_bin_label
          properties:
            chirp_mass:
              type: number
              description: Chirp mass in solar masses (M☉)
            mass_ratio:
              type: number
              description: Mass ratio q = m2/m1 (0 < q <= 1)
            spin_1:
              type: number
              description: Dimensionless spin magnitude of primary
            spin_2:
              type: number
              description: Dimensionless spin magnitude of secondary
            distance_mpc:
              type: number
              description: Luminosity distance in Mpc
            true_snr:
              type: number
              description: Injected Signal-to-Noise Ratio
            snr_bin_label:
              type: string
              description: Label of the SNR bin this signal belongs to
        quantization_params:
          type: object
          description: Quantization configuration for this record
          required:
            - bit_depth
            - fsr
            - num_levels
          properties:
            bit_depth:
              type: integer
              description: Number of bits used for quantization
            fsr:
              type: number
              description: Full-Scale Range used for fixed quantization
            num_levels:
              type: integer
              description: Number of discrete levels (2^bit_depth)
        snr_metrics:
          type: object
          description: Measured SNR metrics post-quantization
          required:
            - measured_snr
            - snr_error
          properties:
            measured_snr:
              type: number
              description: Measured SNR after quantization
            snr_error:
              type: number
              description: Difference between measured and true SNR
        data_pointers:
          type: object
          description: Pointers to the actual data stored in HDF5 groups
          required:
            - h5_path_quantized
            - h5_path_baseline
            - h5_path_noise
          properties:
            h5_path_quantized:
              type: string
              description: HDF5 group path for quantized waveform data
            h5_path_baseline:
              type: string
              description: HDF5 group path for float64 baseline waveform
            h5_path_noise:
              type: string
              description: HDF5 group path for injected noise realization
additionalProperties: false
