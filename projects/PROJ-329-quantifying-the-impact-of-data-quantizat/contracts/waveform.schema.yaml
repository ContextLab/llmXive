$schema: http://json-schema.org/draft-07/schema#
title: Gravitational Waveform Dataset Schema
description: |
  Schema for the pilot dataset containing binary black hole waveforms,
  injected into LIGO O3 noise, and quantized at various bit depths.
  This schema validates the structure of records in the HDF5 dataset
  (conceptually mapped to JSON for validation logic).
type: object
required:
  - metadata
  - signals
properties:
  metadata:
    type: object
    description: Global dataset information
    required:
      - version
      - created_at
      - seed
      - bit_depths
      - snr_bins
      - total_signals
    properties:
      version:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+$"
        description: Schema version
      created_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp
      seed:
        type: integer
        description: Random seed used for generation
      bit_depths:
        type: array
        items:
          type: integer
        description: List of bit depths applied (e.g., [1, 8, 10, 12, 14, 16])
      snr_bins:
        type: array
        items:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        description: List of [min, max] SNR ranges
      total_signals:
        type: integer
        description: Total number of unique signals generated
      generator:
        type: string
        description: Name of the generation script
      noise_psd_source:
        type: string
        description: Source of the noise PSD (e.g., "LIGO_O3")

  signals:
    type: array
    description: Array of signal records
    items:
      type: object
      required:
        - signal_id
        - injection_params
        - quantization_results
      properties:
        signal_id:
          type: string
          description: Unique identifier for this signal instance
        injection_params:
          type: object
          description: Ground truth parameters of the injected signal
          required:
            - chirp_mass
            - mass_ratio
            - spin_1
            - spin_2
            - distance_mpc
            - snr_target
            - snr_actual
            - time_injection
          properties:
            chirp_mass:
              type: number
              description: Chirp mass in Solar Masses (M☉)
            mass_ratio:
              type: number
              minimum: 0.1
              maximum: 1.0
              description: Mass ratio q = m2/m1
            spin_1:
              type: array
              items:
                type: number
              minItems: 3
              maxItems: 3
              description: Dimensionless spin vector of primary
            spin_2:
              type: array
              items:
                type: number
              minItems: 3
              maxItems: 3
              description: Dimensionless spin vector of secondary
            distance_mpc:
              type: number
              minimum: 0
              description: Luminosity distance in Mpc
            snr_target:
              type: number
              description: Target SNR bin center
            snr_actual:
              type: number
              description: Actual measured SNR after injection
            time_injection:
              type: number
              description: Injection time in seconds relative to start
        quantization_results:
          type: object
          description: Results for each bit depth applied to this signal
          additionalProperties:
            type: object
            required:
              - waveform_quantized
              - waveform_baseline
              - unique_levels
              - snr_preserved
            properties:
              waveform_quantized:
                type: array
                items:
                  type: number
                description: Quantized strain data (float32/float64)
              waveform_baseline:
                type: array
                items:
                  type: number
                description: Original float64 baseline waveform
              unique_levels:
                type: integer
                description: Number of unique quantization levels observed
              snr_preserved:
                type: number
                description: SNR calculated on the quantized signal
              mse_to_baseline:
                type: number
                description: Mean Squared Error against baseline
              clipping_ratio:
                type: number
                description: Ratio of samples clipped to FSR boundaries
