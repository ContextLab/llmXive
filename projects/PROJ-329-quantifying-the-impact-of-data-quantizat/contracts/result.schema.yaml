$schema: http://json-schema.org/draft-07/schema#
title: Inference Result Schema
description: |
  Schema for Bayesian parameter estimation results.
  Contains posterior samples, point estimates, and diagnostics for
  each quantized signal processed.
type: object
required:
  - metadata
  - results
properties:
  metadata:
    type: object
    description: Run-level metadata
    required:
      - version
      - created_at
      - seed
      - inference_engine
      - mcmc_steps
      - burn_in_steps
    properties:
      version:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+$"
      created_at:
        type: string
        format: date-time
      seed:
        type: integer
      inference_engine:
        type: string
        description: Engine used (e.g., "bilby", "pycbc")
      mcmc_steps:
        type: integer
        minimum: 1000
      burn_in_steps:
        type: integer
        minimum: 0
      convergence_threshold:
        type: number
        description: Gelman-Rubin or similar threshold used

  results:
    type: array
    description: List of inference results per signal
    items:
      type: object
      required:
        - signal_id
        - bit_depth
        - snr_bin
        - status
        - posterior_samples
      properties:
        signal_id:
          type: string
          description: Reference to the input signal
        bit_depth:
          type: integer
          description: Bit depth of the quantized signal used
        snr_bin:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: SNR bin [min, max]
        status:
          type: string
          enum:
            - converged
            - failed
            - non_detection
          description: Inference status
        injected_params:
          type: object
          description: Ground truth for comparison
          required:
            - chirp_mass
            - mass_ratio
            - distance_mpc
          properties:
            chirp_mass:
              type: number
            mass_ratio:
              type: number
            distance_mpc:
              type: number
        recovered_params:
          type: object
          description: Point estimates (posterior means/medians)
          required:
            - chirp_mass_mean
            - chirp_mass_std
            - mass_ratio_mean
            - mass_ratio_std
            - distance_mpc_mean
            - distance_mpc_std
            - spin_1_mean
            - spin_2_mean
          properties:
            chirp_mass_mean:
              type: number
            chirp_mass_std:
              type: number
            mass_ratio_mean:
              type: number
            mass_ratio_std:
              type: number
            distance_mpc_mean:
              type: number
            distance_mpc_std:
              type: number
            spin_1_mean:
              type: array
              items:
                type: number
            spin_2_mean:
              type: array
              items:
                type: number
            credible_interval_90:
              type: object
              description: 90% credible intervals
              properties:
                chirp_mass:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                mass_ratio:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                distance_mpc:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
        diagnostics:
          type: object
          description: Convergence and quality metrics
          properties:
            gelman_rubin:
              type: number
              description: R-hat statistic
            effective_sample_size:
              type: integer
              description: ESS for key parameters
            log_likelihood_max:
              type: number
            log_prior_max:
              type: number
            log_evidence:
              type: number
              description: Log Bayes factor or evidence estimate
        mse_metrics:
          type: object
          description: MSE against ground truth
          properties:
            mse_chirp_mass:
              type: number
            mse_mass_ratio:
              type: number
            mse_distance:
              type: number
            relative_bias_chirp_mass:
              type: number
              description: (recovered - injected) / injected
            relative_bias_mass_ratio:
              type: number
            relative_bias_distance:
              type: number
        failure_reason:
          type: string
          description: Reason for failure if status != 'converged'
