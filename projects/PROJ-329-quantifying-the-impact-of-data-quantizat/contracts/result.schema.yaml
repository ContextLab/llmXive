$schema: http://json-schema.org/draft-07/schema#
title: Parameter Estimation Result Schema
description: |
  Schema for Bayesian parameter estimation results.
  Generated by src/inference_engine.py and stored in data/results/.
  Contains posterior samples, point estimates, and metrics for quantized signals.
type: object
required:
  - metadata
  - results
properties:
  metadata:
    type: object
    description: Global result metadata
    required:
      - version
      - generated_at
      - inference_script
      - inference_config
      - total_signals_processed
      - total_signals_failed
    properties:
      version:
        type: string
        description: Schema version
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp
      inference_script:
        type: string
        description: Path to the inference script used
      inference_config:
        type: object
        description: Configuration used for the inference run
        properties:
          sampler:
            type: string
          n_walkers:
            type: integer
          n_steps:
            type: integer
          prior_type:
            type: string
      total_signals_processed:
        type: integer
        description: Number of signals successfully processed
      total_signals_failed:
        type: integer
        description: Number of signals that failed (non-detections)
  results:
    type: array
    description: Array of inference result records
    items:
      type: object
      required:
        - signal_id
        - injection_params
        - quantization_params
        - inference_status
        - posterior_summary
      properties:
        signal_id:
          type: string
          description: Unique identifier matching the waveform dataset
        injection_params:
          type: object
          description: Ground truth parameters used for injection
          required:
            - chirp_mass
            - mass_ratio
            - spin_1
            - spin_2
            - distance_mpc
            - true_snr
          properties:
            chirp_mass:
              type: number
            mass_ratio:
              type: number
            spin_1:
              type: number
            spin_2:
              type: number
            distance_mpc:
              type: number
            true_snr:
              type: number
        quantization_params:
          type: object
          description: Quantization parameters for this signal
          required:
            - bit_depth
            - snr_bin_label
          properties:
            bit_depth:
              type: integer
            snr_bin_label:
              type: string
        inference_status:
          type: string
          enum:
            - success
            - non_detection
            - failed_convergence
            - error
          description: Status of the inference run
        posterior_summary:
          type: object
          description: Summary statistics of the posterior distribution
          required:
            - recovered_params
            - credible_intervals_90
          properties:
            recovered_params:
              type: object
              description: Point estimates (e.g., posterior means or medians)
              properties:
                chirp_mass:
                  type: number
                mass_ratio:
                  type: number
                spin_1:
                  type: number
                spin_2:
                  type: number
                distance_mpc:
                  type: number
                snr:
                  type: number
            credible_intervals_90:
              type: object
              description: 90% credible intervals for each parameter
              properties:
                chirp_mass:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                mass_ratio:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                spin_1:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                spin_2:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                distance_mpc:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                snr:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
        metrics:
          type: object
          description: Derived metrics (e.g., MSE, bias)
          properties:
            mse_chirp_mass:
              type: number
            mse_distance:
              type: number
            relative_bias_chirp_mass:
              type: number
            relative_bias_distance:
              type: number
        error_details:
          type: object
          description: Error details if inference_status is 'error' or 'failed_convergence'
          properties:
            error_type:
              type: string
            message:
              type: string
additionalProperties: false
