$schema: "http://json-schema.org/draft-07/schema#"
title: "Structural Connectome Metadata"
description: "Schema for per-subject metadata.json produced after structural processing."
type: "object"
properties:
  subject_id:
    type: "string"
    description: "Pseudonymous dataset subject identifier."
  status:
    type: "string"
    enum:
      - "complete"
      - "skipped"
      - "error"
      - "gated_no_structural_data"
    description: "Processing status; 'gated_no_structural_data' when no verified open structural source is available."
  reason:
    type: ["string", "null"]
    description: "Reason for skip/error/gating; null if complete."
  seed:
    type: "integer"
    const: 42
  provenance:
    type: "object"
    properties:
      source_description:
        type: "string"
        description: "Description of the real structural source; no fabricated sources."
      source_url:
        type: ["string", "null"]
        description: "Verified URL of the source, or null if unverified/gated."
      derivation:
        type: "string"
        description: "Documented derivation chain from raw source to binary adjacency."
    required:
      - "source_description"
      - "source_url"
      - "derivation"
  file_paths:
    type: "object"
    properties:
      structural:
        type: ["string", "null"]
        description: "Relative path to binary adjacency .npy, or null if gated."
      rsfc:
        type: "string"
    required:
      - "structural"
      - "rsfc"
required:
  - "subject_id"
  - "status"
  - "seed"
  - "provenance"
  - "file_paths"
additionalProperties: false
