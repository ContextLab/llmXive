$schema: "http://json-schema.org/draft-07/schema#"
title: "Motif Profile Schema"
description: "Schema for per-subject motif z-score profiles."
type: "object"
properties:
  subject_id:
    type: "string"
  motif_z_scores:
    type: "object"
    description: "Map of motif identifier (3-node and 4-node classes) to z-score."
    additionalProperties:
      type: "number"
  null_model_params:
    type: "object"
    properties:
      iterations:
        type: "integer"
        minimum: 1000
      method:
        type: "string"
        const: "degree_preserving_undirected"
      seed:
        type: "integer"
        const: 42
    required:
      - "iterations"
      - "method"
      - "seed"
  elapsed_seconds:
    type: "number"
    description: "Wall-clock enumeration time; must be <= 300 per SC-002."
required:
  - "subject_id"
  - "motif_z_scores"
  - "null_model_params"
  - "elapsed_seconds"
additionalProperties: false
