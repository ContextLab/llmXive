$schema: "http://json-schema.org/draft-07/schema#"
title: "Motif Profile Schema"
description: "Schema for motif z-score profiles per subject"
type: "object"
properties:
  subject_id:
    type: "string"
  motif_z_scores:
    type: "object"
    description: "Map of motif type to z-score"
    additionalProperties:
      type: "number"
      description: "Z-score for the motif type"
  null_model_params:
    type: "object"
    properties:
      iterations:
        type: "integer"
        description: "Number of null model iterations"
      method:
        type: "string"
        description: "Method used (e.g., 'degree_preserving')"
required:
  - subject_id
  - motif_z_scores
  - null_model_params
additionalProperties: false