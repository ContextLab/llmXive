$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Manifest Schema"
description: "Schema for manifest.json tracking processed subjects and data integrity."
type: "object"
properties:
  cohort_target:
    type: "integer"
    const: 50
    description: "Target number of subjects."
  cohort_actual:
    type: "integer"
    minimum: 0
    description: "Number of subjects successfully processed."
  cohort_skipped:
    type: "integer"
    minimum: 0
    description: "Number of subjects skipped due to missing data."
  structural_data_available:
    type: "boolean"
    description: "True if real structural connectomes were obtainable; false means motif-association stage is gated."
  subjects:
    type: "array"
    items:
      type: "object"
      properties:
        subject_id:
          type: "string"
        status:
          type: "string"
          enum:
            - "processed"
            - "skipped"
            - "error"
        structural_path:
          type: ["string", "null"]
        rsfc_path:
          type: ["string", "null"]
        error_message:
          type: ["string", "null"]
      required:
        - "subject_id"
        - "status"
      additionalProperties: false
  checksums:
    type: "object"
    description: "SHA-256 checksums of raw data files (filename -> hex digest)."
    additionalProperties:
      type: "string"
required:
  - "cohort_target"
  - "cohort_actual"
  - "cohort_skipped"
  - "structural_data_available"
  - "subjects"
  - "checksums"
additionalProperties: false
