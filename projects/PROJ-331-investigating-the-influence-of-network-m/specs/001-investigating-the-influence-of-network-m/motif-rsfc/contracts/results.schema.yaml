$schema: http://json-schema.org/draft-07/schema#
title: Correlation Results Schema
description: |
  Schema for the statistical correlation results between motif z-scores,
  resting-state functional connectivity (rsFC) strength, and global efficiency.
  This file corresponds to `results/correlation_results.json` generated by T030c.
type: object
required:
  - metadata
  - correlations
properties:
  metadata:
    type: object
    description: Execution and configuration metadata for the analysis.
    required:
      - timestamp
      - bonferroni_alpha
      - n_motifs_tested
      - control_variable
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the analysis was run.
      bonferroni_alpha:
        type: number
        description: The Bonferroni-adjusted alpha level used for significance testing.
      n_motifs_tested:
        type: integer
        minimum: 1
        description: Total number of directed 3-node motifs tested.
      control_variable:
        type: string
        description: The name of the control variable used in partial correlation (must be 'global_node_degree').
        enum:
          - global_node_degree
      method:
        type: string
        description: The correlation method used (Pearson or Spearman).
        enum:
          - pearson
          - spearman
  correlations:
    type: object
    description: |
      Mapping of motif IDs to their correlation statistics.
      Keys are motif identifiers (e.g., 'M1', 'M2', ... 'M13').
    additionalProperties:
      type: object
      required:
        - r
        - p
        - p_bonferroni
        - significant
        - n_samples
      properties:
        r:
          type: number
          description: The partial correlation coefficient.
        p:
          type: number
          minimum: 0
          maximum: 1
          description: The uncorrected p-value.
        p_bonferroni:
          type: number
          minimum: 0
          maximum: 1
          description: The Bonferroni-corrected p-value.
        significant:
          type: boolean
          description: True if p_bonferroni < 0.05 (or adjusted alpha).
        n_samples:
          type: integer
          minimum: 1
          description: Number of subjects included in this correlation.
        confidence_interval:
          type: object
          description: 95% Confidence interval for the correlation coefficient (Fisher z-transformed).
          properties:
            lower:
              type: number
            upper:
              type: number
examples:
  - metadata:
      timestamp: "2023-10-27T10:00:00Z"
      bonferroni_alpha: 0.0038
      n_motifs_tested: 13
      control_variable: global_node_degree
      method: pearson
    correlations:
      M1:
        r: 0.45
        p: 0.002
        p_bonferroni: 0.026
        significant: true
        n_samples: 50
        confidence_interval:
          lower: 0.12
          upper: 0.68
      M2:
        r: -0.12
        p: 0.45
        p_bonferroni: 1.0
        significant: false
        n_samples: 50
        confidence_interval:
          lower: -0.45
          upper: 0.23