# Schema for Structural Connectome Processing Status and Derived Matrices
# Defines the structure for subject-level processing status and metadata
# associated with the structural connectome pipeline outputs.
#
# Generated for: PROJ-331-investigating-the-influence-of-network-m
# Task: T014
# Dependency: T009 (data-model.md)

$schema: "http://json-schema.org/draft-07/schema#"
title: Structural Connectome Processing Status
description: >
  Schema defining the status flags and metadata for subject-level structural
  connectome processing, including weighted and binarized adjacency matrices.

type: object
required:
  - subject_id
  - processing_status
  - derived_matrices
  - timestamp
properties:
  subject_id:
    type: string
    description: Unique identifier for the subject (e.g., '100306')
    pattern: "^[0-9]+$"

  processing_status:
    type: string
    enum:
      - complete
      - partial
      - failed
      - skipped
    description: >
      Overall status of the structural connectome processing for this subject.
      - complete: All steps (download, parcellation, binarization) succeeded.
      - partial: Some steps succeeded, others failed (see failure_reasons).
      - failed: Critical failure prevented processing.
      - skipped: Subject was skipped due to missing data or configuration.

  derived_matrices:
    type: object
    description: Metadata for derived matrix files generated for this subject.
    required:
      - weighted_adjacency
      - binary_adjacency
    properties:
      weighted_adjacency:
        type: object
        description: Metadata for the weighted adjacency matrix (streamline counts).
        required:
          - path
          - exists
          - shape
          - dtype
          - checksum
        properties:
          path:
            type: string
            description: Relative path to the .npy file (e.g., 'data/processed/100306/weighted_adjacency.npy')
          exists:
            type: boolean
            description: Whether the file exists on disk.
          shape:
            type: array
            items:
              type: integer
            description: Dimensions of the matrix [N, N].
          dtype:
            type: string
            description: NumPy data type (e.g., 'float64', 'int64').
          checksum:
            type: string
            description: SHA-256 checksum of the file content.
          generation_time:
            type: string
            format: date-time
            description: ISO 8601 timestamp of when the file was generated.

      binary_adjacency:
        type: object
        description: Metadata for the binarized adjacency matrix.
        required:
          - path
          - exists
          - shape
          - dtype
          - checksum
          - threshold_method
          - threshold_value
        properties:
          path:
            type: string
            description: Relative path to the .npy file (e.g., 'data/processed/100306/canonical_binary_adj.npy')
          exists:
            type: boolean
            description: Whether the file exists on disk.
          shape:
            type: array
            items:
              type: integer
            description: Dimensions of the matrix [N, N].
          dtype:
            type: string
            description: NumPy data type (e.g., 'uint8', 'bool').
          checksum:
            type: string
            description: SHA-256 checksum of the file content.
          threshold_method:
            type: string
            description: Method used for binarization (e.g., 'median_density').
          threshold_value:
            type: number
            description: The numeric threshold value applied (e.g., median density).
          generation_time:
            type: string
            format: date-time
            description: ISO 8601 timestamp of when the file was generated.

  failure_reasons:
    type: array
    items:
      type: string
    description: List of error messages if status is 'failed' or 'partial'.
    default: []

  cohort_context:
    type: object
    description: Contextual data from the cohort-level aggregation step.
    required:
      - median_cohort_density
      - total_subjects_processed
    properties:
      median_cohort_density:
        type: number
        description: The median graph density calculated across the entire cohort (from T014_agg).
      total_subjects_processed:
        type: integer
        description: Number of subjects included in the median calculation.

  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp when this metadata record was created/updated.

  metadata_version:
    type: string
    description: Schema version identifier.
    default: "1.0.0"

additionalProperties: false