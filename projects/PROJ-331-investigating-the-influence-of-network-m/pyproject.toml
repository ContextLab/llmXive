[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motif-rsfc-analysis"
version = "0.1.0"
description = "Investigating the Influence of Network Motifs on Resting-State Functional Connectivity"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "networkx",
    "matplotlib",
    "seaborn",
    "nibabel",
    "requests",
    "reportlab",
    "tqdm",
    "joblib",
    "dipy",
    "statsmodels",
    "weasyprint",
    "igraph",
    "python-igraph",
]

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | results
    | state
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["data", "results", "state", ".git", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
