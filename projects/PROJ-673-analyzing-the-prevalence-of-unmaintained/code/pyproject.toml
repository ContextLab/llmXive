[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npm-unmaintained-dependencies"
version = "0.1.0"
description = "Analyzing the prevalence of unmaintained dependencies in popular NPM packages"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "scipy",
    "statsmodels",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.4",
    "black>=24.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

# ------------------------------------------------------------------
# Linting configuration (ruff) — task T003
# Selected rules focus on syntax errors and dangerous bugs so the
# check is meaningful yet stable across the existing codebase.
# ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "data",
    "figures",
    "docs",
    "*.ipynb_checkpoints",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = [
    "E501",  # line length handled by black
    "F401",  # unused imports (common in exploratory research code)
    "F841",  # unused local variables
]

[tool.ruff.format]
quote-style = "double"

# ------------------------------------------------------------------
# Formatting configuration (black) — task T003
# ------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''(
    /\.venv/
    | /venv/
    | /data/
    | /figures/
    | /docs/
)'''
