$schema: "http://json-schema.org/draft-07/schema#"
title: "KnotRecord"
description: "Schema for a single prime knot record from KnotInfo"
type: "object"
properties:
  knot_id:
    type: "string"
    description: "Unique identifier for the knot (e.g., '10_123')"
    minLength: 1
  crossing_number:
    type: "integer"
    description: "Number of crossings in minimal diagram"
    minimum: 1
    maximum: 13
  braid_index:
    type: "integer"
    description: "Minimal braid index"
    minimum: 2
  hyperbolic_volume:
    type: "number"
    description: "Hyperbolic volume (0 if not hyperbolic)"
    minimum: 0
  alternating:
    type: "boolean"
    description: "Is the knot alternating?"
    nullable: true
  source:
    type: "object"
    description: "Metadata about the data source"
    properties:
      database:
        type: "string"
        description: "Name of source database"
        const: "KnotInfo"
      version:
        type: "string"
        description: "Version of the database"
      url:
        type: "string"
        description: "Canonical URL for the record"
        format: "uri"
      accessed_at:
        type: "string"
        description: "ISO-8601 timestamp of access"
        format: "date-time"
      source_timestamp:
        type: "string"
        description: "ISO-8601 timestamp of source record"
        format: "date-time"
      checksum_sha256:
        type: "string"
        description: "SHA-256 of raw source record"
        pattern: "^[a-f0-9]{64}$"
    required:
      - database
      - version
      - url
      - accessed_at
      - source_timestamp
      - checksum_sha256
  data_quality_flags:
    type: "array"
    description: "General data quality issues (null, format, duplicate)"
    items:
      type: "string"
    nullable: true
  missing_invariant_flags:
    type: "array"
    description: "Specific invariant computation failures"
    items:
      type: "string"
    nullable: true
required:
  - knot_id
  - crossing_number
  - braid_index
  - hyperbolic_volume
  - source
additionalProperties: false
