$schema: "http://json-schema.org/draft-07/schema#"
title: "RegressionOutput"
description: "Schema for regression model results"
type: "object"
properties:
  model_type:
    type: "string"
    description: "Type of model: linear, polynomial, logarithmic"
    enum:
      - "linear"
      - "polynomial"
      - "logarithmic"
  coefficients:
    type: "object"
    description: "Model coefficients"
    additionalProperties: true
  r_squared:
    type: "number"
    description: "R-squared goodness-of-fit"
    minimum: 0
    maximum: 1
  aic:
    type: "number"
    description: "Akaike Information Criterion"
  bic:
    type: "number"
    description: "Bayesian Information Criterion"
  mae:
    type: "number"
    description: "Mean Absolute Error"
    minimum: 0
  vif_crossing:
    type: "number"
    description: "Variance Inflation Factor for crossing number"
    minimum: 1
  vif_braid:
    type: "number"
    description: "Variance Inflation Factor for braid index"
    minimum: 1
  residual_analysis:
    type: "object"
    description: "Residual analysis results"
    properties:
      outliers:
        type: "array"
        description: "Knots with residuals ≥ 2 standard deviations"
        items:
          type: "string"
      families:
        type: "array"
        description: "Knot families with significant deviations"
        items:
          type: "string"
    required:
      - outliers
      - families
required:
  - model_type
  - coefficients
  - r_squared
  - aic
  - bic
  - mae
  - vif_crossing
  - vif_braid
  - residual_analysis
additionalProperties: false
