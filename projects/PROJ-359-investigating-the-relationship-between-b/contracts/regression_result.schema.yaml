$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Result Schema"
description: "Schema for validating the final regression result and visualization inputs."
type: object
required:
  - model_summary_path
  - effect_size_plot_path
  - report_path
  - validation_status
properties:
  model_summary_path:
    type: string
    pattern: ".*model_summary\\.csv$"
  effect_size_plot_path:
    type: string
    pattern: ".*effect_sizes\\.pdf$"
  report_path:
    type: string
    pattern: ".*regression_report\\.pdf$"
  validation_status:
    type: string
    enum:
      - "SUCCESS"
      - "WARNING"
      - "FAILED"
  metadata:
    type: object
    properties:
      n_participants:
        type: integer
        minimum: 0
      r_squared:
        type: number
        minimum: 0
        maximum: 1
      adjusted_r_squared:
        type: number
      permutation_test_shuffles:
        type: integer
        minimum: 1000
      correction_method:
        type: string
        const: "Holm-Bonferroni"