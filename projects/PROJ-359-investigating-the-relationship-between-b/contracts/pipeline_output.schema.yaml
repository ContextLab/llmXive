$schema: "http://json-schema.org/draft-07/schema#"
title: "Pipeline Output Schema"
description: "Schema for validating the intermediate outputs of the preprocessing and metric extraction pipeline."
type: object
required:
  - baseline_metrics
  - motion_metrics
  - connectivity_matrices
properties:
  baseline_metrics:
    type: object
    required:
      - file_path
      - columns
      - row_count
    properties:
      file_path:
        type: string
        pattern: ".*baseline_metrics\\.csv$"
      columns:
        type: array
        items:
          type: string
        contains:
          const: "participant_id"
      row_count:
        type: integer
        minimum: 0
  motion_metrics:
    type: object
    required:
      - file_path
      - columns
      - row_count
    properties:
      file_path:
        type: string
        pattern: ".*motion_metrics\\.csv$"
      columns:
        type: array
        items:
          type: string
        contains:
          const: "participant_id"
          const: "mean_fd"
      row_count:
        type: integer
        minimum: 0
  connectivity_matrices:
    type: object
    required:
      - directory_path
      - matrix_shape
      - count
    properties:
      directory_path:
        type: string
        pattern: ".*data/preprocessed/.*"
      matrix_shape:
        type: array
        items:
          type: integer
        minItems: 2
        maxItems: 2
        const: [400, 400]
      count:
        type: integer
        minimum: 0
