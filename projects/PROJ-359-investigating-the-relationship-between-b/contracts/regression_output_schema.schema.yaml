$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Output Schema"
description: "Schema for validating the output of the regression analysis (model_summary.csv)."
type: object
required:
  - file_path
  - columns
  - rows
properties:
  file_path:
    type: string
    pattern: ".*model_summary\\.csv$"
  columns:
    type: array
    items:
      type: string
    contains:
      const: "predictor"
      const: "beta"
      const: "se"
      const: "p_perm"
      const: "p_corrected"
      const: "ci_lower"
      const: "ci_upper"
  rows:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - predictor
        - beta
        - se
        - p_perm
        - p_corrected
        - ci_lower
        - ci_upper
      properties:
        predictor:
          type: string
          enum:
            - "Global_Efficiency"
            - "Modularity"
            - "FPN_Strength"
            - "DMN_Strength"
            - "Age"
            - "Sex"
            - "Intercept"
        beta:
          type: number
        se:
          type: number
        p_perm:
          type: number
          minimum: 0
          maximum: 1
        p_corrected:
          type: number
          minimum: 0
          maximum: 1
        ci_lower:
          type: number
        ci_upper:
          type: number
