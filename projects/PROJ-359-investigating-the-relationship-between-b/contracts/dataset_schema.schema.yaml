$schema: "http://json-schema.org/draft-07/schema#"
title: "ds000278 Dataset Schema"
description: "Schema for validating the structure and content of the downloaded ds000278 dataset from OpenNeuro."
type: object
required:
  - dataset_id
  - participants
  - resting_state_scans
  - behavioral_data
properties:
  dataset_id:
    type: string
    const: "ds000278"
  participants:
    type: array
    items:
      type: object
      required:
        - participant_id
        - age
        - sex
      properties:
        participant_id:
          type: string
          pattern: "^sub-[0-9]+$"
        age:
          type: integer
          minimum: 0
        sex:
          type: string
          enum: ["M", "F"]
  resting_state_scans:
    type: array
    items:
      type: object
      required:
        - subject_id
        - file_path
        - file_exists
      properties:
        subject_id:
          type: string
          pattern: "^sub-[0-9]+$"
        file_path:
          type: string
          pattern: ".*_space-MNI_desc-preproc_bold\\.nii\\.gz$"
        file_exists:
          type: boolean
  behavioral_data:
    type: object
    required:
      - file_path
      - columns
    properties:
      file_path:
        type: string
        pattern: ".*_behavioral\\.tsv$"
      columns:
        type: array
        items:
          type: string
        minItems: 1
