  r: "The repository contains `code/src/preprocess.py` and the unit\u2011test file,\
    \ but the required output artifacts (`data/processed/clean.parquet`, `outputs/preprocessing_log.json`)\
    \ and the schema file (`processed_data.schema.yaml`) are missing. Moreover, the\
    \ implementation adds `species_name` to `REQUIRED_COLUMNS` and then drops rows\
    \ with Na\u202FN in that column, causing the test data (which lacks a `species_name`\
    \ column) to be eliminated and the Z\u2011scoring step to fail. Consequently the\
    \ tests cannot pass and the validation step is skipped due to the absent schema.\
    \ Fix the handling of optional `species_na"
