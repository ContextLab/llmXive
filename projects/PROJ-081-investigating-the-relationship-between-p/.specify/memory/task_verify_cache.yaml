  r: "The project lacks the required `scripts/`, `data/raw/`, and `outputs/` directories\
    \ (and the `outputs/fetch_log.txt` file is missing). The three fetch functions\
    \ raise an `AttributeError` because they use `pd.compat.StringIO`, causing all\
    \ `test_fetch_data.py` tests to error, so the verification step fails and the\
    \ paired\u2011species count is never checked."
  sig: dbdb3d7f5d4f4ed454dfe48b84cd40fb7c48375e8a83fe8dc70a72cf974d6239
T002:
  c: false
  h: fbad8969ca0b7f2706af0214ee9bc5bc8216553faa70d29e5e0253b019fcf32d
  r: "The implementation `code/src/preprocess.py` raises errors during execution (ambiguous\
    \ Series truth value and JSONDecodeError when loading the schema), causing all\
    \ three pytest cases to fail. Consequently the required output files `data/processed/clean.parquet`\
    \ and `outputs/preprocessing_log.json` are never created, and the schema file\
    \ `processed_data.schema.yaml` is missing/empty. The tests therefore do not pass\
    \ and the task\u2019s deliverables are not satisfied."
  sig: ef086c7e273eba058a25be426baeaf48449bd4a7a95aa5636d9c29a8a134ebae
