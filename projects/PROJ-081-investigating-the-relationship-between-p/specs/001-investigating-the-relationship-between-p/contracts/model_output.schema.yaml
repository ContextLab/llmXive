$schema: "http://json-schema.org/draft-07/schema#"
title: "AnalysisResult: Model Output Container"
type: object
required:
  - result_type
  - payload
  - timestamp
properties:
  result_type:
    type: string
    enum: ["correlation", "ols", "pgls", "mixed_effects", "rf", "sensitivity", "power_analysis"]
    description: "Type of analysis performed; all results conform to the AnalysisResult wrapper."
  payload:
    type: object
    description: "Result‑specific fields (see data-model.md for each result_type)."
    properties:
      # Correlation‑specific
      matrix:
        type: object
        description: "Pearson correlation matrix (result_type=correlation)."
      p_values:
        type: object
        description: "Raw p‑values (correlation, regression, RF)."
      q_values:
        type: object
        description: "FDR‑corrected p‑values via Benjamini‑Hochberg."
      significant_negative_classes:
        type: array
        items:
          type: string
        description: "Metabolite classes with significant negative correlation (result_type=correlation)."
      # Regression‑specific
      coefficients:
        type: object
        description: "Regression coefficients (ols, pgls, mixed_effects)."
      r2:
        type: number
        description: "R² (ols, pgls, mixed_effects)."
      adj_r2:
        type: number
        description: "Adjusted R² (ols, pgls, mixed_effects)."
      rmse:
        type: number
        description: "Root mean squared error (ols, pgls, mixed_effects, rf)."
      vif:
        type: object
        description: "Variance inflation factors (ols)."
      # PGLS‑specific
      phylogeny_source:
        type: string
        description: "Source of phylogenetic tree (pgls)."
      lrt_statistic:
        type: number
        description: "Likelihood‑ratio test statistic comparing PGLS to OLS."
      lrt_p_value:
        type: number
        description: "LRT p‑value (pgls)."
      # Mixed‑effects‑specific
      fixed_effects:
        type: object
        description: "Fixed‑effect coefficients (mixed_effects)."
      random_intercept_std:
        type: number
        description: "Standard deviation of species‑level random intercept."
      r2_marginal:
        type: number
        description: "Marginal R² (mixed_effects)."
      r2_conditional:
        type: number
        description: "Conditional R² (mixed_effects)."
      # Random Forest‑specific
      feature_importance:
        type: array
        items:
          type: object
          properties:
            metabolite:
              type: string
            importance:
              type: number
            p_value:
              type: number
            q_value:
              type: number
        description: "Permutation importance rankings with FDR‑corrected p‑values (rf)."
      cv_r2:
        type: number
        description: "Cross‑validated R² (rf)."
      cv_adj_r2:
        type: number
        description: "Cross‑validated adjusted R² (rf)."
      cv_rmse:
        type: number
        description: "Cross‑validated RMSE (rf)."
      test_r2:
        type: number
        description: "Test‑set R² (rf)."
      test_adj_r2:
        type: number
        description: "Test‑set adjusted R² (rf)."
      test_rmse:
        type: number
        description: "Test‑set RMSE (rf)."
      # Sensitivity‑specific
      p_threshold_sweep:
        type: object
        description: "Results of sweeping FDR q‑thresholds (sensitivity)."
      outlier_cap_variation:
        type: object
        description: "Metrics under ±10 % herbivory outlier cap changes (sensitivity)."
      raw_vs_standardized:
        type: object
        description: "Comparison of biomarker rankings on raw vs. standardized data (sensitivity)."
      # Power analysis‑specific
      effective_n:
        type: number
        description: "Effective sample size after phylogenetic adjustment (power_analysis)."
      power_ols:
        type: number
        description: "Estimated power for OLS (power_analysis)."
      power_pgls:
        type: number
        description: "Estimated power for PGLS (power_analysis)."
      power_rf:
        type: number
        description: "Estimated power for Random Forest (power_analysis)."
      under_power_flag:
        type: boolean
        description: "True if study is under‑powered (N < 50)."
      # General diagnostics
      train_n:
        type: integer
        description: "Number of training observations."
      test_n:
        type: integer
        description: "Number of test observations."
    additionalProperties: true
  timestamp:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp when the result was generated."
additionalProperties: false
