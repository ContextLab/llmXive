$schema: "http://json-schema.org/draft-07/schema#"
title: Annotation
type: object
properties:
  video_id:
    type: string
  file_path:
    type: string
    format: uri
  score:
    type: number
    minimum: 0.0
    maximum: 1.0
  annotator_id:
    type: string
  timestamp:
    type: string
    format: date-time
required:
  - video_id
  - file_path
  - score
  - annotator_id
  - timestamp
additionalProperties: false
