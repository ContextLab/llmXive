$schema: "http://json-schema.org/draft-07/schema#"
title: "Divergence Metrics Schema"
description: "Schema for the output of the flow-map divergence calculation (code/inference.py)."
type: object
properties:
  video_id:
    type: string
    description: "Unique identifier for the video clip."
  divergence_value:
    type: number
    description: "Computed flow-map divergence score (MSE normalized by dimension)."
  baseline_n:
    type: integer
    description: "Number of Euler steps used for the baseline (e.g., 500, 200)."
  features:
    type: object
    description: "Temporal pattern features extracted from the divergence trajectory."
    properties:
      kurtosis:
        type: number
        description: "Kurtosis of the divergence trajectory."
      temporal_clustering:
        type: number
        description: "Clustering coefficient of the trajectory."
    required:
      - kurtosis
      - temporal_clustering
  status:
    type: string
    enum:
      - "success"
      - "failed"
      - "skipped"
    description: "Status of the inference for this clip."
  error_msg:
    type: string
    description: "Error message if status is 'failed' or 'skipped'."
    nullable: true
required:
  - video_id
  - divergence_value
  - baseline_n
  - features
  - status
additionalProperties: false
