$schema: "http://json-schema.org/draft-07/schema#"
title: "DivergenceMetric Schema"
description: "Schema for computed flow-map divergence metrics."
type: object
properties:
  clip_id:
    type: string
    description: "Foreign key to VideoClip."
  divergence_score:
    type: number
    description: "MSE normalized by latent dimension."
  baseline_steps:
    type: integer
    enum: [500, 200, 100]
    description: "Number of Euler steps used for baseline."
  kurtosis:
    type: number
    description: "Temporal pattern feature: kurtosis."
  clustering:
    type: number
    description: "Temporal pattern feature: clustering."
  status:
    type: string
    enum: ["success", "failed", "skipped"]
    description: "Processing status."
required:
  - clip_id
  - divergence_score
  - baseline_steps
  - status
additionalProperties: false