$schema: "http://json-schema.org/draft-07/schema#"
title: "ContinuityAnnotation Schema"
description: "Schema for manual continuity scores."
type: object
properties:
  clip_id:
    type: string
    description: "Foreign key to VideoClip."
  score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Continuity score (0.0=continuous, 1.0=discontinuous)."
  rubric_score:
    type: integer
    minimum: 1
    maximum: 5
    description: "Raw Likert scale score."
  annotator_id:
    type: string
    description: "Identifier for the human annotator."
  status:
    type: string
    enum: ["valid", "discarded_ambiguous"]
    description: "Status of the annotation. 'discarded_ambiguous' if annotators differed by >1 point."
required:
  - clip_id
  - score
  - rubric_score
  - annotator_id
  - status
additionalProperties: false