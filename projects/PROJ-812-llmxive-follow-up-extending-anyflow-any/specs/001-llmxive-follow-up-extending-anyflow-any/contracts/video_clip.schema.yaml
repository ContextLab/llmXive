$schema: http://json-schema.org/draft-07/schema#
title: "Video Clip Metadata"
description: "Schema for a single video clip entry in the raw dataset"
type: object
properties:
  clip_id:
    type: string
    description: "Unique identifier for the clip"
  source_url:
    type: string
    description: "Original URL of the video source"
  file_path:
    type: string
    description: "Local path to the downloaded clip"
  duration_sec:
    type: number
    description: "Duration in seconds"
  frame_count:
    type: integer
    description: "Total number of frames"
  resolution:
    type: string
    description: "Resolution string (e.g., '1920x1080')"
  stratification_label:
    type: string
    enum:
      - "Cut"
      - "Continuous"
    description: "Stratification label assigned during curation"
  verified_by:
    type: string
    description: "Expert ID who verified the label"
required:
  - clip_id
  - source_url
  - file_path
  - stratification_label
additionalProperties: false
