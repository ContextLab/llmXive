$schema: "http://json-schema.org/draft-07/schema#"
title: "Variance Report Schema"
description: "Schema for the variance and bimodality report (code/analysis.py)."
type: object
properties:
  variance:
    type: number
    description: "Variance of the ContinuityScore distribution."
  mean:
    type: number
    description: "Mean of the ContinuityScore distribution."
  std_dev:
    type: number
    description: "Standard deviation of the ContinuityScore distribution."
  is_bimodal:
    type: boolean
    description: "Result of Hartigan's Dip Test (True if p < 0.05)."
  dip_p_value:
    type: number
    description: "P-value from Hartigan's Dip Test."
  sample_size:
    type: integer
    description: "Number of samples in the distribution."
required:
  - variance
  - mean
  - std_dev
  - is_bimodal
  - dip_p_value
  - sample_size
additionalProperties: false
