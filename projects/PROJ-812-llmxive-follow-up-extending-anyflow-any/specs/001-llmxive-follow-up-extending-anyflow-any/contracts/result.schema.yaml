$schema: "http://json-schema.org/draft-07/schema#"
title: "AnalysisResult Schema"
description: "Schema for statistical analysis results."
type: object
properties:
  metric_type:
    type: string
    enum: ["Pearson", "Spearman", "Logistic", "Fisher"]
    description: "Type of statistical test."
  value:
    type: number
    description: "Correlation coefficient, accuracy, or odds ratio."
  p_value:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "P-value for the test."
  confidence_interval:
    type: string
    description: "95% Confidence Interval string."
  threshold:
    type: number
    description: "Classification threshold used (if applicable)."
required:
  - metric_type
  - value
  - p_value
additionalProperties: false