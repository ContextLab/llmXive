$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Results Schema"
description: "Schema for the correlation and regression results (code/analysis.py)."
type: object
properties:
  pearson_r:
    type: number
    description: "Pearson correlation coefficient."
  pearson_p_value:
    type: number
    description: "P-value for Pearson correlation."
  spearman_rho:
    type: number
    description: "Spearman rank correlation coefficient."
  spearman_p_value:
    type: number
    description: "P-value for Spearman correlation."
  logistic_regression_accuracy:
    type: number
    description: "Accuracy of the multivariate logistic regression model."
  logistic_regression_p_value:
    type: number
    description: "P-value for logistic regression significance."
  analysis_type:
    type: string
    enum:
      - "correlation"
      - "fisher_exact"
    description: "Type of analysis performed (correlation or Fisher's Exact Test for bimodal data)."
  note:
    type: string
    description: "Additional notes (e.g., 'Bimodal data detected, used Fisher's Exact Test')."
required:
  - pearson_r
  - pearson_p_value
  - spearman_rho
  - spearman_p_value
  - analysis_type
additionalProperties: false
