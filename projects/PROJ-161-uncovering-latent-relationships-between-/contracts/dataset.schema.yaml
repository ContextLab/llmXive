%YAML 1.1
---
$schema: http://json-schema.org/draft-07/schema#
title: Antibiotic Resistance Dataset Schema
description: >
  Schema for the merged dataset containing molecular descriptors and resistance
  frequencies derived from ChEMBL/ZINC15 and NCBI Pathogen Detection sources.
  Generated by the llmXive pipeline (US1).

type: object
required:
  - metadata
  - columns
  - row_count

properties:
  metadata:
    type: object
    required:
      - source_urls
      - processing_timestamp
      - pipeline_version
      - checksum_sha256
    properties:
      source_urls:
        type: array
        items:
          type: string
          format: uri
        description: URLs of the original data sources (ChEMBL, ZINC15, NCBI).
      processing_timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the dataset was generated.
      pipeline_version:
        type: string
        description: Version of the pipeline that generated this dataset.
      checksum_sha256:
        type: string
        pattern: '^[a-f0-9]{64}$'
        description: SHA256 checksum of the raw input files used.
      merge_metrics:
        type: object
        description: Metrics from the merge operation (T016).
        properties:
          total_requested:
            type: integer
            minimum: 0
          matches:
            type: integer
            minimum: 0
          fraction:
            type: number
            minimum: 0.0
            maximum: 1.0

  columns:
    type: array
    minItems: 3
    description: >
      List of column definitions. Must include 'inchikey', 'resistance_frequency',
      and at least one molecular descriptor.
    items:
      type: object
      required:
        - name
        - dtype
        - description
      properties:
        name:
          type: string
          description: Column name in the CSV.
        dtype:
          type: string
          enum:
            - string
            - float64
            - int64
            - bool
          description: Pandas/NumPy data type.
        description:
          type: string
          description: Human-readable description of the column.
        nullable:
          type: boolean
          default: false
          description: Whether the column allows NaN values.
        source:
          type: string
          enum:
            - chembl
            - zinc15
            - ncbi
            - rdkit
            - derived
          description: Origin of the data in this column.

  row_count:
    type: integer
    minimum: 0
    description: Total number of rows in the dataset.

  sample_data:
    type: array
    maxItems: 5
    description: >
      First 5 rows of the dataset for quick validation.
      Each object must match the keys defined in 'columns'.
    items:
      type: object
      additionalProperties: true
