%YAML 1.1
---
$schema: http://json-schema.org/draft-07/schema#
title: Analysis Output Schema
description: >
  Schema for the analysis outputs generated by the llmXive pipeline,
  including UMAP embeddings, clustering results, and statistical rankings.

type: object
required:
  - artifacts

properties:
  artifacts:
    type: object
    description: Map of artifact names to their specific schema definitions.

  umap_embedding:
    $ref: '#/$defs/umap_embedding_schema'

  clustering_results:
    $ref: '#/$defs/clustering_results_schema'

  statistical_ranking:
    $ref: '#/$defs/statistical_ranking_schema'

  sensitivity_analysis_report:
    $ref: '#/$defs/sensitivity_analysis_schema'

  bimodality_report:
    $ref: '#/$defs/bimodality_report_schema'

$defs:
  umap_embedding_schema:
    type: object
    description: Schema for data/processed/umap_embedding.csv
    required:
      - metadata
      - columns
    properties:
      metadata:
        type: object
        properties:
          umap_params:
            type: object
            properties:
              n_neighbors:
                type: integer
              min_dist:
                type: number
              metric:
                type: string
          random_state:
            type: integer
      columns:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            dtype:
              type: string

  clustering_results_schema:
    type: object
    description: Schema for data/processed/clustering_results.json
    required:
      - clusters
      - validation
    properties:
      clusters:
        type: array
        items:
          type: object
          required:
            - cluster_id
            - size
            - enrichment_p_value
            - permutation_p_value
          properties:
            cluster_id:
              type: integer
            size:
              type: integer
              minimum: 10
            enrichment_p_value:
              type: number
              minimum: 0.0
              maximum: 1.0
            permutation_p_value:
              type: number
              minimum: 0.0
              maximum: 1.0
            diagnostic_message:
              type: string
      validation:
        type: object
        properties:
          silhouette_score:
            type: number
          dbscan_params:
            type: object
            properties:
              eps:
                type: number
              min_samples:
                type: integer

  statistical_ranking_schema:
    type: object
    description: Schema for data/processed/statistical_ranking.csv
    required:
      - metadata
      - results
    properties:
      metadata:
        type: object
        properties:
          fdr_method:
            type: string
            enum: [benjamini-hochberg]
          alpha:
            type: number
          effect_size_method:
            type: string
            enum: [cohens_d]
          test_method:
            type: string
            enum: [mann-whitney-u, spearman]
      results:
        type: array
        items:
          type: object
          required:
            - descriptor_name
            - p_value_raw
            - p_value_fdr
            - cohens_d
            - rank
          properties:
            descriptor_name:
              type: string
            p_value_raw:
              type: number
            p_value_fdr:
              type: number
            cohens_d:
              type: number
            rank:
              type: integer

  sensitivity_analysis_schema:
    type: object
    description: Schema for data/processed/sensitivity_analysis_report.json
    required:
      - binary_method
      - continuous_method
      - comparison
    properties:
      binary_method:
        type: object
        properties:
          test:
            type: string
          top_5_descriptors:
            type: array
            items:
              type: string
      continuous_method:
        type: object
        properties:
          test:
            type: string
          top_5_descriptors:
            type: array
            items:
              type: string
      comparison:
        type: object
        properties:
          rank_correlation:
            type: number
          description:
            type: string

  bimodality_report_schema:
    type: object
    description: Schema for data/processed/bimodality_report.json (FR-009)
    required:
      - descriptor_name
      - method
      - result
    properties:
      descriptor_name:
        type: string
      method:
        type: string
        enum: [hartigans_dip, gmm_bimodality, spearman_fallback]
      result:
        type: object
        properties:
          is_bimodal:
            type: boolean
          p_value:
            type: number
          statistic:
            type: number
          fallback_reason:
            type: string