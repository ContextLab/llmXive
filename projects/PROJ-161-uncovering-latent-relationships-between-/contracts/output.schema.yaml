%YAML 1.2
---
title: Output Artifacts Schema for Antibiotic Resistance Analysis
description: >
  Schema defining the structure of all output artifacts generated by the
  pipeline, including clustering results, statistical rankings, and
  diagnostic reports.

definitions:
  ClusteringResult:
    type: object
    required:
      - cluster_id
      - sample_count
      - high_resistance_count
      - enrichment_p_value
      - permutation_p_value
      - diagnostic_message
    properties:
      cluster_id:
        type: integer
        description: Unique identifier for the cluster.
      sample_count:
        type: integer
        description: Number of compounds in this cluster.
      high_resistance_count:
        type: integer
        description: Number of compounds with high resistance phenotype.
      enrichment_p_value:
        type: number
        description: Fisher's exact test p-value for enrichment.
      permutation_p_value:
        type: number
        description: P-value from label permutation validation.
      diagnostic_message:
        type: string
        description: >
          Status message (e.g., "sufficient_power", "insufficient_power",
          "enrichment_significant", "enrichment_not_significant").
      silhouette_score:
        type: number
        nullable: true
        description: Silhouette score for cluster quality (optional).
    
  StatisticalAssociation:
    type: object
    required:
      - descriptor_name
      - mann_whitney_u
      - p_value_raw
      - p_value_fdr
      - cohens_d
      - bimodality_assessment
      - test_type
    properties:
      descriptor_name:
        type: string
        description: Name of the molecular descriptor.
      mann_whitney_u:
        type: number
        description: Mann-Whitney U statistic.
      p_value_raw:
        type: number
        description: Raw p-value before FDR correction.
      p_value_fdr:
        type: number
        description: Benjamini-Hochberg FDR-adjusted p-value.
      cohens_d:
        type: number
        description: Cohen's d effect size.
      bimodality_assessment:
        type: string
        enum:
          - bimodal
          - unimodal
          - inconclusive
          - continuous_fallback
        description: Result of bimodality assessment.
      test_type:
        type: string
        enum:
          - mann_whitney_binary
          - spearman_continuous
        description: Type of statistical test performed.
      vif_score:
        type: number
        nullable: true
        description: Variance Inflation Factor (if VIF filtering applied).

artifacts:
  umap_embedding:
    file: data/processed/umap_embedding.csv
    format: CSV
    description: 2D UMAP embedding coordinates for all compounds.
    schema:
      type: object
      required:
        - inchikey
        - umap_1
        - umap_2
      properties:
        inchikey:
          type: string
        umap_1:
          type: number
        umap_2:
          type: number
  
  umap_scatter:
    file: data/processed/umap_scatter.png
    format: PNG
    description: UMAP scatter plot colored by resistance phenotype.
    schema:
      type: image
      dimensions:
        width: 1200
        height: 800
      color_map: resistance_frequency
  
  clustering_results:
    file: data/processed/clustering_results.json
    format: JSON
    description: Results of DBSCAN clustering and Fisher's exact test.
    schema:
      type: object
      required:
        - clusters
        - total_clusters
        - significant_clusters
        - silhouette_score_global
        - timestamp
      properties:
        clusters:
          type: array
          items:
            $ref: "#/definitions/ClusteringResult"
        total_clusters:
          type: integer
        significant_clusters:
          type: integer
        silhouette_score_global:
          type: number
        timestamp:
          type: string
          format: date-time
  
  statistical_ranking:
    file: data/processed/statistical_ranking.csv
    format: CSV
    description: Descriptors ranked by effect size and FDR-adjusted p-value.
    schema:
      type: object
      required:
        - descriptor_name
        - cohens_d
        - p_value_fdr
        - rank
      properties:
        descriptor_name:
          type: string
        cohens_d:
          type: number
        p_value_fdr:
          type: number
        rank:
          type: integer
        mann_whitney_u:
          type: number
        p_value_raw:
          type: number
        bimodality_assessment:
          type: string
        test_type:
          type: string
  
  sensitivity_analysis_report:
    file: data/processed/sensitivity_analysis_report.json
    format: JSON
    description: Comparison of binary vs continuous model rankings.
    schema:
      type: object
      required:
        - binary_model_results
        - continuous_model_results
        - ranking_correlation
        - top_5_binary
        - top_5_continuous
        - methodology
      properties:
        binary_model_results:
          type: array
          items:
            $ref: "#/definitions/StatisticalAssociation"
        continuous_model_results:
          type: array
          items:
            $ref: "#/definitions/StatisticalAssociation"
        ranking_correlation:
          type: number
          description: Spearman correlation between rankings.
        top_5_binary:
          type: array
          items:
            type: string
        top_5_continuous:
          type: array
          items:
            type: string
        methodology:
          type: string
  
  merge_metrics:
    file: data/processed/merge_metrics.json
    format: JSON
    description: Metrics from merging structure and resistance data.
    schema:
      type: object
      required:
        - total_requested
        - matches
        - fraction
      properties:
        total_requested:
          type: integer
        matches:
          type: integer
        fraction:
          type: number
          description: Fraction of compounds with matched resistance data.
  
  bimodality_report:
    file: data/processed/bimodality_report.json
    format: JSON
    description: Results of bimodality assessment for each descriptor.
    schema:
      type: object
      required:
        - descriptors
        - total_descriptors
        - bimodal_count
        - unimodal_count
        - continuous_fallback_count
      properties:
        descriptors:
          type: array
          items:
            type: object
            required:
              - name
              - assessment
              - dip_statistic
              - p_value
              - gmm_bic
            properties:
              name:
                type: string
              assessment:
                type: string
                enum:
                  - bimodal
                  - unimodal
                  - inconclusive
              dip_statistic:
                type: number
              p_value:
                type: number
              gmm_bic:
                type: number
        total_descriptors:
          type: integer
        bimodal_count:
          type: integer
        unimodal_count:
          type: integer
        continuous_fallback_count:
          type: integer
  
  bimodality_histogram:
    file: data/processed/bimodality_histogram.png
    format: PNG
    description: Histogram showing distribution of a representative descriptor.
    schema:
      type: image
      description: Visual representation of descriptor distribution with
        bimodality test results overlaid.
  
  vif_filtered_descriptors:
    file: data/processed/vif_filtered_descriptors.json
    format: JSON
    description: List of descriptors filtered by VIF for collinearity.
    schema:
      type: object
      required:
        - filtered_descriptors
        - vif_threshold
        - total_descriptors
      properties:
        filtered_descriptors:
          type: array
          items:
            type: object
            required:
              - name
              - vif_score
            properties:
              name:
                type: string
              vif_score:
                type: number
        vif_threshold:
          type: number
          description: VIF threshold used for filtering (default 5.0).
        total_descriptors:
          type: integer
        diagnostic_note:
          type: string
          description: Note that this is for diagnostic purposes only.
  
  data_version:
    file: data/data_version.json
    format: JSON
    description: Version tracking for all data sources.
    schema:
      type: object
      required:
        - source_url
        - checksum_sha256
        - timestamp
      properties:
        source_url:
          type: string
          format: uri
        checksum_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        timestamp:
          type: string
          format: date-time
        pipeline_version:
          type: string
        git_commit:
          type: string
          nullable: true
  
  runtime_metrics:
    file: data/processed/runtime_metrics.json
    format: JSON
    description: Pipeline execution metrics.
    schema:
      type: object
      required:
        - total_duration_seconds
        - cpu_usage_percent
        - peak_memory_mb
      properties:
        total_duration_seconds:
          type: number
        cpu_usage_percent:
          type: number
        peak_memory_mb:
          type: number
        timestamp:
          type: string
          format: date-time
        pipeline_stages:
          type: array
          items:
            type: object
            required:
              - stage_name
              - duration_seconds
            properties:
              stage_name:
                type: string
              duration_seconds:
                type: number