[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-pain-sensitivity"
version = "0.1.0"
description = "Predicting Individual Pain Sensitivity from Resting-State EEG Microstates"
requires-python = ">=3.11"
dependencies = [
    "mne",
    "scikit-learn",
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "joblib",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.ruff]
# Linter selection
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in ML)
]

# Exclude generated or external data directories
extend-exclude = [
    "data/raw",
    "data/processed",
    "state",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.isort]
known-first-party = ["setup_directories", "utils", "data_loader", "preprocessing", "modeling", "diagnostics", "config"]
force-sort-within-sections = true

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data/raw
    | data/processed
    | state
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: Unit tests",
    "integration: Integration tests",
]