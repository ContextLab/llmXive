  r: "The `code/data_loader.py` file implements `DataChunk` with `numpy.memmap` and\
    \ an `EEGDataLoader` that streams files in chunks, providing metadata and yielding\
    \ chunk objects. The integration test `tests/integration/test_data_loader.py`\
    \ creates a large synthetic binary EEG file, iterates over chunks, and confirms\
    \ peak RAM usage stays below 6\u202FGB, and the test logs show it passed. All\
    \ required artifacts exist and function as specified."
