$schema: http://json-schema.org/draft-07/schema#
title: GateMem Dataset Schema
description: Schema for GateMem benchmark episodes including leak-target, roles, domains, outcome, and authorization_boundaries.
type: object
required:
  - episodes
properties:
  episodes:
    type: array
    items:
      type: object
      required:
        - id
        - domain
        - leak_target
        - role
        - outcome
        - authorization_boundaries
      properties:
        id:
          type: string
          description: Unique identifier for the episode.
        domain:
          type: string
          description: The domain of the episode (e.g., medical, office, education).
        leak_target:
          type: string
          description: The specific information or data that is the target of a potential leak.
        role:
          type: string
          description: The role of the user in this episode.
        outcome:
          type: string
          description: The expected outcome (e.g., allow, deny).
        authorization_boundaries:
          type: object
          description: Dictionary defining the specific boundaries for this episode.
          additionalProperties: true
        metadata:
          type: object
          description: Optional metadata for the episode.
          additionalProperties: true
additionalProperties: false
