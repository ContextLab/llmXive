$schema: "http://json-schema.org/draft-07/schema#"
title: GateMem Episode Schema
description: |
  Schema defining the structure of a single GateMem episode.
  This schema is used to validate raw data loaded from the dataset source.
type: object
required:
  - id
  - outcome
  - predictors
  - covariates
  - leak-target
properties:
  id:
    type: string
    description: Unique identifier for the episode.
  outcome:
    type: string
    description: The ground truth outcome label (e.g., 'leak', 'no_leak', or specific utility label).
  predictors:
    type: array
    description: List of predictor variables (features) used in the analysis.
    items:
      type: string
  covariates:
    type: object
    description: Dictionary of covariate variables (contextual factors).
    additionalProperties: true
  leak-target:
    type: string
    description: The specific sensitive information target being evaluated for leakage.
  role:
    type: string
    description: The role of the user making the request (e.g., 'admin', 'user', 'guest').
  domain:
    type: string
    description: The domain category of the episode (e.g., 'medical', 'office', 'education').
  query:
    type: string
    description: The natural language query text.
  memory:
    type: string
    description: The memory content associated with the episode.
  metadata:
    type: object
    description: Additional metadata fields.
    additionalProperties: true
