# GateMem Dataset Schema Definition
# Defines the required structure for raw GateMem episodes
type: object
required:
  - id
  - outcome
  - predictors
  - covariates
  - leak-target
  - role
  - domain
  - query
  - memory
properties:
  id:
    type: string
    description: Unique identifier for the episode
  outcome:
    type: string
    description: Ground truth outcome (e.g., "leak", "no_leak")
    enum:
      - leak
      - no_leak
  predictors:
    type: array
    items:
      type: string
    description: List of predictor features used for the outcome
  covariates:
    type: object
    description: Additional context variables (e.g., domain, timestamp)
    additionalProperties: true
  leak-target:
    type: string
    description: The specific information that is the target of the leak
  role:
    type: string
    description: The role of the user making the query
  domain:
    type: string
    description: The domain of the episode (e.g., "medical", "office")
  query:
    type: string
    description: The user's query string
  memory:
    type: string
    description: The memory content being accessed
additionalProperties: false
