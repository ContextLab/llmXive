# GateMem Dataset Schema Definition
# Defines the structure and required fields for dataset episodes
schema_version: "1.0"
type: object
required:
  - leak-target
  - roles
  - domains
  - outcome
  - predictors
  - covariates
properties:
  leak-target:
    type: string
    description: "Target information intended to be leaked or protected"
  roles:
    type: array
    items:
      type: string
    description: "List of roles involved in the episode"
  domains:
    type: array
    items:
      type: string
    description: "List of domains (e.g., medical, office, education) associated with the episode"
  outcome:
    type: object
    properties:
      success:
        type: boolean
      label:
        type: string
    description: "Outcome of the episode regarding information access"
  predictors:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        value:
          type: [string, number, boolean]
    description: "Predictor variables for the episode"
  covariates:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        value:
          type: [string, number, boolean]
    description: "Covariate variables for the episode"
additionalProperties: false
