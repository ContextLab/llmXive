# GateMem Results Schema
# Defines the required structure for benchmark output metrics

type: object
required:
  - Access Control
  - Utility
  - Forgetting
  - Latency

properties:
  Access Control:
    type: object
    description: Metrics related to unauthorized information leakage
    properties:
      score:
        type: number
        description: Access control score (0-1)
      std_dev:
        type: number
        description: Standard deviation of the score
      total_episodes:
        type: integer
        description: Total number of episodes evaluated
      false_positive_rate:
        type: number
        description: Rate of valid queries blocked
      false_negative_rate:
        type: number
        description: Rate of unauthorized access allowed

  Utility:
    type: object
    description: Metrics related to task success
    properties:
      score:
        type: number
        description: Utility score (0-1)
      success_rate:
        type: number
        description: Rate of successful task completion
      conditional_utility:
        type: number
        description: Utility conditional on access being granted

  Forgetting:
    type: object
    description: Metrics related to deletion compliance
    properties:
      compliance_rate:
        type: number
        description: Rate of successful deletion requests
      violations:
        type: integer
        description: Number of forgetting violations

  Latency:
    type: object
    description: Performance metrics
    properties:
      avg_ms:
        type: number
        description: Average inference time in milliseconds
      peak_ram_mb:
        type: number
        description: Peak memory usage in megabytes
      p95_ms:
        type: number
        description: 95th percentile latency

  Statistical Comparison:
    type: object
    description: Results of statistical tests between Gatekeeper and Baseline
    properties:
      method:
        type: string
        description: Statistical test used (LMM, Wilcoxon, etc.)
      statistic:
        type: number
        description: Test statistic value
      p_value:
        type: number
        description: P-value of the test
      degrees_of_freedom:
        type: number
        description: Degrees of freedom (if applicable)
      significant:
        type: boolean
        description: Whether the difference is statistically significant

  Cost Reduction:
    type: object
    description: Comparison of computational costs
    properties:
      latency_reduction_pct:
        type: number
        description: Percentage reduction in latency
      ram_reduction_pct:
        type: number
        description: Percentage reduction in RAM usage
