$schema: http://json-schema.org/draft-07/schema#
title: GateMem Benchmark Results
description: |
  Schema for benchmark results including Access Control, Utility, Forgetting, and Latency metrics.
  This schema is used to validate output files generated by the evaluation pipeline.
type: object
required:
  - metadata
  - access_control
properties:
  metadata:
    type: object
    required:
      - timestamp
      - pipeline_version
      - dataset_version
      - domains
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of the run
      pipeline_version:
        type: string
        description: Version of the evaluation pipeline
      dataset_version:
        type: string
        description: Version identifier of the GateMem dataset used
      domains:
        type: array
        items:
          type: string
        description: List of domains evaluated
      config:
        type: object
        description: Configuration parameters used for the run
        additionalProperties: true
  access_control:
    type: object
    required:
      - method
      - score
      - std_dev
      - total_samples
      - unauthorized_leaks
      - allowed_requests
    properties:
      method:
        type: string
        enum:
          - gatekeeper
          - baseline_retrieval
          - baseline_long_context
        description: The evaluation method used
      score:
        type: number
        minimum: 0
        maximum: 1
        description: Access Control score (1 - unauthorized leak rate)
      std_dev:
        type: number
        minimum: 0
        description: Standard deviation of the score
      total_samples:
        type: integer
        minimum: 0
        description: Total number of samples evaluated
      unauthorized_leaks:
        type: integer
        minimum: 0
        description: Count of unauthorized information leaks detected
      allowed_requests:
        type: integer
        minimum: 0
        description: Count of requests that were allowed through
      by_domain:
        type: array
        items:
          type: object
          required:
            - domain
            - score
            - samples
          properties:
            domain:
              type: string
            score:
              type: number
            samples:
              type: integer
  utility:
    type: object
    properties:
      method:
        type: string
      overall_success:
        type: number
      conditional_utility:
        type: number
      by_domain:
        type: array
        items:
          type: object
  forgetting:
    type: object
    properties:
      method:
        type: string
      compliance_rate:
        type: number
      by_domain:
        type: array
        items:
          type: object
  performance:
    type: object
    properties:
      method:
        type: string
      latency_ms:
        type: number
      peak_ram_mb:
        type: number
      by_domain:
        type: array
        items:
          type: object
  statistical_analysis:
    type: object
    properties:
      test_method:
        type: string
      test_statistic:
        type: number
      p_value:
        type: number
      degrees_of_freedom:
        type: number
      conclusion:
        type: string
additionalProperties: false
