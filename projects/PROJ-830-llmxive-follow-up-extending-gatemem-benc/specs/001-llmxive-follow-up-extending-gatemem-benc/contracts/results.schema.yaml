$schema: "http://json-schema.org/draft-07/schema#"
title: Benchmark Results
type: object
required:
  - Access Control
  - Utility
  - Forgetting
  - Latency
properties:
  Access Control:
    type: object
    required:
      - score
      - std_dev
      - total_episodes
    properties:
      score:
        type: number
      std_dev:
        type: number
      total_episodes:
        type: integer
  Utility:
    type: object
    required:
      - score
      - success_rate
    properties:
      score:
        type: number
      success_rate:
        type: number
  Forgetting:
    type: object
    required:
      - compliance_rate
    properties:
      compliance_rate:
        type: number
  Latency:
    type: object
    required:
      - avg_ms
      - peak_ram_mb
    properties:
      avg_ms:
        type: number
      peak_ram_mb:
        type: number
