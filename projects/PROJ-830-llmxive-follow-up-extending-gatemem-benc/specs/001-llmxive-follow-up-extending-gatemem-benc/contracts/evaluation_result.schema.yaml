$schema: "http://json-schema.org/draft-07/schema#"
title: "Evaluation Result Schema"
description: "Schema for the output of a single pipeline run on an episode."
type: object
required:
  - episode_id
  - pipeline_type
  - allowed
  - task_success
  - latency_ms
  - peak_ram_mb
properties:
  episode_id:
    type: string
    description: "Reference to the input episode."
  pipeline_type:
    type: string
    enum:
      - gatekeeper
      - retrieval_only
      - long_context
    description: "Type of pipeline used."
  allowed:
    type: boolean
    description: "Whether the pipeline allowed the query to proceed."
  generated_response:
    type: string
    description: "The LLM's generated response (optional, may be empty if blocked)."
  task_success:
    type: boolean
    description: "Calculated task success based on ground truth."
  latency_ms:
    type: number
    minimum: 0
    description: "Wall-clock inference time in milliseconds."
  peak_ram_mb:
    type: number
    minimum: 0
    description: "Peak memory usage in MB."
additionalProperties: false
