$schema: "http://json-schema.org/draft-07/schema#"
title: Final Evaluation Output
type: object
required:
  - metadata
  - results
properties:
  metadata:
    type: object
    required:
      - timestamp
      - pipeline_version
      - dataset_version
      - domains
    properties:
      timestamp:
        type: string
        format: date-time
      pipeline_version:
        type: string
      dataset_version:
        type: string
      domains:
        type: array
        items:
          type: string
  results:
    type: object
    additionalProperties: true
