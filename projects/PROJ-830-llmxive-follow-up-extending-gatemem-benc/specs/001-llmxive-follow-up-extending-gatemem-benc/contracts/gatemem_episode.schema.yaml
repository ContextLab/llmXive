$schema: "http://json-schema.org/draft-07/schema#"
title: "GateMem Episode Schema"
description: "Schema for the raw and processed GateMem dataset episodes."
type: "object"
properties:
  episode_id:
    type: "string"
    description: "Unique identifier for the episode."
  domain:
    type: "string"
    enum: ["medical", "office", "education", "household"]
    description: "Domain of the episode."
  query:
    type: "string"
    description: "User query text."
  memory_state:
    type: "string"
    description: "Retrieved or full memory context provided to the LLM."
  leak_target:
    type: "boolean"
    description: "Ground‑truth: True = allowed, False = should be blocked."
  role:
    type: "string"
    description: "User role in the context."
  deletion_request:
    type: "boolean"
    description: "Indicates if this episode contains a deletion request."
  deletion_log:
    type: "array"
    items:
      type: "string"
    description: "History of deletion actions (if applicable)."
  ground_truth_answer:
    type: "string"
    description: "Human‑annotated correct answer for utility calculation."
  ground_truth_leak:
    type: "boolean"
    description: "Ground truth label indicating if a leak occurred in this episode."
  ground_truth_deletion:
    type: "boolean"
    description: "Ground truth indicating successful deletion."
required:
  - "episode_id"
  - "domain"
  - "query"
  - "leak_target"
  - "role"
  - "ground_truth_leak"
  - "ground_truth_deletion"
additionalProperties: true