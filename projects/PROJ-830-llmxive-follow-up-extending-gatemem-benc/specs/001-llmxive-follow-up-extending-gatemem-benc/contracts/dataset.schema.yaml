$schema: "http://json-schema.org/draft-07/schema#"
title: GateMem Dataset Episode
type: object
required:
  - id
  - domain
  - leak-target
  - role
  - outcome
  - authorization_boundaries
properties:
  id:
    type: string
  domain:
    type: string
    enum: [medical, office, education, household]
  leak-target:
    type: string
  role:
    type: string
  outcome:
    type: string
    enum: [allowed, denied]
  authorization_boundaries:
    type: object
    additionalProperties: true
