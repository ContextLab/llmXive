$schema: "http://json-schema.org/draft-07/schema#"
title: "GateMem Dataset Schema"
description: "Schema for the raw GateMem dataset as used by this project."
type: "object"
properties:
  episode_id:
    type: "string"
    description: "Unique identifier."
  domain:
    type: "string"
    enum: ["medical", "office", "education", "household"]
    description: "Domain of the episode."
  query:
    type: "string"
    description: "User query text."
  memory_state:
    type: "string"
    description: "Retrieved or full memory context."
  leak_target:
    type: "boolean"
    description: "Ground‑truth: True = allowed, False = should be blocked."
  role:
    type: "string"
    description: "User role."
  deletion_request:
    type: "boolean"
    description: "Whether a deletion request is present."
  deletion_log:
    type: "array"
    items:
      type: "string"
    description: "Deletion‑log entries."
  ground_truth_answer:
    type: "string"
    description: "Human‑annotated correct answer."
  ground_truth_leak:
    type: "boolean"
    description: "Ground truth leak label."
  ground_truth_deletion:
    type: "boolean"
    description: "Ground truth deletion compliance."
required:
  - "episode_id"
  - "domain"
  - "query"
  - "leak_target"
  - "role"
  - "ground_truth_leak"
  - "ground_truth_deletion"
additionalProperties: true