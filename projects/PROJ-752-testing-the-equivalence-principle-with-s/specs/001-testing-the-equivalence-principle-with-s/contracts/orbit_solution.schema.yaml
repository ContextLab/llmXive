$schema: "http://json-schema.org/draft-07/schema#"
title: "Orbit Solution"
type: "object"
properties:
  satellite_id:
    type: "string"
  orbital_elements:
    type: "object"
    properties:
      semi_major_axis: { "type": "number" }
      eccentricity: { "type": "number" }
      inclination: { "type": "number" }
    required:
      - "semi_major_axis"
      - "eccentricity"
      - "inclination"
  non_gravitational_acceleration:
    type: "object"
    properties:
      drag_coefficient: { "type": "number" }
      srp_coefficient: { "type": "number" }
    required:
      - "drag_coefficient"
      - "srp_coefficient"
  differential_acceleration:
    type: "number"
    description: "Estimated composition-dependent acceleration a_c (m/s^2)"
  chi_squared:
    type: "number"
  residuals:
    type: "array"
    items:
      type: "number"
  covariance_matrix:
    type: "array"
    items:
      type: "array"
      items:
        type: "number"
required:
  - "satellite_id"
  - "orbital_elements"
  - "non_gravitational_acceleration"
  - "differential_acceleration"
  - "chi_squared"
  - "residuals"
  - "covariance_matrix"
additionalProperties: false