$schema: "http://json-schema.org/draft-07/schema#"
title: "OrbitSolution"
description: "Schema for a fitted orbit determination solution."
type: "object"
properties:
  satellite_id:
    type: "string"
  orbital_elements:
    type: "object"
    properties:
      a: { type: "number" }
      e: { type: "number" }
      i: { type: "number" }
      Omega: { type: "number" }
      omega: { type: "number" }
      M: { type: "number" }
    required:
      - a
      - e
      - i
      - Omega
      - omega
      - M
  non_gravitational_acceleration:
    type: "object"
    description: "Non-gravitational acceleration components."
  covariance_matrix:
    type: "array"
    items:
      type: "array"
      items:
        type: "number"
  chi_squared:
    type: "number"
  residuals:
    type: "array"
    items:
      type: "number"
  converged:
    type: "boolean"
required:
  - satellite_id
  - orbital_elements
  - non_gravitational_acceleration
  - covariance_matrix
  - chi_squared
  - residuals
  - converged
additionalProperties: false