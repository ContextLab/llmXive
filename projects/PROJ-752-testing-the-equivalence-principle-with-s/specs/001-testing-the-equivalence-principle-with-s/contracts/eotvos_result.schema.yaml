$schema: "http://json-schema.org/draft-07/schema#"
title: "EotvosResult"
description: "Schema for the Eötvös parameter test result."
type: "object"
properties:
  satellite_pair:
    type: "array"
    items:
      type: "string"
    minItems: 2
    maxItems: 2
  eta_value:
    type: "number"
  confidence_interval:
    type: "array"
    items:
      type: "number"
    minItems: 2
    maxItems: 2
  p_value:
    type: "number"
    minimum: 0
    maximum: 1
  sensitivity_sweep_data:
    type: "array"
    items:
      type: "object"
      properties:
        model:
          type: "string"
        z_score:
          type: "number"
  geopotential_model:
    type: "string"
  significance_flag:
    type: "string"
    enum:
      - "Significant"
      - "Not Significant"
      - "Unreliable"
  precision_status:
    type: "string"
    enum:
      - "Within Target"
      - "Below Target"
  robustness_score:
    type: "number"
    description: "Standard deviation of Z-scores across geopotential models."
required:
  - satellite_pair
  - eta_value
  - confidence_interval
  - p_value
  - sensitivity_sweep_data
  - geopotential_model
  - significance_flag
  - precision_status
  - robustness_score
additionalProperties: false