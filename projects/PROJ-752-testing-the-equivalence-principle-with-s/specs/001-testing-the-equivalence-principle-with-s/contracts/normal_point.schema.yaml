$schema: "http://json-schema.org/draft-07/schema#"
title: "NormalPoint"
description: "Schema for a single SLR normal point observation."
type: "object"
properties:
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of the observation."
  range:
    type: "number"
    description: "Range measurement in meters."
    minimum: 0
  satellite_id:
    type: "string"
    description: "Identifier for the satellite (e.g., LAGEOS-1)."
  station_id:
    type: "string"
    description: "Identifier for the SLR station."
  quality_flag:
    type: "number"
    description: "Residual in centimeters used for quality filtering."
required:
  - timestamp
  - range
  - satellite_id
  - station_id
  - quality_flag
additionalProperties: false