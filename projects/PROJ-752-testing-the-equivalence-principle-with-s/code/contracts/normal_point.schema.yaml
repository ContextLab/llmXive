%YAML 1.2
---
$schema: http://json-schema.org/draft-07/schema#
title: NormalPoint
description: Schema for SLR Normal Point data.
type: object
properties:
  time:
    type: number
    description: Time in seconds since epoch.
  range:
    type: number
    description: Range in meters.
  residual:
    type: number
    description: Residual in meters.
  weight:
    type: number
    description: Weight of the observation.
  satellite_id:
    type: string
    description: Satellite identifier.
required:
  - time
  - range
  - weight
  - satellite_id
