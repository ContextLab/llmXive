%YAML 1.2
---
$schema: http://json-schema.org/draft-07/schema#
title: EotvosResult
description: Schema for the Eötvös parameter result.
type: object
properties:
  eta:
    type: number
    description: The Eötvös parameter value.
  eta_std:
    type: number
    description: Standard deviation of eta.
  ac:
    type: number
    description: Differential acceleration.
  g:
    type: number
    description: Local gravity.
  confidence_interval:
    type: object
    properties:
      lower:
        type: number
      upper:
        type: number
    required:
      - lower
      - upper
  success:
    type: boolean
  message:
    type: string
required:
  - eta
  - eta_std
  - ac
  - g
  - confidence_interval
  - success
  - message
