%YAML 1.2
---
$schema: "http://json-schema.org/draft-07/schema#"
title: "EotvosResult"
description: "Schema for the final Eötvös parameter estimation result and associated metadata."
type: "object"
required:
  - "eta_value"
  - "confidence_interval"
  - "p_value"
  - "sensitivity_sweep_data"
  - "metadata"
properties:
  eta_value:
    type: "number"
    description: "The calculated Eötvös parameter (dimensionless ratio |ac|/g)."
    minimum: -1.0
    maximum: 1.0
  confidence_interval:
    type: "array"
    description: "95% confidence interval [lower_bound, upper_bound] for the eta_value."
    minItems: 2
    maxItems: 2
    items:
      type: "number"
  p_value:
    type: "number"
    description: "P-value from the statistical test (e.g., F-test) comparing the null hypothesis (eta=0) against the alternative."
    minimum: 0.0
    maximum: 1.0
  sensitivity_sweep_data:
    type: "object"
    description: "Mapping of geopotential model names to their corresponding z-score sensitivity metrics."
    additionalProperties:
      type: "number"
      description: "Z-score representing the deviation of the result when using this specific geopotential model."
  metadata:
    type: "object"
    required:
      - "timestamp"
      - "satellite_pair"
      - "data_period"
      - "model_version"
    properties:
      timestamp:
        type: "string"
        format: "date-time"
        description: "ISO 8601 timestamp of when the analysis was completed."
      satellite_pair:
        type: "array"
        description: "List of satellite IDs included in this joint estimation."
        minItems: 2
        items:
          type: "string"
      data_period:
        type: "object"
        description: "Start and end dates of the data used for the analysis."
        required:
          - "start_date"
          - "end_date"
        properties:
          start_date:
            type: "string"
            format: "date"
          end_date:
            type: "string"
            format: "date"
      model_version:
        type: "string"
        description: "Version identifier of the dynamics and estimation pipeline used."
      fit_status:
        type: "string"
        enum: ["converged", "max_iterations_reached", "diverged"]
        description: "Convergence status of the joint least-squares solver."
      chi2_null:
        type: "number"
        description: "Chi-squared value for the null hypothesis (no differential acceleration)."
      chi2_alt:
        type: "number"
        description: "Chi-squared value for the alternative hypothesis (with differential acceleration)."
      delta_chi2:
        type: "number"
        description: "Difference in chi-squared (chi2_null - chi2_alt)."
      degrees_of_freedom:
        type: "integer"
        description: "Degrees of freedom used in the F-test calculation."
additionalProperties: false