$schema: http://json-schema.org/draft-07/schema#
title: EotvosResult
description: >
  Schema defining the final metric output for the Equivalence Principle test.
  Contains the Eötvös parameter (η), differential acceleration (ac), local gravity (g),
  and associated statistical confidence intervals derived from the joint orbit solution.
type: object
required:
  - satellite_pair
  - eotvos_parameter
  - differential_acceleration
  - local_gravity
  - confidence_interval_95
  - covariance_matrix
  - solution_metadata
properties:
  satellite_pair:
    type: object
    description: Identifier of the satellite pair used in the joint fit.
    required:
      - primary
      - secondary
    properties:
      primary:
        type: string
        description: Satellite ID (e.g., LAGEOS-1, Etalon-1).
        pattern: "^[A-Z0-9-]+$"
      secondary:
        type: string
        description: Satellite ID.
        pattern: "^[A-Z0-9-]+$"

  eotvos_parameter:
    type: number
    description: >
      The calculated Eötvös parameter η = |ac| / g.
      Dimensionless quantity representing the fractional difference in acceleration.
    minimum: 0.0
    default: 0.0

  differential_acceleration:
    type: object
    description: Differential acceleration vector magnitude and uncertainty.
    required:
      - value
      - unit
      - uncertainty
    properties:
      value:
        type: number
        description: Magnitude of differential acceleration (ac).
      unit:
        type: string
        const: "m/s^2"
      uncertainty:
        type: number
        description: Standard deviation of the estimate (sigma_ac).

  local_gravity:
    type: number
    description: >
      Local gravitational acceleration (g) at the orbital altitude used for normalization.
      Typically the average gravitational acceleration of the primary satellite.
    minimum: 0.0

  confidence_interval_95:
    type: object
    description: 95% Confidence Interval for the Eötvös parameter.
    required:
      - lower
      - upper
      - coverage
    properties:
      lower:
        type: number
        description: Lower bound of the 95% CI.
      upper:
        type: number
        description: Upper bound of the 95% CI.
      coverage:
        type: number
        const: 0.95

  covariance_matrix:
    type: array
    description: >
      Joint covariance matrix for the estimated parameters [ac, g, ...].
      Used for error propagation and hypothesis testing.
      Flattened row-major order if 1D, or array of arrays if 2D.
    items:
      type: number

  solution_metadata:
    type: object
    description: Metadata regarding the orbit solution and fit quality.
    required:
      - fit_epoch_start
      - fit_epoch_end
      - chi_squared
      - degrees_of_freedom
      - rms_residuals_m
      - geopotential_model
      - convergence_status
    properties:
      fit_epoch_start:
        type: string
        format: date-time
        description: ISO 8601 start time of the fit interval.
      fit_epoch_end:
        type: string
        format: date-time
        description: ISO 8601 end time of the fit interval.
      chi_squared:
        type: number
        description: Reduced chi-squared statistic of the fit.
      degrees_of_freedom:
        type: integer
        minimum: 0
        description: Number of degrees of freedom in the fit.
      rms_residuals_m:
        type: number
        minimum: 0.0
        description: Root Mean Square of post-fit residuals in meters.
      geopotential_model:
        type: string
        description: Identifier of the geopotential model used (e.g., GGM05C).
      convergence_status:
        type: string
        enum:
          - "converged"
          - "warning"
          - "failed"
        description: Status flag from the least-squares solver.
additionalProperties: false