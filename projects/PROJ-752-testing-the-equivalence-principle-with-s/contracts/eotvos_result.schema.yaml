# Schema Definition: EotvosResult
# Defines the structure for the final Eötvös parameter estimation results.
# Used for validation of data produced by src/analysis/eotvos.py and src/models/estimator.py.

$schema: http://json-schema.org/draft-07/schema#
title: EotvosResult
description: Final metric schema for the Equivalence Principle test results.
type: object

properties:
  eta_value:
    type: number
    description: The calculated Eötvös parameter (η = |ac| / g).
    minimum: 0
    
  confidence_interval:
    type: array
    description: 95% confidence interval for eta_value as [lower_bound, upper_bound].
    items:
      type: number
    minItems: 2
    maxItems: 2
    
  p_value:
    type: number
    description: P-value for the hypothesis test (Null: η = 0).
    minimum: 0
    maximum: 1
    
  sensitivity_sweep_data:
    type: object
    description: Results from the geopotential model sensitivity analysis.
    additionalProperties:
      type: object
      properties:
        model_name:
          type: string
        z_score:
          type: number
        chi2:
          type: number
      required:
        - model_name
        - z_score
        - chi2
    description: Map of geopotential model names to their statistical metrics.
    
  metadata:
    type: object
    description: Metadata about the calculation run.
    properties:
      timestamp:
        type: string
        format: date-time
      satellite_pair:
        type: array
        items:
          type: string
      geopotential_model_primary:
        type: string
      data_points_used:
        type: integer
        minimum: 0
    required:
      - timestamp
      - satellite_pair
      - data_points_used
      
required:
  - eta_value
  - confidence_interval
  - p_value
  - sensitivity_sweep_data
  - metadata