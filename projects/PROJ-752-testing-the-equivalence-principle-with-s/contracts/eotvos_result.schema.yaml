$schema: http://json-schema.org/draft-07/schema#
title: EotvosResult
description: |
  Schema for the final Equivalence Principle test metric (Eötvös parameter $\eta$)
  and associated statistical confidence intervals derived from the joint orbit solution.
  This artifact is produced by `analysis/eotvos.py` and saved to `data/results/eotvos_metrics.json`.
type: object
required:
  - eta
  - eta_std
  - confidence_level
  - ac
  - ac_std
  - g
  - chi2
  - dof
  - p_value
  - timestamp
  - satellites
  - geopotential_model
properties:
  eta:
    type: number
    description: |
      The Eötvös parameter $\eta = |a_c| / g$.
      Represents the fractional difference in acceleration between the two test bodies.
    minimum: 0.0
  eta_std:
    type: number
    description: Standard deviation (1-sigma) of $\eta$ derived from the joint covariance matrix.
    minimum: 0.0
  confidence_level:
    type: number
    description: Confidence level (0.95 for 95% CI) used for interval calculation.
    example: 0.95
  eta_ci_lower:
    type: number
    description: Lower bound of the confidence interval for $\eta$.
  eta_ci_upper:
    type: number
    description: Upper bound of the confidence interval for $\eta$.
  ac:
    type: number
    description: |
      Differential acceleration parameter $a_c$ (m/s²) estimated from the joint solution.
      This is the shared parameter in the least-squares fit.
  ac_std:
    type: number
    description: Standard deviation (1-sigma) of $a_c$.
  g:
    type: number
    description: |
      Local gravitational acceleration $g$ (m/s²) used for normalization.
      Typically calculated at the mean orbital radius of the satellite pair.
  ac_ci_lower:
    type: number
    description: Lower bound of the confidence interval for $a_c$.
  ac_ci_upper:
    type: number
    description: Upper bound of the confidence interval for $a_c$.
  chi2:
    type: number
    description: Final reduced chi-squared statistic of the joint fit.
  dof:
    type: integer
    description: Degrees of freedom of the joint fit (observations - estimated parameters).
    minimum: 1
  p_value:
    type: number
    description: P-value associated with the null hypothesis (Equivalence Principle holds).
    minimum: 0.0
    maximum: 1.0
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the analysis was completed.
  satellites:
    type: array
    description: List of satellite IDs included in the joint analysis.
    items:
      type: string
    minItems: 2
  geopotential_model:
    type: string
    description: Identifier of the geopotential model used (e.g., 'GGM05C', 'EGM2008').
  software_version:
    type: string
    description: Version of the analysis software used.
    example: "1.0.0"
  notes:
    type: string
    description: Optional notes regarding convergence, warnings, or specific conditions.
additionalProperties: false