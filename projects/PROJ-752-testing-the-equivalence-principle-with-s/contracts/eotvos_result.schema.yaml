$schema: http://json-schema.org/draft-07/schema#
title: EotvosResult
description: >
  Schema defining the final metric output for the Equivalence Principle test.
  This schema captures the Eötvös parameter (η), its uncertainty, the differential
  acceleration (a_c), local gravity (g), and metadata regarding the joint fit
  solution used to derive these values.
type: object
required:
  - eta
  - eta_uncertainty
  - eta_confidence_level
  - differential_acceleration
  - differential_acceleration_uncertainty
  - local_gravity
  - joint_fit_metrics
  - metadata
properties:
  eta:
    type: number
    description: >
      The Eötvös parameter η = |a_c| / g.
      Represents the fractional difference in acceleration between the two
      test bodies (satellites) towards the source of gravity (Earth).
      A value of 0 indicates perfect adherence to the Equivalence Principle.
    minimum: -1.0
    maximum: 1.0
    example: 1.23e-14

  eta_uncertainty:
    type: number
    description: >
      The standard uncertainty (1σ) of the Eötvös parameter, derived from
      the joint covariance matrix of the least-squares fit.
    minimum: 0.0
    example: 4.56e-15

  eta_confidence_level:
    type: number
    description: >
      The confidence level associated with the uncertainty (e.g., 0.95 for 95% CI).
    default: 0.95
    minimum: 0.0
    maximum: 1.0

  differential_acceleration:
    type: number
    description: >
      The estimated differential acceleration a_c (m/s²) between the satellites
      along the radial direction (or specific axis defined in metadata).
      This is the primary parameter estimated in the joint fit.
    example: 1.5e-13

  differential_acceleration_uncertainty:
    type: number
    description: >
      The standard uncertainty (1σ) of the differential acceleration a_c.
    minimum: 0.0
    example: 5.5e-14

  local_gravity:
    type: number
    description: >
      The nominal local gravitational acceleration g (m/s²) at the mean orbit
      altitude of the satellites, used to normalize a_c into η.
    minimum: 0.0
    example: 0.56

  joint_fit_metrics:
    type: object
    description: Metrics from the joint least-squares orbit determination.
    required:
      - chi2
      - degrees_of_freedom
      - reduced_chi2
      - convergence_status
      - iterations
    properties:
      chi2:
        type: number
        description: The total weighted sum of squared residuals (SSR).
      degrees_of_freedom:
        type: integer
        description: Number of observations minus number of estimated parameters.
      reduced_chi2:
        type: number
        description: Chi-squared per degree of freedom.
      convergence_status:
        type: string
        description: Status string from the optimizer (e.g., 'CONVERGED', 'MAX_ITERATIONS').
      iterations:
        type: integer
        description: Number of iterations performed by the solver.

  metadata:
    type: object
    description: Contextual information about the analysis run.
    required:
      - satellites
      - observation_period
      - geopotential_model
      - software_version
    properties:
      satellites:
        type: array
        description: List of satellite IDs included in the joint fit.
        items:
          type: string
        example: ["LAGEOS-1", "LAGEOS-2"]
      observation_period:
        type: object
        description: Start and end times of the data used.
        required:
          - start
          - end
        properties:
          start:
            type: string
            format: date-time
            description: ISO 8601 timestamp of the first observation.
          end:
            type: string
            format: date-time
            description: ISO 8601 timestamp of the last observation.
      geopotential_model:
        type: string
        description: Name of the geopotential model used (e.g., GGM05C).
      software_version:
        type: string
        description: Version of the analysis pipeline.
      covariance_matrix_subset:
        type: array
        description: >
          Optional: The 2x2 covariance sub-matrix for [a_c, g] if needed for
          downstream validation, flattened row-major.
        items:
          type: number
        minItems: 4
        maxItems: 4
        example: [1.0e-27, 0.0, 0.0, 1.0e-4]

additionalProperties: false