repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        # Note: ruff format is a drop-in replacement for black
        # but we explicitly use black hook above to match config exactly
        # if you prefer ruff format, remove the black hook and uncomment below:
        # args: [--fix]
