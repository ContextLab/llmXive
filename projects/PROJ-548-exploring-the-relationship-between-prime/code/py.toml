[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.py]
# Py.toml is for Py (a Python runner), but we include standard black config here
# as per project convention for tool configuration.
# The actual Black configuration is in py.toml above.