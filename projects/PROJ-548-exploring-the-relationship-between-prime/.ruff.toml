# Ruff configuration file
# This file extends the settings in pyproject.toml for CLI usage
line-length = 88
target-version = "py39"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint]
select = [
    "E", "W", "F", "I", "C", "B",
    "UP", # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[lint.isort]
known-first-party = ["src", "tests"]
force-sort-within-sections = true
