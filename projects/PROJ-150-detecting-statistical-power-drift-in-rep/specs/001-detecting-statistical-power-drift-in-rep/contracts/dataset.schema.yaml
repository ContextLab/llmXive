$schema: "http://json-schema.org/draft-07/schema#"
title: "Cleaned Replication Study Dataset"
description: "Schema for the cleaned dataset after power calculation and missing data handling."
type: "object"
properties:
  study_id:
    type: "string"
    description: "Unique identifier for the study."
  year:
    type: "integer"
    description: "Calendar year of the replication."
  field:
    type: "string"
    description: "Discipline or field of study."
  original_study_id:
    type: "string"
    description: "ID of the original study being replicated."
  effect_size:
    type: "number"
    description: "Reported effect size (Cohen's d or log-odds)."
  sample_size:
    type: "integer"
    description: "Total sample size of the replication."
  power_estimate:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Calculated post-hoc statistical power."
required:
  - study_id
  - year
  - field
  - original_study_id
  - effect_size
  - sample_size
  - power_estimate
additionalProperties: false
