$schema: "http://json-schema.org/draft-07/schema#"
title: "ReplicationStudy Dataset Schema"
description: "Schema for the processed replication study dataset including input trends."
type: "object"
properties:
  study_id:
    type: "string"
    description: "Unique identifier for the replication study."
  year:
    type: "integer"
    description: "Calendar year of the replication."
    minimum: 1900
    maximum: 2030
  field:
    type: "string"
    description: "Discipline of the study (e.g., Psychology, Economics)."
  original_study_id:
    type: "string"
    description: "ID of the original study being replicated."
  effect_size:
    type: "number"
    description: "Reported effect size (Cohen's d or odds ratio)."
    minimum: -10.0
    maximum: 10.0
  sample_size:
    type: "integer"
    description: "Total sample size (N) of the replication."
    minimum: 1
  power_estimate:
    type: "number"
    description: "Calculated post-hoc power (0.0 to 1.0)."
    minimum: 0.0
    maximum: 1.0
required:
  - study_id
  - year
  - field
  - original_study_id
  - effect_size
  - sample_size
  - power_estimate
additionalProperties: false
