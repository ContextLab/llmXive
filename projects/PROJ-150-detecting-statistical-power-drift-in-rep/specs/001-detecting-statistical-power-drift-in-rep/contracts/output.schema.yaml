$schema: "http://json-schema.org/draft-07/schema#"
title: "DriftModelOutput"
description: "Schema for the statistical model output and robustness metrics."
type: "object"
properties:
  model_summary:
    type: "object"
    properties:
      slope_year:
        type: "number"
        description: "Estimated drift slope per calendar year."
      se_slope:
        type: "number"
        description: "Standard error of the slope estimate."
      p_value_parametric:
        type: "number"
        description: "P-value from the Likelihood Ratio Test."
      p_value_permutation:
        type: "number"
        description: "Empirical p-value from 10,000 permutations."
      random_effects_variance:
        type: "object"
        properties:
          field:
            type: "number"
          original_study_id:
            type: "number"
        required:
          - field
          - original_study_id
      model_converged:
        type: "boolean"
    required:
      - slope_year
      - se_slope
      - p_value_parametric
      - p_value_permutation
      - random_effects_variance
      - model_converged
  sensitivity_analysis:
    type: "array"
    items:
      type: "object"
      properties:
        alpha_value:
          type: "number"
          description: "Alpha threshold tested."
        drift_significant:
          type: "boolean"
          description: "Whether drift was significant at this alpha."
        false_positive_rate:
          type: "number"
          description: "Estimated false positive rate at this threshold."
      required:
        - alpha_value
        - drift_significant
        - false_positive_rate
  robust:
    type: "boolean"
    description: "True if drift significance is stable across all tested alphas."
required:
  - model_summary
  - sensitivity_analysis
  - robust
additionalProperties: false
