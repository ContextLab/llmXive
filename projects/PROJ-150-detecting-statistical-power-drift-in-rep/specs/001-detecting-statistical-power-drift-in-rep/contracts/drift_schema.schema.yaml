$schema: http://json-schema.org/draft-07/schema#
title: DriftAnalysisResult
description: Schema for the final drift analysis report output by the pipeline.
type: object
properties:
  metadata:
    type: object
    properties:
      analysis_date:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of the analysis run."
      dataset_source:
        type: string
        description: "URL or identifier of the source dataset."
      permutation_count:
        type: integer
        description: "Number of permutations performed."
      is_approximate:
        type: boolean
        description: "True if the permutation count was reduced due to timeout."
    required:
      - analysis_date
      - dataset_source
      - permutation_count
      - is_approximate
  primary_drift:
    type: object
    properties:
      slope_year:
        type: number
        description: "The estimated slope of the year fixed effect in the LMM (on residual power)."
      se_slope:
        type: number
        description: "Standard error of the slope."
      p_value_parametric:
        type: number
        description: "P-value from the parametric likelihood-ratio test."
      p_value_permutation:
        type: number
        description: "Empirical p-value from the permutation test."
      confidence_interval_95:
        type: array
        items:
          type: number
        description: "95% confidence interval [lower, upper]."
    required:
      - slope_year
      - se_slope
      - p_value_parametric
      - p_value_permutation
      - confidence_interval_95
  input_trends:
    type: object
    properties:
      effect_size_slope:
        type: number
        description: "Coefficient for effect_size in the initial power regression (for residualization)."
      sample_size_slope:
        type: number
        description: "Coefficient for sample_size in the initial power regression (for residualization)."
    required:
      - effect_size_slope
      - sample_size_slope
  sensitivity:
    type: array
    items:
      type: object
      properties:
        alpha_value:
          type: number
          description: "The alpha threshold tested."
        drift_significant:
          type: boolean
          description: "Whether drift was significant at this threshold."
      required:
        - alpha_value
        - drift_significant
  aggregation:
    type: object
    properties:
      method:
        type: string
        description: "Method used for aggregation (e.g., DerSimonian-Laird)."
      combined_drift:
        type: number
        description: "Aggregated drift estimate across fields."
      heterogeneity_i2:
        type: number
        description: "I-squared statistic for heterogeneity."
    required:
      - method
      - combined_drift
      - heterogeneity_i2
required:
  - metadata
  - primary_drift
  - input_trends
  - sensitivity
  - aggregation
additionalProperties: false