$schema: "http://json-schema.org/draft-07/schema#"
title: "Sensitivity Analysis Report"
description: "Schema for the alpha-sweep sensitivity analysis results."
type: "object"
properties:
  sensitivity_results:
    type: "array"
    items:
      type: "object"
      properties:
        alpha_value:
          type: "number"
          description: "The alpha threshold tested."
        drift_significant:
          type: "boolean"
          description: "Whether the drift was significant at this alpha."
        slope_year:
          type: "number"
          description: "Slope estimate at this alpha."
      required:
        - alpha_value
        - drift_significant
        - slope_year
  summary:
    type: "string"
    description: "Text summary of whether the result is robust across alphas."
required:
  - sensitivity_results
  - summary
additionalProperties: false