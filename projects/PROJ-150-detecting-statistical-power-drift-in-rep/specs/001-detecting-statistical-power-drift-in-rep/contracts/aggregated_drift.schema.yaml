$schema: http://json-schema.org/draft-07/schema#
title: AggregatedDrift
description: Schema for the cross-field aggregated drift estimate.
type: object
properties:
  aggregated_slope:
    type: number
    description: The combined drift slope across fields.
  aggregated_se:
    type: number
    description: Standard error of the aggregated slope.
  heterogeneity_i2:
    type: number
    description: I-squared statistic for heterogeneity between fields.
  method:
    type: string
    description: The aggregation method used.
    const: "DerSimonian-Laird"
required:
  - aggregated_slope
  - aggregated_se
  - heterogeneity_i2
  - method
additionalProperties: false