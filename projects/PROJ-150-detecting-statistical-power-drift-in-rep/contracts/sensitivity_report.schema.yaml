$schema: http://json-schema.org/draft-07/schema#
title: Sensitivity Report Schema
description: Schema for the sensitivity analysis report generated by T021.
type: object
required:
  - p_value_lrt
  - sweep_results
  - conclusion
properties:
  p_value_lrt:
    type: number
    description: The primary p-value from the Likelihood Ratio Test.
  slope_year:
    type: ["number", "null"]
    description: The slope coefficient for the year variable.
  sweep_results:
    type: array
    description: List of results for each alpha level tested.
    items:
      type: object
      required:
        - alpha
        - p_value
        - drift_significant
      properties:
        alpha:
          type: number
          description: The significance threshold being tested.
        p_value:
          type: number
          description: The observed p-value.
        drift_significant:
          type: boolean
          description: Whether the drift is significant at this alpha.
  conclusion:
    type: string
    description: A text statement concluding whether the drift is driven by a specific alpha choice or holds across the tested range.