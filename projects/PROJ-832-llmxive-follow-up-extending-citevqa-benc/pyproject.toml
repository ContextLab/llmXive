[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-citevqa"
version = "0.1.0"
description = "CiteVQA Analysis Pipeline"
requires-python = ">=3.9"
dependencies = [
    "torch-cpu",
    "transformers",
    "sentence-transformers",
    "pdfplumber",
    "scikit-learn",
    "pandas",
    "pytest",
    "memory-profiler",
    "numpy",
    "matplotlib",
    "ruff",
    "black",
]

[tool.ruff]
# Linting configuration
target-version = "py39"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
# Formatting configuration
target-version = ['py39']
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
