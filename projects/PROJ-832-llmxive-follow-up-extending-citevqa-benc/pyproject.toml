[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive"
version = "0.1.0"
description = "Automated science pipeline for CiteVQA benchmark evaluation"
requires-python = ">=3.10"
dependencies = [
    "torch==2.1.0+cpu",
    "transformers==4.36.0",
    "sentence-transformers==2.2.2",
    "pdfplumber==0.10.3",
    "scikit-learn==1.3.2",
    "pandas==2.1.3",
    "pytest==7.4.3",
    "memory-profiler==0.61.0",
    "numpy==1.24.3",
    "matplotlib==3.8.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.1.6",
    "black==23.11.0",
    "pytest-cov==4.1.0",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools]
packages = ["code", "tests"]

[tool.setuptools.package-dir]
"code" = "code"
"tests" = "tests"
