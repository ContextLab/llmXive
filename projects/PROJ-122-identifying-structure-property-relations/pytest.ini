[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cache-clear
    --color=yes
markers =
    unit: Unit tests (isolated logic)
    integration: Integration tests (module interactions)
    contract: Contract tests (schema/validation)
    slow: Marks tests that take a long time to run
    requires_data: Tests that require local data files
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:rdkit.*
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
