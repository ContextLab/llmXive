[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-122"
version = "0.1.0"
description = "Identifying Structure-Property Relations in Polymer Blends"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "rdkit",
    "scikit-learn",
    "xgboost",
    "shap",
    "pyyaml",
    "requests",
    "joblib",
    "psutil",
    "jsonschema",
    "flake8",
    "black",
    "pytest"
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
