[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-polymer-research"
version = "0.1.0"
description = "Automated science pipeline for identifying structure-property relations in polymer blends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "rdkit",
    "scikit-learn",
    "xgboost",
    "shap",
    "pyyaml",
    "requests",
    "joblib",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["utils", "tests"]
known_third_party = ["pandas", "rdkit", "sklearn", "xgboost", "shap", "yaml", "requests", "joblib", "psutil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
