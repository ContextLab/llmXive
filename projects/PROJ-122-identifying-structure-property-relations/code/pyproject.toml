[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-122"
version = "0.1.0"
description = "Identifying Structure-Property Relations in Polymer Blends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "rdkit",
    "scikit-learn",
    "xgboost",
    "shap",
    "pyyaml",
    "requests",
    "joblib",
    "psutil",
    "flake8",
    "black",
    "pytest",
    "pytest-cov"
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | \.eggs
)/
'''

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]
