$schema: "http://json-schema.org/draft-07/schema#"
title: "Output Schema for Polymer Blend Structure-Property Analysis"
description: >
  Defines the structure of all primary output artifacts generated by the pipeline,
  including processed datasets, feature matrices, model metrics, and diagnostic reports.
  This schema ensures consistency for downstream consumption and state tracking.

definitions:
  artifact_metadata:
    type: object
    required:
      - pipeline_version
      - created_at
      - source_artifacts
      - seed_context
    properties:
      pipeline_version:
        type: string
        description: "Semantic version of the pipeline that generated this output."
      created_at:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of artifact generation."
      source_artifacts:
        type: array
        items:
          type: object
          required:
            - path
            - checksum_sha256
          properties:
            path:
              type: string
              description: "Relative path to the source artifact used to generate this output."
            checksum_sha256:
              type: string
              pattern: "^[a-f0-9]{64}$"
              description: "SHA-256 checksum of the source artifact."
      seed_context:
        type: object
        properties:
          python_seed:
            type: integer
          numpy_seed:
            type: integer
          random_seed:
            type: integer
          description:
            type: string
            description: "Human-readable description of the seed configuration."

  data_quality_metrics:
    type: object
    description: "Summary of data quality checks performed on the input."
    properties:
      total_records:
        type: integer
        minimum: 0
      valid_records:
        type: integer
        minimum: 0
      excluded_records:
        type: integer
        minimum: 0
      exclusion_reasons:
        type: object
        description: "Counts of records excluded by specific validation rules."
        properties:
          invalid_smiles:
            type: integer
          weight_fraction_mismatch:
            type: integer
          missing_fields:
            type: integer
          unit_conversion_failure:
            type: integer
      tolerance_sensitivity:
        type: array
        items:
          type: object
          properties:
            threshold:
              type: number
            pass_count:
              type: integer
            pass_rate:
              type: number
              minimum: 0
              maximum: 1

  model_performance:
    type: object
    description: "Performance metrics for a trained model."
    required:
      - model_type
      - metrics
    properties:
      model_type:
        type: string
        enum:
          - RandomForest
          - XGBoost
          - LinearRegression
      metrics:
        type: object
        required:
          - mae
          - r2
        properties:
          mae:
            type: number
            description: "Mean Absolute Error on the validation set."
          r2:
            type: number
            description: "R-squared coefficient on the validation set."
          rmse:
            type: number
            description: "Root Mean Squared Error."
      feature_importance:
        type: array
        items:
          type: object
          properties:
            feature:
              type: string
            importance:
              type: number

  vif_diagnostic:
    type: object
    description: "Variance Inflation Factor diagnostic results."
    required:
      - features
    properties:
      threshold_used:
        type: number
        description: "The VIF threshold used for flagging (e.g., 5.0)."
      high_vif_features:
        type: array
        items:
          type: object
          properties:
            feature:
              type: string
            vif_score:
              type: number
      feature_vif_map:
        type: object
        additionalProperties:
          type: number

type: object
properties:
  processed_dataset:
    type: object
    description: "Schema for the main processed dataset (CSV/Parquet metadata)."
    properties:
      metadata:
        $ref: "#/definitions/artifact_metadata"
      schema:
        type: array
        items:
          type: object
          properties:
            column_name:
              type: string
            dtype:
              type: string
            description:
              type: string
      row_count:
        type: integer
      checksum_sha256:
        type: string
        pattern: "^[a-f0-9]{64}$"

  feature_matrix:
    type: object
    description: "Schema for the feature matrix artifact."
    properties:
      metadata:
        $ref: "#/definitions/artifact_metadata"
      n_features:
        type: integer
      n_samples:
        type: integer
      descriptor_count:
        type: integer
        description: "Number of molecular descriptors generated."
      interaction_features:
        type: array
        items:
          type: string
        description: "List of computed interaction features (e.g., Fox, Gordon-Taylor)."
      checksum_sha256:
        type: string
        pattern: "^[a-f0-9]{64}$"

  model_results:
    type: object
    description: "Aggregated results from model training and validation."
    properties:
      metadata:
        $ref: "#/definitions/artifact_metadata"
      baseline_metrics:
        type: object
        description: "Metrics for the linear regression baseline."
      ml_models:
        type: array
        items:
          $ref: "#/definitions/model_performance"
      statistical_comparison:
        type: object
        properties:
          test_type:
            type: string
            enum:
              - paired_t_test
          p_value:
            type: number
          significance_level:
            type: number
          conclusion:
            type: string
      shap_summary:
        type: object
        description: "Summary of SHAP values for top features."
        properties:
          top_features:
            type: array
            items:
              type: object
              properties:
                feature:
                  type: string
                mean_abs_shap:
                  type: number
                shap_values_sample:
                  type: array
                  items:
                    type: number

  diagnostic_reports:
    type: object
    description: "Collection of diagnostic reports."
    properties:
      data_quality:
        $ref: "#/definitions/data_quality_metrics"
      vif_report:
        $ref: "#/definitions/vif_diagnostic"
      stability_metrics:
        type: object
        description: "Metrics from multiple training runs."
        properties:
          n_runs:
            type: integer
          feature_stability:
            type: array
            items:
              type: object
              properties:
                feature:
                  type: string
                frequency_in_top_n:
                  type: number
                  minimum: 0
                  maximum: 1

  fallback_status:
    type: object
    description: "Status of fallback triggers if applicable."
    properties:
      triggered:
        type: boolean
      reason:
        type: string
      fallback_pipeline:
        type: string
        description: "Path to the fallback script (e.g., code/02b_fallback.py)."

required:
  - processed_dataset
  - feature_matrix
  - model_results
  - diagnostic_reports

additionalProperties: false