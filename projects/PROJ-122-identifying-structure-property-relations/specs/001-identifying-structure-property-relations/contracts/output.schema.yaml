type: object
required:
  - features
  - target
  - metadata
properties:
  features:
    type: array
    items:
      type: number
    description: "List of numerical feature values"
  target:
    type: number
    description: "Target value for regression (e.g., Tg_residual)"
  metadata:
    type: object
    properties:
      source:
        type: string
      version:
        type: string
      timestamp:
        type: string
        format: date-time
    description: "Additional information about the record"