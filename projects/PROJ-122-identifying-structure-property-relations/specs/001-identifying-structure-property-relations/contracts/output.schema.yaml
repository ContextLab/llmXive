$schema: "http://json-schema.org/draft-07/schema#"
title: "Output Schema for Structure-Property Relationship Analysis"
description: >
  Defines the structure of all output artifacts generated by the pipeline,
  including processed datasets, feature matrices, model reports, and validation logs.
  This schema ensures traceability and reproducibility of results.

type: object
properties:
  artifact_id:
    type: string
    description: "Unique identifier for the output artifact (e.g., T019c_report, T027a_target)"
    pattern: "^[A-Z]\\d{4}(_[a-z]+)?$"
    example: "T027a_target"

  artifact_type:
    type: string
    description: "Type of output artifact"
    enum:
      - processed_dataset
      - feature_matrix
      - model_metrics
      - shap_report
      - vif_diagnostics
      - data_quality_report
      - sensitivity_analysis
      - state_manifest
      - checksum_manifest

  generated_at:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of artifact generation"
    example: "2023-10-27T14:30:00Z"

  source_tasks:
    type: array
    items:
      type: string
      pattern: "^T\\d{4}"
    description: "List of task IDs that generated this artifact"
    example: ["T015", "T019", "T027a"]

  input_artifacts:
    type: array
    items:
      $ref: "#/$defs/artifact_reference"
    description: "References to input artifacts used to generate this output"

  file_path:
    type: string
    description: "Relative path to the output file from project root"
    pattern: "^(data|code|state|figures)/.*$"
    example: "data/processed/harmonized_polymer_blends.csv"

  file_format:
    type: string
    description: "Format of the output file"
    enum:
      - csv
      - json
      - parquet
      - png
      - yaml
      - pkl
      - txt

  checksum:
    $ref: "#/$defs/checksum_object"
    description: "SHA-256 checksum of the output file for integrity verification"

  schema_version:
    type: string
    description: "Version of this output schema"
    const: "1.0.0"

  metadata:
    type: object
    description: "Additional metadata specific to the artifact type"
    properties:
      row_count:
        type: integer
        minimum: 0
        description: "Number of records in dataset outputs"
      column_count:
        type: integer
        minimum: 0
        description: "Number of features/columns in matrix outputs"
      model_type:
        type: string
        description: "Type of model if applicable (e.g., 'RandomForest', 'XGBoost')"
      target_variable:
        type: string
        description: "Name of the target variable used in modeling"
      split_ratio:
        type: object
        properties:
          train:
            type: number
            minimum: 0
            maximum: 1
          validation:
            type: number
            minimum: 0
            maximum: 1
          test:
            type: number
            minimum: 0
            maximum: 1
        description: "Data split ratios"

required:
  - artifact_id
  - artifact_type
  - generated_at
  - source_tasks
  - file_path
  - file_format
  - checksum
  - schema_version

$defs:
  artifact_reference:
    type: object
    properties:
      artifact_id:
        type: string
      file_path:
        type: string
      checksum:
        $ref: "#/$defs/checksum_object"
    required:
      - artifact_id
      - file_path

  checksum_object:
    type: object
    properties:
      algorithm:
        type: string
        const: "sha256"
      value:
        type: string
        pattern: "^[a-f0-9]{64}$"
    required:
      - algorithm
      - value

examples:
  - artifact_id: "T027a_target"
    artifact_type: "processed_dataset"
    generated_at: "2023-10-27T14:30:00Z"
    source_tasks: ["T019", "T027a"]
    input_artifacts:
      - artifact_id: "T019_harmonized"
        file_path: "data/processed/harmonized_polymer_blends.csv"
    file_path: "data/processed/target_variable_dataset.csv"
    file_format: "csv"
    checksum:
      algorithm: "sha256"
      value: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
    schema_version: "1.0.0"
    metadata:
      row_count: 1500
      column_count: 45
      target_variable: "Tg_residual"

  - artifact_id: "T036_model_comparison"
    artifact_type: "model_metrics"
    generated_at: "2023-10-27T15:45:00Z"
    source_tasks: ["T033", "T034", "T035", "T036"]
    file_path: "data/features/model_comparison_metrics.json"
    file_format: "json"
    checksum:
      algorithm: "sha256"
      value: "a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456"
    schema_version: "1.0.0"
    metadata:
      model_type: "RandomForest, XGBoost, LinearRegression"
      target_variable: "Tg_residual"
      split_ratio:
        train: 0.7
        validation: 0.15
        test: 0.15