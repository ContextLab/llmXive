$schema: http://json-schema.org/draft-07/schema#
title: Polymer Blend Dataset Schema
description: |
  Schema for the harmonized polymer blend dataset.
  Defines the structure for records ingested from NIST, Polymer Database, and Materials Project.
  Enforces unit standardization (K for temperature, GPa for modulus) and weight fraction constraints.
type: object
required:
  - meta
  - records
properties:
  meta:
    type: object
    description: Metadata about the dataset generation
    required:
      - version
      - generated_at
      - source_files
      - checksum
    properties:
      version:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+$"
        description: Semantic version of the schema
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation
      source_files:
        type: array
        items:
          type: string
        description: List of raw source file paths used
      checksum:
        type: string
        pattern: "^[a-fA-F0-9]{64}$"
        description: SHA-256 checksum of the raw data files
      record_count:
        type: integer
        minimum: 0
        description: Total number of records in the dataset
      excluded_count:
        type: integer
        minimum: 0
        description: Number of records excluded due to validation failures
  records:
    type: array
    description: List of harmonized polymer blend records
    items:
      type: object
      required:
        - id
        - source
        - smiles_components
        - composition
        - tg_kelvin
        - modulus_gpa
        - weight_fractions
      properties:
        id:
          type: string
          pattern: "^[a-zA-Z0-9_-]+$"
          description: Unique identifier for the record
        source:
          type: string
          enum:
            - NIST
            - PolymerDatabase
            - MaterialsProject
          description: Origin of the data
        smiles_components:
          type: array
          items:
            type: string
            description: Valid SMILES string for each polymer component
          minItems: 2
          description: SMILES strings for all components in the blend
        composition:
          type: object
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum:
                - weight_fraction
                - volume_fraction
                - mole_fraction
              description: Type of composition metric
            value:
              type: array
              items:
                type: number
                minimum: 0
                maximum: 1
              description: Composition values for each component
        composition_normalized:
          type: array
          items:
            type: number
            minimum: 0
            maximum: 1
          description: Composition values normalized to sum to 1.0 (weight fraction)
        tg_kelvin:
          type: number
          minimum: 100
          maximum: 1000
          description: Glass transition temperature in Kelvin (converted from Celsius if necessary)
        modulus_gpa:
          type: number
          minimum: 0
          maximum: 100
          description: Young's modulus in GPa (converted from Pa if necessary)
        weight_fractions:
          type: array
          items:
            type: number
            minimum: 0
            maximum: 1
          description: Weight fractions of each component, validated to sum to 1.0 (±0.02 tolerance)
        validation_flags:
          type: array
          items:
            type: string
            enum:
              - smiles_invalid
              - composition_sum_error
              - missing_property
              - unit_conversion_failed
          description: Flags indicating any validation issues encountered (record is excluded if any present)
        raw_metadata:
          type: object
          description: Additional metadata from the source record
          additionalProperties: true
additionalProperties: false