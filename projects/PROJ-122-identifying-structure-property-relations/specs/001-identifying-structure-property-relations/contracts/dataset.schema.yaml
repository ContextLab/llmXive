$schema: "http://json-schema.org/draft-07/schema#"
title: Polymer Blend Dataset Schema
description: >
  Schema for raw and harmonized polymer blend data as defined in FR-001.
  Ensures consistency of SMILES, composition, Tg (Kelvin), and Modulus (GPa).
type: object
required:
  - smiles
  - composition
  - tg_k
  - modulus_gpa
  - source
properties:
  smiles:
    type: string
    description: >
      SMILES string representing the polymer or blend components.
      Must be a valid RDKit-parseable string.
    pattern: "^[A-Za-z0-9@\\-\\+\\[\\]\\(\\)\\\\/\\=#\\$\\%\\^\\&\\*\\~\\!\\?]+$"
    minLength: 1
  composition:
    type: array
    description: >
      Array of component weight fractions.
      Must sum to approximately 1.0 (validated at runtime).
    items:
      type: number
      minimum: 0
      maximum: 1
    minItems: 1
  tg_k:
    type: number
    description: >
      Glass transition temperature in Kelvin.
      Must be non-negative.
    minimum: 0
  modulus_gpa:
    type: number
    description: >
      Young's modulus in Gigapascals (GPa).
      Must be non-negative.
    minimum: 0
  source:
    type: string
    description: >
      Origin of the data point (e.g., 'NIST', 'PolymerDatabase', 'MaterialsProject').
      Used for stratification and traceability.
    pattern: "^[A-Za-z0-9_\\-]+$"
  metadata:
    type: object
    description: Optional additional metadata (e.g., citation, date, notes).
    additionalProperties: true
additionalProperties: false