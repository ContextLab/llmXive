$schema: "http://json-schema.org/draft-07/schema#"
title: "Structure Config Schema"
description: "Schema for data/processed/structure_config.json generated by T020a"
type: object
required:
  - type
  - n_subjects
  - model_type
properties:
  type:
    type: string
    description: "Design type: either 'within-subjects' or 'between-subjects'"
    enum:
      - "within-subjects"
      - "between-subjects"
  n_subjects:
    type: integer
    description: "Count of unique participant IDs"
    minimum: 1
  model_type:
    type: string
    description: "Recommended model type based on structure"
    enum:
      - "mixed_effects"
      - "fixed_effects"
additionalProperties: false
