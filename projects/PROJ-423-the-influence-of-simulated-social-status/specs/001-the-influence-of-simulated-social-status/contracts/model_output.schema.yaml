$schema: http://json-schema.org/draft-07/schema#
title: Structure Config Schema
description: Schema for data/processed/structure_config.json
type: object
properties:
  type:
    type: string
    description: "Data structure type: 'between-subjects' or 'within-subjects'"
    enum:
      - "between-subjects"
      - "within-subjects"
  n_subjects:
    type: integer
    description: "Number of unique participants in the dataset"
    minimum: 1
required:
  - type
  - n_subjects
additionalProperties: false