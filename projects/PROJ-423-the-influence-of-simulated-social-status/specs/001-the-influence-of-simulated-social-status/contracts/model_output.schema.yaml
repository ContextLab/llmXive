$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Output Schema"
description: "Schema for the mixed-effects regression model results."
type: object
properties:
  fixed_effects:
    type: object
    description: "Map of coefficient names to their statistics."
    additionalProperties:
      type: object
      properties:
        estimate:
          type: number
        std_err:
          type: number
        p_value:
          type: number
      required:
        - estimate
        - std_err
        - p_value
  interaction_p_value:
    type: number
    description: "P-value for the status_level:observed_behavior interaction."
  interaction_coefficient:
    type: number
    description: "Beta coefficient for the interaction term."
  vif_scores:
    type: object
    description: "Variance Inflation Factors for predictors."
    additionalProperties:
      type: number
  convergence_status:
    type: string
    description: "Status of the model fitting process."
    enum:
      - "Success"
      - "Warning"
      - "Failed"
required:
  - fixed_effects
  - interaction_p_value
  - interaction_coefficient
  - vif_scores
  - convergence_status
additionalProperties: false
