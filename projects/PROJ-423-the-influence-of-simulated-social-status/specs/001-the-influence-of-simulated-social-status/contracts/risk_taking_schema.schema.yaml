$schema: 'http://json-schema.org/draft-07/schema#'
title: Risk Taking Data Schema
description: "Schema for validating risk taking dataset."
type: array
items:
  type: object
  properties:
    participant_id:
      type: integer
      description: "Unique identifier for the participant."
    status_level:
      type: string
      enum: ["high", "low"]
      description: "Observed status of the agent (High or Low)."
    observed_behavior:
      type: string
      enum: ["risky", "conservative"]
      description: "Behavior exhibited by the observed agent."
    risk_taking_score:
      type: number
      description: "Participant's risk taking score."
  required:
    - participant_id
    - status_level
    - observed_behavior
    - risk_taking_score
