$schema: http://json-schema.org/draft-07/schema#
type: array
items:
  type: object
  properties:
    participant_id:
      type: string
      description: Unique identifier for the participant.
    status_level:
      type: string
      enum: ['high', 'low']
      description: Status of observed agent.
    observed_behavior:
      type: string
      enum: ['risky', 'conservative']
      description: Observed behavior of the agent.
    risk_taking_score:
      type: number
      description: Participant's risk-taking score (continuous or binary).
  required:
    - participant_id
    - status_level
    - observed_behavior
    - risk_taking_score
additionalProperties: false
