$schema: "http://json-schema.org/draft-07/schema#"
title: Cleaned Dataset Schema
description: "Schema for the cleaned CSV data used in analysis."
type: object
properties:
  participant_id:
    type: integer
    description: "Unique identifier for the participant."
  status_level:
    type: string
    description: "Categorical variable: 'High' or 'Low'."
    enum:
      - "High"
      - "Low"
  observed_behavior:
    type: string
    description: "Categorical variable: 'Risky' or 'Conservative'."
    enum:
      - "Risky"
      - "Conservative"
  risk_taking_score:
    type: number
    description: "Numeric score representing risk-taking behavior."
required:
  - participant_id
  - status_level
  - observed_behavior
  - risk_taking_score
additionalProperties: false
