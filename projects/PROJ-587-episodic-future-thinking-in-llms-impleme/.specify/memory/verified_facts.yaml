  quote: "Xiaomi Redmi Note 6 Pro is a smartphone developed by Xiaomi Inc. The phone\
    \ comes in three variants, the base model comes with 3 GB RAM and 32 GB of internal\
    \ storage. A variant with 4 GB RAM and 64 GB of internal storage is available\
    \ for a price tag of  \u20B913,999 (US$150). The top-end model of the device packs\
    \ 6 GB RAM and 64 GB of internal storage, which is expandable via a microSD card\
    \ up to 256 GB. The phone is a mid-range derivative of the flagship Xiaomi Mi\
    \ 8, sharing similar design elements including its notch display and dual-camera\
    \ placement, both of which resemble that of iPhone X."
