$schema: "http://json-schema.org/draft-07/schema#"
title: "EpisodicMemory"
description: "Schema for a single episodic memory entry (state, action, outcome) tuple."
type: "object"
properties:
  episode_id:
    type: "string"
    description: "Unique identifier for the episode."
  state_embedding:
    type: "array"
    items:
      type: "number"
    description: "Float32 vector representation of the state."
  action_embedding:
    type: "array"
    items:
      type: "number"
    description: "Float32 vector representation of the action."
  outcome:
    type: "string"
    description: "Text description of the outcome."
  timestamp:
    type: "number"
    description: "Unix timestamp of the event."
  confidence_score:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Model confidence in the retrieval match."
  source_dataset:
    type: "string"
    enum: ["ALFWorld", "TextWorld"]
    description: "Source dataset identifier."
  task_id:
    type: "string"
    description: "Reference to the originating planning task."
  threshold_fixed:
    type: "number"
    const: 0.75
    description: "Fixed operational threshold for retrieval (FR-002). This enforces the constraint that the operational threshold is 0.75, distinct from the sensitivity sweep."
required:
  - episode_id
  - state_embedding
  - action_embedding
  - outcome
  - timestamp
  - confidence_score
  - source_dataset
  - task_id
  - threshold_fixed
additionalProperties: false