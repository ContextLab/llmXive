$schema: "http://json-schema.org/draft-07/schema#"
title: "PlanningTask"
description: "Schema for a benchmark planning task from ALFWorld or TextWorld."
type: "object"
properties:
  task_id:
    type: "string"
    description: "Unique identifier for the task."
  initial_state:
    type: "string"
    description: "Text description of the starting state."
  goal_state:
    type: "string"
    description: "Text description of the target state."
  required_steps:
    type: "integer"
    minimum: 1
    description: "Expected number of steps to solve the task."
  episodic_dependencies:
    type: "array"
    items:
      type: "string"
    description: "List of task IDs that require episodic retrieval."
  ground_truth_solution:
    type: "array"
    items:
      type: "string"
    description: "List of actions forming the correct solution."
  environment:
    type: "string"
    enum: ["ALFWorld", "TextWorld"]
    description: "Source environment."
required:
  - task_id
  - initial_state
  - goal_state
  - required_steps
  - ground_truth_solution
  - environment
additionalProperties: false
