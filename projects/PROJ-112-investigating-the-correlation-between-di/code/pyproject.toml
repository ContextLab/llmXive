[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-112"
version = "0.1.0"
description = "Investigating the Correlation Between Dietary Fiber Intake and Gut Microbiome Composition"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.0.3",
    "scikit-learn==1.3.0",
    "scipy==1.11.1",
    "numpy==1.24.3",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "joblib==1.3.1",
    "miceforest==5.3.3",
    "rpy2==3.5.11",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: unit tests",
    "integration: integration tests",
    "contract: contract tests",
]
