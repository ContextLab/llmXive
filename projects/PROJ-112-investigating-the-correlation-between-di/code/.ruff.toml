[lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
  "W",  # pycodestyle warnings
  "UP", # uplint
  "D",  # pydocs
]
ignore = [
  "E501", # line too long (handled by black)
  "D100", # Missing docstring in public module
  "D102", # Missing docstring in public method
]
unfixable = ["F841"]
extend = ["E"]

[lint.isort]
known-first-party = ["src", "tests", "utils"]

[format]
line-length = 88

[target-version]
python = "3.11"
