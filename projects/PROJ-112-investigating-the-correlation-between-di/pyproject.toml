[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-fiber-microbiome"
version = "0.1.0"
description = "Investigating the Correlation Between Dietary Fiber Intake and Gut Microbiome Composition"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.0.3",
    "scikit-learn==1.3.0",
    "scipy==1.11.1",
    "numpy==1.24.3",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "joblib==1.3.1",
    "miceforest==5.3.3",
    "rpy2==3.5.11",
]

[project.optional-dependencies]
dev = [
    "ruff==0.1.6",
    "black==23.11.0",
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
]

[tool.ruff]
# Target Python 3.11
target-version = "py311"
line-length = 88
src = ["code/src", "code/tests"]

# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501", # Line too long (handled by black)
    "B904", # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` (too verbose for this pipeline)
]

[tool.ruff.isort]
known-first-party = ["src", "tests"]
force-sort-within-sections = true

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code/src", "code/tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
