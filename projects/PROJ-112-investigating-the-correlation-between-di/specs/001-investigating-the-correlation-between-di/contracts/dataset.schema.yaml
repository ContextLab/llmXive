$schema: "http://json-schema.org/draft-07/schema#"
title: "Harmonized Dataset Schema"
description: "Schema for the harmonized, filtered dataset after preprocessing."
type: "object"
properties:
  sample_id:
    type: "string"
    description: "Unique identifier for the sample."
  cohort:
    type: "string"
    enum: ["AGP", "UKBB"]
    description: "Source dataset."
  fiber_intake_g_day:
    type: "number"
    description: "Dietary fiber intake in grams/day."
    minimum: 0
    maximum: 200
  sequencing_depth:
    type: "integer"
    description: "Number of sequencing reads."
    minimum: 5000
  age:
    type: "number"
    description: "Age in years."
  sex:
    type: "string"
    enum: ["M", "F", "Other"]
    description: "Sex of the participant."
  bmi:
    type: "number"
    description: "Body Mass Index."
  antibiotic_use:
    type: "boolean"
    description: "Antibiotic use in the last 3 months."
  batch:
    type: "string"
    description: "Sequencing batch ID."
  missing_covariate_pct:
    type: "number"
    description: "Percentage of missing covariates."
    maximum: 20
  excluded_reason:
    type: ["string", "null"]
    description: "Reason for exclusion, if applicable."
required:
  - sample_id
  - cohort
  - fiber_intake_g_day
  - sequencing_depth
additionalProperties: false