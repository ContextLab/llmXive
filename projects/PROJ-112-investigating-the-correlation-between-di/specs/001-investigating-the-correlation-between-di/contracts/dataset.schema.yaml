$schema: "http://json-schema.org/draft-07/schema#"
title: "Harmonized Dataset Schema"
description: "Schema for the harmonized dataset after filtering and imputation."
type: object
properties:
  sample_id:
    type: string
    description: "Unique identifier for the sample."
  fiber_intake_g:
    type: number
    description: "Daily fiber intake in grams. Range: 0 to 200."
    minimum: 0
    maximum: 200
  age:
    type: number
    description: "Age in years."
  sex:
    type: string
    enum: ["M", "F"]
    description: "Sex of the participant."
  bmi:
    type: number
    description: "Body Mass Index."
  antibiotic_use:
    type: string
    enum: ["Yes", "No"]
    description: "Antibiotic use in the last 3 months."
  read_depth:
    type: integer
    description: "Total sequencing reads. Minimum 5000."
    minimum: 5000
  cohort:
    type: string
    enum: ["AGP", "UKBB"]
    description: "Source cohort."
required:
  - sample_id
  - fiber_intake_g
  - age
  - sex
  - bmi
  - antibiotic_use
  - read_depth
  - cohort
additionalProperties: false
