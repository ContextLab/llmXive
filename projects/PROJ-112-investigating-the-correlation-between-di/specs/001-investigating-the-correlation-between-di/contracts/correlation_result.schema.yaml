$schema: "http://json-schema.org/draft-07/schema#"
title: "Correlation Result Schema"
description: "Schema for Spearman ρ association analysis output (primary metric) and MaAsLin2 beta coefficients."
type: object
properties:
  taxon:
    type: string
    description: "Taxon identifier (e.g., g__Bacteroides)."
  spearman_rho:
    type: number
    description: "Spearman correlation coefficient. Rounded to 3 decimal places."
  spearman_se:
    type: number
    description: "Standard Error of Spearman ρ (via Fisher Z). Rounded to 3 decimal places."
  raw_p_value:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Raw p-value."
  q_value:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Benjamini-Hochberg adjusted q-value."
  significant:
    type: boolean
    description: "True if q_value < 0.05."
  beta_coefficient:
    type: number
    description: "Beta coefficient (Linear Regression) from MaAsLin2 on raw counts. Rounded to 3 decimal places."
  cohort:
    type: string
    enum:
      - "AGP"
      - "UKBB"
      - "Combined"
    description: "Cohort of origin."
required:
  - taxon
  - spearman_rho
  - spearman_se
  - raw_p_value
  - q_value
  - significant
  - beta_coefficient
  - cohort
additionalProperties: false