$schema: "http://json-schema.org/draft-07/schema#"
title: "Association Results Schema"
description: "Schema for the output of the association analysis (Spearman ρ)."
type: object
properties:
  taxon_id:
    type: string
    description: "Taxonomic identifier."
  spearman_rho:
    type: number
    description: "Spearman correlation coefficient. Rounded to 3 decimal places."
  spearman_se:
    type: number
    description: "Standard Error of Spearman ρ. Rounded to 3 decimal places."
  p_value:
    type: number
    description: "Raw p-value."
  q_value:
    type: number
    description: "FDR-adjusted q-value."
  significant:
    type: boolean
    description: "True if q_value < 0.05."
  beta_coefficient:
    type: number
    description: "Beta coefficient (Linear Regression) on CLR data. (Secondary metric)."
required:
  - taxon_id
  - spearman_rho
  - spearman_se
  - p_value
  - q_value
  - significant
  - beta_coefficient
additionalProperties: false
