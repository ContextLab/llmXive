$schema: "http://json-schema.org/draft-07/schema#"
title: "Differential Abundance Schema"
description: "Schema for ANCOM-II and DESeq2 results."
type: object
properties:
  taxon_id:
    type: string
    description: "Taxonomic identifier."
  method:
    type: string
    enum: ["ANCOM-II", "DESeq2"]
    description: "Method used for analysis."
  q_value:
    type: number
    description: "Adjusted p-value."
  effect_size:
    type: number
    description: "Log-fold change or W-statistic."
  direction:
    type: string
    enum: ["Positive", "Negative"]
    description: "Direction of the effect."
  replicated:
    type: boolean
    description: "True if significant (q < 0.05) in BOTH cohorts with same direction."
required:
  - taxon_id
  - method
  - q_value
  - effect_size
  - direction
  - replicated
additionalProperties: false
