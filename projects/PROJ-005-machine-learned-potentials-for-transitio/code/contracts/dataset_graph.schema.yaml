$schema: http://json-schema.org/draft-07/schema#
title: TransitionStateGraph Schema
description: >
  Schema defining the structure and attributes of a TransitionStateGraph
  used for machine-learned potentials in transition-metal catalysis.
  This schema is used for validation of the parquet data generated by
  the graph construction pipeline.
type: object
required:
  - node_attributes
  - edge_attributes
  - graph_metadata
properties:
  node_attributes:
    description: >
      Attributes associated with each node (atom) in the graph.
      Must be a list of dictionaries or a structured array compatible with pandas.
    type: array
    items:
      type: object
      required:
        - atomic_number
        - x
        - y
        - z
      properties:
        atomic_number:
          type: integer
          description: Atomic number of the element (e.g., 46 for Pd).
        x:
          type: number
          description: Cartesian coordinate X in Angstroms.
        y:
          type: number
          description: Cartesian coordinate Y in Angstroms.
        z:
          type: number
          description: Cartesian coordinate Z in Angstroms.
        is_metal:
          type: boolean
          description: True if the atom is the transition metal center.
        ligand_class:
          type: string
          enum:
            - Group_13
            - Conventional
          description: >
            Classification of the ligand scaffold associated with this node.
            Used for Leave-Ligand-Scaffold-Out (LLSO) splitting.
            Only applicable if the node belongs to a ligand fragment.
        formal_charge:
          type: integer
          description: Formal charge of the atom (default 0).
    minItems: 1
  edge_attributes:
    description: >
      Attributes associated with edges (bonds/interactions) in the graph.
      Defined by source node index, target node index, and interaction features.
    type: array
    items:
      type: object
      required:
        - source
        - target
        - distance
      properties:
        source:
          type: integer
          description: Index of the source node.
        target:
          type: integer
          description: Index of the target node.
        distance:
          type: number
          description: Euclidean distance between nodes in Angstroms.
        edge_type:
          type: string
          enum:
            - covalent
            - coordination
            - hydrogen_bond
            - steric
          description: Type of interaction represented by the edge.
    minItems: 0
  graph_metadata:
    description: >
      Global properties of the transition state graph.
    type: object
    required:
      - energy_dft
      - barrier_height
      - metal_center
      - reaction_id
    properties:
      energy_dft:
        type: number
        description: >
          Total DFT energy of the transition state structure (Hartree).
      barrier_height:
        type: number
        description: >
          Activation barrier height relative to reactants (kcal/mol).
      metal_center:
        type: integer
        description: >
          Atomic number of the transition metal center (e.g., 46 for Pd, 28 for Ni, 29 for Cu).
      ligand_class:
        type: string
        enum:
          - Group_13
          - Conventional
        description: >
          Primary classification of the ligand scaffold for the entire reaction.
          Used for splitting strategies.
      reaction_id:
        type: string
        description: Unique identifier for the reaction instance.
      geometry_source:
        type: string
        description: Source of the geometry (e.g., "QM9-TS", specific dataset ID).
      is_outlier:
        type: boolean
        description: >
          Flag indicating if the sample is an outlier (e.g., coordination > 6).
          Default is False.
      cutoff_used:
        type: number
        description: Cutoff radius used for graph construction (Angstroms).