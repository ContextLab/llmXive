# Schema Definition: TransitionStateGraph
# Project: PROJ-005-machine-learned-potentials-for-transition-metal-catalysis
# Task: T008
#
# This schema defines the structure of the graph data used for training
# machine-learned potentials on transition metal catalysis datasets.
# It corresponds to the data structure produced by src/data/graph_construction.py
# and validated by src/data/validate_graphs.py.

schema_name: TransitionStateGraph
version: "1.0.0"
description: |
  Represents a transition state geometry as a graph where nodes are atoms
  and edges represent bonds or spatial proximity within a cutoff distance.
  Includes DFT-computed energy and barrier height labels.

node_attributes:
  - name: atomic_number
    type: integer
    description: Atomic number (Z) of the atom (e.g., 6 for Carbon, 46 for Palladium).
    required: true
    constraints:
      min: 1
      max: 118

  - name: formal_charge
    type: integer
    description: Formal charge assigned to the atom.
    required: true
    default: 0

  - name: element_symbol
    type: string
    description: Chemical symbol of the element (e.g., "C", "Pd", "O").
    required: true
    pattern: "^[A-Z][a-z]?$"

  - name: ligand_class
    type: string
    description: Classification of the ligand the atom belongs to.
    required: true
    allowed_values:
      - "Group_13"
      - "Conventional"
      - "Metal_Center"
      - "Other"

  - name: x
    type: float
    description: Cartesian coordinate X (Angstroms).
    required: true

  - name: y
    type: float
    description: Cartesian coordinate Y (Angstroms).
    required: true

  - name: z
    type: float
    description: Cartesian coordinate Z (Angstroms).
    required: true

edge_attributes:
  - name: distance
    type: float
    description: Euclidean distance between connected nodes (Angstroms).
    required: true
    constraints:
      min: 0.0

  - name: edge_index
    type: tuple(integer, integer)
    description: Indices of the source and target nodes in the node array.
    required: true

graph_level_attributes:
  - name: energy_dft
    type: float
    description: Total energy of the system calculated via DFT (eV or kcal/mol, unit specified in metadata).
    required: true
    unit: "eV" # Default unit, can be overridden in metadata

  - name: barrier_height
    type: float
    description: Activation energy barrier relative to the reactant state (eV).
    required: true
    unit: "eV"

  - name: reaction_id
    type: string
    description: Unique identifier for the reaction step.
    required: true

  - name: catalyst_metal
    type: string
    description: Symbol of the transition metal catalyst (e.g., "Pd", "Ni", "Cu").
    required: true
    allowed_values:
      - "Pd"
      - "Ni"
      - "Cu"

  - name: cutoff_distance
    type: float
    description: The distance cutoff used to generate edges for this graph.
    required: true
    unit: "Angstroms"

metadata:
  source: "QM9-TS"
  generated_by: "src/data/graph_construction.py"
  validation_schema: "contracts/dataset_graph.schema.yaml"
  created_at: "ISO-8601-timestamp"