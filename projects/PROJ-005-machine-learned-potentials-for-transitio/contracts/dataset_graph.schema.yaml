# Schema Definition: TransitionStateGraph
# Project: Machine-Learned Potentials for Transition-Metal Catalysis
# Task: T008
#
# This schema defines the structure for graph-structured data representing
# transition states in catalytic reactions. It is used for validation
# in src/data/validate_graphs.py and serialization in src/data/graph_construction.py.

$schema: "http://json-schema.org/draft-07/schema#"
title: TransitionStateGraph
description: >
  A graph representation of a transition state structure, including atomic
  nodes, bonding edges, and DFT-computed energetics.

type: object
required:
  - nodes
  - edges
  - metadata

properties:
  nodes:
    type: array
    description: >
      List of atomic nodes in the graph. Each node represents an atom
      involved in the transition state.
    items:
      type: object
      required:
        - atomic_number
        - formal_charge
        - position
      properties:
        atomic_number:
          type: integer
          description: Atomic number (Z) of the element (e.g., 46 for Pd).
          minimum: 1
        formal_charge:
          type: integer
          description: Formal charge of the atom in the transition state.
          default: 0
        position:
          type: array
          description: Cartesian coordinates (x, y, z) in Angstroms.
          items:
            type: number
          minItems: 3
          maxItems: 3
        element_symbol:
          type: string
          description: Chemical symbol derived from atomic_number (e.g., "Pd").
          nullable: true
        coordination_number:
          type: number
          description: >
            Calculated coordination number based on distance cutoff (3.5 Å).
            Used for outlier detection (T018).
          nullable: true
        ligand_class:
          type: string
          description: >
            Classification of the ligand environment if applicable.
            Values: "Group 13", "Conventional", "Metal Center", "Other".
          enum:
            - "Group 13"
            - "Conventional"
            - "Metal Center"
            - "Other"
          nullable: true

  edges:
    type: array
    description: >
      List of edges representing interactions between atoms.
      Edges are typically distance-based (cutoff < 3.5 Å).
    items:
      type: object
      required:
        - source
        - target
        - distance
      properties:
        source:
          type: integer
          description: Index of the source node in the nodes array.
        target:
          type: integer
          description: Index of the target node in the nodes array.
        distance:
          type: number
          description: Euclidean distance between source and target in Angstroms.
          minimum: 0
        edge_type:
          type: string
          description: Type of interaction (e.g., "bond", "van_der_waals").
          default: "bond"

  metadata:
    type: object
    description: Global properties of the transition state system.
    required:
      - reaction_id
      - energy_dft
      - barrier_height
    properties:
      reaction_id:
        type: string
        description: Unique identifier for the reaction step (e.g., from QM9-TS).
      energy_dft:
        type: number
        description: Total DFT energy of the transition state structure (eV or Hartree).
      barrier_height:
        type: number
        description: Activation barrier height relative to reactants (eV).
        description: >
          This is the primary target variable for the ML potential training.
      reactant_energy_dft:
        type: number
        description: Total DFT energy of the reactant state (optional, for barrier calc).
        nullable: true
      product_energy_dft:
        type: number
        description: Total DFT energy of the product state (optional, for barrier calc).
        nullable: true
      metal_center:
        type: string
        description: Symbol of the transition metal center (e.g., "Pd", "Ni", "Cu").
      ligand_smiles:
        type: string
        description: SMILES string of the ligand if applicable.
        nullable: true
      cutoff_used:
        type: number
        description: Distance cutoff used to generate edges (default 3.5).
        default: 3.5
      source_dataset:
        type: string
        description: Name of the source dataset (e.g., "QM9-TS").
        default: "QM9-TS"

additionalProperties: false