$schema: http://json-schema.org/draft-07/schema#
title: TransitionStateGraph
description: |
  Schema definition for TransitionStateGraph objects used in the 
  Machine-Learned Potentials for Transition-Metal Catalysis pipeline.
  This schema defines the structure of nodes, edges, and global graph 
  properties required for GNN training and validation.

type: object
required:
  - nodes
  - edges
  - energy_dft
  - barrier_height
  - graph_id

properties:
  graph_id:
    type: string
    description: Unique identifier for the graph instance.
    examples:
      - "qm9ts_0001"
      - "qm9ts_Pd_0042"

  nodes:
    type: object
    description: Node-level attributes for each atom in the transition state.
    required:
      - atomic_numbers
      - formal_charges
      - coordinates
      - coordination_numbers
      - is_outlier
    properties:
      atomic_numbers:
        type: array
        items:
          type: integer
        description: List of atomic numbers (Z) for each node.
        minItems: 1
        examples:
          - [46, 6, 1, 1, 8]  # Pd, C, H, H, O

      formal_charges:
        type: array
        items:
          type: integer
        description: Formal charge for each node.
        minItems: 1
        examples:
          - [0, 0, 0, 0, 0]

      coordinates:
        type: array
        items:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
        description: 3D Cartesian coordinates (x, y, z) in Angstroms for each node.
        minItems: 1
        examples:
          - [[0.0, 0.0, 0.0], [1.5, 0.0, 0.0], [2.0, 1.0, 0.0]]

      coordination_numbers:
        type: array
        items:
          type: number
        description: Calculated coordination number for each node based on 
          distance-based cutoff (default 3.5 Angstroms).
        minItems: 1
        examples:
          - [4.0, 3.5, 1.0, 1.0, 2.0]

      is_outlier:
        type: array
        items:
          type: boolean
        description: Boolean flag indicating if the node has coordination number > 6.
          These are flagged for exclusion from training but retained in test sets.
        minItems: 1
        examples:
          - [false, false, false, false, false]

  edges:
    type: object
    description: Edge-level attributes representing bonds/interactions between atoms.
    required:
      - edge_index
      - distances
      - edge_features
    properties:
      edge_index:
        type: array
        items:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
        description: List of [source, target] index pairs for edges.
        minItems: 1
        examples:
          - [[0, 1], [1, 2], [0, 4]]

      distances:
        type: array
        items:
          type: number
        description: Euclidean distance between connected nodes in Angstroms.
        minItems: 1
        examples:
          - [1.5, 1.8, 2.1]

      edge_features:
        type: array
        items:
          type: array
          items:
            type: number
        description: Encoded edge features (e.g., Gaussian smearing of distances).
          Shape: (num_edges, num_gaussian_kernels).
        minItems: 1
        examples:
          - [[0.1, 0.8, 0.1, 0.0], [0.0, 0.2, 0.7, 0.1]]

  energy_dft:
    type: number
    description: Total DFT energy of the transition state structure in eV.
    examples:
      - -125.4567
      - -89.1234

  barrier_height:
    type: number
    description: Reaction barrier height (activation energy) in eV relative 
      to the reactant state.
    examples:
      - 0.85
      - 1.23

  ligand_class:
    type: string
    description: Classification of the ligand environment.
    enum:
      - Group 13
      - Conventional
      - Unknown
    examples:
      - "Group 13"
      - "Conventional"

  metal_center:
    type: string
    description: Symbol of the transition metal center.
    enum:
      - Pd
      - Ni
      - Cu
    examples:
      - "Pd"
      - "Ni"

  metadata:
    type: object
    description: Additional metadata about the graph construction.
    properties:
      source_dataset:
        type: string
        description: Name of the source dataset (e.g., "QM9-TS").
        examples:
          - "QM9-TS"

      cutoff_radius:
        type: number
        description: Distance cutoff used for edge construction in Angstroms.
        examples:
          - 3.5

      ligand_scaffold_id:
        type: string
        description: Identifier for the ligand scaffold (used in LLSO splits).
        examples:
          - "scaffold_001"
          - "scaffold_phosphine"