# Schema for TransitionStateGraph used in Machine-Learned Potentials for Transition-Metal Catalysis
# This schema defines the structure and attributes for graph-based representations of transition states.
# Used by: src/data/graph_construction.py, src/data/validate_graphs.py, tests/contract/test_graph_schema.py

version: "1.0"
graph_type: "TransitionStateGraph"
description: "Graph representation of a transition state with atomic nodes and interaction edges"

nodes:
  description: "Nodes represent atoms in the transition state structure"
  required_attributes:
    - name: atomic_number
      type: integer
      description: "Atomic number of the element (e.g., 1 for H, 6 for C, 28 for Ni, 46 for Pd, 29 for Cu)"
      constraints:
        min: 1
        max: 118
    - name: formal_charge
      type: integer
      description: "Formal charge of the atom"
      default: 0
    - name: element_symbol
      type: string
      description: "Chemical symbol of the element"
      example: "Pd", "C", "H"
    - name: coordination_number
      type: float
      description: "Calculated coordination number based on distance cutoff"
      validation:
        warning_threshold: 6.0
        note: "Values > 6.0 are chemically unusual and flagged by outlier_handler but not excluded from data"
    - name: ligand_class
      type: string
      description: "Classification of the ligand environment"
      allowed_values:
        - "Group 13"
        - "Conventional"
        - "Unknown"
      note: "Assigned during graph construction based on ligand analysis"

  optional_attributes:
    - name: x
      type: float
      description: "Cartesian x-coordinate (Angstroms)"
    - name: y
      type: float
      description: "Cartesian y-coordinate (Angstroms)"
    - name: z
      type: float
      description: "Cartesian z-coordinate (Angstroms)"
    - name: is_transition_metal
      type: boolean
      description: "True if the atom is Pd, Ni, or Cu"

edges:
  description: "Edges represent interactions between atoms within a distance cutoff"
  required_attributes:
    - name: distance
      type: float
      description: "Euclidean distance between connected atoms (Angstroms)"
      constraints:
        min: 0.0
    - name: cutoff_applied
      type: float
      description: "The distance cutoff value used to determine this edge"
      note: "Matches the optimal_cutoff from data/results/cutoff_sensitivity.json"
    - name: edge_type
      type: string
      description: "Type of interaction"
      allowed_values:
        - "bond"
        - "interaction"
        - "metal-ligand"

graph_metadata:
  description: "Global properties of the graph"
  required_attributes:
    - name: energy_dft
      type: float
      description: "Total energy from DFT calculation (eV or Hartree)"
      unit: "eV"
      note: "Primary target variable for regression"
    - name: barrier_height
      type: float
      description: "Activation barrier height relative to reactants (eV)"
      unit: "eV"
      note: "Primary target variable for regression; derived from energy_dft and reactant energies"
    - name: reaction_id
      type: string
      description: "Unique identifier for the reaction"
    - name: elementary_step
      type: string
      description: "Type of elementary step (e.g., 'oxidative_addition', 'reductive_elimination')"
    - name: transition_metal
      type: string
      description: "The transition metal center (Pd, Ni, or Cu)"
      allowed_values:
        - "Pd"
        - "Ni"
        - "Cu"
    - name: num_nodes
      type: integer
      description: "Total number of atoms in the graph"
    - name: num_edges
      type: integer
      description: "Total number of edges in the graph"
    - name: is_outlier
      type: boolean
      description: "True if coordination number > 6 (flagged for exclusion from training)"
      note: "Retained in test set but excluded from training data"

validation_rules:
  - rule: "No self-loops allowed"
    check: "source_node != target_node for all edges"
  - rule: "Atomic numbers must be valid"
    check: "1 <= atomic_number <= 118"
  - rule: "Distances must be non-negative"
    check: "distance >= 0"
  - rule: "Energy values must be finite"
    check: "isfinite(energy_dft) and isfinite(barrier_height)"

file_format:
  primary: "parquet"
  location: "data/processed/graphs.parquet"
  note: "Final canonical file generated after optimal cutoff selection (T016b)"
  intermediate: "data/processed/graphs_intermediate.parquet"
  note: "Intermediate file generated with temporary cutoff 3.5Å (T016a)"