# Schema Definition: TransitionStateGraph
# Project: PROJ-005-machine-learned-potentials-for-transition-metal-catalysis
# Task: T008
#
# This schema defines the structure and attributes for graphs representing
# transition state geometries in the QM9-TS dataset, filtered for Pd, Ni, Cu.
# It is used for validation in src/data/validate_graphs.py.

$schema: "http://json-schema.org/draft-07/schema#"
title: TransitionStateGraph
description: |
  A graph representation of a transition state geometry.
  Nodes represent atoms, edges represent spatial proximity within a cutoff.
type: object

required:
  - nodes
  - edges
  - metadata

properties:
  nodes:
    type: object
    description: "Array of node attributes for each atom in the system."
    required:
      - atomic_number
      - formal_charge
      - position
      - coordination_number
      - ligand_class
    properties:
      atomic_number:
        type: array
        items:
          type: integer
        description: "Atomic number (Z) for each atom (e.g., 46 for Pd, 28 for Ni, 29 for Cu)."
        minItems: 1
      formal_charge:
        type: array
        items:
          type: integer
        description: "Formal charge assigned to each atom."
      position:
        type: array
        items:
          type: object
          required:
            - x
            - y
            - z
          properties:
            x:
              type: number
            y:
              type: number
            z:
              type: number
        description: "3D Cartesian coordinates (Angstroms) for each atom."
      coordination_number:
        type: array
        items:
          type: number
        description: "Calculated coordination number based on 3.5 Angstrom cutoff."
      ligand_class:
        type: array
        items:
          type: string
          enum: ["Group 13", "Conventional", "Unknown"]
        description: "Classification of the ligand environment for the central metal."

  edges:
    type: object
    description: "Array of edge attributes representing pairwise interactions."
    required:
      - source
      - target
      - distance
      - edge_type
    properties:
      source:
        type: array
        items:
          type: integer
        description: "Source node indices for edges."
      target:
        type: array
        items:
          type: integer
        description: "Target node indices for edges."
      distance:
        type: array
        items:
          type: number
        description: "Euclidean distance between connected nodes (Angstroms)."
      edge_type:
        type: array
        items:
          type: string
        description: "Type of edge interaction (e.g., 'bond', 'proximity')."

  metadata:
    type: object
    description: "Global properties of the transition state complex."
    required:
      - reaction_id
      - energy_dft
      - barrier_height
      - central_metal
      - is_outlier
    properties:
      reaction_id:
        type: string
        description: "Unique identifier for the reaction step (e.g., from QM9-TS)."
      energy_dft:
        type: number
        description: "Total DFT energy of the transition state (eV or Hartree)."
      barrier_height:
        type: number
        description: "Activation barrier height relative to reactants (eV)."
      central_metal:
        type: string
        enum: ["Pd", "Ni", "Cu"]
        description: "The transition metal center of the complex."
      is_outlier:
        type: boolean
        description: "Flag indicating if the sample has coordination > 6 (excluded from training)."
      source_dataset:
        type: string
        default: "QM9-TS"
        description: "Source dataset name."
      cutoff_used:
        type: number
        default: 3.5
        description: "Distance cutoff used for graph construction (Angstroms)."

additionalProperties: false