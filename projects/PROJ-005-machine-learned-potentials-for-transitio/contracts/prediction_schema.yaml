# Prediction Schema for Machine-Learned Potentials
# Defines the structure of model outputs and ensemble results
# Used for validation of data artifacts produced by src/models/predict.py and src/models/ensemble.py

openapi: 3.0.0
info:
  title: Prediction Result Schema
  version: 1.0.0
  description: |
    Schema definitions for single model predictions and ensemble aggregation results
    used in the Transition-Metal Catalysis ML potential pipeline.

components:
  schemas:
    PredictionResult:
      type: object
      description: |
        Represents the output of a single SchNet model inference on one transition state graph.
        Includes the predicted energy, barrier height, and reference DFT values for error calculation.
      required:
        - sample_id
        - predicted_barrier_height
        - dft_barrier_height
        - predicted_energy
        - dft_energy
        - model_seed
      properties:
        sample_id:
          type: string
          description: Unique identifier for the reaction sample (e.g., from QM9-TS).
        predicted_barrier_height:
          type: number
          format: float
          description: Predicted activation energy (barrier height) in eV.
        dft_barrier_height:
          type: number
          format: float
          description: Ground truth DFT barrier height in eV.
        predicted_energy:
          type: number
          format: float
          description: Predicted total energy of the system in eV.
        dft_energy:
          type: number
          format: float
          description: Ground truth DFT total energy in eV.
        model_seed:
          type: integer
          description: Random seed used to initialize the specific model generating this prediction.
        ligand_class:
          type: string
          enum: ["Group 13", "Conventional"]
          description: Classification of the ligand environment (derived from graph construction).
        residual_barrier:
          type: number
          format: float
          description: Calculated error: predicted_barrier_height - dft_barrier_height.
        residual_energy:
          type: number
          format: float
          description: Calculated error: predicted_energy - dft_energy.

    EnsemblePredictionResult:
      type: object
      description: |
        Aggregated results from an ensemble of 5 models.
        Contains mean predictions, variance estimates, and final aggregated metrics.
      required:
        - sample_id
        - ensemble_mean_barrier
        - ensemble_std_barrier
        - ensemble_mean_energy
        - ensemble_std_energy
        - individual_predictions
        - ligand_class
      properties:
        sample_id:
          type: string
          description: Unique identifier for the reaction sample.
        ensemble_mean_barrier:
          type: number
          format: float
          description: Mean of predicted barrier heights across all ensemble members.
        ensemble_std_barrier:
          type: number
          format: float
          description: Standard deviation of predicted barrier heights (uncertainty estimate).
        ensemble_mean_energy:
          type: number
          format: float
          description: Mean of predicted total energies across all ensemble members.
        ensemble_std_energy:
          type: number
          format: float
          description: Standard deviation of predicted total energies.
        individual_predictions:
          type: array
          description: List of raw predictions from each model in the ensemble.
          items:
            $ref: '#/components/schemas/PredictionResult'
        ligand_class:
          type: string
          enum: ["Group 13", "Conventional"]
          description: Classification of the ligand environment.
        aggregated_residuals:
          type: object
          description: Aggregated error metrics for the ensemble mean.
          properties:
            mean_residual_barrier:
              type: number
              format: float
            std_residual_barrier:
              type: number
              format: float
            mean_residual_energy:
              type: number
              format: float
            std_residual_energy:
              type: number
              format: float