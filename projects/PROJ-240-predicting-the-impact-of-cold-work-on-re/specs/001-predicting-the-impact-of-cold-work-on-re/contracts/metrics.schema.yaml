$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelPerformanceMetrics"
description: "Schema for the aggregated model performance and statistical test results."
type: object
properties:
  r2_score:
    type: number
    description: "R² score of the full model on the held-out test set."
  mae:
    type: number
    description: "Mean Absolute Error of the full model on the held-out test set."
  cv_r2_mean:
    type: number
    description: "Mean R² score from 5-fold cross-validation."
  cv_r2_std:
    type: number
    description: "Standard deviation of R² scores from 5-fold cross-validation."
  permutation_p_value:
    type: number
    minimum: 0
    maximum: 1
    description: "P-value from the permutation test comparing additive vs. interaction models."
  shap_top_features:
    type: array
    items:
      type: string
    description: "List of top 5 feature names ranked by Shapley value."
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of when metrics were generated."
required:
  - r2_score
  - mae
  - cv_r2_mean
  - cv_r2_std
  - permutation_p_value
  - shap_top_features
  - timestamp
additionalProperties: false
