[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predicting-cold-work-impact"
version = "0.1.0"
description = "Predicting the Impact of Cold Work on Recrystallization Kinetics in Aluminum Alloys"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
    "shap>=0.42.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "radon>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["projects/PROJ-240-predicting-the-impact-of-cold-work-on-re/code"]

[tool.ruff]
line-length = 88
select = ["E", "W", "F"]
ignore = []
target-version = "py39"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["projects/PROJ-240-predicting-the-impact-of-cold-work-on-re/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"