T001:
  c: false
  h: e4880f6bab0b72c6d37a3985bd64b79f738ba3aac239eca4788ebf55076b62e2
  r: "The `availability_report.json` only lists a bundled local CSV (`file://\u2026\
    /example.csv`) as the dataset, which is not an openly downloadable external source.\
    \ The script never succeeded in discovering a real external Zenodo/NIST/Materials\
    \ Project dataset that contains all required variables, so the core requirement\
    \ of verifying an openly downloadable dataset is unmet. The task also fails its\
    \ own test (the script cannot be invoked from the expected path), indicating the\
    \ verification workflow is not correctly implemented. The implementer must locate\
    \ a genuine public dataset with the required column"
  sig: 1d126b04212211b1e3ec1f1a411f85f7456e4301fc2c0ee35c7407a6e9f25d68
T002:
  c: false
  h: 7624fdab1966b0cb4c4ab5c590f9b7fe32f1eb54804f097c97f8effaab40ea58
  r: "Checked `code/download_data.py` and `data/raw/checksums.txt`. The script downloads\
    \ via Python\u202Frequests (not wget/curl as required) and records computed checksums\
    \ without comparing them to any expected values, so it does not verify that the\
    \ recorded checksum matches a known reference. Consequently the task\u2019s core\
    \ requirement is not met."
  sig: aa3a90c1409d6d806379a3eb7883fdfb58edc1387545fc0c3e351486634ccc4f
T003:
  c: false
  h: 326b2bd2c11e01b237264c1312ae31b92bf95b6b7f2632e092d150e29b3b4bea
  r: "The test suite shows `test_generate_units_metadata_success` failing because\
    \ the script raises a `UnitMismatchError` for `test_source.csv`, indicating it\
    \ does not correctly recognize all required columns. Moreover, a JSON file (`bad_source_units.json`)\
    \ exists for an invalid source and contains unit entries for columns that are\
    \ not present in `bad_source.csv`, which contradicts the script\u2019s intended\
    \ behavior of skipping invalid sources. The implementation therefore does not\
    \ reliably generate correct per\u2011source metadata nor validate unit consistency\
    \ as required."
  sig: 89b3f6e8e6d8c51ce3dab522c75fbbe8cdf8216b35066ac5621bd97216cc6689
