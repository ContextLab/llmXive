  r: "The required raw files `data/raw/nist.csv`, `data/raw/zenodo.csv`, and `data/raw/materials_project.csv`\
    \ are missing, and `data/raw/checksums.txt` only lists a checksum for `example.csv`\
    \ rather than the three expected source CSVs. Consequently the task\u2019s core\
    \ requirement is not satisfied."
  sig: 46a46819dcbe2954555c24337744b684c356670ea113383b62f7364314c63c4c
