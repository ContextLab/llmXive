  h: 03a3e0c262deac4497a3d57f345ec057ffa69e138055029ca09c9fb20251751c
  r: The `verify_data_source.py` script only queries Zenodo (and does so incorrectly,
    yielding errors) and never attempts to download or check the NIST or Materials
    Project datasets. It also deliberately writes an empty `availability_report.json`
    and does not cause a CI failure when required columns are missing, contrary to
    the task specification that CI must fail if any dataset lacks a required variable.
    Consequently the required verification of **each** dataset is not performed.
  sig: a24cd1cd4f8291706715218acb80fffd8305ef4d8a661111cac654ca3cb3befb
