  r: "The script `code/verify_data_source.py` runs and creates `data/source/availability_report.json`,\
    \ but the JSON contains `\"datasets\": []`, meaning no openly downloadable dataset\
    \ with all required variables was found. Moreover, the test `tests/test_verify_data_source.py`\
    \ expects the report at a temporary location and fails because the script writes\
    \ to the project path, so the CI check does not detect the empty list as a failure.\
    \ The core requirement\u2014verifying that at least one suitable dataset exists\u2014\
    is not met."
