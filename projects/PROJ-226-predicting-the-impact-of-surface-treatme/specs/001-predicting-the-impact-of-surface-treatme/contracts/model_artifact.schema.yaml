$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelArtifact"
type: object
required:
  - model_type
  - hyperparameters
  - validation_r2
  - validation_rmse
  - test_r2
  - test_rmse
  - test_mae
  - artifact_path
  - training_timestamp
properties:
  model_type:
    type: string
    description: "\"RandomForest\", \"GradientBoosting\" or \"LinearRegression\"."
  hyperparameters:
    type: object
    description: "Dictionary of hyper‑parameter values used for training."
  validation_r2:
    type: number
    description: "R² on the validation split."
  validation_rmse:
    type: number
    description: "RMSE on the validation split."
  test_r2:
    type: number
    description: "R² on the held‑out test set."
  test_rmse:
    type: number
    description: "RMSE on the test set."
  test_mae:
    type: number
    description: "MAE on the test set."
  artifact_path:
    type: string
    description: "Relative path to the serialized model file."
  training_timestamp:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp of training completion."