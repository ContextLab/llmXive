$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Result Schema"
description: "Schema for statistical analysis output."
type: "object"
properties:
  comparison:
    type: "string"
    description: "Comparison pair (e.g., baseline_vs_llm_accuracy)."
  test_type:
    type: "string"
    description: "Type of statistical test."
    enum:
      - "GLMM"
      - "LME"
  p_value:
    type: "number"
    description: "Raw p-value."
    minimum: 0
    maximum: 1
  p_value_corrected:
    type: "number"
    description: "Holm-Bonferroni corrected p-value."
    minimum: 0
    maximum: 1
  effect_size:
    type: "number"
    description: "Odds Ratio (for GLMM) or Standardized Beta (for LME)."
  ci_lower:
    type: "number"
    description: "Lower bound of 95% CI."
  ci_upper:
    type: "number"
    description: "Upper bound of 95% CI."
required:
  - "comparison"
  - "test_type"
  - "p_value"
  - "p_value_corrected"
  - "effect_size"
  - "ci_lower"
  - "ci_upper"
additionalProperties: false