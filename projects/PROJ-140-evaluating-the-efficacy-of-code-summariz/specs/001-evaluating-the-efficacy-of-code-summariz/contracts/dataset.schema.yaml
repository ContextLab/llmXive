$schema: "http://json-schema.org/draft-07/schema#"
title: "Defects4J Dataset Schema"
description: "Schema for the Defects4J dataset extracted from HuggingFace."
type: object
properties:
  method_id:
    type: string
    description: "Unique identifier for the buggy method."
  project_name:
    type: string
    description: "Name of the Defects4J project (e.g., Chart, Math, Time)."
  bug_id:
    type: string
    description: "Unique bug identifier within the project."
  source_code:
    type: string
    description: "Full source code of the method."
  ground_truth_line:
    type: integer
    description: "Line number of the actual bug."
  context_code:
    type: string
    description: "Surrounding code context for the method."
required:
  - method_id
  - project_name
  - bug_id
  - source_code
  - ground_truth_line