$schema: "http://json-schema.org/draft-07/schema#"
title: "Interaction Log Schema"
description: "Schema for anonymized participant interaction logs."
type: "object"
properties:
  participant_id:
    type: "string"
    description: "Anonymized participant ID."
    pattern: "^P[0-9]{3}$"
  task_id:
    type: "string"
    description: "Unique task instance ID."
  condition:
    type: "string"
    description: "Summary condition."
    enum:
      - "baseline"
      - "llm"
      - "rule"
  timestamp_ms:
    type: "integer"
    description: "Time from task display to click (ms)."
    minimum: 0
  selected_line:
    type: "integer"
    description: "Line number clicked by participant."
    minimum: 1
  ground_truth_line:
    type: "integer"
    description: "Actual buggy line number."
    minimum: 1
  fallback_status:
    type: "string"
    description: "Indicates whether a fallback to rule‑based summary occurred."
    enum:
      - "none"
      - "llm_timeout"
      - "llm_error"
  is_correct:
    type: "boolean"
    description: "Whether the selected line matches the ground truth."
required:
  - "participant_id"
  - "task_id"
  - "condition"
  - "timestamp_ms"
  - "selected_line"
  - "ground_truth_line"
  - "fallback_status"
  - "is_correct"
additionalProperties: false