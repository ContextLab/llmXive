[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-286"
version = "0.1.0"
description = "The Influence of Perceived Agency in AI Interactions on Trust"
requires-python = ">=3.9"
dependencies = [
    "streamlit",
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "pingouin",
    "pytest",
    "requests",
    "pyyaml",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests", "code"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
