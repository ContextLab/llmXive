$schema: "http://json-schema.org/draft-07/schema#"
title: "Power Analysis Schema"
description: "Defines the structure for power calculation parameters and results."
type: object
required:
  - parameters
  - results
  - metadata
properties:
  parameters:
    type: object
    properties:
      effect_size:
        type: number
        description: Expected effect size (d for t-test, f for ANOVA)
      alpha:
        type: number
        description: Significance level
      power:
        type: number
        description: Target power (1 - beta)
      groups:
        type: integer
        description: Number of experimental groups
      test_type:
        type: string
        description: "Type of test (e.g., 't-test', 'ANOVA')"
    required:
      - effect_size
      - alpha
      - power
      - groups
  
  results:
    type: object
    properties:
      sample_size_per_group:
        type: integer
      total_sample_size:
        type: integer
      achieved_power:
        type: number
      noncentrality_parameter:
        type: number
    required:
      - sample_size_per_group
      - total_sample_size
      - achieved_power
  
  metadata:
    type: object
    properties:
      calculation_timestamp:
        type: string
        format: date-time
      method:
        type: string
        description: Statistical method used (e.g., F-test ANOVA, T-test)
      reference:
        type: string
        description: Citation for power calculation method
    required:
      - calculation_timestamp
      - method
