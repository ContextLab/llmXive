$schema: "http://json-schema.org/draft-07/schema#"
title: "Experimental Dataset Schema"
description: "Schema for the raw and processed data of the Perceived Agency experiment."
type: "object"
properties:
  participant_id:
    type: "string"
    description: "Unique anonymous identifier for the participant."
  condition:
    type: "string"
    description: "Experimental condition."
    enum:
      - "High"
      - "Low"
      - "Control"
  adherence_rate:
    type: "number"
    description: "Percentage of AI recommendations followed."
    minimum: 0.0
    maximum: 100.0
  trust_score:
    type: "number"
    description: "Aggregated trust score from Lee & See (2004) scale (1-7)."
    minimum: 1.0
    maximum: 7.0
  attention_check:
    type: "boolean"
    description: "Whether the participant passed the attention check."
  completion_time:
    type: "integer"
    description: "Time in seconds to complete the task."
    minimum: 0
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of task completion."
required:
  - participant_id
  - condition
  - adherence_rate
  - trust_score
  - attention_check
  - completion_time
  - timestamp
additionalProperties: false