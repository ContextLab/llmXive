$schema: "http://json-schema.org/draft-07/schema#"
title: "Participant Data Schema"
description: "Defines the structure for raw experimental data exports. Note: Trust items use a 7-point Likert scale (1-7) as per Lee & See (2004). Trust_score is derived but included in raw output for schema compliance."
type: object
required:
  - participant_id
  - condition
  - adherence_rate
  - trust_item_1
  - trust_item_2
  - trust_item_3
  - trust_item_4
  - trust_item_5
  - trust_item_6
  - trust_item_7
  - trust_item_8
  - trust_item_9
  - trust_item_10
  - trust_item_11
  - trust_item_12
  - trust_score
  - perceived_agency_score
  - cognitive_load_score
  - attention_score
  - completion_time
  - timestamp
properties:
  participant_id:
    type: string
    description: Unique UUID for the participant
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
  
  condition:
    type: string
    description: Experimental condition assignment
    enum:
      - High
      - Low
      - Control
  
  adherence_rate:
    type: number
    description: Percentage of AI recommendations followed
    minimum: 0
    maximum: 100
  
  trust_item_1:
    type: integer
    description: "Trust item 1: I trust this system"
    minimum: 1
    maximum: 7
  
  trust_item_2:
    type: integer
    description: "Trust item 2: I feel confident in this system"
    minimum: 1
    maximum: 7
  
  trust_item_3:
    type: integer
    description: "Trust item 3: I believe this system is reliable"
    minimum: 1
    maximum: 7
  
  trust_item_4:
    type: integer
    description: "Trust item 4: I feel this system is competent"
    minimum: 1
    maximum: 7
  
  trust_item_5:
    type: integer
    description: "Trust item 5: I feel this system is predictable"
    minimum: 1
    maximum: 7
  
  trust_item_6:
    type: integer
    description: "Trust item 6: I feel this system is safe"
    minimum: 1
    maximum: 7
  
  trust_item_7:
    type: integer
    description: "Trust item 7: I feel this system is honest"
    minimum: 1
    maximum: 7
  
  trust_item_8:
    type: integer
    description: "Trust item 8: I feel this system is benevolent"
    minimum: 1
    maximum: 7
  
  trust_item_9:
    type: integer
    description: "Trust item 9: I feel this system is capable"
    minimum: 1
    maximum: 7
  
  trust_item_10:
    type: integer
    description: "Trust item 10: I feel this system is useful"
    minimum: 1
    maximum: 7
  
  trust_item_11:
    type: integer
    description: "Trust item 11: I feel this system is accurate"
    minimum: 1
    maximum: 7
  
  trust_item_12:
    type: integer
    description: "Trust item 12: I feel this system is effective"
    minimum: 1
    maximum: 7
  
  trust_score:
    type: number
    description: Derived mean of 12 trust items (1-7 scale)
    minimum: 1.0
    maximum: 7.0
  
  perceived_agency_score:
    type: integer
    description: Manipulation check: Perceived agency (1-7 Likert)
    minimum: 1
    maximum: 7
  
  cognitive_load_score:
    type: integer
    description: Manipulation check: Cognitive load (1-7 Likert)
    minimum: 1
    maximum: 7
  
  attention_score:
    type: number
    description: Continuous attention metric (0-100)
    minimum: 0
    maximum: 100
  
  completion_time:
    type: integer
    description: Time in seconds to complete the task
    minimum: 0
  
  timestamp:
    type: string
    description: ISO 8601 timestamp of data export
    format: date-time

additionalProperties: false