$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Output Schema"
description: "Schema for the statistical analysis results."
type: "object"
properties:
  planned_contrasts:
    type: "object"
    description: "Results of planned directional contrasts (High vs. Low)."
    properties:
      high_vs_low:
        type: "object"
        properties:
          t_statistic:
            type: "number"
          p_value:
            type: "number"
          degrees_of_freedom:
            type: "integer"
          significant:
            type: "boolean"
      high_low_vs_control:
        type: "object"
        properties:
          t_statistic:
            type: "number"
          p_value:
            type: "number"
          degrees_of_freedom:
            type: "integer"
          significant:
            type: "boolean"
  pairwise_comparisons:
    type: "object"
    description: "Results of post-hoc pairwise comparisons."
    properties:
      high_vs_low:
        type: "object"
        properties:
          p_value_raw:
            type: "number"
          p_value_adjusted:
            type: "number"
          significant:
            type: "boolean"
      high_vs_control:
        type: "object"
        properties:
          p_value_raw:
            type: "number"
          p_value_adjusted:
            type: "number"
          significant:
            type: "boolean"
      low_vs_control:
        type: "object"
        properties:
          p_value_raw:
            type: "number"
          p_value_adjusted:
            type: "number"
          significant:
            type: "boolean"
  effect_sizes:
    type: "object"
    description: "Cohen's d for significant pairwise comparisons."
    additionalProperties:
      type: "number"
  power_analysis:
    type: "object"
    description: "Pre-study power calculation results."
    properties:
      required_sample_size:
        type: "integer"
      achieved_power:
        type: "number"
      effect_size:
        type: "number"
      alpha:
        type: "number"
  sensitivity_analysis:
    type: "object"
    description: "Results of threshold sensitivity sweep."
    properties:
      thresholds_tested:
        type: "array"
        items:
          type: "number"
      stability_report:
        type: "string"
required:
  - planned_contrasts
  - pairwise_comparisons
  - effect_sizes
  - power_analysis
  - sensitivity_analysis
additionalProperties: false
