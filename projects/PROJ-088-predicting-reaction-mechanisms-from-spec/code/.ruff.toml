[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in ML)
]
# Allow autofix for all enabled rules (if --fix is passed)
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"tests/*" = ["S101"] # Allow asserts in tests

[format]
# Use double quotes for strings, consistent with Black
quote-style = "double"
# Indent with spaces, consistent with Black
indent-style = "space"
# Skip magic trailing comma, consistent with Black default
skip-magic-trailing-comma = false
# Line length consistent with Black
line-length = 88
