[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predicting-reaction-mechanisms"
version = "0.1.0"
description = "Predicting Reaction Mechanisms from Spectroscopic Data with Machine Learning"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn",
    "xgboost",
    "pandas",
    "numpy",
    "datasets",
    "pyyaml",
    "pytest",
    "pubchempy",
    "pyscf",
    "ruff",
    "black",
]

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # Line too long (handled by black)
    "B008",   # Do not perform function call in argument defaults (common in ML)
    "B006",   # Do not use mutable data structures for argument defaults (common in ML)
]

# Allow autofix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []

# Exclude a few specific directories that are not part of the main source.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "data",
    "state",
    "specs",
]

# Same as the default for `src` layout.
src = ["code/src", "code/tests", "code/scripts"]

# Allow unused variables in `__init__.py` files to support package structure.
per-file-ignores = { "code/src/__init__.py" = ["F401", "F403"], "code/tests/__init__.py" = ["F401"] }

# Assume Python 3.11
target-version = "py311"

[tool.ruff.isort]
known-first-party = ["src", "tests", "scripts"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
  | state
  | specs
)/
'''

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code/src", "code/scripts", "code/tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
