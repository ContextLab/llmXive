$schema: "http://json-schema.org/draft-07/schema#"
title: "Reaction Mechanism Spectroscopic Dataset Schema"
description: "Schema for the unified dataset containing IR and NMR spectroscopic data with reaction mechanism labels."
type: object
required:
  - metadata
  - records

metadata:
  type: object
  properties:
    version:
      type: string
      description: "Schema version"
    generated_at:
      type: string
      format: date-time
      description: "Timestamp of generation"
    source:
      type: string
      description: "Primary data source (e.g., 'NIST', 'PubChem', 'Merged')"
    provenance:
      type: string
      description: "Origin of the data provenance"
      enum:
        - "kinetic_studies"
        - "validated_intermediate"
      # CRITICAL: The 'provenance' field must be strictly one of these two values.
      # Any data row with a missing, ambiguous, or different value must be excluded
      # during ingestion (T011/T012).

records:
  type: array
  items:
    type: object
    required:
      - spectrum_id
      - mechanism_label
      - ir_spectrum
      - nmr_spectrum
      - provenance
      - data_source
    properties:
      spectrum_id:
        type: string
        description: "Unique identifier for the spectrum"
      mechanism_label:
        type: string
        description: "Reaction mechanism classification"
        enum:
          - "SN1"
          - "SN2"
          - "E1"
      ir_spectrum:
        type: array
        items:
          type: number
        description: "Binned IR spectrum intensity values (cm-1)"
      nmr_spectrum:
        type: array
        items:
          type: number
        description: "Binned NMR spectrum intensity values (ppm)"
      provenance:
        type: string
        description: "Source verification status"
        enum:
          - "kinetic_studies"
          - "validated_intermediate"
        # Enforcement: Rows with provenance not in this list are excluded.
      data_source:
        type: string
        description: "Original database source"
        enum:
          - "NIST"
          - "PubChem"
      metadata:
        type: object
        description: "Additional optional metadata"
        properties:
          temperature:
            type: number
          solvent:
            type: string
