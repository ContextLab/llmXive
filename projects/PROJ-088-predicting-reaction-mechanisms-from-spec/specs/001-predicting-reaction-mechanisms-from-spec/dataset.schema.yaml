%YAML 1.2
---
# Schema for the processed reaction mechanism dataset
# Used for validation of data ingestion and preprocessing outputs
# Corresponds to US1: Data Ingestion and Preprocessing Pipeline

$schema: "http://json-schema.org/draft-07/schema#"
title: ReactionMechanismDataset
description: >
  A structured dataset containing spectroscopic fingerprints and reaction mechanism labels.
  Data is derived from NIST WebBook and PubChem, filtered by provenance (kinetic studies only).

type: object
required:
  - metadata
  - data

properties:
  metadata:
    type: object
    description: Metadata about the dataset generation
    required:
      - version
      - source
      - provenance_filter_applied
      - created_at
      - checksum
    properties:
      version:
        type: string
        description: Schema version (e.g., "1.0.0")
      source:
        type: array
        description: List of original data sources
        items:
          type: string
          enum:
            - "NIST_WebBook_IR"
            - "PubChem_NMR"
      provenance_filter_applied:
        type: boolean
        description: True if non-kinetic studies were excluded (FR-008)
      created_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation
      checksum:
        type: string
        description: SHA-256 checksum of the data payload (Principle III)
      row_count:
        type: integer
        minimum: 0
        description: Total number of valid records

  data:
    type: array
    description: Array of reaction records
    items:
      type: object
      required:
        - record_id
        - spectrum
        - label
        - provenance
      properties:
        record_id:
          type: string
          description: Unique identifier for the record
        spectrum:
          type: array
          description: Binned and normalized spectrum (512 elements)
          items:
            type: number
            format: float
          minItems: 512
          maxItems: 512
        label:
          type: string
          description: Reaction mechanism class
          enum:
            - "SN1"
            - "SN2"
            - "E1"
            - "E2"
            - "Unknown"
        provenance:
          type: string
          description: Source of the label validation
          enum:
            - "kinetic_studies"
            - "validated_intermediates"
        original_source_id:
          type: string
          description: ID from the original database (NIST/PubChem)
        frequency_range:
          type: object
          description: Original frequency range of the spectrum
          required:
            - min
            - max
            - unit
          properties:
            min:
              type: number
            max:
              type: number
            unit:
              type: string
              enum: ["cm-1", "ppm"]

additionalProperties: false
