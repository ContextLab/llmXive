%YAML 1.2
---
# Schema for model training and analysis outputs
# Used for validation of modeling and analysis pipeline results
# Corresponds to US2 (Training) and US3 (Feature Importance)

$schema: "http://json-schema.org/draft-07/schema#"
title: ModelTrainingReport
description: >
  Structured report generated by the model training pipeline.
  Contains performance metrics, cross-validation details, and feature importance.

type: object
required:
  - metadata
  - training_results
  - feature_importance

properties:
  metadata:
    type: object
    description: Run metadata
    required:
      - model_type
      - run_id
      - seed
      - timestamp
    properties:
      model_type:
        type: string
        enum:
          - "RandomForest"
          - "XGBoost"
      run_id:
        type: string
        description: Unique identifier for the training run
      seed:
        type: integer
        description: Random seed used for reproducibility
      timestamp:
        type: string
        format: date-time
      runtime_seconds:
        type: number
        minimum: 0
      peak_memory_mb:
        type: number
        minimum: 0

  training_results:
    type: object
    description: Cross-validation results
    required:
      - cv_folds
      - metrics
    properties:
      cv_folds:
        type: integer
        description: Number of folds used (e.g., 5)
      metrics:
        type: object
        required:
          - accuracy
          - f1_macro
          - f1_weighted
        properties:
          accuracy:
            type: object
            required:
              - mean
              - std
            properties:
              mean:
                type: number
                minimum: 0
                maximum: 1
              std:
                type: number
                minimum: 0
          f1_macro:
            type: object
            required:
              - mean
              - std
            properties:
              mean:
                type: number
                minimum: 0
                maximum: 1
              std:
                type: number
                minimum: 0
          f1_weighted:
            type: object
            required:
              - mean
              - std
            properties:
              mean:
                type: number
                minimum: 0
                maximum: 1
              std:
                type: number
                minimum: 0
          confusion_matrix:
            type: array
            description: 3x3 matrix for classes [SN1, SN2, E1]
            items:
              type: array
              items:
                type: integer
            minItems: 3
            maxItems: 3
      per_fold_metrics:
        type: array
        description: Metrics for each individual fold
        items:
          type: object
          properties:
            fold_index:
              type: integer
            accuracy:
              type: number
            f1_macro:
              type: number

  feature_importance:
    type: object
    description: Feature importance analysis results
    required:
      - top_features
      - stability_variance
    properties:
      top_features:
        type: array
        description: Top 10 most important bins
        items:
          type: object
          required:
            - bin_index
            - importance_score
            - frequency_range_estimate
          properties:
            bin_index:
              type: integer
            importance_score:
              type: number
            frequency_range_estimate:
              type: string
              description: e.g., "1700-1750 cm-1"
      stability_variance:
        type: array
        description: Variance of importance scores across folds
        items:
          type: object
          required:
            - bin_index
            - variance
          properties:
            bin_index:
              type: integer
            variance:
              type: number
              minimum: 0
      significance:
        type: object
        description: Benjamini-Hochberg corrected significance
        required:
          - significant_bins
          - p_value_threshold
        properties:
          significant_bins:
            type: array
            items:
              type: integer
          p_value_threshold:
            type: number
            minimum: 0
            maximum: 1

  warnings:
    type: array
    description: List of warnings generated during training (e.g., class imbalance)
    items:
      type: string

additionalProperties: false
