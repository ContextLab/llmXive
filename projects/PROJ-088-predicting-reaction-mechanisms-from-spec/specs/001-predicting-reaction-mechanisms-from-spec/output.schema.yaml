$schema: "http://json-schema.org/draft-07/schema#"
title: "Modeling Output Schema"
description: "Schema for the output artifacts generated by the modeling and analysis pipeline."
type: object
required:
  - training_results
  - feature_importance
properties:
  training_results:
    type: object
    description: "Results from model training and cross‑validation."
    required:
      - cv_folds
      - metrics
    properties:
      cv_folds:
        type: array
        description: "Cross‑validation fold results."
        items:
          type: object
          properties:
            fold_index:
              type: integer
            train_indices:
              type: array
              items:
                type: integer
            test_indices:
              type: array
              items:
                type: integer
            metrics:
              type: object
              description: "Metrics for this fold."
              properties:
                accuracy:
                  type: number
                f1_macro:
                  type: number
                f1_weighted:
                  type: number
          required:
            - fold_index
            - train_indices
            - test_indices
            - metrics
      metrics:
        type: object
        description: "Aggregated performance metrics."
        required:
          - accuracy
          - f1_macro
          - f1_weighted
        properties:
          accuracy:
            type: object
            description: "Overall accuracy statistics."
            required:
              - mean
              - std
            properties:
              mean:
                type: number
              std:
                type: number
          f1_macro:
            type: number
            description: "Macro‑averaged F1 score."
          f1_weighted:
            type: number
            description: "Weighted‑averaged F1 score."
  feature_importance:
    type: object
    description: "Feature importance reporting."
    required:
      - top_features
      - stability_variance
    properties:
      top_features:
        type: array
        description: "List of top spectral bins with importance scores."
        items:
          type: object
          properties:
            bin_id:
              type: integer
            importance:
              type: number
          required:
            - bin_id
            - importance
      stability_variance:
        type: array
        description: "Variance of importance scores across CV folds per bin."
        items:
          type: object
          properties:
            bin_id:
              type: integer
            variance:
              type: number
          required:
            - bin_id
            - variance