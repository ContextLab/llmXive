$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Training and Analysis Output Schema"
description: "Schema for model training reports and analysis outputs."
type: object
required:
  - report_metadata
  - model_performance
  - feature_analysis

report_metadata:
  type: object
  properties:
    generated_at:
      type: string
      format: date-time
    model_type:
      type: string
      enum:
        - "RandomForest"
        - "XGBoost"
    cross_validation_folds:
      type: integer
      minimum: 2
    seed:
      type: integer
    data_source_provenance:
      type: string
      enum:
        - "kinetic_studies"
        - "validated_intermediate"
      description: "The provenance of the data used for training"

model_performance:
  type: object
  properties:
    mean_accuracy:
      type: number
      minimum: 0.0
      maximum: 1.0
    std_accuracy:
      type: number
      minimum: 0.0
    per_class_metrics:
      type: object
      properties:
        SN1:
          $ref: "#/definitions/class_metrics"
        SN2:
          $ref: "#/definitions/class_metrics"
        E1:
          $ref: "#/definitions/class_metrics"
    confusion_matrix:
      type: array
      items:
        type: array
        items:
          type: integer

feature_analysis:
  type: object
  properties:
    top_features:
      type: array
      items:
        type: object
        properties:
          bin_id:
            type: integer
          importance_score:
            type: number
          p_value:
            type: number
          is_significant:
            type: boolean
    stability_variance:
      type: array
      items:
        type: object
        properties:
          bin_id:
            type: integer
          variance:
            type: number
          is_stable:
            type: boolean

definitions:
  class_metrics:
    type: object
    properties:
      precision:
        type: number
        minimum: 0.0
        maximum: 1.0
      recall:
        type: number
        minimum: 0.0
        maximum: 1.0
      f1_score:
        type: number
        minimum: 0.0
        maximum: 1.0
      support:
        type: integer
        minimum: 0