$schema: "http://json-schema.org/draft-07/schema#"
title: "StatisticalResult"
description: "Outcome of a hypothesis test (KS or Chi-squared). This file is deprecated; use statistical-result.schema.yaml."
type: "object"
properties:
  test_type:
    type: "string"
    enum: ["KS", "ChiSquare"]
    description: "Type of statistical test performed."
  group_label:
    type: "string"
    description: "Identifier for the group (e.g., 'Steel_10Hz')."
  statistic_value:
    type: "number"
    description: "The calculated test statistic."
  p_value:
    type: "number"
    description: "Raw p-value from the test."
  is_significant:
    type: "boolean"
    description: "Whether the null hypothesis is rejected at the default threshold."
  corrected_p_value:
    type: "number"
    description: "P-value after Benjamini-Hochberg correction."
  threshold:
    type: "number"
    description: "Alpha threshold used for the test."
required:
  - test_type
  - group_label
  - statistic_value
  - p_value
  - is_significant
  - corrected_p_value
  - threshold
additionalProperties: false
