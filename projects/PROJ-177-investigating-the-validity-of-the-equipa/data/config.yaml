# Configuration for granular system energy calculation
mass: 0.01  # kg (example: 10g particle)
inertia: 0.000004  # kg*m^2 (example: 2/5 * m * r^2 with r=0.01m)
gravity: 9.81  # m/s^2
k_spring: 100.0  # N/m (vibrational spring constant)
z_ref: 0.0  # reference height for potential energy
material_properties:
  steel:
    density: 7850  # kg/m^3
    radius: 0.0025  # m
  polymer:
    density: 1200  # kg/m^3
    radius: 0.0025  # m
frequency_bins:
  low: [0, 50]
  medium: [50, 150]
  high: [150, 300]
