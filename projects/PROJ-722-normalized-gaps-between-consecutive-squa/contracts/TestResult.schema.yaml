$schema: http://json-schema.org/draft-07/schema#
title: TestResult
description: >
  Schema for the Lilliefors goodness-of-fit test results comparing
  normalized squarefree gaps against an Exponential(1) distribution.
type: object
required:
  - ks_statistic
  - p_value
  - n_samples
  - n_cutoff
  - timestamp
  - control_comparison
properties:
  ks_statistic:
    type: number
    description: The Kolmogorov-Smirnov statistic computed on the normalized gaps.
  p_value:
    type: number
    description: >
      The Monte Carlo estimated p-value for the Lilliefors test.
      Values near 1.0 suggest the data is consistent with Exponential(1).
  n_samples:
    type: integer
    description: Number of normalized gaps used in the test.
  n_cutoff:
    type: integer
    description: The N cutoff used to generate the squarefree numbers.
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the test was executed.
  control_comparison:
    type: object
    description: Comparison metrics against the Random Thinning control.
    required:
      - control_ks_statistic
      - ks_difference
      - threshold_passed
    properties:
      control_ks_statistic:
        type: number
        description: KS statistic for the Random Thinning control dataset.
      ks_difference:
        type: number
        description: Absolute difference between Squarefree KS and Control KS.
      threshold_passed:
        type: boolean
        description: True if ks_difference < 0.01 (SC-006).
  notes:
    type: string
    description: Optional notes or warnings regarding the test execution.
