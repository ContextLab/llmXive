$schema: "http://json-schema.org/draft-07/schema#"
title: "UQ Prediction Output Schema (SSoT)"
description: "Schema for UQ prediction CSVs generated by ensemble, mc_dropout, and sparse_gp methods. This is the Single Source of Truth."
type: "object"
properties:
  material_id:
    type: "string"
    description: "Unique identifier for the material sample."
  method:
    type: "string"
    description: "UQ method used: 'ensemble', 'mc_dropout', or 'sparse_gp'."
    enum:
      - "ensemble"
      - "mc_dropout"
      - "sparse_gp"
  prediction:
    type: "number"
    description: "Point prediction for the target property."
  lower_bound_50:
    type: "number"
    description: "Lower bound of the 50% confidence interval."
  upper_bound_50:
    type: "number"
    description: "Upper bound of the 50% confidence interval."
  lower_bound_90:
    type: "number"
    description: "Lower bound of the 90% confidence interval."
  upper_bound_90:
    type: "number"
    description: "Upper bound of the 90% confidence interval."
  variance:
    type: "number"
    description: "Total predictive variance estimate."
  aleatoric_variance:
    type: "number"
    description: "Aleatoric uncertainty component (exp(log_var) for NNs)."
  epistemic_variance:
    type: "number"
    description: "Epistemic uncertainty component (variance of means)."
  uncertainty_type:
    type: "string"
    description: "Type of uncertainty captured: 'aleatoric', 'epistemic', or 'total'."
    enum:
      - "aleatoric"
      - "epistemic"
      - "total"
  reconstruction_variance:
    type: "number"
    description: "Reconstruction variance for Sparse GP (optional, FR-005)."
required:
  - "material_id"
  - "method"
  - "prediction"
  - "lower_bound_50"
  - "upper_bound_50"
  - "lower_bound_90"
  - "upper_bound_90"
  - "variance"
  - "aleatoric_variance"
  - "epistemic_variance"
  - "uncertainty_type"
additionalProperties: false