$schema: "http://json-schema.org/draft-07/schema#"
title: "MaterialSample Dataset Schema"
description: "Schema for the processed OQMD dataset used in training and evaluation."
type: object
properties:
  id:
    type: string
    description: "Unique identifier for the material sample."
  composition:
    type: object
    description: "Elemental composition fractions."
    additionalProperties:
      type: number
      minimum: 0
      maximum: 1
  structural_descriptors:
    type: object
    description: "Computed structural features."
    properties:
      atomic_radius:
        type: number
        description: "Average atomic radius in Angstroms."
      packing_fraction:
        type: number
        description: "Packing fraction of the crystal structure."
    required:
      - atomic_radius
      - packing_fraction
  formation_energy:
    type: number
    description: "Formation energy in eV/atom."
  bulk_modulus:
    type: number
    description: "Bulk modulus in GPa."
  band_gap:
    type: number
    description: "Band gap in eV."
required:
  - id
  - composition
  - structural_descriptors
  - formation_energy
  - bulk_modulus
  - band_gap
additionalProperties: false