$schema: "http://json-schema.org/draft-07/schema#"
title: "UQ Prediction Schema"
description: "Schema for the output of uncertainty quantification inference."
type: object
properties:
  sample_id:
    type: string
    description: "Reference to the MaterialSample ID."
  method:
    type: string
    enum:
      - deep_ensemble
      - mc_dropout
      - sparse_gp
    description: "The UQ method used."
  prediction_mean:
    type: number
    description: "Predicted mean value."
  prediction_variance:
    type: number
    description: "Total predictive variance."
  aleatoric_variance:
    type: number
    description: "Aleatoric uncertainty component."
  epistemic_variance:
    type: number
    description: "Epistemic uncertainty component."
  uncertainty_type:
    type: string
    enum:
      - aleatoric
      - epistemic
      - total
    description: "Type of uncertainty component (Required by FR-008)."
  lower_bound_50:
    type: number
    description: "Lower bound for 50% confidence interval."
  upper_bound_50:
    type: number
    description: "Upper bound for 50% confidence interval."
  lower_bound_90:
    type: number
    description: "Lower bound for 90% confidence interval."
  upper_bound_90:
    type: number
    description: "Upper bound for 90% confidence interval."
  reconstruction_variance:
    type: number
    description: "Reconstruction variance for Sparse GP (optional)."
required:
  - sample_id
  - method
  - prediction_mean
  - prediction_variance
  - aleatoric_variance
  - epistemic_variance
  - uncertainty_type
  - lower_bound_50
  - upper_bound_50
  - lower_bound_90
  - upper_bound_90
additionalProperties: false