$schema: 'http://json-schema.org/draft-07/schema#'
title: OQMD Dataset Schema
description: Schema for the OQMD dataset used in the project.
type: array
items:
  type: object
  properties:
    composition:
      type: array
      items:
        type: number
    radius:
      type: number
    packing_fraction:
      type: number
    formation_energy:
      type: number
    bulk_modulus:
      type: number
    band_gap:
      type: number
  required:
    - composition
    - radius
    - packing_fraction
    - formation_energy
    - bulk_modulus
    - band_gap
