[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-uq-materials"
version = "0.1.0"
description = "Assessing Uncertainty Quantification Techniques for Machine-Learning Predicted Material Properties"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "gpytorch>=1.9.0",
    "pyarrow>=12.0.0",
    "datasets>=2.14.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pytest>=7.4.0",
]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
    | data
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in ML)
    "C408", # Unnecessary dict call (readability)
]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "data",
    "__pycache__",
]

[tool.ruff.per-file-ignores]
"code/models/sparse_gp.py" = ["F401"] # Allow unused imports for GPyTorch compatibility if needed

[tool.setuptools]
packages = ["code"]

[tool.setuptools.package-dir]
"" = "code"
