[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-uq-materials"
version = "0.1.0"
description = "Assessing Uncertainty Quantification Techniques for Machine-Predicted Material Properties"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "torch>=1.10.0",
    "scikit-learn>=1.0.0",
    "gpytorch>=1.6.0",
    "datasets>=2.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in ML)
    "C901", # too complex (allow for now)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.isort]
known-first-party = ["models", "data", "uq", "utils"]
known-third-party = ["torch", "numpy", "pandas", "sklearn", "gpytorch", "datasets"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
