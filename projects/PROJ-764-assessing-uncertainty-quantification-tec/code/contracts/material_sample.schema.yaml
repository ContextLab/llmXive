$schema: http://json-schema.org/draft-07/schema#
title: Material Sample Schema
description: |
  Schema for material sample data used in the uncertainty quantification pipeline.
  Represents the input features and properties of a material sample.
type: object
required:
  - sample_id
  - composition
  - formation_energy
properties:
  sample_id:
    type: integer
    description: Unique identifier for the material sample
  composition:
    type: string
    description: Chemical composition in standard notation (e.g., "Fe2O3")
  elements:
    type: array
    description: List of element symbols in the composition
    items:
      type: string
  structure_type:
    type: string
    description: Crystal structure type (e.g., "cubic", "tetragonal")
  radius:
    type: number
    description: Atomic radius feature
    minimum: 0
  packing_fraction:
    type: number
    description: Packing fraction feature
    minimum: 0
    maximum: 1
  formation_energy:
    type: number
    description: Formation energy in eV/atom
  descriptors:
    type: object
    description: Additional structural descriptors
    additionalProperties:
      type: number
additionalProperties: false
