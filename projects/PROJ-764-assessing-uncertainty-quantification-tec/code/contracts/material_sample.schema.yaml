$schema: http://json-schema.org/draft-07/schema#
title: Material Sample Schema
description: >
  Schema defining the structure of material sample data as derived from
  the OQMD Formation Energy dataset. This schema is used to validate
  input data before preprocessing and model training.
type: object
required:
  - sample_id
  - composition
  - formation_energy_per_atom
  - structure
properties:
  sample_id:
    type: integer
    description: Unique identifier for the material sample.
  composition:
    type: string
    description: >
      Chemical composition string (e.g., "Li2O", "Fe2O3").
      Format follows standard stoichiometric notation.
  formation_energy_per_atom:
    type: number
    description: >
      Formation energy per atom in eV/atom. This is the target variable
      for the regression task.
  structure:
    type: object
    description: Structural information required for descriptor calculation.
    required:
      - lattice_vectors
      - atomic_numbers
      - fractional_coordinates
    properties:
      lattice_vectors:
        type: array
        description: 3x3 matrix of lattice vectors (Angstroms).
        items:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
        minItems: 3
        maxItems: 3
      atomic_numbers:
        type: array
        description: List of atomic numbers for each atom in the structure.
        items:
          type: integer
        minItems: 1
      fractional_coordinates:
        type: array
        description: Fractional coordinates for each atom (0 to 1).
        items:
          type: array
          items:
            type: number
            minimum: 0.0
            maximum: 1.0
          minItems: 3
          maxItems: 3
        minItems: 1
additionalProperties: false
