$schema: http://json-schema.org/draft-07/schema#
title: Material Sample Schema
description: Schema for material sample data used in uncertainty quantification pipelines.
type: object
required:
  - sample_id
  - composition
  - features
  - target_value
  - target_unit
properties:
  sample_id:
    type: string
    description: Unique identifier for the material sample.
    minLength: 1
  composition:
    type: object
    description: Chemical composition of the material.
    required:
      - elements
      - ratios
    properties:
      elements:
        type: array
        items:
          type: string
        description: List of chemical element symbols (e.g., ["Cs", "Pb", "I"]).
      ratios:
        type: array
        items:
          type: number
        description: Stoichiometric ratios corresponding to elements.
  features:
    type: array
    items:
      type: number
    description: Numerical feature vector for the sample (e.g., after PCA or feature engineering).
    minItems: 1
  target_value:
    type: number
    description: The ground truth target value (e.g., formation energy).
  target_unit:
    type: string
    description: Unit of the target value (e.g., "eV/atom").
  metadata:
    type: object
    description: Optional metadata about the sample source or processing.
    properties:
      source:
        type: string
      processed_date:
        type: string
        format: date-time
additionalProperties: false
