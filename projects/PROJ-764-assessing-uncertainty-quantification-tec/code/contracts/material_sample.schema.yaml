$schema: http://json-schema.org/draft-07/schema#
title: Material Sample Schema
description: Schema for material sample data used in uncertainty quantification studies.
type: object
required:
  - sample_id
  - composition
  - structure
  - formation_energy
  - features
properties:
  sample_id:
    type: integer
    description: Unique identifier for the material sample.
  composition:
    type: object
    description: Chemical composition of the material.
    required:
      - elements
      - stoichiometry
    properties:
      elements:
        type: array
        items:
          type: string
        description: List of chemical elements present.
      stoichiometry:
        type: array
        items:
          type: number
        description: Stoichiometric coefficients for each element.
  structure:
    type: object
    description: Structural descriptors of the material.
    required:
      - crystal_system
      - space_group
      - radius
      - packing_fraction
    properties:
      crystal_system:
        type: string
        enum:
          - cubic
          - tetragonal
          - orthorhombic
          - monoclinic
          - triclinic
          - hexagonal
          - rhombohedral
        description: Crystal system classification.
      space_group:
        type: integer
        description: International Tables for Crystallography space group number.
      radius:
        type: number
        description: Effective atomic radius in Angstroms.
      packing_fraction:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: Atomic packing fraction.
  formation_energy:
    type: number
    description: Formation energy per atom in eV/atom.
  features:
    type: array
    items:
      type: number
    description: Feature vector (e.g., PCA-reduced features).
  target_bin:
    type: integer
    description: Quantile bin assignment for the formation energy (used for stratified splitting).
