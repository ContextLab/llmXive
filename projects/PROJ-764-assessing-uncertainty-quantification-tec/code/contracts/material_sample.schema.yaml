$schema: http://json-schema.org/draft-07/schema#
title: Material Sample Schema
description: Schema for material property data used in the OQMD dataset.
type: object
required:
  - material_id
  - elements
  - structure
  - formation_energy
  - band_gap
properties:
  material_id:
    type: string
    description: Unique identifier for the material.
  elements:
    type: array
    items:
      type: string
    description: List of chemical elements in the material.
  structure:
    type: object
    description: Structural information (e.g., lattice parameters, atomic positions).
    properties:
      lattice_vectors:
        type: array
        items:
          type: array
          items:
            type: number
        minItems: 3
        maxItems: 3
      atomic_positions:
        type: array
        items:
          type: object
          properties:
            element:
              type: string
            position:
              type: array
              items:
                type: number
              minItems: 3
              maxItems: 3
  formation_energy:
    type: number
    description: Formation energy per atom in eV.
  band_gap:
    type: number
    description: Band gap in eV.
