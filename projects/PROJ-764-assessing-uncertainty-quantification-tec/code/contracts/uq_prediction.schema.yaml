$schema: http://json-schema.org/draft-07/schema#
title: UQ Prediction Schema
description: |
  Schema for uncertainty quantification prediction outputs.
  Contains predictions, uncertainty estimates, and confidence intervals
  for material property predictions.
type: object
required:
  - sample_id
  - method
  - prediction
  - variance
  - lower_50
  - upper_50
  - lower_90
  - upper_90
properties:
  sample_id:
    type: integer
    description: Unique identifier for the material sample
  method:
    type: string
    description: UQ method used for prediction
    enum:
      - deep_ensemble
      - mc_dropout
      - sparse_gp
      - baseline
  prediction:
    type: number
    description: Point prediction for the target property
  variance:
    type: number
    description: Total variance estimate
    minimum: 0
  lower_50:
    type: number
    description: Lower bound of 50% confidence interval
  upper_50:
    type: number
    description: Upper bound of 50% confidence interval
  lower_90:
    type: number
    description: Lower bound of 90% confidence interval
  upper_90:
    type: number
    description: Upper bound of 90% confidence interval
  aleatoric:
    type: ["number", "null"]
    description: Aleatoric uncertainty component (null for sparse_gp)
  epistemic:
    type: ["number", "null"]
    description: Epistemic uncertainty component (null for sparse_gp)
  total:
    type: number
    description: Total uncertainty (sum of aleatoric and epistemic, or variance for sparse_gp)
  uncertainty_type:
    type: string
    description: Classification of uncertainty type
    enum:
      - mixed
      - aleatoric
      - epistemic
      - total
additionalProperties: false