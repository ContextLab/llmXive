$schema: "http://json-schema.org/draft-07/schema#"
title: UQ Prediction Schema
description: >
  Schema defining the structure of uncertainty quantification prediction
  outputs generated by the pipeline. This schema ensures consistency
  across Deep Ensembles, MC Dropout, and Sparse GP methods.
type: object
required:
  - sample_id
  - method
  - prediction
  - variance
  - lower_50
  - upper_50
  - lower_90
  - upper_90
  - aleatoric
  - epistemic
  - total
properties:
  sample_id:
    type: string
    description: Unique identifier for the sample being predicted
    pattern: "^[a-zA-Z0-9_-]+$"
  method:
    type: string
    description: UQ method used for prediction
    enum:
      - deep_ensemble
      - mc_dropout
      - sparse_gp
      - baseline_nn
  prediction:
    type: number
    description: Point prediction (mean) of the target variable
    description: >
      The predicted formation energy or other target property.
  variance:
    type: number
    description: Total variance estimate (sum of aleatoric and epistemic)
    minimum: 0.0
    description: >
      Represents the model's uncertainty about the prediction.
  lower_50:
    type: number
    description: Lower bound of the 50% confidence interval
  upper_50:
    type: number
    description: Upper bound of the 50% confidence interval
  lower_90:
    type: number
    description: Lower bound of the 90% confidence interval
  upper_90:
    type: number
    description: Upper bound of the 90% confidence interval
  aleatoric:
    type: number
    description: >
      Aleatoric uncertainty component (data noise).
      Calculated as the mean of predicted variances across samples.
    minimum: 0.0
  epistemic:
    type: number
    description: >
      Epistemic uncertainty component (model uncertainty).
      Calculated as the variance of means across samples.
    minimum: 0.0
  total:
    type: number
    description: >
      Total uncertainty (aleatoric + epistemic).
      Should equal the variance field.
    minimum: 0.0
additionalProperties: false
examples:
  - sample_id: "oqmd-123456"
    method: "deep_ensemble"
    prediction: -1.234
    variance: 0.05
    lower_50: -1.270
    upper_50: -1.198
    lower_90: -1.315
    upper_90: -1.153
    aleatoric: 0.03
    epistemic: 0.02
    total: 0.05
  - sample_id: "oqmd-789012"
    method: "mc_dropout"
    prediction: -0.987
    variance: 0.04
    lower_50: -1.019
    upper_50: -0.955
    lower_90: -1.059
    upper_90: -0.915
    aleatoric: 0.025
    epistemic: 0.015
    total: 0.04
  - sample_id: "oqmd-345678"
    method: "sparse_gp"
    prediction: -1.456
    variance: 0.06
    lower_50: -1.494
    upper_50: -1.418
    lower_90: -1.542
    upper_90: -1.370
    aleatoric: 0.035
    epistemic: 0.025
    total: 0.06
