$schema: http://json-schema.org/draft-07/schema#
title: UQ Prediction Schema
description: Schema for uncertainty quantification prediction outputs.
type: object
required:
  - sample_id
  - method
  - prediction
  - variance
  - lower_50
  - upper_50
  - lower_90
  - upper_90
  - aleatoric
  - epistemic
  - total
properties:
  sample_id:
    type: string
    description: Unique identifier for the material sample, matching the input data.
  method:
    type: string
    enum:
      - baseline_nn
      - deep_ensemble
      - mc_dropout
      - sparse_gp
    description: The UQ method used to generate this prediction.
  prediction:
    type: number
    description: Point prediction of the target value.
  variance:
    type: number
    minimum: 0
    description: Total variance estimate (aleatoric + epistemic).
  lower_50:
    type: number
    description: Lower bound of the 50% confidence interval.
  upper_50:
    type: number
    description: Upper bound of the 50% confidence interval.
  lower_90:
    type: number
    description: Lower bound of the 90% confidence interval.
  upper_90:
    type: number
    description: Upper bound of the 90% confidence interval.
  aleatoric:
    type: number
    minimum: 0
    description: Estimated aleatoric uncertainty (data noise).
  epistemic:
    type: number
    minimum: 0
    description: Estimated epistemic uncertainty (model uncertainty).
  total:
    type: number
    minimum: 0
    description: Total uncertainty (aleatoric + epistemic).
  uncertainty_type:
    type: string
    enum:
      - aleatoric
      - epistemic
      - total
    description: Classification of the uncertainty type for this row (used in decomposition reports).
additionalProperties: false