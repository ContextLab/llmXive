$schema: http://json-schema.org/draft-07/schema#
title: UQ Prediction
description: Schema for uncertainty quantification predictions and metrics.
type: object
required:
  - sample_id
  - method
  - prediction
  - variance
  - lower_50
  - upper_50
  - lower_90
  - upper_90
properties:
  sample_id:
    type: integer
    description: Unique identifier for the material sample.
  method:
    type: string
    enum:
      - deep_ensemble
      - mc_dropout
      - sparse_gp
    description: The UQ method used to generate the prediction.
  prediction:
    type: number
    format: float64
    description: Point prediction for the target variable (e.g., formation energy).
  variance:
    type: number
    format: float64
    description: Total uncertainty variance estimate.
  lower_50:
    type: number
    format: float64
    description: Lower bound of the 50% confidence interval.
  upper_50:
    type: number
    format: float64
    description: Upper bound of the 50% confidence interval.
  lower_90:
    type: number
    format: float64
    description: Lower bound of the 90% confidence interval.
  upper_90:
    type: number
    format: float64
    description: Upper bound of the 90% confidence interval.
  aleatoric:
    type: number
    format: float64
    nullable: true
    description: Aleatoric uncertainty component. Null for Sparse GP.
  epistemic:
    type: number
    format: float64
    nullable: true
    description: Epistemic uncertainty component. Null for Sparse GP.
  total:
    type: number
    format: float64
    nullable: true
    description: Total uncertainty (sum of aleatoric and epistemic). Null for Sparse GP.
  uncertainty_type:
    type: string
    enum:
      - total
      - aleatoric
      - epistemic
    nullable: true
    description: Type of uncertainty being reported in the row.