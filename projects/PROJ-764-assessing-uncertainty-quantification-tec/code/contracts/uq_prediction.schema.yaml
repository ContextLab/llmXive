$schema: http://json-schema.org/draft-07/schema#
title: UQ Prediction Schema
description: Schema for uncertainty quantification prediction outputs.
type: object
required:
  - sample_id
  - method
  - prediction
  - variance
  - lower_50
  - upper_50
  - lower_90
  - upper_90
properties:
  sample_id:
    type: integer
    description: Unique identifier for the material sample.
  method:
    type: string
    enum:
      - deep_ensemble
      - mc_dropout
      - sparse_gp
      - baseline
    description: UQ method used for prediction.
  prediction:
    type: number
    description: Predicted formation energy (eV/atom).
  variance:
    type: number
    minimum: 0.0
    description: Total variance estimate.
  lower_50:
    type: number
    description: Lower bound of 50% confidence interval.
  upper_50:
    type: number
    description: Upper bound of 50% confidence interval.
  lower_90:
    type: number
    description: Lower bound of 90% confidence interval.
  upper_90:
    type: number
    description: Upper bound of 90% confidence interval.
  aleatoric:
    type:
      - number
      - "null"
    description: Aleatoric uncertainty component (null for Sparse GP).
  epistemic:
    type:
      - number
      - "null"
    description: Epistemic uncertainty component (null for Sparse GP).
  total:
    type:
      - number
      - "null"
    description: Total uncertainty (used for Sparse GP where aleatoric/epistemic are null).
  uncertainty_type:
    type: string
    enum:
      - total
      - decomposed
    description: Whether uncertainty is total or decomposed.