$schema: http://json-schema.org/draft-07/schema#
title: UQ Prediction Schema
description: >
  Schema defining the structure of uncertainty quantification predictions
  generated by the pipeline. This schema validates the final output
  artifact: results/uq_predictions.csv (converted to JSON for validation).
type: object
required:
  - sample_id
  - method
  - prediction
  - variance
  - lower_50
  - upper_50
  - lower_90
  - upper_90
  - aleatoric
  - epistemic
  - total
  - uncertainty_type
properties:
  sample_id:
    type: integer
    description: Unique identifier for the material sample, matching the input.
  method:
    type: string
    description: >
      Name of the UQ method used. Allowed values:
      "DeepEnsemble", "MCDropout", "SparseGP".
    enum:
      - DeepEnsemble
      - MCDropout
      - SparseGP
  prediction:
    type: number
    description: Point prediction of the formation energy (eV/atom).
  variance:
    type: number
    description: Total variance estimate (eV^2/atom^2).
  lower_50:
    type: number
    description: Lower bound of the 50% confidence interval.
  upper_50:
    type: number
    description: Upper bound of the 50% confidence interval.
  lower_90:
    type: number
    description: Lower bound of the 90% confidence interval.
  upper_90:
    type: number
    description: Upper bound of the 90% confidence interval.
  aleatoric:
    type: ["number", "null"]
    description: >
      Estimated aleatoric (data) uncertainty variance.
      May be null for methods that do not explicitly model it (e.g., SparseGP).
  epistemic:
    type: ["number", "null"]
    description: >
      Estimated epistemic (model) uncertainty variance.
      May be null for methods that do not explicitly model it.
  total:
    type: ["number", "null"]
    description: >
      Total uncertainty (sum of aleatoric and epistemic if available).
      If aleatoric/epistemic are null, this may be null or equal to variance
      depending on the method.
  uncertainty_type:
    type: ["string", "null"]
    description: >
      String label indicating the type of uncertainty decomposition.
      Allowed values: "decomposed", "total_only", null.
additionalProperties: false
