$schema: http://json-schema.org/draft-07/schema#
title: UQ Prediction Schema
description: Schema for uncertainty quantification predictions generated by the pipeline.
type: object
required:
  - sample_id
  - method
  - prediction
  - variance
  - lower_50
  - upper_50
  - lower_90
  - upper_90
properties:
  sample_id:
    type: integer
    description: Unique identifier for the sample.
  method:
    type: string
    enum:
      - baseline
      - deep_ensemble
      - mc_dropout
      - sparse_gp
    description: The UQ method used for the prediction.
  prediction:
    type: number
    format: float64
    description: The predicted formation energy.
  variance:
    type: number
    format: float64
    description: The estimated variance of the prediction.
  lower_50:
    type: number
    format: float64
    description: Lower bound of the 50% confidence interval.
  upper_50:
    type: number
    format: float64
    description: Upper bound of the 50% confidence interval.
  lower_90:
    type: number
    format: float64
    description: Lower bound of the 90% confidence interval.
  upper_90:
    type: number
    format: float64
    description: Upper bound of the 90% confidence interval.
  aleatoric:
    type: ["number", "null"]
    format: float64
    description: Aleatoric uncertainty component (null for sparse_gp).
  epistemic:
    type: ["number", "null"]
    format: float64
    description: Epistemic uncertainty component (null for sparse_gp).
  total:
    type: number
    format: float64
    description: Total uncertainty.
  uncertainty_type:
    type: string
    enum:
      - combined
      - aleatoric
      - epistemic
      - sparse_gp
    description: Classification of the uncertainty type.