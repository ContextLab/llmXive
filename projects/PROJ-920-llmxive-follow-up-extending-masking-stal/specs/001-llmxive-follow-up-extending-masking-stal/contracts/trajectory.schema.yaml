$schema: "http://json-schema.org/draft-07/schema#"
title: "Synthetic Trajectory"
type: "object"
properties:
  trajectory_id:
    type: "string"
    description: "Unique identifier for the trajectory"
  turns:
    type: "array"
    items:
      type: "object"
      properties:
        turn_index:
          type: "integer"
          description: "0-based index of the turn"
        text:
          type: "string"
          description: "Content of the turn"
        is_critical:
          type: "boolean"
          description: "True if this turn contains critical evidence"
        entropy_per_token:
          type: "number"
          description: "Entropy of this turn's text"
      required:
        - turn_index
        - text
        - is_critical
        - entropy_per_token
  critical_evidence_turn:
    type: "integer"
    description: "Index of the turn containing critical evidence"
  density_level:
    type: "string"
    enum:
      - "low"
      - "medium"
      - "high"
    description: "Target density level"
  target_entropy:
    type: "number"
    description: "Target entropy per token"
  actual_entropy:
    type: "number"
    description: "Calculated entropy per token"
  technical_token_ratio:
    type: "number"
    description: "Ratio of technical tokens"
  final_density:
    type: "number"
    description: "Calculated density: 0.6 * entropy + 0.4 * tech_ratio"
required:
  - trajectory_id
  - turns
  - critical_evidence_turn
  - density_level
  - target_entropy
  - actual_entropy
  - technical_token_ratio
  - final_density
additionalProperties: false
