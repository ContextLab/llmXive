access_python: "import obspy\nfrom obspy import UTCDateTime\nfrom obspy.clients.fdsn\
  \ import Client\n\n# Initialize USGS client\nclient = Client(\"USGS\")\n\n# Define\
  \ a recent time window (last 30 days)\nendtime = UTCDateTime()\nstarttime = endtime\
  \ - 30*24*3600\n\n# Retrieve the earthquake catalog\ncat = client.get_events(starttime=starttime,\
  \ endtime=endtime)\n\n# Count records\nrecords = len(cat)\nprint(f\"RECORDS={records}\"\
  )\n\n# Inspect first event to infer available fields\nfields = []\nif records >\
  \ 0:\n    ev = cat[0]\n    # event_id\n    if getattr(ev, \"resource_id\", None)\
  \ is not None:\n        fields.append(\"event_id\")\n    # origin_time\n    if ev.origins\
  \ and getattr(ev.origins[0], \"time\", None) is not None:\n        fields.append(\"\
  origin_time\")\n    # latitude\n    if ev.origins and getattr(ev.origins[0], \"\
  latitude\", None) is not None:\n        fields.append(\"latitude\")\n    # longitude\n\
  \    if ev.origins and getattr(ev.origins[0], \"longitude\", None) is not None:\n\
  \        fields.append(\"longitude\")\n    # depth_km (ObsPy stores depth in meters)\n\
  \    if ev.origins and getattr(ev.origins[0], \"depth\", None) is not None:\n  \
  \      fields.append(\"depth_km\")\n    # magnitude\n    if ev.magnitudes and getattr(ev.magnitudes[0],\
  \ \"mag\", None) is not None:\n        fields.append(\"magnitude\")\n\nprint(\"\
  FIELDS=\" + \",\".join(fields))"
