  r: "`requirements.txt` is not fully pinned: its first 15 lines list unpinned packages\
    \ (`pandas`, `numpy`, `scipy`, `scikit-learn`, `requests`, `tqdm` \xD73, `pyyaml`,\
    \ `datasets`, `statsmodels`, `memory_profiler`, `huggingface_hub`, `xarray`, `netCDF4`)\
    \ before the pinned block, so `pip install -r requirements.txt` would install\
    \ unpinned versions and fail the \"no unpinned warnings\" verification; it also\
    \ contains duplicate entries and a stray comment. The file must contain only the\
    \ exact version pins (e.g., `numpy==1.26.4`, ..., `huggingface_hub==0.23.0`) with\
    \ no bare package names. `code/seed_init.py` "
