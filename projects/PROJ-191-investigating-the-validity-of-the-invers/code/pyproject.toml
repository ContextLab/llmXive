[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-investigation"
version = "0.1.0"
description = "Investigating the Validity of the Inverse-Square Law at Sub-Millimeter Scales"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "emcee==3.1.6",
    "dynesty==2.1.4",
    "astropy==6.1.1",
    "requests==2.32.3",
    "pytest==8.3.2",
    "ruamel.yaml==0.18.6",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "black==24.8.0",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["code", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "UP",
    "ANN",
]
ignore = [
    "ANN001",
    "ANN201",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["data", "models", "inference", "robustness", "utils", "agents", "tools"]
force-single-line = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
addopts = "-v --tb=short"