[lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
]
ignore = [
  "E501", # line too long (handled by black)
  "B008", # do not perform function calls in argument defaults
]

[lint.per-file-ignores]
"tests/*" = ["S101", "E711"]
"code/data/generate_harmonized_output.py" = ["S311"]

[lint.isort]
known-first-party = ["config", "data", "inference", "models", "robustness", "utils", "agents", "tools"]
force-to-top = ["config"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
