$schema: "http://json-schema.org/draft-07/schema#"
title: "HarmonizedDataset"
description: "Schema for the unified force-vs-separation dataset with covariance matrix."
type: "object"
properties:
  meta:
    type: "object"
    properties:
      version: { type: "string" }
      source_urls:
        type: "array"
        items: { type: "string" }
      created_at: { type: "string", format: "date-time" }
    required: ["version", "source_urls", "created_at"]
  data:
    type: "object"
    properties:
      separation_m:
        type: "array"
        items: { type: "number" }
        description: "Aligned separation distances in meters."
      force_n:
        type: "array"
        items: { type: "number" }
        description: "Force values in Newtons."
      uncertainty_stat:
        type: "array"
        items: { type: "number" }
        description: "Statistical uncertainty (1-sigma) in Newtons."
      uncertainty_sys:
        type: "array"
        items: { type: "number" }
        description: "Systematic uncertainty (1-sigma) in Newtons."
      source_runs:
        type: "array"
        items: { type: "string" }
        description: "IDs of original experimental runs."
    required: ["separation_m", "force_n", "uncertainty_stat", "uncertainty_sys", "source_runs"]
  covariance:
    type: "object"
    properties:
      matrix_file: { type: "string" }
      description: "Path to the .npz file containing the full NxN covariance matrix. Diagonal contains sum of squared stat and sys errors. Off-diagonals are zero."
    required: ["matrix_file"]
required: ["meta", "data", "covariance"]
