  r: "The provided `code/model/sparsity.py` defines `SparsityConfig` with a `mask(num_tokens)`\
    \ method, but the tests expect a constructor accepting `num_patches` and a `get_mask()`\
    \ method. Moreover, the mask logic does not produce a global mask for window sizes\
    \ larger than the grid (e.g., `window_size=16` on a 16\xD716 grid) as required\
    \ by the test cases. The API mismatch and incorrect masking behavior mean the\
    \ task\u2019s requirements are not satisfied."
