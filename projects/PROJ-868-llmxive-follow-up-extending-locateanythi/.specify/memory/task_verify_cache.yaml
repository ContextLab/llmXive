  r: "The `code/model/locateany.py` file defines the wrapper, but the integration\
    \ test cannot run: the test fails during import because the `torch` package is\
    \ not installed, and the wrapper\u2019s constructor signature (`__init__(self,\
    \ model, sparsity_config)`) does not match the test\u2019s usage (`LocateAnythingSparsityWrapper(sparsity_config=config)`).\
    \ Consequently the required forward\u2011pass check and thread\u2011limit assertion\
    \ are never exercised. The task needs a working environment with `torch` available\
    \ and a wrapper API that matches the test expectations."
