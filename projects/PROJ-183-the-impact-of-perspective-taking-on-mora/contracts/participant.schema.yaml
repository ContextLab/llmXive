$schema: http://json-schema.org/draft-07/schema#
title: Participant Response Schema
description: >
  Defines the structure of a single participant's response record.
  Includes consent status, attention check results, raw scale items,
  and calculated aggregate scores.
type: object
required:
  participant_id
  condition
  consent_given
  attention_checks
  attention_check_passed
  moral_outrage_items
  mean_outrage_score
properties:
  participant_id:
    type: string
    description: Unique anonymous identifier for the participant.
    pattern: "^P-\\d{4}$"
  condition:
    type: string
    description: The experimental condition the participant was assigned to.
    enum:
      - perspective_taking
      - control_summarization
  consent_given:
    type: boolean
    description: Whether the participant explicitly consented to the study.
  attention_checks:
    type: array
    description: >
      List of results for attention check items (True = passed, False = failed).
    items:
      type: boolean
    minItems: 1
  attention_check_passed:
    type: boolean
    description: >
      Overall attention check status. True if passed >1 item (or all, depending on logic).
      Used for filtering.
  moral_outrage_items:
    type: array
    description: >
      Raw responses to the 7-item Moral Outrage Scale.
      Values are integers from 1 (Not at all) to 7 (Extremely).
    type: array
    items:
      type: integer
      minimum: 1
      maximum: 7
    minItems: 7
    maxItems: 7
    description: "The 7 raw scale items."
  mean_outrage_score:
    type: number
    description: >
      Calculated mean of the 7 moral outrage items.
      Used as the primary dependent variable.
    minimum: 1.0
    maximum: 7.0
  metadata:
    type: object
    description: Optional metadata about the response.
    properties:
      stimulus_id:
        type: string
        description: ID of the stimulus shown to this participant.
      completion_time_seconds:
        type: number
        description: Time taken to complete the survey.
      device_info:
        type: string
        description: Basic device/browser info.
additionalProperties: false