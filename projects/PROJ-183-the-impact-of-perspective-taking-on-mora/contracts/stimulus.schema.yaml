$schema: http://json-schema.org/draft-07/schema#
title: Stimulus Schema
description: >
  Defines the structure of a single experimental stimulus unit.
  Each stimulus consists of a unique post ID, the text content,
  metadata (topic, sentiment), and the two experimental instruction variants.
type: object
required:
  - stimulus_id
  - post_id
  - text
  - topic
  - vader_score
  - intensity_group
  - instructions
properties:
  stimulus_id:
    type: string
    description: Unique identifier for this specific stimulus instance.
    pattern: "^STIM-\\d{4}$"
  post_id:
    type: string
    description: Original ID from the source dataset.
    type: string
  text:
    type: string
    description: The full text content of the social media post.
    minLength: 1
  topic:
    type: string
    description: The controversial topic category.
    enum:
      - climate
      - immigration
  vader_score:
    type: number
    description: >
      Composite sentiment score from VADER analysis (-1.0 to 1.0).
      Used for stratification into intensity groups.
    minimum: -1.0
    maximum: 1.0
  intensity_group:
    type: string
    description: Stratification group based on sentiment intensity.
    enum:
      - moderate
      - high
  instructions:
    type: object
    description: >
      The two experimental instruction sets paired with this stimulus.
    required:
      - perspective_taking
      - control_summarization
    properties:
      perspective_taking:
        type: string
        description: >
          The prompt instructing the participant to adopt the perspective
          of the author of the post.
        minLength: 1
      control_summarization:
        type: string
        type: string
        description: >
          The prompt instructing the participant to objectively summarize
          the post content.
        minLength: 1
  metadata:
    type: object
    description: Optional additional metadata for audit trails.
    properties:
      sampling_seed:
        type: integer
        description: Random seed used for this specific selection.
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of stimulus generation.
additionalProperties: false
