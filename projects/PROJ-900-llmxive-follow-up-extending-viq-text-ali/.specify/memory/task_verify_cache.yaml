  r: "The task explicitly forbids a fallback architecture and requires a `RuntimeError`\
    \ with a clear message when the ViQ checkpoint is missing, but `code/model.py`\
    \ implements `FrozenViQWrapper` as a self-described \"Simulated ViQ Encoder\"\
