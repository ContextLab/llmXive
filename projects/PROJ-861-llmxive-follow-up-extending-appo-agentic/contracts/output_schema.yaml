ReasoningTrace:
  type: object
  required:
    - task_id
    - tokens
    - static_scores
    - dynamic_scores
  properties:
    task_id:
      type: string
    tokens:
      type: array
      items:
        type: string
    static_scores:
      type: array
      items:
        type: number
    dynamic_scores:
      type: array
      items:
        type: number

BranchingScore:
  type: object
  required:
    - task_id
    - position
    - score
    - type
  properties:
    task_id:
      type: string
    position:
      type: integer
    score:
      type: number
    type:
      type: string
      enum: [static, dynamic]

CorrelationResult:
  type: object
  required:
    - pearson
    - spearman
    - p_value
    - seeds
    - inconclusive_flag
  properties:
    pearson:
      type: number
    spearman:
      type: number
    p_value:
      type: number
    seeds:
      type: array
      items:
        type: integer
    inconclusive_flag:
      type: boolean
