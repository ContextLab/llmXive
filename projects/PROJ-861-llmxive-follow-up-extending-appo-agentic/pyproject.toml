[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "Extending APPO: Agentic Procedural Policy Optimization"
requires-python = ">=3.9"
dependencies = [
    "torch --index-url https://download.pytorch.org/whl/cpu",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "accelerate>=0.27.0",
    "pytest>=8.0.0",
    "pytest-timeout>=2.2.0",
    "memory_profiler>=0.61.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "tqdm>=4.66.0",
]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
timeout = 300
