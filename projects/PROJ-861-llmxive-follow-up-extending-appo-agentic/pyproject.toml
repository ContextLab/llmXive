[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-appo-agentic"
version = "0.1.0"
description = "llmXive follow-up: extending APPO: Agentic Procedural Policy Optimization"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "datasets",
    "scikit-learn",
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "statsmodels",
    "accelerate",
    "pytest",
    "pytest-timeout",
    "memory_profiler",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.black]
target-version = ["py311"]
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
(
  __pycache__
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | venv
)
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "E7",  # pycodestyle error codes starting with E7
    "E9",  # pycodestyle error codes starting with E9
    "F",   # Pyflakes
    "I",   # isort
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # Allow asserts in tests

[tool.ruff.isort]
known-first-party = ["code"]
known-third-party = [
    "accelerate",
    "datasets",
    "matplotlib",
    "numpy",
    "pandas",
    "pytest",
    "scikit-learn",
    "seaborn",
    "statsmodels",
    "torch",
    "transformers",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
timeout = 300
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
]