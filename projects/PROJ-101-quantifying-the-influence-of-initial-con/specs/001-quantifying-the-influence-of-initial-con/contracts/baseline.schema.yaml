$schema: "http://json-schema.org/draft-07/schema#"
title: "Baseline Schema"
description: "Schema for the asymptotic Lyapunal exponent baseline of a clean system."
type: object
required:
  - system_dimension
  - lambda_max
  - convergence_error
  - status
  - trajectory_length
  - algorithm
properties:
  system_dimension:
    type: integer
    description: "Number of coupled Lorenz oscillators (N)."
  lambda_max:
    type: number
    description: "Asymptotic maximum Lyapunov exponent (converged value)."
  convergence_error:
    type: number
    description: "Percentage error at T=5000 compared to the final estimate."
  status:
    type: string
    enum:
      - "valid"
      - "invalid"
    description: "Whether the baseline meets the <5 % convergence criterion."
  trajectory_length:
    type: integer
    description: "Length of the trajectory used for baseline calculation."
  algorithm:
    type: string
    description: "Algorithm used for baseline calculation (e.g., 'Rosenstein')."
  baseline_variance:
    type: number
    description: "Estimated variance (or standard deviation squared) of the baseline across multiple runs."
  sample_count:
    type: integer
    description: "Number of clean runs used to compute the baseline statistics."
additionalProperties: false