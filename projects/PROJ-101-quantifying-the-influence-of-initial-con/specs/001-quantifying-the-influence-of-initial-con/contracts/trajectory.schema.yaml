$schema: "http://json-schema.org/draft-07/schema#"
title: "Lorenz Trajectory Schema"
description: "Schema for raw trajectory data generated by the Lorenz simulator."
type: "object"
properties:
  metadata:
    type: "object"
    properties:
      system_dimension:
        type: "integer"
        description: "Number of coupled Lorenz oscillators (N)."
      noise_level:
        type: "number"
        description: "Standard deviation of injected Gaussian noise (sigma_noise)."
      integration_method:
        type: "string"
        const: "DOP853"
      tolerances:
        type: "object"
        properties:
          rtol:
            type: "number"
            const: 1e-09
          atol:
            type: "number"
            const: 1e-12
      seed:
        type: "integer"
        description: "Random seed used for noise generation."
      is_physical:
        type: "boolean"
        description: "Flag indicating if the trajectory remains within physical bounds."
      shadowing_valid:
        type: "boolean"
        description: "Flag indicating if the trajectory passed the shadowing lemma check."
    required:
      - system_dimension
      - noise_level
      - integration_method
      - tolerances
      - seed
      - is_physical
      - shadowing_valid
  data:
    type: "array"
    description: "List of time steps."
    items:
      type: "object"
      properties:
        t:
          type: "number"
          description: "Time value."
        state:
          type: "array"
          description: "State vector of size 3*N."
          items:
            type: "number"
      required:
        - t
        - state
required:
  - metadata
  - data
