$schema: "http://json-schema.org/draft-07/schema#"
title: "Trajectory"
description: "Schema for a single generated trajectory of a coupled Lorenz system."
type: "object"
properties:
  id:
    type: "string"
    description: "Unique identifier (UUID) for the trajectory."
  system_params:
    type: "object"
    properties:
      N:
        type: "integer"
        description: "Number of coupled oscillators."
      sigma:
        type: "number"
        description: "Lorenz parameter sigma."
      rho:
        type: "number"
        description: "Lorenz parameter rho."
      beta:
        type: "number"
        description: "Lorenz parameter beta."
      coupling_strength:
        type: "number"
        description: "Strength of diffusive coupling."
    required:
      - N
      - sigma
      - rho
      - beta
      - coupling_strength
  noise_level:
    type: "number"
    description: "Standard deviation of injected Gaussian noise."
  seed:
    type: "integer"
    description: "Random seed used for generation."
  data:
    type: "array"
    description: "Time-ordered sequence of state vectors (flattened or list of arrays)."
    items:
      type: "array"
      items:
        type: "number"
  is_physical:
    type: "boolean"
    description: "True if trajectory remains bounded within simulation time."
  escape_time:
    type: ["number", "null"]
    description: "Time step at which trajectory exited basin (or null if bounded)."
  shadowing_valid:
    type: "boolean"
    description: "Diagnostic only: True if shadowing lemma check passes."
required:
  - id
  - system_params
  - noise_level
  - seed
  - is_physical
  - escape_time
  - shadowing_valid