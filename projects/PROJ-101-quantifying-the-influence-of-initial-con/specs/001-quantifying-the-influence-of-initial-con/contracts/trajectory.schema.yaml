$schema: "http://json-schema.org/draft-07/schema#"
title: "Trajectory Schema"
description: "Schema for a synthetic Lorenz trajectory file."
type: object
required:
  - time
  - state
  - noise
  - params
properties:
  time:
    type: array
    items:
      type: number
    description: "Array of time points (float, uniformly spaced)."
  state:
    type: array
    items:
      type: array
      items:
        type: number
    description: "2‑D array [steps, 3 × N] of state vectors."
  noise:
    type: array
    items:
      type: number
    description: "Array of injected noise values (same shape as state)."
  params:
    type: object
    required:
      - seed
      - N
      - sigma_noise
      - trial_id
    properties:
      seed:
        type: integer
        description: "Random seed used for this trajectory."
      N:
        type: integer
        description: "Number of coupled Lorenz oscillators."
      sigma_noise:
        type: number
        description: "Standard deviation of the noise added to the system."
      trial_id:
        type: string
        description: "Unique identifier for the trial."
    additionalProperties: false
additionalProperties: false
