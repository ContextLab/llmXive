$schema: "http://json-schema.org/draft-07/schema#"
title: Regression Stats Schema
description: Schema for regression analysis results.
type: object
required:
  - model_type
  - coefficients
  - r_squared
  - p_values
  - scaling_exponent
properties:
  model_type:
    type: string
    description: "Type of regression model (e.g., 'power_law', 'linear')"
  coefficients:
    type: object
    description: "Fitted model parameters"
    additionalProperties:
      type: number
  r_squared:
    type: number
    description: "Coefficient of determination"
  p_values:
    type: object
    description: "P-values for each coefficient"
    additionalProperties:
      type: number
  scaling_exponent:
    type: number
    description: "Exponent relating system dimension to bias magnitude"
  confidence_level:
    type: number
    description: "Confidence level used for tests (e.g., 0.95)"
  n_trials:
    type: integer
    description: "Total number of trials used in regression"
additionalProperties: false