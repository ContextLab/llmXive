$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Stats Schema"
description: "Schema for regression analysis results."
type: object
required:
  - model_type
  - coefficients
  - r_squared
  - p_values
  - scaling_exponent
properties:
  model_type:
    type: string
    description: "Type..."
  coefficients:
    type: object
    description: "Fitted..."
    additionalProperties:
      type: number
  r_squared:
    type: number
    description: "Coefficient..."
  p_values:
    type: object
    description: "P-values..."
    additionalProperties:
      type: number
  scaling_exponent:
    type: number
    description: "Exponent..."
  confidence_level:
    type: number
    description: "Confidence level..."
  n_trials:
    type: string
    description: "Total  ???  ?   "
additionalProperties: false