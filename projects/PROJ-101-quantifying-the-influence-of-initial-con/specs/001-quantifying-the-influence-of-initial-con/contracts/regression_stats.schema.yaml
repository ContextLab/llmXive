$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Stats Schema"
description: "Schema for regression analysis results."
type: object
required:
  - model_type
  - coefficients
  - r_squared
  - p_values
  - scaling_exponent
properties:
  model_type:
    type: string
    description: "Type of regression model (e.g., 'MixedEffects', 'Tobit')."
  coefficients:
    type: object
    description: "Fitted coefficients."
    additionalProperties:
      type: number
  r_squared:
    type: number
    description: "Coefficient of determination."
  p_values:
    type: object
    description: "P-values for each coefficient."
    additionalProperties:
      type: number
  scaling_exponent:
    type: number
    description: "Exponent relating system dimension N to Δλ magnitude."
  confidence_level:
    type: number
    description: "Confidence level used for interval estimation."
  n_trials:
    type: string
    description: "Total number of trials (string to allow large formatted values)."
additionalProperties: false
