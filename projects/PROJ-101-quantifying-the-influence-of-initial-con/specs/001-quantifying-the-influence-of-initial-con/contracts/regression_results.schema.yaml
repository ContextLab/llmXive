$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Results Schema"
description: "Schema for statistical analysis of FTLE deviation."
type: object
required:
  - selected_model
  - noise_levels
  - mean_deviation
  - regression_coefficients
  - p_values
  - effect_size
  - fdr_q_values
  - newey_west_used
  - trial_count
  - escape_probability
properties:
  selected_model:
    type: string
    description: "Regression model chosen..."
  noise_levels:
    type: array
    items:
      type: number
    description: "List..."
  mean_deviation:
    type: number
    description: "Mean..."
  regression_coefficients:
    type: object
    description: "Fitted..."
    additionalProperties:
      type: number
  p_values:
    type: object
    description: "Raw..."
    additionalProperties:
      type: number
  fdr_q_values:
    type: object
    description: "Benjamini..."
    additionalProperties:
      type: number
  effect_size:
    type: number
    description: "Cohen's..."
  newey_west_used:
    type: boolean
    description: "True if Newey‑West..."
  trial_count:
    type: integer
    description: "Total..."
  escape_probability:
    type: object
    description: "Mapping σ_noise..."
    additionalProperties:
      type: number
  baseline_variance_used:
    type: boolean
    description: "Indicates whether baseline variance was incorporated into the regression."
additionalProperties: false