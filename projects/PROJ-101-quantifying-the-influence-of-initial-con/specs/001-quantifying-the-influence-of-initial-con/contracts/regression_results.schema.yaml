$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Results Schema"
description: "Schema for statistical analysis of FTLE deviation."
type: object
required:
  - selected_model
  - noise_levels
  - mean_deviation
  - regression_coefficients
  - p_values
  - effect_size
  - fdr_q_values
  - newey_west_used
  - trial_count
  - escape_probability
properties:
  selected_model:
    type: string
    description: "Regression model chosen (e.g., 'mixed_effects', 'tobit')."
  noise_levels:
    type: array
    items:
      type: number
    description: "List of σ_noise values included in the regression."
  mean_deviation:
    type: number
    description: "Mean Δλ across all bounded trials."
  regression_coefficients:
    type: object
    description: "Fitted parameters (intercept, σ coefficient, N coefficient, interaction, 1/T)."
    additionalProperties:
      type: number
  p_values:
    type: object
    description: "Raw p‑values for each coefficient."
    additionalProperties:
      type: number
  fdr_q_values:
    type: object
    description: "Benjamini‑Hochberg q‑values for each coefficient (q ≤ 0.05 considered significant)."
    additionalProperties:
      type: number
  effect_size:
    type: number
    description: "Cohen's d for the primary noise coefficient."
  newey_west_used:
    type: boolean
    description: "True if Newey‑West HAC standard errors were applied after Durbin‑Watson detection."
  trial_count:
    type: integer
    description: "Total number of bounded trials used in the regression."
  escape_probability:
    type: object
    description: "Mapping σ_noise → estimated P(escape)."
    additionalProperties:
      type: number
additionalProperties: false
