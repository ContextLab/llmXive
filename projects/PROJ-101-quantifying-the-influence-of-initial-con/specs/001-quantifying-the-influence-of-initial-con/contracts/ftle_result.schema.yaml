$schema: "http://json-schema.org/draft-07/schema#"
title: "FTLE Result Schema"
description: "Schema for a single FTLE calculation result entry."
type: object
required:
  - trial_id
  - system_dimension
  - noise_level
  - window_size
  - lambda_max
  - status
properties:
  trial_id:
    type: string
    description: "Unique identifier for the trajectory trial."
  system_dimension:
    type: integer
    description: "Number of coupled Lorenz oscillators (N)."
  noise_level:
    type: number
    description: "Standard deviation of the injected Gaussian noise."
  window_size:
    type: integer
    description: "Time window T used for FTLE calculation."
  lambda_max:
    type: number
    description: "Calculated maximum Lyapunov exponent for the window."
  deviation:
    type:
      - number
      - "null"
    description: "Δλ = lambda_max - baseline_mean (null if status ≠ 'valid')."
  status:
    type: string
    enum:
      - "valid"
      - "unphysical"
      - "non-chaotic"
    description: "Trajectory status after boundedness and chaos checks."
  timestamp:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp of when the result recorded."
  durbin_watson_p:
    type:
      - number
      - "null"
    description: "p‑value from Durbin‑Watson test for autocorrelation."
additionalProperties: false