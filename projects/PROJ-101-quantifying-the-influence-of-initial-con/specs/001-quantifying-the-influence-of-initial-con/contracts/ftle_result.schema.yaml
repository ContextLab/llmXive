$schema: "http://json-schema.org/draft-07/schema#"
title: "FTLE Result Schema"
description: "Schema for a single FTLE calculation result entry."
type: object
required:
  - trial_id
  - system_dimension
  - noise_level
  - window_size
  - lambda_max
  - status
properties:
  trial_id:
    type: string
    description: "Unique identifier..."
  system_dimension:
    type: integer
    description: "Number of..."
  noise_level:
    type: number
    description: "Standard..."
  window_size:
    type: integer
    description: "Time window T used for FTLE calculation."
  lambda_max:
    type: number
    description: "Calculated..."
  deviation:
    type:
      - number
      - "null"
    description: "Δλ..."
  status:
    type: string
    enum:
      - "valid"
      - "unphysical"
      - "non-chaotic"
    description: "Trajectory status after boundedness and..."
  timestamp:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp..."
  durbin_watson_p:
    type:
      - number
      - "null"
    description: "p‑value..."
additionalProperties: false