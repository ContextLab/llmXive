    \ precision for the required functions. Consequently, there is no evidence that\
    \ the required API is correctly tested, so the task\u2019s verification condition\
    \ is not satisfied. The test suite must be updated to import `code.simulation.generator`\
    \ (or expose the same API) and include the noise\u2011std"
