$schema: "http://json-schema.org/draft-07/schema#"
title: "Validity Scores Schema"
description: "Schema for composite and component validity scores"
type: "object"
properties:
  generation_id:
    type: "string"
    description: "FK to generation output"
  logical_coherence:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Logical coherence score from NLI model (secondary)"
  output_reproducibility:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Output reproducibility score from embeddings (aggregated per prompt)"
  marker_specificity:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Marker specificity (targeted/total ratio)"
  validity_score:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Composite validity score"
  weights:
    type: "object"
    properties:
      coherence:
        type: "number"
      reproducibility:
        type: "number"
      markers:
        type: "number"
    description: "Weights used for aggregation"
  model_id:
    type: "string"
    description: "Model checkpoint ID (used for random effect in LMM)"
required:
  - generation_id
  - logical_coherence
  - output_reproducibility
  - marker_specificity
  - validity_score
  - weights
  - model_id
additionalProperties: false
