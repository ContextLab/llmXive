$schema: "http://json-schema.org/draft-07/schema#"
title: "MaintenanceMetrics"
description: "Schema for longitudinal maintenance metrics and statistical results."
type: object
properties:
  pair_id:
    type: string
    description: "Identifier for the matched LLM–Human pair."
  llm_block_id:
    type: string
    description: "CodeBlock ID for the LLM‑generated block."
  human_block_id:
    type: string
    description: "CodeBlock ID for the human‑written block."
  llm_churn_lines:
    type: number
    description: "Total lines added + deleted for the LLM block in the 6‑month window."
  human_churn_lines:
    type: number
    description: "Total lines added + deleted for the Human block in the 6‑month window."
  llm_latency_days:
    type:
      - "number"
      - "null"
    description: "Bug‑fix latency (days) for the LLM block; null if no linked issue."
  human_latency_days:
    type:
      - "number"
      - "null"
    description: "Bug‑fix latency (days) for the Human block; null if no linked issue."
  repo_stars:
    type: integer
    description: "Star count of the parent repository."
  repo_age_days:
    type: integer
    description: "Age of the repository in days at the time of block introduction."
  repo_total_loc:
    type: integer
    description: "Total lines of code in the repository (used for matching)."
  rank_biserial:
    type: number
    description: "Rank‑biserial correlation (rᵣ) effect size for the Wilcoxon test."
required:
  - pair_id
  - llm_block_id
  - human_block_id
  - llm_churn_lines
  - human_churn_lines
  - repo_stars
  - repo_age_days
  - repo_total_loc
  - rank_biserial
additionalProperties: false