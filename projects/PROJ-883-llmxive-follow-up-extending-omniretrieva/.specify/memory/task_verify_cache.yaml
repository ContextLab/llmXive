T003:
  c: false
  h: c0a2608e214de47ea3d5beaab27e5d127b058820681c63f043db8ea31c815690
  r: 'The artifacts deviate from the task''s explicit requirements: `config.py` pins
    the wrong dataset identifiers (`sentence-transformers/msmarco-corpus`, `spider`,
    `dbpedia/dbpedia-entities`) instead of `microsoft/ms_marco` v1.1 and `xlangai/spider`,
    and sets `SYNTHETIC_FALLBACK_CONFIG["enabled"] = True` contrary to the no-silent-fallback
