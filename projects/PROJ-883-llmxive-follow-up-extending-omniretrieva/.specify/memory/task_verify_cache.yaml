T001:
  c: false
  h: ba64af1e66f95cdee3339c01d34e2eed1cb2d6785552edd09fc08ac3ea79e76d
  r: "The `quickstart.md` and `tests/integration/test_skeleton.py` files are present\
    \ and correctly implement the described checks, and `artifacts/help_output.txt`\
    \ exists and is non\u2011empty. However, there is no evidence that `artifacts/ruff_output.txt`\
    \ was created (the file is missing from the listed artifacts), so the integration\
    \ test\u2019s requirement to store the ruff output and verify its non\u2011emptiness\
    \ is not satisfied. Adding the missing `ruff_output.txt` (or evidence of its generation)\
    \ is needed to complete the task."
  sig: f68db30e571a8eefc0c4dd51db73626f997a942ed56d3c07f4bfc82977f2c6c2
T004:
  c: false
  h: 86aa8bfded1afea1daea88c58c53921868f07640dee53ffa1261510bd200afc1
  r: "The generated `generation_log.json` contains an extra field `synthetic_flag`\
    \ that is not allowed by the schema, causing the unit test `test_generation_log_exists_and_valid`\
    \ to fail. Moreover, because the DBpedia download failed, the graph queries use\
    \ placeholder operations (`op_0`, `op_1`, \u2026) instead of real predicates,\
    \ violating the requirement that logical\u2011plan steps be derived from real\
    \ metadata, and `ground_truth_plan` is set to an empty string rather than a null\
    \ placeholder. The test suite therefore does not pass."
  sig: 01e9da5c615db199b86143d79599f075f5ffe606d4371da2d00034234c204759
T005:
  c: false
  h: 89a9ac9a301b6112a9c0fbd5246f8f2f504aed1a516a56378331e00d1f0dc042
  r: "The provided `code/generators/reference_engine.py` does not meet the spec: it\
    \ falls back to a default cost table because `data/processed/cost_table.json`\
    \ is missing, returns identifiers of the form `gt_plan_\u2026` instead of the\
    \ required `greedy_plan_<8\u2011hex\u2011hash>`, and there is no evidence that\
    \ `generation_log.json` exists or is updated with non\u2011null `ground_truth_plan`\
    \ for every query. The unit test expectations and the implementation are inconsistent,\
    \ so the task is not genuinely completed."
  sig: 17023f0c0a9a2da0d33eac5051b1139b91f8bf37f1e8e11aeb7a83404a51cc76
T007:
  c: false
  h: 306fa361b9ed860d43be91aee849fe7f63ddd5d3e6c359c533b4361a13a9eb1c
  r: "The provided `tests/integration/test_cpu_throttle.py` fails (both tests exit\
    \ with code\u202F2 due to argparse parsing the pytest command\u2011line arguments,\
    \ not the expected code\u202F99 or successful run). Consequently the required\
    \ verification that the utility aborts with exit\u202F99 on failure and sets `THROTTLE_MODE=\"\
    cgroups\"` on success is not satisfied. Additionally, the implementation defaults\
    \ to 2 CPU cores, which does not enforce the \u2264\u202F1\u202F000\u202Fms CPU\u2011\
    time limit specified. The task therefore remains incomplete."
  sig: 9c664f370a6ef9123f9a9e9137bd4a67071acf1c9c0db7f5aca746aafbbda402
