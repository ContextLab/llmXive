    \ with a generic warning rather than the required `DEPTH_OVERFLOW: query_id=<id>`\
    \ message. Moreover, the unit test `test_generation_log_exists_and_valid` fails\
    \ because `data/processed/generation_log.json` is not found at test time, so the\
    \ required record count and high\u2011complexity graph quota are never verified.\
    \ Fix the generator to use UUID4 IDs, leave `ground_truth_plan` as `null`, emit\
    \ the exact overflow log format, and ensure the gene"
  sig: 6705b150a416b119eb95a217ed2bcc4dcef07f459d1bc980466cb26321cd1a5f
T005:
  c: false
  h: e2970db5c11c97d35a37df5c2c0039d269ae52c6edab20039b9476e7e6877ff3
  r: "The provided `code/generators/reference_engine.py` generates identifiers of\
    \ the form `gt_plan_<query_id>\u2026` instead of the required `greedy_plan_<8\u2011\
    hex\u2011hash>` and the unit test checks this wrong format. The test does not\
    \ verify the hash pattern mandated by the task, and there is no execution evidence\
    \ that `generation_log.json` is actually updated with a non\u2011null `ground_truth_plan`\
    \ for every query. The implementation therefore fails to meet the identifier specification\
    \ and lacks proof of the required log\u2011file update."
  sig: dc6be645609e55fd3191c0b056cb65a877f7312d5864051d71d4993c0d31086e
