  r: "The generator never uses T003's real structural metadata (MS MARCO ids, Spider\
    \ schemas, graph edges) \u2014 it fabricates placeholder `nodes`/`edges` and generic\
    \ operation names \u2014 and `data/processed/generation_log.json` contains only\
    \ 10 queries (not \u2265500, with no \u2265100 high-complexity graph queries).\
    \ The ground-truth plans in the log are the fabricated `\"step_1\", \"step_2\"\
    , ...` fallback (the very defect the task says to fix), because `_create_query`\
    \ calls `engine.generate_plan` without passing `logical_plan`, so the greedy engine\
    \ never sees the real steps. Additionally, `query_instance.schema.yaml`"
