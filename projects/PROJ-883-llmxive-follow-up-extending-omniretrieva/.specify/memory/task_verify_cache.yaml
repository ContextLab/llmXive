T002:
  c: false
  h: da650dc1289df10e1b0b5996ab494256aea2efe5bdaa0a058bab03ccdba901d5
  r: "The contracts directory is empty \u2013 all four required schema files (`query_instance.schema.yaml`,\
    \ `execution_log.schema.yaml`, `execution_metric.schema.yaml`, `statistics_result.schema.yaml`)\
    \ are missing, and the duplicate `statistics-result.schema.yaml` is also absent.\
    \ Consequently the provided `tests/unit/test_contracts.py` fails because it cannot\
    \ find the schema files. The task requires the schemas to exist and the test to\
    \ pass, which is not satisfied."
  sig: 3e1e262170507532fc5a9ba40ec374cb290390e860b0d05187584ba2be2c2e10
T003:
  c: false
  h: 6b81f8a6dc3cae29acc1421155f591461a56a087451f6366d4382065e1a7748b
  r: "The three loader functions exist, but at runtime they raise errors: `load_ms_marco`\
    \ cannot find the \u201Ctest\u201D config, `load_spider` cannot find the \u201C\
    tables\u201D config, and `load_dbpedia` receives a 401 Unauthorized error, causing\
    \ all unit tests to fail. The required behavior of successfully streaming the\
    \ datasets and downloading the parquet file is therefore not met."
  sig: fc1a892aaa2e65169531327429c5d73d0eb0a4243e2083bc3e54f987a2efc0f1
T005:
  c: false
  h: 89a9ac9a301b6112a9c0fbd5246f8f2f504aed1a516a56378331e00d1f0dc042
  r: "The provided `code/generators/reference_engine.py` does not meet the spec: it\
    \ falls back to a default cost table because `data/processed/cost_table.json`\
    \ is missing, returns identifiers of the form `gt_plan_\u2026` instead of the\
    \ required `greedy_plan_<8\u2011hex\u2011hash>`, and there is no evidence that\
    \ `generation_log.json` exists or is updated with non\u2011null `ground_truth_plan`\
    \ for every query. The unit test expectations and the implementation are inconsistent,\
    \ so the task is not genuinely completed."
  sig: 17023f0c0a9a2da0d33eac5051b1139b91f8bf37f1e8e11aeb7a83404a51cc76
T007:
  c: false
  h: 306fa361b9ed860d43be91aee849fe7f63ddd5d3e6c359c533b4361a13a9eb1c
  r: "The provided `tests/integration/test_cpu_throttle.py` fails (both tests exit\
    \ with code\u202F2 due to argparse parsing the pytest command\u2011line arguments,\
    \ not the expected code\u202F99 or successful run). Consequently the required\
    \ verification that the utility aborts with exit\u202F99 on failure and sets `THROTTLE_MODE=\"\
    cgroups\"` on success is not satisfied. Additionally, the implementation defaults\
    \ to 2 CPU cores, which does not enforce the \u2264\u202F1\u202F000\u202Fms CPU\u2011\
    time limit specified. The task therefore remains incomplete."
  sig: 9c664f370a6ef9123f9a9e9137bd4a67071acf1c9c0db7f5aca746aafbbda402
T008:
  c: false
  h: 5362d2907146faf957edf97936fd340d013f6c12a0450c29fead3ea729070fb4
  r: "The executor package exists but each executor is only a stub that returns a\
    \ placeholder plan identifier; none perform BM25 over MS\u202FMARCO, SQLite over\
    \ Spider tables, or RDFLib SPARQL over DBpedia as required.\u202F`BaseExecutor`\
    \ enforces timeouts via `signal.alarm` instead of the mandated `concurrent.futures.ThreadPoolExecutor`\
    \ with a 60\u202Fs wall\u2011clock limit, and the test suite does not check `latency_ms\
    \ > 0` nor validate results against the missing `execution_log.schema.yaml`.\u202F\
    Consequently the task\u2019s functional and testing requirements are not satisfied."
  sig: e41626b9c252e9df85782fb6063272b1bc4fcec4c519a6f13ecfdb222434512e
