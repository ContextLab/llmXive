T005:
  c: false
  h: 57eb16adacab5dda958fe613b7f55f10fbe9f76d0b5b733aa7552d30248f0257
  r: "Checked `code/config.py` (provides seeds, directories, throttling) and `code/utils/data_fetcher.py`.\
    \ The data fetcher contains a critical bug: it calls `load_dataset(name, name=config_name,\
    \ \u2026)`, passing the `name` argument twice, which raises a `TypeError` and\
    \ prevents any real dataset from being fetched (even before network access). Consequently\
    \ real fetching never succeeds and the fallback logic is never exercised as intended.\
    \ The module also fails to import in the test environment due to a missing compatible\
    \ `pyarrow`/NumPy version, indicating it is not runnable as\u2011is. The task\
    \ therefore is"
  sig: 433a4d534507307998d7ef8cc90fdbe132ccb1bce8912e324319c64c782b4116
