    \ valid top\u2011level table). Consequently `artifacts/ruff_output.txt` is not\
    \ created/non\u2011empty, so the CI verification step is not satisfied. Fix the\
    \ `.ruff.toml` (or adjust the test) so that `ruff check` exits\u202F0 and produces\
    \ a non\u2011empty output file."
