T007:
  c: true
  h: b4ef789e0b62d3be86965dafafbe6b60f170782b6f220ca9ab0660b701352944
  r: 'The artifact `code/generators/reference_engine.py` exists (4377 bytes) and implements
    the FR-008 requirement: a deterministic `ReferenceEngine` whose `_select_next_step`
    greedily picks the minimum `estimated_cost` and breaks ties by smallest `depth`
    (explicit or positional), with `generate_plan` producing a reproducible ground-truth
    plan identifier from the ordered selected step IDs. The tie-breaking fallback
    preserves original ordering so the earliest remaining step is still chosen, and
    behavior is deterministic with no stubs or placeholders.'
  sig: 3f35b63a6ad0d5c57a76057818d8bcdbce257e614bc644eb2a4d903642bd453e
T008:
