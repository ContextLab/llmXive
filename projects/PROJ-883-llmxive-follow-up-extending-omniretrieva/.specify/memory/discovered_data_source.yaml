access_python: "import ir_datasets\n\n# Load the MS MARCO passage development set\n\
  ds = ir_datasets.load('msmarco-passage/dev')\n\n# Gather all queries\nqueries =\
  \ list(ds.queries_iter())  # each item has .query_id and .text attributes\n\n# Build\
  \ a mapping from query_id to its maximum relevance label\nmax_rel = {}\nfor qrel\
  \ in ds.qrels_iter():  # each item has .query_id, .doc_id, .relevance attributes\n\
  \    qid = qrel.query_id\n    rel = qrel.relevance\n    if qid not in max_rel or\
  \ rel > max_rel[qid]:\n        max_rel[qid] = rel\n\n# Merge queries with relevance\
  \ (None if no relevance found)\nmerged = []\nfor q in queries:\n    qid = q.query_id\n\
  \    merged.append({\n        'query_id': qid,\n        'query_text': q.text,\n\
  \        'relevance_label': max_rel.get(qid)\n    })\n\nprint(f\"RECORDS={len(merged)}\"\
  )\nprint(\"FIELDS=query_id,query_text,relevance_label\")"
