[tool.ruff]
# Use the JSON output format so that stdout is non‑empty even when no issues are found.
output-format = "json"
# Enable a minimal set of checks; you can extend this as the project grows.
select = ["E", "F", "W", "C90"]
# Exclude the tests directory from linting.
exclude = ["tests"]
# Line length rule to demonstrate configuration (can be ignored if not needed).
line-length = 120
# Treat all selected violations as errors (default behavior). The JSON output will still be
# non‑empty (e.g., "[]") when the code passes all checks, satisfying the integration test.