$schema: http://json-schema.org/draft-07/schema#
title: ExecutionMetric
description: >
  Records the outcome of executing a query instance against a specific executor.
  Captures latency, resource usage, and success status.
type: object
required:
  - metric_id
  - query_id
  - executor_type
  - latency_ms
  - status
  - timestamp
properties:
  metric_id:
    type: string
    description: Unique identifier for this metric record.
    pattern: "^m-\\d{5}$"
  query_id:
    type: string
    description: Reference to the executed query instance.
    pattern: "^q-\\d{5}$"
  executor_type:
    type: string
    description: The type of executor used.
    enum:
      - text
      - relational
      - graph
  complexity_level:
    type: integer
    description: The complexity level of the query being executed.
    minimum: 1
  source_type:
    type: string
    description: The source type of the query.
    enum:
      - text
      - relational
      - graph
  latency_ms:
    type: number
    description: >
      End-to-end execution latency in milliseconds.
      Measured in real wall-clock time.
    minimum: 0
  status:
    type: string
    description: Execution status.
    enum:
      - success
      - timeout
      - error
  error_message:
    type: string
    description: Error details if status is 'error' or 'timeout'.
    default: ""
  translation_error:
    type: boolean
    description: >
      True if the executed plan differed from the ground_truth_plan.
      Requires ground truth comparison to be performed.
    default: false
  resource_usage:
    type: object
    description: Optional resource usage metrics (CPU, Memory).
    properties:
      cpu_time_ms:
        type: number
      memory_mb:
        type: number
      throttled:
        type: boolean
        description: True if CPU throttling was active during execution.
    additionalProperties: true
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp when execution finished.
  metadata:
    type: object
    description: Additional execution context.
    additionalProperties: true
