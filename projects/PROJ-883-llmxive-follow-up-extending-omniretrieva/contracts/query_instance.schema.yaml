$schema: http://json-schema.org/draft-07/schema#
title: QueryInstance
description: >
  Represents a synthetic query instance generated for the retrieval experiment.
  Includes metadata, the query content, and the ground-truth execution plan.
type: object
required:
  - query_id
  - source_type
  - complexity_level
  - query_content
  - ground_truth_plan
  - generated_at
properties:
  query_id:
    type: string
    description: Unique identifier for the query instance (e.g., "q-00001").
    pattern: "^q-\\d{5}$"
  source_type:
    type: string
    description: The data source domain for this query.
    enum:
      - text
      - relational
      - graph
  complexity_level:
    type: integer
    description: >
      Exact integer plan depth (1, 2, 3, 4+).
      Must be derived from the reference engine's ground truth plan depth.
      Not a binary classification.
    minimum: 1
  query_content:
    type: object
    description: The actual query payload, structure depends on source_type.
    properties:
      text_query:
        type: string
        description: Natural language query string (for text source).
      sql_query:
        type: string
        description: SQL statement (for relational source).
      sparql_query:
        type: string
        description: SPARQL statement (for graph source).
      params:
        type: object
        description: Additional parameters or context for the query.
        additionalProperties: true
    additionalProperties: true
  ground_truth_plan:
    type: object
    description: >
      The deterministic ground-truth execution plan generated by the Reference Engine.
      Used for translation error calculation.
    properties:
      plan_id:
        type: string
        description: Unique ID for this plan.
      steps:
        type: array
        description: Ordered list of execution steps.
        items:
          type: object
          properties:
            step_id:
              type: integer
            operation:
              type: string
              description: Type of operation (e.g., "scan", "join", "filter").
            cost_estimate:
              type: number
              description: Estimated cost of this step.
          required:
            - step_id
            - operation
      total_cost:
        type: number
        description: Sum of step costs.
      depth:
        type: integer
        description: The depth of the plan tree (should match complexity_level).
    required:
      - plan_id
      - steps
      - depth
  generated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of generation.
  metadata:
    type: object
    description: Optional metadata (e.g., seed used, generator version).
    additionalProperties: true
