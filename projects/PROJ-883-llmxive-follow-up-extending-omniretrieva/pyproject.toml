[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "Structural Mismatch Cost in Heterogeneous Retrieval"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "pytest",
    "pyyaml",
    "rdflib",
    "networkx",
    "matplotlib",
    "seaborn",
    "requests",
    "datasets",
    "ruff",
    "black",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
