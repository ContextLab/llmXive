$schema: "http://json-schema.org/draft-07/schema#"
title: "Query Instance"
description: "Schema for a synthetic query instance used in the benchmark."
type: object
required:
  - query_id
  - source_type
  - complexity_level
  - logical_plan
  - ground_truth_plan
properties:
  query_id:
    type: string
    description: "Unique identifier for the query."
  source_type:
    type: string
    enum: ["text", "relational", "graph"]
    description: "The heterogeneous source type the query targets."
  complexity_level:
    type: integer
    minimum: 1
    description: "Integer plan depth (number of logical steps)."
  logical_plan:
    type: object
    description: "Logical plan representation."
    required:
      - steps
    properties:
      steps:
        type: array
        items:
          type: string
        description: "List of logical operation names (may be empty for placeholder)."
  ground_truth_plan:
    type: string
    description: "Deterministic greedy plan string generated by the reference engine."
  sut_plan:
    type: object
    description: "System‑generated plan added later by the router."
    required:
      - estimated_cost
      - steps
    properties:
      estimated_cost:
        type: number
      steps:
        type: array
        items:
          type: string
