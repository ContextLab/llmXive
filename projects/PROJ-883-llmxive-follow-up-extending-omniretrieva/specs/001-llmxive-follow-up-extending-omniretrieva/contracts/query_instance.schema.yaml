$schema: "http://json-schema.org/draft-07/schema#"
title: "Query Instance"
type: object
properties:
  query_id:
    type: string
  logical_plan:
    type: string
  source_type:
    type: string
    enum: ["text", "relational", "graph"]
  complexity_level:
    type: integer
    minimum: 1
  ground_truth_plan:
    type: string
required:
  - query_id
  - logical_plan
  - source_type
  - complexity_level
  - ground_truth_plan
additionalProperties: false
