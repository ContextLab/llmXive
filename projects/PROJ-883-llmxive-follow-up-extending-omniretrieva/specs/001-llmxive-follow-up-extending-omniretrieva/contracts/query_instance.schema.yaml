$schema: "http://json-schema.org/draft-07/schema#"
title: QueryInstance
type: object
additionalProperties: false
required:
  - query_id
  - source_type
  - complexity_level
  - logical_plan
  - ground_truth_plan
properties:
  query_id:
    type: string
  source_type:
    type: string
    enum:
      - text
      - relational
      - graph
  complexity_level:
    type: integer
    minimum: 1
  logical_plan:
    type: object
    description: Logical representation of the query; may contain a ``steps`` array.
    additionalProperties: true
  ground_truth_plan:
    type: string
    description: Deterministic plan identifier generated by the reference engine.