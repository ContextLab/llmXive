$schema: "http://json-schema.org/draft-07/schema#"
title: QueryInstance
type: object
properties:
  query_id:
    type: string
  logical_plan:
    type: string
  source_type:
    type: string
    enum: [text, relational, graph]
  complexity_level:
    type: integer
    minimum: 1
  ground_truth_plan:
    type: string
  synthetic_flag:
    type: integer
    enum: [0, 1]
required:
  - query_id
  - source_type
  - complexity_level
  - ground_truth_plan
