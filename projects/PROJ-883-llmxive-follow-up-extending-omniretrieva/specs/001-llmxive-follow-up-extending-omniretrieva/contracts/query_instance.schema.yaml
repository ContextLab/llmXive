type: object
properties:
  query_id:
    type: string
    description: "UUID of the query"
  source_type:
    type: string
    enum: [text, relational, graph]
    description: "Source category"
  complexity_level:
    type: integer
    minimum: 1
    description: "Exact plan depth"
  logical_plan:
    type: object
    properties:
      steps:
        type: array
        items:
          type: string
        description: "Ordered list of operation identifiers"
    required:
      - steps
  ground_truth_plan:
    type: string
    description: "Identifier of the deterministic reference plan"
  synthetic_flag:
    type: boolean
    description: "True if topology was synthetically generated"
required:
  - query_id
  - source_type
  - complexity_level
  - logical_plan
  - ground_truth_plan
  - synthetic_flag
