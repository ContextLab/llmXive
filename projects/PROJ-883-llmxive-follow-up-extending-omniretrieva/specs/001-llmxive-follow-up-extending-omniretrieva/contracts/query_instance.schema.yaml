# JSON Schema for a synthetic query instance.
# It validates both the original string‑based ground‑truth plan
# representation and the newer object‑based representation that
# includes an explicit ``steps`` array.
$schema: "http://json-schema.org/draft-07/schema#"
title: QueryInstance
type: object
required:
  - query_id
  - source_type
  - complexity_level
  - logical_plan
  - ground_truth_plan
properties:
  query_id:
    type: string
  source_type:
    type: string
    enum: ["text", "relational", "graph"]
  complexity_level:
    type: integer
    minimum: 1
  logical_plan:
    type: object
    required:
      - steps
    properties:
      steps:
        type: array
        items:
          type: string
  ground_truth_plan:
    anyOf:
      - type: string
      - type: object
        required:
          - steps
        properties:
          steps:
            type: array
            items:
              type: string
  # Optional fields that downstream components may add.
  ground_truth_plan_id:
    type: string
  synthetic_flag:
    type: integer
    enum: [0, 1]   # 0 = real, 1 = synthetic fallback
  timestamp:
    type: string
    format: date-time
additionalProperties: false