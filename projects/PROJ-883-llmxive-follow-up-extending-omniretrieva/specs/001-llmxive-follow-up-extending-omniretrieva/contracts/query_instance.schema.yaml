$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  query_id:
    type: string
  source_type:
    type: string
  complexity_level:
    type: integer
  logical_plan:
    type: object
    properties:
      steps:
        type: array
        items:
          type: string
    required:
      - steps
    additionalProperties: true
  ground_truth_plan:
    type: string
required:
  - query_id
  - source_type
  - complexity_level
  - ground_truth_plan
additionalProperties: true
