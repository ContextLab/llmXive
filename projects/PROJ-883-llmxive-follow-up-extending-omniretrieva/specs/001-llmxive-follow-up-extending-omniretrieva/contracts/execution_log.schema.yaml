$schema: "http://json-schema.org/draft-07/schema#"
title: ExecutionLog
type: object
properties:
  query_id:
    type: string
  source_type:
    type: string
    enum: [text, relational, graph]
  complexity_level:
    type: integer
    minimum: 1
  latency_ms:
    type: number
    minimum: 0
  translation_error:
    type: boolean
  success_flag:
    type: boolean
  timeout_flag:
    type: boolean
  throttling_mode:
    type: string
required:
  - query_id
  - latency_ms
  - success_flag
