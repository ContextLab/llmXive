$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  query_id:
    type: string
  source_type:
    type: string
  complexity_level:
    type: integer
  latency_ms:
    type: number
  timestamp:
    type: string
    format: date-time
  translation_error:
    type: boolean
  success_flag:
    type: boolean
  timeout_flag:
    type: boolean
  synthetic_flag:
    type: ["integer", "boolean"]
  throttling_mode:
    type: string
required: [query_id, latency_ms, success_flag]
