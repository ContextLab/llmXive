$schema: "http://json-schema.org/draft-07/schema#"
title: ExecutionLog
description: Schema for a single execution log entry.
type: object
additionalProperties: false
required:
  - query_id
  - latency_ms
  - success_flag
properties:
  query_id:
    type: string
    description: Identifier of the query.
  latency_ms:
    type: number
    description: Measured latency in milliseconds.
    minimum: 0
  success_flag:
    type: boolean
    description: Whether the execution succeeded (no timeout or error).
