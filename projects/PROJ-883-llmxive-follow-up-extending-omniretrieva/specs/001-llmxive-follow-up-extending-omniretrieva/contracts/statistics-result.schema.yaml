$schema: "http://json-schema.org/draft-07/schema#"
title: "Statistics Result"
description: "Result of the sensitivity analysis per cutoff."
type: object
required:
  - cutoff
  - spike_point
  - slope_change
properties:
  cutoff:
    type: integer
    minimum: 1
  spike_point:
    type: number
  slope_change:
    type: number
