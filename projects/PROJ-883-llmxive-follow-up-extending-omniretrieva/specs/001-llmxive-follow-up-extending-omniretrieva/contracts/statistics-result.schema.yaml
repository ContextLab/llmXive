$schema: "http://json-schema.org/draft-07/schema#"
title: StatisticsResult
type: object
properties:
  source_type:
    type: string
    enum: [text, relational, graph]
  complexity_category:
    type: string
    enum: [low, high]
  mean_delta_latency:
    type: number
  std_delta_latency:
    type: number
  n_samples:
    type: integer
    minimum: 0
  anova_f_statistic:
    type: number
  anova_p_value:
    type: number
  interaction_significant:
    type: boolean
  segmented_regression_knee_point:
    type: number
  segmented_regression_p_value:
    type: number
required:
  - source_type
  - complexity_category
  - mean_delta_latency
  - std_delta_latency
  - n_samples
  - anova_f_statistic
  - anova_p_value
  - interaction_significant
  - segmented_regression_knee_point
  - segmented_regression_p_value
