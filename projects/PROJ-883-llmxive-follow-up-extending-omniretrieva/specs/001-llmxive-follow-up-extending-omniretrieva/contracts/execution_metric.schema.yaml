$schema: "http://json-schema.org/draft-07/schema#"
title: ExecutionMetric
type: object
properties:
  query_id:
    type: string
  latency_ms:
    type: number
    minimum: 0
  mismatch_flag:
    type: boolean
  delta_latency:
    type: number
  engine_version:
    type: string
  throttle_config:
    type: string
required:
  - query_id
  - latency_ms
