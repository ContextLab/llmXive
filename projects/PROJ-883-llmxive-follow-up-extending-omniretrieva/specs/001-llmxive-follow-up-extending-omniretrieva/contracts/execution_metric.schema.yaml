$schema: "http://json-schema.org/draft-07/schema#"
title: ExecutionMetric
type: object
required:
  - query_id
  - latency_ms
  - mismatch_flag
  - delta_latency
  - engine_version
  - throttle_config
properties:
  query_id:
    type: string
  latency_ms:
    type: number
  mismatch_flag:
    type: boolean
  delta_latency:
    type: number
  engine_version:
    type: string
  throttle_config:
    type: string
additionalProperties: false
