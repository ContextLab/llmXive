# Schema for execution metric records (JSONL)
type: object
properties:
  query_id:
    type: string
  source_type:
    type: string
    enum: [text, relational, graph]
  complexity_level:
    type: integer
    minimum: 1
  latency_ms:
    type: number
  translation_error:
    type: boolean
  success_flag:
    type: boolean
  timeout_flag:
    type: boolean
  engine_version:
    type: string
  throttle_config:
    type: string
required:
  - query_id
  - source_type
  - complexity_level
  - latency_ms
  - translation_error
  - success_flag
  - timeout_flag
  - engine_version
  - throttle_config
additionalProperties: false