type: object
properties:
  query_id:
    type: string
    description: "UUID of the query"
  latency_ms:
    type: number
    description: "Wall‑clock latency in milliseconds (baseline‑corrected)"
  translation_error:
    type: boolean
    description: "Disagreement flag: true if engine plan deviates from deterministic ground_truth_plan"
  timeout_flag:
    type: boolean
    description: "True if execution exceeded the 60‑second limit"
  success_flag:
    type: boolean
    description: "True if execution completed without error"
  timestamp:
    type: string
    format: date-time
    description: "ISO‑8601 timestamp of measurement"
  synthetic_flag:
    type: boolean
    description: "Propagated from originating Query Instance"
  throttling_mode:
    type: string
    enum: [cgroups, failed]
    description: "Method used to enforce CPU limits"
required:
  - query_id
  - latency_ms
  - translation_error
  - timeout_flag
  - success_flag
  - timestamp
  - synthetic_flag
  - throttling_mode