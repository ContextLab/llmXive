[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    venv,
    data,
    figures,
    *.egg-info
per-file-ignores =
    # E402: module-level import not at top of file (sys.path bootstrap)
    code/validate_quickstart.py:E402
    code/eval/run_dense_baseline.py:E402
max-complexity = 15
