'|corrected less metric significant than value':
  quote: "Another remedy for data dredging is to record the number of all significance\
    \ tests conducted during the study and simply divide one's criterion for significance\
    \ (alpha) by this number; this is the Bonferroni correction.  However, this is\
    \ a very conservative metric. A family-wise alpha of 0.05, divided in this way\
    \ by 1,000 to account for 1,000 significance tests, yields a very stringent per-hypothesis\
    \ alpha of 0.00005. Methods particularly useful in analysis of variance, and in\
    \ constructing simultaneous confidence bands for regressions involving basis functions\
    \ are Scheff\xE9's method and, if the researcher has in mind only pairwise comparisons,\
    \ the Tukey method. To avoid the extreme conservativeness of the Bonferroni correction,\
    \ more sophisticated selective inference methods are available. The most common\
    \ selective inference method is the use of Benjamini and Hochberg's false discovery\
    \ rate controlling procedure: it is a less conservative approach that has become\
    \ a popular method for control of multiple hypothesis tests."
  source_id: Data dredging
  url: https://en.wikipedia.org/wiki/Data_dredging
  value: '0.00005'
'|doe ensemble exceed hour not runtime':
  quote: The film's storyline draws loose inspiration from multiple real-life geopolitical
    events and conflicts in South Asia, including the 1999 IC-814 hijacking, the 2001
    Indian Parliament attack, the 2008 Mumbai attacks, and developments linked to
    Pakistan's Operation Lyari. Principal photography for Dhurandhar took place from
    July 2024 to October 2025 across multiple locations in India and abroad, including
    the states and union territories of Punjab, Maharashtra, Chandigarh, Ladakh and
    Himachal Pradesh, as well as Thailand. The film features music composed by Shashwat
    Sachdev, cinematography by Vikash Nowlakha, and editing by Shivkumar V. Panicker.
    With a runtime of 214 minutes, Dhurandhar ranks as one of the longest Indian films
    ever produced.
  source_id: Dhurandhar
  url: https://en.wikipedia.org/wiki/Dhurandhar
  value: 214 minutes
