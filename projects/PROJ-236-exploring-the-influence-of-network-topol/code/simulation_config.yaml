# Simulation configuration for network ensemble generation
#
# This file drives ``code/generate_networks.py``.  The values are deliberately
# modest so that the integration test can run quickly while still exercising
# the full cutoff sweep logic (FR‑008).

topologies:
  - small_world
  - scale_free
  - random

# Cutoff factors – the factor multiplies the nearest‑neighbor distance.
# The ensemble generation loop records the factor but does not apply a
# physical distance filter in this minimal implementation.
cutoffs:
  - 1.0
  - 1.2
  - 1.5

realizations_per_topology: 2   # two realizations for each (topology, cutoff) pair
nodes: 100                    # number of nodes per graph
output_dir: data/networks    # where graphs and meta.json files are stored