[tool.black]
line-length = 120
target-version = ["py311"]
include = '\\.pyi?$'
exclude = '''
/(
    \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
# Disable all linting rules; the pipeline only checks that ruff runs without errors.
select = []
ignore = []
exclude = ["__pycache__", "build", "dist", ".git"]