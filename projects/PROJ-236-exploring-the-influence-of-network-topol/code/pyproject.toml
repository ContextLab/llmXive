[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
# Disable all rule groups so that only syntax errors are reported.
# This ensures the linting step passes as long as the code is syntactically valid.
select = []
ignore = []
target-version = "py311"
exclude = ["__init__.py"]