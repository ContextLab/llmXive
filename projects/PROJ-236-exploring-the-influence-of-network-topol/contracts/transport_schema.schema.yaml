$schema: "http://json-schema.org/draft-07/schema#"
title: TransportResult
description: Schema for transport calculation results.
type: object
additionalProperties: false
properties:
  network_id:
    type: string
    description: Unique identifier for the network realization.
  kappa:
    type: number
    description: Effective thermal conductivity (W/mK).
  error_estimate:
    type: number
    description: Estimated error or uncertainty of the conductivity.
  convergence_status:
    type: string
    description: Status of the solver convergence.
    enum:
      - converged
      - not_converged
      - failed
  runtime:
    type: number
    description: Computation time in seconds.
  regime_flag:
    type: string
    description: Transport regime detected for this realization.
    enum:
      - ballistic
      - diffusive
      - unknown
required:
  - network_id
  - kappa
  - error_estimate
  - convergence_status
  - runtime
  - regime_flag