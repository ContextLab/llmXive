type: object
title: TransportResult
description: Schema for transport calculation results.
properties:
  network_id:
    type: string
    description: Unique identifier for the network realization.
  kappa:
    type: number
    description: Thermal conductivity in W/mK.
  error_estimate:
    type: number
    description: Estimated error or uncertainty of kappa.
  convergence_status:
    type: string
    enum: [converged, not_converged, failed]
    description: Status of solver convergence.
  runtime:
    type: number
    description: Computation runtime in seconds.
  regime_flag:
    type: string
    enum: [diffusive, ballistic, unknown]
    description: Transport regime classification.
required:
  - network_id
  - kappa
  - error_estimate
  - convergence_status
  - runtime
  - regime_flag
additionalProperties: false
example:
  network_id: net_001
  kappa: 1.23
  error_estimate: 0.05
  convergence_status: converged
  runtime: 120.5
  regime_flag: diffusive