name: ModelResult
description: Schema for model output data from statistical analysis
version: 1.0.0
fields:
  - name: ModelResult
    description: Results from statistical model fitting
    properties:
      coefficients:
        type: dict
        description: Dictionary of model coefficients with predictor names as keys
        required: true
      p_values:
        type: dict
        description: Dictionary of p-values for each coefficient
        required: true
      vif_scores:
        type: dict
        description: Dictionary of Variance Inflation Factor scores for predictors
        required: true
      posterior_distributions:
        type: dict
        description: Dictionary of posterior distribution parameters for Bayesian models
        required: true
      model_type:
        type: str
        description: Type of model used (logistic, bayesian, etc.)
        required: true
      methodology:
        type: str
        description: Methodology used (Causal Independence or Correlational Analysis)
        required: true
metadata:
  created_by: T007a_schema_model
  last_updated: 2024-01-01T00:00:00Z