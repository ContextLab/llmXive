# Model Output Schema for Statistical Analysis of Recipe Data
# Defines the structure of model fitting results and evaluation metrics
version: "1.0.0"
description: "Schema for logistic regression and Bayesian model outputs"

fields:
  - name: model_type
    type: string
    description: "Type of model (logistic_regression or hierarchical_bayesian)"
    required: true
    enum:
      - logistic_regression
      - hierarchical_bayesian
    example: "logistic_regression"
    
  - name: coefficients
    type: object
    description: "Model coefficients for each predictor"
    required: true
    properties:
      log_co_occurrence:
        type: float
      flavor_similarity:
        type: float
      functional_role_primary:
        type: float
      functional_role_secondary:
        type: float
      functional_role_garnish:
        type: float
        
  - name: standard_errors
    type: object
    description: "Standard errors for each coefficient"
    required: true
    properties:
      log_co_occurrence:
        type: float
      flavor_similarity:
        type: float
      functional_role_primary:
        type: float
      functional_role_secondary:
        type: float
      functional_role_garnish:
        type: float
        
  - name: p_values
    type: object
    description: "P-values for each coefficient"
    required: true
    properties:
      log_co_occurrence:
        type: float
      flavor_similarity:
        type: float
      functional_role_primary:
        type: float
      functional_role_secondary:
        type: float
      functional_role_garnish:
        type: float
        
  - name: vif_scores
    type: object
    description: "Variance Inflation Factors for each predictor"
    required: true
    properties:
      log_co_occurrence:
        type: float
      flavor_similarity:
        type: float
      functional_role:
        type: float
        
  - name: model_metrics
    type: object
    description: "Overall model performance metrics"
    required: true
    properties:
      auc:
        type: float
      precision:
        type: float
      recall:
        type: float
      f1_score:
        type: float
      log_loss:
        type: float
        
  - name: convergence_info
    type: object
    description: "Convergence information for Bayesian models"
    required: false
    properties:
      r_hat:
        type: float
      effective_sample_size:
        type: integer
      divergences:
        type: integer
        
  - name: methodology
    type: string
    description: "Methodology used (Causal Independence or Correlational Analysis)"
    required: true
    example: "Correlational Analysis"
    
  - name: timestamp
    type: string
    description: "ISO8601 timestamp of model fitting"
    required: true
    example: "2024-01-15T14:30:00Z"
    
validation_rules:
  - rule: "coefficients must have at least 3 predictors"
    type: object_length
    min: 3
  - rule: "auc must be between 0.5 and 1.0"
    type: range
    min: 0.5
    max: 1.0
  - rule: "vif_scores must be positive"
    type: range
    min: 0.0
    
notes:
  - "This schema supports both logistic regression and hierarchical Bayesian model outputs"
  - "For Bayesian models, convergence_info is required"
  - "VIF scores are computed for all predictors to check multicollinearity"
