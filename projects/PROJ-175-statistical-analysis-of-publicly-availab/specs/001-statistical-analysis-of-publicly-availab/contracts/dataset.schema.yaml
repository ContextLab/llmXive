name: IngredientPair
description: Schema for ingredient pair data used in statistical analysis
version: 1.0.0
fields:
  - name: IngredientPair
    description: A pair of ingredients with their relationship metrics
    properties:
      ingredient_id:
        type: str
        description: Unique identifier for the ingredient pair (e.g., 'ing1_ing2')
        required: true
      log_co_occurrence:
        type: float
        description: Log-transformed co-occurrence frequency of the ingredient pair
        required: true
      flavor_similarity:
        type: float
        description: FlavorDB chemical vectors
        source: FlavorDB chemical matrix
        required: true
      functional_role:
        type: str
        description: Functional role of the first ingredient (primary, secondary, garnish)
        enum:
          - primary
          - secondary
          - garnish
        required: true
      compatibility_label:
        type: int
        description: Binary compatibility label (1 = compatible, 0 = not compatible)
        required: true
metadata:
  created_by: T007a_schema_dataset
  updated_by: T007b
  last_updated: 2024-01-01T00:00:00Z
