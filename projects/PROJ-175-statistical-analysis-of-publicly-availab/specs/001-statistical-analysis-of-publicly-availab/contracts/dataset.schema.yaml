version: "1.0.0"
description: "Schema for the primary ingredient analysis dataset used in statistical modeling."
fields:
  - name: ingredient_id
    type: string
    description: "Unique identifier for the ingredient (normalized canonical name)."
    nullable: false
    unique: true
  - name: log_co_occurrence
    type: float
    description: "Log-transformed co-occurrence count with other ingredients, smoothed with epsilon."
    nullable: false
    min_value: -inf
  - name: flavor_similarity
    type: float
    description: "Cosine similarity between ingredient embeddings (FlavorDB chemical vectors or Recipe1M visual/text embeddings)."
    nullable: false
    min_value: -1.0
    max_value: 1.0
  - name: functional_role
    type: string
    description: "Derived functional role of the ingredient."
    nullable: false
    enum:
      - primary
      - secondary
      - garnish
  - name: compatibility_label
    type: integer
    description: "Binary compatibility label (1 if rating >= median, 0 otherwise)."
    nullable: false
    enum:
      - 0
      - 1
  - name: frequency
    type: integer
    description: "Marginal frequency of the ingredient in the corpus."
    nullable: false
    min_value: 1
  - name: source_methodology
    type: string
    description: "Indicates the data source methodology used for this record."
    nullable: false
    enum:
      - Causal Independence
      - Correlational Analysis
constraints:
  - "No null values allowed in primary key (ingredient_id)."
  - "flavor_similarity must be within [-1, 1]."
  - "functional_role must be one of the enumerated values."
