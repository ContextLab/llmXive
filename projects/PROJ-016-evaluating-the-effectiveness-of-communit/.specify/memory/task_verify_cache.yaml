    missing and the task is not fulfilled.
T024b:
  c: false
  h: 813465cf97f8e1861f821db1af629fb4259e1d6bc2340327efc72cac184247dd
  r: "The required output file `data/processed/sensitivity_coefficients.json` does\
    \ not exist, and the provided `code/analysis/regression.py` is truncated and lacks\
    \ the logic to load the full\u2011model coefficients, invoke the sensitivity calculation,\
    \ and write the percentage change to that JSON file. The task\u2019s core functionality\
    \ is therefore not implemented."
T025b:
