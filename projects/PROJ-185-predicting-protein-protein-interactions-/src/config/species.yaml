# Species configuration
#
# Each top‑level key is a species name. For each species we specify:
#   accessions:      List of GEO series accession IDs to include in the analysis.
#   held_out_series: One accession that will be reserved for the pilot benchmark.
#   min_samples:    Minimum total number of samples required after discarding
#                   series with <30 samples.
#
# The default configuration includes Arabidopsis thaliana with a representative
# GEO series. Additional species can be added following the same schema.
Arabidopsis thaliana:
  accessions:
    - GSE152416
  held_out_series: GSE152416
  min_samples: 50
