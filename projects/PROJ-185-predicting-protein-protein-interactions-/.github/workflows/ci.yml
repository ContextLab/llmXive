name: CI

# Trigger the workflow on pushes and pull requests to any branch
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # Existing CI jobs (e.g., linting, testing) would be defined elsewhere.
  # This job validates that the CI workflow file itself conforms to the
  # expected structure by invoking the project‑provided validator script.
  ci-workflow-validation:
    name: CI Workflow Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate CI workflow structure
        # The validator script resides in the repository under `code/scripts/`.
        # It raises an error if the workflow does not contain the required
        # `ci-workflow-validation` job.
        run: python code/scripts/validate_ci_workflow.py