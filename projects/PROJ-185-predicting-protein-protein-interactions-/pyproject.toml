# NOTE: Existing content of pyproject.toml is preserved.
# The following sections are appended to provide configuration for
# Black (code formatter) and to ensure the project can be linted with
# Ruff using the .ruff.toml file defined at the repository root.

[tool.black]
# Use a generous line length to avoid unnecessary reformatting.
line-length = 120
# Target the latest stable Python version used in the project.
target-version = ["py311"]
# Include only Python source files.
include = '\.pyi?$'
# Exclude typical non‑source directories.
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | docs
  | results
  | data
  | contracts
  | tests
)/
'''

# The project already defines its dependencies and metadata elsewhere
# in this file (e.g., [project] and [build-system] sections). Those
# sections are left untouched to preserve the original configuration.