[project]
name = "ppi-coexpression"
version = "0.1.0"
description = "Predict protein-protein interactions from co-expression networks."
authors = [{name = "Research Team", email = "team@example.com"}]
# Runtime dependencies – all pinned to exact versions
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scipy==1.13.0",
  "matplotlib==3.8.4",
  "scikit-learn==1.5.0",
  "statsmodels==0.14.2",
  "seaborn==0.13.2",
  "pytest==8.2.2",
  "PyYAML==6.0.1",
  "requests==2.32.3",
  "jsonschema==4.22.0",
  "psutil==5.9.8",
  "rpy2==3.5.16",
  "GEOparse==2.0.2",
  "goatools==1.5.3",
  "networkx==3.3"
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | docs
  | results
  | data
  | contracts
  | tests
)/
'''