$schema: "http://json-schema.org/draft-07/schema#"
title: "Predicted PPI Edge List"
description: "Schema for the predicted protein‑protein interaction edge list produced by the pipeline."
type: object
required:
  - protein_id_1
  - protein_id_2
  - correlation
properties:
  protein_id_1:
    type: string
    description: "STRING protein identifier for the first node."
  protein_id_2:
    type: string
    description: "STRING protein identifier for the second node."
  correlation:
    type: number
    description: "Pearson or Spearman correlation coefficient between the two proteins."
    minimum: -1.0
    maximum: 1.0
  method:
    type: string
    enum: ["pearson", "spearman"]
    description: "Correlation method used."
  bootstrap_ci_lower:
    type: number
    description: "Lower bound of the bootstrap confidence interval for the correlation (optional)."
  bootstrap_ci_upper:
    type: number
    description: "Upper bound of the bootstrap confidence interval for the correlation (optional)."
additionalProperties: false
example:
  protein_id_1: "AT1G01010"
  protein_id_2: "AT2G02020"
  correlation: strong positive
  method: "pearson"
  bootstrap_ci_lower: a substantial lower bound
  bootstrap_ci_upper: a high confidence bound (e.g., near the upper end of the interval)