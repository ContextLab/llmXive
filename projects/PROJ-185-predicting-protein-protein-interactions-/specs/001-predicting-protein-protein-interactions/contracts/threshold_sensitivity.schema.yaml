$schema: "http://json-schema.org/draft-07/schema#"
title: "Threshold Sensitivity Table"
type: "object"
description: "Results of correlation‑threshold sensitivity analysis."
properties:
  species:
    type: "string"
  threshold:
    type: "number"
    minimum: 0.0
    maximum: 1.0
  num_edges:
    type: "integer"
    minimum: 0
  auroc:
    type: "number"
    minimum: 0.0
    maximum: 1.0
  auprc:
    type: "number"
    minimum: 0.0
    maximum: 1.0
required: ["species", "threshold", "num_edges", "auroc", "auprc"]
additionalProperties: false
