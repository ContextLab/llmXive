$schema: "http://json-schema.org/draft-07/schema#"
title: "Predicted Edge List"
type: "object"
description: "Tab‑separated file with predicted protein‑protein interactions for a species."
properties:
  rows:
    type: "array"
    items:
      type: "object"
      required: ["protein_id_1", "protein_id_2", "correlation"]
      properties:
        protein_id_1:
          type: "string"
          description: "STRING protein identifier (e.g., 9606.ENSP00000354547)."
        protein_id_2:
          type: "string"
          description: "STRING protein identifier."
        correlation:
          type: "number"
          description: "Pearson or Spearman correlation coefficient (≥ 0.75)."
required: ["rows"]
additionalProperties: false
