$schema: "http://json-schema.org/draft-07/schema#"
title: "Predicted PPI Edge List"
type: object
properties:
  protein_id_1:
    type: string
    description: "STRING protein identifier for gene 1"
  protein_id_2:
    type: string
    description: "STRING protein identifier for gene 2"
  correlation:
    type: number
    description: "Pearson or Spearman correlation coefficient (r ≥ 0.75)"
required:
  - protein_id_1
  - protein_id_2
  - correlation
additionalProperties: false