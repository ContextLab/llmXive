$schema: "http://json-schema.org/draft-07/schema#"
title: "Evaluation Metrics"
type: object
properties:
  species:
    type: string
    description: "Species identifier (e.g., arabidopsis_thaliana)"
  auroc:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Area under the ROC curve for full imbalanced set"
  auprc:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Area under the Precision‑Recall curve for full set"
  baseline_auroc:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "AUROC of degree‑preserving random‑graph baseline"
  baseline_auprc:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "AUPRC of degree‑preserving random‑graph baseline"
  baseline_p:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "p‑value comparing observed AUROC to baseline distribution"
required:
  - species
  - auroc
  - auprc
  - baseline_auroc
  - baseline_auprc
  - baseline_p
additionalProperties: false