$schema: "http://json-schema.org/draft-07/schema#"
title: "Evaluation Metrics"
type: "object"
description: "Aggregated evaluation metrics per species."
properties:
  species:
    type: "string"
    description: "Species name (e.g., Arabidopsis)."
  auroc:
    type: "number"
    description: "Area under ROC curve (0–1)."
  auprc:
    type: "number"
    description: "Area under Precision‑Recall curve (0–1)."
  baseline_auroc:
    type: "number"
    description: "AUROC of degree‑preserving random‑graph baseline."
  baseline_auprc:
    type: "number"
    description: "AUPRC of degree‑preserving random‑graph baseline."
  baseline_p:
    type: "number"
    description: "p‑value comparing observed AUROC/AUPRC to baseline."
required: ["species", "auroc", "auprc", "baseline_auroc", "baseline_auprc", "baseline_p"]
additionalProperties: false
