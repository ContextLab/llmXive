$schema: "http://json-schema.org/draft-07/schema#"
title: "Evaluation Metrics"
type: "object"
description: "Aggregated AUROC, AUPRC, and baseline statistics for a species."
properties:
  species:
    type: "string"
  auroc:
    type: "number"
    minimum: 0.0
    maximum: 1.0
  auprc:
    type: "number"
    minimum: 0.0
    maximum: 1.0
  baseline_auroc:
    type: "number"
    minimum: 0.0
    maximum: 1.0
  baseline_auprc:
    type: "number"
    minimum: 0.0
    maximum: 1.0
  baseline_p:
    type: "number"
    minimum: 0.0
    maximum: 1.0
required:
  - species
  - auroc
  - auprc
  - baseline_auroc
  - baseline_auprc
  - baseline_p
additionalProperties: false
