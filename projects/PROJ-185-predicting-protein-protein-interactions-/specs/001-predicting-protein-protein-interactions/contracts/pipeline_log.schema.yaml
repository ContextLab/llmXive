$schema: "http://json-schema.org/draft-07/schema#"
title: "Pipeline Log Entry"
type: "object"
description: "A single JSON‑Line entry written to pipeline.log."
properties:
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO‑8601 timestamp of the log entry."
  level:
    type: "string"
    enum: ["DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"]
    description: "Log severity level."
  message:
    type: "string"
    description: "Human‑readable log message."
  schema_version:
    type: "string"
  seed:
    type: "integer"
  command:
    type: "string"
required:
  - timestamp
  - level
  - message
  - schema_version
  - seed
  - command
additionalProperties: false
