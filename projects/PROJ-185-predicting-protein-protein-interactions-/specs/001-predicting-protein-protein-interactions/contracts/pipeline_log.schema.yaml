$schema: "http://json-schema.org/draft-07/schema#"
title: "Pipeline Log Entry"
type: "object"
description: "One line of the JSON‑Line pipeline log."
properties:
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO‑8601 timestamp of the log entry."
  level:
    type: "string"
    enum: ["DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"]
  message:
    type: "string"
  schema_version:
    type: "string"
    pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
required: ["timestamp", "level", "message", "schema_version"]
additionalProperties: false
