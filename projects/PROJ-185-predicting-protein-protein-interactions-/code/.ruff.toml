# Ruff configuration for PROJ-185
target-version = "py310"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "PT",  # pytest
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in CLI)
    "PT001", # use @pytest.fixture() over @pytest.fixture
]

[lint.isort]
known-first-party = ["src", "tests", "create_skeleton", "init_r_environment"]
