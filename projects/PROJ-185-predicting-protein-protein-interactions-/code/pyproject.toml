[project]
name = "proj-185"
version = "0.1.0"
description = "Predict Protein‑Protein Interactions from Co‑expression Networks"
# Core dependencies required by the pipeline
dependencies = [
    "numpy",
    "pandas",
    "networkx",
    "goatools",
    "scikit-learn",
    "tqdm",
    "requests"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

# Black configuration – used by the test suite to ensure formatting settings exist
[tool.black]
line-length = 88
target-version = ["py38"]
skip-string-normalization = false

# Ruff configuration – mirrors the separate .ruff.toml but is also included here for completeness
[tool.ruff]
line-length = 88
select = ["E", "F", "W", "C90"]
ignore = ["E501"]
target-version = "py38"
