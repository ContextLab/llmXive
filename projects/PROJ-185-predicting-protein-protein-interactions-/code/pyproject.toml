[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-185-ppi-coexpression"
version = "0.1.0"
description = "Predict Protein-Protein Interactions from Co-expression Networks"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "networkx",
    "goatools",
    "scikit-learn",
    "tqdm",
    "requests",
    "pytest",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP", "N", "PT"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "create_skeleton", "init_r_environment"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''
