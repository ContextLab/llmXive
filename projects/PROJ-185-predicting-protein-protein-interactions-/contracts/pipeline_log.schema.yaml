$schema: "http://json-schema.org/draft-07/schema#"
description: |
  JSON‑Line schema for pipeline log entries generated by the central logger.
  Each line in `pipeline.log` must be a valid JSON object adhering to this schema.
type: object
additionalProperties: false
required:
  - timestamp
  - level
  - message
  - schema_version
  - command
  - versions
  - seed
properties:
  timestamp:
    type: string
    format: date-time
    description: ISO‑8601 timestamp of the log entry.
  level:
    type: string
    enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
    description: Logging level.
  message:
    type: string
    description: Human‑readable log message.
  schema_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: Version of the log schema (e.g., 1.0.0).
  command:
    type: string
    description: Full CLI command that invoked the pipeline.
  versions:
    type: object
    description: Mapping of software component names to their version strings.
    additionalProperties:
      type: string
  seed:
    type: integer
    description: Global random seed used for reproducibility.