$schema: "http://json-schema.org/draft-07/schema#"
title: Pipeline Log Entry
type: object
properties:
  timestamp:
    type: string
    format: date-time
  level:
    type: string
    enum:
      - INFO
      - ERROR
      - WARNING
      - DEBUG
  message:
    type: string
  schema_version:
    type: string
  command:
    type: string
  versions:
    type: object
    additionalProperties:
      type: string
  seed:
    type: integer
    nullable: true
required:
  - timestamp
  - level
  - message
  - schema_version
  - command
  - versions
  - seed
additionalProperties: false