$schema: "http://json-schema.org/draft-07/schema#"
title: Predicted PPI Edge List
description: |
  JSON‑Schema describing the TSV/TSV‑like output file that contains
  predicted protein‑protein interactions. Each entry represents an
  interaction between two proteins together with a numeric correlation
  score (range –1.0 to 1.0). The file is expected to be a list of objects
  when parsed (e.g., via csv.DictReader) and must contain exactly the
  three required fields.
type: array
items:
  type: object
  required:
    - protein_a
    - protein_b
    - score
  properties:
    protein_a:
      type: string
      description: Identifier of the first protein (e.g., STRING protein ID)
    protein_b:
      type: string
      description: Identifier of the second protein (e.g., STRING protein ID)
    score:
      type: number
      description: Correlation score between the two proteins
      minimum: -1.0
      maximum: 1.0
  additionalProperties: false
additionalItems: false