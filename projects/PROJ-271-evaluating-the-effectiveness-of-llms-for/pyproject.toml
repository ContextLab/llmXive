[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-eval-code-smells"
version = "0.1.0"
description = "Evaluating the Effectiveness of LLMs for Detecting Code Smells"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "pandas",
    "radon",
    "pylint",
    "sentence-transformers",
    "llama-cpp-python",
    "scikit-learn",
    "statsmodels",
    "numpy",
    "psutil"
]

[project.optional-dependencies]
dev = [
    "flake8",
    "black",
    "pytest",
    "pre-commit"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
