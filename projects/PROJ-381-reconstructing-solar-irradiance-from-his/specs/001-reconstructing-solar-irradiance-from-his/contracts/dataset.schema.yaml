$schema: "http://json-schema.org/draft-07/schema#"
title: "Solar Irradiance Dataset Schema"
description: "Row-level schema for all dataset files in the project."
type: object
properties:
  date:
    type: string
    format: date
    description: "Observation date (YYYY-MM-DD)."
  gsn:
    type: number
    description: "Group Sunspot Number (raw, interpolated, or proxy‑filled)."
  sunspot_number:
    type: number
    description: "SILSO sunspot number (if present)."
  quality_flag:
    type: string
    enum:
      - raw
      - interpolated
      - proxy
    description: "Method used to obtain the GSN value."
  cycle_id:
    type: integer
    description: "Solar cycle identifier from SILSO definitions."
  gsn_lag1:
    type: number
    description: "One‑month lagged GSN value."
  solar_forcing:
    type: number
    description: "CMIP6 solar forcing (TSI) value."
  tsi_value:
    type: number
    description: "Total Solar Irradiance (W/m²) from verified satellite data."
  instrument:
    type: string
    description: "Instrument name for TSI measurements."
  uncertainty:
    type: number
    description: "Measurement uncertainty for TSI or baseline values."
required:
  - date
  - gsn
  - quality_flag