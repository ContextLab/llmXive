$schema: "http://json-schema.org/draft-07/schema#"
title: "Preprocessed Solar Irradiance Dataset Schema"
description: "Schema for the merged and feature‑engineered dataset used for model training and reconstruction."
type: "object"
properties:
  date:
    type: "string"
    format: "date"
    description: "Observation date (YYYY-MM-DD)."
  gsn:
    type: "number"
    description: "Group Sunspot Number (raw or interpolated)."
  quality_flag:
    type: "string"
    enum:
      - "raw"
      - "interpolated"
      - "proxy"
    description: "Indicates how the GSN value was obtained."
  cycle_phase_sin:
    type: "number"
    description: "Sine of the fractional position within the solar cycle."
  cycle_phase_cos:
    type: "number"
    description: "Cosine of the fractional position within the solar cycle."
  gsn_lag1:
    type: "number"
    description: "GSN value lagged by one month."
  solar_forcing:
    type: "number"
    description: "CMIP6 solar forcing proxy for TSI (W·m⁻²)."
required:
  - date
  - gsn
  - quality_flag
  - cycle_phase_sin
  - cycle_phase_cos
  - gsn_lag1
  - solar_forcing
