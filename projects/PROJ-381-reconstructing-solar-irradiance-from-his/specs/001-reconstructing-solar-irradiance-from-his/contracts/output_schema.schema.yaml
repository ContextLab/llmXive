$schema: "http://json-schema.org/draft-07/schema#"
title: "Reconstruction Output Schema"
description: "Schema for the final TSI reconstruction and comparison report."
type: "object"
properties:
  reconstruction:
    type: "object"
    description: "Time series of reconstructed TSI."
    properties:
      date:
        type: "string"
        format: "date"
      tsi_reconstructed:
        type: "number"
      tsi_uncertainty_lower:
        type: "number"
      tsi_uncertainty_upper:
        type: "number"
    required:
      - date
      - tsi_reconstructed
      - tsi_uncertainty_lower
      - tsi_uncertainty_upper
  metrics:
    type: "object"
    description: "Performance metrics."
    properties:
      rmse_satellite:
        type: "number"
        description: "RMSE on satellite validation period."
      r_squared:
        type: "number"
        description: "R-squared on satellite validation period."
      error_reduction_percent:
        type: "number"
        description: "Percentage reduction vs 2007 baseline."
    required:
      - rmse_satellite
      - r_squared
# error_reduction_percent is optional because the 2007 baseline may be unavailable.