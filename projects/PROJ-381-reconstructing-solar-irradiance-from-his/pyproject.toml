[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-solar-reconstruction"
version = "0.1.0"
description = "Reconstructing Solar Irradiance from Historical Sunspot Records"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "numpy",
    "scipy",
    "requests",
    "pyyaml",
    "ruff",
    "black",
    "joblib",
    "parquet",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
# Same as Black
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in ML)
    "C901", # too complex (allow some complexity in analysis)
]

[tool.ruff.lint.per-file-ignores]
"code/data/ingestion.py" = ["S310"] # URL check exception for external fetch
"tests/*" = ["S101"] # Allow assert in tests

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
addopts = "-v --tb=short"
