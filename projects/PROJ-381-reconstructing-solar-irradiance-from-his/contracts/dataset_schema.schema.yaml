# Dataset Schema Definition for Solar Irradiance Reconstruction Pipeline
# Defines the structure for SunspotRecord and TSIRecord entities
# Used for validation of data ingestion and preprocessing stages

$schema: "http://json-schema.org/draft-07/schema#"
title: "Solar Irradiance Reconstruction Dataset Schema"
description: "Schema for sunspot number and Total Solar Irradiance records"
type: "object"

definitions:
  SunspotRecord:
    description: "Record representing a sunspot number observation"
    type: "object"
    required:
      - date
      - gsn
      - source
      - cycle_id
    properties:
      date:
        type: "string"
        format: "date"
        description: "Observation date in YYYY-MM-DD format"
      gsn:
        type: "number"
        minimum: 0
        description: "Group Sunspot Number (GSN) value"
      uncertainty:
        type: "number"
        minimum: 0
        description: "Uncertainty estimate for GSN measurement"
      source:
        type: "string"
        enum:
          - "SILSO"
          - "Historical"
        description: "Data source identifier"
      cycle_id:
        type: ["integer", "null"]
        description: "Solar cycle identifier (1-25+), null if unknown"
      is_gap_filled:
        type: "boolean"
        description: "Flag indicating if this value was gap-filled"
      gap_fill_method:
        type: ["string", "null"]
        enum:
          - "linear_interpolation"
          - "tsi_proxy"
          - null
        description: "Method used for gap filling if applicable"
    
  TSIRecord:
    description: "Record representing a Total Solar Irradiance observation"
    type: "object"
    required:
      - date
      - tsi
      - source
    properties:
      date:
        type: "string"
        format: "date"
        description: "Observation date in YYYY-MM-DD format"
      tsi:
        type: "number"
        minimum: 1360
        maximum: 1370
        description: "Total Solar Irradiance in W/m²"
      uncertainty:
        type: "number"
        minimum: 0
        description: "Uncertainty estimate for TSI measurement"
      source:
        type: "string"
        enum:
          - "SORCE"
          - "TIM"
          - "SORCE_TIM"
          - "CMIP6"
          - "Baseline_2007"
        description: "Data source identifier"
      instrument:
        type: ["string", "null"]
        description: "Instrument name if applicable"
      is_gap_filled:
        type: "boolean"
        description: "Flag indicating if this value was gap-filled"
      gap_fill_method:
        type: ["string", "null"]
        enum:
          - "linear_interpolation"
          - "tsi_proxy"
          - null
        description: "Method used for gap filling if applicable"
      cycle_id:
        type: ["integer", "null"]
        description: "Solar cycle identifier (1-25+), null if unknown"

oneOf:
  - $ref: "#/definitions/SunspotRecord"
  - $ref: "#/definitions/TSIRecord"