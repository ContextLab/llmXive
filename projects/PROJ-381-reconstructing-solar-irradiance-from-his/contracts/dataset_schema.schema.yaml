%YAML 1.2
---
$schema: http://json-schema.org/draft-07/schema#
title: Solar Irradiance Reconstruction Dataset Schemas
description: |
  Defines the schema for SunspotRecord (input from SILSO) and TSIRecord (input from SORCE/TIM).
  These schemas are used for validation during the ingestion and preprocessing phases.

definitions:
  SunspotRecord:
    type: object
    description: |
      Represents a single sunspot number observation.
      Corresponds to the SILSO daily/monthly sunspot number records.
    required:
      - date
      - sunspot_number
      - quality_flag
    properties:
      date:
        type: string
        format: date
        description: "Observation date in YYYY-MM-DD format."
      sunspot_number:
        type: number
        description: "Daily or monthly sunspot number (relative sunspot number)."
      quality_flag:
        type: integer
        description: |
          Quality indicator from the source.
          0: Good quality
          1: Estimated/Interpolated
          2: Suspected/Unreliable
      uncertainty:
        type: number
        description: "Optional estimated uncertainty of the measurement."
      source:
        type: string
        description: "Source identifier (e.g., 'SILSO')."
    
  TSIRecord:
    type: object
    description: |
      Represents a single Total Solar Irradiance observation.
      Corresponds to SORCE/TIM or other satellite-era TSI records.
    required:
      - date
      - tsi_value
      - instrument_id
    properties:
      date:
        type: string
        format: date
        description: "Observation date in YYYY-MM-DD format."
      tsi_value:
        type: number
        description: "Total Solar Irradiance value in W/m²."
      instrument_id:
        type: string
        description: "Identifier for the instrument (e.g., 'SORCE-TIM', 'TSIS-1')."
      uncertainty:
        type: number
        description: "Estimated measurement uncertainty in W/m²."
      quality_flag:
        type: integer
        description: "Quality flag from the instrument pipeline."
      source:
        type: string
        description: "Source identifier (e.g., 'SORCE', 'NASA')."

allOf:
  - $ref: '#/definitions/SunspotRecord'
  - $ref: '#/definitions/TSIRecord'