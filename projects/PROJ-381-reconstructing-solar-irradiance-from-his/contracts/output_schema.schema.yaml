# Output Schema for Solar Irradiance Reconstruction Pipeline
# Defines the structure for reconstruction outputs and validation reports
# Version: 1.0
# Last Updated: 2024

$schema: http://json-schema.org/draft-07/schema#

definitions:
  ReconstructionRecord:
    type: object
    description: Individual record in the TSI reconstruction output
    properties:
      date:
        type: string
        format: date
        description: Date of the observation (YYYY-MM-DD)
      year:
        type: integer
        minimum: 1610
        description: Year of the observation
      gsn:
        type: number
        description: Group Sunspot Number value
      cycle_id:
        type: integer
        nullable: true
        description: SILSO cycle identifier (null for pre-cycle records)
      tsi_reconstructed:
        type: number
        description: Reconstructed Total Solar Irradiance in W/m²
      tsi_lower_bound:
        type: number
        description: Lower bound of prediction interval (W/m²)
      tsi_upper_bound:
        type: number
        description: Upper bound of prediction interval (W/m²)
      uncertainty_source:
        type: string
        enum:
          - model_confidence
          - bootstrap_variance
          - fallback_adjustment
        description: Source of uncertainty estimation
      method_applied:
        type: string
        enum:
          - random_forest
          - gaussian_process
          - cycle_agnostic_fallback
        description: Model method used for this reconstruction
    required:
      - date
      - year
      - gsn
      - tsi_reconstructed
      - tsi_lower_bound
      - tsi_upper_bound
      - uncertainty_source
      - method_applied

  ValidationReport:
    type: object
    description: Cross-validation and model performance report
    properties:
      metadata:
        type: object
        properties:
          generated_at:
            type: string
            format: date-time
            description: ISO 8601 timestamp of report generation
          model_type:
            type: string
            description: Type of model evaluated (e.g., 'RandomForest', 'GaussianProcess')
          dataset_version:
            type: string
            description: Version identifier of the dataset used
          validation_scheme:
            type: string
            enum:
              - leave_one_cycle_out
              - k_fold
              - time_series_split
            description: Cross-validation strategy employed
        required:
          - generated_at
          - model_type
          - dataset_version
          - validation_scheme
      per_cycle_metrics:
        type: array
        description: Performance metrics for each held-out cycle in LOCO CV
        items:
          type: object
          properties:
            cycle_id:
              type: integer
              description: SILSO cycle identifier
            cycle_start:
              type: string
              format: date
              description: Start date of the cycle
            cycle_end:
              type: string
              format: date
              description: End date of the cycle
            n_observations:
              type: integer
              minimum: 1
              description: Number of data points in the held-out cycle
            rmse:
              type: number
              minimum: 0
              description: Root Mean Square Error (W/m²)
            r_squared:
              type: number
              description: Coefficient of determination (R²)
            mean_absolute_error:
              type: number
              minimum: 0
              description: Mean Absolute Error (W/m²)
            bias:
              type: number
              description: Mean error (prediction - actual)
          required:
            - cycle_id
            - cycle_start
            - cycle_end
            - n_observations
            - rmse
            - r_squared
      aggregate_metrics:
        type: object
        description: Overall performance metrics across all cycles
        properties:
          mean_rmse:
            type: number
            minimum: 0
            description: Average RMSE across all held-out cycles
          std_rmse:
            type: number
            minimum: 0
            description: Standard deviation of RMSE across cycles
          mean_r_squared:
            type: number
            description: Average R² across all held-out cycles
          min_r_squared:
            type: number
            description: Minimum R² observed across cycles
          max_r_squared:
            type: number
            description: Maximum R² observed across cycles
          model_selection_rationale:
            type: string
            description: Explanation for selected model based on CV results
        required:
          - mean_rmse
          - mean_r_squared
          - model_selection_rationale
      fallback_model_metrics:
        type: object
        nullable: true
        description: Metrics for the cycle-agnostic fallback model
        properties:
          rmse:
            type: number
            minimum: 0
          r_squared:
            type: number
          n_training_samples:
            type: integer
            minimum: 1
      sensitivity_analysis:
        type: object
        nullable: true
        description: Results from sensitivity analysis on inconsistency thresholds
        properties:
          thresholds_tested:
            type: array
            items:
              type: number
            description: List of inconsistency tolerance thresholds swept
          stability_metric:
            type: number
            description: RMSE variance across the sensitivity sweep
          conclusion:
            type: string
            description: Interpretation of model stability
    required:
      - metadata
      - per_cycle_metrics
      - aggregate_metrics

  ComparisonReport:
    type: object
    description: Report comparing reconstruction against baseline and CMIP6 data
    properties:
      metadata:
        type: object
        properties:
          generated_at:
            type: string
            format: date-time
          comparison_baseline:
            type: string
            description: Name of the baseline dataset (e.g., '2007_Baseline', 'CMIP6_v3.2')
          overlap_period:
            type: object
            properties:
              start:
                type: string
                format: date
              end:
                type: string
                format: date
            required:
              - start
              - end
        required:
          - generated_at
          - comparison_baseline
          - overlap_period
      error_metrics:
        type: object
        properties:
          rmse_reconstruction:
            type: number
            minimum: 0
            description: RMSE of new reconstruction vs satellite reference
          rmse_baseline:
            type: number
            minimum: 0
            description: RMSE of baseline vs satellite reference
          error_reduction_percentage:
            type: number
            description: Percentage improvement in error (SC-001)
          p_value:
            type: number
            minimum: 0
            maximum: 1
            description: P-value from statistical significance test
          corrected_p_value:
            type: number
            description: P-value after Bonferroni or FDR correction
          is_significant:
            type: boolean
            description: Whether the improvement is statistically significant
        required:
          - rmse_reconstruction
          - rmse_baseline
          - error_reduction_percentage
          - is_significant
      variance_analysis:
        type: object
        nullable: true
        description: Variance comparison across historical minima
        properties:
          maunder_minimum_variance:
            type: number
          dalton_minimum_variance:
            type: number
          modern_minimum_variance:
            type: number
          bootstrap_iterations:
            type: integer
            minimum: 1000
          fdr_corrected_significance:
            type: array
            items:
              type: object
              properties:
                comparison:
                  type: string
                is_significant:
                  type: boolean
      associational_framing:
        type: string
        description: Explicit statement that findings are associational, not causal
        pattern: ^.*associational.*$
    required:
      - metadata
      - error_metrics
      - associational_framing

  SensitivityReport:
    type: object
    description: Report on model sensitivity to inconsistency tolerance thresholds
    properties:
      metadata:
        type: object
        properties:
          generated_at:
            type: string
            format: date-time
          thresholds_swept:
            type: array
            items:
              type: number
            description: Thresholds tested: [0.01, 0.05, 0.1]
        required:
          - generated_at
          - thresholds_swept
      stability_metrics:
        type: object
        properties:
          rmse_variance:
            type: number
            description: Variance of RMSE across threshold sweep
          max_rmse_deviation:
            type: number
            description: Maximum deviation in RMSE from mean
          min_rmse_deviation:
            type: number
            description: Minimum deviation in RMSE from mean
        required:
          - rmse_variance
      per_threshold_results:
        type: array
        items:
          type: object
          properties:
            threshold:
              type: number
            mean_rmse:
              type: number
            std_rmse:
              type: number
            n_cycles_affected:
              type: integer
      conclusion:
        type: string
        description: Interpretation of model robustness to threshold changes
    required:
      - metadata
      - stability_metrics
      - conclusion

# Root schema definitions for file outputs
schemas:
  reconstruction_parquet:
    $ref: '#/definitions/ReconstructionRecord'
    description: Schema for data/processed/reconstruction_1610_2002.parquet

  cv_report_json:
    $ref: '#/definitions/ValidationReport'
    description: Schema for data/processed/cv_report.json

  final_report_md:
    $ref: '#/definitions/ComparisonReport'
    description: Schema for data/processed/final_report.md (JSON content embedded in markdown)

  sensitivity_report_json:
    $ref: '#/definitions/SensitivityReport'
    description: Schema for data/processed/sensitivity_report.json

  cycle_coefficients_json:
    type: object
    description: Schema for data/processed/cycle_specific_coefficients.json
    properties:
      metadata:
        type: object
        properties:
          generated_at:
            type: string
            format: date-time
          fallback_model_path:
            type: string
        required:
          - generated_at
          - fallback_model_path
      cycle_offsets:
        type: object
        additionalProperties:
          type: object
          properties:
            cycle_id:
              type: integer
            mean_residual:
              type: number
            std_residual:
              type: number
            n_observations:
              type: integer
          required:
            - cycle_id
            - mean_residual
            - std_residual
            - n_observations
    required:
      - metadata
      - cycle_offsets

# Top-level schema for the output file
type: object
properties:
  schema_version:
    type: string
    const: "1.0"
  artifact_type:
    type: string
    enum:
      - reconstruction
      - cv_report
      - comparison_report
      - sensitivity_report
      - cycle_coefficients
required:
  - schema_version
  - artifact_type