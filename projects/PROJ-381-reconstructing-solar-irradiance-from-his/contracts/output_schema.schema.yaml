%YAML 1.2
---
$schema: "http://json-schema.org/draft-07/schema#"
title: "Solar Irradiance Reconstruction Output Schemas"
description: |
  Defines the JSON schemas for the reconstruction output and validation reports
  generated by the llmXive solar irradiance pipeline.

definitions:
  ReconstructionRecord:
    type: object
    description: "A single time-step record in the TSI reconstruction."
    properties:
      date:
        type: string
        format: date
        description: "The date of the observation or reconstruction (YYYY-MM-DD)."
      year:
        type: number
        description: "The year component."
      gsn:
        type: ["number", "null"]
        description: "Group Sunspot Number (input feature)."
      cycle_id:
        type: ["integer", "null"]
        description: "Official SILSO solar cycle identifier."
      tsi_reconstructed:
        type: number
        description: "Reconstructed Total Solar Irradiance in W/m²."
      tsi_uncertainty_lower:
        type: number
        description: "Lower bound of the 95% prediction interval (W/m²)."
      tsi_uncertainty_upper:
        type: number
        description: "Upper bound of the 95% prediction interval (W/m²)."
      source:
        type: string
        enum: ["satellite", "reconstructed_model", "reconstructed_fallback"]
        description: "Origin of the TSI value."
    required:
      - date
      - year
      - tsi_reconstructed
      - tsi_uncertainty_lower
      - tsi_uncertainty_upper
      - source

  ValidationReport:
    type: object
    description: "Summary metrics and details for model validation (LOCO CV)."
    properties:
      metadata:
        type: object
        properties:
          generated_at:
            type: string
            format: date-time
          model_type:
            type: string
            enum: ["RandomForest", "GaussianProcess", "Hybrid"]
          validation_scheme:
            type: string
            const: "Leave-One-Cycle-Out"
          dataset_version:
            type: string
        required:
          - generated_at
          - model_type
          - validation_scheme
      overall_metrics:
        type: object
        properties:
          rmse_mean:
            type: number
            description: "Mean RMSE across all held-out cycles."
          r2_mean:
            type: number
            description: "Mean R² across all held-out cycles."
          rmse_std:
            type: number
            description: "Standard deviation of RMSE across cycles."
        required:
          - rmse_mean
          - r2_mean
      per_cycle_metrics:
        type: array
        description: "Metrics for each cycle when it was held out."
        items:
          type: object
          properties:
            cycle_id:
              type: integer
            cycle_start_year:
              type: integer
            cycle_end_year:
              type: integer
            rmse:
              type: number
            r2:
              type: number
            n_samples:
              type: integer
          required:
            - cycle_id
            - rmse
            - r2
      model_selection_rationale:
        type: string
        description: "Explanation of why the best model was chosen."

  SensitivityReport:
    type: object
    description: "Results of the sensitivity analysis on inconsistency thresholds."
    properties:
      metadata:
        type: object
        properties:
          generated_at:
            type: string
            format: date-time
          sweep_parameter:
            type: string
            const: "inconsistency_tolerance"
          sweep_values:
            type: array
            items:
              type: number
        required:
          - generated_at
          - sweep_parameter
          - sweep_values
      stability_metrics:
        type: object
        properties:
          reconstruction_stability_rmse_std:
            type: number
            description: "Standard deviation of RMSE across the sweep."
          baseline_rmse:
            type: number
            description: "RMSE of the Cycle-Agnostic fallback model."
        required:
          - reconstruction_stability_rmse_std
          - baseline_rmse
      sweep_results:
        type: array
        items:
          type: object
          properties:
            threshold_value:
              type: number
            resulting_rmse:
              type: number
            deviation_from_baseline:
              type: number
          required:
            - threshold_value
            - resulting_rmse

  VarianceAnalysisReport:
    type: object
    description: "Bootstrap variance comparison across solar minima."
    properties:
      metadata:
        type: object
        properties:
          generated_at:
            type: string
            format: date-time
          method:
            type: string
            const: "Bootstrap Resampling"
          iterations:
            type: integer
            minimum: 1000
        required:
          - generated_at
          - method
          - iterations
      period_statistics:
        type: object
        additionalProperties:
          type: object
          properties:
            mean_variance:
              type: number
            std_variance:
              type: number
            confidence_interval_95:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
          required:
            - mean_variance
            - std_variance
            - confidence_interval_95
      hypothesis_tests:
        type: array
        items:
          type: object
          properties:
            comparison:
              type: string
              description: "e.g., 'Maunder vs Modern'"
            p_value:
              type: number
            corrected_p_value:
              type: number
            is_significant:
              type: boolean
          required:
            - comparison
            - p_value
            - corrected_p_value
            - is_significant

# Main Schemas for Output Files

ReconstructionOutput:
  type: object
  description: "The root object for the reconstruction parquet/JSON export (schema definition)."
  properties:
    schema_version:
      type: string
      const: "1.0.0"
    records:
      type: array
      items:
        $ref: "#/definitions/ReconstructionRecord"
  required:
    - schema_version
    - records

ValidationReportOutput:
  type: object
  description: "The root object for the CV report JSON."
  properties:
    schema_version:
      type: string
      const: "1.0.0"
    report:
      $ref: "#/definitions/ValidationReport"
  required:
    - schema_version
    - report

SensitivityReportOutput:
  type: object
  description: "The root object for the sensitivity analysis JSON."
  properties:
    schema_version:
      type: string
      const: "1.0.0"
    report:
      $ref: "#/definitions/SensitivityReport"
  required:
    - schema_version
    - report

VarianceAnalysisOutput:
  type: object
  description: "The root object for the variance analysis JSON."
  properties:
    schema_version:
      type: string
      const: "1.0.0"
    report:
      $ref: "#/definitions/VarianceAnalysisReport"
  required:
    - schema_version
    - report

# Root Schema for validation tools
$id: "https://llmxive.org/schemas/output_schema.schema.yaml"
oneOf:
  - $ref: "#/definitions/ReconstructionOutput"
  - $ref: "#/definitions/ValidationReportOutput"
  - $ref: "#/definitions/SensitivityReportOutput"
  - $ref: "#/definitions/VarianceAnalysisOutput"