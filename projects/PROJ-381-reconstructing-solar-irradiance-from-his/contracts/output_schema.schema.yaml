$schema: http://json-schema.org/draft-07/schema#
title: Solar Irradiance Reconstruction Output Schemas
description: |
  JSON Schema definitions for the outputs generated by the solar irradiance
  reconstruction pipeline. These schemas define the structure of the
  reconstruction data, validation reports, and sensitivity analysis results.

definitions:
  ReconstructionRecord:
    type: object
    description: |
      A single record in the reconstructed TSI time series.
      Includes the base prediction and uncertainty bounds.
    required:
      - date
      - tsi_value
      - tsi_uncertainty_lower
      - tsi_uncertainty_upper
      - model_type
      - cycle_id
      - gap_filled
    properties:
      date:
        type: string
        format: date
        description: ISO 8601 date string (YYYY-MM-DD)
      tsi_value:
        type: number
        format: float
        description: Reconstructed Total Solar Irradiance in W/m²
      tsi_uncertainty_lower:
        type: number
        format: float
        description: Lower bound of the prediction interval (W/m²)
      tsi_uncertainty_upper:
        type: number
        format: float
        description: Upper bound of the prediction interval (W/m²)
      model_type:
        type: string
        enum:
          - random_forest
          - gaussian_process
          - cycle_agnostic_fallback
        description: The model used to generate this prediction
      cycle_id:
        type: integer
        nullable: true
        description: |
          The solar cycle ID assigned by SILSO. Null for pre-satellite
          data where cycle boundaries are inferred or unknown.
      gap_filled:
        type: boolean
        description: True if the underlying GSN data was gap-filled.

  ValidationReport:
    type: object
    description: |
      Report generated from the Leave-One-Cycle-Out (LOCO) cross-validation
      and fallback model sensitivity analysis.
    required:
      - generated_at
      - cv_results
      - fallback_analysis
      - metrics_summary
    properties:
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of report generation
      cv_results:
        type: array
        description: Per-cycle validation results from LOCO CV
        items:
          type: object
          required:
            - cycle_id
            - rmse
            - r_squared
            - n_samples
            - model_type_used
          properties:
            cycle_id:
              type: integer
              description: The solar cycle ID held out
            rmse:
              type: number
              format: float
              description: Root Mean Square Error (W/m²)
            r_squared:
              type: number
              format: float
              description: Coefficient of determination (R²)
            n_samples:
              type: integer
              description: Number of data points in the held-out cycle
            model_type_used:
              type: string
              enum:
                - random_forest
                - gaussian_process
              description: The primary model selected for this cycle
      fallback_analysis:
        type: object
        description: Analysis of the Cycle-Agnostic fallback model performance
        required:
          - global_rmse
          - global_r_squared
          - per_cycle_offsets
        properties:
          global_rmse:
            type: number
            format: float
            description: RMSE of the fallback model on the full satellite era
          global_r_squared:
            type: number
            format: float
            description: R² of the fallback model on the full satellite era
          per_cycle_offsets:
            type: object
            description: |
              Map of cycle_id to mean residual offset calculated against
              the fallback model. Used for sensitivity analysis.
            additionalProperties:
              type: number
              format: float
      metrics_summary:
        type: object
        description: Aggregate statistics across all cycles
        required:
          - mean_cv_rmse
          - std_cv_rmse
          - mean_cv_r_squared
          - best_performing_cycle
        properties:
          mean_cv_rmse:
            type: number
            format: float
          std_cv_rmse:
            type: number
            format: float
          mean_cv_r_squared:
            type: number
            format: float
          best_performing_cycle:
            type: integer
            description: Cycle ID with the lowest RMSE

  SensitivityReport:
    type: object
    description: |
      Report from the sensitivity analysis on inconsistency tolerance
      thresholds (FR-009).
    required:
      - generated_at
      - sweep_parameters
      - stability_metrics
    properties:
      generated_at:
        type: string
        format: date-time
      sweep_parameters:
        type: array
        description: The tolerance thresholds tested
        items:
          type: number
          format: float
      stability_metrics:
        type: object
        description: |
          Stability defined as the standard deviation of RMSE across the
          tolerance sweep, compared against the Cycle-Agnostic baseline.
        required:
          - rmse_std_deviation
          - baseline_rmse
          - max_deviation_percent
        properties:
          rmse_std_deviation:
            type: number
            format: float
            description: Std dev of RMSE across tolerance sweep
          baseline_rmse:
            type: number
            format: float
            description: RMSE of the Cycle-Agnostic baseline
          max_deviation_percent:
            type: number
            format: float
            description: Maximum percentage deviation from baseline

  OutputFileManifest:
    type: object
    description: |
      A manifest file listing all generated artifacts and their schemas.
    required:
      - version
      - files
    properties:
      version:
        type: string
        description: Schema version (e.g., "1.0.0")
      files:
        type: array
        items:
          type: object
          required:
            - path
            - schema_ref
            - description
          properties:
            path:
              type: string
              description: Relative path from project root (e.g., data/processed/reconstruction.parquet)
            schema_ref:
              type: string
              description: Reference to the schema definition (e.g., "#/definitions/ReconstructionRecord")
            description:
              type: string

# Top-level entry point for the schema file
allOf:
  - $ref: '#/definitions/ValidationReport'
  - $ref: '#/definitions/SensitivityReport'
  - $ref: '#/definitions/OutputFileManifest'