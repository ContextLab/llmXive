%YAML 1.2
---
$schema: http://json-schema.org/draft-07/schema#
title: Solar Irradiance Reconstruction Output Schemas
description: |
  Defines the JSON Schema structures for:
  1. Reconstruction Report (generated by US2 pipeline)
  2. Validation Report (generated by US1 LOCO CV and US3 comparison)
  3. Sensitivity Report (generated by Phase 3.5)

definitions:
  Metadata:
    type: object
    properties:
      version:
        type: string
        description: Schema version
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation
      pipeline_version:
        type: string
        description: Version of the pipeline that generated this output
      data_sources:
        type: array
        items:
          type: string
        description: List of source datasets used (e.g., SILSO, SORCE)
      model_artifact_path:
        type: string
        description: Relative path to the model artifact used
    
    required:
      - version
      - generated_at
      - pipeline_version

  TimeSeriesPoint:
    type: object
    description: A single point in the reconstructed time series
    properties:
      date:
        type: string
        format: date
        description: Date in YYYY-MM-DD format
      tsi_value:
        type: number
        description: Reconstructed Total Solar Irradiance in W/m^2
      uncertainty_lower:
        type: number
        description: Lower bound of the prediction interval
      uncertainty_upper:
        type: number
        description: Upper bound of the prediction interval
      cycle_id:
        type: integer
        description: Solar cycle number (e.g., 23, 24)
      source:
        type: string
        enum: [satellite, reconstruction]
        description: Whether this is observed or reconstructed data
    
    required:
      - date
      - tsi_value
      - uncertainty_lower
      - uncertainty_upper
      - cycle_id
      - source

  ReconstructionReport:
    type: object
    description: Output schema for the pre-satellite TSI reconstruction (US2)
    properties:
      metadata:
        $ref: '#/definitions/Metadata'
      summary_statistics:
        type: object
        properties:
          start_date:
            type: string
            format: date
          end_date:
            type: string
            format: date
          total_points:
            type: integer
          mean_tsi:
            type: number
          std_tsi:
            type: number
          min_tsi:
            type: number
          max_tsi:
            type: number
          cycle_count:
            type: integer
        required:
          - start_date
          - end_date
          - total_points
          - mean_tsi
          - std_tsi
          - min_tsi
          - max_tsi
          - cycle_count
      time_series:
        type: array
        items:
          $ref: '#/definitions/TimeSeriesPoint'
        description: The full reconstructed time series
      methodological_notes:
        type: object
        properties:
          model_type:
            type: string
            description: Type of model used (e.g., RandomForest, GaussianProcess)
          fallback_used_count:
            type: integer
            description: Number of points where Cycle-Agnostic fallback was used
          uncertainty_method:
            type: string
            description: Method used to calculate uncertainty bands (e.g., Bootstrap, Quantile)
        required:
          - model_type
          - fallback_used_count
          - uncertainty_method
    
    required:
      - metadata
      - summary_statistics
      - time_series
      - methodological_notes

  ValidationReport:
    type: object
    description: Output schema for model validation (US1 LOCO CV and US3 Comparison)
    properties:
      metadata:
        $ref: '#/definitions/Metadata'
      cv_results:
        type: object
        description: Leave-One-Cycle-Out results (US1)
        properties:
          per_cycle_metrics:
            type: array
            items:
              type: object
              properties:
                cycle_id:
                  type: integer
                held_out_start:
                  type: string
                  format: date
                held_out_end:
                  type: string
                  format: date
                rmse:
                  type: number
                r_squared:
                  type: number
                n_samples:
                  type: integer
              required:
                - cycle_id
                - rmse
                - r_squared
                - n_samples
          aggregate_metrics:
            type: object
            properties:
              mean_rmse:
                type: number
              std_rmse:
                type: number
              mean_r_squared:
                type: number
              std_r_squared:
                type: number
            required:
              - mean_rmse
              - mean_r_squared
          model_selection_rationale:
            type: string
        required:
          - per_cycle_metrics
          - aggregate_metrics
          - model_selection_rationale
      comparison_results:
        type: object
        description: Baseline comparison results (US3)
        properties:
          baseline_source:
            type: string
            description: Name of the baseline dataset (e.g., 2007 reconstruction)
          overlap_period:
            type: object
            properties:
              start:
                type: string
                format: date
              end:
                type: string
                format: date
            required:
              - start
              - end
          error_reduction_percentage:
            type: number
            description: Percentage improvement over baseline
          baseline_rmse:
            type: number
          new_model_rmse:
            type: number
          statistical_significance:
            type: object
            properties:
              p_value:
                type: number
              corrected_p_value:
                type: number
              method:
                type: string
                description: Correction method used (e.g., Bonferroni, FDR)
            required:
              - p_value
              - corrected_p_value
              - method
        required:
          - baseline_source
          - overlap_period
          - error_reduction_percentage
          - baseline_rmse
          - new_model_rmse
          - statistical_significance
    
    required:
      - metadata
      - cv_results
      - comparison_results

  SensitivityReport:
    type: object
    description: Output schema for sensitivity analysis (Phase 3.5)
    properties:
      metadata:
        $ref: '#/definitions/Metadata'
      sweep_parameters:
        type: object
        properties:
          threshold_values:
            type: array
            items:
              type: number
            description: List of inconsistency tolerance thresholds tested
          baseline_model:
            type: string
            description: Reference model used for stability comparison
        required:
          - threshold_values
          - baseline_model
      results:
        type: array
        items:
          type: object
          properties:
            threshold:
              type: number
            stability_metric:
              type: number
              description: Standard deviation of RMSE across the sweep
            max_deviation:
              type: number
            min_deviation:
              type: number
          required:
            - threshold
            - stability_metric
      conclusion:
        type: string
        description: Summary of reconstruction stability findings
    
    required:
      - metadata
      - sweep_parameters
      - results
      - conclusion

# Root schema for the Validation Report (most common output)
type: object
oneOf:
  - $ref: '#/definitions/ReconstructionReport'
  - $ref: '#/definitions/ValidationReport'
  - $ref: '#/definitions/SensitivityReport'
required:
  - metadata