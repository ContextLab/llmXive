%YAML 1.2
---
$schema: "http://json-schema.org/draft-07/schema#"
title: "Solar Irradiance Reconstruction Output Schemas"
description: |
  Defines the JSON schemas for reconstruction outputs and validation reports
  generated by the solar irradiance reconstruction pipeline.
  Complements the dataset schemas defined in contracts/dataset_schema.schema.yaml.

definitions:
  ReconstructionRecord:
    type: object
    description: "A single record in the reconstructed TSI time series."
    required:
      - date
      - tsi_reconstructed
      - tsi_uncertainty_lower
      - tsi_uncertainty_upper
      - gsn_input
      - cycle_id
      - model_type
      - is_fallback
    properties:
      date:
        type: string
        format: date
        description: "ISO 8601 date of the observation (YYYY-MM-DD)."
      tsi_reconstructed:
        type: number
        description: "Reconstructed Total Solar Irradiance in W/m²."
        minimum: 1350.0
        maximum: 1370.0
      tsi_uncertainty_lower:
        type: number
        description: "Lower bound of the prediction interval (W/m²)."
      tsi_uncertainty_upper:
        type: number
        description: "Upper bound of the prediction interval (W/m²)."
      gsn_input:
        type: number
        description: "Group Sunspot Number input used for reconstruction."
        minimum: 0.0
      cycle_id:
        type: integer
        description: "Official SILSO solar cycle identifier (e.g., 1-25)."
        minimum: 1
      model_type:
        type: string
        enum:
          - "RandomForest"
          - "GaussianProcess"
          - "CycleAgnosticFallback"
        description: "Type of model used for this prediction."
      is_fallback:
        type: boolean
        description: "True if the Cycle-Agnostic fallback model was used."

  ValidationMetric:
    type: object
    description: "Performance metrics for a specific validation fold or cycle."
    required:
      - cycle_id
      - rmse
      - r_squared
      - n_samples
    properties:
      cycle_id:
        type: integer
        description: "The cycle ID held out for validation."
      rmse:
        type: number
        description: "Root Mean Squared Error (W/m²)."
        minimum: 0.0
      r_squared:
        type: number
        description: "Coefficient of determination (R²)."
      n_samples:
        type: integer
        description: "Number of samples in the held-out cycle."
        minimum: 1

  ValidationReport:
    type: object
    description: "Report containing cross-validation results and model selection rationale."
    required:
      - report_version
      - generation_timestamp
      - model_type
      - hyperparameters
      - cv_results
      - overall_rmse
      - overall_r_squared
      - model_selection_rationale
      - associational_framing
    properties:
      report_version:
        type: string
        description: "Version of the report schema."
        const: "1.0.0"
      generation_timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of report generation."
      model_type:
        type: string
        enum:
          - "RandomForest"
          - "GaussianProcess"
          - "Ensemble"
        description: "Primary model type evaluated."
      hyperparameters:
        type: object
        description: "Hyperparameters used for the model."
        additionalProperties: true
      cv_results:
        type: array
        description: "Per-cycle validation results from LOCO CV."
        items:
          $ref: "#/definitions/ValidationMetric"
      overall_rmse:
        type: number
        description: "Aggregated RMSE across all LOCO folds."
        minimum: 0.0
      overall_r_squared:
        type: number
        description: "Aggregated R² across all LOCO folds."
      model_selection_rationale:
        type: string
        description: "Explanation for why the final model was selected."
      associational_framing:
        type: string
        description: "Explicit statement that findings are associational, not causal."

  SensitivitySweepResult:
    type: object
    description: "Result of a single sensitivity sweep point."
    required:
      - threshold
      - rmse_variance
      - stability_score
    properties:
      threshold:
        type: number
        description: "Inconsistency tolerance threshold used."
      rmse_variance:
        type: number
        description: "Variance of RMSE observed at this threshold."
      stability_score:
        type: number
        description: "Normalized stability metric (0-1, higher is better)."

  SensitivityReport:
    type: object
    description: "Report on model robustness to inconsistency thresholds."
    required:
      - report_version
      - generation_timestamp
      - sweep_values
      - sweep_results
      - stability_summary
      - associational_framing
    properties:
      report_version:
        type: string
        const: "1.0.0"
      generation_timestamp:
        type: string
        format: date-time
      sweep_values:
        type: array
        description: "List of thresholds swept (e.g., [0.01, 0.05, 0.1])."
        items:
          type: number
      sweep_results:
        type: array
        description: "Results for each threshold."
        items:
          $ref: "#/definitions/SensitivitySweepResult"
      stability_summary:
        type: object
        description: "Summary of stability across the sweep."
        properties:
          min_stability:
            type: number
          max_stability:
            type: number
          mean_stability:
            type: number
      associational_framing:
        type: string
        description: "Explicit statement that findings are associational, not causal."

  ComparisonResult:
    type: object
    description: "Result of comparing reconstruction against baseline/CMIP6."
    required:
      - baseline_name
      - rmse
      - error_reduction_pct
      - statistical_significance
    properties:
      baseline_name:
        type: string
        description: "Name of the baseline dataset (e.g., '2007 Baseline', 'CMIP6 v3.2')."
      rmse:
        type: number
        description: "RMSE between reconstruction and baseline."
      error_reduction_pct:
        type: number
        description: "Percentage error reduction compared to baseline."
      statistical_significance:
        type: object
        description: "Results of hypothesis testing with correction."
        properties:
          p_value:
            type: number
          corrected_p_value:
            type: number
          method:
            type: string
            description: "Correction method used (e.g., 'Bonferroni', 'FDR')."

  FinalReport:
    type: object
    description: "The final consolidated report for User Story 3."
    required:
      - report_version
      - generation_timestamp
      - reconstruction_summary
      - validation_summary
      - sensitivity_summary
      - comparison_results
      - variance_analysis
      - associational_framing
      - methodological_constraints
    properties:
      report_version:
        type: string
        const: "1.0.0"
      generation_timestamp:
        type: string
        format: date-time
      reconstruction_summary:
        type: object
        description: "Summary of the generated reconstruction."
        properties:
          start_date:
            type: string
            format: date
          end_date:
            type: string
            format: date
          n_records:
            type: integer
          mean_tsi:
            type: number
      validation_summary:
        type: object
        description: "Summary of LOCO CV results."
        properties:
          best_model:
            type: string
          overall_rmse:
            type: number
          overall_r_squared:
            type: number
      sensitivity_summary:
        type: object
        description: "Summary of sensitivity analysis."
        properties:
          most_stable_threshold:
            type: number
          stability_range:
            type: array
            items:
              type: number
      comparison_results:
        type: array
        description: "List of comparison results against baselines."
        items:
          $ref: "#/definitions/ComparisonResult"
      variance_analysis:
        type: object
        description: "Bootstrap variance analysis results."
        properties:
          maunder_min_variance:
            type: number
          dalton_min_variance:
            type: number
          modern_max_variance:
            type: number
          fdr_corrected_significance:
            type: boolean
      associational_framing:
        type: string
        description: "Explicit statement that findings are associational, not causal."
      methodological_constraints:
        type: array
        description: "List of constraints and limitations applied."
        items:
          type: string

# Root schema for the final report file
$ref: "#/definitions/FinalReport"