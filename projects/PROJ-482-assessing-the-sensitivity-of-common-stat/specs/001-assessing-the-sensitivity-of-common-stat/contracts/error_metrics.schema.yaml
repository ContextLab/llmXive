$schema: "http://json-schema.org/draft-07/schema#"
title: "Aggregated Error Metrics"
description: "Schema for the final aggregated results of the Monte Carlo simulation."
type: "object"
properties:
  sample_size:
    type: "integer"
    description: "Sample size used in the simulation."
  distribution_type:
    type: "string"
    description: "Distribution type used."
  test_type:
    type: "string"
    description: "Statistical test used."
  effect_size:
    type: "number"
    description: "Ground truth effect size."
  error_type:
    type: "string"
    enum:
      - "type_1"
      - "type_2"
    description: "Type of error being measured."
  rate:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Observed error rate."
  ci_lower:
    type: "number"
    description: "Lower bound of the 95% confidence interval."
  ci_upper:
    type: "number"
    description: "Upper bound of the 95% confidence interval."
  replicates:
    type: "integer"
    minimum: 1000
    description: "Total number of replicates performed."
required:
  - sample_size
  - distribution_type
  - test_type
  - effect_size
  - error_type
  - rate
  - ci_lower
  - ci_upper
  - replicates
additionalProperties: false