$schema: "http://json-schema.org/draft-07/schema#"
title: "Simulation Configuration"
description: "Schema for the input configuration of a single simulation scenario."
type: "object"
properties:
  sample_size:
    type: "integer"
    minimum: 10
    maximum: 1000
    description: "Number of samples per group."
  distribution_type:
    type: "string"
    enum:
      - "normal"
      - "uniform"
      - "log-normal"
    description: "Type of distribution to generate."
  test_type:
    type: "string"
    enum:
      - "t-test"
      - "anova"
      - "chi-squared"
    description: "Statistical test to perform."
  effect_size:
    type: "number"
    description: "Ground truth effect size (0.0 for null, 0.5 for alternative)."
  seed:
    type: "integer"
    description: "Random seed for reproducibility."
required:
  - sample_size
  - distribution_type
  - test_type
  - effect_size
  - seed
additionalProperties: false
