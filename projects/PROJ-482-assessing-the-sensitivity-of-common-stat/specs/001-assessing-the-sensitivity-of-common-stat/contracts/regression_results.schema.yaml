$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Results"
description: "Schema for the regression analysis output using Binomial GLM for error rates."
type: "object"
properties:
  predictor:
    type: "string"
    description: "Name of the predictor variable."
  coefficient:
    type: "number"
    description: "Regression coefficient."
  std_error:
    type: "number"
    description: "Standard error of the coefficient."
  p_value:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "P-value for the coefficient."
  pseudo_r_squared:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Cox-Snell or Nagelkerke pseudo R-squared value (for Binomial GLM)."
required:
  - predictor
  - coefficient
  - std_error
  - p_value
  - pseudo_r_squared
additionalProperties: false