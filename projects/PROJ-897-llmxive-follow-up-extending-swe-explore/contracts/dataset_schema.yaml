$schema: http://json-schema.org/draft-07/schema#
title: SWE-Explore Dataset Schema
description: Schema for the raw and curated SWE-Explore benchmark dataset artifacts.
type: object
required:
  - issue_id
  - repo_name
  - base_commit
  - instance_id
  - problem_statement
  - test_patch
  - patch
  - repo_link
  - created_at
  - version
properties:
  issue_id:
    type: string
    description: Unique identifier for the issue instance.
  repo_name:
    type: string
    description: Name of the repository (e.g., 'sphinx-doc/sphinx').
  base_commit:
    type: string
    description: SHA of the base commit.
  instance_id:
    type: string
    description: Alternative or specific instance identifier.
  problem_statement:
    type: string
    description: The text of the issue or problem to solve.
  test_patch:
    type: string
    description: The patch containing the test cases added for this issue.
  patch:
    type: string
    description: The ground truth solution patch.
  repo_link:
    type: string
    description: URL to the repository.
  created_at:
    type: string
    format: date-time
    description: Timestamp of issue creation.
  version:
    type: string
    description: Dataset version string.
  # Derived/Computed fields (optional in raw, present in curated)
  ground_truth_lines:
    type: array
    items:
      type: integer
    description: Line numbers of the ground truth solution (derived).
  initial_coverage:
    type: number
    format: float
    minimum: 0.0
    maximum: 1.0
    description: Initial retrieval coverage score (used for hard instance selection).
  complexity_score:
    type: number
    format: float
    description: Cyclomatic complexity score (diagnostic only).
  is_hard:
    type: boolean
    description: Flag indicating if the instance is in the hard subset.
  metadata:
    type: object
    description: Additional metadata fields.
