%YAML 1.2
---
# SWE-Explore Dataset Schema
# Defines the structure for raw and curated dataset artifacts
$schema: http://json-schema.org/draft-07/schema#
title: SWEExploreDataset
description: Schema for SWE-Explore benchmark dataset artifacts
type: object
required:
  - issue_id
  - repo
  - instance_id
  - problem_statement
  - base_commit
  - patch
  - environment_setup_commit
  - metadata
properties:
  issue_id:
    type: string
    description: Unique identifier for the issue (e.g., "sphinx-doc/sphinx#12345")
  repo:
    type: string
    description: Repository identifier (e.g., "sphinx-doc/sphinx")
  instance_id:
    type: string
    description: Unique instance identifier for this run
  problem_statement:
    type: string
    description: The original issue/problem text
  base_commit:
    type: string
    description: Git commit hash for the base state
  patch:
    type: string
    description: The ground truth patch (solution)
  environment_setup_commit:
    type: string
    description: Commit hash for environment setup
  metadata:
    type: object
    description: Additional metadata fields
    properties:
      initial_coverage:
        type: number
        format: float
        description: Initial retrieval coverage score (0.0 to 1.0)
      complexity_score:
        type: number
        format: float
        description: Cyclomatic complexity score (diagnostic only)
      ground_truth_lines:
        type: array
        items:
          type: integer
        description: List of line numbers changed in the solution
      retrieved_lines:
        type: array
        items:
          type: integer
        description: List of retrieved relevant line numbers
      is_hard:
        type: boolean
        description: Whether this instance is in the hard subset
      synthetic_source:
        type: string
        nullable: true
        description: Original issue_id if this is a synthetic mutation
      mutation_type:
        type: string
        nullable: true
        description: Type of mutation applied (e.g., "variable_rename", "comment_removal")
    additionalProperties: true
additionalProperties: true
