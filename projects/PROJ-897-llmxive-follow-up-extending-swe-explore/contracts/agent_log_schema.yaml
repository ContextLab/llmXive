$schema: http://json-schema.org/draft-07/schema#
title: Agent Execution Log Schema
description: Schema for logs generated by the iterative and baseline agent execution.
type: object
required:
  - issue_id
  - agent_type
  - start_time
  - end_time
  - turns
  - query_history
  - final_coverage
properties:
  issue_id:
    type: string
    description: The issue ID this log corresponds to.
  agent_type:
    type: string
    enum:
      - iterative
      - baseline
    description: Type of agent execution.
  start_time:
    type: string
    format: date-time
    description: Execution start timestamp.
  end_time:
    type: string
    format: date-time
    description: Execution end timestamp.
  turns:
    type: integer
    minimum: 0
    description: Total number of turns executed.
  query_history:
    type: array
    items:
      type: object
      required:
        - turn_number
        - query
        - retrieved_context_ids
        - static_analysis_signal
        - reformulation_reason
      properties:
        turn_number:
          type: integer
        query:
          type: string
        retrieved_context_ids:
          type: array
          items:
            type: string
        static_analysis_signal:
          type: string
          nullable: true
        reformulation_reason:
          type: string
          nullable: true
  static_analysis_signals:
    type: array
    items:
      type: string
    description: List of static analysis signals encountered.
  error_signals:
    type: array
    items:
      type: string
    description: List of error signals encountered.
  final_coverage:
    type: number
    format: float
    minimum: 0.0
    maximum: 1.0
    description: Final coverage score achieved.
  final_ranking_position:
    type: integer
    nullable: true
    description: Position of the first relevant line (censored if null).
  termination_reason:
    type: string
    enum:
      - max_turns_reached
      - loop_detected
      - success
      - error
    description: Reason for loop termination.
  metadata:
    type: object
    description: Additional execution metadata (e.g., model used, memory usage).
