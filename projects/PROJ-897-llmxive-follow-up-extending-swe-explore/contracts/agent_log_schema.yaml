%YAML 1.2
---
# Agent Execution Log Schema
# Defines the structure for agent execution logs (baseline and iterative)
$schema: http://json-schema.org/draft-07/schema#
title: AgentExecutionLog
description: Schema for agent execution logs
type: object
required:
  - issue_id
  - agent_type
  - start_time
  - end_time
  - turns
  - final_coverage
  - final_ranking
properties:
  issue_id:
    type: string
    description: Unique identifier for the issue
  agent_type:
    type: string
    enum:
      - static_baseline
      - iterative
    description: Type of agent execution
  start_time:
    type: string
    format: date-time
    description: ISO 8601 timestamp of execution start
  end_time:
    type: string
    format: date-time
    description: ISO 8601 timestamp of execution end
  turns:
    type: array
    description: List of turn records
    items:
      type: object
      required:
        - turn_number
        - query
        - query_hash
      properties:
        turn_number:
          type: integer
          minimum: 1
        query:
          type: string
          description: The query string used in this turn
        query_hash:
          type: string
          description: SHA256 hash of the query for loop detection
        retrieved_context_ids:
          type: array
          items:
            type: integer
          description: List of retrieved context file/line IDs
        static_analysis_signals:
          type: array
          items:
            type: string
          description: List of static analysis error signals
        reformulation_reason:
          type: string
          nullable: true
          description: Reason for query reformulation
        termination_reason:
          type: string
          nullable: true
          enum:
            - max_turns_reached
            - loop_detected
            - success
            - error
          description: Reason for turn termination
  final_coverage:
    type: number
    format: float
    minimum: 0.0
    maximum: 1.0
    description: Final coverage score achieved
  final_ranking:
    type: integer
    description: Position of first relevant line (N+1 if censored)
  total_turns_used:
    type: integer
    minimum: 0
    description: Total number of turns executed
  loop_detected:
    type: boolean
    description: Whether a query loop was detected
  error_messages:
    type: array
    items:
      type: string
    description: List of error messages encountered
  metadata:
    type: object
    description: Additional execution metadata
    properties:
      model_id:
        type: string
      quantization_bits:
        type: integer
      memory_peak_mb:
        type: number
    additionalProperties: true
additionalProperties: true
