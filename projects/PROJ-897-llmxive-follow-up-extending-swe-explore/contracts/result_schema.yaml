$schema: http://json-schema.org/draft-07/schema#
title: Analysis Result Schema
description: Schema for the final aggregated metrics and statistical test results.
type: object
required:
  - analysis_timestamp
  - total_issues
  - coverage_metrics
  - ranking_metrics
  - statistical_tests
properties:
  analysis_timestamp:
    type: string
    format: date-time
    description: Timestamp of the analysis run.
  total_issues:
    type: integer
    description: Total number of issues analyzed.
  coverage_metrics:
    type: object
    required:
      - mean_baseline
      - mean_iterative
      - difference
      - wilcoxon_p_value
      - wilcoxon_effect_size
      - bonferroni_adjusted_p_value
    properties:
      mean_baseline:
        type: number
      mean_iterative:
        type: number
      difference:
        type: number
      wilcoxon_p_value:
        type: number
      wilcoxon_effect_size:
        type: number
      bonferroni_adjusted_p_value:
        type: number
      significant_at_005:
        type: boolean
  ranking_metrics:
    type: object
    required:
      - mean_baseline
      - mean_iterative
      - difference
      - test_type
      - p_value
      - effect_size
      - bonferroni_adjusted_p_value
    properties:
      mean_baseline:
        type: number
      mean_iterative:
        type: number
      difference:
        type: number
      test_type:
        type: string
        enum:
          - wilcoxon
          - permutation
        description: Type of statistical test used (due to ties/censoring).
      p_value:
        type: number
      effect_size:
        type: number
      bonferroni_adjusted_p_value:
        type: number
      significant_at_005:
        type: boolean
  statistical_tests:
    type: object
    required:
      - routing_decision
      - tie_proportion
      - censoring_proportion
    properties:
      routing_decision:
        type: string
        enum:
          - WILCOXON
          - PERMUTATION
        description: Which test path was taken.
      tie_proportion:
        type: number
      censoring_proportion:
        type: number
      permutation_details:
        type: object
        nullable: true
        description: Details if permutation test was used.
  sweep_results:
    type: array
    items:
      type: object
      properties:
        turn_limit:
          type: integer
        mean_coverage:
          type: number
        stability_flag:
          type: boolean
    description: Results from the turn-limit sweep.
  validation_status:
    type: object
    properties:
      report_language_check:
        type: string
        enum:
          - PASSED
          - FAILED
        description: Result of causal language validation.
  metadata:
    type: object
    description: Hashes and configuration summary.