%YAML 1.2
---
# Analysis Results Schema
# Defines the structure for final analysis results and metrics
$schema: http://json-schema.org/draft-07/schema#
title: AnalysisResults
description: Schema for final analysis results
type: object
required:
  - experiment_id
  - timestamp
  - coverage_comparison
  - ranking_comparison
  - statistical_test
  - correction_method
properties:
  experiment_id:
    type: string
    description: Unique identifier for this experiment run
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of result generation
  sample_size:
    type: integer
    minimum: 1
    description: Number of issues in the analysis
  coverage_comparison:
    type: object
    description: Coverage metric comparison results
    required:
      - baseline_mean
      - iterative_mean
      - mean_difference
      - p_value
      - effect_size
      - significant
    properties:
      baseline_mean:
        type: number
        format: float
      iterative_mean:
        type: number
        format: float
      mean_difference:
        type: number
        format: float
      p_value:
        type: number
        format: float
        minimum: 0.0
        maximum: 1.0
      p_value_adjusted:
        type: number
        format: float
        description: Bonferroni-adjusted p-value
      effect_size:
        type: number
        format: float
        description: Cohen's d or similar effect size
      significant:
        type: boolean
        description: Whether result is significant at alpha=0.05
  ranking_comparison:
    type: object
    description: Ranking metric comparison results
    required:
      - baseline_mean
      - iterative_mean
      - mean_difference
      - p_value
      - effect_size
      - significant
    properties:
      baseline_mean:
        type: number
        format: float
      iterative_mean:
        type: number
        format: float
      mean_difference:
        type: number
        format: float
      p_value:
        type: number
        format: float
        minimum: 0.0
        maximum: 1.0
      p_value_adjusted:
        type: number
        format: float
        description: Bonferroni-adjusted p-value
      effect_size:
        type: number
        format: float
      significant:
        type: boolean
  statistical_test:
    type: object
    description: Statistical test details
    required:
      - method
      - routing_reason
      - ties_count
      - censored_count
    properties:
      method:
        type: string
        enum:
          - wilcoxon_signed_rank
          - exact_permutation
        description: Statistical test method used
      routing_reason:
        type: string
        description: Reason for choosing this method
      ties_count:
        type: integer
        minimum: 0
      censored_count:
        type: integer
        minimum: 0
      continuity_correction:
        type: boolean
        description: Whether continuity correction was applied
  correction_method:
    type: string
    enum:
      - bonferroni
      - none
    description: Multiple comparison correction method
  correction_factor:
    type: number
    format: float
    description: Correction factor (e.g., 2 for Bonferroni on 2 tests)
  conclusion:
    type: string
    description: Associational conclusion (non-causal language)
  artifacts:
    type: object
    description: Links to generated artifacts
    properties:
      raw_logs_baseline:
        type: string
      raw_logs_iterative:
        type: string
      metrics_file:
        type: string
      plots_directory:
        type: string
      report_draft:
        type: string
      hash_manifest:
        type: string
additionalProperties: true
