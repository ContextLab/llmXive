[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-swe-followup"
version = "0.1.0"
description = "Extending SWE-Explore: Benchmarking How Coding Agents Explore Repositories"
requires-python = ">=3.9"
dependencies = [
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "libcst>=1.0.0",
    "pytest>=7.0.0",
    "psutil>=5.9.0",
    "transformers>=4.35.0",
    "bitsandbytes>=0.41.0",
    "scipy>=1.11.0"
]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N", "B", "C4", "SIM"]
ignore = ["E501", "F403"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
