$schema: "http://json-schema.org/draft-07/schema#"
title: Agent Log Schema
description: Schema for logs generated by the iterative and baseline agents.
type: object
required:
  - issue_id
  - agent_type
  - turn_count
  - queries
  - final_result
  - termination_reason
properties:
  issue_id:
    type: string
    description: The issue ID being worked on.
  agent_type:
    type: string
    enum:
      - baseline
      - iterative
    description: Type of agent that generated the log.
  turn_count:
    type: integer
    description: Number of turns executed.
  queries:
    type: array
    description: List of queries and their results.
    items:
      type: object
      required:
        - turn_number
        - query_text
        - retrieved_context
        - static_analysis_signal
        - reformulation_signal
      properties:
        turn_number:
          type: integer
        query_text:
          type: string
        retrieved_context:
          type: array
          items:
            type: object
            properties:
              file_path:
                type: string
              content_snippet:
                type: string
        static_analysis_signal:
          type: string
          description: Result of static analysis (e.g., error message or 'neutral_anomaly').
        reformulation_signal:
          type: string
          description: Signal used for query reformulation.
  final_result:
    type: object
    description: The final outcome of the agent's attempt.
    properties:
      success:
        type: boolean
      solution_patch:
        type: string
      relevant_lines_found:
        type: array
        items:
          type: integer
  termination_reason:
    type: string
    enum:
      - success
      - max_turns_reached
      - loop_detected
      - error
    description: Reason for agent termination.
  execution_time_seconds:
    type: number
    format: float
    description: Total execution time in seconds.
  memory_peak_mb:
    type: number
    format: float
    description: Peak memory usage in MB.
additionalProperties: true
