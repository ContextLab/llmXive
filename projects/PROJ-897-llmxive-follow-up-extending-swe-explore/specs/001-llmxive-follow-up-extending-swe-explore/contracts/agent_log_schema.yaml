$schema: "http://json-schema.org/draft-07/schema#"
title: Agent Execution Log Schema
description: Schema for logs generated by the iterative agent or baseline runs.
type: object
required:
  - instance_id
  - agent_type
  - turns
  - final_status
properties:
  instance_id:
    type: string
    description: The instance ID this log corresponds to.
  agent_type:
    type: string
    enum:
      - "iterative"
      - "baseline_onshot"
      - "baseline_multi"
    description: Type of agent execution.
  start_time:
    type: string
    format: date-time
    description: ISO 8601 timestamp of execution start.
  end_time:
    type: string
    format: date-time
    description: ISO 8601 timestamp of execution end.
  turns:
    type: array
    description: Sequence of turns taken by the agent.
    items:
      type: object
      required:
        - turn_number
        - query
        - retrieved_files
        - static_analysis_signal
        - reformulation_signal
      properties:
        turn_number:
          type: integer
        query:
          type: string
        retrieved_files:
          type: array
          items:
            type: string
        static_analysis_signal:
          type: string
          description: Output from static analysis (e.g., errors, neutral_anomaly).
        reformulation_signal:
          type: string
          description: Signal used to reformulate the next query.
        patch_attempt:
          type: string
          description: The patch generated in this turn (if any).
  final_status:
    type: string
    enum:
      - "success"
      - "failure"
      - "timeout"
      - "loop_detected"
    description: The final outcome of the agent run.
  termination_reason:
    type: string
    description: Detailed reason for termination (e.g., "max turns reached", "loop detected").
  metrics:
    type: object
    description: Metrics calculated at the end of the run.
    properties:
      coverage_score:
        type: number
        format: float
      ranking_score:
        type: number
        format: float
  missing_data:
    type: boolean
    default: false
    description: Flag indicating if relevant ground truth data was missing (censored data).
additionalProperties: true
