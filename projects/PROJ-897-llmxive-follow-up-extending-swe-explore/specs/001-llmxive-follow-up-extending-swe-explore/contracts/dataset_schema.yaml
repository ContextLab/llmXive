$schema: "http://json-schema.org/draft-07/schema#"
title: SWE-Explore Dataset Schema
description: Schema for the raw and curated SWE-Explore benchmark datasets.
type: object
required:
  - issue_id
  - repo_name
  - repo_path
  - base_commit
  - instance_id
  - question
  - solution
  - patches
  - ground_truth_lines
properties:
  issue_id:
    type: string
    description: Unique identifier for the issue.
  repo_name:
    type: string
    description: Name of the repository.
  repo_path:
    type: string
    description: Path to the repository.
  base_commit:
    type: string
    description: The base commit hash.
  instance_id:
    type: string
    description: Instance identifier.
  question:
    type: string
    description: The problem statement or question.
  solution:
    type: string
    description: The solution code or patch.
  patches:
    type: array
    description: List of patches applied.
    items:
      type: string
  ground_truth_lines:
    type: array
    description: List of line numbers that are part of the ground truth solution.
    items:
      type: integer
  coverage_score:
    type: number
    format: float
    description: The coverage score for the instance (optional, added in curated phase).
  complexity_score:
    type: number
    format: float
    description: Cyclomatic complexity score (optional, added in curated phase).
  metadata:
    type: object
    description: Additional metadata for the instance.
    additionalProperties: true
additionalProperties: true
