name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # 4 hours hard limit enforced by CI

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r code/requirements.txt

    - name: Run Data & Analysis Pipeline
      id: pipeline_run
      run: |
        echo "Starting pipeline execution..."
        # The main.py script is expected to raise a RuntimeError if
        # the total runtime exceeds 4 hours (as per T049).
        # We must ensure this error causes the CI job to fail.
        cd code
        python main.py
        echo "Pipeline completed successfully within time limits."

    - name: Upload Results Artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: pipeline-results
        path: |
          data/
          results/
          logs/
        retention-days: 7

    - name: Validate Output Schemas
      run: |
        python -c "from analysis.validate_results_schema import main; main()"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r code/requirements.txt
        pip install pytest

    - name: Run Unit Tests
      run: |
        pytest tests/unit/ -v

    - name: Run Contract Tests
      run: |
        pytest tests/contract/ -v