$schema: "http://json-schema.org/draft-07/schema#"
title: "PartitionRecord"
description: "Schema for a single partition data point"
type: "object"
properties:
  n:
    type: "integer"
    minimum: 1
    description: "The integer being partitioned"
  p_P_n:
    type: "integer"
    minimum: 0
    description: "Exact count of partitions into distinct primes (arbitrary precision)"
  Q_as_n:
    type: "number"
    exclusiveMinimum: 0
    description: "Asymptotic prediction from Meinardus' theorem"
  R_n:
    type: ["number", "null"]
    description: "Log-residual: log(p_P_n) - log(Q_as_n); null if invalid"
required:
  - n
  - p_P_n
  - Q_as_n
  - R_n
additionalProperties: false
