$schema: "http://json-schema.org/draft-07/schema#"
title: "RegressionModel"
description: "Schema for regression model results"
type: "object"
properties:
  coefficients:
    type: "object"
    additionalProperties:
      type: "number"
    description: "Model coefficients"
  intercept:
    type: "number"
    description: "Model intercept"
  r_squared:
    type: "number"
    minimum: 0
    maximum: 1
    description: "Coefficient of determination"
  mse:
    type: "number"
    minimum: 0
    description: "Mean squared error (training)"
  cv_mse:
    type: "number"
    minimum: 0
    description: "Mean squared error (cross-validation)"
  p_values:
    type: "object"
    additionalProperties:
      type: "number"
      minimum: 0
      maximum: 1
    description: "P-values for coefficients (corrected for autocorrelation)"
required:
  - coefficients
  - intercept
  - r_squared
  - mse
  - cv_mse
  - p_values
additionalProperties: false
