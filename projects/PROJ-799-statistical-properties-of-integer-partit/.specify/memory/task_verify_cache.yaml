  h: aeb2bd2089dd4982cd1eedd6162c5ecd2f2c9b5870149aa5405b35a9dbc49700
  r: "The `code/generate_primes.py` script implements a sieve via `utils.prime_sieve`,\
    \ writes `data/raw/primes_up_to_50000.csv` with a single \u201Cprime\u201D header,\
    \ and prints the SHA\u2011256 checksum. The CSV file exists, contains 5\u202F\
    133 prime entries (matching \u03C0(50\u202F000)), and its checksum (`0ded44fa6a1ab6e4a3760b671b9459436e2f4bde2e895fc02225ca75766c31b6`)\
    \ is output by the script, as confirmed by the execution logs and passing pytest."
