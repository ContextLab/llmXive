[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statistical-properties-of-integer-partitions"
version = "0.1.0"
description = "Statistical analysis of integer partitions into distinct prime summands"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "pygam>=0.9.0",
    "flake8>=6.1.0",
    "black>=23.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = 'code/.*\.pyi?$'
extend-exclude = '''
(
  ^/data/
  | ^/tests/data/
  | ^/docs/
)
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "data",
    "tests/data",
    "docs",
    "build",
    "dist",
    "*.egg-info",
]
per-file-ignores = [
    # Allow unused imports in __init__.py if present
    "*/__init__.py:F401",
    # Allow asserts in tests
    "tests/*:S101",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
