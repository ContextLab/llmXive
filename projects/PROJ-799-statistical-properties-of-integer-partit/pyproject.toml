[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-799-statistical-properties"
version = "0.1.0"
description = "Statistical Properties of Integer Partitions Into Distinct Prime Summands"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "pandas",
    "pygam"
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "pytest>=7.0.0"
]

[tool.black]
# Black formatting configuration scoped to the project's code directory
line-length = 100
target-version = ['py311']
include = 'projects/PROJ-799-statistical-properties-of-integer-partit/code/.*\.py$'
# Exclude data and state directories from formatting
extend-exclude = '''
/(
    data
    | state
    | \.git
    | \.eggs
    | \.tox
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["data", "state", ".git", ".eggs", "build", "dist"]
known_first_party = ["utils", "setup_structure"]
