[tox]
envlist = py311
isolated_build = True

[testenv]
deps =
    pytest
    black
    flake8
commands =
    # Run linter on the specific code directory
    flake8 projects/PROJ-799-statistical-properties-of-integer-partit/code/
    # Run formatter check on the specific code directory
    black --check projects/PROJ-799-statistical-properties-of-integer-partit/code/
    # Run tests
    pytest tests/

[flake8]
# Override for tox run if needed, inherits from .flake8
max-line-length = 100
exclude = .git,__pycache__,data,state
