name: model_output
description: Schema for model output metrics including coefficients, p-values, and fit statistics.
columns:
  - name: model_type
    type: string
    nullable: false
    description: Type of model (e.g., 'Gaussian GLM', 'Ridge Regression')
  - name: coefficients
    type: object
    nullable: false
    description: Dictionary mapping feature names to their coefficient values
  - name: p_values
    type: object
    nullable: false
    description: Dictionary mapping feature names to their p-values (after FDR correction if applicable)
  - name: r_squared
    type: number
    nullable: false
    description: R-squared value of the model fit
  - name: aic
    type: number
    nullable: false
    description: Akaike Information Criterion value
  - name: cross_validation_scores
    type: array
    nullable: false
    description: List of scores from cross-validation folds
