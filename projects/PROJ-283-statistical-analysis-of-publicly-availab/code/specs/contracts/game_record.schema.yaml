description: "Schema for processed chess game records"
columns:
  - name: game_id
    type: string
    required: true
  - name: white_rating
    type: number
    required: true
  - name: black_rating
    type: number
    required: true
  - name: eco_code
    type: string
    required: true
  - name: avg_move_time_white
    type: number
    required: true
  - name: avg_move_time_black
    type: number
    required: true
  - name: material_imbalance_move10
    type: number
    required: true
  - name: material_imbalance_move5
    type: number
    required: true
  - name: outcome
    type: number
    required: true
  - name: elo_expected_prob
    type: number
    required: true
  - name: outcome_deviation
    type: number
    required: true
