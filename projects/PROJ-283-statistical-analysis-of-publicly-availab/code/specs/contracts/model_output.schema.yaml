description: "Schema for model output metrics"
type: object
properties:
  models:
    type: array
    items:
      type: object
      properties:
        model_type:
          type: string
        coefficients:
          type: object
          additionalProperties:
            type: number
        p_values:
          type: object
          additionalProperties:
            type: number
        r_squared:
          type: number
        aic:
          type: number
        cross_validation_scores:
          type: array
          items:
            type: number
          minItems: 1
      required:
        - model_type
        - coefficients
        - p_values
        - r_squared
        - aic
        - cross_validation_scores
  significant_predictors:
    type: array
    items:
      type: string
  schema_version:
    type: string
required:
  - models
  - significant_predictors
  - schema_version