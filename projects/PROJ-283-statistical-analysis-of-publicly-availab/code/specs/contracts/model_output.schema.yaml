schema_name: model_output
version: "1.0"
description: "Schema for consolidated model metrics output"
columns:
  - name: model_type
    type: string
    required: true
    description: "Type of model (Beta, Gaussian GLM, Ridge)"
  - name: coefficients
    type: object
    required: true
    description: "Dictionary of feature names to coefficient values"
  - name: p_values
    type: object
    required: true
    description: "Dictionary of feature names to p-values"
  - name: r_squared
    type: float
    required: true
    description: "R-squared score of the model"
  - name: aic
    type: float
    required: true
    description: "Akaike Information Criterion"
  - name: cross_validation_scores
    type: array
    required: true
    description: "List of R-squared scores from k-fold cross-validation"
  - name: significant_predictors
    type: array
    required: true
    description: "List of predictor names with corrected p-value < 0.01"
