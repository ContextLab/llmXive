description: Schema for model output metrics
type: object
required:
  - model_type
  - coefficients
  - p_values
  - r_squared
  - aic
  - cross_validation_scores
properties:
  model_type:
    type: string
  coefficients:
    type: object
  p_values:
    type: object
  r_squared:
    type: number
  aic:
    type: number
  cross_validation_scores:
    type: array
    items:
      type: number
