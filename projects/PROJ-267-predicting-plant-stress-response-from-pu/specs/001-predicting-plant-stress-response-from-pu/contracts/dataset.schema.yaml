$schema: "http://json-schema.org/draft-07/schema#"
title: "Unified Dataset Schema"
description: "Schema for the processed unified matrix containing protein features and an aggregated gene expression target representing overall expression patterns."
type: "object"
properties:
  sample_id:
    type: "string"
    description: "Unique identifier for the sample."
  stress:
    type: "string"
    enum:
      - "Drought"
      - "Salinity"
      - "Heat"
    description: "Abiotic stress condition applied."
  species:
    type: "string"
    enum:
      - "Arabidopsis"
      - "Rice"
      - "Wheat"
    description: "Plant species."
  target_gene_expression:
    type: "number"
    description: "Aggregated expression score (first principal component) representing gene‑expression patterns."
additionalProperties:
  type: "number"
  description: "Dynamic protein feature columns matching the pattern ^protein_.*$"
patternProperties:
  "^protein_.*$":
    type: "number"
    description: "Normalized protein abundance for a specific protein."
required:
  - "sample_id"
  - "stress"
  - "species"
  - "target_gene_expression"
additionalProperties: false
