[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-plant-stress"
version = "0.1.0"
description = "Predicting Plant Stress Response from Publicly Available Proteomic Data"
requires-python = ">=3.8"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.flake8]
max-line-length = 88
extend-ignore = 'E203, W503'
exclude = ['venv', '.git', '__pycache__', 'data', 'results', 'logs']
per-file-ignores = {}