$schema: "http://json-schema.org/draft-07/schema#"
title: "Trial Log Schema"
description: "Schema for validation of trial execution logs (success/latency). Single Source of Truth."
type: "object"
properties:
  trial_id:
    type: "string"
    description: "Unique identifier for the trial."
  topology_id:
    type: "string"
    description: "Identifier for the novel topology used in the trial."
  approach:
    type: "string"
    enum:
      - "symbolic"
      - "baseline"
    description: "The method used for the trial."
  success:
    type: "boolean"
    description: "Whether the manipulation task was completed successfully."
  latency_ms:
    type: "number"
    description: "Inference latency in milliseconds per step."
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of the trial execution."
  error_type:
    type:
      - "string"
      - "null"
    description: "Type of error if the trial failed (e.g., 'infeasible', 'timeout', 'physics_crash')."
required:
  - trial_id
  - topology_id
  - approach
  - success
  - latency_ms
  - timestamp
additionalProperties: false