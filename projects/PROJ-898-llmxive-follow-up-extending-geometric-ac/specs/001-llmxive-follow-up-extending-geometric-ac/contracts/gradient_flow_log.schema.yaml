$schema: "http://json-schema.org/draft-07/schema#"
title: "Gradient Flow Log Schema"
type: "object"
properties:
  verification_run_id:
    type: "string"
  timestamp:
    type: "string"
    format: "date-time"
  results:
    type: "array"
    items:
      type: "object"
      properties:
        topology_id:
          type: "string"
        gradient_norm:
          type: "number"
          description: "Norm of the gradient from constraint loss to solver params"
        is_differentiable:
          type: "boolean"
          description: "True if gradient norm > 0 and finite"
        error_message:
          type: "string"
          nullable: true
      required:
        - topology_id
        - gradient_norm
        - is_differentiable
required:
  - verification_run_id
  - results
additionalProperties: false