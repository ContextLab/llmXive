$schema: "http://json-schema.org/draft-07/schema#"
title: "Gradient Flow Log Schema"
description: "Schema for the numerical gradient verification log (Phase 1.6)."
type: "object"
properties:
  verification_run_id:
    type: "string"
  timestamp:
    type: "string"
    format: "date-time"
  method:
    type: "string"
    enum:
      - "numerical_finite_difference"
      - "diff-taichi"
    description: "The method used for verification."
  results:
    type: "array"
    items:
      type: "object"
      properties:
        topology_id:
          type: "string"
        solver_param_perturbation:
          type: "number"
          description: "The epsilon value used for perturbation."
        gradient_norm:
          type: "number"
          description: "Norm of the gradient from constraint loss to solver params."
        is_differentiable:
          type: "boolean"
          description: "True if gradient norm > 0 and finite."
        decoder_frozen:
          type: "boolean"
          const: true
          description: "Confirms decoder was frozen during check."
        error_message:
          type: "string"
          nullable: true
      required:
        - topology_id
        - solver_param_perturbation
        - gradient_norm
        - is_differentiable
        - decoder_frozen
required:
  - verification_run_id
  - method
  - results
additionalProperties: false