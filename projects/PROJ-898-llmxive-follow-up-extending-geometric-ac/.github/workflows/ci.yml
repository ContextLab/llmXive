name: CI - Geometric Action Model Symbolic Planner

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# FR-004: Multi-core x86_64 runner, no GPU/CUDA, with fixed timeout limit
# to constrain experimental trial duration.
jobs:
  run-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours total limit per SC-005

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Generation (US1)
        # T009-gen-chains & T009-gen-deformable logic
        run: |
          python code/data_generation.py --mode generate_chains
          python code/data_generation.py --mode generate_deformable
        timeout-minutes: 120 # 2 hours max for generation phase

      - name: Verify Zero Overlap (US1)
        # T009-verify-overlap logic
        run: |
          python code/metadata_checksum.py --verify-overlap
        timeout-minutes: 30

      - name: Run Inference Pipeline (US2)
        # T020: Encode -> Solve -> Decode -> Simulate
        run: |
          python code/inference_pipeline.py
        timeout-minutes: 240 # 4 hours max for inference phase
        env:
          # Ensure CPU-only execution as per FR-004
          CUDA_VISIBLE_DEVICES: ""
          TORCH_DEVICE: "cpu"

      - name: Run Statistical Analysis (US3)
        # T023, T024a: Compare Symbolic vs Baseline
        run: |
          python code/analysis.py
        timeout-minutes: 30

      - name: Upload Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: |
            data/results/
            data/generated/
            data/raw/
          retention-days: 7