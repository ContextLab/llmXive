name: CI - Multi-core x86_64 CPU Only

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# FR-004: Multi-core x86_64 runner, no GPU/CUDA
# Using ubuntu-latest (x86_64) which is CPU-only in standard GH Actions
jobs:
  test:
    runs-on: ubuntu-latest

    # Fixed timeout limit to constrain experimental trial duration (e.g., 6 hours max for full suite)
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify CPU-only environment
        run: |
          python -c "import torch; assert not torch.cuda.is_available(), 'CUDA must not be available in this CI environment'; print('CPU-only environment verified')"

      - name: Run Linting (Ruff)
        run: |
          ruff check code/ tests/

      - name: Run Formatting Check (Black)
        run: |
          black --check code/ tests/

      - name: Run Unit Tests
        run: |
          pytest tests/ -v --tb=short

      - name: Run Integration Tests (Optional)
        if: always()
        run: |
          pytest tests/integration/ -v --tb=short || echo "Integration tests skipped or failed"

      - name: Verify Data Structure
        run: |
          test -d data/raw && test -d data/generated && test -d data/results
          test -f data/raw/.gitkeep && test -f data/generated/.gitkeep && test -f data/results/.gitkeep

      - name: Validate Configuration
        run: |
          python code/config.py --validate

# Note: This workflow enforces the 6-hour limit (360 minutes) for the entire job
# to ensure the experimental trial does not exceed the standard CI limit as per FR-004.