name: CI - Experimental Trial

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# FR-004: Multi-core x86_64 runner, no GPU/CUDA
# Using standard ubuntu-latest which is x86_64 and CPU-only by default
jobs:
  run-trial:
    runs-on: ubuntu-latest
    
    # Fixed timeout limit to constrain the duration of the experimental trial
    # Matches SC-005 assumption of < 6 hours total, setting a safe CI limit
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt

      - name: Verify Environment (No GPU)
        run: |
          python -c "import torch; assert not torch.cuda.is_available(), 'GPU detected but not expected in CI'"
          python -c "import sys; print(f'Platform: {sys.platform}'); import platform; print(f'Architecture: {platform.machine()}')"

      - name: Run Experimental Trial
        # Executes the main inference pipeline which handles the trial logic
        # The timeout-minutes above acts as the hard limit for this step
        run: |
          python code/inference_pipeline.py --config code/config.yaml

      - name: Validate Results
        run: |
          python code/analysis.py --input data/results/symbolic_results.csv data/results/baseline_results.csv --output data/results/analysis_report.md

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-results
          path: |
            data/results/*.csv
            data/results/*.json
            data/results/*.md
            data/results/*.log
            data/generated/*.json
            data/raw/*.pt
            data/raw/*.json
            code/config.yaml