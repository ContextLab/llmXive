# Pre-commit configuration for llmXive project
# Enforces linting and formatting on every commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=10000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter (replaces black)
      - id: ruff-format

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: Sort imports with isort
        args: [--profile=black]
        # Note: Ruff now handles isort, but kept for compatibility if needed

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML
          - types-requests
          - numpy
        args: [--ignore-missing-imports, --no-strict-optional]
        files: ^code/

  - repo: local
    hooks:
      - id: check-requirements
        name: Check requirements.txt validity
        entry: python -c "import pkg_resources; pkg_resources.parse_requirements(open('requirements.txt').read())"
        language: python
        pass_filenames: false
        always_run: true
        additional_dependencies: []