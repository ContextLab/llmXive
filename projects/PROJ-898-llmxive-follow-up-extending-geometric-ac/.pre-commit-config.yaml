# Pre-commit configuration for llmXive project
# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=10240'] # 10MB limit
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter (replaces black)
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-requirements
        name: Check requirements.txt
        entry: python -c "import tomllib; open('requirements.txt')"
        language: system
        pass_filenames: false
        always_run: true
        # Note: Actual requirements check happens in CI or setup scripts
        # This is a placeholder to ensure the file exists
        args: []