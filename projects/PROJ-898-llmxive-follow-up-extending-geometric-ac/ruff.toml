# Ruff configuration for the llmXive GAM follow-up project.
# Schema follows ruff >= 0.2 (namespaced [lint] / [format] tables).

# Same as Black line length.
line-length = 88

# Files and directories to skip entirely.
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "data",
    "venv",
    ".venv",
    ".eggs",
    "*.egg-info",
]

# Allow unused variables matching the dummy pattern (e.g., `_`, `_x`).
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint]
# pycodestyle (E/W), Pyflakes (F), isort (I), pep8-naming (N),
# pyupgrade (UP), flake8-bugbear (B), comprehensions (C4), simplify (SIM).
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# Long lines are handled by the formatter, not the linter.
ignore = ["E501"]

# Allow autofix for all enabled rules.
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
# Allow re-exports in __init__.py files.
"__init__.py" = ["F401"]
# Relax some rules in tests.
"tests/*" = ["S101", "ARG001"]

[lint.isort]
known-first-party = ["code"]
force-sort-within-sections = false
combine-as-imports = true

[format]
# Black-compatible formatting.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
