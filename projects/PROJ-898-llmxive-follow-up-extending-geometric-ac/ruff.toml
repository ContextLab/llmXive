# Ruff configuration for llmXive project
# Enforces consistent style, linting, and formatting rules

[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude a few files/directories
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "data",
    "venv",
    ".eggs",
    "*.egg-info",
]

# Same as Black line length
line-length = 88

# Allow unused variables for test files
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Ignore import sorting in __init__.py files
"__init__.py" = ["F401"]
# Ignore some rules in test files
"tests/*" = ["S101", "ARG001"]

[lint.isort]
known-first-party = ["code"]
force-sort-within-sections = false
combine-as-imports = true

[format]
# Use Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
