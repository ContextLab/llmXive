key_entity: EstimationResult
description: >-
  Schema for the results of applying meta-analysis estimators (Fixed-Effects, 
  DerSimonian-Laird, REML) to a single simulated replicate. Contains the 
  pooled effect estimate, confidence intervals, heterogeneity statistics, 
  and a reliability flag based on study count.
version: "1.0"
references:
  - SC-002: "Estimation results must include I^2 and Q statistics."
  - FR-001: "Schema must include reliability_flag (boolean)."

fields:
  - name: replicate_id
    type: string
    description: Unique identifier for the simulation replicate (e.g., "tau2_0.1_rep_001").
    required: true
    example: "tau2_0.1_rep_001"

  - name: estimator_type
    type: string
    description: The estimator used for this result.
    required: true
    enum:
      - "Fixed-Effects"
      - "DerSimonian-Laird"
      - "REML"
    example: "DerSimonian-Laird"

  - name: pooled_effect
    type: float
    description: The point estimate of the pooled effect size (theta_hat).
    required: true
    example: 0.482

  - name: ci_lower
    type: float
    description: Lower bound of the confidence interval for the pooled effect.
    required: true
    example: 0.350

  - name: ci_upper
    type: float
    description: Upper bound of the confidence interval for the pooled effect.
    required: true
    example: 0.614

  - name: ci_width
    type: float
    description: Width of the confidence interval (ci_upper - ci_lower).
    required: true
    example: 0.264

  - name: Q
    type: float
    description: Cochran's Q statistic measuring heterogeneity.
    required: true
    example: 12.45

  - name: I_squared
    type: float
    description: I-squared statistic (percentage of total variation due to heterogeneity).
    required: true
    example: 75.9
    note: "Mapped to I^2 in task description. Stored as I_squared for YAML compatibility."

  - name: tau2_estimate
    type: float
    description: Estimated between-study variance (tau-squared).
    required: true
    example: 0.085

  - name: N_studies
    type: integer
    description: Number of studies included in this meta-analysis.
    required: true
    example: 20

  - name: reliability_flag
    type: boolean
    description: >-
      Flag indicating if the result is considered reliable. 
      Set to False if N_studies < 5 (per SC-002 / FR-001).
    required: true
    example: true

  - name: injected_true_effect
    type: float
    description: The ground-truth effect size used in the simulation for this replicate.
    required: true
    example: 0.5

  - name: injected_tau2
    type: float
    description: The ground-truth between-study variance used in the simulation.
    required: true
    example: 0.1

  - name: convergence_status
    type: string
    description: Status of the numerical optimization (if applicable).
    required: true
    enum:
      - "success"
      - "failed"
      - "skipped"
    example: "success"

  - name: bias
    type: float
    description: Difference between pooled_effect and injected_true_effect.
    required: false
    note: "Calculated in metrics.py, included here if pre-calculated."
    example: -0.018

  - name: coverage_flag
    type: boolean
    description: True if the confidence interval contains the injected_true_effect.
    required: false
    note: "Calculated in metrics.py, included here if pre-calculated."
    example: true