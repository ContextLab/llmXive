$schema: http://json-schema.org/draft-07/schema#
title: EstimationResult
description: >
  Schema for the results of meta-analysis estimation procedures.
  Defines the structure for aggregated metrics including heterogeneity
  statistics (I^2, Q), pooled estimates, and reliability flags.
  Required by SC-002 and FR-001.
type: object
required:
  - pooled_estimate
  - ci_lower
  - ci_upper
  - i_squared
  - q_statistic
  - n_studies
  - tau2_estimate
  - estimator_type
  - reliability_flag
  - replicate_id
  - tau2_level
properties:
  replicate_id:
    type: string
    description: Unique identifier for the simulation replicate.
  tau2_level:
    type: number
    description: The injected true heterogeneity level (tau^2) for this replicate.
  estimator_type:
    type: string
    enum:
      - FixedEffects
      - DerSimonianLaird
      - REML
    description: The estimation method used.
  pooled_estimate:
    type: number
    description: The pooled effect size estimate.
  ci_lower:
    type: number
    description: Lower bound of the confidence interval.
  ci_upper:
    type: number
    description: Upper bound of the confidence interval.
  i_squared:
    type: number
    description: >
      I^2 statistic representing the percentage of variation across studies
      due to heterogeneity rather than chance. Range [0, 100].
  q_statistic:
    type: number
    description: Cochran's Q statistic for heterogeneity.
  n_studies:
    type: integer
    description: Number of studies included in the meta-analysis.
  tau2_estimate:
    type: number
    description: Estimated between-study variance.
  reliability_flag:
    type: boolean
    description: >
      Indicates data reliability. Set to False if N_studies < 5
      (Small Study Effects threshold per T011b). True otherwise.
  bias:
    type: number
    nullable: true
    description: Difference between pooled_estimate and injected_true_effect.
  coverage_flag:
    type: boolean
    nullable: true
    description: True if the confidence interval contains the true effect.
  convergence_status:
    type: string
    enum:
      - success
      - failure
      - skipped
    description: Status of the estimation algorithm convergence.
additionalProperties: false
