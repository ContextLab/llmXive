type: object
required:
  - dataset_id
  - estimator_type
  - pooled_effect
  - ci_lower
  - ci_upper
  - tau_squared_est
  - i_squared
  - q_statistic
  - coverage_flag
  - convergence_warning
properties:
  dataset_id:
    type: integer
  estimator_type:
    type: string
    enum:
      - FixedEffects
      - DerSimonianLaird
      - REML
  pooled_effect:
    type: number
  ci_lower:
    type: number
  ci_upper:
    type: number
  tau_squared_est:
    type: number
  i_squared:
    type: number
  q_statistic:
    type: number
  coverage_flag:
    type: boolean
  convergence_warning:
    type: boolean