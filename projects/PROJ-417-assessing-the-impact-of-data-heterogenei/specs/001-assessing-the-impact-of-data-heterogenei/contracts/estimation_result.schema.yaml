$schema: "http://json-schema.org/draft-07/schema#"
title: EstimationResult
description: |
  Schema for the estimation results produced by applying meta-analysis estimators
  (Fixed-Effects, DerSimonian-Laird, REML) to simulated or real datasets.
  This entity captures the pooled effect estimates, confidence intervals,
  heterogeneity statistics, and reliability flags.
type: object
required:
  - study_id
  - estimator_type
  - pooled_effect
  - se_pooled
  - ci_lower
  - ci_upper
  - I_squared
  - Q_statistic
  - N_studies
  - reliability_flag
  - tau2_estimated
properties:
  study_id:
    type: string
    description: "Unique identifier for the study or replicate (e.g., 'rep_001_tau2_0.1')"
  estimator_type:
    type: string
    description: "The estimator used (e.g., 'FixedEffects', 'DerSimonianLaird', 'REML')"
    enum:
      - FixedEffects
      - DerSimonianLaird
      - REML
  pooled_effect:
    type: number
    description: "The pooled effect size estimate"
  se_pooled:
    type: number
    description: "Standard error of the pooled effect"
  ci_lower:
    type: number
    description: "Lower bound of the confidence interval"
  ci_upper:
    type: number
    description: "Upper bound of the confidence interval"
  I_squared:
    type: number
    description: "I^2 statistic representing the percentage of total variation across studies due to heterogeneity rather than chance"
    minimum: 0
    maximum: 100
  Q_statistic:
    type: number
    description: "Cochran's Q statistic for testing heterogeneity"
    minimum: 0
  N_studies:
    type: integer
    description: "Number of studies included in this meta-analysis"
    minimum: 1
  reliability_flag:
    type: boolean
    description: |
      Flag indicating the reliability of the result.
      Set to False if N_studies < 5 (Small Study Effects risk).
      Set to True otherwise.
  tau2_estimated:
    type: number
    description: "Estimated between-study variance (tau-squared)"
    minimum: 0
  injected_true_effect:
    type: number
    description: "The ground truth effect size injected during simulation (if applicable)"
    nullable: true
  injected_tau2:
    type: number
    description: "The ground truth heterogeneity injected during simulation (if applicable)"
    nullable: true
  convergence_status:
    type: string
    description: "Status of the estimator convergence (e.g., 'success', 'failed', 'max_iter_reached')"
    enum:
      - success
      - failed
      - max_iter_reached
    default: "success"
additionalProperties: false