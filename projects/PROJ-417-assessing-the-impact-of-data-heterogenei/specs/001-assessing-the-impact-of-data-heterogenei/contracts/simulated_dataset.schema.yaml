$schema: http://json-schema.org/draft-07/schema#
title: SimulatedDataset
description: >
  Schema for simulated meta-analysis datasets generated by the simulation engine.
  Contains metadata about the injection parameters and per-replicate study data.
  This schema enforces FR-001 requirements for ground truth tracking.
type: object
required:
  - injected_true_effect
  - injected_tau2
  - N_studies
  - reliability_flag
  - replicates
properties:
  injected_true_effect:
    type: number
    description: The true underlying effect size injected into the simulation for this replicate set.
    minimum: -100
    maximum: 100
  injected_tau2:
    type: number
    description: The between-study variance (heterogeneity) injected into the simulation.
    minimum: 0
  N_studies:
    type: integer
    description: The number of studies in the simulated dataset.
    minimum: 1
  reliability_flag:
    type: boolean
    description: >
      A flag indicating data reliability. Set to False if N_studies < 5.
      Set to True otherwise. This is derived from N_studies.
  replicates:
    type: array
    description: List of individual simulation replicates.
    minItems: 1
    items:
      type: object
      required:
        - replicate_id
        - study_count
        - injected_true_effect
        - injected_tau2
        - reliability_flag
        - studies
      properties:
        replicate_id:
          type: integer
          description: Unique identifier for the replicate within the run.
        study_count:
          type: integer
          description: Number of studies in this specific replicate.
        injected_true_effect:
          type: number
          description: The true effect size used for this replicate.
        injected_tau2:
          type: number
          description: The tau-squared value used for this replicate.
        reliability_flag:
          type: boolean
          description: Reliability flag for this specific replicate (False if study_count < 5).
        studies:
          type: array
          description: List of individual study data within the replicate.
          items:
            type: object
            required:
              - study_id
              - effect_size
              - standard_error
              - variance
            properties:
              study_id:
                type: integer
              effect_size:
                type: number
              standard_error:
                type: number
              variance:
                type: number
additionalProperties: false