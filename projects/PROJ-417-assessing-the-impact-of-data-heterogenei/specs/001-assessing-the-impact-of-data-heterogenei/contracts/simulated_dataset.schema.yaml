name: SimulatedDataset
description: |
  Schema for simulated meta-analysis datasets generated by the simulation engine.
  Each record represents a single replicate of a meta-analysis simulation with
  known ground truth parameters (injected_true_effect, injected_tau2).
type: object
required:
  - injected_true_effect
  - injected_tau2
  - N_studies
  - reliability_flag
  - study_id
  - effect_estimate
  - standard_error
properties:
  injected_true_effect:
    type: number
    description: The true underlying effect size (mu) injected into this replicate.
    minimum: -100
    maximum: 100
    example: 0.5
  injected_tau2:
    type: number
    description: The true between-study variance (tau^2) injected into this replicate.
    minimum: 0
    example: 0.1
  N_studies:
    type: integer
    description: The number of studies in this simulated replicate.
    minimum: 1
    example: 20
  reliability_flag:
    type: boolean
    description: |
      Indicates if the replicate is considered reliable for analysis.
      Set to False if N_studies < 5 (small study effects threshold).
    example: true
  study_id:
    type: integer
    description: Unique identifier for the study within the replicate.
    minimum: 1
    example: 1
  effect_estimate:
    type: number
    description: The simulated effect size estimate for this specific study.
    example: 0.45
  standard_error:
    type: number
    description: The standard error associated with the effect estimate.
    minimum: 0
    example: 0.12
  replicate_id:
    type: integer
    description: Unique identifier for the simulation replicate.
    minimum: 1
    example: 1
  heterogeneity_level:
    type: number
    description: The nominal heterogeneity level used for this replicate.
    example: 0.1
additionalProperties: false
metadata:
  source: "Simulated by code/simulation/generator.py"
  version: "1.0.0"
  constraints:
    - "reliability_flag must be False if N_studies < 5"
    - "injected_tau2 must be >= 0"
    - "standard_error must be > 0"