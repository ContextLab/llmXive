$schema: "http://json-schema.org/draft-07/schema#"
title: SimulatedDataset
description: >
  Schema for simulated meta-analysis datasets generated by the simulation engine.
  Each record represents a single replicate of a meta-analysis with known ground truth
  heterogeneity parameters.
type: object
required:
  - injected_true_effect
  - injected_tau2
  - N_studies
  - reliability_flag
  - replicate_id
  - heterogeneity_level
properties:
  replicate_id:
    type: integer
    description: Unique identifier for the simulation replicate.
  heterogeneity_level:
    type: number
    description: The target tau-squared (τ²) value injected for this replicate.
  injected_true_effect:
    type: number
    description: The true underlying effect size injected into the simulation (ground truth).
  injected_tau2:
    type: number
    description: The true between-study variance (τ²) injected for this replicate.
    minimum: 0
  N_studies:
    type: integer
    description: The number of studies included in this simulated meta-analysis.
    minimum: 1
  reliability_flag:
    type: boolean
    description: >
      Indicates the reliability of the simulation result.
      False if N_studies < 5 (small study effects risk), True otherwise.
  generated_effects:
    type: array
    description: List of generated effect sizes for the studies in this replicate.
    items:
      type: number
  generated_se:
    type: array
    description: List of generated standard errors corresponding to the effect sizes.
    items:
      type: number
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the replicate was generated.
  seed_used:
    type: integer
    description: Random seed used for this specific replicate generation.
additionalProperties: false