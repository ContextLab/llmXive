$schema: http://json-schema.org/draft-07/schema#
title: SimulatedDataset
description: Schema for simulated meta-analysis datasets generated by the pipeline.
type: object
required:
  - injected_true_effect
  - injected_tau2
  - N_studies
  - reliability_flag
  - replicates
  - metadata
properties:
  metadata:
    type: object
    description: Metadata about the simulation run.
    required:
      - seed
      - timestamp
      - generator_version
    properties:
      seed:
        type: integer
        description: Random seed used for reproducibility.
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation.
      generator_version:
        type: string
        description: Version of the generator script.
  injected_true_effect:
    type: number
    description: The true underlying effect size (mu) injected into the simulation.
    minimum: -1000
    maximum: 1000
  injected_tau2:
    type: number
    description: The true between-study variance (tau-squared) injected into the simulation.
    minimum: 0
  N_studies:
    type: integer
    description: The number of studies in each replicate.
    minimum: 1
  reliability_flag:
    type: boolean
    description: Indicates if the dataset meets reliability criteria (e.g., N_studies >= 5).
    default: true
  replicates:
    type: array
    description: List of individual study results for each replicate.
    items:
      type: object
      required:
        - replicate_id
        - study_id
        - effect_size
        - standard_error
        - variance
        - weight
      properties:
        replicate_id:
          type: integer
          description: Unique identifier for the replicate.
        study_id:
          type: integer
          description: Unique identifier for the study within the replicate.
        effect_size:
          type: number
          description: The simulated effect size for this study.
        standard_error:
          type: number
          description: The standard error associated with the effect size.
        variance:
          type: number
          description: The variance (standard_error^2).
        weight:
          type: number
          description: The inverse-variance weight (1/variance).
additionalProperties: false
