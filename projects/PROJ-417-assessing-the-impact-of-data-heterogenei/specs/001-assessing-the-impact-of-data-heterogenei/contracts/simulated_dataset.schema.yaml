type: object
required:
  - replicate_id
  - tau_squared
  - true_effect
  - study_effects
  - study_se
  - study_sizes
  - k
  - sweep_type
properties:
  replicate_id:
    type: integer
  tau_squared:
    type: number
  true_effect:
    type: number
  study_effects:
    type: array
    items:
      type: number
  study_se:
    type: array
    items:
      type: number
  study_sizes:
    type: array
    items:
      type: integer
  k:
    type: integer
  sweep_type:
    type: string
    enum:
      - primary
      - sensitivity