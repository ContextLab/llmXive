# Simulated Dataset Schema
# Defines the structure of the synthetic meta-analysis datasets generated by the simulation engine.
# [Key Entity: SimulatedDataset] [FR-001]

$schema: "http://json-schema.org/draft-07/schema#"
title: SimulatedDataset
description: >
  A collection of simulated meta-analysis replicates. Each record represents a single
  simulated study within a specific replicate, containing the injected ground truth parameters
  and the generated effect size data.

type: object
required:
  - metadata
  - replicates

properties:
  metadata:
    type: object
    description: Global metadata for the simulation run.
    required:
      - injection_true_effect
      - injected_tau2
      - N_studies
      - reliability_flag
      - timestamp
    properties:
      injection_true_effect:
        type: number
        description: The true underlying effect size injected into this simulation batch.
      injected_tau2:
        type: number
        description: The between-study heterogeneity (tau-squared) injected into this simulation batch.
      N_studies:
        type: integer
        description: The number of studies generated in this replicate.
      reliability_flag:
        type: boolean
        description: >
          A flag indicating the reliability of the dataset.
          Set to False if N_studies < 5, True otherwise.
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the simulation was generated.

  replicates:
    type: array
    description: List of individual study results within the simulated dataset.
    items:
      type: object
      required:
        - replicate_id
        - study_id
        - effect_size
        - standard_error
        - variance
        - true_effect
        - tau2
      properties:
        replicate_id:
          type: integer
          description: Unique identifier for the simulation replicate.
        study_id:
          type: integer
          description: Unique identifier for the study within the replicate.
        effect_size:
          type: number
          description: The simulated observed effect size for this study.
        standard_error:
          type: number
          description: The standard error associated with the effect size.
        variance:
          type: number
          description: The variance of the effect size (SE^2).
        true_effect:
          type: number
          description: The true effect size for this study (injected_true_effect).
        tau2:
          type: number
          description: The true between-study variance (injected_tau2).

additionalProperties: false