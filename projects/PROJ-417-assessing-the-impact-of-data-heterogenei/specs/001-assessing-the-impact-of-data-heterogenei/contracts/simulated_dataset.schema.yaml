$schema: http://json-schema.org/draft-07/schema#
title: SimulatedDataset
description: >
  Schema for the simulated meta-analysis dataset generated by the simulation engine.
  This dataset contains the ground truth parameters injected during simulation
  and the resulting study-level effects and variances.
type: object
required:
  - injected_true_effect
  - injected_tau2
  - N_studies
  - reliability_flag
  - replicates
properties:
  injected_true_effect:
    type: number
    description: >
      The true underlying effect size injected into the simulation.
      This is the ground truth value against which estimator bias is measured.
    minimum: -10.0
    maximum: 10.0
  injected_tau2:
    type: number
    description: >
      The between-study heterogeneity variance (tau-squared) injected into the simulation.
      Controls the degree of heterogeneity across studies in a replicate.
    minimum: 0.0
  N_studies:
    type: integer
    description: >
      The number of studies included in this specific simulated replicate.
      This may vary if the base data filtering results in different counts,
      but typically reflects the base dataset size.
    minimum: 2
    maximum: 10000
  reliability_flag:
    type: boolean
    description: >
      A boolean flag indicating the reliability of the meta-analysis result.
      Set to False if N_studies < 5 (Small Study Effects risk).
      Set to True otherwise.
  replicates:
    type: array
    description: >
      List of individual study results generated for this simulation run.
      Each element represents a single study within a simulated meta-analysis.
    items:
      type: object
      required:
        - study_id
        - effect_size
        - standard_error
        - variance
      properties:
        study_id:
          type: string
          description: Unique identifier for the study within the replicate.
        effect_size:
          type: number
          description: The simulated effect size for this study.
        standard_error:
          type: number
          description: The standard error of the effect size.
        variance:
          type: number
          description: The variance of the effect size (SE^2).
  metadata:
    type: object
    description: Optional metadata about the simulation run.
    properties:
      seed:
        type: integer
        description: Random seed used for reproducibility.
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation.
      source_base:
        type: string
        description: Path or identifier of the base data used.
additionalProperties: false