type: object
required:
  - tau_squared
  - estimator_type
  - sweep_type
  - mean_bias
  - coverage_rate
  - coverage_deviation
  - coverage_ci_lower
  - coverage_ci_upper
  - binomial_p_value
  - bias_test_p_value
  - report_framing
properties:
  tau_squared:
    type: number
  estimator_type:
    type: string
    enum:
      - FixedEffects
      - DerSimonianLaird
      - REML
  sweep_type:
    type: string
    enum:
      - primary
      - sensitivity
  mean_bias:
    type: number
  coverage_rate:
    type: number
  coverage_deviation:
    type: number
  coverage_ci_lower:
    type: number
  coverage_ci_upper:
    type: number
  binomial_p_value:
    type: number
  bias_test_p_value:
    type: number
  report_framing:
    type: string
    description: "Must be 'associational' per SC‑005"