    \ typing, numpy, scipy), so any REML failure-logging invocation raises `NameError`\
    \ \u2014 meaning the FR-006 requirement (log failures and fall back) cannot work\
    \ as written, and the test `test_failure_logging_and_fallback` would fail. Additionally,\
    \ `data/results/reml_failures.json` has a schema (`{\"failure_count\": 0, \"events\"\
    : []}`) that `log_reml_failure` neither reads nor writes (it expects/writes a\
    \ plain JSON list), indica"
