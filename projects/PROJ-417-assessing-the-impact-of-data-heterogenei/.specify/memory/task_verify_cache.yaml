T001a:
  c: false
  h: f239f30978f22ab1b110c37dbe95450719e04afe49d61ad005509c34b3c5e1a4
  r: "The unit\u2011test log for `tests/unit/test_fetch_cochrane_data.py` shows four\
    \ failures: the `load_jackson_2010_base_data` function does not correctly use\
    \ a context manager (`AttributeError: __enter__`) and the module lacks an `import\
    \ urllib` causing a `NameError`. Consequently the script does not reliably raise\
    \ a `FileNotFoundError` when the CSV URL is unreachable, and the CI step does\
    \ not pass as required. The validation behavior is therefore not implemented correctly."
  sig: c6b4bb4a949927c89f3c58db00bb3cec971a54e36aa653d82d2c4a3d240ed43d
T002:
  c: false
  h: 777c46bb21ed7d93faa8edbdc24be8d916e90229d45155cdc8b187f82e01efc5
  r: "The `code/simulation/generator.py` CLI accepts the required arguments and the\
    \ unit tests pass, but the generated file `data/results/simulation_raw.jsonl`\
    \ contains records with keys `injected_true_effect`, `N_studies`, and `studies`\
    \ instead of the schema\u2011required fields (`true_effect`, `study_effects`,\
    \ `study_se`, `study_sizes`, `k`, `sweep_type`). All lines have `\"tau_squared\"\
    : 0.0` rather than the requested \u03C4\xB2 values, and the file does not contain\
    \ the 900 replicates per \u03C4\xB2 level (or the total 4\u202F500 lines for the\
    \ primary sweep). Consequently the output does not conform to `contracts/simulated_"
  sig: cd4d93a988cd00d7c8a1e7ce5fbf2b44b926c35c0f64cb0dc55f4b796871db1d
T003:
  c: false
  h: 9248694a0fe3fe92a1b4ec961460d507d37f9431c06718e950909515ee8c1b6f
  r: "The `estimate_reml` function logs failures and sets `convergence_warning=True`,\
    \ but on REML failure it falls back to the DerSimonian\u2011Laird \u03C4\xB2 value\
    \ (`max(dl_res.tau2, MIN_POSITIVE_TAU2)`) instead of unconditionally using the\
    \ required fallback \u03C4\xB2\u202F=\u202F1e\u20116. This violates the task specification\
    \ that the fallback \u03C4\xB2 must be exactly\u202F1e\u20116. The implementation\
    \ should set `tau2 = MIN_POSITIVE_TAU2` when REML fails."
  sig: 3933ce1c600b87dc3bbc9f55afeb57aa16a8a9f777146d27b7380fa12d312009
