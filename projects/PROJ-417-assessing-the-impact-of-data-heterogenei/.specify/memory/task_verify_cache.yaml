T002:
  c: false
  h: 464c2b843cf89f901d33c1af0e93db9bd202f077bc961455ae6210aea89843bf
  r: "The generator module does not provide a CLI or function that writes `SimulatedDataset`\
    \ records to `data/results/simulation_raw.jsonl`, and it lacks the API (e.g.,\
    \ `SimulationResult`, `load_base_data_structure`, `calculate_effect_and_variance`,\
    \ `create_replicate`) that the unit test `tests/unit/test_generator.py` expects.\
    \ Moreover, the required output file `data/results/simulation_raw.jsonl` is missing.\
    \ These gaps prevent the claimed unit\u2011test pass and the generation of the\
    \ 900 JSONL lines."
  sig: 2b9ddafc1481e2fc01af7c01dd30ca7e75568cf65b41c75b639d8533e7f4ff41
T003:
  c: false
  h: 431e826c4e3fbea2ac537aa49817c06908ac86d2deb6d2d7a85cb53067855ced
  r: "The estimators are implemented and the unit tests pass, but `estimate_reml`\
    \ does not provide the required `convergence_warning` flag nor replace a failed\
    \ \u03C4\xB2 estimate with a minimal positive value (e.g.,\u202F1e\u20116); it\
    \ instead falls back to the DerSimonian\u2011Laird \u03C4\xB2 and sets `convergence_status=\"\
    fallback_dl\"`. This does not satisfy the task\u2019s REML\u2011failure handling\
    \ specification."
  sig: c52ad74b2b90c7c7eba8c5eea0ceaecc4fbe773b5cb855d22b1fe1c22fd9961d
T004:
  c: false
  h: a9ee90b6fc94cd556fe8931dd25f29d0b1d1fb3f941fd25ce1bd8c74dacc3dc3
  r: "Checked `code/analysis/metrics.py` (contains the metric functions and a `write_simulation_and_estimations`\
    \ helper) and `tests/unit/test_metrics.py` (tests bias/coverage but does not invoke\
    \ the write function). The required output file `data/results/simulation_raw.jsonl`\
    \ is missing and there is no evidence that the function was run or that its lines\
    \ were validated against the JSON schemas. The task\u2019s core requirement of\
    \ actually writing and validating the combined records is not satisfied."
  sig: 99ad022f44536c52f8c74d94aea0c2f12a90b6c194f0ac4d4431d7843dc7a703
T005:
  c: false
  h: 315f21928fbe8936e4d62bf14cb7d74e7eea07a390a5bda774a9fd47fb34605c
  r: The pipeline entry point `code/main.py` does not accept the required `--tau-squared`,
    `--replicates`, or `--batch-size` arguments, and it never creates the expected
    `data/results/simulation_raw.jsonl` file (marked MISSING). The produced `data/results/sample_estimates.csv`
    exists but contains far more than the required 20 rows (multiple estimator rows
    per replicate) and thus does not meet the specification of 20 rows with the exact
    columns. The task therefore fails to deliver the mandated outputs.
  sig: 3dcd6a7dfa77b982efdb093b959925fdb2d5ed4ae2b1dec47f40a77ed62afb7c
T007:
  c: false
  h: bfc6338ac4c3b5688d6a7186a4df83840d3a5d7f0c143aa1d78983e1f0be15ea
  r: "The generated CSV (`data/results/aggregated_metrics.csv`) has the wrong schema\
    \ (missing required columns like `estimator_type`, `sweep_type`, etc.), only 5\
    \ rows instead of the required 15 (3 estimators\u202F\xD7\u202F5 \u03C4\xB2 levels),\
    \ and the script never produces the required `data/results/coverage_tests.json`.\
    \ Consequently the aggregation, binomial test, and bias\u2011distribution testing\
    \ do not meet the task specifications."
  sig: b64602bd2c53ec6c9c448282d6ab031a207b4aa925afd8e0c04e1fdb85a39cc8
