name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets

      - name: Check prerequisites and create baseline if missing
        run: |
          python code/scripts/security_scan.py --check-prerequisites

      - name: Run PII scan on processed data
        run: |
          python code/scripts/security_scan.py --scan-path data/processed/

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            .secrets.baseline
            scan-results.json
          if-no-files-found: ignore

  unit-tests:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest code/tests/unit/ -v

      - name: Run integration tests
        run: |
          python -m pytest code/tests/integration/ -v

  validate-quickstart:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt

      - name: Validate quickstart documentation
        run: |
          python code/scripts/validate_quickstart.py
