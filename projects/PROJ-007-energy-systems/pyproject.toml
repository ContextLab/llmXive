[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-systems"
version = "0.1.0"
description = "Automated science pipeline for energy inequity analysis"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "censusdata",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "pydantic",
    "pyarrow",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
  | data
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in pydantic)
]
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".venv",
    "build",
    "dist",
    "data",
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # assertions allowed in tests
"src/data/ingest.py" = ["S310"] # URL validation handled by logic

[tool.ruff.isort]
known-first-party = ["src"]
force-sort-within-sections = true
