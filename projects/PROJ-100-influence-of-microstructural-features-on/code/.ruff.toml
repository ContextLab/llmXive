[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "PL",  # pylint
]
ignore = [
    "E501",    # line-too-long (handled by black)
    "ANN101",  # missing-type-self
    "ANN102",  # missing-type-cls
    "S101",    # assert allowed for tests
    "PLR0913", # too-many-arguments (common in data pipelines)
    "PLR2004", # magic-value-comparison
]
fixable = ["ALL"]
unfixable = []

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
