$schema: http://json-schema.org/draft-07/schema#
title: Latent Output Schema
description: |
  Defines the structure, types, and constraints for latent representations
  generated by the VAE encoder for spin configurations. This schema is used
  to validate the output of the encoding process before analysis (T026-T032).
type: object
required:
  - model_id
  - config
  - latent_mean
  - latent_std
  - temperature
  - lattice_size
  - model
  - timestamp
properties:
  model_id:
    type: string
    description: Unique identifier for the trained VAE model checkpoint.
    pattern: "^[a-zA-Z0-9_-]+$"
    minLength: 1
  config:
    type: object
    description: Configuration parameters used during encoding.
    required:
      - latent_dim
      - batch_size
    properties:
      latent_dim:
        type: integer
        description: Dimensionality of the latent space (expected: 10).
        const: 10
      batch_size:
        type: integer
        description: Batch size used for encoding.
        minimum: 1
  latent_mean:
    type: object
    description: Mean of the latent distribution (mu) for the batch.
    required:
      - values
      - dtype
      - shape
    properties:
      values:
        type: array
        description: Flattened array of mean values.
        items:
          type: number
        minItems: 1
      dtype:
        type: string
        description: Data type of the values (e.g., "float32", "float64").
        enum:
          - float32
          - float64
      shape:
        type: array
        description: Original shape of the tensor (batch_size, latent_dim).
        items:
          type: integer
        minItems: 2
        maxItems: 2
  latent_std:
    type: object
    description: Standard deviation of the latent distribution (sigma) for the batch.
    required:
      - values
      - dtype
      - shape
    properties:
      values:
        type: array
        description: Flattened array of standard deviation values.
        items:
          type: number
        minItems: 1
      dtype:
        type: string
        description: Data type of the values.
        enum:
          - float32
          - float64
      shape:
        type: array
        description: Original shape of the tensor (batch_size, latent_dim).
        items:
          type: integer
        minItems: 2
        maxItems: 2
  temperature:
    type: number
    description: Temperature (T) of the spin configuration batch.
    minimum: 0.0
  lattice_size:
    type: integer
    description: Lattice size (L) of the spin configuration (e.g., 16, 24).
    enum:
      - 16
      - 24
  model:
    type: object
    description: Metadata about the model used for encoding.
    required:
      - architecture
      - version
    properties:
      architecture:
        type: string
        description: Model architecture name.
        const: "VAE_2conv_2deconv"
      version:
        type: string
        description: Semantic version of the model implementation.
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  timestamp:
    type: string
    description: ISO 8601 timestamp of when the latent representation was generated.
    format: date-time
  checksum:
    type: string
    description: SHA-256 checksum of the latent data payload for integrity verification.
    pattern: "^[a-f0-9]{64}$"
additionalProperties: false
examples:
  - model_id: "vae_heisenberg_L24_T1.5_epoch42"
    config:
      latent_dim: 10
      batch_size: 64
    latent_mean:
      values: [0.001, -0.02, 0.05, ...]
      dtype: "float32"
      shape: [64, 10]
    latent_std:
      values: [1.01, 0.99, 1.02, ...]
      dtype: "float32"
      shape: [64, 10]
    temperature: 1.5
    lattice_size: 24
    model:
      architecture: "VAE_2conv_2deconv"
      version: "1.0.0"
    timestamp: "2023-10-27T10:00:00Z"
    checksum: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"