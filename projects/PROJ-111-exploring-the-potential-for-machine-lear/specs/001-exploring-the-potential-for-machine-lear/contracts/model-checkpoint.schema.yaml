$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Checkpoint Schema"
description: |
  JSON Schema defining the structure, types, and constraints for model checkpoint
  files saved during VAE training. This schema ensures reproducibility and
  metadata integrity as required by Constitution Principle II and FR-003.
type: object
required:
  - metadata
  - model_state_dict
  - optimizer_state_dict
  - training_stats
additionalProperties: false
properties:
  metadata:
    type: object
    description: "Metadata regarding the checkpoint creation and environment."
    required:
      - version
      - timestamp
      - git_commit_hash
      - random_seed
      - model_architecture
      - hyperparameters
    additionalProperties: false
    properties:
      version:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+$"
        description: "Semantic version of the checkpoint format."
        const: "1.0.0"
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of when the checkpoint was saved."
      git_commit_hash:
        type: string
        pattern: "^[a-f0-9]{40}$"
        description: "SHA-1 hash of the git commit used to generate this checkpoint."
      random_seed:
        type: integer
        minimum: 0
        description: "The global random seed used for reproducibility."
      model_architecture:
        type: object
        description: "Configuration of the VAE architecture."
        required:
          - latent_dim
          - encoder_layers
          - decoder_layers
          - input_channels
        additionalProperties: false
        properties:
          latent_dim:
            type: integer
            minimum: 1
            description: "Dimensionality of the latent space (FR-003 mandates 10)."
            const: 10
          encoder_layers:
            type: array
            minItems: 2
            maxItems: 2
            description: "Configuration of the two convolutional encoder layers."
            items:
              type: object
              required:
                - in_channels
                - out_channels
                - kernel_size
                - stride
                - padding
              properties:
                in_channels:
                  type: integer
                out_channels:
                  type: integer
                kernel_size:
                  type: integer
                stride:
                  type: integer
                padding:
                  type: integer
          decoder_layers:
            type: array
            minItems: 2
            maxItems: 2
            description: "Configuration of the two deconvolutional decoder layers."
            items:
              type: object
              required:
                - in_channels
                - out_channels
                - kernel_size
                - stride
                - padding
              properties:
                in_channels:
                  type: integer
                out_channels:
                  type: integer
                kernel_size:
                  type: integer
                stride:
                  type: integer
                padding:
                  type: integer
          input_channels:
            type: integer
            const: 3
            description: "Number of input channels (3 spin components: x, y, z)."
      hyperparameters:
        type: object
        description: "Training hyperparameters active at the time of saving."
        required:
          - learning_rate
          - batch_size
          - epochs_trained
          - loss_weights
        additionalProperties: false
        properties:
          learning_rate:
            type: number
            minimum: 0
            exclusiveMinimum: true
          batch_size:
            type: integer
            minimum: 1
          epochs_trained:
            type: integer
            minimum: 1
          loss_weights:
            type: object
            description: "Weights for MSE reconstruction and KL divergence."
            required:
              - beta
            additionalProperties: false
            properties:
              beta:
                type: number
                minimum: 0
                description: "Weight for the KL divergence term."

  model_state_dict:
    type: object
    description: |
      The serialized state dictionary of the PyTorch VAE model.
      In the JSON representation, this is a dictionary where keys are parameter names
      and values are lists representing the flattened tensor data, along with shape info.
      (Note: In actual binary .pt files, this is a raw pickle/tensor blob. This schema
      describes the logical structure for validation if serialized to JSON or for
      metadata extraction).
    # For the purpose of this schema, we define the logical constraints on the keys
    # that MUST exist in the state_dict.
    propertyNames:
      pattern: "^(encoder\\.|decoder\\.|mu|log_var|bias|weight|\\.\\d+\\.)"
    minProperties: 10
    description: "Must contain weights and biases for encoder, decoder, and latent layers."

  optimizer_state_dict:
    type: object
    description: "The serialized state dictionary of the Adam optimizer."
    propertyNames:
      pattern: "^(state|param_groups|\\d+|step)"
    minProperties: 1

  training_stats:
    type: object
    description: "Statistics from the training run up to this checkpoint."
    required:
      - epoch
      - total_loss
      - reconstruction_loss
      - kl_loss
      - learning_rate_current
    additionalProperties: false
    properties:
      epoch:
        type: integer
        minimum: 1
      total_loss:
        type: number
      reconstruction_loss:
        type: number
      kl_loss:
        type: number
      learning_rate_current:
        type: number
        minimum: 0
      early_stopping_patience_remaining:
        type: integer
        minimum: 0
        description: "Remaining patience steps if early stopping is active."

  checksums:
    type: object
    description: "SHA-256 checksums for integrity verification of the binary blobs."
    required:
      - model_state_dict_sha256
      - optimizer_state_dict_sha256
    additionalProperties: false
    properties:
      model_state_dict_sha256:
        type: string
        pattern: "^[a-f0-9]{64}$"
      optimizer_state_dict_sha256:
        type: string
        pattern: "^[a-f0-9]{64}$"

examples:
  - metadata:
      version: "1.0.0"
      timestamp: "2023-10-27T10:00:00Z"
      git_commit_hash: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
      random_seed: 42
      model_architecture:
        latent_dim: 10
        encoder_layers:
          - in_channels: 3
            out_channels: 16
            kernel_size: 4
            stride: 2
            padding: 1
          - in_channels: 16
            out_channels: 32
            kernel_size: 4
            stride: 2
            padding: 1
        decoder_layers:
          - in_channels: 32
            out_channels: 16
            kernel_size: 4
            stride: 2
            padding: 1
          - in_channels: 16
            out_channels: 3
            kernel_size: 4
            stride: 2
            padding: 1
        input_channels: 3
      hyperparameters:
        learning_rate: 0.001
        batch_size: 64
        epochs_trained: 50
        loss_weights:
          beta: 0.5
    training_stats:
      epoch: 50
      total_loss: 12.45
      reconstruction_loss: 10.20
      kl_loss: 2.25
      learning_rate_current: 0.001
    checksums:
      model_state_dict_sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      optimizer_state_dict_sha256: "d7a8fbb307d7809469ca9abcb0082e4f8d5651e46d3cdb762d02d0bf37c9e592"