$schema: http://json-schema.org/draft-07/schema#
title: Model Checkpoint Schema
description: |
  Defines the structure, data types, and constraints for model checkpoint files
  generated during the VAE training process for the J1-J2 Heisenberg and XY model
  phase transition research.
type: object
required:
  - metadata
  - state_dict_checksum
  - optimizer_state_checksum
  - training_stats
properties:
  metadata:
    type: object
    description: Basic identification and configuration metadata for the checkpoint.
    required:
      - version
      - timestamp
      - model_architecture
      - config_hash
    properties:
      version:
        type: string
        pattern: '^\\d+\\.\\d+\\.\\d+$'
        description: Semantic version of the checkpoint format (e.g., "1.0.0").
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the checkpoint was saved.
      model_architecture:
        type: string
        enum:
          - VAE_2conv_2deconv_latent10
        description: Identifier for the specific model architecture used.
      config_hash:
        type: string
        minLength: 64
        maxLength: 64
        pattern: '^[a-f0-9]{64}$'
        description: SHA-256 hash of the training configuration used.
      lattice_size:
        type: integer
        minimum: 1
        description: The lattice size (L) of the data used for this checkpoint.
      model_type:
        type: string
        enum:
          - Heisenberg
          - XY
        description: The physical model this checkpoint was trained on.
  state_dict_checksum:
    type: string
    minLength: 64
    maxLength: 64
    pattern: '^[a-f0-9]{64}$'
    description: SHA-256 checksum of the model's state_dict bytes for integrity verification.
  optimizer_state_checksum:
    type: string
    minLength: 64
    maxLength: 64
    pattern: '^[a-f0-9]{64}$'
    description: SHA-256 checksum of the optimizer's state bytes for reproducibility.
  training_stats:
    type: object
    description: Statistics captured at the moment of checkpointing.
    required:
      - epoch
      - step
      - loss
      - val_loss
    properties:
      epoch:
        type: integer
        minimum: 0
        description: The epoch number at which the checkpoint was saved.
      step:
        type: integer
        minimum: 0
        description: The total number of training steps performed.
      loss:
        type: number
        minimum: 0
        description: The training loss value at this checkpoint.
      val_loss:
        type: number
        minimum: 0
        description: The validation loss value at this checkpoint.
      best_val_loss:
        type: number
        minimum: 0
        description: The best validation loss observed so far.
      learning_rate:
        type: number
        minimum: 0
        description: The learning rate used for this step.
  files:
    type: object
    description: List of files included in the checkpoint package.
    required:
      - model_weights
      - optimizer_state
    properties:
      model_weights:
        type: string
        description: Relative path to the model weights file (e.g., "model_weights.pt").
      optimizer_state:
        type: string
        description: Relative path to the optimizer state file (e.g., "optimizer.pt").
      config_snapshot:
        type: string
        description: Relative path to the JSON snapshot of the training config (optional).
  validation:
    type: object
    description: Results of the validation checks performed at save time.
    properties:
      checksum_valid:
        type: boolean
        description: Whether the file checksums match the metadata.
      schema_valid:
        type: boolean
        description: Whether the checkpoint metadata conforms to this schema.
      last_validated_at:
        type: string
        format: date-time
        description: Timestamp of the last validation run.
additionalProperties: false