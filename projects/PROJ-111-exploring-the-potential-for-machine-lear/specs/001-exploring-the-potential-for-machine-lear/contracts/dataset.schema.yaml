$schema: http://json-schema.org/draft-07/schema#
title: Processed Spin Dataset Schema
description: |
  JSON Schema defining the structure, types, and constraints for the processed
  spin configuration dataset used for machine learning in the llmXive pipeline.
  This schema validates the output of the preprocessing pipeline (T005) before
  it is consumed by the VAE training or analysis modules.
type: object
required:
  - metadata
  - data
properties:
  metadata:
    type: object
    description: Metadata describing the dataset generation and processing parameters.
    required:
      - version
      - model_type
      - lattice_sizes
      - temperature_range
      - seed
      - preprocessing_params
      - split_ratios
      - generated_at
    properties:
      version:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+$"
        description: Semantic version of the dataset format.
        example: "1.0.0"
      model_type:
        type: string
        enum:
          - J1-J2_Heisenberg
          - XY
        description: The physical model used to generate the raw data.
      lattice_sizes:
        type: array
        items:
          type: integer
          minimum: 1
        description: List of lattice sizes (L) included in this dataset.
        minItems: 1
        example: [16, 24]
      temperature_range:
        type: object
        required:
          - min
          - max
          - step
        properties:
          min:
            type: number
            minimum: 0.0
            description: Minimum temperature (T).
          max:
            type: number
            minimum: 0.0
            description: Maximum temperature (T).
          step:
            type: number
            minimum: 0.0
            description: Temperature sampling step size.
      seed:
        type: integer
        minimum: 0
        description: Random seed used for generation and preprocessing.
      preprocessing_params:
        type: object
        required:
          - normalization
          - reshape_format
        properties:
          normalization:
            type: string
            enum:
              - unit_norm
            description: Type of normalization applied to spin vectors.
          reshape_format:
            type: string
            pattern: "^\\[batch, 3, L, L\\]$"
            description: Expected tensor shape format string.
      split_ratios:
        type: object
        required:
          - train
          - val
        properties:
          train:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: Fraction of data allocated to training.
          val:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: Fraction of data allocated to validation.
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of dataset generation.
  data:
    type: object
    description: Container for the actual tensor data split by model and lattice size.
    required:
      - J1-J2_Heisenberg
      - XY
    properties:
      J1-J2_Heisenberg:
        type: object
        description: Data for the J1-J2 Heisenberg model.
        additionalProperties:
          type: object
          description: Data for a specific lattice size (e.g., "L16", "L24").
          required:
            - train
            - val
            - temperatures
          properties:
            train:
              type: array
              description: List of temperature bins, each containing training samples.
              items:
                type: object
                required:
                  - temperature
                  - samples
                properties:
                  temperature:
                    type: number
                    description: The temperature T for this bin.
                  samples:
                    type: array
                    description: 4D array of shape (N, 3, L, L) flattened or encoded.
                    items:
                      type: number
                    minItems: 1
            val:
              type: array
              description: List of temperature bins for validation data.
              items:
                type: object
                required:
                  - temperature
                  - samples
                properties:
                  temperature:
                    type: number
                  samples:
                    type: array
                    items:
                      type: number
                    minItems: 1
            temperatures:
              type: array
              items:
                type: number
              description: List of all temperatures covered in this block.
      XY:
        type: object
        description: Data for the XY model.
        additionalProperties:
          type: object
          required:
            - train
            - val
            - temperatures
          properties:
            train:
              type: array
              items:
                type: object
                required:
                  - temperature
                  - samples
                properties:
                  temperature:
                    type: number
                  samples:
                    type: array
                    items:
                      type: number
            val:
              type: array
              items:
                type: object
                required:
                  - temperature
                  - samples
                properties:
                  temperature:
                    type: number
                  samples:
                    type: array
                    items:
                      type: number
            temperatures:
              type: array
              items:
                type: number
constraints:
  - "The sum of train and val split ratios must equal 1.0 (within floating point tolerance)."
  - "All spin vector components must be normalized such that ||s|| = 1.0."
  - "Temperature bins must be sorted in ascending order."
  - "Sample counts per bin must not vary by more than 5 between any two bins (stratification constraint)."