$schema: http://json-schema.org/draft-07/schema#
title: Processed Spin Configuration Dataset Schema
description: |
  Defines the structure, types, and constraints for the preprocessed
  spin configuration dataset used in the machine learning pipeline.
  This dataset contains normalized, reshaped, and stratified spin
  vectors for the J1-J2 Heisenberg and XY models.

type: object
required:
  - metadata
  - data
  - splits
  - statistics

properties:
  metadata:
    type: object
    description: Metadata about the dataset generation and preprocessing.
    required:
      - version
      - models
      - lattice_sizes
      - temperature_range
      - seed
      - generated_at
      - preprocessing_steps
    properties:
      version:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+$"
        description: Semantic version of the dataset schema.
      models:
        type: array
        items:
          type: string
          enum:
            - "J1-J2 Heisenberg"
            - "XY"
        description: List of physical models included in the dataset.
      lattice_sizes:
        type: array
        items:
          type: integer
          minimum: 4
        description: List of lattice sizes (L) used (e.g., [16, 24]).
      temperature_range:
        type: object
        required:
          - min
          - max
          - step
        properties:
          min:
            type: number
            minimum: 0.0
            description: Minimum temperature in the simulation.
          max:
            type: number
            minimum: 0.0
            description: Maximum temperature in the simulation.
          step:
            type: number
            minimum: 0.01
            description: Temperature step size.
      seed:
        type: integer
        minimum: 0
        description: Random seed used for generation and preprocessing.
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of dataset creation.
      preprocessing_steps:
        type: array
        items:
          type: string
        description: List of preprocessing steps applied (e.g., "normalize", "reshape", "stratified_split").
      source_files:
        type: array
        items:
          type: string
        description: List of raw data file paths this dataset was derived from.

  data:
    type: object
    description: The actual spin configuration tensors.
    required:
      - spins
      - temperatures
      - labels
    properties:
      spins:
        type: array
        items:
          type: array
          items:
            type: number
            minimum: -1.0
            maximum: 1.0
          minItems: 3
          maxItems: 3
        description: |
          3D array of shape (N, 3, L, L) where N is the number of samples.
          Each sample is a 3xLxL tensor representing spin vectors (Sx, Sy, Sz).
          Values are normalized to unit length.
        minItems: 1
      temperatures:
        type: array
        items:
          type: number
          minimum: 0.0
        description: |
          1D array of length N containing the temperature for each spin configuration.
        minItems: 1
      labels:
        type: array
        items:
          type: string
          enum:
            - "ordered"
            - "disordered"
            - "critical"
        description: |
          1D array of length N containing phase labels derived from temperature
          relative to estimated critical points.
        minItems: 1

  splits:
    type: object
    description: Information about the train/validation/test splits.
    required:
      - train_indices
      - val_indices
      - test_indices
      - stratification_metric
    properties:
      train_indices:
        type: array
        items:
          type: integer
          minimum: 0
        description: List of indices belonging to the training set.
      val_indices:
        type: array
        items:
          type: integer
          minimum: 0
        description: List of indices belonging to the validation set.
      test_indices:
        type: array
        items:
          type: integer
          minimum: 0
        description: List of indices belonging to the test set.
      stratification_metric:
        type: string
        enum:
          - "temperature"
          - "phase"
        description: The metric used for stratified splitting.
      balance_variance:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: |
          Maximum absolute difference in sample count between temperature bins,
          normalized by the mean count. Must be <= 0.05 (5%) per task T015.

  statistics:
    type: object
    description: Statistical summaries of the dataset.
    required:
      - total_samples
      - samples_per_model
      - samples_per_temperature
      - norm_check
    properties:
      total_samples:
        type: integer
        minimum: 1
        description: Total number of spin configurations (N).
      samples_per_model:
        type: object
        additionalProperties:
          type: integer
          minimum: 0
        description: Count of samples per physical model.
      samples_per_temperature:
        type: object
        additionalProperties:
          type: integer
          minimum: 0
        description: Count of samples per temperature bin.
      norm_check:
        type: object
        required:
          - mean_norm
          - max_deviation
        properties:
          mean_norm:
            type: number
            minimum: 0.99
            maximum: 1.01
            description: Mean magnitude of spin vectors (should be ~1.0).
          max_deviation:
            type: number
            minimum: 0.0
            maximum: 1e-6
            description: Maximum deviation from unit norm (should be near 0).

constraints:
  - "spins.shape[1] == 3"
  - "spins.shape[2] == spins.shape[3] (LxL)"
  - "len(temperatures) == len(spins)"
  - "len(labels) == len(spins)"
  - "sum(len(splits)) == len(spins)"
  - "norm_check.mean_norm is approximately 1.0"
  - "balance_variance <= 0.05"