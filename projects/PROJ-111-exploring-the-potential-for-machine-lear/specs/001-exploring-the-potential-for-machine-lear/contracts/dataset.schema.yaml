$schema: http://json-schema.org/draft-07/schema#
title: Processed Spin Dataset Schema
description: >
  Schema defining the structure, types, and constraints for the processed
  spin configuration dataset used in the VAE training pipeline. This dataset
  is generated by code/preprocessing.py from raw Monte Carlo simulations.
type: object
required:
  - metadata
  - data
properties:
  metadata:
    type: object
    description: Metadata describing the dataset generation and parameters.
    required:
      - version
      - generated_at
      - source_models
      - lattice_sizes
      - temperature_range
      - preprocessing_params
      - split_info
      - checksum
    properties:
      version:
        type: string
        description: Schema version for the dataset format.
        pattern: "^\\d+\\.\\d+\\.\\d+$"
        example: "1.0.0"
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the dataset was created.
      source_models:
        type: array
        description: List of physical models included in this dataset.
        items:
          type: string
          enum:
            - "J1-J2 Heisenberg"
            - "XY"
        minItems: 1
      lattice_sizes:
        type: array
        description: List of lattice sizes (L) included in the dataset.
        items:
          type: integer
          minimum: 1
        example: [16, 24]
      temperature_range:
        type: object
        description: Min and max temperatures covered.
        required:
          - min_T
          - max_T
        properties:
          min_T:
            type: number
            minimum: 0.0
          max_T:
            type: number
            minimum: 0.0
      preprocessing_params:
        type: object
        description: Parameters used during preprocessing (normalization, etc.).
        required:
          - normalization
          - reshape_dims
        properties:
          normalization:
            type: string
            enum: ["unit_length"]
            description: Method used to normalize spin vectors.
          reshape_dims:
            type: array
            description: Expected dimensions [batch, channels, height, width].
            items:
              type: integer
            example: ["batch", 3, "L", "L"]
      split_info:
        type: object
        description: Information about the train/val split.
        required:
          - train_ratio
          - val_ratio
          - stratification_variable
        properties:
          train_ratio:
            type: number
            minimum: 0.0
            maximum: 1.0
          val_ratio:
            type: number
            minimum: 0.0
            maximum: 1.0
          stratification_variable:
            type: string
            enum: ["temperature"]
      checksum:
        type: string
        description: SHA-256 checksum of the data payload for integrity verification.
        pattern: "^[a-f0-9]{64}$"
  data:
    type: object
    description: The actual tensor data and associated labels.
    required:
      - spin_configs
      - temperatures
      - lattice_size
      - model_type
    properties:
      spin_configs:
        type: array
        description: >
          Numpy array of spin configurations. Shape: (N, 3, L, L).
          Values are floats normalized to unit length.
        items:
          type: array
          description: A single spin configuration (flattened or nested representation).
          minItems: 1
        minItems: 1
      temperatures:
        type: array
        description: >
          Array of temperature values corresponding to each spin configuration.
          Shape: (N,).
        items:
          type: number
          minimum: 0.0
        minItems: 1
      lattice_size:
        type: integer
        description: The lattice size L for this specific data block.
        minimum: 1
      model_type:
        type: string
        enum:
          - "J1-J2 Heisenberg"
          - "XY"
        description: The physical model this data block represents.
      sample_count:
        type: integer
        description: Total number of samples in this block.
        minimum: 1
additionalProperties: false