# Ruff configuration file (alternative to pyproject.toml)
# This file is used if ruff is invoked directly without pyproject.toml settings
line-length = 88
indent-width = 4
target-version = "py311"

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"