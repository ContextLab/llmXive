$schema: "http://json-schema.org/draft-07/schema#"
title: "Symbolic Graph Schema"
description: "Schema for the Directed Acyclic Graph (DAG) representing symbolic memory."
type: "object"
properties:
  graph_id:
    type: "string"
    description: "Unique identifier for the graph."
  config:
    type: "object"
    description: "Configuration used for construction."
    properties:
      granularity:
        type: "string"
        enum:
          - "coarse"
          - "fine"
      predicates:
        type: "string"
        enum:
          - "spatial-only"
          - "spatial+temporal"
    required:
      - granularity
      - predicates
  nodes:
    type: "array"
    description: "List of semantic tokens."
    items:
      type: "object"
      properties:
        node_id:
          type: "string"
        token_id:
          type: "string"
        taxonomy_level:
          type: "string"
        confidence:
          type: "number"
          minimum: 0.0
          maximum: 1.0
      required:
        - node_id
        - token_id
  edges:
    type: "array"
    description: "List of logical predicates."
    items:
      type: "object"
      properties:
        source_node:
          type: "string"
        target_node:
          type: "string"
        predicate:
          type: "string"
          enum:
            - "on_top_of"
            - "near"
            - "before"
            - "after"
            - "inside"
            - "outside"
        timestamp:
          type: "integer"
          nullable: true
      required:
        - source_node
        - target_node
        - predicate
  is_dag:
    type: "boolean"
    description: "Flag indicating if the graph is a valid DAG."
required:
  - graph_id
  - config
  - nodes
  - edges
  - is_dag
additionalProperties: false