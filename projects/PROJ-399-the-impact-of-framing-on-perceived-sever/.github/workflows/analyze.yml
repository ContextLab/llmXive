name: R Analysis CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Targeting GitHub Actions free tier limits (2 cores, 7GB RAM)
    # Optimized for CPU-only execution as per project constraints

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.3'
        # Use standard CRAN mirror
        cran-mirror: 'https://cran.rstudio.com'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

    - name: Install R dependencies via renv
      working-directory: code
      run: |
        if (requireNamespace("renv", quietly = TRUE)) {
          renv::restore()
        } else {
          install.packages("renv")
          renv::restore()
        }
      shell: Rscript {0}

    - name: Verify R environment
      working-directory: code
      run: |
        Rscript -e "sessionInfo()"
        Rscript -e "cat('R version:', R.version$major, '.', R.version$minor, '\n')"

    - name: Run Data Preparation (US1)
      working-directory: code
      run: |
        Rscript 01_data_prep.R
      env:
        # Ensure deterministic behavior
        R_SEED: ${{ secrets.R_SEED || '42' }}

    - name: Run Power Analysis (US3)
      working-directory: code
      run: |
        Rscript 02_power_analysis.R

    - name: Run Statistical Analysis (US1 & US2)
      working-directory: code
      run: |
        Rscript 03_analysis.R

    - name: Run Export & Visualization
      working-directory: code
      run: |
        Rscript 04_export.R

    - name: Run Unit Tests
      working-directory: code
      run: |
        if (requireNamespace("testthat", quietly = TRUE)) {
          testthat::test_dir("../tests")
        } else {
          stop("testthat package not found. Ensure renv.lock is up to date.")
        }
      shell: Rscript {0}

    - name: Upload Results Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: analysis-results
        path: |
          projects/PROJ-399-the-impact-of-framing-on-perceived-sever/results/
          projects/PROJ-399-the-impact-of-framing-on-perceived-sever/data/processed/
        retention-days: 7

    - name: Fail if Power Analysis Warning
      working-directory: code
      run: |
        # Check for critical power analysis warnings in logs
        if [ -f "../results/processed/power_analysis_verification.json" ]; then
          echo "Power analysis completed successfully."
        else
          echo "Critical: Power analysis verification file missing."
          exit 1
        fi