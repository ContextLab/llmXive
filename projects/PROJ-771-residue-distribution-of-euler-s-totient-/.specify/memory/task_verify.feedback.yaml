T006:
  reason: "The provided `code/sieve.py` defines the required functions and uses `MemoryGuard`,\
    \ but the accompanying `tests/unit/test_sieve.py` only checks a few \u03C6 values\
    \ up to\u202F6 and incorrectly tests `MemoryGuard` (it expects a Boolean return\
    \ that the implementation never provides). It does **not** verify residue counts\
    \ for primes\u202F3,\u202F5,\u202F7,\u202F11 nor that `compute_phi_linear_sieve`\
    \ raises `MemoryLimitExceeded` when a low memory limit is enforced. Consequently\
    \ the task\u2019s verification criteria are not met."
