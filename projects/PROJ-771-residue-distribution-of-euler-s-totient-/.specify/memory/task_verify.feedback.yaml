T003:
  reason: "The `MemoryGuard` class raises a `TypeError` because it calls `MemoryLimitExceeded`\
    \ with the wrong constructor signature (the exception expects `limit_mb` and `usage_mb`).\
    \ This causes the unit test `test_memory_guard_raises_when_usage_exceeds_threshold`\
    \ to fail, so the required behavior of raising `MemoryLimitExceeded` at the 90\u202F\
    % threshold is not satisfied. The implementation must be corrected to instantiate\
    \ `MemoryLimitExceeded` with the proper arguments (or adjust the exception definition)\
    \ and ensure the test passes."
  task: dff34484f1d1114492ab8d40786197593ee0ffc1639401119034830117e5d1e6
T004:
  reason: "The repository contains a full `code/seed.py` that pins `random` and `numpy`\
    \ seeds, persists the seed to `code/config.yaml`, and provides `get_seed()`. However,\
    \ the required integration test `tests/integration/test_seed_consistency.py` is\
    \ missing, so the claim that the full pipeline produces byte\u2011identical `ResidueDataset.frequency_map`\
    \ files cannot be verified. Adding the missing integration test (and ensuring\
    \ it passes) is needed to complete the task."
  task: 2fd98537532ad7a6417db9f8575e3c720f174821d66330fda0c50564167a22b5
