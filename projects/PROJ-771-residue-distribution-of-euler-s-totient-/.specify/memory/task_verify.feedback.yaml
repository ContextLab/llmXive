T002:
  reason: "The `code/seed.py` and `code/memory_guard.py` files exist and meet their\
    \ functional specs, and the memory\u2011guard tests all pass. However, `tests/unit/test_seed_consistency.py`\
    \ fails because `run_analysis.parse_args()` calls `parser.parse_args()` which\
    \ aborts on the pytest command\u2011line arguments, causing a `SystemExit`. The\
    \ seed\u2011consistency verification therefore does not succeed. Fix `parse_args`\
    \ to ignore unknown arguments (e.g., use `parse_known_args` or strip `sys.argv`)\
    \ so the test can run and compare the generated residue files."
