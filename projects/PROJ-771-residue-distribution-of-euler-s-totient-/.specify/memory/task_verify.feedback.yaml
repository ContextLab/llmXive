T006:
  reason: "The `code/stats.py` does not correctly implement the new API: it expects\
    \ a `ResidueDataset` to have fields `prime_modulus` and `total_count`, but the\
    \ actual `ResidueDataset` defined in `code/sieve.py` provides `prime` and `N`,\
    \ causing both `calculate_chi_squared_statistic` and `run_chi_squared_test` to\
    \ raise errors for the required dataset input. Moreover, `run_chi_squared_test`\
    \ never performs the Monte\u2011Carlo p\u2011value estimation described in the\
    \ specification and the accompanying `tests/unit/test_stats.py` does not contain\
    \ the three required sub\u2011tests for uniform, biased, and small\u2011N exact\
    \ case"
