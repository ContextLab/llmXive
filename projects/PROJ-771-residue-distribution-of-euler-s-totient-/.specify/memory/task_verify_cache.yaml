    dummy\")` around a loop), and the generated `results/reports/benchmark_dummy.json`\
    \ (contains numeric `wall_time_sec` and `peak_memory_mb`). The integration test\
    \ `tests/integration/test_benchmark_dummy.py` validates the file\u2019s existence\
    \ and schema."
  sig: 6b0d8e7d92ecd9678f5d4238c811c9e28c0af08d8c2f5cbf8aa0c70e8b4f1bd8
