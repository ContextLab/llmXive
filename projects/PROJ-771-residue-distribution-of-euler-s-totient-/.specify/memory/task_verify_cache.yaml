T005:
  c: false
  h: e0e46b75e53c7835e48e677a3d27d8dbf2ed5722368c4fde508809fa95f998aa
  r: "The provided `code/benchmark.py` creates the required JSON report with numeric\
    \ `wall_time_sec` and `peak_memory_mb` fields, and `scripts/run_dummy.py` successfully\
    \ generates `results/reports/benchmark_dummy.json`. However, the implementation\
    \ records peak memory directly with `psutil` instead of using the specified `MemoryGuard`\
    \ utility, violating the task\u2019s explicit requirement to obtain peak memory\
    \ via `MemoryGuard`. The missing use of `MemoryGuard` must be added for the task\
    \ to be considered complete."
  sig: 3d19dbd747ea83a94c96fd44d8790d1b8b96065bc69f5ace1757c72d12482535
T006:
  c: false
  h: 645730921e20154c45d37210623a80cbd5433f30f7cd723a68bf5787c71c2c2f
  r: "Checked `code/sieve.py` and `tests/unit/test_sieve.py`. The sieve module\u2019\
    s `compute_phi_linear_sieve` adds an optional `memory_guard` argument and calls\
    \ `memory_guard.check()` (which raises an exception) instead of returning `False`\
    \ as the test expects, so the memory\u2011guard test will fail. Moreover, the\
    \ provided unit tests do not verify residue counts for primes\u202F3,\u202F5,\u202F\
    7,\u202F11, and the `compute_residues` function is never exercised. Consequently\
    \ the required behavior is not demonstrated."
  sig: 92e2697f03a53962fdbb05aa3c24ac8648c40f4ec867d7a8b76088ccc5c7e788
