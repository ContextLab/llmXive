    usage and verifies the exception at the correct threshold (95 MB > 90 MB for a
    100 MB limit) plus interval and boundary behavior. The recorded pytest run shows
    all 4 tests passing (exit 0), and the exception class exists in `code/exceptions.py`
    with a compatible constructor.'
