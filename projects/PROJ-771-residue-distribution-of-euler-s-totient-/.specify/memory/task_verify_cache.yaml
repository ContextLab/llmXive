  r: "The `code/seed.py` and `code/memory_guard.py` files exist and implement the\
    \ required functionality, and the memory\u2011guard unit tests would pass. However,\
    \ `tests/unit/test_seed_consistency.py` cannot be collected because `run_analysis`\
    \ imports `stats`, which tries to import `multinomial_test` from `scipy.stats`\
    \ (not available), causing an ImportError. Consequently the pipeline never runs\
    \ and the expected residue JSON files are not generated. Fix the import error\
    \ (or adjust `stats.py`) and ensure the pipeline creates the `data/raw/residues_*.json`\
    \ files for the test configuration."
