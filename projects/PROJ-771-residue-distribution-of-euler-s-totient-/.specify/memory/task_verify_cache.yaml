  r: "The repository contains `code/seed.py` which pins `random` and `numpy` seeds\
    \ and provides `get_seed()`, but it never writes the seed to any configuration\
    \ object as required, and the integration test `tests/integration/test_seed_consistency.py`\
    \ that should verify reproducible pipeline output is missing. Consequently the\
    \ task\u2019s full requirement is not satisfied."
