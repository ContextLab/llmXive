  r: "The provided `code/stats.py` does not implement the required `calculate_chi_squared_statistic(dataset:\
    \ ResidueDataset) -> float` nor a `run_chi_squared_test(dataset, M=\u2026) ->\
    \ dict` that matches the `StatisticalResult` schema (fields `test_type`, `test_statistic`,\
    \ `p_value`, `degrees_of_freedom`, `method`, `expected_counts`, `observed_counts`,\
    \ `uniformity_hypothesis`, `metadata`). Instead it uses different signatures,\
    \ returns tuples, and lacks an exact multinomial test or the exact JSON\u2011\
    serialisable output. The unit tests present (`tests/unit/test_stats.py`) also\
    \ do not cover the three sub\u2011tests"
