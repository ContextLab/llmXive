$schema: "http://json-schema.org/draft-07/schema#"
title: "StatisticalResult"
description: "Schema for the output of the chi-squared goodness-of-fit test (with Monte Carlo or exact fallback) against the **uniform** expected counts."
type: object
properties:
  test_type:
    type: string
    description: "Type of statistical test performed."
    enum: ["chi_squared","chi_squared_monte_carlo","exact_multinomial"]
  test_statistic:
    type: number
    description: "The calculated chi-squared (or exact) test statistic."
    minimum: 0
  p_value:
    type: number
    description: "Empirical p-value (proportion of simulated or exact tail probabilities)."
    minimum: 0
    maximum: 1
  degrees_of_freedom:
    type: integer
    description: "Degrees of freedom (p − 1)."
    minimum: 1
  method:
    type: string
    description: "Method used for p-value estimation."
    enum: ["asymptotic","monte_carlo","exact"]
  expected_counts:
    type: array
    description: "Uniform expected counts $E_i = N/p$ for each residue."
    items:
      type: number
    minItems: 3
    maxItems: 11
  observed_counts:
    type: array
    description: "Observed counts $O_i$ for each residue (ordered 0 … p‑1)."
    items:
      type: integer
    minItems: 3
    maxItems: 11
  uniformity_test_pass:
    type: boolean
    description: "True if p-value > 0.05 (significance threshold)."
  metadata:
    type: object
    description: "Execution metadata for reproducibility."
    properties:
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 timestamp of execution."
      python_version:
        type: string
        description: "Python version used."
      n_processed:
        type: integer
        description: "Actual N processed."
        minimum: 1
      peak_memory_mb:
        type: number
        description: "Peak RAM usage in MB."
        minimum: 0
      wall_time_sec:
        type: number
        description: "Total execution time in seconds."
        minimum: 0
      limit_reached:
        type: boolean
        description: "Flag indicating whether MemoryGuard triggered."
    required:
      - timestamp
      - python_version
      - n_processed
      - peak_memory_mb
      - wall_time_sec
      - limit_reached
    additionalProperties: false
required:
  - test_type
  - test_statistic
  - p_value
  - degrees_of_freedom
  - method
  - expected_counts
  - observed_counts
  - uniformity_test_pass
  - metadata
additionalProperties: false