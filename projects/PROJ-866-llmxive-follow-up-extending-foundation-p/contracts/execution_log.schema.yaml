type: object
required:
  - workflow_id
  - compression_depth
  - token_count
  - policy_violations
properties:
  workflow_id:
    type: string
  compression_depth:
    type: integer
  token_count:
    type: integer
  context_reduction_pct:
    type: [number, string]
  is_valid:
    type: boolean
  status:
    type: string
  policy_violations:
    type: array
    items:
      type: string
  violation_details:
    type: array
    items:
      type: object
      properties:
        node_id:
          type: string
        rule_id:
          type: string
        reason:
          type: string
  depth:
    type: integer
  complexity:
    type: integer
