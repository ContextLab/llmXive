$schema: http://json-schema.org/draft-07/schema#
title: Execution Log Schema
description: |
  Schema for execution logs generated by the FullContextEngine and CompressedContextEngine.
  Used to record policy violations, token counts, and execution status for trade-off analysis.
type: object
required:
  - workflow_id
  - engine_type
  - execution_status
  - timestamp
  - policy_violations
  - token_count
  - context_reduction_pct
  - depth_truncation
  - nodes_executed
  - nodes_total
  - is_valid
properties:
  workflow_id:
    type: string
    description: Unique identifier for the workflow being executed.
    pattern: "^wf-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"

  engine_type:
    type: string
    description: The type of engine used for execution.
    enum:
      - full_context
      - compressed_context
      - oracle_policy

  execution_status:
    type: string
    description: Final status of the execution.
    enum:
      - success
      - partial_success
      - failed
      - edge_case

  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the execution completed.

  policy_violations:
    type: array
    description: List of policy violations encountered during execution.
    items:
      type: object
      required:
        - violation_type
        - node_id
        - policy_rule
        - description
      properties:
        violation_type:
          type: string
          description: Type of violation (e.g., 'data_sovereignty', 'budget_exceeded').
        node_id:
          type: string
          description: ID of the node where the violation occurred.
        policy_rule:
          type: string
          description: The specific policy rule that was violated.
        description:
          type: string
          description: Human-readable description of the violation.

  token_count:
    type: integer
    minimum: 0
    description: Total number of tokens in the context passed to the engine.

  context_reduction_pct:
    type: [number, string]
    description: |
      Percentage reduction in context size compared to full context.
      For edge cases (depth=0), this may be the string '[deferred]'.
      For full context, this should be 0.0.
    minimum: 0.0
    maximum: 100.0

  depth_truncation:
    type: integer
    minimum: 0
    description: The maximum depth used for context truncation (BFS/DFS).
      For full context, this should be null or the full graph depth.

  nodes_executed:
    type: integer
    minimum: 0
    description: Number of nodes successfully executed.

  nodes_total:
    type: integer
    minimum: 0
    description: Total number of nodes in the workflow.

  is_valid:
    type: boolean
    description: |
      Indicates if the workflow is logically valid (can be executed even with full context).
      Set to false for impossible workflows; these are excluded from error calculations.

  edge_case_metadata:
    type: object
    description: Additional metadata for edge case executions.
    properties:
      reason:
        type: string
        description: Reason for edge case classification (e.g., 'single_node', 'depth_zero').
      original_depth:
        type: integer
        description: Original depth of the workflow before edge case handling.

  compression_params:
    type: object
    description: Parameters used for compression (only relevant for compressed_context engine).
    properties:
      algorithm:
        type: string
        enum:
          - bfs
          - dfs
      max_tokens:
        type: integer
        description: Maximum token budget for the compressed context.
      priority_strategy:
        type: string
        description: Strategy used for prioritizing nodes during compression.

  error_details:
    type: object
    description: Details about execution errors if status is 'failed'.
    properties:
      error_code:
        type: string
      error_message:
        type: string
      traceback:
        type: string

  metadata:
    type: object
    description: Additional metadata for the execution log.
    properties:
      seed:
        type: integer
        description: Random seed used for reproducibility.
      config_hash:
        type: string
        description: Hash of the configuration used for this execution.