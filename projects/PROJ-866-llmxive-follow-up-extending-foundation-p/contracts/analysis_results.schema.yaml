$schema: http://json-schema.org/draft-07/schema#
title: AnalysisResults
description: |
  Schema for the output of the trade-off analysis pipeline (User Story 3).
  Contains regression parameters, safe operating thresholds, and confidence intervals.
type: object
required:
  - analysis_id
  - timestamp
  - regression_model
  - safe_threshold
  - confidence_interval
  - statistics
properties:
  analysis_id:
    type: string
    description: Unique identifier for this analysis run.
    pattern: "^ANL-[0-9]{4}-[a-zA-Z0-9]+$"
  
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the analysis was completed.
  
  dataset_info:
    type: object
    description: Metadata about the input data used for analysis.
    required:
      - source_file
      - total_workflows
      - valid_workflows
      - invalid_filtered
    properties:
      source_file:
        type: string
        description: Path to the processed execution logs used.
      total_workflows:
        type: integer
        minimum: 0
        description: Total number of workflows in the source dataset.
      valid_workflows:
        type: integer
        minimum: 0
        description: Number of workflows that passed validation (is_valid=true).
      invalid_filtered:
        type: integer
        minimum: 0
        description: Number of workflows filtered out due to invalidity.
  
  regression_model:
    type: object
    description: Parameters and metrics of the fitted logistic regression model.
    required:
      - model_type
      - coefficients
      - intercept
      - goodness_of_fit
    properties:
      model_type:
        type: string
        enum: ["logistic_regression"]
        description: Type of model fitted.
      coefficients:
        type: object
        description: Coefficients for predictors (token_reduction_pct, depth, complexity).
        required:
          - token_reduction_pct
        properties:
          token_reduction_pct:
            type: number
            description: Coefficient for token reduction percentage.
          depth:
            type: number
            description: Coefficient for graph depth (if included).
          complexity:
            type: number
            description: Coefficient for graph complexity (if included).
      intercept:
        type: number
        description: Model intercept term.
      goodness_of_fit:
        type: object
        description: Model fit statistics.
        required:
          - pseudo_r2
          - log_likelihood
        properties:
          pseudo_r2:
            type: number
            minimum: 0
            maximum: 1
            description: McFadden's pseudo R-squared value.
          log_likelihood:
            type: number
            description: Final log-likelihood of the model.
          aic:
            type: number
            description: Akaike Information Criterion.
          bic:
            type: number
            description: Bayesian Information Criterion.
  
  safe_threshold:
    type: object
    description: The identified safe operating zone threshold.
    required:
      - max_reduction_pct
      - method
      - p_value_corrected
    properties:
      max_reduction_pct:
        type: number
        minimum: 0
        maximum: 100
        description: Maximum token reduction percentage where error rate ≤ 1%.
      method:
        type: string
        enum: ["bonferroni", "benjamini_hochberg", "bootstrapping"]
        description: Statistical method used to determine the threshold.
      p_value_corrected:
        type: number
        minimum: 0
        maximum: 1
        description: Adjusted p-value after multiple comparison correction.
      significance_level:
        type: number
        default: 0.05
        description: Significance level used for the test.
  
  confidence_interval:
    type: object
    description: 95% Confidence Interval for the safe threshold.
    required:
      - lower_bound
      - upper_bound
      - level
      - n_resamples
    properties:
      lower_bound:
        type: number
        minimum: 0
        maximum: 100
        description: Lower bound of the 95% CI.
      upper_bound:
        type: number
        minimum: 0
        maximum: 100
        description: Upper bound of the 95% CI.
      level:
        type: number
        const: 0.95
        description: Confidence level.
      n_resamples:
        type: integer
        minimum: 1
        description: Number of bootstrap resamples used.
  
  statistics:
    type: object
    description: Additional statistical summary data.
    required:
      - violation_rate_at_threshold
      - n_observations
    properties:
      violation_rate_at_threshold:
        type: number
        minimum: 0
        maximum: 1
        description: Observed violation rate at the calculated safe threshold.
      n_observations:
        type: integer
        minimum: 1
        description: Total number of observations used in the analysis.
      error_margin:
        type: number
        description: Margin of error for the threshold estimate.
  
  metadata:
    type: object
    description: Execution metadata.
    properties:
      script_version:
        type: string
        description: Version of the analysis script used.
      python_version:
        type: string
        description: Python version of the execution environment.
      packages:
        type: object
        description: Versions of key packages (numpy, scipy, statsmodels).
        properties:
          numpy:
            type: string
          scipy:
            type: string
          statsmodels:
            type: string