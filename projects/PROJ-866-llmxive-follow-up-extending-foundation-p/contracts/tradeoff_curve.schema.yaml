$schema: "http://json-schema.org/draft-07/schema#"
title: "TradeOffCurve"
description: "Schema for tradeoff curve CSV rows."
type: "object"
properties:
  reduction_pct:
    type: "number"
    description: "Context reduction percentage."
  error_rate:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Policy violation error rate."
  depth:
    type: "integer"
    minimum: 0
    description: "Compression depth used."
  ci_lower:
    type: "number"
    description: "Lower bound of confidence interval for error rate."
  ci_upper:
    type: "number"
    description: "Upper bound of confidence interval for error rate."
required:
  - reduction_pct
  - error_rate
  - depth
  - ci_lower
  - ci_upper
