$schema: "http://json-schema.org/draft-07/schema#"
title: "Synthetic Workflow Definition"
description: "Schema for a single synthetic workflow DAG generated by the pipeline."
type: object
required:
  - workflow_id
  - version
  - created_at
  - nodes
  - edges
  - metadata
properties:
  workflow_id:
    type: string
    description: "Unique identifier for this workflow instance (UUID)."
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
  version:
    type: string
    description: "Schema version of this workflow definition."
    const: "1.0.0"
  created_at:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of generation."
  nodes:
    type: array
    description: "List of nodes in the DAG."
    minItems: 1
    items:
      type: object
      required:
        - node_id
        - node_type
        - depth
        - complexity
      properties:
        node_id:
          type: string
          description: "Unique identifier for the node within this workflow."
        node_type:
          type: string
          enum:
            - "start"
            - "process"
            - "decision"
            - "end"
          description: "Type of the node."
        depth:
          type: integer
          minimum: 0
          description: "Topological depth of the node (0 = start)."
        complexity:
          type: integer
          minimum: 1
          maximum: 10
          description: "Complexity score of the node (1-10)."
        policy_tags:
          type: array
          description: "Policy tags associated with this node."
          items:
            type: string
        data_requirements:
          type: object
          description: "Data requirements for this node."
          properties:
            sovereignty_level:
              type: string
              enum:
                - "public"
                - "internal"
                - "confidential"
                - "restricted"
            retention_days:
              type: integer
              minimum: 0
  edges:
    type: array
    description: "List of directed edges in the DAG."
    items:
      type: object
      required:
        - source_node_id
        - target_node_id
      properties:
        source_node_id:
          type: string
          description: "ID of the source node."
        target_node_id:
          type: string
          description: "ID of the target node."
        weight:
          type: number
          minimum: 0
          description: "Edge weight (optional, default 1.0)."
  metadata:
    type: object
    required:
      - total_nodes
      - total_edges
      - max_depth
      - complexity_score
      - budget_cap
    properties:
      total_nodes:
        type: integer
        minimum: 1
        description: "Total number of nodes in the graph."
      total_edges:
        type: integer
        minimum: 0
        description: "Total number of edges in the graph."
      max_depth:
        type: integer
        minimum: 0
        description: "Maximum depth of any node in the graph."
      complexity_score:
        type: number
        minimum: 0
        description: "Aggregate complexity score of the workflow."
      budget_cap:
        type: number
        minimum: 0
        description: "Token or compute budget cap for this workflow."
      generator_seed:
        type: integer
        description: "Random seed used for generation (for reproducibility)."
      is_valid:
        type: boolean
        description: "Whether the workflow is structurally valid (DAG)."
additionalProperties: false
