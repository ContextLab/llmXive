type: object
required:
  - id
  - nodes
  - edges
  - metadata
properties:
  id:
    type: string
  nodes:
    type: array
    items:
      type: object
      required:
        - id
        - type
        - constraints
      properties:
        id:
          type: string
        type:
          type: string
        constraints:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              compliant:
                type: boolean
  edges:
    type: array
    items:
      type: object
      properties:
        source:
          type: string
        target:
          type: string
  metadata:
    type: object
    properties:
      depth:
        type: integer
      complexity:
        type: integer
      node_count:
        type: integer
      edge_count:
        type: integer
