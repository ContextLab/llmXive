access_python: "import pm4py, random, uuid\nfrom pm4py.objects.log.obj import EventLog,\
  \ Trace, Event\n\n# Parameters for synthetic generation\nnum_cases = 100\nactivities\
  \ = [\"Start\", \"TaskA\", \"TaskB\", \"End\"]\n\nlog = EventLog()\nfor _ in range(num_cases):\n\
  \    trace = Trace()\n    # Synthetic attributes matching the requested fields\n\
  \    trace.attributes.update({\n        \"workflow_id\": str(uuid.uuid4()),\n  \
  \      \"delegation_depth\": random.randint(1, 5),\n        \"policy_complexity\"\
  : random.randint(1, 10),\n        \"policy_nodes\": random.randint(1, 20),\n   \
  \     \"ground_truth_state\": random.choice([\"state1\", \"state2\"]),\n       \
  \ \"actual_token_reduction_percentage\": round(random.random() * 100, 2)\n    })\n\
  \    for act in activities:\n        ev = Event({\"concept:name\": act})\n     \
  \   trace.append(ev)\n    log.append(trace)\n\n# Count records (events) in the generated\
  \ log\nrecords = sum(len(t) for t in log)\nprint(f\"RECORDS={records}\")\nfields\
  \ = [\"workflow_id\", \"delegation_depth\", \"policy_complexity\", \"policy_nodes\"\
  , \"ground_truth_state\", \"actual_token_reduction_percentage\"]\nprint(\"FIELDS=\"\
  \ + \",\".join(fields))"
