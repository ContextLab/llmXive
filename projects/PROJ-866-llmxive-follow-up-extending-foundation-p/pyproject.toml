[project]
name = "llmXive-project"
version = "0.1.0"
description = "llmXive automated science pipeline"
requires-python = ">=3.10"
dependencies = [
    "networkx",
    "tiktoken",
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "pytest",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.nox
    | \.pants.d
    | \.pytype
    | \.ruff_cache
    | \.svn
    | \.tox
    | \.venv
    | __pypackages__
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | venv
)/
'''
