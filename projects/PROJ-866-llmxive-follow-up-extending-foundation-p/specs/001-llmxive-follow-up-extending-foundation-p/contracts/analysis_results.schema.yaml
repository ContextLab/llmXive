$schema: "http://json-schema.org/draft-07/schema#"
title: "Analysis Results Schema"
description: "Schema for the final trade‑off analysis results (intermediate artifact for code logic)."
type: "object"
required:
  - compression_ratios
  - error_rates
  - regression_coefficients
  - threshold
  - confidence_interval
properties:
  compression_ratios:
    type: "array"
    description: "List of context reduction percentages observed (0‑100)."
    items:
      type: "number"
      minimum: 0
      maximum: 100
  error_rates:
    type: "array"
    description: "Corresponding policy‑violation error rates (0‑1)."
    items:
      type: "number"
      minimum: 0
      maximum: 1
  regression_coefficients:
    type: "object"
    description: "Fitted GEE parameters."
    additionalProperties:
      type: "number"
  threshold:
    type: "number"
    description: "Context reduction percentage where error first exceeds 1 % (rounded to 2 decimal places)."
  confidence_interval:
    type: "array"
    description: "95 % confidence interval for the threshold [lower, upper]."
    items:
      type: "number"
    minItems: 2
    maxItems: 2
  multiple_comparison_correction:
    type: "string"
    description: "Method used for secondary checks (e.g., \"Bonferroni\")."
  sample_size:
    type: "integer"
    description: "Total number of workflow executions analyzed."
  covariates:
    type: "array"
    description: "List of covariates controlled for (e.g., \"delegation_depth\", \"policy_complexity\")."
    items:
      type: "string"