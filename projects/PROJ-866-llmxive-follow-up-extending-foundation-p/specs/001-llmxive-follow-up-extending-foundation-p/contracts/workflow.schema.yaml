$schema: "http://json-schema.org/draft-07/schema#"
title: "Workflow"
description: "Schema for a synthetic multi-agent workflow definition."
type: "object"
properties:
  workflow_id:
    type: "string"
    description: "Unique identifier (UUID)."
  delegation_depth:
    type: "integer"
    minimum: 1
    maximum: 10
    description: "The depth of delegation in the workflow chain."
  policy_complexity:
    type: "integer"
    minimum: 1
    maximum: 20
    description: "Number of policy constraints attached to the workflow."
  nodes:
    type: "array"
    description: "List of policy nodes in the workflow graph."
    items:
      $ref: "#/definitions/PolicyNode"
  edges:
    type: "array"
    description: "List of directed edges (source, target)."
    items:
      type: "array"
      minItems: 2
      maxItems: 2
      items:
        type: "string"
  is_valid:
    type: "boolean"
    description: "True if the workflow is solvable by the Oracle Policy Engine."
required:
  - workflow_id
  - delegation_depth
  - policy_complexity
  - nodes
  - edges
  - is_valid
definitions:
  PolicyNode:
    type: "object"
    properties:
      node_id:
        type: "string"
      type:
        type: "string"
        description: "Type of policy (e.g., 'budget', 'sovereignty')."
      content:
        type: "string"
        description: "Text description of the policy."
      dependencies:
        type: "array"
        items:
          type: "string"
    required:
      - node_id
      - type
      - content
