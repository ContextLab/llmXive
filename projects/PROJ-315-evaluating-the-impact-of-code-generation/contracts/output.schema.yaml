# Output Schema for Statistical Analysis Results
# Defines the structure of statistical outputs generated by the research pipeline.
# Used for validation of analysis results and report generation.

$schema: http://json-schema.org/draft-07/schema#
title: Research Analysis Output
description: |
  Comprehensive output structure for the code generation impact study.
  Contains statistical test results, model diagnostics, and analysis metadata.

type: object
required:
  - metadata
  - statistical_tests
  - regression_analysis
  - power_analysis
  - sensitivity_analysis

properties:
  metadata:
    type: object
    description: Run metadata and provenance information
    required:
      - timestamp
      - seed
      - version
      - dataset_hash
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of analysis execution
      seed:
        type: integer
        description: Random seed used for reproducibility (should be 42)
      version:
        type: string
        description: Pipeline version identifier
      dataset_hash:
        type: string
        pattern: "^[a-f0-9]{64}$"
        description: SHA-256 hash of the processed dataset
      total_records:
        type: integer
        minimum: 0
        description: Total number of records analyzed
      llm_group_size:
        type: integer
        minimum: 0
        description: Number of records classified as LLM-generated
      human_group_size:
        type: integer
        minimum: 0
        description: Number of records classified as human-written

  statistical_tests:
    type: object
    description: Results from Mann-Whitney U tests with multiple comparison correction
    required:
      - test_type
      - correction_method
      - results
    properties:
      test_type:
        type: string
        const: "mann_whitney_u"
        description: Type of statistical test performed
      correction_method:
        type: string
        enum:
          - bonferroni
          - benjamini_hochberg
        description: Multiple comparison correction method applied
      results:
        type: array
        items:
          type: object
          required:
            - metric
            - statistic
            - p_value
            - corrected_p_value
            - significant
          properties:
            metric:
              type: string
              enum:
                - comment_count
                - sentiment_score
                - merge_time_hours
              description: The dependent variable being tested
            statistic:
              type: number
              description: Mann-Whitney U test statistic
            p_value:
              type: number
              minimum: 0
              maximum: 1
              description: Raw p-value from the test
            corrected_p_value:
              type: number
              minimum: 0
              maximum: 1
              description: P-value after multiple comparison correction
            significant:
              type: boolean
              description: Whether the result is significant at alpha=0.05 after correction
            effect_size:
              type: number
              minimum: 0
              maximum: 1
              description: Calculated effect size (e.g., r = Z/sqrt(N))
            interpretation:
              type: string
              description: Associational interpretation of the result (non-causal)

  regression_analysis:
    type: object
    description: Linear regression results with VIF diagnostics for multicollinearity
    required:
      - model_specification
      - coefficients
      - diagnostics
    properties:
      model_specification:
        type: object
        required:
          - dependent_variable
          - independent_variables
        properties:
          dependent_variable:
            type: string
            description: The outcome variable (e.g., comment_count)
          independent_variables:
            type: array
            items:
              type: string
            description: List of predictors including group indicator and covariates
      coefficients:
        type: array
        items:
          type: object
          required:
            - variable
            - coefficient
            - std_error
            - p_value
            - confidence_interval
          properties:
            variable:
              type: string
              description: Name of the predictor variable
            coefficient:
              type: number
              description: Estimated regression coefficient
            std_error:
              type: number
              description: Standard error of the coefficient
            p_value:
              type: number
              minimum: 0
              maximum: 1
              description: P-value for the coefficient
            confidence_interval:
              type: object
              required:
                - lower
                - upper
              properties:
                lower:
                  type: number
                upper:
                  type: number
              description: 95% confidence interval for the coefficient
      diagnostics:
        type: object
        required:
          - vif_scores
          - r_squared
          - adjusted_r_squared
          - f_statistic
          - multicollinearity_status
        properties:
          vif_scores:
            type: object
            description: Variance Inflation Factor for each predictor
            additionalProperties:
              type: number
              minimum: 1
          r_squared:
            type: number
            minimum: 0
            maximum: 1
            description: Coefficient of determination
          adjusted_r_squared:
            type: number
            minimum: 0
            maximum: 1
            description: Adjusted R-squared accounting for model complexity
          f_statistic:
            type: number
            description: Overall F-statistic for the model
          f_statistic_p_value:
            type: number
            minimum: 0
            maximum: 1
            description: P-value for the F-statistic
          multicollinearity_status:
            type: string
            enum:
              - none
              - moderate
              - severe
            description: Assessment based on VIF thresholds (VIF < 5: none, 5-10: moderate, > 10: severe)
          interpretation:
            type: string
            description: Associational interpretation with mediator bias caveat

  power_analysis:
    type: object
    description: Post-hoc power analysis results
    required:
      - alpha
      - power
      - effect_size_detected
      - sample_sizes
    properties:
      alpha:
        type: number
        const: 0.05
        description: Significance level used
      power:
        type: number
        minimum: 0
        maximum: 1
        description: Calculated statistical power for the detected effect
      effect_size_detected:
        type: number
        description: Effect size (Cohen's d) observed in the data
      sample_sizes:
        type: object
        required:
          - llm_group
          - human_group
        properties:
          llm_group:
            type: integer
            minimum: 0
          human_group:
            type: integer
            minimum: 0
      minimum_detectable_effect:
        type: number
        description: Minimum effect size detectable with current sample size at 80% power
      power_adequate:
        type: boolean
        description: Whether power >= 0.80

  sensitivity_analysis:
    type: object
    description: Results from keyword threshold sensitivity analysis
    required:
      - threshold_range
      - results
    properties:
      threshold_range:
        type: object
        required:
          - min
          - max
          - step
        properties:
          min:
            type: integer
            minimum: 1
          max:
            type: integer
            minimum: 1
          step:
            type: integer
            minimum: 1
        description: Range of keyword thresholds tested
      results:
        type: array
        items:
          type: object
          required:
            - threshold
            - llm_count
            - human_count
            - p_value_comment_count
            - p_value_sentiment
            - p_value_merge_time
          properties:
            threshold:
              type: integer
              description: Keyword threshold used for classification
            llm_count:
              type: integer
              description: Number of PRs classified as LLM-generated at this threshold
            human_count:
              type: integer
              description: Number of PRs classified as human-written at this threshold
            p_value_comment_count:
              type: number
              minimum: 0
              maximum: 1
            p_value_sentiment:
              type: number
              minimum: 0
              maximum: 1
            p_value_merge_time:
              type: number
              minimum: 0
              maximum: 1
        description: Sensitivity results across different thresholds

  audit_results:
    type: object
    description: Manual audit accuracy results (if available)
    required:
      - sample_size
      - accuracy
      - precision
      - recall
      - f1_score
    properties:
      sample_size:
        type: integer
        minimum: 1
      accuracy:
        type: number
        minimum: 0
        maximum: 1
      precision:
        type: number
        minimum: 0
        maximum: 1
      recall:
        type: number
        minimum: 0
        maximum: 1
      f1_score:
        type: number
        minimum: 0
        maximum: 1
      confusion_matrix:
        type: object
        required:
          - true_positive
          - true_negative
          - false_positive
          - false_negative
        properties:
          true_positive:
            type: integer
          true_negative:
            type: integer
          false_positive:
            type: integer
          false_negative:
            type: integer
      interpretation:
        type: string
        description: Nuanced discussion of heuristic limitations

additionalProperties: false