$schema: http://json-schema.org/draft-07/schema#
title: Output Schemas
description: Collection of JSON schemas for analysis outputs required by the project.
type: object
additionalProperties: false
properties:
  mann_whitney_u:
    type: object
    description: Schema for Mann-Whitney U test results.
    required:
      - statistic
      - pvalue
      - method
    additionalProperties: false
    properties:
      statistic:
        type: number
        description: The Mann-Whitney U test statistic.
      pvalue:
        type: number
        description: The p-value associated with the test.
      method:
        type: string
        description: Name of the statistical method (e.g., "Mann-Whitney U").
  vif_diagnostics:
    type: object
    description: Schema for VIF (Variance Inflation Factor) diagnostics.
    required:
      - predictor
      - vif_score
    additionalProperties: false
    properties:
      predictor:
        type: string
        description: Name of the predictor variable.
      vif_score:
        type: number
        description: VIF score for the predictor.
  power_analysis:
    type: object
    description: Schema for power analysis results.
    required:
      - sample_size
      - min_detectable_effect
    additionalProperties: false
    properties:
      sample_size:
        type: integer
        description: Total sample size used in the power analysis.
      min_detectable_effect:
        type: number
        description: Minimum detectable effect size at the specified power level.
  error_report:
    type: object
    description: Schema for generic error reports.
    required:
      - error_code
      - observed_counts
    additionalProperties: false
    properties:
      error_code:
        type: string
        description: Identifier for the error type (e.g., "POWER_INSUFFICIENCY").
      observed_counts:
        type: object
        description: Mapping of observed count metrics related to the error.
        additionalProperties:
          type: integer
          description: Count value for a given metric.