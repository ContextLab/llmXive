# Schema for statistical results output
type: object
properties:
  mann_whitney_u_statistic:
    type: number
    description: The Mann-Whitney U statistic.
  mann_whitney_p_value:
    type: number
    description: The p-value for the Mann-Whitney U test.
  regression_r_squared:
    type: number
    description: The R-squared value from the linear regression.
  regression_vif:
    type: number
    description: The Variance Inflation Factor from the linear regression.
  power_analysis_effect_size:
    type: number
    description: The effect size for the power analysis.
  power_analysis_power:
    type: number
    description: The power of the test.
  audit_accuracy:
    type: number
    description: The accuracy of the classification against human labels.
required:
  - mann_whitney_u_statistic
  - mann_whitney_p_value
  - regression_r_squared
  - regression_vif
  - power_analysis_effect_size
  - power_analysis_power
  - audit_accuracy