name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Install core dependencies explicitly if not in requirements.txt yet
        pip install numpy pandas scipy pyarrow

    - name: Create directory structure
      run: |
        mkdir -p src/data src/features src/models src/utils
        mkdir -p data/raw data/processed data/interim
        mkdir -p tests/contract tests/unit tests/integration
        mkdir -p specs

    - name: Run Contract Tests (Schemas)
      run: |
        pytest tests/contract/test_schemas.py -v

    - name: Run Contract Tests (Constraints)
      run: |
        pytest tests/contract/test_constraints.py -v

    - name: Run Reference Validator
      run: |
        # Assuming a reference validator script exists or is part of the test suite
        # If specific validator script is T006/T007 related, run those tests again as validation
        pytest tests/contract/ -v --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          .pytest_cache/
          test-reports/
          coverage.xml
        retention-days: 7