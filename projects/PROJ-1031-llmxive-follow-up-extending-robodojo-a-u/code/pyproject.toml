[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-robodojo"
version = "0.1.0"
description = "Extending RoboDojo with Symbolic Abstractions"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "scikit-learn",
    "networkx",
    "pandas",
    "datasets",
    "opencv-python",
    "pyyaml",
    "ruff",
    "black",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "scripts"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code/src", "code/scripts"]
addopts = "-v --tb=short"
