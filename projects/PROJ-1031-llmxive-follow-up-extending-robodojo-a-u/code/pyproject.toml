[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robodojo-symbolic"
version = "0.1.0"
description = "Extending RoboDojo with Symbolic Abstractions"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "scikit-learn",
    "networkx",
    "pandas",
    "datasets",
    "opencv-python",
    "pyyaml",
    "jsonschema",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = []
target-version = "py311"
line-length = 88

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
