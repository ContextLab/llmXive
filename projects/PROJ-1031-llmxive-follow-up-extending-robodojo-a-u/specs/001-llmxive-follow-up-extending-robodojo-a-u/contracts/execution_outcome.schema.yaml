$schema: http://json-schema.org/draft-07/schema#
title: ExecutionOutcome
description: Schema for execution outcome validation as defined in T005b.
type: object
properties:
  task_id:
    type: string
    description: Unique identifier for the task.
  success:
    type: boolean
    description: Whether the task execution was successful.
  failure_mode:
    type: ["string", "null"]
    description: The mode of failure if success is false.
    enum:
      - "Planner Infeasibility"
      - "Controller Execution Failure"
      - "Hardware Error"
      - "Timeout"
      - null
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the execution outcome.
required:
  - task_id
  - success
  - failure_mode
  - timestamp
