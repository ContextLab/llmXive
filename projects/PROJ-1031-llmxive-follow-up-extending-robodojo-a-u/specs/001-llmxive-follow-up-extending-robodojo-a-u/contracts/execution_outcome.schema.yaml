$schema: "http://json-schema.org/draft-07/schema#"
title: ExecutionOutcome
description: >
  Schema defining the outcome of a symbolic action sequence execution on a physical robot.
  Includes success status, failure classification, and temporal metadata.
type: object
required:
  - task_id
  - success
  - failure_mode
  - timestamp
properties:
  task_id:
    type: string
    description: Unique identifier for the executed task.
  success:
    type: boolean
    description: Whether the task was completed successfully.
  failure_mode:
    type: string
    description: >
      Classification of the failure mode if success is false.
      Allowed values are defined by the system's error taxonomy.
    enum:
      - "Planner Infeasibility"
      - "Controller Execution Failure"
      - "Hardware Error"
      - "Timeout"
      - "None"
    default: "None"
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 formatted timestamp of the execution completion.
additionalProperties: false