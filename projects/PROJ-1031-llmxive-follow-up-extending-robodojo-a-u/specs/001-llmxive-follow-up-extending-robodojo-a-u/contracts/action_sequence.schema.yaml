$schema: "http://json-schema.org/draft-07/schema#"
title: "ActionSequence"
description: "Ordered list of discrete sub-goals generated by the symbolic planner."
type: "object"
properties:
  sequence_id:
    type: "string"
    description: "Unique identifier for the sequence."
  task_id:
    type: "string"
    description: "Reference to the task specification."
  steps:
    type: "array"
    items:
      type: "object"
      properties:
        action:
          type: "string"
          description: "Name of the action."
        target_state_id:
          type: "string"
          description: "Reference to the target state."
      required:
        - action
        - target_state_id
  planner_type:
    type: "string"
    enum:
      - "A*"
      - "MCTS"
    description: "Algorithm used for planning."
  planning_time_ms:
    type: "number"
    description: "Time taken to generate the sequence in milliseconds."
  graph_type:
    type: "string"
    description: "The type of graph used for this sequence (for ablation)."
required:
  - sequence_id
  - task_id
  - steps
  - planner_type
  - planning_time_ms
  - graph_type
additionalProperties: false