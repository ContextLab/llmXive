$schema: "http://json-schema.org/draft-07/schema#"
title: SymbolicState
description: >
  Schema for the symbolic state representation used in the RoboDojo extension.
  This state captures discrete predicates, affordances, connectivity, and replanning capabilities.
type: object
properties:
  state_id:
    type: string
    description: Unique identifier for this symbolic state instance.
  predicates:
    type: array
    description: List of logical predicates true in the current state.
    items:
      type: string
  affordances:
    type: object
    description: >
      Dictionary mapping object identifiers to their available affordances.
      Keys are object IDs (string), values are lists of action strings.
    additionalProperties:
      type: array
      items:
        type: string
  connectivity:
    type: array
    description: List of connectivity graph edges or neighbors for the current state.
    items:
      type: string
  replan_support:
    type: boolean
    description: >
      Flag indicating whether the current state/task supports dynamic replanning
      based on execution feedback.
required:
  - state_id
  - predicates
  - affordances
  - connectivity
  - replan_support
additionalProperties: false