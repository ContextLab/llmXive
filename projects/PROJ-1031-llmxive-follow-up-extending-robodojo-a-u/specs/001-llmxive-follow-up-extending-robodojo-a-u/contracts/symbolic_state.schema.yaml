$schema: "http://json-schema.org/draft-07/schema#"
title: "SymbolicState"
description: "Schema for the symbolic state representation used in the RoboDojo extension."
type: "object"
properties:
  state_id:
    type: "string"
    description: "Unique identifier for the symbolic state."
  predicates:
    type: "array"
    description: "List of boolean predicates describing the current state."
    items:
      type: "string"
  affordances:
    type: "object"
    description: "Dictionary mapping object identifiers to lists of available actions (affordances)."
    additionalProperties:
      type: "array"
      items:
        type: "string"
  connectivity:
    type: "array"
    description: "List of state IDs that are reachable from this state."
    items:
      type: "string"
  replan_support:
    type: "boolean"
    description: "Flag indicating if this state supports replanning logic."
required:
  - "state_id"
  - "predicates"
  - "affordances"
  - "connectivity"
  - "replan_support"
