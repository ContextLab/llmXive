$schema: "http://json-schema.org/draft-07/schema#"
title: SymbolicState
description: Schema for the symbolic state representation used in the RoboDojo planner.
type: object
properties:
  state_id:
    type: string
    description: Unique identifier for the state.
  predicates:
    type: array
    items:
      type: string
    description: List of active logical predicates in this state.
  affordances:
    type: object
    additionalProperties:
      type: array
      items:
        type: string
    description: Mapping from object identifiers to lists of available actions (affordances).
  connectivity:
    type: array
    items:
      type: string
    description: List of state IDs that are directly reachable from this state.
  replan_support:
    type: boolean
    description: Flag indicating whether this state supports dynamic replanning.
required:
  - state_id
  - predicates
  - affordances
  - connectivity
  - replan_support
