$schema: "http://json-schema.org/draft-07/schema#"
title: "SymbolicState"
description: "Discrete state in PDDL-like format representing object affordances and connectivity."
type: "object"
properties:
  state_id:
    type: "string"
    description: "Unique identifier for the state."
  task_id:
    type: "string"
    description: "Reference to the task specification."
  predicates:
    type: "array"
    items:
      type: "string"
    description: "List of logical predicates (e.g., 'Graspable(A)', 'On(A, B)')."
  affordances:
    type: "array"
    items:
      type: "string"
    description: "List of available actions for objects in this state."
  connectivity_graph:
    type: "object"
    description: "Adjacency list representation of object connectivity."
    additionalProperties:
      type: "array"
      items:
        type: "string"
  graph_type:
    type: "string"
    description: "The type of graph used for this state (for ablation)."
required:
  - state_id
  - task_id
  - predicates
  - affordances
  - connectivity_graph
  - graph_type
additionalProperties: false