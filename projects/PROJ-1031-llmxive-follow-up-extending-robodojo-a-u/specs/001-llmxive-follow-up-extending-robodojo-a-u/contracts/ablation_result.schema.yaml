$schema: "http://json-schema.org/draft-07/schema#"
title: "AblationResult"
description: "Schema for ablation study results comparing different graph representations."
type: "object"
properties:
  graph_type:
    type: "string"
    description: "Type of graph used in the ablation (e.g., 'Full Affordance Graph', 'Simplified Connectivity Graph')."
  success_rate:
    type: "number"
    description: "Success rate of the planner/executor with this graph type."
    minimum: 0.0
    maximum: 1.0
  compute_overhead:
    type: "number"
    description: "Compute overhead (e.g., time or cycles) introduced by this graph type."
required:
  - "graph_type"
  - "success_rate"
  - "compute_overhead"
additionalProperties: false
