$schema: "http://json-schema.org/draft-07/schema#"
title: ComputeMetric
description: Schema for tracking computational resource usage per task execution.
type: object
required:
  - task_id
  - cpu_cycles
  - ram_mb
  - wall_clock_s
properties:
  task_id:
    type: string
    description: Unique identifier for the task instance being measured.
  cpu_cycles:
    type: integer
    minimum: 0
    description: Estimated CPU cycles consumed during task execution.
  ram_mb:
    type: number
    minimum: 0.0
    description: Peak RAM usage in Megabytes during task execution.
  wall_clock_s:
    type: number
    minimum: 0.0
    description: Total elapsed wall-clock time in seconds for task execution.
additionalProperties: false