$schema: "http://json-schema.org/draft-07/schema#"
title: ComputeMetric
description: "Schema for CPU tractability metrics collected during symbolic planner execution."
type: object
properties:
  task_id:
    type: string
    description: "Unique identifier for the task being measured."
  cpu_cycles:
    type: integer
    description: "Estimated CPU cycles consumed during planning."
    minimum: 0
  ram_mb:
    type: number
    description: "Peak RAM usage in megabytes during planning."
    minimum: 0.0
  wall_clock_s:
    type: number
    description: "Total wall-clock time in seconds for planning."
    minimum: 0.0
required:
  - task_id
  - cpu_cycles
  - ram_mb
  - wall_clock_s
additionalProperties: false
