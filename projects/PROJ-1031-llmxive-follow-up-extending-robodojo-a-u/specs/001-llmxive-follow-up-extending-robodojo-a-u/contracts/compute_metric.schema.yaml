$schema: http://json-schema.org/draft-07/schema#
title: ComputeMetric
description: Metrics regarding computational resources used for a specific task execution.
type: object
properties:
  task_id:
    type: string
    description: Unique identifier for the task.
  cpu_cycles:
    type: integer
    description: Number of CPU cycles consumed.
    minimum: 0
  ram_mb:
    type: number
    description: RAM usage in Megabytes.
    minimum: 0
  wall_clock_s:
    type: number
    description: Wall-clock time in seconds.
    minimum: 0
required:
  - task_id
  - cpu_cycles
  - ram_mb
  - wall_clock_s
additionalProperties: false