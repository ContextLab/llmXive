  r: "`code/config.py` exists and defines SEED, CPU/memory limits and a function to\
    \ load task IDs, but it imports `from src.data_loader import stream_robodojo_tasks`\
    \ which cannot resolve because the `src` package lives under `code/` (there is\
    \ no top\u2011level `src` directory or `code/__init__.py`). Consequently importing\
    \ `code.config` would raise an ImportError, so the required `TASK_IDS` list would\
    \ not be created and the verification command cannot succeed. The task therefore\
    \ lacks a working configuration module."
  sig: 884039316d9aa6e5b0f494d57f5961d041c6b5c2911ba1865431e0bcd278fc77
