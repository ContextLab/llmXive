$schema: "http://json-schema.org/draft-07/schema#"
title: "PromptVariant"
description: "Schema for a generated prompt variant with complexity metadata."
type: "object"
properties:
  variant_id:
    type: "string"
    description: "Unique identifier for the variant."
  problem_id:
    type: "string"
    description: "Reference to the HumanEval problem."
  complexity_level:
    type: "string"
    enum:
      - "simple"
      - "moderate"
      - "complex"
      - "very_complex"
      - "degenerate"
    description: "The structural complexity tier."
  prompt_text:
    type: "string"
    description: "The full text of the prompt."
  token_count:
    type: "integer"
    minimum: 0
    description: "Number of tokens using tiktoken cl100k_base."
  structural_elements:
    type: "integer"
    minimum: 0
    description: "Count of structural elements (examples, constraints, etc.)."
required:
  - variant_id
  - problem_id
  - complexity_level
  - prompt_text
  - token_count
  - structural_elements