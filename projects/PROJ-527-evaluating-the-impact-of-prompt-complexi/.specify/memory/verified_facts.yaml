'|complexity cyclomatic defined mccabe':
  quote: Essential complexity is a numerical measure defined by Thomas J. McCabe,
    Sr., in his highly cited, 1976 paper better known for introducing cyclomatic complexity.
    McCabe defined essential complexity as the cyclomatic complexity of the reduced
    CFG (control-flow graph) after iteratively replacing (reducing) all structured
    programming control structures, i.e. those having a single entry point and a single
    exit point (for example if-then-else and while loops) with placeholder single
    statements.
  source_id: Essential complexity
  url: https://en.wikipedia.org/wiki/Essential_complexity
  value: Thomas J. McCabe, Sr.
