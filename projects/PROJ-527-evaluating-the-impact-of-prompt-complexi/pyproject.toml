[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-prompt-complexity"
version = "0.1.0"
description = "Evaluating the impact of prompt complexity on LLM code generation performance"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "tiktoken",
    "scikit-learn",
    "statsmodels",
    "pandas",
    "ruff",
    "requests",
    "pyyaml",
]

[tool.ruff]
# Line length matching Black
line-length = 100
target-version = "py311"

# Enable specific rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter if needed, but ruff enforces line-length)
    "B008",   # Do not perform function call in argument defaults (common in dataclasses)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]  # Allow assert in tests

[tool.ruff.isort]
known-first-party = ["analysis", "config", "data", "execution", "llm", "models", "prompts", "utils"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]