[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "C901", # too complex
]

[lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["S101", "B011"]

[lint.isort]
known-first-party = ["code"]
force-sort-within-sections = true
