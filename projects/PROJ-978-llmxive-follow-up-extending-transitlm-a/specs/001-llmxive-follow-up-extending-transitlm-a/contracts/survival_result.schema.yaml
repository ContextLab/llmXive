$schema: http://json-schema.org/draft-07/schema#
title: Survival Analysis Result Schema
description: Schema for the output of the Kaplan-Meier survival analysis.
type: object
properties:
  model_name:
    type: string
    description: "Name of the model being evaluated."
  category:
    type: string
    enum: ["short-haul", "medium-haul", "long-haul"]
    description: "Stratification category based on route length."
  survival_probabilities:
    type: array
    items:
      type: number
    description: "Survival probability at each step."
  median_survival_length:
    type: number
    description: "Number of stops at which validity drops to [deferred]."
  log_rank_p_value:
    type: number
    minimum: 0
    maximum: 1
    description: "P-value from the log-rank test."
  adjusted_p_value:
    type: number
    minimum: 0
    maximum: 1
    description: "P-value after Bonferroni correction."
  censoring_count:
    type: integer
    description: "Number of censored observations (completed routes)."
required:
  - model_name
  - category
  - survival_probabilities
  - median_survival_length
  - log_rank_p_value
  - adjusted_p_value
  - censoring_count
additionalProperties: false