$schema: http://json-schema.org/draft-07/schema#
title: Model Output Schema
description: Schema for the predictions generated by the lightweight model.
type: object
properties:
  route_id:
    type: string
    description: "Reference to the route being predicted."
  context_stops:
    type: array
    items:
      type: string
    description: "List of previous stops used as context."
  retrieved_neighbors:
    type: array
    items:
      type: string
    description: "List of neighbor station IDs retrieved from the adjacency graph."
  predicted_station:
    type: string
    description: "The predicted next station ID."
  confidence:
    type: number
    minimum: 0
    maximum: 1
    description: "Confidence score of the prediction."
  is_valid:
    type: boolean
    description: "Whether the prediction matches the ground truth."
  error_hop:
    type:
      - "integer"
      - "null"
    description: "Hop count at which the first error occurred, or null if valid."
required:
  - route_id
  - context_stops
  - retrieved_neighbors
  - predicted_station
  - confidence
  - is_valid
  - error_hop
additionalProperties: false