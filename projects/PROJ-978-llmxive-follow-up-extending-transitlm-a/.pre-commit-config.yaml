repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        # Using ruff-format as a faster alternative to black if preferred,
        # but we keep black hook above for explicit black enforcement.
        # If ruff-format is used, remove the black hook above.
        # For now, we keep both to ensure compatibility if ruff-format is not desired.
        # args: [--diff] # Uncomment to run in diff mode during CI
