# This file is a legacy config file for ruff.
# Modern configuration is handled in pyproject.toml under [tool.ruff].
# This file is kept for backward compatibility if tools expect it.
line-length = 88
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "I", "N", "UP"]
ignore = []

[lint.per-file-ignores]
"**/*.py" = ["E501"]
