[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-transitlm-a"
version = "0.1.0"
description = "Extension of TransitLM: Map-Free Transit Routing Benchmark"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "pandas",
    "networkx",
    "scikit-learn",
    "lifelines",
    "transformers",
    "pytest",
    "torch",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (black takes care of this)
    "B006", # mutable default arguments (common in ML code)
    "B008", # function calls in default arguments (common in ML code)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.isort]
known-first-party = ["code"]
known-third-party = ["datasets", "pandas", "networkx", "sklearn", "lifelines", "transformers", "pytest", "torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
