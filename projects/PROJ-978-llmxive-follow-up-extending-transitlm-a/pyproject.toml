[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-transitlm"
version = "0.1.0"
description = "Extended TransitLM: Map-Free Transit Route Prediction Benchmark"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "pandas",
    "networkx",
    "scikit-learn",
    "lifelines",
    "transformers",
    "pytest",
    "torch",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (black handles this)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = [
    "code",
    "analysis",
    "data",
    "models",
    "config",
    "setup_linting",
    "setup_project"
]
force-sort-within-sections = true
order-by-type = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
