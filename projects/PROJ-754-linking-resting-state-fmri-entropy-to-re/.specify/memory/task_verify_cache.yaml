T004:
  c: false
  h: c6514fea8c24f24f35019bf00e5c5277b7cb6cb69d625c4eb60f735cde0a176a
  r: "The repository contains `code/src/analysis/entropy.py` with a `multiscale_entropy`\
    \ implementation, but the required output artifacts are absent or incorrect: `data/derived/entropy_matrix.parquet`\
    \ and `data/derived/entropy_metadata.json` do not exist, and `data/derived/invalid_parcels.csv`\
    \ is never created (the code only writes a single `parcel_id` column, not the\
    \ required `subject_id`, `parcel_id`, `reason`). Consequently the task\u2019s\
    \ specifications for writing the parquet matrix, metadata JSON, and detailed invalid\u2011\
    parcel log are not satisfied."
  sig: c8b36f37aab02c05f3c894ba58c91cad9b1156855f2d0706247d7cd8f69ae633
T005:
  c: false
  h: 6b61390a60d812f0c8142f2817988326ddb809c4d45722ae304d3d8272396f11
  r: "The `results/` directory is empty \u2013 both `entropy_matrix.parquet` and `covariates.parquet`\
    \ are missing, as is the source `data/derived/entropy_matrix.parquet`. The pipeline\
    \ cannot be imported (unit test error `ModuleNotFoundError: No module named 'src.config'`),\
    \ and the only successful run shown is a dry\u2011run that prints \u201CPipeline\
    \ completed (dry\u2011run)\u201D. No evidence of actual processing, batching \u2264\
    \u202F50 parcels, RAM\u2011usage logging, or a log line ending with \u201CCompleted\
    \ 5 subjects, 400 parcels\u201D is provided. The required result files with the\
    \ correct columns are therefore not produced."
