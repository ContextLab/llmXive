[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-754"
version = "0.1.0"
description = "Linking Resting-State fMRI Entropy to Real-World Decision Risk-Taking"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "nibabel",
    "pyentropy",
    "statsmodels",
    "nilearn",
    "scikit-learn",
    "tqdm",
    "linearmodels",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (common in data pipelines)
]

[tool.ruff.per-file-ignores]
"code/tests/*" = ["S101"] # Allow assertions in tests

[tool.ruff.isort]
known-first-party = ["config", "data", "analysis", "stats", "utils", "entities", "scripts"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-v --tb=short"