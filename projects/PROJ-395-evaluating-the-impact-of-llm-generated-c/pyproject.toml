[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-395"
version = "0.1.0"
description = "Evaluating the Impact of LLM-Generated Code on Memory Usage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "datasets",
    "memory-profiler",
    "scikit-learn",
    "statsmodels",
    "lifelines",
    "networkx",
    "pandas",
    "numpy",
    "ruff",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
# Use the same line length as Black
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Extend the selection from the .ruff.toml if needed, but we prefer the dedicated file
# This block is kept minimal to avoid conflict with .ruff.toml
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
