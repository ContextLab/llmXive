# Pyproject configuration – includes Black formatting settings
[tool.black]
# Target Python version
target-version = ["py311"]
# Line length consistent with Ruff and Flake8
line-length = 88
# Do not change string quotes (Black will keep existing style)
skip-string-normalization = false
# Enable preview mode for any future Black features
preview = false

# Optional: add a minimal build system section so tools recognize this as a pyproject
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"