[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-proj-395"
version = "0.1.0"
description = "Evaluating the Impact of LLM-Generated Code on Memory Usage"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "memory-profiler>=0.61.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.1",
    "lifelines>=0.29.0",
    "networkx>=3.2.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # assert allowed in tests

[tool.ruff.isort]
known-first-party = ["code", "tests"]
force-sort-within-sections = true
