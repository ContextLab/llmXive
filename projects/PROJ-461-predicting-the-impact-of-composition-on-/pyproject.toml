[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mg-density-predict"
version = "0.1.0"
description = "Predicting the Impact of Composition on the Density of Metallic Glasses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "mendeleev==1.0.0",
    "shap>=0.44.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "requests>=2.31.0",
    "pytest>=7.4.0",
    "pyyaml>=6.0",
    "jsonschema>=4.19.0",
]

[project.scripts]
mg-density-predict = "code.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
# Inherit settings from .ruff.toml if needed, or duplicate here for IDE support
line-length = 88
target-version = "py310"