[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mg-density-predict"
version = "0.1.0"
description = "Predicting the Impact of Composition on the Density of Metallic Glasses"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "llmXive Team", email = "team@llmxive.research"}
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "mendeleev==1.0.0",
    "shap>=0.42.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "requests>=2.31.0",
    "pytest>=7.4.0",
    "pyyaml>=6.0",
    "jsonschema>=4.19.0",
]

[project.scripts]
mg-density-predict = "code.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
# Note: Ruff configuration has been moved to .ruff.toml for cleaner separation
# This section is kept minimal to avoid conflicts if both files exist
line-length = 88
target-version = "py310"