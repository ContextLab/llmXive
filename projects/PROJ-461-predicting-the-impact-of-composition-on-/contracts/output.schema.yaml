$schema: http://json-schema.org/draft-07/schema#
title: General Output Schema
description: Schema for validating general pipeline output artifacts.
type: object
required:
  - status
  - timestamp
properties:
  status:
    type: string
    enum:
      - success
      - failure
      - partial
    description: Execution status of the pipeline step.
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of execution.
  message:
    type: string
    description: Optional status message or error details.
  data_path:
    type: string
    description: Path to the generated data file if applicable.
  metrics:
    type: object
    description: Optional metrics object.
additionalProperties: true
