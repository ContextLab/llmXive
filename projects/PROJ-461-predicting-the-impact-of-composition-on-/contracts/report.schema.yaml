$schema: http://json-schema.org/draft-07/schema#
title: Metallic Glass Density Prediction Report Schema
description: |
  Schema defining the structure of the analysis report artifacts generated by the pipeline.
  This includes metrics, sensitivity analysis, and metadata about the report generation.
type: object
required:
  - report_metadata
  - metrics
  - plots
properties:
  report_metadata:
    type: object
    description: Metadata about the report generation.
    required:
      - generated_at
      - pipeline_version
      - data_source
    properties:
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of report generation.
      pipeline_version:
        type: string
        description: Version of the pipeline that generated this report.
      data_source:
        type: string
        description: Source of the data used (e.g., 'Zenodo', 'Synthetic').
      total_samples:
        type: integer
        minimum: 0
        description: Total number of samples in the dataset.

  metrics:
    type: object
    description: Model performance metrics.
    required:
      - model_mae
      - model_r2
      - baseline_linear_mae
      - baseline_mass_only_mae
    properties:
      model_mae:
        type: number
        description: Mean Absolute Error of the main LightGBM model.
      model_r2:
        type: number
        description: R-squared score of the main model.
      baseline_linear_mae:
        type: number
        description: MAE of the Linear Mixing Rule baseline.
      baseline_mass_only_mae:
        type: number
        description: MAE of the Mass-Only baseline model.
      statistical_significance:
        type: boolean
        description: Whether the model improvement is statistically significant (p < 0.05).
      p_value:
        type: number
        description: P-value from the paired t-test (if applicable).

  plots:
    type: object
    description: Metadata about generated plots (file paths and descriptions).
    required:
      - predicted_vs_actual
      - shap_summary
    properties:
      predicted_vs_actual:
        type: object
        properties:
          path:
            type: string
            description: Relative path to the scatter plot image.
          description:
            type: string
            description: Description of the plot.
      shap_summary:
        type: object
        properties:
          path:
            type: string
            description: Relative path to the SHAP summary plot.
          description:
            type: string
            description: Description of the plot.
      pdp_radius_mismatch:
        type: object
        nullable: true
        description: Partial Dependence Plot for radius mismatch (only if MAE > 0.1).
        properties:
          path:
            type: string
          description:
            type: string

  sensitivity_analysis:
    type: object
    description: Results of the sensitivity analysis on the target variable.
    properties:
      noise_magnitudes:
        type: array
        items:
          type: number
        description: List of noise magnitudes tested.
      mae_variances:
        type: array
        items:
          type: number
        description: Corresponding MAE variances for each noise magnitude.
      conclusion:
        type: string
        description: Summary conclusion about model robustness.

additionalProperties: false
