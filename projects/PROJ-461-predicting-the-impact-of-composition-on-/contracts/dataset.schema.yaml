$schema: http://json-schema.org/draft-07/schema#
title: Metallic Glass Composition and Density Dataset
description: Schema for the clean metallic glass dataset containing composition and density data.
type: object
required:
  - composition
  - density
properties:
  composition:
    type: string
    description: "String representation of elemental composition (e.g., 'Zr41.2Ti13.8Cu12.5Ni10Be22.5' or JSON string)."
    minLength: 1
  density:
    type: number
    description: "Density of the metallic glass in g/cm³."
    minimum: 0
    nullable: false
  mean_atomic_mass:
    type: number
    description: "Mean atomic mass of the alloy."
    nullable: true
  mean_atomic_radius:
    type: number
    description: "Mean atomic radius of the alloy."
    nullable: true
  electronegativity_variance:
    type: number
    description: "Variance of electronegativity in the alloy."
    nullable: true
  atomic_radius_mismatch:
    type: number
    description: "Atomic radius mismatch parameter."
    nullable: true
  packing_efficiency:
    type: number
    description: "Packing efficiency proxy."
    nullable: true
  rho_baseline:
    type: number
    description: "Baseline density from linear mixing rule."
    nullable: true
  rho_residual:
    type: number
    description: "Residual density (actual - baseline)."
    nullable: true
  dominant_element:
    type: string
    description: "Element with the highest mass fraction."
    nullable: true
additionalProperties: true
