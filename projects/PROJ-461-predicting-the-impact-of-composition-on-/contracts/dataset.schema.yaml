$schema: http://json-schema.org/draft-07/schema#
title: Metallic Glass Dataset Schema
description: Schema for the cleaned metallic glass dataset used in density prediction.
type: object
required:
  - composition
  - density
properties:
  composition:
    type: string
    description: JSON string representation of the elemental composition (e.g., '{"Zr": 0.6, "Cu": 0.4}').
    nullable: false
  density:
    type: number
    description: Density of the metallic glass in g/cm³.
    nullable: false
  mean_atomic_mass:
    type: number
    description: Mean atomic mass of the composition.
    nullable: true
  mean_atomic_radius:
    type: number
    description: Mean atomic radius of the composition.
    nullable: true
  electronegativity_variance:
    type: number
    description: Variance of electronegativity values.
    nullable: true
  atomic_radius_mismatch:
    type: number
    description: Atomic radius mismatch parameter.
    nullable: true
  packing_efficiency:
    type: number
    description: Packing efficiency proxy.
    nullable: true
  rho_baseline:
    type: number
    description: Baseline density calculated via linear mixing rule.
    nullable: true
  rho_residual:
    type: number
    description: Residual density (actual - baseline).
    nullable: true
  dominant_element:
    type: string
    description: Element with the highest mass fraction.
    nullable: true
additionalProperties: false
