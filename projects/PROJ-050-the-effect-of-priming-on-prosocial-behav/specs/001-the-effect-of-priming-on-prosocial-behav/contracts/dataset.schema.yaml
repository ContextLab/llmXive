$schema: http://json-schema.org/draft-07/schema#
title: Anonymized Reddit Comments Dataset
description: "Schema for the processed anonymized dataset used in the priming study."
type: object
properties:
  comment_id:
    type: string
    description: "Unique identifier for the comment."
  user_id_hash:
    type: string
    description: "SHA-256 hash of the user ID."
    pattern: "^[a-f0-9]{64}$"
  thread_id:
    type: string
    description: "Parent post ID."
  body:
    type: string
    description: "The text content of the comment."
  thread_type:
    type: string
    enum:
      - "Prime"
      - "Control"
    description: "Classification of the thread context."
  prosocial_count:
    type: integer
    minimum: 0
    description: "Count of prosocial keywords found."
  vader_compound:
    type: number
    minimum: -1
    maximum: 1
    description: "VADER compound sentiment score."
  vader_pos:
    type: number
    minimum: 0
    maximum: 1
    description: "VADER positive proportion."
  vader_neu:
    type: number
    minimum: 0
    maximum: 1
    description: "VADER neutral proportion."
  vader_neg:
    type: number
    minimum: 0
    maximum: 1
    description: "VADER negative proportion."
required:
  - comment_id
  - user_id_hash
  - thread_id
  - body
  - thread_type
  - prosocial_count
  - vader_compound
  - vader_pos
  - vader_neu
  - vader_neg
additionalProperties: false
