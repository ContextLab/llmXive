$schema: "http://json-schema.org/draft-07/schema#"
title: "Anonymized Reddit Comment Dataset"
description: "Schema for the processed, anonymized Reddit comments used in the priming study. Note: user_tenure is removed."
type: object
properties:
  comment_id:
    type: string
    description: "Unique identifier for the comment (e.g., t1_xyz)."
  user_id:
    type: string
    description: "SHA-256 hash of the original username."
    pattern: "^[a-f0-9]{64}$"
  thread_id:
    type: string
    description: "Unique identifier for the parent thread."
  thread_type:
    type: string
    description: "Classification of the thread."
    enum:
      - "Prime"
      - "Control"
  text:
    type: string
    description: "The text content of the comment."
  vader_compound:
    type: number
    description: "VADER sentiment compound score."
    minimum: -1
    maximum: 1
  prosocial_intent_score:
    type: integer
    description: "Count of prosocial keywords from a distinct lexicon (excluding prime words)."
    minimum: 0
  thread_length:
    type: integer
    description: "Character length of the comment."
    minimum: 0
required:
  - comment_id
  - user_id
  - thread_id
  - thread_type
  - text
  - vader_compound
  - prosocial_intent_score
  - thread_length
additionalProperties: false