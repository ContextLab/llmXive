$schema: "http://json-schema.org/draft-07/schema#"
title: "Scored Dataset Schema"
description: "Schema for the dataset after VADER and action lexicon scoring."
type: object
properties:
  comment_id:
    type: string
    description: "Unique comment identifier."
  thread_id:
    type: string
  user_id_hash:
    type: string
    description: "SHA-256 hash of the user ID."
    pattern: "^[a-f0-9]{64}$"
  comment_rank:
    type: integer
    description: "Relative order of comment in thread."
    minimum: 0
  body:
    type: string
    description: "The text content of the comment."
  thread_type:
    type: string
    enum:
      - "Prime"
      - "Control"
    description: "Classification of the thread context."
  vader_neg:
    type: number
    description: "VADER negative sentiment component."
    minimum: 0
    maximum: 1
  prosocial_count:
    type: integer
    description: "Count of prosocial action verbs."
    minimum: 0
  vader_compound:
    type: number
    description: "VADER compound sentiment score."
    minimum: -1
    maximum: 1
  vader_pos:
    type: number
    description: "VADER positive proportion."
    minimum: 0
    maximum: 1
  vader_neu:
    type: number
    description: "VADER neutral proportion."
    minimum: 0
    maximum: 1
required:
  - comment_id
  - thread_id
  - user_id_hash
  - comment_rank
  - body
  - thread_type
  - vader_neg
  - prosocial_count
  - vader_compound
  - vader_pos
  - vader_neu
additionalProperties: false