$schema: http://json-schema.org/draft-07/schema#
title: Analysis Results Schema
description: "Schema for the JSON output of the statistical analysis."
type: object
properties:
  model_summary:
    type: object
    description: "Summary of the LMM fit."
    properties:
      formula:
        type: string
        description: "The formula used for the model."
      n_obs:
        type: integer
        description: "Number of observations."
      n_groups:
        type: integer
        description: "Number of random effect groups (users)."
      AIC:
        type: number
        description: "Akaike Information Criterion."
      BIC:
        type: number
        description: "Bayesian Information Criterion."
      log_likelihood:
        type: number
        description: "Log-likelihood value."
  fixed_effects:
    type: object
    description: "Fixed effect coefficients."
    properties:
      intercept:
        type: object
        properties:
          coef:
            type: number
          std_err:
            type: number
          p_value:
            type: number
      thread_type:
        type: object
        properties:
          coef:
            type: number
          std_err:
            type: number
          p_value:
            type: number
    required:
      - intercept
      - thread_type
  random_effects:
    type: object
    description: "Random effect variance components."
    properties:
      user_id_variance:
        type: number
        minimum: 0
      residual_variance:
        type: number
        minimum: 0
    required:
      - user_id_variance
      - residual_variance
  validation:
    type: object
    description: "Validation metrics."
    properties:
      kappa:
        type: number
        description: "Cohen's Kappa score."
        minimum: 0
        maximum: 1
    required:
      - kappa
required:
  - model_summary
  - fixed_effects
  - random_effects
  - validation
additionalProperties: false
