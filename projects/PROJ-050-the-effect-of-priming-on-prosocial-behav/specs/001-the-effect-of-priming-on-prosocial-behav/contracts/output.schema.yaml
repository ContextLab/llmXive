$schema: "http://json-schema.org/draft-07/schema#"
title: "LMM Analysis Results"
description: "Schema for the output of the Linear Mixed Model analysis."
type: object
properties:
  model_info:
    type: object
    properties:
      formula:
        type: string
        description: "The LMM formula used."
      converged:
        type: boolean
        description: "Whether the model converged."
      n_obs:
        type: integer
        description: "Number of observations."
      n_groups:
        type: object
        description: "Number of groups per random effect."
        properties:
          subreddit:
            type: integer
          user_id:
            type: integer
    required:
      - formula
      - converged
      - n_obs
  fixed_effects:
    type: array
    description: "Fixed effect coefficients and statistics."
    items:
      type: object
      properties:
        term:
          type: string
        estimate:
          type: number
        std_error:
          type: number
        t_value:
          type: number
        p_value:
          type: number
      required:
        - term
        - estimate
        - p_value
  primary_hypothesis:
    type: object
    description: "Result for the primary hypothesis (thread_type effect)."
    properties:
      term:
        type: string
        const: "thread_type"
      p_value:
        type: number
      is_significant:
        type: boolean
        description: "True if p_value < 0.05."
    required:
      - term
      - p_value
      - is_significant
required:
  - model_info
  - fixed_effects
  - primary_hypothesis
additionalProperties: false
