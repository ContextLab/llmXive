  h: 21919bb8ab33573b816df3fd17636e37e769aa6ff4290b647e68bffa78c0da09
  r: "`src/pipeline/run.py` is a 137-byte placeholder containing only `from src.pipeline.run\
    \ import run, main` \u2014 a circular self-import with no actual `run()` or `main()`\
    \ defined, so importing it fails and `code/tests/test_pipeline_entry.py` cannot\
    \ pass. The quickstart documents `python -m src.pipeline.run` as the entry point,\
    \ but no such runnable pipeline exists; the implementer must write a real `run()`\
    \ that wires together the download, featurize, and downstream steps (or at minimum\
    \ returns successfully per the test contract)."
  sig: c84bb5ce5ae5f7430a119d7861d65403fa4fcccf5e61198756a0ffec4bc3ef2d
