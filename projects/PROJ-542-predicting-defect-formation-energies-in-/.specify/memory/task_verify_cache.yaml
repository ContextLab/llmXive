T001:
  c: false
  h: 4e1f1b16b241ec4a26ccd203ba910a19a64931f8e8e4a42223e8c1067c7616a4
  r: "The required files exist and are non-trivial, but the module wiring is actually\
    \ broken: `src/pipeline/run.py` calls `train_main(str(train_path), str(cv_metrics_path))`\
    \ and `evaluate_main(str(train_path), str(test_path), str(performance_path))`,\
    \ yet `src/models/train.py::main` and `src/models/evaluate.py::main` ignore their\
    \ parameters and instead parse `sys.argv` (exiting with usage errors when `len(sys.argv)\
    \ != 3`). Consequently `run()` \u2014 which the test `code/tests/test_pipeline_entry.py`\
    \ asserts must return without raising \u2014 would abort at the training step,\
    \ and there is no execution evidence"
  sig: c726330b4373135f3eea1d98846dcb521fd994cc109eeb9a93c7977ccb2162f4
T003:
  c: false
  h: cc29533459009d21d0843745223a270f616c37ec2cb864a205076a52bb904b5a
  r: "The required outputs `data/processed/features.csv` and `data/processed/featurize.log`\
    \ are MISSING, so the featurization was never successfully run. The only existing\
    \ output, `descriptor_gaps.log`, records a detected gap (\"Row 0 (BaTiO3): missing\
    \ A_atomic_radius\"), meaning the script aborted with \"Descriptor gaps detected\"\
    \ rather than producing the feature matrix \u2014 the verification requirement\
    \ (12 descriptor columns + formation_energy, no missing targets) cannot be checked\
    \ against any actual CSV. The implementer must fix the descriptor computation\
    \ (e.g., the atomic-radius fallback) and re-run t"
  sig: fee0f6672ce357229ff96e6b57f49f89f47ee522f839b78159afb6b73e122973
