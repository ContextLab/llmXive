T001:
  c: false
  h: 3d6f66cc8f8e492554f48fbbb8436bd195efeae5613b27623b046ed1835fa774
  r: "The required pipeline modules (`code/pipeline/run.py`, `code/data/download.py`,\
    \ `code/data/featurize.py`) are missing, and the existing unit test imports `src.pipeline.run`\
    \ and expects `run()` to return `None` rather than a dict with `raw_path`, `features_path`,\
    \ and `model_path`. These gaps prevent the task\u2019s documentation and wiring\
    \ verification from being satisfied."
  sig: 01404b5e9c68625f43dce80875b8fb5a51f28d96e8be10adf88aa9e6c1ec2491
T003:
  c: false
  h: ab955d01dafdfa073fad15d88d46a5913821c0c58149478d533d3bd13f6da949
  r: "The required script `code/data/featurize.py` is missing, as is the `featurize.log`\
    \ file. The generated `features.csv` lacks the required short\u2011name columns\
    \ (`A_radius`, `B_radius`, `X_radius`) required by `contracts/features.schema.yaml`,\
    \ contains only 10 rows (far fewer than the \u2265500 rows stipulated), and the\
    \ log of descriptor gaps indicates missing values despite the CSV showing filled\
    \ entries. Consequently the task\u2019s core featurization, logging, row\u2011\
    dropping, and validation requirements are not satisfied."
  sig: ba4aeef06675e988c1ec3b37923594ed50893c3b067c2c974faa73b23c8d84e9
T004:
  c: false
  h: c9e951a3401d0953eacbeb31a3d40cab18e9b18eaeff794b3811e8fc68e5e697
  r: "The required implementation file `code/data/validate.py` is missing, so the\
    \ core logic (row\u2011count check, warning, checksum generation) cannot be verified\
    \ despite the presence of the log and checksum artifacts. The task must provide\
    \ a non\u2011empty `validate.py` implementing the specified behavior."
  sig: 6fe68579b67bc09f555302e3fd6cf3ab05d9b09b2531cde0ebb49d164cd4fd7a
T005:
  c: false
  h: d475749e28fbfd27ef0a705d78785712af74dde92901b86a04c3176ff0c16aeb
  r: "The `code/utils/checksum.py` file exists and defines the required `write_checksum`\
    \ function, but the accompanying test suite `code/tests/test_checksums.py` is\
    \ missing, so there is no evidence that the utility has been verified to correctly\
    \ hash files and write the checksum to the specified output directory. The missing\
    \ test file must be added (and passing) to satisfy the task\u2019s verification\
    \ requirement."
  sig: 6b84b327c6181b3f3c63f69e033f25697919b7e240ef4fd4a8fbfcc9b5a481b4
T012:
  c: true
  h: 2ca7d3e7d019004f13fe5f295764bdea50c0ee7ad93e6472ff7a36304c54ed53
  r: "Checked the `code/requirements.txt` file (320\u202Fbytes) which exists at the\
    \ required path and contains exact version pins for all listed packages, satisfying\
    \ the \u201Cpinned requirements.txt\u201D requirement."
  sig: 63ad80978dfdeb581dbddf0815f31925355bd26dd8ff80bd76e0a7b29b709a77
T014:
  c: false
  h: f569c8c26021201582cb5a966f87ce602c72347381cd2acd21eeef0fc8d9962c
  r: "The `contracts/features.schema.yaml` file defines extra optional properties\
    \ (`A_atomic_radius`, `B_atomic_radius`, `X_atomic_radius`) that are not among\
    \ the twelve required descriptor columns, violating the \u201Cno additional columns\
    \ allowed\u201D requirement. The test only checks schema syntax, not that the\
    \ schema restricts columns to exactly the specified set. The schema must be revised\
    \ to include only the twelve descriptor fields and `formation_energy` with `additionalProperties:\
    \ false`."
  sig: 307c5d5f1c65e6f3214e3171b3e4c70a8e4c1b27681d3b37d11fd242cadc5e73
