    \ and the JSON it would write (`{\"cv_metrics\": ...}` only) violates `contracts/model_performance.schema.yaml`,\
    \ which requires `test_metrics`, `bootstrap_ci`, `paired_ttest`, and `feature_importances`\
    \ at the top level with `additionalProperties: false`."
