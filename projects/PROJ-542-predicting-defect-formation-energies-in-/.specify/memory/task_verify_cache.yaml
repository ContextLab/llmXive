  h: 91ae525772c24cd27c6aa6b811ac0836d7496754cbc61dcb8fe06e30e6014eb9
  r: '`code/pipeline/run.py`, `code/data/download.py`, and `code/data/featurize.py`
    are missing, and the existing unit test (`code/tests/test_pipeline_entry.py`)
    checks a different import path (`src.pipeline.run`) and expects `run()` to return
    `None` rather than a dict with `raw_path`, `features_path`, and `model_path`.
    The required pipeline entry point and its verification are therefore not present.'
  sig: dd2ffb8d7d238204c6c3e0305fe500bbe102c8a28c9370f5b2d34636f5cbbe0a
T003:
  c: false
  h: ab955d01dafdfa073fad15d88d46a5913821c0c58149478d533d3bd13f6da949
  r: "The required script `code/data/featurize.py` is missing, as is the `featurize.log`\
    \ file. The generated `features.csv` lacks the required short\u2011name columns\
    \ (`A_radius`, `B_radius`, `X_radius`) required by `contracts/features.schema.yaml`,\
    \ contains only 10 rows (far fewer than the \u2265500 rows stipulated), and the\
    \ log of descriptor gaps indicates missing values despite the CSV showing filled\
    \ entries. Consequently the task\u2019s core featurization, logging, row\u2011\
    dropping, and validation requirements are not satisfied."
  sig: ba4aeef06675e988c1ec3b37923594ed50893c3b067c2c974faa73b23c8d84e9
