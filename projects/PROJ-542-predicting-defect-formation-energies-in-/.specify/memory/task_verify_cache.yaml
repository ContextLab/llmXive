  r: "The required implementation file `code/data/validate.py` is missing, so the\
    \ core logic (row\u2011count check, warning, checksum generation) cannot be verified\
    \ despite the presence of the log and checksum artifacts. The task must provide\
    \ a non\u2011empty `validate.py` implementing the specified behavior."
  sig: 6fe68579b67bc09f555302e3fd6cf3ab05d9b09b2531cde0ebb49d164cd4fd7a
