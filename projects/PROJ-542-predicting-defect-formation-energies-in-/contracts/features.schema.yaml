# Feature matrix schema for perovskite defect formation energy prediction
#
# This schema enforces that the feature CSV contains exactly the twelve
# compositional descriptor columns (four descriptors for each of the three
# sites A, B, X) plus the numeric target column `formation_energy`.
# No additional columns are permitted.
#
# The descriptor column naming convention follows the pattern:
#   <site>_<descriptor>
# where <site> is one of A, B, X and <descriptor> is one of:
#   atomic_radius, electronegativity, oxidation_state, valence_electrons
#
$schema: "http://json-schema.org/draft-07/schema#"
title: Perovskite Defect Feature Matrix
type: object
properties:
  # Atomic radius descriptors (covalent radius, Å)
  A_atomic_radius:
    type: number
  B_atomic_radius:
    type: number
  X_atomic_radius:
    type: number
  # Electronegativity (Pauling)
  A_electronegativity:
    type: number
  B_electronegativity:
    type: number
  X_electronegativity:
    type: number
  # Oxidation state
  A_oxidation_state:
    type: number
  B_oxidation_state:
    type: number
  X_oxidation_state:
    type: number
  # Valence electrons
  A_valence_electrons:
    type: number
  B_valence_electrons:
    type: number
  X_valence_electrons:
    type: number
  # Target variable
  formation_energy:
    type: number
required:
  - A_atomic_radius
  - B_atomic_radius
  - X_atomic_radius
  - A_electronegativity
  - B_electronegativity
  - X_electronegativity
  - A_oxidation_state
  - B_oxidation_state
  - X_oxidation_state
  - A_valence_electrons
  - B_valence_electrons
  - X_valence_electrons
  - formation_energy
additionalProperties: false