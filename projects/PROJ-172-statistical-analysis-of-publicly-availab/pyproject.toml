[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-prediction"
version = "0.1.0"
description = "Statistical Analysis of Publicly Available Sports Data"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.0.3",
    "scikit-learn==1.3.0",
    "xgboost==1.7.6",
    "statsmodels==0.14.0",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "numpy==1.24.3",
    "pytest==7.4.0",
    "python-dotenv==1.0.0"
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # assert allowed in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
