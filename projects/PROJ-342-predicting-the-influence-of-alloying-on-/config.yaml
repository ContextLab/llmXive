# Project Configuration
# Defines reproducible seeds, resource limits, and model hyperparameters.

random_seed: 42

# Resource Limits (FR-005)
resource_limits:
  max_time_hours: 6
  max_memory_gb: 7

# Model Hyperparameters
model_params:
  gradient_boosting:
    n_estimators: 100
    max_depth: 4
    learning_rate: 0.1
    min_samples_split: 5
    min_samples_leaf: 2
  grid_search:
    max_combinations: 10

# Analysis Parameters
analysis:
  fdr_alpha: 0.05
  vif_threshold: 5.0
  bootstrap_resamples: 1000
