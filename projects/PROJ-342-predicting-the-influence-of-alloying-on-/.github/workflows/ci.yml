name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-pipeline:
    name: Execute Full Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Pipeline
        id: pipeline_run
        run: |
          set +e
          python code/run_full_pipeline.py
          exit_code=$?
          set -e
          echo "PIPELINE_EXIT_CODE=$exit_code" >> $GITHUB_OUTPUT
          
          # Check for expected DATA_UNAVAILABLE state
          if [ $exit_code -eq 1 ]; then
            if grep -q "DATA_UNAVAILABLE" logs/pipeline.log 2>/dev/null || [ -f state/data_unavailable.flag ]; then
              echo "EXPECTED_FAILURE=true" >> $GITHUB_OUTPUT
              echo "Pipeline failed with DATA_UNAVAILABLE (expected in isolated CI environment)"
            else
              echo "EXPECTED_FAILURE=false" >> $GITHUB_OUTPUT
              echo "Pipeline failed with unexpected error"
              exit 1
            fi
          elif [ $exit_code -ne 0 ]; then
            echo "Pipeline failed with unexpected exit code $exit_code"
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/

  validate-data-source:
    name: T081 - Data Source Audit
    needs: run-pipeline
    if: needs.run-pipeline.outputs.EXPECTED_FAILURE != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Data Source Audit
        run: python code/audit_data_source.py

  validate-resources:
    name: T082 - Resource Compliance
    needs: run-pipeline
    if: needs.run-pipeline.outputs.EXPECTED_FAILURE != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Resource Compliance Check
        run: |
          python -c "
          import json
          from pathlib import Path
          data_path = Path('data/resource_usage.json')
          if not data_path.exists():
              print('ERROR: resource_usage.json not found')
              exit(1)
          with open(data_path) as f:
              data = json.load(f)
          ram_gb = data.get('peak_ram_gb', 0)
          runtime_h = data.get('total_runtime_h', 0)
          print(f'Peak RAM: {ram_gb:.2f} GB (Limit: 7 GB)')
          print(f'Runtime: {runtime_h:.2f} h (Limit: 6 h)')
          if ram_gb >= 7 or runtime_h >= 6:
              print('ERROR: Resource limits exceeded')
              exit(1)
          print('Resource compliance: PASSED')
          "

  validate-stats:
    name: T083 - Statistical Compliance
    needs: run-pipeline
    if: needs.run-pipeline.outputs.EXPECTED_FAILURE != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Statistical Compliance Check
        run: python code/verify_t083_compliance.py

  validate-report:
    name: T084 - Report Compliance
    needs: run-pipeline
    if: needs.run-pipeline.outputs.EXPECTED_FAILURE != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Report Compliance Check
        run: |
          python code/verify_report_compliance.py
          python code/verify_report.py

  final-verification:
    name: T080b - Final Artifact Verification
    needs: [validate-data-source, validate-resources, validate-stats, validate-report]
    if: needs.run-pipeline.outputs.EXPECTED_FAILURE != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Verify Artifacts
        run: python code/verify_artifacts.py