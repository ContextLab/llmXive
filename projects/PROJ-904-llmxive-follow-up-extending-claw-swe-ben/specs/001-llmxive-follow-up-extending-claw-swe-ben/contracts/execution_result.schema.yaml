$schema: "http://json-schema.org/draft-07/schema#"
title: ExecutionResult
description: >
  Schema for the result of running an LLM on a specific TaskInstance
  with a specific ContextConfiguration.
type: object
required:
  - pass_status
  - token_count
  - failure_mode
  - task_id
  - config_id
properties:
  task_id:
    type: string
    description: Reference to the TaskInstance issue_id.
  config_id:
    type: string
    description: Unique identifier for the ContextConfiguration used (hash of config).
  pass_status:
    type: boolean
    description: Whether the generated solution passed the tests.
  token_count:
    type: integer
    description: Total number of tokens consumed (prompt + completion).
    minimum: 0
  failure_mode:
    type: string
    description: Classification of the failure if pass_status is false.
    enum:
      - "success"
      - "missing_context"
      - "reasoning_error"
      - "timeout"
      - "resource_constraint"
      - "parsing_error"
      - "unknown"
  latency_seconds:
    type: number
    description: Time taken to generate the solution.
    minimum: 0
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the execution completed.
  log_snippet:
    type: string
    description: A truncated snippet of the execution logs for debugging.
    maxLength: 1024
  error_trace:
    type: string
    description: Full error trace if an exception occurred during execution.
  metadata:
    type: object
    description: Additional runtime metrics.
    properties:
      context_files_used:
        type: integer
        description: Number of files actually included in the final prompt.
      memory_peak_mb:
        type: number
        description: Peak memory usage in MB during execution.