$schema: "http://json-schema.org/draft-07/schema#"
title: "Execution Result Schema"
description: "Schema for the output of a single model execution run."
type: "object"
properties:
  run_id:
    type: "string"
    description: "Unique execution identifier."
  instance_id:
    type: "string"
    description: "Reference to the task instance."
  strategy:
    type: "string"
    enum:
      - "baseline"
      - "tfidf"
      - "diff_aware"
      - "summarization"
    description: "Context compression strategy used."
  model_size:
    type: "string"
    enum:
      - "1b"
      - "7b"
    description: "Size of the model used."
  pass_status:
    type: "boolean"
    description: "Whether the generated patch passed unit tests."
  failure_mode:
    type: "string"
    enum:
      - "missing_context"
      - "reasoning_error"
      - "timeout"
      - "resource_constraint"
      - "none"
    description: "Classified failure mode if pass_status is false."
  tokens_generated:
    type: "integer"
    description: "Number of tokens generated by the model."
  runtime_seconds:
    type: "number"
    description: "Wall-clock time in seconds."
required:
  - run_id
  - instance_id
  - strategy
  - model_size
  - pass_status
  - failure_mode
  - tokens_generated
  - runtime_seconds
additionalProperties: false
