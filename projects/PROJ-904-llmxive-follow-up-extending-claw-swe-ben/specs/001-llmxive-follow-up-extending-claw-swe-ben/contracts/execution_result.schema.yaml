$schema: http://json-schema.org/draft-07/schema#
title: ExecutionResult Schema
description: >-
  JSON Schema for the ExecutionResult entity.
  Matches the dataclass structure in code/models/execution_result.py.
type: object
properties:
  instance_id:
    type: string
    description: Reference to the TaskInstance.
  model_id:
    type: string
    description: Identifier of the model used (e.g., 'llama-3-1b').
  strategy_type:
    type: string
    description: The context strategy used for this run.
  status:
    type: string
    enum:
      - success
      - failure
      - timeout
      - error
    description: Execution outcome status.
  generated_text:
    type: string
    description: The raw text generated by the model.
  prediction:
    type: string
    description: The parsed prediction (e.g., the patch).
  evaluation_result:
    type: object
    description: Result of running the evaluation tests.
    properties:
      passed:
        type: boolean
      logs:
        type: string
      exit_code:
        type: integer
  failure_category:
    type: string
    enum:
      - missing_context
      - reasoning_error
      - timeout
      - parse_error
      - unknown
    description: Classified reason for failure if status is failure.
  execution_time_seconds:
    type: number
    minimum: 0
    description: Wall-clock time taken for execution.
  token_usage:
    type: object
    properties:
      prompt_tokens:
        type: integer
      completion_tokens:
        type: integer
      total_tokens:
        type: integer
    description: Token consumption metrics.
  created_at:
    type: string
    format: date-time
    description: Timestamp of result creation.
  checksum:
    type: string
    description: SHA-256 checksum of the result for integrity verification.
required:
  - instance_id
  - model_id
  - strategy_type
  - status
  - created_at
additionalProperties: false