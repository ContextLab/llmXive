$schema: http://json-schema.org/draft-07/schema#
title: ExecutionResult
description: >-
  Schema for the result of executing a model on a task instance with a specific context configuration.
type: object
required:
  - execution_id
  - instance_id
  - config_id
  - model_id
  - status
  - created_at
  - elapsed_time
properties:
  execution_id:
    type: string
    description: Unique identifier for this execution run.
    pattern: '^exec-[0-9a-f]{8}$'
  instance_id:
    type: string
    description: Reference to the TaskInstance that was executed.
    pattern: '^swe-bench-[0-9]+$'
  config_id:
    type: string
    description: Reference to the ContextConfiguration used.
    pattern: '^ctx-config-[0-9a-f]{8}$'
  model_id:
    type: string
    description: Identifier of the model used (e.g., 'llama-3-1b-q4', 'llama-3-7b-q4').
  status:
    type: string
    description: Outcome of the execution.
    enum:
      - success
      - failure
      - timeout
      - error
  result_payload:
    type: object
    description: The raw output generated by the model (e.g., predicted patch).
    properties:
      predicted_patch:
        type: string
        description: The code patch generated by the model.
      log_output:
        type: string
        description: Console logs or stderr from the execution environment.
  failure_category:
    type: string
    description: Classification of the failure if status is 'failure'.
    enum:
      - missing_context
      - reasoning_error
      - syntax_error
      - timeout
      - unknown
    nullable: true
  metrics:
    type: object
    description: Quantitative metrics collected during execution.
    properties:
      pass:
        type: boolean
        description: Whether the predicted patch passed the test suite.
      tokens_used:
        type: integer
        description: Total tokens consumed in the generation.
      context_tokens:
        type: integer
        description: Tokens used in the context window.
      generation_tokens:
        type: integer
        description: Tokens generated by the model.
  created_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the execution started.
  elapsed_time:
    type: number
    description: Wall-clock time in seconds for the execution.
    minimum: 0
  checksum:
    type: string
    description: SHA-256 checksum of the result payload for integrity.
    pattern: '^[a-f0-9]{64}$'