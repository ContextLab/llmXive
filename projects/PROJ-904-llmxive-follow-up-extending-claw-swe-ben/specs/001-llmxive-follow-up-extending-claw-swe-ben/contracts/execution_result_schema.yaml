# Execution Result Schema
# Defines the structure of the result from executing a model on a task instance
# with a specific context configuration.
#
# Version: 1.0.0
#
# This schema aligns with the ExecutionResult dataclass in code/config.py

schema_name: execution_result
version: "1.0.0"
description: >
  Represents the outcome of running a model inference on a task instance
  with a specific context configuration. Includes the model output,
  pass/fail status, and failure classification.

fields:
  - name: result_id
    type: string
    required: true
    description: Unique identifier for this execution result
    example: "res_baseline_1b_001"

  - name: instance_id
    type: string
    required: true
    description: Reference to the task instance this result is for
    example: "django__django-12345"

  - name: configuration_id
    type: string
    required: true
    description: Reference to the context configuration used
    example: "cfg_naive_1b_001"

  - name: model_size
    type: string
    required: true
    description: Size of the model used
    enum:
      - 1b
      - 7b
    example: "1b"

  - name: strategy_type
    type: string
    required: true
    description: The context processing strategy used
    enum:
      - naive_truncation
      - tfidf_retrieval
      - diff_aware_window
      - semantic_summarization
    example: "naive_truncation"

  - name: generated_patch
    type: string
    required: true
    description: The patch generated by the model
    format: multi-line text
    example: |
      --- a/django/core/validators.py
      +++ b/django/core/validators.py
      @@ -10,6 +10,10 @@
      +
      +def new_function():
      +    pass

  - name: pass_status
    type: boolean
    required: true
    description: Whether the generated patch passes the test suite
    example: true

  - name: execution_time_seconds
    type: number
    required: true
    description: Total wall-clock time for execution (in seconds)
    minimum: 0
    example: 125.5

  - name: failure_category
    type: string
    required: false
    description: Classification of the failure mode (if pass_status is false)
    enum:
      - missing_context
      - reasoning_error
      - timeout
      - syntax_error
      - unknown
    example: "missing_context"

  - name: failure_details
    type: object
    required: false
    description: Additional details about the failure
    properties:
      - name: error_message
        type: string
        required: false
      - name: log_snippet
        type: string
        required: false
      - name: confidence_score
        type: number
        required: false
        minimum: 0.0
        maximum: 1.0

  - name: metadata
    type: object
    required: false
    description: Additional metadata for analysis
    properties:
      - name: tokens_generated
        type: integer
        description: Number of tokens generated by the model
      - name: context_tokens
        type: integer
        description: Number of tokens in the input context
      - name: model_version
        type: string
        description: Specific model version used
      - name: timestamp
        type: string
        format: date-time
        description: When the execution occurred

constraints:
  - result_id must be unique
  - instance_id and configuration_id must reference valid records
  - pass_status must be a boolean
  - execution_time_seconds must be non-negative
  - If pass_status is false, failure_category should be populated
  - failure_details.confidence_score must be between 0.0 and 1.0 if present

usage_notes:
  - This schema is used for aggregating results in merge_results.py
  - failure_category is determined by failure_classifier.py
  - Results are stored in JSONL format in data/intermediate/
  - The aggregated results are merged into data/results.csv (FR-005)
  - This schema supports GLM analysis in glm_analyzer.py for interaction effects