$schema: "http://json-schema.org/draft-07/schema#"
title: "SWE-Bench Filtered Dataset Schema"
description: "Schema for the filtered SWE-bench Verified dataset used in the experiment."
type: "object"
properties:
  instance_id:
    type: "string"
    description: "Unique identifier for the task instance."
  repo_name:
    type: "string"
    description: "Name of the repository (e.g., 'matplotlib/matplotlib')."
  problem_statement:
    type: "string"
    description: "The issue description text."
  relevant_line_count:
    type: "integer"
    minimum: 500
    description: "Number of lines in relevant file history (static analysis)."
  files:
    type: "array"
    description: "List of file objects containing path and content."
    items:
      type: "object"
      properties:
        path:
          type: "string"
        content:
          type: "string"
      required: ["path", "content"]
  ground_truth_patch_hash:
    type: "string"
    description: "SHA256 hash of the ground truth patch."
required:
  - instance_id
  - repo_name
  - problem_statement
  - relevant_line_count
  - files
  - ground_truth_patch_hash
additionalProperties: false
