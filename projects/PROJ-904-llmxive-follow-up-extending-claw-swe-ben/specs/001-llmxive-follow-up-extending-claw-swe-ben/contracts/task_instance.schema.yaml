$schema: http://json-schema.org/draft-07/schema#
title: TaskInstance
description: >-
  Schema for a task instance derived from the Claw-SWE-Bench dataset.
  Represents a specific software engineering task (issue + patch + context).
type: object
required:
  - instance_id
  - problem_statement
  - repo
  - version
  - base_commit
  - patch
  - test_patch
  - relevant_files
  - total_lines
  - status
  - created_at
properties:
  instance_id:
    type: string
    description: Unique identifier for the task instance (e.g., 'swe-bench-12345')
    pattern: '^swe-bench-[0-9]+$'
  problem_statement:
    type: string
    description: The natural language description of the issue to be resolved.
  repo:
    type: string
    description: The repository name (e.g., 'pallets/flask')
  version:
    type: string
    description: The version of the repository at the time of the issue.
  base_commit:
    type: string
    description: The SHA of the base commit before the issue was introduced.
    pattern: '^[a-f0-9]{40}$'
  patch:
    type: string
    description: The ground-truth patch that resolves the issue.
  test_patch:
    type: string
    description: The test patch used to verify the solution.
  relevant_files:
    type: array
    description: List of file paths relevant to the issue (derived from import graph traversal).
    items:
      type: string
  total_lines:
    type: integer
    description: Total number of lines in the traversed import graph.
    minimum: 0
  status:
    type: string
    description: Current status of the task instance.
    enum:
      - pending
      - processing
      - completed
      - failed
  created_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the instance was created/loaded.
  metadata:
    type: object
    description: Optional additional metadata (e.g., graph traversal depth, import count).
    additionalProperties: true
