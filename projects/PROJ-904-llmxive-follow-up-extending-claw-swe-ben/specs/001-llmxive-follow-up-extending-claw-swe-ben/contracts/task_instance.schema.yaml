$schema: http://json-schema.org/draft-07/schema#
title: TaskInstance Schema
description: >-
  JSON Schema for the TaskInstance entity.
  Matches the dataclass structure in code/models/task_instance.py.
type: object
properties:
  instance_id:
    type: string
    description: Unique identifier for the task instance (e.g., 'swe-bench-123').
  repo:
    type: string
    description: Repository name (e.g., 'pytorch/pytorch').
  base_commit:
    type: string
    description: Git commit hash for the base state.
  patch:
    type: string
    description: The gold patch applied to fix the issue.
  test_patch:
    type: string
    description: The test patch used to verify the fix.
  problem_statement:
    type: string
    description: The natural language description of the issue.
  hints_text:
    type: string
    description: Optional hints provided for the task.
  created_at:
    type: string
    format: date-time
    description: Timestamp of instance creation.
  version:
    type: string
    description: Version of the dataset schema.
  relevant_files:
    type: array
    items:
      type: string
    description: List of file paths relevant to the issue.
  imports_graph:
    type: object
    description: Serialized import graph data (nodes and edges).
    properties:
      nodes:
        type: array
        items:
          type: string
      edges:
        type: array
        items:
          type: array
          items:
            type: string
  total_lines:
    type: integer
    minimum: 0
    description: Total number of lines in the traversed context graph.
  status:
    type: string
    enum:
      - pending
      - running
      - completed
      - failed
    description: Current execution status.
required:
  - instance_id
  - repo
  - base_commit
  - patch
  - test_patch
  - problem_statement
  - status
additionalProperties: false
