[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "Context Fidelity vs. Model Scaling Trade-offs Research"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "datasets",
    "scikit-learn",
    "statsmodels",
    "networkx",
    "pytest",
    "huggingface_hub",
    "ruff",
    "black",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
# Same as .ruff.toml but kept here for tooling compatibility
line-length = 100
target-version = "py311"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"