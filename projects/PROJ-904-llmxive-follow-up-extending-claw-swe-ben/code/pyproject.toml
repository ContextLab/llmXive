[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "Context Fidelity vs. Model Scaling Trade-offs Research"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "networkx>=3.2.0",
    "pytest>=7.4.0",
    "huggingface_hub>=0.21.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]
