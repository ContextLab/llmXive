$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Output Schema"
description: "Schema for the Logistic Regression classifier results and evaluation metrics."
type: object
properties:
  model_info:
    type: object
    properties:
      model_id:
        type: string
        description: "Unique hash identifying the model configuration."
      hyperparameters:
        type: object
        properties:
          C:
            type: number
            description: "Inverse regularization strength."
          solver:
            type: string
            enum:
              - "liblinear"
            description: "Solver used for Logistic Regression."
          random_state:
            type: integer
            description: "Random seed."
        required:
          - C
          - solver
          - random_state
      training_method:
        type: string
        enum:
          - "leave-one-dataset-out"
        description: "Cross‑validation strategy."
    required:
      - model_id
      - hyperparameters
      - training_method
  metrics:
    type: object
    properties:
      within_dataset:
        type: object
        properties:
          accuracy:
            type: number
            minimum: 0
            maximum: 1
            description: "Accuracy on the training split (e.g., 80/20)."
          f1_macro:
            type: number
            minimum: 0
            maximum: 1
            description: "Macro‑averaged F1 score."
          precision:
            type: number
            minimum: 0
            maximum: 1
            description: "Macro‑averaged precision."
          recall:
            type: number
            minimum: 0
            maximum: 1
            description: "Macro‑averaged recall."
        required:
          - accuracy
          - f1_macro
          - precision
          - recall
      cross_dataset:
        type: object
        properties:
          accuracy:
            type: number
            minimum: 0
            maximum: 1
            description: "Accuracy on the held‑out independent dataset."
          f1_macro:
            type: number
            minimum: 0
            maximum: 1
            description: "Macro‑averaged F1 on held‑out data."
          generalization_gap:
            type: number
            description: "Difference between within‑dataset and cross‑dataset accuracy."
        required:
          - accuracy
          - f1_macro
          - generalization_gap
      null_distribution:
        type: object
        properties:
          mean:
            type: number
            description: "Mean accuracy from permutation test (null hypothesis)."
          std:
            type: number
            description: "Standard deviation from permutation test."
          p_value:
            type: number
            description: "Permutation test p‑value (before FDR)."
        required:
          - mean
          - std
          - p_value
      posthoc_power:
        type: number
        minimum: 0
        maximum: 1
        description: "Estimated power to detect the observed accuracy lift."
      mdes:
        type: number
        description: "Minimum Detectable Effect Size at α = 0.05."
      confusion_matrix:
        type: array
        items:
          type: array
          items:
            type: integer
        description: "N × N matrix of predicted vs. true stress labels."
      classes_used:
        type: array
        items:
          type: string
        description: "List of stress types actually used in classification."
    required:
      - within_dataset
      - cross_dataset
      - null_distribution
      - posthoc_power
      - mdes
      - confusion_matrix
      - classes_used
  feature_importance:
    type: object
    properties:
      top_genes:
        type: array
        items:
          type: object
          properties:
            gene_id:
              type: string
            importance_score:
              type: number
            stability_score:
              type: number
              minimum: 0
              maximum: 1
              description: "Stability score from bootstrap analysis (0.0‑1.0)."
          required:
            - gene_id
            - importance_score
            - stability_score
        description: "List of top 50 genes ranked by importance, filtered by stability > 0.8."
    required:
      - top_genes
required:
  - model_info
  - metrics
  - feature_importance
