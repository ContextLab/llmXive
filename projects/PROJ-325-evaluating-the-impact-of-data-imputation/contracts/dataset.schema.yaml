$schema: http://json-schema.org/draft-07/schema#
title: SyntheticDataset
type: object
properties:
  true_mean:
    type: number
  true_variance:
    type: number
  missingness_mechanism:
    type: string
    enum:
      - MCAR
      - MAR
  n:
    type: integer
  missing_rate:
    type: number
required:
  - true_mean
  - true_variance
  - missingness_mechanism
  - n
  - missing_rate