$schema: http://json-schema.org/draft-07/schema#
title: Bias Metric Schema
description: Schema for bias calculation results.
type: object
properties:
  method:
    type: string
    description: The imputation method being evaluated.
  bias_percentage:
    type: number
    description: Percentage bias relative to the true/reference value.
  is_pass_sc002:
    type: boolean
    description: Whether the bias meets the SC-002 threshold (<= 80% of single imputation bias).
  reference_value:
    type: number
    description: The true variance or reference variance used for comparison.
required:
  - method
  - bias_percentage
  - is_pass_sc002
  - reference_value