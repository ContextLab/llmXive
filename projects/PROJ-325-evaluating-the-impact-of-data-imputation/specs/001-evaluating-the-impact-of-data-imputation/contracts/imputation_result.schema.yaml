$schema: http://json-schema.org/draft-07/schema#
title: "ImputationResultSchema"
description: "Schema for the output of a single imputation method run."
type: object
properties:
  method:
    type: string
    enum:
      - CompleteCase
      - SingleMean
      - MICE
    description: "The imputation method used."
  n_imputations:
    type: integer
    minimum: 1
    description: "Number of imputations (m). 1 for CC/Single, m for MICE."
  seed:
    type: integer
    description: "Base random seed used for this run."
  convergence_r_hat:
    type: number
    minimum: 1.0
    description: "R‑hat statistic. 1.0 if not applicable (CC/Single), < 1.05 if converged."
  status:
    type: string
    enum:
      - success
      - failed
      - warning
    description: "Execution status of the imputation."
  error_message:
    type: string
    description: "Error details if status is not success."
  estimated_variance:
    type: number
    minimum: 0.0
    description: "Variance estimate after imputation (pooled if MICE)."
  standard_error:
    type: number
    minimum: 0.0
    description: "Standard error of the variance estimate."
  missingness_mechanism:
    type: string
    enum:
      - MCAR
      - MAR
      - MNAR
      - Unknown
    description: "The assumed missingness mechanism for this run (Constitution VII)."
  convergence_diagnostics:
    type: object
    description: "Detailed convergence diagnostics for MICE runs."
    properties:
      r_hat_max:
        type: number
        description: "Maximum R-hat across all parameters."
      iterations_burned:
        type: integer
        description: "Number of iterations discarded as burn-in."
      iterations_kept:
        type: integer
        description: "Number of iterations retained for pooling."
      chain_convergence_status:
        type: array
        items:
          type: object
          properties:
            chain_id:
              type: integer
            converged:
              type: boolean
            r_hat:
              type: number
    required:
      - r_hat_max
      - iterations_burned
      - iterations_kept
required:
  - method
  - n_imputations
  - seed
  - convergence_r_hat
  - status
  - estimated_variance
  - missingness_mechanism
additionalProperties: false