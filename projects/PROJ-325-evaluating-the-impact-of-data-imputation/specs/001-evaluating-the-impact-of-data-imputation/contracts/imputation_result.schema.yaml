$schema: http://json-schema.org/draft-07/schema#
title: Imputation Result Schema
description: Schema for the results of an imputation method.
type: object
properties:
  method:
    type: string
    description: Name of the imputation method used (e.g., MICE, Single Mean).
  variance_estimate:
    type: number
    description: Estimated variance after imputation.
  standard_error:
    type: number
    description: Standard error of the estimate.
  convergence_diagnostics:
    type: object
    properties:
      r_hat:
        type: number
        description: Gelman-Rubin statistic (if applicable).
      iterations:
        type: integer
        description: Number of iterations run.
      converged:
        type: boolean
        description: Whether the algorithm converged.
required:
  - method
  - variance_estimate
  - standard_error
