$schema: http://json-schema.org/draft-07/schema#
title: Dataset Schema
description: Schema for the input dataset used in imputation analysis.
type: object
properties:
  id:
    type: integer
    description: Unique identifier for the observation.
  value:
    type: number
    description: The primary variable of interest.
  weight:
    type: number
    description: Survey weight for the observation.
  psu:
    type: integer
    description: Primary Sampling Unit identifier.
  strata:
    type: integer
    description: Strata identifier.
  missingness_flag:
    type: boolean
    description: Indicates if the value is missing.
required:
  - id
  - value
  - weight
  - psu
  - strata
