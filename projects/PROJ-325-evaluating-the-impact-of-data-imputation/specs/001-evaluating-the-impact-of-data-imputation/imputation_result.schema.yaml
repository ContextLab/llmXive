$schema: http://json-schema.org/draft-07/schema#
title: Imputation Result Schema
description: >
  Schema for results generated after applying imputation methods (MICE, Single Mean, etc.).
  Contains imputed data statistics, convergence status, and method parameters.
type: object
required:
  - metadata
  - method
  - parameters
  - results
  - status
properties:
  metadata:
    type: object
    required:
      - dataset_id
      - variable
      - imputation_date
    properties:
      dataset_id:
        type: string
      variable:
        type: string
      imputation_date:
        type: string
        format: date-time
  method:
    type: string
    enum: [MICE, SingleMean, CompleteCase]
    description: Imputation method used
  parameters:
    type: object
    description: Method-specific parameters
    properties:
      m:
        type: integer
        description: Number of imputations (for MICE)
      max_iter:
        type: integer
        description: Maximum iterations (for MICE)
      seed:
        type: integer
        description: Random seed used
      burn_in:
        type: integer
        description: Burn-in iterations discarded
  results:
    type: object
    required:
      - mean
      - variance
      - std_error
    properties:
      mean:
        type: number
      variance:
        type: number
      std_error:
        type: number
      ci_lower:
        type: number
      ci_upper:
        type: number
      convergence_status:
        type: string
        enum: [converged, warning, failed]
      convergence_message:
        type: string
  status:
    type: string
    enum: [success, warning, failed]
  error_message:
    type: string
    nullable: true
    description: Error details if status is failed or warning
