$schema: http://json-schema.org/draft-07/schema#
title: Bias Metric Schema
description: >
  Schema for bias metrics comparing imputation methods against ground truth (synthetic)
  or benchmark methods (real data).
type: object
required:
  - metadata
  - comparison
  - metrics
properties:
  metadata:
    type: object
    required:
      - dataset_id
      - ground_truth_source
      - calculation_date
    properties:
      dataset_id:
        type: string
      ground_truth_source:
        type: string
        description: Source of ground truth (e.g., 'synthetic_mar_v1', 'jackknife_benchmark')
      calculation_date:
        type: string
        format: date-time
  comparison:
    type: object
    required:
      - method_a
      - method_b
      - variable
    properties:
      method_a:
        type: string
        description: Primary method (e.g., 'MICE')
      method_b:
        type: string
        description: Baseline method (e.g., 'SingleMean', 'CompleteCase')
      variable:
        type: string
  metrics:
    type: object
    required:
      - true_value
      - method_a_value
      - method_b_value
      - bias_a_pct
      - bias_b_pct
      - relative_efficiency
    properties:
      true_value:
        type: number
        description: True parameter value (mean or variance)
      method_a_value:
        type: number
      method_b_value:
        type: number
      bias_a_pct:
        type: number
        description: Percentage bias for method A: (est - true) / true * 100
      bias_b_pct:
        type: number
        description: Percentage bias for method B
      bias_ratio:
        type: number
        description: |abs(bias_a) / abs(bias_b)|. Used for SC-002 check.
      relative_efficiency:
        type: number
        description: Ratio of variances (Method A / Method B)
      is_pass_sc002:
        type: boolean
        description: True if |MICE_bias| <= 0.8 * |Single_bias| (MAR only)
  notes:
    type: string
    nullable: true