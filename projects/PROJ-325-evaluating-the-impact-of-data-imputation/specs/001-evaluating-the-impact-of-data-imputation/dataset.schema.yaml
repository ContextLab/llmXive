$schema: http://json-schema.org/draft-07/schema#
title: Synthetic Dataset Schema
description: Schema for synthetic datasets used in imputation validation.
type: object
properties:
  id:
    type: integer
    description: Unique identifier for the row.
  covariate_X:
    type: number
    description: Observed covariate used for MAR mechanism generation.
  target_Y:
    type: number
    description: Target variable, may contain NaN for missing values.
required:
  - id
  - covariate_X
  - target_Y
additionalProperties: false
