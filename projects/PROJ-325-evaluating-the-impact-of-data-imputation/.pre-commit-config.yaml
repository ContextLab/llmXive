# Pre-commit configuration for automated linting and formatting
# Install with: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000'] # Prevent large files in repo

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        # Note: ruff-format is a black-compatible formatter. 
        # If you prefer strict black, use the black hook below instead.

  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
        language-version: python3.9
        args: [--config, .black.toml]
