# Ruff configuration for llmXive project
# Enforces PEP 8 compliance and project-specific rules

line-length = 100
target-version = "py39"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function call in argument defaults (common in data pipelines)
    "C901", # Too complex (allow some complexity in analysis scripts)
]

[lint.isort]
known-first-party = ["data_ingestion", "imputation_pipeline", "variance_estimator", "config", "synthetic_generator", "update_state", "setup_project"]
force-single-line = true
lines-between-types = 1

[lint.per-file-ignores]
"code/__init__.py" = ["F401"]
"tests/*" = ["S101", "E501"] # Allow asserts and long lines in tests
