$schema: "http://json-schema.org/draft-07/schema#"
title: "CollapseIntensity"
description: "Schema for identified semantic collapse points (used for sensitivity analysis only)."
type: "object"
properties:
  audio_clip_id:
    type: "string"
    description: "Unique identifier for the audio clip."
  model_name:
    type: "string"
    description: "Name of the ASR model used."
  collapse_intensity_id:
    type: "string"
    description: "ID of the distortion vector where collapse occurred."
  ss_threshold:
    type: "number"
    description: "The SSS threshold at collapse."
  wer_spike_factor:
    type: "number"
    description: "WER multiplier at collapse (e.g., 2.0 for 2× baseline)."
  sensitivity_threshold:
    type: "number"
    description: "The threshold value used in sensitivity analysis."
required:
  - audio_clip_id
  - model_name
  - collapse_intensity_id
  - ss_threshold
  - wer_spike_factor
  - sensitivity_threshold
additionalProperties: false
