$schema: "http://json-schema.org/draft-07/schema#"
title: "Collapse Intensity Schema"
type: object
properties:
  clip_id:
    type: string
    description: "Foreign key to AudioClip."
  model_name:
    type: string
    description: "Name of the ASR model."
  collapse_intensity:
    type: number
    description: "The distortion intensity value at collapse."
  collapse_type:
    type: string
    enum:
      - "Inflection"
      - "Threshold"
      - "None"
    description: "Type of collapse detection."
  sss_at_collapse:
    type: number
    description: "SSS value at the collapse point."
  wer_at_collapse:
    type: number
    description: "WER value at the collapse point."
  fallback_metric:
    type: ["string", "null"]
    description: "Phoneme-level edit distance if SSS failed (FR-022)."
required:
  - clip_id
  - model_name
  - collapse_intensity
  - collapse_type
  - sss_at_collapse
  - wer_at_collapse