$schema: http://json-schema.org/draft-07/schema#
title: Collapse Point Schema
description: Schema for collapse intensity data derived from stress curves
type: object
properties:
  collapse_id:
    type: string
    description: "Unique identifier for the collapse point"
  audio_id:
    type: string
    description: "Foreign key to AudioClip"
  model_id:
    type: string
    description: "ASR model identifier"
  collapse_intensity:
    type: ["number", "string"]
    description: "Distortion intensity at collapse (float or 'None')"
  collapse_type:
    type: string
    enum:
      - "threshold_crossing"
      - "inflection_point"
      - "none"
      - "total_failure"
      - "noise_floor"
    description: "Type of collapse detection"
  ss_at_collapse:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Semantic Similarity Score at collapse"
  wer_at_collapse:
    type: number
    minimum: 0.0
    description: "Word Error Rate at collapse"
  baseline_wer:
    type: number
    minimum: 0.0
    description: "Baseline WER on clean audio"
required:
  - collapse_id
  - audio_id
  - model_id
  - collapse_intensity
  - collapse_type
  - ss_at_collapse
  - wer_at_collapse
  - baseline_wer
additionalProperties: false