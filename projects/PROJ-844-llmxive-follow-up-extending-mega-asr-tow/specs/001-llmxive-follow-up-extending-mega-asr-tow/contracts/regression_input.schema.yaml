$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Input Schema"
description: "Schema for the flattened dataset used to train the collapse prediction model. Target is the Semantic Decay Slope (SSD) or Area Under Stress Curve (AUSC)."
type: "object"
properties:
  audio_clip_id:
    type: "string"
    description: "Unique identifier for the audio clip."
  model_name:
    type: "string"
    description: "Name of the ASR model."
  snr:
    type: "number"
    description: "SNR value (feature)."
  rt60:
    type: "number"
    description: "RT60 value (feature)."
  snr_sq:
    type: "number"
    description: "SNR squared (feature)."
  rt60_sq:
    type: "number"
    description: "RT60 squared (feature)."
  snr_rt60:
    type: "number"
    description: "Interaction term (SNR * RT60)."
  target_ssd:
    type: "number"
    description: "Target variable: Semantic Decay Slope (slope of sigmoid at inflection point)."
  target_ausc:
    type: "number"
    description: "Target variable: Area Under Stress Curve."
  p_value_adjusted:
    type: "number"
    description: "Adjusted p-value for the interaction term (FDR corrected)."
required:
  - audio_clip_id
  - model_name
  - snr
  - rt60
  - snr_sq
  - rt60_sq
  - snr_rt60
  - target_ssd
  - p_value_adjusted
additionalProperties: false
