$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Input Schema"
description: "Schema for the flattened dataset used to train the collapse prediction model. Predictors are acoustic distortion parameters and model architecture features; targets are derived scalars representing the collapse point."
type: "object"
properties:
  clip_id:
    type: "string"
    description: "Grouping variable: Unique identifier for the audio clip."
  model_name:
    type: "string"
    description: "Grouping variable: Name of the ASR model."
  snr:
    type: "number"
    description: "Feature: SNR value (mean‑centered)."
  rt60:
    type: "number"
    description: "Feature: RT60 value (mean‑centered)."
  snr_sq:
    type: "number"
    description: "Feature: SNR squared."
  rt60_sq:
    type: "number"
    description: "Feature: RT60 squared."
  snr_rt60:
    type: "number"
    description: "Feature: Interaction term (SNR * RT60)."
  baseline_sss:
    type: "number"
    description: "Covariate: Baseline SSS on clean audio."
  baseline_wer:
    type: "number"
    description: "Covariate: Baseline WER on clean audio."
  transcript_length:
    type: "integer"
    description: "Covariate: Number of tokens in the reference transcript."
  model_layers:
    type: "integer"
    description: "Feature: Number of layers in the ASR model."
  model_embedding_size:
    type: "integer"
    description: "Feature: Embedding size of the ASR model."
  normalized_inflection_coord:
    type: ["number", "null"]
    description: "Target: Relative position of the inflection point within the normalized SNR/reverberation‑time space (0.0 to 1.0). Null if undefined."
  sigmoid_slope:
    type: ["number", "null"]
    description: "Target: Slope of the fitted sigmoid function at the inflection point ; null if undefined."
required:
  - clip_id
  - model_name
  - snr
  - rt60
  - snr_sq
  - rt60_sq
  - snr_rt60
  - baseline_sss
  - baseline_wer
  - transcript_length
  - model_layers
  - model_embedding_size
  - normalized_inflection_coord
  - sigmoid_slope
additionalProperties: false