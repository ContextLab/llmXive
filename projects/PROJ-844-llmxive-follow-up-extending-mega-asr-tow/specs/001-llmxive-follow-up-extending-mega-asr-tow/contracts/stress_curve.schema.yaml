$schema: "http://json-schema.org/draft-07/schema#"
title: "StressCurve"
description: "Schema for stress curve data linking audio clips, distortion vectors, and ASR results."
type: "object"
properties:
  audio_clip_id:
    type: "string"
    description: "Unique identifier for the audio clip."
  distortion_vector_id:
    type: "string"
    description: "Unique identifier for the distortion vector."
  model_name:
    type: "string"
    description: "Name of the ASR model used (e.g., 'whisper-tiny')."
  ss_score:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Semantic Similarity Score (0.0 to 1.0)."
  normalized_sss:
    type: "number"
    description: "SSS normalized to baseline."
  wer:
    type: "number"
    minimum: 0.0
    description: "Word Error Rate."
  hypothesis:
    type: "string"
    description: "ASR output text."
  is_collapse:
    type: "boolean"
    description: "True if collapse criteria met (SSS < 0.5 AND WER > 2× baseline)."
required:
  - audio_clip_id
  - distortion_vector_id
  - model_name
  - ss_score
  - normalized_sss
  - wer
  - hypothesis
  - is_collapse
additionalProperties: false
