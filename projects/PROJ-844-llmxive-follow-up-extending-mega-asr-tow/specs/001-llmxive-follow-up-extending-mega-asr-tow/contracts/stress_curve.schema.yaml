$schema: "http://json-schema.org/draft-07/schema#"
title: "Stress Curve Record Schema"
type: object
properties:
  clip_id:
    type: string
    description: "Foreign key to AudioClip."
  scenario_id:
    type: integer
    description: "ID of the distortion scenario (1-54)."
  snr_db:
    type: number
    description: "Signal-to-Noise Ratio in dB."
  rt60_sec:
    type: number
    description: "Reverberation time in seconds."
  model_name:
    type: string
    description: "Name of the ASR model used."
  wer:
    type: number
    description: "Word Error Rate."
  sss:
    type: number
    description: "Semantic Similarity Score (0.0 to 1.0)."
  hypothesis:
    type: string
    description: "ASR output text."
required:
  - clip_id
  - scenario_id
  - snr_db
  - rt60_sec
  - model_name
  - wer
  - sss
  - hypothesis