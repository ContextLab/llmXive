$schema: "http://json-schema.org/draft-07/schema#"
title: "Stress Curve Data Schema"
description: "Schema for the stress_curves.parquet file containing distortion parameters and ASR metrics."
type: object
properties:
  stress_id:
    type: string
    description: "Unique identifier for the stress curve record."
  clip_id:
    type: string
    description: "Foreign key to the AudioClip."
  vector_id:
    type: string
    description: "Foreign key to the DistortionVector."
  asr_model:
    type: string
    description: "Name of the ASR model used."
  hypothesis:
    type: string
    description: "Transcription output by the ASR model."
  wer:
    type: number
    description: "Word Error Rate (float)."
  sss_raw:
    type: number
    description: "Raw Semantic Similarity Score (0.0 to 1.0)."
  sss_normalized:
    type: number
    description: "Normalized Semantic Similarity Score (relative to baseline)."
  collapse_flag:
    type: boolean
    description: "True if SSS < 0.5 AND WER > 2× baseline."
  disagreement_flag:
    type: boolean
    description: "True if SSS and WER disagree."
required:
  - stress_id
  - clip_id
  - vector_id
  - asr_model
  - hypothesis
  - wer
  - sss_raw
  - sss_normalized
  - collapse_flag
  - disagreement_flag
additionalProperties: false
