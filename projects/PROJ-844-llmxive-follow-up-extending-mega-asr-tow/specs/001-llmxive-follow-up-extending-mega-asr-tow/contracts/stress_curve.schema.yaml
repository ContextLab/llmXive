$schema: http://json-schema.org/draft-07/schema#
title: Stress Curve Schema
description: Schema for stress curve data generated by the distortion pipeline
type: object
properties:
  curve_id:
    type: string
    description: "Unique identifier for the stress curve record"
  audio_id:
    type: string
    description: "Foreign key to AudioClip"
  model_id:
    type: string
    description: "ASR model identifier (e.g., whisper-tiny)"
  vector_id:
    type: string
    description: "Foreign key to DistortionVector"
  snr_db:
    type: number
    description: "Signal-to-noise ratio in dB"
  rt60_sec:
    type: number
    description: "Reverberation time in seconds"
  ss_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Semantic Similarity Score (0-1)"
  wer:
    type: number
    minimum: 0.0
    description: "Word Error Rate"
  hypothesis:
    type: string
    description: "ASR output hypothesis"
  reference_transcript:
    type: string
    description: "Ground truth transcript"
  timestamp:
    type: string
    format: date-time
    description: "Timestamp of generation"
required:
  - curve_id
  - audio_id
  - model_id
  - vector_id
  - snr_db
  - rt60_sec
  - ss_score
  - wer
  - hypothesis
  - reference_transcript
  - timestamp
additionalProperties: false
