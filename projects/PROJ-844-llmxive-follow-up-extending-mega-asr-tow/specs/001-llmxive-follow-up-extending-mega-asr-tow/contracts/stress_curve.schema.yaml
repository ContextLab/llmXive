$schema: "http://json-schema.org/draft-07/schema#"
title: "Stress Curve"
type: object
required:
  - curve_id
  - audio_id
  - model_id
  - vector_id
  - snr_db
  - rt60_sec
  - ss_score
  - wer
  - hypothesis
  - reference_transcript
  - timestamp
properties:
  curve_id:
    type: string
    description: "Unique identifier for the stress‑curve record"
  audio_id:
    type: string
    description: "Foreign key to the original audio clip"
  model_id:
    type: string
    description: "ASR model identifier (e.g., whisper_tiny)"
  vector_id:
    type: string
    description: "Composite key for the distortion vector"
  snr_db:
    type: number
    description: "Signal‑to‑Noise Ratio in dB"
  rt60_sec:
    type: number
    description: "Reverberation time in seconds"
  ss_score:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Semantic Similarity Score (0‑1)"
  wer:
    type: number
    description: "Word Error Rate (0‑1)"
  hypothesis:
    type: string
    description: "ASFA ? ? "
  reference_transcript:
    type: string
    description: "Ground ? ? "
  timestamp:
    type: string
    format: date-time
    description: "Timestamp ? "
additionalProperties: false