$schema: "http://json-schema.org/draft-07/schema#"
title: "BMG Entry Schema"
description: "Schema for Bulk Metallic Glass data entries"
type: object
required:
  - composition
  - shear_modulus_GPa
  - source
properties:
  composition:
    type: string
    description: "Chemical composition string (e.g., Zr40Cu30Ni10Be20)"
  source:
    type: string
    description: "Data source (e.g., 'synthetic', 'Materials Project')"
  atomic_radii_avg:
    type: number
    description: "Average atomic radius in Angstroms"
  electronegativity:
    type: number
    description: "Average electronegativity (Pauling scale)"
  shear_modulus_GPa:
    type: number
    description: "Shear modulus in GPa"
    minimum: 0
  alloy_family:
    type: string
    description: "Derived alloy family (e.g., Zr-based)"
  delta:
    type: number
    description: "Atomic size difference parameter"
  delta_h_mix:
    type: number
    description: "Enthalpy of mixing"
  vec:
    type: number
    description: "Valence electron concentration"
  delta_chi:
    type: number
    description: "Electronegativity difference"
