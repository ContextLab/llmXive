# Standalone Ruff configuration file
# Extends settings from pyproject.toml if needed, but this file
# ensures linter configuration is explicitly available in the root.

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
line-length = 100
target-version = "py311"

[lint.isort]
known-first-party = ["code", "utils", "data", "models", "viz"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
