# Ruff Configuration for llmXive BMG Project
# Implements linting rules as per project standards

target-version = "py311"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "B008", # Do not perform function call in argument defaults (common in ML)
]

[lint.isort]
known-first-party = ["code"]
force-single-line = false
lines-after-imports = 2

[lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in init files for public API
