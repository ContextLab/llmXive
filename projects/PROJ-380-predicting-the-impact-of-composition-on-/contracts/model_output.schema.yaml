$schema: http://json-schema.org/draft-07/schema#
title: ModelPerformance
description: |
  Schema for the model output report generated by the training and evaluation pipeline.
  This schema validates the structure of `artifacts/model_report.json`.
type: object
required:
  - metrics
  - hyperparameters
  - statistical_test
properties:
  metrics:
    type: object
    description: Performance metrics of the best model.
    required:
      - R2
      - MAE
      - RMSE
    properties:
      R2:
        type: number
        description: Coefficient of determination (R-squared).
        minimum: -1.0
      MAE:
        type: number
        description: Mean Absolute Error.
        minimum: 0.0
      RMSE:
        type: number
        description: Root Mean Squared Error.
        minimum: 0.0
  hyperparameters:
    type: object
    description: |
      The best hyperparameters found during grid search.
      Keys and values depend on the specific model (Linear, RF, GB).
    additionalProperties: true
  statistical_test:
    type: object
    description: Results of the statistical comparison between models.
    required:
      - method
      - p_value
      - confidence_interval
    properties:
      method:
        type: string
        description: Name of the statistical test used (e.g., 'Corrected Resampled t-test', 'Wilcoxon Signed-Rank Test').
      p_value:
        type: number
        description: The calculated p-value from the test.
      confidence_interval:
        type: array
        description: The 95% confidence interval for the performance difference.
        items:
          type: number
        minItems: 2
        maxItems: 2
  metadata:
    type: object
    description: Optional metadata about the run.
    properties:
      timestamp:
        type: string
        format: date-time
      seed:
        type: integer
      model_type:
        type: string
      dataset_hash:
        type: string
        description: SHA-256 hash of the input dataset used for training.
additionalProperties: false