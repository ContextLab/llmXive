$schema: http://json-schema.org/draft-07/schema#
title: ModelPerformance
description: >
  Schema defining the structure of model performance reports generated by the
  BMG shear modulus prediction pipeline. This schema is used to validate the
  JSON artifacts produced by code/models/generate_report.py.
type: object
required:
  - model_name
  - metrics
  - hyperparameters
  - statistical_test
  - timestamp
  - data_checksum
properties:
  model_name:
    type: string
    description: Name of the trained model (e.g., "RandomForest", "LinearRegression")
    examples:
      - "RandomForest"
      - "GradientBoosting"
      - "LinearRegression"

  metrics:
    type: object
    description: Performance metrics calculated on the test set
    required:
      - R2
      - MAE
      - RMSE
    properties:
      R2:
        type: number
        description: Coefficient of determination (R-squared)
        minimum: -1.0
      MAE:
        type: number
        description: Mean Absolute Error
        minimum: 0.0
      RMSE:
        type: number
        description: Root Mean Squared Error
        minimum: 0.0
      MAPE:
        type: number
        description: Mean Absolute Percentage Error (optional)
        minimum: 0.0
      min_error:
        type: number
        description: Minimum absolute error observed
        minimum: 0.0
      max_error:
        type: number
        description: Maximum absolute error observed
        minimum: 0.0

  hyperparameters:
    type: object
    description: Final hyperparameters used for the best model
    additionalProperties: true
    examples:
      - n_estimators: 100
        max_depth: 10
        min_samples_split: 5
      - alpha: 1.0
        fit_intercept: true

  statistical_test:
    type: object
    description: Results from the statistical comparison test (Corrected Resampled t-test, Wilcoxon, or Bayes Factor)
    required:
      - method
      - p_value
    properties:
      method:
        type: string
        description: Name of the statistical test used
        enum:
          - "Corrected Resampled t-test"
          - "Wilcoxon Signed-Rank Test"
          - "Bayes Factor"
      p_value:
        type: number
        description: P-value from the statistical test
        minimum: 0.0
        maximum: 1.0
      confidence_interval:
        type: array
        description: 95% confidence interval for the performance difference
        items:
          type: number
        minItems: 2
        maxItems: 2
      effect_size:
        type: number
        description: Effect size (e.g., Cohen's d) if calculated
      comparison_baseline:
        type: string
        description: Name of the baseline model being compared against

  validation_strategy:
    type: object
    description: Details about the cross-validation strategy used
    required:
      - type
      - folds
    properties:
      type:
        type: string
        description: Type of validation strategy
        enum:
          - "GroupKFold"
          - "Leave-One-Family-Out"
          - "Hybrid LOFO/GroupKFold"
      folds:
        type: integer
        description: Number of folds used
        minimum: 2
      groups:
        type: array
        description: List of alloy families used for grouping (if applicable)
        items:
          type: string

  feature_importance:
    type: object
    description: Optional feature importance scores if available
    properties:
      method:
        type: string
        description: Method used for importance calculation (e.g., "permutation", "gain")
      scores:
        type: object
        description: Feature names mapped to their importance scores
        additionalProperties:
          type: number

  data_checksum:
    type: string
    description: SHA-256 checksum of the training data used (for provenance)
    pattern: "^[a-f0-9]{64}$"

  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the report was generated

  pipeline_version:
    type: string
    description: Version of the pipeline that generated this report
    examples:
      - "1.0.0"

  notes:
    type: string
    description: Optional notes or warnings about the model training or evaluation
additionalProperties: false