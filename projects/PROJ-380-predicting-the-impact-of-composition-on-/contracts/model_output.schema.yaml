$schema: http://json-schema.org/draft-07/schema#
title: ModelPerformance
description: >
  Schema for the model evaluation report generated by the BMG shear modulus
  prediction pipeline. Matches the output structure of `artifacts/model_report.json`.
type: object
required:
  - metrics
  - hyperparameters
  - statistical_test
properties:
  metrics:
    type: object
    description: >
      Performance metrics calculated on the held-out test set.
    required:
      - R2
      - MAE
      - RMSE
    properties:
      R2:
        type: number
        description: Coefficient of determination (R-squared).
        minimum: -1.0
      MAE:
        type: number
        description: Mean Absolute Error in GPa.
        minimum: 0.0
      RMSE:
        type: number
        description: Root Mean Squared Error in GPa.
        minimum: 0.0
    additionalProperties: false
  hyperparameters:
    type: object
    description: >
      The final hyperparameters used for the best model configuration
      after grid search and cross-validation.
    additionalProperties: true
  statistical_test:
    type: object
    description: >
      Results of the statistical comparison between models (e.g., 
      Corrected Resampled t-test or Paired Permutation Test).
    required:
      - method
      - p_value
      - confidence_interval
    properties:
      method:
        type: string
        description: >
          Name of the statistical test performed. 
          Allowed values: "Corrected Resampled t-test", "Paired Permutation Test", "Wilcoxon Signed-Rank Test".
        enum:
          - "Corrected Resampled t-test"
          - "Paired Permutation Test"
          - "Wilcoxon Signed-Rank Test"
      p_value:
        type: number
        description: The calculated p-value of the test.
        minimum: 0.0
        maximum: 1.0
      confidence_interval:
        type: array
        description: >
          A list of two floats representing the 95% confidence interval 
          for the difference in performance.
        items:
          type: number
        minItems: 2
        maxItems: 2
    additionalProperties: false
  model_type:
    type: string
    description: The type of model that achieved the best performance (e.g., "RandomForest", "GradientBoosting", "LinearRegression").
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the report was generated.
  data_version:
    type: string
    description: SHA-256 hash of the processed data file used for training, for provenance.
additionalProperties: false