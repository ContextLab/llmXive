$schema: http://json-schema.org/draft-07/schema#
title: ModelPerformance
description: >-
  Schema for the model performance report generated by the BMG shear modulus
  prediction pipeline. Validates the output of `code/models/generate_report.py`
  and `artifacts/model_report.json`.
type: object
required:
  - metrics
  - hyperparameters
  - statistical_test
  - generated_at
  - model_type
additionalProperties: false
properties:
  model_type:
    type: string
    description: >-
      The type of model evaluated (e.g., "LinearRegression", "RandomForest",
      "GradientBoosting").
    examples:
      - "RandomForest"
      - "GradientBoosting"
      - "LinearRegression"

  generated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the report was generated.

  metrics:
    type: object
    description: >-
      Performance metrics calculated on the test set or via cross-validation.
    required:
      - R2
      - MAE
      - RMSE
    additionalProperties: false
    properties:
      R2:
        type: number
        description: Coefficient of determination (R-squared).
        minimum: -1.0
        maximum: 1.0
      MAE:
        type: number
        description: Mean Absolute Error.
        minimum: 0.0
      RMSE:
        type: number
        description: Root Mean Squared Error.
        minimum: 0.0
      # Optional additional metrics if generated by the pipeline
      MAPE:
        type: number
        description: Mean Absolute Percentage Error (optional).
        minimum: 0.0

  hyperparameters:
    type: object
    description: >-
      The final hyperparameters used for the best model configuration.
      Structure depends on the model type.
    additionalProperties: true
    examples:
      - n_estimators: 100
        max_depth: 5
        min_samples_split: 2
      - alpha: 1.0
        fit_intercept: true

  statistical_test:
    type: object
    description: >-
      Results of the statistical comparison between models (e.g., Corrected
      Resampled t-test, Wilcoxon Signed-Rank).
    required:
      - method
      - p_value
    additionalProperties: false
    properties:
      method:
        type: string
        description: Name of the statistical test performed.
        enum:
          - "Corrected Resampled t-test"
          - "Wilcoxon Signed-Rank Test"
          - "Bayes Factor"
      p_value:
        type: number
        description: The calculated p-value.
        minimum: 0.0
        maximum: 1.0
      confidence_interval:
        type: array
        description: 95% Confidence Interval for the performance difference.
        items:
          type: number
        minItems: 2
        maxItems: 2
      statistic:
        type: number
        description: The test statistic value (optional).

  comparison_baseline:
    type: object
    description: >-
      Information about the baseline model used for comparison in the
      statistical test (optional).
    required:
      - model_type
    additionalProperties: false
    properties:
      model_type:
        type: string
      metrics:
        type: object
        properties:
          R2:
            type: number
          MAE:
            type: number
          RMSE:
            type: number

  feature_importance:
    type: array
    description: >-
      Optional list of feature importances if available for the model.
      Sorted by importance descending.
    items:
      type: object
      required:
        - feature
        - importance
      properties:
        feature:
          type: string
        importance:
          type: number
          minimum: 0.0

  validation_strategy:
    type: object
    description: Details about the validation strategy used.
    required:
      - strategy_name
    additionalProperties: false
    properties:
      strategy_name:
        type: string
        enum:
          - "Hybrid LOFO/GroupKFold"
          - "GroupKFold"
          - "Leave-One-Family-Out"
          - "K-Fold"
      n_splits:
        type: integer
        minimum: 2
      groups:
        type: array
        description: List of alloy families used for grouping (optional).
        items:
          type: string