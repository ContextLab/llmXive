$schema: http://json-schema.org/draft-07/schema#
title: BMGEntry
description: |
  Schema for a single Bulk Metallic Glass (BMG) entry.
  Defines the structure for source information, elemental composition,
  and the target shear modulus property.
type: object
required:
  - source
  - composition
  - modulus
properties:
  source:
    type: object
    description: Metadata regarding the origin of the data point.
    required:
      - database
      - id
      - reference
    properties:
      database:
        type: string
        description: Name of the database or literature source (e.g., "MaterialsProject", "Inoue2003").
        minLength: 1
      id:
        type: string
        description: Unique identifier within the source database.
        minLength: 1
      reference:
        type: string
        description: Full citation or URL to the source paper/report.
        minLength: 1
      year:
        type: integer
        description: Year of publication or data generation.
        minimum: 1900
        maximum: 2100
        nullable: true

  composition:
    type: object
    description: Elemental composition of the alloy.
    required:
      - elements
      - units
    properties:
      elements:
        type: object
        description: |
          Map of element symbols to their values.
          Keys must be valid chemical symbols (e.g., "Zr", "Cu").
          Values depend on the units specified.
        additionalProperties:
          type: number
          minimum: 0
      units:
        type: string
        description: Unit of the composition values.
        enum:
          - at%
          - wt%
        default: "at%"

  modulus:
    type: object
    description: Shear modulus measurement.
    required:
      - value
      - unit
    properties:
      value:
        type: number
        description: Shear modulus value.
        minimum: 0
      unit:
        type: string
        description: Unit of the shear modulus.
        enum:
          - GPa
          - MPa
        default: "GPa"

  metadata:
    type: object
    description: Optional additional metadata.
    properties:
      processing_date:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the record was processed.
      notes:
        type: string
        description: Free-form notes about the data point.

additionalProperties: false