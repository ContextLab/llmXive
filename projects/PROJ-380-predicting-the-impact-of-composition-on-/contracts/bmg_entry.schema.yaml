$schema: http://json-schema.org/draft-07/schema#
title: BMGEntry
description: >
  Schema for a single Bulk Metallic Glass (BMG) data entry.
  Defines the structure for source metadata, elemental composition,
  and the target shear modulus property.
type: object
required:
  - source
  - composition
  - modulus_gpa
properties:
  source:
    type: object
    description: Metadata regarding the origin of the data point.
    required:
      - database
      - id
      - retrieval_date
    properties:
      database:
        type: string
        description: Name of the source database (e.g., "Materials Project", "Synthetic").
        enum:
          - Materials Project
          - Synthetic
          - Literature
      id:
        type: string
        description: Unique identifier for the entry within the source database.
      retrieval_date:
        type: string
        format: date
        description: Date the data was retrieved (ISO 8601 format YYYY-MM-DD).
      original_formula:
        type: string
        description: Original chemical formula string as found in the source (optional).
    
  composition:
    type: object
    description: Elemental composition of the alloy.
    required:
      - elements
      - atomic_fractions
    properties:
      elements:
        type: array
        items:
          type: string
        description: List of chemical symbols (e.g., ["Zr", "Ti", "Cu", "Ni", "Be"]).
        minItems: 2
      atomic_fractions:
        type: array
        items:
          type: number
          minimum: 0.0
          maximum: 1.0
        description: >
          List of atomic fractions corresponding to the elements list.
          Must sum to 1.0 (within floating point tolerance).
        minItems: 2
      weight_fractions:
        type: array
        items:
          type: number
          minimum: 0.0
          maximum: 1.0
        description: >
          Optional: List of weight fractions corresponding to elements.
          Used for standardization steps.
    
  modulus:
    type: object
    description: Shear modulus measurement.
    required:
      - value
      - unit
    properties:
      value:
        type: number
        description: Shear modulus value.
        minimum: 0.0
      unit:
        type: string
        description: Unit of measurement.
        enum:
          - GPa
          - MPa
        default: GPa
      method:
        type: string
        description: Measurement or calculation method (e.g., "DFT", "Experimental", "Rule of Mixtures").
        enum:
          - DFT
          - Experimental
          - Rule of Mixtures
          - Estimated
      uncertainty:
        type: number
        minimum: 0.0
        description: Optional uncertainty value (standard deviation or error margin).
  
  derived_features:
    type: object
    description: >
      Optional: Pre-calculated compositional descriptors (δ, ΔHmix, VEC, Δχ).
      If present, these are used to skip calculation in the feature engineering pipeline.
    properties:
      delta_r:
        type: number
        description: Atomic radius mismatch (δ).
      delta_h_mix:
        type: number
        description: Enthalpy of mixing (ΔHmix) in kJ/mol.
      vec:
        type: number
        description: Valence Electron Concentration (VEC).
      delta_chi:
        type: number
        description: Electronegativity difference (Δχ).
      omega:
        type: number
        description: Omega parameter (optional).
      atomic_percent:
        type: number
        description: Total atomic percent (should be ~100).
additionalProperties: false
examples:
  - source:
      database: Materials Project
      id: "mp-123456"
      retrieval_date: "2023-10-27"
      original_formula: "Zr41.2Ti13.8Cu12.5Ni10Be22.5"
    composition:
      elements: ["Zr", "Ti", "Cu", "Ni", "Be"]
      atomic_fractions: [0.412, 0.138, 0.125, 0.10, 0.225]
    modulus:
      value: 35.5
      unit: GPa
      method: DFT
    derived_features:
      delta_r: 4.2
      delta_h_mix: -12.5
      vec: 4.15
      delta_chi: 0.85
      atomic_percent: 100.0