$schema: http://json-schema.org/draft-07/schema#
title: BMGEntry
description: |
  Schema for a single Bulk Metallic Glass (BMG) entry.
  Defines the structure for source metadata, elemental composition,
  and the target shear modulus property.
type: object
required:
  - source
  - composition
  - modulus
properties:
  source:
    type: object
    description: Metadata regarding the origin of this data point.
    required:
      - database
      - identifier
      - reference
    properties:
      database:
        type: string
        description: Name of the source database (e.g., 'Materials Project', 'Literature').
        minLength: 1
      identifier:
        type: string
        description: Unique ID within the source database.
        minLength: 1
      reference:
        type: string
        description: Citation string or URL for the data source.
        minLength: 1
      retrieved_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of data retrieval.
        nullable: true

  composition:
    type: object
    description: Elemental composition of the alloy.
    required:
      - elements
      - units
    properties:
      elements:
        type: object
        description: |
          Map of element symbol to concentration.
          Keys are chemical symbols (e.g., 'Zr', 'Cu'), values are numbers.
        patternProperties:
          "^[A-Z][a-z]?$":
            type: number
            minimum: 0
        additionalProperties: false
      units:
        type: string
        description: Unit of concentration.
        enum:
          - at%
          - wt%
        default: at%
      alloy_family:
        type: string
        description: Primary alloy family classification (e.g., 'Zr-based').
        nullable: true

  modulus:
    type: object
    description: Shear modulus measurement.
    required:
      - value
      - unit
    properties:
      value:
        type: number
        description: Shear modulus value.
        minimum: 0
      unit:
        type: string
        description: Unit of the modulus.
        enum:
          - GPa
          - MPa
        default: GPa
      method:
        type: string
        description: Measurement or calculation method (e.g., 'Resonant Ultrasound', 'Nanoindentation').
        nullable: true

additionalProperties: false