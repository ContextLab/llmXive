$schema: http://json-schema.org/draft-07/schema#
title: BMGEntry
description: >
  Schema for a single Bulk Metallic Glass (BMG) entry.
  Defines the structure for source metadata, elemental composition,
  and the target shear modulus property.
type: object
required:
  - source
  - composition
  - modulus_shear_gpa
properties:
  source:
    type: object
    description: Metadata regarding the origin of this data point.
    required:
      - database
      - material_id
      - citation
    properties:
      database:
        type: string
        description: Name of the source database (e.g., 'Materials Project', 'NIST').
        examples:
          - "Materials Project"
      material_id:
        type: string
        description: Unique identifier within the source database.
        examples:
          - "mp-123456"
      citation:
        type: string
        description: DOI or reference string for the source publication.
        examples:
          - "10.1038/s41524-020-00366-3"
      retrieval_date:
        type: string
        format: date
        description: Date the data was fetched (ISO 8601).
        examples:
          - "2023-10-27"

  composition:
    type: object
    description: Elemental composition of the alloy.
    required:
      - elements
      - weights_wt_percent
      - weights_at_percent
    properties:
      elements:
        type: array
        items:
          type: string
        description: List of chemical symbols present in the alloy (sorted).
        minItems: 2
        examples:
          - ["Zr", "Cu", "Al"]
      weights_wt_percent:
        type: array
        items:
          type: number
          minimum: 0
          maximum: 100
        description: Weight percentages of the elements (aligned with 'elements' list).
        minItems: 2
        examples:
          - [60.0, 30.0, 10.0]
      weights_at_percent:
        type: array
        items:
          type: number
          minimum: 0
          maximum: 100
        description: Atomic percentages of the elements (aligned with 'elements' list).
        minItems: 2
        examples:
          - [65.2, 28.5, 6.3]

  modulus_shear_gpa:
    type: number
    description: Shear modulus in GPa.
    minimum: 0
    examples:
      - 35.4
      - 42.1

  descriptors:
    type: object
    description: >
      Calculated compositional descriptors used for modeling.
      Optional at ingestion, required at training.
    properties:
      delta:
        type: number
        description: Atomic size difference parameter (delta).
        minimum: 0
      delta_h_mix:
        type: number
        description: Enthalpy of mixing (kJ/mol).
      vec:
        type: number
        description: Valence Electron Concentration.
      delta_chi:
        type: number
        description: Electronegativity difference.
      vif_scores:
        type: object
        description: Variance Inflation Factor scores for features, if applicable.
        additionalProperties:
          type: number
        nullable: true

  metadata:
    type: object
    description: Internal pipeline metadata.
    properties:
      processed_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of processing.
      pipeline_version:
        type: string
        description: Version of the ingestion pipeline.
      checksum:
        type: string
        description: SHA-256 checksum of the raw source entry.

additionalProperties: false