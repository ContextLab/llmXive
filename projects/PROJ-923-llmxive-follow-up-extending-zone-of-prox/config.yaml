# Configuration for llmXive Follow-up: Extending Zone of Proximal Policy Optimization
# This file defines all hyperparameters and paths required for the simulation.

project:
  name: "llmXive-Follow-up-Extending-Zone"
  version: "1.0.0"
  seed: 42

paths:
  data_dir: "data"
  output_dir: "data/metrics"
  figures_dir: "data/figures"
  state_dir: "state"
  contracts_dir: "contracts"

simulation:
  buffer_cycles: 100
  noise_sigma: 0.05
  # ZPPO Learning Dynamics Parameters (T005 Requirement)
  alpha: 0.1  # Learning rate for confidence update
  initial_candidate_pool_size: 10  # N in the prompt_length_factor formula
  epsilon: 0.01  # Minimum threshold for factor calculations

mmlu:
  subset: "high_school_mathematics"
  held_out_subset: "high_school_computer_science"

caps:
  # Confidence Adaptive Pruning Thresholds
  rejected_threshold: 0.1
  accepted_threshold: 0.9
  min_candidates: 1

logging:
  level: "INFO"
