$schema: "http://json-schema.org/draft-07/schema#"
title: "Aggregated Metrics Schema"
description: "Schema for validating aggregated metrics from the comparative analysis pipeline"

type: object
required:
  - baseline_aucc
  - cap_aucc
  - p_value
  - effect_size
  - runs_count
  - tasks
  - validation_timestamp

properties:
  baseline_aucc:
    type: number
    description: "Area Under the Convergence Curve for the static baseline"
    minimum: 0
    maximum: 1

  cap_aucc:
    type: number
    description: "Area Under the Convergence Curve for the CAP-ZPPO variant"
    minimum: 0
    maximum: 1

  aucc_difference:
    type: number
    description: "Difference in AUCC (CAP - Baseline)"

  p_value:
    type: number
    description: "P-value from paired t-test comparing AUCC distributions"
    minimum: 0
    maximum: 1

  effect_size:
    type: number
    description: "Cohen's d effect size for the AUCC difference"

  aucc_std_baseline:
    type: number
    description: "Standard deviation of AUCC for baseline runs"
    minimum: 0

  aucc_std_cap:
    type: number
    description: "Standard deviation of AUCC for CAP runs"
    minimum: 0

  runs_count:
    type: integer
    description: "Total number of simulation runs"
    minimum: 1

  tasks:
    type: array
    description: "List of task identifiers used in the simulation"
    items:
      type: string
    minItems: 1

  final_accuracy_baseline:
    type: number
    description: "Final accuracy on held-out data for baseline"
    minimum: 0
    maximum: 1

  final_accuracy_cap:
    type: number
    description: "Final accuracy on held-out data for CAP"
    minimum: 0
    maximum: 1

  catastrophic_forcing_detected:
    type: boolean
    description: "Whether catastrophic forgetting was detected"

  average_prompt_length_baseline:
    type: number
    description: "Average prompt length for baseline (should be constant)"
    minimum: 0

  average_prompt_length_cap:
    type: number
    description: "Average prompt length for CAP (dynamic)"
    minimum: 0

  prompt_length_reduction_pct:
    type: number
    description: "Percentage reduction in prompt length for CAP vs baseline"
    minimum: 0
    maximum: 100

  validation_timestamp:
    type: string
    description: "ISO 8601 timestamp of validation"
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"

  config_snapshot:
    type: object
    description: "Snapshot of configuration used for the runs"
    properties:
      seed:
        type: integer
      noise_sigma:
        type: number
      num_cycles:
        type: integer
      cap_threshold_rejected:
        type: number
      cap_threshold_accepted:
        type: number

  additional_notes:
    type: string
    description: "Optional notes about the validation or results"

additionalProperties: true
