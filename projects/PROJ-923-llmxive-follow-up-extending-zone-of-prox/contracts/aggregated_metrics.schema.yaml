$schema: http://json-schema.org/draft-07/schema#
$id: aggregated_metrics
title: Aggregated Metrics Schema
description: >
  Schema for storing aggregated metrics resulting from ZPPO and CAP-ZPPO simulation runs.
  Includes Area Under the Convergence Curve (AUCC), final accuracy, and prompt length statistics.
  Used by T031 (batch runner) and T033 (validation).
type: object
required:
  - task_id
  - seed
  - aucc
  - final_accuracy
  - prompt_length_avg
  - run_timestamp
  - version
properties:
  task_id:
    type: string
    description: Identifier of the MMLU task or simulation subject (e., "mmlu:formal_logic").
    minLength: 1
  seed:
    type: integer
    description: Random seed used for this simulation run to ensure reproducibility.
    minimum: 0
  aucc:
    type: number
    format: float
    description: Area Under the Convergence Curve (AUCC).
    minimum: 0.0
    maximum: 1.0
    multipleOf: 0.0001
  final_accuracy:
    type: number
    format: float
    description: Final accuracy achieved at the last cycle of the simulation.
    minimum: 0.0
    maximum: 1.0
    multipleOf: 0.0001
  prompt_length_avg:
    type: number
    format: float
    description: Average prompt length (number of negative candidates included) across all cycles.
    minimum: 0.0
  prompt_length_std:
    type: number
    format: float
    description: Standard deviation of prompt lengths across cycles (optional, for deeper analysis).
    minimum: 0.0
  num_cycles:
    type: integer
    description: Total number of training cycles in this simulation.
    minimum: 1
  model_variant:
    type: string
    description: The variant of the simulation run (e., "static_baseline", "cap_zppo").
    enum:
      - static_baseline
      - cap_zppo
  run_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when this run was executed.
  version:
    type: string
    description: Version of the schema used to validate this record.
    enum:
      - "1.0.0"
  metadata:
    type: object
    description: Optional additional metadata for the run.
    properties:
      config_hash:
        type: string
        description: SHA-256 hash of the configuration used.
      notes:
        type: string
        description: Free-form notes about the run.
additionalProperties: false