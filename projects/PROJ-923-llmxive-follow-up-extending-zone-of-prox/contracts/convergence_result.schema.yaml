$schema: "http://json-schema.org/draft-07/schema#"
title: "Convergence Result Schema"
description: >
  Defines the structure for per-cycle convergence data in the ZPPO simulation.
  This schema tracks the evolution of student performance and prompt content
  over training cycles to analyze convergence behavior.
type: object
required:
  - run_id
  - task_id
  - seed
  - cycles
  - start_time
  - end_time
  - total_cycles
properties:
  run_id:
    type: string
    description: "Unique identifier for this simulation run"
    pattern: "^[a-zA-Z0-9_-]+$"
  
  task_id:
    type: string
    description: "Identifier of the task being simulated (e.g., MMLU subject)"
    pattern: "^[a-zA-Z0-9_-]+$"
  
  seed:
    type: integer
    description: "Random seed used for reproducibility"
    minimum: 0
  
  start_time:
    type: string
    format: date-time
    description: "ISO 8601 timestamp when the simulation started"
  
  end_time:
    type: string
    format: date-time
    description: "ISO 8601 timestamp when the simulation ended"
  
  total_cycles:
    type: integer
    description: "Total number of training cycles executed"
    minimum: 1
  
  cycles:
    type: array
    description: "Array of per-cycle results ordered by cycle index"
    minItems: 1
    items:
      type: object
      required:
        - cycle_index
        - accuracy
        - prompt_content
        - prompt_length
        - candidate_count
        - timestamp
      properties:
        cycle_index:
          type: integer
          description: "Zero-based index of the cycle"
          minimum: 0
        
        accuracy:
          type: number
          description: "Student accuracy on the held-out test set for this cycle"
          minimum: 0.0
          maximum: 1.0
        
        prompt_content:
          type: string
          description: "The actual NCQ prompt content used in this cycle (truncated or full)"
          maxLength: 65536
        
        prompt_length:
          type: integer
          description: "Number of tokens/characters in the prompt"
          minimum: 1
        
        candidate_count:
          type: integer
          description: "Number of negative candidates included in the prompt"
          minimum: 0
        
        timestamp:
          type: string
          format: date-time
          description: "ISO 8601 timestamp when this cycle completed"
      
      additionalProperties: false
  
  metadata:
    type: object
    description: "Optional additional metadata about the run"
    properties:
      model_variant:
        type: string
        enum:
          - static_zppo
          - cap_zppo
        description: "Which ZPPO variant was executed"
      config_path:
        type: string
        description: "Path to the configuration file used"
      notes:
        type: string
        description: "Any additional notes about the run"
    additionalProperties: true
additionalProperties: false