$schema: http://json-schema.org/draft-07/schema#
title: Convergence Result Schema
description: Schema for the detailed convergence data of a single run.
type: object
required:
  - run_id
  - cycles
  - curve_data
properties:
  run_id:
    type: string
  cycles:
    type: integer
    description: Total number of cycles executed.
  curve_data:
    type: array
    description: List of data points for the convergence curve.
    items:
      type: object
      required:
        - cycle
        - accuracy
        - prompt_length
      properties:
        cycle:
          type: integer
        accuracy:
          type: number
          minimum: 0.0
          maximum: 1.0
        prompt_length:
          type: integer
        avg_student_confidence:
          type: number
        avg_expert_confidence:
          type: number
  summary:
    type: object
    properties:
      initial_accuracy:
        type: number
      final_accuracy:
        type: number
      convergence_rate:
        type: number
        description: Slope of the linear fit to the early convergence phase.