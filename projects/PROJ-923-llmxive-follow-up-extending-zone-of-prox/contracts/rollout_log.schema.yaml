$schema: http://json-schema.org/draft-07/schema#
title: Rollout Log Schema
description: Schema for a single training cycle's rollout log containing student and expert interactions.
type: object
required:
  - cycle_id
  - task_id
  - timestamp
  - steps
  - student_confidence_history
  - expert_confidence_history
  - ncq_prompt_length
properties:
  cycle_id:
    type: integer
    description: Unique identifier for the training cycle.
  task_id:
    type: string
    description: Identifier for the specific MMLU task or synthetic task ID.
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the cycle execution.
  steps:
    type: array
    description: List of interaction steps within the cycle.
    items:
      type: object
      required:
        - step_id
        - question
        - student_response
        - expert_response
        - student_confidence
        - expert_confidence
        - accepted
      properties:
        step_id:
          type: integer
        question:
          type: string
        student_response:
          type: string
        expert_response:
          type: string
        student_confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
        expert_confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
        accepted:
          type: boolean
          description: Whether the student response was accepted (correct).
  student_confidence_history:
    type: array
    description: Historical confidence scores for the student across this cycle.
    items:
      type: number
      minimum: 0.0
      maximum: 1.0
  expert_confidence_history:
    type: array
    description: Historical confidence scores for the expert across this cycle.
    items:
      type: number
      minimum: 0.0
      maximum: 1.0
  ncq_prompt_length:
    type: integer
    description: Number of negative candidates included in the prompt for this cycle.
