$schema: http://json-schema.org/draft-07/schema#
title: Rollout Log Schema
description: |
  Defines the structure of the synthetic rollout log generated by T012.
  This is the Single Source of Truth for T013b validation.
type: object
required:
  - metadata
  - rollout_entries
properties:
  metadata:
    type: object
    required:
      - version
      - seed
      - generator
      - timestamp
    properties:
      version:
        type: string
        description: Schema version identifier
      seed:
        type: integer
        description: Random seed used for generation
      generator:
        type: string
        description: Name of the generator module
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation
  rollout_entries:
    type: array
    description: List of rollout records per cycle/task
    items:
      type: object
      required:
        - cycle_id
        - task_id
        - task_type
        - confidence
        - ground_truth
        - predicted
        - prompt_length
        - noise_applied
      properties:
        cycle_id:
          type: integer
          description: The training cycle number (0-indexed)
        task_id:
          type: string
          description: Unique identifier for the task (e.g., 'llm_math_001')
        task_type:
          type: string
          enum: [LLM, VLM]
          description: Modality of the task
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Student confidence score (0.0 to 1.0)
        ground_truth:
          type: string
          description: Correct answer or label
        predicted:
          type: string
          description: Student's predicted answer
        prompt_length:
          type: integer
          minimum: 0
          description: Length of the NCQ prompt in tokens/characters
        noise_applied:
          type: number
          description: The specific noise value added to the confidence score
