$schema: http://json-schema.org/draft-07/schema#
title: Rollout Log Schema
description: >
  Single Source of Truth for student responses, confidence scores, and task IDs.
  Used by T012 (Synthetic Rollout Log Generator) and T033 (Results Validation).
  Defines the structure of the JSONL or JSON file containing simulation traces.
type: object
required:
  - task_id
  - cycle_number
  - student_response
  - confidence_score
  - ground_truth
  - prompt_length
properties:
  task_id:
    type: string
    description: Unique identifier for the MMLU subject/task (e., 'mmlu_mathematics_0').
    pattern: "^[a-z_]+_\\d+$"
  cycle_number:
    type: integer
    description: The training cycle index (0-based) where this entry was generated.
    minimum: 0
  student_response:
    type: string
    description: The text response generated by the simulated student model.
    minLength: 1
  confidence_score:
    type: number
    description: >
      The confidence score assigned by the student to their response.
      Range: [0.0, 1.0].
      May include Gaussian noise injection as per FR-008.
    minimum: 0.0
    maximum: 1.0
  ground_truth:
    type: string
    description: The correct answer label or text from the MMLU dataset.
  prompt_length:
    type: integer
    description: Total number of tokens/words in the prompt used for this cycle.
    minimum: 1
  is_correct:
    type: boolean
    description: Whether the student_response matches the ground_truth.
  negative_candidates:
    type: array
    items:
      type: string
    description: List of negative candidate labels included in the prompt (NCQ).
  prompt_version:
    type: string
    description: Identifier for the prompt template version used (e.g., 'static', 'cap_v1').
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when this record was generated.
additionalProperties: false