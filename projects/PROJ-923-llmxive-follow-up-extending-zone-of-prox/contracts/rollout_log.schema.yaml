$schema: http://json-schema.org/draft-07/schema#
title: Rollout Log Schema
description: >
  Single Source of Truth for student responses, confidence scores, and task IDs.
  Used by T012 (synthetic generator) and T033 (validation).
  This schema defines the structure of the rollout log used throughout the simulation.
type: object
required:
  - project_id
  - run_id
  - seed
  - cycles
properties:
  project_id:
    type: string
    description: Unique identifier for the project (e.g., PROJ-923-llmxive-follow-up-extending-zone-of-prox)
  run_id:
    type: string
    description: Unique identifier for this specific simulation run
  seed:
    type: integer
    description: The random seed used for reproducibility
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the log was generated
  metadata:
    type: object
    description: Additional run metadata (hyperparameters, configuration flags)
    properties:
      config_file:
        type: string
        description: Path to the configuration file used
      noise_sigma:
        type: number
        description: Standard deviation of Gaussian noise injected into confidence scores
      baseline_variant:
        type: string
        enum: [static, cap]
        description: Which ZPPO variant was used (static for baseline, cap for adaptive)
  cycles:
    type: array
    description: List of cycle records containing student responses and metrics
    items:
      type: object
      required:
        - cycle_id
        - task_id
        - prompt_type
        - prompt_length
        - student_response
        - student_confidence
        - ground_truth
        - is_correct
        - noise_applied
      properties:
        cycle_id:
          type: integer
          description: Sequential cycle number (0-indexed)
        task_id:
          type: string
          description: Identifier for the task/subject (e.g., mmlu_us_history, mmlu_math)
        prompt_type:
          type: string
          enum: [static_ncq, dynamic_ncq]
          description: Type of prompt used (static negative candidate included or dynamic)
        prompt_length:
          type: integer
          description: Number of negative candidates included in the prompt for this cycle
        student_response:
          type: string
          description: The student model's predicted answer
        student_confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Student's confidence score (0.0 to 1.0) after noise injection
        ground_truth:
          type: string
          description: The correct answer for the task
        is_correct:
          type: boolean
          description: Whether the student's response matches the ground truth
        noise_applied:
          type: number
          description: The specific noise value added to the base confidence
        negative_candidates:
          type: array
          items:
            type: string
          description: List of negative candidates included in the NCQ prompt (for dynamic variants)
        confidence_category:
          type: string
          enum: [rejected, fluctuating, accepted]
          description: Classification of confidence based on CAP thresholds (<0.1, [0.1, 0.9], >0.9)
        prompt_content_hash:
          type: string
          description: SHA256 hash of the prompt content for reproducibility tracking
  aggregated_metrics:
    type: object
    description: Pre-calculated metrics for quick access (optional, can be computed from cycles)
    properties:
      final_accuracy:
        type: number
        minimum: 0.0
        maximum: 1.0
      aucc:
        type: number
        description: Area Under the Convergence Curve
      average_prompt_length:
        type: number
      total_cycles:
        type: integer
additionalProperties: false