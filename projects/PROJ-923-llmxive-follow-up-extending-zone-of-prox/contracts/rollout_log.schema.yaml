$schema: http://json-schema.org/draft-07/schema#
title: Rollout Log Schema
description: >
  Schema for logging student model rollouts during ZPPO training cycles.
  Records the prompt used, the student's response, confidence scores,
  and ground truth labels for evaluation.
type: object
required:
  - run_id
  - cycle_id
  - task_type
  - question
  - negative_candidates
  - student_response
  - confidence_score
  - ground_truth
  - is_correct
  - timestamp
properties:
  run_id:
    type: string
    description: Unique identifier for the training run
    pattern: "^[a-zA-Z0-9_-]+$"
  cycle_id:
    type: integer
    description: The buffer cycle number (0-indexed)
    minimum: 0
  task_type:
    type: string
    description: Type of task (e.g., 'mmlu', 'vlm', 'math')
    enum:
      - mmlu
      - vlm
      - math
      - general
  question:
    type: string
    description: The input question or prompt sent to the student
  negative_candidates:
    type: array
    description: List of negative candidate answers included in the prompt
    items:
      type: string
  student_response:
    type: string
    description: The actual response generated by the student model
  confidence_score:
    type: number
    description: Student's confidence in its own response (0.0 to 1.0)
    minimum: 0.0
    maximum: 1.0
  ground_truth:
    type: string
    description: The correct answer for the question
  is_correct:
    type: boolean
    description: Whether the student response matches the ground truth
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the rollout
  metadata:
    type: object
    description: Optional additional metadata
    additionalProperties: true
