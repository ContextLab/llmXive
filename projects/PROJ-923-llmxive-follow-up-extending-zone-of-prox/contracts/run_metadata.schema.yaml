$schema: http://json-schema.org/draft-07/schema#
title: Run Metadata Schema
description: Schema for metadata describing a complete simulation run (baseline or CAP).
type: object
required:
  - run_id
  - strategy
  - start_time
  - end_time
  - config_snapshot
  - total_cycles
  - total_tasks
properties:
  run_id:
    type: string
    description: Unique identifier for the run (e.g., UUID or hash).
  strategy:
    type: string
    enum:
      - static_zppo
      - cap_zppo
    description: The simulation strategy used.
  start_time:
    type: string
    format: date-time
  end_time:
    type: string
    format: date-time
  config_snapshot:
    type: object
    description: Snapshot of the configuration used for this run.
    properties:
      seed:
        type: integer
      num_cycles:
        type: integer
      noise_sigma:
        type: number
      cap_threshold_low:
        type: number
      cap_threshold_high:
        type: number
  total_cycles:
    type: integer
  total_tasks:
    type: integer
  hardware_info:
    type: object
    properties:
      cpu_count:
        type: integer
      memory_gb:
        type: number
  git_commit:
    type: string
    description: Git commit hash of the code used.
