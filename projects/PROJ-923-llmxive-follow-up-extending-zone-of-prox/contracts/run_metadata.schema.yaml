$schema: http://json-schema.org/draft-07/schema#
title: Run Metadata Schema
description: |
  Defines the structure for run metadata files capturing the execution context,
  seeds, timestamps, and hyperparameters for reproducibility and audit trails.
  This schema is the Single Source of Truth for T004b and is used by T007, T031, and T034.
type: object
required:
  - run_id
  - timestamp
  - seed
  - hyperparameters
properties:
  run_id:
    type: string
    description: Unique identifier for this specific run (e., UUID or generated hash).
    pattern: "^[a-zA-Z0-9-]+$"
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the run started.
  project_id:
    type: string
    description: Identifier of the project this run belongs to (e.g., PROJ-923-llmxive-follow-up-extending-zone-of-prox).
    default: "PROJ-923-llmxive-follow-up-extending-zone-of-prox"
  task_id:
    type: string
    description: The specific task ID being executed (e.g., T016, T023).
  seed:
    type: integer
    description: The primary random seed used for this run to ensure reproducibility.
  hyperparameters:
    type: object
    description: Dictionary of all hyperparameters used in this run.
    required:
      - alpha
      - sigma
      - num_cycles
      - num_tasks
      - num_seeds
      - confidence_thresholds
    properties:
      alpha:
        type: number
        format: float
        description: Learning rate / adaptation factor for confidence updates.
        minimum: 0.0
        maximum: 1.0
      sigma:
        type: number
        format: float
        description: Standard deviation for Gaussian noise injection.
        minimum: 0.0
      num_cycles:
        type: integer
        description: Number of training/simulation cycles to run.
        minimum: 1
      num_tasks:
        type: integer
        description: Number of tasks selected for the batch run.
        minimum: 1
      num_seeds:
        type: integer
        description: Number of seeds used in the batch study (if applicable).
        minimum: 1
      confidence_thresholds:
        type: object
        description: Thresholds for CAP classification.
        properties:
          rejected_upper:
            type: number
            format: float
            description: Upper bound for 'consistently rejected' category.
            default: 0.1
          accepted_lower:
            type: number
            format: float
            description: Lower bound for 'consistently accepted' category.
            default: 0.9
        required:
          - rejected_upper
          - accepted_lower
      noise_injection_enabled:
        type: boolean
        description: Flag indicating if per-step Gaussian noise is enabled.
        default: true
      cap_enabled:
        type: boolean
        description: Flag indicating if Confidence-Adaptive Pruning is enabled.
        default: false
  environment:
    type: object
    description: Environment information for reproducibility.
    properties:
      python_version:
        type: string
      platform:
        type: string
      dependencies:
        type: object
        description: Key-value pairs of critical dependency versions.
        additionalProperties:
          type: string
  status:
    type: string
    enum:
      - started
      - completed
      - failed
    description: Current status of the run.
  error_message:
    type: ["string", "null"]
    description: Error message if the run failed.
additionalProperties: false