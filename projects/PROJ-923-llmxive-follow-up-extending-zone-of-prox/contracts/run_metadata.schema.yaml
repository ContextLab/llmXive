$schema: http://json-schema.org/draft-07/schema#
title: Run Metadata Schema
description: |
  Schema defining the structure of run metadata for the ZPPO simulation pipeline.
  This file captures the execution context, including seeds, timestamps, and
  hyperparameters used during a specific simulation run. It serves as the
  provenance record for reproducibility (Constitution Principle I).
type: object
required:
  - run_id
  - timestamp_start
  - timestamp_end
  - seed
  - hyperparameters
  - config_version
properties:
  run_id:
    type: string
    description: Unique identifier for this simulation run (e.g., UUID or hash).
    pattern: "^[a-zA-Z0-9_-]+$"
  
  timestamp_start:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the run started.
  
  timestamp_end:
    type: string
    format: date-time
    description: ISO 8601 timestamp when the run completed.
  
  seed:
    type: integer
    description: The primary random seed used for this run to ensure reproducibility.
    minimum: 0
  
  hyperparameters:
    type: object
    description: All hyperparameters controlling the simulation behavior.
    required:
      - student_learning_rate
      - noise_sigma
      - confidence_threshold_reject
      - confidence_threshold_accept
      - max_cycles
      - num_tasks
    properties:
      student_learning_rate:
        type: number
        description: Alpha parameter in the student confidence update formula.
        minimum: 0
        maximum: 1
      
      noise_sigma:
        type: number
        description: Standard deviation for Gaussian noise injection (FR-008).
        minimum: 0
      
      confidence_threshold_reject:
        type: number
        description: Lower bound for 'fluctuating' confidence classification.
        minimum: 0
        maximum: 1
      
      confidence_threshold_accept:
        type: number
        description: Upper bound for 'fluctuating' confidence classification.
        minimum: 0
        maximum: 1
      
      max_cycles:
        type: integer
        description: Maximum number of training cycles/buffer updates.
        minimum: 1
      
      num_tasks:
        type: integer
        description: Number of MMLU tasks included in the batch run.
        minimum: 1
      
      prompt_length_factor_alpha:
        type: number
        description: Weight for prompt length influence in learning dynamics.
        minimum: 0
      
      cap_fallback_min_candidates:
        type: integer
        description: Minimum number of candidates to retain if pruning results in empty set (FR-007).
        minimum: 0
      
      use_static_baseline:
        type: boolean
        description: Flag indicating if this is a static baseline run (True) or CAP run (False).
  
  config_version:
    type: string
    description: Version string of the configuration file used for this run.
  
  git_commit:
    type: string
    description: Git commit hash of the codebase at the time of the run.
    pattern: "^[a-fA-F0-9]{7,40}$"
    nullable: true
  
  execution_environment:
    type: object
    description: Environment details for reproducibility.
    properties:
      python_version:
        type: string
        description: Python version used (e.g., "3.10.12").
      
      platform:
        type: string
        description: Operating system platform.
      
      cpu_count:
        type: integer
        description: Number of CPU cores available.
      
      memory_gb:
        type: number
        description: Available RAM in GB.
  
  input_datasets:
    type: object
    description: References to input datasets used.
    properties:
      mmlu_subset:
        type: string
        description: Name of the MMLU subset used (e.g., "mmlu/logical_reasoning").
      
      held_out_set:
        type: string
        description: Name or path of the held-out test set.
  
  output_files:
    type: object
    description: Relative paths to output files generated by this run.
    properties:
      rollout_log:
        type: string
        description: Path to the generated rollout log (JSON/Parquet).
      
      convergence_curve:
        type: string
        description: Path to the convergence curve data (CSV).
      
      metrics_summary:
        type: string
        description: Path to the aggregated metrics file (CSV/JSON).

additionalProperties: false