$schema: http://json-schema.org/draft-07/schema#
title: Run Metadata Schema
description: |
  Schema defining the structure of run metadata for the llmXive ZPPO extension project.
  This file captures the execution context, seeds, timestamps, and hyperparameters
  for reproducibility and audit trails.
type: object
required:
  - run_id
  - timestamp
  - seed
  - hyperparameters
  - task_id
properties:
  run_id:
    type: string
    description: Unique identifier for this specific run (UUID or timestamp-based).
    pattern: "^[a-zA-Z0-9_-]+$"
  
  timestamp:
    type: string
    description: ISO 8601 formatted timestamp when the run started.
    format: date-time
  
  task_id:
    type: string
    description: The task identifier from tasks.md (e.g., T004b, T016).
    pattern: "^T[0-9]+[a-z]?$"
  
  seed:
    type: integer
    description: The primary random seed used for this run to ensure reproducibility.
    minimum: 0
  
  hyperparameters:
    type: object
    description: Dictionary of all hyperparameters used in this run.
    required:
      - alpha
      - initial_candidate_pool_size
      - epsilon
      - prompt_length_factor
      - noise_sigma
      - num_cycles
      - modality
    properties:
      alpha:
        type: number
        description: Learning rate / influence factor for confidence updates.
        minimum: 0
        maximum: 1
      
      initial_candidate_pool_size:
        type: integer
        description: The initial size of the negative candidate pool.
        minimum: 1
      
      epsilon:
        type: number
        description: Epsilon parameter for prompt length factor calculation.
        minimum: 0
      
      prompt_length_factor:
        type: number
        description: Calculated factor based on candidate pool size (1 / initial_candidate_pool_size).
        minimum: 0
      
      noise_sigma:
        type: number
        description: Standard deviation for Gaussian noise injection into confidence scores.
        minimum: 0
      
      num_cycles:
        type: integer
        description: Number of training/buffer cycles to run.
        minimum: 1
      
      modality:
        type: string
        description: The modality of the task (e.g., 'llm', 'vlm').
        enum:
          - llm
          - vlm
      
      baseline_variant:
        type: string
        description: Variant of the baseline (e.g., 'static', 'cap').
        enum:
          - static
          - cap
      
      expert_gap:
        type: number
        description: The gap between expert and student confidence (if applicable).
        minimum: -1
        maximum: 1

  config_path:
    type: string
    description: Relative path to the configuration file used for this run.
  
  git_commit:
    type: string
    description: Git commit hash of the code version used.
    pattern: "^[a-f0-9]{7,40}$"
  
  notes:
    type: string
    description: Optional free-text notes about the run.
  
  output_files:
    type: array
    description: List of relative paths to output files generated by this run.
    items:
      type: string
    uniqueItems: true

additionalProperties: false