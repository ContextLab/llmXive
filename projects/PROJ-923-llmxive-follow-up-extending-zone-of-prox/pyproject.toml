[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-zppo-extension"
version = "0.1.0"
description = "Extension of Zone of Proximal Policy Optimization with Confidence-Adaptive Pruning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "tqdm",
    "pyyaml",
    "datasets",
    "pytest",
    "scipy",
    "jsonschema",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = "code/"
exclude = "data/"

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",  # pycodes
    "F",  # flake8
    "I",  # isort
    "W",  # warnings
]
ignore = [
    "E501", # Line too long (handled by black)
    "F401", # Unused imports (sometimes needed for API surface)
]
exclude = [
    "data/*",
    "state/*",
    "tests/__pycache__/*",
    "*/__pycache__/*",
]

[tool.ruff.per-Target-version]
py39 = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
addopts = "-v --strict-mode"
