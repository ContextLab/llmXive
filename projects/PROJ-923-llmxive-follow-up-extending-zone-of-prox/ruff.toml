# Ruff configuration for llmXive Follow-up: Extending Zone of Proximal Policy Optimization
# Aligns with the project's linting requirements.

[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`) rules.
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = []

# Allow autofix for all enabled rules (potential fixes are suggested automatically).
fixable = ["ALL"]
unfixable = []

# Exclude a few generated or third-party directories if any.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black's default line length.
line-length = 88

# Allow unused variables to start with underscore.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Ignore import sorting in __init__.py files to allow re-exports.
"__init__.py" = ["F401", "I001"]
# Ignore unused imports in test files (often for fixtures or side effects).
"tests/**/*.py" = ["F401"]

[lint.isort]
known-first-party = ["config", "data", "loops", "models", "utils", "analysis", "main", "versioning"]
force-sort-within-sections = false
lines-after-imports = 2
