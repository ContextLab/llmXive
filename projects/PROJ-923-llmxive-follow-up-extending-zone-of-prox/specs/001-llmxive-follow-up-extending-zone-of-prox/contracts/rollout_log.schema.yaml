$schema: "http://json-schema.org/draft-07/schema#"
title: "Rollout Log Schema"
description: "Schema for the synthetic rollout log generated by the simulation engine."
type: "object"
properties:
  task_id:
    type: "string"
    description: "Identifier for the task, e.g., 'MMLU-History-01'"
  cycle:
    type: "integer"
    minimum: 1
    maximum: 50
    description: "Training cycle number (1 to 50)"
  candidate_id:
    type: "string"
    description: "Identifier for the negative candidate/error mode"
  student_confidence:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Student model's confidence score for the candidate"
  expert_confidence:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Expert model's confidence score (ground truth)"
  ground_truth:
    type: "boolean"
    description: "True if student response matches expert, False otherwise"
  noise_applied:
    type: "number"
    description: "The Gaussian noise value applied to the confidence score"
required:
  - task_id
  - cycle
  - candidate_id
  - student_confidence
  - expert_confidence
  - ground_truth
  - noise_applied
additionalProperties: false
