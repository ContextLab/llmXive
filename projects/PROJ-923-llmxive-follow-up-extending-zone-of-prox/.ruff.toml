# Ruff configuration for llmXive Follow-up
line-length = 100
target-version = "py39"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
]
ignore = [
    "E501", # Line too long (handled by black)
    "W505", # Line too long
]

[lint.isort]
known-first-party = ["code", "tests", "contracts"]
