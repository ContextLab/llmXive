# This file exists primarily for IDE integration where pyproject.toml
# might not be picked up by some editors in nested project structures.
# It mirrors the configuration in pyproject.toml.

target-version = "py39"
line-length = 88
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "data/",
    "state/",
]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[lint.isort]
known-first-party = ["code", "tests"]
force-sort-within-sections = true