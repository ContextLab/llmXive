repos:
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # Note: ruff-format is a drop-in replacement for black
        # If you prefer black explicitly, keep the black hook above
        # and remove this, or use ruff-format exclusively.
