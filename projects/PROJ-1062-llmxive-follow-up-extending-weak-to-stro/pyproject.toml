[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-research"
version = "0.1.0"
description = "Weak-to-Strong Generalization via Direct On-Policy Distillation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "torch==2.3.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "peft>=0.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "datasets>=2.18.0",
    "bitsandbytes>=0.43.0",
    "huggingface-hub>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "black>=24.0.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests", "code/tests"]
python_files = ["test_*.py"]
addopts = "-v"
