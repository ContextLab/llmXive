# Default configuration for llmXive experiments
# Generated by T004 (already completed, but included here for structure verification)

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_results: "data/results"
  models_cache: "models_cache"

model:
  teacher_id: "meta-llama/Llama-2-7b-hf" # Placeholder, actual ID set in task
  student_moe_id: "mistralai/Mixtral-Instruct-v0.1"
  student_ssm_id: "state-spaces/mamba-1.3b-hf"
  precision: "int8"

training:
  batch_size: 1
  gradient_accumulation_steps: 4
  max_steps: 500
  seed: 42
  learning_rate: 1e-5
  warmup_steps: 50

memory:
  max_ram_gb: 7
  batch_size_floor: 1
  oom_retry_limit: 3

data:
  dataset_id: "HuggingFaceH4/aime_2024"
  train_split: "train"
  val_split: "validation"
  seed: 42
  sample_size: null # Full dataset or specific sample

evaluation:
  metrics:
    - "log_prob_improvement"
    - "accuracy"
  statistical_tests:
    - "wilcoxon_signed_rank"
    - "bonferroni_correction"
