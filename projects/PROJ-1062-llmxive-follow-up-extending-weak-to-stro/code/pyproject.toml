[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "Extending Weak-to-Strong Generalization via Direct On-Policy Distillation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "llmXive Research Team", email = "research@llmxive.org"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "peft>=0.8.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "datasets>=2.17.0",
    "bitsandbytes>=0.42.0",
    "huggingface_hub>=0.21.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.3.0",
    "ruff>=0.3.4",
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "bandit>=1.7.0",
]

[project.scripts]
run-lint = "scripts.run_lint:main"
run-format = "scripts.run_format:main"
hash-artifacts = "scripts.hash_artifacts:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["code"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "N", "D", "UP", "ANN", "S", "BLE", "B", "C4", "PIE", "Q", "RUF"]
ignore = [
    "E501",
    "D100",
    "D104",
    "ANN101",
    "ANN102",
    "D203",
    "D213",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]
"code/scripts/*" = ["ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["code"]
omit = ["code/tests/*", "code/scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
