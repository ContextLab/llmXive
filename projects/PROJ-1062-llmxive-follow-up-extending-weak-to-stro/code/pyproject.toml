[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up"
version = "0.1.0"
description = "Extending Weak-to-Strong Generalization via Direct On-Policy Distillation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "datasets>=2.19.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "pytest>=8.2.0",
    "huggingface-hub>=0.23.0",
    "protobuf>=3.20.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "black>=24.4.0",
    "pytest>=8.2.0",
    "pre-commit>=3.7.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "data*", "models*", "scripts*", "tests*"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools]
packages = ["core", "data", "models", "scripts", "tests"]
