repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v0.4.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        args: [--config, code/py.toml]

  - repo: https://github.com/astral-ruff/ruff
    rev: 0.1.14
    hooks:
      - id: ruff
        args: [--config, code/.ruff.toml, --fix]

  - repo: https://github.com/pre-commit/migration
    rev: v1.0.0
    hooks:
      - id: migrate-to-pre-commit-hooks
