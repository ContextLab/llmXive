# Ruff configuration for llmXive project
# Enforces PEP 8 compliance with project-specific overrides

[lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C90", # McCabe cyclomatic complexity
    "N",   # pep8-naming
    "D",   # pydocstyle (enforce docstrings)
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (type hints)
    "S",   # flake8-bandit (security)
    "BLE", # flake8-blind-except
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "Q",   # flake8-quotes
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501",    # Line too long (handled by Black)
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "D203",    # 1 blank line required before class docstring (conflicts with D211)
    "D213",    # Multi-line docstring summary should start at the second line (conflicts with D212)
    "S101",    # Use of assert detected (asserts are allowed in tests)
]

# Allow autofix for all enabled rules (if `--fix` is provided).
fixable = ["ALL"]
unfixable = []

# Exclude a few specific files/directories from linting.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as `ignore` but for per-file ignores.
per-file-ignores = {}

# Maximum line length (should match Black).
line-length = 88

# Target version (Python 3.11).
target-version = "py311"

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 15

[lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[lint.isort]
known-first-party = ["core", "data", "models", "scripts", "tests"]
force-single-line = false
lines-after-imports = 2
