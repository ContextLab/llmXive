type: "object"
description: "Schema for the MDES / Power analysis report generated by the statistical pipeline."
properties:
  sample_size:
    type: "integer"
    description: "Number of devices (N) included in the analysis."
  number_of_tests:
    type: "integer"
    description: "Total topology‑performance hypothesis tests performed."
  min_detectable_rho:
    type: "number"
    description: "Minimum detectable Spearman ρ at **≥ 60 % power**, α = 0.05."
  confidence_interval:
    type: "string"
    description: "95 % confidence interval for the observed correlation (e.g., \"[0.12, 0.34]\")."
  low_power_flag:
    type: "string"
    enum:
      - "Low Power: MDES > 0.3 (Exploratory)"
      - "Adequate Power"
required:
  - sample_size
  - number_of_tests
  - min_detectable_rho
  - confidence_interval
  - low_power_flag