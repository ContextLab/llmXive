# JSON Schema for performance_metrics.csv
# The CSV must contain a header with the following columns:
# device_id, timestamp, t1_mean, t2_mean, cx_error_mean, readout_error_mean, chip_family
# Each row corresponds to a single backend snapshot.
$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  device_id:
    type: string
  timestamp:
    type: string
    format: date-time
  t1_mean:
    type: number
  t2_mean:
    type: number
  cx_error_mean:
    type: number
  readout_error_mean:
    type: number
  chip_family:
    type: string
required:
  - device_id
  - timestamp
  - t1_mean
  - t2_mean
  - cx_error_mean
  - readout_error_mean
  - chip_family
additionalProperties: false
# Note: CSV rows are validated individually against this schema.