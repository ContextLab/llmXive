$schema: "http://json-schema.org/draft-07/schema#"
title: Performance Metrics CSV Schema
description: Schema for data/processed/performance_metrics.csv
type: object
properties:
  device_id:
    type: string
  timestamp:
    type: string
    format: date-time
  t1_mean:
    type: number
  t2_mean:
    type: number
  cx_error_mean:
    type: number
  readout_error_mean:
    type: number
  chip_family:
    type: string
required:
  - device_id
  - timestamp
  - t1_mean
  - t2_mean
  - cx_error_mean
  - readout_error_mean
  - chip_family
additionalProperties: false
