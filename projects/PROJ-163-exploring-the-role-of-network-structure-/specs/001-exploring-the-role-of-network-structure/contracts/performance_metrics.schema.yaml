$schema: "http://json-schema.org/draft-07/schema#"
title: PerformanceMetrics
description: Schema for the performance metrics CSV generated from IBM Quantum calibration snapshots.
type: object
additionalProperties: false
required:
  - device_id
  - timestamp
  - t1_mean
  - t2_mean
  - cx_error_mean
  - readout_error_mean
  - chip_family
properties:
  device_id:
    type: string
    description: Identifier of the IBM Quantum backend (e.g., "ibmq_manila").
  timestamp:
    type: string
    format: date-time
    description: ISO‑8601 timestamp of the calibration snapshot.
  t1_mean:
    type: number
    description: Mean T1 relaxation time (seconds) across all qubits.
  t2_mean:
    type: number
    description: Mean T2 dephasing time (seconds) across all qubits.
  cx_error_mean:
    type: number
    description: Mean two‑qubit CX gate error rate.
  readout_error_mean:
    type: number
    description: Mean readout error rate.
  chip_family:
    type: string
    description: Human‑readable chip family derived from the backend name (e.g., "Falcon", "Eagle").