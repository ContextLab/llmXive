$schema: "http://json-schema.org/draft-07/schema#"
title: PerformanceMetrics
type: object
required:
  - device_id
  - timestamp
  - t1_mean
  - t2_mean
  - cx_error_mean
  - readout_error_mean
  - chip_family
properties:
  device_id:
    type: string
  timestamp:
    type: string
    format: date-time
  t1_mean:
    type: number
    minimum: 0
  t2_mean:
    type: number
    minimum: 0
  cx_error_mean:
    type: number
    minimum: 0
  readout_error_mean:
    type: number
    minimum: 0
  chip_family:
    type: string
    enum: [Falcon, Hummingbird, Eagle, Osprey, Condor, Unknown]
