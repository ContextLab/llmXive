$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  device_id:
    type: string
    description: "Unique identifier of the IBM Quantum backend"
  timestamp:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of the calibration snapshot"
  coupling_map:
    type: array
    description: "List of directed edges [source, target] representing qubit connectivity"
    items:
      type: array
      items:
        type: integer
      minItems: 2
      maxItems: 2
  properties:
    type: object
    description: "Dictionary of backend properties (qubits, gates, measurements)"
    required: []
    additionalProperties: true
required:
  - device_id
  - timestamp
  - coupling_map
  - properties
