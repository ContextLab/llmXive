$schema: "http://json-schema.org/draft-07/schema#"
title: "IBM Quantum Raw Calibration Response"
description: "Schema for validating the raw JSON response from IBM Quantum backend properties API."
type: object
required:
  - backend_name
  - backend_version
  - last_update_date
  - qubits
  - gates
  - general
properties:
  backend_name:
    type: string
    description: "Name of the backend device."
  backend_version:
    type: string
    description: "Version of the backend software."
  last_update_date:
    type: string
    format: date-time
    description: "ISO 8601 timestamp of the last calibration update."
  qubits:
    type: array
    description: "List of qubit properties (T1, T2, frequency, readout error, etc.)."
    items:
      type: array
      description: "Each qubit is represented as a list of [name, value] pairs."
      items:
        type: object
        required:
          - name
          - value
        properties:
          name:
            type: string
          value:
            type: number
  gates:
    type: array
    description: "List of gate properties (error rates, duration, etc.)."
    items:
      type: object
      required:
        - gate
        - qubits
        - parameters
        - gate_error
      properties:
        gate:
          type: string
        qubits:
          type: array
          items:
            type: integer
        parameters:
          type: array
          items:
            type: number
        gate_error:
          type: number
        gate_length:
          type: number
  general:
    type: array
    description: "General backend properties (coupling map, basis gates, etc.)."
    items:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          oneOf:
            - type: array
              items:
                type: array
                items:
                  type: integer
            - type: string
            - type: number
            - type: boolean
additionalProperties: true
