$schema: http://json-schema.org/draft-07/schema#
title: IBM Quantum Backend Properties
description: Schema for raw calibration data fetched from IBM Quantum backends.
type: object
required:
  - device_id
  - timestamp
  - coupling_map
  - properties
properties:
  device_id:
    type: string
    description: Unique identifier for the backend (e.g., 'ibmq_manila').
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of the calibration snapshot.
  coupling_map:
    type: array
    description: List of directed edges (control, target) representing qubit connectivity.
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: integer
    minItems: 0
  properties:
    type: object
    description: Dictionary of backend properties (qubit coherence, gate errors, etc.).
    additionalProperties: true
additionalProperties: true
