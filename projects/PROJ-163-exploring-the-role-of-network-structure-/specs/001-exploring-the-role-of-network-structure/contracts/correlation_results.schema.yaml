$schema: "http://json-schema.org/draft-07/schema#"
type: "object"
description: "Schema for the correlation results CSV generated by the statistical analysis pipeline."
properties:
  metric_a:
    type: "string"
    description: "Name of the first metric in the correlation pair (e.g., 'spectral_gap', 't1_mean')."
  metric_b:
    type: "string"
    description: "Name of the second metric in the correlation pair."
  rho:
    type: "number"
    description: "Spearman correlation coefficient (rho)."
  p_value:
    type: "number"
    description: "Raw p-value for the correlation test."
  adj_p_value:
    type: "number"
    description: "Benjamini-Hochberg FDR-adjusted p-value."
  partial_rho:
    type: "number"
    description: "Partial correlation coefficient controlling for covariates (optional)."
  window_delta:
    type: "number"
    description: "Difference between 30‑day window rho and cross‑sectional rho (SC‑004)."
  is_significant:
    type: "boolean"
    description: "True if `adj_p_value` < 0.05."
  prop_significant:
    type: "number"
    description: "Proportion of devices with cluster‑adjusted p ≤ 0.05 (FR‑017, optional)."
required:
  - metric_a
  - metric_b
  - rho
  - p_value
  - adj_p_value
