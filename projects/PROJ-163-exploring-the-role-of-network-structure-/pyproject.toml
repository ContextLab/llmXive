[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-superconducting-qubit-coupling"
version = "0.1.0"
description = "Exploring the role of network structure in superconducting qubit coupling"
requires-python = ">=3.11"
dependencies = [
    "qiskit-ibm-runtime",
    "networkx",
    "pandas",
    "scipy",
    "matplotlib",
    "requests",
    "pytest",
    "seaborn",
    "pyyaml",
    "jsonschema"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = "code/|tests/"
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # flake8-blind-parens
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
]
exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Marks tests that take a long time to run"
]
