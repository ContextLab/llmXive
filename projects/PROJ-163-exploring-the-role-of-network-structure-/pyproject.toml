[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-163"
version = "0.1.0"
description = "Exploring the Role of Network Structure in Superconducting Qubit Coupling"
requires-python = ">=3.11"
dependencies = [
    "qiskit-ibm-runtime",
    "networkx",
    "pandas",
    "scipy",
    "matplotlib",
    "requests",
    "pytest",
    "seaborn",
    "pyyaml",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
# Ruff configuration is also in .ruff.toml for lint rules,
# but we keep this file for project metadata and Black settings.
# This ensures Black and Ruff are configured in the same place for the project.
extend-include = ["*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
