$schema: http://json-schema.org/draft-07/schema#
title: Baseline Run Results Schema
description: |
  Schema for the results generated by the 3D baseline agent (code/agents/baseline_3d.py).
  Used for paired comparison with the 2D restricted agent.
type: object
required:
  - run_id
  - baseline_agent_version
  - execution_seed
  - results
properties:
  run_id:
    type: string
    pattern: "^run_[a-f0-9]{8}$"
    description: Unique identifier for this baseline execution run
  baseline_agent_version:
    type: string
    description: Version identifier of the baseline agent logic
    const: "1.0.0"
  execution_seed:
    type: integer
    description: The seed used for this specific run
  execution_timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of execution
  total_tasks_processed:
    type: integer
    minimum: 1
    description: Number of tasks processed in this run
  results:
    type: array
    description: Per-task results
    items:
      type: object
      required:
        - task_id
        - task_type
        - success_flag
        - wall_clock_time_ms
        - agent_type
        - predicted_value
        - error_metric
      properties:
        task_id:
          type: string
          description: Reference to the task in the dataset
        task_type:
          type: string
          enum:
            - occlusion
            - depth
            - relative
        success_flag:
          type: boolean
          description: Whether the agent successfully completed the task
        wall_clock_time_ms:
          type: number
          minimum: 0
          description: Total time taken for this task in milliseconds
        agent_type:
          type: string
          const: "baseline_3d"
          description: Identifier for the agent type
        predicted_value:
          type: number
          description: The agent's numerical prediction (e.g., depth in meters)
        error_metric:
          type: number
          minimum: 0
          description: Absolute error or custom metric calculated against ground truth
        metadata:
          type: object
          description: Optional additional details (e.g., blocked operations, warnings)
          properties:
            warnings:
              type: array
              items:
                type: string
            notes:
              type: string
