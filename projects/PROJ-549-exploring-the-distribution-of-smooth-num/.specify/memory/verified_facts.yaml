'|initialized project python version':
  quote: Van Rossum first published the code (for Python version 0.9.1) to alt.sources
    in February 1991. Several features of the language were already present at this
    stage, among them classes with inheritance, exception handling, functions, and
    various core datatypes such as list, dict, and str. The initial release also contained
    a module system borrowed from Modula-3; Van Rossum describes the module as "one
    of Python's major programming units". Python's exception model also resembled
    Modula-3's, with the addition of an else clause. In 1994 comp.lang.python, the
    primary discussion forum for Python, was formed.
  source_id: History of Python
  url: https://en.wikipedia.org/wiki/History_of_Python
  value: 0.9.1
