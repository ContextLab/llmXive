$schema: http://json-schema.org/draft-07/schema#
title: Alloy Entry Schema
description: >
  Canonical schema for experimental Heusler alloy entries used in the
  composition‑hysteresis prediction pipeline. Captures composition,
  magnetic hysteresis measurements, and provenance metadata.
type: object
required:
  - alloy_id
  - composition
  - coercivity
  - saturation
  - source_type
  - is_dft
  - raw_source
properties:
  alloy_id:
    type: string
    description: Unique identifier (UUID format)
    pattern: "^[a-f0-9\\-]{36}$"
  composition:
    type: object
    description: Mapping element symbol → atomic fraction (sums to 1.0)
    patternProperties:
      "^[A-Z][a-z]?$":
        type: number
        minimum: 0
        maximum: 1
    additionalProperties: false
  coercivity:
    type: object
    required:
      - value
      - unit
    properties:
      value:
        type: number
        minimum: 0
      unit:
        type: string
        enum: ["Oe"]
        description: Unit after normalization
  saturation:
    type: object
    required:
      - value
      - unit
    properties:
      value:
        type: number
        minimum: 0
      unit:
        type: string
        enum: ["emu/g"]
        description: Unit after normalization
  source_type:
    type: string
    enum: ["NIST","Journal","Manual"]
    description: Data origin category
  is_dft:
    type: boolean
    description: Must be false for rows used as training targets
  raw_source:
    type: string
    description: URL or citation key of the original source
  synthesis_method:
    type: string
    description: Optional synthesis method metadata
    nullable: true
  crystal_structure:
    type: string
    description: Optional crystal structure label
    nullable: true
  reference:
    type: string
    description: DOI or bibliographic reference
    nullable: true
additionalProperties: false
