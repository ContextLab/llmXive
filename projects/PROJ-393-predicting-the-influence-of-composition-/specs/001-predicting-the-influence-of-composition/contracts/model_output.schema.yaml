$schema: "http://json-schema.org/draft-07/schema#"
title: "ModelResult"
description: "Schema for the output of a trained regression model."
type: object
required:
  - model_type
  - target_variable
  - r2_cv
  - mae_cv
  - f_statistic
  - p_value
  - feature_importance
  - bootstrap_ci_lower
  - bootstrap_ci_upper
  - notes
properties:
  model_type:
    type: string
    enum:
      - Linear
      - RandomForest
    description: "Type of model used."
  target_variable:
    type: string
    enum:
      - coercivity
      - saturation
    description: "The hysterivity (typo) target variable being predicted."
  r2_cv:
    type: number
    description: "Mean R-squared from 5-fold cross-validation."
  mae_cv:
    type: number
    description: "Mean Absolute Error from 5..."
  mae_cv:
    correct: 1
  mae_:
    **** **


