%YAML 1.1
---
$schema: "http://json-schema.org/draft-07/schema#"
title: "Motif Extraction Output Schema"
description: |
  Schema for validating the output of User Story 3 (Motif Extraction).
  Defines the structure for clustered pharmacophore motifs, including
  statistical significance and 3D alignment metrics.
type: object
required:
  - cluster_id
  - p_value
  - is_significant
  - pharmacophore_match
  - rmsd
properties:
  cluster_id:
    type: integer
    description: |
      Unique identifier for the motif cluster generated by the
      DBSCAN clustering algorithm.
    minimum: 0
  p_value:
    type: number
    description: |
      Statistical p-value derived from the two-sample t-test
      (or permutation test) comparing high-affinity vs low-affinity
      complexes for this motif.
    minimum: 0.0
    maximum: 1.0
  is_significant:
    type: boolean
    description: |
      Indicates whether the motif is statistically significant
      after Benjamini-Hochberg FDR correction (alpha=0.05).
  pharmacophore_match:
    type: string
    description: |
      Identifier or name of the known pharmacophore from
      `data/reference/pharmacophores.json` that this cluster matches.
      If no match is found (RMSD >= 1.5 Å), this should be "none".
    pattern: "^[a-zA-Z0-9_\\-\\.]+$|^none$"
  rmsd:
    type: number
    description: |
      Root Mean Square Deviation (Å) between the cluster's
      representative substructure and the matched pharmacophore,
      calculated via the Kabsch algorithm.
    minimum: 0.0
additionalProperties: false