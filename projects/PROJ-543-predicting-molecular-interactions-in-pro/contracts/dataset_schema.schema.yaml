$schema: http://json-schema.org/draft-07/schema#
title: Molecular Interaction Dataset Schema
description: >
  Schema for validating US-1 (Data Ingestion) outputs.
  Enforces strict 3D coordinate presence, resolution thresholds,
  and hydration state tracking as per project requirements.
type: object
required:
  - metadata
  - atoms
  - interactions
properties:
  metadata:
    type: object
    description: Global complex metadata
    required:
      - pdb_id
      - resolution
      - water_flag
      - source
    properties:
      pdb_id:
        type: string
        description: PDB identifier
      resolution:
        type: number
        minimum: 0
        exclusiveMinimum: false
        description: Crystallographic resolution in Angstroms.
          Must be > 0. High-resolution filter (<= 2.5 Å) applied upstream.
      water_flag:
        type: boolean
        description: >
          True if water-mediated interactions were detected (oxygen distance < 3.5 Å).
          If True, the complex may be excluded or flagged for water-aware analysis.
      source:
        type: string
        description: Data source (e.g., 'PDBbind_v2020_refined')
      ligand_smiles:
        type: string
        nullable: true
        description: SMILES string of the ligand if available
      protein_chain:
        type: string
        nullable: true
        description: Protein chain ID
  atoms:
    type: array
    description: List of atom nodes in the graph
    items:
      type: object
      required:
        - atom_type
        - coordinates_3d
        - charge
        - hydrophobicity
      properties:
        atom_type:
          type: string
          description: >
            Atomic element or RDKit atom type (e.g., 'C', 'N', 'O', 'S', 'Cl').
            Must be a valid chemical symbol or defined type.
        coordinates_3d:
          type: array
          description: 3D Cartesian coordinates (x, y, z) in Angstroms.
          items:
            type: number
          minItems: 3
          maxItems: 3
        charge:
          type: number
          description: Partial charge or formal charge.
        hydrophobicity:
          type: number
          description: Hydrophobicity score (e.g., from atomic contributions).
        residue_name:
          type: string
          nullable: true
          description: Residue name (e.g., 'ALA', 'LIG')
        residue_number:
          type: integer
          nullable: true
          description: Residue sequence number
        is_ligand:
          type: boolean
          description: True if the atom belongs to the ligand, False for protein.
  interactions:
    type: array
    description: List of edges (interactions) in the graph
    items:
      type: object
      required:
        - source_atom_idx
        - target_atom_idx
        - interaction_type
        - distance
      properties:
        source_atom_idx:
          type: integer
          description: Index of the source atom in the 'atoms' array.
        target_atom_idx:
          type: integer
          description: Index of the target atom in the 'atoms' array.
        interaction_type:
          type: string
          enum:
            - covalent
            - hydrogen_bond
            - hydrophobic
            - pi_stacking
            - salt_bridge
            - water_mediated
            - van_der_waals
          description: Type of molecular interaction.
        distance:
          type: number
          minimum: 0
          description: Distance between atoms in Angstroms.
        is_water_mediated:
          type: boolean
          description: True if this interaction is water-mediated.
additionalProperties: false
