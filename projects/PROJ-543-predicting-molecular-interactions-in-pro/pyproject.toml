[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-543"
version = "0.1.0"
description = "Predicting Molecular Interactions in Protein-Ligand Complexes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torch_geometric",
    "rdkit",
    "datasets",
    "scikit-learn",
    "pandas",
    "pyyaml",
    "biopython",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "black",
    "isort",
    "pytest",
    "pytest-cov",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | data
    | tests
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = [
    "data/*",
    "tests/*",
    ".venv/*",
    "venv/*"
]
