$schema: http://json-schema.org/draft-07/schema#
title: SubstructureCluster Schema
description: Schema for clustered substructure motifs and their validation results.
type: object
properties:
  cluster_id:
    type: integer
    description: "Unique cluster identifier"
  centroid_coordinates:
    type: array
    items:
      type: number
    minItems: 3
    maxItems: 3
    description: "Centroid coordinates of the cluster"
  member_count:
    type: integer
    description: "Number of atoms in the cluster"
  pharmacophore_id:
    type: string
    nullable: true
    description: "Matched reference pharmacophore ID (or null)"
  rmsd:
    type: number
    nullable: true
    description: "RMSD overlap with pharmacophore (if matched)"
  p_value:
    type: number
    description: "Statistical significance from permutation test"
  fdr_corrected_p:
    type: number
    description: "Benjamini-Hochberg adjusted p-value"
  is_significant:
    type: boolean
    description: "True if p < 0.05 after FDR correction"
required:
  - cluster_id
  - centroid_coordinates
  - member_count
  - p_value
  - fdr_corrected_p
  - is_significant
additionalProperties: false
