[lint]
# Enable a subset of rules common for scientific Python
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort (sorting imports)
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade (modernize syntax)
  "SIM", # flake8-simplify
  "N",   # pep8-naming
]

# Ignore specific rules that might be too strict for research code
ignore = [
  "E501", # Line too long (handled by black)
  "B008", # Do not perform function call in argument defaults (common in dataclasses)
]

# Allow magic numbers in specific contexts if needed, but generally keep them
# "PLR2004", # Magic value comparison

[lint.isort]
known-first-party = ["code", "tests"]
force-sort-within-sections = true

[format]
# Black-compatible formatting settings
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[target]
target-version = "py310"
