# Standalone ruff configuration file (redundant with pyproject.toml but explicit)
extend = "pyproject.toml"
line-length = 88
target-version = "py310"

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[lint.isort]
known-first-party = ["code", "data", "results", "tests"]
force-sort-within-sections = true
combine-as-imports = true
