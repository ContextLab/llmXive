description: Schema for raw and processed gene expression datasets
type: object
required:
  - sample_id
  - tumor_type
  - response_label
  - expression_vector
properties:
  sample_id:
    type: string
    description: Unique identifier for the sample
  tumor_type:
    type: string
    description: Cancer type (e.g., BRCA, LUAD)
  response_label:
    type: string
    description: Binary response label (e.g., 'Responder', 'NonResponder')
  expression_vector:
    type: array
    description: Normalized expression values for all genes
    items:
      type: number
      format: float
