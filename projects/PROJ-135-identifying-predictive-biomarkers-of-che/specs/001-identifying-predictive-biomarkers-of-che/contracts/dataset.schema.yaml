$schema: "http://json-schema.org/draft-07/schema#"
title: "Harmonized Dataset Schema"
description: "Schema for the harmonized, normalized expression matrix and metadata."
type: "object"
properties:
  samples:
    type: "array"
    items:
      type: "object"
      properties:
        sample_id:
          type: "string"
          description: "Unique sample identifier"
        tumor_type:
          type: "string"
          description: "TCGA/GEO tumor type code"
        response_label:
          type: "integer"
          enum: [0, 1]
          description: "0=Non-responder, 1=Responder"
        set_type:
          type: "string"
          enum: ["discovery", "training"]
          description: "Partition type"
        source:
          type: "string"
          enum: ["TCGA", "GEO"]
          description: "Data source"
        expression_vector:
          type: "object"
          additionalProperties:
            type: "number"
          description: "Gene symbol -> VST value mapping"
      required:
        - sample_id
        - tumor_type
        - response_label
        - set_type
        - source
        - expression_vector
  metadata:
    type: "object"
    properties:
      total_samples:
        type: "integer"
        description: "Total number of samples"
      tumor_types:
        type: "array"
        items:
          type: "string"
        description: "List of tumor types included"
      normalization_method:
        type: "string"
        const: "DESeq2_VST"
        description: "Normalization method used"
      checksum:
        type: "string"
        description: "SHA256 checksum of the raw data source"
    required:
      - total_samples
      - tumor_types
      - normalization_method
      - checksum
required:
  - samples
  - metadata
