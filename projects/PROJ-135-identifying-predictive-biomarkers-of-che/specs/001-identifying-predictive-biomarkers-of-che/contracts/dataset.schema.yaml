type: object
required:
  - sample_id
  - tumor_type
  - response_label
  - expression_vector
properties:
  sample_id:
    type: string
    description: Unique identifier for the sample
  tumor_type:
    type: string
    description: Cancer type classification (e.g., BRCA, LUAD)
  response_label:
    type: string
    description: Clinical response outcome (e.g., 'Responder', 'NonResponder')
  expression_vector:
    type: array
    description: Normalized gene expression values (VST or similar)
    items:
      type: number
      format: float
