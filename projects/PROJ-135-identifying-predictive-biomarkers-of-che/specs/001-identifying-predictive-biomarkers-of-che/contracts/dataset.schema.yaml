$schema: "http://json-schema.org/draft-07/schema#"
title: "Cancer Biomarker Dataset Schema"
description: "Schema for the processed cancer dataset used in biomarker discovery."
type: "object"
properties:
  sample_id:
    type: "string"
    description: "Unique identifier for the sample (e.g., TCGA barcode)."
  tumor_type:
    type: "string"
    description: "Cancer type code (e.g., BRCA, LUAD)."
  response_label:
    type: "string"
    description: "Chemotherapy response status (e.g., Responder, Non-Responder)."
  expression_vector:
    type: "array"
    items:
      type: "number"
    description: "Normalized gene expression values."
  set_type:
    type: "string"
    description: "Data split type (e.g., discovery, training, external_validation)."
required:
  - sample_id
  - tumor_type
  - response_label
  - expression_vector
  - set_type