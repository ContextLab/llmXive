type: object
required:
  - cancer_type
  - alpha
  - lambda
  - coefficients
  - cross_val_auc
properties:
  cancer_type:
    type: string
    description: Tumor type the model was trained on
  alpha:
    type: number
    format: float
    description: Elastic net mixing parameter
  lambda:
    type: number
    format: float
    description: Elastic net regularization parameter
  coefficients:
    type: object
    description: Mapping of gene symbols to their model coefficients
    additionalProperties:
      type: number
      format: float
  cross_val_auc:
    type: number
    format: float
    description: Area Under Curve from cross-validation
