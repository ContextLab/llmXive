description: Schema for trained model outputs and metadata
type: object
required:
  - cancer_type
  - alpha
  - lambda
  - coefficients
  - cross_val_auc
properties:
  cancer_type:
    type: string
    description: Tumor type the model was trained on
  alpha:
    type: number
    format: float
    description: Elastic net mixing parameter
  lambda:
    type: number
    format: float
    description: Regularization strength
  coefficients:
    type: object
    description: Mapping of gene symbol to coefficient value
    additionalProperties:
      type: number
      format: float
  cross_val_auc:
    type: number
    format: float
    description: Cross-validated ROC AUC score
