$schema: http://json-schema.org/draft-07/schema#
title: Meta Analysis Schema
description: Schema for meta-analysis results aggregating differential expression across tumor types.
type: object
required:
  - gene_symbol
  - meta_p_value
  - log2FC_mean
  - selected
properties:
  gene_symbol:
    type: string
    description: Standardized gene symbol (HGNC).
  meta_p_value:
    type: number
    format: float
    minimum: 0.0
    maximum: 1.0
    description: Combined p-value from meta-analysis (e.g., Stouffer's method).
  log2FC_mean:
    type: number
    format: float
    description: Mean log2 fold change across tumor types.
  selected:
    type: boolean
    description: Flag indicating if this gene was selected for the final predictive panel.
