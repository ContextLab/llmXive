$schema: "http://json-schema.org/draft-07/schema#"
title: "Sample Schema"
description: "Schema for patient tumor specimen data"
type: "object"
properties:
  sample_id:
    type: "string"
    description: "Unique identifier for the sample"
  tumor_type:
    type: "string"
    description: "Cancer type (e.g., BRCA, LUAD)"
  response_label:
    type: "integer"
    enum: [0, 1]
    description: "Binary response label (0=Non-responder, 1=Responder)"
  expression_vector:
    type: "array"
    items:
      type: "number"
    description: "Array of gene expression values"
  set_type:
    type: "string"
    enum: ["discovery", "training"]
    description: "Dataset split type"
  dataset_source:
    type: "string"
    enum: ["TCGA", "GEO"]
    description: "Source dataset"
required:
  - sample_id
  - tumor_type
  - response_label
  - expression_vector
  - set_type
  - dataset_source
additionalProperties: false
