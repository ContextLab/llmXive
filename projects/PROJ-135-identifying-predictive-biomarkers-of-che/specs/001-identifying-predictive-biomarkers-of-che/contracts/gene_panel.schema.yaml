description: Schema for the final selected gene biomarker panel
type: object
required:
  - gene_symbol
  - meta_p_value
  - log2FC_mean
  - selected
properties:
  gene_symbol:
    type: string
    description: HGNC gene symbol
  meta_p_value:
    type: number
    format: float
    description: Combined p-value from meta-analysis
  log2FC_mean:
    type: number
    format: float
    description: Mean log2 fold change across tumor types
  selected:
    type: boolean
    description: Whether the gene was included in the final panel
