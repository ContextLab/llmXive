# Schema for raw and processed dataset samples
# Fields: sample_id (string), tumor_type (string), response_label (string), expression_vector (array of floats)
type: object
required:
  - sample_id
  - tumor_type
  - response_label
  - expression_vector
properties:
  sample_id:
    type: string
    description: Unique identifier for the sample (e.g., TCGA barcode or GEO sample ID)
  tumor_type:
    type: string
    description: Cancer type classification (e.g., BRCA, LUAD)
  response_label:
    type: string
    description: Chemotherapy response status (e.g., 'Responder', 'NonResponder', 'ProgressiveDisease')
  expression_vector:
    type: array
    items:
      type: number
      format: float
    description: Normalized gene expression values (e.g., VST or log2CPM) ordered by a fixed gene panel