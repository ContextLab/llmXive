[pytest]
# CPU-only execution: Disable parallelism to avoid oversubscription on constrained runners
addopts = -v --tb=short -n 0 --maxprocesses=1
# Ensure deterministic behavior for stratified sampling tests
random_seed = 42
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Logging configuration for test runs
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
# Filter warnings to keep output clean
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
