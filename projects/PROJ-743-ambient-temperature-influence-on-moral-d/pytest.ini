[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --cpu-only
markers =
    cpu_only: Marks test to run only on CPU.
    stratified: Marks test to use stratified sampling.
    gpu: Marks test requiring GPU (skipped in CPU-only mode).
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
pythonpath = code
