[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# CPU-only execution: disable any GPU usage
addopts = -v --tb=short -p no:warnings
# Ensure no GPU is used by setting environment variables at test level
# (handled in conftest.py via pytest_configure)
# Stratified sampling configuration
# The actual sampling logic is implemented in test fixtures/helpers
# to ensure reproducibility and fairness across groups.
