[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Execution constraints
addopts = -v --tb=short --maxfail=1
# Ensure CPU-only execution via environment variables set in conftest.py
# We explicitly disable any parallel execution to avoid race conditions in data loading
# and to adhere to the CPU-only constraint for reproducibility.
norecursedirs = .git .venv build dist

# Markers
markers =
    stratified: Mark a test to use stratified sampling on the input data.
    cpu_only: Explicitly mark a test as CPU-only.

# Logging configuration for tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings to keep output clean, but ensure we don't hide real errors
filterwarnings =
    error::DeprecationWarning
    ignore::FutureWarning
    ignore:.*pandas.*:FutureWarning
