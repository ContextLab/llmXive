$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Output Schema"
description: "Schema for the statistical model results JSON file."
type: "object"
properties:
  model_type:
    type: "string"
    description: "Type of model fitted (e.g., 'LMM', 'GLMM')."
  fixed_effects:
    type: "object"
    description: "Fixed effect coefficients."
    properties:
      temperature_c:
        type: "object"
        properties:
          estimate:
            type: "number"
          std_error:
            type: "number"
          p_value:
            type: "number"
          confidence_interval:
            type: "array"
            items:
              type: "number"
            minItems: 2
            maxItems: 2
      dilemma_complexity:
        type: "object"
        properties:
          estimate:
            type: "number"
          std_error:
            type: "number"
          p_value:
            type: "number"
      time_of_day:
        type: "object"
        properties:
          estimate:
            type: "number"
          std_error:
            type: "number"
          p_value:
            type: "number"
    required:
      - temperature_c
  random_effects:
    type: "object"
    description: "Random effect variances."
    properties:
      participant_id:
        type: "number"
      cultural_region:
        type: "number"
  diagnostics:
    type: "object"
    description: "Model diagnostics."
    properties:
      convergence:
        type: "boolean"
      residual_normality_p:
        type: "number"
      aic:
        type: "number"
      bic:
        type: "number"
  timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of the run."
required:
  - model_type
  - fixed_effects
  - random_effects
  - diagnostics
  - timestamp
additionalProperties: false