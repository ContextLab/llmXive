$schema: "http://json-schema.org/draft-07/schema#"
title: "Merged Moral Machine and Temperature Dataset Schema"
description: "Schema for the processed merged dataset used in statistical modeling."
type: "object"
properties:
  record_id:
    type: "string"
    description: "Unique identifier for the merged record."
  participant_id:
    type: "string"
    description: "Anonymous participant identifier."
  country:
    type: "string"
    description: "Country of the participant."
  latitude:
    type: "number"
    description: "Latitude of the response location."
    minimum: -90
    maximum: 90
  longitude:
    type: "number"
    description: "Longitude of the response location."
    minimum: -180
    maximum: 180
  response_time_log:
    type: "number"
    description: "Log-transformed response time in milliseconds."
    minimum: -10
    maximum: 10
  temperature_c:
    type: "number"
    description: "Ambient temperature in Celsius."
    minimum: -40
    maximum: 50
  distance_km:
    type: "number"
    description: "Distance to the nearest temperature grid point in kilometers."
    minimum: 0
    maximum: 100
  dilemma_complexity:
    type: "number"
    description: "Derived complexity score of the dilemma."
    minimum: 0
  time_of_day:
    type: "number"
    description: "Hour of the day (0-23)."
    minimum: 0
    maximum: 23
  quality_flag:
    type: "string"
    description: "Data quality status."
    enum:
      - "OK"
      - "LOW_CONF"
      - "EXCLUDED"
required:
  - record_id
  - participant_id
  - country
  - latitude
  - longitude
  - response_time_log
  - temperature_c
  - distance_km
  - dilemma_complexity
  - time_of_day
  - quality_flag
additionalProperties: false