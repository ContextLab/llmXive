$schema: "http://json-schema.org/draft-07/schema#"
title: "Merged Moral Machine and Temperature Dataset Schema"
description: "Schema for the processed merged dataset used in statistical modeling."
type: "object"
properties:
  record_id:
    type: "string"
    description: "Unique identifier for the merged record."
  response_id:
    type: "string"
    description: "Original Moral Machine response identifier."
  participant_id:
    type: "string"
    description: "Anonymous participant identifier."
  country:
    type: "string"
    description: "Country code of the participant (used as random effect)."
  latitude:
    type: "number"
    description: "Latitude of the response location."
    minimum: -90
    maximum: 90
  longitude:
    type: "number"
    description: "Longitude of the response location."
    minimum: -180
    maximum: 180
  response_time_ms:
    type: "integer"
    description: "Response latency in milliseconds (required for primary analysis)."
  log_rt:
    type: "number"
    description: "Natural log of response_time_ms."
  temperature_c:
    type: "number"
    description: "Hourly temperature (°C) from ERA5 2014‑2018 (primary predictor)."
    minimum: -50
    maximum: 50
  temperature_c_squared:
    type: "number"
    description: "Square of temperature_c for non‑linearity testing."
  distance_km:
    type: "number"
    description: "Haversine distance to nearest ERA5 grid cell."
    minimum: 0
    maximum: 100
  dilemma_complexity:
    type: "number"
    description: "Static complexity score derived from scenario attributes."
    minimum: 0
  difficulty_score:
    type: "integer"
    description: "Categorical difficulty (Low=0, Medium=1, High=2)."
    minimum: 0
    maximum: 2
  time_of_day:
    type: "integer"
    description: "Hour of day (0‑23)."
    minimum: 0
    maximum: 23
  age_group:
    type: "string"
    description: "Age bracket (optional)."
  gender:
    type: "string"
    description: "Gender (optional)."
  urban_rural_proxy:
    type: "string"
    description: "Urban or rural classification based on GHSL density (optional)."
    enum: ["urban", "rural"]
  quality_flag:
    type: "string"
    description: "Data quality status."
    enum:
      - "OK"
      - "LOW_CONF"
      - "EXCLUDED"
  exclusion_flag:
    type: "boolean"
    description: "True if the record was excluded due to distance or other quality issue."
required:
  - record_id
  - response_id
  - participant_id
  - country
  - latitude
  - longitude
  - response_time_ms
  - log_rt
  - temperature_c
  - distance_km
  - dilemma_complexity
  - difficulty_score
  - time_of_day
  - quality_flag
additionalProperties: false