$schema: "http://json-schema.org/draft-07/schema#"
title: "Merged Dataset Schema"
description: "Schema for the merged Moral Machine and ERA5 dataset used in analysis."
type: "object"
properties:
  response_id:
    type: "string"
    description: "Unique identifier for the moral response."
  participant_id:
    type: "string"
    description: "Unique identifier for the participant."
  country:
    type: "string"
    description: "ISO country code of the participant."
  latitude:
    type: "number"
    description: "Latitude of the response location."
    minimum: -90
    maximum: 90
  longitude:
    type: "number"
    description: "Longitude of the response location."
    minimum: -180
    maximum: 180
  timestamp:
    type: "string"
    format: "date-time"
    description: "Timestamp of the response (ISO 8601)."
  response_time_ms:
    type: "integer"
    description: "Response latency in milliseconds (required)."
  log_rt:
    type: "number"
    description: "Natural log of response_time_ms."
  temperature_c:
    type: "number"
    description: "Hourly temperature (°C) from ERA5 2014‑2018."
    minimum: -50
    maximum: 50
  temperature_c_squared:
    type: "number"
    description: "Square of temperature_c for non‑linearity testing."
  dilemma_complexity:
    type: "number"
    description: "Static complexity score of the dilemma."
    minimum: 0
  time_of_day:
    type: "integer"
    description: "Hour of the day (0‑23)."
    minimum: 0
    maximum: 23
  age_group:
    type: "string"
    description: "Age bracket (optional)."
  gender:
    type: "string"
    description: "Gender (optional)."
  distance_km:
    type: "number"
    description: "Distance in km to the nearest ERA5 grid point."
    minimum: 0
    maximum: 100
  exclusion_flag:
    type: "boolean"
    description: "True if the record was excluded due to distance or other quality issue."
required:
  - response_id
  - participant_id
  - country
  - latitude
  - longitude
  - timestamp
  - response_time_ms
  - log_rt
  - temperature_c
  - temperature_c_squared
  - dilemma_complexity
  - time_of_day
  - distance_km
additionalProperties: false