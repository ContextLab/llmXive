[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-temperature-moral-speed"
version = "0.1.0"
description = "Research pipeline for analyzing ambient temperature influence on moral decision speed"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "statsmodels>=0.13.0",
    "scikit-learn>=1.0.0",
    "requests>=2.25.0",
    "pyyaml>=6.0",
    "seaborn>=0.11.0",
    "matplotlib>=3.4.0",
    "geopandas>=0.9.0",
    "cdsapi>=0.6.0",
    "huggingface_hub>=0.8.0",
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-xdist>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools]
packages = ["code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--doctest-modules",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running",
    "cpu_only: marks tests that must run on CPU only",
    "stratified: marks tests that use stratified sampling",
]
# CPU-only execution configuration
env = [
    "CUDA_VISIBLE_DEVICES=",
    "TF_CPP_MIN_LOG_LEVEL=3",
]
# Parallel execution settings for CPU efficiency
nworkers = "auto"

[tool.pytest.cov]
source = ["code"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.pytest_cache/*",
]
fail_under = 70
show_missing = true

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert statements in tests
"code/*" = ["S101"]   # Allow assert in code if needed for validation
