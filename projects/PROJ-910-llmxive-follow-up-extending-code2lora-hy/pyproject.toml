[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-follow-up-extending-code2lora-hy"
version = "0.1.0"
description = "Extending Code2LoRA: Hypernetwork-Generated Adapters for Code Language Models under Software Evolution"
requires-python = ">=3.9"
dependencies = [
    "transformers>=4.40.0",
    "peft>=0.11.0",
    "torch>=2.2.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.2",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "datasets>=2.18.0",
    "psutil>=5.9.0",
    "scipy>=1.12.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "black>=24.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["code*"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
)/
'''

[tool.ruff]
# Same as Black.
line-length = 100
target-version = "py39"
src = ["code", "tests"]
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert allowed in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
addopts = "-v --cov=code --cov-report=term-missing"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true