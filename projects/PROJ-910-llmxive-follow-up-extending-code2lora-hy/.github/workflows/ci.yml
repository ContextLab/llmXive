name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Targeting GitHub Actions Free Tier constraints:
# - 2 CPU cores (default for ubuntu-latest)
# - ~7GB RAM (default for ubuntu-latest)
# - 6h timeout limit per job

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black

      - name: Lint with Ruff
        run: |
          ruff check code/ tests/

      - name: Check formatting with Black
        run: |
          black --check code/ tests/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Unit Tests
        run: |
          pytest tests/unit --cov=code --cov-report=xml

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-sample:
    runs-on: ubuntu-latest
    # Enforce resource constraints explicitly for the free tier
    # GitHub Actions runners typically have 2 cores and ~7GB RAM available for the job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Sample Data (Small Subset)
        run: |
          # Fetch a tiny deterministic subset to avoid timeout/OOM on CI
          python code/data/download_repopeftbench.py --sample-size 5 --output data/raw/sample_ci

      - name: Run Minimal Pipeline (Generate + Evaluate)
        # This step verifies the core logic works within 6h timeout and 7GB RAM
        # It uses the small sample downloaded above
        run: |
          timeout 3600 python code/main.py generate --input data/raw/sample_ci --output data/adapters/test_adapter
          timeout 3600 python code/main.py evaluate --adapter data/adapters/test_adapter --input data/raw/sample_ci --output data/results/ci_scores.csv

      - name: Verify Output Artifacts
        run: |
          test -f data/adapters/test_adapter.safetensors
          test -f data/results/ci_scores.csv
          test -f data/results/ast_generation_latency.json

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: |
            data/results/
            data/adapters/