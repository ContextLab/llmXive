$schema: http://json-schema.org/draft-07/schema#
title: Correlation Results Schema
description: >
  Schema for OLS regression results between neural entropy metrics and WCST perseverative errors,
  including covariates, effect sizes, and FDR-corrected p-values.
type: object
required:
  - results
  - metadata
properties:
  results:
    type: array
    description: List of regression coefficients for each predictor
    items:
      type: object
      required:
        - predictor
        - band
        - metric
        - coef
        - std_err
        - p_value
        - p_value_fdr
        - vif
        - partial_r
        - effect_size_class
      properties:
        predictor:
          type: string
          description: Name of the predictor variable (e.g., 'sample_entropy_theta')
        band:
          type: string
          enum: [delta, theta, alpha, beta, gamma]
          description: Frequency band of the entropy metric
        metric:
          type: string
          enum: [sample_entropy, approximate_entropy]
          description: Entropy metric type
        coef:
          type: number
          description: Regression coefficient (beta weight)
        std_err:
          type: number
          description: Standard error of the coefficient
        p_value:
          type: number
          description: Raw p-value from the t-test
        p_value_fdr:
          type: number
          description: Benjamini-Hochberg FDR-corrected p-value
        vif:
          type: number
          description: Variance Inflation Factor for this predictor
        partial_r:
          type: number
          description: Partial correlation coefficient
        effect_size_class:
          type: string
          enum: [negligible, small, medium, large]
          description: Classification based on |partial_r| thresholds
        significant:
          type: boolean
          description: True if p_value_fdr < 0.05
  metadata:
    type: object
    required:
      - model_formula
      - n_observations
      - n_predictors
      - fdr_method
      - vif_threshold
      - ap_en_dropped
      - timestamp
    properties:
      model_formula:
        type: string
        description: The OLS formula string used
      n_observations:
        type: integer
        description: Number of participants included in the model
      n_predictors:
        type: integer
        description: Number of predictors in the final model
      fdr_method:
        type: string
        description: Method used for FDR correction (e.g., 'benjamini_hochberg')
      vif_threshold:
        type: number
        description: VIF threshold used for multicollinearity check
      ap_en_dropped:
        type: boolean
        description: Whether Approximate Entropy was dropped due to VIF > 5
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the analysis was run
additionalProperties: false
