$schema: http://json-schema.org/draft-07/schema#
title: Correlation Results Schema
description: Schema for OLS regression results with FDR correction and effect sizes from the neural entropy and cognitive flexibility study.
type: object
required:
  - subject_id
  - entropy_metric
  - frequency_band
  - model_type
  - coefficient
  - std_error
  - t_statistic
  - p_value
  - p_value_fdr
  - partial_r
  - effect_size_category
  - n_observations
  - r_squared
  - covariates
  - vif_scores
  - exclusion_reasons
properties:
  subject_id:
    type: string
    description: Unique identifier for the participant (e.g., 'sub-001', 'sub-002').
  entropy_metric:
    type: string
    description: The entropy metric used (e.g., 'SampleEntropy', 'ApproximateEntropy').
  frequency_band:
    type: string
    description: The EEG frequency band analyzed (e.g., 'Delta', 'Theta', 'Alpha', 'Beta', 'Gamma').
  model_type:
    type: string
    description: Type of statistical model used (e.g., 'OLS').
  coefficient:
    type: number
    description: The regression coefficient (beta) for the entropy metric.
  std_error:
    type: number
    description: Standard error of the coefficient.
  t_statistic:
    type: number
    description: T-statistic for the coefficient.
  p_value:
    type: number
    description: Raw p-value from the regression.
  p_value_fdr:
    type: number
    description: Benjamini-Hochberg FDR-corrected p-value.
  partial_r:
    type: number
    description: Partial correlation coefficient.
  effect_size_category:
    type: string
    description: Classification of effect size (e.g., 'Small', 'Medium', 'Large', 'Negligible').
    enum:
      - Negligible
      - Small
      - Medium
      - Large
  n_observations:
    type: integer
    description: Number of observations used in the model.
  r_squared:
    type: number
    description: R-squared value of the model.
  covariates:
    type: object
    description: Dictionary of covariate names and their coefficients.
    additionalProperties:
      type: number
  vif_scores:
    type: object
    description: Variance Inflation Factor scores for predictors.
    additionalProperties:
      type: number
  exclusion_reasons:
    type: array
    description: List of reasons if this subject was excluded from specific analyses.
    items:
      type: string
  methodology_notes:
    type: string
    description: Notes on methodology (e.g., 'Associational study', 'FDR correction applied').
