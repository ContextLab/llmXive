$schema: "http://json-schema.org/draft-07/schema#"
title: "OpenNeuro Dataset Metadata Schema"
description: "Schema for validating dataset metadata extracted from OpenNeuro BIDS datasets."
type: object
required:
  - id
  - description
  - summary
properties:
  id:
    type: string
    description: "OpenNeuro dataset identifier (e.g., ds003104)"
    pattern: "^ds[0-9]+$"
  description:
    type: object
    required:
      - Name
    properties:
      Name:
        type: string
        description: "Dataset name"
      Authors:
        type: array
        items:
          type: string
        description: "List of dataset authors"
      License:
        type: string
        description: "Dataset license"
      HEDVersion:
        type: string
        description: "HED version if applicable"
  summary:
    type: object
    required:
      - subjects
      - subjectMetadata
      - tasks
      - modalities
    properties:
      subjects:
        type: integer
        minimum: 1
        description: "Total number of subjects"
      subjectMetadata:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - participantId
          properties:
            participantId:
              type: string
              description: "Subject identifier (e.g., sub-01)"
            age:
              type: integer
              minimum: 0
              description: "Subject age in years"
            sex:
              type: string
              enum: ["M", "F", "O"]
              description: "Subject biological sex"
            handedness:
              type: string
              enum: ["left", "right", "ambidextrous"]
              description: "Subject handedness"
            neurological_condition:
              type: string
              description: "Any neurological condition (optional)"
      tasks:
        type: array
        minItems: 1
        items:
          type: string
        description: "List of task names present in the dataset"
      modalities:
        type: array
        minItems: 1
        items:
          type: string
        description: "List of data modalities (e.g., eeg, meg)"
      sessions:
        type: array
        items:
          type: string
        description: "List of session identifiers if applicable"
  derived:
    type: object
    description: "Derived metadata from processing pipeline"
    properties:
      variable_fit_verified:
        type: boolean
        description: "Whether required behavioral variables were found"
      age_range:
        type: object
        properties:
          min:
            type: integer
          max:
            type: integer
      total_records:
        type: integer
        minimum: 0
additionalProperties: false