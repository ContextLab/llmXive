$schema: "http://json-schema.org/draft-07/schema#"
title: "Neural Entropy Dataset Schema"
type: "object"
required:
  - participant_id
  - age
  - education
  - wcst_perseverative_errors
  - task_accuracy
  - neurological_condition
  - medication_use
  - raw_eeg_file
properties:
  participant_id:
    type: "string"
  age:
    type: "integer"
    minimum: 0
  education:
    type: "string"
  wcst_perseverative_errors:
    type: "number"
  task_accuracy:
    type: "number"
  neurological_condition:
    type: "boolean"
  medication_use:
    type: "boolean"
  raw_eeg_file:
    type: "string"
    pattern: ".*\\.(edf|bdf|vhdr|fif)$"
    description: "Path to the raw EEG file (EDF/BDF/BrainVision/FIF)."