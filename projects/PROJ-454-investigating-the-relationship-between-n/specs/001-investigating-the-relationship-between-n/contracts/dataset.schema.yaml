$schema: "http://json-schema.org/draft-07/schema#"
title: "OpenNeuro Dataset Metadata Schema"
description: "Schema for validating dataset metadata fetched from OpenNeuro API"
type: object
required:
  - id
  - description
  - summary
properties:
  id:
    type: string
    description: "OpenNeuro dataset identifier (e.g., ds003104)"
    pattern: "^ds\\d+$"
  description:
    type: object
    required:
      - Name
    properties:
      Name:
        type: string
        description: "Human-readable name of the dataset"
      Authors:
        type: array
        items:
          type: string
        description: "List of dataset authors"
      License:
        type: string
        description: "Dataset license"
      HEDVersion:
        type: string
        description: "HED tag version if applicable"
  summary:
    type: object
    required:
      - subjects
      - subjectMetadata
      - tasks
      - modalities
    properties:
      subjects:
        type: integer
        minimum: 0
        description: "Total number of subjects"
      subjectMetadata:
        type: array
        description: "Metadata for individual subjects"
        items:
          type: object
          required:
            - participantId
          properties:
            participantId:
              type: string
              description: "Subject identifier (e.g., sub-01)"
            age:
              type: integer
              minimum: 0
              description: "Age of the participant"
            sex:
              type: string
              enum: ["M", "F", "U"]
              description: "Sex of the participant"
            neurologicalCondition:
              type: string
              description: "Optional neurological condition"
            education:
              type: string
              description: "Education level"
            medication:
              type: array
              items:
                type: string
              description: "List of medications"
      tasks:
        type: array
        description: "List of tasks performed in the dataset"
        items:
          type: string
      modalities:
        type: array
        description: "List of data modalities (e.g., eeg, meg)"
        items:
          type: string
      size:
        type: integer
        minimum: 0
        description: "Total size in bytes"
      totalFiles:
        type: integer
        minimum: 0
        description: "Total number of files"
additionalProperties: false
