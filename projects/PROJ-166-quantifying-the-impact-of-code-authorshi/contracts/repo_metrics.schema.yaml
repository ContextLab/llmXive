description: >-
  Schema for the cleaned repository metrics dataset used in the primary
  analysis. Generated by the data pipeline (T009).
type: object
properties:
  url:
    type: string
    format: uri
    description: The exact GitHub URL of the repository (e.g., https://github.com/owner/repo)
    nullable: false
  primary_language:
    type: string
    description: The primary programming language of the repository as reported by GitHub
    nullable: false
  unique_authors:
    type: integer
    description: Count of unique author emails extracted from the git log
    minimum: 1
    nullable: false
  kloc:
    type: number
    description: Thousands of Lines of Code (raw line count / 1000)
    minimum: 0
    nullable: false
  authorship_diversity:
    type: number
    description: Ratio of unique_authors to kloc (unique_authors / kloc)
    minimum: 0
    nullable: false
  cve_count:
    type: integer
    description: Number of CVEs associated with this repository via exact URL match
    minimum: 0
    nullable: false
  project_age:
    type: number
    description: Age of the project in years (calculated from first commit to last commit or current date)
    minimum: 0
    nullable: false
  release_count:
    type: integer
    description: Number of releases/tags associated with the repository
    minimum: 0
    nullable: false
required:
  - url
  - primary_language
  - unique_authors
  - kloc
  - authorship_diversity
  - cve_count
  - project_age
  - release_count
