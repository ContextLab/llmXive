description: >-
  Schema for the statistical model results (Negative Binomial GLM) output.
  Generated by code/analysis/fit_models.py (T017) and robustness.py (T021-T024).
type: object
properties:
  author_count_coefficient:
    type: number
    description: Estimated coefficient for the author_count predictor
    nullable: true
  std_err:
    type: number
    description: Standard error of the author_count coefficient
    nullable: true
  p_value:
    type: number
    description: Raw p-value for the author_count coefficient (unadjusted)
    minimum: 0
    maximum: 1
    nullable: true
  p_value_adjusted:
    type: number
    description: Benjamini-Hochberg adjusted p-value
    minimum: 0
    maximum: 1
    nullable: true
  ci_95_lower:
    type: number
    description: Lower bound of the 95% confidence interval for the coefficient
    nullable: true
  ci_95_upper:
    type: number
    description: Upper bound of the 95% confidence interval for the coefficient
    nullable: true
  vif:
    type: object
    description: Variance Inflation Factor for predictors
    additionalProperties:
      type: number
    nullable: false
  convergence_status:
    type: boolean
    description: Whether the model fitting algorithm converged successfully
    nullable: false
  model_type:
    type: string
    description: Type of model fitted (e.g., "NegativeBinomial")
    enum:
      - NegativeBinomial
      - Poisson
    nullable: false
  high_collinearity_warning:
    type: boolean
    description: Flag indicating if any VIF > 5.0 was detected
    nullable: false
  sample_size:
    type: integer
    description: Number of observations used in the model
    minimum: 1
    nullable: false
required:
  - author_count_coefficient
  - std_err
  - p_value
  - ci_95_lower
  - ci_95_upper
  - vif
  - convergence_status
  - model_type
  - sample_size