$schema: http://json-schema.org/draft-07/schema#
title: Model Results Schema
description: Schema for the output of the Negative Binomial GLM analysis.
type: object
properties:
  author_count_coefficient:
    type: number
    description: Estimated coefficient for the author count predictor.
  std_err:
    type: number
    description: Standard error of the author count coefficient.
  p_value:
    type: number
    description: Raw p-value for the author count coefficient.
    minimum: 0
    maximum: 1
  ci_95_lower:
    type: number
    description: Lower bound of the 95% confidence interval.
  ci_95_upper:
    type: number
    description: Upper bound of the 95% confidence interval.
  vif:
    type: object
    description: Variance Inflation Factor for all predictors.
    additionalProperties:
      type: number
  convergence_status:
    type: boolean
    description: Whether the model fitting converged successfully.
  model_type:
    type: string
    description: Type of model fitted.
    enum:
      - NegativeBinomial
  high_collinearity_warning:
    type: boolean
    description: Flag indicating if any VIF > 5.0 was detected.
    default: false
  fallback_model_used:
    type: boolean
    description: Flag indicating if a fallback model was used (should be false per spec).
    default: false
required:
  - author_count_coefficient
  - std_err
  - p_value
  - ci_95_lower
  - ci_95_upper
  - vif
  - convergence_status
  - model_type
