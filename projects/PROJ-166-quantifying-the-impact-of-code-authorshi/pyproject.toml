[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-proj-166"
version = "0.1.0"
description = "Quantifying the Impact of Code Authorship Diversity on Software Security"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
    "gitpython>=3.1.37",
    "pyyaml>=6.0.1",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pytest>=7.4.0",
    "psutil>=5.9.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | venv
    | \.venv
    | dist
    | build
)/
'''

[tool.setuptools.packages.find]
where = ["code"]
include = ["code*"]
