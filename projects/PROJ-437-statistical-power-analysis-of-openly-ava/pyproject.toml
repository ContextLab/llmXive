[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-statistical-power-analysis"
version = "0.1.0"
description = "Statistical Power Analysis of Openly Available fMRI Datasets"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "bidslib",
    "nibabel",
    "nilearn",
    "scikit-learn",
    "statsmodels",
    "pandas",
    "numpy",
    "mne",
    "datasets",
    "requests",
    "psutil",
    "flake8",
    "black",
    "isort",
    "pytest",
    "pytest-cov"
]

[project.optional-dependencies]
dev = [
    "flake8",
    "black",
    "isort",
    "pytest",
    "pytest-cov",
    "mypy"
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["analysis", "data_setup", "download", "models", "preprocess", "simulation", "utils", "main"]
skip = [".git", ".tox", ".venv", "build", "dist"]

[tool.flake8]
max-line-length = 88
extend-ignore = "E203, W503"
exclude = [
    ".git",
    ".tox",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "*.pyc"
]
per-file-ignores = [
    "__init__.py:F401"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=code --cov-report=term-missing --cov-report=html"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true