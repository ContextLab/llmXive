# Linting (ruff) and formatting (black) configuration for T003.
# Located under code/ per project path conventions. Invoke with:
#   ruff check --config code/pyproject.toml code/src tests
#   black --config code/pyproject.toml --check code/src tests

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "data",
    "models",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by black
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    data
  | models
  | \.venv
)/
'''
