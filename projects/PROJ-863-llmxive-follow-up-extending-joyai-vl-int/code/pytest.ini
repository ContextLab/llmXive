[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    cpu_limit: Marks tests that enforce CPU resource limits (RAM/CPU count).
    slow: Marks tests that take longer than a threshold (skipped in CI by default).
    unit: Marks unit tests.
    integration: Marks integration tests.
    data_gen: Marks data generation tests.
    baseline: Marks baseline detector tests.
    scheduler: Marks scheduler training/eval tests.
