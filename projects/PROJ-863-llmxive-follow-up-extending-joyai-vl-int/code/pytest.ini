[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    cpu_limit: Mark test to enforce CPU resource limits (RAM < 6GB, 1 thread)
    slow: Marks tests that take longer than 30 seconds
    integration: Marks integration tests requiring data pipeline execution
    unit: Marks unit tests
    ci_subset: Marks tests that run a subset of data for CI environments
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
