    \ regions) and FPN (e.g., dorsolateral prefrontal, inferior parietal regions)\
    \ map to specific, non-contiguous indices, so these lists are a placeholder rather\
    \ than the explicit, correct ROI index lists the task requires. The implementer\
    \ should populate the JSON with the actual AAL indices for each networ"
