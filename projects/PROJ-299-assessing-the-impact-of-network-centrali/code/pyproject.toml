[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-cognitive-decline"
version = "0.1.0"
description = "Assessing the Impact of Network Centrality on Age-Related Cognitive Decline"
requires-python = ">=3.10"
dependencies = [
    "nibabel",
    "nilearn",
    "networkx",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "reportlab",
    "python-dotenv",
    "requests",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | outputs
    | logs
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "data",
    "outputs",
    "logs",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
