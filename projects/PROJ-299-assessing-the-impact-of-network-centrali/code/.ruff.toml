[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line-too-long (handled by black)
]
target-version = "py310"

[lint.isort]
known-first-party = ["code"]
force-single-line = false
lines-between-types = 0

[format]
line-length = 88
target-version = "py310"
