version: "1.0"
entity: AnalysisResult
description: >
  Schema for the output of correlation and regression analyses.
  Defines the structure for statistical results including coefficients,
  p-values, adjusted p-values, confidence intervals, and R-squared values.
fields:
  - name: test_type
    type: str
    description: Type of statistical test performed (e.g., 'pearson', 'spearman', 'linear_regression').
    required: true
  - name: metric_name
    type: str
    description: Name of the microbiome metric or variable being tested (e.g., 'shannon_diversity', 'cognitive_flexibility_score').
    required: true
  - name: correlation_coefficient
    type: float
    description: The primary correlation coefficient (r) or regression beta coefficient.
    required: true
  - name: p_value
    type: float
    description: The raw p-value associated with the test statistic.
    required: true
  - name: adjusted_p_value
    type: float
    description: The Benjamini-Hochberg adjusted p-value for multiple testing correction.
    required: true
  - name: confidence_interval
    type: array[float, float]
    description: The 95% confidence interval for the coefficient [lower_bound, upper_bound].
    required: true
  - name: r_squared
    type: float
    description: The R-squared value for regression models, or NaN for simple correlations.
    required: true