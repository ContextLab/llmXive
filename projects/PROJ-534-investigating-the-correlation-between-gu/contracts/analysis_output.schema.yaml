$schema: http://json-schema.org/draft-07/schema#
title: AnalysisResult
description: |
  Schema for the output of the correlation and regression analysis pipeline.
  This entity captures the statistical results of the relationship between
  microbiome diversity metrics and cognitive flexibility, including covariate
  adjustments and multiple testing corrections.
type: object
required:
  - analysis_metadata
  - correlation_results
  - regression_results
  - diversity_metrics_summary
properties:
  analysis_metadata:
    type: object
    description: Metadata about the analysis run.
    required:
      - timestamp
      - version
      - cohort_size
      - seed
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of when the analysis was run.
      version:
        type: string
        description: Version of the analysis pipeline (e.g., "1.0.0").
      cohort_size:
        type: integer
        minimum: 1
        description: Number of participants included in the final filtered cohort.
      seed:
        type: integer
        description: Random seed used for reproducibility (if applicable).
      software_versions:
        type: object
        description: Versions of key libraries used.
        properties:
          python:
            type: string
          pandas:
            type: string
          scipy:
            type: string
          statsmodels:
            type: string

  diversity_metrics_summary:
    type: object
    description: Summary statistics for the diversity metrics calculated.
    required:
      - alpha_diversity
      - beta_diversity
    properties:
      alpha_diversity:
        type: object
        description: Summary stats (mean, std, min, max) for alpha metrics.
        properties:
          shannon:
            $ref: '#/$defs/summary_stats'
          simpson:
            $ref: '#/$defs/summary_stats'
          chao1:
            $ref: '#/$defs/summary_stats'
      beta_diversity:
        type: object
        description: PERMANOVA results for beta diversity.
        properties:
          bray_curtis:
            $ref: '#/$defs/permanova_result'
          unifrac_weighted:
            $ref: '#/$defs/permanova_result'

  correlation_results:
    type: array
    description: |
      List of correlation results between diversity metrics and cognitive scores.
      Each entry represents a specific metric-test pair.
    items:
      type: object
      required:
        - metric_name
        - test_type
        - correlation_method
        - correlation_coefficient
        - p_value
        - adjusted_p_value
        - confidence_interval
        - n_obs
        - skewness
        - normality_test_p_value
      properties:
        metric_name:
          type: string
          description: Name of the diversity metric (e.g., 'shannon', 'simpson').
        test_type:
          type: string
          description: Type of cognitive test or score used.
        correlation_method:
          type: string
          enum: [pearson, spearman]
          description: Method used for correlation (auto-switched if non-normal).
        correlation_coefficient:
          type: number
          description: The calculated correlation coefficient (r or rho).
        p_value:
          type: number
          minimum: 0
          maximum: 1
          description: Raw p-value for the correlation.
        adjusted_p_value:
          type: number
          minimum: 0
          maximum: 1
          description: Benjamini-Hochberg adjusted p-value.
        confidence_interval:
          type: object
          description: 95% confidence interval for the correlation coefficient.
          required:
            - lower
            - upper
          properties:
            lower:
              type: number
            upper:
              type: number
        n_obs:
          type: integer
          minimum: 2
          description: Number of observations used in the correlation.
        skewness:
          type: number
          description: Skewness of the distribution (used to determine method).
        normality_test_p_value:
          type: number
          description: Shapiro-Wilk test p-value for normality.
        decision_log:
          type: string
          description: Log message explaining the switch to Spearman if applicable.

  regression_results:
    type: array
    description: |
      Results of linear regression models: Cognitive ~ Diversity + Covariates.
    items:
      type: object
      required:
        - model_formula
        - diversity_metric
        - coefficients
        - p_values
        - adjusted_p_values
        - r_squared
        - f_statistic
        - f_p_value
      properties:
        model_formula:
          type: string
          description: The R-style formula used for the model.
        diversity_metric:
          type: string
          description: The diversity metric used as the primary predictor.
        coefficients:
          type: object
          description: Dictionary of coefficient estimates for each predictor.
          additionalProperties:
            type: number
        p_values:
          type: object
          description: Dictionary of raw p-values for each predictor.
          additionalProperties:
            type: number
        adjusted_p_values:
          type: object
          description: Dictionary of BH-adjusted p-values for the diversity metric across models.
          additionalProperties:
            type: number
        r_squared:
          type: number
          description: R-squared value of the model.
        f_statistic:
          type: number
          description: F-statistic for the overall model.
        f_p_value:
          type: number
          description: P-value for the F-statistic.

  $defs:
    summary_stats:
      type: object
      properties:
        mean:
          type: number
        std:
          type: number
        min:
          type: number
        max:
          type: number
        count:
          type: integer
    permanova_result:
      type: object
      properties:
        pseudo_f:
          type: number
        p_value:
          type: number
        n_permutations:
          type: integer
        r_squared:
          type: number
          description: Explained variance (R2) of the model.