# Analysis Output Schema
# Defines the structure for statistical analysis results
# Used to validate correlation and regression outputs
# Generated for PROJ-534: Investigating the Correlation Between Gut Microbiome Composition and Cognitive Flexibility in Aging

$schema: "http://json-schema.org/draft-07/schema#"
title: AnalysisResult
description: "Schema for storing statistical analysis results from correlation and regression tests"

type: object
required:
  - test_type
  - metric_name
  - correlation_coefficient
  - p_value
  - adjusted_p_value
  - confidence_interval
  - r_squared

properties:
  test_type:
    type: string
    description: "Type of statistical test performed (e.g., 'pearson', 'spearman', 'linear_regression')"
    minLength: 1

  metric_name:
    type: string
    description: "Name of the microbiome metric being analyzed (e.g., 'shannon_diversity', 'simpson_diversity')"
    minLength: 1

  correlation_coefficient:
    type: number
    description: "Correlation coefficient (r) or regression beta coefficient"
    minimum: -1000000
    maximum: 1000000

  p_value:
    type: number
    description: "Raw p-value from the statistical test"
    minimum: 0
    maximum: 1

  adjusted_p_value:
    type: number
    description: "FDR-adjusted p-value (Benjamini-Hochberg correction)"
    minimum: 0
    maximum: 1

  confidence_interval:
    type: array
    description: "95% confidence interval [lower_bound, upper_bound]"
    items:
      type: number
    minItems: 2
    maxItems: 2

  r_squared:
    type: number
    description: "Coefficient of determination (R²) for regression models"
    minimum: 0
    maximum: 1

additionalProperties: false

# Example usage:
# {
#   "test_type": "spearman",
#   "metric_name": "shannon_diversity",
#   "correlation_coefficient": 0.15,
#   "p_value": 0.032,
#   "adjusted_p_value": 0.048,
#   "confidence_interval": [0.02, 0.28],
#   "r_squared": 0.0225
# }