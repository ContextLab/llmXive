# Analysis Output Schema
# Defines the structure for correlation and regression analysis results
# as required by Task T004.

entity: AnalysisResult
description: "Schema for storing statistical analysis results including correlations and regressions."
fields:
  - name: test_type
    type: str
    description: "Type of statistical test performed (e.g., 'pearson', 'spearman', 'linear_regression')."
    required: true
    
  - name: metric_name
    type: str
    description: "Name of the diversity metric or variable being analyzed (e.g., 'shannon_diversity', 'simpson_diversity')."
    required: true
    
  - name: correlation_coefficient
    type: float
    description: "The calculated correlation coefficient (r) or regression beta coefficient."
    required: true
    
  - name: p_value
    type: float
    description: "The unadjusted p-value for the test statistic."
    required: true
    
  - name: adjusted_p_value
    type: float
    description: "The Benjamini-Hochberg adjusted p-value for multiple comparison correction."
    required: true
    
  - name: confidence_interval
    type: array[float, float]
    description: "Two-element array representing the lower and upper bounds of the confidence interval (e.g., [0.025, 0.975])."
    required: true
    
  - name: r_squared
    type: float
    description: "The coefficient of determination (R²) for regression models. For pure correlation tests, this may be null or the square of the correlation coefficient."
    required: true
    
validation_rules:
  - rule: "correlation_coefficient must be between -1.0 and 1.0 for correlation tests."
  - rule: "p_value and adjusted_p_value must be between 0.0 and 1.0."
  - rule: "confidence_interval must have exactly 2 elements where lower < upper."
  - rule: "r_squared must be between 0.0 and 1.0."