$schema: http://json-schema.org/draft-07/schema#
title: AnalysisResult
description: >-
  Schema defining the structure of statistical analysis outputs for the
  gut microbiome and cognitive flexibility correlation study.
  This schema validates the content of data/results/correlation_results.json
  and data/results/statistical_results.json.
type: object
required:
  - analysis_metadata
  - results
properties:
  analysis_metadata:
    type: object
    description: Metadata about the analysis run.
    required:
      - timestamp
      - version
      - cohort_id
    properties:
      timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of the analysis execution.
      version:
        type: string
        description: Version of the analysis pipeline used (e.g., "1.0.0").
      cohort_id:
        type: string
        description: Identifier for the specific cohort used (e.g., "filtered_age_ge_65").
      seed:
        type: integer
        description: Random seed used for reproducibility if applicable.

  results:
    type: array
    description: List of individual statistical test results.
    items:
      type: object
      required:
        - test_type
        - metric_name
        - variable_pair
        - correlation_coefficient
        - p_value
        - adjusted_p_value
        - confidence_interval
        - n_samples
      properties:
        test_type:
          type: string
          enum:
            - pearson
            - spearman
            - linear_regression
            - permanova
          description: Type of statistical test performed.
        metric_name:
          type: string
          description: Name of the microbiome metric (e.g., "Shannon", "Simpson", "Bray-Curtis").
        variable_pair:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 2
          description: [diversity_metric, cognitive_metric] pair tested.
        correlation_coefficient:
          type: number
          description: The calculated correlation coefficient (r) or regression coefficient.
        p_value:
          type: number
          minimum: 0
          maximum: 1
          description: Raw p-value from the statistical test.
        adjusted_p_value:
          type: number
          minimum: 0
          maximum: 1
          description: P-value after Benjamini-Hochberg FDR correction.
        confidence_interval:
          type: object
          required:
            - lower
            - upper
            - level
          properties:
            lower:
              type: number
            upper:
              type: number
            level:
              type: number
              description: Confidence level (e.g., 0.95).
        n_samples:
          type: integer
          minimum: 1
          description: Number of samples used in this specific test.
        method_details:
          type: object
          description: Optional details about the method (e.g., normality check results).
          properties:
            normality_test:
              type: string
              enum:
                - shapiro_wilk
                - none
                - skewness_heuristic
              description: Method used to assess normality.
            skewness:
              type: number
              description: Calculated skewness if applicable.
            shapiro_p:
              type: number
              description: Shapiro-Wilk p-value if applicable.
        covariates:
          type: array
          items:
            type: string
          description: List of covariates included in the model (if regression).
          default: []

  power_analysis:
    type: object
    description: Optional power analysis results derived from the main results.
    required:
      - effect_size
      - observed_power
      - required_sample_size_80
    properties:
      effect_size:
        type: number
        description: Observed effect size (e.g., Cohen's d or correlation r).
      observed_power:
        type: number
        minimum: 0
        maximum: 1
        description: Statistical power achieved with current sample size.
      required_sample_size_80:
        type: integer
        description: Estimated sample size needed for 80% power at alpha=0.05.
      alpha_level:
        type: number
        default: 0.05
        description: Significance level used for power calculation.

  sensitivity_analysis:
    type: object
    description: Optional sensitivity analysis (E-values) for confounding.
    properties:
      e_value:
        type: number
        description: E-value for the observed association.
      e_value_ci:
        type: number
        description: E-value for the lower limit of the confidence interval.
      interpretation:
        type: string
        description: Textual interpretation of the sensitivity analysis.