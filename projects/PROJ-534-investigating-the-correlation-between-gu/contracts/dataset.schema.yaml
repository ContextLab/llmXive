entities:
  - name: participant
    fields:
      - name: participant_id
        type: str
        required: true
        description: Primary key
      - name: age
        type: int
        required: true
        min: 0
      - name: sex
        type: enum
        required: true
        values:
          - "M"
          - "F"
      - name: bmi
        type: float
        required: false
      - name: cognitive_flexibility_score
        type: float
        required: true
      - name: shannon_diversity
        type: float
        required: true
      - name: simpson_diversity
        type: float
        required: true
      - name: chao1
        type: float
        required: true
      - name: dietary_fiber
        type: float
        required: false
      - name: antibiotic_use
        type: bool
        required: false
