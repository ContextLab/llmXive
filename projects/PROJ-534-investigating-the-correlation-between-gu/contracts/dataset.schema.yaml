participant:
  type: object
  required:
    - participant_id
    - age
    - sex
    - bmi
  properties:
    participant_id:
      type: string
      description: Unique identifier for the participant
    age:
      type: integer
      minimum: 0
      description: Age in years
    sex:
      type: string
      enum: ["M", "F"]
      description: Biological sex
    bmi:
      type: number
      minimum: 0
      description: Body Mass Index

lifestyle:
  type: object
  required:
    - fiber_intake
    - antibiotics_use
  properties:
    fiber_intake:
      type: number
      minimum: 0
      description: Daily fiber intake in grams
    antibiotics_use:
      type: boolean
      description: Whether participant used antibiotics in the last 6 months

microbiome:
  type: object
  required:
    - shannon_diversity
    - simpson_diversity
    - chao1
  properties:
    shannon_diversity:
      type: number
      description: Shannon diversity index
    simpson_diversity:
      type: number
      description: Simpson diversity index
    chao1:
      type: number
      description: Chao1 richness estimator

cognitive:
  type: object
  required:
    - cognitive_score
  properties:
    cognitive_score:
      type: number
      description: Cognitive flexibility score

filtered_cohort:
  type: object
  allOf:
    - $ref: '#/participant'
    - $ref: '#/lifestyle'
    - $ref: '#/microbiome'
    - $ref: '#/cognitive'
  required:
    - participant_id
    - age
    - sex
    - bmi
    - fiber_intake
    - antibiotics_use
    - shannon_diversity
    - simpson_diversity
    - chao1
    - cognitive_score
  properties:
    participant_id:
      type: string
    age:
      type: integer
      minimum: 65
    sex:
      type: string
      enum: ["M", "F"]
    bmi:
      type: number
      minimum: 0
    fiber_intake:
      type: number
      minimum: 0
    antibiotics_use:
      type: boolean
    shannon_diversity:
      type: number
    simpson_diversity:
      type: number
    chao1:
      type: number
    cognitive_score:
      type: number
