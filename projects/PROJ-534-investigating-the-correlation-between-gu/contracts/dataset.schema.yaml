# Dataset Schema for Gut Microbiome and Cognitive Flexibility Study
# Defines the structure for Participant and MicrobiomeProfile entities
# Used for data validation and contract testing

$schema: http://json-schema.org/draft-07/schema#
title: GutMicrobiomeCognitiveDataset
description: Schema for the merged cohort dataset containing participant demographics,
  microbiome profiles, and cognitive scores.

entities:
  Participant:
    description: Demographic and clinical characteristics of study participants.
    type: object
    required:
      - participant_id
      - age
      - sex
      - bmi
    properties:
      participant_id:
        type: string
        description: Unique identifier for the participant.
        pattern: "^P[0-9]{4}$"
      age:
        type: integer
        description: Age of the participant in years.
        minimum: 0
        maximum: 120
      sex:
        type: string
        description: Biological sex of the participant.
        enum:
          - "M"
          - "F"
      bmi:
        type: number
        description: Body Mass Index.
        minimum: 10.0
        maximum: 80.0
      fiber_intake:
        type: number
        description: Daily fiber intake in grams.
        minimum: 0.0
      antibiotic_use:
        type: boolean
        description: Whether the participant has used antibiotics in the last 6 months.
      cognitive_score:
        type: number
        description: Composite score for cognitive flexibility (e.g., from N-back or task-switching).
        minimum: 0.0
        maximum: 100.0

  MicrobiomeProfile:
    description: Microbiome composition and diversity metrics for a participant.
    type: object
    required:
      - participant_id
      - shannon_index
      - simpson_index
      - chao1_index
    properties:
      participant_id:
        type: string
        description: Unique identifier matching the Participant entity.
        pattern: "^P[0-9]{4}$"
      shannon_index:
        type: number
        description: Shannon diversity index (alpha diversity).
        minimum: 0.0
      simpson_index:
        type: number
        description: Simpson diversity index (alpha diversity).
        minimum: 0.0
        maximum: 1.0
      chao1_index:
        type: number
        description: Chao1 estimator of species richness (alpha diversity).
        minimum: 0.0
      bray_curtis:
        type: number
        description: Bray-Curtis dissimilarity (beta diversity) relative to reference.
        minimum: 0.0
        maximum: 1.0
      unweighted_unifrac:
        type: number
        description: Unweighted UniFrac distance (beta diversity).
        minimum: 0.0
        maximum: 1.0
      weighted_unifrac:
        type: number
        description: Weighted UniFrac distance (beta diversity).
        minimum: 0.0
        maximum: 1.0

validation_rules:
  - rule: age_cohort_filter
    description: Participants must be age >= 65 for the primary analysis cohort.
    condition: "Participant.age >= 65"
  - rule: required_covariates
    description: Required covariates for regression must be non-null.
    fields:
      - Participant.age
      - Participant.sex
      - Participant.bmi
      - Participant.fiber_intake
      - Participant.antibiotic_use
  - rule: metric_validity
    description: Diversity metrics must be non-negative.
    condition: "MicrobiomeProfile.shannon_index >= 0 AND MicrobiomeProfile.simpson_index >= 0 AND MicrobiomeProfile.chao1_index >= 0"

file_format:
  type: csv
  delimiter: ","
  encoding: "utf-8"
  columns:
    - participant_id
    - age
    - sex
    - bmi
    - fiber_intake
    - antibiotic_use
    - cognitive_score
    - shannon_index
    - simpson_index
    - chao1_index
    - bray_curtis
    - unweighted_unifrac
    - weighted_unifrac