# Dataset Schema for Gut Microbiome and Cognitive Flexibility Study
# Strictly adheres to spec.md FR-002 covariates.
# Excludes SES and dietary_pattern fields as per constraints.
version: "1.0.0"
description: >
  Defines the schema for the merged synthetic cohort dataset.
  Includes participant demographics, lifestyle factors, microbiome diversity metrics,
  and cognitive assessment scores.

entity: Dataset
fields:
  - name: participant_id
    type: str
    description: Unique identifier for each participant.
    constraints:
      - primary_key: true
      - not_null: true
      - unique: true

  - name: age
    type: int
    description: Age of the participant in years.
    constraints:
      - not_null: true
      - minimum: 0

  - name: sex
    type: enum
    description: Biological sex of the participant.
    allowed_values:
      - "Male"
      - "Female"
      - "Other"
    constraints:
      - not_null: true

  - name: bmi
    type: float
    description: Body Mass Index (kg/m^2).
    constraints:
      - not_null: false
      - minimum: 0.0

  - name: cognitive_flexibility_score
    type: float
    description: Score from the cognitive flexibility assessment task.
    constraints:
      - not_null: false

  - name: shannon_diversity
    type: float
    description: Shannon diversity index (alpha diversity).
    constraints:
      - not_null: false
      - minimum: 0.0

  - name: simpson_diversity
    type: float
    description: Simpson diversity index (alpha diversity).
    constraints:
      - not_null: false
      - minimum: 0.0

  - name: chao1
    type: float
    description: Chao1 richness estimator (alpha diversity).
    constraints:
      - not_null: false
      - minimum: 0.0

  - name: dietary_fiber
    type: float
    description: Average daily dietary fiber intake (grams).
    constraints:
      - not_null: false
      - minimum: 0.0

  - name: antibiotic_use
    type: bool
    description: Boolean flag indicating recent antibiotic use (within 6 months).
    constraints:
      - not_null: false

notes:
  - "SES (Socioeconomic Status) and dietary_pattern are explicitly excluded per FR-002 scope control."
  - "All float fields allow nulls to support listwise deletion during filtering (T013)."
  - "Sex is an enum to prevent invalid string entries."