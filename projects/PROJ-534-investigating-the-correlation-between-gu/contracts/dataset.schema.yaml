dataset:
  name: filtered_cohort
  description: Cohort filtered for age >= 65 with complete data for analysis.
  properties:
    participant_id:
      type: string
      description: Unique identifier for the participant.
    age:
      type: integer
      minimum: 0
      description: Age of the participant in years.
    sex:
      type: string
      enum:
        - "M"
        - "F"
      description: Biological sex of the participant.
    bmi:
      type: number
      description: Body Mass Index.
    cognitive_flexibility_score:
      type: number
      description: Score from cognitive flexibility assessment.
    shannon_diversity:
      type: number
      description: Shannon diversity index of gut microbiome.
    simpson_diversity:
      type: number
      description: Simpson diversity index of gut microbiome.
    chao1:
      type: number
      description: Chao1 richness estimator.
    dietary_fiber_intake:
      type: number
      description: Daily dietary fiber intake in grams.
    antibiotic_use_history:
      type: boolean
      description: Whether the participant has a history of antibiotic use.
  required:
    - participant_id
    - age
    - sex
    - bmi
    - cognitive_flexibility_score
    - shannon_diversity
    - simpson_diversity
    - chao1
    - dietary_fiber_intake
    - antibiotic_use_history
