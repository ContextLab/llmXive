$schema: "http://json-schema.org/draft-07/schema#"
title: "Gut Microbiome and Cognitive Flexibility Dataset"
description: "Schema for the synthetic dataset validating the pipeline. Strictly adheres to spec.md FR-002 covariates."
type: object
properties:
  participant_id:
    type: string
    description: "Unique identifier for the participant (Primary Key)"
  age:
    type: integer
    minimum: 0
    description: "Age of the participant in years"
  sex:
    type: string
    enum:
      - "Male"
      - "Female"
      - "Other"
    description: "Biological sex of the participant"
  bmi:
    type: number
    description: "Body Mass Index (kg/m^2)"
  cognitive_flexibility_score:
    type: number
    description: "Score from cognitive flexibility assessment"
  shannon_diversity:
    type: number
    description: "Shannon diversity index of gut microbiome"
  simpson_diversity:
    type: number
    description: "Simpson diversity index of gut microbiome"
  chao1:
    type: number
    description: "Chao1 richness estimator of gut microbiome"
  dietary_fiber:
    type: number
    description: "Daily dietary fiber intake (grams)"
  antibiotic_use:
    type: boolean
    description: "Whether the participant has used antibiotics in the last 6 months"
required:
  - participant_id
  - age
  - sex
  - bmi
  - cognitive_flexibility_score
  - shannon_diversity
  - simpson_diversity
  - chao1
  - dietary_fiber
  - antibiotic_use
additionalProperties: false