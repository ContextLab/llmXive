[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gut-microbiome-cognitive-flexibility"
version = "0.1.0"
description = "Investigating the correlation between gut microbiome composition and cognitive flexibility in aging"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.1.4",
    "numpy==1.26.3",
    "scikit-learn==1.3.2",
    "scipy==1.11.4",
    "statsmodels==0.14.1",
    "biom-format==2.1.16",
    "matplotlib==3.8.2",
    "seaborn==0.13.1",
    "pyyaml==6.0.1",
    "pytest==7.4.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.1.9",
    "black==23.12.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
