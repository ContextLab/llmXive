# Dataset Schema for Gut Microbiome and Cognitive Flexibility Study
# Defines the expected structure and types for the synthetic and real datasets.
# Strictly adheres to spec.md FR-002 covariates.
name: gut_microbiome_cognitive_flexibility
version: "1.0.0"
description: "Schema for the synthetic dataset used in the pipeline validation study."
entities:
  - name: participant
    fields:
      - name: participant_id
        type: str
        description: "Unique identifier for the participant."
        constraints:
          - not_null
      - name: age
        type: int
        description: "Age of the participant in years."
        constraints:
          - not_null
          - min: 0
      - name: sex
        type: enum
        description: "Biological sex of the participant."
        values:
          - "Male"
          - "Female"
        constraints:
          - not_null
      - name: bmi
        type: float
        description: "Body Mass Index."
        constraints:
          - not_null
          - min: 0.0
      - name: cognitive_flexibility_score
        type: float
        description: "Score from cognitive flexibility assessment."
        constraints:
          - not_null
      - name: shannon_diversity
        type: float
        description: "Shannon diversity index of gut microbiome."
        constraints:
          - not_null
          - min: 0.0
      - name: simpson_diversity
        type: float
        description: "Simpson diversity index of gut microbiome."
        constraints:
          - not_null
          - min: 0.0
      - name: chao1
        type: float
        description: "Chao1 richness estimator."
        constraints:
          - not_null
          - min: 0.0
      - name: dietary_fiber
        type: float
        description: "Daily dietary fiber intake in grams."
        constraints:
          - not_null
          - min: 0.0
      - name: antibiotic_use
        type: bool
        description: "Whether the participant used antibiotics in the last 6 months."
        constraints:
          - not_null
