entity: Dataset
fields:
  participant_id:
    type: str
    description: Unique participant identifier (Primary Key)
    required: true
  age:
    type: int
    description: Age of participant
    constraints:
      min: 0
    required: true
  sex:
    type: str
    description: Sex of participant
    enum:
      - "Male"
      - "Female"
    required: true
  bmi:
    type: float
    description: Body Mass Index
    required: true
  cognitive_flexibility_score:
    type: float
    description: Score from cognitive flexibility assessment
    required: true
  shannon_diversity:
    type: float
    description: Shannon diversity index
    required: true
  simpson_diversity:
    type: float
    description: Simpson diversity index
    required: true
  chao1:
    type: float
    description: Chao1 richness estimator
    required: true
  dietary_fiber:
    type: float
    description: Daily dietary fiber intake
    required: true
  antibiotic_use:
    type: bool
    description: Recent antibiotic use flag
    required: true
