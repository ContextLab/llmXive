# Ruff configuration file
# This file is kept for explicit configuration if pyproject.toml is not detected
# by the editor or CI, ensuring consistent behavior.

line-length = 88
target-version = "py311"

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]

[format]
line-length = 88
target-version = "py311"