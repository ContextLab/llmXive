$schema: "http://json-schema.org/draft-07/schema#"
title: "DataManifest"
description: "Schema for the data source manifest."
type: "object"
properties:
  version:
    type: "string"
    description: "Manifest version."
    const: "1.0.0"
  generated_at:
    type: "string"
    description: "ISO 8601 timestamp of generation."
    format: "date-time"
  sources:
    type: "array"
    description: "List of data sources."
    items:
      type: "object"
      properties:
        source_type:
          type: "string"
          description: "Type of source (e.g., 'CALPHAD', 'Generated', 'Script')."
          enum:
            - "CALPHAD"
            - "Generated"
            - "Script"
        source_id:
          type: "string"
          description: "Unique identifier for the source."
        doi:
          type: "string"
          description: "DOI of the source (optional for generated data)."
          pattern: "^10\\.\\d{4,}/.*$"
        url:
          type: "string"
          description: "URL to the source (or script path)."
          format: "uri"
        status:
          type: "string"
          description: "Status of the data fetch."
          enum:
            - "generated"
            - "fetched"
            - "missing"
            - "local"
        checksum:
          type: "string"
          description: "SHA256 checksum of the file."
        injected_parameters:
          type: "object"
          description: "Injected interaction coefficients (for generated data)."
          additionalProperties:
            type: "number"
      required:
        - source_type
        - source_id
        - status
      additionalProperties: false
required:
  - version
  - generated_at
  - sources
additionalProperties: false