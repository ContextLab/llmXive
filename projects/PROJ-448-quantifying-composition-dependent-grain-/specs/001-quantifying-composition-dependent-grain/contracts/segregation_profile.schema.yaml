$schema: "http://json-schema.org/draft-07/schema#"
title: "SegregationProfile"
description: "Schema for a single grain boundary segregation profile record."
type: "object"
properties:
  solute_element:
    type: "string"
    description: "The segregating element (e.g., 'Cr', 'Mo')."
    pattern: "^(Cr|Mo|V|W)$"
  base_element:
    type: "string"
    description: "The matrix element."
    const: "Fe"
  temperature_K:
    type: "number"
    description: "Temperature in Kelvin."
    minimum: 500.0
    maximum: 900.0
  bulk_concentration:
    type: "number"
    description: "Bulk atomic fraction of solute."
    minimum: 0.0
    maximum: 1.0
  segregation_energy_eV:
    type: "number"
    description: "DFT-derived segregation energy."
  equilibrium_concentration:
    type: "number"
    description: "Calculated GB concentration."
    minimum: 0.0
    maximum: 1.0
  system_id:
    type: "string"
    description: "Alloy system identifier (Binary or Ternary)."
    pattern: "^Fe-[A-Z]{2}(-[A-Z]{2})?$"
  gb_structure:
    type: "string"
    description: "Grain boundary structure ID."
  source_doi:
    type: "string"
    description: "DOI of the DFT source."
    pattern: "^10\\.\\d{4,}/.*$"
required:
  - solute_element
  - base_element
  - temperature_K
  - bulk_concentration
  - segregation_energy_eV
  - equilibrium_concentration
  - system_id
  - gb_structure
  - source_doi
additionalProperties: false