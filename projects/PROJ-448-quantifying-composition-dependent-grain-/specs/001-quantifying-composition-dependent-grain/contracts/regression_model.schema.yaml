$schema: http://json-schema.org/draft-07/schema#
title: RegressionModel
description: Schema for the fitted empirical composition-segregation function.
type: object
properties:
  system_id:
    type: string
    description: "The alloy system identifier."
  coefficients:
    type: object
    description: "Map of feature names to coefficients."
    additionalProperties:
      type: number
  interaction_terms:
    type: array
    items:
      type: string
    description: "List of interaction term names."
  r_squared:
    type: number
    description: "R-squared metric."
  p_values:
    type: object
    description: "P-values for each coefficient."
    additionalProperties:
      type: number
  cross_validation_scores:
    type: array
    items:
      type: number
    description: "R-squared scores for each fold."
  held_out_mse_reduction:
    type: number
    description: "Percentage reduction in MSE vs. additive model."
  validation_type:
    type: string
    description: "Type of validation performed (e.g., binary_validation, sensitivity_analysis)."
  recovered_interaction_coefficient:
    type: number
    description: "The coefficient recovered by the model for the injected term."
  injected_interaction_coefficient:
    type: number
    description: "The ground-truth value injected during data generation."
required:
  - system_id
  - coefficients
  - interaction_terms
  - r_squared
  - p_values
  - cross_validation_scores
  - held_out_mse_reduction
  - validation_type
  - recovered_interaction_coefficient
  - injected_interaction_coefficient
additionalProperties: false