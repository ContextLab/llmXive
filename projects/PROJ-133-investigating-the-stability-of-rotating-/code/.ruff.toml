# Ruff configuration for PROJ-133
# Linting rules for the rotating BEC stability project

[lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "I", "W", "N", "B", "C4", "UP"]
ignore = []

# Allow autofix for all enabled rules
fixable = ["I"]

# Exclude specific directories
exclude = ["__pycache__", ".git", ".venv", "venv", "build", "dist"]

[lint.per-file-ignores]
# Allow longer lines in data generation scripts if necessary
"code/utils/setup_data_dirs.py" = ["E501"]

[lint.isort]
known-first-party = ["simulation", "analysis", "statistics", "viz", "utils", "config", "models"]
force-single-line = false
lines-after-imports = 2
order-by-type = true

[lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[lint.flake8-unused-arguments]
ignore-variadic-names = true

[lint.flake8-comprehensions]
allow-inline-init-lists = true

[lint.pydocstyle]
convention = "numpy"