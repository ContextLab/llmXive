'|error nominal significance threshold type':
  quote: "The boundary is conservative at early interim analyses\u2014requiring very\
    \ strong evidence to stop a trial early\u2014and becomes less stringent as the\
    \ study progresses. At the first interim looks the rule requires a very high test\
    \ statistic (or equivalently a very low p-value) to declare significance. This\
    \ protects against premature stopping on random fluctuations. As the trial progresses,\
    \ the required statistic becomes less extreme. By the final analysis the boundary\
    \ is essentially the nominal significance level (e.g., 0.05)."
  source_id: "O'Brien\u2013Fleming boundary"
  url: "https://en.wikipedia.org/wiki/O'Brien\u2013Fleming_boundary"
  value: '0.05'
