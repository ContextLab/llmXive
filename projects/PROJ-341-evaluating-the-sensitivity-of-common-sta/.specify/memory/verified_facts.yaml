'|constraint less runtime second than':
  quote: Post-production of the film began simultaneously with the wrapping-up of
    filming in December 2025. The film's visual effects (VFX) were handled by Assemblage
    Entertainment, while Urvashi Saxena served as the editor. The Marathi version
    received a U/A certificate from the Central Board of Film Certification (CBFC)
    on 24 April 2026, with a final runtime of 195.05 minutes, while the Hindi version
    was certified on 28 April 2026 with a runtime of 187.05 minutes.
  source_id: Raja Shivaji (film)
  url: https://en.wikipedia.org/wiki/Raja_Shivaji_(film)
