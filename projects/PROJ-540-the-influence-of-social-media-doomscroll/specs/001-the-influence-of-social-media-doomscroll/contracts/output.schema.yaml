$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Analysis Output"
type: "object"
properties:
  model_type:
    type: "string"
    const: "OLS"
  data_status:
    type: "string"
    enum:
      - "OK"
      - "HALTED_NO_VALID_DATASET"
    description: "OK when a verified dataset passed schema validation; HALTED_NO_VALID_DATASET when the pipeline halted at ingestion (statistical fields then omitted, never fabricated)."
  n_samples:
    type: "integer"
    minimum: 30
  r_squared:
    type: "number"
  adj_r_squared:
    type: "number"
  adj_r2_pass:
    type: "boolean"
    description: "True if adjusted R‑squared ≥ 0.10 (SC‑002); otherwise false."
  f_statistic:
    type: "number"
  f_pvalue:
    type: "number"
  coefficients:
    type: "object"
    description: "Map of variable names to coefficient values (real estimates only)."
    additionalProperties:
      type: "number"
  std_errors:
    type: "object"
    description: "Map of variable names to standard errors."
    additionalProperties:
      type: "number"
  p_values:
    type: "object"
    description: "Map of variable names to p-values."
    additionalProperties:
      type: "number"
  vif_scores:
    type: "object"
    description: "Map of variable names to VIF scores."
    additionalProperties:
      type: "number"
  assumption_checks:
    type: "object"
    properties:
      linearity:
        type: "string"
        enum:
          - "PASS"
          - "FAIL"
          - "WARNING"
      homoscedasticity:
        type: "string"
        enum:
          - "PASS"
          - "FAIL"
          - "WARNING"
      normality:
        type: "string"
        enum:
          - "PASS"
          - "FAIL"
          - "WARNING"
      shapiro_wilk_p_value:
        type: "number"
      linearity_p:
        type: "number"
      homoscedasticity_p:
        type: "number"
      normality_p:
        type: "number"
    required:
      - linearity
      - homoscedasticity
      - normality
      - shapiro_wilk_p_value
      - linearity_p
      - homoscedasticity_p
      - normality_p
  robustness_result:
    type: 
      - "object"
      - "null"
    properties:
      subset_n:
        type: "integer"
      coefficient:
        type: "number"
      p_value:
        type: "number"
      status:
        type: "string"
        enum:
          - "RUN"
          - "SKIPPED_LOW_N"
          - "SKIPPED_NO_DATA"
          - "SKIPPED_R_LOW"
      sign_match:
        type: "boolean"
        description: "True if subset coefficient sign matches full‑sample sign (SC‑003)."
      pvalue_match:
        type: "boolean"
        description: "True if subset p‑value < 0.05 matches full‑sample significance (SC‑003)."
      bootstrap:
        type: "array"
        description: "Bootstrap coefficient estimates (optional)."
        items:
          type: "number"
    required:
      - status
  flags:
    type: "array"
    items:
      type: "string"
    description: "Warnings such as Low Power, Proxy Used (unvalidated), Proxy Used (validated), High VIF, Robustness Skipped (r <= 0.3), RobustnessSignMismatch, Associational Only."
  runtime:
    type: "number"
    description: "Measured execution time in seconds (SC-005)."
  halt_report:
    type:
      - "object"
      - "null"
    description: "Present only when data_status is HALTED_NO_VALID_DATASET; records sources checked, checksums, real column inventories, and missing variables."
  proxy_validated:
    type: "boolean"
    description: "True if a proxy anxiety instrument used ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? 