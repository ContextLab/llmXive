$schema: "http://json-schema.org/draft-07/schema#"
title: "Regression Analysis Output"
type: "object"
properties:
  model_type:
    type: "string"
    const: "OLS"
  n_samples:
    type: "integer"
    minimum: 30
  r_squared:
    type: "number"
  adj_r_squared:
    type: "number"
  f_statistic:
    type: "number"
  f_pvalue:
    type: "number"
  coefficients:
    type: "object"
    description: "Map of variable names to coefficient values."
    additionalProperties:
      type: "number"
  std_errors:
    type: "object"
    description: "Map of variable names to standard errors."
    additionalProperties:
      type: "number"
  p_values:
    type: "object"
    description: "Map of variable names to p-values."
    additionalProperties:
      type: "number"
  vif_scores:
    type: "object"
    description: "Map of variable names to VIF scores."
    additionalProperties:
      type: "number"
  assumption_checks:
    type: "object"
    properties:
      linearity:
        type: "string"
        enum: ["PASS", "FAIL", "WARNING"]
      homoscedasticity:
        type: "string"
        enum: ["PASS", "FAIL", "WARNING"]
      normality:
        type: "string"
        enum: ["PASS", "FAIL", "WARNING"]
      shapiro_wilk_p_value:
        type: "number"
    required:
      - linearity
      - homoscedasticity
      - normality
  robustness_result:
    type: "object"
    nullable: true
    properties:
      subset_n:
        type: "integer"
      coefficient:
        type: "number"
      p_value:
        type: "number"
      status:
        type: "string"
        enum: ["RUN", "SKIPPED_LOW_N", "SKIPPED_NO_DATA"]
    required:
      - status
  flags:
    type: "array"
    items:
      type: "string"
    description: "List of warnings (e.g., 'Low Power', 'Proxy Used: General Anxiety', 'No Baseline Control')."
  runtime:
    type: "number"
    description: "Execution time in seconds (for SC-005)."
required:
  - model_type
  - n_samples
  - r_squared
  - coefficients
  - p_values
  - vif_scores
  - assumption_checks
  - flags
  - runtime
additionalProperties: false
