$schema: "http://json-schema.org/draft-07/schema#"
title: "Cleaned Survey Response Dataset"
type: "object"
properties:
  participant_id:
    type: "string"
    description: "Unique anonymized identifier for the participant."
  news_exposure_freq:
    type: "number"
    description: "Frequency of negative news consumption on social media."
    minimum: 0
  anxiety_score:
    type: "number"
    description: "Outcome anxiety score (validated scale or flagged proxy)."
    minimum: 0
  baseline_anxiety:
    type:
      - "number"
      - "null"
    description: "Baseline or trait anxiety score; dropped if coupled with outcome."
    minimum: 0
  age:
    type: "integer"
    description: "Participant age in years."
    minimum: 18
    maximum: 100
  gender:
    type: "string"
    description: "Gender category."
  social_media_engagement:
    type:
      - "number"
      - "null"
    description: "Overall social-media engagement; required only for robustness check."
    minimum: 0
  instrument_source:
    type: "string"
    description: "Name of the anxiety instrument (e.g., GAD-7 or documented proxy)."
  measurement_timepoint:
    type: "string"
    description: "Timepoint of measurement (pre, post, or trait)."
  proxy_flag:
    type: "boolean"
    description: "True if the anxiety score is a proxy for anticipatory anxiety (FR-008)."
  coupling_risk:
    type: "boolean"
    description: "True if baseline and outcome anxiety may be mathematically coupled."
  proxy_validated:
    type: "boolean"
    description: "True if the proxy anxiety instrument is on the validated whitelist."
required:
  - participant_id
  - news_exposure_freq
  - anxiety_score
  - age
  - gender
  - instrument_source
  - measurement_timepoint
  - proxy_flag
  - coupling_risk
  - proxy_validated
additionalProperties: false