[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmXive-doomscrolling"
version = "0.1.0"
description = "Research pipeline: The Influence of Social Media Doomscrolling on Anticipatory Anxiety"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.0.3",
    "statsmodels==0.14.0",
    "scikit-learn==1.3.0",
    "matplotlib==3.8.0",
    "seaborn==0.13.0",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "scipy",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | outputs
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = ["data", "outputs", ".git", ".tox", ".venv"]
known_first_party = ["config", "exceptions", "models", "ingest", "clean", "model", "validity", "robustness", "viz", "logging_config"]
known_third_party = ["pandas", "numpy", "scipy", "statsmodels", "matplotlib", "seaborn", "requests", "yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
