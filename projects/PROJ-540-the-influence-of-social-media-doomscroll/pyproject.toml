[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-doomscrolling"
version = "0.1.0"
description = "Analysis of Social Media Doomscrolling on Anticipatory Anxiety"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.0.3",
    "statsmodels==0.14.0",
    "scikit-learn==1.3.0",
    "matplotlib==3.8.0",
    "seaborn==0.13.0",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "numpy>=1.24.0",
    "scipy>=1.11.0"
]

[project.optional-dependencies]
dev = [
    "flake8==6.1.0",
    "black==23.12.1",
    "isort==5.13.2",
    "pytest==7.4.3"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["code"]
skip_glob = [
    "*/__pycache__/*",
    "*/build/*",
    "*/dist/*"
]
