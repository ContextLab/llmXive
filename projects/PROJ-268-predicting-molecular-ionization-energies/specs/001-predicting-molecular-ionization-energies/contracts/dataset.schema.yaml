$schema: "http://json-schema.org/draft-07/schema#"
title: "QM9 Dataset Schema"
description: "Schema for the preprocessed QM dataset (a variant of the QM series) used in training and evaluation. The target variable is -HOMO (negative HOMO energy), used as a proxy for Ionization Energy via Koopmans' theorem."
type: "object"
properties:
  molecule_id:
    type: "string"
    description: "Unique identifier for the molecule (e.g., SMILES hash)."
  smiles:
    type: "string"
    description: "Canonical SMILES string of the molecule."
  negative_homo_proxy:
    type: "number"
    description: "Negative HOMO energy in eV, used as a proxy for Ionization Energy via Koopmans' theorem (IE ≈ -HOMO)."
    minimum: -100
    maximum: 100
  graph:
    type: "object"
    description: "2D graph representation."
    properties:
      num_nodes:
        type: "integer"
        minimum: 1
      num_edges:
        type: "integer"
        minimum: 0
      node_features:
        type: "array"
        items:
          type: "object"
          properties:
            atom_type:
              type: "integer"
            formal_charge:
              type: "integer"
            is_aromatic:
              type: "true"
            is_aromatic:
              "..." ... 