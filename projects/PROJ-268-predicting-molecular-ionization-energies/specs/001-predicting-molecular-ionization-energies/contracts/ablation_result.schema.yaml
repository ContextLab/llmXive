$schema: "http://json-schema.org/draft-07/schema#"
title: "Ablation Result Schema"
description: "Schema for ablation study results. The study involves retraining the model with zeroed features for multiple independent stochastic runs (paired with an equal number of baseline runs)."
type: "object"
properties:
  ablation_config:
    type: "object"
    properties:
      feature:
        type: "string"
        description: "Perturbed feature (e.g., 'bond_type')."
      perturbation_type:
        type: "string"
        description: "Type of perturbation (e.g., 'zeroing')."
      sigma:
        type: "number"
        description: "Standard deviation of noise (if applicable)."
    required:
      - feature
      - perturbation_type
  results:
    type: "object"
    properties:
      baseline_mae:
        type: "number"
        description: "Mean MAE of the 10 baseline models."
      perturbed_mae_mean:
        type: "number"
        description: "Mean MAE of the perturbed models (across 10 runs)."
      perturbed_mae_std:
        type: "number"
        description: "Standard deviation of MAE across the perturbed runs."
      mae_increase:
        type: "number"
        description: "Absolute increase in MAE (perturbed – baseline)."
      p_value:
        type: "number"
        description: "P‑value from paired t‑test on per‑molecule error differences across 10 pairs."
      is_significant:
        type: "boolean"
        description: "True if p‑value < 0.05 after Bonferroni correction."
      num_runs:
        type: "integer"
        description: "Number of stochastic runs performed (must be 4‑?? ?? ?"
      test_type:
        type: "string"
        description: "Statistical test used"
    required:
      - baseline_mae
      - perturbed_mae_mean
      - perturbed_mae_std
      - mae_increase
      - p_value
      - is_significant
      - num_runs
      - test_type
required:
  - ablation_config
  - results