$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Model Results Schema"
description: "Combined schema for model performance, interaction terms, and bootstrap results."
type: object
properties:
  model_performance:
    type: object
    required: [model_type, outer_fold, rmse_log10, r2_log10, hyperparameters]
    properties:
      model_type:
        type: string
        enum: [xgboost, random_forest, linear]
      outer_fold:
        type: integer
        minimum: 1
        maximum: 5
      rmse_log10:
        type: number
      r2_log10:
        type: number
      hyperparameters:
        type: object
        additionalProperties: { type: number }
  
  interaction_term:
    type: object
    required: [descriptor_a, descriptor_b, mean_abs_shap_interaction, ci_lower, ci_upper, delta_r2_ablation]
    properties:
      descriptor_a: { type: string }
      descriptor_b: { type: string }
      mean_abs_shap_interaction: { type: number }
      ci_lower: { type: number }
      ci_upper: { type: number }
      delta_r2_ablation: { type: number }

  bootstrap_result:
    type: object
    required: [iteration, feature_importances, outer_r2]
    properties:
      iteration: { type: integer }
      feature_importances:
        type: object
        additionalProperties: { type: number }
      outer_r2: { type: number }