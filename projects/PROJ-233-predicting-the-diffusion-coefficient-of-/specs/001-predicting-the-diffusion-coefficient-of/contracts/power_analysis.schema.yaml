$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Power Analysis Schema"
description: "Post‑hoc power analysis record for interaction effect detection (FR‑009)."
type: object
required:
  - effect_size_f2
  - alpha
  - n_samples
  - ci_width_top_feature
properties:
  effect_size_f2:
    type: number
    description: "Cohen's f^2 computed from the non‑linear vs linear R^2 gain."
  min_detectable_f2:
    type: number
    description: "Minimum detectable effect size f^2 at [deferred] power given the observed sample size (derived from the a‑priori simulation)."
  alpha:
    type: number
    description: "Significance level (0.05 per FR‑009)."
  n_samples:
    type: integer
    minimum: 1
    description: "Real sample size used in the analysis."
  ci_width_top_feature:
    type: number
    description: "Bootstrap 95 % CI width for the importance score of the top‑ranked descriptor (FR‑009 target: <= 0.1)."