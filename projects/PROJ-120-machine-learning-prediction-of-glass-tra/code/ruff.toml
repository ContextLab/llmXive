[tool.ruff]
# Target Python version
target-version = "py310"
# Line length for formatting
line-length = 88
# Exclude generated files or heavy dependencies
exclude = [
    ".venv",
    "__pycache__",
    "data",
    "artifacts",
    "state",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "I", "UP", "N", "C90"]
# Ignore specific rules if needed (e.g., line too long if black handles it)
ignore = [
    "E501", # Line too long (handled by black)
    "F403", # 'from module import *' used; unable to detect undefined names (common in data scripts)
]

[tool.ruff.lint.per-file-ignores]
# Allow imports in __init__.py
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["code"]
force-sort-within-sections = true
