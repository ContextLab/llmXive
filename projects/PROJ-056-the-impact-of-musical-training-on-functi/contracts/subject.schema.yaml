# Schema for subject data
# Used by utils/schema_validator.py and data/models.py for validation
type: object
required:
  - subject_id
  - group
  - years_of_training
  - age
  - sex
  - motion_score
  - ses_score
properties:
  subject_id:
    type: string
    pattern: "^SUBJ-[0-9]+$"
    description: "Unique subject identifier"
  group:
    type: string
    enum:
      - musician
      - non_musician
    description: "Group assignment based on training"
  years_of_training:
    type: number
    minimum: 0
    description: "Total years of musical training"
  age:
    type: number
    minimum: 10
    maximum: 25
    description: "Age of the subject in years"
  sex:
    type: string
    enum:
      - M
      - F
    description: "Biological sex"
  motion_score:
    type: number
    minimum: 0
    description: "Head motion score (e.g., FD)"
  ses_score:
    type: number
    minimum: 0
    description: "Socioeconomic status score"
additionalProperties: false
