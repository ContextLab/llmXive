$schema: "http://json-schema.org/draft-07/schema#"
title: Subject behavioural schema
description: >
  Schema for the synthetic (and eventually real) subject table used in the
  musical‑training pipeline.
type: object
properties:
  subject_id:
    type: string
    description: Unique identifier for the subject.
  group:
    type: string
    enum: ["musician", "non_musician"]
    description: Whether the subject has musical training (>=1 yr) or not.
  years_of_training:
    type: number
    minimum: 0
    description: Years of formal musical training (0 for non‑musicians).
  age:
    type: number
    minimum: 10
    maximum: 18
    description: Age of the participant in years.
  sex:
    type: integer
    enum: [0, 1]
    description: 0 = female, 1 = male.
  motion_score:
    type: number
    minimum: 0
    maximum: 1
    description: Head‑motion summary metric (0 = no motion, 1 = max).
  ses_score:
    type: number
    minimum: 1
    maximum: 10
    description: Socio‑economic status score.
required:
  - subject_id
  - group
  - years_of_training
  - age
  - sex
  - motion_score
  - ses_score
additionalProperties: false