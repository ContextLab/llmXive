$schema: "http://json-schema.org/draft-07/schema#"
title: Subject
description: Schema for synthetic subject behavioural data.
type: object
properties:
  subject_id:
    type: string
    description: Unique identifier for the subject.
  group:
    type: string
    enum: ["musician", "non_musician"]
    description: Group label – musician (≥1 year training) or non‑musician.
  years_of_training:
    type: number
    minimum: 0
    description: Years of musical training (0 for non‑musicians, ≥1 for musicians).
  age:
    type: number
    minimum: 10
    maximum: 18
    description: Age in years (adolescent range).
  sex:
    type: integer
    enum: [0, 1]
    description: 0 = female, 1 = male.
  motion_score:
    type: number
    minimum: 0
    maximum: 1
    description: Head‑motion metric (0–1).
  ses_score:
    type: number
    minimum: 1
    maximum: 10
    description: Socio‑economic status score (1–10).
required:
  - subject_id
  - group
  - years_of_training
  - age
  - sex
  - motion_score
  - ses_score
additionalProperties: false
