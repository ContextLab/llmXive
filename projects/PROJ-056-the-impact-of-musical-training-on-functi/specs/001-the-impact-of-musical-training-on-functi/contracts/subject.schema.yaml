type: object
required:
  - subject_id
  - group
  - years_of_training
  - age
  - sex
  - motion_score
  - ses_score
properties:
  subject_id:
    type: string
  group:
    type: string
    enum: [musician, non_musician]
  years_of_training:
    type: number
  age:
    type: number
  sex:
    type: string
    enum: [M, F]
  motion_score:
    type: number
  ses_score:
    type: number
