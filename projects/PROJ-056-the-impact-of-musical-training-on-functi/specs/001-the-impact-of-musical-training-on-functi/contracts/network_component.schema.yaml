$schema: "http://json-schema.org/draft-07/schema#"
title: "Network Component (NBS) Schema"
type: "object"
properties:
  component_id:
    type: "integer"
    description: "Sequential identifier for the component"
  size:
    type: "integer"
    description: "Number of edges in the component"
  p_value_fwer:
    type: "number"
    minimum: 0.0
    maximum: 1.0
    description: "Family-wise error corrected p-value"
  edges:
    type: "array"
    items:
      type: "string"
    description: "List of connection_id strings belonging to this component"
required:
  - component_id
  - size
  - p_value_fwer
  - edges
additionalProperties: false
