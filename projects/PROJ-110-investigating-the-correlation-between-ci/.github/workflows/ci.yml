name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify CPU‑only execution
        run: |
          python - <<'PY'
          import sys
          try:
              import torch
          except ImportError as e:
              print("torch not installed:", e)
              sys.exit(1)

          if torch.cuda.is_available():
              print("GPU devices are available, which is not allowed.")
              sys.exit(1)
          else:
              print("No GPU devices detected. CPU‑only execution confirmed.")
          PY
