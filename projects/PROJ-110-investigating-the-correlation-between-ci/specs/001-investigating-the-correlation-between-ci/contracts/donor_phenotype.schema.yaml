$schema: "http://json-schema.org/draft-07/schema#"
title: "GTEx Donor Phenotype with MetS Classification"
type: object
required:
  - donor_id
  - mets_label
  - criteria_count
  - excluded
properties:
  donor_id:
    type: string
    description: "Unique GTEx donor identifier"
  mets_label:
    type: string
    enum: ["MetS", "Control"]
    description: "Binary Metabolic Syndrome status per ATP‑III"
  criteria_count:
    type: integer
    minimum: (to be determined)
    maximum: a modest upper bound
    description: "Number of ATP‑III criteria met (0‑5)"
  excluded:
    type: boolean
    description: "True if donor dropped due to missing/invalid clinical data"
  exclusion_reason:
    type: string
    description: "Human‑readable reason for exclusion (empty if not excluded)"
  age:
    type: integer
    minimum: non‑negative
    description: "Age at death (years)"
  sex:
    type: string
    enum: ["M", "F"]
    description: "Sex of donor"
  tissue:
    type: string
    description: "Tissue source name"
  pmi:
    type: number
    minimum: a non‑negative lower bound
    description: "Post‑mortem interval (hours)"
  time_of_death:
    type: number
    minimum: non‑negative
    maximum: to be determined in the implementation phase.
    description: "Clock time of death (hours)"
  bmi:
    type: number
    description: "Body Mass Index (kg/m²)"
  fasting_glucose:
    type: number
    description: "Fasting glucose (mg/dL)"
  systolic_bp:
    type: number
    description: "Systolic blood pressure (mm Hg)"
  diastolic_bp:
    type: number
    description: "Diastolic blood pressure (mm Hg)"
  triglycerides:
    type: number
    description: "Triglycerides (mg/dL)"
  hdl:
    type: number
    description: "High‑density lipoprotein (mg/dL)"