$schema: "http://json-schema.org/draft-07/schema#"
title: "GTEx Metabolic Phenotype Dataset Schema"
description: "Schema for the cleaned GTEx phenotype data used for ATP-III classification."
type: object
properties:
  sample_id:
    type: string
    description: "Unique GTEx sample identifier"
  tissue:
    type: string
    description: "Tissue source (e.g., 'Adipose', 'Liver')"
  age:
    type: number
    description: "Donor age in years"
  sex:
    type: string
    enum: ["Male", "Female"]
    description: "Biological sex of the donor"
  bmi:
    type: number
    description: "Body Mass Index (kg/m^2)"
  glucose:
    type: number
    description: "Fasting glucose (mg/dL)"
  systolic_bp:
    type: number
    description: "Systolic blood pressure (mmHg)"
  diastolic_bp:
    type: number
    description: "Diastolic blood pressure (mmHg)"
  triglycerides:
    type: number
    description: "Triglycerides (mg/dL)"
  hdl:
    type: number
    description: "High-Density Lipoprotein (mg/dL)"
  time_of_death:
    type: ["string", "null"]
    description: "Time of death (e.g., 'Morning', 'Afternoon', or ISO timestamp)"
  time_radians:
    type: ["number", "null"]
    description: "Continuous circular representation of time (0 to 2pi)"
required:
  - sample_id
  - tissue
  - age
  - sex
  - bmi
  - glucose
  - systolic_bp
  - diastolic_bp
  - triglycerides
  - hdl
additionalProperties: false