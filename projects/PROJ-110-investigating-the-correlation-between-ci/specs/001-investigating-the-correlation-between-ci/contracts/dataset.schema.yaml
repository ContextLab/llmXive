$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema"
type: object
properties:
  donor_id:
    type: string
    description: "Unique identifier for each donor."
  tissue:
    type: string
    description: "GTEx or METSIM tissue name (e.g., 'Muscle_Skeletal')."
  age:
    type: integer
    minimum: 0
    description: "Age of donor in years."
  sex:
    type: string
    enum: ["M", "F"]
    description: "Sex of donor."
  PMI:
    type: number
    minimum: 0
    description: "Post‑mortem interval in hours; may be null if unavailable."
  time_of_death:
    type: number
    minimum: 0
    description: "Time of death (24‑hour clock); may be null."
  BMI:
    type: number
    description: "Body Mass Index (kg/m²)."
  fasting_glucose:
    type: number
    description: "Fasting glucose (mg/dL)."
  systolic_bp:
    type: number
    description: "Systolic blood pressure (mm Hg)."
  diastolic_bp:
    type: number
    description: "Diastolic blood pressure (mm Hg)."
  triglycerides:
    type: number
    description: "Triglycerides (mg/dL)."
  HDL:
    type: number
    description: "High‑density lipoprotein (mg/dL)."
  gene_symbol:
    type: string
    description: "HGNC gene symbol (core circadian list only)."
  tpm:
    type: number
    minimum: 0
    description: "Transcripts per million (TPM) value."
required:
  - donor_id
  - tissue
  - gene_symbol
  - tpm
additionalProperties: false