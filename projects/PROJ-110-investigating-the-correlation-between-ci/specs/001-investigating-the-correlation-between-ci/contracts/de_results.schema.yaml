$schema: "http://json-schema.org/draft-07/schema#"
title: "Differential Expression Results Schema"
type: object
properties:
  gene_symbol:
    type: string
    description: "Core circadian gene."
  tissue:
    type: string
    description: "GTEx or METSIM tissue name."
  beta:
    type: number
    description: "ANCOVA coefficient for MetS effect."
  ci_lower:
    type: number
    description: "Lower bound of 95 % confidence interval."
  ci_upper:
    type: number
    description: "Upper bound of 95 % confidence interval."
  p_raw:
    type: number
    minimum: 0
    maximum: 1
    description: "Unadjusted p‑value."
  p_adj:
    type: number
    minimum: 0
    maximum: 1
    description: "Benjamini‑Hochberg adjusted p‑value."
required:
  - gene_symbol
  - tissue
  - beta
  - ci_lower
  - ci_upper
  - p_raw
  - p_adj
additionalProperties: false