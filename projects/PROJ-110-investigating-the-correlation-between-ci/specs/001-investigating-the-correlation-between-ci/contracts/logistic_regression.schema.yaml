$schema: "http://json-schema.org/draft-07/schema#"
title: "Logistic Regression Coefficients Schema"
type: object
properties:
  model_id:
    type: string
    description: "UUID for the fitted model."
  predictor:
    type: string
    description: "Gene symbol or covariate name."
  coefficient:
    type: number
    description: "Log‑odds coefficient."
  std_error:
    type: number
    description: "Standard error of the coefficient."
  p_value:
    type: number
    minimum: 0
    maximum: 1
    description: "Two‑sided p‑value for the predictor."
  odds_ratio:
    type: number
    description: "exp(coefficient)."
required:
  - model_id
  - predictor
  - coefficient
  - std_error
  - p_value
  - odds_ratio
additionalProperties: false
