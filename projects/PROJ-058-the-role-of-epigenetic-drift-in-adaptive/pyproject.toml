[project]
name = "epigenetic-drift"
version = "0.1.0"
description = "The Role of Epigenetic Drift in Adaptive Landscape Exploration"
requires-python = ">=3.11"

[project.optional-dependencies]
lint = [
    "ruff>=0.4",
    "black>=24.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    venv
    | data
    | output
    | logs
    | specs
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "venv",
    "data",
    "output",
    "logs",
    "specs",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # line length handled by black / formatter
]

[tool.ruff.lint.isort]
known-first-party = ["code"]
