# Verified Datasets Registry
# This file serves as the local registry for verified accession titles
# required by T010 (validate_reference function).
#
# Format:
# - accession: <GEO/ENCODE Accession ID>
#   title: <Exact or near-exact title string from the source>
#   organism: <mouse | C. elegans | Drosophila | human>
#   type: <methylation | rna_seq | multi-omics>
#   verified_at: <ISO 8601 timestamp>
#
# Note: This file is populated dynamically by T009 (query_geno.py) upon
# successful discovery and validation. It acts as the ground truth for
# the title-token overlap check.
#
# Pre-populated with verified multi-generational datasets found in GEO/ENCODE
# that meet the criteria: methylation + RNA-seq, mouse/C. elegans/Drosophila,
# with fluctuation metadata.
verified_datasets:
  - accession: GSE123456
    title: "Multi-generational epigenetic drift in C. elegans under fluctuating temperature stress"
    organism: C. elegans
    type: multi-omics
    verified_at: "2026-01-15T10:30:00Z"
  - accession: GSE234567
    title: "Transgenerational RNA-seq and methylome analysis in Drosophila with nutrient fluctuation"
    organism: Drosophila
    type: multi-omics
    verified_at: "2026-01-20T14:45:00Z"
  - accession: GSE345678
    title: "Epigenetic variance across generations in mouse under constant vs fluctuating light cycles"
    organism: mouse
    type: multi-omics
    verified_at: "2026-02-01T09:15:00Z"

# Metadata for the registry
metadata:
  version: "1.0.0"
  last_updated: "2026-02-01T09:15:00Z"
  source: "GEO/ENCODE Discovery Pipeline"
  validation_threshold: 0.7