T001:
  reason: 'the task writes platform-owned path(s) inside the project: `state/` (shadows
    `state/`). A project owns data/, figures/, code/ and paper/; the platform owns
    state/ and derives artifact hashes at verification time. Re-scope the step to
    write only project-owned outputs.'
  task: 41d86f5f79220498c08713948ec0666223639c869325451b3c3782c5fb570468
T001a:
  reason: The `tests/unit/test_data_loader.py` file exists and contains detailed tests
    for `verify_urls`, but the test suite cannot be collected/run because importing
    `code/pipeline/loader.py` (required for the `exponential_backoff` decorator) raises
    an `ImportError` from the `datasets` library, which depends on a newer NumPy/pyarrow
    version. This import error aborts test execution, so the required unit test does
    not actually pass. The task needs the import issue resolved (e.g., make the `datasets`
    import lazy or adjust dependencies) so the tests can run successfully.
  task: a773c7bcd09d8183636339cef8dfd733cff1d2cb158f40c17e2f1e3f09ae41d6
T001b:
  reason: "The only unit\u2011test file (`tests/unit/test_data_loader.py`) exercises\
    \ `verify_urls` and the `exponential_backoff` decorator, but it contains no test\
    \ case that imports or validates the `download_and_checksum` function. A test\
    \ for `download_and_checksum` is required to satisfy task T001b."
  task: 30781d71e0b835ac06a7244912c0796fda1a3169c71e1ce8317944b81cc0f6bd
T001c:
  reason: "The `utils/data_loader.py` file only re\u2011exports `verify_urls` from\
    \ `code.utils.data_loader` and does not contain its own implementation, while\
    \ the unit test imports `verify_urls` from `pipeline.loader` instead of `utils.data_loader`.\
    \ Consequently the required function is not directly implemented in the specified\
    \ module and the provided test does not verify it. The task\u2019s requirement\
    \ is therefore unmet."
  task: 88e4c2391b092b97f7fa23ab3c473f23755393aaaa12d9dde036faf050c97ac4
T001d:
