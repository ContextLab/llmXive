    \ claimed verification unit test (`tests/unit/test_data_loader.py`) does **not**\
    \ test this function \u2013 it only covers `verify_urls` and the `exponential_backoff`\
    \ decorator. A test exercising `download_and_checksum` (e.g., mocking `datasets.load_dataset`\
    \ and checking that a `SHA256SUM` file is created and the correct checksum is\
    \ returned) is missing. Adding such a test is required to satisfy the task."
