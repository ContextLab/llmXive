$schema: "http://json-schema.org/draft-07/schema#"
title: "Trajectory Result Schema"
type: object
properties:
  cycles:
    type: array
    items:
      type: object
      properties:
        cycle_number:
          type: integer
          minimum: 0
        pre_modification_params:
          type: integer
          minimum: 0
        post_modification_params:
          type: integer
          minimum: 0
        architecture_modification:
          type: string
        training_duration:
          type: number
          minimum: 0
        flops:
          type: number
          minimum: 0
        evaluation_results:
          type: array
          items:
            type: object
            properties:
              benchmark_name:
                type: string
                enum: ["Wikitext-2"]
              ppl:
                type: number
              sample_size:
                type: integer
              p_value_vs_predecessor:
                type: number
                nullable: true
            required:
              - benchmark_name
              - ppl
              - sample_size
        success_status:
          type: boolean
        failure_reason:
          type: string
          nullable: true
      required:
        - cycle_number
        - pre_modification_params
        - post_modification_params
        - evaluation_results
        - success_status
  trend_direction:
    type: object
    properties:
      direction:
        type: string
        enum: ["improving", "declining", "flat", "inconclusive"]
    required:
      - direction
  cost_effectiveness:
    type: array
    items:
      type: object
      properties:
        cycle_number:
          type: integer
        ppl_per_flop:
          type: number
        ppl_per_hour:
          type: number
      required:
        - cycle_number
        - ppl_per_flop
        - ppl_per_hour
required:
  - cycles
  - trend_direction
  - cost_effectiveness
additionalProperties: false