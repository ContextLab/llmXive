[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-omnidirector"
version = "0.1.0"
description = "OmniDirector: General Multi-Shot Camera Cloning without Cross-Paired D"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "numpy",
    "pandas",
    "scipy",
    "pytest",
    "pyyaml",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
