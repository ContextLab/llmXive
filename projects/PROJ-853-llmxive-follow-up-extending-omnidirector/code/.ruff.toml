[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by Black)
    "B008", # Do not perform function call in argument defaults (common in Pydantic/dataclasses)
]
exclude = [
    "data/",
    "__pycache__",
    ".git",
]

[lint.isort]
known-first-party = ["analysis", "geometry", "data", "tests", "config", "create_structure"]
force-sort-within-sections = true
