[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # flake8 pybuild
    "I",  # flake8 isort
    "N",  # flake8 noqa
    "UP", # pyupgrade
    "ANN",# flake8-annotations
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
    "T20",# flake8-print
]
ignore = [
    "E501",  # Line too long (handled by black)
    "ANN001",# Missing type annotation for public method argument (optional for now)
    "ANN201",# Missing return type annotation (optional for now)
    "B905",  # `zip()` without an explicit `strict=` parameter (python version dependent)
]
exclude = [
    "__pycache__",
    ".venv",
    "venv",
    "data",
    "build",
    "dist",
]
per-file-ignores = { "code/tests/*" = ["ANN", "T20"] }

[lint.flake8-import-conventions.aliases]
numpy = "np"
pandas = "pd"
