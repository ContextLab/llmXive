# Schema for Climate Distance Matrix (User Story 2)
# This schema defines the expected structure of the climate distance matrix
# generated by the climate data loader and stats engine.
#
# Source: specs/001-phylogeny-metabolite-prediction/us2-climate-control.md
#
type: object
description: >
  A symmetric distance matrix representing Euclidean distances between species
  based on normalized continuous climate vectors derived from USDA PLANTS data.

properties:
  metadata:
    type: object
    description: Metadata about the matrix generation
    required:
      - generated_at
      - source
      - metric
      - species_count
      - dimension
    properties:
      generated_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of generation
      source:
        type: string
        description: Data source identifier (e.g., "USDA_PLANTS")
      metric:
        type: string
        enum: ["euclidean"]
        description: Distance metric used (must be euclidean per spec)
      species_count:
        type: integer
        minimum: 1
        description: Number of species in the matrix
      dimension:
        type: integer
        minimum: 1
        description: Number of climate variables used in the vector
      normalization:
        type: string
        description: Normalization method applied (e.g., "min-max", "z-score")
      parameter:
        type: string
        description: Path to the raw climate data file used

  species_labels:
    type: array
    description: Ordered list of species identifiers matching matrix rows/cols
    items:
      type: string
    minItems: 1
    uniqueItems: true

  matrix:
    type: array
    description: >
      2D array (list of lists) representing the distance matrix.
      Matrix[i][j] is the distance between species_labels[i] and species_labels[j].
    items:
      type: array
      items:
        type: number
        minimum: 0.0
        description: Non-negative distance value
    minItems: 1

  validation:
    type: object
    description: Validation checks performed on the matrix
    required:
      - is_symmetric
      - diagonal_is_zero
      - no_nan
      - no_inf
    properties:
      is_symmetric:
        type: boolean
        description: True if matrix[i][j] == matrix[j][i] for all i, j
      diagonal_is_zero:
        type: boolean
        description: True if matrix[i][i] == 0 for all i
      no_nan:
        type: boolean
        description: True if no NaN values exist in the matrix
      no_inf:
        type: boolean
        description: True if no infinite values exist in the matrix
      max_distance:
        type: number
        description: Maximum distance value in the matrix

required:
  - metadata
  - species_labels
  - matrix
  - validation
