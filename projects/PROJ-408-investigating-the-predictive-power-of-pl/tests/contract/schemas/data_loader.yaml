# Schema for data_loader output (US1)
# This schema defines the expected structure of the dictionary returned by
# the data loading functions in code/data_loader.py.
#
# The loader returns a dictionary with two main keys:
#   1. "sequences": A dict mapping species_id -> dict of locus -> sequence_string
#   2. "metabolites": A dict mapping species_id -> list of compound_ids (presence/absence)
#
# Note: Species missing either data type are excluded from the final combined
# matrix, but the schema here describes the raw output before filtering.

type: object
required:
  - sequences
  - metabolites
properties:
  sequences:
    type: object
    description: "Mapping of species_id to their fetched genomic sequences"
    additionalProperties:
      type: object
      description: "Mapping of locus name (e.g., '18S', 'rbcL') to sequence string"
      patternProperties:
        "^[0-9A-Za-z_]+$":
          type: string
          description: "FASTA sequence string (no header)"
          minLength: 10
          # Basic check to ensure it looks like DNA/RNA (A, C, G, T/U, N)
          pattern: "^[ACGTUacgtun]+$"
  metabolites:
    type: object
    description: "Mapping of species_id to list of KEGG compound IDs found"
    additionalProperties:
      type: array
      description: "List of KEGG compound IDs (e.g., 'C00001')"
      items:
        type: string
        pattern: "^C\\d{5}$"
        minLength: 6
        maxLength: 6
