$schema: http://json-schema.org/draft-07/schema#
title: Plant VOC Genomic-Environmental Dataset Schema
description: |
  Schema for the merged dataset used in predicting plant volatile organic compound (VOC)
  emission profiles from genomic and environmental data. This schema defines the structure
  of `data/processed/merged_dataset.csv` generated by the pipeline (T015/T017).
type: object
required:
  - sample_id
  - temperature
  - light_intensity
  - stress_condition
  - tpm_columns
  - voc_columns
properties:
  sample_id:
    type: string
    description: Unique identifier for the biological sample, used for exact merging.
    pattern: "^[A-Za-z0-9_-]+$"
  
  # --- Environmental Metadata (Critical for FR-012) ---
  temperature:
    type: number
    description: Temperature in Celsius.
    minimum: -50
    maximum: 60
  
  light_intensity:
    type: number
    description: Light intensity in µmol m⁻² s⁻¹.
    minimum: 0
    maximum: 3000
  
  stress_condition:
    type: string
    description: Type of stress applied (e.g., "drought", "heat", "herbivory", "control").
    enum:
      - drought
      - heat
      - cold
      - herbivory
      - pathogen
      - control
      - other
  
  replicate_id:
    type: integer
    description: Biological replicate index (1-based) within the same condition.
    minimum: 1
  
  # --- Genomic Data (Normalized TPM) ---
  # The schema expects a set of columns matching gene IDs or pathway IDs.
  # Specific column names are dynamic based on the aggregation strategy (T016),
  # but they must be numeric.
  tpm_columns:
    type: array
    description: |
      List of column names containing Transcripts Per Million (TPM) values.
      These correspond to either individual gene IDs or aggregated pathway features (e.g., TPS01).
      All values in these columns must be non-negative numbers.
    items:
      type: string
      pattern: "^[A-Za-z0-9_.-]+$"
    minItems: 1
  
  # --- VOC Targets (Continuous Variables) ---
  # List of column names for VOC compounds being predicted.
  voc_columns:
    type: array
    description: |
      List of column names containing VOC emission rates (e.g., ng/g/h or ng/h/plant).
      These are the target variables for the regression model.
    items:
      type: string
      pattern: "^[A-Za-z0-9_.-]+$"
    minItems: 1
  
  # --- Metadata / Provenance ---
  accession_id:
    type: string
    description: Source database accession ID (e.g., GEO:GSEXXXXX).
    nullable: true
  
  source_database:
    type: string
    description: Origin of the data (e.g., "NCBI_GEO", "Metabolomics_Workbench", "Synthetic").
    enum:
      - NCBI_GEO
      - Metabolomics_Workbench
      - Synthetic
  
  processing_date:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the dataset was processed.

# Additional constraints for validation logic (T006, T017)
additionalProperties: true
dependencies:
  tpm_columns:
    properties:
      tpm_columns:
        minItems: 1
  voc_columns:
    properties:
      voc_columns:
        minItems: 1