$schema: http://json-schema.org/draft-07/schema#
title: Plant VOC and Genomic Dataset Schema
description: >
  Unified schema for the merged dataset containing RNA-seq (gene expression),
  VOC emission profiles, and environmental metadata for Arabidopsis thaliana
  stress studies. Used for validation of data ingestion (T015) and model training (T020).
type: object
required:
  - sample_id
  - gene_expression
  - voc_profile
  - environmental_metadata
  - metadata
properties:
  sample_id:
    type: string
    description: Unique identifier for the biological sample, used for merging.
    pattern: "^[A-Za-z0-9_-]+$"
    example: "AT_S001_T1"

  gene_expression:
    type: object
    description: >
      Normalized gene expression values (TPM - Transcripts Per Million).
      Keys are Gene IDs (e.g., AT1G01010), values are float TPM.
    additionalProperties:
      type: number
      minimum: 0
    minProperties: 1
    example:
      AT1G01010: 12.5
      AT2G02020: 0.0

  voc_profile:
    type: object
    description: >
      Volatile Organic Compound emission rates (ng/g/h or ppb).
      Keys are VOC names/IDs, values are float emission rates.
    additionalProperties:
      type: number
      minimum: 0
    minProperties: 1
    example:
      "Limonene": 5.2
      "Beta-Ocimene": 12.8

  environmental_metadata:
    type: object
    description: >
      Environmental conditions during the experiment.
      Critical fields (temperature, light_intensity) are required for FR-012.
    required:
      - temperature
      - light_intensity
    properties:
      temperature:
        type: number
        description: Temperature in Celsius.
        minimum: -10
        maximum: 60
      light_intensity:
        type: number
        description: Light intensity in µmol/m²/s (PPFD).
        minimum: 0
        maximum: 3000
      humidity:
        type: number
        description: Relative humidity in percent.
        minimum: 0
        maximum: 100
        nullable: true
      co2_concentration:
        type: number
        description: CO2 concentration in ppm.
        minimum: 0
        nullable: true
      stress_condition:
        type: string
        description: Type of stress applied (e.g., "drought", "heat", "pathogen").
        enum:
          - drought
          - heat
          - cold
          - herbivory
          - pathogen
          - control
          - other
      duration_hours:
        type: number
        description: Duration of stress exposure in hours.
        minimum: 0
        nullable: true

  metadata:
    type: object
    description: >
      Additional study metadata (replicate info, source, timestamps).
      Used for filtering replicates (FR-011) and provenance.
    required:
      - replicate_id
      - source_study
    properties:
      replicate_id:
        type: string
        description: Identifier for the biological replicate.
      source_study:
        type: string
        description: Original study identifier (e.g., GEO accession, Metabolomics Workbench ID).
      collection_timestamp:
        type: string
        format: date-time
        description: ISO 8601 timestamp of sample collection.
        nullable: true
      notes:
        type: string
        description: Free-text notes about the sample.
        nullable: true

examples:
  - sample_id: "AT_S001_T1"
    gene_expression:
      AT1G12345: 150.2
      AT2G67890: 0.5
    voc_profile:
      "Myrcene": 2.1
      "Caryophyllene": 0.8
    environmental_metadata:
      temperature: 28.5
      light_intensity: 400
      humidity: 65
      stress_condition: "heat"
    metadata:
      replicate_id: "R1"
      source_study: "GSE12345"
      collection_timestamp: "2023-05-12T10:30:00Z"
      notes: "First replicate of heat stress group"
