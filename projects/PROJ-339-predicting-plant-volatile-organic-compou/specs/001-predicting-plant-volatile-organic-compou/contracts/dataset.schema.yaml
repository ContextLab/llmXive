# Dataset Schema for Predicting Plant VOC Emission Profiles
# This file defines the expected structure for Sample, GenomicFeature, EnvironmentalFeature, and VOCProfile objects.
# Used for validation of both real and synthetic data.

$schema: http://json-schema.org/draft-07/schema#
title: Plant VOC Dataset Schema
description: Schema for the plant volatile organic compound prediction pipeline.

definitions:
  Sample:
    type: object
    required:
      - sample_id
      - species
      - tissue_type
      - collection_date
    properties:
      sample_id:
        type: string
        description: Unique identifier for the sample.
      species:
        type: string
        description: Scientific name of the plant species (e.g., Arabidopsis thaliana).
      tissue_type:
        type: string
        description: Type of plant tissue (e.g., leaf, flower, root).
      collection_date:
        type: string
        format: date
        description: Date of sample collection (YYYY-MM-DD).
      experiment_id:
        type: string
        description: Identifier for the experiment this sample belongs to.
      source:
        type: string
        description: Data source (e.g., NCBI GEO, Metabolomics Workbench, Synthetic).
      accession_id:
        type: string
        description: Original accession ID from the data source.

  GenomicFeature:
    type: object
    required:
      - sample_id
    properties:
      sample_id:
        type: string
        description: Foreign key linking to Sample.
      gene_id:
        type: string
        description: Gene identifier (e.g., AT1G01010).
      gene_symbol:
        type: string
        description: Common gene symbol if available.
      tpm:
        type: number
        description: Transcripts Per Million normalized expression value.
      raw_count:
        type: integer
        description: Raw read count before normalization.
      pathway:
        type: string
        description: Associated metabolic pathway (e.g., Terpenoid biosynthesis).
      family:
        type: string
        description: Gene family (e.g., TPS-a, TPS-b).

  EnvironmentalFeature:
    type: object
    required:
      - sample_id
    properties:
      sample_id:
        type: string
        description: Foreign key linking to Sample.
      temperature:
        type: number
        description: Temperature in Celsius.
      light_intensity:
        type: number
        description: Light intensity in µmol m⁻² s⁻¹.
      co2_level:
        type: number
        description: CO2 concentration in ppm.
      humidity:
        type: number
        description: Relative humidity in %.
      stress_condition:
        type: string
        description: Description of applied stress (e.g., drought, heat, herbivory).
      duration_hours:
        type: number
        description: Duration of stress exposure in hours.

  VOCProfile:
    type: object
    required:
      - sample_id
    properties:
      sample_id:
        type: string
        description: Foreign key linking to Sample.
      compound_name:
        type: string
        description: Name of the VOC compound.
      cas_number:
        type: string
        description: CAS registry number if available.
      emission_rate:
        type: number
        description: Emission rate (e.g., ng g⁻¹ h⁻¹).
      unit:
        type: string
        description: Unit of measurement.
      detection_limit:
        type: number
        description: Limit of detection.
      compound_class:
        type: string
        description: Chemical class (e.g., Monoterpene, Sesquiterpene, Green Leaf Volatile).

# Root schema for a single record (union of types)
oneOf:
  - $ref: "#/definitions/Sample"
  - $ref: "#/definitions/GenomicFeature"
  - $ref: "#/definitions/EnvironmentalFeature"
  - $ref: "#/definitions/VOCProfile"
