$schema: http://json-schema.org/draft-07/schema#
title: Plant VOC Prediction Dataset Schema
description: >
  Schema definition for the plant volatile organic compound (VOC) prediction pipeline.
  Defines the structure for Samples, Genomic Features, Environmental Features, and VOC Profiles.
definitions:
  Sample:
    type: object
    description: Core sample identifier and metadata linking genomic, environmental, and VOC data.
    required:
      - sample_id
      - species
      - tissue_type
      - collection_date
    properties:
      sample_id:
        type: string
        description: Unique identifier for the sample.
      species:
        type: string
        description: Scientific name of the plant species (e.g., Arabidopsis thaliana).
      tissue_type:
        type: string
        description: Type of tissue sampled (e.g., leaf, root, flower).
      collection_date:
        type: string
        format: date
        description: Date of sample collection (ISO 8601).
      experiment_id:
        type: string
        description: Identifier for the parent experiment.
      replicate_id:
        type: integer
        description: Biological replicate number (1-based).
      treatment_condition:
        type: string
        description: Description of the stress or treatment applied.

  GenomicFeature:
    type: object
    description: Gene expression data associated with a sample.
    required:
      sample_id
      gene_id
      tpm_value
    properties:
      sample_id:
        type: string
        description: Foreign key linking to Sample.
      gene_id:
        type: string
        description: Gene identifier (e.g., AT1G01010).
      gene_name:
        type: string
        description: Symbolic gene name (optional).
      tpm_value:
        type: number
        format: float
        description: Transcripts Per Million normalized expression value.
      pathway_family:
        type: string
        description: Pathway family assignment (e.g., TPS-a, TPS-b).

  EnvironmentalFeature:
    type: object
    description: Environmental conditions recorded during sample collection.
    required:
      sample_id
      temperature
      light_intensity
      co2_level
    properties:
      sample_id:
        type: string
        description: Foreign key linking to Sample.
      temperature:
        type: number
        format: float
        description: Temperature in Celsius.
      light_intensity:
        type: number
        format: float
        description: Light intensity in µmol/m²/s.
      co2_level:
        type: number
        format: float
        description: CO2 concentration in ppm.
      humidity:
        type: number
        format: float
        description: Relative humidity in %.
      soil_moisture:
        type: number
        format: float
        description: Soil moisture content in %.

  VOCProfile:
    type: object
    description: Volatile Organic Compound measurements for a sample.
    required:
      sample_id
      compound_id
      concentration
    properties:
      sample_id:
        type: string
        description: Foreign key linking to Sample.
      compound_id:
        type: string
        description: Identifier for the VOC (e.g., CAS number or InChIKey).
      compound_name:
        type: string
        description: Common name of the compound.
      concentration:
        type: number
        format: float
        description: Concentration value (units depend on measurement method).
      unit:
        type: string
        description: Unit of measurement (e.g., ng/g/h, ppb).
      detection_limit:
        type: number
        format: float
        description: Detection limit for the compound.

# Root schema for validation of a dataset containing mixed records
# In practice, this schema is used to validate individual record types
# or a combined JSON structure where 'type' discriminates the object.
anyOf:
  - $ref: '#/definitions/Sample'
  - $ref: '#/definitions/GenomicFeature'
  - $ref: '#/definitions/EnvironmentalFeature'
  - $ref: '#/definitions/VOCProfile'
