$schema: "http://json-schema.org/draft-07/schema#"
title: "ParticipantSession"
type: object
properties:
  participant_id:
    type: string
  session_id:
    type: string
  baseline_rt:
    type: number
    description: "Mean reaction time (ms) on baseline task."
  familiarity_score:
    type: number
    minimum: 1
    maximum: 10
    description: "Pre‑experiment self‑reported familiarity with meeting content (1‑10)."
  trials:
    type: array
    items:
      type: object
      properties:
        clip_id:
          type: string
        background_frame_id:
          type: string
        task_difficulty:
          type: string
          enum: [low, medium, high]
        nasa_tlx_score:
          type: number
          minimum: 0
          maximum: 100
        post_rt:
          type: number
          description: "Mean RT (ms) after the clip."
        rt_valid:
          type: boolean
          description: "True if TLX and RT present; False otherwise."
      required:
        - clip_id
        - background_frame_id
        - task_difficulty
        - nasa_tlx_score
        - post_rt
        - rt_valid
    description: "One entry per experimental trial."
required:
  - participant_id
  - session_id
  - baseline_rt
  - familiarity_score
  - trials
additionalProperties: false