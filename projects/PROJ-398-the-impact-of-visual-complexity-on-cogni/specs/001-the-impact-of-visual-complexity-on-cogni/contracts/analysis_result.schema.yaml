$schema: "http://json-schema.org/draft-07/schema#"
title: "AnalysisResult"
type: object
properties:
  model_name:
    type: string
    description: "Identifier of the statistical model (e.g., lmm_full)."
  fixed_effects:
    type: array
    items:
      type: object
      properties:
        predictor:
          type: string
        estimate:
          type: number
        conf_low:
          type: number
        conf_high:
          type: number
        p_value:
          type: number
        p_adj:
          type: number
        effect_size:
          type: number
          description: "Cohen's d or standardized beta."
      required:
        - predictor
        - estimate
        - conf_low
        - conf_high
        - p_value
        - p_adj
        - effect_size
  vif:
    type: object
    additionalProperties:
      type: number
    description: "VIF per fixed effect."
  fwer_observed:
    type: number
    description: "Family‑wise error rate from null simulations (target α = 0.05)."
  sensitivity:
    type: array
    items:
      type: object
      properties:
        alpha:
          type: number
        significant_predictors:
          type: integer
        effect_size_sd:
          type: number
      required:
        - alpha
        - significant_predictors
        - effect_size_sd
required:
  - model_name
  - fixed_effects
  - vif
  - fwer_observed
  - sensitivity
additionalProperties: false