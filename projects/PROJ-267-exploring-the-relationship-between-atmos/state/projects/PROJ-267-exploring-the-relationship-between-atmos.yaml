project_id: PROJ-267-exploring-the-relationship-between-atmos
title: Exploring the Relationship Between Atmospheric Rivers and Gravity Anomalies
status: in_progress
created_at: "2026-01-01T00:00:00Z"
updated_at: "2026-06-28T00:00:00Z"
version: 0.1.0
description: >
  Investigating the correlation between Atmospheric River (AR) events and
  gravity anomalies detected by GRACE-FO satellites over the North American West Coast.
objectives:
  - Retrieve and preprocess GRACE-FO mascon solutions and NOAA AR catalog data.
  - Align datasets to monthly resolution for the target region (35°N-50°N, 120°W-125°W).
  - Compute Pearson correlation with lag windows and bootstrap confidence intervals.
  - Validate signals against control regions and GRACE-FO noise floors.
data_sources:
  - name: GRACE-FO Mascon Solutions
    url: "https://grace.jpl.nasa.gov/data/grace-fo-mascon-solution/"
    type: satellite_gravity
    format: netcdf
  - name: NOAA CPC Atmospheric River Catalog
    url: "https://www.ncei.noaa.gov/access/paleo-search/study/36263"
    type: atmospheric_catalog
    format: csv
