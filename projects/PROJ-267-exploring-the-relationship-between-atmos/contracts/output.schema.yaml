$schema: http://json-schema.org/draft-07/schema#
title: Correlation Result Schema
description: >
  Schema for validation of correlation analysis results between
  Atmospheric River intensity and Gravity Anomalies. This schema
  corresponds to the Correlation Result entity defined in data-model.md
  and is used by T023 and T024 for contract testing.
type: object
required:
  - analysis_id
  - region_type
  - lag_months
  - correlation_coefficient
  - p_value
  - p_value_corrected
  - is_significant_fdr
  - bootstrap_ci_lower
  - bootstrap_ci_upper
  - n_observations
  - effective_n
  - noise_floor_sigma
  - signal_to_noise_ratio
  - method_details
properties:
  analysis_id:
    type: string
    description: Unique identifier for this specific correlation analysis run.
    pattern: "^AR-GRACE-[0-9]{8}-[a-z0-9]{6}$"

  region_type:
    type: string
    description: The type of region analyzed (target or control).
    enum:
      - target
      - control

  lag_months:
    type: integer
    description: The time lag in months applied to the AR intensity series relative to the gravity anomaly.
    minimum: 0
    maximum: 3

  correlation_coefficient:
    type: number
    description: Pearson correlation coefficient (r) between AR intensity and gravity anomaly.
    minimum: -1.0
    maximum: 1.0

  p_value:
    type: number
    description: Uncorrected p-value for the correlation coefficient.
    minimum: 0.0
    maximum: 1.0

  p_value_corrected:
    type: number
    description: FDR-corrected p-value (Benjamini-Hochberg) for multiple comparisons.
    minimum: 0.0
    maximum: 1.0

  is_significant_fdr:
    type: boolean
    description: Flag indicating if the result is significant after FDR correction (p < 0.05).
    # Note: This is an informational flag per SC-002, not a pre-specified success criterion.

  bootstrap_ci_lower:
    type: number
    description: Lower bound of the 95% bootstrap confidence interval for the correlation coefficient.

  bootstrap_ci_upper:
    type: number
    description: Upper bound of the 95% bootstrap confidence interval for the correlation coefficient.

  n_observations:
    type: integer
    description: Total number of monthly observations used in the correlation.
    minimum: 1

  effective_n:
    type: integer
    description: Effective sample size after autocorrelation correction (AR(1) pre-whitening).
    minimum: 1

  noise_floor_sigma:
    type: number
    description: Estimated noise floor (standard deviation) of the GRACE-FO mascon data for this region.

  signal_to_noise_ratio:
    type: number
    description: Ratio of the observed correlation magnitude to the noise floor.
    # Used for FR-004 validation (signal >= 3σ threshold)

  method_details:
    type: object
    description: Detailed metadata about the statistical methods applied.
    required:
      - pre_whitening_method
      - bootstrap_iterations
      - fdr_method
    properties:
      pre_whitening_method:
        type: string
        description: Method used for autocorrelation correction.
        enum:
          - AR1_NeweyWest
          - AR1_OLS
      bootstrap_iterations:
        type: integer
        description: Number of bootstrap resampling iterations.
        minimum: 100
      fdr_method:
        type: string
        description: Specific FDR correction method used.
        enum:
          - benjamini_hochberg
          - benjamini_yekutieli

additionalProperties: false