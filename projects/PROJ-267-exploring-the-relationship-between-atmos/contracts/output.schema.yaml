$schema: http://json-schema.org/draft-07/schema#
title: Correlation Result
description: >
  Schema for the output of the statistical correlation analysis between
  Atmospheric River (AR) intensity and Gravity Anomalies. This schema defines
  the structure of the results generated by User Story 2 (T020-T022), including
  correlation coefficients, p-values, bootstrap confidence intervals, and
  control region validation metrics.
type: object
required:
  - analysis_id
  - region_type
  - lag_months
  - correlation_coefficient
  - p_value
  - p_value_corrected
  - is_significant
  - bootstrap_ci_lower
  - bootstrap_ci_upper
  - effective_sample_size
  - noise_floor_rms
  - signal_to_noise_ratio
  - timestamp
properties:
  analysis_id:
    type: string
    description: Unique identifier for this specific correlation analysis run.
    pattern: "^[a-zA-Z0-9_-]+$"
  
  region_type:
    type: string
    description: >
      Type of region analyzed. Distinguishes between the target region
      (West Coast NA: 35°N-50°N, 120°W-125°W) and control regions.
    enum:
      - target
      - control
  
  lag_months:
    type: integer
    description: >
      Time lag in months between the AR event and the gravity anomaly measurement.
      Valid range is typically 0 to 3 months.
    minimum: 0
    maximum: 12
  
  correlation_coefficient:
    type: number
    description: >
      Pearson correlation coefficient (r) between AR intensity and gravity anomaly.
      Value ranges from -1 to 1.
    minimum: -1.0
    maximum: 1.0
  
  p_value:
    type: number
    description: >
      Raw p-value from the Pearson correlation test.
      Represents the probability of observing a correlation as extreme as the
      one computed, assuming the null hypothesis (no correlation) is true.
    minimum: 0.0
    maximum: 1.0
  
  p_value_corrected:
    type: number
    description: >
      Multiple-comparison corrected p-value (e.g., Bonferroni or Holm-Bonferroni).
      Used to control the family-wise error rate across multiple lag windows.
    minimum: 0.0
    maximum: 1.0
  
  is_significant:
    type: boolean
    description: >
      Boolean flag indicating statistical significance based on the corrected
      p-value and the SC-002 threshold (p < 0.05).
      Note: Significance is determined by p-value, NOT by effect size threshold.
  
  bootstrap_ci_lower:
    type: number
    description: >
      Lower bound of the 95% bootstrap confidence interval for the correlation coefficient.
      Derived from 1000 resampling iterations with seed=42.
  
  bootstrap_ci_upper:
    type: number
    description: >
      Upper bound of the 95% bootstrap confidence interval for the correlation coefficient.
  
  effective_sample_size:
    type: integer
    description: >
      Effective sample size (n_eff) after correcting for autocorrelation.
      Calculated as n_eff = n * (1 - rho) / (1 + rho), where rho is the lag-1 autocorrelation.
    minimum: 1
  
  noise_floor_rms:
    type: number
    description: >
      Root Mean Square (RMS) of the GRACE-FO mascon uncertainty for this region/time.
      Derived from the measurement noise metadata.
    minimum: 0.0
  
  signal_to_noise_ratio:
    type: number
    description: >
      Ratio of the observed signal magnitude to the noise floor (>= 3σ threshold per FR-004).
      Calculated as |correlation_coefficient| / noise_floor_rms (normalized).
    minimum: 0.0
  
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the analysis was completed.
  
  notes:
    type: string
    description: >
      Optional field for additional context, warnings, or null result explanations.
      Used when correlation < 0.1 to report findings without forcing positive results.
    default: ""