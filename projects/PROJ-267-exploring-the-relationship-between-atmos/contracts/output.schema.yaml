$schema: http://json-schema.org/draft-07/schema#
title: Correlation Result Schema
description: |
  Schema for validating Correlation Result entities generated by the
  statistical analysis pipeline (User Story 2). Defines the structure
  for Pearson correlation coefficients, bootstrap confidence intervals,
  lag windows, and region type classifications.

  Per Constitution Principle VII, this schema captures associational metrics
  without pre-specifying success thresholds. The 'significance_flag' field
  is informational only (p < 0.05) and not a constraint on the result validity.

type: object
required:
  - analysis_id
  - region_type
  - lag_months
  - pearson_r
  - p_value
  - significance_flag
  - bootstrap_ci_lower
  - bootstrap_ci_upper
  - effective_n
  - noise_floor_sigma
  - signal_to_noise_ratio
  - timestamp
properties:
  analysis_id:
    type: string
    description: Unique identifier for this correlation analysis run (UUID).
    pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$"

  region_type:
    type: string
    description: |
      The geographic context of the analysis.
      - 'target': West Coast NA (120°W-125°W, mid-to-high latitude)
      - 'control': Selected region without significant AR activity
    enum:
      - target
      - control

  lag_months:
    type: integer
    description: |
      The lag window in months applied to the time-series alignment.
      Values range from 0 (synchronous) to 3 (3-month lag).
    minimum: 0
    maximum: 3

  pearson_r:
    type: number
    description: Pearson correlation coefficient between AR intensity and gravity anomaly.
    minimum: -1.0
    maximum: 1.0

  p_value:
    type: number
    description: Two-tailed p-value from the Pearson correlation test.
    minimum: 0.0
    maximum: 1.0

  significance_flag:
    type: boolean
    description: |
      Informational flag indicating if p_value < 0.05.
      Per Constitution Principle VII, this is NOT a pre-specified success criterion
      or effect size threshold. It is provided for reporting purposes only.

  bootstrap_ci_lower:
    type: number
    description: Lower bound of the 95% bootstrap confidence interval for Pearson r.
    minimum: -1.0
    maximum: 1.0

  bootstrap_ci_upper:
    type: number
    description: Upper bound of the 95% bootstrap confidence interval for Pearson r.
    minimum: -1.0
    maximum: 1.0

  effective_n:
    type: integer
    description: |
      Effective sample size (n_eff) after autocorrelation correction.
      Calculated as n * (-rho)/(1+rho) or via AR(1) residual extraction.
    minimum: 1

  noise_floor_sigma:
    type: number
    description: |
      Estimated noise floor (standard deviation) derived from GRACE-FO mascon
      uncertainty metadata for the specific region and time period.
    minimum: 0.0

  signal_to_noise_ratio:
    type: number
    description: |
      Ratio of the absolute correlation magnitude to the noise floor.
      Reported as a metric (e.g., ≥ 3σ) but not enforced as a pass/fail constraint.
    minimum: 0.0

  timestamp:
    type: string
    format: date-time
    description: ISO 8601 timestamp of when the analysis was performed.

  frame_of_reference_note:
    type: string
    description: |
      Explicit statement clarifying the frame of reference to distinguish
      physical curvature from coordinate artifacts (per Einstein review).
    const: "Note: Gravity anomaly refers to geoid height at satellite altitude (GRACE-FO L2 mascon), not surface gravitational acceleration."

  metadata:
    type: object
    description: Additional metadata about the analysis run.
    properties:
      seed:
        type: integer
        description: Random seed used for bootstrap resampling (default 42).
      iterations:
        type: integer
        description: Number of bootstrap iterations performed (default 1000).
      correction_method:
        type: string
        description: Method used for multiple-comparison correction (e.g., 'fdr_bh', 'bonferroni').
    required:
      - seed
      - iterations
      - correction_method