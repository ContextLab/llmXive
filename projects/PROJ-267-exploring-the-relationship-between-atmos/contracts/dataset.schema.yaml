$schema: http://json-schema.org/draft-07/schema#
title: Merged Monthly Dataset Schema
description: |
  Schema for the merged monthly dataset combining GRACE-FO gravity anomalies
  and NOAA AR intensity data for the West Coast NA region (35°N-50°N, 120°W-125°W).
  Generated per US-1 requirements.
type: object
properties:
  month:
    type: string
    description: "ISO 8601 month string (YYYY-MM)"
    pattern: "^\\d{4}-\\d{2}$"
  grace_geoid_height_cm:
    type: number
    description: |
      GRACE-FO mascon geoid height anomaly in centimeters at satellite altitude.
      Processed with degree-1 correction, C20 replacement, and 300km Gaussian smoothing.
      Note: Refers to geoid height, not surface gravitational acceleration.
  ar_iwt_kg_m2:
    type: number
    description: |
      NOAA AR Integrated Water Vapor Transport (IWVT) in kg/m².
      Monthly mean for the target region.
  ar_event_count:
    type: integer
    description: "Number of distinct AR events recorded in the month"
    minimum: 0
  data_source_grace:
    type: string
    description: "Version/release identifier for the GRACE-FO dataset"
  data_source_noaa:
    type: string
    description: "Version/release identifier for the NOAA AR catalog"
required:
  - month
  - grace_geoid_height_cm
  - ar_iwt_kg_m2
  - ar_event_count
  - data_source_grace
  - data_source_noaa
additionalProperties: false