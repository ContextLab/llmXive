$schema: http://json-schema.org/draft-07/schema#
title: Merged Monthly Dataset Schema
description: >
  Schema for the merged monthly dataset containing GRACE-FO gravity anomalies
  and NOAA Atmospheric River (AR) intensity metrics for the West Coast NA region.
  Validated by T017 (merge output script) and T018 (contract test).
type: object
required:
  - $schema
  - type
  - properties
  - required
properties:
  $schema:
    type: string
    const: http://json-schema.org/draft-07/schema#
  type:
    type: string
    const: object
  properties:
    type: object
    properties:
      date:
        type: string
        description: "ISO 8601 formatted date (YYYY-MM) representing the month of observation."
        pattern: "^\\d{4}-\\d{2}$"
      grace_gravity_anomaly_mGal:
        type: number
        description: >
          GRACE-FO mascon derived gravity anomaly in milligals (mGal) for the
          West Coast NA region (120°W-125°W), after degree-1, C20, and Gaussian smoothing corrections.
        minimum: -1000
        maximum: 1000
      ar_iwt_metric:
        type: number
        description: >
          NOAA CPC Atmospheric River Integrated Water Vapor Transport (IWVT) metric
          aggregated to monthly mean for the region. Units depend on source (typically kg/m/s or equivalent).
        minimum: 0
      ar_event_count:
        type: integer
        description: "Count of distinct AR events recorded in the NOAA catalog for the given month."
        minimum: 0
      region:
        type: string
        description: "Fixed region identifier for the analysis area."
        const: "West_Coast_NA_120W_125W"
      data_source_grace:
        type: string
        description: "Identifier for the GRACE-FO data release version."
      data_source_noaa:
        type: string
        description: "Identifier for the NOAA AR Catalog version."
    required:
      - date
      - grace_gravity_anomaly_mGal
      - ar_iwt_metric
      - ar_event_count
      - region
      - data_source_grace
      - data_source_noaa
  required:
    - properties
    - required
    - type
additionalProperties: false
