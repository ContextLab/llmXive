$schema: http://json-schema.org/draft-07/schema#
title: Merged Monthly Atmospheric River and Gravity Anomaly Dataset
description: >
  Schema for the merged CSV output generated by code/03_merge_output.py.
  This dataset combines preprocessed GRACE-FO gravity anomaly data and
  NOAA CPC Atmospheric River (AR) intensity data, aligned to monthly
  resolution for the West Coast NA region (35°N-50°N, 120°W-125°W).
type: object
required:
  - properties
  - items
properties:
  $schema:
    type: string
    const: http://json-schema.org/draft-07/schema#
  title:
    type: string
  description:
    type: string
  type:
    type: string
    const: object
  properties:
    type: object
    properties:
      month:
        type: object
        description: "ISO 8601 formatted month string (YYYY-MM)"
        type: string
        pattern: "^\\d{4}-\\d{2}$"
      grace_anomaly_cm:
        type: object
        description: >
          Gravity anomaly in equivalent water height (cm) derived from
          GRACE-FO mascon solutions, after degree-1, C20, and smoothing corrections.
        type: number
      ar_intensity:
        type: object
        description: >
          Integrated Water Vapor Transport (IVT) magnitude for Atmospheric River
          events in the target region, aggregated to monthly total (kg m⁻¹ s⁻¹).
        type: number
      ar_event_count:
        type: object
        description: "Number of distinct AR events detected in the month."
        type: integer
        minimum: 0
      grace_uncertainty_cm:
        type: object
        description: "Estimated uncertainty (1-sigma) for the gravity anomaly measurement (cm)."
        type: number
        minimum: 0
      data_source_grace:
        type: object
        description: "Identifier for the GRACE-FO mascon solution version used."
        type: string
      data_source_noaa:
        type: object
        description: "Identifier for the NOAA CPC AR Catalog version used."
        type: string
    required:
      - month
      - grace_anomaly_cm
      - ar_intensity
      - ar_event_count
      - grace_uncertainty_cm
      - data_source_grace
      - data_source_noaa
  items:
    type: object
    description: "Each row represents a single month's merged observation."
    additionalProperties: false
additionalProperties: false
examples:
  - month: "2018-01"
    grace_anomaly_cm: 1.23
    ar_intensity: 450.5
    ar_event_count: 3
    grace_uncertainty_cm: 0.15
    data_source_grace: "JPL_MASCON_RL06"
    data_source_noaa: "NOAA_CPC_AR_Catalog_v2023"