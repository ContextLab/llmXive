$schema: http://json-schema.org/draft-07/schema#
title: "Model Output Schema"
type: object
description: "Schema for the final regression and robustness analysis results."
properties:
  coefficient:
    type: number
    description: "Estimated effect of recommendation diversity on learner diversity."
  standard_error:
    type: number
    description: "Standard error of the coefficient."
  p_value:
    type: number
    description: "P-value from the weighted regression."
  vif:
    type: number
    description: "Variance Inflation Factor for collinearity diagnostics."
  method:
    type: string
    description: "Method used (e.g., 'Weighted Regression', 'GLS', 'Robust Linear Regression')."
  e_value:
    type: number
    description: "E-value quantifying sensitivity to unmeasured confounding."
  sensitivity_analysis:
    type: array
    items:
      type: object
      properties:
        threshold:
          type: number
          description: "Semantic similarity threshold used."
        coefficient:
          type: number
        p_value:
          type: number
      required:
        - threshold
        - coefficient
        - p_value
  permutation_p_value:
    type: number
    description: "P-value from the Outcome Permutation Test."
required:
  - coefficient
  - standard_error
  - p_value
  - vif
  - method
  - e_value
  - sensitivity_analysis
  - permutation_p_value
additionalProperties: false
