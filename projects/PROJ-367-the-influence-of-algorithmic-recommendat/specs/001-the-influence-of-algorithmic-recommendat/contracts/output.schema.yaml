$schema: http://json-schema.org/draft-07/schema#
title: Model Results Schema
description: Schema for the output of the statistical modeling and robustness analysis.
type: object
properties:
  coefficient:
    type: number
    description: Estimated effect of Recommendation_Diversity on Learner_Diversity.
  std_error:
    type: number
    description: Standard error of the coefficient.
  p_value:
    type: number
    description: P-value for the coefficient.
  vif:
    type: number
    description: Variance Inflation Factor for baseline controls.
  convergence_status:
    type: boolean
    description: Whether the model converged successfully.
  weights_distribution:
    type: object
    properties:
      median:
        type: number
      max:
        type: number
      mean:
        type: number
    description: Distribution statistics of the propensity weights.
  sensitivity_analysis:
    type: array
    items:
      type: object
      properties:
        threshold:
          type: number
          description: Semantic similarity threshold used (e.g., 0.01, 0.05, 0.1).
        coefficient:
          type: number
        p_value:
          type: number
      required:
        - threshold
        - coefficient
        - p_value
    description: Results of the sensitivity analysis sweep.
  permutation_test:
    type: object
    properties:
      observed_effect:
        type: number
      null_distribution_mean:
        type: number
      null_distribution_std:
        type: number
      p_value_permuted:
        type: number
      iterations:
        type: integer
    description: Results of the residual permutation test.
required:
  - coefficient
  - std_error
  - p_value
  - convergence_status
additionalProperties: false