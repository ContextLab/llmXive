$schema: "http://json-schema.org/draft-07/schema#"
title: "UserSession Raw Dataset Schema"
description: "Schema for the raw dataset after mapping to required fields."
type: object
properties:
  user_id:
    type: string
    description: "Unique identifier for the learner."
  session_id:
    type: string
    description: "Unique identifier for the session."
  recommended_categories:
    type: array
    items:
      type: string
    description: "List of category tokens representing algorithmic recommendations (mapped from `input_seq`)."
  enrolled_categories:
    type: array
    items:
      type: string
    description: "List of category tokens representing actual enrollments (mapped from `target_seq`)."
required:
  - user_id
  - session_id
  - recommended_categories
  - enrolled_categories
additionalProperties: false
