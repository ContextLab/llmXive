$schema: "http://json-schema.org/draft-07/schema#"
title: "Dataset Schema"
type: "object"
properties:
  user_id:
    type: "string"
    description: "Unique identifier for the user."
  session_id:
    type: "string"
    description: "Unique identifier for the session."
  recommended_categories:
    type: "array"
    items:
      type: "string"
    description: "List of category labels recommended by the algorithm. Must contain educational course topics."
  enrolled_categories:
    type: "array"
    items:
      type: "string"
    description: "List of category labels enrolled in by the user. Must contain educational course topics."
required:
  - user_id
  - session_id
  - recommended_categories
  - enrolled_categories
additionalProperties: true
description: "Schema for the raw input dataset. Must contain distinct columns for recommendations and enrollments with educational course topics."