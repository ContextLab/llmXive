$schema: http://json-schema.org/draft-07/schema#
title: UserSession Dataset Schema
description: Schema for the raw and processed user session data including recommendations and enrollments.
type: object
properties:
  user_id:
    type: string
    description: Unique identifier for the learner.
  session_id:
    type: string
    description: Unique identifier for the session.
  recommended_categories:
    type: array
    items:
      type: string
    description: List of category strings recommended by the algorithm (or proxy).
  enrolled_categories:
    type: array
    items:
      type: string
    description: List of category strings the user actually enrolled in.
  recommendation_diversity_score:
    type: ["number", "null"]
    description: Shannon entropy (log base 2) of recommended_categories.
  learner_diversity_score:
    type: ["number", "null"]
    description: Shannon entropy (log base 2) of enrolled_categories.
required:
  - user_id
  - session_id
  - recommended_categories
  - enrolled_categories
additionalProperties: false