[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-proj-367"
version = "0.1.0"
description = "The Influence of Algorithmic Recommendations on Exploration vs. Exploitation"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
    "scipy>=1.13.0",
    "datasets>=2.20.0",
    "pyyaml>=6.0.0",
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["projects/PROJ-367-the-influence-of-algorithmic-recommendat"]
include = ["code*"]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "W", "I"]
ignore = []

[tool.black]
line-length = 88
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["projects/PROJ-367-the-influence-of-algorithmic-recommendat/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
