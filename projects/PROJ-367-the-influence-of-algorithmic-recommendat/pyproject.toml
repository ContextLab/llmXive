[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-367-algorithmic-recommendations"
version = "0.1.0"
description = "Analysis of algorithmic influence on exploration vs exploitation"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1.4",
    "numpy>=1.26.3",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.1",
    "scipy>=1.12.0",
    "datasets>=2.16.1",
    "pyyaml>=6.0.1",
    "pytest>=7.4.4",
]

[tool.setuptools.packages.find]
where = ["projects/PROJ-367-the-influence-of-algorithmic-recommendat/code"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py39"]
