[pytest]
testpaths = tests/
markers =
    us1: User Story 1 - Data Ingestion and Diversity Metric Calculation
    us2: User Story 2 - Baseline Control and Propensity Score Weighting
    us3: User Story 3 - Robustness Verification
addopts = -v --tb=short
python_files = test_*.py
python_classes = Test*
python_functions = test_*