# Configuration for PROJ-069
# This file stores non-sensitive configuration parameters.
# Sensitive data (API keys) must be set in the .env file.

# Data Sources
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  metadata_dir: "data/metadata"

# API Configuration
# Note: API keys are loaded from environment variables (see .env)
# FRED_API_KEY
# HF_TOKEN
# GDELT_API_KEY

# Analysis Parameters
analysis:
  frequency: "monthly"
  missing_rate_threshold: 0.05
  confidence_threshold: 0.7
  min_sample_size: 100

# Model Configuration
modeling:
  adf_lag: "auto"
  max_lag: 12
  mbb_block_length: 1  # 1 month for monthly data

# Validation
validation:
  sensitivity_masking_proportions: [0.1, 0.2, 0.3]
  p_value_shift_threshold: 0.01
  ci_width_threshold: 0.20

# Output
output:
  model_stats_file: "results/model_stats.json"
  validation_stats_file: "results/validation_stats.json"
  holdout_validation_file: "results/holdout_validation.json"
  quality_log_file: "data/processed/data_quality_log.json"