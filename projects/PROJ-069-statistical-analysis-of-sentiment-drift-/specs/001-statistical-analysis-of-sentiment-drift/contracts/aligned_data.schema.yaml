$schema: "http://json-schema.org/draft-07/schema#"
title: "Aligned Quarterly Time Series"
type: object
required:
  - quarter
  - sentiment_pos_ratio
  - sentiment_neg_ratio
  - sentiment_neu_ratio
  - sentiment_ilr_1
  - sentiment_ilr_2
  - media_volume
  - gdp_growth
  - unemployment_rate
  - consumer_confidence
  - low_confidence_flag
  - interpolation_percent_gdp
  - interpolation_percent_unrate
  - interpolation_percent_cons_conf
  - vif_gdp
  - vif_unrate
  - vif_cons_conf
properties:
  quarter:
    type: string
    pattern: "^\\d{4}-Q[1-4]$"
    description: "Quarter identifier in ISO format, e.g., '2020-Q1'."
  sentiment_pos_ratio:
    type: number
    minimum: 0
    maximum: 1
    description: "Proportion of positive sentiment scores (confidence ≥ 0.7)."
  sentiment_neg_ratio:
    type: number
    minimum: 0
    maximum: 1
    description: "Proportion of negative sentiment scores (confidence ≥ 0.7)."
  sentiment_neu_ratio:
    type: number
    minimum: 0
    maximum: 1
    description: "Proportion of neutral sentiment scores (confidence ≥ 0.7)."
  sentiment_ilr_1:
    type: number
    description: "First additive log‑ratio component derived from sentiment ratios."
  sentiment_ilr_2:
    type: number
    description: "Second additive log‑ratio component derived from sentiment ratios."
  media_volume:
    type: integer
    minimum: 0
    description: "Number of sentiment‑bearing social‑media posts in the quarter."
  gdp_growth:
    type: number
    description: "Quarterly GDP growth rate (percent)."
  unemployment_rate:
    type: number
    description: "Quarterly unemployment rate (percent)."
  consumer_confidence:
    type: number
    description: "Quarterly Consumer Confidence Index (percent)."
  low_confidence_flag:
    type: boolean
    description: "True if the quarter lacked sufficient sentiment sample size (≤ 30 observations)."
  interpolation_percent_gdp:
    type: number
    minimum: 0
    maximum: 100
    description: "Percentage of GDP points filled by linear interpolation."
  interpolation_percent_unrate:
    type: number
    minimum: 0
    maximum: 100
    description: "Percentage of UNRATE points filled by linear interpolation."
  interpolation_percent_cons_conf:
    type: number
    minimum: 0
    maximum: 100
    description: "Percentage of Consumer Confidence points filled by linear interpolation."
  vif_gdp:
    type: number
    description: "Variance Inflation Factor for GDP series."
  vif_unrate:
    type: number
    description: "Variance Inflation Factor for unemployment series."
  vif_cons_conf:
    type: number
    description: "Variance Inflation Factor for consumer confidence series."
additionalProperties: false
