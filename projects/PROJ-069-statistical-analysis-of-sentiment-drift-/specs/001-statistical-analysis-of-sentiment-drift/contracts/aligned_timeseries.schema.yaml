$schema: "http://json-schema.org/draft-07/schema#"
title: "Aligned Monthly Timeseries Schema"
description: "Schema for the merged, cleaned, and aligned monthly time‑series data used in Granger causality analysis."
type: object
required:
  - date
  - sentiment_pos_ratio
  - sentiment_neg_ratio
  - sentiment_neu_ratio
  - sentiment_ilr_1
  - sentiment_ilr_2
  - media_volume
  - gdp_growth
  - unemployment_rate
  - consumer_confidence
  - low_confidence_flag
  - interpolation_percent_gdp
  - interpolation_percent_unrate
  - interpolation_percent_cons_conf
  - vif_gdp
  - vif_unrate
  - vif_cons_conf
properties:
  date:
    type: string
    pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    description: "Monthly timestamp (YYYY-MM)."
  sentiment_pos_ratio:
    type: number
    minimum: 0
    maximum: 1
    description: "Ratio of positive sentiment scores."
  sentiment_neg_ratio:
    type: number
    minimum: 0
    maximum: 1
    description: "Ratio of negative sentiment scores."
  sentiment_neu_ratio:
    type: number
    minimum: 0
    maximum: 1
    description: "Ratio of neutral sentiment scores."
  sentiment_ilr_1:
    type: number
    description: "First ILR component (monthly)."
  sentiment_ilr_2:
    type: number
    description: "Second ILR component (monthly)."
  media_volume:
    type: integer
    minimum: 0
    description: "Number of sentiment‑bearing posts in the month."
  gdp_growth:
    type: number
    description: "Monthly GDP growth rate (derived from quarterly series)."
  unemployment_rate:
    type: number
    description: "Monthly unemployment rate."
  consumer_confidence:
    type: number
    description: "Monthly Consumer Confidence Index."
  low_confidence_flag:
    type: boolean
    description: "True if the month has insufficient sentiment volume (< 30 observations)."
  interpolation_percent_gdp:
    type: number
    minimum: 0
    maximum: 100
    description: "Percentage of GDP points interpolated in this month."
  interpolation_percent_unrate:
    type: number
    minimum: 0
    maximum: 100
    description: "Percentage of unemployment points interpolated in this month."
  interpolation_percent_cons_conf:
    type: number
    minimum: 0
    maximum: 100
    description: "Percentage of consumer‑confidence points interpolated in this month."
  vif_gdp:
    type: number
    description: "VIF for GDP series (monthly view)."
  vif_unrate:
    type: number
    description: "VIF for unemployment series (monthly view)."
  vif_cons_conf:
    type: number
    description: "VIF for consumer confidence series (monthly view)."
additionalProperties: false
