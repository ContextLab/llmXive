$schema: "http://json-schema.org/draft-07/schema#"
title: "MMN Analysis Output Schema"
description: "Schema for validating statistical results and metrics for temporal prediction errors"
type: object
properties:
  metric_id:
    type: string
    description: "Unique identifier for the metric entry"
  condition_label:
    type: string
    enum:
      - "simple"
      - "complex"
    description: "Condition for which the metric was calculated"
  electrode:
    type: string
    description: "Electrode channel name (e.g., 'Fz')"
  amplitude_diff:
    type: number
    description: "Mean voltage difference (deviant - standard) in microvolts"
  latency_diff:
    type: number
    description: "Peak latency difference in milliseconds"
  window_start:
    type: number
    description: "Start of analysis window in milliseconds"
  window_end:
    type: number
    description: "End of analysis window in milliseconds"
  snr_ratio:
    type: number
    description: "Signal-to-Noise Ratio (|mean| / SEM of pre-stimulus baseline [-200, 0]ms)"
  signal_validity:
    type: boolean
    description: "True if SNR >= 3.0"
  t_statistic:
    type: number
    description: "T-statistic from paired t-test"
  p_value:
    type: number
    description: "Raw p-value"
  p_value_fdr:
    type: number
    description: "FDR-corrected p-value (Benjamini-Hochberg)"
  cohen_d:
    type: number
    description: "Effect size (Cohen's d)"
  benchmark_reference:
    type: string
    description: "Source of the effect size benchmark (e.g., 'data/benchmarks/mmn_effect_sizes.json')"
  practical_significance:
    type: boolean
    description: "True if cohen_d >= 0.5"
  topographic_correlation:
    type: ["number", "null"]
    description: "Pearson r vs. canonical template (null if template missing)"
  validation_type:
    type: string
    enum:
      - "consistency_simple"
      - "validity_complex"
    description: "Indicates whether this is a consistency check (simple vs. template) or validity check (complex vs. template)"
  significant:
    type: boolean
    description: "True if p_value_fdr < 0.05"
required:
  - metric_id
  - condition_label
  - electrode
  - amplitude_diff
  - snr_ratio
  - signal_validity
  - p_value_fdr
  - significant
  - benchmark_reference
  - practical_significance
  - validation_type
additionalProperties: false