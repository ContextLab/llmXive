$schema: "http://json-schema.org/draft-07/schema#"
title: PaperManifest
description: "Schema for a single paper's reproducibility manifest metadata."
type: object
required:
  - doi
  - title
  - authors
  - year
  - reported_metrics
  - dataset_info
properties:
  doi:
    type: string
    description: "Digital Object Identifier of the paper."
    pattern: "^10\\..*/.*$"
  title:
    type: string
    description: "Title of the paper."
  authors:
    type: array
    items:
      type: string
    description: "List of author names."
  year:
    type: integer
    minimum: 1900
    maximum: 2100
    description: "Publication year."
  repo_url:
    type: string
    format: uri
    description: "URL to the code repository (if available)."
    nullable: true
  dataset_name:
    type: string
    description: "Name of the primary dataset used in the paper."
  dataset_url:
    type: string
    format: uri
    description: "URL to the dataset."
    nullable: true
  reported_metrics:
    type: object
    required:
      - mae
      - r2
      - rho
    properties:
      mae:
        type: number
        description: "Reported Mean Absolute Error."
      r2:
        type: number
        description: "Reported R-squared value."
      rho:
        type: number
        description: "Reported Spearman's Rho."
      other_metrics:
        type: object
        additionalProperties: true
        description: "Any additional reported metrics."
  experimental_replicates:
    type: integer
    minimum: 0
    description: "Number of experimental replicates reported."
    nullable: true
  reaction_conditions:
    type: object
    description: "Key reaction conditions (temperature, solvent, catalyst loading)."
    properties:
      temperature_c:
        type: number
        description: "Temperature in Celsius."
        nullable: true
      solvent:
        type: string
        description: "Solvent used."
        nullable: true
      catalyst_loading:
        type: string
        description: "Catalyst loading details."
        nullable: true
    nullable: true
  supplementary_files:
    type: array
    items:
      type: string
    description: "List of supplementary file names or paths."
  notes:
    type: string
    description: "Any additional notes or context."
  flags:
    type: array
    items:
      type: string
    description: "List of flags (e.g., 'missing_seed', 'data_gaps')."
    default: []
