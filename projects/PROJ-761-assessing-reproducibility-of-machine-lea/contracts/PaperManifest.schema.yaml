$schema: http://json-schema.org/draft-07/schema#
title: PaperManifest Schema
description: Schema for validating the paper manifest used in reproducibility assessment.
type: object
required:
  - papers
properties:
  papers:
    type: array
    description: List of papers to be assessed.
    items:
      type: object
      required:
        - doi
        - dataset_name
        - reported_metrics
      properties:
        doi:
          type: string
          description: Digital Object Identifier of the paper.
          pattern: "^10\\.[0-9]{4,9}/[-._;()/:A-Z0-9]+$"
        dataset_name:
          type: string
          description: Name of the dataset associated with the paper.
        dataset_url:
          type: string
          description: URL to the dataset (optional if internal).
          format: uri
        repo_url:
          type: string
          description: URL to the code repository (optional).
          format: uri
        reported_metrics:
          type: object
          description: Metrics reported in the paper.
          required:
            - mae
            - r2
          properties:
            mae:
              type: number
              description: Mean Absolute Error reported.
            r2:
              type: number
              description: R-squared value reported.
            rho:
              type: number
              description: Spearman's rho reported (optional).
        experimental_replicates:
          type: integer
          minimum: 1
          description: Number of experimental replicates (optional).
        reaction_conditions:
          type: object
          description: Conditions under which experiments were run (optional).
          properties:
            temperature:
              type: number
              description: Temperature in Celsius.
            solvent:
              type: string
              description: Solvent used.
            catalyst_loading:
              type: number
              description: Catalyst loading percentage.
        yield_std_dev:
          type: number
          description: Standard deviation of reported yields (optional).
        supplementary_files:
          type: array
          items:
            type: string
          description: List of supplementary file patterns or names.
