[project]
name = "llmxive-reproducibility"
version = "0.1.0"
description = "Assessing Reproducibility of Machine-Learned Reaction Yield Models"
requires-python = ">=3.11"
dependencies = [
    "torch==2.2.0+cpu",
    "scikit-learn==1.5.0",
    "rdkit==2024.3.1",
    "statsmodels==0.14.1",
    "pandas==2.2.0",
    "numpy==1.26.0",
    "matplotlib==3.8.0",
    "pyyaml==6.0.1",
    "requests==2.31.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
]
ignore = []

[tool.ruff.isort]
known-first-party = ["code"]
force-sort-within-sections = true
