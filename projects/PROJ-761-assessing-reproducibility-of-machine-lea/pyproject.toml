[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-reproducibility"
version = "0.1.0"
description = "Assessing Reproducibility of Machine-Learned Reaction Yield Models"
requires-python = ">=3.11"
dependencies = [
    "torch==2.2.0+cpu",
    "scikit-learn==1.5.0",
    "rdkit==2024.3.1",
    "statsmodels==0.14.1",
    "pandas==2.2.0",
    "numpy==1.26.0",
    "matplotlib==3.8.0",
    "pyyaml==6.0.1",
    "requests==2.31.0",
    "ruff==0.4.0",
    "black==24.3.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]