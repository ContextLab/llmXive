$schema: "http://json-schema.org/draft-07/schema#"
title: "Dynamic ROI‑Based Connectivity Descriptors per Window"
type: object
required:
  - subject_id
  - window_id
  - window_seconds
  - step_seconds
  - global_efficiency
  - modularity
  - participation_coefficient
properties:
  subject_id:
    type: string
    description: "Participant identifier."
  window_id:
    type: integer
    minimum: 0
    description: "Sliding‑window index (starting at 0)."
  window_seconds:
    type: number
    enum: [30, 45, 60]
    description: "Window size in seconds."
  step_seconds:
    type: number
    enum: [5, 10]
    description: "Step size in seconds."
  global_efficiency:
    type: number
    description: "Weighted global efficiency computed on the ROI‑based graph. NOTE: nodes are Schaefer ROI parcels, NOT vertex‑block groups; this is an ROI‑based connectivity descriptor."
  modularity:
    type: number
    description: "Louvain modularity score (seeded) of the ROI‑based graph. ROI‑based connectivity descriptor."
  participation_coefficient:
    type: number
    description: "Node‑averaged participation coefficient over Louvain communities of the ROI‑based graph. ROI‑based connectivity descriptor."
additionalProperties: false