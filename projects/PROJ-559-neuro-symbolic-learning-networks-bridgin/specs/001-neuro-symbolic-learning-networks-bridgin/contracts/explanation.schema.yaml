$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  explanation_id:
    type: string
    description: "Unique identifier for the explanation."
  problem_id:
    type: string
    description: "Foreign key to the problem."
  condition:
    type: string
    enum:
      - neural
      - symbolic
      - neuro-symbolic
    description: "The type of explanation."
  content:
    type: string
    description: "The full text of the explanation."
  trace:
    type: string
    nullable: true
    description: "Optional symbolic trace or derivation steps."
  model_version:
    type: string
    description: "Version of the model used."
required:
  - explanation_id
  - problem_id
  - condition
  - content
  - model_version
additionalProperties: false
