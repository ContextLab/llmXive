$schema: "http://json-schema.org/draft-07/schema#"
title: "Explanation Schema"
description: "Schema for a generated explanation artifact."
type: "object"
required:
  - "explanation_id"
  - "problem_id"
  - "condition"
  - "content"
  - "model_version"
  - "generation_timestamp"
properties:
  explanation_id:
    type: "string"
    description: "Unique identifier for the explanation."
  problem_id:
    type: "string"
    description: "Foreign key to the problem."
  condition:
    type: "string"
    enum:
      - "neural"
      - "symbolic"
      - "neuro_symbolic"
    description: "The explanation condition."
  content:
    type: "string"
    description: "The generated explanation text."
  model_version:
    type: "string"
    description: "Version of the model used for generation."
  generation_timestamp:
    type: "string"
    format: "date-time"
    description: "ISO 8601 timestamp of generation."
additionalProperties: false
