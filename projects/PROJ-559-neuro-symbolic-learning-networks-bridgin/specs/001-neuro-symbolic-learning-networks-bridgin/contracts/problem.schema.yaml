$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  problem_id:
    type: string
    description: "Unique identifier for the problem."
  prompt_text:
    type: string
    description: "The problem statement."
  solution:
    type: string
    description: "The correct solution or answer key."
  difficulty:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Estimated difficulty score."
  skill:
    type: string
    description: "The skill or concept being tested."
required:
  - problem_id
  - prompt_text
  - solution
  - difficulty
  - skill
additionalProperties: false
