$schema: "http://json-schema.org/draft-07/schema#"
title: "Problem Schema"
description: "Schema for a single math/logic problem instance."
type: "object"
required:
  - "problem_id"
  - "prompt_text"
  - "solution"
properties:
  problem_id:
    type: "string"
    description: "Unique identifier for the problem."
  prompt_text:
    type: "string"
    description: "The text of the problem statement."
  solution:
    type: "string"
    description: "The correct solution or steps."
  subject:
    type: "string"
    description: "Subject category (e.g., algebra, geometry)."
  difficulty_score:
    type: "number"
    description: "Inferred or provided difficulty score."
    minimum: 0
    maximum: 10
additionalProperties: false
