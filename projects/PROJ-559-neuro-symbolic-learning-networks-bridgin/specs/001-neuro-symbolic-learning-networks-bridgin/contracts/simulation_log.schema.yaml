$schema: "http://json-schema.org/draft-07/schema#"
type: "object"
properties:
  log_id:
    type: "string"
    description: "Unique identifier for the log entry."
  problem_id:
    type: "string"
    description: "Foreign key to the problem."
  student_id:
    type: "string"
    description: "Unique identifier for the student."
  condition:
    type: "string"
    enum:
      - "neural"
      - "symbolic"
      - "neuro_symbolic"
    description: "The explanation condition."
  correct:
    type: "integer"
    enum:
      - 0
      - 1
    description: "Binary correctness."
  rt_seconds:
    type: "number"
    minimum: 0.0
    description: "Response time in seconds."
  comprehension_rating:
    type: "integer"
    minimum: 1
    maximum: 5
    description: "Self-reported comprehension rating."
  data_source:
    type: "string"
    enum:
      - "simulated"
      - "real"
    description: "Source of the data."
required:
  - "log_id"
  - "problem_id"
  - "student_id"
  - "condition"
  - "correct"
  - "rt_seconds"
  - "comprehension_rating"
  - "data_source"
additionalProperties: false
