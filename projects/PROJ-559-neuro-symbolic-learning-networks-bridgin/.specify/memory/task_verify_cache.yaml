T033:
  c: false
  h: 7c520474a2c698514457b8fd8aa6522b8bbd06059343825d8e6d1b8374f4b04f
  r: The repository contains `code/simulate/bkt_params.yaml`, but its contents are
    static defaults and there is no evidence the file was actually updated based on
