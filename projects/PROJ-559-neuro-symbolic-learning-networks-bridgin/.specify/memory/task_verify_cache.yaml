  r: The repository contains `code/simulate/calibration.py`, but the file is truncated
    and there is no evidence that it writes `data/pilot/calibration_report.json` (the
    file is missing). Consequently the required deliverable and the logic for setting
    `limitation_flag` and exiting on threshold failures are not present. The next
    implementer must ensure the script generates the calibration report (including
    the flag) and updates `bkt_params.yaml` as specified.
