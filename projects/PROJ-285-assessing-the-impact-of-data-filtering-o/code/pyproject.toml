[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lens-filtering-pipeline"
version = "0.1.0"
description = "Assessing the impact of data filtering on gravitational lens detection rates"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "astropy",
    "scipy",
    "matplotlib",
    "numpy",
    "statsmodels",
    "requests",
    "pyyaml",
    "datasets",
    "psutil",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
