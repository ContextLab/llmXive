# Ruff configuration for llmXive HEA project
# Matches Black formatting defaults for consistency

line-length = 88
target-version = "py310"

[lint]
# Enable pycodestyle (E), Pyflakes (F), and isort (I) rules
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = [
  "E501", # Line too long (handled by Black)
  "E731", # Do not assign a lambda expression, use a def
]

[lint.isort]
known-first-party = ["config", "data_ingestion", "download_hmao", "setup_dirs"]
force-single-line = true
lines-after-imports = 2

[format]
# Black-compatible formatting settings
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
