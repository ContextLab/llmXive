$schema: "http://json-schema.org/draft-07/schema#"
title: "HEA Training Set Schema"
description: "Schema for the processed HEA training dataset containing compositional descriptors and thermodynamic targets."
type: "object"
properties:
  composition_id:
    type: "string"
    description: "Unique hash of the composition string."
  composition_str:
    type: "string"
    description: "Normalized composition string (e.g., 'FeCoNiCrMn')."
  formation_energy_per_atom:
    type: "number"
    description: "Target variable: Formation energy per atom (eV/atom)."
  mixing_enthalpy:
    type: "number"
    description: "Target variable: Mixing enthalpy (kJ/mol)."
  atomic_radius_mean:
    type: "number"
    description: "Weighted mean atomic radius (pm)."
  atomic_radius_var:
    type: "number"
    description: "Variance of atomic radius."
  electronegativity_mean:
    type: "number"
    description: "Weighted mean electronegativity (Pauling)."
  electronegativity_var:
    type: "number"
    description: "Variance of electronegativity."
  vec_mean:
    type: "number"
    description: "Weighted mean Valence Electron Count."
  vec_var:
    type: "number"
    description: "Variance of VEC."
  melting_point_mean:
    type: "number"
    description: "Weighted mean melting point (K)."
  melting_point_var:
    type: "number"
    description: "Variance of melting point."
required:
  - composition_id
  - composition_str
  - formation_energy_per_atom
  - mixing_enthalpy
  - atomic_radius_mean
  - atomic_radius_var
  - electronegativity_mean
  - electronegativity_var
  - vec_mean
  - vec_var
  - melting_point_mean
  - melting_point_var
additionalProperties: false
