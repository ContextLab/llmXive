$schema: "http://json-schema.org/draft-07/schema#"
title: "HEA Dataset Schema"
description: "Schema for processed HEA datasets (train, holdout, novel)"
type: object
properties:
  composition_id:
    type: string
    description: "Unique SHA256 hash of the sorted composition string"
  formula:
    type: string
    description: "Human-readable chemical formula (e.g., CoCrFeMnNi)"
  elements:
    type: array
    items:
      type: string
    description: "List of constituent elements"
  formation_energy:
    type: number
    description: "Formation energy in eV/atom"
    minimum: -100
    maximum: 100
  mixing_enthalpy:
    type: number
    description: "Mixing enthalpy in kJ/mol"
    minimum: -500
    maximum: 500
  radius_mean:
    type: number
    description: "Weighted mean atomic radius"
  radius_var:
    type: number
    description: "Weighted variance of atomic radius (clamped >= 1e-6)"
    minimum: 0.000001
  electroneg_mean:
    type: number
    description: "Weighted mean electronegativity"
  electroneg_var:
    type: number
    description: "Weighted variance of electronegativity (clamped >= 1e-6)"
    minimum: 0.000001
  vec_mean:
    type: number
    description: "Weighted mean valence electron count"
  vec_var:
    type: number
    description: "Weighted variance of VEC (clamped >= 1e-6)"
    minimum: 0.000001
  melting_mean:
    type: number
    description: "Weighted mean melting point (K)"
  melting_var:
    type: number
    description: "Weighted variance of melting point (clamped >= 1e-6)"
    minimum: 0.000001
required:
  - composition_id
  - formula
  - elements
  - formation_energy
  - radius_mean
  - radius_var
  - electroneg_mean
  - electroneg_var
  - vec_mean
  - vec_var
  - melting_mean
  - melting_var
additionalProperties: false