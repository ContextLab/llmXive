$schema: "http://json-schema.org/draft-07/schema#"
title: "Performance Metrics Schema"
description: "Schema for aggregated performance metrics and statistical test results."
type: object
properties:
  metric_name:
    type: string
    description: "Name of the metric (e.g., 'interpolation_R2', 'extrapolation_R2')."
  value:
    type: number
    description: "The measured value of the metric."
  p_value:
    type: number
    minimum: 0
    maximum: 1
    description: "P-value from the statistical test (e.g., permutation test, Spearman)."
  test_type:
    type: string
    enum: ["mann-whitney", "spearman", "cv", "none"]
    description: "Type of statistical test used."
  dataset:
    type: string
    enum: ["train", "holdout", "novel"]
    description: "Dataset the metric applies to."
required:
  - metric_name
  - value
  - test_type
  - dataset
additionalProperties: false
