$schema: "http://json-schema.org/draft-07/schema#"
title: "Prediction Output Schema"
description: "Schema for the model predictions and uncertainty metrics"
type: "object"
properties:
  composition_id:
    type: "string"
    description: "Unique hash of the composition string"
  composition:
    type: "string"
    description: "Original composition string"
  target_energy:
    type: ["number", "null"]
    description: "Ground truth formation energy (null for True Novel set)"
  pred_energy:
    type: "number"
    description: "Predicted formation energy (eV/atom)"
  pred_std:
    type: "number"
    description: "Ensemble standard deviation (uncertainty metric)"
  distance_to_hull:
    type: "number"
    description: "Distance from the training convex hull in descriptor feature space"
  is_novel:
    type: "boolean"
    description: "True if the composition is in the 'True Novel' set (absent from AFLOW union)"
required:
  - composition_id
  - composition
  - pred_energy
  - pred_std
  - distance_to_hull
  - is_novel
additionalProperties: false