$schema: "http://json-schema.org/draft-07/schema#"
title: "Model Results Schema"
description: "Schema for the final model evaluation metrics and diagnostics."
type: "object"
properties:
  model_type:
    type: "string"
    enum: ["RandomForest", "ElasticNet"]
    description: "The type of model used."
  cv_strategy:
    type: "string"
    enum: ["PVR", "StratifiedKFold"]
    description: "Cross‑validation/Phylogenetic control strategy used."
  performance:
    type: "object"
    required:
      - r2_test
      - r2_perm_mean
      - p_permutation
    properties:
      r2_test:
        type: "number"
        description: "R² score on the hold‑out test set."
      r2_perm_mean:
        type: "number"
        description: "Mean R² from label permutation baseline . "
      p_permutation:
        type: "number"
        minimum: 0
        maximum: 1
        description: "P value from the ... "
      p_pic:
        type: "number"
        minimum: 0
        maximum: 1
        description: "P value for the ... "
        default: null
    ...