$schema: "http://json-schema.org/draft-07/schema#"
title: "Aligned Dataset Schema"
description: "Schema for the final aligned feature‑target matrix used in modeling."
type: "object"
properties:
  metadata:
    type: "object"
    properties:
      species_count:
        type: "integer"
        minimum: 1
        description: "Number of species with complete genome and metabolite data."
      clade_count:
        type: "integer"
        minimum: 1
        description: "Distinct phylogenetic clades represented."
      bgc_columns:
        type: "array"
        items:
          type: "string"
        description: "Names of BGC type columns."
      metabolite_columns:
        type: "array"
        items:
          type: "string"
        description: "InChIKey identifiers for metabolite columns."
      is_mock:
        type: "boolean"
        description: "True if the dataset is synthetic/mock for CI validation."
    required:
      - species_count
      - clade_count
      - bgc_columns
      - metabolite_columns
      - is_mock
  data:
    type: "array"
    description: "Array of aligned records, one per species."
    items:
      type: "object"
      required:
        - species_id
        - clade
        - bgc_features
        - metabolite_targets
      properties:
        species_id:
          type: "string"
          description: "Unique identifier (scientific name)."
        clade:
          type: "string"
          description: "Phylogenetic clade."
        bgc_features:
          type: "object"
          description: "Mapping BGC type → count (integer ≥ 0)."
          additionalProperties:
            type: "integer"
            minimum: 0
        metabolite_targets:
          type: "object"
          description: "Mapping InChIKey → log‑transformed abundance (finite float)."
          additionalProperties:
            type: "number"
            minimum: -1000
            maximum: 1000
required:
  - metadata
  - data
additionalProperties: false
