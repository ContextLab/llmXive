[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-plant-metabolite"
version = "0.1.0"
description = "Predicting Plant Secondary Metabolite Profiles from Genomic Data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "pyyaml>=6.0.1",
    "requests>=2.32.3",
    "biopython>=1.83",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "scikit-learn>=1.5.1",
    "statsmodels>=0.14.2",
    "scipy>=1.13.1",
    "dendropy>=4.6.2",
    "tqdm>=4.66.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.1",
    "black>=24.4.2",
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-v --tb=short"
