# Project configuration file
[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive-plant-metabolite-pipeline"
version = "0.1.0"
description = "Predicting Plant Secondary Metabolite Profiles from Genomic Data"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "scikit-learn",
    "pandas",
    "numpy",
    "biopython",
    "requests",
    "pyyaml",
    "dendropy",
    "statsmodels",
    "pymc3",
    "tqdm",
    "pydantic",
    "pydantic-settings",
    "black",
    "ruff",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
]

[tool.setuptools]
packages = ["code", "tests"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
