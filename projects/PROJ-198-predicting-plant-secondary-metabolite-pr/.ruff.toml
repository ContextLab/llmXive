# Ruff configuration for PROJ-198
line-length = 88
target-version = "py311"

[lint]
# E: pycodestyle errors, W: pycodestyle warnings, F: Pyflakes, I: isort, C: flake8-comprehensions, B: flake8-bugbear
select = ["E", "W", "F", "I", "C", "B"]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[lint.per-file-ignores]
"tests/*" = ["S101", "F821", "F822", "F823", "F841"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
