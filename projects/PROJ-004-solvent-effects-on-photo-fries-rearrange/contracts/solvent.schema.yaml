$schema: http://json-schema.org/draft-07/schema#
title: Solvent Properties Schema
description: |
  Schema for validating solvent property data used in the Photo-Fries rearrangement study.
  Sources must align with established chemical databases as per T006a.
  Enforces strict typing for dielectric constants to satisfy reproducibility requirements.
type: object
required:
  - name
  - dielectric_constant
  - source_id
  - citation_url
properties:
  name:
    type: string
    description: Common chemical name of the solvent (e.g., "Acetonitrile")
    minLength: 1
  dielectric_constant:
    type: number
    description: Relative permittivity (dielectric constant) at 25°C
    minimum: 0
    exclusiveMinimum: false
    metadata:
      unit: "dimensionless"
      reference_temp: "25°C"
  source_id:
    type: string
    description: Identifier for the data source (e.g., NIST-SRD-69, CRC-Handbook)
    minLength: 1
  citation_url:
    type: string
    description: URL to the primary source or reference for the dielectric constant value
    format: uri
  temperature_celsius:
    type: number
    description: Temperature at which dielectric constant was measured
    default: 25.0
    metadata:
      unit: "Celsius"
  notes:
    type: string
    description: Optional notes regarding purity or specific conditions
additionalProperties: false