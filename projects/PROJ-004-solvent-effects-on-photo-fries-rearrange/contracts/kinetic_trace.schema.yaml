$schema: http://json-schema.org/draft-07/schema#
title: Kinetic Trace Data Schema
description: |
  Schema for validating transient-absorption kinetic trace data collected
  during Photo-Fries rearrangement experiments across solvent conditions.
  
  This schema ensures that raw and processed traces contain necessary metadata
  for reproducibility, environmental compliance, and integration with the
  experimental workflow defined by User Stories 1-3:
  
  - US-1: Solvent series configuration with environmental logging (FR-001, FR-003)
  - US-2: Radical-pair lifetime extraction via global kinetic analysis (FR-002, FR-004, FR-007)
  - US-3: Correlation of solvation energy with lifetimes (FR-005, FR-006)
  
  It defines the structure for individual trace records with required fields
  for solvent identification, temporal resolution, environmental context,
  instrument calibration, and data quality metrics.

type: object
required:
  - trace_id
  - solvent_name
  - timestamp_utc
  - time_series
  - absorbance_series
  - environmental_context
  - calibration_metadata

properties:
  trace_id:
    type: string
    description: |
      Unique identifier for this specific trace run.
      Format: TR-YYYY-NNNNNN where YYYY is year and NNNNNN is 6-char alphanumeric.
    pattern: "^TR-[0-9]{4}-[A-Z0-9]{6}$"
    example: "TR-2026-ABC123"
  
  solvent_name:
    type: string
    description: |
      Name of the solvent used, must match an entry in solvents.yaml (T006b).
      Enables cross-reference with solvent properties (dielectric constant, etc.)
      for US-1 validation and US-3 correlation analysis.
    enum:
      - cyclohexane
      - toluene
      - dichloromethane
      - ethanol
      - methanol
      - acetonitrile
      - water
  
  timestamp_utc:
    type: string
    format: date-time
    description: |
      ISO 8601 timestamp of data acquisition start (UTC).
      Required for temporal ordering and environmental condition lookup.
    example: "2026-05-20T14:30:00Z"
  
  run_id:
    type: string
    description: |
      Unique identifier for the experimental run (generated by T015f).
      Links this trace to environment logs (T014) and calibration records (T016).
    pattern: "^RUN-[0-9]{10}$"
    example: "RUN-1716193800"
  
  replicate_number:
    type: integer
    description: |
      Replicate identifier for this solvent condition (1-based).
      Required for US-2 (n >= 3 replicates per solvent) and US-3 (replicate statistics).
    minimum: 1
    maximum: 100
  
  temperature_celsius:
    type: number
    description: |
      Sample temperature during acquisition (°C).
      Must satisfy FR-003 tolerance: 25 ± 0.5°C.
    minimum: 24.5
    maximum: 25.5
  
  relative_humidity_percent:
    type: number
    description: |
      Ambient relative humidity during acquisition (%).
      Must satisfy FR-003 tolerance: target ± 2% RH.
    minimum: 0
    maximum: 100
  
  barometric_pressure_hpa:
    type: number
    description: |
      Barometric pressure during acquisition (hPa).
      Required for environmental context logging (FR-007, T014).
    minimum: 900
    maximum: 1100
  
  instrument_model:
    type: string
    description: |
      Model of the transient absorption spectrometer.
      Required for instrument registry (T035) and calibration tracking (T016).
    example: "Edinburgh Instruments LP980"
  
  laser_wavelength_nm:
    type: number
    description: |
      Excitation laser wavelength (nm).
      Required for Photo-Fries activation (typically 308 nm for XeCl excimer).
    minimum: 100
    maximum: 10000
  
  detector_wavelength_nm:
    type: number
    description: |
      Monitoring wavelength for absorbance detection (nm).
      Typically in UV-Vis range for aryl esters.
    minimum: 100
    maximum: 10000
  
  time_series:
    type: array
    description: |
      Array of time points relative to laser pulse (microseconds).
      Must cover ns–μs time range (FR-002) for kinetic analysis.
    items:
      type: number
      minimum: 0
    minItems: 10
    example: [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0]
  
  absorbance_series:
    type: array
    description: |
      Array of absorbance values (mOD) corresponding to time_series.
      Raw detector signal before calibration correction.
    items:
      type: number
    minItems: 10
    example: [1000, 950, 850, 700, 500, 300, 150, 75, 25, 10]
  
  calibration_metadata:
    type: object
    description: |
      Instrument calibration information applied to this trace.
      Required for FR-004 (calibration validation) and T016 (calibration pipeline).
    required:
      - calibration_factor
      - calibration_timestamp_utc
      - calibration_source
    properties:
      calibration_factor:
        type: number
        description: Applied calibration factor for detector response.
        minimum: 0
        exclusiveMinimum: true
      
      calibration_timestamp_utc:
        type: string
        format: date-time
        description: When the calibration was performed.
      
      calibration_source:
        type: string
        description: |
          Reference for calibration (e.g., "certified_standard", "instrument_internal").
        enum:
          - certified_standard
          - instrument_internal
          - external_lab
      
      wavelength_calibration_error_nm:
        type: number
        description: |
          Wavelength calibration error (nm). Diagnostic for detector stability.
        minimum: -10
        maximum: 10
      
      baseline_stability_percent:
        type: number
        description: |
          Baseline absorbance drift as % of signal. Flag if > 5% (per spec edge case).
        minimum: 0
        maximum: 100
  
  environmental_context:
    type: object
    description: |
      Detailed environmental logging block for FR-007 compliance.
      Ensures reproducibility and environmental validation (T017a).
    required:
      - lab_humidity
      - sample_cell_temp
    properties:
      lab_humidity:
        type: number
        description: Lab ambient humidity (%).
        minimum: 0
        maximum: 100
      
      sample_cell_temp:
        type: number
        description: Sample cell temperature (°C).
        minimum: 20
        maximum: 30
      
      barometric_pressure_hpa:
        type: number
        description: Barometric pressure (hPa).
        minimum: 900
        maximum: 1100
      
      substrate_mass_mg:
        type: number
        description: |
          Mass of substrate (phenyl benzoate, mg).
          Required for FR-007 logging.
        minimum: 0
        exclusiveMinimum: true
      
      integration_time_ms:
        type: number
        description: |
          Integration time per scan (milliseconds).
          Required for FR-007 logging.
        minimum: 0
        exclusiveMinimum: true
      
      solvent_batch_id:
        type: string
        description: |
          Batch identifier for solvent (manufacturer lot number).
          Enables chemical provenance tracking.
        example: "LOT-2026-05-001"
    
    additionalProperties: false
  
  data_quality_metrics:
    type: object
    description: Quality flags and metrics for this trace.
    properties:
      signal_to_noise_ratio:
        type: number
        description: Estimated SNR for the trace.
        minimum: 0
      
      baseline_rms_noise_mOD:
        type: number
        description: RMS noise in baseline (pre-laser) region.
        minimum: 0
      
      peak_absorbance_mOD:
        type: number
        description: Maximum absorbance value in trace.
        minimum: 0
      
      trace_validity_flag:
        type: boolean
        description: |
          True if trace passes quality checks (SNR > 3, no saturation, etc.).
        default: true
      
      outlier_flag:
        type: boolean
        description: |
          True if lifetime from this trace is flagged as outlier (> 2σ from replicate mean).
          Set during US-2 analysis (T022).
        default: false
      
      exclusion_reason:
        type: string
        description: |
          If excluded from analysis, the reason (e.g., "baseline_drift_exceeded",
          "photodegradation_detected", "humidity_excursion").
        enum:
          - none
          - baseline_drift_exceeded
          - photodegradation_detected
          - humidity_excursion
          - temperature_excursion
          - instrumental_failure
          - user_flagged
        default: "none"
    
    additionalProperties: false
  
  derived_lifetime_ns:
    type: number
    description: |
      Lifetime extracted from this trace (nanoseconds).
      Populated during US-2 kinetic analysis (T022).
      Optional field: may be null if analysis not yet performed.
    minimum: 0
    nullable: true
  
  replicate_statistics:
    type: object
    description: |
      Statistics computed across replicates for this solvent (US-2, T022).
      Optional: populated during replicate aggregation.
    properties:
      mean_lifetime_ns:
        type: number
        description: Mean lifetime across replicates.
        minimum: 0
      
      std_dev_lifetime_ns:
        type: number
        description: Standard deviation of lifetime across replicates.
        minimum: 0
      
      n_replicates:
        type: integer
        description: Number of replicates for this solvent.
        minimum: 1
      
      confidence_interval_lower_ns:
        type: number
        description: Lower bound of 95% confidence interval.
        minimum: 0
      
      confidence_interval_upper_ns:
        type: number
        description: Upper bound of 95% confidence interval.
        minimum: 0
    
    additionalProperties: false

additionalProperties: false