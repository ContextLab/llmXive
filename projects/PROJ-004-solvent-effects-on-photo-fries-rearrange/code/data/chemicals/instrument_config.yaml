# Instrument Configuration for Transient Absorption Spectroscopy
# This file defines the hardware used for kinetic measurements.
# If this file is missing or the 'model' key is absent, the system
# defaults to "Generic Transient Absorption Spectrometer" to ensure
# vendor agnosticism (per Marie Curie review on missing instrument definition).

instrument:
  model: "Generic Transient Absorption Spectrometer"
  vendor: "Internal Simulation"
  serial_number: "N/A"
  calibration_date: "2026-01-01"
  detection_limit: "1.0e-5"
  units: "OD"
  temporal_resolution_ns: 5
  wavelength_range_nm:
    start: 300
    end: 800
  notes: "Default configuration used when specific hardware details are unavailable."
