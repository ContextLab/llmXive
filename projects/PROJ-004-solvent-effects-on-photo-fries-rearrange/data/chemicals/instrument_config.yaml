# Instrument Configuration for Transient-Absorption Spectrometer
# This file defines the instrument model, detector type, and calibration parameters
# as required by Marie Curie's review for reproducibility and instrument definition.

instrument_model: "Edinburgh Instruments LP980"
detector_type: "Photomultiplier Tube"
serial_number: "LP980-2024-001"
manufacturer: "Edinburgh Instruments Ltd."

# Performance specifications
detection_limit_absorbance: 0.001
wavelength_range:
  min_nm: 200
  max_nm: 800

temporal_resolution:
  min_ns: 0.1
  max_us: 1000

dynamic_range: "6 orders of magnitude"

# Calibration standards
calibration_standards:
  - "Holmium Oxide Filter"
  - "Deuterium Lamp"
  - "NIST Traceable Neutral Density Filters"

# Calibration metadata
last_calibration_date: "2024-01-15"
next_calibration_due: "2025-01-15"

# Accuracy specifications
wavelength_accuracy: "±0.5 nm"
absorbance_accuracy: "±0.005 AU"

# Detection capabilities
snr_at_limit: 3.0
integration_time_range:
  min_ms: 1
  max_ms: 10000
