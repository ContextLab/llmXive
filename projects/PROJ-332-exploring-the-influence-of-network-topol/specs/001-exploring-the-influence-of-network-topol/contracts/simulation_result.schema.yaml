# Schema for simulation_results.csv output
# Generated for PROJ-332: Influence of Network Topology on Thermal Conductivity
# This schema defines the exact columns and types expected in data/processed/simulation_results.csv

type: object
description: "Schema for a single row of simulation results from the nanowire network thermal conductivity study"
properties:
  seed:
    type: integer
    description: "Random seed used for the simulation run"
  N:
    type: integer
    description: "Number of nodes in the generated network"
  p:
    type: number
    format: float
    description: "Connection probability (edge probability) used in graph generation"
  avg_degree:
    type: number
    format: float
    description: "Calculated average degree of the generated network"
  conductivity:
    type: number
    format: float
    description: "Effective thermal conductivity in W/(m·K)"
  connectivity_probability:
    type: number
    format: float
    description: "Fraction of generated graphs that were connected (batch metric)"
  percolation_threshold:
    type: number
    format: float
    description: "Calculated percolation threshold (degree at which P(connected)=0.50)"
  convergence_rate:
    type: number
    format: float
    description: "Rate at which the solver converged (iterations or residual metric)"
  pilot_variance:
    type: number
    format: float
    description: "Variance of conductivity from the pilot study (N=10) in W²/(m²·K²)"
  required_sample_size:
    type: integer
    description: "Calculated required sample size based on pilot variance and power analysis"
  final_sample_size:
    type: integer
    description: "Actual number of simulations run for this batch (may be adjusted)"
  adjustment_triggered:
    type: boolean
    description: "Whether dynamic sample size adjustment was triggered"
  adjustment_reason:
    type: string
    description: "Text explanation for any sample size adjustment (e.g., 'High pilot variance detected')"

required:
  - seed
  - N
  - p
  - avg_degree
  - conductivity
  - connectivity_probability
  - percolation_threshold
  - convergence_rate
  - pilot_variance
  - required_sample_size
  - final_sample_size
  - adjustment_triggered
  - adjustment_reason

additionalProperties: false