$schema: "http://json-schema.org/draft-07/schema#"
title: "SimulationResult"
description: "Schema for a single row in data/processed/simulation_results.csv (includes global stats)"
type: "object"
properties:
  seed:
    type: integer
    description: "Random seed used for generation"
  N:
    type: integer
    description: "Number of nodes in the graph"
    const: 1000
  p:
    type: number
    description: "Connection probability"
    minimum: 0.0
    maximum: 1.0
  target_degree:
    type: number
    description: "Target average degree specified by user"
  avg_degree:
    type: number
    description: "Actual average degree of the generated graph (mapped from measured_degree to satisfy FR-009)"
  percolation_status:
    type: boolean
    description: "True if source-sink path exists"
  k_eff:
    type: number
    description: "Effective thermal conductivity in W/(m·K)"
    minimum: 0.0
  avg_path_length:
    type: number
    description: "Average shortest path length (Infinity if disconnected)"
    minimum: 0.0
  clustering_coeff:
    type: number
    description: "Global clustering coefficient"
    minimum: 0.0
    maximum: 1.0
  convergence_rate:
    type: number
    description: "L2 residual norm of the solver"
    minimum: 0.0
  total_runtime:
    type: number
    description: "Execution time in seconds"
    minimum: 0.0
  material_name:
    type: string
    description: "Name of the material used (e.g., Si, CNT)"
  percolation_threshold:
    type: number
    description: "Global percolation threshold (k_c_80) estimated via FR-017"
  scaling_exponent_t:
    type: number
    description: "Global scaling exponent t from power-law fit"
  p_value:
    type: number
    description: "Global p-value from regression (test H0: t=0)"
  R_squared:
    type: number
    description: "Goodness-of-fit metric (R^2)"
    minimum: 0.0
    maximum: 1.0
required:
  - seed
  - N
  - p
  - target_degree
  - avg_degree
  - percolation_status
  - k_eff
  - avg_path_length
  - clustering_coeff
  - convergence_rate
  - total_runtime
  - material_name
  - percolation_threshold
  - scaling_exponent_t
  - p_value
  - R_squared
additionalProperties: false