access_python: "import GEOparse\nimport pandas as pd\n# GSE36520 is the core BrainSpan\
  \ Developmental Transcriptome dataset\ngse = GEOparse.get_GEO(geo=\"GSE36520\",\
  \ destdir=\"./\")\n# Phenotype data contains metadata (developmental stage, donor,\
  \ etc.)\nmeta = gse.phenotype_data\n# pivot_samples extracts the expression values\n\
  expr = gse.pivot_samples('VALUE')\n# Combine metadata and expression into one dataframe\n\
  df = meta.join(expr.T)\n# Mapping: \n# developmental_stage -> 'age'\n# donor_id\
  \ -> 'source_name_ch1'\n# sample_id & cell_id -> df.index (BrainSpan is bulk RNA-seq,\
  \ so sample=cell)\n# gene_expression_counts -> the expression columns\nprint(f\"\
  RECORDS={len(df)}\")\nprint(\"FIELDS=gene_expression_counts,cell_id,developmental_stage,donor_id,sample_id\"\
  )"
