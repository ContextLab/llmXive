# Global processing parameters
processing_params:
  software_version: "0.1.0"
  python_version: "3.9"
  random_seed: 42
  cloud_coverage_threshold: 0.8
  spatial_resolution: "10m"
  temporal_resolution: "10-day"

# Data sources and their metadata
data_sources:
  - name: "sentinel-s2-l2a"
    type: "satellite"
    provider: "Google Earth Engine"
    endpoint: "projects/earthengine/asset/Sentinel_S2_L2A"
    date_range:
      start: "2018-01-01"
      end: "2023-12-31"
    bands:
      - "B04"  # Red
      - "B08"  # NIR
      - "B05"  # Red Edge 1
      - "B06"  # Red Edge 2
      - "B07"  # Red Edge 3
      - "B11"  # SWIR 1
      - "B12"  # SWIR 2
    processing_level: "L2A"
    checksums: {}
    status: "pending"
    last_accessed: null
    
  - name: "noaa-ghcn-daily"
    type: "climate"
    provider: "NOAA"
    endpoint: "https://www.ncei.noaa.gov/access/services/data/v1/dataset/ghcn-daily"
    date_range:
      start: "2018-01-01"
      end: "2023-12-31"
    variables:
      - "TMAX"  # Maximum temperature
      - "TMIN"  # Minimum temperature
      - "PRCP"  # Precipitation
      - "SOLAR" # Solar radiation (from POWER API)
    checksums: {}
    status: "pending"
    last_accessed: null
    
  - name: "nasa-power"
    type: "climate"
    provider: "NASA POWER"
    endpoint: "https://power.larc.nasa.gov/api"
    date_range:
      start: "2018-01-01"
      end: "2023-12-31"
    variables:
      - "T2M_MAX"
      - "T2M_MIN"
      - "PRECTOTCORR"
      - "SOLAR"
    checksums: {}
    status: "pending"
    last_accessed: null
    
  - name: "nature-notebook"
    type: "phenology"
    provider: "USA National Phenology Network"
    endpoint: "https://www.usanpn.org/api/v2/observations"
    date_range:
      start: "2018-01-01"
      end: "2023-12-31"
    species:
      - "Acer saccharum"
      - "Quercus alba"
      - "Prunus serotina"
      - "Betula alleghaniensis"
      - "Fraxinus pennsylvanica"
    events:
      - "leaf_out"
      - "flowering"
      - "fruiting"
      - "leaf_color_change"
      - "leaf_drop"
    checksums: {}
    status: "pending"
    last_accessed: null

