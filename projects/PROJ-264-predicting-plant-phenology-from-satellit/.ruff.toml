# Ruff configuration file
# This file is referenced by pyproject.toml but can also be used standalone
line-length = 88
target-version = "py39"

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
]
ignore = [
    "E501",
    "B008",
]

[lint.per-file-ignores]
"code/tests/*" = ["S101"] # Allow assert in tests

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"