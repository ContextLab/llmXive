[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxive"
version = "0.1.0"
description = "Automated scientific-discovery pipeline driven by Spec-Kit-per-project agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Contextual Dynamics Lab", email = "research.computing@dartmouth.edu" }]
dependencies = [
  # LLM / agent framework
  "langchain>=0.3",
  "langchain-dartmouth>=0.3.1",
  "huggingface_hub",
  # Data validation
  "pydantic>=2",
  "jsonschema",
  # Operational
  "tenacity",
  "pyyaml",
  "httpx",
  "gitpython",
  "arxiv",
  "crossref-commons",
  # Spec 005 librarian agent — PDF text extraction for ≥10% PDF-sample audit (Q2)
  "pypdf>=4",
  # Paper-stage
  "matplotlib",
  "seaborn",
  "numpy",
  "scipy",
  "pandas",
  # Spec 018 (computational claim verification): safe symbolic evaluation of
  # arithmetic / comparisons / unit conversions / algebraic identities / logic.
  "sympy",
  # scripts/extract_paper_content.py uses it indirectly via regex but
  # pylatexenc is the canonical pure-python LaTeX parser used as a
  # fallback for future structured walks (e.g. AST-aware citation
  # rewrites). Pin to a stable major.
  "pylatexenc>=2.10",
  # Spec 009 (quality fixes): PDF auditor + activity feed + deterministic parsing
  "pdfplumber>=0.11",
  "markdown-it-py>=3",
  "python-ulid>=2",
  # Spec 010 (PDF audit pixel-level checks): page rasterization for figure-width
  # measurement. Requires system `poppler` (poppler-utils on Linux, brew install
  # poppler on macOS).
  "pdf2image>=1.17",
  # Data-source discovery (librarian/data_source_discovery.py): DuckDuckGo web
  # search to seed candidate data sources before LLM proposal + hard verify.
  "ddgs",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.0",
]
# Spec 026 (#10): the local transformers fallback backend. A dedicated CI lane
# installs this and runs `tests/real_call/test_model_selection_local_real.py`
# (marked `local`) with NO importorskip — an absent transformers is a FAILURE in
# that lane, not a skip, so the composite snapshot's local component is proven by a
# real model load + call (not merely asserted present).
local = [
  "transformers>=4.44",
  "torch>=2.2",
]
dev = [
  "pytest>=8",
  "pytest-asyncio",
  "ruff",
  "mypy",
  "types-PyYAML",
]

[project.scripts]
llmxive = "llmxive.cli:main"
llmxive-audit = "llmxive.audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llmxive*"]

[tool.setuptools.package-data]
llmxive = ["py.typed"]

[tool.pytest.ini_options]
markers = [
  "slow: heavy modules; the per-PR gate runs `-m 'not slow'`, nightly runs all",
  "local: spec 026 dedicated local-backend real-call lane (needs the [local] extra)",
]
