name: llmXive Reliability Run (full pipeline, on demand)

# One full-pipeline acceptance run (tests/real_call/test_pipeline_acceptance.py),
# so a reliability run does not need a developer machine to stay awake.
# Dispatch-only: there is no schedule and no pull_request trigger. The funded
# (Hugging Face) path pushes refs/llmxive/funded-ledger, so the job holds a
# contents:write token and, like every write job, runs only from main.

on:
  workflow_dispatch:
    inputs:
      fresh:
        description: Start a new project instead of continuing the previous run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: llmxive-reliability-run
  cancel-in-progress: false

jobs:
  reliability-run:
    runs-on: ubuntu-latest
    # GitHub's job limit is 6 hours. The acceptance step sets its own budget and
    # a shorter step timeout, so the evidence upload still runs if a step overruns.
    timeout-minutes: 360
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read  # download the previous run's evidence
    env:
      LLMXIVE_REAL_TESTS: "1"
      LLMXIVE_E2E_FULL: "1"
      DARTMOUTH_CHAT_API_KEY: ${{ secrets.DARTMOUTH_CHAT_API_KEY }}
      DARTMOUTH_API_KEY: ${{ secrets.DARTMOUTH_API_KEY }}
      LLMXIVE_HF_BILL_TO: ${{ secrets.LLMXIVE_HF_BILL_TO }}
      LLMXIVE_FUNDED_LEDGER_ANCHOR: ${{ vars.LLMXIVE_FUNDED_LEDGER_ANCHOR }}
      LLMXIVE_RECEIPT_KEY: ${{ secrets.LLMXIVE_RECEIPT_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and dev deps
        run: pip install -e ".[dev]"

      # The paper stages compile with lualatex + bibtex (same toolchain as the
      # nightly full suite).
      - name: Install TeX Live (lualatex + bibtex) for paper compiles
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-science \
            texlive-bibtex-extra texlive-pictures texlive-plain-generic \
            texlive-lang-english fonts-noto-core
          lualatex --version | head -1
          bibtex --version | head -1

      - name: Install llmXive house fonts
        run: |
          mkdir -p "$HOME/.fonts"
          cp papers/.style/fonts/*.ttf "$HOME/.fonts/"
          fc-cache -f >/dev/null

      # The acceptance test works in a fresh `git init` repository with no `origin`,
      # so both steps below name the ledger remote and give git a credential helper
      # that reads the job token from the environment (never from a URL).
      # Without them every funded call is refused and the run idles to its budget.
      - name: Funded path preflight
        env:
          LLMXIVE_FUNDED_LEDGER_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          LLMXIVE_LEDGER_GIT_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: >-
            !f() { test "$1" = get && printf 'username=x-access-token\npassword=%s\n' "$LLMXIVE_LEDGER_GIT_TOKEN"; }; f
        run: python scripts/ci/funded_preflight.py

      # `runner` is not available in a job-level env block, only in steps.
      # One run may not finish the pipeline; the next continues from the evidence
      # the last one saved (unless that run ended accepted, or `fresh` is set).
      - name: Restore the previous run's evidence
        if: ${{ !inputs.fresh }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dest="$RUNNER_TEMP/llmxive-resume"
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow llmxive-reliability-run.yml \
                        --status completed --limit 10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n reliability-run-acceptance -D "$dest" 2>/dev/null \
                && [ -d "$dest/projects" ] && [ -d "$dest/state/projects" ]; then
              echo "continuing from run $id"
              echo "LLMXIVE_ACCEPTANCE_RESUME_FROM=$dest" >> "$GITHUB_ENV"
              exit 0
            fi
            rm -rf "$dest"
          done
          echo "no earlier evidence found; starting a new project"

      # The budget (5.5 hours) is checked between pipeline steps, so the step
      # timeout allows one more step after it is spent.
      - name: Full-pipeline acceptance run
        timeout-minutes: 345
        env:
          LLMXIVE_ACCEPTANCE_BUDGET_S: "19800"
          LLMXIVE_ACCEPTANCE_ARTIFACTS: ${{ runner.temp }}/llmxive-acceptance
          LLMXIVE_FUNDED_LEDGER_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          LLMXIVE_LEDGER_GIT_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: >-
            !f() { test "$1" = get && printf 'username=x-access-token\npassword=%s\n' "$LLMXIVE_LEDGER_GIT_TOKEN"; }; f
        run: pytest tests/real_call/test_pipeline_acceptance.py -x -s -p no:cacheprovider

      - name: Preserve research, paper and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-run-acceptance
          path: ${{ runner.temp }}/llmxive-acceptance
          if-no-files-found: ignore
          retention-days: 30
