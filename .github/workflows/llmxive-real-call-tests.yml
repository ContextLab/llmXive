name: llmXive Real-Call Tests

# Always emit the final gate, including documentation-only PRs. Workflow-level
# path filters can leave required checks pending forever.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      offline: ${{ steps.select.outputs.offline }}
      live: ${{ steps.select.outputs.live }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ci/
      - name: List all changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/changed-files.json"
          else
            printf '[[]]\n' > "$RUNNER_TEMP/changed-files.json"
          fi
      - name: Select required coverage
        id: select
        run: python scripts/ci/select_checks.py "$RUNNER_TEMP/changed-files.json"

  offline:
    name: Offline contracts and unit tests
    needs: changes
    if: needs.changes.outputs.offline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLMXIVE_REAL_TESTS: ""
      DARTMOUTH_CHAT_API_KEY: ""
    steps:
      - uses: actions/checkout@v5
        with:
          # PR merge SHA stays the default. Non-cone mode excludes large root
          # datasets too; cone mode implicitly includes every root file.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.specify/
            /.style/
            /src/
            /tests/
            /agents/
            /contracts/
            /scripts/
            /specs/
            /papers/
            /projects/PROJ-565-edit-compass-editreward-compass-a-unifie/paper/
            /web/
            /docs/css/
            /docs/js/
            /docs/data/
            /docs/index.html
            /notes/
            /*.md
            /*.toml
            /*.ini
            /LICENSE
      - name: Fetch the unchanged real-PDF audit sample
        run: python scripts/ci/prepare_test_checkout.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and dev deps
        run: pip install -e ".[dev]"
      - name: Install TeX Live (lualatex + bibtex) for paper compiles
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-science \
            texlive-bibtex-extra texlive-pictures texlive-plain-generic \
            texlive-lang-english fonts-noto-core \
            poppler-utils
          lualatex --version | head -1
          bibtex --version | head -1
          pdftotext -v 2>&1 | head -1   # poppler, for the pdf_auditor unit tests

      # Install the house fonts (Fraunces serif + JetBrains Mono) so
      # fontspec resolves them and the real-call compile renders the true
      # llmXive style. The class falls back to TeX Gyre Pagella / Inconsolata
      # via \IfFontExistsTF when these are absent, but the published PDF
      # should match production.
      - name: Install llmXive house fonts
        run: |
          mkdir -p "$HOME/.fonts"
          cp papers/.style/fonts/*.ttf "$HOME/.fonts/"
          fc-cache -f >/dev/null
          fc-list | grep -iE "fraunces|jetbrains" | head || \
            echo "WARN: house fonts not registered (class will fall back)"

      - name: Prompt existence check
        run: python -m llmxive.checks.prompts
      - name: Spec Kit script executability check
        run: python -m llmxive.checks.speckit_scripts
      - name: State-artifact reader check
        run: python -m llmxive.checks.state_readers
      - name: Contract tests
        run: pytest tests/contract -v
      - name: Full fast offline unit suite
        run: pytest tests/unit -q -m "not slow" --durations=25

  dartmouth:
    name: Dartmouth live models
    needs: changes
    if: needs.changes.outputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LLMXIVE_REAL_TESTS: "1"
      LLMXIVE_PAID_OPT_IN: "0"
      DARTMOUTH_CHAT_API_KEY: ${{ secrets.DARTMOUTH_CHAT_API_KEY }}
      DARTMOUTH_API_KEY: ${{ secrets.DARTMOUTH_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZENODO_API_TOKEN: ${{ secrets.ZENODO_API_TOKEN }}
      ZENODO_SANDBOX_API_TOKEN: ${{ secrets.ZENODO_SANDBOX_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # PR merge SHA stays the default. Non-cone mode excludes large root
          # datasets too; cone mode implicitly includes every root file.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.specify/
            /.style/
            /src/
            /tests/
            /agents/
            /contracts/
            /scripts/
            /specs/
            /papers/
            /projects/PROJ-565-edit-compass-editreward-compass-a-unifie/paper/
            /web/
            /docs/css/
            /docs/js/
            /docs/data/
            /docs/index.html
            /notes/
            /*.md
            /*.toml
            /*.ini
            /LICENSE
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and dev deps
        run: pip install -e ".[dev]"
      # No TeX installation: all compile-dependent live modules remain in the
      # unchanged nightly full suite. Offline PDF tests have their own toolchain.
      - name: Backend reachability check
        run: python -m llmxive.checks.backends
      - name: All existing fast real-call tests
        run: pytest tests/real_call -v -m "not slow" --durations=25

  real-call:
    name: CI gate (offline + Dartmouth)
    needs: [changes, offline, dartmouth]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          jobs = json.loads(os.environ['NEEDS'])
          assert jobs['changes']['result'] == 'success', 'check selection failed'
          for job, flag in [('offline', 'offline'), ('dartmouth', 'live')]:
              required = jobs['changes']['outputs'][flag] == 'true'
              actual = jobs[job]['result']
              expected = 'success' if required else 'skipped'
              assert actual == expected, f'{job}: expected {expected}, got {actual}'
              print(f'{job}: {actual}' + ('' if required else ' (unchanged behavior)'))
          PY
