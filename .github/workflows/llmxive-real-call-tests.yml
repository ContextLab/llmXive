name: llmXive Real-Call Tests

# Always emit the final gate, including documentation-only PRs. Workflow-level
# path filters can leave required checks pending forever.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      offline: ${{ steps.select.outputs.offline }}
      live: ${{ steps.select.outputs.live }}
      references: ${{ steps.select.outputs.references }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/
            /src/
      - name: List all changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/changed-files.json"
          else
            printf '[[]]\n' > "$RUNNER_TEMP/changed-files.json"
          fi
      - name: Select required coverage
        id: select
        run: python scripts/ci/select_checks.py "$RUNNER_TEMP/changed-files.json"

  offline:
    name: Offline contracts and unit tests
    needs: changes
    if: needs.changes.outputs.offline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLMXIVE_REAL_TESTS: ""
      DARTMOUTH_CHAT_API_KEY: ""
    steps:
      - uses: actions/checkout@v5
        with:
          # PR merge SHA stays the default. Non-cone mode excludes large root
          # datasets too; cone mode implicitly includes every root file.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.specify/
            /.style/
            /src/
            /tests/
            /agents/
            /eval/promptfoo/
            /contracts/
            /scripts/
            /specs/
            /papers/
            /projects/PROJ-565-edit-compass-editreward-compass-a-unifie/paper/
            /web/
            /docs/css/
            /docs/js/
            /docs/data/
            /docs/index.html
            /notes/
            /*.md
            /*.toml
            /*.ini
            /LICENSE
      - name: Fetch real-PDF and project-template regression inputs
        run: python scripts/ci/prepare_test_checkout.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and dev deps
        run: pip install -e ".[dev]"
      # Fast PDF tests inspect existing PDFs using Poppler. Real TeX compilation
      # is marked slow and is exercised by the nightly job.
      - name: Install PDF audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v 2>&1 | head -1

      - name: Lint (ruff)
        # No workflow ran ruff until now, and the repository had accumulated 96
        # errors across src/ and tests/ while every agent linted only its own
        # changed files by hand. Runs FIRST: it costs seconds, where the suites
        # below cost minutes.
        run: ruff check src tests scripts eval
      - name: Prompt existence check
        run: python -m llmxive.checks.prompts
      - name: Spec Kit script executability check
        run: python -m llmxive.checks.speckit_scripts
      - name: State-artifact reader check
        run: python -m llmxive.checks.state_readers
      - name: Contract tests
        run: pytest tests/contract -v
      - name: Full fast offline unit suite
        run: pytest tests/unit -q -m "not slow" --durations=25

  integration:
    name: Offline integration tests
    needs: changes
    if: needs.changes.outputs.offline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLMXIVE_REAL_TESTS: ""
      DARTMOUTH_CHAT_API_KEY: ""
    steps:
      # tests/integration was run by NO workflow. That is how the SC-008 README
      # regression from #1545 survived: nothing executed the test that asserts
      # it. It gets its own job rather than joining `offline`, because it needs
      # two paths that job deliberately omits -- /.claude/ (144K) and
      # /projects/*/specs/ (61M) -- and loading them into the fast gate would
      # undo the checkout trimming of #1557.
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.claude/
            /.specify/
            /.style/
            /src/
            /tests/
            /agents/
            /eval/promptfoo/
            /contracts/
            /scripts/
            /specs/
            /papers/
            /web/
            /docs/css/
            /docs/js/
            /docs/data/
            /docs/index.html
            /notes/
            /projects/*/specs/
            # test_proj552_template_copies_match_shared reads a project's OWN
            # copy of the Spec Kit templates, which the offline job gets from
            # scripts/ci/prepare_test_checkout.py. This job needs the templates
            # but not the PDF sample, so it takes the paths directly.
            /projects/*/.specify/templates/
            /*.md
            /*.toml
            /*.ini
            /LICENSE
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and dev deps
        run: pip install -e ".[dev]"
      - name: Offline integration suite
        run: pytest tests/integration -q -m "not slow" --durations=25

  dartmouth:
    name: Dartmouth live models
    needs: changes
    if: needs.changes.outputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LLMXIVE_REAL_TESTS: "1"
      LLMXIVE_PAID_OPT_IN: "0"
      DARTMOUTH_CHAT_API_KEY: ${{ secrets.DARTMOUTH_CHAT_API_KEY }}
      DARTMOUTH_API_KEY: ${{ secrets.DARTMOUTH_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZENODO_API_TOKEN: ${{ secrets.ZENODO_API_TOKEN }}
      ZENODO_SANDBOX_API_TOKEN: ${{ secrets.ZENODO_SANDBOX_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # PR merge SHA stays the default. Non-cone mode excludes large root
          # datasets too; cone mode implicitly includes every root file.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.specify/
            /.style/
            /src/
            /tests/
            /agents/
            /eval/promptfoo/
            /contracts/
            /scripts/
            /specs/
            /papers/
            /projects/PROJ-565-edit-compass-editreward-compass-a-unifie/paper/
            /web/
            /docs/css/
            /docs/js/
            /docs/data/
            /docs/index.html
            /notes/
            /*.md
            /*.toml
            /*.ini
            /LICENSE
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and dev deps
        run: pip install -e ".[dev]"
      # No TeX installation: all compile-dependent live modules remain in the
      # unchanged nightly full suite. Offline PDF tests have their own toolchain.
      - name: Backend reachability check
        run: python -m llmxive.checks.backends
      # Two contract tests make live source calls and are gated by this env.
      # Keep them here as well as the deterministic contract pass above.
      - name: Contracts including live source channels
        run: pytest tests/contract -v
      - name: Fast runtime real-call tests
        run: pytest tests/real_call -v -m "not slow and not external_references" --durations=25

  references:
    name: External reference and dataset services
    needs: changes
    if: needs.changes.outputs.references == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLMXIVE_REAL_TESTS: "1"
      LLMXIVE_PAID_OPT_IN: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          # PR merge SHA stays the default. Non-cone mode excludes large root
          # datasets too; cone mode implicitly includes every root file.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.specify/
            /.style/
            /src/
            /tests/
            /agents/
            /eval/promptfoo/
            /contracts/
            /scripts/
            /specs/
            /papers/
            /projects/PROJ-565-edit-compass-editreward-compass-a-unifie/paper/
            /web/
            /docs/css/
            /docs/js/
            /docs/data/
            /docs/index.html
            /notes/
            /*.md
            /*.toml
            /*.ini
            /LICENSE
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and dev deps
        run: pip install -e ".[dev]"
      # Exact existing assertions; registrar outages still fail this selected gate.
      - name: Live external reference resolution
        run: pytest tests/real_call -v -m "not slow and external_references" --durations=25

  real-call:
    name: CI gate (offline + Dartmouth)
    needs: [changes, offline, integration, dartmouth, references]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          jobs = json.loads(os.environ['NEEDS'])
          assert jobs['changes']['result'] == 'success', 'check selection failed'
          # `integration` is gated on the same `offline` selector output as the
          # offline job: it must SUCCEED whenever offline code changed, and skip
          # otherwise. Without it in `needs` the job would run and report but
          # never block a merge, which is how an unrun suite stays unrun.
          for job, flag in [('offline', 'offline'), ('integration', 'offline'),
                            ('dartmouth', 'live'), ('references', 'references')]:
              required = jobs['changes']['outputs'][flag] == 'true'
              actual = jobs[job]['result']
              expected = 'success' if required else 'skipped'
              assert actual == expected, f'{job}: expected {expected}, got {actual}'
              print(f'{job}: {actual}' + ('' if required else ' (unchanged behavior)'))
          PY
